<g font-size="15" font-weight="bold"><text x="68"  y="58" text-anchor="middle" fill="#595959">1 Preview</text>
<text x="238" y="58" text-anchor="middle" fill="#1F3864">2 Reading + task</text>
<text x="428" y="58" text-anchor="middle" fill="#0F6E6E">3 Listening + task</text>
<text x="580" y="58" text-anchor="middle" fill="#1F3864">4 Elicit</text>
<text x="728" y="58" text-anchor="middle" fill="#C55A11">5 Pair role-play</text>
