<g font-size="13" fill="#595959"><text x="68" y="78" text-anchor="middle">teacher</text><text x="68" y="94" text-anchor="middle">2 min</text>
<text x="238" y="78" text-anchor="middle">whole class</text><text x="238" y="94" text-anchor="middle">7 min</text>
<text x="428" y="78" text-anchor="middle">whole class</text><text x="428" y="94" text-anchor="middle">6 min</text>
