<svg xmlns="http://www.w3.org/2000/svg" width="980" height="138" viewBox="0 0 980 138">
<rect width="980" height="138" fill="#fff"/><g font-family="Calibri,Arial">
<text x="490" y="18" text-anchor="middle" fill="#1F3864" font-size="16" font-weight="bold">ONE CYCLE · 31 MINUTES · repeated three times a session</text>
<rect x="4"   y="30" width="104" height="78" rx="8" fill="#F2F2F2" stroke="#595959" stroke-width="2"/>
<rect x="116" y="30" width="196" height="78" rx="8" fill="#FFFFFF" stroke="#1F3864" stroke-width="2"/>
<rect x="320" y="30" width="188" height="78" rx="8" fill="#E2F0EF" stroke="#0F6E6E" stroke-width="2"/>
<rect x="516" y="30" width="96"  height="78" rx="8" fill="#DEEAF6" stroke="#1F3864" stroke-width="2"/>
<rect x="620" y="30" width="156" height="78" rx="8" fill="#FBE5D6" stroke="#C55A11" stroke-width="2"/>
<rect x="784" y="30" width="192" height="78" rx="8" fill="#FFF2CC" stroke="#C55A11" stroke-width="2"/>
<g font-size="14" font-weight="bold"><text x="56"  y="56" text-anchor="middle" fill="#595959">1 Preview</text>
<text x="214" y="56" text-anchor="middle" fill="#1F3864">2 Reading + 3 tasks</text>
<text x="414" y="56" text-anchor="middle" fill="#0F6E6E">3 Listening + 3 tasks</text>
<text x="564" y="56" text-anchor="middle" fill="#1F3864">4 Elicit</text>
<text x="698" y="56" text-anchor="middle" fill="#C55A11">5 Pair role-play</text>
<text x="880" y="56" text-anchor="middle" fill="#C55A11">6 Gapped model + report</text></g>
<g font-size="12" fill="#595959"><text x="56" y="76" text-anchor="middle">teacher</text><text x="56" y="92" text-anchor="middle">2 min</text>
<text x="214" y="76" text-anchor="middle">read 1.5 · tasks 7</text><text x="214" y="92" text-anchor="middle">8.5 min</text>
<text x="414" y="76" text-anchor="middle">3 plays · a task per play</text><text x="414" y="92" text-anchor="middle">7.5 min</text>
<text x="564" y="76" text-anchor="middle">learners</text><text x="564" y="92" text-anchor="middle">2 min</text>
<text x="698" y="76" text-anchor="middle">then swap roles</text><text x="698" y="92" text-anchor="middle">5 min</text>
<text x="880" y="76" text-anchor="middle">complete · start own · report</text><text x="880" y="92" text-anchor="middle">6 min</text></g>
<text x="490" y="128" text-anchor="middle" fill="#C55A11" font-size="13">3 cycles (93) + case study (22) + opening (3) + close (2) = 120 minutes</text>
</g></svg>
