field: SOC
level: 1
passages:
  - id: SOC-S01-L1
    strand: S01
    title: "Forbid, Allow and Twenty Points"
    move: phenomenon
    sat_frame: "social study: design and inference"
    builds_on: null
    advances: "Gives one documented case in which two wordings of the same question produced different answers."
    vocab_link: [influences]
    passage: |
      In 1940 an American researcher named Donald Rugg ran a simple test on
      question wording. He had two versions of one question about free speech.
      One asked whether the United States should forbid public speeches against
      democracy. The other asked whether the United States should allow such
      speeches. Logically these are the same question. A person who wants to
      forbid something does not want to allow it. The two versions went to two
      matched groups of people in the same survey.

      The answers did not match. About fifty-four percent said yes to
      forbidding. About seventy-five percent said no to allowing. Those two
      figures describe different publics, and the gap is roughly twenty points.
      The study has been repeated many times since, in several countries, with
      the same result. People are more willing to refuse permission than to
      impose a ban, even when the practical effect is identical. The word forbid is heavier than the phrase not allow, and respondents, meaning the people who answer a survey, hear the weight.

      That is one of a family of effects that pollsters have to manage. The
      order of the items changes answers. A question about national problems
      placed after a question about crime produces more mentions of crime.
      Offering a middle option pulls perhaps a fifth of respondents out of the
      two sides. Asking about aid to the poor gets warmer answers than asking
      about welfare, though the programs named are the same ones. None of this
      means that surveys are useless. It means that a number from a survey is a
      number about a particular form of words, and that the wording influences
      the result as much as the subject does. A reader who is given a percentage without the question is not being given much. Good polling organizations publish the exact wording alongside the figure for this reason.
    anchors:
      - take: "Two logically identical wordings gave answers twenty points apart."
        quote: "the gap is roughly twenty points"
      - take: "People refuse permission more readily than they impose a ban."
        quote: "more willing to refuse permission than to impose a ban"
      - take: "A survey figure is a figure about one particular form of words."
        quote: "a number about a particular form of words"
    terms:
      - {term: "respondents", gloss: "the people who answer a survey", glossed: true}
    facts:
      - "Donald Rugg tested forbid and allow wordings on free speech around 1940."
      - "About 54 percent would forbid speeches while about 75 percent would not allow them."
      - "The effect has been reproduced in later surveys in several countries."
  - id: SOC-S02-L1
    strand: S02
    title: "Thirteen Children or Twenty-Five"
    move: phenomenon
    sat_frame: "social study: design and inference"
    builds_on: null
    advances: "Describes one large experiment with real random assignment, giving its size and result."
    vocab_link: [compare]
    passage: |
      Tennessee ran an unusual experiment in its schools between 1985 and 1989. It is still known by the name Project STAR.
      The state wanted to know whether small classes help young children.
      Earlier studies had compared schools that happened to have small classes
      with schools that did not, and those comparisons were hard to trust. Small
      classes are common in rich districts and in schools with spare rooms. Any
      difference in results might come from the wealth or the building rather
      than the class size.

      So the state assigned children by lot. About eleven thousand six hundred
      pupils in seventy-nine schools entered the study in kindergarten. Within
      each school, children were put at random into a small class of thirteen to
      seventeen, or into a regular class of twenty-two to twenty-five, or into a
      regular class with a teacher's aide. Teachers were assigned by lot as
      well. The children stayed in their assigned kind of class for up to four
      years and were tested each year. The design is called a randomized trial.

      The small classes did better. The gap was clearest in the first two years
      and in reading, and it was larger for children from poorer families. The
      effect did not vanish when the children returned to ordinary classes, and
      some of it could still be found years later in high school test taking.
      The experiment also cost a great deal, because small classes need more
      teachers and more rooms, and that cost is the reason the policy argument
      continued after the result was in. Tennessee published the data, and economists including Alan Krueger reanalyzed it for years afterward. What the lot made possible was a fair comparison. Nothing except the class size distinguished the two groups at
      the start.
    anchors:
      - take: "Children and teachers were assigned to class sizes by lot."
        quote: "the state assigned children by lot"
      - take: "About 11,600 pupils in 79 schools took part from kindergarten."
        quote: "About eleven thousand six hundred pupils in seventy-nine schools"
      - take: "The lot is what made the comparison fair."
        quote: "Nothing except the class size distinguished the two groups at the start."
    terms:
      - {term: "randomized trial", gloss: "a study in which the groups are formed by lot", glossed: true}
    facts:
      - "Tennessee ran the Project STAR class-size experiment from 1985 to 1989."
      - "About 11,600 pupils in 79 schools were randomly assigned to small or regular classes."
      - "Small classes produced better results, with the largest gains among poorer children."
  - id: SOC-S03-L1
    strand: S03
    title: "Chocolate and the Nobel Prize"
    move: phenomenon
    sat_frame: "data commentary: a figure described in words"
    builds_on: null
    advances: "Takes one real published correlation that nobody believes is causal, as the concrete starting case."
    vocab_link: [assume]
    passage: |
      In 2012 a Swiss physician named Franz Messerli published a short paper in
      a well-known medical journal. He had plotted two figures for twenty-three
      countries. On one axis was the amount of chocolate eaten per person each
      year. On the other was the number of Nobel prizes won per million people.
      The points lined up remarkably well. Switzerland sat at the top on both
      measures. China sat near the bottom on both. The relationship was strong
      enough that a statistician would call it a tight fit.

      Messerli was making a joke with a serious point, and he said so in the
      paper. Nobody thinks that eating chocolate produces scientists. Several
      other explanations are available at once. Rich countries eat more
      chocolate and also fund more laboratories, so national wealth could
      produce both figures without either touching the other. The measures are
      also crude. Prizes are awarded to people who did their work decades earlier, often in a different country from the one that claims them. A country of two million people needs only one laureate, meaning one person awarded the prize, to lead the table.

      The paper is now used in teaching, which was not quite its purpose. It is
      a clean case of a pattern that is real, strong, measurable and useless as
      a guide to action. Two figures can rise together because one causes the
      other, because the second causes the first, because a third thing causes
      both, or because a small sample has fallen out that way. A reader who sees two lines moving together and does not ask which of those four is in play will assume the first. That reader will be wrong most of the time. The habit of asking is most of what a course in statistics is for.
    anchors:
      - take: "A real published paper found a tight fit between chocolate and Nobel prizes."
        quote: "The points lined up remarkably well."
      - take: "National wealth could produce both figures without either touching the other."
        quote: "national wealth could produce both figures"
      - take: "Two figures can move together for four quite different reasons."
        quote: "because a third thing causes both"
    terms:
      - {term: "laureate", gloss: "a person awarded the prize", glossed: true}
    facts:
      - "Franz Messerli published the chocolate and Nobel prize correlation in 2012."
      - "The comparison covered twenty-three countries, with Switzerland highest on both measures."
      - "Prizes are often awarded decades after the work and in a different country."
  - id: SOC-S04-L1
    strand: S04
    title: "The Street With One Rich Man"
    move: phenomenon
    sat_frame: "data commentary: a figure described in words"
    builds_on: null
    advances: "Shows with one worked case how an average can describe a group that contains nobody like it."
    vocab_link: [trend]
    passage: |
      Nine households on a street each have an income of forty thousand dollars
      a year. The tenth household has an income of four million. The mean income
      on the street is four hundred and four thousand dollars. That figure is
      correct and it describes nobody. Nine of the ten families are nowhere near
      it, and the tenth is ten times above it. The middle household, which is the median, meaning the middle value when the cases are put in order, earns forty thousand dollars like its eight neighbors.

      Real national figures behave in the same way for the same reason. In the
      United States the mean household income runs well above the median, by
      something like a third, because incomes have no upper limit and do have a
      lower one. A small number of very large incomes pull the mean up and
      cannot pull the median anywhere, since the median only asks which
      household stands in the middle of the line. Any measure that sums and
      divides is sensitive to the largest values in the set. Any measure that
      counts positions is not.

      Which figure a writer chooses therefore decides what the sentence says. A
      report that uses the mean can describe a decade in which almost every
      household lost ground as a decade of rising incomes, provided the top of
      the distribution rose enough. A report that uses the median will show the
      opposite trend from the same raw data, and neither report is lying. The
      responsible practice is to give both, along with some measure of the
      spread. When only one is offered, the useful question is which one, and the second useful question is why that one was chosen. Government statistical offices publish both as a matter of routine. Newspapers usually print whichever supports the sentence already written.
    anchors:
      - take: "A mean can be correct and describe nobody in the group."
        quote: "That figure is correct and it describes nobody."
      - take: "The median asks which household stands in the middle."
        quote: "which household stands in the middle of the line"
      - take: "Mean and median can show opposite trends from the same data."
        quote: "will show the opposite trend from the same raw data"
    terms:
      - {term: "median", gloss: "the middle value when the cases are put in order", glossed: true}
    facts:
      - "A street of nine households at $40,000 and one at $4 million has a mean of $404,000."
      - "In the United States mean household income runs well above the median."
      - "The median is unaffected by how large the largest values are."
  - id: SOC-S05-L1
    strand: S05
    title: "Parking by the Hour in San Francisco"
    move: phenomenon
    sat_frame: "social study: design and inference"
    builds_on: null
    advances: "Records one city policy that changed behavior by price, with the mechanism and the numbers it used."
    vocab_link: [reward]
    passage: |
      San Francisco began an experiment with parking meters in 2011. The problem
      was not a shortage of spaces. It was that drivers circled looking for one,
      which filled the streets with slow traffic. Studies in several cities had
      found that a substantial share of downtown traffic at some hours was made
      up of cars hunting for a space rather than going anywhere. The city
      decided to attack the hunting rather than build more parking.

      The method was price. Meters in the test districts were fitted with sensors, which are devices that reported whether the space was occupied. Rates were then
      adjusted block by block and hour by hour, with a target of leaving about
      one space free on every block. Where a block was always full, the price
      went up by twenty-five cents an hour at the next review. Where a block was
      often empty, the price came down. Rates ended up ranging from twenty-five
      cents to six dollars an hour, and on many blocks at many hours they fell
      rather than rose.

      The city reported that the time spent searching for a space dropped by
      about forty percent in the test areas. Average rates in those areas went
      down, which surprised people who had expected a revenue grab. The policy
      works by paying attention to the one thing a driver cannot ignore, and by
      letting the price reward whoever is willing to walk two blocks. A campaign
      asking drivers to circle less would have cost less and done nothing.
      Several cities have since copied the design. The main obstacle everywhere has been political rather than technical. A price that moves is easy to attack and hard to defend in one sentence. Los Angeles, Seattle and Calgary now run versions of the same scheme.
    anchors:
      - take: "Much downtown traffic was cars hunting for a space."
        quote: "cars hunting for a space rather than going anywhere"
      - take: "Rates were adjusted block by block toward one free space per block."
        quote: "a target of leaving about one space free on every block"
      - take: "Search time fell by about forty percent and average rates fell too."
        quote: "dropped by about forty percent in the test areas"
    terms:
      - {term: "sensors", gloss: "devices that reported whether the space was occupied", glossed: true}
    facts:
      - "San Francisco began demand-based parking pricing in 2011."
      - "Rates were adjusted block by block, ranging from 25 cents to six dollars an hour."
      - "The city reported that search time fell about forty percent and average rates fell."
  - id: SOC-S06-L1
    strand: S06
    title: "The Card in the Hotel Bathroom"
    move: phenomenon
    sat_frame: "social study: design and inference"
    builds_on: null
    advances: "Uses one field experiment on signs to show that a statement about other people changes behavior."
    vocab_link: [behave]
    passage: |
      Hotels put cards in bathrooms asking guests to use their towels more than
      once. In 2008 three researchers, led by Noah Goldstein, tested what those cards should say. They
      ran the test in a real hotel, across several hundred rooms, over several
      months. Housekeeping staff recorded whether the towels in each room had
      been hung up for reuse. The guests did not know that anything was being
      measured. That is what makes the study a field experiment, meaning a trial run in a real setting rather than a laboratory.

      One version of the card made the usual environmental appeal and asked
      guests to help save the environment. Another version reported a plain fact
      about other guests, saying that most people who stay in the hotel reuse
      their towels. A third named the room: most guests who have stayed in this
      room have reused their towels. The cards were otherwise identical and were
      assigned to rooms at random. Reuse rose by roughly a quarter with the
      second card compared with the first. The version naming the room did
      better still.

      The finding has been reproduced in other settings, including electricity
      use and tax letters, and it has limits that later passages in this strand
      will take up. What it shows is modest and useful. A statement about what
      other people actually do is a stronger lever than an appeal to a value,
      and it costs the same to print. People behave partly by reading the room,
      and a sentence that tells them what the room is doing will be acted on by
      some of them. Nobody in the hotel was arguing about the environment. They were deciding, in about four seconds, what a normal guest does with a towel. The hotel saved laundry costs, which is why it agreed to the study.
    anchors:
      - take: "Housekeeping recorded towel reuse without the guests knowing."
        quote: "The guests did not know that anything was being measured."
      - take: "A card reporting what other guests do beat an environmental appeal."
        quote: "Reuse rose by roughly a quarter"
      - take: "A statement about what others do is a stronger lever than an appeal to a value."
        quote: "a stronger lever than an appeal to a value"
    terms:
      - {term: "field experiment", gloss: "a trial run in a real setting rather than a laboratory", glossed: true}
    facts:
      - "The hotel towel experiment was published in 2008."
      - "Cards reporting that most guests reuse towels raised reuse by roughly a quarter."
      - "A card naming the specific room performed better still."
  - id: SOC-S07-L1
    strand: S07
    title: "Houses That Followed the Streetcar"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Traces one concrete case of transport changing where people live, with dates and distances."
    vocab_link: [prefer]
    passage: |
      Before 1850 most people in Boston lived within walking distance of their
      work. The built-up city was about two miles across. A clerk who had to be
      at a counting house by eight walked there, and a city therefore could not
      be much wider than an hour on foot. Rich and poor lived close together,
      often in the same street, because nobody could afford the time to live far
      out.

      Then came the omnibus, which is a large horse-drawn carriage running a fixed route, and the steam railway, and from 1889 the electric streetcar. A streetcar held forty people and ran at about eight
      miles an hour, which put land four or five miles out within reach of a
      downtown office. Builders bought fields along the new lines. They put up houses in rows. Between 1870 and 1900 Boston spread from a two-mile city
      to a ten-mile one. The historian Sam Bass Warner counted twenty-three
      thousand houses built in three suburbs in those thirty years, almost all
      of them by small builders putting up a handful at a time.

      Who moved out was decided by the fare. A ride cost five cents each way. That was real money for a laborer earning a dollar and a half a day. It was nothing to a clerk earning three. Those who could pay it moved to new
      wooden houses with gardens, and those who could not stayed in the center.
      The new districts sorted themselves by income along each line. A pattern
      of this kind is not a matter of taste alone. People prefer space when they can buy the travel time, and the price of the travel decides who is allowed to prefer it. The same sorting happened later with the automobile, at a larger scale and a higher price.
    anchors:
      - take: "A walking city could not be much wider than an hour on foot."
        quote: "could not be much wider than an hour on foot"
      - take: "The electric streetcar from 1889 put land four or five miles out in reach."
        quote: "within reach of a downtown office"
      - take: "The five-cent fare decided who could move out."
        quote: "Who moved out was decided by the fare."
    terms:
      - {term: "omnibus", gloss: "a large horse-drawn carriage running a fixed route", glossed: true}
    facts:
      - "Boston was about two miles across before the 1850s and about ten miles across by 1900."
      - "The electric streetcar arrived in Boston in 1889 and ran at about eight miles an hour."
      - "A streetcar fare of five cents each way was significant for a laborer and trivial for a clerk."
  - id: SOC-S08-L1
    strand: S08
    title: "Hired by the Half Day"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Describes one labor market in its actual daily operation, before wages are explained by supply and demand."
    vocab_link: [benefit]
    passage: |
      At the London docks in the 1880s men were hired twice a day. A foreman
      came to a gate at about half past seven, and again after noon, and chose
      from the crowd that had gathered. The crowd was always larger than the
      number of jobs. Work lasted four hours and paid by the hour. A man who was
      not picked went home with nothing and came back for the afternoon call.
      Those who were picked might work two days that week or six, depending on
      how many ships were in.

      The system suited the dock companies exactly. Ship arrivals were
      irregular, and a company that employed a steady workforce would be paying
      men to stand about on quiet days. Casual hiring, meaning taking men on by the half day with no contract, moved that risk onto the workers. It also gave the foreman very great power, since he chose faces
      each morning and could be bought a drink the night before. The men who did
      best were not the strongest but the best known to the man at the gate.

      Hiring of that kind was normal across the whole port. In August 1889 the dockers struck for a guaranteed minimum call of four hours and a rate of sixpence an hour. The strike lasted five weeks, drew
      financial support from as far away as Australia, and largely won. The
      deeper arrangement took much longer to change. Casual hiring at the docks
      was not ended in Britain until 1967. The same practice ran in New York
      under the name of the shape-up into the 1950s. A market can be organized
      so that one side carries nearly all the uncertainty, and the side that benefits will usually describe the arrangement as flexibility. The word has not changed much since. Delivery work booked by the hour raises the same question in a new form.
    anchors:
      - take: "Men were chosen from a crowd at the gate twice a day."
        quote: "chose from the crowd that had gathered"
      - take: "Casual hiring moved the risk of irregular shipping onto the workers."
        quote: "moved that risk onto the workers"
      - take: "The 1889 strike won the four-hour call but casual hiring lasted much longer."
        quote: "was not ended in Britain until 1967"
    terms:
      - {term: "casual hiring", gloss: "taking men on by the half day with no contract", glossed: true}
    facts:
      - "London dockers were hired by the half day at gate calls in the 1880s."
      - "The 1889 dock strike lasted five weeks and sought sixpence an hour and a four-hour minimum."
      - "Casual hiring at British docks was abolished in 1967."
  - id: SOC-S09-L1
    strand: S09
    title: "Thirty Years Across One City"
    move: phenomenon
    sat_frame: "data commentary: a figure described in words"
    builds_on: null
    advances: "Presents one measured gap in life expectancy inside a single city, before the measurement is examined."
    vocab_link: [predict]
    passage: |
      Streeterville and Englewood are both neighborhoods of Chicago. They lie
      about nine miles apart and are served by the same city government, the
      same state laws and the same hospitals in principle. Life expectancy at birth means the average number of years a person born now is expected to live. In figures published in 2019 it was about ninety years in Streeterville.
      In Englewood it was about sixty. The gap is roughly thirty years, inside
      one city, between two places a short train ride apart.

      Nothing in those figures is about individual choices in any simple sense.
      The two areas differ in income and in the share of adults with work. They differ in the quality of housing and the number of grocery stores. They differ in air quality near the expressways and in the presence of violence. They differ in how far a resident must travel for unhurried medical care. They also differ in history. The boundaries follow lines drawn by lending maps and by covenants, which were clauses in deeds restricting who could buy a house. These things arrive together and
      are hard to separate.

      Figures of this kind are now published for most large American cities and
      for many European ones, usually by small area. Glasgow produced a famous example. The reported gap there was more than twenty years between two districts eight miles apart. The exact numbers move when the boundaries or the years change. Some early figures were later revised downward, which is a reason to read any single pair of numbers carefully. The
      pattern does not move. A postal code will predict the length of a life better than most facts about the person living there. Later passages in this strand ask what such a measure is actually measuring.
    anchors:
      - take: "Two Chicago neighborhoods nine miles apart differ by about thirty years."
        quote: "The gap is roughly thirty years"
      - take: "The differences arrive together and are hard to separate."
        quote: "These things arrive together and are hard to separate."
      - take: "A postal code predicts length of life better than most personal facts."
        quote: "will predict the length of a life better than most facts about the person"
    terms:
      - {term: "life expectancy", gloss: "the average number of years a person born now is expected to live", glossed: true}
      - {term: "covenants", gloss: "clauses in deeds restricting who could buy a house", glossed: true}
    facts:
      - "Figures published in 2019 gave life expectancy of about ninety years in Streeterville and about sixty in Englewood."
      - "The two Chicago neighborhoods lie about nine miles apart."
      - "Some early Glasgow figures for similar gaps were later revised downward."
  - id: SOC-S10-L1
    strand: S10
    title: "A Test That Is Usually Wrong"
    move: phenomenon
    sat_frame: "social study: design and inference"
    builds_on: null
    advances: "Works one documented numerical problem in full, with the answer most experts gave and the right one."
    vocab_link: [respond]
    passage: |
      In 1978 three researchers put a short problem to sixty doctors and medical
      students at Harvard. A disease affects one person in a thousand. A test for it never misses a case. It does give a false positive, which is a positive result in a person who does not have the condition, in five percent of healthy people. A patient has tested positive and nothing else is known about him. The doctors were asked for the chance that he has the disease.

      Most of the sixty answered ninety-five percent. Only about one in six gave
      an answer near the right one. The right answer is about two percent. The
      arithmetic is short enough to do on a napkin. Take a thousand people. One
      has the disease and tests positive. Of the nine hundred and ninety-nine who do not have it, about fifty also test positive.
      So fifty-one people test positive and one of them is ill. One in fifty-one
      is about two percent.

      What goes wrong is not the arithmetic but the starting point. The five
      percent figure is vivid and the one in a thousand figure is not, so the
      second gets dropped. The rate at which a condition occurs before any test is run is called the base rate. Ignoring it is among the most reliable errors in human judgment. It matters wherever a rare thing is screened for in a large population. That covers cancer screening, airport security, drug testing and fraud detection. A positive result on a good test for a
      rare condition is usually a false alarm, and how a doctor or an official
      should respond to one depends entirely on the number that most people forget. Screening programs are designed around this arithmetic, which is why a second and different test usually follows the first.
    anchors:
      - take: "Most of the sixty doctors answered ninety-five percent."
        quote: "Most of the sixty answered ninety-five percent."
      - take: "The right answer is about two percent."
        quote: "The right answer is about two percent."
      - take: "Ignoring the base rate is one of the most reliable errors in judgment."
        quote: "among the most reliable errors in human judgment"
    terms:
      - {term: "false positive", gloss: "a positive result in a person who does not have the condition", glossed: true}
      - {term: "base rate", gloss: "the rate at which a condition occurs before any test is run", glossed: true}
    facts:
      - "The study was published in 1978 and put the problem to sixty Harvard doctors and students."
      - "Most answered 95 percent; the correct answer is about 2 percent."
      - "With a 1 in 1,000 prevalence and a 5 percent false positive rate, about 51 of 1,000 test positive."
