passages:
  - id: HIS-S01-L1
    strand: S01
    title: "Four Days in Philadelphia"
    move: phenomenon
    sat_frame: "founding document: the claim and its warrant"
    builds_on: null
    advances: "Introduces the document, its date, its author and its three parts, before any argument about it."
    vocab_link: [established]
    passage: |
      The Second Continental Congress met in Philadelphia through the summer of
      1776. On July 2 the delegates voted to separate from Britain. Two days
      later they approved the text that explained why. The Declaration of
      Independence was printed that night in a shop a few streets away. Copies
      were read out in public squares within the week, and in some towns the
      reading ended with a bonfire. Fifty-six men signed the parchment copy,
      most of them on August 2, by which time the war had been running for
      more than a year.

      Thomas Jefferson wrote the first draft in about two weeks. A committee of
      five was named to do the work, but the others left most of the writing to
      him, and Congress then cut about a quarter of what he produced. The
      document has three parts. The preamble, which is the opening section that
      states a purpose, makes a general claim about where any government gets
      its power. The middle section is a list of grievances, meaning formal
      complaints, against George III. He had shut down elected assemblies,
      kept soldiers in the colonies in time of peace, and closed off their
      trade with other countries.

      The grievances take up most of the page. That surprises readers who know
      only the opening lines. Congress was building a legal case, and a legal
      case needs particulars. Each complaint named something the king had
      actually done, on a date, in a place. Together they argued that he had
      broken the agreement by which he ruled, and that the colonies therefore
      owed him nothing further. Congress had no army fund and no treasury of
      its own that July; it established both within the year. News of the vote
      took six weeks to cross the Atlantic. The parchment copy is now kept in
      Washington under filtered light.
    anchors:
      - take: "The vote for independence and the text explaining it were two separate acts, two days apart."
        quote: "On July 2 the delegates voted to separate from Britain. Two days later they approved the text that explained why."
      - take: "Most of the document is a list of particular complaints, not a statement of principle."
        quote: "The grievances take up most of the page."
      - take: "The argument is legal: the king broke an agreement, so obedience ended."
        quote: "he had broken the agreement by which he ruled"
    terms:
      - {term: "preamble", gloss: "the opening section that states a purpose", glossed: true}
      - {term: "grievances", gloss: "formal complaints", glossed: true}
    facts:
      - "The Congress voted for independence on July 2, 1776 and approved the text on July 4."
      - "Fifty-six men signed, most on August 2, 1776."
      - "Jefferson was one of a committee of five and wrote the first draft."
  - id: HIS-S02-L1
    strand: S02
    title: "Three Branches and One Lock"
    move: phenomenon
    sat_frame: "founding document: the claim and its warrant"
    builds_on: null
    advances: "Names the three branches and gives one blocking power to each, as the concrete shape of the Constitution."
    vocab_link: [authority]
    passage: |
      The Constitution written at Philadelphia in 1787 divides the work of
      government among three branches, and gives each of them something the
      other two cannot do. Congress makes law. The President carries it out.
      The courts decide what the law means in particular cases. Each branch
      also holds at least one way of stopping the others, and the men who drew
      up the plan put those blocks in deliberately. The first printing of the
      finished text ran to four pages.

      Congress holds the money. No federal dollar may be spent unless Congress
      has passed an appropriation, which is a vote that releases funds, so a
      President with a plan and no appropriation has nothing. The President may
      veto a bill, meaning return it to Congress without signing, and Congress
      can then pass it anyway only with two thirds of each chamber. The Senate
      must agree to treaties and to senior appointments, judges included. The
      courts may hold that a law conflicts with the Constitution and refuse to
      apply it, a power called judicial review. Federal judges are appointed
      for life and cannot be removed for rulings that prove unpopular.

      None of this was an accident of drafting. The men at the convention had
      watched a king rule without consent, and had then watched state
      assemblies do much as they liked. They wanted authority to be real but
      answerable, so they gave each branch a lock on part of the work of the
      others. The result is slow by design. A measure that two branches want
      and the third does not will usually fail, while a measure all three want
      can move in a week. Readers meeting the system for the first time often
      expect a chain of command. What the document sets up instead is a standing
      argument among equals.
    anchors:
      - take: "The three branches are defined by function: making, executing and interpreting law."
        quote: "Congress makes law. The President carries it out."
      - take: "Each branch holds at least one power that can stop another."
        quote: "Each branch also holds at least one way of stopping the others"
      - take: "The slowness is deliberate, not a defect of drafting."
        quote: "The result is slow by design."
    terms:
      - {term: "appropriation", gloss: "a vote that releases funds", glossed: true}
      - {term: "veto", gloss: "return a bill to Congress without signing", glossed: true}
      - {term: "judicial review", gloss: "the power to refuse to apply a law that conflicts with the Constitution", glossed: true}
    facts:
      - "The Constitution was written at Philadelphia in 1787."
      - "A veto can be overridden by two thirds of each chamber of Congress."
      - "Federal judges are appointed for life."
  - id: HIS-S03-L1
    strand: S03
    title: "A Convention at Seneca Falls"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Fixes one meeting, its document and its one contested resolution as the starting point of the suffrage story."
    vocab_link: [expand]
    passage: |
      In July 1848 about three hundred people came to a chapel in Seneca Falls,
      a small town in western New York. The meeting had been announced a few
      days earlier in a county newspaper, and no one had time to travel far.
      Elizabeth Cady Stanton and Lucretia Mott had called it to discuss the
      condition of women. Forty of those who came were men, and one of them was
      Frederick Douglass, who ran an abolitionist newspaper, that is, a paper
      campaigning for the ending of slavery, in
      Rochester.

      The convention produced a document called the Declaration of Sentiments.
      Its form was borrowed on purpose. It opened with the words of the
      Declaration of Independence, changed to read that all men and women are
      created equal, and then set out a list of complaints in the same manner
      as 1776. Married women could not own property in their own names. They
      could not keep the wages they earned. They had almost no standing in
      court, little access to higher education, and no vote. Sixty-eight women
      and thirty-two men put their names to it, and some later asked for their
      names to be removed.

      Eleven resolutions, that is, formal proposals put to a vote, came before
      the meeting. Ten passed easily. The one that asked for the vote was argued
      over and nearly lost. Several of those present thought that a demand to
      expand the franchise, meaning the right to vote, would make the rest of
      the list look ridiculous. Douglass spoke for it and it
      carried by a narrow margin. Newspapers treated the whole affair as a joke
      for weeks. The vote arrived seventy-two years later, in 1920, by which
      time only one of those who signed was still alive to use it.
    anchors:
      - take: "Seneca Falls borrowed the form of the Declaration of Independence deliberately."
        quote: "Its form was borrowed on purpose."
      - take: "The demand for the vote was the one resolution that nearly failed."
        quote: "The one that asked for the vote was argued over and nearly lost"
      - take: "The gap between the demand and the Nineteenth Amendment was seventy-two years."
        quote: "arrived seventy-two years later, in 1920"
    terms:
      - {term: "abolitionist", gloss: "campaigning for the ending of slavery", glossed: true}
      - {term: "resolutions", gloss: "formal proposals put to a vote", glossed: true}
      - {term: "franchise", gloss: "the right to vote", glossed: true}
    facts:
      - "The Seneca Falls convention met in July 1848."
      - "Sixty-eight women and thirty-two men signed the Declaration of Sentiments."
      - "Women's suffrage was secured nationally in 1920."
  - id: HIS-S04-L1
    strand: S04
    title: "A Fourth of July Speech"
    move: phenomenon
    sat_frame: "speech or essay: argument and audience"
    builds_on: null
    advances: "Presents the Douglass speech as an event with a date, an audience and a question, before analyzing its argument."
    vocab_link: [opposed]
    passage: |
      On July 5, 1852, Frederick Douglass spoke in Corinthian Hall in
      Rochester, New York. The invitation came from the Ladies Anti-Slavery
      Society, an abolitionist group, meaning one working for the ending of
      slavery. About six hundred people paid to hear him.
      Douglass had been born into slavery in Maryland and had escaped fourteen
      years earlier. He taught himself to read as a boy, bought his own freedom
      with money raised in Britain, and by 1852 owned and edited a newspaper.

      He began mildly. For twenty minutes he praised the men of 1776, called
      them brave, and said their work deserved the respect of their children.
      Then he turned. The holiday, he told the hall, was theirs and not his. He
      asked what the Fourth of July meant to an American slave, and answered
      that it revealed to such a man, more than any other day in the year, the
      wrong done to him. The speech ran for nearly two hours, and the audience
      is reported to have stood at the end.

      Douglass did not reject the founding documents. That is the part readers
      miss. He argued the opposite case, that the Declaration said exactly what
      he wanted said, and that the country was failing its own words rather
      than keeping them. Near the end he turned to the churches, the press and
      the political parties in turn, and named the share of each one in the
      failure. The address was printed as a pamphlet, which is a short work
      sold cheaply, within a few weeks, and it sold widely in the North. It is
      now usually published under a title that Douglass himself never gave it.
      The hall where he spoke was pulled down in 1898. His newspaper, the North
      Star, had about four thousand readers at its height, many of them in
      Britain. Douglass lived another forty-three years and advised two
      presidents.
    anchors:
      - take: "Douglass praised 1776 for twenty minutes before turning on his audience."
        quote: "For twenty minutes he praised the men of 1776"
      - take: "His argument was that the country failed its own founding words, not that the words were wrong."
        quote: "the country was failing its own words"
      - take: "The speech named churches, press and parties as sharing the failure."
        quote: "named the share of each one in the failure"
    terms:
      - {term: "pamphlet", gloss: "a short work sold cheaply", glossed: true}
      - {term: "abolitionist", gloss: "a campaigner for the ending of slavery", glossed: true}
    facts:
      - "Douglass delivered the speech on July 5, 1852, in Rochester, New York."
      - "He had escaped from slavery in Maryland fourteen years earlier."
      - "The speech lasted nearly two hours and was printed as a pamphlet."
  - id: HIS-S05-L1
    strand: S05
    title: "What Was Built After 1865"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Lists what Reconstruction actually created, as the concrete baseline for later passages on its reversal."
    vocab_link: [declined]
    passage: |
      The war ended in April 1865. Four million people who had been held as
      property were free, with no land, no schooling and no standing in law.
      The twelve years that followed are called Reconstruction. A great deal was
      built in them, in a hurry, by a Congress that had just won a war and did
      not expect to keep its majority for long.

      Three amendments were added to the Constitution. The Thirteenth ended
      slavery. The Fourteenth made anyone born in the country a citizen, and
      required every state to give equal protection of the laws. The Fifteenth
      banned the denial of the vote on grounds of race. A federal agency, the
      Freedmen's Bureau, set up schools, wrote labor contracts and ran courts
      where state courts would not sit. Black men voted in large numbers across
      the South. More than fifteen hundred held public office, including
      sixteen seats in Congress and two in the Senate. South Carolina had a
      legislature with a Black majority. The first public school systems in
      several southern states date from these years.

      None of it lasted in the form it was built. Northern interest declined
      through the 1870s as other matters took the front page and as the cost of
      keeping soldiers in the South rose. The last federal troops were pulled
      out in 1877. Within thirty years nearly every state in the region had
      written new voting rules that removed most Black voters from the rolls
      without mentioning race at all. Among them were poll taxes, which are
      charges that had to be paid before a person could vote, and reading tests
      set by local officials.
      The three amendments stayed in the Constitution, never repealed and
      largely not enforced, for another sixty years. Mississippi wrote the first
      of the new constitutions in 1890. Black turnout in Louisiana fell from
      about ninety-five percent to under two percent in eight years.
    anchors:
      - take: "Three amendments ended slavery, created birthright citizenship and barred racial denial of the vote."
        quote: "The Thirteenth ended slavery."
      - take: "Reconstruction put more than fifteen hundred Black officeholders into office."
        quote: "More than fifteen hundred held public office"
      - take: "The amendments survived while their enforcement did not."
        quote: "never repealed and largely not enforced, for another sixty years"
    terms:
      
      - {term: "Freedmen's Bureau", gloss: "a federal agency that set up schools and ran courts", glossed: true}
      - {term: "poll taxes", gloss: "charges that had to be paid before a person could vote", glossed: true}
    facts:
      - "The Thirteenth, Fourteenth and Fifteenth Amendments were ratified between 1865 and 1870."
      - "Over fifteen hundred Black men held public office during Reconstruction."
      - "Federal troops were withdrawn from the South in 1877."
  - id: HIS-S06-L1
    strand: S06
    title: "A Locked Door on Washington Place"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Anchors industrial regulation in one fire, its toll and the laws that followed within two years."
    vocab_link: [reform]
    passage: |
      The Triangle Shirtwaist factory filled the top three floors of a ten-floor
      building off Washington Square in New York. On Saturday, March 25, 1911,
      a few minutes before the end of the shift, a fire started in a bin of
      cloth scraps on the eighth floor. Within eighteen minutes it was over.
      One hundred and forty-six workers were dead, most of them women, many of
      them under twenty, and some of them fourteen.

      The building was not especially old and the stairs were not especially
      narrow. What killed people was a set of ordinary decisions. One of the
      two stair doors was kept locked, because the owners wanted to check bags
      at a single exit to prevent theft. The fire escape was a light iron
      structure that gave way and threw about twenty people into the yard
      below. The fire department ladders reached the sixth floor. There were no
      sprinklers, which are ceiling pipes that release water in a fire, and the
      company had turned down an inspection offered two years earlier.

      Two hundred thousand people walked in the funeral march. The state
      appointed a commission, meaning a body set up to investigate and report,
      and it spent two years visiting factories across New York. The reform
      that followed was unusually quick. Between 1911 and 1914 the legislature
      passed more than thirty laws. They required fire drills, unlocked exits,
      water pipes in tall buildings and limits on hours for women and children.
      They also set up an inspection service with the power to enter without
      warning. Several of the people who ran that commission spent the next
      thirty years in national office. The New York rules became the pattern for
      federal law in the 1930s. The factory building itself still stands and
      belongs to a university.
    anchors:
      - take: "A locked exit door, kept locked to check bags for theft, was central to the death toll."
        quote: "One of the two stair doors was kept locked"
      - take: "The fire killed 146 workers in about eighteen minutes."
        quote: "Within eighteen minutes it was over."
      - take: "More than thirty state laws followed within three years."
        quote: "the legislature passed more than thirty laws"
    terms:
      - {term: "sprinklers", gloss: "ceiling pipes that release water in a fire", glossed: true}
      - {term: "commission", gloss: "a body set up to investigate and report", glossed: true}
    facts:
      - "The Triangle fire occurred on March 25, 1911 and killed 146 people."
      - "One of the two stairway doors was locked to allow bag checks."
      - "New York passed more than thirty factory laws between 1911 and 1914."
  - id: HIS-S07-L1
    strand: S07
    title: "A Year of Walking in Montgomery"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Gives the boycott as an organized campaign with dates, numbers and a court ending, not a single refusal."
    vocab_link: [unite]
    passage: |
      On December 1, 1955, Rosa Parks was arrested in Montgomery, Alabama, for
      refusing to give up her seat on a city bus. She sewed clothes for a
      living, and she was also the secretary of the local branch of the
      National Association for the Advancement of Colored People. She had spent
      part of the previous summer at a training school for organizers in
      Tennessee. Three other women had been arrested on the same ground that
      year.

      The response was ready within three days. Printed sheets went out calling
      for a one-day boycott, meaning an organized refusal to ride, on the
      Monday. About forty thousand Black residents stayed off the buses, which
      was close to every one of them, and they made up about three quarters of
      all riders. That evening a meeting at the Holt Street church voted to
      carry on. A minister of twenty-six named Martin Luther King Jr. was
      chosen to speak for the campaign, partly because he was new in town and
      had made no enemies in it.

      The boycott lasted three hundred and eighty-one days. Carpools, which
      were shared cars run from church basements, moved people to work and
      back. Drivers were arrested for small traffic offenses, insurance
      companies canceled their policies, and the house where King lived was
      bombed. What finally ended segregation on the buses was not the boycott
      itself but a lawsuit, Browder v. Gayle, which the Supreme Court upheld in
      November 1956. The campaign had done something no court could do. It had
      shown that a whole city could unite behind one demand and hold together
      for a year. The bus company lost about two thirds of its income in that
      year. Parks lost her job at the department store within a month of the
      arrest, and left Alabama in 1957.
    anchors:
      - take: "Parks was an experienced NAACP officer, not an accidental protester."
        quote: "she was also the secretary of the local branch"
      - take: "The boycott ran 381 days and was supported by carpools of about three hundred cars."
        quote: "The boycott lasted three hundred and eighty-one days."
      - take: "Segregation on the buses ended by court ruling, not by the boycott alone."
        quote: "What finally ended segregation on the buses was not the boycott itself but a lawsuit"
    terms:
      - {term: "boycott", gloss: "an organized refusal to ride", glossed: true}
      - {term: "carpools", gloss: "shared cars run from church basements", glossed: true}
      
    facts:
      - "Rosa Parks was arrested on December 1, 1955 in Montgomery, Alabama."
      - "The boycott lasted 381 days."
      - "Browder v. Gayle, upheld by the Supreme Court in November 1956, ended bus segregation there."
  - id: HIS-S08-L1
    strand: S08
    title: "A Handful of Mud at Dandi"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Uses the salt march to show what colonial rule looked like at the level of a household tax."
    vocab_link: [rejected]
    passage: |
      Under British rule in India it was against the law for an Indian to make
      salt. The government held a monopoly, which is the sole right to produce
      and sell, and it taxed what it sold. Salt is not a luxury in a hot country
      where most people work outdoors. The tax therefore reached every
      household, including the poorest, and it had been collected in one form or
      another for most of a century.

      On March 12, 1930, Mohandas Gandhi left his settlement near Ahmedabad
      with seventy-eight followers and walked toward the coast. The walk took
      twenty-four days and covered about two hundred and forty miles. Reporters
      went with him. The crowds grew at every village along the road, and by the
      end they were enormous. On
      the morning of April 6 he waded into the sea at Dandi, picked up a
      handful of salt-crusted mud, and held it up. The act was useless as
      trade and perfect as argument. He had broken a law that nobody could
      defend in public without looking foolish.

      All along the coast people began boiling sea water in pans. Something
      like sixty thousand were arrested in the months that followed, Gandhi
      among them. The tax was not lifted, and the march won nothing at the
      time. What it did was force a choice. A government that arrests a man of sixty for picking up mud on a beach has rejected its own claim to rule by consent. Photographs of those arrests appeared in newspapers from London to New York within the week. Independence came seventeen years
      later, in 1947, after a world war had emptied the British treasury. The
      salt tax itself was abolished in 1946. Gandhi walked about twelve miles a
      day and was sixty years old at the time.
    anchors:
      - take: "The salt monopoly taxed something nobody in a hot country can do without."
        quote: "Salt is not a luxury in a hot country where most people work outdoors"
      - take: "The march was designed as an argument, not as a way of getting salt."
        quote: "useless as trade and perfect as argument"
      - take: "Roughly sixty thousand arrests followed, and no immediate concession."
        quote: "The tax was not lifted, and the march won nothing at the time."
    terms:
      - {term: "monopoly", gloss: "the sole right to produce and sell", glossed: true}
      
    facts:
      - "Gandhi began the salt march on March 12, 1930 and reached Dandi on April 6."
      - "The march covered about 240 miles with seventy-eight initial followers."
      - "India became independent in 1947."
  - id: HIS-S09-L1
    strand: S09
    title: "An Order, a Map and a Suitcase"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Establishes the facts of the 1942 removal, including the legal instrument and the numbers, before the later argument about emergency power."
    vocab_link: [restrict]
    passage: |
      On February 19, 1942, ten weeks after the attack on Pearl Harbor,
      President Franklin Roosevelt signed Executive Order 9066, which is a
      written instruction from a president that carries the force of law. The
      order named no group at all. It gave the army power to declare military
      areas and to restrict who could live in them. Within weeks the whole
      Pacific coast had been declared such an area, and the people removed from
      it were almost entirely of Japanese descent.

      About one hundred and twenty thousand men, women and children were given
      between six days and two weeks to settle their affairs. Two thirds of
      them were American citizens by birth. They could take only what they
      could carry. Farms, shops, boats and houses were sold for whatever price
      could be got in two weeks, or left with neighbors, or simply abandoned. A
      piano went for five dollars in Seattle.
      The families were held first at race tracks and fair halls, then moved to
      ten camps built inland, in deserts and on wet ground, with thin wooden
      barracks, shared washrooms and wire fences.

      Nobody of Japanese descent in the United States was ever charged with
      spying or sabotage during the war. The records of the time include two
      reports to the government saying as much, and both were set aside.
      Meanwhile a regiment of Japanese American soldiers, the 442nd, fought in
      Italy and France and became the most decorated unit of its size in the
      army. Some of its men had volunteered from inside the camps where their
      parents were still held. The last camp closed in 1946. Congress apologized
      in 1988 and paid twenty thousand dollars to each surviving person who had
      been held. About eighty-two thousand people received payments. One of the
      camps, Manzanar, is now a national historic site.
    anchors:
      - take: "The order named no group; the army's area declarations did the work."
        quote: "The order named no group at all."
      - take: "Two thirds of those removed were American citizens by birth."
        quote: "Two thirds of them were American citizens by birth."
      - take: "No person of Japanese descent in the United States was charged with espionage during the war."
        quote: "was ever charged with spying or sabotage during the war"
    terms:
      - {term: "executive order", gloss: "a written instruction from a president that carries the force of law", glossed: true}
      
      
    facts:
      - "Executive Order 9066 was signed on February 19, 1942."
      - "About 120,000 people were removed, two thirds of them American citizens."
      - "Congress apologized and paid reparations in 1988."
  - id: HIS-S10-L1
    strand: S10
    title: "A Paper for One Cent"
    move: phenomenon
    sat_frame: "historical narrative: event and consequence"
    builds_on: null
    advances: "Shows where mass readership came from, as the concrete basis for later passages on news and opinion."
    vocab_link: [conflict]
    passage: |
      Before 1833 a New York newspaper cost six cents and arrived by
      subscription, meaning payment in advance for a year of issues. That was
      most of a day's pay for a laborer. The papers were four pages of shipping
      lists, prices, political notices and long letters, and they were written
      for merchants and party men. Perhaps one household in fifty took one, and
      a single copy was often read by a dozen people in a coffee house.

      In September 1833 a printer named Benjamin Day began selling the New York
      Sun on the street for one cent. He hired boys to shout the headlines. They
      were paid in bundles of papers, which they then sold at a profit. He
      filled the
      sheet with police court reports, fires, accidents, crimes and conflict of
      every ordinary kind. Within two years the Sun was selling about fifteen
      thousand copies a day, more than any paper in the city had ever sold, and
      three rivals had copied the formula.

      The penny papers made their money from advertising rather than from
      readers, and that changed what they printed. A paper paid for by the
      people who take it answers to them. A paper paid for by advertising needs the largest crowd it can gather. Crowds are gathered by stories that anyone can follow. The new papers also hired reporters, which the old ones
      had barely done. They sent them out to courts, docks and police stations
      to look for material. Within one generation the idea that a newspaper
      should carry news, gathered by its own employees, had replaced the older
      idea that it should carry opinion, supplied by friends. The Sun also
      printed a series of invented reports about life on the moon in 1835, and
      sales rose.
    anchors:
      - take: "A six-cent subscription paper was priced beyond most wage earners."
        quote: "That was most of a day's pay for a laborer."
      - take: "Advertising, not subscription, became the source of revenue, which changed the content."
        quote: "The penny papers made their money from advertising rather than from readers"
      - take: "Paid reporters sent out to gather news were a new institution."
        quote: "The new papers also hired reporters, which the old ones had barely done"
    terms:
      - {term: "subscription", gloss: "payment in advance for a year of issues", glossed: true}
      
    facts:
      - "The New York Sun began selling for one cent in September 1833."
      - "Within two years it sold about fifteen thousand copies a day."
      - "Penny papers drew revenue mainly from advertising."
