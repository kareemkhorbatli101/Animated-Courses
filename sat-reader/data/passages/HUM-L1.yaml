field: HUM
level: 1
passages:
  - id: HUM-S01-L1
    strand: S01
    title: "Two Proposals, Two Narrators"
    move: phenomenon
    sat_frame: "literary excerpt: narrator and stance"
    builds_on: null
    advances: "Sets two famous scenes side by side so that the position of the teller becomes visible as a choice."
    vocab_link: [reveals]
    passage: |
      Charlotte Bronte published Jane Eyre in 1847. Jane tells her own story,
      and when Rochester proposes to her the reader is inside her head. The
      reader learns that her heart is beating and that she suspects a trick.
      Nothing is reported that Jane does not know. Rochester's thoughts are a
      closed door. When he lies to her, the reader is deceived at the same
      moment she is, and finds out when she finds out.

      Jane Austen published Pride and Prejudice in 1813. Darcy proposes to
      Elizabeth in a room at Hunsford, and the teller stands outside both of
      them. The reader is told what Elizabeth says and how Darcy colors as he
      listens. The voice also comments. It can say that Darcy spoke with little
      attempt at civility, which is a judgment Elizabeth would not have phrased
      that way. Austen uses that freedom constantly, and a reader who misses it
      takes the narrator's dry remarks for plain fact.

      Neither choice is better. Each buys something and gives something up. The
      first person keeps the reader locked in one mind, which creates suspense
      and sympathy and makes deception easy to arrange. The outside voice can
      move between rooms and years, can tell a reader what two people are each
      thinking, and can judge them both. What it cannot do is surprise the
      reader by not knowing something. Every novel reveals its world through a
      particular position, and the first useful question about any passage is
      who is standing where. The answer is usually settled in the opening
      sentences and holds for the rest of the book. Bronte made her choice part
      of the title page, which announced the novel as an autobiography edited by
      Currer Bell. Austen left her name off her books entirely in her lifetime.
      Both facts tell a reader something about the voice before a word of the
      story is read.
    anchors:
      - take: "In Jane Eyre nothing is reported that Jane does not know."
        quote: "Nothing is reported that Jane does not know."
      - take: "Austen can report two minds and comment on both."
        quote: "The voice also comments."
      - take: "The first question about a passage is who is telling it."
        quote: "who is standing where"
    terms: []
    facts:
      - "Jane Eyre was published in 1847 and is narrated by its central character."
      - "Pride and Prejudice was published in 1813 and uses a narrator outside the characters."
      - "A first-person narrator cannot report what the narrator does not know."
  - id: HUM-S02-L1
    strand: S02
    title: "The Clerk Who Would Prefer Not To"
    move: phenomenon
    sat_frame: "literary excerpt: narrator and stance"
    builds_on: null
    advances: "Takes one story in which motive is deliberately withheld, as the concrete case before motive is examined."
    vocab_link: [portrays]
    passage: |
      Herman Melville published Bartleby, the Scrivener in 1853. A lawyer on
      Wall Street hires a copyist named Bartleby, who works steadily for a few
      days. Then the lawyer asks him to check a document against the original.
      Bartleby answers that he would prefer not to. He is not angry and he does
      not explain. Asked again, he gives the same answer in the same mild voice,
      and over the following weeks he stops doing anything at all.

      The story never says why. The lawyer tries every explanation available to
      him. He wonders whether Bartleby is ill, or mad, or ruined by earlier work
      in a dead letter office. That last guess is offered in the final paragraph
      as a rumor rather than a fact. He offers money. He moves his own offices
      rather than remove the man. The reader is given exactly what the lawyer is
      given, which is a sentence of five words repeated, and no access to the
      mind behind it.

      That withholding is the design of the story and not a gap in it. Melville
      portrays a man entirely through what he refuses to do, and the pressure of
      the tale falls on the narrator instead. What the reader learns a great
      deal about is the lawyer: his comfort, his fear of scenes, his wish to be
      thought kind, and the exact point at which his patience runs out. A
      character can be built out of an absence. When a writer keeps a motive
      back, the question worth asking is what the silence does to everyone else
      on the page. Melville had published Moby-Dick two years earlier to poor
      sales. He was working as a customs inspector in New York within a few
      years of writing this story, and he published almost no prose for the next
      thirty.
    anchors:
      - take: "Bartleby answers requests with one mild refusal and gives no reason."
        quote: "he would prefer not to"
      - take: "The story offers the dead letter office only as a rumor."
        quote: "as a rumor rather than a fact"
      - take: "Withholding the motive turns the attention onto the narrator."
        quote: "the pressure of the tale falls on the narrator instead"
    terms:
      - {term: "scrivener", gloss: "a clerk employed to copy documents by hand", glossed: true}
    facts:
      - "Melville published Bartleby, the Scrivener in 1853."
      - "Bartleby's only reply to requests is that he would prefer not to."
      - "The dead letter office is offered in the last paragraph as a rumor, not an explanation."
  - id: HUM-S03-L1
    strand: S03
    title: "A Poem Made of Four Objects"
    move: phenomenon
    sat_frame: "literary excerpt: narrator and stance"
    builds_on: null
    advances: "Presents one very short poem whose whole content is physical detail, before figurative language is classified."
    vocab_link: [express]
    passage: |
      William Carlos Williams published a poem of sixteen words in 1923. It
      names a red wheelbarrow, rain water, white chickens, and the fact that a
      great deal depends on them. There is no story. Nobody speaks. No feeling
      is named at any point. The poem does not say that the scene is beautiful
      or sad or important, and the only abstract word in it is the claim that so
      much depends.

      Williams was a doctor in Rutherford, New Jersey, and wrote between
      patients. He argued for years that poetry should work through things
      rather than through statements about things. He put the principle in a
      line now quoted more often than any of his poems: no ideas but in things.
      The wheelbarrow is the argument in practice. A reader is handed three
      objects, told that something rests on them, and left to supply the rest.

      The effect is easy to test. Replace the objects with abstractions and the
      poem dies at once. A line about a feeling of rural simplicity is not a
      poem at all, and it says less rather than more. The concrete version works
      because rain water on red paint can be seen, and because the reader's own
      eye does the work of connecting the glaze to the chickens. Williams did
      not invent the method. He stated it plainly enough to teach it, and a
      generation of poets took the lesson. A thing on the page can express what
      a statement about it cannot. Williams published the poem in a collection
      called Spring and All, among prose passages that argued the same case at
      length. The poem has outlived the argument around it. It is now one of the
      most anthologized short poems in English, and it is still sixteen words.
    anchors:
      - take: "The poem names objects and no feelings."
        quote: "No feeling is named at any point."
      - take: "Williams argued for poetry that works through things."
        quote: "no ideas but in things"
      - take: "Replacing the objects with abstractions destroys the poem."
        quote: "the poem dies at once"
    terms: []
    facts:
      - "William Carlos Williams published The Red Wheelbarrow in 1923."
      - "The poem is sixteen words long and names three physical objects."
      - "Williams worked as a physician in Rutherford, New Jersey."
  - id: HUM-S04-L1
    strand: S04
    title: "Fourteen Lines and a Hinge"
    move: phenomenon
    sat_frame: "literary excerpt: narrator and stance"
    builds_on: null
    advances: "Counts out the mechanical parts of one fixed form, before expectation and its breaking are discussed."
    vocab_link: [composed]
    passage: |
      A sonnet has fourteen lines. The form reached England from Italy in the
      sixteenth century, and Shakespeare composed a hundred and fifty-four of
      them. The English version rhymes in a fixed pattern: four lines, then four
      more on new rhymes, then four more, then a pair at the end that rhyme with
      each other. Each line runs to ten syllables with the stress falling on
      every second one, a pattern called iambic pentameter.

      The interesting part is not the counting but the hinge. An Italian sonnet
      divides eight lines against six, and the turn comes after line eight. The
      reader is given a situation, a problem or a picture, and then the poem
      changes direction. The English form keeps a turn near line nine as well.
      It then adds a second one, because the closing pair can confirm or
      undercut what came before. Sonnet 130 spends twelve lines listing
      everything the speaker's mistress is not. The closing pair then says that
      he loves her all the same. The joke only lands because the reader has been
      counting.

      A reader who can count to fourteen therefore has a map. Finding the turn
      is usually enough to find the argument, and the argument is what examiners
      ask about. The form is also old enough to carry its own weight, so a
      modern poet who writes a sonnet about a bus station is borrowing four
      centuries of love poems and knows it. Wordsworth, Keats, Hopkins, Frost,
      Heaney and Terrance Hayes have all used the shape. The rules are simple,
      written down, and still being argued with. Hayes published a book of
      seventy sonnets in 2018, every one of them titled the same way. The form
      has survived four hundred years of poets trying to break it.
    anchors:
      - take: "A sonnet is fourteen lines with a fixed rhyme pattern."
        quote: "A sonnet has fourteen lines."
      - take: "The turn, not the counting, carries the argument."
        quote: "Finding the turn is usually enough to find the argument"
      - take: "The English form adds a closing couplet that can undercut what came before."
        quote: "undercut what came before"
    terms:
      - {term: "iambic pentameter", gloss: "ten syllables with the stress falling on every second one", glossed: true}
    facts:
      - "A sonnet has fourteen lines and Shakespeare wrote 154 of them."
      - "The Italian form turns after line eight; the English form adds a closing couplet."
      - "Iambic pentameter is a ten-syllable line with stress on every second syllable."
  - id: HUM-S05-L1
    strand: S05
    title: "A Platform, a Balcony, a Trap"
    move: phenomenon
    sat_frame: "humanities criticism: a judgment defended"
    builds_on: null
    advances: "Describes the physical playhouse and the three devices it offered, before the effect of the building on the plays."
    vocab_link: [shaped]
    passage: |
      The Globe was built on the south bank of the Thames in 1599 from the
      timbers of an older playhouse. It was a ring of galleries about a hundred
      feet across, open to the sky in the middle, with a platform stage pushed
      out into the yard. Two thousand people could get in. The cheapest paid a
      penny and stood in the open around three sides of the stage. Plays began
      in the early afternoon because there was no artificial light.

      The building offered a company three useful things. The platform had a
      trap door, so a grave could be dug or a devil could rise. Above the stage
      was a gallery, which could serve as a balcony, a city wall or the deck of
      a ship. At the back were two doors and a curtained space, which let an
      actor be hidden and then discovered. There was no front curtain and almost
      no scenery, so a scene ended when the actors walked off and the next began
      when others walked on.

      Those arrangements shaped the writing. A speech can be addressed to two
      thousand people standing in daylight, which is why asides and soliloquies
      work there and would be strange in a dark room. Place is established by
      being named, because nothing on stage can show it. Scenes run straight
      into one another without pause, which is why the plays move so quickly
      between Rome and Egypt or between a court and a field. The theater burned
      down in 1613 when a cannon used in a performance set the roof alight. A
      modern copy was built two hundred yards from the original site in 1997,
      and it plays in daylight without microphones. Audiences there stand in the
      yard in the rain, which is the one part of the experience that no indoor
      theater can reproduce.
    anchors:
      - take: "The Globe held about two thousand people and played in daylight."
        quote: "Plays began in the early afternoon"
      - take: "A trap, a gallery and a curtained space were the whole machinery."
        quote: "The platform had a trap door"
      - take: "Place had to be named because nothing on stage could show it."
        quote: "Place is established by being named"
    terms: []
    facts:
      - "The Globe was built on the south bank of the Thames in 1599."
      - "It held about two thousand people and performed in daylight."
      - "It burned down in 1613 after a cannon set the roof alight."
  - id: HUM-S06-L1
    strand: S06
    title: "The First Locked Room"
    move: phenomenon
    sat_frame: "humanities criticism: a judgment defended"
    builds_on: null
    advances: "Takes the first detective story as a concrete case of a genre being invented, before conventions are analyzed."
    vocab_link: [imitate]
    passage: |
      Edgar Allan Poe published The Murders in the Rue Morgue in 1841. Two women
      are killed in a room on the fourth floor of a Paris house. The door is
      locked from the inside and the key is in the lock. The windows appear to
      be nailed shut. A crowd of neighbors hears voices on the stairs but cannot
      agree on what language the second voice was speaking. The police arrest
      the wrong man almost at once.

      The story introduced a set of parts that are still in use. There is a
      brilliant private investigator, Dupin, who is not a policeman and who
      solves the case by reasoning from physical detail. There is a slower
      companion who tells the story and asks the questions a reader would ask.
      There is an official force that is competent and wrong. There is a
      solution that is strange but mechanical. Here it turns on a nail broken so
      that a window appears fastened when it is not. The explanation is given in
      the last pages, and every clue needed for it has already appeared.

      Arthur Conan Doyle read Poe closely and did not pretend otherwise.
      Sherlock Holmes arrived forty-six years later with the same arrangement of
      parts. Doyle even has Holmes dismiss Dupin by name in the first novel,
      which is what a writer does when the debt is obvious. Later writers did
      not simply imitate the pattern. They counted on a reader knowing it, which
      is a different and more useful thing, and it is where the pleasure of the
      modern form begins. Agatha Christie built a career on breaking the rules
      the pattern had established, and her readers could only be shocked because
      they knew them. Poe himself wrote only three Dupin stories and thought
      little of them.
    anchors:
      - take: "The room was locked from the inside with the key still in the lock."
        quote: "The door is locked from the inside"
      - take: "Poe assembled the parts the genre still uses."
        quote: "a set of parts that are still in use"
      - take: "Later writers counted on the reader knowing the pattern."
        quote: "They counted on a reader knowing it"
    terms: []
    facts:
      - "Poe published The Murders in the Rue Morgue in 1841."
      - "His detective Dupin is a private reasoner, not a policeman."
      - "Conan Doyle introduced Sherlock Holmes forty-six years later and had him mention Dupin."
  - id: HUM-S07-L1
    strand: S07
    title: "A Dutch Kitchen in 1658"
    move: phenomenon
    sat_frame: "humanities criticism: a judgment defended"
    builds_on: null
    advances: "Inventories one painting in detail, so that later passages can discuss how a picture directs the eye."
    vocab_link: [reflects]
    passage: |
      Johannes Vermeer painted The Milkmaid in Delft at about the end of the
      1650s. The picture is small, roughly eighteen inches high. A servant
      stands at a table pouring milk from an earthenware jug into a bowl. That
      is the whole event. Light comes through a window on the left, and the wall
      behind her is plain plaster with a nail and a nail hole in it.

      The things in the room are painted with great care. There is bread on the
      table, broken and rough. There is a blue cloth, a brass pot, a basket and
      a polished jug hanging on the wall. Low down on the right there is a foot
      warmer, a small wooden box for hot coals, and a line of blue tiles along
      the base of the wall. The milk is the only moving thing in the painting,
      and Vermeer painted it as a thin white thread with a thickened edge where
      it meets the bowl.

      Every surface reflects light differently and the painter has recorded each
      one. The glaze on the jug carries a hard highlight. The bread crust holds
      small dots of thick paint that catch light like real crumbs. The
      whitewashed wall is warm where the sun falls on it and cool in the shadow.
      Nothing is happening, and yet the picture has held visitors in front of it
      for three hundred years. A later passage in this strand asks how a painter
      arranges such a scene so that the eye goes where it is sent. The first
      step is noticing how much is actually there. Vermeer left about
      thirty-five paintings in all. He worked slowly, borrowed money, and was
      largely forgotten for nearly two centuries after his death in 1675. The
      Milkmaid is now the property of the Dutch state.
    anchors:
      - take: "The painting records one ordinary action in a plain room."
        quote: "That is the whole event."
      - take: "Each surface is given its own kind of highlight."
        quote: "Every surface reflects light differently"
      - take: "The milk is the only thing in motion."
        quote: "The milk is the only moving thing in the painting"
    terms:
      - {term: "earthenware", gloss: "baked clay, unglazed or roughly glazed", glossed: true}
      - {term: "foot warmer", gloss: "a small wooden box for hot coals", glossed: true}
    facts:
      - "Vermeer painted The Milkmaid in Delft at the end of the 1650s."
      - "The painting is roughly eighteen inches high."
      - "The only movement depicted is the thread of milk being poured."
  - id: HUM-S08-L1
    strand: S08
    title: "One Tune, Twelve Ways"
    move: phenomenon
    sat_frame: "humanities criticism: a judgment defended"
    builds_on: null
    advances: "Uses one set of variations to show what a composer can do to a fixed tune, before tension and release are explained."
    vocab_link: [inspired]
    passage: |
      Mozart wrote a set of twelve variations for keyboard on a French song that
      English speakers know as the tune of Twinkle, Twinkle, Little Star. The
      tune itself is eight bars long and uses only a handful of notes. He states
      it plainly first, so that every listener knows exactly what will be worked
      on. Then he changes it twelve times without ever quite losing it.

      The methods are easy to hear. In one variation the right hand runs in fast
      even notes while the tune hides inside the run. In another the tune moves
      to the left hand underneath. One variation turns the key from major to
      minor, which darkens the whole character while the shape of the melody
      stays where it was. One slows almost to a halt. The last speeds up and
      changes the count of beats in a bar. In every case a listener can still
      follow the original, and the pleasure comes from hearing it survive.

      The form is old and was never a Mozart's invention. A composer takes
      something already known, often a popular song or a dance, and demonstrates
      what can be done to it. Bach, Beethoven, Brahms and Rachmaninoff all wrote
      large sets of this kind, and Beethoven was inspired to write thirty-three
      variations on a waltz by a publisher he thought little of. Jazz musicians
      work the same way nightly. The theme is stated, and then it is taken apart
      in front of the audience. That only works if everyone in the room
      remembers the theme. Mozart wrote his set in his twenties, probably in
      Paris, and it was published in 1785. The song itself was already old and
      nobody knows who wrote it. Several hundred sets of variations on borrowed
      tunes were published in Europe in that decade alone.
    anchors:
      - take: "The tune is stated plainly before it is altered."
        quote: "He states it plainly first"
      - take: "Each variation changes one thing while leaving the tune recognizable."
        quote: "a listener can still follow the original"
      - take: "The form depends on the audience remembering the theme."
        quote: "remembers the theme"
    terms: []
    facts:
      - "Mozart wrote twelve variations on the French song now sung as Twinkle, Twinkle, Little Star."
      - "The theme is eight bars long and is stated plainly before the variations."
      - "Beethoven wrote thirty-three variations on a waltz by the publisher Diabelli."
  - id: HUM-S09-L1
    strand: S09
    title: "Shopping Under Glass"
    move: phenomenon
    sat_frame: "humanities criticism: a judgment defended"
    builds_on: null
    advances: "Describes one building type and what it did for the street, before the working of streets is analyzed."
    vocab_link: [admired]
    passage: |
      Burlington Arcade opened off Piccadilly in London in 1819. It is a
      straight covered lane, about six hundred feet long, lined on both sides
      with small shops and roofed in glass. It was built on the edge of a
      private garden, partly to stop passers-by from throwing oyster shells over
      the wall. Beadles, meaning uniformed officers employed to keep order,
      patrolled it in top hats. Running, singing and whistling were forbidden,
      and still are.

      The idea spread quickly because it solved several problems at once. London
      rain made street shopping miserable, and pavements were narrow, filthy and
      shared with carriages. Under glass a shopper could walk the whole length
      dry, look in forty windows, and meet people. The shops were small and the
      rents were high, which suited trades selling expensive light goods:
      gloves, jewelry, prints, watches. Gas lighting, and then electric
      lighting, let the arcade stay open into the evening.

      Bigger versions followed across Europe. Milan built the Galleria Vittorio
      Emanuele II between 1865 and 1877, with a glass dome a hundred and fifty
      feet high over a crossing of two covered streets. Cleveland, Brussels,
      Naples and Moscow each built their own version within fifty years of the
      Milan galleria. These were admired as engineering as much as architecture.
      A long glass roof carried on iron was a new thing to be able to make. The
      arcade is also the direct ancestor of the shopping mall. One difference
      matters. An arcade is a public street with a roof on it, and it has doors
      at both ends that open onto the city. A mall has one owner, one set of
      opening hours and a car park. Burlington Arcade still has its beadles, and
      the rules against whistling were enforced into the present century.
    anchors:
      - take: "An arcade is a covered lane lined with small shops."
        quote: "a straight covered lane"
      - take: "It solved rain, dirt and narrow pavements at once."
        quote: "a shopper could walk the whole length dry"
      - take: "An arcade is a public street with a roof, open at both ends."
        quote: "a public street with a roof on it"
    terms:
      - {term: "beadles", gloss: "uniformed officers employed to keep order", glossed: true}
    facts:
      - "Burlington Arcade opened in London in 1819 and is about six hundred feet long."
      - "The Galleria Vittorio Emanuele II in Milan was built between 1865 and 1877."
      - "Arcades used iron and glass roofs to cover a public street."
  - id: HUM-S10-L1
    strand: S10
    title: "Two Reviews of One Riot"
    move: phenomenon
    sat_frame: "humanities criticism: a judgment defended"
    builds_on: null
    advances: "Puts two contemporary judgments of one performance side by side, as the concrete starting point for criticism."
    vocab_link: [praised]
    passage: |
      The Rite of Spring had its first performance in Paris on May 29, 1913.
      Igor Stravinsky wrote the music and Vaslav Nijinsky arranged the dancing.
      The audience began to object within the first minutes. There was laughing,
      then shouting, then fighting in the aisles, and the noise grew loud enough
      that the dancers could not hear the orchestra. Nijinsky stood in the wings
      calling out the counts.

      The reviews the next morning did not agree about what had happened. One
      Paris critic called the work a laborious and puerile barbarity and said
      the theater should be ashamed. Another praised it as a work of rare
      strength and wrote that the hissing came from people defending their own
      habits. A third spent most of his column on the clothes in the audience.
      All three had sat in the same room for the same thirty-three minutes.

      That disagreement is the ordinary condition of criticism rather than a
      scandal. Each of the three had a standard in mind and the standards were
      different. The first wanted melody and grace and found neither. The second
      wanted a work that did something new and found one. The third wanted a
      social occasion. A reader who wants to use any review must therefore find
      the standard behind it, which is often unstated. Within a decade the piece
      was being played in concert halls to respectful audiences, and Stravinsky
      lived another fifty-eight years as the most famous composer alive. The
      riot is now part of the music's reputation, which none of the three
      critics could have predicted. Stravinsky himself gave several accounts of
      the evening in later life, and they do not agree with one another either.
      The theater that staged it had opened only six weeks before, on a new
      avenue in a fashionable district. Its manager said afterward that he had
      expected trouble and had sold the seats anyway.
    anchors:
      - take: "The first performance ended in shouting and fighting."
        quote: "then fighting in the aisles"
      - take: "The reviews disagreed because the standards behind them differed."
        quote: "Each of the three had a standard in mind"
      - take: "A reader of a review must find the standard behind it."
        quote: "find the standard behind it"
    terms: []
    facts:
      - "The Rite of Spring was first performed in Paris on May 29, 1913."
      - "Stravinsky wrote the music and Nijinsky arranged the choreography."
      - "Reviews the next day ranged from calling it a barbarity to praising its strength."
