      C: detail_swap
      D: wrong_direction
    why: The text says that putting a detector at the slits to find out which one each particle went
      through makes the pattern disappear.
    trap: B reverses the behavior, since each arrival is a single point either way.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the pattern cannot be
      explained by particles meeting one another?
    claim: the pattern cannot be explained by particles meeting one another
    options:
    - «Thomas Young demonstrated it in 1801, and for a century it was taken as proof that light is
      a wave»
    - «the pattern is there even though no two particles were ever present together to interfere with
      each other»
    - «The same result has been obtained with electrons, neutrons, whole atoms and molecules of several
      thousand atoms»
    - «Several interpretations make identical predictions for every experiment performed so far»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says the pattern appears although no two particles were present together, which
      rules out their interfering with each other.
    trap: A gives the old reading of the pattern rather than the result that rules out meeting.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: It did not show that light is both a wave and a particle, which is a sentence rather
      than a claim. A reader who repeats that formula is therefore ___
    options:
    - stating what the experiment established
    - denying that the pattern was observed
    - describing the detector placed at the slits
    - saying less than it sounds like
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: detail_swap
    why: The text calls the formula a sentence rather than a claim, so repeating it leaves the content
      of the result unstated.
    trap: A credits the formula with the finding the text says it does not carry.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «compounded» most nearly mean?
    target: compounded
    options:
    - mixed into one substance
    - paid with added interest
    - made worse than before
    - settled by agreement
    key: C
    moves:
      A: imported
      B: imported
      D: wrong_direction
    why: The two bodies of evidence are said to have compounded the difficulty rather than resolving
      it, so the word names making the trouble worse.
    trap: D reverses the sense, since the sentence contrasts it with resolving.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about what was settled?
    options:
    - It introduces the photoelectric effect for the first time
    - It narrows the claim before the text restates it
    - It concedes that the experiment settled nothing
    - It reports the molecules of several thousand atoms
    key: B
    moves:
      A: detail_swap
      C: overreach
      D: detail_swap
    why: The sentence says what the experiment settled is narrower than usually said, and the two
      sentences after it give the narrower version in place of the familiar one.
    trap: C empties the result, though the text gives a precise statement of it.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 argues about what light is. Based on Text 2, what would be added to that argument?
    sibling: PHY-S06-L3
    sibling_gloss: Text 2 is passage 126 of this book. It traces the measurement of the speed of light
      from Romer through Fizeau to the redefinition of the meter in 1983, which made the speed exact
      by definition.
    options:
    - A property of light that neither picture is needed for
    - Light delivers its energy in discrete lumps
    - Each arrival is a single point on the detector
    - The two-slit pattern fixed the speed of light
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 measures and then defines a speed, which is a quantity the two-slit dispute in Text
      1 never touches and neither picture is required to supply.
    trap: B repeats the evidence Text 1 uses to set up its difficulty.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Each arrival is a single point on the detector, which is particle behavior. ___ after
      enough arrivals the points have built up the interference pattern, which is wave behavior.
    options:
    - Likewise,
    - As a result,
    - In short,
    - And yet,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The second sentence reports behavior of the opposite kind from the first, so the transition
      must mark the surprise rather than a likeness or a consequence.
    trap: B reads the wave pattern as following from the single points rather than opposing them.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Each arrival is a single point on the detector ___ after enough arrivals the points have
      built up the interference pattern.
    options:
    - detector, after
    - detector. After
    - detector after
    - detector, and, after
    key: B
    moves:
      A: comma_splice
      C: run_on
      D: misplaced
    why: The clause about the points building up the pattern is a complete sentence, so a period separates
      it from the clause about a single arrival.
    trap: A splices the clause about the pattern onto the clause about the arrival with a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why sending one particle at a time was decisive. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why sending one particle at a time was decisive
    notes:
    - Each arrival is a single point on the detector.
    - After enough arrivals the points build up the interference pattern.
    - No two particles were ever present together to interfere with each other.
    - Putting a detector at the slits destroys the pattern.
    options:
    - Each arrival is a single point on the detector screen itself
    - After enough arrivals the points build up the pattern
    - Putting a detector at the slits destroys the pattern entirely
    - The pattern appeared although no two particles were ever present together, so nothing could
      have interfered with anything
    key: D
    moves:
      A: underreach
      B: underreach
      C: true_not_asked
    why: Only this choice names the absence of any partner for the interference, which is what the
      one-at-a-time arrangement established.
    trap: B reports the pattern without saying what its appearance ruled out.
- id: PHY-S07-L4
  summary_ar:
    khulasa: الدعوى القويّة في الكيمياء هي الاختزال، أي أنّ علمًا يُستخرج من علم آخر في الأصل، وهنا
      أنّ الكيمياء تتبع ميكانيكا الكمّ التي وضعها إرفين شرودنغر وغيره. والدعوى ليست فارغة، لأنّ الاستخراج
      قد أُجري في أنظمة صغيرة.
    maana: المعنى أنّ مستويات الطاقة في جزيء الهيدروجين تُحسب من المبادئ الأولى بدقّة تفوق القياس،
      وأنّ المدارات المتساوية الطاقة تخرج من الرياضيات دون أن تُدسّ فيها. والصعوبة في المقياس، وليست
      صعوبة في الأصل بالمعنى المعتاد.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: كلفة الحلّ المضبوط تنمو بعدد
      الإلكترونات نموًّا يجعل جزيئًا من أربعين ذرّة خارج قدرة أيّ حاسوب، وكلّ طريقة عملية تقريب تُضبط
      أخطاؤه بالمقايسة بالقياس، فيستعمل الكيميائي قواعد لا تُستخرج من النظرية.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ الاستخراج لم يُجرَ قطّ، مع أنّ النصّ يذكر إجراءه في الأنظمة
      الصغيرة. ويقترن المقطع بالمقطع المئة والسابع والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The boundary has moved from three atoms to several dozen
    - The derivation has never been carried out for any system
    - Funding goes to those who claim their level is fundamental
    - The two sides disagree about what reducible should mean
    key: D
    moves:
      A: underreach
      B: wrong_direction
      C: true_not_asked
    why: The text sets the reductionist against the advocate of emergence and says the disagreement
      is partly about the word reducible, with a practical edge about funding.
    trap: B contradicts the text, which says the derivation has been carried out for small systems.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what happens to the cost of an exact solution?
    options:
    - It falls as the number of electrons rises
    - It grows so fast that forty atoms is out of reach
    - It is controlled by comparison with measurement
    - It has not changed in fifty years of work
    key: B
    moves:
      A: wrong_direction
      C: detail_swap
      D: wrong_direction
    why: The text says the computational cost of an exact solution grows so fast with the number of
      electrons that a molecule of forty atoms is beyond any possible computer.
    trap: C names how the errors of an approximation are handled rather than the cost.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the derivation does
      succeed where it can be carried out?
    claim: the derivation does succeed where it can be carried out
    options:
    - «A chemist therefore uses rules, such as the ones about acids, bonds and reaction rates, that
      are not derived from the underlying theory»
    - «every practical method is an approximation whose errors are controlled empirically, by comparison
      with measurement»
    - «The energy levels of a hydrogen molecule can be computed from first principles to an accuracy
      better than measurement»
    - «The boundary has moved from three atoms to several dozen in half a century»
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: near_miss
    why: The quotation reports a computation from first principles more accurate than the measurement
      it is checked against, which is a successful derivation.
    trap: A names the rules that are not derived rather than the case where derivation works.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A chemist therefore uses rules, such as the ones about acids, bonds and reaction rates,
      that are not derived from the underlying theory and could not be. Those rules are therefore
      ___
    options:
    - held in place by measurement rather than derivation
    - derived from the equations after all
    - the exact solutions for forty atoms
    - of no use to a working chemist
    key: A
    moves:
      B: wrong_direction
      C: detail_swap
      D: wrong_direction
    why: The text says such rules are not derived and could not be, and that practical errors are
      controlled by comparison with measurement.
    trap: B supplies a derivation the same sentence says is impossible.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «Degenerate» most nearly mean?
    target: degenerate
    options:
    - fallen into decay
    - simplified for use
    - without any energy
    - sharing one energy level
    key: D
    moves:
      A: imported
      B: imported
      C: wrong_direction
    why: The text defines degenerate orbitals as states that share the same energy, so the word marks
      them as equal in energy rather than decayed.
    trap: A takes the everyday sense of the word, which has nothing to do with energy.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the difficulty of scale?
    options:
    - It introduces the degenerate orbitals by name
    - It concedes that the equations are incorrect
    - It marks the turn from the success to the limit
    - It reports the funding that goes to each side
    key: C
    moves:
      A: detail_swap
      B: wrong_direction
      D: detail_swap
    why: The sentence comes after the hydrogen computation and before the account of growing cost,
      and says the difficulty is scale and not principle in the usual sense.
    trap: B denies the correctness that the reductionist position rests on.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 argues about whether chemistry reduces to physics. Based on Text 2, what would be
      added to that argument?
    sibling: PHY-S07-L3
    sibling_gloss: Text 2 is passage 127 of this book. It reports that Mendeleev left gaps in his
      table and predicted the properties of the missing elements, and that the reason the columns
      exist, discrete electron shells, arrived half a century later.
    options:
    - Degenerate orbitals fall out of the mathematics unbidden
    - A case where the pattern came long before the theory
    - Exact solutions are impossible for a molecule of forty atoms
    - The periodic table was derived from the equations in 1869
    key: B
    moves:
      A: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 reports a working arrangement that predicted elements for fifty years before the shells
      explained it, which is the emergence case put historically.
    trap: A repeats one of the successes Text 1 credits to the derivation.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: The claim is not idle, because the derivation has been carried out for small systems.
      ___ the energy levels of a hydrogen molecule can be computed from first principles to an accuracy
      better than measurement.
    options:
    - For instance,
    - By contrast,
    - Even so,
    - In conclusion,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: restatement
    why: The second sentence gives one of the small systems just referred to, so the transition must
      introduce an example rather than a contrast or a conclusion.
    trap: C sets the hydrogen computation against the claim that it supports.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The difficulty is scale ___ it is not a difficulty of principle in the usual sense.
    options:
    - scale, it
    - scale it
    - scale, and it
    - scale; and, it
    key: C
    moves:
      A: comma_splice
      B: run_on
      D: misplaced
    why: The clause about a difficulty of principle is independent, so it joins the clause about scale
      with a comma and a conjunction rather than a comma alone.
    trap: A splices the clause about principle onto the clause about scale with a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why both positions can cite the same facts. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why both positions can cite the same facts
    notes:
    - The energy levels of a hydrogen molecule can be computed from first principles.
    - Exact solutions are impossible for a molecule of forty atoms.
    - Every practical method is an approximation checked against measurement.
    - The disagreement is partly about the word reducible.
    options:
    - The equations work for small molecules and not for larger ones, so each side reads the same
      limit differently
    - The energy levels of a hydrogen molecule can be computed exactly
    - Exact solutions are impossible for a molecule of forty atoms
    - The disagreement is partly about the word reducible itself
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice names the success and the failure together and says the dispute is about
      how to read them, which is why the facts are shared.
    trap: C gives the failure alone and so supports only one of the two readings.
- id: PHY-S08-L4
  summary_ar:
    khulasa: 'التحقيقات في انهيارات الهندسة تنتج نوعين من التفسير دائمًا، والاختيار بينهما ليس مسألة
      دليل وحده. فالحساب الفنّي يسمّي قطعة وآلية: أعمدة حديد زهر بثقوب براغي مصبوبة، وحمل ريح غائب
      عن الحساب، وحشوة تتصلّب تحت درجة معلومة.'
    maana: 'المعنى أنّ الحساب التنظيمي يسمّي مسار قرار: تقارير لم تجاوز رئيس عمل، وجدولًا يجعل التأخير
      مكلفًا، ومهندسًا رُدّ اعتراضه ممّن سمعوا اعتراضات قبله. وكلا الحسابين صحيح عادةً، وهما يجيبان
      سؤالين مختلفين: الأول يحدّد ما انكسر، والثاني يفسّر لماذا سُمح له أن يكون على تلك الحال.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: النزاع يهمّ لأنّ الحسابين يستلزمان
      علاجين مختلفين ومسؤوليتين مختلفتين، فالنتيجة الفنّية تُنتج تغييرًا في التصميم رخيصًا قابلًا
      للتحقّق، والنتيجة التنظيمية تستلزم أنّ بنية الإدارة كانت غير آمنة.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ أحد الحسابين وحده صحيح، مع أنّ النصّ يقول إنّ كليهما صحيح عادةً.
      ويقترن المقطع بالمقطع المئة والثامن والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Two correct accounts of a failure imply different remedies
    - Only one of the two accounts of a failure is ever correct
    - Both shuttle reports are read in engineering ethics courses
    - A technical finding produces a design change
    key: A
    moves:
      B: wrong_direction
      C: true_not_asked
      D: underreach
    why: The text says both accounts are usually correct and answer different questions, and that
      the dispute matters because they imply different remedies and liabilities.
    trap: B denies the text, which says both accounts are usually correct.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, which account is the more useful for preventing the next failure?
    options:
    - The technical account, because it names the component
    - Neither, because both answer the same question
    - The organizational account, because the process recurs
    - The account with the narrower remit behind it
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: detail_swap
    why: The text says the organizational account is generally the more useful for preventing the
      next failure, because the component will not recur and the decision process will.
    trap: A chooses the account the text says addresses what will not happen again.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the choice between the
      accounts is not driven by evidence alone?
    claim: the choice between the accounts is not driven by evidence alone
    options:
    - '«The technical account names a component and a mechanism: cast iron columns with cast bolt
      holes, no wind load in the calculation»'
    - «Both accounts are usually correct and they answer different questions»
    - «it found that the organizational causes identified seventeen years earlier had not been addressed»
    - «An organizational finding implies that the management structure was unsafe, which is expensive,
      contestable in court, and refractory to engineering solutions»
    key: D
    moves:
      A: true_not_asked
      B: near_miss
      C: near_miss
    why: The quotation names cost, litigation and intractability as the consequences of one finding,
      which are reasons to prefer the other that have nothing to do with evidence.
    trap: B says both accounts are correct rather than why one is chosen.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Inquiries with a narrow remit tend to produce technical findings, and the second shuttle
      inquiry was unusual in saying so explicitly. A reader of an inquiry report should therefore
      ___
    options:
    - accept the technical finding as the whole account
    - ask what the inquiry was allowed to examine
    - prefer the report with the narrowest remit
    - treat the two accounts as answering one question
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: detail_swap
    why: If the remit shapes which kind of finding appears, the scope of the inquiry is part of what
      a reader has to know before weighing its conclusion.
    trap: A takes a finding shaped by the remit as the complete explanation.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «refractory» most nearly mean?
    target: refractory
    options:
    - not yielding to treatment
    - able to resist great heat
    - arranged in a sequence
    - open to a cheap remedy
    key: A
    moves:
      B: imported
      C: imported
      D: wrong_direction
    why: An organizational finding is called refractory to engineering solutions, so the word names
      a problem that does not give way to the remedy offered.
    trap: B takes the sense used of a furnace lining rather than of a problem.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the two sentences about what each account does?
    options:
    - They introduce the normalization of deviance by name
    - They concede that neither account can be established
    - They report the findings of the second shuttle inquiry
    - They assign each account the question it answers
    key: D
    moves:
      A: detail_swap
      B: wrong_direction
      C: detail_swap
    why: The text says the technical account identifies what broke and the organizational account
      explains why the broken thing was allowed to be in that condition.
    trap: B denies accounts the text says are usually both correct.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 distinguishes two accounts of a failure. Based on Text 2, what would be added to
      that distinction?
    sibling: PHY-S08-L3
    sibling_gloss: Text 2 is passage 128 of this book. It explains how a characteristic strength and
      a safety factor are chosen, and says the method handles only the hazards that have been listed,
      so codes are revised after failures.
    options:
    - A technical finding produces a cheap design change
    - The organizational account explains why the condition was allowed
    - Where in the technical account the missing item sits
    - A safety factor covers the decisions a manager makes
    key: C
    moves:
      A: restatement
      B: restatement
      D: wrong_direction
    why: Text 2 says a margin covers only the listed hazards, which locates the technical gap that
      the organizational account in Text 1 then has to explain.
    trap: B repeats the work Text 1 assigns to the second account.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Both accounts are usually correct and they answer different questions. ___ the technical
      account identifies what broke.
    options:
    - Even so,
    - In the first place,
    - By contrast,
    - In conclusion,
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: restatement
    why: The sentence takes the first of the two accounts just referred to, so the transition must
      open the pair rather than set itself against them.
    trap: C sets the technical account against the claim that both are correct.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The technical account identifies what broke ___ and the organizational account explains
      why it was allowed to be in that condition.
    options:
    - broke; and
    - broke and
    - 'broke: and'
    - broke, and
    key: D
    moves:
      A: wrong_mark
      B: run_on
      C: wrong_mark
    why: The clause about the organizational account is independent, so the conjunction joining it
      to the clause about what broke takes a comma before it.
    trap: B leaves the two clauses about the accounts with no mark between them.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the organizational account is resisted. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the organizational account is resisted
    notes:
    - A technical finding produces a design change, which is cheap and verifiable.
    - An organizational finding implies that the management structure was unsafe.
    - That is expensive, contestable in court and refractory to engineering solutions.
    - Inquiries with a narrow remit tend to produce technical findings.
    options:
    - A technical finding produces a change that is cheap and verifiable
    - The organizational finding costs more, can be fought in court and resists an engineering fix,
      so a narrow remit is preferred
    - An organizational finding implies that the management was unsafe
    - Inquiries with a narrow remit tend to produce technical findings
    key: B
    moves:
      A: underreach
      C: underreach
      D: true_not_asked
    why: Only this choice names the three costs of the organizational finding and the narrowing that
      follows, which is what the resistance consists of.
    trap: C names the implication without the costs that make it unwelcome.
- id: PHY-S09-L4
  summary_ar:
    khulasa: في الجرعات العالية لا خلاف في آثار الإشعاع على النسيج، ودراسات الناجين من هيروشيما وناغازاكي
      أساس كلّ تنظيم ساري. والخلاف كلّه في شكل المنحنى عند أسفله، حيث تصغر الآثار عن أن تُكشف في أيّ
      دراسة ممكنة، والمصالح العملية كبيرة لأنّ التنظيم كلّه يكاد يكون في ذلك الحيّز.
    maana: المعنى أنّ الافتراض المعياري هو الخطّية بلا عتبة، أي أنّ الخطر يهبط تناسبًا مع الجرعة إلى
      الأسفل بلا حدّ آمن، وسنده الاستقراء من بيانات الناجين، والآلية، إذ قد يُتلف مسارٌ واحد في خلية
      الحمض النووي، وملاءمة قاعدة تسمح بجمع الجرعات على جماعة.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: والموقف الآخر يرى أنّ آليات
      الإصلاح تعالج الجرعات الصغيرة كلّها، فتوجد عتبة لا أثر دونها، ويذهب بعضهم إلى أنّ الجرعات الضئيلة
      واقية لأنّها تنبّه الإصلاح.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب الخلاف في الجرعات العالية، مع أنّ النصّ ينفي ذلك في أوّل جملة.
      ويقترن المقطع بالمقطع المئة والتاسع والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The largest worker study excludes a small threshold
    - The question at low dose is not currently decidable
    - The effects of radiation at high dose are disputed
    - Hormesis proposes that small doses are protective
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: underreach
    why: The text says the argument is entirely about the shape of the curve at the bottom and that
      the honest position is that the question is not currently decidable.
    trap: C denies the opening sentence, which says the high dose effects are not in dispute.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what would it take to distinguish the curves?
    options:
    - A single track through one cell
    - A study of the Hiroshima survivors
    - A regulation written in the safer direction
    - Millions of people with exposure measured individually
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: The text says distinguishing the curves at the doses in question would require a study of
      millions of people with exposure measured individually.
    trap: A names the mechanism cited for the linear assumption rather than the study needed.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the dispute survives
      because the two choices cost different things?
    claim: the dispute survives because the two choices cost different things
    options:
    - «assuming no threshold makes cleanup and shielding extremely expensive, while assuming a threshold
      risks harm that would never be sensible to detect afterward»
    - «The survivor studies from Hiroshima and Nagasaki are the basis of every regulation in force»
    - «Its support comes from extrapolating the survivor data, from the mechanism, since a single
      track through a cell can damage DNA»
    - «The largest worker study is consistent with the linear assumption and does not exclude a small
      threshold»
    key: A
    moves:
      B: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation sets the cost of assuming no threshold against the harm risked by assuming
      one, which is the asymmetry the text says keeps the dispute alive.
    trap: D reports what the largest study allows rather than the costs on each side.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: To distinguish the curves at the doses in question would require a study of millions
      of people with exposure measured individually, and the confounding factors are larger than the
      effect. Both sides therefore ___
    options:
    - have the study they would need already
    - agree that the linear assumption is proved
    - argue from mechanism and from other data
    - measure the effect at the doses in question
    key: C
    moves:
      A: overreach
      B: wrong_direction
      D: wrong_direction
    why: With the decisive study out of reach, the text says both sides argue from mechanism and from
      the shape of data collected elsewhere.
    trap: D claims the measurement the preceding sentence says cannot be made.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «sensible» most nearly mean?
    target: sensible
    options:
    - showing good judgment
    - able to be perceived
    - aware of a feeling
    - large in its effect
    key: B
    moves:
      A: imported
      C: imported
      D: near_miss
    why: The text speaks of harm that would never be sensible to detect afterward, so the word names
      what could be perceived rather than what is wise.
    trap: A takes the common sense of the word, which cannot apply to a harm.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the opening two sentences of the text?
    options:
    - They mark off what is settled from what is argued
    - They introduce the proposal called hormesis by name
    - They concede that high dose effects are unknown
    - They report the size of the study that would settle it
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The text says the high dose effects are not in dispute and the survivor studies underlie
      every regulation, before turning to the bottom of the curve.
    trap: C denies the agreement the first sentence establishes.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 argues about the shape of a curve at low dose. Based on Text 2, what would be added
      to that argument?
    sibling: PHY-S09-L3
    sibling_gloss: Text 2 is passage 129 of this book. It lists the four conditions a radiocarbon
      date needs, including a calibration curve that doubles back, and says a date reported without
      its range is not a date.
    options:
    - The survivor studies underlie every regulation in force
    - Confounding factors are larger than the effect being sought
    - A calibration curve would settle the shape of the dose curve
    - A case where a curve is reported with its range
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 insists that a figure be given with the range the curve allows, which is the practice
      the dose dispute in Text 1 cannot yet supply.
    trap: B repeats the obstacle Text 1 has already named.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: The honest position is that the question is not currently decidable. ___ to distinguish
      the curves at the doses in question would require a study of millions of people with exposure
      measured individually.
    options:
    - By contrast,
    - Even so,
    - After all,
    - In conclusion,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: restatement
    why: The second sentence supplies the reason the question cannot be decided, so the transition
      must introduce a justification rather than a contrast.
    trap: B sets the size of the needed study against the claim it supports.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: At high doses the effects of radiation on tissue are not in dispute ___ and the survivor
      studies are the basis of every regulation in force.
    options:
    - dispute, and
    - dispute and
    - dispute; and
    - dispute and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the survivor studies is independent, so the conjunction joining it to the
      clause about the high doses takes a comma before it.
    trap: B leaves the clause about the doses and the clause about the studies unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why regulators keep the linear assumption. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why regulators keep the linear assumption
    notes:
    - The question at low dose is not currently decidable.
    - Assuming no threshold makes cleanup and shielding extremely expensive.
    - Assuming a threshold risks harm that could never be detected afterward.
    - Regulators have kept the assumption on the ground that it errs in the safer direction.
    options:
    - The question at low dose is not currently decidable either way
    - Assuming no threshold makes cleanup and shielding expensive
    - With the question undecidable, the rule that risks cost rather than undetectable harm is the
      safer error to make
    - Regulators have kept the linear assumption for many years
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice joins the undecidability to the comparison of the two errors, which is the
      ground the text gives for the choice.
    trap: B names one cost without the harm it is being weighed against.
- id: PHY-S10-L4
  summary_ar:
    khulasa: طريقتان تقيسان ثابت هَبل، أي المعدّل الحاضر لتوسّع الكون، وهما مختلفتان إحداهما عن الأخرى
      أكثر من عقد. الأولى تعمل بالخروج على سُلّم المسافات بنجوم نابضة ونجوم متفجّرة لقياس أبعاد مجرّات
      معلومة سرعة تراجعها، والثانية تعمل من نمط خلفيّة الموجات الدقيقة.
    maana: المعنى أنّ كلتيهما نُقّحت بفِرق كبيرة حُسب فيها كلّ خطأ معروف، وكلتاهما فُحصت بفِرق منافسة
      على البيانات نفسها. والرقمان نحو ثلاثة وسبعين من الطريقة الأولى ونحو سبعة وستّين من الثانية،
      والاتّفاق الإجمالي بين منهجين مستقلّين تمامًا لافت ويخفي خلافًا نحو خمس وحدات.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: ثلاثة حلول ممكنة ولكلّ منها
      قائلون: خطأ منهجي غير مكشوف في السُّلّم، أو خطأ في النموذج المركّب على الخلفية، أو أنّ النموذج
      الكوني المعياري ناقص، فيكون الخلاف أوّل قياس لشيء جديد.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ الطريقتين متّفقتان، مع أنّ النصّ يقول إنّهما مختلفتان أكثر
      من عقد. ويقترن المقطع بالمقطع المئة والثلاثين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Independent methods have begun to report values between the two
    - The two methods have agreed with each other for a decade
    - Two careful methods disagree by five times their uncertainty
    - The background method gives about sixty-seven
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: underreach
    why: The text reports two refined and independently checked methods giving about seventy-three
      and about sixty-seven, and calls the gap about five sigma.
    trap: B reverses the text, which says they have been disagreeing for more than a decade.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, where is the error in the ladder most likely to be?
    options:
    - In the calibration of the pulsating stars
    - In the model fitted to the background
    - In the recession speeds of the galaxies
    - In the standard cosmological model itself
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: near_miss
    why: The text says one resolution is an unidentified systematic error in the ladder, most likely
      in the calibration of the pulsating stars.
    trap: B names the second of the three resolutions rather than the first.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the disagreement has
      the character of a real effect?
    claim: the disagreement has the character of a real effect
    options:
    - «Both have been refined by large teams with every known error accounted for»
    - «the disagreement has survived every improvement in both methods, which is roughly what a real
      effect does»
    - «Independent methods not using either route have begun to report, with values between the two»
    - «Their uncertainties are still too large to decide the question either way»
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: true_not_asked
    why: The quotation says the gap has survived every improvement and adds that this is roughly what
      a real effect does, which is the claim itself.
    trap: A reports the care taken rather than the behavior of the gap under improvement.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Most working cosmologists have been betting on the first for a decade, and the disagreement
      has survived every improvement in both methods. The bet is therefore ___
    options:
    - confirmed by the survival of the gap
    - the only resolution anyone has proposed
    - an error in the model of the early universe
    - looking worse than it did at the start
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: detail_swap
    why: The bet was on a hidden error in the ladder, and a gap that persists through every improvement
      is evidence against that explanation rather than for it.
    trap: A reads the survival of the gap as support for the bet it undermines.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «gross» most nearly mean?
    target: gross
    options:
    - offensive to the senses
    - before any deduction
    - broad rather than exact
    - a dozen dozen in number
    key: C
    moves:
      A: imported
      B: near_miss
      D: imported
    why: The gross agreement between two independent methods is said to conceal a disagreement, so
      the word marks the agreement as broad rather than close.
    trap: A takes the everyday sense of the word, which has no place in a measurement.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the three resolutions in the text?
    options:
    - They introduce the Hubble constant by name
    - They sort the possible explanations before weighing them
    - They concede that neither figure can be measured
    - They report the figures the two methods give
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The text says three resolutions are possible, names an error in the ladder, an error in the
      model and an incomplete cosmology, and then reports where the betting has gone.
    trap: C denies measurements the text calls refined and independently checked.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports two figures that disagree. Based on Text 2, what would be added to that report?
    sibling: PHY-S10-L3
    sibling_gloss: Text 2 is passage 130 of this book. It reports how Henrietta Leavitt found the
      relation between the period and the brightness of pulsating stars, and why the common distance
      of one cloud made the pattern visible.
    options:
    - Where the suspected error in the ladder would have to sit
    - The ladder uses pulsating stars to reach distant galaxies
    - The disagreement amounts to about five sigma in size
    - The relation was calibrated from the microwave background
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 explains how the brightness of a pulsating star is fixed, which is the step Text 1
      names as the most likely home of a hidden error.
    trap: B repeats the method of the ladder as Text 1 already describes it.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Both have been refined by large teams with every known error accounted for. Both have
      been checked by rival teams using the same data. ___ the figures are about seventy-three kilometers
      per second per megaparsec from the ladder and about sixty-seven from the background.
    options:
    - Likewise,
    - For instance,
    - In short,
    - And yet,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The sentence reports the gap that survives all the care just described, so the transition
      must mark the surprise rather than a likeness or a summary.
    trap: B treats the two figures as an instance of the checking just reported.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Both have been refined by large teams ___ and both have been checked by rival teams using
      the same data.
    options:
    - teams and
    - teams, and
    - teams; and
    - teams and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the checking by rival teams is independent, so the conjunction joining it
      to the clause about the refinement takes a comma.
    trap: A leaves the clause about refinement and the clause about checking unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the disagreement is taken seriously. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the disagreement is taken seriously
    notes:
    - Both methods have been refined with every known error accounted for.
    - Both have been checked by rival teams using the same data.
    - The gap is about five times the combined uncertainty.
    - In most of physics five sigma is the threshold for taking a discrepancy seriously.
    options:
    - Both methods have been refined with every known error accounted for
    - Both have been checked by rival teams using the same data
    - The gap is about five times the combined uncertainty of the two
    - Two carefully checked methods are apart by five times their own uncertainty, which is the usual
      threshold for a real discrepancy
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the care taken in both methods to the size of the gap in units of
      its own uncertainty, which is what makes it serious.
    trap: B names the checking without the size of the gap that survived it.
