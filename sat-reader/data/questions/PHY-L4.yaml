# Physical Science level 4 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: PHY
level: 4
sets:
- id: PHY-S01-L4
  summary_ar:
    khulasa: قراءة المحرار تبدو واقعة عن العالم وليست كذلك تمامًا، فمعاملتها حرارةً تقتضي التسليم
      بأنّ السائل يتوسّع تناسبًا مع الحرارة، وأنّ الزجاج لا يتوسّع توسّعًا يهمّ، وأنّ الآلة بلغت التوازن
      مع ما تقيسه، وكلّ ذلك افتراض خلفيّ لا بدّ منه، وكلّه مأخوذ من نظرية.
    maana: 'المعنى أنّ الفلاسفة من بيير دوهيم سمّوا هذا تحمّل القياس بالنظرية، أي أنّ ما يُعدّ قياسًا
      متعلّق بالإطار المستعمل؛ وصورته القويّة تمضي أبعد: أنّ عالمين مختلفي النظرية لا يقيسان الكمّية
      نفسها حين يبدو أنّهما يختلفان.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: الصورة الضعيفة لا خلاف فيها
      ونافعة، والقويّة فيها مشكلة، وهي أنّ القياسات تقلب النظريات التي أذنت بها كثيرًا، فقد وجد مهندسان
      خلفيّة الموجات الدقيقة وهما يبحثان عن ضجيج هوائي فهدمت النموذج السائد.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب قراءة المحرار واقعة ساذجة، مع أنّ النصّ ينفي ذلك في أوّل جملة.
      ويقترن المقطع بالمقطع المئة والحادي والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Several psychological constructs are in that position
    - The weak form of the claim is useful and the strong form fails
    - A thermometer reading is a plain fact about the world
    - The microwave background was found by two engineers
    key: B
    moves:
      A: true_not_asked
      C: wrong_direction
      D: underreach
    why: The text calls the weak version uncontroversial and useful and says the strong version has
      a problem, since measurements regularly overturn the theories that licensed them.
    trap: C denies the opening sentence, which says the reading is not quite a fact.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, how do scientists manage theory-ladenness?
    options:
    - By refusing to use more than one instrument
    - By treating two theories as the same framework
    - By accepting the strong version of the claim
    - By making the assumptions explicit and testing them
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: wrong_direction
    why: The text says scientists manage theory-ladenness by making the assumptions explicit and testing
      them separately, which is what a calibration chain does.
    trap: A reverses the remedy, since agreement between two instruments is the evidence sought.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the strong version is
      refuted by the history of the subject?
    claim: the strong version is refuted by the history of the subject
    options:
    - «The cosmic microwave background was found by two engineers looking for noise in an antenna,
      and it destroyed the model most cosmologists then held»
    - «Each of those is an auxiliary assumption, meaning a background claim that must hold for the
      measurement to mean what it is taken to mean»
    - «two scientists with different theories are not measuring the same quantity when they appear
      to disagree»
    - «single-method results are treated with caution in every field that has learned the lesson the
      hard way»
    key: A
    moves:
      B: true_not_asked
      C: near_miss
      D: near_miss
    why: The quotation reports a measurement made in search of antenna noise that destroyed the prevailing
      model, which is a measurement overturning the theory around it.
    trap: C states the strong version rather than the history that counts against it.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Where two instruments resting on different theories agree, the agreement is evidence
      that neither theory is distorting the result. A quantity measured by one instrument alone is
      therefore ___
    options:
    - free of any theoretical assumption
    - measured twice over by definition
    - open to the objection the text names
    - the same quantity under two theories
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: near_miss
    why: The protection comes from agreement between instruments resting on different theories, so
      a single method leaves the worry about distortion standing.
    trap: A claims a freedom from theory that the first paragraph rules out.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «appreciate» most nearly mean?
    target: appreciate
    options:
    - rise in value
    - take the force of
    - be grateful for
    - reject outright
    key: B
    moves:
      A: imported
      C: imported
      D: wrong_direction
    why: The working resolution is said to appreciate the point without accepting the conclusion,
      so the word names granting the point its weight.
    trap: D reverses the sense, since the point is granted and only the conclusion refused.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the working resolution?
    options:
    - It separates what is kept from what is dropped
    - It introduces the auxiliary assumptions for the first time
    - It concedes the strong version of the claim
    - It reports the discovery of the microwave background
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence says the point is appreciated and the conclusion not accepted, which divides
      the weak version from the strong one for the rest of the text.
    trap: C grants the version the text has just said has a problem.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 argues about what a measurement presupposes. Based on Text 2, what would be added
      to that argument?
    sibling: PHY-S01-L3
    sibling_gloss: Text 2 is passage 121 of this book. It describes traceability as an unbroken chain
      of comparisons back to a national standard, reports the drift of the official kilogram against
      its copies, and says the unit is now fixed by a constant of nature.
    options:
    - A reading rests on assumptions drawn from a theory
    - Agreement between two instruments is the evidence sought
    - A calibration chain removes every theoretical assumption
    - What a calibration chain looks like in practice
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 sets out the certified masses, the recorded uncertainties and the national standard,
      which is the chain that Text 1 names as the remedy without describing.
    trap: B repeats the test Text 1 has already proposed rather than adding to it.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: The weak version is uncontroversial and useful. ___ the strong version has a problem,
      which is that measurements regularly overturn the theories that licensed them.
    options:
    - Likewise,
    - For instance,
    - By contrast,
    - In other words,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
    why: The second sentence sets the strong version against the weak one just approved, so the transition
      must mark the opposition between them.
    trap: A treats the two versions as standing in the same position.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: A thermometer reading looks like a fact about the world ___ and it is not quite one.
    options:
    - world, and
    - world and
    - world; and
    - world and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause saying the reading is not quite a fact is independent, so the conjunction joining
      it to the clause about how it looks takes a comma.
    trap: B leaves the clause about the look and the clause about the fact unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why agreement between two instruments is worth having. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why agreement between two instruments is worth having
    notes:
    - Each reading rests on auxiliary assumptions drawn from a theory.
    - Scientists make the assumptions explicit and test them separately.
    - Where two instruments resting on different theories agree, neither theory is distorting the
      result.
    - The objection remains live wherever only one method exists.
    options:
    - Each reading rests on assumptions drawn from some theory
    - Scientists make their assumptions explicit and test them apart
    - Two instruments built on different theories cannot both be distorted in the same way, so their
      agreement answers the objection
    - The objection remains live wherever only one method exists
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice explains why an agreement across different frameworks is evidence, which
      is what makes the convergence worth seeking.
    trap: D names where the worry survives without saying what settles it elsewhere.
- id: PHY-S02-L4
  summary_ar:
    khulasa: 'كان قانون نيوتن في الجاذبية أنجح نظرية في تاريخ العلم وهو خاطئ، وهو مع ذلك ما يزال يُستعمل
      لتسيير المركبات الفضائية. والجملتان صادقتان، والجمع بينهما يحتاج تمييزًا قلّ أن يُعطاه الطلّاب:
      بين نظرية نُقضت ونظرية وُضعت داخل أوسع منها حالةً حدّية.'
    maana: 'المعنى أنّ الدليل الذي أوجب التغيير كان صغيرًا: فالحَضيض في مدار عطارد، أي أقرب نقطة من
      الشمس، يتقدّم مقدارًا ضئيلًا كلّ قرن، وبعد حساب كلّ مؤثّر جاذبيّ معروف بقي فارق نحو ثلاث وأربعين
      ثانية قوسية في القرن.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: حاول الفلكيون ستّين سنة أن يحلّوه
      بكوكب غير مرئي وبشمس مفلطحة وبتعديل الأُسّ، ثمّ تنبّأت النسبية العامّة بالرقم بالضبط من نظرية
      بُنيت لأسباب أخرى تمامًا، ولهذا قُبلت ولم يُكتفَ بالإعجاب بها.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن التحوّل بين وجهين. والفخّ
      المتوقّع هنا أن يُحسب بيان الحدّ نقضًا للنظرية، مع أنّ النصّ ينفي ذلك. ويقترن المقطع بالمقطع
      المئة والثاني والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Spacecraft navigation uses relativistic corrections
    - A theory shown to have a boundary has been refuted
    - A refuted theory and a bounded theory are different things
    - Mercury advances by forty-three seconds of arc a century
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: underreach
    why: The text says holding the two statements together requires a distinction between a theory
      that has been refuted and one placed inside a larger one as a limiting case.
    trap: B states the view the closing sentences of the text rule out.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, why was general relativity accepted rather than admired?
    options:
    - It gave the figure exactly from a theory built elsewhere
    - It proposed an unseen planet near the Sun
    - It modified the exponent in the inverse square law
    - It abandoned the Newtonian equations altogether
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The text says general relativity predicted the figure exactly, from a theory built for quite
      different reasons, and that is why it was accepted rather than merely admired.
    trap: B names one of the sixty years of attempts rather than the theory that succeeded.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the newer theory is
      expected to have a boundary of its own?
    claim: the newer theory is expected to have a boundary of its own
    options:
    - «the theory says that gravity is a force acting instantaneously at a distance, and that is simply
      not the case»
    - «the equations remain correct within a stated domain, which is the ordinary condition of every
      physical law, and relativity itself is expected to fail where quantum effects matter»
    - «Astronomers tried to resolve it for sixty years by proposing an unseen planet, a flattened
      Sun, and a modification of the exponent»
    - «Spacecraft navigation uses Newtonian calculations with relativistic corrections applied where
      they matter»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says relativity is itself expected to fail where quantum effects matter, which
      is the boundary the claim attributes to the newer theory.
    trap: A gives the charge against the older theory rather than the limit on the newer one.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A theory is not refuted by being shown to have a boundary, and is not safe for being
      useful inside it. A theory that works perfectly in its own domain is therefore ___
    options:
    - proved correct outside that domain as well
    - refuted by the existence of the domain
    - exempt from any further testing at all
    - still open to a question about its reach
    key: D
    moves:
      A: overreach
      B: wrong_direction
      C: overreach
    why: Usefulness inside a domain is said not to make a theory safe, so the question of how far
      it extends stays open however well it performs within it.
    trap: A takes success inside a boundary as evidence for what lies beyond it.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «resolve» most nearly mean?
    target: resolve
    options:
    - make a firm decision
    - break into parts
    - account for and remove
    - see in fine detail
    key: C
    moves:
      A: imported
      B: imported
      D: near_miss
    why: Astronomers tried for sixty years to resolve a discrepancy of forty-three seconds of arc,
      so the word names explaining it away.
    trap: D takes the optical sense of the word rather than the one about a discrepancy.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the two accounts set out near the end?
    options:
    - They introduce the perihelion of Mercury by name
    - They give the two answers to the question just posed
    - They concede that relativity failed the test
    - They report the figure of forty-three seconds
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The text asks whether Newton was mistaken and then gives one account on which he was and
      another on which the equations hold within a stated domain.
    trap: C denies a prediction the text says was exact.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 asks whether a bounded theory is wrong. Based on Text 2, what would be added to that
      question?
    sibling: PHY-S02-L3
    sibling_gloss: Text 2 is passage 122 of this book. It reports the torsion balance of 1798, the
      controls Cavendish used against air currents and bias, and says published values of the constant
      still disagree by more than their stated uncertainties.
    options:
    - How hard the quantity in the law is to measure
    - The theory remains correct within a stated domain
    - Mercury leaves a residual of forty-three seconds
    - The torsion balance refuted the inverse square law
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 reports that the constant in the law is still the least precisely known, which bears
      on how sharply any boundary could be located by measurement.
    trap: B repeats the account that Text 1 attributes to working physicists.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: 'On one account yes: the theory says that gravity is a force acting instantaneously at
      a distance, and that is simply not the case. ___ the equations remain correct within a stated
      domain.'
    options:
    - Likewise,
    - As a result,
    - In short,
    - On the other hand,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The sentence gives the second of two opposed accounts, so the transition must mark the turn
      from one side of the question to the other.
    trap: B reads the second account as following from the first rather than opposing it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Newton wrote the most successful theory in the history of science ___ and it is still
      used to fly spacecraft.
    options:
    - science and
    - science, and
    - science; and
    - science and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about flying spacecraft is independent, so the conjunction joining it to the clause
      about the successful theory takes a comma before it.
    trap: A leaves the clause about the theory and the clause about spacecraft unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a small discrepancy could overturn a great theory. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a small discrepancy could overturn a great theory
    notes:
    - The residual was about forty-three seconds of arc per century.
    - Astronomers tried for sixty years to explain it away.
    - General relativity predicted the figure exactly from a theory built for other reasons.
    - That is why it was accepted rather than merely admired.
    options:
    - The residual was about forty-three seconds of arc per century
    - Astronomers tried for sixty years to explain the residual away
    - General relativity was accepted rather than merely admired
    - A figure that resisted sixty years of patching was then given exactly by a theory built for
      other reasons
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the long failure to patch the residual with the exact prediction from
      an unrelated theory, which is what made the small figure decisive.
    trap: B reports the failed attempts without the success that followed them.
- id: PHY-S03-L4
  summary_ar:
    khulasa: إضاءة غرفة في بريطانيا أرخص بالقيمة الحقيقية نحو سبعمئة مرّة مما كانت قبل قرنين، ومع
      ذلك لم تكد حصّة الدخل التي تصرفها الأسر على الإضاءة تتغيّر، والسبب أنّ الناس اشتروا ضوءًا أكثر.
      وتلك المشاهدة أساس أثر الارتداد.
    maana: المعنى أنّ أثر الارتداد هو زيادة استعمال خدمة تتبع رخص تقديمها، وهو أقوى حجّة على عدم اتّخاذ
      الكفاءة طريقًا مباشرًا إلى خفض استهلاك الطاقة. وللحجّة صورة ضعيفة لا ينازع فيها أحد وصورة قويّة
      متنازع فيها.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: في الصورة الضعيفة يُستردّ بعض
      الوفر، والارتداد المباشر المقيس في البلدان الغنيّة يُقدَّر بين عشرة وثلاثين في المئة فيبقى معظم
      الوفر؛ وفي الصورة القويّة قد يفوق الارتدادُ الوفرَ كلّه في اقتصاد كامل.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يحدّ التعميم وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُعمَّم حالة الإضاءة على كلّ خدمة، مع أنّ النصّ يشترط عدم التشبّع. ويقترن
      المقطع بالمقطع المئة والثالث والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The lighting figure comes from a study of the price of light
    - Rebound is large where a service is already saturated
    - Direct rebound is usually put between ten and thirty percent
    - The weak form of the effect holds and the strong form does not
    key: D
    moves:
      A: true_not_asked
      B: wrong_direction
      C: underreach
    why: The text says the weak form is undisputed and the strong form is contested, and that the
      evidence does not support the strong form as a general rule.
    trap: B reverses the text, which says rebound is small where a service is saturated.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what do the historical cases of complete rebound share?
    options:
    - A service already saturated in a rich country
    - A service far from saturated, with room to grow
    - A measured figure between ten and thirty percent
    - An economy whose output did not require energy
    key: B
    moves:
      A: wrong_direction
      C: detail_swap
      D: wrong_direction
    why: The text says the historical examples share a feature, that the service was far from saturated,
      so demand had room to grow.
    trap: A names the opposite condition, under which the text says rebound is small.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the lighting case does
      not settle the question in general?
    claim: the lighting case does not settle the question in general
    options:
    - «Lighting a room in Britain is about seven hundred times cheaper in real terms than it was two
      centuries ago»
    - «rebound across a whole economy can exceed the saving entirely, because cheaper energy services
      raise output and output requires energy»
    - «Where a service is already saturated, as domestic refrigeration is in a rich country, rebound
      is small»
    - «The lighting figure comes from a study that reconstructed the real price of light since the
      candle»
    key: C
    moves:
      A: near_miss
      B: near_miss
      D: true_not_asked
    why: The quotation names a saturated service where rebound is small, which shows the lighting
      result turning on a condition that does not always hold.
    trap: A gives the lighting figure itself rather than the limit on generalizing from it.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: 'Historical examples of complete rebound exist, lighting among them, and they share a
      feature: the service was far from saturated, so demand had room to grow. A standard applied
      to a saturated service would therefore ___'
    options:
    - keep most of the saving it produces
    - lose the whole saving to extra demand
    - raise output across the whole economy
    - be the clearest case of complete rebound
    key: A
    moves:
      B: wrong_direction
      C: detail_swap
      D: wrong_direction
    why: Complete rebound is tied to services with room to grow, so a saturated service leaves the
      demand side little scope to take the saving back.
    trap: B transfers the lighting outcome to the case the text says behaves otherwise.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «commensurate» most nearly mean?
    target: commensurate
    options:
    - measured in the same units
    - announced in public
    - agreed by both sides
    - matched in scale to
    key: D
    moves:
      A: near_miss
      B: imported
      C: imported
    why: The policy conclusion is said to be commensurate with the detail rather than with the slogan,
      so the word names a conclusion scaled to the evidence.
    trap: A takes the strict arithmetical sense rather than the one about proportion.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the refrigeration example?
    options:
    - It introduces the rebound effect for the first time
    - It concedes that efficiency standards save nothing
    - It marks the condition under which rebound is small
    - It reports the price of light since the candle
    key: C
    moves:
      A: detail_swap
      B: wrong_direction
      D: detail_swap
    why: The example of a saturated service follows the account of complete rebound and shows the
      same mechanism producing almost no take-back.
    trap: B denies the saving that the same sentence allows for saturated services.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 disputes what efficiency saves. Based on Text 2, what would be added to that dispute?
    sibling: PHY-S03-L3
    sibling_gloss: Text 2 is passage 123 of this book. It explains that an efficiency figure depends
      on where the system boundary is drawn, describes life cycle analysis, and says its results turn
      on assumptions that cannot be measured.
    options:
    - Rebound is the take-back of part of a saving
    - A second reason the same saving can be counted twice over
    - Measured direct rebound usually falls below a third
    - A boundary drawn wider makes rebound disappear
    key: B
    moves:
      A: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 shows the figure itself moving with the boundary chosen, so the saving under dispute
      in Text 1 is not a fixed quantity to begin with.
    trap: C repeats the measured range that Text 1 has already given.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: The argument has a weak form that nobody disputes and a strong form that is contested.
      ___ in the weak form, some of the saving is taken back.
    options:
    - To begin with,
    - By contrast,
    - Even so,
    - In conclusion,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: restatement
    why: The sentence opens the account of the two forms just announced, so the transition must mark
      the first of them rather than a contrast.
    trap: C sets the weak form against the sentence that promised it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Lighting is far cheaper in real terms than it was two centuries ago ___ the share of
      income spent on it has barely changed.
    options:
    - ago, the
    - ago the
    - ago, and the
    - ago; and, the
    key: C
    moves:
      A: comma_splice
      B: run_on
      D: misplaced
    why: The clause about the share of income is independent, so it joins the clause about the price
      with a comma and a conjunction rather than a comma alone.
    trap: A splices the clause about the share onto the clause about the price with a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the policy answer depends on the service. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the policy answer depends on the service
    notes:
    - Rebound is the increase in use that follows from making a service cheaper.
    - Historical cases of complete rebound share a service far from saturated.
    - Where a service is saturated, rebound is small.
    - Measured direct rebound in rich countries is ten to thirty percent.
    options:
    - A saving survives where demand is near its limit and is taken back where the service has room
      to grow
    - Rebound is the increase in use that follows from a cheaper service
    - Measured direct rebound in rich countries is ten to thirty percent
    - Where a service is already saturated the rebound is small
    key: A
    moves:
      B: underreach
      C: true_not_asked
      D: underreach
    why: Only this choice states both halves of the condition, the saturated case and the unsaturated
      one, which is what makes the answer depend on the service.
    trap: D gives one half of the condition and so settles only one kind of case.
- id: PHY-S04-L4
  summary_ar:
    khulasa: الحرارة تسري من الحارّ إلى البارد، والغازات تمتزج ولا تنفصل، والكوب المكسور لا يعود.
      والقانون الثاني في الدِّيناميكا الحرارية يقول ذلك دعوى أنّ الإنتروبيا، أي مقياس عدد التراتيب
      الميكروية الموافقة لحال معلومة، لا تنقص في نظام معزول، وهذه الانتظامية موثوقة كأيّ شيء في الفيزياء.
    maana: 'المعنى أنّ أيّ نوع من القوانين هي مسألة متنازعة منذ بولتزمان: فعلى حساب هي قانون طبيعة
      بالمعنى المعتاد، قيد على ما يمكن أن يحدث؛ وعلى حساب آخر هي قانون إحصائي، أي انتظامية تصحّ لأنّ
      الاستثناءات بالغة الاستبعاد لا لأنّها ممتنعة.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: الحساب الثاني يتبع الميكانيكا،
      فمعادلات الجزيئات تعمل عملها عكسيًّا، فلا شيء فيها يمنع تجمّع الغاز في زاوية، والذي يمنع وقوعه
      أنّ عدد تراتيب الانتشار يفوق عدد تراتيب التجمّع بعامل أصفاره أكثر من ذرّات المجرّة.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ المعادلات تمنع الاستثناء، مع أنّ النصّ ينفي ذلك. ويقترن المقطع
      بالمقطع المئة والرابع والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The law holds because exceptions are improbable, not impossible
    - Nothing in the molecular equations allows a gas to spread out
    - The relations governing fluctuations were derived in the 1990s
    - Entropy counts the arrangements consistent with a state
    key: A
    moves:
      B: wrong_direction
      C: true_not_asked
      D: underreach
    why: The text says the statistical reading is now standard, that the mechanics forbid nothing,
      and that brief genuine decreases have been measured in small systems.
    trap: B reverses the mechanics, which the text says work equally well run backward.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, why does a gas never collect in one corner?
    options:
    - Because the molecular equations forbid it outright
    - Because entropy cannot decrease in any system at all
    - Because the spread arrangements vastly outnumber the collected
    - Because single molecules have been measured directly
    key: C
    moves:
      A: wrong_direction
      B: overreach
      D: detail_swap
    why: The text says the number of arrangements in which the gas is spread out exceeds the number
      in which it is collected by an enormous factor.
    trap: A appeals to a prohibition the text says the equations do not contain.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the strict reading of
      the law has been contradicted by measurement?
    claim: the strict reading of the law has been contradicted by measurement
    options:
    - «Heat flows from hot to cold, gases mix and do not unmix, and a broken cup does not reassemble»
    - «the molecular equations work equally well run backward, so nothing in them forbids a gas collecting
      in one corner»
    - «The regularity is as reliable as anything in physics. What kind of law it is has been argued
      since Boltzmann»
    - «experiments on single molecules and tiny beads have measured brief, genuine decreases in entropy
      of exactly the kind the strict reading forbids»
    key: D
    moves:
      A: true_not_asked
      B: near_miss
      C: near_miss
    why: The quotation reports measured decreases in entropy of exactly the kind the strict reading
      forbids, which is a contradiction by measurement.
    trap: B shows the mechanics permitting the exception rather than an experiment finding one.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: If the law is statistical, it says nothing about an individual molecule and nothing in
      principle about a sufficiently small system. A machine built at the scale of a cell is therefore
      ___
    options:
    - governed by the strict reading of the law
    - exposed to fluctuations the law does not forbid
    - free of the second law in every respect
    - as reliable as anything else in physics
    key: B
    moves:
      A: wrong_direction
      C: overreach
      D: detail_swap
    why: A statistical law leaves small systems unconstrained in principle, so a device at cellular
      scale meets the very fluctuations the strict reading would rule out.
    trap: C turns a limit on the strict reading into exemption from the law.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «inexorable» most nearly mean?
    target: inexorable
    options:
    - impossible to resist
    - cruel in its effects
    - slow but steady
    - open to exception
    key: A
    moves:
      B: imported
      C: near_miss
      D: wrong_direction
    why: The text says the inexorable character of the law is a property of large numbers, so the
      word names a regularity that cannot be withstood at that scale.
    trap: D reverses the sense, since the word marks what admits no exception.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the galaxy of zeros?
    options:
    - It introduces the definition of entropy for the first time
    - It concedes that the law may fail at any moment
    - It reports the measurements made on tiny beads
    - It explains why an allowed event is never seen
    key: D
    moves:
      A: detail_swap
      B: overreach
      C: detail_swap
    why: The sentence follows the admission that nothing forbids the gas collecting and gives the
      ratio of arrangements, which is why the permitted case never occurs.
    trap: B turns the improbability of the exception into its imminence.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 asks what kind of law the second law is. Based on Text 2, what would be added to
      that question?
    sibling: PHY-S04-L3
    sibling_gloss: Text 2 is passage 124 of this book. It reports the paddle wheel measurement of
      the mechanical equivalent of heat, the precision it required, and the way it left one quantity,
      energy, where there had been two.
    options:
    - Entropy counts the arrangements consistent with a state
    - The molecular equations work equally well run backward
    - The measurement that fixed the quantity the law governs
    - The paddle wheel measured a decrease in entropy
    key: C
    moves:
      A: restatement
      B: restatement
      D: wrong_direction
    why: Text 2 reports the work that made heat and energy one quantity in one unit, which is the
      bookkeeping the second law then constrains.
    trap: B repeats the point about the mechanics that Text 1 uses to argue its case.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: On one account it is a law of nature in the ordinary sense, a constraint on what can
      happen. ___ it is a statistical law, meaning a regularity that holds because the exceptions
      are overwhelmingly improbable rather than impossible.
    options:
    - Likewise,
    - On the other,
    - As a result,
    - In short,
    key: B
    moves:
      A: wrong_direction
      C: near_miss
      D: restatement
    why: The sentence gives the second of two opposed accounts, so the transition must mark the turn
      from one to the other rather than a likeness.
    trap: C reads the statistical account as following from the first rather than opposing it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The regularity is as reliable as anything in physics ___ and what kind of law it is has
      been argued since Boltzmann.
    options:
    - physics; and
    - physics and
    - 'physics: and'
    - physics, and
    key: D
    moves:
      A: wrong_mark
      B: run_on
      C: wrong_mark
    why: The clause about what kind of law it is is independent, so the conjunction joining it to
      the clause about the reliability takes a comma.
    trap: B leaves the clause about reliability and the clause about the argument unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the statistical reading matters to an engineer. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the statistical reading matters to an engineer
    notes:
    - A statistical law holds because the exceptions are improbable rather than impossible.
    - It says nothing in principle about a sufficiently small system.
    - Brief decreases in entropy have been measured in single molecules and tiny beads.
    - At the scale of a cell the fluctuations are the same size as the effects being engineered.
    options:
    - A statistical law holds because exceptions are improbable rather than impossible
    - Because the law leaves small systems unconstrained, a machine the size of a cell meets fluctuations
      as large as its own effects
    - Brief decreases in entropy have been measured in tiny beads
    - The law says nothing in principle about a very small system
    key: B
    moves:
      A: underreach
      C: underreach
      D: restatement
    why: Only this choice carries the statistical reading down to the scale where the fluctuations
      are as large as the effect a designer wants.
    trap: C reports the measurements without saying what they mean for a design.
- id: PHY-S05-L4
  summary_ar:
    khulasa: في آب سنة ألفين وثلاثة تهدّل خطّ في أوهايو على شجرة، ففصلته أجهزة الحماية، فانتقلت قدرته
      إلى خطوط مجاورة فانفصلت هي الأخرى، وفي نحو ثماني دقائق بقي خمسة وخمسون مليون نسمة في الولايات
      المتّحدة وكندا بلا كهرباء، وكلّ جهاز فعل ما صُمّم له.
    maana: 'المعنى أنّ هذه هي السمة المميّزة للانهيار المتسلسل، أي تتابع يحمي فيه كلّ عنصر نفسه فيُحمّل
      التالي فوق طاقته. واستُخرج من الواقعة نفسها درسان: الأول أنّ الشبكة كانت ضعيفة الربط ضعيفة التنسيق،
      فلم يرَ المشغّلون ما خارج نطاقهم، وتعطّل برنامج الإنذار فلم يلاحظ أحد.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: والدرس الثاني نقيض الأول، فالشبكة
      شديدة الربط تنقل البلاء بكفاءة نقلها القدرة، والدواء المقترح هو التجزير، أي فصل أجزاء الشبكة
      قصدًا ليعمل كلّ جزء وحده، مع توليد وخزن محلّيين.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن وظيفة الجملة المعرِّفة.
      والفخّ المتوقّع هنا أن يُقال إنّ الأجهزة أخلّت بما صُمّمت له، مع أنّ النصّ يقول عكسه. ويقترن
      المقطع بالمقطع المئة والخامس والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Standards written after 2003 are mandatory and enforced
    - The same connection that shares reserves also shares faults
    - Each piece of equipment failed to do what it was designed to do
    - Fifty-five million people lost power within about eight minutes
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: underreach
    why: The text draws two opposite lessons from one event and says they are not fully reconcilable,
      because the same connection that shares reserves also shares faults.
    trap: C reverses the text, which says each piece did what it was designed to do.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what is islanding?
    options:
    - The transfer of power to neighboring lines
    - The sharing of monitoring between operators
    - The failure of alarm software in a control room
    - The deliberate separation of parts of a network
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: The text defines islanding as the deliberate separation of parts of a network so that each
      can run alone, with local generation and storage.
    trap: A names a step in the cascade rather than the remedy proposed.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the two lessons cannot
      both be acted on fully?
    claim: the two lessons cannot both be acted on fully
    options:
    - «they are not fully reconcilable, because the same connection that shares reserves also shares
      faults»
    - «operators could not see conditions beyond their own territory, the alarm software in the control
      room had failed and nobody noticed»
    - «Standards written after 2003 are mandatory and enforced with penalties, which was not previously
      the case»
    - «Large blackouts have become less frequent in North America and have not stopped»
    key: A
    moves:
      B: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation says the two are not fully reconcilable and gives the reason, that one connection
      carries both the reserves and the faults.
    trap: D reports the record since the event rather than the tension between the lessons.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A tightly connected network transmits trouble as efficiently as it transmits power, and
      a continent-wide machine in which a tree in Ohio can darken New York is fragile by construction.
      Stronger interconnection therefore ___
    options:
    - removes both failure modes at once
    - makes a cascade impossible to start
    - buys one kind of safety with another
    - has no effect on either failure mode
    key: C
    moves:
      A: overreach
      B: overreach
      D: wrong_direction
    why: The connection that lets a disturbance be absorbed is the same one that carries it, so a
      gain against one failure mode is a loss against the other.
    trap: A claims a remedy for both modes, which the text says are not reconcilable.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «marked» most nearly mean?
    target: marked
    options:
    - written down plainly
    - large and noticeable
    - graded for quality
    - set aside for later
    key: B
    moves:
      A: imported
      C: imported
      D: wrong_direction
    why: The argument is said to have produced a marked increase in transmission investment, so the
      word names an increase large enough to notice.
    trap: A takes the sense of writing something down rather than of size.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about each piece of equipment?
    options:
    - It names the feature that defines the kind of failure
    - It introduces the islanding remedy for the first time
    - It concedes that the equipment was badly designed
    - It reports the number of people left without power
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence says each piece did what it was designed to do and calls that the defining feature
      of a cascading failure.
    trap: C blames the design, though the text says the equipment performed as intended.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 weighs two remedies for one failure. Based on Text 2, what would be added to that
      weighing?
    sibling: PHY-S05-L3
    sibling_gloss: Text 2 is passage 125 of this book. It reports that grid frequency is a continuous
      readout of the balance between generation and demand, and that stored rotational energy governs
      how fast the frequency can move.
    options:
    - A tightly connected network shares faults as well as power
    - Each piece of equipment did what it was designed to do
    - Frequency measures the strength of a connection between regions
    - The signal that tells an operator a cascade has begun
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 describes the frequency as a continuous readout of the balance, which is the instrument
      an operator would watch while a disturbance spreads.
    trap: A repeats the point Text 1 makes about tight connection rather than adding to it.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: That argument produced the modern reliability standards and a marked increase in transmission
      investment. ___ the second lesson is the opposite.
    options:
    - Likewise,
    - As a result,
    - For its part,
    - In short,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
    why: The sentence turns from the first lesson and its consequences to the second, so the transition
      must hand the floor over rather than draw a consequence.
    trap: B reads the second lesson as following from the standards the first produced.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Each piece of equipment did what it was designed to do ___ and that is the defining feature
      of a cascading failure.
    options:
    - do, and
    - do and
    - do; and
    - do and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the defining feature is independent, so the conjunction joining it to the
      clause about the equipment takes a comma before it.
    trap: B leaves the clause about the equipment and the clause about the feature unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why grid planning is a judgment rather than a calculation.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why grid planning is a judgment rather than a calculation
    notes:
    - Stronger interconnection would have let the disturbance be absorbed.
    - A tightly connected network transmits trouble as efficiently as power.
    - Both arguments are supported by engineering and by later events.
    - The same connection that shares reserves also shares faults.
    options:
    - Stronger interconnection would have let the disturbance be absorbed
    - A tightly connected network transmits trouble as well as power
    - Both remedies are supported, and the connection that shares reserves shares faults, so the choice
      is between failure modes
    - Both arguments are supported by engineering and by later events
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice puts the support for both remedies beside the single connection that carries
      both, which is what leaves a choice rather than a sum.
    trap: D reports that both are supported without naming what forces a choice.
- id: PHY-S06-L4
  summary_ar:
    khulasa: الضوء إذا مرّ في شقّين ضيّقين أحدث على شاشة خلفهما نمطًا من أهدابٍ مضيئة ومعتمة، وقد
      أراه توماس يونغ سنة ألف وثمانمئة وواحد، وعُدّ قرنًا كاملًا دليلًا على أنّ الضوء موجة، لأنّ جسيمات
      تصل إلى شاشة لا يلغي بعضها بعضًا.
    maana: 'المعنى أنّ الأثر الكهرضوئي أظهر بعد ذلك أنّ الضوء يسلّم طاقته كُتَلًا منفصلة، وذلك ما
      لا تفعله الأمواج، فزادت الحجّتان الإشكالَ ولم تحلّاه. والتجربة التي أوجبت الحساب الحديث ترسل
      الضوء جسيمًا واحدًا في المرّة: فكلّ وصول نقطة واحدة، وهذا سلوك جسيم.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الخلاف: بعد وصولات كافية تكون النقاط
      قد بنت نمط التداخل، وهذا سلوك موجة، والنمط موجود مع أنّ جسيمين لم يحضرا معًا قطّ ليتداخلا، وإن
      وُضع كاشف عند الشقّين اختفى النمط.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسنده وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ التجربة أثبتت أنّ الضوء موجة وجسيم معًا، مع أنّ النصّ يسمّي
      ذلك جملةً لا دعوى. ويقترن المقطع بالمقطع المئة والسادس والعشرين في أسئلة النصّين المتقابلين.
