  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says no distribution figure records the experience of being poor. Based on Text 2,
      which choice best shows a measure that reaches further?
    sibling: SOC-S09-L1
    sibling_gloss: Text 2 is passage 49 of this book. It reports a thirty-year gap in life expectancy
      between two Chicago neighborhoods and lists the housing, the grocery stores, the air quality
      and the travel to medical care that differ alongside it.
    options:
    - A gap of thirty years between two neighborhoods
    - A boundary drawn by a lending map
    - A figure published for most large cities
    - A count of grocery stores and the quality of housing
    key: D
