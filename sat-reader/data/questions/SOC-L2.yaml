  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Income is a flow, measured over a year ___ and wealth is a stock, accumulated over a
      life.
    options:
    - year, and
    - year and
    - year; and
    - year and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about wealth as a stock is independent, so the conjunction joining it to the clause
      about income takes a comma.
    trap: B runs the clause about income straight into the clause about wealth.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what a figure about inequality fails to reach. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what a figure about inequality fails to reach
    notes:
    - None of the three captures the experience of being poor.
    - Stigma, insecurity and the cost of credit do damage.
    - No distribution figure records that damage.
    - Wealth gaps are probably understated by the surveys.
    options:
    - None of the three captures the experience of being poor
    - Wealth gaps are probably understated by the surveys used
    - The shame, the insecurity and the price of credit, none of which a distribution records
    - No distribution figure records the damage that is done
    key: C
    moves:
      A: underreach
      B: true_not_asked
      D: restatement
