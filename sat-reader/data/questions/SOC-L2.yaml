- id: SOC-S10-L2
  summary_ar:
    khulasa: 'خطأ المعدّل الأساسيّ واحد من أسرة، وأفراد الأسرة أُظهروا مرّات تكفي للتنبّؤ بهم. فالتثبيت،
      أي جذب رقم لا صلة له لتقدير لاحق، أبسطها: فمن طُلب منه أن يدوّر عجلة ثمّ يقدّر كمّية جاء جوابه
      منجذبًا إلى ما أظهرته العجلة.'
    maana: المعنى أنّ الأثر يبقى حين يُقال للمُختبَرين إنّ الرقم عشوائيّ، وأنّ وكلاء العقار إذا أُعطوا
      أسعار طلب مختلفة للبيت نفسه قدّروه تقديرًا مختلفًا. والثانية الإتاحة، وهي الحكم في شيوع شيء
      بسهولة ورود أمثلته إلى الذهن.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الآلية: فالوفيات من أسباب تصنع الأخبار
      تُقدَّر أعلى بمقادير كبيرة، وترتيب التقديرات يتبع تغطية الصحف أكثر ممّا يتبع الأرقام. والثالثة
      التأطير: فالخيار الطبّيّ نفسه موصوفًا بالنجاة وموصوفًا بالموت يُنتج قرارين مختلفين.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب هذه الأخطاء متعادلةً عبر كثرة الأحكام، مع أنّها تميل جميعًا في
      جهة واحدة. ويقترن المقطع بالمقطع الخمسين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Kahneman and Tversky set out three errors in 1974
    - Estate agents value the same house differently
    - The errors are systematic, so they can be designed around
    - The errors cancel out over many judgments
    key: C
    moves:
      A: true_not_asked
      B: underreach
      D: wrong_direction
    why: The text names anchoring, availability and framing and says what makes them useful is that
      they are systematic, so the mistake can be anticipated and designed around.
    trap: D gives the behavior of a random error, which the text contrasts with these.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what happens when subjects are told the number is random?
    options:
    - The pull of that number survives
    - The estimate becomes accurate
    - The framing effect disappears
    - The news coverage is ignored
    key: A
    moves:
      B: wrong_direction
      C: detail_swap
      D: detail_swap
    why: The text says the anchoring effect survives when the subjects are told that the number is
      random.
    trap: B removes an error the sentence says persists.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that these errors can be
      planned for in advance?
    claim: these errors can be planned for in advance
    options:
    - «Estate agents given different asking prices for the same house value it differently»
    - «these all deviate in the same direction for the same reason, which means the mistake can be
      anticipated and designed around»
    - «Deaths from causes that make the news are overestimated by large factors»
    - «The same medical choice described in terms of survival and in terms of death produces different
      decisions from the same doctors»
    key: B
    moves:
      A: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation says the deviations all run the same way for the same reason, which is what
      lets the mistake be anticipated and designed around.
    trap: D gives one of the three effects rather than the property that makes them manageable.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A random error would cancel over many judgments, but these all deviate in the same direction
      for the same reason. A hospital that averaged many such judgments would therefore ___
    options:
    - remove the error from the average
    - produce a framing effect instead
    - need a different asking price
    - average a set of errors that agree
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: imported
    why: The text says a random error would cancel while these deviate in the same direction, so averaging
      leaves the bias in place.
    trap: A gives the result that would follow if the errors were random.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «deviate» most nearly mean?
    target: deviate
    options:
    - wander without aim
    - behave improperly
    - depart from the truth
    - return to an average
    key: C
    moves:
      A: near_miss
      B: imported
      D: wrong_direction
    why: The word describes judgments that all miss in the same direction for the same reason, so
      it names the departure from the correct value.
    trap: A makes the departure aimless when the sentence makes it uniform.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the list of checklists and standard forms?
    options:
    - It defines availability for a reader
    - It gives the remedies the systematic error allows
    - It reports the year the first account appeared
    - It argues that people are simply irrational
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The list follows the claim that the mistake can be anticipated and designed around and names
      three devices that exist for that purpose.
    trap: D settles a question the next sentence says is still open.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 calls the base rate error one of a family. Based on Text 2, which choice best describes
      the error itself?
    sibling: SOC-S10-L1
    sibling_gloss: Text 2 is passage 50 of this book. It reports a problem on which most of sixty
      doctors answered ninety-five percent where the right answer was about two, and says the five
      percent figure is vivid while the one in a thousand figure is not.
    options:
    - A rare condition is forgotten beside a vivid rate
    - A test that never misses a case was used
    - Sixty doctors were asked a short question
    - Screening programs are designed around the arithmetic
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: Text 2 says the five percent figure is vivid and the one in a thousand figure is not, so
      the second gets dropped.
    trap: B names a feature of the test rather than the error in reading it.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Availability is the second, and it means judging how common something is by how easily
      examples come to mind. ___ deaths from causes that make the news are overestimated by large
      factors.
    options:
    - By contrast,
    - As a result,
    - In other words,
    - For instance,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: restatement
    why: The second sentence gives a case of the rule just defined, so the transition must mark an
      example.
    trap: B makes the overestimate follow from the definition rather than illustrate it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The base rate error is one of a family ___ and the family members have been demonstrated
      often enough to be predictable.
    options:
    - family and
    - family, and
    - family; and
    - family and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the family members being demonstrated is independent, so the conjunction
      joining it to the clause about the base rate error takes a comma.
    trap: A runs the clause about the error straight into the clause about the family members.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what makes these patterns useful rather than entertaining.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what makes these patterns useful rather than entertaining
    notes:
    - The three effects are anchoring, availability and framing.
    - A random error would cancel over many judgments.
    - These all deviate in the same direction for the same reason.
    - The mistake can be anticipated and designed around.
    options:
    - The three effects are anchoring, availability and framing
    - A random error would cancel over many judgments
    - The mistake can be anticipated and designed around
    - Because the errors all lean the same way, a procedure can be built to catch them
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the common direction of the errors to the possibility of building
      something that allows for them.
    trap: C names the remedy without the property that makes it available.
