  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Income inequality responds to wages, taxes and transfers within a few years of any change
      to them. ___ wealth inequality responds over decades.
    options:
    - As a result,
    - For instance,
    - By contrast,
    - In other words,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
