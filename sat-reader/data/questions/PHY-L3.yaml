# Physical Science level 3 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: PHY
level: 3
sets:
- id: PHY-S01-L3
  summary_ar:
    khulasa: القراءة على ميزان مختبري لا تعني شيئًا بذاتها، والذي يجعلها تعني شيئًا هو قابلية التتبّع،
      أي سلسلة مقايسات غير مقطوعة تربط الآلة بمعيار وطني. فالميزان يُقاس إلى كتلة مرجعية مُصدَّقة
      بمقايسة بمعيار أعلى، وتلك صُدّقت بأحسن منها عند خدمة معايرة.
    maana: المعنى أنّ كلّ حلقة في تلك السلسلة تضيف قدرًا من الارتياب، وأنّ مغزى الترتيب كلّه هو أن
      تكون الإضافات معلومة مسجّلة. فشهادة الكتلة المرجعية تذكر قيمتها وارتيابها، ومن أراد أن يعاير
      آلة بها ورث الأمرين معًا.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: أسطوانة البلاتين كشفت ضعف تعريف
      الوحدة بجسم، فقد أظهرت مقايسات قرن كامل أنّ الكيلوغرام الرسميّ ونسخه يتباعد بعضها عن بعض بعشرات
      الميكروغرامات، ولم يقدر أحد على تحديد أيّها تغيّر.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الفقرة وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب القراءة معنى قائمًا بذاته، مع أنّ النصّ ينفي ذلك في أوّل جملة.
      ويقترن المقطع بالمقطع الحادي والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Four of the seven base units were redefined on one day
    - A reading means something only through a chain of comparisons
    - A laboratory balance means something by itself
    - Reference masses must be cleaned by a prescribed method
    key: B
    moves:
      A: true_not_asked
      C: wrong_direction
      D: underreach
    why: The text says a reading means nothing by itself and that traceability, an unbroken chain
      of comparisons back to a national standard, is what makes it mean something.
    trap: C denies the opening sentence of the text.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does a certificate for a reference mass state?
    options:
    - The method by which it must be cleaned
    - The vault in Paris where it is kept
    - The constant of nature that defines it
    - Its value and its uncertainty together
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: The text says a certificate states the value of the mass and its uncertainty, and that anyone
      calibrating an instrument against it inherits both.
    trap: A names part of the standard rather than what the certificate reports.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that defining a unit by an
      object has a weakness?
    claim: defining a unit by an object has a weakness
    options:
    - «the official kilogram and its official copies were drifting apart by tens of micrograms, and
      nobody could say which had changed»
    - «Every link in that chain adds a little uncertainty, and the whole point of the arrangement
      is that the additions are known and recorded»
    - «Four of the seven base units were redefined on the same day for the same reason»
    - «The arrangement is less convenient and very much harder to lose»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: near_miss
    why: The quotation reports the official kilogram and its copies drifting apart with no way to
      say which had moved, which is the weakness of an object as a definition.
    trap: D praises the replacement rather than naming the fault in the old scheme.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A certificate for a reference mass states its value and its uncertainty, and anyone who
      wants to calibrate an instrument against it inherits both. A result from that instrument is
      therefore ___
    options:
    - free of the uncertainty of the chain above it
    - certified by the vault in Paris directly
    - no better than the chain behind it
    - exact once the balance has been cleaned
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: overreach
    why: Each link adds uncertainty and the user inherits what the certificate states, so a reading
      carries the accumulated uncertainty of everything above it.
    trap: A discards the inherited uncertainty that the same sentence hands over.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «calibrate» most nearly mean?
    target: calibrate
    options:
    - adjust for comfort
    - set against a known standard
    - read with great care
    - certify as exact
    key: B
    moves:
      A: imported
      C: near_miss
      D: overreach
    why: The sentence speaks of calibrating an instrument against a certified reference mass, so the
      word names setting it by a known standard.
    trap: D promises exactness where the certificate supplies an uncertainty.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph about the platinum cylinder?
    options:
    - It shows the chain failing at its highest link
    - It introduces the reference mass for the first time
    - It concedes that traceability is of no use
    - It reports the method by which masses are cleaned
    key: A
    moves:
      B: detail_swap
      C: overreach
      D: detail_swap
    why: The cylinder sat at the top of the chain, and the text reports the official kilogram and
      its copies drifting apart with nobody able to say which had changed.
    trap: C discards the whole arrangement over a fault in one of its parts.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 describes a chain of comparisons. Based on Text 2, what would be added to that description?
    sibling: PHY-S01-L2
    sibling_gloss: Text 2 is passage 71 of this book. It distinguishes random error, which averaging
      reduces, from systematic error, which is identical in every reading and is found only by comparison
      with something independent.
    options:
    - A certificate states a value and an uncertainty
    - Every link in the chain adds a little uncertainty
    - Averaging many readings would remove the chain entirely
    - The name for the error the chain is built to catch
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 says a systematic error is found only by comparison with something independent, which
      is exactly what each link of the chain in Text 1 supplies.
    trap: B repeats a feature of the chain that Text 1 has already stated.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: The chain also has to be maintained, because masses change. ___ they gain a film of contamination,
      lose material to handling, and must be cleaned by a prescribed method.
    options:
    - By contrast,
    - Even so,
    - In particular,
    - In conclusion,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: restatement
    why: The second sentence names the ways masses change that the first refers to in general, so
      the transition must point to particulars.
    trap: B sets the contamination against the claim that masses change.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: A reading on a laboratory balance means nothing by itself ___ and what makes it mean
      something is an unbroken chain of comparisons.
    options:
    - itself, and
    - itself and
    - itself; and
    - itself and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about what gives the reading meaning is independent, so the conjunction joining
      it to the clause about meaning nothing takes a comma.
    trap: B leaves the clause about the reading and the clause about the chain unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the kilogram was redefined. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why the kilogram was redefined
    notes:
    - The national standard was compared against a platinum cylinder kept in a vault.
    - Comparisons across a century showed the official kilogram and its copies drifting apart.
    - Nobody could say which of them had changed.
    - The unit is now fixed by assigning an exact value to a constant of nature.
    options:
    - The national standard was compared against a cylinder kept in a vault
    - The unit is now fixed by assigning a value to a constant of nature
    - The cylinder and its copies drifted apart with no way to tell which had moved, so the unit was
      tied to a constant instead
    - Comparisons across a century showed a drift of tens of micrograms
    key: C
    moves:
      A: underreach
      B: true_not_asked
      D: underreach
    why: Only this choice joins the drift and the impossibility of attributing it to the change of
      definition, which is the reason the goal asks for.
    trap: D reports the drift without saying why it forced a new definition.
- id: PHY-S02-L3
  summary_ar:
    khulasa: الجاذبية أضعف القوى بفارق هائل، وقياس شدّتها بين جسمين عاديين صعب بقدر ذلك. وقد فعله
      هنري كافندش سنة ألف وسبعمئة وثمان وتسعين بميزان الفتل، أي عارضة معلّقة على ليف رقيق يلتوي بمقدار
      يُقاس تحت قوّة ضئيلة.
    maana: المعنى أنّ كرتين صغيرتين من الرصاص عُلّقتا من طرفي عارضة خشبية طولها ستّ أقدام، وقُرّبت
      منهما كرتان كبيرتان وزن كلّ منهما نحو ثلاثمئة وخمسين رطلًا، فدارت العارضة كسرًا من الدرجة. والتجربة
      كلّها درس في ضبط الخطأ.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: أُغلق الجهاز في صندوق في غرفة
      مُوصدة، ورصد كافندش العارضة بمنظار من الخارج لئلّا تُحدث حرارة بدنه تيّارات هواء، وعُوّلت استدارة
      الليف بتوقيت تذبذب العارضة الحرّ، ونُقلت الكرتان الكبيرتان إلى الجهة الأخرى ليتقاصّ أيّ تحيّز
      ثابت.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الجملة التي تمهّد لقائمة وعن
      معنى كلمة في سياقها. والفخّ المتوقّع هنا أن يُنسب إلى كافندش إبلاغُ الثابت، مع أنّ النصّ ينفي
      ذلك. ويقترن المقطع بالمقطع الثاني والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Cavendish reported the gravitational constant in his paper
    - Modern versions use laser readout and better fibers
    - The experiment is remembered for its control of error
    - Gravity is the weakest force by an enormous margin
    key: C
    moves:
      A: wrong_direction
      B: underreach
      D: underreach
    why: The text calls the whole experiment a study in the control of error and then lists the shutters,
      the telescope, the timed oscillation and the reversal of the spheres.
    trap: A contradicts the text, which says he did not report the constant.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why did Cavendish observe from outside the room?
    options:
    - So that his body heat would not stir the air
    - So that the fiber would twist more freely
    - So that the large spheres could be moved
    - So that the telescope could be calibrated
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says the apparatus was enclosed in a shuttered room and Cavendish observed through
      a telescope from outside so that his body heat would not set up air currents.
    trap: C names a separate step of the method rather than the reason for the telescope.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the difficulty has not
      been removed by better equipment?
    claim: the difficulty has not been removed by better equipment
    options:
    - «The twisting of the fiber was calibrated by timing the free oscillation of the beam»
    - «Published values still disagree with one another by more than their stated uncertainties, which
      means somebody has an error nobody has found»
    - «The result gave the density of the Earth to within about one percent of the modern figure»
    - «The measurement remained the most accurate for about a century»
    key: B
    moves:
      A: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation says published values still disagree by more than their uncertainties, which
      means the trouble persists in the modern apparatus as well.
    trap: D reports how long his figure stood rather than the state of the measurement now.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The large spheres were moved from one side to the other and the deflection measured in
      both directions, so that any constant bias canceled. A bias present in only one direction would
      therefore ___
    options:
    - cancel in the same way as a constant one
    - be removed by timing the free oscillation
    - make no difference to the final figure
    - survive the reversal and stay in the result
    key: D
    moves:
      A: wrong_direction
      B: detail_swap
      C: wrong_direction
    why: The reversal removes a bias that is the same in both positions, so one that acts in a single
      direction is not canceled by the procedure.
    trap: A grants the reversal a power the text limits to a constant bias.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «empirical» most nearly mean?
    target: empirical
    options:
    - imperial in scale
    - approximate rather than exact
    - belonging to measurement itself
    - left over from an earlier age
    key: C
    moves:
      A: imported
      B: near_miss
      D: imported
    why: The text speaks of the empirical difficulty Cavendish faced, that the force is tiny and everything
      in the room pulls, so the word names a difficulty of measuring.
    trap: B reads the word as a comment on precision rather than on the kind of difficulty.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence calling the work a study in error?
    options:
    - It introduces the torsion balance for the first time
    - It announces what the following sentences will list
    - It concedes that the result was never trustworthy
    - It reports the weight of the large lead spheres
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence comes before the shutters, the telescope, the timing and the reversal, each
      of which is one of the controls it promises.
    trap: C denies a figure the text says stood for a century.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a measurement of the weakest force. Based on Text 2, what would be added
      to that report?
    sibling: PHY-S02-L2
    sibling_gloss: Text 2 is passage 72 of this book. It explains that braking force is roughly proportional
      to the weight on the tires, that kinetic energy rises with the square of speed, and that reaction
      distance is proportional to speed alone.
    options:
    - What the same force does at the scale of a road
    - The experiment used a beam hung on a thin fiber
    - Gravity is the weakest of the forces by a margin
    - A torsion balance measures the stopping distance of a truck
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 works with the weight pressing a tire onto a road, which is the same pull that Text
      1 has to shield from air currents to detect at all.
    trap: B repeats the apparatus that Text 1 has already described.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Cavendish did not report the constant, which was not a quantity anyone used at the time.
      ___ his paper is titled as an experiment to determine the density of the Earth.
    options:
    - By contrast,
    - Even so,
    - For example,
    - Accordingly,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: near_miss
    why: The title follows from his not treating the constant as his subject, so the transition must
      mark a consequence rather than a contrast or an example.
    trap: B sets the title against the omission that explains it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Two small lead spheres hung from the ends of a six-foot wooden beam ___ two large lead
      spheres were brought up beside them.
    options:
    - beam, two
    - beam. Two
    - beam two
    - beam, and, two
    key: B
    moves:
      A: comma_splice
      C: run_on
      D: misplaced
    why: The clause about the large spheres being brought up is a complete sentence, so a period separates
      it from the clause about the small ones.
    trap: A splices the clause about the large spheres onto the clause about the beam.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the constant is still poorly known. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why the constant is still poorly known
    notes:
    - Gravity is the weakest force by an enormous margin.
    - The force is tiny, and everything in the room pulls.
    - Modern versions use the same principle with better fibers and laser readout.
    - Published values still disagree by more than their stated uncertainties.
    options:
    - Gravity is the weakest of the forces by an enormous margin
    - Modern versions use better fibers and a laser readout
    - The force is tiny, and everything in the room pulls on it
    - The pull is tiny and everything nearby adds to it, so modern values still disagree by more than
      they claim
    key: D
    moves:
      A: underreach
      B: true_not_asked
      C: underreach
    why: Only this choice joins the difficulty of the measurement to the present disagreement among
      published figures, which together answer the goal.
    trap: C names the difficulty without reporting what it still does to the numbers.
- id: PHY-S03-L3
  summary_ar:
    khulasa: رقم المردود لا يمكن ذكره قبل أن يختار أحد حدًّا للنظام، أي الخطّ المرسوم حول ما يُقاس،
      فيُحسب كلّ ما يعبره. ضع الحدّ عند أطراف محرّك كهربي فالمردود نحو خمسة وتسعين في المئة؛ وضعه
      عند سور محطّة التوليد فالرقم للمحرّك نفسه وللعمل نفسه يهبط إلى نحو أربعين.
    maana: المعنى أنّ وضعه عند منجم الفحم يهبط به مرّة أخرى، وليس واحد من هذه الأرقام خاطئًا، بل تجيب
      أسئلة مختلفة، والخلاف المعتاد في أيّ تقنية للطاقة خلافٌ في موضع الخطّ. فالسيّارة الكهربية لا
      عادم لها، فداخل حدّ مرسوم عند السيّارة لا تُطلق شيئًا.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: والعلم الذي يأخذ هذا بجدّية
      هو تحليل دورة الحياة، أي حساب يتبع الطاقة والموادّ من الاستخراج إلى الصنع إلى الاستعمال إلى
      التخلّص، وضعفه أنّ نتيجته متعلّقة بافتراضات غير قابلة للقياس.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الحالات الثلاث وعن معنى كلمة
      في سياقها. والفخّ المتوقّع هنا أن يُحسب أحد الأرقام خاطئًا، مع أنّ النصّ يقول إنّ أيًّا منها
      ليس خاطئًا. ويقترن المقطع بالمقطع الثالث والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Standards bodies publish rules for drawing the boundary
    - One of the three efficiency figures for a motor is wrong
    - An electric vehicle emits nothing at all
    - An efficiency figure depends on where the line is drawn
    key: D
    moves:
      A: underreach
      B: wrong_direction
      C: wrong_direction
    why: The text says a figure cannot be stated until somebody chooses a boundary, gives three figures
      for one motor, and says none of them is wrong.
    trap: B denies the text, which says not one of those numbers is wrong.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what is the weakness of a life cycle analysis?
    options:
    - It cannot follow a product as far as disposal
    - It rests on assumptions that cannot be measured
    - It draws the boundary at the terminals of a motor
    - It is forbidden by the standards bodies
    key: B
    moves:
      A: wrong_direction
      C: detail_swap
      D: imported
    why: The text says its weakness is that the result depends on assumptions that are not themselves
      measurable, such as how long the product lasts.
    trap: A denies the reach that the definition of the method claims.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a small-looking choice
      can decide the whole result?
    claim: a small-looking choice can decide the whole result
    options:
    - «Put it at the power station fence and the figure for the same motor doing the same work falls
      to around forty»
    - «An electric vehicle has no tailpipe, so inside a boundary drawn at the car it emits nothing
      at all»
    - «a difference between them that looks negligible in the summary can turn out to be the whole
      argument once the assumptions are printed»
    - «The rules make studies comparable with each other without making any of them true»
    key: C
    moves:
      A: near_miss
      B: true_not_asked
      D: near_miss
    why: The quotation says a difference that looks negligible in a summary can turn out to be the
      whole argument once the assumptions are printed.
    trap: A shows the boundary changing a number rather than a small choice deciding an argument.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Drawn wider still, to include the mining of lithium and the manufacture of the battery,
      it acquires a debt before it has moved, and that debt is repaid over some number of miles. A
      comparison of two vehicles therefore ___
    options:
    - has to state the mileage it assumes
    - is settled by the absence of a tailpipe
    - is independent of where the boundary sits
    - depends only on the mining of the lithium
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: detail_swap
    why: The debt is repaid over a number of miles that depends on everything inside the boundary,
      so a comparison means nothing until that distance is declared.
    trap: C denies the dependence on the boundary that the whole text establishes.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «negligible» most nearly mean?
    target: negligible
    options:
    - careless in its method
    - left out on purpose
    - open to challenge
    - too small to matter
    key: D
    moves:
      A: imported
      B: near_miss
      C: imported
    why: The text says a difference that looks negligible in the summary can turn out to be the whole
      argument, so the word names one that appears too small to matter.
    trap: B reads the word as a deliberate omission rather than an apparent smallness.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the three boundaries drawn around a motor?
    options:
    - They introduce the electric vehicle for the first time
    - They concede that efficiency cannot be measured at all
    - They show one object carrying three different figures
    - They report the rules the standards bodies publish
    key: C
    moves:
      A: detail_swap
      B: overreach
      D: detail_swap
    why: The terminals, the station fence and the coal mine each give a different number for the same
      motor doing the same work, and the text says not one is wrong.
    trap: B denies the measurement that each of the three boundaries supplies.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 argues about where the boundary belongs. Based on Text 2, what would be added to
      that argument?
    sibling: PHY-S03-L2
    sibling_gloss: Text 2 is passage 73 of this book. It explains that efficiencies multiply along
      a chain, reports that a modern coal plant turns about forty percent of its fuel into electricity,
      and warns against judging a technology by its last step.
    options:
    - A figure at the terminals is higher than one at the fence
    - The arithmetic that makes the wider boundary so much worse
    - Not one of the three figures for the motor is wrong
    - A coal plant turns ninety-five percent of its fuel into power
    key: B
    moves:
      A: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 shows the efficiencies of the stages multiplying rather than adding, which is why
      the figure falls so sharply as the boundary widens in Text 1.
    trap: A repeats the comparison Text 1 draws between two of its own boundaries.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Not one of those numbers is wrong. ___ they answer different questions, and the usual
      dispute about any energy technology is a dispute about where the line should sit.
    options:
    - Rather,
    - Likewise,
    - For instance,
    - In conclusion,
    key: A
    moves:
      B: wrong_direction
      C: near_miss
      D: restatement
    why: The second sentence says what the three figures do in place of being wrong, so the transition
      must mark a substitution rather than a likeness.
    trap: C treats the general account of the figures as one example among others.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Put it at the power station fence and the figure falls to around forty ___ put it at
      the coal mine and it falls again.
    options:
    - forty, put
    - forty put
    - forty. Put
    - forty, and, put
    key: C
    moves:
      A: comma_splice
      B: run_on
      D: misplaced
    why: The clause about the coal mine is a complete sentence, so a period separates it from the
      clause about the power station fence.
    trap: A splices the clause about the mine onto the clause about the fence with a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why two careful studies can disagree by a factor of two. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why two careful studies can disagree by a factor of two
    notes:
    - Life cycle analysis follows energy and materials from extraction to disposal.
    - Its result depends on assumptions that are not themselves measurable.
    - Those assumptions include how long the product lasts and what it displaces.
    - Two careful studies of the same object can differ by a factor of two.
    options:
    - The method follows the whole chain but rests on unmeasurable assumptions about lifetime and
      displacement, which two teams may set differently
    - Life cycle analysis follows energy and materials from extraction to disposal
    - Its result depends on assumptions that are not themselves measurable
    - Two careful studies of the same object can differ by a factor of two
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice names the unmeasurable assumptions and the freedom two teams have in setting
      them, which is what opens the gap the goal asks about.
    trap: C names the dependence without saying which assumptions two teams could differ over.
- id: PHY-S04-L3
  summary_ar:
    khulasa: 'في الأربعينيات من القرن التاسع عشر مضى جيمس جول يبيّن أنّ العمل والحرارة صورتان لشيء
      واحد، والتجربة التي يُذكر بها بسيطة التصوّر بسطًا يقارب العبث: ثقل ساقط يدير دولاب تجديف داخل
      وعاء نحاسي محكم فيه ماء، فيُحرَّك الماء ويدفأ، وقاس جول كم دفئ.'
    maana: المعنى أنّ معرفة الثقل والمسافة التي سقطها تعطي العمل المبذول، ومعرفة كتلة الماء وارتفاع
      حرارته تعطي الحرارة المنتجة، والنسبة بينهما هي المكافئ الميكانيكي للحرارة. والصعوبة كانت كلّها
      في الدقّة، فارتفاع الحرارة في الجرية الواحدة كسر من الدرجة.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: أعاد جول التجربة بالزئبق بدل
      الماء، وبدفع الماء في أنابيب، وبضغط الهواء، فحصل على أرقام متقاربة بثلاث طرائق غير مترابطة،
      والمغزى الأوسع أنّها أسقطت صنفًا كاملًا.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الفقرة الختامية وعن معنى كلمة
      في سياقها. والفخّ المتوقّع هنا أن يُقال إنّ ارتفاع الحرارة كان درجة كاملة، مع أنّ النصّ يقول
      إنّه كسر من الدرجة. ويقترن المقطع بالمقطع الرابع والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - A simple experiment pressed to high precision removed a category
    - Joule measured the rise in temperature to a whole degree
    - He attempted the measurement on his honeymoon with a waterfall
    - Thermometers could be read to a two-hundredth of a degree
    key: A
    moves:
      B: wrong_direction
      C: true_not_asked
      D: underreach
    why: The text calls the conception absurdly simple, says the difficulty was entirely in the precision,
      and reports that the work left one quantity where there had been two.
    trap: B contradicts the text, which says the rise was a fraction of a degree.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what three further routes did Joule take to the same figure?
    options:
    - Water, a waterfall and a steam engine
    - Mercury, a paddle wheel and a sealed vessel
    - Mercury, water forced through tubes and compressed air
    - Water, a falling weight and a thermometer
    key: C
    moves:
      A: imported
      B: detail_swap
      D: detail_swap
    why: The text says he repeated the experiment with mercury instead of water, by forcing water
      through tubes, and by compressing air, and obtained close figures by three unrelated routes.
    trap: B names parts of the original apparatus rather than the later routes.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the result changed the
      way a quantity was counted?
    claim: the result changed the way a quantity was counted
    options:
    - «A falling weight turned a paddle wheel inside a sealed copper vessel of water»
    - «He corrected for the heat the vessel itself absorbed, for the heat leaking through the walls»
    - «Joule reported the figure to four significant digits in 1850, and the modern value differs
      from it by less than one percent»
    - «Afterward there was one quantity, energy, measured in one unit, and a bookkeeping rule that
      applies to a steam engine and a stirred bucket alike»
    key: D
    moves:
      A: true_not_asked
      B: true_not_asked
      C: near_miss
    why: The quotation says that afterward there was one quantity in one unit with one bookkeeping
      rule, which is the change in counting that the claim names.
    trap: C reports how accurate the figure was rather than what it altered.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Before Joule, heat was widely treated as a substance that could be transferred but not
      created, and any amount produced by rubbing had to be attributed to something being squeezed
      out. A paddle wheel warming water therefore ___
    options:
    - confirmed that heat is a substance after all
    - left the older account with nothing to squeeze
    - measured the heat leaking through the walls
    - produced too little warming to be measured
    key: B
    moves:
      A: wrong_direction
      C: detail_swap
      D: wrong_direction
    why: The older account needed a store of heat to be pressed out of something, and stirring water
      supplies no such store, so the account has nothing left to draw on.
    trap: A reads the stirred water as evidence for the view it undermines.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «attributed» most nearly mean?
    target: attributed
    options:
    - explained as coming from
    - credited to a person
    - measured against a scale
    - given as a property
    key: A
    moves:
      B: imported
      C: near_miss
      D: near_miss
    why: Heat produced by rubbing had to be attributed to something being squeezed out, so the word
      names assigning it a source.
    trap: B takes the sense used of an author rather than of a cause.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph on the wider significance?
    options:
    - It introduces the mechanical equivalent of heat
    - It concedes that the ratio was never established
    - It reports the precision of the thermometers used
    - It says what the measurement cost the older account
    key: D
    moves:
      A: detail_swap
      B: wrong_direction
      C: detail_swap
    why: The paragraph reports that heat had been treated as a substance and that afterward there
      was one quantity, energy, with a single bookkeeping rule.
    trap: C names the apparatus rather than the change in the account of heat.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a measurement that joined work and heat. Based on Text 2, what would be added
      to that report?
    sibling: PHY-S04-L2
    sibling_gloss: Text 2 is passage 74 of this book. It states the relation among pressure, volume
      and absolute temperature, works through four cases, and explains why dry rising air cools about
      ten degrees for every thousand meters.
    options:
    - Work and heat are two forms of the same thing
    - Joule corrected for the heat leaking through the walls
    - A case where the work shows up as cooling instead
    - The gas relation was established by the paddle wheel
    key: C
    moves:
      A: restatement
      B: restatement
      D: wrong_direction
    why: Text 2 has rising air cooling because it does work on the air around it, which is the same
      equivalence that Text 1 measures running the other way.
    trap: A repeats the conclusion Text 1 sets out to establish.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: The temperature rise in a single run was a fraction of a degree. ___ Joule had thermometers
      made that could be read to a two-hundredth.
    options:
    - Even so,
    - For that reason,
    - By contrast,
    - In other words,
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: restatement
    why: The special thermometers follow from the smallness of the rise, so the transition must mark
      a consequence rather than a contrast or a concession.
    trap: A sets the thermometers against the smallness that called for them.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The water was stirred, it warmed ___ and Joule measured how much.
    options:
    - warmed; and
    - warmed and
    - 'warmed: and'
    - warmed, and
    key: D
    moves:
      A: wrong_mark
      B: run_on
      C: wrong_mark
    why: The clause about Joule measuring the rise is independent, so the conjunction joining it to
      the clause about the warming takes a comma before it.
    trap: B leaves the clause about the warming and the clause about the measuring unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why three further routes mattered. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why three further routes mattered
    notes:
    - A falling weight turned a paddle wheel in a sealed vessel of water.
    - He repeated the work with mercury, with water forced through tubes and by compressing air.
    - The three routes gave figures close to one another.
    - The difficulty was entirely in the precision.
    options:
    - A falling weight turned a paddle wheel in a sealed vessel
    - Three unrelated arrangements gave figures close to each other, so the number did not belong
      to one apparatus
    - He repeated the work with mercury and with compressed air
    - The difficulty of the experiment was entirely in the precision
    key: B
    moves:
      A: true_not_asked
      C: underreach
      D: underreach
    why: Only this choice says the agreement among unrelated arrangements is what frees the figure
      from the particular apparatus that produced it.
    trap: C lists two of the routes without saying what their agreement establishes.
- id: PHY-S05-L3
  summary_ar:
    khulasa: شبكة الكهرباء لا تقدر على تخزين ما يُذكر، فلا بدّ أن يطابق التوليدُ الاستهلاكَ على الدوام.
      والقياس الذي يكشف أيّ اختلال هو ترداد الشبكة، أي معدّل انعكاس التيّار المتردّد، وكلّ مولّد كبير
      على الشبكة يدور متساوقًا مع غيره.
    maana: المعنى أنّ الطلب إذا زاد على العرض طُلب من المولّدات أكثر مما تناله من بخار أو ماء، فتبطئ
      قليلًا جدًّا، فيهبط التردادُ تحت قيمته المقرّرة. فذلك الرقم الواحد قراءة متّصلة لتوازن قُطر
      كامل، وغرف التحكّم تتصرّف عند انحرافات من مئات الدورة.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: سرعة حركة الترداد تحكمها القصورية،
      أي الطاقة الدورانية المخزونة في الآلات الكبيرة، فتعمل عمل دولاب الموازنة وتبطئ أيّ تغيّر؛ وشبكة
      ممدودة بالإلكترونيات أقلّ خزنًا لتلك الحركة.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الفقرة وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ الشبكة تخزّن ما يكفي لتغطية الاختلال، مع أنّ النصّ ينفي ذلك.
      ويقترن المقطع بالمقطع الخامس والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The frequency archive for several grids is published
    - One number reports the balance of a whole country at once
    - A grid can store enough electricity to cover a mismatch
    - Laboratories have used the method in criminal cases
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: underreach
    why: The text says a grid can store nothing worth mentioning, that the frequency falls when demand
      exceeds supply, and that the number is a continuous readout of the balance.
    trap: C denies the opening sentence about what a grid can store.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what governs how fast the frequency moves?
    options:
    - The deviation the control room will accept
    - The number of cycles a second in the country
    - The completeness of the published archive
    - The stored rotational energy of the large machines
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: imported
    why: The text says the rate at which the frequency moves is governed by inertia, the stored rotational
      energy of the large spinning machines.
    trap: A names what a control room acts on rather than what sets the rate.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a measurement can acquire
      a use nobody intended?
    claim: a measurement can acquire a use nobody intended
    options:
    - «A measurement maintained for the purpose of keeping lights on turns out to double as a clock
      that nobody designed»
    - «Because frequency wanders by tiny amounts in a pattern that is the same everywhere on a synchronous
      network»
    - «Laboratories have used the method in criminal cases»
    - «Its forensic use has been challenged on the ground that the archives themselves are not always
      complete»
    key: A
    moves:
      B: true_not_asked
      C: near_miss
      D: near_miss
    why: The quotation says a measurement kept for the sake of the lights doubles as a clock that
      nobody designed, which is the unintended use the claim names.
    trap: D reports an objection to that use rather than the use itself.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A grid supplied largely through electronics, as solar and wind are, has less of this
      stored motion, and the frequency can move faster than human operators can respond. Such a grid
      therefore ___
    options:
    - needs no reserves of any kind
    - cannot be balanced at all
    - has to be balanced by automatic means
    - runs at a lower nominal frequency
    key: C
    moves:
      A: wrong_direction
      B: overreach
      D: detail_swap
    why: If the frequency can move faster than an operator can respond, the correction has to be made
      by something that does not wait for a person.
    trap: B turns a need for faster reserves into an impossibility.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «salient» most nearly mean?
    target: salient
    options:
    - projecting outward
    - prominent and central
    - recently invented
    - easily overlooked
    key: B
    moves:
      A: imported
      C: near_miss
      D: wrong_direction
    why: Fast automatic reserves are said to have become a salient part of system design, so the word
      names a part that now stands out as central.
    trap: D reverses the sense, since the reserves have come to the front of the design.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph on mains hum?
    options:
    - It turns from the designed use to an accidental one
    - It introduces the idea of inertia for the first time
    - It argues that the frequency record is unreliable
    - It reports the deviations a control room acts on
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The paragraph follows the account of balancing a grid and describes dating an audio file
      against the archive, which is a use the measurement was not kept for.
    trap: C states the objection that only the closing sentence raises.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reads the balance of a grid from one number. Based on Text 2, what would be added
      to that reading?
    sibling: PHY-S05-L2
    sibling_gloss: Text 2 is passage 75 of this book. It derives the heating in a conductor as the
      current squared times the resistance and explains why electricity is sent across country at
      very high voltage.
    options:
    - The frequency falls when demand exceeds supply
    - Control rooms act on deviations of a few hundredths
    - Frequency decides how much power a line can lose
    - What happens to the power between generator and user
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 accounts for the losses in the lines that carry the power, which is the part of the
      system that the frequency in Text 1 says nothing about.
    trap: A repeats the central fact Text 1 is built on rather than adding to it.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A grid with many heavy turbines is forgiving. ___ a grid supplied largely through electronics
      has less of this stored motion.
    options:
    - Likewise,
    - As a result,
    - By contrast,
    - In short,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
    why: The second sentence sets the electronic grid against the forgiving one just described, so
      the transition must mark the opposition between them.
    trap: A treats the two kinds of grid as behaving alike.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: An electricity grid cannot store anything worth mentioning ___ so generation must match
      consumption continuously.
    options:
    - mentioning, so
    - mentioning so
    - mentioning; so
    - mentioning so,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about generation matching consumption is independent, so the conjunction joining
      it to the clause about storage takes a comma before it.
    trap: B leaves the clause about storage and the clause about generation unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a change in the mix of generators changes the design. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a change in the mix of generators changes the design
    notes:
    - The rate at which the frequency moves is governed by stored rotational energy.
    - A grid with many heavy turbines is forgiving.
    - A grid supplied through electronics has less of that stored motion.
    - The frequency can then move faster than human operators can respond.
    options:
    - A grid with many heavy turbines is a forgiving one to run
    - The rate of change is governed by stored rotational energy
    - Electronics carry less stored motion, so the frequency can move faster than an operator and
      the reserves must be automatic
    - The frequency can move faster than human operators can respond
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice runs from the missing stored motion to the speed of the change and on to
      the kind of reserve a design now needs.
    trap: B names the governing quantity without saying what a change in it requires.
- id: PHY-S06-L3
  summary_ar:
    khulasa: أنّ الضوء يستغرق وقتًا في السير ثبت قبل أن يقدر أحد على قياس ذلك الوقت. فقد لاحظ أوله
      رومر سنة ألف وستّمئة وستّ وسبعين أنّ خسوف قمر من أقمار المشتري يتأخّر إذا بعدت الأرض، فاستنتج
      أنّ للضوء سرعة منتهية، وذلك خلاف الرأي العامّ حينها.
    maana: المعنى أنّ أوّل قياس أرضي كان سنة ألف وثمانمئة وتسع وأربعين، حين أرسل هيبوليت فيزو شعاعًا
      في فُرَج دولاب مسنّن سريع الدوران إلى مرآة على خمسة أميال ورجع، فعند السرعة المناسبة ارتدّ الضوء
      على السنّ التالي فاختفى، فأعطى زمن طيران من قياس دوران فحسب.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: صار الحدّ بحلول العشرينيات لا
      في التوقيت بل في المسافة، لأنّ طول خطّ الأساس الطويل لا يُقاس بدقّة التوقيت، ولذلك حُلّت المسألة
      بالإذابة لا بالحلّ، فأُعيد تعريف المتر.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الجملة التي تسمّي الحدّ وعن
      معنى كلمة في سياقها. والفخّ المتوقّع هنا أن يُقال إنّ المختبرات ما زالت تقيس سرعة الضوء، مع
      أنّ النصّ ينفي ذلك. ويقترن المقطع بالمقطع السادس والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Romer inferred a finite speed from eclipses in 1676
    - Laboratories still measure the speed of light directly
    - A measured constant was turned into the standard for measuring
    - Fizeau used a toothed wheel and a mirror five miles away
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: underreach
    why: The text traces the measurement from Romer to Michelson and then says the problem was dissolved
      in 1983 by making the speed exact and the meter depend on it.
    trap: B denies the text, which says the question of measuring it does not arise.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what became the limiting factor by the 1920s?
    options:
    - The length of the long baseline
    - The timing of the returning light
    - The speed of the rotating mirror
    - The fraction of a second chosen
    key: A
    moves:
      B: wrong_direction
      C: detail_swap
      D: imported
    why: The text says the limit was no longer the timing but the distance, because the length of
      a long baseline could not be measured as precisely as the time.
    trap: B names the thing the text says had stopped being the limit.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the trouble was removed
      by a decision rather than an experiment?
    claim: the trouble was removed by a decision rather than an experiment
    options:
    - «Albert Michelson spent decades on it, using rotating mirrors over longer baselines»
    - «That is why the problem was eventually dissolved rather than solved»
    - «What laboratories measure instead is length, by timing light, which is the same experiment
      read backward»
    - «Each redefinition takes a quantity that had been measured and makes it the thing against which
      measurements are made»
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: near_miss
    why: The quotation says the problem was dissolved rather than solved, which is exactly the difference
      between a decision and a measurement.
    trap: C describes what laboratories do now rather than how the trouble was removed.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A constant of nature became a unit conversion, and the uncertainty moved from the speed
      to the ruler. A laboratory that wants a more precise length must therefore ___
    options:
    - measure the speed of light more carefully
    - wait for the meter to be redefined again
    - use a longer baseline than Michelson did
    - time the light over its path more closely
    key: D
    moves:
      A: wrong_direction
      B: imported
      C: detail_swap
    why: Once the speed is exact by definition, a length is obtained by timing light, so improving
      a length means improving the timing rather than the speed.
    trap: A tries to refine a quantity the text says is now fixed by definition.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «finite» most nearly mean?
    target: finite
    options:
    - very small indeed
    - fixed once and for all
    - limited rather than instant
    - able to be measured
    key: C
    moves:
      A: imported
      B: near_miss
      D: near_miss
    why: Romer concluded that light has a finite speed because the eclipses ran late, so the word
      marks the speed as limited rather than instantaneous.
    trap: D reads the word as a claim about measurability, which the text says came later.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the limit no longer being
      the timing?
    options:
    - It introduces the toothed wheel for the first time
    - It explains why a new definition became attractive
    - It concedes that the speed was never measured
    - It reports the figure reached by the 1920s
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence names the baseline as the new bottleneck, and the next sentence says that is
      why the problem was dissolved rather than solved.
    trap: C denies measurements the text traces across three centuries.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports how the speed of light was pinned down. Based on Text 2, what would be added
      to that report?
    sibling: PHY-S06-L2
    sibling_gloss: Text 2 is passage 76 of this book. It derives reflection, refraction and diffraction
      from the rule that every point on a wavefront acts as a source, and ties the spreading of a
      wave to the size of the gap compared with its wavelength.
    options:
    - What the light does on its way along the baseline
    - Fizeau timed a beam over a known distance and back
    - The meter is now defined in terms of the speed
    - Diffraction fixed the speed of light in 1983
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 explains what a beam does at a surface and at an edge, which is the behavior of the
      light that Text 1 only times from one end of its path to the other.
    trap: B repeats the method that Text 1 has already described.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: The limit was no longer the timing but the distance, because the length of a long baseline
      could not be measured as precisely as the time could. ___ the problem was eventually dissolved
      rather than solved.
    options:
    - By contrast,
    - Even so,
    - For instance,
    - For that reason,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: near_miss
    why: The dissolving of the problem follows from the baseline being the weaker measurement, so
      the transition must mark a consequence rather than a contrast.
    trap: B sets the new definition against the difficulty that produced it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: That light takes time to travel was established before anyone could measure the time
      ___ and Romer argued it from the eclipses of a moon of Jupiter.
    options:
    - time and
    - time, and
    - time; and
    - time and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about Romer arguing it from the eclipses is independent, so the conjunction joining
      it to the clause about the time takes a comma.
    trap: A leaves the clause about the time and the clause about Romer unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why nobody measures the speed of light now. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why nobody measures the speed of light now
    notes:
    - By the 1920s the figure was known to a few parts in a hundred thousand.
    - The limit was no longer the timing but the length of the baseline.
    - In 1983 the meter was redefined as the distance light travels in a stated fraction of a second.
    - The speed is now exact by definition.
    options:
    - By the 1920s the figure was known to a few parts in a hundred thousand
    - The limit was no longer the timing but the length of the baseline
    - The meter was redefined in 1983 in terms of the speed of light
    - The baseline had become the weaker measurement, so the speed was fixed by definition and the
      meter defined from it
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the failing baseline to the decision that made the speed exact, which
      is why the measurement is no longer attempted.
    trap: B names the bottleneck without saying what was done about it.
- id: PHY-S07-L3
  summary_ar:
    khulasa: التصنيف ليس كشفًا، والجدول الدوريّ، وهو ترتيب للعناصر يضع المتشابهة كيميائيًّا في عمود
      واحد، كان يمكن أن يكون مجرّد نظام حفظ. والذي جعله شيئًا آخر أنّ دمتري مندلييف، إذ نشره سنة ألف
      وثمانمئة وتسع وستّين، ترك فيه ثقوبًا.
    maana: 'المعنى أنّ ترتيبه رتّب العناصر المعروفة بالوزن الذرّي ووضع المتشابهة في عمود واحد، فاحتاج
      لإبقاء الأعمدة متّسقة أن يترك ثلاث فُرَج ويُثبت أنّ عناصر توجد لتشغلها. ثمّ فعل ما لا يقدر عليه
      كاتب حفظ: تنبّأ بخصائص العناصر الغائبة من مواضعها.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: عُزل الغاليوم سنة ألف وثمانمئة
      وخمس وسبعين والسكانديوم سنة تسع وسبعين، وطابق الجرمانيوم سنة ستّ وثمانين تنبّؤه للفرجة تحت السيليكون
      مطابقة أعلنها مكتشفه مطبوعة، والجدول الذي يقبل الخطأ يعمل عملًا آخر.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الفقرة التي تذكر العيوب وعن
      معنى كلمة في سياقها. والفخّ المتوقّع هنا أن يُحسب الجدول حفظًا لما عُرف فقط، مع أنّ النصّ يميّزه
      بالتنبّؤ. ويقترن المقطع بالمقطع السابع والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Atomic number replaced atomic weight in the 1910s
    - Mendeleev filed what was known and nothing more
    - Germanium was isolated in 1886 below silicon
    - A table that risked being wrong did more than file
    key: D
    moves:
      A: underreach
      B: wrong_direction
      C: underreach
    why: The text says the holes and the predictions are what made the table more than a filing system,
      and that a table able to be wrong does different work.
    trap: B states the thing the text contrasts his table with.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what did Mendeleev predict for the missing elements?
    options:
    - The count of protons in each nucleus
    - Weight, density, the oxide formula and the look of the metal
    - The year each of them would be isolated
    - The column in which the rare earths belong
    key: B
    moves:
      A: imported
      C: imported
      D: detail_swap
    why: The text says he gave estimates for atomic weight, density, the formula of the oxide and
      the appearance of the metal.
    trap: A names the ordering principle that only arrived decades later.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the table was capable
      of being tested?
    claim: the table was capable of being tested
    options:
    - «His arrangement put the known elements in order of atomic weight and placed chemically similar
      ones in the same column»
    - «He had a pattern and a nerve, and the explanation arrived half a century later»
    - «A table that can be wrong, and is then found to be right, is doing different work from one
      that merely files what is known»
    - «He also predicted elements that do not exist, and insisted for years on an error about the
      position of the rare earths»
    key: C
    moves:
      A: near_miss
      B: true_not_asked
      D: near_miss
    why: The quotation sets a table that can be wrong against one that merely files, which is what
      being capable of a test amounts to.
    trap: D shows the table producing wrong claims rather than the capacity that makes testing possible.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: He then did something a filing clerk could not. He predicted the properties of the missing
      elements from their positions, giving estimates for atomic weight, density, the formula of the
      oxide and the appearance of the metal. A gap in his table was therefore ___
    options:
    - a claim that the next chemist could check
    - a space left for convenience in printing
    - an admission that the columns did not work
    - a prediction about the count of protons
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: detail_swap
    why: Each hole came with estimated properties, so the gap carried a statement that an isolated
      element could either match or fail to match.
    trap: C reads the holes as a failure of the arrangement that produced them.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «discrete» most nearly mean?
    target: discrete
    options:
    - quiet and tactful
    - spread out evenly
    - very small in size
    - separate and countable
    key: D
    moves:
      A: imported
      B: wrong_direction
      C: imported
    why: The text says electrons occupy discrete shells with room for fixed numbers, so the word names
      shells that are separate and can be counted.
    trap: A takes the similar-sounding word about tact rather than the one about separateness.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph on the defects of the table?
    options:
    - It introduces the three gaps for the first time
    - It withdraws the predictions as worthless
    - It balances the successes with what the table got wrong
    - It reports the year germanium was isolated
    key: C
    moves:
      A: detail_swap
      B: overreach
      D: detail_swap
    why: The paragraph follows the three filled gaps and names the misplaced elements, the missing
      explanation and the predictions that came to nothing.
    trap: B discards the predictions that the preceding paragraph reports as confirmed.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a table that made predictions. Based on Text 2, what would be added to that
      report?
    sibling: PHY-S07-L2
    sibling_gloss: Text 2 is passage 77 of this book. It explains that a reaction needs an activation
      barrier crossed first, that heat, concentration, surface area and a catalyst each change a rate,
      and that rate and extent are separate questions.
    options:
    - Similar elements fall in the same column of the table
    - The chemistry that the arrangement was built to organize
    - Three gaps were left and later filled by discovery
    - The table predicted the activation energy of a reaction
    key: B
    moves:
      A: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 works with the reactions whose similarities put the elements in columns, which is
      the behavior the table in Text 1 arranges without explaining.
    trap: A repeats the principle of the arrangement as Text 1 already states it.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A classification is not a discovery, and the periodic table could have been no more than
      a filing system. ___ what made it something else was that Mendeleev left holes in it.
    options:
    - In the event,
    - Likewise,
    - As a result,
    - In conclusion,
    key: A
    moves:
      B: wrong_direction
      C: near_miss
      D: restatement
    why: The second sentence reports what actually happened in place of the mere filing system just
      entertained, so the transition must mark that turn.
    trap: C reads the holes as following from the possibility just raised.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: He then did something a filing clerk could not ___ he predicted the properties of the
      missing elements from their positions.
    options:
    - not, he
    - not he
    - not. He
    - not, and, he
    key: C
    moves:
      A: comma_splice
      B: run_on
      D: misplaced
    why: The clause about predicting the properties is a complete sentence, so a period separates
      it from the clause about the filing clerk.
    trap: A splices the clause about the prediction onto the clause about the clerk with a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a classification can be more than a filing system. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a classification can be more than a filing system
    notes:
    - Mendeleev left three gaps to keep the columns consistent.
    - He predicted the weight, density, oxide and appearance of the missing elements.
    - Germanium matched his prediction for the gap below silicon.
    - A table that can be wrong and is then found right does different work.
    options:
    - By leaving gaps with predicted properties, the table made claims that a later discovery could
      confirm or refute
    - Mendeleev left three gaps to keep the columns consistent
    - Germanium matched his prediction for the gap below silicon
    - A table that can be wrong does different work from one that files
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice names the gaps, the predicted properties and the possibility of refutation
      together, which is what lifts the table above a filing system.
    trap: C gives one confirmation without the structure that made it a test.
- id: PHY-S08-L3
  summary_ar:
    khulasa: 'المادّة ليس لها متانة واحدة: اختبر مئة مكعّب خرسانة متماثلة في الظاهر فتنكسر على مدى،
      لأنّ المتانة متعلّقة بعيوب موزّعة بالقَرعة في المادّة. ولذلك لا يصمّم المهندسون على المتوسّط،
      بل يستعملون المتانة المميّزة، أي قيمة لا يهبط دونها إلّا كسر صغير مذكور من العيّنات.'
    maana: 'المعنى أنّ رقم التصميم يُنقَص بعد ذلك بمعامل سلامة، أي النسبة بين ما يُبنى البناء ليتحمّله
      وما يُتوقّع أن يحمله. وذلك المعامل ليس بدلًا واحدًا عن الجهل، بل يغطّي أمورًا متمايزة: تبدّد
      المادّة، والفرق بين عيّنة مختبر وجدار مصبوب، وارتياب الأحمال، واحتمال صناعة دون المواصفة، وتبعات
      الانهيار.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: الحدّ الذاتي للمنهج أنّه لا
      يعالج إلّا الأخطار المدرَجة، فمعامل اثنين على المتانة لا يحمي من حمل لم يحسبه أحد، ولا من آلية
      لم يعرفها أحد.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة القائمة وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقال إنّ الانهيارات صُحّحت برفع المعامل، مع أنّ النصّ ينفي ذلك. ويقترن
      المقطع بالمقطع الثامن والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - A factor covers listed hazards and nothing else
    - Engineers design to the average strength of a material
    - Characteristic strength is commonly set at five percent
    - The failures were corrected by raising the factor
    key: A
    moves:
      B: wrong_direction
      C: underreach
      D: wrong_direction
    why: The text explains how the factor is built and then says its inherent limit is that it handles
      only the hazards that have been listed.
    trap: B contradicts the text, which says engineers do not design to the average.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how were the two famous failures corrected?
    options:
    - By raising the safety factor on strength
    - By crushing a hundred more concrete cubes
    - By adding the missing case to the codes
    - By splitting the factor between load and material
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: detail_swap
    why: The text says those failures were not corrected by raising the factor but by adding the missing
      load case and the missing material property to the codes.
    trap: A names the remedy the text explicitly says was not the one used.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the method is blind
      in a way a larger margin cannot repair?
    claim: the method is blind in a way a larger margin cannot repair
    options:
    - «Test a hundred nominally identical concrete cubes and they break over a range»
    - «Modern codes split it into separate factors applied to the load and to the material»
    - «Codes are therefore revised after failures rather than before them»
    - «A factor of two on strength is no protection against a load nobody considered»
    key: D
    moves:
      A: true_not_asked
      B: true_not_asked
      C: near_miss
    why: The quotation says a factor of two gives no protection against an unconsidered load, which
      is the blindness the claim describes.
    trap: C reports when codes change rather than what a margin cannot do.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Those failures were not corrected by raising the factor. They were corrected by adding
      the missing load case and the missing material property to the codes, after which the old factor
      was adequate. The original factor was therefore ___
    options:
    - too small for the loads it did cover
    - large enough once the list was complete
    - the cause of both of the failures
    - applied to the load and the material separately
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: detail_swap
    why: The text says the old factor was adequate once the missing case and property were added,
      so the shortfall lay in the list rather than in the margin.
    trap: A blames the size of the factor, which the text says needed no change.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «inherent» most nearly mean?
    target: inherent
    options:
    - belonging to it by nature
    - inherited from an earlier code
    - agreed by the standards bodies
    - easily removed by revision
    key: A
    moves:
      B: imported
      C: imported
      D: wrong_direction
    why: The text calls it the inherent limit of the method, so the word marks the limit as belonging
      to the method itself rather than to a particular code.
    trap: D reverses the sense, since the limit is not something a revision takes away.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the list of things a factor covers?
    options:
    - It introduces the characteristic strength by name
    - It concedes that the factor covers nothing at all
    - It reports the figure used for concrete cubes
    - It shows that the factor is not one allowance
    key: D
    moves:
      A: detail_swap
      B: wrong_direction
      C: detail_swap
    why: The text says the factor is not a single allowance for ignorance and then names variability,
