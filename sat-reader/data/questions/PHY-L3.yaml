    trap: A repeats one item from the list that Text 1 has already given.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: 'That factor is not a single allowance for ignorance. ___ it covers several distinct
      things: the variability of the material, the difference between a laboratory specimen and a
      cast wall, and uncertainty in the loads.'
    options:
    - Likewise,
    - Instead,
    - As a result,
    - For example,
    key: B
    moves:
      A: wrong_direction
      C: near_miss
      D: near_miss
    why: The second sentence says what the factor does cover in place of the single allowance just
      denied, so the transition must mark a substitution.
    trap: D treats the whole list as one example among others.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: A material does not have one strength ___ and a hundred nominally identical cubes break
      over a range.
    options:
    - strength; and
    - strength and
    - 'strength: and'
    - strength, and
    key: D
    moves:
      A: wrong_mark
      B: run_on
      C: wrong_mark
    why: The clause about a hundred cubes breaking over a range is independent, so the conjunction
      joining it to the clause about one strength takes a comma.
    trap: B leaves the clause about one strength and the clause about the cubes unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why codes are revised after failures. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why codes are revised after failures
    notes:
    - The factor handles only the hazards that have been listed.
    - A factor of two is no protection against a load nobody considered.
    - The failures were corrected by adding the missing case to the codes.
    - After that the old factor was adequate.
    options:
    - The factor handles only the hazards that have been listed
    - A margin protects against listed hazards alone, so a failure is what reveals the item the list
      was missing
    - A factor of two is no protection against an unconsidered load
    - After the addition the old factor turned out to be adequate
    key: B
    moves:
      A: underreach
      C: underreach
      D: true_not_asked
    why: Only this choice joins the limit of a margin to the role a failure plays in completing the
