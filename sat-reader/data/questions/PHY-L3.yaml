    trap: C names the limit without saying how the missing item comes to light.
- id: PHY-S09-L3
  summary_ar:
    khulasa: الكربون المشعّ، أي الصورة الثقيلة من الكربون المتكوّنة باستمرار في أعلى الجوّ، تأخذه
      كلّ كائن حيّ بالغذاء أو بالتمثيل الضوئي. وما دام الكائن حيًّا كانت نسبته فيه مطابقة لنسبة الجوّ،
      وإذا مات توقّف الأخذ وتحلّل ما فيه بعمر نصف نحو خمسة آلاف وسبعمئة سنة.
    maana: 'المعنى أنّ أربعة شروط لا بدّ أن تتحقّق قبل أن يعني التأريخ شيئًا: أن تكون العيّنة عضوية
      وأن تكون قد توقّفت عن تبادل الكربون في اللحظة المقصودة، ولذلك يؤرّخ المنهج موت الشجرة لا بناء
      البيت؛ وألّا تكون ملوّثة، فأثر من كربون حديث يُظهر عيّنة قديمة أحدث بكثير.'
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: والشرط الرابع أن تكون نسبة الجوّ
      وقتها معلومة، وهي ليست كذلك، فيُعالَج ذلك بمنحنى معايرة يحوّل القياس إلى سنين تقويمية بعيّنات
      معلومة العمر، وحلقات الأشجار تعطي ذلك العمر لآخر اثني عشر ألف سنة.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الشروط الأربعة وعن معنى كلمة
      في سياقها. والفخّ المتوقّع هنا أن يُقال إنّ المنهج يؤرّخ بناء البيت، مع أنّ النصّ يقول إنّه
      يؤرّخ موت الشجرة. ويقترن المقطع بالمقطع التاسع والسبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The curve is revised every few years
    - Four conditions must hold before a date means anything
    - The method dates the building of a house
    - Tree rings supply ages for the last twelve thousand years
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: underreach
    why: The text explains the decay, then says four conditions have to hold before a date means anything,
      and works through each of them in turn.
    trap: C reverses the example, since the method dates the death of the tree.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does a trace of modern carbon do to an old sample?
    options:
    - It makes the sample impossible to measure
    - It makes the sample look much older
    - It shifts the calibration curve itself
    - It makes the sample look much younger
    key: D
    moves:
      A: overreach
      B: wrong_direction
      C: detail_swap
    why: The text says the sample must not be contaminated and that a trace of modern carbon makes
      an old sample look much younger.
    trap: B reverses the direction of the error that contamination produces.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that one measurement need
      not pick out one date?
    claim: one measurement need not pick out one date
    options:
    - «in some periods it doubles back, so a single measurement can correspond to two or three possible
      calendar ranges»
    - «Tree rings supply that independent age for the last twelve thousand years, one ring at a time»
    - «It must be young enough to measure, which in practice means under about fifty thousand years»
    - «Published dates from the 1950s and 1960s often have to be recalculated»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says the curve doubles back in some periods, so one measurement can answer
      to two or three possible calendar ranges.
    trap: B describes how the curve is built rather than what it does to a single reading.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The sample must be organic and must have stopped exchanging carbon at the moment of interest,
      which is why the method dates the death of a tree rather than the building of the house. A beam
      reused from an older building would therefore ___
    options:
    - date the second building accurately
    - be impossible to measure at all
    - give a date older than the house
    - need no calibration curve at all
    key: C
    moves:
      A: wrong_direction
      B: overreach
      D: detail_swap
    why: The clock stops when the tree dies, so a beam cut long before the house was built carries
      the earlier date rather than the later one.
    trap: A credits the method with a date it cannot reach from a reused timber.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «anomalous» most nearly mean?
    target: anomalous
    options:
    - reported without a range
    - out of keeping with the rest
    - measured a second time
    - older than expected
    key: B
    moves:
      A: imported
      C: imported
      D: near_miss
    why: The text says an anomalous result is more often a contaminated sample than a surprise, so
      the word names a figure that does not fit the rest.
    trap: D fixes the direction, though such a result could fall either way.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the four conditions in the text?
    options:
    - They set out what a date has to satisfy
    - They introduce the half-life of radiocarbon
    - They argue that the method cannot be used
    - They report the revisions made to the curve
    key: A
    moves:
      B: detail_swap
      C: overreach
      D: detail_swap
    why: The text says four conditions have to hold before a date means anything and then names the
      organic sample, the contamination, the age limit and the atmosphere.
    trap: C turns a list of conditions into a case against the method.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 lists the conditions a radiocarbon date needs. Based on Text 2, what would be added
      to that list?
    sibling: PHY-S09-L2
    sibling_gloss: Text 2 is passage 79 of this book. It explains that half-life, the kind of radiation
      and the dose govern exposure, and that an alpha emitter is almost harmless outside the body
      and the worst case inside it.
    options:
    - Radiocarbon decays with a half-life of some thousands of years
    - A contaminated sample looks younger than it is
    - Radiocarbon in a sample is an alpha emitter in bone
    - What the same decay does when it happens in a body
    key: D
    moves:
      A: restatement
      B: restatement
      C: imported
    why: Text 2 treats decay inside living tissue as a hazard rather than a clock, which is the other
      thing the same process does.
    trap: B repeats the contamination condition that Text 1 has already set out.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: And the atmospheric proportion at the time must be known, which it is not, because it
      has varied with solar activity and with nuclear testing. ___ the last condition is handled by
      a calibration curve.
    options:
    - By contrast,
    - Even so,
    - In practice,
    - In other words,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: restatement
    why: The sentence reports how the difficulty just named is dealt with, so the transition must
      mark the turn to practice rather than a contrast.
    trap: B sets the curve against the problem it is used to solve.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: While an organism is alive its proportion of radiocarbon matches the atmosphere ___ when
      it dies the intake stops.
    options:
    - atmosphere. When
    - atmosphere, when
    - atmosphere when
    - atmosphere, and, when
    key: A
    moves:
      B: comma_splice
      C: run_on
      D: misplaced
    why: The clause about the intake stopping at death is a complete sentence, so a period separates
      it from the clause about the living organism.
    trap: B splices the clause about death onto the clause about the living organism.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a date without a range is not a date. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a date without a range is not a date
    notes:
    - The atmospheric proportion has varied with solar activity and nuclear testing.
    - A calibration curve converts a measurement into calendar years.
    - The curve is not a straight line and in some periods doubles back.
    - A single measurement can correspond to two or three calendar ranges.
    options:
    - The atmospheric proportion has varied with solar activity and testing
    - A calibration curve converts a measurement into calendar years
    - Because the curve doubles back, one measurement can answer to two or three calendar ranges,
      and a bare figure hides them
    - The curve is not a straight line at any point along it
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice joins the shape of the curve to the several ranges one reading allows, which
      is what a bare figure conceals.
    trap: B names the conversion without saying why it yields more than one answer.
- id: PHY-S10-L3
  summary_ar:
    khulasa: عُيّنت هنريتا ليفيت في مرصد كلّية هارفرد لتقيس سطوع النجوم على ألواح فوتوغرافية، أي ألواح
      زجاج مكسوّة بمستحلب سُجّلت عليه صور السماء. وكان العمل يُدفع بالساعة، والنساء اللاتي قمن به
      كُنّ يُسمّين الحاسبات.
    maana: المعنى أنّها كُلّفت سحابتي ماجلان، فعملت في آلاف الألواح تتبيّن النجوم المتغيّرة السطوع
      وتقيس مدّة الدورة في كلّ منها. وبحلول سنة ألف وتسعمئة وثمان كانت قد وجدت مئات منها، ولاحظت أنّ
      الأسطع يستغرق أطول، ثمّ أعلنت العلاقة دقيقة في خمسة وعشرين نجمًا.
    ahammiyya: 'في مجال العلوم الفيزيائية هذه المادة في مستوى الدليل: لأنّ النجوم كلّها في السحابة
      نفسها كانت على البعد نفسه تقريبًا، فصار فرق السطوع الظاهر بالضرورة فرقًا في الخرج الحقيقي، وذلك
      ما جعل العلاقة مرئية هناك ولا مكان غيره.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الجملة التي تفسّر الشرط وعن
      معنى كلمة في سياقها. والفخّ المتوقّع هنا أن يُقال إنّ العلاقة كان يمكن إيجادها في أيّ موضع من
      السماء، مع أنّ النصّ ينفي ذلك. ويقترن المقطع بالمقطع الثمانين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The plates she used are still held at Harvard
    - The relation could have been found anywhere in the sky
    - Systematic measurement in one place yielded a universal tool
    - Leavitt stated the relation for twenty-five stars in 1912
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: underreach
    why: The text says she worked through thousands of plates, that the common distance of the cloud
      is what made the relation visible there, and that it became the most useful tool for distance.
    trap: B denies the point that the relation was visible there and nowhere else.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why was the relation visible in the Magellanic Clouds?
    options:
    - The stars there lay at roughly the same distance
    - The plates from the clouds were of better quality
    - The periods there were longer than elsewhere
    - Hubble had already measured the distance to them
    key: A
    moves:
      B: imported
      C: detail_swap
      D: imported
    why: The text says all the stars lay in the same cloud and so at roughly the same distance, which
      turned differences in apparent brightness into differences in real output.
    trap: C invents a property of the periods that the text does not report.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the relation is what
      turns a timing into a distance?
    claim: the relation is what turns a timing into a distance
    options:
    - «The work was paid by the hour and the women who did it were called computers»
    - «Find such a star anywhere, time its cycle, and its true brightness follows from the relation;
      compare that with how bright it looks and the distance follows»
    - «the logarithm of the period varies with the brightness along a straight line»
    - «Different calibrations of Leavitt's law converge now within a few percent»
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: true_not_asked
    why: The quotation runs the whole procedure, from timing a cycle to the true brightness and on
      to the distance, which is the conversion the claim names.
    trap: C states the relation without the steps that turn it into a distance.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Because all the stars in question lay in the same cloud, they were all at roughly the
      same distance, so differences in their apparent brightness had to be differences in their real
      output. That is what made the relation visible there and nowhere else. A survey of the whole
      sky would therefore ___
    options:
    - have shown the relation more clearly still
    - have measured the periods more accurately
    - have required no photographic plates at all
    - have mixed near stars with far ones
    key: D
    moves:
      A: wrong_direction
      B: detail_swap
      C: imported
    why: The common distance of the cloud is what let apparent brightness stand for real output, and
      a survey of the whole sky would lose that condition.
    trap: A reverses the advantage the single cloud is said to supply.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «converge» most nearly mean?
    target: converge
    options:
    - meet at one point
    - gather for a meeting
    - come close in value
    - move further apart
    key: C
    moves:
      A: near_miss
      B: imported
      D: wrong_direction
    why: Different calibrations of the law are said to converge within a few percent, so the word
      names figures coming close to one another in value.
    trap: D reverses the sense, since the calibrations are drawing together.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the same cloud?
    options:
    - It introduces the photographic plates for the first time
    - It explains why the pattern could be seen at all
    - It concedes that the relation is only local
    - It reports the year Hubble used the relation
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence says the common distance turned apparent brightness into real output, and the
      next sentence says that is what made the relation visible there and nowhere else.
    trap: C confines the relation itself, though the text calls it the most useful tool anywhere.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports the discovery of a relation. Based on Text 2, what would be added to that
      report?
    sibling: PHY-S10-L2
    sibling_gloss: Text 2 is passage 80 of this book. It describes a ladder of distance methods, with
      parallax as the lowest rung and standard candles above it, and says an error low on the ladder
      moves every distance above it.
    options:
    - Where the relation sits among the other methods
    - The brighter of the variable stars took longer to cycle
    - Timing a cycle gives the true brightness of a star
    - The lowest rung is calibrated by the relation
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 puts standard candles on a rung above the geometry that calibrates them, which is
      where the relation of Text 1 does its work.
    trap: C repeats the procedure that Text 1 has already described.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: By 1908 she had found hundreds of them, and she noticed that the brighter ones took longer.
      ___ in 1912 she stated the relation precisely for twenty-five stars.
    options:
    - By contrast,
    - Even so,
    - In other words,
    - Four years later,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: restatement
    why: The sentence moves from the first noticing to the exact statement, so the transition must
      mark the passage of time rather than a contrast.
    trap: C treats the precise statement as another way of putting the first observation.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The work was paid by the hour ___ and the women who did it were called computers.
    options:
    - hour and
    - hour, and
    - hour; and
    - hour and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about what the women were called is independent, so the conjunction joining it
      to the clause about the hourly pay takes a comma.
    trap: A leaves the clause about the pay and the clause about the name unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the relation could be found only in that place. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the relation could be found only in that place
    notes:
    - Leavitt was assigned the Magellanic Clouds and worked through thousands of plates.
    - All the stars in question lay in the same cloud.
    - They were therefore at roughly the same distance.
    - Differences in apparent brightness had to be differences in real output.
    options:
    - Leavitt worked through thousands of photographic plates by hand
    - All the stars in question lay in the same cloud of stars
    - Differences in apparent brightness had to be differences in output
    - Stars in one cloud share a distance, so how bright they look reports how bright they are
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the shared distance to the reading of apparent brightness as real
      output, which is the condition the place supplied.
    trap: B names the shared cloud without saying what the shared distance makes possible.
