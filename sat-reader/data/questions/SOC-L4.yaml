- id: SOC-S04-L4
  summary_ar:
    khulasa: سنة ألف وتسعمئة واثنتين وثمانين قيل لستيفن جاي غولد إنّ به سرطانًا بقاؤه الوسيط، أي الزمن
      الذي يموت بحلوله نصف المرضى، ثمانية أشهر. وكان إحصائيًّا بتدريبه فقرأ الجملة قراءة صحيحة.
    maana: المعنى أنّ الوسيط موضع، وأنّ للتوزيع ذيلًا أيمن طويلًا، وأنّه كان شابًّا حسن المعالجة سليمًا
      من غير ذلك، وله سبب أن يظنّ نفسه في ذلك الذيل. وقد عاش عشرين سنة، ومقالته في الموضوع أصرح بيان
      لحجّة ضدّ اتّخاذ المعدّل وصفًا لشخص.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: والمشكلة العامّة هي الأثر العلاجيّ
      غير المتجانس، أي حال ينفع فيها العلاج قومًا ويضرّ آخرين والمعدّل يبدو صغيرًا. فدواء ينجّي مريضًا
      من عشرة ويقتل واحدًا من عشرين يُبلّغ عن نفع صافٍ متواضع، والرقم صحيح وعديم النفع للقرار.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُقدَّم التنبّؤات الشخصية على المعدّل، مع أنّ النصّ يقول إنّها تؤدّي
      أداءً سيّئًا في الاختبارات. ويقترن المقطع بالمقطع الرابع والأربعين بعد المئة.
