    maana: المعنى أنّ مضمون القاعدة تعسّفيّ والتناسق ليس كذلك، وعلى هذا الرأي تُختار الأعراف بمعنى
      ضعيف، إذ يختارها كلّ أحد بالنظر إلى ما يفعله غيره، وتتغيّر سريعًا متى تغيّرت الحوافز.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: وحساب النقل، أي الرأي بأنّ الأعراف
      تُتعلَّم في الطفولة وتُعاد بلا تمحيص، يقول إنّ من يحملها لا يستطيع أن يقول لماذا يحملها، فالعُرف
      مُوَرَّث لا مُختار، ودليله أنّ الأعراف تنجو من الظروف التي أنشأتها.'
