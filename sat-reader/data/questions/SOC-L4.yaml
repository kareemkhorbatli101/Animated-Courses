  summary_ar:
    khulasa: حاجّ ريتشارد تيتموس سنة ألف وتسعمئة وسبعين بأنّ الدفع مقابل الدم يُنتج دمًا أقلّ وأسوأ
      من طلبه هِبةً. وحجّته أنّ الدفع يغيّر معنى الفعل، فيُخرج المتبرّعين الذين يعطون عن واجب ويجذب
