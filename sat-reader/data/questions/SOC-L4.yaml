# Social Science level 4 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: SOC
level: 4
sets:
- id: SOC-S01-L4
  summary_ar:
    khulasa: كانت المسوح الوطنية في الولايات المتّحدة قريبة من التصويت الشعبيّ سنة ألفين وستّ عشرة
      ومخطئة خطأً بالغًا في عدّة ولايات، وسنة ألفين وعشرين كان الخطأ أكبر وفي الجهة نفسها. وقُدّم
      تشخيصان.
    maana: 'المعنى أنّ التشخيص الأوّل فنّيّ قابل للإصلاح: أنّ المسوح رجّحت بأقلّ ممّا ينبغي الناخبين
      بلا شهادات جامعية، وهم كثيرون ويميلون إلى مرشّح بعينه، والعلاج الترجيح على التعليم، وقد فعلته
      أكثر الشركات سريعًا، ولم يكفِ سنة عشرين.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: والثاني عدم الاستجابة التفاضليّ،
      أي أن تجيب جماعة عن المسوح بنسبة تخالف نسبة غيرها على نحو يقترن بكيفية تصويتها، فلا ترجيح على
      الخصائص يُصلح العيّنة، لأنّ الغائبين ليسوا غائبين عشوائيًّا داخل فئاتهم.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن يُحسب مزيد المقابلات علاجًا، مع أنّ النصّ ينفي ذلك. ويقترن المقطع بالمقطع
      الحادي والأربعين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Weighting on education was widely adopted after 2016
    - The weakness is structural, so the stated uncertainty should widen
    - More interviews would repair the sample
    - Polls have been shown to be useless between elections
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: wrong_direction
    why: The text calls differential nonresponse a structural problem that more interviews cannot
      fix and says the appropriate response is to widen the stated uncertainty.
    trap: C offers the remedy the text says cannot work.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what does recalled past vote introduce?
    options:
    - A verified voter file
    - A weighting on education
    - An exclusion of the unregistered
    - An error that drifts toward the winner
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: The text says weighting on recalled past vote helps and introduces its own error, because
      recall is unreliable and drifts toward the winner.
    trap: C names the cost of registration-based sampling instead.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the trouble lies outside
      the reach of demographic weighting?
    claim: the trouble lies outside the reach of demographic weighting
    options:
    - «no weighting on demographics can repair the sample, because the people missing are not missing
      at random within their categories»
    - «polls had underweighted voters without college degrees, who were numerous and disproportionately
      supporting one candidate»
    - «Registration-based sampling allows respondents to be verified against the voter files»
    - «the 2020 report concluded that the cause could not be identified from the data available to
      it»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation denies that any weighting on demographics can repair the sample and gives the
      reason, that the missing people are absent in a way tied to how they vote.
    trap: B states the first diagnosis, which weighting was supposed to fix.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: If people who distrust institutions are both less likely to answer a pollster and more
      likely to support a particular candidate, then no weighting on demographics can repair the sample.
      A poll that added thousands of interviews would therefore ___
    options:
    - remove the error from its estimate
    - verify respondents against the files
    - repeat the same gap on a larger scale
    - drift toward the winner in recall
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: near_miss
    why: The missing people are said to be absent in a way that correlates with their vote, so adding
      interviews from the same frame reproduces the gap.
    trap: A expects size to cure a fault the text calls structural.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «obtaining» most nearly mean?
    target: obtaining
    options:
    - holding good as a rule
    - getting hold of
    - giving away freely
    - asking politely for
    key: B
    moves:
      A: imported
      C: wrong_direction
      D: near_miss
    why: The text says the structural problem cannot be fixed by obtaining more interviews, so the
      word names the acquiring of them.
    trap: A takes the sense in which a custom obtains in a place.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the 2020 correction?
    options:
    - It shows the first diagnosis falling short
    - It defines differential nonresponse for a reader
    - It reports what the associations published
    - It argues that education never mattered
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence follows the adoption of weighting on education and says the correction was not
      enough in 2020, with the error running the same way again.
    trap: D denies a factor the first diagnosis is said to have identified.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 recommends widening the stated uncertainty. Based on Text 2, which choice best explains
      why the usual figure is too narrow?
    sibling: SOC-S01-L3
    sibling_gloss: Text 2 is passage 141 of this book. It sets out the four stages of a serious poll
      and says the reported margin is a statement about sampling variation under the assumption that
      the frame is right and the weights are right.
    options:
    - A probability sample licenses the arithmetic
    - Address-based sampling covers almost every household
    - A methodical firm publishes its weighting targets
    - The margin assumes the frame and the weights are right
    key: D
    moves:
      A: near_miss
      B: true_not_asked
      C: true_not_asked
    why: Text 2 says a reported margin is a statement about sampling variation under the assumption
      that the frame is right and the weights are right.
    trap: A names what the known chance permits rather than what the margin leaves out.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: The first diagnosis is technical and fixable. ___ it holds that polls had underweighted
      voters without college degrees.
    options:
    - By contrast,
    - Even so,
    - Specifically,
    - For all that,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: near_miss
    why: The second sentence states what the first diagnosis says, so the transition must mark a specification.
    trap: B sets the content of the diagnosis against its description.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: That correction was not enough in 2020 ___ and the error in several states ran the same
      way again.
    options:
    - 2020, and
    - 2020 and
    - 2020; and
    - 2020 and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the error running the same way is independent, so the conjunction joining
      it to the clause about the correction takes a comma.
    trap: B runs the clause about the correction straight into the clause about the error.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain the most honest position available. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain the most honest position available
    notes:
    - Polls remain the best instrument for measuring opinion between elections.
    - The weakness in forecasting close elections is known and unrepaired.
    - The appropriate response is to widen the stated uncertainty.
    - The 2020 report could not identify the cause from its data.
    options:
    - Polls remain the best instrument for measuring opinion
    - The 2020 report could not identify the cause from its data
    - Keep the instrument, name the unrepaired weakness, and widen the uncertainty
    - The weakness in forecasting close elections is unrepaired
    key: C
    moves:
      A: underreach
      B: true_not_asked
      D: underreach
    why: 'Only this choice holds the three parts of the position the notes give: the instrument kept,
      the fault named, and the uncertainty widened.'
    trap: D names the fault without the instrument or the remedy.
- id: SOC-S02-L4
  summary_ar:
    khulasa: 'التجربة العشوائية تُثبت أنّ العلاج عمل في الموضع الذي أُجريت فيه، مع من شاركوا، في الظروف
      السائدة. أمّا دعوى أنّها المعيار الذهبيّ فتزعم أكثر: أنّ هذا التصميم يعلو غيره في مراتب الدليل
      أيًّا كان السؤال.'
    maana: المعنى أنّ أنغوس ديتون ونانسي كارترايت ضغطا الاعتراض أشدّ الضغط، وهو يتعلّق بالصلاحية الخارجية،
      أي هل تثبت نتيجة نُيلت في موضع في موضع آخر. وحجّتهما أنّ نقل نتيجة التجربة يقتضي معرفة لا تقدّمها
      التجربة.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: فبرنامج لمكافحة الدود رفع الحضور
      المدرسيّ في منطقة كينية قد لا يفعل شيئًا في منطقة فيها أنواع دود أخرى ومدارس أخرى ومسافات أخرى
      إلى العيادة، ومعرفة الملامح المهمّة تقتضي آلية لا تجربة أخرى.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُقدَّم الآلية والمشاهدة على التجربة، مع أنّ النصّ يذكر سجلّ العلاجات
      التي أقرّتهما وهدمتها التجارب. ويقترن المقطع بالمقطع الثاني والأربعين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Multi-site trials are expensive and few
    - A trial establishes that a treatment worked where it was run
    - A trial answers a narrow question and the hierarchy was a slogan
    - Mechanism and observation are the more reliable guides
    key: C
    moves:
      A: true_not_asked
      B: underreach
      D: wrong_direction
    why: The text reports the objection about transfer and the defense, and says most practitioners
      now hold that a trial is the best instrument for a narrow question and the hierarchy was always
      a slogan.
    trap: D prefers the evidence the text says trials have repeatedly destroyed.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what does transferring a trial result require?
    options:
    - Knowledge of which features matter
    - Another trial in the same district
    - A hierarchy that ranks the designs
    - A pre-specified comparison across sites
    key: A
    moves:
      B: wrong_direction
      C: detail_swap
      D: near_miss
    why: The text says transferring a trial result requires knowledge the trial does not supply, and
      that knowing which features matter requires a mechanism.
    trap: B offers a second trial where the text calls for a mechanism.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the defense grants the
      objection and still keeps the trial?
    claim: the defense grants the objection and still keeps the trial
    options:
    - «A deworming program that raised school attendance in one Kenyan district may do nothing in
      a district with different worm species»
    - «The defense concedes the point about transfer and denies the conclusion. Trials settle the
      one thing other designs cannot, which is whether the effect exists at all in a known population»
    - «Multi-site trials with pre-specified comparisons across sites are one response to the objection»
    - «Replication across settings, with the mechanism investigated in each, is what makes a finding
      usable»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: near_miss
    why: The quotation concedes the point about transfer in one sentence and names what trials alone
      settle in the next.
    trap: A gives the objection rather than the answer to it.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A deworming program that raised school attendance in one Kenyan district may do nothing
      in a district with different worm species, different schools or different distances to a clinic.
      A planner who applied the result elsewhere without that knowledge would therefore ___
    options:
    - be following the mechanism closely
    - have run a multi-site trial
    - have settled whether the effect exists
    - be resting the claim on very little
    key: D
    moves:
      A: wrong_direction
      B: imported
      C: near_miss
    why: The text says that without the mechanistic knowledge the basis for applying a finding anywhere
      else is tenuous.
    trap: A credits the planner with the mechanism the case stipulates is absent.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «tenuous» most nearly mean?
    target: tenuous
    options:
    - held for a long time
    - stretched over many sites
    - resting on very little
    - supported beyond doubt
    key: C
    moves:
      A: imported
      B: near_miss
      D: wrong_direction
    why: The word describes the basis for applying a finding elsewhere without knowing which features
      matter, so it names a support that is thin.
    trap: D gives the opposite of the weakness the sentence names.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the history of medicine?
    options:
    - It defines external validity for a reader
    - It gives the defense its strongest ground
    - It reports the cost of multi-site trials
    - It concedes that the hierarchy was right
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence follows the claim that trials settle whether the effect exists and names the
      record of treatments that mechanism endorsed and trials destroyed.
    trap: D restores a hierarchy the next sentence calls a slogan.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 presses the objection about transfer. Based on Text 2, which choice best shows a
      study with exactly that limitation?
    sibling: SOC-S02-L3
    sibling_gloss: Text 2 is passage 142 of this book. It reports an Oregon coverage lottery and a
      preschool trial of a hundred and twenty-three children in one town, and calls the second a slender
      base for a national argument.
    options:
    - A preschool trial of a hundred and twenty-three children in one town
    - A lottery among ninety thousand applicants for coverage
    - A blood pressure result with no significant difference
    - A follow-up that ran to the age of forty
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: Text 2 calls a hundred and twenty-three children in a single town in the 1960s a slender
      base for a national argument.
    trap: B names the larger of the two studies, whose size is not the limitation at issue.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Their argument is that transferring a trial result requires knowledge the trial does
      not supply. ___ a deworming program that raised school attendance in one Kenyan district may
      do nothing elsewhere.
    options:
    - By contrast,
    - As a result,
    - In other words,
    - For instance,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: restatement
    why: The second sentence supplies the deworming district as an instance of the claim about transfer,
      so the transition must mark an example.
    trap: B makes the deworming case follow from the claim rather than illustrate it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Multi-site trials are one response to the objection ___ and they are expensive.
    options:
    - objection and
    - objection, and
    - objection; and
    - objection and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause saying they are expensive is independent, so the conjunction joining it to the
      clause about the response takes a comma.
    trap: A runs the clause about the response straight into the clause about the cost.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what makes a finding usable in a new place. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what makes a finding usable in a new place
    notes:
    - A trial establishes that a treatment worked where it was run.
    - Transferring it requires knowing which features matter.
    - Replication across settings, with the mechanism investigated in each, makes a finding usable.
    - That program is slower and less quotable than a single result.
    options:
    - A trial establishes that a treatment worked where it was run
    - Transferring a result requires knowing which features matter
    - The program is slower and less quotable than one result
    - Repetition in new settings with the mechanism studied each time
    key: D
    moves:
      A: underreach
      B: underreach
      C: true_not_asked
    why: Only this choice names the program the notes call what makes a finding usable, which is repetition
      with the mechanism examined in each place.
    trap: B names the requirement without the program that meets it.
- id: SOC-S03-L4
  summary_ar:
    khulasa: حاجّ رونالد فيشر، أعظم إحصائيّي جيله، حتّى وفاته سنة ألف وتسعمئة واثنتين وستّين بأنّ
      الصلة بين التدخين وسرطان الرئة لم يَثبت أنّها سببية. ولم يكن اعتراضه سخيفًا، وهو ما زال يُدرَّس
      في مقرّرات الاستدلال السببيّ.
    maana: المعنى أنّه اقترح الفرضية البنيوية، أي أنّ عاملًا ثالثًا، وهو هنا استعداد موروث، قد يُحدث
      ميل الذوق إلى التبغ والقابلية للمرض كليهما، فيُنتج الاقتران الملحوظ بلا سهم سببيّ بينهما.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: أجاب أوستن برادفورد هيل لا بدراسة
      واحدة بل بقائمة: حجم الاقتران، وثباته عبر السكّان والتصاميم، واستجابة الجرعة، وترتيب الزمن الصحيح،
      وآلية معقولة، وما يجري عند إزالة التعرّض.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب الاعتراض باقيًا بلا جواب، مع أنّ النصّ يقول إنّه أُجيب في خمس عشرة
      سنة. ويقترن المقطع بالمقطع الثالث والأربعين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Fisher had been a paid consultant to the industry
    - Heavy smokers had about twenty times the risk
    - Nobody could run the experiment that would settle it
    - Observational evidence can carry a causal claim
    key: D
    moves:
      A: true_not_asked
      B: underreach
      C: underreach
    why: The text says what the episode establishes is that observational evidence can carry a causal
      claim, provided many independent lines are brought rather than one correlation.
    trap: C stops at the objection the answer took fifteen years to meet.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what did Fisher propose as an alternative?
    options:
    - A dose response across populations
    - An inherited disposition behind both
    - A twin study of smoking habits
    - A list of strengthening considerations
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: near_miss
    why: The text says Fisher proposed the constitutional hypothesis, that a third factor and in this
      case an inherited disposition might cause both.
    trap: C names the design that later addressed his hypothesis.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the agreement between
      the lines of evidence was unusually complete?
    claim: the agreement between the lines of evidence was unusually complete
    options:
    - «He also pointed out, entirely correctly, that nobody could run the experiment that would settle
      the question directly»
    - «Fisher had been a paid consultant to the tobacco industry, which is often mentioned and does
      not dispose of his argument»
    - «Heavy smokers had about twenty times the risk, the finding appeared in every country examined,
      risk rose with consumption and fell after quitting, and lung tissue from smokers showed the
      damage directly»
    - «Twin studies addressed the constitutional hypothesis directly, animal experiments supplied
      the mechanism»
    key: C
    moves:
      A: true_not_asked
      B: true_not_asked
      D: near_miss
    why: The quotation runs through the size, the consistency, the dose response, the reversibility
      and the tissue evidence in one sentence.
    trap: D names two of the later lines rather than the completeness of the agreement.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Risk rose with consumption and fell after quitting. A reader who asked which of the considerations
      those two facts satisfy would therefore ___
    options:
    - name the dose response and the reversibility
    - name the time order and the mechanism
    - find the constitutional hypothesis confirmed
    - need an experiment nobody could run
    key: A
    moves:
      B: near_miss
      C: wrong_direction
      D: imported
    why: The list includes a dose response and what happens when the exposure is removed, which are
      exactly the rise with consumption and the fall after quitting.
    trap: B names two other items on the same list.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «sound» most nearly mean?
    target: sound
    options:
    - audible to a listener
    - measured by a device
    - easily refuted
    - free of a flaw
    key: D
    moves:
      A: imported
      B: imported
      C: wrong_direction
    why: The text calls a sound objection from a serious opponent the most useful thing a field can
      be given, so the word names an objection without a defect in it.
    trap: C gives the opposite of the quality the sentence praises.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the fifteen years?
    options:
    - It defines the constitutional hypothesis
    - It reports what Fisher was paid to do
    - It marks the objection as met rather than waved away
    - It argues that Fisher was never answered
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: wrong_direction
    why: The sentence says the objection was answered rather than dismissed and puts fifteen years
      on the work of answering it.
    trap: D leaves unanswered an objection the sentence says was met.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says nobody could run the experiment that would settle the question. Based on Text
      2, which choice best describes the usual substitute?
    sibling: SOC-S03-L3
    sibling_gloss: Text 2 is passage 143 of this book. It defines a natural experiment as a situation
      in which something outside the researchers has allocated people almost at random, and calls
      it the main instrument of modern social science.
    options:
    - A list of considerations drawn up by a statistician
    - A situation that allocated people almost at random
    - A twin study of an inherited disposition
    - An animal experiment supplying a mechanism
    key: B
    moves:
      A: near_miss
      C: imported
      D: imported
    why: Text 2 defines a natural experiment as a situation in which something outside the researchers
      has allocated people almost at random, and calls it the main instrument of the field.
    trap: A names the method Text 1 supplies rather than the substitute Text 2 describes.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Smoking satisfied all of them, and the agreement was unusually complete. ___ heavy smokers
      had about twenty times the risk.
    options:
    - Indeed,
    - By contrast,
    - As a result,
    - In other words,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
