    - It reports the Toronto studies and their flaw
    - It argues that the accounts make the same forecast
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence saying the distinguishing prediction concerns speed is followed by the fast
      cases and then the generational ones.
    trap: D merges two predictions the sentence is there to separate.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 sets a transmitted norm against an equilibrium one. Based on Text 2, which choice
      best describes an effect that tracks the room?
    sibling: SOC-S06-L3
    sibling_gloss: Text 2 is passage 146 of this book. It reports that conformity collapsed when one
      confederate gave the correct answer and concludes that what survives is a mechanism whose size
      depends on who is in the room.
    options:
    - Conformity collapsing when one ally speaks up
    - A rate that stayed the same in every country
    - Rules about food persisting after migration
    - A task easy to the point of being insulting
    key: A
    moves:
      B: wrong_direction
      C: imported
      D: true_not_asked
    why: Text 2 says conformity collapsed when one confederate gave the correct answer and that the
      size of the effect depends on who is in the room.
    trap: B denies the variation Text 2 reports across countries and decades.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Transmitted norms should change at the speed of generations. ___ several have done that
      instead, including attitudes to marriage and to authority.
    options:
    - By contrast,
    - As a result,
    - In other words,
    - Indeed,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: restatement
    why: The second sentence bears out the prediction just made, so the transition must mark a confirmation.
    trap: A sets the cases against the prediction they satisfy.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Two accounts of norms are current ___ and they make different predictions.
    options:
    - current and
    - current, and
    - current; and
    - current and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause saying they make different predictions is independent, so the conjunction joining
      it to the clause about the two accounts takes a comma.
    trap: A runs the clause about the accounts straight into the clause about the predictions.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the choice of account matters for policy. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the choice of account matters for policy
    notes:
    - Equilibrium norms change fast when the payoffs change.
    - Transmitted norms change at the speed of generations.
    - The speed of change identifies which mechanism is operating.
    - A policy working on one of them will not work on the other.
    options:
    - Equilibrium norms change fast when the payoffs change
    - Transmitted norms change at the speed of generations
    - The speed of change identifies the mechanism at work
    - A lever that moves payoffs does nothing to a norm carried unexamined
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice states the practical consequence the notes name, that a policy aimed at
      one mechanism leaves the other untouched.
    trap: C names the diagnostic without the consequence for policy.
- id: SOC-S07-L4
  summary_ar:
    khulasa: الموقف المدرسيّ أنّ الأجور السكنية عالية حيث يشحّ الإسكان، فبناء إسكان أكثر يخفض الأجور.
      والردّ المتشكّك، وهو شائع في منظّمات المستأجرين في المدن الغالية، أنّ الأبنية الجديدة أبنية
      فارهة تأتي بمقاهٍ وأجور صاعدة حولها.
    maana: 'المعنى أنّ العرض يُنتج عمليًّا طلبًا مُستحثًّا، أي أنّ الوحدات الجديدة تجذب ناسًا إضافيّين
      فلا يهبط السعر. وللدعويين دليل، والدليل يعمل في مقياسين مختلفين: فدراسات الأبنية الفردية في
      سان فرانسيسكو وهلسنكي ونيويورك تجد أنّ الأجور في المَربَعات المجاورة ترتفع.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: ودراسات المناطق الحضرية تجد
      أنّ المواضع التي بنت أكثر فيها نموّ أجور أقلّ. والآلية الموفّقة هي الترشيح، أي أنّ الإسكان الجديد
      الغالي يُفرِج إسكانًا أقدم أرخص لغيرهم، وتتبّع الانتقالات يُظهر سلاسل من ستّة أو سبعة إخلاءات.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب الدليلان متناقضين، مع أنّ النصّ يقول إنّهما لا يتعارضان. ويقترن
      المقطع بالمقطع السابع والأربعين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Studies find rents rise in the blocks around new buildings
    - Tracking moves shows chains of six or seven vacancies
    - Supply and the local rise are in direct conflict
    - Supply works at the regional scale and leaves neighbors exposed
    key: D
    moves:
      A: underreach
      B: underreach
      C: wrong_direction
    why: The text says supply does reduce rents at the scale of a region, that it does not protect
      the people nearest the construction, and that the two facts are not in conflict.
    trap: C sets in conflict two findings the text says agree.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what does filtering describe?
    options:
    - New units attracting additional people
    - New expensive housing freeing older cheaper housing
    - Cafes arriving with the new buildings
    - Rents rising in the surrounding blocks
    key: B
    moves:
      A: detail_swap
      C: imported
      D: detail_swap
    why: The text says filtering is the process by which new expensive housing frees older cheaper
      housing for others.
    trap: A gives induced demand rather than filtering.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the two bodies of evidence
      answer at different scales?
    claim: the two bodies of evidence answer at different scales
    options:
    - «new buildings are luxury buildings, that they arrive with cafes and rising rents around them»
    - «Both literatures have grown quickly since administrative rent data became available»
    - «which supports the skeptics on the thing residents actually observe. Studies of metropolitan
      areas find that places which built more have lower rent growth»
    - «A tenant displaced this year is not compensated by lower regional rents in five years»
    key: C
    moves:
      A: near_miss
      B: true_not_asked
      D: near_miss
    why: The quotation sets the block-level finding that supports the skeptics beside the metropolitan
      finding that supports the textbook.
    trap: D names the fairness problem rather than the difference in scale.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A tenant displaced this year is not compensated by lower regional rents in five years,
      and the chains work through a market in which the first beneficiaries are better off than the
      last. A policy resting on filtering alone would therefore ___
    options:
    - leave the nearest tenants unhelped
    - raise rents across the whole region
    - stop the chains of vacancies forming
    - need administrative rent data first
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: imported
    why: The chains are said to reach down the distribution only over years, and a displaced tenant
      is not compensated by a later regional fall.
    trap: B reverses the regional effect the text reports.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «bears» most nearly mean?
    target: bears
    options:
    - carries in the arms
    - gives birth to
    - turns toward
    - is left paying
    key: D
    moves:
      A: near_miss
      B: imported
      C: imported
    why: The dispute is said to be about who bears the costs and over what period, so the word names
      whoever ends up paying them.
    trap: A takes the physical sense of carrying a load.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the reconciling mechanism?
    options:
    - It defines induced demand for a reader
    - It reports the cities where rents were studied
    - It shows how both findings can hold at once
    - It denies that the local rents ever rise
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: wrong_direction
    why: The sentence names filtering and the chains of vacancies, which link the local rise to the
      regional fall the two literatures report.
    trap: D denies a rise the text treats as observed.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 compares findings at the block and the metropolitan scale. Based on Text 2, which
      choice best describes a hazard in that comparison?
    sibling: SOC-S07-L3
    sibling_gloss: Text 2 is passage 147 of this book. It warns that census tracts are split as they
      grow and merged as they shrink, so a table comparing a neighborhood in two censuses may be comparing
      two different pieces of ground.
    options:
    - A category rewritten between two censuses
    - Tracts split and merged between the two dates
    - An undercount of about one percent in total
    - A conversion table published by an agency
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: true_not_asked
    why: Text 2 says tracts are split as they grow and merged as they shrink, so a comparison of the
      same neighborhood may cover different ground.
    trap: A names the third complication rather than the one about areas.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Both claims have evidence and the evidence operates at different scales. ___ studies
      of individual new buildings find that rents in the immediately surrounding blocks rise.
    options:
    - For instance,
    - By contrast,
    - As a result,
    - In other words,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: restatement
    why: The second sentence gives the first of the two bodies of evidence just announced, so the
      transition must mark an example.
    trap: C makes the block-level finding follow from the claim rather than illustrate it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Both claims have evidence ___ and the evidence operates at different scales.
    options:
    - evidence and
    - evidence; and
    - evidence, and
    - evidence and,
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: misplaced
    why: The clause about the scales is independent, so the conjunction joining it to the clause about
      the two claims takes a comma.
    trap: A runs the clause about the claims straight into the clause about the scales.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the argument is about compensation rather than economics.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the argument is about compensation rather than economics
    notes:
    - Supply reduces rents at the scale of a region.
    - It does not protect the people nearest the construction.
    - A tenant displaced this year is not compensated by a later fall.
    - The first beneficiaries of the chains are better off than the last.
    options:
    - The regional gain is real and arrives too late for the tenant nearest the site
    - Supply reduces rents at the scale of a whole region
    - It fails to protect the people nearest the construction
    - The first beneficiaries are better off than the last
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice holds the regional gain and the timing together, which is what turns the
      question into one about compensation.
    trap: C names the gap in protection without the gain it sits beside.
- id: SOC-S08-L4
  summary_ar:
    khulasa: تحوي أدبيّات الحدّ الأدنى للأجر اليوم مئات التقديرات، والنتيجة المركزية أنّ الرفوع المتواضعة
      لها آثار تشغيل صغيرة. وتلك الجملة تُخفي ثلاثين سنة من الجدال، والجدال مُعلِّم في كيف تُحسَم
      مسألة تجريبية متنازَعة أو تُعجِز.
    maana: 'المعنى أنّ ثلاثة أمور غيّرت المجال: الأوّل البيانات، فسجلّات التشغيل الإدارية حلّت محلّ
      المسوح، وارتفع عدد تغييرات الحدّ الأدنى المتاحة للدرس إلى المئات مع تحديد الولايات والمدن أسعارها.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: والثاني المنهج، فصارت المقارنات
      تستعمل المناطق المجاورة وحدها، أو الصناعة نفسها وحدها، أو توزيع الأجور بدل التشغيل الكلّيّ.
      والثالث التحليل البعديّ، الذي كشف رسمًا قمعيًّا يتّفق مع بقاء نتائج صفرية صغيرة غير منشورة.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب الحدّ الأعلى معلومًا، مع أنّ النصّ يقول إنّ أحدًا لم يُثبته. ويقترن
      المقطع بالمقطع الثامن والأربعين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The simple prediction failed and the boundary stays unknown
    - The literature now contains hundreds of estimates
    - A very high minimum would cost no jobs
    - Meta-analysis found no publication bias
    key: A
    moves:
      B: underreach
      C: wrong_direction
      D: wrong_direction
    why: The text says the simple textbook prediction was wrong about the range actually legislated
      and that nobody has established the upper boundary.
    trap: C denies a cost the text says everyone agrees a very high minimum carries.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what did meta-analysis reveal?
    options:
    - That administrative records replaced surveys
    - That comparisons used only nearby areas
    - A funnel plot consistent with missing nulls
    - That monopsony explains the small effects
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: near_miss
    why: The text says meta-analysis revealed that the literature had a funnel plot consistent with
      small null results going unpublished.
    trap: A names the first of the three changes rather than the third.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the open question is
      where the turn comes?
    claim: the open question is where the turn comes
    options:
    - «administrative employment records replaced surveys, and the number of separate minimum wage
      changes available for study rose into the hundreds»
    - «Monopsony provides the theory for why small increases may not cost jobs»
    - «Several cities have raised minimum wages above half the local median wage, which is beyond
      the range previously studied»
    - «the argument is about where the turn comes, which depends on the local wage distribution and
      cannot be answered in general»
    key: D
    moves:
      A: true_not_asked
      B: near_miss
      C: near_miss
    why: The quotation names the location of the turn as the thing argued about and says it depends
      on the local wage distribution.
    trap: B supplies the theory for the small effects rather than the open question.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Everyone agrees that a very high minimum would cost jobs and that a very low one would
      not bind at all. A dispute about a minimum in between would therefore ___
    options:
    - be settled by the textbook model
    - turn on the local wage distribution
    - need no empirical evidence at all
    - be answered in general by theory
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: near_miss
    why: The text says the argument is about where the turn comes, which depends on the local wage
      distribution and cannot be answered in general.
    trap: D asks for a general answer the text says is unavailable.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «discriminate» most nearly mean?
    target: discriminate
    options:
    - tell two things apart
    - treat a group unfairly
    - combine many studies
    - select the best estimate
    key: A
    moves:
      B: imported
      C: wrong_direction
      D: near_miss
    why: The text says the new comparisons can discriminate between a job lost and a job that simply
      pays more, so the word names the drawing of a distinction.
    trap: B takes the social sense of unequal treatment.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about monopsony?
    options:
    - It defines meta-analysis for a reader
    - It reports the number of estimates now available
    - It argues that employers pay above the market
    - It supplies the theory the findings had lacked
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: wrong_direction
    why: The sentence follows the account of what is still disputed and says monopsony explains why
      small increases may not cost jobs.
    trap: C reverses the position of the employer the sentence describes.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says administrative records replaced surveys. Based on Text 2, which choice best
      explains what prompted that change?
    sibling: SOC-S08-L3
    sibling_gloss: Text 2 is passage 148 of this book. It reports a survey and a payroll study of
      the same restaurants reaching opposite conclusions, and says the exchange drove a generation
      of work using administrative data and borders.
    options:
    - A Nobel prize shared in 2021
    - A restaurant trade association helping with a sample
    - A dispute in which two data sources disagreed
    - A textbook model predicting a fall in employment
    key: C
    moves:
      A: true_not_asked
      B: near_miss
      D: true_not_asked
    why: Text 2 says the exchange drove a generation of work using administrative data, borders and
      hundreds of separate minimum wage changes.
    trap: B names one detail of the dispute rather than the dispute itself.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: That sentence conceals thirty years of argument. ___ few empirical questions in economics
      have been fought over for as long or with as much data.
    options:
    - By contrast,
    - Indeed,
    - In other words,
    - For instance,
    key: B
    moves:
      A: wrong_direction
      C: restatement
      D: near_miss
    why: The second sentence bears out the claim about the length of the argument, so the transition
      must mark a confirmation.
    trap: A sets the second sentence against the claim it supports.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The minimum wage literature now contains hundreds of estimates ___ and the central finding
      is that modest increases have small employment effects.
    options:
    - estimates and
    - estimates; and
    - estimates and,
    - estimates, and
    key: D
    moves:
      A: run_on
      B: wrong_mark
      C: misplaced
    why: The clause about the central finding is independent, so the conjunction joining it to the
      clause about the hundreds of estimates takes a comma.
    trap: A runs the clause about the estimates straight into the clause about the finding.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain the exact standing of the question after thirty years. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain the exact standing of the question after thirty years
    notes:
    - The simple textbook prediction was wrong about the legislated range.
    - Nobody has established the upper boundary.
    - Recent increases in some cities are the largest natural experiment yet.
    - Results from those cases are not yet consistent.
    options:
    - The simple textbook prediction was wrong about the legislated range
    - The low range is settled, the boundary is open, and the new cases are still arriving
    - Nobody has yet established the upper boundary
    - Results from the recent cases are not yet consistent
    key: B
    moves:
      A: underreach
      C: underreach
      D: restatement
    why: 'Only this choice states all three parts of the standing the notes give: what is settled,
      what is open, and what is still coming in.'
    trap: C names the open part without the settled part or the new evidence.
- id: SOC-S09-L4
  summary_ar:
    khulasa: هدفان متاحان لمن يريد أن يعمل في توزيع الدخل، وليسا الهدف نفسه. أحدهما الفقر المطلق،
      أي معيار مثبَّت على مستوى من السلع والخدمات لا نسبةً إلى غيرك، وعلى هذا المقياس تحسّن العالم
      تحسّنًا هائلًا في أربعين سنة.
    maana: المعنى أنّ حصّة من هم تحت الخطّ الدوليّ هبطت من قريب أربعة من عشرة إلى أقلّ من واحد من
      عشرة، وأنّ الآخر هو عدم المساواة مقيسًا بالفجوة بين القمّة والبقيّة، وعلى هذا المقياس تحرّكت
      بلدان غنيّة كثيرة في الجهة الأخرى بحدّة.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: فيقول أحد الطرفين إنّ الفقر
      هو المهمّ، وإنّ الفجوة لا تَسوء إلّا إن أسوأت حال أحد، وإنّ القلق المُعلَن على عدم المساواة
      حسد بنظرية ملحقة. ويقول الآخر إنّ عدم المساواة يُسيء بآليّات يمكن تعيينها.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسم الخلاف لأحد الطرفين، مع أنّ النصّ يقول إنّ الدليل مختلط. ويقترن
      المقطع بالمقطع التاسع والأربعين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The share below the international line fell sharply
    - The two targets differ and sometimes conflict in policy
    - The evidence favors one side of the dispute decisively
    - Inequality has no mechanism that can be specified
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: wrong_direction
    why: The text names absolute poverty and inequality as two different targets, calls the evidence
      mixed, and says the two targets sometimes conflict in policy.
    trap: C settles a dispute the text calls undecided.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what happens to the health correlations under control?
    options:
    - They disappear entirely
    - They grow much larger
    - They stay exactly as they were
    - They shrink substantially
    key: D
    moves:
      A: overreach
      B: wrong_direction
      C: wrong_direction
    why: The text says correlations between inequality and poor health across countries are real and
      shrink substantially when income levels are controlled for.
    trap: A removes a correlation the text says is real.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the mechanisms can be
      named rather than merely asserted?
    claim: the mechanisms can be named rather than merely asserted
    options:
    - «Political influence buys rules, and high inequality raises the price of positional goods such
      as housing near good schools»
    - «On that measure the world has improved enormously in forty years»
    - «The political mechanism is the best supported of the three and is hard to quantify»
    - «Both measures depend on choices about price indices and household size»
    key: A
    moves:
      B: true_not_asked
      C: near_miss
      D: true_not_asked
    why: The quotation names two specific mechanisms, the buying of rules and the price of positional
      goods, where the claim asks for named mechanisms.
    trap: C grades one mechanism rather than naming any.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Growth has reduced poverty in several countries while increasing inequality. Anyone who
      declines to choose between the two targets would therefore ___
    options:
    - have both measures moving together
    - be controlling for income levels
    - be avoiding the arithmetic
    - have specified a mechanism first
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: near_miss
    why: The text says anyone who declines to choose between the two targets is not facing the arithmetic,
      given that growth has moved them in opposite directions.
    trap: A assumes the two measures agree, which the same sentence denies.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «ostensible» most nearly mean?
    target: ostensible
    options:
    - openly measured
    - professed rather than real
    - widely shared
    - proved beyond doubt
    key: B
    moves:
      A: imported
      C: imported
      D: wrong_direction
    why: The word qualifies a concern that one side calls envy with a theory attached, so it marks
      a stated motive the speaker doubts.
    trap: D treats the concern as established when the word casts doubt on it.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence calling the evidence mixed?
    options:
    - It refuses to award the dispute to either side
    - It defines a positional good for a reader
    - It reports the fall in absolute poverty
    - It argues that inequality does no harm
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence says the empirical question is whether the mechanisms are large and that the
      evidence is mixed in a way that does not favor either side decisively.
    trap: D takes one side of a dispute the sentence leaves open.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 measures inequality as the gap between the top and the rest. Based on Text 2, which
      choice best names a figure built for that gap?
    sibling: SOC-S09-L3
    sibling_gloss: Text 2 is passage 149 of this book. It describes the Lorenz curve and the Gini
      coefficient and names the Palma ratio, which compares the top tenth with the bottom four tenths,
      among the alternatives chosen for what they expose.
    options:
    - The Lorenz curve of cumulative shares
    - The area between the curve and the diagonal
    - The Theil index decomposed by region
    - The Palma ratio of the top tenth
    key: D
    moves:
      A: near_miss
      B: near_miss
      C: true_not_asked
    why: Text 2 says the Palma ratio compares the top tenth with the bottom four tenths, on the argument
      that the middle half changes little.
    trap: B names the Gini, which Text 2 calls least sensitive at the ends.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: One side holds that poverty is what matters. ___ the other side holds that inequality
      does make people worse off.
    options:
    - As a result,
    - For instance,
    - By contrast,
    - In other words,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
    why: The second sentence states the opposing position, so the transition must mark a contrast.
    trap: A makes the second position follow from the first.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Two targets are available to anyone who wants to act on the distribution of income ___
      and they are not the same target.
    options:
    - income, and
    - income and
    - income; and
    - income and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause saying they are not the same target is independent, so the conjunction joining
      it to the clause about the two targets takes a comma.
    trap: B runs the clause about the targets straight into the clause about their difference.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the two targets force a choice. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why the two targets force a choice
    notes:
    - Absolute poverty is fixed at a level of goods and services.
    - Inequality is the gap between the top and the rest.
    - Growth has reduced poverty while increasing inequality.
    - Anyone who declines to choose is not facing the arithmetic.
    options:
    - Absolute poverty is fixed at a level of goods and services
    - Inequality is measured as the gap between the top and the rest
    - Growth has moved the two measures in opposite directions at once
    - Anyone who declines to choose is not facing the arithmetic
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice gives the fact that makes the choice unavoidable, which is one process moving
      the two measures the other way.
    trap: D states the verdict without the fact that forces it.
- id: SOC-S10-L4
  summary_ar:
    khulasa: يمكن قراءة أدبيّات الاستدلالات المختصرة قراءتين، والقراءة المختارة تقرّر ما يلزم عنها.
      فالأولى تعدّ كلّ انحراف موثَّق عن نموذج صوريّ تحيّزًا، أي خطأً، وتخلص إلى أنّ الحكم البشريّ
      معيب بانتظام ويحتاج إلى تصحيح من المؤسّسات والخبراء.
    maana: المعنى أنّ الثانية ترى أنّ القواعد التي يستعملها الناس متكيّفة مع البيئات التي يعملون فيها
      عادةً، وهو موقف يُسمّى العقلانية البيئية، وأنّ الأداء في مسألة مصطنعة ليس دليلًا على الأداء
      في الحياة.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الخلاف: وللقراءة الثانية سند تجريبيّ
      يسهل بيانه: فعدّة أخطاء مشهورة تتقلّص أو تزول إذا وُضعت المسألة نفسها في تكرارات لا في احتمالات
      حدث واحد، وهكذا تَرِد المعلومات في الخبرة.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقدَّم تدريب الناس على تجاوز الأخطاء على إعادة تصميم العرض، مع أنّ النصّ
      يقول عكسه. ويقترن المقطع بالمقطع الخمسين بعد المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Anchoring is robust across presentation formats
    - Gigerenzer and Kahneman debated for two decades
    - The camps converged on practice without settling the theory
    - Training people out of errors works better than redesign
    key: C
    moves:
      A: underreach
      B: underreach
      D: wrong_direction
    why: The text says the two camps have converged on practice while continuing to disagree about
      what the practice shows, and calls that convergence the most useful product of the argument.
    trap: D reverses the comparison the text draws between the two remedies.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, when do doctors mostly succeed?
    options:
    - When the problem is posed as counts
    - When the problem is posed in percentages
    - When they are trained out of the error
    - When the problem is framed two ways
    key: A
    moves:
      B: wrong_direction
      C: imported
      D: imported
    why: The text says doctors who fail the base rate problem in percentages mostly succeed when it
      is posed as counts out of a thousand.
    trap: B gives the presentation in which they fail.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the second reading has
      results a defect account would not predict?
    claim: the second reading has results a defect account would not predict
    options:
    - «Neither reading explains everything. Anchoring is robust across formats and is hard to call
      adaptive»
    - «Simple rules that ignore most of the available information outperform complex models in some
      forecasting tasks, which is not what a defect account predicts»
    - «Gigerenzer and Kahneman debated the question in print for two decades»
    - «redesigning the presentation of information works better and more reliably than training people
      out of errors»
    key: B
    moves:
      A: wrong_direction
      C: true_not_asked
      D: near_miss
    why: The quotation reports simple rules beating complex models and says in so many words that
      this is not what a defect account predicts.
    trap: D names the practical lesson rather than a result that embarrasses the first reading.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Several famous errors shrink or vanish when the same problem is posed in frequencies
      rather than in single-event probabilities, which is how information arrives in experience. A
      test posed only in percentages would therefore ___
    options:
    - measure performance in ordinary life
    - remove the anchoring effect as well
    - show simple rules beating complex ones
    - report a failure the format produced
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: imported
    why: The errors are said to shrink when the problem is put in the frequencies of experience, so
      a percentage format manufactures part of the failure.
    trap: A credits the artificial format with the ordinary setting the text contrasts it with.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «telling» most nearly mean?
    target: telling
    options:
    - speaking at length
    - counting one by one
    - carrying real weight
    - easy to overlook
    key: C
    moves:
      A: imported
      B: imported
      D: wrong_direction
    why: The text calls the evidence about remedies the most telling, so the word names evidence that
      weighs most in the argument.
    trap: D reverses the force the word gives the evidence.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence that limits both readings?
    options:
    - It defines ecological rationality for a reader
    - It opens the case against each side in turn
    - It reports what the two men endorsed
    - It awards the argument to the second reading
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence is followed by anchoring resisting the adaptive account and framing surviving
      the frequency presentation, one difficulty for each side.
    trap: D hands the argument to a side the text says has not won it.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 calls anchoring hard to describe as adaptive. Based on Text 2, which choice best
      describes how firm that effect is?
    sibling: SOC-S10-L3
    sibling_gloss: Text 2 is passage 150 of this book. It reports the systematic replications begun
      around 2011 and says anchoring survived robustly, framing survived, and loss aversion survived
      with its size disputed.
    options:
    - It survived the systematic replications robustly
    - It was among the results that did not survive
    - It was confirmed with its size disputed
    - It was removed by preregistration
    key: A
    moves:
      B: wrong_direction
      C: near_miss
      D: imported
    why: Text 2 says anchoring survived robustly, while loss aversion survived with its size disputed
      and several taught results did not survive at all.
    trap: C gives the status Text 2 assigns to loss aversion.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: The second reading has experimental support that is easy to state. ___ several famous
      errors shrink or vanish when the same problem is posed in frequencies.
    options:
    - By contrast,
    - Even so,
    - In other words,
    - For instance,
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: restatement
    why: The second sentence gives the first piece of the support just announced, so the transition
      must mark an example.
    trap: B sets the support against the sentence that introduces it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The heuristics literature can be read in two ways ___ and the reading chosen decides
      what follows from it.
    options:
    - ways and
    - ways, and
    - ways; and
    - ways and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the reading chosen is independent, so the conjunction joining it to the
      clause about the two ways takes a comma.
    trap: A runs the clause about the two readings straight into the clause about the choice.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what the argument actually produced. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain what the argument actually produced
    notes:
    - Redesigning the presentation works better than training people out of errors.
    - The two camps converged on practice while disagreeing about theory.
    - Both men endorsed the frequency presentation of medical risk.
    - The convergence arrived without either side conceding the point at issue.
    options:
    - Redesigning the presentation beats training people out of errors
    - Both men endorsed the frequency presentation of medical risk
    - The two camps converged on practice while disagreeing on theory
    - A shared way of presenting risk, reached with the theory still unsettled
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice names the product the notes point to, a common practice arrived at without
      a theoretical concession.
    trap: B names the agreement of two people without what it amounted to.
