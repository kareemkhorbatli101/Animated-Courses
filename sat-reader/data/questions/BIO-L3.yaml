# Biology and Earth Science level 3 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: BIO
level: 3
sets:
- id: BIO-S01-L3
  summary_ar:
    khulasa: 'بدأ بيتر وروزماري غرانت العمل في جزيرة دافني ميجور، وهي مخروط بركاني في غالاباغوس يبلغ
      نحو كيلومتر عرضًا، سنة ألف وتسعمئة وثلاث وسبعين، ودأبا عليه أربعين سنة. وكان منهجهما مستقصيًا
      لا بارعًا: كلّ عصفور في الجزيرة يُصاد ويُطوّق ويُوزن ويُقاس.'
    maana: 'المعنى أنّ تطويق كلّ طائر على حِدة أتاح تتبّع نسلٍ بعينه وإثبات نسبة التوريث في كلّ صفة
      على انفراد. ثمّ أجرى الجوّ التجربة: تخلّف المطر سنة ألف وتسعمئة وسبع وسبعين، فلم تُعقد بذور
      ثمانية عشر شهرًا، وهلك نحو خمسة وثمانين في المئة من عصافير الأرض الوسطى.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: ما تقدّمه هذه الدراسة ولا
      يقدّمه مختبر هو معدّل تغيّر مقيس في جماعة برّية، مع تسمية العامل المنتقي وإثبات التوريث على
      انفراد.'
    sila: في اختبار سات يكثر السؤال عن حدود الدراسة وعن الدليل الذي يسند دعوى وعن وظيفة الجملة. والفخّ
      المتوقّع هنا أن تُعمَّم النتائج على كلّ صفة وكلّ جماعة، مع أنّ النصّ يحصرها في جزيرة واحدة وأنواع
      قليلة. ويقترن المقطع بالمقطع الحادي والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The Grants published their measurements in full
    - Forty years of banding gave a measured rate of change in the wild
    - A laboratory could have produced the same measurements
    - Daphne Major is a volcanic cone about a kilometer across
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: true_not_asked
    why: The text says what the study provides that no laboratory can is a measured rate of change
      in a wild population, with the agent identified and inheritance established separately.
    trap: C claims for a laboratory exactly what the text says a laboratory cannot provide.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what happened to mean beak depth after the wet year of 1983?
    options:
    - It rose further than it had after the drought
    - It stayed at the level reached after the drought
    - It could no longer be measured in the field
    - It moved back as small seeds became abundant
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: imported
    why: The text says the exceptional wet year of 1983 reversed the conditions, small seeds became
      abundant, and the trait moved back.
    trap: A reverses the direction of the change that the wet year produced.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the inheritance of the
      trait was established independently of the change in it?
    claim: the inheritance of the trait was established independently of the change in it
    options:
    - «because the birds were individually marked the team could follow particular lineages and establish
      the heritability of each trait»
    - «Beak length and depth were recorded to a tenth of a millimeter»
    - «In 1977 the rains failed, no seeds were set for eighteen months, and about eighty-five percent
      of the medium ground finches died»
    - «The Grants published the measurements in full, which is why others have been able to reanalyze
      them»
    key: A
    moves:
      B: underreach
      C: true_not_asked
      D: true_not_asked
    why: The quotation ties the individual marking to following lineages and establishing heritability,
      which is a separate determination from the measured change in the trait.
    trap: C describes the selective episode rather than how inheritance was established.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Its limits are equally clear. One island, a few species, and a trait that happens to
      be easy to measure. A reader who wants a general rate of evolutionary change is therefore ___
    options:
    - entitled to apply these figures everywhere
    - left with no measured rates at all
    - obliged to look beyond this one study
    - able to use the wet year of 1983 instead
    key: C
    moves:
      A: overreach
      B: wrong_direction
      D: detail_swap
    why: The text names the narrowness of the case and says the work cannot settle whether the same
      rates hold elsewhere, so a general rate must come from somewhere else.
    trap: A generalizes from a case whose limits the text has just set out.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «viable» most nearly mean?
    target: viable
    options:
    - able to stay alive
    - practical to carry out
    - worth the expense
    - open to dispute
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: imported
    why: The text asks about traits that are not viable to measure in the field, so the word names
      what can practically be done rather than what can survive.
    trap: A takes the biological sense of the word, which the phrase about measurement rules out.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence that begins by naming the limits?
    options:
    - It turns from what the study settles to what it cannot
    - It introduces the drought of 1977 for the first time
    - It withdraws the measured rate as unreliable
    - It explains why the birds were banded individually
    key: A
    moves:
      B: detail_swap
      C: overreach
      D: detail_swap
    why: The sentence follows the statement of what no laboratory can provide and opens the list of
      narrow conditions that bound the result.
    trap: C turns a statement of scope into a retraction of the finding.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a measured change in a wild population. Based on Text 2, what would be added
      to that account?
    sibling: BIO-S01-L2
    sibling_gloss: Text 2 is passage 61 of this book. It sets out the four conditions that produce
      selection, variation, heritability, differential reproduction and time, and says that each one
      can be checked, which is what makes the mechanism testable rather than a story.
    options:
    - The beak measurements were recorded to a tenth of a millimeter
    - Birds with deeper beaks could crack the large hard fruits
    - A wild population can be studied for forty years at a stretch
    - The four conditions the measurements can be checked against
    key: D
    moves:
      A: restatement
      B: restatement
      C: underreach
    why: Text 2 names variation, heritability, differential reproduction and time as the conditions
      to be checked, which is the frame the island measurements fill in one by one.
    trap: A repeats a detail of method that Text 1 has already supplied.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Then the weather did the experiment. In 1977 the rains failed, no seeds were set for
      eighteen months, and about eighty-five percent of the medium ground finches died. ___ the small
      soft seeds went first, so the survivors were disproportionately the birds with deeper beaks.
    options:
    - By contrast,
    - Even so,
    - In particular,
    - In conclusion,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: restatement
    why: The sentence picks out which seeds failed and which birds survived within the die-off just
      reported, so the transition must mark a particular detail of it.
    trap: B sets the detail of the die-off against the die-off itself.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Their method was exhaustive rather than clever ___ every finch on the island was caught,
      banded, weighed and measured.
    options:
    - 'clever: every'
    - clever, every
    - clever every
    - clever; every,
    key: A
    moves:
      B: comma_splice
      C: run_on
      D: misplaced
    why: A colon introduces the catching, banding, weighing and measuring that spell out what the
      exhaustive method was, which a comma alone could not do.
    trap: B joins the clause about every finch to the claim with a comma alone.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what the island study provides that a laboratory cannot. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what the island study provides that a laboratory cannot
    notes:
    - Every finch was caught, banded, weighed and measured over forty years.
    - The rains failed in 1977 and about eighty-five percent of the medium ground finches died.
    - The mean beak depth of the next generation was measurably greater than that of their parents.
    - The selective agent was identified and the inheritance established separately.
    options:
    - Every finch was caught, banded, weighed and measured over forty years
    - The rains failed in 1977 and most of the medium ground finches died
    - A wild population was measured through a drought it did not choose, with the agent named and
      the inheritance settled on its own
    - Mean beak depth rose in the generation after the drought
    key: C
    moves:
      A: underreach
      B: underreach
      D: true_not_asked
    why: Only this choice puts the measurement, the natural selective episode and the separate finding
      about inheritance together, which is what no laboratory supplies.
    trap: A describes the labor without saying what the measurements established.
- id: BIO-S02-L3
  summary_ar:
    khulasa: ثلاثة أجيال من المناهج استُعملت لمعرفة أين تقع الجينات وما تفعل، وكلّ جيل يحسم ما لم
      يقدر عليه الذي قبله. الأول خريطة الارتباط، وهي جدول ترتيب الجينات مبنيّ على كثرة انفصال صفتين
      موروثتين في التوالد، وقد رسم أولها ألفرد سترتيفانت سنة ألف وتسعمئة وثلاث عشرة.
    maana: المعنى أنّ الجيل الثاني هو التخريط الفيزيائي الذي حدّد مواقع الجينات على كروموسومات مرئية
      فأعطى موضعًا حقيقيًّا لا ترتيبًا نسبيًّا؛ والثالث هو قراءة تتابع الحروف الكيميائية، وقد صار
      صناعيًّا في التسعينيات، وأُعلنت مسوّدة التتابع البشري سنة ألفين وواحد.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: ما لم يتغيّر هو الجزء الصعب،
      فالتتابع يعطي الحروف ولا يعطي الوظيفة، وإثبات الوظيفة ما زال يحتاج تجارب التوالد ودراسات الخلايا
      والتنوّع الطبيعي.'
    sila: في اختبار سات يكثر السؤال عن حدود المنهج وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب الارتباط بين متغيّر في التتابع وصفة ما تفسيرًا لها، مع أنّ النصّ
      ينفي ذلك. ويقترن المقطع بالمقطع الثاني والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Sturtevant drew the first linkage map as an undergraduate
    - A sequence explains what a stretch of DNA does
    - Three generations of method each resolve what the last could not
    - A draft human sequence was announced in 2001
    key: C
    moves:
      A: true_not_asked
      B: wrong_direction
      D: underreach
    why: The text opens by saying three generations of method have been used and that each resolves
      something the previous one could not, then traces linkage maps, physical mapping and sequencing.
    trap: B states the error the text names, since a sequence gives letters and not function.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what did physical mapping give that a linkage map could not?
    options:
    - An actual position rather than a relative order
    - The order of the chemical letters along the DNA
    - The function of each gene that it located
    - A distance converted from a frequency of separation
    key: A
    moves:
      B: detail_swap
      C: overreach
      D: wrong_direction
    why: The text says physical mapping located genes on visible chromosomes and that this gave an
      actual position rather than a relative order.
    trap: D names what the linkage map itself supplied rather than what physical mapping added.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the oldest of the three
      methods has not been retired?
    claim: the oldest of the three methods has not been retired
    options:
    - «A draft of the human sequence was announced in 2001 and completed in stages over the following
      two decades»
    - «Establishing function still requires breeding experiments, cell studies and natural variation»
    - «most of the human sequence does not code for protein at all»
    - «linkage maps for several organisms had to be reordered once sequences arrived»
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: wrong_direction
    why: Breeding experiments are the method of 1913, and the text says establishing function still
      requires them, so the oldest approach remains in use.
    trap: D shows sequencing correcting the old maps rather than the old method still working.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A sequence tells a reader the letters and nothing about what they do, and most of the
      human sequence does not code for protein at all. A variant found by sequencing alone is therefore
      ___
    options:
    - a complete account of the trait it accompanies
    - proof that the trait is not inherited
    - located only in relative order on the chromosome
    - a correlation still waiting for an explanation
    key: D
    moves:
      A: overreach
      B: wrong_direction
      C: detail_swap
    why: The text says a correlation between a variant and a trait is not an explanation of it, so
      sequencing leaves the question of function still open.
    trap: A commits the characteristic error of the sequencing era that the text names.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «nascent» most nearly mean?
    target: nascent
    options:
    - newly fashionable
    - about to disappear
    - early and still forming
    - poorly understood
    key: C
    moves:
      A: near_miss
      B: wrong_direction
      D: imported
    why: The phrase names the methods of 1913, which were the first of their kind, so the word marks
      them as early rather than as fading or obscure.
    trap: B reverses the sense, since the text says those methods are still in use.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the dictionary comparison in the text?
    options:
    - It introduces the third generation of method
    - It makes the error about correlation concrete for a reader
    - It argues that a sequence is of no value at all
    - It reports when sequencing became industrial
    key: B
    moves:
      A: detail_swap
      C: overreach
      D: detail_swap
    why: The comparison follows the statement that a correlation is not an explanation, and gives
      the point a familiar form by setting a word position against a meaning.
    trap: C turns a limit on what a sequence shows into a claim that it shows nothing.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 traces three generations of method. Based on Text 2, what would be added to the account
      of the first of them?
    sibling: BIO-S02-L2
    sibling_gloss: Text 2 is passage 62 of this book. It derives the three to one ratio from two copies
      of each gene, random separation and dominance, and says the derivation fails usefully for features
      carried close together on the same chromosome.
    options:
    - The reason that close-together features break the simple rule
    - Traits rarely separated must sit close together on the chromosome
    - Sequencing arrived in a usable form in 1977
    - Mendel drew the first linkage map from his own peas
    key: A
    moves:
      B: restatement
      C: imported
      D: wrong_direction
    why: Text 2 shows why linked features do not assort independently, which is the failure of the
      ratio that the linkage map of Text 1 was built to exploit.
    trap: B repeats the logic of the linkage map that Text 1 has already given.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: The second generation was physical mapping, which located genes on visible chromosomes
      using stains, deletions and later fluorescent probes. ___ the third is sequencing, meaning reading
      the order of the chemical letters along a stretch of DNA.
    options:
    - By contrast,
    - In other words,
    - As a result,
    - After that,
    key: D
    moves:
      A: wrong_direction
      B: restatement
      C: near_miss
    why: The sentence names the next generation in a numbered series, so the transition must mark
      succession rather than contrast, restatement or consequence.
    trap: C reads sequencing as caused by physical mapping rather than as following it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: A sequence tells a reader the letters and nothing about what they do ___ and most of
      the human sequence does not code for protein at all.
    options:
    - do and
    - do, and
    - do; and
    - do and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about most of the sequence not coding for protein is independent, so the conjunction
      joining it to the clause about the letters takes a comma before it.
    trap: A leaves the two complete clauses about the sequence joined with no mark at all.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a sequence does not settle what a gene does. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a sequence does not settle what a gene does
    notes:
    - A sequence tells a reader the letters and nothing about what they do.
    - Most of the human sequence does not code for protein at all.
    - Establishing function still requires breeding experiments, cell studies and natural variation.
    - A correlation between a sequence variant and a trait is not an explanation of it.
    options:
    - Most of the human sequence does not code for protein at all
    - A correlation between a variant and a trait is not an explanation
    - Establishing function still requires breeding experiments and cell studies
    - Because the letters say nothing about function, a variant correlated with a trait still has
      to be explained by breeding and cell work
    key: D
    moves:
      A: underreach
      B: underreach
      C: true_not_asked
    why: Only this choice joins the silence of the letters to the methods that are still needed, which
      is what shows why the sequence alone settles nothing.
    trap: B names the error without saying what work would correct it.
- id: BIO-S03-L3
  summary_ar:
    khulasa: لم يرَ أحد قطّ جزيء سكّر وهو يُفكّك، وإنّما أُقيم المسار بطرائق غير مباشرة، وقام بمعظم
      العمل ثلاث حِيَل. الأولى المثبِّط، أي مادّة تسدّ خطوة واحدة بعينها، فالسيانيد يوقف تفاعلًا قرب
      نهاية السلسلة، وما يتراكم في الخلية المعالَجة به هو ما كان قبل السدّ مباشرة.
    maana: 'المعنى أنّ الثانية هي الوسم النظيري، أي ذرّة غير معتادة الوزن تُتبَّع بها المادّة عبر
      سلسلة تفاعلات: تُغذّى الخلية سكّرًا ثقيل الكربون، ويُجمع ما تتنفّسه من غاز، فيدلّ موضع الذرّات
      الثقيلة على مصير أجزاء الجزيء الأصلي. والثالثة تفكيك الخلية نفسها بالطرد المتفاوت.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: لكلّ حيلة حدّ يجب تسميته،
      فقد يُضعف السمّ خطوات عدّة لا واحدة، وقد تُشوّش تفاعلات غير متوقّعة الوسمَ، والعُضيّة المعزولة
      قُطعت عن كلّ ما كانت موصولة به.'
    sila: في اختبار سات يكثر السؤال عن حدود المنهج وعن وظيفة قائمة الجمل وعن التحوّل الذي يفيد النتيجة.
      والفخّ المتوقّع هنا أن تُقرأ قائمة الحدود سحبًا للنتيجة، مع أنّ النصّ يُقيم المسار ويُسمّي حدوده
      معًا. ويقترن المقطع بالمقطع الثالث والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Peter Mitchell proposed the last large piece in 1961
    - Someone has watched a sugar molecule being dismantled
    - Mitochondria were isolated by spinning broken cells
    - Three indirect tactics built the pathway, and each has limits
    key: D
    moves:
      A: true_not_asked
      B: wrong_direction
      C: underreach
    why: The text says nobody has watched the process and that three tactics did most of the work,
      then names the limits of all three.
    trap: B contradicts the opening sentence of the text.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does a cell treated with cyanide reveal about the pathway?
    options:
    - The position of the heavy carbon atoms in the sugar
    - The order of steps, from what piles up behind the block
    - Which structure in the cell carries out the steps
    - That the chain has no end reaction at all
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: overreach
    why: The text says the substances that accumulate are the ones immediately before the block, so
      the order of steps can be deduced from what piles up behind each poison.
    trap: A names what the isotope label shows rather than what the inhibitor shows.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that an isolated part of
      a cell may not behave as it did inside one?
    claim: an isolated part of a cell may not behave as it did inside one
    options:
    - «mitochondria were separated out by spinning broken cells at carefully chosen speeds»
    - «A label may be scrambled by reactions nobody suspected»
    - «An isolated organelle has been removed from everything it was connected to»
    - «it turned metabolic chemistry from speculation into bookkeeping»
    key: C
    moves:
      A: near_miss
      B: true_not_asked
      D: true_not_asked
    why: The quotation says the organelle has been cut off from everything it was connected to, which
      is the reason its behavior inside the cell cannot be assumed.
    trap: A describes how the organelle was obtained rather than the doubt about it.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A poison may attenuate several steps rather than one. A label may be scrambled by reactions
      nobody suspected. The three tactics taken together are therefore ___
    options:
    - stronger than any one of them alone
    - each sufficient on its own
    - useless for establishing any pathway
    - confined to the oxygen-dependent steps
    key: A
    moves:
      B: wrong_direction
      C: overreach
      D: detail_swap
    why: Each tactic has a different weakness, so a conclusion that all three support does not rest
      on the flaw of any one of them.
    trap: C turns the stated limits into a verdict that the methods establish nothing.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «attenuate» most nearly mean?
    target: attenuate
    options:
    - make thinner in shape
    - bring to a full stop
    - speed up a little
    - weaken the action of
    key: D
    moves:
      A: imported
      B: overreach
      C: wrong_direction
    why: The sentence warns that a poison may attenuate several steps rather than one, so the word
      names a partial weakening rather than a complete block.
    trap: B makes the effect total, which is what the warning is distinguishing it from.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the three sentences naming limits?
    options:
    - They introduce the isotope label for the first time
    - They withdraw the pathway as unestablished
    - They match one weakness to each tactic in turn
    - They explain how mitochondria were separated out
    key: C
    moves:
