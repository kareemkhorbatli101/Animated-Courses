- id: BIO-S05-L3
  summary_ar:
    khulasa: شركة خليج هدسن اشترت الفراء في شمال كندا ثلاثة قرون وحفظت حساباتها، ونُشرت تلك الحسابات
      في الثلاثينيات مردوداتِ فراء سنوية، أي عدد الجلود المشتراة في كلّ موسم، وهي للوشق وأرنب الثلج
      تمتدّ قرنًا كاملًا ونيّفًا.
    maana: 'المعنى أنّ السلسلة تُظهر أمرًا لافتًا: الحيوانان يصعدان وينهاران على دورة نحو عشر سنوات،
      ويسبق الأرنب الوشق بقليل، ويتكرّر النمط أكثر من قرن. لكنّ مردود الفراء بديل، أي قياس يقوم مقام
      كمّية لا تُرى مباشرة، وهو بديل عن أشياء عدّة في وقت واحد.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: المردود يتعلّق بعدد الحيوان
      وعدد الصيّادين وأسعار الفراء ومواضع المراكز، ولذلك أمضى علماء البيئة عقودًا في فصل الإشارة عن
      السجلّ، وحلقات الأشجار بديل ثانٍ مستقلّ تمامًا يُظهر الدورة نفسها.'
    sila: في اختبار سات يكثر السؤال عن حدود الدليل وعن وظيفة القائمة وعن معنى كلمة في سياقها. والفخّ
      المتوقّع هنا أن يُقرأ مردود الفراء عدًّا للحيوان، مع أنّ النصّ يبيّن أنّه بديل مركّب. ويقترن
      المقطع بالمقطع الخامس والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The cycle is visible in the memories of trappers
    - A century-long proxy had to be corrected before it could be read
    - Fur returns count animals rather than pelts bought
    - No other wild population record of that length exists
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: true_not_asked
    why: The text presents the fur returns, names the several things they depend on, and describes
      the corrections and the second proxy that make the cycle believable.
    trap: C reverses the definition, since a fur return is the number of pelts bought.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what is the strongest argument that the cycle is real?
    options:
    - The series runs for more than a century
    - Price series can be used to correct for effort
    - The hare peaks slightly before the lynx does
    - Tree ring records show the same cycle independently
    key: D
    moves:
      A: near_miss
      B: near_miss
      C: true_not_asked
    why: The text calls the tree ring records a second and entirely separate proxy and says their
      agreement is the strongest argument that the pattern is real.
    trap: B names one of the corrections rather than the independent confirmation.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the record measures
      several things at once?
    claim: the record measures several things at once
    options:
    - «It depends on how many animals there were and on how many trappers were working»
    - «both animals rise and crash on a cycle of roughly ten years»
    - «The Hudson's Bay Company bought furs across northern Canada for three centuries and kept its
      accounts»
    - «Independent counts from the twentieth century overlap the end of the series»
    key: A
    moves:
      B: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation names two different quantities that the same figure reflects, animal numbers
      and trapper numbers, which is what makes the return a proxy for several things.
    trap: D names a way of checking the record rather than what the record mixes together.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Each of those varies over a century, and several vary on their own cycles. A ten-year
      rhythm read off the returns alone is therefore ___
    options:
    - certain to be an artifact of commerce
    - a direct count of the animals present
    - open to a second explanation until checked
    - confirmed by the tree ring records already
    key: C
    moves:
      A: overreach
      B: wrong_direction
      D: detail_swap
    why: Because the returns also move with prices, effort and post locations, a rhythm in them could
      come from commerce, so the pattern needs an independent check.
    trap: A settles against the cycle where the text only withholds judgment.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «precarious» most nearly mean?
    target: precarious
    options:
    - uncertain in its records
    - always at risk of collapse
    - small in average number
    - difficult to count well
    key: B
    moves:
      A: imported
      C: near_miss
      D: imported
    why: The text says a cyclic population is permanently precarious even when its average is healthy,
      so the word names a standing risk rather than a small average.
    trap: C reads the word as a statement about size, though the sentence allows a healthy average.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the list of things a fur return depends on?
    options:
    - It shows why the series cannot be read as a count
    - It introduces the tree ring records for the first time
    - It argues that the accounts were badly kept
    - It reports the period of the cycle in years
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The list follows the definition of a proxy and names five other influences on the same figure,
      which is why ecologists had to separate the signal from the record.
    trap: C blames the bookkeeping, though the text treats the accounts as sound.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a cycle in the fur returns. Based on Text 2, what would be added to that
      reading?
    sibling: BIO-S05-L2
    sibling_gloss: Text 2 is passage 65 of this book. It explains exponential and logistic growth,
      says the textbook picture wrongly assumes an immediate response to shortage, and shows that
      a delayed response makes a population overshoot and then fluctuate.
    options:
    - Tree ring records of browsing show the same cycle
    - A fur return depends on how many trappers were working
    - The hare and the lynx peak in the same season
    - A mechanism that would produce a cycle of that kind
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 derives repeated swings from a delayed response to shortage, which supplies a reason
      for the ten-year rhythm that Text 1 can only report.
    trap: A repeats the independent check that Text 1 has already described.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Ecologists have therefore spent decades separating the signal from the record. ___ price
      series can be used to correct for effort.
    options:
    - By contrast,
    - Even so,
    - For instance,
    - In conclusion,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: restatement
    why: The second sentence gives one of the corrections just referred to in general, so the transition
      must introduce an example rather than a contrast or a conclusion.
    trap: B sets a method of correcting against the work of correcting it belongs to.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The series shows something striking ___ both animals rise and crash on a cycle of roughly
      ten years.
    options:
    - 'striking: both'
    - striking, both
    - striking both
    - striking; both,
    key: A
    moves:
      B: comma_splice
      C: run_on
      D: misplaced
    why: A colon introduces the striking thing the series shows, which a comma alone cannot do between
      two independent clauses.
    trap: B joins the clause about the cycle to the announcement with a comma alone.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a second proxy was needed. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why a second proxy was needed
    notes:
    - A fur return depends on animal numbers and on how many trappers were working.
    - It also depends on fur prices in London and on where the company posts were.
    - Tree ring records of hare browsing are a second and entirely separate proxy.
    - The tree rings show the same cycle.
    options:
    - A fur return depends on animal numbers and on trapper numbers
    - Tree ring records of hare browsing are an entirely separate proxy
    - Because the returns also move with prices and posts, a proxy with none of those influences was
      needed to show the cycle is real
    - The tree rings and the fur returns show the same ten-year cycle
    key: C
    moves:
      A: underreach
      B: underreach
      D: true_not_asked
    why: Only this choice names what the returns are contaminated by and why an unrelated proxy settles
      the question, which is what the goal asks for.
    trap: D reports the agreement without saying why an independent measure was required.
- id: BIO-S06-L3
  summary_ar:
    khulasa: 'وضع روبرت كوخ شروطًا ينبغي أن تستوفيها الدعوى في سبب مرض، وهي لا تزال نقطة البداية:
      أن يوجد الكائن في كلّ حالة من المرض، وأن يُعزل من مريض ويُنمَّى زرعًا نقيًّا، وأن يُحدث المرض
      إذا أُدخل في مضيف سليم، وأن يُستخرج من ذلك المضيف بعدها.'
    maana: 'المعنى أنّ الشرط الموضوع سلفًا نافع لأنّه قابل للفشل، وقد فشلت هذه الشروط فشلًا مفيدًا:
      فالأول ينكسر على الحامل بلا أعراض، والثاني ينكسر على كائنات لا تُنمَّى خارج خلية حيّة ومنها
      كلّ فيروس، والثالث ينكسر حيث لا يقع المرض إلّا في الإنسان.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: عُدَّت الشروط معيارًا يُقارَب
      لا يُستوفى، وحلّت محلّ الخطوات الناقصة الملازمةُ الإحصائية واستجابةُ الجرعة واختبارُ هل يشفي
      إزالةُ الكائن المرض.'
    sila: في اختبار سات يكثر السؤال عن حدود المعيار وعن وظيفة جملة التعريف وعن الدليل. والفخّ المتوقّع
      هنا أن يُقرأ انكسار الشروط إبطالًا لها، مع أنّ النصّ يجعل قابلية الفشل هي موضع نفعها. ويقترن
      المقطع بالمقطع السادس والستّين في أسئلة النصّين المتقابلين.
