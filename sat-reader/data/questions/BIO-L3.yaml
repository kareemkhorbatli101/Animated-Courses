- id: BIO-S04-L3
  summary_ar:
    khulasa: 'الدعوى بأنّ نوعًا يتحكّم في نوع آخر صعبة الاختبار، لأنّ التجربة البديهية تقتضي إزالة
      مفترس من منظر طبيعي كامل والانتظار. وطريقتان تجعلان السؤال قابلًا للتناول دون ذلك: الأولى المحجر،
      أي قطعة مسوّرة تمنع حيوانًا بعينه وتترك كلّ شيء آخر كما هو.'
    maana: 'المعنى أنّ سياج عشرين قطعة وترك عشرين بجوارها بلا سياج يفصل أثر الرعي عن أثر الماء والتراب
      والجوّ، لأنّ هذه تعمل في المجموعتين سواءً. والثانية تقرأ الحيوان نفسه: نسبة النظائر الثقيلة
      إلى الخفيفة في النسيج تختلف بالغذاء وترتفع في كلّ خطوة صعودًا في السلسلة.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: للطريقتين حدود تهمّ في خلاف
      يلوستون، فالمحجر يختبر الرعي ولا يختبر الخوف، والنظائر تعطي الغذاء لا السبب، وإعادة الإطلاق
      نفسها كانت التجربة وقد جرت بلا شاهد ضابط.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الجملة الافتتاحية وعن حدود
      المنهج. والفخّ المتوقّع هنا أن يُظنّ أنّ المحاجر تحسم السؤال، مع أنّ النصّ يقول إنّها لا تبلغ
      السبب. ويقترن المقطع بالمقطع الرابع والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Two indirect methods make the question testable, and both have boundaries
    - The Yellowstone reintroduction was carried out with a control area
    - Museum specimens can be sampled for isotope ratios
    - Fear rather than browsing explains the willow recovery
    key: A
    moves:
      B: wrong_direction
      C: underreach
      D: imported
    why: The text says the obvious experiment is impossible, names the exclosure and the isotope ratio
      as ways around it, and then names what each cannot do.
    trap: B reverses the text, which says the reintroduction was performed without a control.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does an exclosure hold constant between the fenced and unfenced
      plots?
    options:
    - The number of elk standing in each plot
    - The isotope ratios in the willow tissue
    - Water, soil and weather, which act on both equally
    - The period over which the tissue grew
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: detail_swap
    why: The text says the difference in willow growth separates browsing from water, soil and weather,
      because those act on both sets of plots equally.
    trap: A names the very thing an exclosure changes rather than what it holds constant.
  - slot: 3
    type: evidence
    difficulty: medium
