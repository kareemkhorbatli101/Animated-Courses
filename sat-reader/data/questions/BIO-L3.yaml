    sibling: BIO-S04-L2
    sibling_gloss: Text 2 is passage 64 of this book. It explains that energy is lost at every transfer,
      that about a tenth of it reaches the next level, and that a few wolves can therefore affect
      a large quantity of willow without any appeal to design.
    options:
    - An exclosure tests browsing and cannot test fear
    - Isotope ratios rise at each step up a food chain
    - The reason a small number of predators could matter at all
    - The reintroduction included twenty fenced control plots
    key: C
    moves:
      A: restatement
      B: restatement
      D: imported
    why: Text 2 derives the leverage of a few animals from the tenfold loss at each step, which is
      why the claim that Text 1 struggles to test is worth testing.
    trap: B repeats a property of the isotope method that Text 1 has already given.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: An exclosure tests browsing and cannot test fear, so it cannot distinguish elk eating
      fewer willows from elk standing in different places. ___ isotope ratios give diet, not cause,
      and the baseline ratios in a river valley vary with geology.
    options:
    - By contrast,
    - Similarly,
    - As a result,
    - In short,
    key: B
    moves:
      A: wrong_direction
      C: near_miss
      D: restatement
    why: The sentence adds a second limitation of the same kind, so the transition must mark likeness
      rather than contrast, consequence or summary.
    trap: A sets the second limitation against the first, though both point the same way.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Isotope ratios give diet, not cause ___ and the baseline ratios in a river valley vary
      with geology.
    options:
    - cause; and
    - cause and
    - 'cause: and'
    - cause, and
    key: D
    moves:
      A: wrong_mark
      B: run_on
      C: wrong_mark
    why: The clause about baseline ratios varying with geology is independent, so the conjunction
      joining it to the clause about diet takes a comma before it.
    trap: B leaves the clause about diet and the clause about geology with no mark between them.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the Yellowstone dispute has not been settled. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the Yellowstone dispute has not been settled
    notes:
    - An exclosure tests browsing and cannot test fear.
    - Isotope ratios give diet, not cause.
    - The cleanest design would require an experiment at a scale no regulator will permit.
    - The reintroduction was the experiment, and it was performed without a control.
    options:
    - An exclosure tests browsing and cannot test the effect of fear
    - Neither method reaches cause, and the one experiment that was run had no control, so the evidence
      cannot decide between the readings
    - Isotope ratios give diet rather than the cause of a change
    - The cleanest design is one no regulator would ever permit
    key: B
    moves:
      A: underreach
      C: underreach
      D: true_not_asked
