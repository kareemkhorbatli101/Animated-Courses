    - worry about greatly
    - measure very closely
    - leave entirely alone
    key: A
    moves:
      B: imported
      C: near_miss
      D: wrong_direction
    why: The sentence describes someone who wishes to perturb a system and watch, which is the deliberate
      disturbance that an experiment makes.
    trap: B takes the sense of being troubled, which a system cannot be.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the obvious experiment?
    options:
    - It introduces the stable isotope ratio by name
    - It concedes that the claim cannot be tested at all
    - It reports the number of plots along the creek
    - It sets up the problem the two methods are meant to solve
    key: D
    moves:
      A: detail_swap
      B: overreach
      C: detail_swap
    why: The opening sentence says the obvious test would mean removing a predator and waiting, which
