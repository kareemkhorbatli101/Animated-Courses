    trap: A repeats a strength of the ice core that Text 1 has already named.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Where instruments and proxies run together for a century, the relation can be established
      and then extended backward. ___ this is also where the method is most criticized.
    options:
    - For instance,
    - At the same time,
    - As a result,
    - In other words,
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: restatement
    why: The sentence attaches a drawback to the very step just praised, so the transition must hold
