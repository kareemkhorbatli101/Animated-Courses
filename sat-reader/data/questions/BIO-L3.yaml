    trap: C reads the criticism as following from the extension rather than accompanying it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The Mauna Loa record begins in 1958 ___ everything earlier has to be reconstructed.
    options:
    - in 1958, everything
    - in 1958 everything
    - in 1958, and, everything
    - in 1958. Everything
    key: D
    moves:
      A: comma_splice
      B: run_on
      C: misplaced
    why: The clause saying everything earlier has to be reconstructed is a complete sentence, so a
