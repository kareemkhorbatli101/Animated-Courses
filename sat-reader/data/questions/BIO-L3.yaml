  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why agreement between the proxies carries more weight than
      any one of them. Which choice most effectively uses relevant information from the notes to accomplish
      that goal?
    goal: explain why agreement between the proxies carries more weight than any one of them
    notes:
    - An ice core traps a physical sample of the atmosphere but smooths the record.
    - Tree rings give annual resolution but respond to several variables at once.
    - Corals record sea surface temperature but are tropical and marine.
    - Each proxy has a weakness the others do not share.
    options:
    - An ice core traps a physical sample of the atmosphere
    - The three weaknesses are unrelated, so a result all three give cannot have been produced by
      any of them
    - Tree rings give annual resolution over the last two thousand years
    - Corals are tropical and marine rather than polar
    key: B
    moves:
      A: underreach
      C: underreach
      D: true_not_asked
    why: Only this choice names the independence of the weaknesses and draws the conclusion from it,
      which is what makes the agreement stronger than any single record.
    trap: A gives the strength of one proxy without touching the argument from agreement.
- id: BIO-S09-L3
  summary_ar:
    khulasa: قبل النشاط الإشعاعي لم تكن هناك طريقة لتأريخ صخرة، وتراوحت تقديرات عمر الأرض على مرتبتين
      من العِظَم. والتأريخ الإشعاعي، أي تأريخ الصخرة بنسبة ما تحلّل من عنصر مشعّ، غيّر ذلك، لأنّ العنصر
      المشعّ يتحلّل بمعدّل لا يغيّره شيء في الجيولوجيا، فالنسبة الباقية ساعة.
    maana: المعنى أنّ المشكلة الباقية هي أنّ أقدم صخرة على الأرض أحدث من الأرض، لأنّ السطح يُصهر ويُدفن
      ويُعاد تدويره بلا انقطاع. فحلّها كلير باترسون سنة ألف وتسعمئة وثلاث وخمسين بتأريخ النيازك، بحجّة
      أنّها تكوّنت من السحابة نفسها في الوقت نفسه ولم تُضطرب بعدها.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: المنهج يقوم على افتراض يجب
      فحصه لا تسليمه، وهو أنّ العيّنة نظام مغلق، ويُفحص بتأريخ الصخرة نفسها بسلسلتي تحلّل يجب أن تتّفقا،
      وبتفضيل معادن تصبر على التسخين.'
    sila: في اختبار سات يكثر السؤال عن وظيفة الجملة التي تسمّي شرطًا وعن الدليل وعن إكمال النصّ. والفخّ
      المتوقّع هنا أن يُقرأ ذكر الافتراض تشكيكًا في المنهج، مع أنّ النصّ يجعل اختلاف المنهجين نفسه
      دليلًا. ويقترن المقطع بالمقطع التاسع والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Patterson had to build a clean laboratory to do the work
    - A clock that geology cannot alter settled the age, once the right sample was found
    - The oldest rock on Earth gives the age of the Earth
    - Holmes had the order of magnitude right by the 1920s
    key: B
    moves:
      A: true_not_asked
      C: wrong_direction
      D: underreach
    why: The text says a radioactive element decays at a rate nothing in geology alters, and that
      the remaining problem was solved by dating meteorites rather than terrestrial rock.
    trap: C states the difficulty the text names, since the surface has been melted and recycled.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why did Patterson date meteorites instead of rocks from Earth?
    options:
    - Because meteorites contain more uranium than zircon does
    - Because lead isotopes cannot be measured in terrestrial rock
    - Because two decay chains must be compared in the same sample
    - Because the oldest rock on Earth is younger than the Earth
    key: D
    moves:
      A: imported
      B: imported
      C: detail_swap
    why: The text says the remaining problem was that the oldest rock is younger than the Earth, since
      the surface has been melted, buried and recycled continuously.
    trap: C names one of the tests of a closed system rather than the reason for the choice.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a disagreement between
      methods is informative rather than merely awkward?
    claim: a disagreement between methods is informative rather than merely awkward
    options:
    - «Where two methods disagree, the rock has been disturbed, and the disagreement itself is the
      evidence»
    - «A radioactive element decays at a rate that nothing in geology alters»
    - «Arthur Holmes spent forty years applying the method to rocks and had the order of magnitude
      right by the 1920s»
    - «they prefer minerals physically resilient enough to survive heating»
    key: A
    moves:
      B: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation says that where two methods disagree the rock has been disturbed and the disagreement
      is itself the evidence, which is the claim exactly.
    trap: D names the other precaution geologists take rather than what a disagreement shows.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Zircon crystals are the favorite, because they hold their uranium and reject lead so
      strongly that grains four billion years old are still usable. A mineral that let lead in and
      out would therefore ___
    options:
    - give an age older than the rock around it
    - be preferred for its ease of measurement
    - fail the test of being a closed system
    - agree with both decay chains at once
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: wrong_direction
    why: The method assumes that nothing relevant has entered or escaped since the sample formed,
      so a mineral that exchanged lead would break that assumption.
    trap: D claims agreement between chains, which the text uses as the sign of an undisturbed rock.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «resilient» most nearly mean?
    target: resilient
    options:
    - quick to recover afterward
    - tough enough to last
    - common in most rocks
    - easy to date precisely
    key: B
    moves:
      A: near_miss
      C: imported
      D: near_miss
    why: The sentence says geologists prefer minerals physically resilient enough to survive heating,
      so the word names durability rather than recovery or abundance.
    trap: A takes the sense of bouncing back, which a crystal surviving heat does not do.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about the assumption to be checked?
    options:
    - It turns from the method to the condition the method needs
    - It introduces the meteorite measurement for the first time
    - It concedes that radiometric dating cannot be trusted
    - It reports the figure Patterson obtained in 1953
    key: A
    moves:
      B: detail_swap
      C: overreach
      D: detail_swap
    why: The sentence comes after the age has been settled and names the closed system as something
      that has to be checked, which the two tests that follow then do.
    trap: C turns a condition to be verified into a rejection of the whole method.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 explains how the age of the Earth was fixed. Based on Text 2, what would be added
      to that explanation?
    sibling: BIO-S09-L2
    sibling_gloss: Text 2 is passage 69 of this book. It explains that there are only three kinds
      of plate edge, that collision lifts rock while rain, ice and rivers wear it down, and that the
      height of a range is the balance between the two rates.
    options:
    - The surface of the Earth has been melted and recycled
    - Zircon crystals hold uranium and reject lead strongly
    - Meteorites have been recycled in the same way as rock
    - The process that keeps destroying the oldest rock on Earth
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 names the moving plates and the wearing down of ranges, which is the machinery behind
      the recycling that forced Text 1 to look at meteorites instead.
    trap: A repeats the difficulty Text 1 has already stated rather than explaining it.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Geologists test it in two ways. They date the same rock with two different decay chains,
      which must agree. ___ they prefer minerals physically resilient enough to survive heating.
    options:
    - By contrast,
    - Even so,
    - Second,
    - As a result,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: near_miss
    why: The sentence gives the second of the two tests just announced, so the transition must number
      it rather than set it against the first or derive it from the first.
    trap: D reads the choice of mineral as following from the comparison of decay chains.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Before radioactivity there was no way to date a rock ___ and estimates for the age of
      the Earth ranged over two orders of magnitude.
    options:
    - rock, and
    - rock and
    - rock; and
    - rock and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about estimates ranging over two orders of magnitude is independent, so the conjunction
      joining it to the clause about dating a rock takes a comma.
    trap: B leaves the clause about dating and the clause about the estimates with no mark between
      them.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a meteorite could settle a question about the Earth. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a meteorite could settle a question about the Earth
    notes:
    - The oldest rock on Earth is younger than the Earth, since the surface has been recycled.
    - Meteorites formed from the same cloud of material at the same time.
    - They have been undisturbed since.
    - Patterson measured lead isotopes and obtained four and a half billion years.
    options:
    - The oldest rock on Earth is younger than the Earth itself
    - Patterson obtained four and a half billion years from lead isotopes
    - A meteorite formed with the Earth and has not been disturbed since, so it keeps a clock the
      recycled surface has lost
    - Meteorites formed from the same cloud of material at the same time
    key: C
    moves:
      A: underreach
      B: true_not_asked
      D: underreach
    why: Only this choice joins the common origin and the undisturbed history to the recycling that
      destroyed the terrestrial record, which is the whole argument.
    trap: D gives the shared origin without the undisturbed history that makes the clock readable.
- id: BIO-S10-L3
  summary_ar:
    khulasa: 'آلتان مختلفتان جدًّا تقيسان ما يجري في أنتاركتيكا. الأولى قياس الجاذبية، أي قياس الكتلة
      بجذبها الجاذبي: زوج من الأقمار أُطلق سنة ألفين واثنتين يطير في المدار نفسه على بعد نحو مئتي
      كيلومتر، وتُقاس المسافة بينهما باستمرار إلى حدود ميكرونات قليلة.'
    maana: 'المعنى أنّ القمر المتقدّم إذا مرّ فوق منطقة أثقل انجذب إلى الأمام قليلًا، فيدلّ تغيّر
      الفرجة على الكتلة تحته، وتكرار المدار سنين يعطي تغيّر الكتلة. والآلة الثانية أقدم وأبسط: مقياس
      المدّ الثابت الذي يسجّل مستوى البحر إلى علامة محلّية، وقد تعلو الأرض التي رُكّب عليها أو تهبط.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: الطريقتان تفشلان في جهتين
      متعاكستين، ولهذا تُستعملان معًا؛ فالجاذبية تقيس الكتلة ولا ترى إلى أين ذهب الماء، ومقاييس المدّ
      تقيس ما يهمّ الميناء لكنّها متكتّلة في نصف الأرض الشمالي.'
    sila: في اختبار سات يكثر السؤال عن الدليل الذي يسند دعوى وعن وظيفة الفقرة وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُقرأ رقم الكتلة الكلّي مستوى بحر محلّيًّا، مع أنّ النصّ يفرّق بينهما.
      ويقترن المقطع بالمقطع السبعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The first satellite pair was replaced in 2018
    - A tide gauge measures the whole ocean at once
    - Two instruments that fail in opposite directions are used together
    - Gravimetry measures the distance between two satellites
    key: C
    moves:
      A: true_not_asked
      B: wrong_direction
      D: underreach
    why: The text describes gravimetry and the tide gauge, says the two methods fail in opposite directions,
      and names that as the reason they are used together.
    trap: B reverses the text, which says a gauge measures the sea where it stands.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what must each tide gauge record be corrected for?
    options:
    - Movement of the land the gauge is bolted to
    - The distance between the two satellites
    - Water moving in the rock beneath the ice
    - The radar bounced off the sea surface
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says gauges measure the sea where they stand and the land they are bolted to may
      itself be rising or sinking, so each record must be corrected for ground movement.
    trap: C names a limit of gravimetry rather than a correction a gauge needs.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the two methods are
      kept because their weaknesses do not overlap?
    claim: the two methods are kept because their weaknesses do not overlap
    options:
    - «the distance between them was measured continuously to within a few microns»
    - «The two methods fail in opposite directions, which is why they are used together»
    - «Satellite altimetry, which bounces radar off the sea surface, now provides a third series»
    - «a loss of some hundreds of gigatons a year»
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: true_not_asked
    why: 'The quotation states the reason outright: the two methods fail in opposite directions, and
      that is why both are used.'
    trap: C names a third series rather than the reason the first two are paired.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Gravimetry measures mass but cannot see where the water went, and it cannot separate
      ice loss from water moving in the rock beneath. A mass figure on its own is therefore ___
    options:
    - enough to plan a harbor defense
    - a direct reading of local sea level
    - corrected by the movement of the ground
    - an amount without a destination
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: detail_swap
    why: The method gives how much mass was lost but not where the water ended up, so the figure names
      a quantity and leaves its destination open.
    trap: B treats a global mass figure as the local reading that a gauge supplies.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «mitigate» most nearly mean?
    target: mitigate
    options:
    - measure with care
    - argue against openly
    - lessen the effect of
    - bring about sooner
    key: C
    moves:
      A: near_miss
      B: imported
      D: wrong_direction
    why: The sentence describes planning that aims to mitigate a rise, so the word names the work
      of reducing its effect rather than measuring or hastening it.
    trap: D reverses the purpose, since the planning is meant to blunt the rise.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph on the tide gauge?
    options:
    - It introduces satellite altimetry for the first time
    - It sets an older and simpler method beside the new one
    - It argues that gravimetry should be abandoned
    - It reports the separation of the two satellites
    key: B
    moves:
      A: detail_swap
      C: overreach
      D: detail_swap
    why: The paragraph opens by calling the second instrument older and simpler, and describes what
      it measures, which prepares the comparison of how the two methods fail.
    trap: C turns a comparison of two methods into a case against one of them.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 describes how the loss is measured. Based on Text 2, what would be added to that
      description?
    sibling: BIO-S10-L2
    sibling_gloss: Text 2 is passage 70 of this book. It explains that water carries heat far better
      than air, that a current two degrees above freezing melts the floating ice from below, and that
      a retrograde slope makes each retreat expose thicker ice.
    options:
    - The process that the measured loss of mass is recording
    - Gravimetry cannot say where the lost water went
    - A tide gauge measures sea level against a local benchmark
    - Gravimetry measured the melting beneath the floating ice
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 gives the warm water and the sloping bed that remove the ice, which is what the hundreds
      of gigatons a year in Text 1 are a measurement of.
    trap: B repeats a limit of gravimetry that Text 1 has already named.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Gauges measure the sea where they stand, and the land they are bolted to may itself be
      rising or sinking. ___ each record must be corrected using independent measurements of ground
      movement.
    options:
    - By contrast,
    - For instance,
    - Even so,
    - For that reason,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: wrong_direction
    why: The correction follows from the fact that the land may move, so the transition must mark
      a consequence rather than a contrast or an example.
    trap: C sets the correction against the reason the correction is needed.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The second instrument is older and simpler ___ a tide gauge has been operating in some
      harbors since the nineteenth century.
    options:
    - simpler, a
    - simpler. A
    - simpler a
    - simpler, and, a
    key: B
    moves:
      A: comma_splice
      C: run_on
      D: misplaced
    why: The clause about the gauge operating in harbors since the nineteenth century is a complete
      sentence, so a period separates it from the clause calling the instrument simpler.
    trap: A splices the clause about the harbors onto the clause about the simpler instrument with
      a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why planning needs more than one of the three series. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why planning needs more than one of the three series
    notes:
    - Gravimetry measures mass but cannot see where the water went.
    - Tide gauges measure what matters to a harbor but are clustered in rich countries.
    - Satellite altimetry covers the whole ocean since 1992.
    - Local sea level is what floods a street and global mass is what drives it.
    options:
    - Gravimetry measures mass but cannot see where the water went
    - Satellite altimetry has covered the whole ocean since 1992
    - Tide gauges are clustered in the northern hemisphere and in rich countries
    - Local sea level is what floods a street and global mass is what drives it, and no single series
      gives both
    key: D
    moves:
      A: underreach
      B: true_not_asked
      C: underreach
    why: Only this choice names the two quantities that planning needs and says that no one series
      supplies both, which is why all three are used.
    trap: A gives one method and one gap without naming what the other series supply.
