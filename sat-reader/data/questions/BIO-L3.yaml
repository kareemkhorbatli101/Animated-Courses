      ago»
    - «An exclosure tests browsing and cannot test fear, so it cannot distinguish elk eating fewer
      willows from elk standing in different places»
    - «Isotope ratios give diet, not cause, and the baseline ratios in a river valley vary with geology»
    - «is also asking for an experiment at a scale that no institution will fund and no regulator
      will permit»
    key: D
    moves:
      A: true_not_asked
      B: near_miss
      C: near_miss
    why: The quotation says the scale required is one that no funder will pay for and no regulator
