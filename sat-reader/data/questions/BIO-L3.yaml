    difficulty: easy
    stem: According to the text, what breaks the second of the conditions?
    options:
    - Organisms that cannot be grown outside a living cell
    - People who harbor an organism without becoming ill
    - Diseases that occur only in human beings
    - Researchers who volunteer to swallow a culture
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says the second condition breaks on organisms that cannot be grown outside a living
      cell, which includes every virus and several bacteria.
    trap: B names what breaks the first condition rather than the second.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the conditions are treated
      as a standard to approach rather than a test to pass?
    claim: the conditions are treated as a standard to approach rather than a test to pass
    options:
    - «Koch himself found cholera in people who were perfectly well, and the organism that causes
      diphtheria is ubiquitous in some populations with no disease at all»
    - «Modern practice replaces the missing steps with statistical association, dose response, and
      the test of whether removing the organism cures the disease»
    - «Barry Marshall drank a culture of Helicobacter pylori in 1984, developed gastritis, and recovered
      the organism from his own stomach»
    - «They substitute the presence of particular genes for the growing of a pure culture»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: near_miss
    why: The quotation names the substitutes used where the original steps cannot be taken, which
      is what treating the conditions as a standard rather than a test means in practice.
    trap: C gives one case in which a missing step was supplied rather than the general practice.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The third breaks wherever the disease occurs only in humans, since the experiment cannot
      ethically be done. A claim about such a disease must therefore ___
    options:
    - satisfy all four conditions as Koch wrote them
    - be abandoned until an animal model appears
    - rest on the growing of a pure culture alone
    - rest on evidence of some other kind
    key: D
    moves:
      A: wrong_direction
      B: overreach
      C: detail_swap
    why: If the third condition cannot ethically be met, a claim about a human-only disease has to
      be supported by the substitutes the text goes on to name.
    trap: B treats an unmeetable condition as a bar to any conclusion at all.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «ubiquitous» most nearly mean?
    target: ubiquitous
    options:
    - unusually dangerous
    - easily recognized
    - present nearly everywhere
    - confined to one place
    key: C
    moves:
      A: imported
      B: imported
      D: wrong_direction
    why: The organism that causes diphtheria is said to be ubiquitous in some populations with no
      disease at all, so the word reports how widely it is found.
    trap: D reverses the sense, since the point is that the organism is found throughout.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence defining a postulate?
    options:
    - It introduces the molecular versions proposed in 1988
    - It explains why the failures that follow are worth having
    - It concedes that the conditions were badly chosen
    - It reports the four conditions in their original order
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence says a condition laid down in advance is useful precisely because it can fail,
      which is what makes the three breakages that follow informative.
    trap: C reads the usefulness of failure as a complaint about the conditions.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 examines the conditions for naming a cause. Based on Text 2, what would be added
      to that examination?
    sibling: BIO-S06-L2
    sibling_gloss: Text 2 is passage 66 of this book. It argues that an outbreak is governed by route,
      dose, the reproduction number and the incubation period, and that a reproduction number below
      one makes an outbreak die out.
    options:
    - Quantities that can be measured once a cause is granted
    - The organism must be found in every case of the disease
    - Some carriers harbor an organism without becoming ill
    - Koch measured the reproduction number of cholera himself
    key: A
    moves:
      B: restatement
      C: restatement
      D: imported
    why: Text 2 moves past the question of which organism causes a disease to the numbers that govern
      its spread, which is the work that begins where Text 1 ends.
    trap: B repeats the first of the conditions that Text 1 has already set out.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Workers have therefore treated the postulates as a standard to be approached rather than
      met. ___ where an animal model is impossible, the third condition has occasionally been satisfied
      by a researcher who volunteered.
    options:
    - By contrast,
    - In short,
    - Even so,
    - For instance,
    key: D
    moves:
      A: wrong_direction
      B: restatement
      C: wrong_direction
    why: The sentence gives one way the standard has been approached in practice, so the transition
      must introduce an example rather than a contrast or a summary.
    trap: C sets the volunteer case against the practice it illustrates.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The organism must be found in every case of the disease ___ and it must be isolated from
      a patient and grown in pure culture.
    options:
    - disease and
    - disease, and
    - disease; and
    - disease and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about isolating the organism and growing it in pure culture is independent, so
      the conjunction joining it to the clause about every case takes a comma.
    trap: A leaves the clause about every case and the clause about culture with no mark between them.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the postulates are still taught although they fail. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the postulates are still taught although they fail
    notes:
    - A postulate is useful precisely because it can fail.
    - The first condition breaks on the asymptomatic carrier.
    - The second breaks on organisms that cannot be grown outside a living cell.
    - Modern practice replaces the missing steps with statistical association and dose response.
    options:
    - The first condition breaks on the asymptomatic carrier
    - Some organisms cannot be grown outside a living cell at all
    - Modern practice uses statistical association and dose response
    - Each failure shows what is missing and what must replace it, which is why a condition that can
      fail is worth laying down
    key: D
    moves:
      A: underreach
      B: underreach
      C: true_not_asked
    why: Only this choice connects the usefulness of a failure to the substitutes it calls for, which
      is what makes a failed condition worth keeping.
    trap: C names the replacements without saying why the original conditions remain useful.
- id: BIO-S07-L3
  summary_ar:
    khulasa: في روثامستد بمقاطعة هرتفوردشير حقل يُسمّى برودبالك يزرع القمح تحت معاملات ثابتة منذ سنة
      ألف وثمانمئة وثلاث وأربعين. والحقل مقسوم شرائح، شريحة منها لم تنل شيئًا قطّ مئة وثمانين سنة،
      وأخرى تنال سماد المزرعة كلّ سنة بلا استثناء، والباقي ينال خلائط مقيسة.
    maana: المعنى أنّ التجربة الطويلة تجيب ما لا تجيبه تجربة ثلاث سنوات. فالمادّة العضوية في التراب
      تتغيّر على العقود، فلا تظهر إلّا في سلسلة بهذا الطول أنّ الشريحة المسمّدة تصعد صعودًا مطّردًا
      وأنّ غير المسمّدة تستقرّ عند نحو ثلث المحصول وتبقى هناك.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: والقيمة الثانية الأقلّ ظهورًا
      هي المحفوظات، فعيّنات التراب والحبّ مخزونة في أوعية مُحكمة منذ البداية، وتُحلَّل بطرائق لم تكن
      موجودة يوم جُمعت.'
    sila: في اختبار سات يكثر السؤال عن وظيفة الفقرة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب طول التجربة وحده هو الفائدة، مع أنّ النصّ يضيف المحفوظات ونتائج
      لم يقصدها أحد يوم بدأت. ويقترن المقطع بالمقطع السابع والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Several other long-term sites exist in Illinois, Sweden and India
    - The treatments on Broadbalk have changed many times
    - The unfertilized strip yields about a third of the manured one
    - A fixed field for a hundred and eighty years answers what short trials cannot
    key: D
    moves:
      A: true_not_asked
      B: wrong_direction
      C: underreach
    why: The text says a long-term experiment answers questions a three-year trial cannot, names the
      slow processes it makes visible, and adds the value of the archive.
    trap: B contradicts the text, which says the treatments have barely changed.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what has been stored at Rothamsted since the beginning?
    options:
    - The original notebooks of the Victorian designers
    - Soil and grain samples in sealed jars
    - Weed populations gathered from each strip
    - Yields recorded at every harvest since 1843
    key: B
    moves:
      A: imported
      C: detail_swap
      D: near_miss
    why: The text says soil and grain samples have been stored since the beginning, in sealed jars,
      and can be analyzed by methods that did not exist when they were collected.
    trap: D names the records kept rather than the physical material stored.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the experiment has produced
      results nobody set out to obtain?
    claim: the experiment has produced results nobody set out to obtain
    options:
    - «one of them has received nothing at all for a hundred and eighty years»
    - «Soil organic matter changes over decades, so only a series of this length shows the manured
      strip climbing steadily»
    - «the rise of radioactive fallout in the 1950s and its decline, and changes in soil bacteria,
      none of which anyone in 1843 could have intended»
    - «One soil, one climate, one rotation, and a set of treatments chosen by Victorians»
    key: C
    moves:
      A: true_not_asked
      B: near_miss
      D: true_not_asked
    why: The quotation ends by saying that nobody in 1843 could have intended those measurements,
      which is exactly the unintended yield the claim describes.
    trap: B names a slow process the design did aim at rather than an unintended result.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Rare events are captured because the experiment happens to be running when they occur.
      A trial that lasts three years is therefore ___
    options:
    - unlikely to be running when one arrives
    - certain to miss every slow process entirely
    - better placed to catch a rare event
    - limited by the choice of Victorian treatments
    key: A
    moves:
      B: overreach
      C: wrong_direction
      D: detail_swap
    why: A rare event is caught only by an experiment that happens to be running at the time, so a
      short trial is seldom in place when one occurs.
    trap: C reverses the comparison, since the long experiment is the one that catches them.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «proliferate» most nearly mean?
    target: proliferate
    options:
    - change in kind
    - become rarer
    - spread by seed
    - increase in number
    key: D
    moves:
      A: near_miss
      B: wrong_direction
      C: imported
    why: The sentence says weed populations proliferate and then shift in composition, so the word
      names the growth in number that comes before the change in kind.
    trap: A takes the shift in composition that the sentence names separately.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph about the archive?
    options:
    - It introduces the fixed treatments for the first time
    - It concedes that the yields were never recorded
    - It adds a second value the design did not plan for
    - It reports the yield of the unfertilized strip
    key: C
    moves:
      A: detail_swap
      B: wrong_direction
      D: detail_swap
    why: The text calls the archive the second, less obvious value, and then lists measurements made
      from the stored jars by methods that did not yet exist.
    trap: B denies the record that the text says was kept at every harvest.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 describes a field under fixed treatments. Based on Text 2, what would be added to
      that description?
    sibling: BIO-S07-L2
    sibling_gloss: Text 2 is passage 67 of this book. It sets out fixation, uptake, decay and return
      as the steps of the nitrogen cycle, and names harvest, leaching and gas losses as the three
      ways a cropped field loses nitrogen.
    options:
    - The unfertilized strip settles at about a third of the yield
    - The chemistry that makes the unfertilized strip settle where it does
    - Soil and grain samples have been stored in sealed jars
    - Rothamsted measured the leaching of nitrate from the start
    key: B
    moves:
      A: restatement
      C: restatement
      D: imported
    why: Text 2 names the three leaks that drain a cropped field, which is why a strip receiving nothing
      holds at a low yield instead of failing altogether.
    trap: A repeats the figure that Text 1 has already given for that strip.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: The treatments have barely changed, the plots are in the same places, and the yields
      have been recorded every harvest. ___ this is the longest continuous agricultural experiment
      in the world.
    options:
    - As a result,
    - By contrast,
    - Even so,
    - For example,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: near_miss
    why: The unchanged treatments, the fixed plots and the unbroken record are what make the claim
      about the longest experiment true, so the transition marks a consequence.
    trap: C sets the conclusion against the three facts that support it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Slow processes become visible ___ the accumulation of phosphate, the acidification of
      soil under ammonium fertilizer, and the shifting of weed populations.
    options:
    - visible, the
    - visible the
    - 'visible: the'
    - visible; the,
    key: C
    moves:
      A: wrong_mark
      B: run_on
      D: misplaced
    why: A colon introduces the list of slow processes that the sentence has just announced, which
      neither a comma nor a bare run of phrases can do.
    trap: A uses a comma where the list needs the mark that announces it.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the jars matter as much as the yields. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the jars matter as much as the yields
    notes:
    - Soil and grain samples have been stored since 1843 in sealed jars.
    - They can be analyzed by methods that did not exist when they were collected.
    - The jars have been used to measure industrial pollution and radioactive fallout.
    - Nobody in 1843 could have intended those measurements.
    options:
    - Because the stored samples can be read by methods invented later, the jars answer questions
      the design never asked
    - Soil and grain samples have been stored since 1843 in sealed jars
    - The jars have been used to measure industrial pollution and fallout
    - Nobody in 1843 could have intended those measurements
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice joins the later methods to the questions the design never asked, which is
      what makes the archive worth as much as the yield record.
    trap: C names two of those later measurements without saying what made them possible.
- id: BIO-S08-L3
  summary_ar:
    khulasa: سجلّ ماونا لوا يبدأ سنة ألف وتسعمئة وثمان وخمسين، وكلّ ما قبله لا بدّ من إعادة بنائه،
      وثلاثة بدائل مستقلّة تحمل معظم الثقل. وأقواها قلب الجليد، أي أسطوانة تُستخرج من نهر جليدي، لأنّ
      الهواء المحتجز في فقاعاتها عيّنة فيزيائية من جوّ السنة التي نزل فيها الثلج.
    maana: 'المعنى أنّ حلقات الأشجار تعطي ميزًا سنويًّا في ألفي سنة الأخيرة في أنواع مناسبة، وأنّ
      المرجان ينمو حِلقًا سنوية تسجّل كيمياؤها حرارة سطح البحر. ولكلّ بديل ضعف لا يشاركه فيه الآخران:
      فالقلوب تُملّس السجلّ، والحلقات تستجيب لعوامل عدّة، والمرجان مداريّ بحريّ.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الدليل: الجمع بين البدائل يتوقّف على
      مدّة المعايرة، وهي التداخل الذي يُقارَن فيه البديل بقياس مباشر، وهناك أشدّ ما يُنتقد المنهج،
      لأنّ علاقةً رُكّبت في مدّة قد لا تصحّ في غيرها.'
    sila: في اختبار سات يكثر السؤال عن وظيفة قائمة الأضعاف وعن الدليل الذي يسند دعوى وعن الاستنتاج
      من جملة ناقصة. والفخّ المتوقّع هنا أن يُحسب اتّفاق البدائل خلوًّا من كلّ شكّ، مع أنّ النصّ يقول
      إنّ حدود الخطأ تتّسع كلّما رجعنا. ويقترن المقطع بالمقطع الثامن والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Three proxies with unrelated weaknesses agree, and that agreement is the argument
    - Ice cores measure carbon dioxide by inference rather than directly
    - Antarctic cores reach back about eight hundred thousand years
    - Error bars narrow as a reconstruction goes further back
    key: A
    moves:
      B: wrong_direction
      C: underreach
      D: wrong_direction
    why: The text introduces three proxies, gives each one its own weakness, and says the agreement
      between methods with unrelated weaknesses is the real argument.
    trap: D reverses the text, which says the error bars widen as they go back.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why is an ice core the strongest of the three proxies?
    options:
    - It gives annual resolution over two thousand years
    - It comes from two polar regions at once
    - Its trapped air is a physical sample of the atmosphere
    - Its chemistry records sea surface temperature
    key: C
    moves:
      A: detail_swap
      B: wrong_direction
      D: detail_swap
    why: The text says the air trapped in the bubbles is a physical sample of the atmosphere of the
      year the snow fell, and that the carbon dioxide is measured directly.
    trap: A names the strength of the tree ring record rather than of the core.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the combining of proxies
      is where the method is most open to challenge?
    claim: the combining of proxies is where the method is most open to challenge
    options:
    - «Ice cores smooth the record, because air diffuses in the snow before the bubbles close»
    - «Tree rings respond to several variables at once and to the age of the tree»
    - «Cores from Antarctica now reach back about eight hundred thousand years»
    - «a relation fitted in one period may not hold in another»
    key: D
    moves:
      A: near_miss
      B: near_miss
      C: true_not_asked
    why: The quotation names the weakness of the calibration step itself, that a relation established
      in the overlap may fail outside it, which is the challenge the claim describes.
    trap: A names a weakness of one proxy rather than of the step that joins them.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Each proxy has a weakness that the others do not share. Ice cores smooth the record,
      and they come from two polar regions. Tree rings respond to several variables at once. A conclusion
      all three support is therefore ___
    options:
    - as weak as the weakest of the three
    - not resting on any one of those flaws
    - free of every source of uncertainty
    - confined to the last two thousand years
    key: B
    moves:
      A: wrong_direction
      C: overreach
      D: detail_swap
    why: Because the three weaknesses are unrelated, a result that all three give cannot be produced
      by any single one of them.
    trap: C turns independence from one flaw into freedom from all uncertainty.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «dormant» most nearly mean?
    target: dormant
    options:
    - unused for a long while
    - frozen through and through
    - lost beyond recovery
    - growing very slowly
    key: A
    moves:
      B: imported
      C: overreach
      D: imported
    why: The core lay dormant in a freezer for twenty years before anyone thought to measure its bubbles,
      so the word reports that it sat unused.
    trap: B takes the literal cold of the freezer rather than the idleness the sentence reports.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the three sentences naming each weakness?
    options:
    - They introduce the calibration period for the first time
    - They withdraw the reconstruction as unsupported
    - They report the resolution each proxy achieves
    - They establish that the three failures are unrelated
    key: D
    moves:
      A: detail_swap
      B: overreach
      C: detail_swap
    why: Each sentence gives a weakness peculiar to one proxy, which is what lets the text claim later
      that the agreement between methods with unrelated weaknesses is the real argument.
    trap: B reads a list of weaknesses as the collapse of the reconstruction.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 describes how earlier concentrations are reconstructed. Based on Text 2, what would
      be added to that account?
    sibling: BIO-S08-L2
    sibling_gloss: Text 2 is passage 68 of this book. It explains that water vapor and carbon dioxide
      absorb in the infrared, that the mechanism is a delay rather than a trap, and that residence
      time and feedback decide how much it matters.
    options:
    - Carbon dioxide in ice cores is measured directly
    - Error bars widen as a reconstruction goes back
    - Why a reconstructed concentration is worth having at all
    - Ice cores record the delay in the escape of radiation
    key: C
    moves:
      A: restatement
      B: restatement
      D: wrong_direction
    why: Text 2 explains what a concentration of the gas does to the energy leaving the planet, which
