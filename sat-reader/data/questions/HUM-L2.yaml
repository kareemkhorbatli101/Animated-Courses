# Humanities level 2 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: HUM
level: 2
sets:
- id: HUM-S01-L2
  summary_ar:
    khulasa: 'يُعرَّف الراوي بما يصل إليه لا بشخصيّته، وللرواية ثلاثة مواضع قياسيّة: متكلّم لا يروي
      إلّا ما يدركه شخص واحد أو يذكره أو يحدسه، وغائب محدود يقف خارجًا ويلازم عقلًا واحدًا في المرّة،
      وعليم له وصول إلى كلّ عقل في الكتاب فيُخبر بما يفكّر فيه اثنان في اللحظة نفسها.'
    maana: 'المعنى أنّ كلّ موضع يحدّد نوع المفاجأة المتاحة: الخديعة تسهل في المتكلّم لأنّ القارئ داخل
      العقل المخدوع، والسخرية تسهل في العليم لأنّ الصوت يُظهر شخصًا مخطئًا في جملة يوافق عليها، والتشويق
      البسيط يكاد يستحيل في المتكلّم الصارم.'
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: طوّر روائيّو القرن التاسع عشر خيارًا
      رابعًا هو الأشيع اليوم، وهو الأسلوب غير المباشر الحرّ: صوت غائب ينزلق إلى طريقة تفكير الشخص
      دون إعلان، فتحمل الجملة معجمه وأحكامه وتبقى نحويًّا خارجه.'
    sila: في اختبار سات يكثر السؤال عن النبرة وعن وظيفة جزء من النصّ وعن معنى كلمة في سياقها، وسؤال
      النبرة في الحقيقة سؤال عن موضع الصوت. والفخّ المتوقّع هنا أن يُعرَّف الراوي بشخصيّته، مع أنّ
      النصّ يعرّفه بوصوله. ويقترن المقطع بالمقطع الحادي والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Jane Austen uses free indirect style constantly
    - What a narrator can report decides what surprises are possible
    - An omniscient narrator may comment on two characters
    - A narrator is defined by personality rather than access
    key: B
    moves:
      A: true_not_asked
      C: underreach
      D: wrong_direction
    why: The text defines a narrator by access, names three positions, and then says each position
      decides what kind of surprise is available.
    trap: D reverses the opening definition, which sets personality aside for access.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, which kind of surprise is almost impossible in strict first person?
    options:
    - Deception of the narrator
    - Irony at a character's expense
    - A comment on two minds at once
    - Fear of what the character does not suspect
    key: D
    moves:
      A: wrong_direction
      B: detail_swap
      C: detail_swap
    why: The text says suspense of the simplest kind, in which the reader fears something the character
      does not suspect, is almost impossible in strict first person.
    trap: A names the effect the text says works easily in that position.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that free indirect style
      lets a writer judge a mind it has just occupied?
    claim: free indirect style lets a writer judge a mind it has just occupied
    options:
    - «It lets a writer convey a mind from the inside and withdraw to judge it in the next clause»
    - «Jane Austen uses it constantly, and so does almost every modern novel»
    - «A first-person narrator reports only what one character perceives, remembers or guesses»
    - «Recognizing the shift is a skill worth practicing»
    key: A
    moves:
      B: true_not_asked
      C: true_not_asked
      D: near_miss
    why: 'The quotation names both halves of the claim: conveying the mind from the inside, and withdrawing
      to judge it in the next clause.'
    trap: D says the shift is worth noticing without saying what it lets a writer do.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Irony works easily in the omniscient position, because the voice can show a character
      being wrong in a sentence the character would endorse. A novel that stayed inside one mind throughout
      would therefore ___
    options:
    - produce irony more easily still
    - be unable to deceive its reader
    - have to get its irony another way
    - need a fourth narrative position
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: near_miss
    why: The irony described depends on a voice outside the character, so a novel confined to one
      mind cannot produce it by that route.
    trap: B denies the first novel the deception the text says it does best.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «convey» most nearly mean?
    target: convey
    options:
    - carry from place to place
    - render for a reader
    - transfer legal title to
    - escort under guard
    key: B
    moves:
      A: near_miss
      C: imported
      D: imported
    why: A writer is said to convey a mind from the inside and then withdraw, so the word names putting
      that mind before a reader.
    trap: A takes the sense of moving a thing from one place to another.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence that closes the text with a test?
    options:
    - It supplies a test for telling the voices apart
    - It defines the omniscient position for the first time
    - It names the three standard narrative positions
    - It concedes that the shift cannot be detected
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The last sentence gives two questions to put to a sentence, after the text has said that
      recognizing the shift is a skill worth practicing.
    trap: D denies a detection the sentence is there to make possible.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says each position decides what surprise is available. Based on Text 2, which choice
      best describes what the first person gives up?
    sibling: HUM-S01-L1
    sibling_gloss: Text 2 is passage 31 of this book. It compares the first person of Jane Eyre with
      the outside voice of Pride and Prejudice, says neither is better, and grants the outside voice
      movement between rooms and years and a judgment on two characters at once.
    options:
    - Access to the mind of the deceived character
    - The vocabulary of the character it follows
    - A reader who finds out when the narrator does
    - Movement between rooms and years, and a verdict on both
    key: D
    moves:
      A: wrong_direction
      B: imported
      C: wrong_direction
    why: Text 2 grants the outside voice movement between rooms and years and a judgment on two characters
      at once, which is what the first person cannot have.
    trap: A names the access the first person is said to keep.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Deception works easily in the first person, because the reader is inside the deceived
      mind. ___ irony works easily in the omniscient position, because the voice can show a character
      being wrong.
    options:
    - As a result,
    - In other words,
    - By contrast,
    - For instance,
    key: C
    moves:
      A: wrong_direction
      B: restatement
      D: near_miss
    why: The second sentence pairs a different effect with a different position, so the transition
      must mark a contrast rather than a consequence.
    trap: A makes the omniscient irony follow from the first-person deception.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Jane Austen uses it constantly ___ and so does almost every modern novel.
    options:
    - constantly, and
    - constantly and
    - constantly; and
    - constantly and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause saying almost every modern novel does the same is independent, so the conjunction
      joining it to the clause about Austen takes a comma.
    trap: B runs the clause about Austen straight into the clause about modern novels.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why an examiner asking about tone is asking about the narrator.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why an examiner asking about tone is asking about the narrator
    notes:
    - Free indirect style carries a character's vocabulary while staying outside.
    - The effect depends on the reader not quite noticing where the voice changed.
    - An examiner asking about tone is usually asking about that movement.
    - The test is whether the character could speak the sentence and the author endorse it.
    options:
    - Free indirect style keeps a third-person voice while borrowing a character's words
    - The effect depends on the reader not quite noticing the change
    - A question about tone is a question about where the voice slid from the character to the author
    - The test is whether the character could speak the sentence
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice identifies the tone question with the movement of the voice between the
      character and the author, which is what the notes say an examiner is after.
    trap: B names the condition of the effect without connecting it to the question asked.
- id: HUM-S02-L2
  summary_ar:
    khulasa: 'يستنتج القارئ الدافع من أربعة أنواع من الدليل، والكاتب يختار كم يُعطي من كلّ نوع: الشرح،
      أي تصريح الراوي بالخلفيّة، والفعل بما فيه الاختيارات الصغيرة التي لا يعلّق عليها أحد، والكلام،
      والباطن، أي الوصول المباشر إلى ما يفكّر فيه الشخص.'
    maana: المعنى أنّ الشرح نافع ومكلّف، فمن قيل له لماذا يفعل الشخص لم يبق له ما يستخرجه. والكلام
      أقلّ ثقةً ممّا يبدو، فالأشخاص يكذبون ويفخرون ويحكون لأنفسهم حكايات، فالدافع المُعلن دليل على
      المتكلّم لا على السبب.
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: كلّ نوع يمكن حَجبه، والحجب نفسه حيلة.
      فملفل يعطي بارتلبي فعلًا وكلامًا ولا باطن له البتّة. والدافع المبنيّ على الفعل والصمت يبقى مفتوحًا
      فيتجادل القرّاء فيه قرنًا، وهي قيمة قد يفضّلها مؤلّف على اليقين.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن يُحسب كلّ دافع محجوب تعسّفًا، مع أنّ النصّ يسمّي النمط المتكرّر علاجًا
      للخطر. ويقترن المقطع بالمقطع الثاني والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Chekhov said an author should state problems correctly
    - Exposition is the most efficient way to give a motive
    - A writer chooses among four kinds of evidence, and may withhold any
    - A withheld motive always reads as arbitrary
    key: C
    moves:
      A: true_not_asked
      B: underreach
      D: overreach
    why: The text names exposition, action, speech and interiority as the four kinds of evidence,
      says a writer chooses how much of each to supply, and calls withholding itself a device.
    trap: D hardens a named risk into something that always happens.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why is speech less reliable than it looks?
    options:
    - Characters lie, boast and tell themselves stories
    - Speech is available only in certain positions
    - Speech leaves the reader nothing to work out
    - Speech is repeated too often to be noticed
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says characters lie, boast and tell themselves stories, so a stated motive is evidence
      about the speaker rather than about the cause.
    trap: C gives the objection the text raises against exposition instead.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that an open motive can be
      worth more to a writer than a settled one?
    claim: an open motive can be worth more to a writer than a settled one
    options:
    - «Exposition is efficient and expensive, because a reader who is told why a character acts has
      nothing left to work out»
    - «Motive built from action and silence stays open, and readers argue about it for a century,
      which is a kind of value an author may prefer to certainty»
    - «Melville gives Bartleby action and speech and no interiority at all»
    - «Henry James described the technique as a matter of what to leave in shadow»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: near_miss
    why: The quotation names the openness, the century of argument and the value an author may prefer
      to certainty, which is the comparison the claim makes.
    trap: A gives the cost of the settled kind without naming the value of the open kind.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Writers manage that risk with pattern, by repeating a gesture or an avoidance often enough
      that a reader can see a shape without being handed a reason. A character who acts only once,
      without pattern, would therefore ___
    options:
    - be easier to explain than a repeated one
    - require exposition from an omniscient voice
    - have a motive settled and inert
    - risk reading as arbitrary rather than deep
    key: D
    moves:
      A: wrong_direction
      B: imported
      C: wrong_direction
    why: The pattern is what lets a reader see a shape without a reason, so a single unrepeated act
      leaves the arbitrariness the text names as the risk.
    trap: C gives the quality of a motive supplied by exposition, not of one withheld.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «subtle» most nearly mean?
    target: subtle
    options:
    - quietly clever
    - deliberately unkind
    - faintly marked
    - plainly stated
    key: C
    moves:
      A: near_miss
      B: imported
      D: wrong_direction
    why: The motive is said to be too subtle to recover, so the word names a signal too faint for
      a reader to pick up.
    trap: A gives the admiring sense, which the sentence treats as a failure.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the reference to Bartleby?
    options:
    - It defines interiority for the first time
    - It gives an instance of a kind withheld
    - It argues that Melville used exposition
    - It names the four kinds of evidence
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The reference follows the statement that each kind can be withheld and names a book that
      supplies action and speech and no interiority at all.
    trap: C puts Melville on the kind of evidence the text says he leaves out.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says withholding is itself a device. Based on Text 2, which choice best describes
      what the withholding in Bartleby produces?
    sibling: HUM-S02-L1
    sibling_gloss: Text 2 is passage 32 of this book. It reports a story in which a clerk refuses
      work without explanation, says the withholding is the design, and observes that the pressure
      of the story falls on the narrator instead.
    options:
    - The pressure of the story falls on the narrator
    - The lawyer accepts the dead letter office as the cause
    - Bartleby is given action and speech and no interiority
    - Melville had published Moby-Dick two years earlier
    key: A
    moves:
      B: wrong_direction
      C: restatement
      D: true_not_asked
    why: Text 2 says the weight of the story falls on the narrator instead, and that the reader learns
      a great deal about the lawyer.
    trap: B treats a rumor in Text 2 as the explanation the lawyer settles on.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Motive supplied by exposition is settled and inert. ___ motive built from action and
      silence stays open, and readers argue about it for a century.
    options:
    - As a result,
    - For example,
    - In other words,
    - By contrast,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The second sentence sets the open kind of motive against the settled kind, so the transition
      must mark a contrast.
    trap: C treats the open motive as a restatement of the inert one.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Exposition is efficient and expensive ___ and a reader who is told why a character acts
      has nothing left to work out.
    options:
    - expensive and
    - expensive, and
    - expensive; and
    - expensive and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the reader who is told is independent, so the conjunction joining it to
      the clause about exposition takes a comma.
    trap: A runs the clause about exposition straight into the clause about the reader.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain how a writer keeps a withheld motive from reading as arbitrary.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain how a writer keeps a withheld motive from reading as arbitrary
    notes:
    - A motive too faint to recover reads as arbitrary rather than deep.
    - Writers manage the risk with pattern.
    - A gesture or an avoidance is repeated often enough to show a shape.
    - The reader sees the shape without being handed a reason.
    options:
    - A motive too faint to recover reads as arbitrary rather than deep
    - Writers manage the risk of a withheld motive with pattern
    - The reader is never handed a reason for the behavior
    - Repeating one gesture often enough shows a shape, so the reader sees design without a reason
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the repetition to the shape the reader sees, which is how the notes
      say the risk is managed.
    trap: B names the remedy without saying how a pattern does the work.
- id: HUM-S03-L2
  summary_ar:
    khulasa: تُدرَّس اللغة المجازية قائمةَ أسماء، وهذا يحجب أنّ الصور تعمل أعمالًا مختلفة. فالتشبيه
      يُعلن المقارنة بأداة ويُبقي الشيئين منفصلين؛ والاستعارة تحذف الإعلان وتثبت الهويّة فيلزم القارئ
      أن يحدّد في أيّ وجه؛ والكناية عمليّة ثالثة مختلفة.
    maana: المعنى أنّ الكناية تسمّي الشيء بما يُقترن به لا بما يشابهه، كأن تُراد الصحافة بالصحفيّين،
      أو الحكم بالتاج، أو الحكومة بالعاصمة. فلا شيء يُقارَن هنا، بل يُشار إلى الكلّ بجزء منه أو بملحق
      به، ولهذا تبدو الكناية كلامًا عاديًّا.
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: ما تشترك فيه الثلاث هو الاقتصاد، فالصورة
      الحيّة تدفع القارئ إلى إمداد التفصيل، فتعمل أربع كلمات عمل فقرة. وهنا يقع الفشل أيضًا: صورة
      تشير في جهتين تُربك، واستعارة أُعيدت حتّى لا يلحظها أحد كفّت عن العمل.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُسوّى بين التشبيه والكناية، مع أنّ النصّ يفصل بينهما فصلًا صريحًا. ويقترن
      المقطع بالمقطع الثالث والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Orwell made the test practical in 1946
    - Most newspaper prose is thick with metonymy
    - A simile and a metonymy do the same work
    - The named figures do different work, and share only economy
    key: D
    moves:
      A: true_not_asked
      B: underreach
      C: wrong_direction
    why: The text separates the three figures by the operation each performs and then says what all
      three share is economy.
    trap: C collapses a distinction the text spends three sentences drawing.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does metonymy do with a thing it names?
    options:
    - Announces a comparison with like or as
    - Names it by something associated with it
    - Asserts that one thing is another thing
    - Repeats an image until nobody notices it
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: near_miss
    why: The text says metonymy names a thing by something associated with it rather than something
      like it, as when the press means journalists.
    trap: A gives the mark of a simile rather than of metonymy.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that metonymy is not a comparison
      at all?
    claim: metonymy is not a comparison at all
    options:
    - «Most newspaper prose is thick with metonymy and nobody calls it poetic»
    - «A metaphor removes the announcement and asserts the identity»
    - «Nothing is being compared. The reader is being pointed at a whole through one of its parts
      or attachments»
    - '«keeps the two things separate: the reader is told to hold a hand and a leaf side by side»'
    key: C
    moves:
      A: true_not_asked
      B: near_miss
      D: near_miss
    why: The quotation says in so many words that nothing is being compared and then describes the
      pointing that replaces comparison.
    trap: B describes what a metaphor does rather than what metonymy does not do.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A metaphor repeated until nobody notices it, as in the heart of the matter, has stopped
      doing any work at all. A writer who reaches for such an expression is therefore ___
    options:
    - getting neither an image nor plain speech
    - compressing four words into a paragraph
    - using a live metaphor instead of a plain word
    - pointing at a whole through one of its parts
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: imported
    why: The usual advice is said to be a live figure or a plain word and not something halfway, which
      is exactly where the worn expression falls.
    trap: C makes the dead expression the live figure the advice recommends.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «vivid» most nearly mean?
    target: vivid
    options:
    - brightly colored
    - still alive
    - briefly stated
    - sharply present
    key: D
    moves:
      A: near_miss
      B: near_miss
      C: imported
    why: A vivid image is said to make the reader supply the detail, so the word names an image that
      comes through sharply enough to be filled in.
    trap: A narrows the word to color, which the text does not mention.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the reference to Orwell?
    options:
    - It defines metonymy for the first time
    - It names three figures and their differences
    - It turns the diagnosis into a usable test
    - It concedes that dead metaphors still work
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: wrong_direction
    why: 'The reference follows the account of expressions that have stopped working and gives a question
      a writer can ask: whether the image can be seen.'
    trap: D revives a figure the text has just called asleep.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says an image makes the reader supply the detail. Based on Text 2, which choice best
      shows that mechanism at work?
    sibling: HUM-S03-L1
    sibling_gloss: Text 2 is passage 33 of this book. It describes a sixteen-word poem that names
      three objects and says a great deal depends on them, leaving the reader to supply the rest,
      and reports that replacing the objects with abstractions kills the poem.
    options:
    - Williams was a doctor who wrote between patients
    - Three objects are handed over and the rest is left to the reader
    - The poem is now one of the most anthologized in English
    - Replacing the objects with abstractions kills the poem
    key: B
    moves:
      A: true_not_asked
      C: true_not_asked
      D: near_miss
    why: Text 2 says the reader is handed three objects, told that something rests on them, and left
      to supply the rest.
    trap: D gives the result of removing the images rather than the mechanism itself.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Metonymy is a third operation and a different one. ___ it names a thing by something
      associated with it rather than something like it.
    options:
    - That is,
    - By contrast,
    - All the same,
    - For instance,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: near_miss
    why: The second sentence spells out what the third operation is, so the transition must mark an
      explanation of the sentence before it.
    trap: B sets the explanation against the statement it explains.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Nothing is being compared ___ and the reader is being pointed at a whole through one
      of its parts.
    options:
    - compared and
    - compared; and
    - compared, and
    - compared and,
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: misplaced
    why: The clause about the reader being pointed at a whole is independent, so the conjunction joining
      it to the clause about comparison takes a comma.
    trap: A runs the clause about comparison straight into the clause about the pointing.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why figurative language is taught badly as a list of names.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why figurative language is taught badly as a list of names
    notes:
    - A list of names hides the fact that the figures do different work.
    - A simile keeps two things separate and a metaphor asserts an identity.
    - Metonymy compares nothing and points at a whole through a part.
    - What all three share is economy.
    options:
    - A list of names hides three different operations that happen to share one economy
    - A simile keeps two things separate and a metaphor asserts an identity
    - Metonymy compares nothing and points at a whole through a part
    - What all three of the figures share is economy
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice says both what the list hides, three distinct operations, and the one thing
      it correctly groups, their economy.
    trap: C describes one of the three operations without saying what the list obscures.
- id: HUM-S04-L2
  summary_ar:
    khulasa: يعمل الشكل الثابت بإنشاء توقّع يمكن استعماله بعد ذلك. فمن سمع ثلاثة أسطر من عشرة مقاطع
      صار الرابع متوقَّعًا، ومن قدّم أحد عشر مقطعًا فعل شيئًا يحسّه القارئ قبل أن يقدر على تسميته،
      ولا يلزم أن يكون عادًّا واعيًا.
    maana: 'المعنى أنّ أداتين تستغلّان السطر مباشرة: التدوير، وهو إجراء الجملة إلى ما بعد نهاية السطر
      دون وقفة، فيصطدم النحو بالإيقاع ويعلّق الشاعر كلمة في الهواء؛ والوقفة الداخلية، وهي قطع قويّ
      داخل السطر يوقف الصوت حيث يأمر الوزن بالمتابعة.'
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: لا تعمل الأداتان إلّا لأنّ النمط تحتهما
      منتظم بقدر يُحَسّ، ولهذا يثقل الإبدال الوزني: سطر يامبي كلّه ثمّ تُقلب تفعيلة واحدة فيقع النبر
      حيث لم يُتوقَّع، والتفعيلة المقلوبة تكون على كلمة يريد الشاعر ضربها.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن الانتقال الأكثر
      منطقيّة. والفخّ المتوقّع هنا أن يُحسب الشعر الحرّ ناجيًا من الآلية، مع أنّ النصّ ينفي ذلك. ويقترن
      المقطع بالمقطع الرابع والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Devices work by setting something against a felt pattern
    - Enjambment runs a sentence past the end of a line
    - Free verse escapes the mechanism entirely
    - Reading a line aloud twice is the quickest way to hear it
    key: A
    moves:
      B: underreach
      C: wrong_direction
      D: true_not_asked
    why: The text says a fixed form works by setting up an expectation that can then be used, and
      that both line devices only work because the pattern is regular enough to be felt.
    trap: C exempts free verse from a mechanism the text says it does not escape.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does a caesura do to the voice?
    options:
    - Runs it past the end of a line
    - Puts a stress where none was expected
    - Stops it where the meter says to continue
    - Leaves a strong beat silent
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: near_miss
    why: The text says a caesura is a strong break inside a line and does the opposite of enjambment,
      stopping the voice where the meter says to continue.
    trap: A gives what enjambment does rather than what a caesura does.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a reader need not be
      counting for the effect to land?
    claim: a reader need not be counting for the effect to land
    options:
    - «Both only work because the underlying pattern is regular enough to be felt»
    - «A caesura, which is a strong break inside a line, does the opposite»
    - «Free verse does not escape the mechanism, because a reader brings expectations to any line»
    - «The effect does not require the reader to be counting consciously, any more than a listener
      counts the beats in a dance tune»
    key: D
    moves:
      A: near_miss
      B: true_not_asked
      C: near_miss
    why: The quotation denies that conscious counting is required and offers the dance tune as a parallel,
      which is the claim exactly.
    trap: A says the pattern must be felt without saying that it need not be counted.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A line that is iambic throughout and then reverses one foot puts a stress where none
      was expected, and the reversed foot is almost always on a word the poet wants struck. A reader
      looking for the emphasis in such a line should therefore ___
    options:
    - count the syllables in every line of the poem
    - look at the word that broke the pattern
    - read the closing couplet of the poem first
    - ignore the regular feet that came before
    key: B
    moves:
      A: near_miss
      C: imported
      D: wrong_direction
    why: The reversed foot is said to fall almost always on the word the poet wants struck, so the
      break in the pattern locates the emphasis.
    trap: D throws away the regularity that makes the break detectable.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «lyrical» most nearly mean?
    target: lyrical
    options:
    - warmly expressive
    - set to music
    - written in lines
    - coolly measured
    key: A
    moves:
      B: near_miss
      C: imported
      D: wrong_direction
    why: The text sets a lyrical effect against the arithmetic that produces it, so the word names
      the feeling a reader hears rather than the counting behind it.
    trap: D makes the word name the measuring the sentence contrasts it with.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the dance tune comparison?
    options:
    - It defines enjambment for the first time
    - It names the two devices that exploit the line
    - It argues that meter must be counted aloud
    - It makes an unconscious response familiar
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: wrong_direction
    why: The comparison follows the claim that the effect does not require conscious counting and
      offers a listener who does not count beats as the parallel.
    trap: C requires the counting the comparison is there to excuse.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 explains how a felt pattern can be exploited. Based on Text 2, which choice best
      illustrates a pattern being used that way?
    sibling: HUM-S04-L1
    sibling_gloss: Text 2 is passage 34 of this book. It describes the fourteen-line sonnet and its
      turn, and reports a sonnet that spends twelve lines listing what the mistress is not before
      a closing pair says he loves her all the same.
    options:
    - A sonnet has fourteen lines and reached England from Italy
    - Each line runs to ten syllables with a stress on every second
    - Twelve lines of denial are reversed by the closing pair
    - Hayes published seventy sonnets titled the same way
    key: C
    moves:
      A: true_not_asked
      B: restatement
      D: true_not_asked
    why: Text 2 reports twelve lines listing what the mistress is not, followed by a closing pair
      that says he loves her all the same, which lands because the reader has been counting.
    trap: B names the pattern itself rather than a use made of it.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A caesura stops the voice where the meter says to continue. ___ both only work because
      the underlying pattern is regular enough to be felt.
    options:
    - For example,
    - In both cases,
    - By contrast,
    - In other words,
    key: B
    moves:
      A: near_miss
      C: wrong_direction
      D: restatement
    why: The second sentence states a condition that holds for enjambment and for the caesura alike,
      so the transition must gather both.
    trap: C sets the shared condition against the devices it covers.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The reader hears the feeling ___ and the poet counted.
    options:
    - feeling and
    - feeling; and
    - feeling and,
    - feeling, and
    key: D
    moves:
      A: run_on
      B: wrong_mark
      C: misplaced
    why: The clause saying the poet counted is independent, so the conjunction joining it to the clause
      about the reader hearing takes a comma.
    trap: A runs the clause about the feeling straight into the clause about the counting.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a regular meter is worth establishing. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a regular meter is worth establishing
    notes:
    - Three lines of ten syllables make the fourth one predictable.
    - A reader feels an eleventh syllable before being able to name it.
    - Enjambment and caesura work only against a felt pattern.
    - A reversed foot puts a stress where none was expected.
    options:
    - Three lines of ten syllables make the fourth one predictable
    - A pattern a reader can feel is what gives any break its force
    - Enjambment and caesura work only against a felt pattern
    - A reversed foot puts a stress where none was expected
    key: B
    moves:
      A: underreach
      C: restatement
      D: underreach
    why: Only this choice states the general point the notes converge on, that the regularity is what
      any departure from it can work against.
    trap: A gives one instance of the prediction without naming what it is for.
- id: HUM-S05-L2
  summary_ar:
    khulasa: عدّة عادات في الكتابة المسرحية الإليزابيثية نتائج للبناء لا اختيارات في الذوق. فالجمهور
      كان يقف في ضوء النهار على ثلاث جهات من منصّة، فيستطيع الممثّل أن يخاطبه مباشرة دون أن يُخِلّ
      بشيء، ولهذا كان الهمس الجانبي أداة قياسيّة لا حيلة.
    maana: المعنى أنّ قاعة مظلمة ومنصّة مضاءة تجعل السطر نفسه متكلّفًا، ولهذا كاد الهمس الجانبي يزول
      في القرن التاسع عشر ثمّ عاد حين رجعت المسارح إلى التمثيل المكشوف. ولانعدام المناظر لزم أن يُثبَت
      المكان في الحوار، ولانعدام السِّتر الأمامي لزم أن ينتهي المشهد بخروج.
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: الشروط حدّدت طول الخطبة أيضًا، فالممثّل
      في الهواء المكشوف أمام ألفَي واقف يحبس الانتباه بالصوت وحده، والشعر يجعل ذلك ممكنًا لأنّه يعطي
      الصوت نمطًا يستند إليه. ولا شيء من هذا ينقص فنّ المسرحيّات، بل يوطّنه في غرفة بعينها.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن السبب المذكور في النصّ وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن يُستنتج أنّ الشروط تنقص الفنّ، مع أنّ النصّ ينفي ذلك صريحًا. ويقترن المقطع
      بالمقطع الخامس والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - The aside nearly disappeared in the nineteenth century
    - Habits of the writing follow from the room it was written for
    - Prose in these plays is used for different registers
    - The art of the plays is lessened by its conditions
    key: B
    moves:
      A: underreach
      C: underreach
      D: wrong_direction
    why: The text calls the habits consequences of the building rather than choices of taste, and
      ends by saying this locates the art in a particular room rather than making the plays less artful.
    trap: D draws the conclusion the last sentences expressly refuse.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why did a scene have to end with an exit?
    options:
    - Because the stage had a discovery space
    - Because the audience stood in daylight
    - Because the verse gave the voice a pattern
    - Because there was no front curtain
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: The text says that because there was no front curtain a scene could not end with a held tableau
      and had to end with an exit.
    trap: A names a different feature of the stage with a different consequence.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the aside depends on
      the room rather than on taste?
    claim: the aside depends on the room rather than on taste
    options:
    - «which is why the aside nearly disappeared in the nineteenth century and returned when playhouses
      went back to open staging»
    - «Because there was no scenery, place had to be established in the dialogue»
    - «Prose in these plays is used for different registers and rarely sustains a long solo turn»
    - «Cutting an aside, or lighting a soliloquy as private thought, changes the relationship the
      line was written for»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: near_miss
    why: The quotation ties the fate of the aside to the lighting and the staging, disappearing in
      one arrangement and returning in another.
    trap: D names a modern cost without showing the device following the room.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: An actor in the open air with two thousand people standing has to hold attention by voice
      alone, and the verse renders that possible by giving the voice a pattern to lean on. A long
      speech written for a small indoor room would therefore ___
    options:
    - need a louder voice than the open air does
    - require a discovery space at the back
    - have less need of that pattern to lean on
    - end with a rhyming couplet to clear the stage
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: true_not_asked
    why: The pattern is said to be what makes holding attention by voice alone possible in the open
      air, so a small room removes the condition it answers.
    trap: A reverses the difficulty that the open air is said to create.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «renders» most nearly mean?
    target: renders
    options:
    - performs for an audience
    - causes to be
    - translates into words
    - hands over to
    key: B
    moves:
      A: near_miss
      C: imported
      D: imported
    why: The verse is said to render holding attention possible, so the word names bringing that state
      about.
    trap: A takes the sense in which an actor renders a speech.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence denying that the plays are less
      artful?
    options:
    - It blocks a conclusion the explanation invites
    - It defines the discovery space at the back
    - It reports when the aside disappeared
    - It argues that modern staging is superior
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The sentence comes after a list of features traced to the building and refuses the inference
      that the art is thereby diminished, locating it in a room instead.
    trap: D ranks the stagings, which the text does not do.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 derives the habits of the writing from the building. Based on Text 2, which choice
      best supplies the physical fact behind the aside?
    sibling: HUM-S05-L1
    sibling_gloss: Text 2 is passage 35 of this book. It describes the Globe as a ring of galleries
      open to the sky with a platform pushed into the yard, and says the cheapest paid a penny and
      stood in the open around three sides of the stage in the early afternoon.
    options:
    - The theater burned down in 1613 after a cannon
    - A modern copy plays in daylight without microphones
    - The platform had a trap door for a grave or a devil
    - The cheapest stood in the open on three sides of the stage
    key: D
    moves:
      A: true_not_asked
      B: true_not_asked
      C: near_miss
    why: Text 2 says the cheapest stood in the open around three sides of the stage in daylight, which
      is the arrangement Text 1 says lets an actor address the house.
    trap: C names a feature of the platform with a different use.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Because there was no front curtain, a scene could not end with a held tableau and had
      to end with an exit. ___ so many scenes finish on a rhyming couplet that tells the audience
      the stage is clearing.
    options:
    - Conversely,
    - To illustrate,
    - Consequently,
    - Put differently,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
    why: The second sentence gives what followed from the absence of a curtain, so the transition
      must mark a consequence.
    trap: A sets the couplets against the condition that produced them.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The audience stood in daylight on three sides of a platform ___ and an actor could speak
      directly to them without breaking anything.
    options:
    - platform, and
    - platform and
    - platform; and
    - platform and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the actor speaking directly is independent, so the conjunction joining it
      to the clause about the audience takes a comma.
    trap: B runs the clause about the audience straight into the clause about the actor.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what a modern indoor production has to solve. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what a modern indoor production has to solve
    notes:
    - The aside was written for an audience standing in daylight.
    - A dark auditorium with a lit stage makes the same line awkward.
    - Cutting an aside changes the relationship the line was written for.
    - Modern productions indoors face problems the original staging did not have.
    options:
    - The aside was written for an audience standing in daylight
    - Modern productions indoors face problems the original staging did not
    - A line written for a lit house turns awkward in a dark one, and cutting it changes what it was
      for
    - A dark auditorium with a lit stage makes the line awkward
    key: C
    moves:
      A: underreach
      B: restatement
      D: underreach
    why: 'Only this choice names both halves of the difficulty: the line that stops working in the
      new room and the cost of removing it.'
    trap: D names the awkwardness without saying what a production must then decide.
- id: HUM-S06-L2
  summary_ar:
    khulasa: 'العُرف، أي قاعدة يُتوقّع من نوع من الحكايات أن يتبعها، يؤدّي عملين في وقت واحد: يعلّم
      القارئ كيف يقرأ، فجسد في الفصل الأوّل يُشير إلى أنّ بقيّة الكتاب بحث عن سبب، فيبدأ القارئ يصنّف
      التفاصيل قرائنَ بلا طلب.'
    maana: 'المعنى أنّ العُرف يُنشئ أيضًا إمكان الانحراف الدالّ، لأنّ قاعدة يعرفها الجميع يمكن نقضها
      عن قصد وسيُلحَظ النقض. وقد كتبت القصّة البوليسية أعرافها: في عشرينيّات القرن العشرين وضع أعضاء
      نادٍ لندنيّ قائمة قواعد، منها شرط اللعب النزيه.'
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: الفضيحة لم تكن لتوجد لولا وجود القاعدة،
      فمن لا توقّع له لا يُفاجأ. وتعمل الآلية نفسها بالتلميح الذي يُسنِد عملًا لاحقًا إلى عمل سابق،
      ولا يلزم أن يكون الجمهور قد درس التاريخ.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب القارئ الخالي من التوقّع أسهلَ مفاجأةً، مع أنّ النصّ يقول عكسه.
      ويقترن المقطع بالمقطع السادس والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - A London club drew up a list of rules in the 1920s
    - The unreliable narrator was a shock in 1926
    - A rule both guides a reader and makes a breach legible
    - A reader with no expectations is the most easily surprised
    key: C
    moves:
