    - «Recognition can be entirely unconscious, and the writer only needs the pattern to be present,
      not to be named»
    - «Genres also drift, because every successful breach becomes the next convention»
    - «The scandal only existed because the rule existed»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says recognition can be entirely unconscious and that the pattern need only
      be present, not named.
    trap: A gives an instance of the borrowing without saying what the audience must know.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Genres also drift, because every successful breach becomes the next convention. The unreliable
      narrator was a shock in 1926 and is now a standard item on a list. A novelist who used that
      device today would therefore ___
    options:
    - be accused of cheating by the London club
    - shock a reader as the 1926 book did
    - have broken the requirement of fair play
    - be leaning on a rule rather than breaking one
    key: D
    moves:
      A: imported
      B: wrong_direction
      C: near_miss
    why: The device is said to have become a standard item, so using it now follows a convention instead
      of departing from one.
    trap: B keeps a shock the text says the device has lost.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «allusion» most nearly mean?
    target: allusion
    options:
    - a misleading appearance
    - an open quotation
    - an unannounced reference
    - a hint at a solution
    key: C
    moves:
      A: imported
      B: near_miss
      D: imported
    why: Allusion is said to let a later work lean on an earlier one, and the text adds that the pattern
      need only be present rather than named.
    trap: B makes the reference explicit when the text says it need not be named.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about the Christie novel?
    options:
    - It defines the requirement of fair play
    - It shows a rule making a breach visible
    - It reports when the London club was founded
    - It settles the question of whether she cheated
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence follows the written rules and is followed by the statement that the scandal
      only existed because the rule existed.
    trap: D settles an argument the text says is still going.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says a convention makes a deliberate breach noticeable. Based on Text 2, which choice
      best shows where the detective convention came from?
    sibling: HUM-S06-L1
    sibling_gloss: Text 2 is passage 36 of this book. It reports an 1841 story that introduced a brilliant
      private reasoner, a slower companion, a competent and wrong police force and a mechanical solution,
      and says later writers counted on a reader knowing the pattern.
    options:
    - One story in 1841 supplied the parts still in use
    - Doyle had Holmes dismiss Dupin by name
    - Christie built a career on breaking the rules
    - Poe wrote only three stories about Dupin
    key: A
    moves:
      B: near_miss
      C: restatement
      D: true_not_asked
    why: Text 2 says the 1841 story introduced a set of parts that are still in use and that later
      writers counted on a reader knowing them.
    trap: B gives a later writer acknowledging the debt rather than the origin itself.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A convention tells a reader how to read. ___ it creates the possibility of significant
      deviation, because a rule that everybody knows can be broken on purpose.
    options:
    - By contrast,
    - For example,
    - In other words,
    - Beyond that,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The second sentence names the second of two jobs the convention is said to do at once, so
      the transition must mark an addition.
    trap: C treats the second job as another way of stating the first.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Detective fiction wrote its conventions down ___ and in the 1920s members of a London
      club drew up a list of rules.
    options:
    - down and
    - down, and
    - down; and
    - down and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the London club is independent, so the conjunction joining it to the clause
      about the written conventions takes a comma.
    trap: A runs the clause about the conventions straight into the clause about the club.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain the one question worth asking about a genre work. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain the one question worth asking about a genre work
    notes:
    - A convention tells a reader how to read.
    - It also makes a deliberate breach noticeable.
    - Every successful breach becomes the next convention.
    - The useful question is which rule a work leans on and which it pushes against.
    options:
    - A convention tells a reader how to read the book
    - Every successful breach becomes the next convention
    - A convention also makes a deliberate breach noticeable
    - Since rules both guide and get broken, ask which one a work leans on and which it resists
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice puts the two jobs of a rule behind the question the notes name as the useful
      one.
    trap: B states the drift without turning it into a question to ask.
- id: HUM-S07-L2
  summary_ar:
    khulasa: تُقرأ اللوحة في ترتيب، والرسّام هو الذي يقرّر ذلك الترتيب. والتأليف، أي تنظيم الأشكال
      والفراغات داخل الإطار، هو آلة ذلك، وثلاث أدوات تحمل معظم الحمل. أولاها التضادّ الضوئيّ، وهو
      الفرق بين أفتح المناطق وأغمقها.
    maana: المعنى أنّ العين تذهب إلى أقوى تضادّ أوّلًا، ولهذا يضع فرمير أشدّ بياضه على اللبن والخِمار
      ويترك سائر الجدار في مدًى ضيّق. والأداة الثانية الخطّ، فالحروف المائلة تقود العين على امتدادها.
      والثالثة الحجم والموضع، فجسم يقطعه الإطار يُقرأ ممتدًّا خارجه.
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: ثمّ طريقة عمل في النظر: اسأل أين ذهبت
      العين أوّلًا ولماذا، واتبع المسار الذي سلكته بعد ذلك، والحظ ما تُرك في تضادّ منخفض لأنّه ما
      قرّر الرسّام أنّه يمكن أن ينتظر.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن التفصيل المذكور في النصّ وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن تُحسب اللوحة المزدحمة فاشلة التأليف، مع أنّ النصّ ينفي ذلك ويضع الفشل
      في عين تهيم بلا وصول. ويقترن المقطع بالمقطع السابع والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - X-ray images reveal a map painted out of the Milkmaid
    - The eye goes to the strongest contrast in a picture first
    - A crowded picture is always badly composed
    - A painter decides the order in which a picture is read
    key: D
    moves:
      A: true_not_asked
      B: underreach
      C: overreach
    why: The text opens by saying a painting is read in an order that the painter decides and then
      names the three devices that do it.
    trap: C condemns the crowded picture the text expressly declines to condemn.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how does an object cut by the frame read?
    options:
    - As the strongest contrast in the picture
    - As continuing beyond the frame
    - As a figure placed on the center line
    - As an edge that leads the eye along it
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: near_miss
    why: The text says an object cut by the frame reads as continuing beyond it, which pulls the viewer
      into imagining a room rather than a panel.
    trap: A names a different device from the three the text sets out.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a failed composition
      can be told from a merely busy one?
    claim: a failed composition can be told from a merely busy one
    options:
    - «The eye goes to the strongest contrast first, which is why Vermeer puts his brightest white
      on the milk and the cap»
    - «Edges that run diagonally lead the eye along them, and painters arrange table edges, floor
      tiles, arms and gazes to point where they want attention to travel»
    - «a painter may want the eye to wander, but a composition that fails will leave the eye drifting
      without arriving»
    - «Conservators can sometimes show that an artist moved a figure to improve this order»
    key: C
    moves:
      A: true_not_asked
      B: true_not_asked
      D: near_miss
    why: The quotation allows a picture in which the eye wanders and locates failure instead in an
      eye that drifts without arriving.
    trap: D names a conservator's finding about one picture rather than the test itself.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Notice what has been left in low contrast, because that is what the painter decided could
      wait. A viewer who starts with the dimmest corner is therefore ___
    options:
    - beginning where the painter meant them to end
    - following the strongest contrast in the picture
    - looking at an object cut by the frame
    - reading the picture in the intended order
    key: A
    moves:
      B: wrong_direction
      C: imported
      D: wrong_direction
    why: Low contrast is said to mark what the painter decided could wait, so the dimmest area is
      the last stop in the order rather than the first.
    trap: D calls the reversed route the intended one.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «ornate» most nearly mean?
    target: ornate
    options:
    - formally arranged
    - brightly lit
    - plainly finished
    - heavily decorated
    key: D
    moves:
      A: near_miss
      B: imported
      C: wrong_direction
    why: The word is paired with crowded in a sentence about a picture that may still be well composed,
      so it names a surface loaded with detail.
    trap: C gives the opposite of the loaded surface the sentence describes.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the three instructions for looking?
    options:
    - They define tonal contrast for the first time
    - They report what an X-ray of the picture showed
    - They turn the three devices into a procedure
    - They concede that the order cannot be described
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: wrong_direction
    why: The instructions follow the three devices under the announcement of a working method and
      tell a viewer what to ask and in what order.
    trap: D denies a description the last of the instructions treats as the test.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says the eye goes to the strongest contrast first. Based on Text 2, which choice
      best explains why the wall comes last in that order?
    sibling: HUM-S07-L1
    sibling_gloss: Text 2 is passage 37 of this book. It lists the surfaces Vermeer recorded in a
      small kitchen picture, among them a hard highlight on the jug, crumbs of thick paint on the
      bread and a whitewashed wall warm in the sun and cool in the shadow.
    options:
    - The wall carries a nail and a nail hole
    - Its warm and cool areas stay close together in tone
    - The bread crust holds small dots of thick paint
    - The milk is the only moving thing in the painting
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: near_miss
    why: Text 2 describes the wall as warm where the sun falls and cool in the shadow, a narrow range
      beside the thickened white of the milk.
    trap: C names a surface that catches light sharply rather than one in a narrow range.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A figure placed on a diagonal from a corner reads differently from one on the center
      line. ___ an object cut by the frame reads as continuing beyond it.
    options:
    - Likewise,
    - By contrast,
    - As a result,
    - In short,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: restatement
    why: The second sentence gives a second instance of position deciding how something reads, so
      the transition must mark a parallel.
    trap: B sets the second instance against the first when both make the same point.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: A painting is read in an order ___ and the painter decides that order.
    options:
    - order and
    - order; and
    - order, and
    - order and,
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: misplaced
    why: The clause saying the painter decides the order is independent, so the conjunction joining
      it to the clause about the reading takes a comma.
    trap: A runs the clause about the reading straight into the clause about the painter.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to give a viewer something to do in front of a painting. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: give a viewer something to do in front of a painting
    notes:
    - Ask where the eye went first and why.
    - Follow the path it took and find the edge or gaze that sent it.
    - Notice what was left in low contrast.
    - The test is whether the order of looking can be described at all.
    options:
    - Trace the order of looking from the first stop to the dimmest, then try to describe it
    - Ask where the eye went first in the picture and why
    - Notice what the painter left in low contrast
    - The test is whether the order of looking can be described
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice runs the three steps together and ends on the test, which is what turns
      looking into something a viewer does.
    trap: B gives the first step alone without the path or the test.
- id: HUM-S08-L2
  summary_ar:
    khulasa: تعمل الموسيقى على التوقّع عملًا يمكن وصفه بلا تدريب فنّيّ. فالقطعة في مقام تُقيم نغمة
      بيت تُسمّى الركيزة، ومن سمع موازير قليلة يقدر على ترنيمها دون أن يعرف اسمها. والبعد عن ذلك البيت
      يُنشئ الشدّ، والرجوع إليه يُفرجه.
    maana: المعنى أنّ كلّ ما بقي تدبيرٌ للمسافة والتأخير بين هذين الحدثين. والقفلة، أي صيغة ختامية
      تُشير إلى الانتهاء، هي آلة الوصول القياسية، وقد تعلّم المؤلّفون مبكّرًا أنّ القفلة المتوقّعة
      يمكن قطعها، والقطع من أقوى الآثار المتاحة.
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: تصل الموسيقى إلى لحظة الحلّ فتذهب إلى
      مكان آخر، غالبًا إلى وتر قريب خاطئ، فيحسّ السامع الانزياح خيبةً جسديّة. والإيقاع يعمل العمل
      نفسه في الزمن لا في الحدّة، والنبرة القويّة المتروكة صامتة أعلى من أيّ نغمة.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن يُوضَع الشعور في النغمات، مع أنّ النصّ يضعه في الفجوة بين ما أُقيم وما
      حُجب. ويقترن المقطع بالمقطع الثامن والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Music works by managing the distance from a home note and back
    - A cadence is a closing formula that signals an ending
    - Film composers work with very simple material
    - Emotion in music sits in the notes themselves
    key: A
    moves:
      B: underreach
      C: true_not_asked
      D: wrong_direction
    why: The text says moving away from the home note creates tension and returning releases it, and
      that almost everything else is management of the distance and the delay.
    trap: D puts the emotion in the notes when the text puts it in the gap.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what happens in an interrupted cadence?
    options:
    - The home note is established for the listener
    - A strong beat is left silent in the pattern
    - The music reaches resolution and goes elsewhere
    - The listener hums the tonic without naming it
    key: C
    moves:
      A: detail_swap
      B: near_miss
      D: detail_swap
    why: The text says the music arrives at the moment of resolution and goes somewhere else, often
      to a chord that is close by and wrong.
    trap: A names the setting up of the home note rather than the broken arrival.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a feeling in music can
      be located in what did not happen?
    claim: a feeling in music can be located in what did not happen
    options:
    - «A piece in a key establishes a home note, the tonic, and a listener who has heard a few bars
      can hum it without knowing its name»
    - «Haydn built jokes on it and Wagner built whole acts by refusing to arrive for an hour at a
      time»
    - «Rhythm does the same job in time rather than in pitch. A pattern once established can be stretched,
      interrupted or contradicted»
    - «A piece that evokes grief usually does so by establishing something and then withholding it,
      and the emotion sits in the gap rather than in the notes»
    key: D
    moves:
      A: true_not_asked
      B: near_miss
      C: true_not_asked
    why: The quotation says the emotion sits in the gap rather than in the notes, after naming the
      establishing and the withholding that make the gap.
    trap: B gives two composers using the device without saying where the feeling sits.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A pattern once established can be stretched, interrupted or contradicted, and a strong
      beat left silent is louder than any note. A silence in a piece with no established pattern would
      therefore ___
    options:
    - be louder than any note in the piece
    - have nothing to be heard against
    - resolve the tension the key set up
    - interrupt an expected cadence instead
    key: B
    moves:
      A: wrong_direction
      C: imported
      D: near_miss
    why: The silent beat is said to be loud because a pattern was established, so without one there
      is no expectation for the silence to break.
    trap: A keeps the loudness the text makes conditional on the pattern.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «evokes» most nearly mean?
    target: evokes
    options:
    - calls up in a listener
    - cries out against
    - states in words
    - remembers from before
    key: A
    moves:
      B: imported
      C: wrong_direction
      D: near_miss
    why: A piece is said to evoke grief by establishing something and withholding it, so the word
      names raising the feeling in whoever is listening.
    trap: C makes the music state the feeling the text says it produces by a gap.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about film composers?
    options:
    - It defines the tonic for the first time
    - It reports that Haydn built jokes on it
    - It argues that film music needs no pattern
    - It shows the mechanism carrying very little material
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: wrong_direction
    why: The sentence says film composers work almost entirely with this mechanism and often with
      very simple material, and is followed by one held chord doing the work of a page.
    trap: C removes the pattern that the single held chord depends on.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says an effect requires something to have been set up. Based on Text 2, which choice
      best shows a composer doing the setting up?
    sibling: HUM-S08-L1
    sibling_gloss: Text 2 is passage 38 of this book. It describes a set of twelve variations on an
      eight-bar tune, says the tune is stated plainly first so that every listener knows what will
      be worked on, and locates the pleasure in hearing the original survive.
    options:
    - Beethoven wrote thirty-three variations on a waltz
    - One variation turns the key from major to minor
    - The tune is stated plainly before it is changed
    - Jazz musicians take a theme apart every night
    key: C
    moves:
      A: true_not_asked
      B: near_miss
      D: near_miss
    why: Text 2 says Mozart states the tune plainly first, so that every listener knows exactly what
      will be worked on.
    trap: D names the taking apart rather than the statement it depends on.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: Moving away from that home creates tension. ___ returning to it releases the tension.
    options:
    - For example,
    - Conversely,
    - As a result,
    - In other words,
    key: B
    moves:
      A: near_miss
      C: wrong_direction
      D: restatement
    why: The second sentence gives the opposite movement with the opposite result, so the transition
      must mark a reversal.
    trap: C makes the release follow from the tension rather than from the return.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The music arrives at the moment of resolution ___ and it goes somewhere else.
    options:
    - resolution and
    - resolution; and
    - resolution and,
    - resolution, and
    key: D
    moves:
      A: run_on
      B: wrong_mark
      C: misplaced
    why: The clause saying the music goes somewhere else is independent, so the conjunction joining
      it to the clause about the arrival takes a comma.
    trap: A runs the clause about the arrival straight into the clause about the swerve.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to give a listener a better question than whether a passage is beautiful.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: give a listener a better question than whether a passage is beautiful
    notes:
    - Moving away from the home note creates tension and returning releases it.
    - A cadence can be interrupted, which is one of the strongest effects available.
    - The question to ask is what a passage set up and whether it has paid.
    - A description of a piece as sad is less useful than a note of where it was expected to resolve.
    options:
    - Moving away from the home note creates tension and returning releases it
    - Ask what the passage set up and whether it paid, and note where it failed to resolve
    - An interrupted cadence is one of the strongest effects available
    - A description of a piece as sad is less useful than other descriptions
    key: B
    moves:
      A: underreach
      C: underreach
      D: restatement
    why: Only this choice states the question and the observation that replaces the verdict, which
      is what the notes offer a listener.
    trap: D rejects the description as sad without supplying the question to ask instead.
- id: HUM-S09-L2
  summary_ar:
    khulasa: يمكن وصف الشارع بأرقام، وقليل منها يتنبّأ بمعظم ما يُحسّ عند المشي فيه. أوّلها الواجهة،
      أي طول وجه البناء الملاقي للرصيف، وأدقّ منه الواجهة النشطة، وهي الواجهة ذات الأبواب والنوافذ
      التي يستعملها الناس فعلًا.
    maana: المعنى أنّ مئة متر فيها اثنا عشر بابًا تسلك سلوكًا مختلفًا عن مئة متر فيها باب واحد، ولو
      تساوى البناءان ارتفاعًا وعمرًا. والرقم الثاني العرض، ونسبة العرض إلى ارتفاع البناء تقرّر هل
      يُقرأ الشارع غرفةً أو فجوة. والثالث النفاذيّة، وتُعدّ بعدد المخارج من المَربَع.
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: هذه الأرقام تتعارض، وذلك هو كلّ الصعوبة.
      فالطرق العريضة تنقل المَركبات وتقطع مسارات المشي، والمَربَعات الكبيرة أرخص بناءً وتُنتج جدرانًا
      صمّاء طويلة، والبرج المتراجع في أرض مكشوفة قد يكون جميلًا من بعيد ويترك الرصيف ميّتًا.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن التفصيل المذكور في النصّ وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن تُقدَّم جودة العمارة على عدّ الأبواب، مع أنّ النصّ يقول عكسه. ويقترن
      المقطع بالمقطع التاسع والثلاثين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Jane Jacobs made her argument from observation in 1961
    - A few measurable numbers predict how a street feels, and they conflict
    - A street can be measured in an afternoon with a tape
    - Architectural quality predicts street life best
    key: B
    moves:
      A: true_not_asked
      C: underreach
      D: wrong_direction
    why: The text names frontage, width to height and permeability as numbers that predict how a street
      feels, then says the numbers conflict, which is the whole difficulty.
    trap: D reverses the comparison the counts are said to settle.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how is permeability counted?
    options:
    - By the length of building face meeting the pavement
    - By the proportion of width to building height
    - By the number of doorways per hundred meters
    - By the number of ways out of a block
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: The text says the third number is permeability, counted as the number of ways out of a block.
    trap: A gives the definition of frontage instead.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a handsome building
      can still kill the pavement beside it?
    claim: a handsome building can still kill the pavement beside it
    options:
    - «A tower set back in open ground may be austere and handsome from a distance and leave the pavement
      beside it dead, because nothing at ground level opens onto it»
    - «Wide roads move vehicles and break walking routes. Large blocks are cheaper to build and produce
      long blank walls»
    - «Transport departments now count footfall, crossings and dwell time as a matter of routine»
    - «A hundred meters with twelve doorways behaves quite differently from a hundred meters with
      one»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: near_miss
    why: The quotation grants the tower its looks and still reports a dead pavement, giving the reason
      as nothing opening onto it at ground level.
    trap: B names two other conflicts without conceding anything to the building.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A fine grid gives walkers' choices and spreads traffic; a single loop road forces everyone
      onto one route and makes walking pointless. A neighborhood built on one loop road would therefore
      ___
    options:
    - spread its traffic across many routes
    - count more doorways per hundred meters
    - score low on the third of the numbers
    - read as a room rather than as a gap
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: imported
    why: Permeability is the third number and is counted as the ways out of a block, which a single
      loop road reduces to one.
    trap: A gives the advantage of the grid to the loop road instead.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «austere» most nearly mean?
    target: austere
    options:
    - harshly strict
    - plain and spare
    - richly detailed
    - strongly built
    key: B
    moves:
      A: near_miss
      C: wrong_direction
      D: imported
    why: The word sits beside handsome in a judgment of how a tower looks from a distance, so it names
      an unornamented appearance.
    trap: A takes the sense used of a person rather than of a building.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence saying the numbers conflict?
    options:
    - It turns a list of measures into a problem
    - It defines active frontage for the first time
    - It reports what transport departments count
    - It concludes that the numbers are useless
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence follows the three numbers and introduces the trade-offs between wide roads,
      large blocks and the set-back tower.
    trap: D discards measures the text goes on to say have been confirmed.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 names the numbers that predict street life. Based on Text 2, which choice best describes
      how the arcade scores on the first of them?
    sibling: HUM-S09-L1
    sibling_gloss: Text 2 is passage 39 of this book. It describes a covered lane about six hundred
      feet long, lined on both sides with small shops under a glass roof, in which a shopper could
      walk the whole length dry and look in forty windows.
    options:
    - Its glass roof was admired as engineering
    - It has beadles who forbid running and whistling
    - It is about six hundred feet long from end to end
    - Small shops line both of its sides for its whole length
    key: D
    moves:
      A: true_not_asked
      B: true_not_asked
      C: near_miss
    why: The first number is active frontage, and Text 2 describes a lane lined on both sides with
      small shops in which a shopper can look in forty windows.
    trap: C gives the length without saying what meets the pavement along it.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A hundred meters with twelve doorways behaves quite differently from a hundred meters
      with one. ___ the second number is width, and the proportion of width to building height decides
      whether a street reads as a room.
    options:
    - By contrast,
    - In other words,
    - After that,
    - For example,
    key: C
    moves:
      A: wrong_direction
      B: restatement
      D: near_miss
    why: The second sentence moves on to the next of the three numbers, so the transition must mark
      a step in a sequence.
    trap: A sets the second number against the first when the text is listing them.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Wide roads move vehicles and break walking routes ___ and large blocks are cheaper to
      build.
    options:
    - routes, and
    - routes and
    - routes; and
    - routes and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about large blocks being cheaper is independent, so the conjunction joining it
      to the clause about wide roads takes a comma.
    trap: B runs the clause about the roads straight into the clause about the blocks.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a street can be judged without an architect. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a street can be judged without an architect
    notes:
    - Active frontage counts doorways and windows that people use.
    - Doorways per hundred meters predicts street life better than architectural quality.
    - Jacobs made the argument by counting uses and watching sidewalks.
    - A street can be measured in an afternoon with a tape and a counter.
    options:
    - Active frontage counts the doorways and windows people use
    - Jacobs counted uses and watched sidewalks to make her argument
    - A tape and a counter measure the doorways that predict street life better than quality does
    - A street can be measured in an afternoon with a tape
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice joins the tools anyone can carry to the count that is said to beat architectural
      quality as a predictor.
    trap: B credits one observer without saying what the counting establishes.
- id: HUM-S10-L2
  summary_ar:
    khulasa: 'للحكم النقديّ الذي يمكن فحصه ثلاثة أجزاء: دعوى يجب أن تقول شيئًا قابلًا للتكذيب، ودليل
      مأخوذ من العمل نفسه مقتبسًا أو موصوفًا وصفًا يتيح للقارئ التحقّق، ومعيار، أي المقياس الذي يُحاكَم
      العمل إليه، وهو الجزء الأكثر إغفالًا.'
    maana: 'المعنى أنّ كلّ جزء يفسد فسادًا مميّزًا: الدعوى تفسد بأن تكون غير قابلة للتكذيب، كناقد
      يسمّي رواية مهمّة ولا يقول ما الذي يجعلها غير مهمّة؛ والدليل يفسد بأن يكون عن شيء آخر؛ والمعيار
      يفسد ببقائه خفيًّا.'
    ahammiyya: 'في مجال الإنسانيات هذه المادة في مستوى الآلية: المعيار الخفيّ يُنتج أشيع خلاف عديم
      النفع، حيث يتجادل اثنان في عمل وهما يقيسانه إلى شيئين مختلفين. وإظهار المعيار يغيّر الجدال،
      فمن قال إنّ مسرحية تفشل لعدم اتّساق شخصيّاتها نفسيًّا جاز أن يُسأل أهذا هو المقياس الصحيح.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُحسب المعيار الخفيّ مُيسِّرًا للحكم، مع أنّ النصّ يجعله سبب الخلاف العقيم.
      ويقترن المقطع بالمقطع الأربعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Samuel Johnson insisted on the point in 1765
    - Academic criticism reads unlike journalism
    - A judgment can be examined only if its three parts are present
    - A hidden standard makes a disagreement easier to settle
    key: C
    moves:
      A: true_not_asked
      B: underreach
      D: wrong_direction
    why: The text divides a judgment into a claim, evidence and a criterion, says each fails in a
      characteristic way, and that a hidden criterion produces useless disagreement.
    trap: D reverses the effect the text attributes to a hidden standard.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how does a claim fail?
    options:
    - By being impossible to show false
    - By being about the author instead
    - By staying hidden from the reader
    - By quoting the work too closely
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says a claim fails by being unfalsifiable, as when a reviewer calls a novel important
      without saying what would make it unimportant.
    trap: B gives the way evidence fails rather than the way a claim fails.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that naming a standard makes
      a dispute workable rather than settling it?
    claim: naming a standard makes a dispute workable rather than settling it
    options:
    - «The criterion fails by staying hidden, and a hidden standard produces the commonest kind of
      useless disagreement»
    - «Neither question settles the matter, and both move it to the one place where it can be argued
      productively»
    - «Academic criticism makes the standard explicit as a matter of convention»
    - «Evidence fails by being about something else, which is why a review that spends its length
      on the author's biography is not a review of the book»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation denies that the questions settle anything and says they move the argument to
      the one place where it can be conducted.
    trap: A names the harm a hidden standard does without saying what naming one achieves.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Critics who name their standards can be disagreed with. Critics who do not can only be
      ignored or believed. A reader who wants to argue with a review therefore needs ___
    options:
    - a longer review with more quotation
    - a reviewer who shares the reader's taste
    - an author willing to answer the charge
    - the standard the review was using
    key: D
    moves:
      A: near_miss
      B: imported
      C: imported
    why: The text says critics who name their standards can be disagreed with and that those who do
      not can only be ignored or believed.
    trap: B looks for agreement where the text calls for a stated standard.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «satirize» most nearly mean?
    target: satirize
    options:
    - describe in detail
    - borrow a style from
    - attack by ridicule
    - satisfy the demands of
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: imported
    why: The complaint is that the film does not satirize the system it depicts, so the word names
      mockery aimed at that system.
    trap: A asks only for depiction, which the sentence says the film already gives.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the two questions in the text?
    options:
    - They define the criterion for the first time
    - They show what an explicit standard lets a reader ask
    - They report the year Johnson insisted on the point
    - They settle both of the disputes they raise
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The two questions follow the claim that making the criterion explicit changes the argument,
      and each puts the stated standard itself in question.
    trap: D settles disputes the next sentence says are not settled.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says a hidden criterion produces useless disagreement. Based on Text 2, which choice
      best illustrates that outcome?
    sibling: HUM-S10-L1
    sibling_gloss: Text 2 is passage 40 of this book. It reports three reviews of one first performance,
      notes that all three critics sat in the same room for the same thirty-three minutes, and says
      each had a different standard in mind.
    options:
    - Three reviews of one evening disagreed because each wanted something different
    - The audience fought in the aisles within the first minutes
    - Stravinsky gave several accounts that do not agree either
    - The theater had opened only six weeks before
    key: A
    moves:
      B: true_not_asked
      C: near_miss
      D: true_not_asked
    why: Text 2 reports three critics in the same room whose verdicts differed because one wanted
      melody, one wanted novelty and one wanted a social occasion.
    trap: C gives one man disagreeing with himself rather than two standards in conflict.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: A claim fails by being unfalsifiable. ___ evidence fails by being about something else,
      which is why a review that spends its length on a biography is not a review of the book.
    options:
    - As a result,
    - In other words,
    - All the same,
    - Similarly,
    key: D
    moves:
      A: wrong_direction
      B: restatement
      C: wrong_direction
    why: The second sentence names the second of three characteristic failures, so the transition
      must mark a parallel rather than a consequence.
    trap: B treats a failure of evidence as a restatement of a failure of claim.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Critics who name their standards can be disagreed with ___ and critics who do not can
      only be ignored or believed.
    options:
    - with and
    - with, and
    - with; and
    - with and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about critics who do not name their standards is independent, so the conjunction
      joining it to the clause about those who do takes a comma.
    trap: A runs the clause about the named standards straight into the clause about the hidden ones.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain what academic criticism gains by naming its standard. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what academic criticism gains by naming its standard
    notes:
    - The criterion is the part most often left out.
    - A hidden standard produces useless disagreement.
    - Academic criticism makes the standard explicit by convention.
    - The convention costs it readers and buys it the ability to be refuted.
    options:
    - The criterion is the part of a judgment most often left out
    - A hidden standard produces the commonest useless disagreement
    - Academic criticism makes its standard explicit by convention
    - Stating the standard loses readers and buys the chance of being refuted
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice names the price and the purchase together, which is the trade the notes
      set out.
    trap: C reports the convention without saying what it costs or earns.
