      سمِّ الكائن، واقطع الطريق، يتوقّف الوباء، وهذا ما فعله مقبض المضخّة ومرشّح الماء. لكنّ القرن
      العشرين أنتج أيضًا الأرقام التي كان بتنكوفر يريدها.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: معظم من يحمل عصيّة السلّ لا
      يمرض قطّ، ووفيات الكوليرا في الوباء الواحد تتفاوت تفاوتًا كبيرًا بالتغذية وبتوافر السوائل النظيفة،
      فالكائن لازم وحال الشخص هي التي تحدّد أكثر من يموت.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسند دعوى وعن وظيفة جملة التسليم.
      والفخّ المتوقّع هنا أن يُحسب الخلاف إنكارًا لنظرية الجرثومة، مع أنّ النصّ يسلّم لها بالنصر.
      ويقترن المقطع بالمقطع المئة والسادس عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
