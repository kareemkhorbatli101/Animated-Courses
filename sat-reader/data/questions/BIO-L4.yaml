- id: BIO-S07-L4
  summary_ar:
    khulasa: نحو نصف النيتروجين في جسم إنسان حيّ اليوم ثُبّت صناعيًّا، ومعنى ذلك أنّ نحو نصف سكّان
      الأرض يُطعمهم تفاعل كيميائي اختُرع سنة ألف وتسعمئة وتسع. ولا يستقيم تفسير نموّ السكّان في القرن
      العشرين بإسقاط ذلك التفاعل من الحساب.
    maana: المعنى أنّ محاصيل الحبوب في البلدان التي أخذت حزمة السماد والسقي والأصناف المنتخبة ارتفعت
      ضِعفين إلى أربعة في جيل واحد، وأنّ المجاعة في آسيا صارت نادرة بعد أن كانت حادثًا منتظمًا. والتكاليف
      مقيسة أيضًا، وهذا ما يجعل المسألة خلافًا حقيقيًّا لا شعارًا.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: لعلّ نصف النيتروجين المضاف
      إلى الحقل لا يبلغ المحصول قطّ، بل يخرج في الماء والهواء، فيُحدث في الماء إغناءً يسلبه الأكسجين،
      وقد خلق مناطق ميتة عند مصابّ الأنهار الكبرى.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يفرّق بين خلاف في الوقائع وخلاف
      في العمل. والفخّ المتوقّع هنا أن يُحسب أحد الفريقين منكرًا للأرقام، مع أنّ النصّ يقول إنّ أحدًا
      منهما لا ينكرها. ويقترن المقطع بالمقطع المئة والسابع عشر في أسئلة النصّين المتقابلين.
