    - Attribution means establishing how much of a change a factor caused
    - The fingerprints settle whether the mechanism is at work, so the live argument is over the size
      of the response to it
    - Greenhouse warming predicts a cooling stratosphere, which is measured
    - Cloud response is the largest uncertainty in every model built
    key: B
    moves:
      A: underreach
      C: underreach
      D: true_not_asked
    why: Only this choice separates the question the patterns answer from the question still open,
      which is what the goal asks a reader to tell apart.
    trap: D names the open uncertainty without saying what has already been settled.
- id: BIO-S09-L4
  summary_ar:
    khulasa: 'قامت الجيولوجيا على قاعدة منهجية: أنّ العمليات العاملة الآن هي التي شكّلت الماضي. وكانت
      هذه القاعدة هي الأداة التي هزمت تقليدًا أقدم يفسّر المناظر بكوارث مفردة، وقد نجحت: فالتعرية
      البطيئة والترسيب البطيء والرفع البطيء تفسّر معظم سطح الأرض.'
    maana: 'المعنى أنّ هارلن بريتز وجد منظرًا لا تفسّره تلك القاعدة: أخاديد شُقّت مئات الأقدام في
      البازلت الصلب، وصخور بحجم البيوت نُقلت خمسين ميلًا، وحواجز حصى بعلوّ تلال صغيرة، وتجاعيد بين
      قمّة وقمّة خمسون قدمًا. فحجّ من سنة ألف وتسعمئة وثلاث وعشرين بأنّ سيلًا هائلًا صنع ذلك.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: ردّ عليه زملاؤه لا لأنّ عندهم
      تفسيرًا أحسن، بل لأنّ السيل المفرد الهائل هو بالضبط نوع التفسير الذي أمضى الميدان قرنًا في التخلّص
      منه، ثمّ تبيّن أنّه كان على حقّ.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي حسمه وعن وظيفة الفقرة الافتتاحية.
      والفخّ المتوقّع هنا أن تُقرأ الواقعة إبطالًا للقاعدة، مع أنّ النصّ يقول إنّها تبقى الأصل الصحيح.
      ويقترن المقطع بالمقطع المئة والتاسع عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Bretz received the highest medal of his discipline in 1979
    - A rule that found the anomaly also stopped the field believing it
    - Uniformitarianism has been abandoned as a false default
    - The scablands are channels cut into solid basalt
    key: B
    moves:
      A: true_not_asked
      C: wrong_direction
      D: underreach
    why: The text says the rule told geologists where to look and then told them not to believe what
      they found, and that it remains the correct default.
    trap: C contradicts the text, which calls the rule the correct default still.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, on what ground did other geologists reject his account?
    options:
    - Because they had measured the channels themselves
    - Because a better explanation was already available
    - Because the boulders had moved only a short way
    - Because a single enormous flood was the kind of account the field had discarded
    key: D
    moves:
      A: imported
      B: wrong_direction
      C: detail_swap
    why: The text says they rejected it not because they had a better account but because a single
      enormous flood was exactly what the discipline had spent a century getting rid of.
    trap: B denies the text, which says they had no better account to offer.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the case was settled
      by something other than the landscape itself?
    claim: the case was settled by something other than the landscape itself
    options:
    - «the evidence that settled it came from somewhere else entirely. A lake dammed by ice in Montana
      was identified»
    - «boulders the size of houses carried fifty miles, gravel bars the height of small hills, and
      ripple marks fifty feet from crest to crest»
    - «Slow erosion, slow deposition and slow uplift account for most of the surface of the Earth»
    - «Comparable flood channels have since been identified on Mars and are interpreted using the
      scablands»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says the deciding evidence came from elsewhere and names the ice-dammed lake
      in Montana, which is not part of the scabland surface at all.
    trap: B lists the features of the landscape that failed to persuade anyone.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: 'It is an argument about what a default is for: the rule told geologists where to look
      and then told them not to believe what they found. A default used that way is therefore ___'
    options:
    - the wrong instrument for reading a cliff face
    - a guarantee against mistaken conclusions
    - useful for finding an anomaly and no more
    - the reason flood channels were found on Mars
    key: C
    moves:
      A: wrong_direction
      B: overreach
      D: detail_swap
    why: The rule performed well in identifying a landscape it could not explain and badly in judging
      the explanation, so its value stops at the discovery.
    trap: B credits the default with reliability the episode shows it does not have.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «spent» most nearly mean?
    target: spent
    options:
    - used up entirely
    - passed in doing
    - paid out in money
    - worn out by effort
    key: B
    moves:
      A: near_miss
      C: imported
      D: near_miss
    why: The discipline had spent a century getting rid of such explanations, so the word reports
      the passing of time in that work rather than exhaustion or payment.
    trap: C takes the financial sense, which the century of effort does not involve.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the opening paragraph about the rule?
    options:
    - It establishes the standard that the later case strains
    - It introduces the ice-dammed lake in Montana
    - It argues that single catastrophes explain most landscapes
    - It reports the medal Bretz received in 1979
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The paragraph says the rule defeated an earlier tradition and gave geologists a disciplined
      method, which is the standard the scablands then put under pressure.
    trap: C states the tradition the rule defeated rather than the rule itself.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a rule that blocked a conclusion. Based on Text 2, what would be added to
      that report?
    sibling: BIO-S09-L3
    sibling_gloss: Text 2 is passage 119 of this book. It explains how the age of the Earth was fixed
      by radiometric dating, why meteorites had to be used because the surface is recycled, and how
      a disagreement between two methods is itself evidence.
    options:
    - Uniformitarianism remains the correct default for geology
    - Slow processes account for most of the surface of the Earth
    - Radiometric dating confirmed the flood that cut the scablands
    - A case in which a disagreement was treated as evidence
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 treats a conflict between two methods as information about the sample, which is the
      opposite of the reflex that Text 1 reports in the scabland dispute.
    trap: A repeats the verdict Text 1 reaches rather than adding anything from Text 2.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: His colleagues rejected it, not because they had a better account, but because a single
      enormous flood was exactly the kind of explanation the discipline had spent a century getting
      rid of. ___ he turned out to be right.
    options:
    - Accordingly,
    - Likewise,
    - As it happens,
    - In other words,
    key: C
    moves:
      A: near_miss
      B: wrong_direction
      D: restatement
    why: The sentence reports an outcome that runs against the rejection just explained, so the transition
      must mark the turn rather than a consequence or a restatement.
    trap: A reads his being right as following from the rejection of his argument.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: It is an argument about what a default is for ___ the rule told geologists where to look
      and then told them not to believe what they found.
    options:
    - 'for: the'
    - for, the
    - for the
    - for; the,
    key: A
    moves:
      B: comma_splice
      C: run_on
      D: misplaced
    why: A colon introduces the explanation of what a default is for, which a comma between two independent
      clauses cannot do.
    trap: B joins the clause about the rule to the announcement with a comma alone.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain how a good rule can produce a bad judgment. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain how a good rule can produce a bad judgment
    notes:
    - Uniformitarianism defeated an earlier tradition of explaining landscapes by single catastrophes.
    - Slow erosion, deposition and uplift account for most of the surface of the Earth.
    - The rule told geologists where to look and then told them not to believe what they found.
    - It remains the correct default.
    options:
    - Uniformitarianism defeated an earlier tradition of single catastrophes
    - Slow processes account for most of the surface of the Earth
    - The rule is right about most of the Earth, which is why it both found the anomaly and refused
      to accept it
    - Uniformitarianism remains the correct default for the discipline
    key: C
    moves:
      A: underreach
      B: underreach
      D: true_not_asked
    why: Only this choice makes the rule correct in general and wrong in the one case, which is the
      shape of the failure the goal asks about.
    trap: D affirms the rule without saying how it produced the mistaken judgment.
- id: BIO-S10-L4
  summary_ar:
    khulasa: دعويان في ثوايتس تُجمعان كثيرًا وحقّهما الفصل. الأولى عدم استقرار الصفيحة الجليدية البحرية،
      أي التراجع الذي يُعيل نفسه في نهر جليدي مرتكز تحت مستوى البحر على ميل يزداد عمقًا نحو الداخل.
      والفيزياء فيها مباشرة ومقبولة على نطاق واسع.
    maana: المعنى أنّ خطّ التأريض إذا رجع إلى ماء أعمق انكشف جليد أسمك، فخرج جليد أكثر، واستمرّ التراجع
      دون مزيد من التسخين. وهل بدأت هذه العملية في ثوايتس فعلًا؟ ذلك متنازع فيه، وقياسات تراجع خطّ
      التأريض هي الدليل الذي يُتجادل فيه.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: الدعوى الثانية هي انهيار جرف
      الجليد، أي تهاوي وجه مكشوف أعلى من أن يحمل نفسه، والاعتراضات عليها جدّية وليست سياسية: فالآلية
      لم تُرصد في المقياس المعنيّ، والنموذج احتاج معاملات اختيرت لتُحاكي مستويات بحر قديمة مرتابة.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسند دعوى وعن وظيفة الجملة الافتتاحية.
      والفخّ المتوقّع هنا أن تُقرأ الدعويان دعوى واحدة، فتبدو الأولى أقلّ ثبوتًا مما هي والثانية أكثر.
      ويقترن المقطع بالمقطع المئة والعشرين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - A 2016 model produced sea level rise of a meter or more
    - Both claims about Thwaites rest on the same physics
    - Two claims are run together, and only one of them is settled physics
    - Ice cannot support a cliff above roughly ninety meters
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: underreach
    why: The text separates the two claims, calls the first widely accepted physics and the second
      a possibility that has not been demonstrated, and says they are often reported as one.
    trap: B denies the separation the whole text is built to make.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what does marine ice sheet instability describe?
    options:
    - Retreat that sustains itself on a bed deepening inland
    - The collapse of a face too tall to hold itself up
    - A model result obtained in 2016
    - Warming that must continue for the retreat to go on
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The text defines the first claim as the self-sustaining retreat of a glacier grounded below
      sea level on a slope that deepens inland.
    trap: B gives the definition of the second claim rather than the first.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the objections to the
      second claim come from inside the science?
    claim: the objections to the second claim come from inside the science
    options:
    - «Whether that process has already begun at Thwaites is debated»
    - «The model required parameters chosen to reproduce ancient sea levels that are themselves uncertain»
    - «Ice cannot support a cliff above roughly ninety meters»
    - «which was several times the previous projections and was reported very widely»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation faults the model on the choice of its parameters and the uncertainty of the
      record they were fitted to, which is a technical objection.
    trap: A names the dispute about the first claim rather than the objections to the second.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The mechanism has never been observed at the relevant scale. Later work found that the
      same ancient levels could be reproduced without it. The second claim is therefore ___
    options:
    - ruled out by the evidence available
    - the settled physics of the two claims
    - the reason the first claim is debated
    - neither demonstrated nor excluded as yet
    key: D
    moves:
      A: overreach
      B: wrong_direction
      C: detail_swap
    why: The absence of observation and the availability of an account without the mechanism leave
      it unsupported, and the text says it also cannot be excluded.
    trap: A hardens an undemonstrated mechanism into one the evidence rules out.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «inimical» most nearly mean?
    target: inimical
    options:
    - very unlikely
    - poorly measured
    - damaging in its effects
    - easy to plan against
    key: C
    moves:
      A: near_miss
      B: imported
      D: wrong_direction
    why: The planner faces a distribution with a long inimical tail, so the word names the harm the
      far outcomes would do rather than how likely they are.
    trap: A reads the word as a statement of probability, which the tail already supplies.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the first sentence of the text?
    options:
    - It introduces the model result obtained in 2016
    - It announces the separation the rest of the text performs
    - It concedes that the two claims cannot be told apart
    - It reports the height a cliff of ice can reach
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The opening sentence says two claims are often run together and should be separated, which
      is what the two halves of the text then do in turn.
    trap: C denies the separation that the sentence calls for.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 separates two claims about one glacier. Based on Text 2, what would be added to that
      separation?
    sibling: BIO-S10-L3
    sibling_gloss: Text 2 is passage 120 of this book. It describes gravimetry from a satellite pair,
      the much older tide gauge and satellite altimetry, and says the first two methods fail in opposite
      directions, which is why they are used together.
    options:
    - The measurements that the first claim is argued over
    - Ice cannot support a cliff above about ninety meters
    - The first claim is physics that is probably under way
    - Gravimetry has observed an ice cliff failing at scale
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 describes the instruments that weigh the ice sheet, which is where the evidence about
      whether the retreat has begun actually comes from.
    trap: B repeats the physical limit that Text 1 has already given.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: 'The physics is straightforward and widely accepted: as the grounding line moves back
      into deeper water, thicker ice is exposed, more ice flows out, and the retreat continues without
      any further warming. ___ whether that process has already begun at Thwaites is debated.'
    options:
    - Accordingly,
    - Likewise,
    - In other words,
    - Even so,
    key: D
    moves:
      A: near_miss
      B: wrong_direction
      C: restatement
    why: The sentence sets an open question against the accepted physics just described, so the transition
      must mark a concession rather than a consequence or a restatement.
    trap: A reads the debate as following from the acceptance of the physics.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The physics is straightforward and widely accepted ___ thicker ice is exposed as the
      grounding line moves into deeper water.
    options:
    - accepted, thicker
    - 'accepted: thicker'
    - accepted thicker
    - accepted; thicker,
    key: B
    moves:
      A: comma_splice
      C: run_on
      D: misplaced
    why: A colon introduces the physics that the sentence has just called straightforward, which a
      comma between two independent clauses cannot do.
    trap: A joins the clause about the exposed ice to the announcement with a comma alone.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why reporting the two claims as one misleads in both directions.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why reporting the two claims as one misleads in both directions
    notes:
    - The physics of the first claim is straightforward and widely accepted.
    - Whether that process has begun at Thwaites is debated.
    - The mechanism of the second claim has never been observed at the relevant scale.
    - The first is probably under way and the second has not been demonstrated.
    options:
    - The physics of the first claim is widely accepted among workers
    - The mechanism of the second has never been observed at that scale
    - Whether the process has begun at Thwaites is still being debated
    - Joined together, the accepted physics looks less certain than it is and the untested mechanism
      looks more certain than it is
    key: D
    moves:
      A: underreach
      B: underreach
      C: true_not_asked
    why: Only this choice states the effect in both directions at once, which is what the goal asks
      for and what joining the two claims produces.
    trap: B gives the weakness of the second claim without naming the cost to the first.
