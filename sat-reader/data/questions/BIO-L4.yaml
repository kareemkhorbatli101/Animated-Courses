# Biology and Earth Science level 4 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: BIO
level: 4
sets:
- id: BIO-S01-L4
  summary_ar:
    khulasa: كان الافتراض العامل قرنًا بعد داروين أنّ كلّ صفة شائعة في كائن قد فضّلها الانتقاء، وأنّ
      العمل هو البحث عن وجه النفع. ثمّ اقترح موتو كيمورا سنة ألف وتسعمئة وثمان وستّين أنّ معظم التغيّر
      على المستوى الجزيئي محايد، لا ينفع ولا يضرّ، وأنّ انتشاره يخضع للانزياح العشوائي.
    maana: 'المعنى أنّ دليله حسابيّ: معدّل اختلاف تتابعات البروتين بين الأنواع أعلى بكثير من أن يفسّره
      انتقاء يعمل على كلّ تغيّر. والجدال الذي تلا ذلك خلاف في الأصل المفترض لا في الآليات، فلم ينكر
      أحد وقوع الانزياح ولا وقوع الانتقاء، وإنّما السؤال أيّهما يُفترض عند غياب الدليل.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: حسمت بيانات التتابع معظمه،
      فمال الحكم إلى المحايديّين على المستوى الجزيئي وإلى الانتقائيّين على مستوى الصفات الظاهرة.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسند دعوى وعن وظيفة الجملة التي
      تعيد صياغة الخلاف. والفخّ المتوقّع هنا أن يُحسب الخلاف إنكارًا لإحدى العمليتين، مع أنّ النصّ
      ينصّ على أنّ أحدًا لم ينكر. ويقترن المقطع بالمقطع المئة والحادي عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Kimura had to argue his case in English
    - The dispute was about which assumption to make, not about mechanisms
    - Nobody accepted that drift happens at all
    - Protein sequences differ between species
    key: B
    moves:
      A: true_not_asked
      C: wrong_direction
      D: underreach
    why: The text says the argument is worth understanding as a dispute about defaults, since nobody
      denied either process and the question was which to assume without evidence.
    trap: C contradicts the text, which says nobody denied that drift happens.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, how did the settlement divide between the two camps?
    options:
    - It went to the selectionists at every level
    - It went to the neutralists at every level
    - It left both positions entirely undecided
    - Molecular change to one camp, visible traits to the other
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: near_miss
    why: The text says the settlement went mostly to the neutralists at the molecular level and mostly
      to the selectionists at the level of visible traits.
    trap: C denies a settlement the text says sequencing data largely produced.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the dispute has left
      a working procedure rather than a winner?
    claim: the dispute has left a working procedure rather than a winner
    options:
    - '«The practical consequence is a test rather than a doctrine: a researcher comparing the two
      classes of change in a gene can say whether selection has acted on it»'
    - '«His evidence was arithmetical: the rate at which protein sequences were found to differ between
      species was far too high to be explained by selection operating on each change»'
    - «Selectionists held that an apparently useless difference usually has a use that has not been
      found»
    - «Changes that do not alter a protein accumulate at a steady rate, as drift predicts»
    key: A
    moves:
      B: true_not_asked
      C: near_miss
      D: near_miss
    why: The quotation names the outcome as a test a researcher can apply to any gene rather than
      a position either camp won, which is the claim exactly.
    trap: D gives one half of the settlement rather than the procedure it leaves behind.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Changes that do not alter a protein accumulate at a steady rate, as drift predicts, and
      that steadiness is now used as a clock. A clock of that kind therefore ___
    options:
    - depends on selection acting on each change
    - measures the strength of an advantage
    - works because nothing is pushing those changes
    - runs faster in species with larger populations
    key: C
    moves:
      A: wrong_direction
      B: detail_swap
      D: imported
    why: A steady rate follows from change by chance alone, so the clock depends on the absence of
      selection rather than on its presence.
    trap: A requires the very process that the steady rate rules out.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «novel» most nearly mean?
    target: novel
    options:
    - written as fiction
    - newly appeared
    - strange and useless
    - already explained
    key: B
    moves:
      A: imported
      C: overreach
      D: wrong_direction
    why: Neutralists held that a novel feature should be presumed accidental until an advantage is
      shown, so the word marks the feature as newly arisen.
    trap: C adds a verdict about usefulness that the word itself does not carry.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence calling this a dispute about defaults?
    options:
    - It reframes the argument so that both sides can be stated
    - It introduces the molecular clock for the first time
    - It concedes that neither process really occurs
    - It reports the year in which Kimura published
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The sentence comes between the evidence and the two positions, and it tells a reader that
      what follows is a disagreement about where the burden of proof lies.
    trap: C denies both processes, though the text says nobody denied either.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 asks which process should be assumed. Based on Text 2, what would be added to that
      question?
    sibling: BIO-S01-L3
    sibling_gloss: Text 2 is passage 111 of this book. It reports forty years of banding on Daphne
      Major, a drought in 1977 that killed about eighty-five percent of the medium ground finches,
      and a measured rise in mean beak depth with the selective agent identified.
    options:
    - Changes that alter a protein show the signature of selection
    - Drift governs the spread of a neutral change
    - Beak depth is governed by chance rather than by seeds
    - A case in which the selective agent was actually named
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 identifies the agent and measures the response, which is the demonstration that neutralists
      demand before an advantage may be assumed.
    trap: B repeats a definition Text 1 has already given rather than adding anything.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Nobody denied that drift happens or that selection happens. ___ the question was which
      should be assumed in the absence of evidence.
    options:
    - Likewise,
    - For instance,
    - Instead,
    - As a result,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: near_miss
    why: The second sentence replaces the denial just ruled out with the real question, so the transition
      must mark a substitution rather than a likeness or a consequence.
    trap: D reads the question about defaults as following from the agreement about both processes.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: His evidence was arithmetical ___ the rate at which protein sequences differ between
      species was far too high to be explained by selection.
    options:
    - 'arithmetical: the'
    - arithmetical, the
    - arithmetical the
    - arithmetical; the,
    key: A
    moves:
      B: comma_splice
      C: run_on
      D: misplaced
    why: A colon introduces the arithmetic that the sentence has just announced, which a comma between
      two independent clauses cannot do.
    trap: B joins the clause about the rate to the announcement with a comma alone.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why sequencing could settle a dispute about defaults. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why sequencing could settle a dispute about defaults
    notes:
    - Changes that do not alter a protein accumulate at a steady rate, as drift predicts.
    - Changes that alter a protein show the signature of selection.
    - The settlement went mostly to the neutralists at the molecular level.
    - A researcher comparing the two classes of change can say whether selection has acted.
    options:
    - Changes that alter a protein show the signature of selection
    - The settlement went mostly to the neutralists at the molecular level
    - The two classes of change behave differently, so a gene can be compared against both and no
      default has to be assumed
    - Kimura argued from the rate at which protein sequences differ
    key: C
    moves:
      A: underreach
      B: underreach
      D: true_not_asked
    why: Only this choice explains that the comparison removes the need for an assumption, which is
      what makes it a settlement of a dispute about defaults.
    trap: B names who won without saying what replaced the assumption.
- id: BIO-S02-L4
  summary_ar:
    khulasa: 'نسبة التوريث أكثر رقم يُساء فهمه في الأحياء، وسوء الفهم محدّد: فالمصطلح يعني حصّة التباين
      في صفة ما، داخل جماعة واحدة بعينها في زمن واحد، المرتبطة بالتباين الوراثي في تلك الجماعة. وهو
      ليس حكمًا على فرد، ولا حكمًا على مقدار ما يمكن تغييره من الصفة.'
    maana: 'المعنى أنّ الطول عالي التوريث وقد ارتفع مع ذلك عدّة إنشات في بلدان كثيرة في جيلين، وليس
      هذا تناقضًا بل بيانًا أنّ الرقم لا يقول شيئًا عن أثر تغيير البيئة. ثمّ جاء عصر الجينوم بمفاجأة:
      المتغيّرات المعروفة مجموعةً تفسّر أقلّ بكثير مما أوحت دراسات التوائم.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: قراءتان باقيتان لتلك الفجوة،
      إحداهما أنّ تقديرات التوائم انتفخت بالبيئة المشتركة، والأخرى أنّ التباين موزّع على آلاف المتغيّرات
      الضئيلة الأثر، وكلتاهما تتنبّأ بما يُختبر.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل وعن معنى كلمة في سياقها. والفخّ المتوقّع
      هنا أن يُستنتج أنّ الصفة الموروثة ثابتة لا تتغيّر، مع أنّ النصّ ينفي ذلك صراحة. ويقترن المقطع
      بالمقطع المئة والثاني عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Twin studies were run in Minnesota
    - A heritable trait cannot be changed by the environment
    - A number about variation in a population says nothing about an individual
    - The policy misuse of these numbers has a long history
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: true_not_asked
    why: The text defines heritability as a proportion of variation within one population and says
      twice that it is not a statement about an individual or about how much a trait can change.
    trap: B states the inference the text says nothing in the number supports.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what does the height example demonstrate?
    options:
    - That the number says nothing about changing the environment
    - That twin studies overstate shared environment
    - That height is not in fact heritable
    - That identified variants explain most of the variation
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: wrong_direction
    why: The text says height is highly heritable and also rose by several inches in two generations,
      which demonstrates that the number says nothing about the effect of changing the environment.
    trap: C denies the heritability that the example depends on.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the two readings of
      the gap are not idle positions?
    claim: the two readings of the gap are not idle positions
    options:
    - «they have been attacked most seriously on the ground that identical twins are treated more
      alike»
    - «Both predict testable things and both have been partly borne out»
    - «That gap has narrowed with larger samples and better methods and has not closed»
    - «the variation is spread across many thousands of variants of very small effect, most still
      undetected»
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: near_miss
    why: The quotation says both readings make testable predictions and both have been partly confirmed,
      which is what makes them live positions rather than postures.
    trap: C reports the state of the gap rather than the standing of the two readings.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: What neither supports is the inference that a heritable trait is fixed, since a highly
      plastic trait can be heritable and a trait with low heritability can be impossible to shift.
      Heritability and changeability are therefore ___
    options:
    - the same quantity under two names
    - both measured by the same twin studies
    - opposites, so that one rules out the other
    - two different things that may vary apart
    key: D
    moves:
      A: wrong_direction
      B: detail_swap
      C: wrong_direction
    why: The text gives an example in each direction, a plastic trait that is heritable and a stubborn
      trait that is not, so neither quantity fixes the other.
    trap: C turns independence into opposition, which the two examples rule out.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «plastic» most nearly mean?
    target: plastic
    options:
    - made of synthetic material
    - fixed in its final form
    - readily changed by conditions
    - measured with a twin study
    key: C
    moves:
      A: imported
      B: wrong_direction
      D: imported
    why: The sentence says a highly plastic trait can still be heritable, so the word names a trait
      that conditions can readily change.
    trap: B reverses the sense, since the example turns on a trait that does change.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the two readings set out near the end?
    options:
    - They introduce the definition of missing heritability
    - They show an open question still being worked on
    - They withdraw heritability as a useless number
    - They report the attack on the twin method
    key: B
    moves:
      A: detail_swap
      C: overreach
      D: detail_swap
    why: The text says two readings persist, gives each one, and adds that both make testable predictions
      and have been partly borne out, which marks the question as live.
    trap: C reads a disagreement about one gap as a verdict against the measure.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 describes a gap between two kinds of estimate. Based on Text 2, what would be added
      to that description?
    sibling: BIO-S02-L3
    sibling_gloss: Text 2 is passage 112 of this book. It traces linkage maps, physical mapping and
      sequencing, and says that a sequence gives the letters and not their function, so a correlation
      between a variant and a trait is not an explanation of it.
    options:
    - A reason that identified variants explain less than they seem to
    - Heritability is a proportion of variation within one population
    - Twin studies compare identical and non-identical pairs
    - Sequencing has now closed the gap completely
    key: A
    moves:
      B: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 says a sequence gives letters and not function, which is why adding up identified
      variants need not account for the variation a trait shows.
    trap: B repeats the definition Text 1 opens with rather than adding to it.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: That gap has narrowed with larger samples and better methods and has not closed. ___
      two readings persist.
    options:
    - By contrast,
    - For instance,
    - In other words,
    - Accordingly,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The survival of two readings follows from a gap that has shrunk without disappearing, so
      the transition must mark a consequence rather than a contrast or a restatement.
    trap: C treats the two readings as another way of saying the gap is open.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: It is not a statement about an individual ___ and it is not a statement about how much
      a trait can be changed.
    options:
    - individual and
    - individual, and
    - individual; and
    - individual and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about how much a trait can be changed is independent, so the conjunction joining
      it to the clause about an individual takes a comma before it.
    trap: A leaves the clause about an individual and the clause about change with no mark between
      them.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why a high heritability does not mean a trait is fixed. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a high heritability does not mean a trait is fixed
    notes:
    - Heritability is the proportion of variation within one population associated with genetic variation.
    - Height is highly heritable and rose several inches in two generations.
    - A highly plastic trait can be heritable.
    - A trait with low heritability can be impossible to shift.
    options:
    - Heritability is a proportion of variation within one population
    - A trait with low heritability can still be impossible to shift at all
    - A trait that conditions change readily can nevertheless be heritable
    - The number describes variation in a population, which is why height can be highly heritable
      and still rise several inches in two generations
    key: D
    moves:
      A: underreach
      B: true_not_asked
      C: underreach
    why: Only this choice joins what the number measures to the case of a trait that is both heritable
      and changed, which is the point the goal needs.
    trap: C states one half of the independence without the measured example that shows it.
- id: BIO-S03-L4
  summary_ar:
    khulasa: 'الصورة المدرسية للخلية مصنع: حُجَر لكلّ منها عمل، وخطوط نقل بينها، وغرفة تحكّم في النواة،
      ومحطّة طاقة في الميتوكندريا. وهي صورة نافعة وهي خاطئة تاريخيًّا خطأً يترتّب عليه أثر، فقد حجّت
      لين مارغوليس من الستّينيات بأنّ الميتوكندريا والبلاستيدات ليست حُجَرًا بل أحفاد بكتيريا حرّة
      ابتُلعت ولم تُهضم.'
    maana: 'المعنى أنّ الدليل الذي أقنع الميدان من جنس لا يحتمل جدلًا كبيرًا: فللعُضيّتين حمض نوويّ
      دائريّ من النوع البكتيريّ، وكلتاهما محفوفة بغشاء مزدوج كما يكون الكائن المبتلَع، وكلتاهما تصنع
      ريبوسوماتها التي تشبه البكتيرية حتى تُسكتها مضادّات البكتيريا، وكلتاهما تنقسم بجدولها.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: الباقي متنازعًا فيه هو إلى
      أيّ حدّ تُدفع الصورة الاستعمارية، فقد حجّت مارغوليس آخر عمرها لحالات أخرى منها أصل الأسواط،
      ولم يُقبل معظم تلك الدعاوى.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن وظيفة قائمة الأدلّة وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُعمَّم الدعوى على كلّ عُضيّة، مع أنّ النصّ يحصر ما ثبت في اثنتين. ويقترن
      المقطع بالمقطع المئة والثالث عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Margulis opposed well-supported positions in other fields
    - The factory picture of the cell is historically accurate
    - Her first paper was rejected by fifteen journals
    - The colonial account is settled for two organelles and open beyond them
    key: D
    moves:
      A: true_not_asked
      B: wrong_direction
      C: underreach
    why: The text lists the evidence that persuaded the field about mitochondria and chloroplasts
      and then says what remains disputed is how far the colonial picture should be pushed.
    trap: B reverses the text, which calls the factory picture historically false.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what does the action of certain antibiotics show?
    options:
    - That the organelles divide with the cell around them
    - That organelle ribosomes closely resemble bacterial ones
    - That the nucleus carries circular bacterial DNA
    - That cilia also descend from engulfed bacteria
    key: B
    moves:
      A: wrong_direction
      C: detail_swap
      D: overreach
    why: The text says both organelles make their own ribosomes, which resemble bacterial ribosomes
      closely enough to be shut down by antibiotics that act on bacteria.
    trap: A reverses the text, which says the organelles divide on a schedule of their own.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the evidence that convinced
      the field left little room for argument?
    claim: the evidence that convinced the field left little room for argument
    options:
    - «Lynn Margulis argued from the 1960s that mitochondria and chloroplasts are not compartments
      at all but descendants of free-living bacteria»
    - «Margulis argued late in her life for further cases, including the origin of cilia, which the
      evidence does not flag as strongly»
    - «Both make their own ribosomes, which resemble bacterial ribosomes closely enough to be shut
      down by antibiotics that act on bacteria and leave the rest of the cell alone»
    - «The textbook picture of a cell is a factory, with compartments that have jobs»
    key: C
    moves:
      A: true_not_asked
      B: wrong_direction
      D: near_miss
    why: A drug that shuts down the organelle ribosomes and leaves the rest of the cell alone is a
      direct test, which is the kind of evidence that admits little argument.
    trap: B names the later claims the evidence does not support rather than the ones it does.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Both divide on a schedule of their own rather than with the cell that contains them.
      A structure built by the cell for a job would therefore ___
    options:
    - divide when the cell divides, not when it chooses
    - carry its own circular DNA as well
    - be shut down by antibiotics that act on bacteria
    - be enclosed in a double membrane too
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: detail_swap
    why: An ordinary compartment is made by the cell for a purpose, so its timing would follow the
      cell rather than a schedule of its own.
    trap: B gives the organelle a feature that marks it as a former bacterium.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «flag» most nearly mean?
    target: flag
    options:
    - grow weaker over time
    - mark with a banner
    - hail from a distance
    - point out clearly
    key: D
    moves:
      A: imported
      B: imported
      C: near_miss
    why: The text says the evidence does not flag the later cases as strongly, so the word names how
      clearly the evidence indicates them.
    trap: A takes the other common sense of the word, that of tiring, which cannot apply to evidence.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the list of five shared features?
    options:
    - It introduces the dispute about cilia for the first time
    - It concedes that the factory picture is useful after all
    - It sets out the evidence that closed the first question
    - It reports the number of journals that rejected her paper
    key: C
    moves:
      A: detail_swap
      B: wrong_direction
      D: detail_swap
    why: The five features come after the sentence about evidence that admits little argument and
      before the turn to what remains disputed, so they carry the settled part of the case.
    trap: A names the open question rather than the evidence for the settled one.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 argues about what an organelle is. Based on Text 2, what would be added to that argument?
    sibling: BIO-S03-L3
    sibling_gloss: Text 2 is passage 113 of this book. It explains that the respiratory pathway was
      established by inhibitors, isotope labels and the spinning of broken cells, and that each of
      those three tactics has a weakness the others do not share.
    options:
    - Mitochondria carry circular DNA of the bacterial type
    - How the work inside the organelle was traced in the first place
    - Both organelles divide on a schedule of their own
    - The spinning experiments established the bacterial origin
    key: B
    moves:
      A: restatement
      C: restatement
      D: wrong_direction
    why: Text 2 reports how the oxygen-dependent steps were located in the isolated particles, which
      is how anyone knew what the structure under dispute actually does.
    trap: D credits the spinning work with a finding that Text 1 attributes to other evidence.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: It is a useful picture and it is historically false in a way that turns out to matter.
      ___ Lynn Margulis argued from the 1960s that mitochondria and chloroplasts are not compartments
      at all.
    options:
    - In fact,
    - Even so,
    - By contrast,
    - As a result,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: near_miss
    why: The second sentence supplies the history that makes the picture false, so the transition
      must press the point further rather than concede or oppose it.
    trap: B treats the history as a qualification of the falsity it establishes.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Her first paper on it was rejected by fifteen journals ___ the evidence that persuaded
      the field is of a kind that admits little argument.
    options:
    - journals, the
    - journals the
    - journals. The
    - journals, and, the
    key: C
    moves:
      A: comma_splice
      B: run_on
      D: misplaced
    why: The clause about the evidence that persuaded the field is a complete sentence, so a period
      separates it from the clause about the rejected paper.
    trap: A splices the clause about the evidence onto the clause about the journals with a comma.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the dispute still matters outside the laboratory. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the dispute still matters outside the laboratory
    notes:
    - Mitochondria and chloroplasts descend from engulfed bacteria.
    - How far the colonial picture should be pushed is still disputed.
    - Mitochondrial diseases are inherited only from the mother.
    - Those diseases behave unlike anything else in medical genetics.
    options:
    - Because the organelle is a former bacterium with its own line of descent, the diseases it carries
      pass only from the mother
    - Mitochondria and chloroplasts descend from engulfed bacteria
    - How far the colonial picture should be pushed is still disputed
    - Mitochondrial diseases behave unlike anything else in medical genetics
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice links the separate ancestry of the organelle to the unusual inheritance
      of its diseases, which is the practical consequence the goal asks for.
    trap: D reports the oddity without naming what in the organelle produces it.
- id: BIO-S04-L4
  summary_ar:
    khulasa: تُروى قصّة يلوستون نموذجًا نقيًّا للشلّال الغذائي، أي سلسلة آثار تنزل في شبكة الغذاء
      من المفترس إلى النبات، وقد سبقت الروايةُ الدليلَ في كثير منها. عادت الذئاب سنة ألف وتسعمئة وخمس
      وتسعين، وهبطت أعداد الأيائل، وتعافى الصفصاف والحور على الجداول، وعاد القندس، واستقرّت الضفاف.
    maana: 'المعنى أنّ كلّ حلقة في تلك السلسلة قد قيست، والصعوبة أنّ أشياء أخرى تغيّرت في العشرين
      سنة نفسها، فصار التصميم مشوبًا بالمعنى الدقيق: هبطت الأيائل لأسباب مجتمعة منها جفاف شديد وصيد
      بشريّ كثيف خارج الحدود وتكاثر الدببة وأسود الجبال.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: الموقف الذي يُدافع عنه أضيق
      من الشائع وما زال معتبرًا: الذئاب سبب من أسباب تغيّر حقيقيّ، وأثرها أقوى حيث يسمح الماء، ودعوى
      أنّها أعادت كتابة الأنهار غير مسندة.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسند دعوى وعن التحوّل الذي يقدّم
      اعتراضًا. والفخّ المتوقّع هنا أن يُنفى أثر الذئاب كلّه، مع أنّ النصّ يبقيها سببًا من عدّة أسباب.
      ويقترن المقطع بالمقطع المئة والرابع عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - A real change has several causes, and the clean story outran the evidence
    - Wolves had no measurable effect on the park at all
    - Willow recovery was general across the whole park
    - A short film compressed the chain into a minute
    key: A
    moves:
      B: overreach
      C: wrong_direction
      D: true_not_asked
    why: The text says the telling has outrun the evidence, lists the other changes over the same
      years, and ends with a narrower position that keeps the wolves as one cause among several.
    trap: B overshoots the correction, since the text calls the wolves one cause of a real change.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, where was willow recovery strongest?
    options:
    - Where human hunting outside the park was heaviest
    - Where bear and cougar numbers were growing
    - Where the water table was high enough
    - Where elk were fenced out and water was absent
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: wrong_direction
    why: The text says recovery was patchy rather than general and that the strongest recovery occurred
      where the water table was high enough to support it.
    trap: D reverses the exclosure result, where willows grew only when water was available.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that the design cannot separate
      two causes that moved together?
    claim: the design cannot separate two causes that moved together
    options:
    - «Wolves returned in 1995, elk numbers fell, willows and aspen recovered along the creeks, beaver
      returned, and streambanks stabilized»
    - «The Yellowstone story is told as a clean case of a trophic cascade»
    - «Exclosure studies showed willows growing where elk were fenced out and water was available»
    - «other things changed over the same twenty years, which makes the design confounded in the strict
      sense»
    key: D
    moves:
      A: near_miss
      B: true_not_asked
      C: near_miss
    why: The quotation says other things changed over the same twenty years and names the design confounded,
      which is exactly the inability the claim describes.
    trap: A lists the chain of changes rather than the reason their causes cannot be separated.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Exclosure studies showed willows growing where elk were fenced out and water was available,
      and not where water was absent. Fencing out the elk alone is therefore ___
    options:
    - enough to produce recovery anywhere in the park
    - not enough without water in the ground
    - the only cause of the recovery observed
    - a test of the fear that wolves produce
    key: B
    moves:
      A: overreach
      C: overreach
      D: detail_swap
    why: The willows grew only where the fence and the water were both present, so removing the browsing
      does nothing on its own in a dry site.
    trap: A generalizes a result the exclosures obtained only where water was available.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «stem» most nearly mean?
    target: stem
    options:
    - hold back
    - arise from
    - grow upward
    - measure out
    key: A
    moves:
      B: near_miss
      C: imported
      D: imported
    why: The sentence suggests that hydrology may stem the effect as much as browsing does, so the
      word names a check on the effect rather than its source.
    trap: B takes the other common sense of the word, which would reverse the direction.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the paragraph beginning with the defensible
      position?
    options:
    - It introduces the exclosure studies for the first time
    - It restates the popular story without changing it
    - It reports the three reasons elk numbers fell
    - It states what survives the objections just raised
    key: D
    moves:
      A: detail_swap
      B: wrong_direction
      C: detail_swap
    why: The paragraph comes after the specific objections and keeps the wolves as one cause among
      several while dropping the claim that they rewrote the rivers.
    trap: B denies the narrowing that the paragraph performs.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 narrows the claim about the wolves. Based on Text 2, what would be added to that
      narrowing?
    sibling: BIO-S04-L3
    sibling_gloss: Text 2 is passage 114 of this book. It describes the exclosure and the stable isotope
      ratio, says an exclosure tests browsing but cannot test fear, and reports that the reintroduction
      itself was the experiment and was run without a control.
    options:
    - Willow recovery was patchy rather than general
    - Several causes of the fall in elk numbers acted at once
    - Why no available method could have settled the question
    - An isotope ratio can distinguish fear from browsing
    key: C
    moves:
      A: restatement
      B: restatement
      D: wrong_direction
    why: Text 2 names what each method can and cannot reach and reports the missing control, which
      explains why the dispute in Text 1 had to be settled on judgment.
    trap: A repeats one of the objections Text 1 has already raised.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Each link in that chain has been measured. ___ other things changed over the same twenty
      years, which makes the design confounded in the strict sense.
    options:
    - Likewise,
    - All the same,
    - As a result,
    - For instance,
    key: B
    moves:
      A: wrong_direction
      C: near_miss
      D: near_miss
    why: The sentence sets a problem against the measurement just reported, so the transition must
      concede the measurements and then raise the objection.
    trap: C reads the confounding as a result of the measuring rather than a problem with it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Willow recovery was patchy rather than general ___ and the strongest recovery occurred
      where the water table was high enough.
    options:
    - general; and
    - general and
    - 'general: and'
    - general, and
    key: D
    moves:
      A: wrong_mark
      B: run_on
      C: wrong_mark
    why: The clause about the strongest recovery and the water table is independent, so the conjunction
      joining it to the clause about patchiness takes a comma before it.
    trap: B leaves the clause about patchiness and the clause about the water table unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why the episode is now taught as a lesson about inference.
      Which choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the episode is now taught as a lesson about inference
    notes:
    - Each link in the chain has been measured.
    - Other things changed over the same twenty years, which makes the design confounded.
    - A spectacular natural experiment without a control area produces a story that cannot be checked.
    - The defensible position keeps the wolves as one cause among several.
    options:
    - Each link in the chain of effects in the park has been measured
    - Every link was measured and the story still cannot be checked, because several causes moved
      together with no control area
    - The defensible position keeps the wolves as one cause among several
    - Other things changed over the same twenty years in the park
    key: B
    moves:
      A: underreach
      C: underreach
      D: true_not_asked
    why: Only this choice puts the measured links beside the missing control, which is what makes
      the case a lesson about inference rather than about wolves.
    trap: C gives the conclusion reached without the reasoning that forced it.
- id: BIO-S05-L4
  summary_ar:
    khulasa: 'دورة الأرنب العشرية ولّدت تفسيرين متنافسين حكما الميدان خمسين سنة. أحدهما الغذاء: الأرانب
      تأكل الشجيرات حتى تنهكها، فتردّ الشجيرات بدفاعات كيميائية وتحتاج سنين لتعود، فينهار عددها لقلّة
      ما يُؤكل. والآخر المفترسات: الوشق والذئب والبوم تتكاثر وراءها ثمّ تجاوزها فتُسقطها.'
    maana: المعنى أنّ الروايتين تطابقان سلسلة مردودات الفراء، وهذا هو الحال المعتاد إذا لم يكن في
      اليد إلّا ملازمة. فحسمها تشارلز كريبس وزملاؤه بالتجربة في يوكون بين عام ألف وتسعمئة وستّ وثمانين
      وعام ألف وتسعمئة وستّ وتسعين، بتصميم عاملي تُطبَّق فيه المعالجات منفردة ومجتمعة.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: الغذاء وحده ضاعف الكثافة،
      وإقصاء المفترسات وحده ضاعفها، وهما معًا رفعاها نحو أحد عشر ضعفًا، وهو أكثر بكثير من مجموع الأثرين،
      وذلك التفاعل هو الكشف الذي لم يتوقّعه أيّ من الفريقين.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل وعن إكمال النصّ إكمالًا منطقيًّا. والفخّ
      المتوقّع هنا أن تُنسب النتيجة المشتركة إلى معالجة واحدة، مع أنّ النصّ يفرّق بينها وبين المجتمعتين.
      ويقترن المقطع بالمقطع المئة والخامس عشر في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The enclosures had to be electrified against bears
    - An interaction neither camp predicted settled a fifty-year question
    - Food alone produced the elevenfold increase
    - The experiment ran in the Yukon for ten years
    key: B
    moves:
      A: true_not_asked
      C: wrong_direction
      D: underreach
    why: The text says the two treatments together raised density about elevenfold, far more than
      their effects added, and calls that interaction the finding neither camp had predicted.
    trap: C gives the joint result to one treatment alone, which doubled density by itself.
  - slot: 2
    type: detail
    difficulty: medium
    stem: According to the text, what did predator exclusion alone do to hare density?
    options:
    - It raised density about elevenfold
    - It left density where it had been
    - It raised density by about a half
    - It roughly doubled density on its own
    key: D
    moves:
      A: detail_swap
      B: wrong_direction
      C: detail_swap
    why: The text says food alone roughly doubled hare density and predator exclusion alone roughly
      doubled it, with the large increase coming only from the two together.
    trap: A gives the result of the two treatments together rather than of exclusion alone.
  - slot: 3
    type: evidence
    difficulty: hard
    stem: Which quotation from the text most strongly supports the claim that a correlation could
      not have settled the question?
    claim: a correlation could not have settled the question
    options:
    - «a correlation cannot reveal an interaction, and the two single-cause theories were both correct
      and both insufficient»
    - «Both accounts fit the fur return series, which is the usual situation when a correlation is
      all anyone has»
    - «The experiment cost a decade and about a hundred kilometers of fence»
    - «Several blocks were lost to fire and weather over the ten years and the design had to be rebuilt»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says a correlation cannot reveal an interaction and that both single-cause
      theories were insufficient, which is why the series could not decide between them.
    trap: B shows both theories fitting the series rather than why a correlation cannot choose.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A hare with enough food can afford to be vigilant and a hare in cover can afford to forage
      carelessly, so the two pressures are not independent. Measuring one pressure with the other
      held constant is therefore ___
    options:
    - the only design that could have worked
    - enough to predict the joint result
    - bound to understate what the pair can do
    - a way of removing the interaction entirely
    key: C
    moves:
      A: wrong_direction
      B: overreach
      D: near_miss
    why: If the two pressures reinforce each other, a treatment applied alone cannot produce the joint
      effect, so a single-factor measurement falls short of it.
    trap: B claims a prediction that the text says neither camp was able to make.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «fecund» most nearly mean?
    target: fecund
    options:
    - unusually mild
    - rich in offspring
    - short and crowded
    - poor in food
    key: B
    moves:
      A: imported
      C: imported
      D: wrong_direction
    why: The sentence says a fecund season under both conditions produces an explosion, so the word
      describes a season of heavy breeding.
    trap: D reverses the sense, since the season in question has food in abundance.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the two rival explanations at the start?
    options:
    - They set up the question the experiment was built to decide
    - They report the result of the factorial design
    - They show that neither pressure affects the hares
    - They introduce the electric fencing for the first time
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: detail_swap
    why: The text gives the food account and the predator account, says both fit the series, and then
      describes the experiment that was run to choose between them.
    trap: C denies both pressures, though each roughly doubled density on its own.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports an experiment on the hare cycle. Based on Text 2, what would be added to
      that report?
    sibling: BIO-S05-L3
    sibling_gloss: Text 2 is passage 115 of this book. It reports a century of annual fur returns
      for lynx and hare, says a fur return is a proxy for several things at once, and names tree ring
      records of browsing as an independent check on the cycle.
    options:
    - Both single-cause accounts fit the fur return series
    - The two treatments together raised density elevenfold
    - The fur returns were a direct count of the animals
    - What had to be corrected before the cycle could be trusted
    key: D
    moves:
      A: restatement
      B: restatement
      C: wrong_direction
    why: Text 2 describes the corrections and the second proxy that establish the cycle, which is
      the pattern the experiment in Text 1 was built to explain.
    trap: A repeats the point Text 1 makes about the series rather than adding to it.
  - slot: 8
    type: transitions
    difficulty: hard
    stem: Which choice completes the text with the most logical transition?
    carrier: Both accounts fit the fur return series, which is the usual situation when a correlation
      is all anyone has. ___ Charles Krebs and colleagues settled it by experiment in the Yukon between
      1986 and 1996.
    options:
    - Likewise,
    - In other words,
    - In the end,
    - For instance,
    key: C
    moves:
      A: wrong_direction
      B: restatement
      D: near_miss
    why: The sentence reports the resolution of the impasse just described, so the transition must
      mark the outcome rather than a likeness or a restatement.
    trap: B treats the experiment as another way of stating the impasse.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: That interaction is the finding ___ and neither camp had predicted it.
    options:
    - finding, and
    - finding and
    - finding; and
    - finding and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause saying neither camp had predicted the interaction is independent, so the conjunction
      joining it to the clause naming the finding takes a comma.
    trap: B leaves the clause about the finding and the clause about the camps unmarked.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain why both old theories were correct and insufficient. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why both old theories were correct and insufficient
    notes:
    - Food alone roughly doubled hare density.
    - Predator exclusion alone roughly doubled it.
    - The two together increased it about elevenfold.
    - A hare with enough food can afford to be vigilant, so the pressures are not independent.
    options:
    - Food alone roughly doubled the density of the hares in the blocks
    - The two treatments together increased density about elevenfold
    - Each pressure doubled density on its own, so each theory was right, and the elevenfold joint
      result shows neither was enough
    - The two pressures are not independent of one another at all
    key: C
    moves:
      A: underreach
      B: underreach
      D: true_not_asked
    why: Only this choice reports both single-factor doublings and the much larger joint result, which
      together show each theory right and each one short.
    trap: B gives the joint result alone and so leaves both theories unjudged.
- id: BIO-S06-L4
  summary_ar:
    khulasa: وافق ماكس فون بتنكوفر روبرت كوخ على وجود كائن الكوليرا، وأنكر أن يكون وجوده كافيًا لإحداث
      وباء. وكانت صيغته أنّ الوباء يحتاج الجرثومة والأرض، أي حال التراب ومنسوب الماء والأحوال المحلّية،
      وحجّ بأنّ الكائن وحده لا يُحدث مرضًا في جماعة سليمة حسنة الصرف.
