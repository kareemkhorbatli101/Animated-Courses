  summary_ar:
    khulasa: لا يُنكر أحد في هذا الجدال أنّ مناخ الأرض قد تغيّر من قبل، والسؤال الذي يهمّ فعلًا هو
      الإسناد، أي إثبات كم من تغيّر مرصود سببه عامل بعينه. فاعتراض أنّ المناخ كان دائمًا متغيّرًا
      ليس اعتراضًا تافهًا، وجوابه ليس توكيدًا أعلى صوتًا بل منهج.
    maana: 'المعنى أنّ المنهج هو بصم الأثر: البحث عن نمط تغيّر يُحدثه سبب واحد ولا تُحدثه البدائل.
      فالتسخين الدفيئي يتنبّأ بأنّ الجوّ الأدنى يسخن والستراتوسفير الأعلى يبرد، وهذا هو المقيس، ولا
      يقدر أيّ ازدياد في خرج الشمس على إحداث هذا الاقتران.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الخلاف: الاعتراضات الجدّية في المقدار
      لا في الإسناد، وهي داخل العلم لا خارجه، فاستجابة السحاب أكبر مصدر للارتياب في كلّ نموذج، وهي
      تحرّك التسخين المتوقّع على مدى عدّة درجات.'
    sila: في اختبار سات يكثر السؤال عن موضع النزاع وعن الدليل الذي يسند دعوى وعن التحوّل الذي يستبدل
