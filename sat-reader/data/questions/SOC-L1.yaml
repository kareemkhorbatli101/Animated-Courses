# Social Science level 1 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: SOC
level: 1
sets:
- id: SOC-S01-L1
  summary_ar:
    khulasa: 'سنة ألف وتسعمئة وأربعين أجرى باحث أمريكي يُسمّى دونالد رَغ اختبارًا بسيطًا على صياغة
      الأسئلة. كان بيده صيغتان لسؤال واحد عن حرّية الكلام: إحداهما تسأل هل تمنع الولايات المتّحدة
      الخطب العامّة ضدّ الديمقراطية، والأخرى هل تسمح بها.'
    maana: 'المعنى أنّ الصيغتين سؤال واحد منطقًا، فمن أراد منع شيء لم يُرد السماح به. وذهبت الصيغتان
      إلى مجموعتين متماثلتين في المسح نفسه، فلم تتوافق الأجوبة: نحو أربع وخمسين في المئة قالوا نعم
      للمنع، ونحو خمس وسبعين قالوا لا للسماح.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: الرقمان يصفان جمهورين مختلفين،
      والفجوة نحو عشرين نقطة، وقد أُعيدت الدراسة مرّات كثيرة في بلدان عدّة بالنتيجة نفسها. فالناس
      أقدر على رفض الإذن من فرض الحظر ولو تساوى الأثر العمليّ.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُستنتج أنّ المسوح عديمة النفع، مع أنّ النصّ ينفي ذلك صريحًا. ويقترن
      المقطع بالمقطع الحادي والتسعين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Rugg ran his test on free speech in 1940
    - A survey figure is a figure about one form of words
    - Surveys are useless because wording changes answers
    - The two versions of the question produced the same answers
    key: B
    moves:
      A: underreach
      C: overreach
      D: wrong_direction
    why: The text reports the twenty-point gap, lists a family of similar effects, and says a number
      from a survey is a number about a particular form of words.
    trap: C pushes the finding past the sentence that denies surveys are useless.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what did about fifty-four percent say?
    options:
    - That they would not allow the speeches
    - That they had no opinion either way
    - That the two questions were the same
    - That the speeches should be forbidden
    key: D
    moves:
      A: detail_swap
      B: imported
      C: imported
    why: The text says about fifty-four percent said yes to forbidding and about seventy-five percent
      said no to allowing.
    trap: A gives the answer that drew the larger share of the other group.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the effect is not a
      one-off result?
    claim: the effect is not a one-off result
    options:
    - «The study has been repeated many times since, in several countries, with the same result»
    - «The two versions went to two matched groups of people in the same survey»
    - «Logically these are the same question. A person who wants to forbid something does not want
      to allow it»
    - «Good polling organizations publish the exact wording alongside the figure for this reason»
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says the study has been repeated many times in several countries and reached
      the same result each time.
    trap: B names the care taken in one study rather than its repetition elsewhere.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A reader who is given a percentage without the question is not being given much. A report
      that prints a figure and omits the wording therefore ___
    options:
    - rules out any order effect
    - describes two publics at once
    - withholds what the figure is about
    - proves the survey was badly run
    key: C
    moves:
      A: imported
      B: near_miss
      D: overreach
    why: The text says a number from a survey is a number about a particular form of words, so the
      wording is what the figure is a figure about.
    trap: D convicts the survey when the text faults only the reporting.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «influences» most nearly mean?
    target: influences
    options:
    - has authority over
    - helps to determine
    - leaves unchanged
    - persuades by charm
    key: B
    moves:
      A: near_miss
      C: wrong_direction
      D: imported
    why: The wording is said to influence the result as much as the subject does, so the word names
      a share in producing the figure.
    trap: C reverses the sentence, which makes the wording a cause of the result.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence saying the answers failed to match?
    options:
    - It marks the result against the expectation just stated
    - It defines what a respondent is for a reader
    - It reports the year the test was run
    - It concludes that surveys cannot be used
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: overreach
    why: The sentence follows the statement that the two versions are logically the same question
      and precedes the two percentages that differ by twenty points.
    trap: D discards an instrument the text goes on to defend.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports an effect of question wording. Based on Text 2, which choice best describes
      where such an effect belongs?
    sibling: SOC-S01-L2
    sibling_gloss: Text 2 is passage 91 of this book. It separates three ways a survey can fail, the
      sampling frame, nonresponse and the instrument, and says the instrument includes the wording
      effects from the earlier passage along with order effects.
    options:
    - In the sampling frame the names are drawn from
    - In the failure of selected people to answer
    - In the weighting applied to the answers
    - In the instrument that puts the questions
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: near_miss
    why: Text 2 names the instrument as the third kind of failure and says it includes the wording
      effects from the earlier passage along with order effects.
    trap: A names a different one of the three failures Text 2 sets out.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Logically these are the same question. ___ a person who wants to forbid something does
      not want to allow it.
    options:
    - By contrast,
    - As a result,
    - After all,
    - In any case,
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: near_miss
    why: The second sentence gives the reason the two versions count as the same question, so the
      transition must mark a ground.
    trap: B makes the reason follow from the claim it supports.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The order of the items changes answers ___ and offering a middle option pulls about a
      fifth of respondents out of the two sides.
    options:
    - answers, and
    - answers and
    - answers; and
    - answers and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the middle option is independent, so the conjunction joining it to the clause
      about the order of the items takes a comma.
    trap: B runs the clause about the order straight into the clause about the middle option.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain what a reader needs besides the percentage. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what a reader needs besides the percentage
    notes:
    - About fifty-four percent would forbid and about seventy-five percent would refuse to allow.
    - The two figures describe different publics.
    - A number from a survey is a number about a particular form of words.
    - Good polling organizations publish the exact wording.
    options:
    - About fifty-four percent would forbid the speeches
    - The two figures describe different publics entirely
    - The exact wording, since the figure is a figure about those words
    - Good polling organizations publish the exact wording
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice names the wording and gives the reason the notes supply, that the number
      is about the words used.
    trap: D reports the practice without saying what makes it necessary.
- id: SOC-S02-L1
  summary_ar:
    khulasa: أجرت ولاية تينيسي تجربة غير معتادة في مدارسها بين سنة ألف وتسعمئة وخمس وثمانين وسنة تسع
      وثمانين، تُعرف باسم مشروع ستار. أرادت الولاية أن تعلم هل تنفع الصفوف الصغيرة الأطفال الصغار.
    maana: 'المعنى أنّ دراسات سابقة قارنت مدارس صادف أنّ فيها صفوفًا صغيرة بمدارس ليس فيها، وتلك المقارنات
      صعبة التصديق: فالصفوف الصغيرة شائعة في المناطق الغنيّة وفي المدارس ذات الغرف الفاضلة، وأيّ فرق
      قد يأتي من الثراء أو البناء لا من حجم الصفّ.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: فوزّعت الولاية الأطفال بالقرعة،
      ودخل الدراسة نحو أحد عشر ألفًا وستّمئة تلميذ في تسع وسبعين مدرسة، فوُضعوا عشوائيًّا في صفّ صغير
      من ثلاثة عشر إلى سبعة عشر أو في صفّ عاديّ من اثنين وعشرين إلى خمسة وعشرين.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن التفصيل المذكور في النصّ وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن تُحسب المقارنات السابقة موثوقة، مع أنّ النصّ يقول إنّها صعبة التصديق.
      ويقترن المقطع بالمقطع الثاني والتسعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Tennessee published the data for later reanalysis
    - Small classes cost a great deal to provide
    - Assigning by lot made a fair comparison possible
    - Earlier comparisons of schools were trustworthy
    key: C
    moves:
      A: true_not_asked
      B: underreach
      D: wrong_direction
    why: The text says earlier comparisons were hard to trust, describes the assignment by lot, and
      ends by saying what the lot made possible was a fair comparison.
    trap: D trusts the comparisons the text says were hard to trust.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how large was a small class in the study?
    options:
    - Thirteen to seventeen children
    - Twenty-two to twenty-five children
    - About seventy-nine children
    - Four to eleven children
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says children were put at random into a small class of thirteen to seventeen or
      into a regular class of twenty-two to twenty-five.
    trap: B gives the size of a regular class instead.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the gain did not depend
      on staying in a small class?
    claim: the gain did not depend on staying in a small class
    options:
    - «About eleven thousand six hundred pupils in seventy-nine schools entered the study in kindergarten»
    - «The effect did not vanish when the children returned to ordinary classes, and some of it could
      still be found years later in high school test taking»
    - «The gap was clearest in the first two years and in reading, and it was larger for children
      from poorer families»
    - «Within each school, children were put at random into a small class of thirteen to seventeen»
    key: B
    moves:
      A: true_not_asked
      C: near_miss
      D: true_not_asked
    why: The quotation says the effect survived the return to ordinary classes and could still be
      found years later in high school test taking.
    trap: C names where the gap was largest rather than how long it lasted.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Small classes are common in rich districts and in schools with spare rooms. Any difference
      in results might come from the wealth or the building rather than the class size. A comparison
      of schools that happened to differ would therefore ___
    options:
    - balance the two groups at the start
    - require teachers assigned by lot
    - show a larger gain for poorer children
    - leave the cause of the gap unsettled
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: imported
    why: The wealth and the building could produce the difference, so a comparison that did not control
      them cannot say which factor acted.
    trap: A credits an unbalanced comparison with the property only the lot supplies.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «compared» most nearly mean?
    target: compared
    options:
    - likened for rhetorical effect
    - ranked above one another
    - set side by side to find a difference
    - brought into agreement
    key: C
    moves:
      A: near_miss
      B: wrong_direction
      D: imported
    why: Earlier studies are said to have compared schools with small classes against schools without
      them, so the word names placing two sets beside each other.
    trap: B adds a ranking the comparison does not make.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about rich districts and spare
      rooms?
    options:
    - It defines a randomized trial for a reader
    - It explains why the earlier studies were doubted
    - It reports the years the experiment ran
    - It argues that wealth improves reading
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: imported
    why: The sentence follows the statement that earlier comparisons were hard to trust and names
      the wealth and the buildings that could have produced the difference.
    trap: D turns a possible confusion into a finding about wealth.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says the lot made a fair comparison possible. Based on Text 2, which choice best
      explains why matching would have failed?
    sibling: SOC-S02-L2
    sibling_gloss: Text 2 is passage 92 of this book. It contrasts matching with a lottery, names
      the confounder as a difference between groups that affects the outcome, and says the fatal property
      of confounders is that the dangerous ones are the ones nobody thought of.
    options:
    - The dangerous differences are the ones nobody listed
    - Groups will differ a little by luck in any trial
    - A result may fail to transfer to another decade
    - People dropping out unevenly spoils a design
    key: A
    moves:
      B: near_miss
      C: true_not_asked
      D: true_not_asked
    why: Text 2 says the fatal property of confounders is that the dangerous ones are the ones nobody
      thought of, which matching cannot equalize.
    trap: B names the known uncertainty randomization carries rather than the failure of matching.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Any difference in results might come from the wealth or the building rather than the
      class size. ___ the state assigned children by lot.
    options:
    - By contrast,
    - For example,
    - In other words,
    - For that reason,
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: restatement
    why: The second sentence gives what the state did because the earlier comparisons could not separate
      the causes, so the transition must mark a consequence.
    trap: A sets the assignment against the problem that prompted it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The small classes did better ___ and the gap was clearest in the first two years.
    options:
    - better and
    - better, and
    - better; and
    - better and,
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the clearest gap is independent, so the conjunction joining it to the clause
      about the small classes takes a comma.
    trap: A runs the clause about the classes straight into the clause about the gap.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain why the policy argument continued after the result. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why the policy argument continued after the result
    notes:
    - The small classes did better, especially for poorer children.
    - Small classes need more teachers and more rooms.
    - The experiment cost a great deal.
    - The cost is the reason the argument continued.
    options:
    - The small classes did better, especially for poorer children
    - Small classes need more teachers and more rooms
    - The cost is the reason the argument continued after the result
    - A finding that works can still be argued over once its price is counted
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice joins the established effect to the expense that kept the decision open,
      which is what the notes together support.
    trap: B names the cost without saying what it did to the argument.
- id: SOC-S03-L1
  summary_ar:
    khulasa: 'سنة ألفين واثنتي عشرة نشر طبيب سويسري يُسمّى فرانتس ميسرلي ورقة قصيرة في مجلّة طبّية
      معروفة. كان قد رسم رقمين لثلاث وعشرين دولة: على محور كمّية الشوكولاتة المأكولة للفرد في السنة،
      وعلى الآخر عدد جوائز نوبل لكلّ مليون نسمة.'
    maana: 'المعنى أنّ النقاط اصطفّت اصطفافًا لافتًا: سويسرا في القمّة على المقياسين، والصين قريبة
      من الأسفل عليهما. والعلاقة قويّة بما يسمّيه الإحصائيّ مطابقة محكمة، وميسرلي كان يمزح مزحة ذات
      مغزى جدّيّ وقال ذلك في الورقة.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: لا أحد يظنّ أنّ أكل الشوكولاتة
      يُنتج علماء، وثمّ تفاسير أخرى حاضرة: فالبلدان الغنيّة تأكل شوكولاتة أكثر وتموّل مختبرات أكثر،
      فقد يُنتج الثراء الوطنيّ الرقمين دون أن يمسّ أحدهما الآخر.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُقرأ العلاقة سببًا، مع أنّ النصّ يعدّ أربع علاقات ممكنة. ويقترن المقطع
      بالمقطع الثالث والتسعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Switzerland sat at the top on both measures
    - The paper is now used in teaching
    - Eating chocolate helps produce scientists
    - A real and strong pattern can still guide nothing
    key: D
    moves:
      A: underreach
      B: true_not_asked
      C: wrong_direction
    why: The text calls the case a clean example of a pattern that is real, strong, measurable and
      useless as a guide to action, and then lists the four relations two figures may stand in.
    trap: C accepts a causal story the text says nobody believes.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how many countries did the paper cover?
    options:
    - Two of them
    - Twenty-three
    - Two million
    - A dozen
    key: B
    moves:
      A: imported
      C: detail_swap
      D: imported
    why: The text says the physician had plotted two figures for twenty-three countries.
    trap: C gives a population figure used elsewhere in the text.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that national wealth could
      produce both figures?
    claim: national wealth could produce both figures
    options:
    - «The points lined up remarkably well. Switzerland sat at the top on both measures»
    - «Prizes are awarded to people who did their work decades earlier, often in a different country»
    - «Rich countries eat more chocolate and also fund more laboratories, so national wealth could
      produce both figures without either touching the other»
    - «A country of two million people needs only one laureate, meaning one person awarded the prize,
      to lead the table»
    key: C
    moves:
      A: true_not_asked
      B: near_miss
      D: near_miss
    why: The quotation names the wealth that raises both the chocolate and the laboratories and says
      it could produce both figures without either touching the other.
    trap: B names a different weakness, the crudeness of the measure.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Two figures can rise together because one causes the other, because the second causes
      the first, because a third thing causes both, or because a small sample has fallen out that
      way. A reader who settles on the first without asking is therefore ___
    options:
    - wrong most of the time
    - reading a tight fit correctly
    - studying twenty-three countries
    - making the joke the author made
    key: A
    moves:
      B: wrong_direction
      C: near_miss
      D: imported
    why: The text says a reader who fails to ask which of the four is in play will assume the first
      and will be wrong most of the time.
    trap: B calls a mistaken reading a correct one.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «assume» most nearly mean?
    target: assume
    options:
    - take on a duty
    - pretend to have
    - prove by testing
    - take for granted
    key: D
    moves:
      A: imported
      B: imported
      C: wrong_direction
    why: The reader in that sentence is said to assume the first of the four relations without asking,
      so the word names accepting it untested.
    trap: C makes the reader test what the sentence says goes unexamined.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about a country of two million?
    options:
    - It defines a laureate for the first time
    - It reports the year the paper appeared
    - It shows how crude the second measure is
    - It argues that small countries win more prizes
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: overreach
    why: The sentence follows the statement that the measures are crude and shows that one prize can
      put a small population at the head of the table.
    trap: D turns an arithmetic point into a claim about which countries win.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 calls national wealth a possible source of both figures. Based on Text 2, which choice
      best names that relation?
    sibling: SOC-S03-L2
    sibling_gloss: Text 2 is passage 93 of this book. It sets out four relations two correlated measurements
      may stand in, and names the common cause as its third possibility, saying it is what the chocolate
      and Nobel case shows.
    options:
    - Reverse causation
    - A common cause
    - A selection effect
    - A dose response
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: imported
    why: Text 2 names the common cause as its third possibility and says it is what the chocolate
      and Nobel case shows.
    trap: A names the relation in which the outcome produces the supposed cause.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Nobody thinks that eating chocolate produces scientists. ___ several other explanations
      are available at once.
    options:
    - Besides,
    - By contrast,
    - As a result,
    - In other words,
    key: A
    moves:
      B: wrong_direction
      C: wrong_direction
      D: restatement
    why: The second sentence adds further reasons beyond the one just dismissed, so the transition
      must mark an addition.
    trap: C makes the other explanations follow from the dismissal.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Switzerland sat at the top on both measures ___ and China sat near the bottom on both.
    options:
    - measures and
    - measures; and
    - measures, and
    - measures and,
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: misplaced
    why: The clause about China is independent, so the conjunction joining it to the clause about
      Switzerland takes a comma.
    trap: A runs the clause about Switzerland straight into the clause about China.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain what the habit of asking is for. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain what the habit of asking is for
    notes:
    - Two figures can rise together for four different reasons.
    - A reader who fails to ask will assume the first.
    - That reader will be wrong most of the time.
    - The habit of asking is most of what a statistics course is for.
    options:
    - Asking which of four reasons is in play is what keeps a reader from guessing the first
    - Two figures can rise together for four different reasons
    - A reader who fails to ask will assume the first reason
    - The habit of asking is most of what a statistics course is for
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
    why: Only this choice joins the four possibilities to the default the asking is meant to prevent.
    trap: C names the default without saying what displaces it.
- id: SOC-S04-L1
  summary_ar:
    khulasa: 'تسع أُسَر في شارع دخل كلّ واحدة أربعون ألف دولار في السنة، والأسرة العاشرة دخلها أربعة
      ملايين. فمتوسّط الدخل في الشارع أربعمئة وأربعة آلاف دولار، وهو رقم صحيح لا يصف أحدًا: تسع من
      عشرة بعيدة عنه، والعاشرة عشرة أمثاله.'
    maana: 'المعنى أنّ الأسرة الوسطى، وهي الوسيط أي القيمة الوسطى حين تُرتَّب الحالات، تكسب أربعين
      ألفًا كجيرانها الثمانية. والأرقام الوطنية الحقيقية تسلك السلوك نفسه للسبب نفسه: فمتوسّط دخل
      الأسرة في الولايات المتّحدة يزيد على الوسيط بنحو الثلث.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: كلّ مقياس يجمع ويقسم حسّاس
      لأكبر القيم في المجموعة، وكلّ مقياس يعدّ المواضع ليس كذلك. فاختيار الكاتب للرقم هو الذي يقرّر
      ما تقوله الجملة، وقد يصف تقريرٌ عقدًا خسرت فيه كلّ أسرة تقريبًا عقدَ دخولٍ صاعدة.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن التفصيل المذكور في النصّ وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن يُحسب أحد التقريرين كاذبًا، مع أنّ النصّ يقول إنّ أيًّا منهما لا يكذب.
      ويقترن المقطع بالمقطع الرابع والتسعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - The choice between mean and median decides the sentence
    - The mean on the street is four hundred and four thousand
    - Government offices publish both figures routinely
    - A report using the mean is lying about incomes
    key: A
    moves:
      B: underreach
      C: true_not_asked
      D: overreach
    why: The text contrasts a mean that describes nobody with a median that does, and says which figure
      a writer chooses therefore decides what the sentence says.
    trap: D calls a report a lie where the text says neither report is lying.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how far above the median is the mean in the United States?
    options:
    - About ten times
    - By about four hundred thousand
    - By something like a third
    - By about one percent
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: imported
    why: The text says mean household income in the United States runs well above the median, by something
      like a third.
    trap: A gives the ratio used of the one rich household on the street.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that one figure can report
      a decade the other denies?
    claim: one figure can report a decade the other denies
    options:
    - «That figure is correct and it describes nobody. Nine of the ten families are nowhere near it»
    - «Any measure that sums and divides is sensitive to the largest values in the set»
    - «Government statistical offices publish both as a matter of routine»
    - «A report that uses the mean can describe a decade in which almost every household lost ground
      as a decade of rising incomes»
    key: D
    moves:
      A: near_miss
      B: near_miss
      C: true_not_asked
    why: The quotation shows the mean describing a decade of rising incomes while almost every household
      lost ground.
    trap: B states the property of the mean without showing the two reports diverging.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Any measure that sums and divides is sensitive to the largest values in the set. Any
      measure that counts positions is not. A single enormous income added to a street would therefore
      ___
    options:
    - move the median and leave the mean alone
    - move the mean and leave the median alone
    - change both figures by the same amount
    - reduce the spread of the distribution
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: imported
    why: The mean sums and divides and so responds to the largest values, while the median counts
      positions and does not.
    trap: A swaps the two measures the text has just distinguished.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «trend» most nearly mean?
    target: trend
    options:
    - direction of change over time
    - a brief fashion
    - a single measurement
    - a line on a chart
    key: A
    moves:
      B: imported
      C: wrong_direction
      D: near_miss
    why: The sentence contrasts two reports that show opposite trends from the same data over a decade,
      so the word names which way the figure moved.
    trap: C makes the word name one reading rather than a movement.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about the middle household?
    options:
    - It reports the income of the tenth household
    - It argues that the mean is always wrong
    - It defines the spread of the distribution
    - It introduces the measure the mean missed
    key: D
    moves:
      A: detail_swap
      B: overreach
      C: detail_swap
    why: The sentence follows the mean that describes nobody and names the median, which lands on
      forty thousand like the eight neighbors.
    trap: B condemns a figure the text calls correct.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 recommends giving both the mean and the median. Based on Text 2, which choice best
      describes what should accompany them?
    sibling: SOC-S04-L2
    sibling_gloss: Text 2 is passage 94 of this book. It adds the standard deviation and the skew
      to the mean and the median, and says the practical rule is to ask for the shape rather than
      the summary, with a mean and a standard deviation as the usual pairing.
    options:
    - A second country for comparison
    - The number of households on the street
    - A measure of the spread, or better a shape
    - The year the figures were collected
    key: C
    moves:
      A: imported
      B: near_miss
      D: imported
    why: Text 2 says the practical rule is to ask for the shape rather than the summary, and that
      a mean with a standard deviation is the usual pairing.
    trap: B adds a count that neither text treats as the missing piece.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: That figure is correct and it describes nobody. ___ nine of the ten families are nowhere
      near it.
    options:
    - By contrast,
    - Indeed,
    - As a result,
    - For example,
    key: B
    moves:
      A: wrong_direction
      C: wrong_direction
      D: near_miss
    why: The second sentence drives home the claim that the figure describes nobody, so the transition
      must mark a confirmation.
    trap: C makes the families follow from the figure being correct.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Nine households on a street each have an income of forty thousand dollars a year ___
      and the tenth household has an income of four million.
    options:
    - year and
    - year; and
    - year and,
    - year, and
    key: D
    moves:
      A: run_on
      B: wrong_mark
      C: misplaced
    why: The clause about the tenth household is independent, so the conjunction joining it to the
      clause about the nine takes a comma.
    trap: A runs the clause about the nine households straight into the clause about the tenth.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain what a reader should ask when only one figure is given. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain what a reader should ask when only one figure is given
    notes:
    - A measure that sums and divides is sensitive to the largest values.
    - A measure that counts positions ignores them.
    - The responsible practice is to give both.
    - The useful questions are which one and why that one was chosen.
    options:
    - The responsible practice is to give both of the figures
    - Ask which measure it is and why that one was chosen, since the two respond to large values differently
    - A measure that counts positions ignores the largest values
    - The useful question is which one of the two it is
    key: B
    moves:
      A: underreach
      C: underreach
      D: restatement
    why: Only this choice puts both questions the notes name and supplies the reason they matter,
      which is the different response to large values.
    trap: D asks the first question without the second or the reason behind it.
- id: SOC-S05-L1
  summary_ar:
    khulasa: بدأت سان فرانسيسكو تجربة في عدّادات الركن سنة ألفين وإحدى عشرة. لم تكن المشكلة قلّة الأماكن
      بل أنّ السائقين كانوا يدورون باحثين عن مكان، فتملأ الشوارع بمرور بطيء، وقد وجدت دراسات أنّ حصّة
      معتبرة من المرور في وسط المدينة سيّارات تطارد مكانًا.
    maana: المعنى أنّ المدينة قرّرت أن تهاجم المطاردة لا أن تبني مزيدًا من المواقف، والوسيلة السعر.
      فزُوّدت العدّادات في الأحياء المختبَرة بمَجَسّات تُبلّغ أمشغول المكان أم لا، ثمّ عُدّلت الأسعار
      مَربَعًا مَربَعًا وساعةً ساعة بهدف ترك مكان واحد خاليًا في كلّ مَربَع.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: حيث كان المَربَع مملوءًا دائمًا
      رُفع السعر خمسًا وعشرين سنتًا في المراجعة التالية، وحيث كان خاليًا كثيرًا نزل. وأبلغت المدينة
      أنّ زمن البحث عن مكان هبط نحو أربعين في المئة، وأنّ متوسّط الأسعار نزل.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن التفصيل المذكور في النصّ وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن تُحسب الخطّة جمعًا للإيراد، مع أنّ متوسّط الأسعار نزل. ويقترن المقطع
      بالمقطع الخامس والتسعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Rates ranged from twenty-five cents to six dollars
    - A moving price cut the hunting that filled the streets
    - The city built more parking to end the circling
    - Los Angeles and Seattle now run similar schemes
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: true_not_asked
    why: The text says the problem was the hunting rather than a shortage, describes the block-by-block
      pricing, and reports that search time fell by about forty percent.
    trap: C builds the parking the city decided against.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, by how much did search time fall?
    options:
    - By twenty-five cents an hour
    - By about one space a block
    - By about six dollars an hour
    - By about forty percent
    key: D
    moves:
      A: detail_swap
      B: detail_swap
      C: imported
    why: The text says the city reported that the time spent searching for a space dropped by about
      forty percent in the test areas.
    trap: A gives the size of a price step rather than the fall in search time.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the scheme was not a
      way of raising money?
    claim: the scheme was not a way of raising money
    options:
    - «Average rates in those areas went down, which surprised people who had expected a revenue grab»
    - «Meters in the test districts were fitted with sensors»
    - «Rates were then adjusted block by block and hour by hour, with a target of leaving about one
      space free on every block»
    - «The main obstacle everywhere has been political rather than technical»
    key: A
    moves:
      B: true_not_asked
      C: near_miss
      D: true_not_asked
    why: The quotation reports that average rates fell in the test areas and that this surprised people
      who had expected a revenue grab.
    trap: C describes the method of adjustment rather than its effect on revenue.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A campaign asking drivers to circle less would have cost less and done nothing. The city
      therefore chose a measure that ___
    options:
    - reduced the number of spaces
    - relied on the goodwill of drivers
    - acted on something a driver notices
    - raised revenue on every block
    key: C
    moves:
      A: wrong_direction
      B: wrong_direction
      D: imported
    why: The text says the policy works by paying attention to the one thing a driver cannot ignore,
      which a campaign of requests does not touch.
    trap: B returns to the appeal the sentence says would have done nothing.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «reward» most nearly mean?
    target: reward
    options:
    - pay a bounty to
    - give an advantage to
    - punish for delay
    - praise in public
    key: B
    moves:
      A: near_miss
      C: wrong_direction
      D: imported
    why: The price is said to reward whoever is willing to walk two blocks, so the word names the
      benefit a cheaper block gives that driver.
    trap: A narrows the benefit to a cash payment the scheme does not make.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence that locates the problem in the
      circling?
    options:
    - It redirects the account from supply to behavior
    - It defines what the sensors reported
    - It reports the year the experiment began
    - It concludes that the scheme failed
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence puts the trouble in the drivers circling rather than in the number of spaces,
      which is what the pricing then addresses.
    trap: D fails a scheme the text reports as working.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 describes a parking charge that changed behavior. Based on Text 2, which choice best
      explains why it worked?
    sibling: SOC-S05-L2
    sibling_gloss: Text 2 is passage 95 of this book. It says an incentive works through salience,
      the availability of a substitute and timing, and calls a parking charge paid at a meter before
      walking away the salient case.
    options:
    - The sum charged was large enough to deter
    - Nobody can substitute for the journey to work
    - A cost arriving in three months changes little
    - The cost is noticed at the moment of choosing
    key: D
    moves:
      A: wrong_direction
      B: wrong_direction
      C: near_miss
    why: Text 2 calls a parking charge paid at a meter before walking away salient and says salience
      is the first of the three properties.
    trap: A rests the effect on the size of the sum, which Text 2 calls the least important.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Where a block was always full, the price went up by twenty-five cents an hour at the
      next review. ___ where a block was often empty, the price came down.
    options:
    - As a result,
    - In other words,
    - By contrast,
    - For example,
    key: C
    moves:
      A: wrong_direction
      B: restatement
      D: near_miss
    why: The second sentence gives the opposite case with the opposite adjustment, so the transition
      must mark a contrast.
    trap: A makes the fall in price follow from the rise.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The method was price ___ and meters in the test districts were fitted with sensors.
    options:
    - price, and
    - price and
    - price; and
    - price and,
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: misplaced
    why: The clause about the meters fitted with sensors is independent, so the conjunction joining
      it to the clause about the method takes a comma.
    trap: B runs the clause about the method straight into the clause about the meters.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain why a price did what a request could not. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain why a price did what a request could not
    notes:
    - Drivers circled looking for a space, which filled the streets.
    - Rates were adjusted block by block toward one free space.
    - Search time fell by about forty percent.
    - A campaign asking drivers to circle less would have done nothing.
    options:
    - Drivers circled looking for a space, which filled the streets
    - A campaign asking drivers to circle less would have done nothing
    - A price tuned block by block cut the searching by about forty percent
    - Rates were adjusted toward one free space on every block
    key: C
    moves:
      A: underreach
      B: restatement
      D: underreach
    why: Only this choice joins the method to the measured fall in searching, which is what the request
      could not deliver.
    trap: B names the failed alternative without the result the price achieved.
- id: SOC-S06-L1
  summary_ar:
    khulasa: تضع الفنادق بطاقات في الحمّامات تطلب من الضيوف استعمال مناشفهم أكثر من مرّة. وسنة ألفين
      وثمانٍ اختبر ثلاثة باحثين، على رأسهم نوا غولدستين، ما ينبغي أن تقوله تلك البطاقات، فأجروا الاختبار
      في فندق حقيقيّ عبر مئات الغرف وعلى شهور.
    maana: المعنى أنّ عاملي الخدمة سجّلوا هل عُلّقت المناشف لإعادة الاستعمال، ولم يعلم الضيوف أنّ
      شيئًا يُقاس، وبذلك كانت الدراسة تجربة ميدانية، أي تجربة تُجرى في موضع حقيقيّ لا في مختبر. وكانت
      صيغة تطلب المساعدة في إنقاذ البيئة.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: صيغة أخرى أوردت واقعة بسيطة
      عن الضيوف الآخرين: أنّ أكثر النازلين يعيدون استعمال مناشفهم، وثالثة سمّت الغرفة نفسها. فارتفعت
      الإعادة نحو الرُّبع بالثانية مقارنةً بالأولى، والتي سمّت الغرفة كانت أفضل.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن يُنسب النجاح إلى النداء البيئيّ، مع أنّه كان الأضعف. ويقترن المقطع بالمقطع
      السادس والتسعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - The hotel saved laundry costs by joining the study
    - Three versions of a card were printed for the rooms
    - A report of what others do beats an appeal to a value
    - The environmental appeal worked best of the three
    key: C
    moves:
      A: true_not_asked
      B: underreach
      D: wrong_direction
    why: The text reports that reuse rose by roughly a quarter with the card naming what other guests
      do, and says such a statement is a stronger lever than an appeal to a value.
    trap: D awards the result to the card the study found weakest.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, which card did best of the three?
    options:
    - The one naming the room itself
    - The usual environmental appeal
    - The one reporting hotel guests generally
    - The one printed on thicker card
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says reuse rose by roughly a quarter with the second card and that the version naming
      the room did better still.
    trap: C names the card that was beaten by the one naming the room.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the guests were not
      reacting to being studied?
    claim: the guests were not reacting to being studied
    options:
    - «Housekeeping staff recorded whether the towels in each room had been hung up for reuse»
    - «The guests did not know that anything was being measured»
    - «The cards were otherwise identical and were assigned to rooms at random»
    - «The hotel saved laundry costs, which is why it agreed to the study»
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: true_not_asked
    why: The quotation says the guests did not know that anything was being measured, which rules
      out a reaction to the study itself.
    trap: C names the safeguard against a difference between cards rather than against awareness.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Nobody in the hotel was arguing about the environment. They were deciding, in about four
      seconds, what a normal guest does with a towel. A card that argued at length would therefore
      ___
    options:
    - be read more carefully than a short one
    - report what other guests had done
    - have cost the hotel less to print
    - miss the moment the decision is made
    key: D
    moves:
      A: wrong_direction
      B: near_miss
      C: imported
    why: The decision is said to take about four seconds and to be about what a normal guest does,
      so an argument arrives too late to bear on it.
    trap: A assumes an attention the four seconds rules out.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «behave» most nearly mean?
    target: behave
    options:
    - show good manners
    - obey an instruction
    - act in a situation
    - manage a household
    key: C
    moves:
      A: near_miss
      B: wrong_direction
      D: imported
    why: People are said to behave partly by reading the room, so the word names what they do in the
      situation rather than any standard of conduct.
    trap: A takes the sense used of a child told to be good.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence saying the finding is modest and
      useful?
    options:
    - It defines a field experiment for a reader
    - It sets the size of the claim before stating it
    - It reports the year the study was published
    - It denies that the cards changed behavior
    key: B
    moves:
      A: detail_swap
      C: detail_swap
      D: wrong_direction
    why: The sentence comes just before the comparison between a statement of what others do and an
      appeal to a value, and limits what that comparison claims.
    trap: D denies an effect the next sentences report.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports that a card naming other guests raised reuse. Based on Text 2, which choice
