  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A positive result on a good test for a rare condition is usually a false alarm. How a
      doctor or an official should respond to one depends entirely on the number that most people
      forget. A screening program designed without that number would therefore ___
    options:
    - catch fewer of the real cases
    - reduce the false positive rate
    - need sixty doctors to assess it
    - treat its alarms as more than they are
