- id: SOC-S07-L1
  summary_ar:
    khulasa: قبل سنة ألف وثمانمئة وخمسين كان أكثر أهل بوسطن يسكنون على مسافة مشي من عملهم، والمدينة
      المبنيّة نحو ميلين عرضًا. فالكاتب الذي يجب أن يكون في بيت حساب عند الثامنة كان يمشي، ولا تكون
      المدينة أوسع من ساعة على القدمين.
    maana: المعنى أنّ الأغنياء والفقراء سكنوا متقاربين، في الشارع نفسه غالبًا، لأنّ أحدًا لم يكن يستطيع
      أن يبذل الوقت ليسكن بعيدًا. ثمّ جاءت العربة العامّة والسكّة البخارية، ومن سنة تسع وثمانين الترام
      الكهربائي الذي يسع أربعين راكبًا ويسير نحو ثمانية أميال في الساعة.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: اشترى البنّاؤون حقولًا على
      الخطوط الجديدة وأقاموا بيوتًا صفوفًا، فامتدّت بوسطن بين سنة سبعين وسنة ألف وتسعمئة من مدينة
      ميلين إلى مدينة عشرة أميال. ومن انتقل حدّدته الأجرة: خمسة سنتات في كلّ اتّجاه.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن النصّين المتقابلين.
      والفخّ المتوقّع هنا أن يُحال الفرز إلى الذوق وحده، مع أنّ النصّ يجعل ثمن السفر هو الحاكم. ويقترن
      المقطع بالمقطع السابع والتسعين.
  questions:
