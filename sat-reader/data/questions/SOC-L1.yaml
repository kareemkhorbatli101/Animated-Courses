- id: SOC-S10-L1
  summary_ar:
    khulasa: 'سنة ألف وتسعمئة وثمانٍ وسبعين عرض ثلاثة باحثين مسألة قصيرة على ستّين طبيبًا وطالب طبّ
      في هارفارد: مرض يصيب شخصًا في الألف، واختبار له لا يفوته حالة قطّ، لكنّه يعطي نتيجة موجبة كاذبة
      في خمسة في المئة من الأصحّاء.'
    maana: المعنى أنّ مريضًا جاءت نتيجته موجبة ولا يُعلم عنه شيء آخر، فسُئل الأطبّاء عن احتمال إصابته.
      فأجاب أكثر الستّين بخمسة وتسعين في المئة، ولم يقترب من الصواب إلّا نحو واحد من ستّة، والجواب
      الصحيح نحو اثنين في المئة.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الظاهرة: الحساب قصير: خُذ ألف شخص فيهم
      مصاب واحد، فيُظهر الاختبار إيجابه، ومن التسعمئة وتسعة وتسعين الأصحّاء يظهر نحو خمسين موجبين،
      فيكون الموجبون أحدًا وخمسين وفيهم مريض واحد، وواحد من أحد وخمسين نحو اثنين في المئة.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب النتيجة الموجبة صحيحة غالبًا، مع أنّ النصّ يقول إنّها إنذار كاذب
      في الأغلب. ويقترن المقطع بالمقطع المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Sixty doctors and students were given the problem in 1978
    - The arithmetic is short enough to do on a napkin
    - The base rate is dropped, and a positive is usually a false alarm
    - A positive result on a good test is usually correct
    key: C
    moves:
      A: underreach
      B: underreach
      D: wrong_direction
    why: The text works the arithmetic to about two percent, names the base rate as the figure that
      gets dropped, and says a positive on a good test for a rare condition is usually a false alarm.
    trap: D reverses the conclusion the arithmetic reaches.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what did most of the sixty answer?
    options:
    - Ninety-five percent
    - About two percent
    - One in a thousand
    - Fifty-one percent
    key: A
    moves:
      B: detail_swap
      C: detail_swap
      D: imported
    why: The text says most of the sixty answered ninety-five percent and that only about one in six
      gave an answer near the right one.
    trap: B gives the correct figure rather than the common answer.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the error lies in the
      starting point rather than the sums?
    claim: the error lies in the starting point rather than the sums
    options:
    - «Of the nine hundred and ninety-nine who do not have it, about fifty also test positive»
    - «What goes wrong is not the arithmetic but the starting point. The five percent figure is vivid
      and the one in a thousand figure is not, so the second gets dropped»
    - «It matters wherever a rare thing is screened for in a large population. That covers cancer
      screening, airport security, drug testing and fraud detection»
    - «Most of the sixty answered ninety-five percent. Only about one in six gave an answer near the
      right one»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: true_not_asked
    why: The quotation says what goes wrong is the starting point rather than the arithmetic, and
      names the vivid figure that crowds out the base rate.
