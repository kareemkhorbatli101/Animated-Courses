    goal: explain what the replications left standing
    notes:
    - Rates have run from near zero to above the original.
    - A British replication in 1980 found almost no conformity.
    - What survives is not a constant but a mechanism.
    - The size depends on who is in the room.
    options:
    - Rates have run from near zero to above the original
    - A British replication in 1980 found almost no conformity
    - What survives is not a constant but a mechanism
    - The pressure is real, and its size is set by the company a person is in
    key: D
