    trap: B sets the reason against the claim it supports.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Tracts are split as they grow ___ and they are merged as they shrink.
    options:
    - grow and
    - grow; and
    - grow, and
    - grow and,
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: misplaced
    why: The clause about tracts being merged is independent, so the conjunction joining it to the
      clause about their splitting takes a comma.
    trap: A runs the clause about the splitting straight into the clause about the merging.
  - slot: 10
    type: synthesis
    difficulty: hard
    stem: The student wants to explain the commonest error in using a census table. Which choice most
      effectively uses relevant information from the notes to accomplish that goal?
    goal: explain the commonest error in using a census table
    notes:
    - The undercount changes the apparent composition of a place.
    - Tracts are split and merged between censuses.
    - Categories have been rewritten repeatedly.
    - The commonest error is to treat the column headings as constant.
    options:
    - Reading the column headings as though they had always meant one thing
    - The undercount changes the apparent composition of a place
    - Tracts are split and merged between one census and the next
    - Categories in a census have been rewritten repeatedly
    key: A
    moves:
      B: underreach
      C: underreach
      D: restatement
