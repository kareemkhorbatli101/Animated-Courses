- id: SOC-S10-L3
  summary_ar:
    khulasa: بُنيت أدبيّات الحكم والقرار من دراسات صغيرة، كثيرًا على الطلّاب، تُحلَّل بعد الواقعة.
      ومن نحو سنة ألفين وإحدى عشرة نظّم علماء نفس في فرجينيا وغيرها محاولات منهجية لإعادة أشهر النتائج،
      ففرزت النتائج المجالَ أقسامًا.
    maana: 'المعنى أنّ إعادات منسّقة كبيرة أكّدت الآثار الجوهرية بمقادير أقلّ: فالتثبيت نجا نجاةً
      قويّة، والتأطير نجا، ونُفور الخسارة نجا وحجمه متنازَع فيه. وعدّة نتائج مُدرَّسة على نطاق واسع
      لم تنجُ البتّة.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الدليل: وعُيّن سببان: الأوّل تحيّز النشر،
      أي ميل النتائج الموجبة إلى النشر وبقاء النتائج الصفرية في الأدراج، وهو ينفخ حجم كلّ أثر في أدبيّة.
      والثاني المرونة في التحليل.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُقرأ الحادثة إسقاطًا للمجال، مع أنّ النصّ يسمّيها قياسًا للمجال أجراه
      المجال نفسه. ويقترن المقطع بالمقطع المئة.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - Systematic replication began around 2011
    - Anchoring and framing both survived replication
    - The strongest effects are real and smaller than advertised
    - The episode showed the field to be worthless
    key: C
    moves:
      A: underreach
      B: underreach
      D: wrong_direction
    why: The text separates the surviving effects from the ones that did not, names the two mechanisms
      and the remedies, and ends on the strongest effects being real and smaller than advertised.
    trap: D discards a field the text says measured itself successfully.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does a registered report add?
    options:
    - Acceptance on the design before any results
    - A plan published before data collection
    - A larger sample of student participants
    - A ban on excluding any outliers
    key: A
    moves:
      B: near_miss
      C: imported
      D: imported
    why: The text says registered reports go further because a journal accepts the study on its design
      before any results exist.
    trap: B gives preregistration, which the registered report goes beyond.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a significant result
      can come from noise without dishonesty?
    claim: a significant result can come from noise without dishonesty
    options:
    - «Large coordinated replications confirmed the core effects with reduced magnitudes»
    - «A researcher who may choose when to stop collecting data, which outliers to exclude, and which
      of several outcomes to report can produce a significant result from noise without any dishonesty»
    - «Published effect sizes in preregistered work are smaller and more stable than in the older
      literature»
    - «publication bias, meaning the tendency for positive results to be published while null results
      stay in drawers»
    key: B
    moves:
      A: true_not_asked
      C: true_not_asked
      D: near_miss
    why: The quotation lists the choices available to a researcher and says they can produce a significant
      result from noise without any dishonesty.
    trap: D names the other mechanism rather than the one the claim describes.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Registered reports go further, since a journal accepts the study on its design before
      any results exist, which removes the incentive to produce a positive finding at all. A null
      result under that arrangement would therefore ___
    options:
    - stay in a drawer unpublished
    - have to be reanalyzed first
    - inflate the apparent effect size
    - be published like any other
    key: D
    moves:
      A: wrong_direction
      B: imported
      C: wrong_direction
    why: Acceptance on the design before any results exist removes the incentive to produce a positive
      finding, so a null result is published on the same terms.
    trap: A leaves the null result where publication bias would have put it.
