    trap: C names one of the three complications without the error they produce.
- id: SOC-S08-L3
  summary_ar:
    khulasa: رفعت نيوجيرسي حدّها الأدنى للأجر في أبريل سنة ألف وتسعمئة واثنتين وتسعين. ورأى ديفيد
      كارد وآلان كروغر في ذلك تجربة طبيعية، لأنّ شرق بنسلفانيا يقع عبر حدّ ولاية ببلدات مشابهة وأسواق
      عمل مشابهة ولا تغيير في حدّها الأدنى.
    maana: المعنى أنّهما مسحا أكثر من أربعمئة مطعم للوجبات السريعة على الجانبين قبل الرفع وبعده بالأسئلة
      نفسها، فلم يجدا هبوطًا في التشغيل في نيوجيرسي نسبةً إلى بنسلفانيا، مع أنّ التوقّع القياسيّ من
      نموذج الكتاب أنّ التشغيل كان ينبغي أن يهبط.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الدليل: كان الردّ فوريًّا وفنّيًّا:
      حصل ديفيد نيومارك ووليام واشر على سجلّات الرواتب، أي أرقام التشغيل من حسابات الشركات الإدارية،
      لعيّنة من المطاعم نفسها، فوجدا أنّ التشغيل هبط. فالفريقان يختلفان في القياس لا في النظرية.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب إحدى الورقتين حاسمة، مع أنّ النصّ يقول إنّ أيًّا منهما لم يحسم.
      ويقترن المقطع بالمقطع الثامن والتسعين.
  questions:
  - slot: 1
    type: central_idea
