    - drawn from one source
    - measured in detail
    - standing for a boundary
    - holding unlike things together
    key: D
    moves:
      A: wrong_direction
      B: imported
      C: imported
    why: The word describes a category that may appear as three separate categories in the next census,
      so it names one label covering unlike cases.
    trap: A gives the opposite of the mixture the sentence describes.
  - slot: 6
    type: structure
    difficulty: hard
    stem: Which choice best describes the function of the sentence about a century-long series?
    options:
    - It defines an undercount for a reader
    - It reports what the conversions allow
    - It names the cost of rewriting a question
    - It argues that the rewriting was unwise
    key: C
    moves:
      A: detail_swap
      B: detail_swap
      D: wrong_direction
    why: The sentence follows the account of categories rewritten repeatedly and says a series apparently
      running for a century is in places a series of different questions.
    trap: D criticizes changes the text says were usually made for good reasons.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 warns that tracts are split as they grow. Based on Text 2, which choice best explains
      why a tract would grow in the first place?
    sibling: SOC-S07-L2
    sibling_gloss: Text 2 is passage 97 of this book. It says bid rent falls as distance from the
      center rises, that the slope is set by the cost of travel, and that cheaper or faster travel
      flattens it and spreads the city outward.
    options:
    - Firms needing many workers cluster together
    - Cheaper travel brings distant land into play
    - Generalized cost adds time and money together
    - Bid rent is highest at the center of a city
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: near_miss
    why: Text 2 says cheaper or faster travel flattens the slope of bid rent and spreads the city,
      bringing more distant land into use.
    trap: D names the shape of the curve rather than what pushes development outward.
  - slot: 8
    type: transitions
    difficulty: medium
    stem: Which choice completes the text with the most logical transition?
    carrier: The net figure for a large modern census is often about one percent, which sounds negligible
