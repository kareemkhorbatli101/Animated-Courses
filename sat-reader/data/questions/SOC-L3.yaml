- id: SOC-S09-L3
  summary_ar:
    khulasa: 'المقياس القياسيّ لعدم المساواة يبدأ برسم: منحنى لورنز، أي رسم للحصّة التراكمية من الدخل
      التي يحوزها الأفقر من حصّة تراكمية من السكّان، يجري من أسفل اليسار إلى أعلى اليمين في مربّع.'
    maana: المعنى أنّ المساواة التامّة ستكون قُطر ذلك المربّع، حيث يحوز العُشر الأفقر عُشر الدخل بالضبط،
      وكلّ توزيع واقعيّ يتهدّل تحته. ومعامل جيني، أي رقم واحد يلخّص بعد التوزيع عن المساواة، هو المساحة
      بين المنحنى والقُطر، مقيسة من الصفر إلى الواحد.
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الدليل: ويُسر الرقم الواحد هو عيبه أيضًا،
      فقيمة جيني نفسها قد تنتج من توزيعات شديدة الاختلاف: فبلد يحوز فيه الواحد في المئة الأعلى كثيرًا
      وبقيّته متشابهة قد يشارك معاملًا بلدًا تمرّ فيه الفجوة في الوسط.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب قيمة جيني الواحدة دالّة على توزيع واحد، مع أنّ النصّ ينفي ذلك.
      ويقترن المقطع بالمقطع التاسع والتسعين.
