- id: SOC-S07-L3
  summary_ar:
    khulasa: إحصاء السكّان على النحو الذي تُجريه الولايات المتّحدة أفضل بيانات اجتماعية موجودة، وليس
      استعماله بسيطًا. وثلاث خصائص تُعقّد كلّ مقارنة. أولاها النقص في العدّ، أي من يفوت الإحصاءَ تسجيلُهم،
      وصافيه في إحصاء حديث كبير نحو واحد في المئة.
    maana: 'المعنى أنّ هذا يبدو مهملًا حتّى يُفصَّل، فالنقص غير موزّع بانتظام: فالشبّان والمستأجرون
      والمهاجرون الجدد والأطفال في بيوت مركّبة يفوتهم التسجيل بأضعاف المعدّل، فيغيّر النقص هيئة المكان
      الظاهرة لا حجمه فقط.'
    ahammiyya: 'في مجال العلوم الاجتماعية هذه المادة في مستوى الدليل: والخصيصة الثانية تغيّر الحدود،
      أي تعديل المناطق التي تُبلَّغ عنها الأرقام: فالأحياء الإحصائية تُشقّ إذا نمت وتُدمَج إذا تقلّصت،
      فقد يقارن جدول حيًّا في إحصاءين وهو يقارن قطعتَي أرض مختلفتين.'
    sila: في اختبار سات يكثر السؤال عن الفكرة الرئيسة وعن الدليل الذي يسند دعوى وعن معنى كلمة في سياقها.
      والفخّ المتوقّع هنا أن تُحسب البيانات غير قابلة للاستعمال، مع أنّ النصّ يسمّيها أفضل ما يوجد.
      ويقترن المقطع بالمقطع السابع والتسعين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: medium
    stem: Which choice best states the main idea of the text?
    options:
    - The net undercount is often about one percent
    - Agencies publish conversion tables for the boundaries
    - The census data are unusable for comparison
    - Three features make a comparison a piece of work
    key: D
    moves:
      A: underreach
      B: underreach
      C: wrong_direction
    why: The text names the undercount, the boundary change and the changing questions, then says
      a comparison across decades is a piece of work rather than a lookup.
    trap: C discards data the text calls the best that exists.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, who is missed at several times the average rate?
    options:
    - Households in merged tracts
    - Young men, renters and recent migrants
    - People in the same tract for a century
    - Those answering a rewritten category
    key: B
    moves:
      A: detail_swap
      C: imported
      D: detail_swap
    why: The text says young men, renters, recent migrants and children in complex households are
      missed at several times the average rate.
    trap: D names the third complication rather than the people the undercount misses.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that a small undercount can
      still distort a picture?
    claim: a small undercount can still distort a picture
    options:
    - «Statistical agencies publish conversion tables for this purpose»
    - «Tracts are split as they grow and merged as they shrink»
    - «the undercount changes the apparent composition of a place and not merely its size»
    - «A heterogeneous category in one year may appear as three separate categories in the next»
    key: C
    moves:
      A: true_not_asked
      B: true_not_asked
      D: near_miss
    why: The quotation says the undercount changes the apparent composition of a place and not merely
      its size, which is the distortion the claim names.
    trap: D gives the third complication rather than the effect of the undercount.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: A table that compares a neighborhood in two censuses may therefore be comparing two different
      pieces of ground. A researcher who used the two tables without a conversion would therefore
      ___
    options:
    - be measuring a change in the boundary
    - have corrected for the undercount
    - find the questions unchanged between them
    - need a heterogeneous category instead
    key: A
    moves:
      B: near_miss
      C: wrong_direction
      D: imported
    why: The two tables may cover different ground, so a difference between them can come from the
      boundary rather than from the neighborhood.
    trap: C assumes a constancy the third complication denies.
  - slot: 5
    type: words_in_context
    difficulty: medium
    stem: As used in the text, what does the word «heterogeneous» most nearly mean?
    target: heterogeneous
