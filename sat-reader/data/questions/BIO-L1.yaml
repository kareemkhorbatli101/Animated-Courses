# Biology and Earth Science level 1 - ten SAT-style questions and an Arabic summary per passage.
# Written by tools/qemit.py; checked by tools/qchecks.py.
field: BIO
level: 1
sets:
- id: BIO-S01-L1
  summary_ar:
    khulasa: تستريح فراشة الفلفل على لحاء الشجر نهارًا وأجنحتها مفتوحة، ومعظمها رمادي فاتح بنقاط داكنة
      صغيرة. وسجّل جامع قرب مانشستر فراشة تكاد تكون سوداء عام ألف وثمانمئة وثمانية وأربعين. وبعد خمسين
      سنة صار الشكل الأسود أكثر من تسع من كلّ عشر فراشات تُصاد في تلك المدينة، ولم يتغيّر شيء ظاهر
      في الفراشات بل تغيّر اللحاء.
    maana: المعنى أنّ دخان الفحم قتل الأشنات الفاتحة وترك الجذوع سوداء بالسُخام. فعلى جذع نظيف تكاد
      الفراشة الفاتحة تكون غير مرئية والسوداء بارزة، وعلى جذع مُسخَّم العكس صحيح، والطيور تصطاد بالبصر
      فتأخذ الشكل الذي تراه. ثم انعكس الاتّجاه بعد قانون الهواء النقي عام ألف وتسعمئة وستّة وخمسين.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: واقعة مؤرّخة بأرقامها قبل
      الانتقال إلى آلية الانتقاء الطبيعي وإلى الدليل وإلى الخلاف. ويمكن قراءة القصّة كلّها من سلسلة
      عدّات عادية أُجريت بمصيدة ضوء ودفتر.'
    sila: 'في اختبار سات تتكرّر تقارير العلوم: سؤال ومنهج ونتيجة. والفخّ الشائع أن يُفترض أنّ الفراشات
      نفسها تغيّرت، مع أنّ النصّ يقول إنّ ما تغيّر هو الخلفية التي تستريح عليها. ويقترن المقطع بالمقطع
      الحادي والستّين في أسئلة النصّين المتقابلين.'
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Collectors had been keeping light trap records since the 1830s
    - A moth population shifted toward the dark form and back again as its background changed
    - The moths themselves changed in a way that made them harder to see
    - Counts in rural Dorset stayed overwhelmingly pale through the same years
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: true_not_asked
    why: The text tracks the dark form rising to nine in ten and falling below five percent, and says
      what changed was the bark rather than the moths.
    trap: C states the reading the text corrects in its fifth sentence.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, how do birds find these moths?
    options:
    - By the warmth of the trunk they rest on
    - By the smell of the lichens that grow there
    - By following them in flight at night
    - By sight, taking whichever form stands out
    key: D
    moves:
      A: imported
      B: imported
      C: near_miss
    why: The text says birds hunt these moths by sight and take whichever form they can see against
      the bark.
    trap: C moves the hunting to the air at night, where the text places the moths at rest by day.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the reversal makes the
      case stronger than a single change would?
    claim: the reversal makes the case stronger than a single change would
    options:
    - «The same reversal happened near Detroit, which gives two records rather than one»
    - «A collector near Manchester recorded a nearly black one in 1848»
    - «Coal smoke had killed the pale lichens, which are the crusty growths that cover healthy bark»
    - «Collectors had been keeping such records since the 1830s, for reasons of their own»
    key: A
    moves:
      B: underreach
      C: near_miss
      D: true_not_asked
    why: The clause says a second city supplies a second record, which is what makes the pattern more
      than one observation.
    trap: D explains where the records came from rather than why two of them matter.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Britain passed a clean air law in 1956, coal smoke fell away over the next thirty years,
      the lichens came back, and the black moths became rare again. The direction of change therefore
      ___
    options:
    - was fixed once the first dark moth appeared
    - has never been measured outside Manchester
    - depended on the trunks rather than on the moths
    - reversed only after the lichens had died
    key: C
    moves:
      A: wrong_direction
      B: detail_swap
      D: wrong_direction
    why: The dark form rose when the bark blackened and fell when the lichens returned, so the background
      was what set the direction.
    trap: A treats the first sighting as a turning point rather than as a curiosity.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «adapted» most nearly mean?
    target: adapted
    options:
    - altered for a new use
    - come to fit its surroundings
    - changed its own appearance
    - moved to a different place
    key: B
    moves:
      A: near_miss
      C: wrong_direction
      D: imported
    why: The population had come to match one kind of background and swung back when the background
      changed, which is fitting the surroundings.
    trap: C has an individual moth change color, which the text rules out.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about rural Dorset?
    options:
    - It supplies a place where the cause was absent and the effect did not appear
    - It explains why collectors kept records from the 1830s onward
    - It reports the proportion of dark moths around Manchester
    - It introduces the clean air law passed in 1956
    key: A
    moves:
      B: imported
      C: detail_swap
      D: near_miss
    why: Dorset had clean air and stayed pale, which is a comparison that strengthens the claim about
      soot.
    trap: C names a figure from the city rather than the work the Dorset sentence does.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports fifty years of change in a moth population. Based on Text 2, which condition
      does that half century supply?
    sibling: BIO-S01-L2
    sibling_gloss: 'Text 2 is passage 61 of this book. It argues that natural selection follows whenever
      four conditions hold at once: variation, heredity, differences in offspring left, and time counted
      in generations.'
    options:
    - Variation, since two forms of the moth existed
    - Heredity, since dark moths bred dark offspring
    - Differential survival, since birds hunted by sight
    - Time, since the generation is one year long
    key: D
    moves:
      A: near_miss
      B: underreach
      C: detail_swap
    why: Text 2 counts time in generations, and the moth generation is one year, so fifty years is
      fifty rounds of selection.
    trap: C names a condition the text supplies elsewhere rather than the one the half century provides.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: On a clean trunk a pale moth is almost invisible and a black one stands out. ___ on a
      sooty trunk the reverse is true.
    options:
    - Therefore,
    - For instance,
    - By contrast,
    - In other words,
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: restatement
    why: The two sentences describe opposite cases, so the second stands against the first rather
      than following from it.
    trap: A makes the sooty case a consequence of the clean one.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Coal smoke had killed the pale lichens ___ the crusty growths that cover healthy bark.
    options:
    - lichens, which are
    - lichens which are
    - lichens; which are
    - 'lichens: which are'
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: wrong_mark
    why: The clause describing the lichens adds information rather than restricting it, so a comma
      attaches it to the noun.
    trap: B omits the comma a supplementary clause needs.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain to a reader why the moths are a good test case. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain to a reader why the moths are a good test case
    notes:
    - The dark form rose to more than nine in ten in Manchester.
    - Counts in rural Dorset stayed overwhelmingly pale.
    - The dark form fell below five percent by the 1990s.
    - The same reversal happened near Detroit.
    options:
    - The dark form rose to more than nine in ten of the moths in Manchester
    - Counts in rural Dorset stayed overwhelmingly pale across the same years
    - The change ran up and then down in two cities while a clean-air area never moved at all
    - The dark form had fallen below five percent again by the 1990s
    key: C
    moves:
      A: underreach
      B: true_not_asked
      D: restatement
    why: Only this choice brings the rise, the fall, the second city and the control area together,
      which is what makes the case a test.
    trap: A gives the rise alone, which any number of explanations would fit.
- id: BIO-S02-L1
  summary_ar:
    khulasa: 'كان غريغور مندل راهبًا ومعلّم علوم في برنو، وبين عامي ألف وثمانمئة وستّة وخمسين وثلاثة
      وستّين زرع البازلاء في حديقة الدير وعدّها. واختار سبع صفات تأتي بشكلين واضحين لا ثالث بينهما:
      بذور مستديرة أو مجعّدة، وقرون خضراء أو صفراء، ونباتات طويلة أو قصيرة. وعلى سبع سنوات زرع وعدّ
      نحو ثمانية وعشرين ألف نبتة بيده.'
    maana: 'المعنى أنّ منهجه كان بسيطًا ودقيقًا. بدأ بسطور تُورّث بأمانة، ثم هجّن سطرًا طويلًا بقصير،
      فكان كلّ نبات الجيل الأول طويلًا، ومع ذلك لم يُخفَّف الشكل القصير ولم يُفقد. وحين تُرك ذلك الجيل
      يتناسل عادت النباتات القصيرة بنسبة ثابتة: لكلّ ثلاث طويلة نحو قصيرة واحدة.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: ما وُجد بالعدّ قبل تفسيره.
      وقد نُشر العمل عام ألف وثمانمئة وستّة وستّين في مجلّة جمعية محلّية ولم يقرأه أحد تقريبًا، وبقي
      ثلاثًا وثلاثين سنة بلا استعمال.'
    sila: في اختبار سات يُسأل عن منهج التجربة وعن التفصيل. والفخّ الشائع أن يُفترض أنّ الشكل القصير
      اختفى في الجيل الأول، مع أنّ النصّ يقول إنّه لم يُخفَّف ولم يُفقد. ويقترن المقطع بالمقطع الثاني
      والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Mendel became an abbot and did no more breeding work
    - Peas pollinate themselves unless a breeder interferes
    - Careful counting of seven simple features produced a steady three to one ratio
    - Three researchers in 1900 found the same ratios independently
    key: C
    moves:
      A: underreach
      B: true_not_asked
      D: near_miss
    why: The text describes the choice of features, the method and the counts, and ends on the ratio
      that came out of all seven.
    trap: D reports what happened to the work later rather than what the work found.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what happened in the first generation of the cross?
    options:
    - Every plant was tall, and the short form was still present
    - The plants were of middling height between the two parents
    - Three quarters were tall and one quarter short
    - The short form was diluted and eventually lost
    key: A
    moves:
      B: wrong_direction
      C: detail_swap
      D: wrong_direction
    why: The text says every plant in the first generation was tall and that the short form had not
      been diluted or lost.
    trap: C gives the proportions of the second generation rather than the first.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the choice of plant
      was part of the quality of the method?
    claim: the choice of plant was part of the quality of the method
    options:
    - «Over seven years he grew and counted something near twenty-eight thousand plants»
    - «Peas pollinate themselves unless a breeder interferes, so every cross was controlled»
    - «Mendel published the work in 1866 in the journal of a local natural history society»
    - «He chose seven features that came in two clear forms and nothing in between»
    key: B
    moves:
      A: near_miss
      C: true_not_asked
      D: near_miss
    why: Self-pollination is a property of the plant, and the text says it is what made every cross
      controlled.
    trap: D names the choice of features, which is a different decision from the choice of organism.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: He began with lines that bred true, meaning that tall plants from those lines always
      gave tall offspring. Starting from such lines therefore ___
    options:
    - guaranteed that the first generation would be mixed
    - made the second generation unnecessary to count
    - required that the plants be crossed by hand
    - removed any doubt about what each parent carried
    key: D
    moves:
      A: wrong_direction
      B: overreach
      C: near_miss
    why: A line that always gives the same offspring tells the breeder exactly what went into the
      cross, which is why true-breeding lines were the starting point.
    trap: C names something the text says the plant does for itself.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «depends» most nearly mean?
    target: depends
    options:
    - hangs down from
    - relies on for support
    - is determined by
    - waits upon a decision
    key: C
    moves:
      A: imported
      B: near_miss
      D: wrong_direction
    why: What an inherited feature looks like in the next generation is settled by rules of this kind,
      so the word names determination.
    trap: B softens the sense to reliance, which is weaker than the rule the sentence describes.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about the paper sitting unused?
    options:
    - It explains why Mendel chose peas rather than another plant
    - It marks the gap between the discovery and its reception
    - It reports the size of the plot he worked in
    - It introduces the seven features he had selected
    key: B
    moves:
      A: imported
      C: detail_swap
      D: wrong_direction
    why: The sentence stands between the publication and the rediscovery of 1900, and measures the
      thirty-four years between them.
    trap: D names material that comes much earlier in the text.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says the short form was not lost in the first generation. Based on Text 2, why was
      it still there?
    sibling: BIO-S02-L2
    sibling_gloss: 'Text 2 is passage 62 of this book. It derives the three to one ratio from three
      facts: that a plant carries two copies of each gene, that the copies may be different versions,
      and that each sex cell receives one of them at random.'
    options:
    - Because each first-generation plant carried one copy of each
    - Because the plants were allowed to pollinate themselves
    - Because the second generation had not yet been grown
    - Because the tall line had bred true for several years
    key: A
    moves:
      B: detail_swap
      C: wrong_direction
      D: near_miss
    why: Text 2 says every plant in the first generation carries one allele of each, and that the
      short one shows only when no tall one is present.
    trap: B names a feature of the method rather than the reason the allele survived.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Mendel published the work in 1866 in the journal of a local natural history society.
      ___ almost nobody read it.
    options:
    - For instance,
    - Even so,
    - In other words,
    - Unsurprisingly,
    key: D
    moves:
      A: near_miss
      B: wrong_direction
      C: restatement
    why: A paper in the journal of a local society would be expected to go unread, so the second sentence
      follows naturally from the first.
    trap: B sets the neglect against the publication as though it were a surprise.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: He sent copies to well-known scientists and received little in reply ___ became an abbot,
      and did no more breeding work.
    options:
    - reply; he
    - reply,
    - reply, he
    - reply he
    key: B
    moves:
      A: wrong_mark
      C: comma_splice
      D: run_on
    why: Three things Mendel did are listed with one subject, so the middle item takes a comma and
      no new pronoun.
    trap: C supplies a new subject and joins it with a comma, which splices the sentence.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain why the ratio could be trusted. Which choice most effectively
      uses relevant information from the notes to accomplish that goal?
    goal: explain why the ratio could be trusted
    notes:
    - He chose seven features with two clear forms and nothing in between.
    - He began with lines that bred true.
    - He counted near twenty-eight thousand plants over seven years.
    - Peas pollinate themselves unless a breeder interferes.
    options:
    - He chose seven features that came in two clear forms and nothing between
    - He began his work with pea lines that had bred true for years
    - Peas pollinate themselves unless a breeder interferes with them
    - Clear-cut features, true-breeding parents, controlled crosses and twenty-eight thousand plants
      together leave little room for accident
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice assembles the four safeguards, which together are the reason the figure
      can be relied on.
    trap: C names one safeguard and so accounts for only part of the reliability.
- id: BIO-S03-L1
  summary_ar:
    khulasa: 'ملعقة من الخميرة الجافّة تحمل مليارات الخلايا، كلّ واحدة خلية مستديرة واحدة بقطر نحو
      خمسة من ألف من الملّيمتر. وإذا حُرّكت في ماء دافئ مع قليل سكّر بدأ المسحوق يرغو في عشر دقائق،
      والرغوة غاز. فالخلايا تأخذ السكّر وتعيد شيئين: ثاني أكسيد الكربون والكحول، والخبّاز والمخمّر
      يريد كلّ منهما نصفًا مختلفًا من العملية نفسها.'
    maana: المعنى أنّ الخميرة تعمل مع الهواء وبدونه. فمع توفّر الأكسجين تحرق السكّر حتى النهاية وتحصل
      على طاقة أكبر بكثير من كلّ جزيء، وبدون أكسجين تأخذ طريقًا مختصرًا يُسمّى التخمّر وعليها أن تُطلق
      الكحول نفايةً لأنّ الكيمياء تتوقّف في منتصف الطريق، فيكون المردود أقلّ من عُشر.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: ما تفعله الخلية فعلًا قبل
      الانتقال إلى حساب الطاقة وإلى كيف عُرف ذلك وإلى الخلاف. وللخلية لا خيار في الأمر، فالكيمياء
      المتاحة لها يحدّدها ما هو مُذاب في السائل حولها.'
    sila: في اختبار سات تتكرّر تقارير العلوم القصيرة ويُسأل عن التفصيل والاستنتاج. والفخّ الشائع أن
      يُفترض أنّ الخميرة تختار طريقها، مع أنّ النصّ يقول إنّ السائل حولها هو الذي يحدّده. ويقترن المقطع
      بالمقطع الثالث والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Pasteur measured sugar and yeast in the 1860s to show the difference
    - A brewer keeps air out and holds the temperature near twenty degrees
    - The same organism has been used for bread and beer for five thousand years
    - One organism gives out gas and alcohol, and what it yields depends on the air available
    key: D
    moves:
      A: underreach
      B: true_not_asked
      C: near_miss
    why: The text sets out the two products, says a baker and a brewer want different halves of one
      process, and then makes the yield turn on oxygen.
    trap: C reports the long history rather than what the cell is doing.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what does the foam in the warm water consist of?
    options:
    - Alcohol rising to the surface
    - Carbon dioxide given off by the cells
    - Sugar that has not yet dissolved
    - Dried yeast cells floating upward
    key: B
    moves:
      A: detail_swap
      C: imported
      D: near_miss
    why: The text says the foam is gas and that the cells give back carbon dioxide and alcohol.
    trap: A names the other product of the process, which stays in the liquid.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the cell does not choose
      which path it takes?
    claim: the cell does not choose which path it takes
    options:
    - «Each bubble of carbon dioxide pushes the stretchy dough outward»
    - «a loaf left in a warm kitchen roughly doubles in ninety minutes»
    - «The chemistry available to it is decided by what is dissolved in the liquid around it»
    - «Louis Pasteur showed this difference in the 1860s by measuring how much sugar disappeared»
    key: C
    moves:
      A: near_miss
      B: underreach
      D: true_not_asked
    why: The sentence puts the decision in the surrounding liquid rather than in the cell, which is
      what the claim asserts.
    trap: D names the experiment that measured the difference rather than the absence of choice.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The short cut yields less than a tenth as much energy, which is why yeast grows slowly
      in a sealed vessel and quickly in an open one. A brewer who keeps air out therefore ___
    options:
    - accepts slow growth in order to get alcohol
    - raises the energy each cell takes from the sugar
    - prevents the yeast from producing any gas at all
    - makes the dough rise faster than it would in air
    key: A
    moves:
      B: wrong_direction
      C: overreach
      D: detail_swap
    why: Without air the yield falls and the cell must release alcohol, so excluding air trades growth
      for the product the brewer wants.
    trap: B reverses the arithmetic, since the sealed vessel yields less rather than more.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «release» most nearly mean?
    target: release
    options:
    - set free from a duty
    - make available to buyers
    - loosen a tight grip
    - give out as waste
    key: D
    moves:
      A: imported
      B: imported
      C: near_miss
    why: The cell must get rid of alcohol because the chemistry stops halfway, so the word names the
      discharge of a by-product.
    trap: C hears the physical sense of letting go rather than of giving off.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the second paragraph of the text?
    options:
    - It explains why the short cut yields less energy than the full path
    - It reports the diameter of a single dried yeast cell
    - It shows one process serving two different purposes
    - It introduces the experiments carried out by Pasteur
    key: C
    moves:
      A: near_miss
      B: detail_swap
      D: wrong_direction
    why: The paragraph takes the gas for the baker and the alcohol for the brewer, which is one process
      put to two uses.
    trap: A names the content of the third paragraph rather than the second.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says the short cut yields less than a tenth as much energy. Based on Text 2, what
      are the two figures behind that fraction?
    sibling: BIO-S03-L2
    sibling_gloss: Text 2 is passage 63 of this book. It explains that a cell converts sugar into
      a molecule called ATP, that the first stage nets two units with or without oxygen, and that
      the oxygen path yields something near thirty.
    options:
    - Five thousand years against ninety minutes
    - Two units without oxygen against about thirty with it
    - Twenty degrees against the temperature of an oven
    - Several billion cells against a single teaspoon
    key: B
    moves:
      A: imported
      C: detail_swap
      D: detail_swap
    why: Text 2 gives two units for the first stage and about thirty for the complete path, which
      is the ratio Text 1 states as a fraction.
    trap: C offers two temperatures from the texts in place of the two energy yields.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: In beer and wine the alcohol is the point and the gas is allowed to escape. ___ in bread
      the gas does the work and the alcohol boils off in the oven.
    options:
    - By contrast,
    - In other words,
    - For instance,
    - Accordingly,
    key: A
    moves:
      B: restatement
      C: near_miss
      D: wrong_direction
    why: The two sentences describe opposite uses of the same products, so the second stands against
      the first.
    trap: D makes the baking case follow from the brewing case.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Without oxygen it takes a short cut ___ called fermentation ___ and must release alcohol
      as a waste product.
    options:
    - cut called fermentation
    - cut; called fermentation;
    - cut, called fermentation,
    - cut, called fermentation
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: unpaired
    why: The naming phrase interrupts the sentence, so it needs a comma at each end rather than one
      comma or none.
    trap: D opens the interrupting phrase with a comma and then fails to close it.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain to a reader why a baker and a brewer treat the same organism
      differently. Which choice most effectively uses relevant information from the notes to accomplish
      that goal?
    goal: explain to a reader why a baker and a brewer treat the same organism differently
    notes:
    - The cells give back carbon dioxide and alcohol.
    - In bread the gas does the work and the alcohol boils off in the oven.
    - In beer and wine the alcohol is the point and the gas is allowed to escape.
    - The chemistry available is decided by what is dissolved around the cell.
    options:
    - One process yields two products, and each trade keeps the one it needs and lets the other go
    - The cells of the yeast give back carbon dioxide and also alcohol
    - In bread the gas does the work and the alcohol boils off in the oven
    - The chemistry available to a cell is decided by the liquid around it
    key: A
    moves:
      B: underreach
      C: restatement
      D: true_not_asked
    why: Only this choice states the principle that covers both trades rather than describing one
      of them.
    trap: C gives the baking half and leaves the brewing half unexplained.
- id: BIO-S04-L1
  summary_ar:
    khulasa: أُبيدت الذئاب من حديقة يلوستون بالرمي حتى عشرينيات القرن العشرين، وقُتل آخر زوج معروف
      عام ألف وتسعمئة وستّة وعشرين. وعلى مدى السبعين سنة التالية لم يكن في الحديقة ذئاب، وعاش الوَعل
      بأعداد كبيرة في قيعان الوديان، وأُكلت أشجار الصفصاف والحور الصغير حتى الجذوع كلّ سنة، وكاد القندس
      يختفي من شمال الحديقة.
    maana: 'المعنى أنّ خدمة الحديقة أعادت في عامي خمسة وتسعين وستّة وتسعين أحدًا وثلاثين ذئبًا من
      كندا، فتكاثرت سريعًا وصارت أكثر من مئة في عشر سنوات، وهبطت أعداد الوَعل في المدى الشمالي بأكثر
      من النصف. ثم تغيّرت النباتات: نما الصفصاف إلى مترين أو ثلاثة، ونجت بادرات الحور، وارتفعت مستعمرات
      القندس من واحدة إلى تسع.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: ما تغيّر بالقياس، لا سببه.
      والمتنازع عليه ليس التغيّر بل سببه، وذلك الجدل يُتناول لاحقًا في هذا الخطّ، وتحتفظ الحديقة بعدّات
      سنوية منذ الإعادة.'
    sila: في اختبار سات يُسأل عن التفصيل وعن حدود ما يثبته النصّ. والفخّ الشائع أن يُقرأ تعاقب الأحداث
      إثباتًا للسببية، مع أنّ النصّ يقول صراحةً إنّ السبب متنازع عليه. ويقترن المقطع بالمقطع الرابع
      والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Wolves came back, elk fell, and the streamside plants recovered, though the cause is disputed
    - The last known pair of wolves in the park was killed in 1926
    - Beaver colonies on the northern range rose from one to nine by 2015
    - The wolves brought from Canada were held in pens for ten weeks
    key: A
    moves:
      B: underreach
      C: true_not_asked
      D: detail_swap
    why: The text runs from the removal of the wolves through the release to the change in the plants,
      and says plainly that the cause is what is in dispute.
    trap: C gives one of the measured changes rather than the shape of the account.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what happened to elk numbers after the release?
    options:
    - They rose as the willows grew taller along the creeks
    - They stayed steady while the elk moved more often
    - They fell by more than half on the northern range
    - They were not counted until the photographs of 2015
    key: C
    moves:
      A: wrong_direction
      B: near_miss
      D: imported
    why: The text says elk numbers on the northern range had fallen by more than half within ten years
      of the release.
    trap: B keeps the movement of the elk and drops the fall in their numbers.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the text separates what
      is established from what is argued?
    claim: the text separates what is established from what is argued
    options:
    - «The animals were held in pens for ten weeks first, then let out»
    - «Cottonwood seedlings survived their first years for the first time in living memory»
    - «Beaver colonies on the northern range rose from one in the early 1990s to nine by 2015»
    - «What is in dispute is not the change but its cause»
    key: D
    moves:
      A: true_not_asked
      B: underreach
      C: near_miss
    why: The sentence draws the line itself, placing the change on one side and the cause on the other.
    trap: C gives one measured change rather than the distinction the claim concerns.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Part of that was hunting by wolves, and part was that the elk now moved more and spent
      less time standing in open valleys. The fall in elk numbers therefore ___
    options:
    - was caused entirely by the wolves killing elk
    - had more than one route running through it
    - cannot be measured from the annual counts
    - began before the wolves were released
    key: B
    moves:
      A: overreach
      C: wrong_direction
      D: detail_swap
    why: The text names both direct hunting and changed behavior, so the decline has two contributing
      paths.
    trap: A assigns the whole fall to hunting, where the text names a second route as well.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «recovered» most nearly mean?
    target: recovered
    options:
    - returned to former numbers
    - got back something lost
    - regained consciousness slowly
    - were collected for study
    key: A
    moves:
      B: near_miss
      C: imported
      D: imported
    why: The songbirds that nest in streamside bushes increased along with the willows, so the word
      names a return in numbers.
    trap: B gives the sense of retrieving a lost object rather than of a population rising.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about the park service photographs?
    options:
    - It introduces the counts of wolves, elk and beaver
    - It explains why the wolves were held in pens at first
    - It reports which creeks the willow measurements cover
    - It offers a form of evidence for the change just described
    key: D
    moves:
      A: near_miss
      B: imported
      C: detail_swap
    why: The photographs of the same stretches in 1996 and 2015 are produced to show that the difference
      is not subtle.
    trap: C names the measurements described in the last sentence rather than the photographs.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports that few wolves changed a great deal of willow. Based on Text 2, what makes
      that possible?
    sibling: BIO-S04-L2
    sibling_gloss: Text 2 is passage 64 of this book. It explains that energy is lost at every transfer
      in a food web, that biomass falls by roughly a factor of ten at each step, and that a small
      number of wolves can affect a large quantity of plant.
    options:
    - Four or five steps is the practical limit for a food chain
    - Cold-blooded animals do better than warm-blooded ones
    - Each wolf stands for a great deal of elk and of plant tissue
    - Transfer efficiencies range from one percent to over thirty
    key: C
    moves:
      A: near_miss
      B: imported
      D: detail_swap
    why: Text 2 says leverage runs downward through the chain because each predator represents a large
      quantity of what it eats.
    trap: D quotes a range from Text 2 rather than the mechanism of leverage.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Willows along some creeks that had been browsed flat for decades grew to two or three
      meters. ___ cottonwood seedlings survived their first years for the first time in living memory.
    options:
    - Nevertheless,
    - Likewise,
    - In other words,
    - Therefore,
    key: B
    moves:
      A: wrong_direction
      C: restatement
      D: wrong_direction
    why: The second sentence reports a second plant changing in the same direction, so it runs parallel
      to the first.
    trap: A sets the cottonwoods against the willows rather than beside them.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: The park keeps counts of wolves, elk and beaver every year ___ has done so since the
      release.
    options:
    - year; and
    - year, it
    - year and
    - year, and
    key: D
    moves:
      A: wrong_mark
      B: comma_splice
      C: run_on
    why: The keeping of the counts and the length of the record are each a full clause, so the conjunction
      between them takes a comma.
    trap: B drops the conjunction and leaves a comma between two clauses.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to describe the change for a reader without claiming to explain it. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: describe the change for a reader without claiming to explain it
    notes:
    - Thirty-one wolves were released in 1995 and 1996.
    - Elk numbers on the northern range fell by more than half.
    - Willows grew to two or three meters and beaver colonies rose to nine.
    - What is in dispute is not the change but its cause.
    options:
    - Thirty-one wolves were released into the park in 1995 and in 1996
    - After the release the elk fell by half and the willows and beaver rose, though what caused it
      is still argued
    - Elk numbers on the northern range of the park fell by more than half
    - What is in dispute about Yellowstone is not the change but its cause
    key: B
    moves:
      A: underreach
      C: underreach
      D: restatement
    why: Only this choice reports the measured changes and withholds the causal claim, which is exactly
      what the goal asks for.
    trap: D states the caution without describing the change it applies to.
- id: BIO-S05-L1
  summary_ar:
    khulasa: تقع جزيرة سنت ماثيو في بحر بيرنغ على نحو مئتي ميل من أقرب أرض أخرى، وطولها اثنان وثلاثون
      ميلًا، بلا أشجار، مغطّاة بالطحالب والعشب المنخفض والأشنة التي يأكلها الرنّة. ولا يسكنها أحد.
      وفي عام ألف وتسعمئة وأربعة وأربعين أنزل خفر السواحل تسعة وعشرين رنّة مخزونًا طارئًا للحم لتسعة
      عشر رجلًا، ثم انتهت الحرب وأُغلقت المحطّة ورحل الرجال وبقيت الرنّة.
    maana: المعنى أنّها لم يكن لها مفترسات من أي نوع، وكانت الأشنة قد نمت دون إزعاج آلاف السنين. فعُدّ
      القطيع عام سبعة وخمسين فكان نحو ألف وثلاثمئة، وعُدّ عام ثلاثة وستّين فكان ستّة آلاف. وفي عام
      ستّة وستّين بقي اثنان وأربعون، منها إحدى وأربعون أنثى وذكر واحد ولا صغار لتلك السنة.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: أرقام عُدّت على الأرض. وكانت
      الحقيقة المهمّة تحت الثلج: الأشنة اختفت مرعيّةً حتى الصخر، والأشنة تنمو من جديد بمعدّل يُقاس
      بالعقود لا بالسنوات، فأكل القطيع مستقبله.'
    sila: في اختبار سات يُسأل عن التفصيل وعن الاستنتاج من سلسلة أرقام. والفخّ الشائع أن يُنسب الانهيار
      إلى شدّة الشتاء وحدها، مع أنّ النصّ يضع السبب المهمّ تحت الثلج. ويقترن المقطع بالمقطع الخامس
      والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - The island is thirty-two miles long and nobody lives on it
    - A herd without predators grew enormously and then collapsed when its food was gone
    - A severe winter with deep snow killed almost all the reindeer
    - By the 1980s there were no reindeer on the island at all
    key: B
    moves:
      A: underreach
      C: wrong_direction
      D: near_miss
    why: The text traces twenty-nine animals to six thousand and then to forty-two, and puts the cause
      in the lichen that had been grazed away.
    trap: C names the winter, which the text says mattered less than what lay under the snow.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what was found in the count of 1963?
    options:
    - About thirteen hundred animals in good condition
    - Twenty-nine animals newly put ashore
    - Forty-two animals, almost all of them female
    - Six thousand animals on an island of fixed size
    key: D
    moves:
      A: detail_swap
      B: near_miss
      C: underreach
    why: The text says he counted again in 1963 and found six thousand, which is roughly two hundred
      times the number put ashore.
    trap: A gives the figure from the count six years earlier.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the collapse came from
      damage the herd had done to its own food supply?
    claim: the collapse was caused by damage the herd had done to its own food supply
    options:
    - «The lichen was gone, grazed down to bare rock and soil across most of the island, and lichen
      grows back at a rate measured in decades»
    - «The winter of 1963 had been severe, with deep snow, but the important fact was underneath the
      snow»
    - «They had no predators of any kind. No wolves, no bears, no hunters. The lichen on the island
      had been growing undisturbed»
    - «every number in it comes from counts made on the ground. A population can survive on borrowed
      capital for a while»
    key: A
    moves:
      B: near_miss
      C: underreach
      D: true_not_asked
    why: The quotation names the grazing, the bare ground and the slow regrowth, which together are
      self-inflicted damage to the food supply.
    trap: B names the winter, which the text treats as the occasion rather than the cause.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The lichen on the island had been growing undisturbed for thousands of years and lay
      thick on the ground. That stock of food therefore ___
    options:
    - renewed itself as fast as the herd could eat it
    - had been maintained by grazing animals before 1944
    - could support a herd far above what the island would sustain
    - was the reason the station was closed after the war
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: detail_swap
    why: Thousands of years of undisturbed growth is a stored surplus, which is why the herd could
      pass the level the island could hold.
    trap: A reverses the point, since the text says lichen regrows over decades.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «survive» most nearly mean?
    target: survive
    options:
    - outlive a particular rival
    - keep going for a time
    - escape from an accident
    - remain after a loss
    key: B
    moves:
      A: imported
      C: imported
      D: near_miss
    why: A population can live on borrowed capital for a while before the bill falls due, so the word
      names continuing for a period.
    trap: D gives the sense in which a remnant survives a disaster rather than a population continuing.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the final sentence of the text?
    options:
    - It supplies a comparison in which predators were present
    - It reports the year in which the last reindeer disappeared
    - It explains why the Coast Guard put the animals ashore
    - It gives the rate at which the lichen grows back
    key: A
    moves:
      B: detail_swap
      C: imported
      D: near_miss
    why: Mainland herds hunted by wolves and by people had held steady for centuries, which is the
      contrast the island lacked.
    trap: D names a fact from the third paragraph rather than the work of the last sentence.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports a herd of six thousand and then of forty-two. Based on Text 2, what feature
      of the animals explains the overshoot?
    sibling: BIO-S05-L2
    sibling_gloss: Text 2 is passage 65 of this book. It explains exponential and logistic growth,
      says the textbook picture assumes a population feels a shortage at once, and argues that a delay
      lets a population overshoot and damage its own ceiling.
    options:
    - Their food regrew at a rate measured in decades
    - They had no wolves, bears or hunters on the island
    - The winter of 1963 brought unusually deep snow
    - A reindeer born in a good year goes on breeding for years
    key: D
    moves:
      A: near_miss
      B: near_miss
      C: detail_swap
    why: 'Text 2 locates the delay in the animal: one born in a good year stays large and fertile,
      so the herd keeps growing after the lichen has begun to fail.'
    trap: A names a property of the food rather than of the animals themselves.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: A biologist counted the herd in 1957 and found about thirteen hundred animals in good
      condition. ___ he counted again in 1963 and found six thousand.
    options:
    - Nevertheless,
    - In other words,
    - Six years later,
    - For example,
    key: C
    moves:
      A: wrong_direction
      B: restatement
      D: near_miss
    why: The two counts are given in order, so the second sentence continues a sequence rather than
      qualifying the first.
    trap: A sets the second count against the first as though it were unexpected.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: It is thirty-two miles long, treeless, and covered in moss, low grass and lichen ___
      the slow crusty growth that reindeer eat.
    options:
    - lichen, which is
    - lichen which is
    - lichen; which is
    - 'lichen: which is'
    key: A
    moves:
      B: run_on
      C: wrong_mark
      D: wrong_mark
    why: The clause describing the lichen adds information about it rather than restricting it, so
      a comma joins the two.
    trap: B leaves out the comma that a supplementary clause requires.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain to a reader why the herd collapsed so suddenly. Which choice
      most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain to a reader why the herd collapsed so suddenly
    notes:
    - Twenty-nine reindeer were put ashore in 1944 with no predators.
    - The count reached six thousand by 1963.
    - The lichen was grazed down to bare rock across most of the island.
    - Lichen grows back at a rate measured in decades rather than years.
    options:
    - Twenty-nine reindeer were put ashore in 1944 and had no predators at all
    - The herd had reached about six thousand animals by the year 1963
    - The herd ate a food supply that takes decades to return, so once it was gone no number of animals
      could be fed
    - The lichen was grazed down to bare rock across most of the island
    key: C
    moves:
      A: underreach
      B: underreach
      D: restatement
    why: Only this choice joins the exhaustion of the lichen to its slow regrowth, which together
      make the fall sudden and complete.
    trap: D names the damage without the regrowth rate that makes it irreversible.
- id: BIO-S06-L1
  summary_ar:
    khulasa: في أواخر آب عام ألف وثمانمئة وأربعة وخمسين بدأ الناس في سوهو، وهي منطقة مزدحمة في لندن،
      يموتون بالكوليرا، وكان المرض يقتل سريعًا في يوم واحد غالبًا. وفي أسبوع مات أكثر من خمسمئة في
      شوارع قليلة. وكان معظم الأطبّاء يعتقدون أنّ الكوليرا تنتقل في الهواء الفاسد الصاعد من المجارير،
      أمّا جون سنو فلم يعتقد ذلك وخرج ينظر.
    maana: 'المعنى أنّ سنو جمع عنوان كلّ وفاة تمكّن من تتبّعها وعلّمها على خريطة شارع بشرطة سوداء
      صغيرة، فتراكمت الشرطات حول مكان واحد: مضخّة ماء عامّة عند ناصية شارع برود. وتابع الاستثناءات
      أيضًا: عمّال مصنع جعّة على الشارع نفسه شربوا من بئر المصنع ولم يمرض منهم أحد، وأرملة في هامبستد
      ماتت بعد أن جُلب لها قارورة من ماء برود.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: ما أظهرته الخريطة فعلًا.
      وما فعلته الخريطة هو إظهار أنّ المرض انتشر من مصدر واحد يشربه الناس لا من الهواء الذي يتنفّسونه،
      ولم يُقبل الاحتجاج من مجلس الماء إلّا بعد عقد.'
    sila: في اختبار سات يُسأل عن منهج الاستدلال وعن حدود ما يثبته. والفخّ الشائع أن يُنسب انتهاء الوباء
      إلى رفع يد المضخّة، مع أنّ النصّ يقول إنّ الوفيات كانت تهبط أصلًا وأنّ سنو قال ذلك بنفسه. ويقترن
      المقطع بالمقطع السادس والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - The pump site is now marked with a replica on Broadwick Street
    - Removing the handle from the pump brought the outbreak to an end
    - A map of addresses showed that the disease came from water rather than air
    - The water board did not accept the argument for another decade
    key: C
    moves:
      A: underreach
      B: wrong_direction
      D: true_not_asked
    why: The text says what the map did was show the disease spread from a single source that people
      drank from rather than from the air.
    trap: B is the reading the text corrects, since Snow himself said the removal did not end it.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why did the brewery workers escape the outbreak?
    options:
    - They drank beer and water from a well of their own
    - They lived a short walk from a different pump
    - They had fled the district before the deaths began
    - They were given water carried in from Hampstead
    key: A
    moves:
      B: near_miss
      C: detail_swap
      D: wrong_direction
    why: The text says workers at the brewery drank beer and water from the brewery own well and that
      none of them fell ill.
    trap: B gives the explanation for the nearby houses rather than for the brewery.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that Snow tested his explanation
      rather than only illustrating it?
    claim: Snow tested his own explanation rather than only illustrating it
    options:
    - «Within a week more than five hundred were dead in a few streets»
    - «He also found exceptions and chased them down»
    - «The map itself is still reprinted in textbooks»
    - «Most doctors believed that cholera traveled in bad air rising from drains and rotting matter»
    key: B
    moves:
      A: true_not_asked
      C: underreach
      D: near_miss
    why: Chasing down the cases that did not fit is what distinguishes a test from a display of agreeable
      evidence.
    trap: D names the belief he was arguing against rather than his method.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Deaths were already falling, because many residents had fled, so the removal did not
      end the outbreak and Snow said so himself. The handle therefore ___
    options:
    - proves that the pump was not the source at all
    - was removed before the first deaths occurred
    - had been the only measure the parish board allowed
    - cannot be credited with the fall that followed
    key: D
    moves:
      A: overreach
      B: wrong_direction
      C: imported
    why: The decline had begun before the removal, so the removal cannot be given the credit for it.
    trap: A turns a limit on what the removal shows into a denial of the whole case.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «spread» most nearly mean?
    target: spread
    options:
    - laid out across a surface
    - became more widely known
    - passed from one place to others
    - opened out to full width
    key: C
    moves:
      A: imported
      B: near_miss
      D: imported
    why: The disease moved from a single source to the people who drank from it, so the word names
      transmission.
    trap: B gives the sense in which news spreads rather than a disease.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about the widow in Hampstead?
    options:
    - It reports the distance from Soho to the nearest clean pump
    - It supplies a case far from the pump that still fits the explanation
    - It explains why the parish board agreed to remove the handle
    - It introduces the leaking cesspit found years afterward
    key: B
    moves:
      A: detail_swap
      C: near_miss
      D: wrong_direction
    why: The widow lived three miles away and died after drinking water carried from the pump, which
      tests the water explanation against distance.
    trap: C names a later event rather than the work this sentence does.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 shows Snow acting on a map in 1854. Based on Text 2, which property of the disease
      made that possible?
    sibling: BIO-S06-L2
    sibling_gloss: Text 2 is passage 66 of this book. It argues that an outbreak is governed by route,
      dose, the reproduction number and the incubation period, and that Snow could act on a map because
      cholera is waterborne and the source was fixed in one place.
    options:
    - A waterborne route with the source fixed in a single place
    - A reproduction number above one in a population with no immunity
    - A dose requiring more than one organism to establish infection
    - An incubation period long enough for contacts to be traced
    key: A
    moves:
      B: near_miss
      C: near_miss
      D: detail_swap
    why: Text 2 says Snow could act on a map because cholera is waterborne and the source stayed in
      one place, which is what a map can locate.
    trap: D names the property that makes contact tracing work rather than mapping.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Snow collected the address of every death he could trace and marked each one on a street
      map. ___ the bars piled up around one place.
    options:
    - Nevertheless,
    - In other words,
    - For instance,
    - At once,
    key: D
    moves:
      A: wrong_direction
      B: restatement
      C: near_miss
    why: The pattern appeared as soon as the marks were made, so the second sentence reports what
      the marking immediately revealed.
    trap: A sets the pattern against the mapping that produced it.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Years later an inspection found a leaking cesspit ___ a pit for household waste ___ less
      than a meter from the well.
    options:
    - cesspit a pit for household waste
    - cesspit, which is a pit for household waste,
    - cesspit; a pit for household waste;
    - cesspit, which is a pit for household waste
    key: B
    moves:
      A: run_on
      C: wrong_mark
      D: unpaired
    why: The defining clause interrupts the sentence before the measurement, so it takes a comma at
      each end.
    trap: D opens the interrupting clause and never closes it before the measurement.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain to a reader what the map did and did not accomplish. Which
      choice most effectively uses relevant information from the notes to accomplish that goal?
    goal: explain to a reader what the map did and did not accomplish
    notes:
    - The bars piled up around one public water pump.
    - Houses closer to a different pump had almost none.
    - Deaths were already falling because many residents had fled.
    - Snow said himself that the removal did not end the outbreak.
    options:
    - The bars on the map piled up around one public water pump
    - Houses that were closer to a different pump had almost no deaths
    - Deaths were already falling because many of the residents had fled
    - The map located the source in the water, though the removal of the handle cannot be credited
      with ending the outbreak
    key: D
    moves:
      A: underreach
      B: underreach
      C: restatement
    why: Only this choice states the finding and the limit together, which is the double point the
      goal asks for.
    trap: C gives the limit alone and so leaves the achievement unstated.
- id: BIO-S07-L1
  summary_ar:
    khulasa: حقلان في المزرعة نفسها قد يُعطيان البذر نفسه والمطر نفسه والحراثة نفسها ويُنتجان محصولي
      قمح مختلفين جدًّا، وأحد المؤشّرات المفيدة هو ما نما في كلّ حقل في السنة السابقة. فالقمح المزروع
      بعد البرسيم يتجاوز عادةً القمح المزروع بعد القمح، والفرق قد يبلغ الثلث أو أكثر، وقد عرف المزارعون
      الإنجليز ذلك قبل أن يستطيع أحد تفسيره.
    maana: المعنى أنّ التفسير في الجذور. فالبرسيم وغيره من العائلة البقولية يحمل انتفاخات صغيرة تُسمّى
      العُقيدات على جذوره، وفي داخلها تعيش بكتيريا تأخذ النيتروجين من الهواء وتحوّله إلى صورة تستطيع
      النباتات استخدامها. والقمح لا يقدر على ذلك وعليه أن يستهلك ما يجده في التراب.
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: ممارسة زراعية مؤرّخة بنتائجها.
      فدورة نورفولك الرباعية صارت قياسية في القرن الثامن عشر، وتضاعفت المحاصيل تقريبًا على مدى القرن،
      وانتشرت الممارسة لأنّها كانت مربحة لا لأنّ الكيمياء كانت مفهومة.'
    sila: في اختبار سات يُسأل عن التفصيل وعن الاستنتاج ومعنى الكلمة في سياقها. والفخّ الشائع أن يُفترض
      أنّ الفهم الكيميائي سبق الممارسة، مع أنّ النصّ يقول إنّ النيتروجين لم يُعرف عنصرًا فاعلًا إلّا
      في ثلاثينيات القرن التاسع عشر. ويقترن المقطع بالمقطع السابع والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - Nitrogen was not identified as the active element until the 1830s
    - Yields on Norfolk farms roughly doubled over the eighteenth century
    - The turnips in the rotation were a root crop lifted for winter feed
    - Wheat does better after clover, and the reason lies in bacteria on clover roots
    key: D
    moves:
      A: underreach
      B: true_not_asked
      C: detail_swap
    why: The text opens on the difference between the two fields and closes on the nodules and the
      bacteria inside them that supply the nitrogen.
    trap: B gives a measured consequence of the practice rather than the explanation of it.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, what happened to the clover in the rotation?
    options:
    - It was lifted and stored as winter feed for the sheep
    - It was cut for hay or eaten by sheep, and the roots turned in
    - It was sown immediately after the wheat each year
    - It was left standing through the winter to protect the soil
    key: B
    moves:
      A: detail_swap
      C: wrong_direction
      D: imported
    why: The text says the clover was cut for hay or eaten by sheep, whose droppings stayed on the
      land, and that the roots were then turned into the soil.
    trap: A gives the treatment of the turnips rather than of the clover.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the practice was adopted
      for reasons unconnected with the explanation?
    claim: the practice was adopted for reasons unconnected with the explanation
    options:
    - «Clover and other members of the pea family carry small swellings called nodules on their roots»
    - «The farmer divided a field into four parts and moved the crops around them on a four-year cycle»
    - «The practice spread because it paid, not because the chemistry was understood»
    - «Inside these nodules live bacteria that take nitrogen from the air»
    key: C
    moves:
      A: near_miss
      B: underreach
      D: near_miss
    why: The sentence separates the reason for adoption from the understanding of the mechanism, which
      is exactly what the claim asserts.
    trap: A names part of the explanation rather than the reason for adoption.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: Clover leaves the soil richer than it found it; wheat leaves it poorer. A farmer who
      alternates the two therefore ___
    options:
    - runs a cycle of deposit and withdrawal
    - needs no winter feed for the sheep
    - exhausts the field by the fourth year
    - must apply nitrogen from outside the farm
    key: A
    moves:
      B: imported
      C: wrong_direction
      D: near_miss
    why: One crop adds to the soil and the other draws on it, so alternating them is a slow cycle
      of putting in and taking out.
    trap: C describes what happens to a farmer who grows wheat on wheat instead.
  - slot: 5
    type: words_in_context
    difficulty: easy
    stem: As used in the text, what does the word «consume» most nearly mean?
    target: consume
    options:
    - destroy by burning
    - buy for immediate use
    - take up a great deal of time
    - draw on what is available
    key: D
    moves:
      A: imported
      B: imported
      C: near_miss
    why: Wheat cannot fix nitrogen and must take what the soil already holds, so the word names drawing
      on a store.
    trap: A gives the sense in which a fire consumes a building.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the first paragraph of the text?
    options:
    - It names the bacteria that live inside the root nodules
    - It reports the four crops of the Norfolk rotation in order
    - It sets up a difference that the rest of the text explains
    - It explains why the rotation spread across northern Europe
    key: C
    moves:
      A: wrong_direction
      B: detail_swap
      D: near_miss
    why: The paragraph establishes that wheat after clover beats wheat after wheat and says farmers
      knew it before anyone could say why.
    trap: B names the content of the second paragraph rather than the first.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 says a farmer who grows wheat on wheat makes withdrawals only. Based on Text 2, which
      leak does the harvest itself represent?
    sibling: BIO-S07-L2
    sibling_gloss: Text 2 is passage 67 of this book. It sets out fixation, uptake, breakdown and
      return as the steps of the nitrogen cycle, and names harvest, leaching and gas losses as the
      three leaks from a field.
    options:
    - Nitrogen washed below the root zone by rain
    - Nitrogen removed in the grain and carried away
    - Nitrogen returned to the air as gas by bacteria
    - Nitrogen fixed industrially by the Haber process
    key: B
    moves:
      A: near_miss
      C: near_miss
      D: detail_swap
    why: Text 2 lists the harvest as the leak that removes nitrogen in the grain and takes it away
      in a truck.
    trap: A names leaching, which is a different one of the three leaks.
  - slot: 8
    type: transitions
    difficulty: easy
    stem: Which choice completes the text with the most logical transition?
    carrier: Wheat cannot do this and must consume what it finds in the soil. ___ clover leaves the
      soil richer than it found it.
    options:
    - By contrast,
    - For example,
    - In other words,
    - Consequently,
    key: A
    moves:
      B: near_miss
      C: restatement
      D: wrong_direction
    why: The two crops do opposite things to the soil, so the second sentence stands against the first.
    trap: D makes the enrichment by clover a consequence of what wheat cannot do.
  - slot: 9
    type: boundaries
    difficulty: easy
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    carrier: Wheat sown after clover ___ a low plant of the pea family grown for hay ___ will usually
      beat wheat sown after wheat.
    options:
    - clover which is a low plant of the pea family grown for hay
    - clover; which is a low plant of the pea family grown for hay;
    - clover, which is a low plant of the pea family grown for hay,
    - clover, which is a low plant of the pea family grown for hay
    key: C
    moves:
      A: run_on
      B: wrong_mark
      D: unpaired
    why: The clause describing clover interrupts the sentence before its verb, so it needs a comma
      at each end.
    trap: D opens the interruption with a comma and never closes it before the verb.
  - slot: 10
    type: synthesis
    difficulty: medium
    stem: The student wants to explain to a reader why the rotation worked before anyone understood
      it. Which choice most effectively uses relevant information from the notes to accomplish that
      goal?
    goal: explain to a reader why the rotation worked before anyone understood it
    notes:
    - English farmers knew wheat did better after clover long before anyone could say why.
    - Yields on Norfolk farms roughly doubled over the century.
    - The practice spread because it paid.
    - Nitrogen was not identified as the active element until the 1830s.
    options:
    - The rotation paid for itself in doubled yields two generations before the chemistry behind it
      was known
    - Yields on farms using the rotation roughly doubled over the century
    - English farmers knew that wheat did better after clover had been grown
    - Nitrogen was not identified as the active element until the 1830s
    key: A
    moves:
      B: underreach
      C: restatement
      D: true_not_asked
    why: Only this choice sets the measured benefit beside the delay in understanding, which is what
      the goal asks for.
    trap: D gives the date of the understanding without the benefit that preceded it.
- id: BIO-S08-L1
  summary_ar:
    khulasa: قرب قمّة ماونا لوا، وهو بركان في جزيرة هاواي، يسحب جهاز الهواء عبر أنبوب ويقيس ثاني أكسيد
      الكربون فيه كلّ ساعة منذ عام ألف وتسعمئة وثمانية وخمسين. واختير الموقع لأنّه بعيد عن المدن والغابات
      والمصانع، على ارتفاع أحد عشر ألف قدم، في هواء عبر آلاف الأميال من المحيط، وأنشأ تشارلز ديفيد
      كيلينغ أوّل منظومة قياس هناك وأدارها سبعًا وأربعين سنة.
    maana: 'المعنى أنّ السجلّ يفعل شيئين في وقت واحد: يتذبذب صعودًا وهبوطًا كلّ سنة، ويصعد. فالتذبذّب
      السنوي حادّ الشكل كأسنان منشار: يهبط ثاني أكسيد الكربون في الربيع والصيف الشماليين حين تنمو
      الغابات والمحاصيل وتأخذه، ويرتفع في الخريف والشتاء حين تتساقط الأوراق وتتعفّن، والمدى نحو ستّة
      أجزاء في المليون.'
    ahammiyya: 'في مجال الأحياء وعلوم الأرض هذه المادة في مستوى الظاهرة: قراءة مباشرة من جهاز لا تقدير.
      فالقراءات الأولى عام ثمانية وخمسين كانت نحو ثلاثمئة وخمسة عشر جزءًا في المليون، وتجاوز الرقم
      أربعمئة عام ألفين وثلاثة عشر، وارتفع المستوى كلّ سنة من السجلّ بلا استثناء.'
    sila: في اختبار سات يُسأل عن التعليق على رسم بياني موصوف بالكلمات. والفخّ الشائع أن يُخلط التذبذّب
      السنوي بالصعود طويل المدى، مع أنّ النصّ يفصل بينهما فصلًا واضحًا. ويقترن المقطع بالمقطع الثامن
      والستّين في أسئلة النصّين المتقابلين.
  questions:
  - slot: 1
    type: central_idea
    difficulty: easy
    stem: Which choice best states the main idea of the text?
    options:
    - One instrument has recorded a yearly wobble and a yearly climb since 1958
    - Keeling nearly lost his funding twice during the 1960s
    - The South Pole record shows almost no yearly wobble at all
    - The site was chosen because it is far from cities and factories
    key: A
    moves:
      B: underreach
      C: true_not_asked
      D: detail_swap
    why: The text says the record does two things at once and then takes the wobble and the climb
      in turn.
    trap: C reports a comparison from the end of the text rather than its subject.
  - slot: 2
    type: detail
    difficulty: easy
    stem: According to the text, why does carbon dioxide fall each northern spring?
    options:
    - Because leaves drop and rot through the colder months
    - Because the instrument is eleven thousand feet above the sea
    - Because northern forests and crops are growing and taking it in
    - Because the southern half of the world has little plant life
    key: C
    moves:
      A: wrong_direction
      B: imported
      D: detail_swap
    why: The text says the figure falls through the northern spring and summer when the forests and
      crops of the northern half are growing and taking it in.
    trap: A gives the reason for the rise in the other half of the year.
  - slot: 3
    type: evidence
    difficulty: medium
    stem: Which quotation from the text most strongly supports the claim that the climb is harder
      to dispute than an estimate would be?
    claim: the climb is harder to dispute than an estimate would be
    options:
    - «The site was chosen because it is far from cities, forests and factories»
    - «The swing is about six parts per million from peak to trough»
    - «Other stations, from Alaska to the South Pole, now run the same measurement»
    - «it is a direct reading from an instrument rather than an estimate»
    key: D
    moves:
      A: near_miss
      B: underreach
      C: near_miss
    why: The clause gives the reason the climb is undisputed, which is that it is read off an instrument
      rather than inferred.
    trap: C names corroboration from other stations rather than the character of the reading.
  - slot: 4
    type: inference
    difficulty: medium
    stem: Which choice most logically completes the text?
    carrier: The yearly wobble has not changed much, but the level around which it wobbles has shifted
      upward every single year of the record. The two features of the graph are therefore ___
    options:
    - the same process measured in two ways
    - independent of one another in the record
    - both produced by northern plant growth
    - confined to the station on Mauna Loa
    key: B
    moves:
      A: wrong_direction
      C: near_miss
      D: detail_swap
    why: One feature has stayed steady while the other has risen every year, so the two are not moving
      together.
    trap: C assigns both features to plant growth, which the text gives only to the wobble.
