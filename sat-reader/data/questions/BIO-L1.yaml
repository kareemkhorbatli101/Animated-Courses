    - changed in shape
    - swapped one thing for another
    - slid sideways a little
    key: A
    moves:
      B: near_miss
      C: imported
      D: wrong_direction
    why: The level around which the wobble sits has gone up every year of the record, so the word
      names a steady upward movement.
    trap: B gives a change of form, which the text assigns to the wobble and denies.
  - slot: 6
    type: structure
    difficulty: medium
    stem: Which choice best describes the function of the sentence about the South Pole record?
    options:
    - It reports the first readings taken in 1958
    - It explains why the Mauna Loa site was chosen
    - It shows that the climb has been measured only in Hawaii
    - It confirms the explanation offered for the yearly wobble
    key: D
    moves:
      A: detail_swap
      B: near_miss
      C: wrong_direction
    why: The southern half has little plant life and shows almost no wobble, which is what the plant-growth
      explanation predicts.
    trap: C contradicts the sentence before, which says other stations give the same climb.
  - slot: 7
    type: cross_text
    difficulty: hard
    stem: Text 1 reports that the curve has no downward step in any year. Based on Text 2, which property
      explains that?
    sibling: BIO-S08-L2
    sibling_gloss: Text 2 is passage 68 of this book. It explains that the ground radiates in the
      infrared, that water vapor and carbon dioxide absorb there, and that a substantial fraction
      of carbon dioxide stays in circulation for centuries.
    options:
    - The strongest parts of the absorption band are already saturated
    - A warmer atmosphere holds more water vapor than a cold one
    - A large share of the gas stays in circulation for centuries
    - Methane breaks down in the atmosphere in about a decade
