# Reading the Five Fields — specification (single source of truth)
title: "Reading the Five Fields"
subtitle: "200 Graded Passages That Build What the SAT Assumes"
companion: "Words in Context"
words_per_passage: 300

fields:
  HIS: "History and Civics"
  BIO: "Biology and Earth Science"
  PHY: "Physical Science"
  HUM: "Humanities"
  SOC: "Social Science"
field_order: [HIS, BIO, PHY, HUM, SOC]

# The depth ladder. Every strand runs through these four moves in this order.
moves:
  1: phenomenon
  2: mechanism
  3: evidence
  4: dispute
move_notes:
  phenomenon: "One concrete case, named and dated: what happens and what it looks like."
  mechanism: "How it works and how much: cause, comparison, magnitude."
  evidence: "How anyone knows: the study, the document, the measurement, and its limits."
  dispute: "What is contested: two readings of one body of evidence, and the writer's stance."

sat_frames:
  - "founding document: the claim and its warrant"
  - "paired texts: two sides of one question"
  - "speech or essay: argument and audience"
  - "science report: question, method, result"
  - "science report: method and limitation"
  - "data commentary: a figure described in words"
  - "literary excerpt: narrator and stance"
  - "humanities criticism: a judgment defended"
  - "social study: design and inference"
  - "historical narrative: event and consequence"

levels:
  1:
    name: Foundation
    description: >
      Read for the case itself. Every passage names one thing that happened, or one thing that is so, and holds to it. If the reader can say afterward what the passage was about in a single sentence, the passage has done its work.
    words_min: 288
    words_max: 312
    paras_min: 3
    paras_max: 3
    sent_mean_min: 13.0
    sent_mean_max: 18.0
    sent_max: 34
    fk_min: 5.5
    fk_max: 11.0
    known_band: 16000
    above_band_max: 6
    terms_max: 4
    gloss_all: true
    sents_min: 12
  2:
    name: Developing
    description: >
      Read for the working. These passages do not stop at what happens; they say why it happens and how much. Watch for the sentence that carries the cause, and for the number that gives the size of it.
    words_min: 288
    words_max: 312
    paras_min: 3
    paras_max: 3
    sent_mean_min: 16.0
    sent_mean_max: 21.0
    sent_max: 40
    fk_min: 8.0
    fk_max: 13.0
    known_band: 22000
    above_band_max: 6
    terms_max: 5
    gloss_all: true
    sents_min: 11
  3:
    name: Target
    description: >
      Read for the warrant. Someone had to find this out. These passages name the study, the document, or the measurement behind the claim, and say what it cannot show. The limit is part of the finding, not an apology for it.
    words_min: 288
    words_max: 312
    paras_min: 3
    paras_max: 4
    sent_mean_min: 19.0
    sent_mean_max: 24.0
    sent_max: 46
    fk_min: 10.5
    fk_max: 15.0
    known_band: 30000
    above_band_max: 6
    terms_max: 6
    gloss_all: false
    sents_min: 10
  4:
    name: Stretch
    description: >
      Read for the disagreement. One body of evidence, two readings of it. The writer takes a side, and the passage is built so that the side taken can be told apart from the evidence it rests on.
    words_min: 288
    words_max: 312
    paras_min: 3
    paras_max: 4
    sent_mean_min: 21.0
    sent_mean_max: 28.0
    sent_max: 52
    fk_min: 11.5
    fk_max: 17.5
    known_band: 40000
    above_band_max: 6
    terms_max: 6
    gloss_all: false
    sents_min: 9

# Hu and Nation's coverage figures, as reported in the secondary literature: about 98
# per cent of running words known for unassisted reading. Two per cent of a 300-word
# passage is six words, which is where above_band_max comes from.
# The known_band figures are form ranks in the wordfreq English corpus. They are a
# proxy for Hu and Nation's 98 per cent coverage rule, not an identity with it, and
# they were set by measurement rather than by assertion. The corpus is general and
# subtitle-heavy, so ordinary concrete nouns rank surprisingly low in it: bark is
# 8,895, moth 15,005, elk 15,157, glacier 13,358. Specialist vocabulary sits well
# above that: lichen 38,474, seedling 39,551, isotope 23,875, nodule 66,138. The
# bands below are placed between those two populations, so that a passage may use
# the concrete vocabulary of its subject freely and must declare and gloss the
# specialist vocabulary. Six words per 300 is the two per cent that the rule allows.
coverage_rule: "at most six running words outside the level's assumed-known band, proper nouns and declared field terms excluded"

checks:
  per_passage: 3
  total: 600
  passes:
    A: "Coverage and progression — the strand advances and the anchors are real."
    B: "Language grading — length, sentence shape, readability, and the 98 per cent rule."
    C: "Register and integrity — American usage, particulars, no second person."

# ---------------------------------------------------------------------------
# Questions, answer key and Arabic summaries. See QUESTIONS-PLAN.md.
# ---------------------------------------------------------------------------
slots:
  1:  {type: central_idea,     domain: "Information and Ideas"}
  2:  {type: detail,           domain: "Information and Ideas"}
  3:  {type: evidence,         domain: "Information and Ideas"}
  4:  {type: inference,        domain: "Information and Ideas"}
  5:  {type: words_in_context, domain: "Craft and Structure"}
  6:  {type: structure,        domain: "Craft and Structure"}
  7:  {type: cross_text,       domain: "Craft and Structure"}
  8:  {type: transitions,      domain: "Expression of Ideas"}
  9:  {type: boundaries,       domain: "Standard English Conventions"}
  10: {type: synthesis,        domain: "Expression of Ideas"}

# Difficulty is a design position, not a measurement. Fixed per level by slot so
# that the per-question check and the level total are both exact.
difficulty_map:
  1: {easy: [1, 2, 5, 8, 9],  medium: [3, 4, 6, 10],      hard: [7]}
  2: {easy: [1, 2, 9],        medium: [3, 4, 5, 6, 8],    hard: [7, 10]}
  3: {easy: [2, 9],           medium: [1, 3, 4, 5, 8],    hard: [6, 7, 10]}
  4: {easy: [9],              medium: [1, 2, 4, 5],       hard: [3, 6, 7, 8, 10]}

question_rules:
  options: 4
  labels: [A, B, C, D]
  stem_words_min: 6
  stem_words_max: 60
  option_ratio_max: 2.4
  key_longest_share_max: 0.30
  key_shortest_share_max: 0.30
  key_letter_share_book: [0.22, 0.28]
  key_letter_share_level: [0.18, 0.32]
  key_letter_share_field: [0.15, 0.35]
  key_run_max: 3
  slot_letter_share_max: 0.40
  why_words: [8, 45]
  trap_words: [5, 30]
  notes_min: 3
  notes_max: 4
  banned_option_forms:
    - "all of the above"
    - "none of the above"
    - "both a and b"
    - "a and b"
    - "b and c"
    - "none of these"
  distractor_moves:
    true_not_asked: "supported by the text but not an answer to the stem"
    wrong_direction: "reverses a cause, a comparison or a sign"
    overreach: "the right idea pushed to always, never, proves"
    underreach: "true and trivial, answering less than was asked"
    imported: "plausible on the subject and absent from the text"
    detail_swap: "one name, number or date exchanged for another"
    near_miss: "on the right topic but answering a slightly different question"
    restatement: "repeats the text or the stem without answering"
    comma_splice: "joins two independent clauses with a comma"
    run_on: "joins two independent clauses with no mark at all"
    wrong_mark: "a punctuation mark that asserts a relation the sentence does not have"
    misplaced: "a modifier or clause attached to the wrong element"

arabic:
  parts: [khulasa, maana, ahammiyya, sila]
  part_headings:
    khulasa: "خلاصة"
    maana: "المعنى"
    ahammiyya: "الأهمية في المجال"
    sila: "الصلة بالاختبار"
  words_min: 90
  words_max: 200
  sila_words_min: 15
  script_share_min: 0.92
  test_name: "سات"
  field_names:
    HIS: "التاريخ والنظام المدني"
    BIO: "الأحياء وعلوم الأرض"
    PHY: "العلوم الفيزيائية"
    HUM: "الإنسانيات"
    SOC: "العلوم الاجتماعية"
  move_names:
    phenomenon: "الظاهرة"
    mechanism: "الآلية"
    evidence: "الدليل"
    dispute: "الخلاف"
  latin_allowlist: [SAT, Text, A, B, C, D]

question_checks:
  per_question: 10
  total: 20000
  book_level: 100
