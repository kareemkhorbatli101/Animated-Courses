# The fifty strands, each with the four-level outline that the passages follow.
HIS:
  S01:
    title: "The Declaration and the claim of natural rights"
    l1: "July 1776 in Philadelphia: what the document is, who wrote it, what it lists."
    l2: "The argument's shape: self-evident truths, consent, and the right to alter government."
    l3: "What the drafts show: Jefferson's deleted passage on the slave trade, and what the edit tells us."
    l4: "Whether the Declaration promised equality or only independence: Douglass and Calhoun read the same sentence."
  S02:
    title: "The Constitution's machinery"
    l1: "Three branches, named, with one power each that the others can block."
    l2: "Why the machinery was built that way: faction, and Madison's remedy in Federalist 10."
    l3: "Hamilton on a single executive in Federalist 70, and what the ratification debates record."
    l4: "Whether the checks protect liberty or produce paralysis: two readings of the same design."
  S03:
    title: "Who counts as a citizen"
    l1: "Seneca Falls, 1848: a convention, a declaration, and a list of grievances."
    l2: "How the franchise actually widened: property, race, sex, age, and the amendments that did it."
    l3: "Reading the suffrage record: petitions, poll books, and what a signature count can show."
    l4: "Whether rights are won in courts or in the street: the suffrage movement's own quarrel."
  S04:
    title: "Abolition and the argument against slavery"
    l1: "Frederick Douglass at Rochester, 1852: the Fourth of July speech and its question."
    l2: "The argument from natural rights, and the proslavery answer from property and order."
    l3: "The evidence abolitionists used: narratives, ledgers, ship manifests, and their reliability."
    l4: "Whether moral suasion or political power ended slavery: Garrison against the Free Soilers."
  S05:
    title: "Reconstruction and the retreat from it"
    l1: "1865 to 1877: three amendments, the Freedmen's Bureau, and what was built."
    l2: "How the retreat worked: violence, the courts, the 1876 bargain, and disenfranchisement."
    l3: "What the sources say: Congressional testimony, registration rolls, and the gap between them."
    l4: "Whether Reconstruction failed or was defeated: Du Bois against the Dunning school."
  S06:
    title: "Industry, labour and the regulating state"
    l1: "The Triangle fire, 1911: a locked door, 146 deaths, and what followed."
    l2: "How regulation spread: inspection, liability, hours laws, and the cost of each."
    l3: "The evidence behind factory law: commission reports, mortality tables, and their gaps."
    l4: "Whether regulation raised wages or cost jobs: the same statistics, two conclusions."
  S07:
    title: "Civil rights: courts, statutes and the street"
    l1: "Montgomery, 1955: a bus, a boycott, and a year of walking."
    l2: "How the law changed: Brown, the 1964 Act, the 1965 Act, and the mechanism of each."
    l3: "What the record holds: court transcripts, registration figures, and FBI files."
    l4: "Whether the movement's gains came from law or from pressure: King's own argument with himself."
  S08:
    title: "Empire and independence"
    l1: "Salt at Dandi, 1930: a march, a handful of mud, and sixty thousand arrests."
    l2: "How empires were run and how they ended: revenue, railways, soldiers, and debt."
    l3: "Reading colonial records: tax rolls, famine reports, and whose numbers they are."
    l4: "Whether independence was granted or taken: Attlee's account against Nehru's."
  S09:
    title: "War, emergency and civil liberty"
    l1: "Executive Order 9066, 1942: an order, a map, and 120,000 people moved."
    l2: "How emergency powers work: suspension, detention, censorship, and the usual arguments."
    l3: "The evidence at the time: the Ringle report, the Munson report, and what was withheld."
    l4: "Whether security ever justifies the suspension of rights: Korematsu and its dissents."
  S10:
    title: "The press, the vote and public opinion"
    l1: "The penny press, 1833: a cheap paper, advertising, and a new kind of reader."
    l2: "How a story becomes news: sources, deadlines, competition, and what gets left out."
    l3: "Measuring opinion: the 1936 Literary Digest poll, its two million replies, and its failure."
    l4: "Whether the press leads opinion or follows it: two readings of the same campaign."
BIO:
  S01:
    title: "Natural selection and variation"
    l1: "Peppered moths on Manchester bark: two forms, soot, and a changing count."
    l2: "The mechanism in four conditions: variation, heredity, differential survival, time."
    l3: "The Galapagos finch record: thirty years of beak measurements through drought and flood."
    l4: "Whether selection or chance shapes most change: the neutral theory argument."
  S02:
    title: "Inheritance, from pea plants to genomes"
    l1: "Mendel's garden at Brno: tall and short peas, and a ratio that kept appearing."
    l2: "How the ratio arises: two copies, dominance, and the shuffling at each generation."
    l3: "From chromosome maps to sequencing: what each method can and cannot resolve."
    l4: "Whether genes explain traits or only correlate with them: heritability misread."
  S03:
    title: "The cell and its energy"
    l1: "A yeast cell in a warm sugar solution: what goes in, what comes out, what rises."
    l2: "Respiration and fermentation compared: oxygen, yield, and the cost of going without."
    l3: "How the energy path was worked out: labeled atoms, poisons, and isolated mitochondria."
    l4: "Whether the cell is a machine or an ecology: two ways to read the same organelles."
  S04:
    title: "Ecosystems: who eats whom, and how much"
    l1: "Yellowstone, 1995: wolves returned, and the willows along the creeks grew back."
    l2: "Trophic levels and the ten per cent rule: why there are few wolves and many voles."
    l3: "Exclosure experiments and isotope ratios: how a food web is actually traced."
    l4: "Whether predators or rivers rebuilt the willows: the trophic cascade dispute."
  S05:
    title: "Populations: growth, limit and collapse"
    l1: "Reindeer on St. Matthew Island: 29 animals, then 6,000, then 42."
    l2: "Exponential and logistic growth: the ceiling, the overshoot, and the lag."
    l3: "The Hudson's Bay fur records: a 90-year cycle, and what a trapping ledger can show."
    l4: "Whether food or predators drive the hare cycle: fifty years of disagreement."
  S06:
    title: "Microbes and disease"
    l1: "Broad Street, 1854: a pump, a map, and a handle removed."
    l2: "How transmission works: dose, route, incubation, and the reproduction number."
    l3: "Koch's postulates, and the organisms that refuse to satisfy them."
    l4: "Whether the germ or the ground matters more: Snow, Pettenkofer, and modern echoes."
  S07:
    title: "Plants, soil and the nitrogen cycle"
    l1: "A clover field and a wheat field in rotation: why the wheat does better after clover."
    l2: "Fixation, nitrification, uptake and loss: the four steps and their rates."
    l3: "The Rothamsted plots: 180 years of the same treatments on the same soil."
    l4: "Whether fertilizer feeds the world or exhausts it: two readings of the yield curve."
  S08:
    title: "Carbon, climate and the record of it"
    l1: "Mauna Loa, 1958 to now: one instrument, one graph, a sawtooth that climbs."
    l2: "The mechanism: absorption bands, residence time, and the ocean's slow uptake."
    l3: "Ice cores, tree rings and corals: three proxies, three error bars, one picture."
    l4: "Whether the record settles attribution: how a signal is separated from noise."
  S09:
    title: "The restless Earth: plates, rock and deep time"
    l1: "Iceland's rift at Thingvellir: two walls of rock moving apart an inch a year."
    l2: "Plate motion and its consequences: ridges, trenches, faults and mountains."
    l3: "How the age of the Earth was fixed: lead ratios, half-lives, and Holmes's meteorites."
    l4: "Whether catastrophe or slow change built the landscape: the old quarrel, revived."
  S10:
    title: "Water, ocean and ice"
    l1: "The Thwaites glacier front: a cliff of ice, a warm current, and a retreating line."
    l2: "Why warm water does the work: latent heat, salinity, and the shape of the sea floor."
    l3: "Satellite gravimetry and tide gauges: two ways to weigh an ice sheet, and their limits."
    l4: "Whether the retreat is reversible: the marine ice-cliff argument."
PHY:
  S01:
    title: "Measurement, error and uncertainty"
    l1: "Weighing the same stone eleven times and getting eleven answers."
    l2: "Random error against bias: what averaging fixes and what it cannot."
    l3: "Calibration chains: how a laboratory balance is tied to a national standard."
    l4: "Whether a measurement can ever be separated from its theory."
  S02:
    title: "Forces and motion"
    l1: "A dropped hammer and a dropped feather on the Moon, 1971."
    l2: "The three laws at work in one braking truck: mass, friction and distance."
    l3: "How gravity's constant was measured: Cavendish's torsion balance and its error."
    l4: "Whether Newton was wrong or incomplete: what Mercury's orbit decided."
  S03:
    title: "Energy: stored, moved and lost"
    l1: "A reservoir above a town: water, a pipe, a turbine, and lit houses."
    l2: "Forms and conversions: how much is lost at each step, and where it goes."
    l3: "Measuring efficiency: input, output, and the hard problem of the boundary."
    l4: "Whether efficiency saves energy: the rebound argument."
  S04:
    title: "Heat, gases and the second law"
    l1: "A bicycle pump that grows hot in the hand."
    l2: "Pressure, volume and temperature: the gas law and what it predicts."
    l3: "Joule's paddle wheel: how the mechanical equivalent of heat was pinned down."
    l4: "Whether the second law is a law of nature or of bookkeeping."
  S05:
    title: "Electricity and the circuit"
    l1: "A house fuse that blows, and the kettle that blew it."
    l2: "Current, voltage, resistance and power: why the thin wire gets hot."
    l3: "How a national grid is kept in balance, second by second, and how it is measured."
    l4: "Whether the grid should be large or local: two readings of the same blackout."
  S06:
    title: "Waves, light and sound"
    l1: "A straw that looks bent in a glass of water."
    l2: "Refraction, reflection and diffraction: one rule, three effects."
    l3: "Measuring the speed of light: from Fizeau's wheel to a defined metre."
    l4: "Whether light is wave or particle: what the two-slit result forced."
  S07:
    title: "Matter: atoms, bonds and reactions"
    l1: "Steel wool that burns, and a steel bar that does not."
    l2: "Bonds, energy barriers and rates: why surface area and heat change everything."
    l3: "The periodic table as prediction: gallium, germanium, and Mendeleev's gaps."
    l4: "Whether chemistry reduces to physics: the argument over emergence."
  S08:
    title: "Materials: strength, failure and choice"
    l1: "The Tay Bridge, 1879: cast iron, a gale, and seventy-five deaths."
    l2: "Stress, strain, yield and fracture: four numbers that decide a design."
    l3: "Testing to destruction: how a safety factor is actually arrived at."
    l4: "Whether failures are technical or organizational: two inquiries, one bridge."
  S09:
    title: "The nucleus, radiation and dating"
    l1: "A radium dial painter's jaw, 1925, and what the X-rays showed."
    l2: "Half-life, dose and shielding: the three numbers that govern exposure."
    l3: "Carbon-14 dating: the method, the calibration curve, and what it cannot date."
    l4: "Whether low doses are safe: the linear no-threshold dispute."
  S10:
    title: "Distance, light and the scale of the sky"
    l1: "Why the Moon takes 1.3 seconds to reach us and the Sun eight minutes."
    l2: "Parallax, brightness and the ladder of distance."
    l3: "Cepheid variables: how Leavitt's law turned brightness into a ruler."
    l4: "Whether the expansion rate is known: the tension between two good measurements."
HUM:
  S01:
    title: "Who is telling this: narrator and point of view"
    l1: "Two openings of one scene: the maid's account, then the mistress's."
    l2: "First person, third limited, omniscient: what each can and cannot report."
    l3: "How critics establish an unreliable narrator: the textual evidence they cite."
    l4: "Whether a narrator's judgement is the author's: the quarrel over irony."
  S02:
    title: "Character, motive, and the gap between them"
    l1: "A man who gives away his coat and cannot say why."
    l2: "How writers build motive: action, speech, gesture, and what is withheld."
    l3: "Reading a character from the manuscript: what the deleted paragraph shows."
    l4: "Whether characters have psychology or only functions: two schools reading one novel."
  S03:
    title: "Image, figure and the physical word"
    l1: "A poem that is four objects and no statement."
    l2: "Metaphor, simile and metonymy: three moves and the work each does."
    l3: "How an image is traced through a text: concordances, repetition, and pattern."
    l4: "Whether imagery carries meaning or only mood: the argument over symbolism."
  S04:
    title: "Form: the line, the stanza, the turn"
    l1: "A sonnet counted out: fourteen lines, a rhyme scheme, a hinge at line nine."
    l2: "How form creates expectation, and how breaking it produces meaning."
    l3: "Scansion as evidence: what a metrical analysis can actually prove."
    l4: "Whether free verse has form: Whitman's defenders and his critics."
  S05:
    title: "The stage as a machine"
    l1: "A trapdoor, a balcony and a bare platform: the Globe and what it could do."
    l2: "How a playhouse shapes a play: entrances, asides, daylight, and the crowd."
    l3: "Reading the promptbook: cuts, business, and what a production actually did."
    l4: "Whether a play belongs to its author or its stage: the directors' quarrel."
  S06:
    title: "Genre and what a reader expects"
    l1: "A locked room, a body and a detective: the shape of a kind of story."
    l2: "How conventions work, and what an author gains by refusing them."
    l3: "Tracing a genre's history: first appearances, borrowings, and bibliographies."
    l4: "Whether genre limits a writer or enables one: two critical positions."
  S07:
    title: "Painting and the trained eye"
    l1: "One room of a Dutch house, painted in 1658, and everything in it."
    l2: "How a picture directs the eye: line, light, scale and the diagonal."
    l3: "What conservation reveals: X-rays, pigment analysis, and repainted hands."
    l4: "Whether a painting means what its age meant by it: the iconography argument."
  S08:
    title: "Music: pattern in time"
    l1: "A tune of eight bars, repeated, altered, and repeated again."
    l2: "How tension is built and released: key, cadence, rhythm and expectation."
    l3: "What a manuscript shows: revisions, performance marks, and the editor's choices."
    l4: "Whether a score is the work or a set of instructions: the performance debate."
  S09:
    title: "Architecture and the shaped city"
    l1: "A nineteenth-century arcade: glass, iron, shops and shelter from rain."
    l2: "How a street is made to work: frontage, width, sightlines and use."
    l3: "Measuring a city: counts of footfall, surveys, and what each misses."
    l4: "Whether the block or the tower serves a city better: Jacobs against Le Corbusier."
  S10:
    title: "Criticism: how arguments about art are made"
    l1: "Two reviews of one first night, printed the same morning."
    l2: "What a critical argument needs: a claim, evidence from the work, and a standard."
    l3: "How a judgement is tested: counter-examples, context and the record of reception."
    l4: "Whether judgements of art can be true: taste, standards and the long argument."
SOC:
  S01:
    title: "Asking people things: surveys and their traps"
    l1: "Two wordings of one question, and the twenty-point gap between the answers."
    l2: "Sampling, response rate and question order: three ways a survey goes wrong."
    l3: "How a modern poll is actually built: frames, weights and margins of error."
    l4: "Whether polls can be fixed or should be replaced: after 2016 and 2020."
  S02:
    title: "Experiment, control and the drawing of lots"
    l1: "A school that gave half its pupils breakfast and measured the other half."
    l2: "Why lots matter: what randomization does that matching cannot."
    l3: "Field experiments: the Oregon lottery, the Perry preschool, and what each shows."
    l4: "Whether randomized trials are the gold standard: the external validity objection."
  S03:
    title: "Correlation, cause and confounding"
    l1: "Towns with more bookshops have fewer burglaries, and why that proves nothing."
    l2: "Confounding, selection and reverse causation: three reasons a pattern misleads."
    l3: "Natural experiments: twins, lotteries, border effects, and what they buy."
    l4: "Whether observational data can ever establish cause: smoking and the long argument."
  S04:
    title: "Samples, averages and spread"
    l1: "A street where the mean income is high and nobody is rich but one."
    l2: "Mean, median, spread and skew: four numbers and what each hides."
    l3: "Confidence intervals: what a margin of error actually says."
    l4: "Whether the average is a useful object at all: the distributional objection."
  S05:
    title: "Incentives and how people answer them"
    l1: "A city that made the first hour of parking free and emptied its curbs."
    l2: "Price, salience and substitution: why a small fee can beat a large campaign."
    l3: "Measuring a response: before-and-after, control cities, and the elasticity estimate."
    l4: "Whether incentives crowd out motives: the blood-donation argument."
  S06:
    title: "Norms, groups and conformity"
    l1: "An office where nobody sits at the window table, and no rule says so."
    l2: "How a norm is enforced: watching, gossip, exclusion, and the cost of breaking it."
    l3: "The conformity experiments: Asch's lines, their replications, and their limits."
    l4: "Whether norms are chosen or inherited: two accounts of the same village."
  S07:
    title: "Cities, movement and where people settle"
    l1: "A tram line opened in 1890, and the houses that followed it out of town."
    l2: "Rent, commuting time and the trade-off that decides where people live."
    l3: "Reading a census: boundaries, undercounts, and the problem of comparison."
    l4: "Whether building more houses lowers rents: two readings of the same city."
  S08:
    title: "Work, wages and the labour market"
    l1: "A dockside where men waited each morning to be picked for a day's work."
    l2: "Supply, demand, bargaining power, and what sets a wage."
    l3: "The minimum wage studies: New Jersey, Pennsylvania, and the method that started a fight."
    l4: "Whether a minimum wage costs jobs: thirty years of contested estimates."
  S09:
    title: "Inequality and how it is measured"
    l1: "Two neighbourhoods three miles apart with an eleven-year gap in life expectancy."
    l2: "Income, wealth, mobility: three different inequalities and their different causes."
    l3: "The Gini coefficient and its rivals: what each measure is blind to."
    l4: "Whether inequality or poverty is the problem: the argument over the top one per cent."
  S10:
    title: "Judgement under uncertainty"
    l1: "A doctor, a test that is ninety-nine per cent accurate, and a rare disease."
    l2: "Base rates, anchoring and availability: three predictable errors."
    l3: "How the heuristics were demonstrated: the original problems and their replications."
    l4: "Whether people are irrational or merely economical: the two camps."
