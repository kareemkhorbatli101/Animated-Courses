<div class="content"><div class="section-title"><span class="num" id="sectionNum"></span><h2 id="sectionHeading"></h2></div><p class="intro" id="intro"></p><div class="concepts" id="concepts"></div><div id="exercises"></div><div class="note"><strong>Study tip</strong> · Say the rule in your own words after checking the answer. Explain why the correct choice works and why the distractors do not.</div><div class="footnav"><a id="prev"></a><a id="next"></a></div></div></div>

<script type="application/json" id="lesson-data">{"section":"1.3","title":"Double entry: debits and credits","subtitle":"Practise every journal-entry scenario in the chapter: the January transactions, both entries for the credit sale, and all six February transactions.","goal":"A.1.b · Apply normal-balance rules and record basic transactions.","heading":"Record both sides","intro":"All amounts below are in USD 000 unless the scenario says otherwise. Drag account choices into the debit and credit lines, or tap a choice and then its target. Each check explains the full entry, every account option, and the accounting-equation effect.","concepts":[{"icon":"D","title":"Debit increases","text":"Assets, expenses, and distributions to owners normally increase with a debit."},{"icon":"C","title":"Credit increases","text":"Liabilities, equity, and revenue normally increase with a credit."},{"icon":"✓","title":"Always balance","text":"For every journal entry, total debit amounts equal total credit amounts."}],"activities":[{"type":"match","icon":"ع","title":"English → Arabic term match","instruction":"Match the core account and journal terms.","pairs":[{"en":"Debit","ar":"مدين","why":"Debit is the left side of an account."},{"en":"Credit","ar":"دائن","why":"Credit is the right side of an account."},{"en":"Normal balance","ar":"الرصيد الطبيعي","why":"The normal balance is the side that increases an account."},{"en":"Journal entry","ar":"قيد اليومية","why":"A journal entry records the accounts and amounts affected by a transaction."},{"en":"Trial balance","ar":"ميزان المراجعة","why":"A trial balance lists account balances and checks that debit and credit totals agree."},{"en":"Contra account","ar":"حساب مقابل (حساب عكسي)","why":"A contra account offsets a related account and normally has the opposite balance."},{"en":"Accounts receivable","ar":"الذمم المدينة (المدينون)","why":"Accounts receivable records amounts customers owe the entity."},{"en":"Accounts payable","ar":"الذمم الدائنة (الدائنون)","why":"Accounts payable records amounts the entity owes suppliers."}]},{"type":"journal","icon":"↔","title":"Journal entry · Buy equipment for cash","instruction":"Choose one debit account and one credit account. Three plausible accounts are provided for each side.","scenario":"Orontes buys a bottling line for $1,200 and pays cash.","arabic":"اشترت شركة أورونتس خطّ تعبئة بمبلغ 1,200 دولار ودفعت نقداً.","amount":"1,200","debit":"Equipment","credit":"Cash","equation":"Total assets do not change: equipment increases by 1,200 and cash decreases by 1,200.","logic":"Equipment is an asset and increases with a debit. Cash is an asset and decreases with a credit. This purchase is not an immediate expense.","debitChoices":[{"name":"Equipment","reason":"Correct. Equipment is an asset; the asset increases with a debit."},{"name":"Cash","reason":"Cash is not the asset received. Cash is paid and decreases, so it is credited."},{"name":"Equipment expense","reason":"The purchase creates an equipment asset; its cost is recognized as depreciation over time."}],"creditChoices":[{"name":"Cash","reason":"Correct. Cash is paid, so the cash asset decreases with a credit."},{"name":"Notes payable","reason":"No borrowing occurred; the scenario says the company paid cash."},{"name":"Sales revenue","reason":"The company did not make a sale or earn revenue."}]},{"type":"journal","icon":"↔","title":"Journal entry · Borrow cash","instruction":"Build the entry and read the accounting equation effect.","scenario":"Orontes borrows $800 cash by signing a five-year note payable.","arabic":"اقترضت أورونتس مبلغ 800 دولار نقداً مقابل توقيع سند لأجل خمس سنوات.","amount":"800","debit":"Cash","credit":"Notes payable","equation":"Assets increase by 800 and liabilities increase by 800; equity is unchanged.","logic":"Cash is an asset that increases with a debit. Notes payable is a liability that increases with a credit. Borrowing is financing, not revenue.","debitChoices":[{"name":"Cash","reason":"Correct. Cash received increases an asset, so debit Cash."},{"name":"Interest expense","reason":"The borrowing itself is not interest expense; interest accrues over time."},{"name":"Notes payable","reason":"Notes payable is the obligation created and increases with a credit."}],"creditChoices":[{"name":"Notes payable","reason":"Correct. The liability increases with a credit."},{"name":"Sales revenue","reason":"Borrowing is not a sale and does not create revenue."},{"name":"Cash","reason":"Cash was received and increases with a debit, not a credit."}]},{"type":"journal","icon":"↔","title":"Journal entry · Sell on credit","instruction":"Choose the receivable and revenue accounts. Cash has not been collected yet.","scenario":"Orontes delivers olive oil to a customer and invoices $300 for the sale.","arabic":"سلّمت أورونتس زيت زيتون إلى عميل وأصدرت فاتورة بيع بمبلغ 300 دولار.","amount":"300","debit":"Accounts receivable","credit":"Sales revenue","equation":"Assets increase by 300 and equity increases through revenue; cash does not change yet.","logic":"The customer now owes the company, so Accounts receivable increases with a debit. The sale earns revenue, which increases equity and has a credit balance. (The cost of inventory would be recorded in a separate entry.)","debitChoices":[{"name":"Accounts receivable","reason":"Correct. The customer owes the invoice amount; the receivable asset increases."},{"name":"Cash","reason":"Cash has not been received yet."},{"name":"Sales revenue","reason":"Revenue increases with a credit; it is not the debit account here."}],"creditChoices":[{"name":"Sales revenue","reason":"Correct. Earned revenue increases with a credit."},{"name":"Accounts payable","reason":"The company does not owe a supplier in this sales transaction."},{"name":"Accounts receivable","reason":"The receivable asset increases with a debit."}]},{"type":"journal","icon":"↔","title":"Journal entry · Issue common shares","instruction":"This is a compound entry: place one debit and both credit accounts in the journal lines.","scenario":"Orontes issues 100,000 common shares with $1 par value for $15 per share, receiving cash.","arabic":"أصدرت أورونتس 100,000 سهم عادي بقيمة اسمية دولار واحد للسهم، وقبضت 15 دولاراً نقداً عن كل سهم.","amount":"1,500 total (USD 000)","debitAmount":"1,500","creditAmount":"100","creditExtraAmount":"1,400","debit":"Cash","credit":"Common stock","creditExtra":"Additional paid-in capital","entry":"Debit Cash 1,500; Credit Common Stock 100; Credit Additional Paid-in Capital 1,400 (USD 000).","equation":"Assets increase by 1,500 and equity increases by 1,500. The entry balances: 1,500 debit = 100 + 1,400 credit.","logic":"Cash increases for the full proceeds. Common stock is recorded at par value (100,000 shares × $1 = $100,000, or 100 in USD 000). The amount received above par is additional paid-in capital (1,400 in USD 000).","debitChoices":[{"name":"Cash","reason":"Correct. The company receives the share proceeds, increasing cash by 1,500."},{"name":"Accounts receivable","reason":"The shares were issued for cash; no customer owes this amount."},{"name":"Equipment","reason":"The company received cash from shareholders, not equipment."}],"creditChoices":[{"name":"Common stock","reason":"Correct. Record the shares’ par value: 100,000 × $1 = $100,000, or 100 in USD 000."},{"name":"Sales revenue","reason":"Issuing shares is an owner investment, not revenue from operations."},{"name":"Notes payable","reason":"The proceeds came from shareholders, not from borrowing."}],"creditExtraChoices":[{"name":"Additional paid-in capital","reason":"Correct. The excess proceeds above par, 1,400 in USD 000, are additional paid-in capital."},{"name":"Retained earnings","reason":"This amount is contributed capital, not accumulated earnings."},{"name":"Dividends payable","reason":"No dividend was declared in this transaction."}]},{"type":"journal","icon":"↔","title":"Journal entry · Record cost of goods sold","instruction":"This is the second entry for the January 18 credit sale; record the inventory cost.","scenario":"The olive oil sold on credit had cost Orontes $180 (USD 000). Record the cost when the goods are sold.","arabic":"بلغت تكلفة زيت الزيتون الذي باعته أورونتس بالآجل 180 (بالآلاف). سجّل التكلفة عند بيع البضاعة.","amount":"180","debit":"Cost of goods sold","credit":"Inventory","entry":"Debit Cost of Goods Sold 180; Credit Inventory 180 (USD 000).","equation":"Assets decrease by 180 and equity decreases by 180 through expense; liabilities do not change.","logic":"The inventory is no longer held by the company, so Inventory decreases with a credit. The related cost is recognized as Cost of Goods Sold in the same period as the sales revenue.","debitChoices":[{"name":"Cost of goods sold","reason":"Correct. This expense records the cost of the inventory sold and reduces net income."},{"name":"Inventory","reason":"Inventory is the asset that decreases; it is credited, not debited."},{"name":"Accounts receivable","reason":"Accounts receivable records the sale price owed by the customer in the separate revenue entry."}],"creditChoices":[{"name":"Inventory","reason":"Correct. The goods leave inventory, so the asset decreases with a credit."},{"name":"Sales revenue","reason":"Sales revenue was recorded in the other entry; this entry records the inventory cost."},{"name":"Accounts payable","reason":"This entry records goods sold, not a new supplier obligation."}]},{"type":"journal","icon":"↔","title":"Journal entry · Pay January wages","instruction":"Choose the wage expense and the cash account.","scenario":"Orontes pays $40 (USD 000) of January wages to plant workers in cash.","arabic":"دفعت أورونتس أجور عمال المصنع لشهر يناير نقداً بمبلغ 40 (بالآلاف).","amount":"40","debit":"Wages expense","credit":"Cash","entry":"Debit Wages Expense 40; Credit Cash 40 (USD 000).","equation":"Assets decrease by 40 and equity decreases by 40 through the wage expense.","logic":"The employees performed the work in January, so the wage cost is an expense of that period. Paying cash reduces the cash asset.","debitChoices":[{"name":"Wages expense","reason":"Correct. The workers’ service is a January operating expense, which increases with a debit."},{"name":"Wages payable","reason":"The scenario says the wages were paid; no unpaid liability remains."},{"name":"Retained earnings","reason":"Wages are recorded as an expense; net income then flows into retained earnings."}],"creditChoices":[{"name":"Cash","reason":"Correct. Cash is paid and decreases with a credit."},{"name":"Accounts payable","reason":"The payment is wages to employees, not an amount owed to a supplier."},{"name":"Wages expense","reason":"Wages expense increases with a debit, not a credit."}]},{"type":"journal","icon":"↔","title":"Journal entry · Declare a dividend","instruction":"Record the declaration now; the cash will be paid later.","scenario":"On January 31, the board declares a $50 (USD 000) cash dividend, payable February 15.","arabic":"في 31 يناير، أعلن مجلس الإدارة توزيعات نقدية بمبلغ 50 (بالآلاف) تُدفع في 15 فبراير.","amount":"50","debit":"Retained earnings (dividends declared)","credit":"Dividends payable","entry":"Debit Retained Earnings (Dividends Declared) 50; Credit Dividends Payable 50 (USD 000).","equation":"Liabilities increase by 50 and equity decreases by 50. Cash does not change on the declaration date; net income is unchanged.","logic":"The declaration creates an obligation to shareholders and reduces retained earnings. A dividend is a distribution, not an expense.","debitChoices":[{"name":"Retained earnings (dividends declared)","reason":"Correct. Declaring a dividend is a distribution to owners that reduces retained earnings."},{"name":"Wages expense","reason":"No employee service or wage cost is involved."},{"name":"Cash","reason":"Cash is not paid until February 15, so it does not change on the declaration date."}],"creditChoices":[{"name":"Dividends payable","reason":"Correct. The declared but unpaid dividend is a liability."},{"name":"Sales revenue","reason":"A dividend is not earned revenue."},{"name":"Cash","reason":"The dividend has only been declared; it has not yet been paid."}]},{"type":"journal","icon":"↔","title":"Journal entry · Pay the supplier","instruction":"Settle part of an existing payable; do not record the purchase again.","scenario":"On February 3, Orontes pays a supplier $150 (USD 000) for olives bought on credit in January.","arabic":"في 3 فبراير، دفعت أورونتس للمورّد 150 (بالآلاف) مقابل زيتون اشترته بالآجل في يناير.","amount":"150","debit":"Accounts payable","credit":"Cash","entry":"Debit Accounts Payable 150; Credit Cash 150 (USD 000).","equation":"Assets decrease by 150 and liabilities decrease by 150; equity is unchanged.","logic":"The purchase was recorded when the olives were bought. The later payment reduces the payable and cash; it does not create a second inventory expense.","debitChoices":[{"name":"Accounts payable","reason":"Correct. Paying the supplier settles and reduces the existing liability with a debit."},{"name":"Inventory","reason":"The goods were purchased and recorded earlier; this transaction pays the existing balance."},{"name":"Cost of goods sold","reason":"Payment of a payable is not the event that recognizes cost of goods sold."}],"creditChoices":[{"name":"Cash","reason":"Correct. Cash is paid, so the asset decreases with a credit."},{"name":"Accounts receivable","reason":"The company is paying a supplier, not collecting from a customer."},{"name":"Sales revenue","reason":"No sale occurs when settling a supplier payable."}]},{"type":"journal","icon":"↔","title":"Journal entry · Collect from a customer","instruction":"Collect part of an existing receivable.","scenario":"On February 8, Orontes collects $200 (USD 000) from GreenBasket against the January invoice.","arabic":"في 8 فبراير، قبضت أورونتس 200 (بالآلاف) من متجر غرين باسكت مقابل جزء من فاتورة يناير.","amount":"200","debit":"Cash","credit":"Accounts receivable","entry":"Debit Cash 200; Credit Accounts Receivable 200 (USD 000).","equation":"One asset increases by 200 and another asset decreases by 200; total assets and equity are unchanged.","logic":"Cash is received, so Cash is debited. The customer’s amount owed is reduced, so Accounts Receivable is credited. Revenue was recorded when the sale was made.","debitChoices":[{"name":"Cash","reason":"Correct. The collection increases the cash asset."},{"name":"Sales revenue","reason":"Revenue was recorded when the goods were delivered, not when the receivable is collected."},{"name":"Accounts payable","reason":"This is a customer collection, not payment to a supplier."}],"creditChoices":[{"name":"Accounts receivable","reason":"Correct. The customer owes less after paying, so the receivable decreases with a credit."},{"name":"Sales revenue","reason":"The cash collection settles an existing receivable; it does not record revenue again."},{"name":"Cash","reason":"Cash increases with a debit, not a credit."}]},{"type":"journal","icon":"↔","title":"Journal entry · Pay rent in advance","instruction":"The payment covers 12 months; the unused months are a future benefit.","scenario":"On February 10, Orontes pays $24 (USD 000) for 12 months of warehouse rent in advance.","arabic":"في 10 فبراير، دفعت أورونتس 24 (بالآلاف) إيجاراً مقدماً للمستودع لمدة 12 شهراً.","amount":"24","debit":"Prepaid rent","credit":"Cash","entry":"Debit Prepaid Rent 24; Credit Cash 24 (USD 000).","equation":"One asset increases by 24 and cash, another asset, decreases by 24; total assets do not change at the payment date.","logic":"The rent benefit covers future months, so record a prepaid expense asset first. Recognize rent expense as the space is used.","debitChoices":[{"name":"Prepaid rent","reason":"Correct. The payment creates a future benefit, recorded as an asset that increases with a debit."},{"name":"Rent expense","reason":"At the payment date the 12-month benefit has not all been used; recognize expense over time."},{"name":"Accounts payable","reason":"The rent is paid in cash, so no unpaid liability is created."}],"creditChoices":[{"name":"Cash","reason":"Correct. Cash is paid and decreases with a credit."},{"name":"Prepaid rent","reason":"The prepaid asset increases with a debit."},{"name":"Contract liability","reason":"This is a payment by Orontes for future rent, not cash received from a customer."}]},{"type":"journal","icon":"↔","title":"Journal entry · Receive a customer advance","instruction":"Cash arrived before Orontes delivered the pastries.","scenario":"On February 12, a Dubai hotel group pays Orontes $60 (USD 000) in advance for pastries to be delivered in March.","arabic":"في 12 فبراير، دفعت مجموعة فنادق في دبي 60 (بالآلاف) مقدماً لأورونتس مقابل معجنات ستُسلَّم في مارس.","amount":"60","debit":"Cash","credit":"Contract liability (unearned revenue)","entry":"Debit Cash 60; Credit Contract Liability (Unearned Revenue) 60 (USD 000).","equation":"Assets increase by 60 and liabilities increase by 60; equity and revenue do not change yet.","logic":"Cash increases, but the company still owes the goods. Record a contract liability until the pastries are delivered and the revenue is earned.","debitChoices":[{"name":"Cash","reason":"Correct. Cash received increases an asset with a debit."},{"name":"Accounts receivable","reason":"The customer has already paid; no receivable is due."},{"name":"Sales revenue","reason":"The delivery has not happened, so the revenue is not yet earned."}],"creditChoices":[{"name":"Contract liability (unearned revenue)","reason":"Correct. The company has an obligation to deliver goods in March."},{"name":"Sales revenue","reason":"The pastries have not yet been delivered; cash received in advance is not revenue yet."},{"name":"Accounts payable","reason":"The obligation is to the customer, not to a supplier."}]},{"type":"journal","icon":"↔","title":"Journal entry · Pay the declared dividend","instruction":"This is the later payment of the dividend declared in January.","scenario":"On February 15, Orontes pays the $50 (USD 000) dividend that it declared on January 31.","arabic":"في 15 فبراير، دفعت أورونتس توزيعات الأرباح البالغة 50 (بالآلاف) التي أعلنتها في 31 يناير.","amount":"50","debit":"Dividends payable","credit":"Cash","entry":"Debit Dividends Payable 50; Credit Cash 50 (USD 000).","equation":"Assets decrease by 50 and liabilities decrease by 50; equity does not change again on the payment date.","logic":"The declaration already reduced retained earnings and created a payable. Payment settles that liability; do not record a second dividend reduction.","debitChoices":[{"name":"Dividends payable","reason":"Correct. The payable created at declaration is settled and reduced with a debit."},{"name":"Retained earnings","reason":"Retained earnings decreased when the dividend was declared; payment settles the liability."},{"name":"Dividends expense","reason":"Dividends are distributions to owners, not expenses."}],"creditChoices":[{"name":"Cash","reason":"Correct. Cash is paid and decreases with a credit."},{"name":"Dividends payable","reason":"The payable decreases with a debit, not a credit."},{"name":"Accounts payable","reason":"This liability is owed to shareholders, not a supplier."}]},{"type":"journal","icon":"↔","title":"Journal entry · Accrue interest","instruction":"Record interest incurred even though Orontes has not paid it yet.","scenario":"On February 28, Orontes records one month of unpaid interest on the bank note: $4 (USD 000).","arabic":"في 28 فبراير، سجّلت أورونتس فائدة شهر واحد غير مدفوعة على سند البنك بمبلغ 4 (بالآلاف).","amount":"4","debit":"Interest expense","credit":"Interest payable","entry":"Debit Interest Expense 4; Credit Interest Payable 4 (USD 000).","equation":"Liabilities increase by 4 and equity decreases by 4 through expense; cash does not change yet.","logic":"The borrowing cost belongs to February even though cash has not been paid. Record the expense and the accrued liability in the same period.","debitChoices":[{"name":"Interest expense","reason":"Correct. Interest was incurred in February and increases expense with a debit."},{"name":"Notes payable","reason":"The principal balance is not being repaid or increased in this scenario."},{"name":"Cash","reason":"No cash payment has occurred yet."}],"creditChoices":[{"name":"Interest payable","reason":"Correct. The unpaid interest creates an accrued liability."},{"name":"Cash","reason":"Interest is unpaid, so cash has not changed."},{"name":"Accounts payable","reason":"Interest owed to the bank is recorded as interest payable, not a trade payable to a supplier."}]}]}</script><script src="lesson.js"></script>
