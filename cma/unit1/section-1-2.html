"section":"1.2","title":"The building blocks: elements and the accounting equation","subtitle":"Every reported amount belongs to an accounting element. The accounting equation keeps the balance sheet in balance.","goal":"A.1.b · Classify the basic elements and apply Assets = Liabilities + Equity.","heading":"Start with the elements","intro":"Assets, liabilities, and equity describe the company at a date. Revenues, expenses, gains, losses, and owner transactions explain changes during a period. Equity is the residual claim after liabilities are deducted from assets.","concepts":[{"icon":"▣","title":"At a date","text":"Assets are present rights to economic benefits; liabilities are present obligations; equity is the residual interest."},{"icon":"↗","title":"During a period","text":"Revenue and expense arise from central operations. Gains and losses arise from peripheral or incidental events."},{"icon":"↔","title":"Owner activity","text":"Owner investments increase equity. Distributions, such as dividends, decrease equity but are not expenses."}],

{"type":"cloze","icon":"✎","title":"Complete the accounting rules","instruction":"Drag the missing words into the blanks.","parts":["The accounting equation is Assets = "," + ",". Wages paid to plant workers are an ",". A cash dividend is a "," to owners, not an expense."],"words":["Liabilities","Equity","Expense","Distribution"],"answers":[{"word":"Liabilities","hint":"equation","why":"Assets are financed by liabilities and equity: Assets = Liabilities + Equity."},{"word":"Equity","hint":"equation","why":"Equity is the owners’ residual claim in the equation."},{"word":"Expense","hint":"account type","why":"Wages are a cost of operations, so they are an expense."},{"word":"Distribution","hint":"owner activity","why":"A dividend is a distribution to owners. It reduces equity, not net income."}]},
