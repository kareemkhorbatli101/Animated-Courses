<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appendix A · Glossary — CMA Part 1 Book 1</title>
<meta name="description" content="Appendix A — the glossary of CMA Part 1 Section A terms in English and Arabic, searchable, with pronunciation.">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<a class="skip" href="#content">Skip to the glossary</a>
<main id="main">
<div class="wrap">
  <nav class="crumb" aria-label="Breadcrumb"><a href="index.html">Book</a>
    <span class="crumb-sep">/</span><span class="crumb-here">Appendix A · Glossary</span></nav>
  <header class="page-hero">
    <p class="eyebrow">Appendix A</p>
    <h1>Glossary</h1>
    <p class="page-question"><strong>English and Arabic.</strong> Type in the box to filter by either language,
      or by meaning. Every row has a 🔊 icon in both languages, and each term links to the section that defines it.</p>
  </header>

  <div class="glossary-controls">
    <input class="glossary-search" id="q" type="search" placeholder="Search in English, Arabic, or by meaning…"
           aria-label="Search the glossary" autocomplete="off">
    <span class="glossary-count" id="count"></span>
  </div>

  <div id="content" class="table-scroll"></div>

  <p class="fig-note" id="scopeNote"></p>
</div>
</main>

<script src="assets/ledger.js"></script>
<script src="assets/terms-ch01.js"></script>
<script src="assets/speech.js"></script>
<script src="assets/progress.js"></script>
<script>
window.PAGE = { id: "glossary", kind: "hub", up: "", noHero: true, title: "Glossary" };
(function () {
  var T = window.TERMS, S = window.Speech;
  var host = document.getElementById("content");
  var q = document.getElementById("q");
  var count = document.getElementById("count");
  var rows = T.all.slice().sort(function (a, b) { return a.en.localeCompare(b.en); });

  document.getElementById("scopeNote").innerHTML =
    "This appendix currently holds the <strong>" + T.count + " terms of Chapter 1</strong> — the book's " +
    T.all.filter(function (t) { return t.bridge; }).length + " Term Bridge rows plus the terms the chapter " +
    "defines in its prose. It grows as each chapter is built. French is not carried here: translation work in " +
    "this site is English ↔ Arabic only.";

  function render(filter) {
    var f = String(filter || "").trim().toLowerCase();
    var show = rows.filter(function (t) {
      if (!f) return true;
      return t.en.toLowerCase().indexOf(f) >= 0 || t.ar.indexOf(filter.trim()) >= 0 ||
             String(t.gloss).toLowerCase().indexOf(f) >= 0 || t.sec.indexOf(f) >= 0;
    });
    count.textContent = show.length === rows.length
      ? rows.length + " terms"
      : show.length + " of " + rows.length + " terms";
    host.innerHTML = "";
    var table = document.createElement("table");
    table.className = "data-table gloss-table";
    table.innerHTML = "<thead><tr><th>English (exam term)</th><th>العربية</th><th>Meaning</th><th>Section</th></tr></thead>";
    var tb = document.createElement("tbody");
    show.forEach(function (t) {
      var tr = document.createElement("tr");
      var td1 = document.createElement("td");
      td1.className = "row-head";
      td1.appendChild(document.createTextNode(t.en));
      if (S) td1.appendChild(S.button(t.en, "en", "Pronounce in English"));
      var td2 = document.createElement("td");
      var ar = document.createElement("span");
      ar.className = "ar"; ar.setAttribute("lang", "ar"); ar.setAttribute("dir", "rtl");
      ar.textContent = t.ar;
      td2.appendChild(ar);
      if (S) td2.appendChild(S.button(t.ar, "ar", "Pronounce in Arabic"));
      var td3 = document.createElement("td");
      td3.textContent = t.gloss;
      var td4 = document.createElement("td");
      var a = document.createElement("a");
      a.className = "gloss-sec";
      a.href = "ch01/s1-" + t.sec.split(".")[1] + ".html";
      a.textContent = t.sec;
      td4.appendChild(a);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4);
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    if (!show.length) {
      host.innerHTML = '<p class="ans-note">No term matches that. Try part of a word, or an Arabic term.</p>';
      return;
    }
    host.appendChild(table);
  }
  q.addEventListener("input", function () { render(q.value); });
  render("");
})();
</script>
<script src="assets/chrome.js"></script>
</body>
</html>
