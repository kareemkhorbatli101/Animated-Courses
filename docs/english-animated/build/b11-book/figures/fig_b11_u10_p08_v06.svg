<rect x="402.0666666666666" y="190.25" width="125.86666666666666" height="31.05000000000001" rx="0" fill="#2E6F5E"/>
<text x="464.99999999999994" y="180.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">+27</text>
<rect x="598.7333333333332" y="174.14999999999998" width="125.86666666666666" height="16.100000000000023" rx="0" fill="#2E6F5E"/>
<text x="661.6666666666665" y="164.14999999999998" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">+14</text>
