<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>Three endings, one spelling</title>
<desc>Twelve past participles sorted into three groups by the sound of their -ed ending, with the stressed syllables marked.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="720" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
