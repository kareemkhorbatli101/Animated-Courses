<text x="240" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">propped</text>
<circle cx="358" cy="144" r="8" fill="#9AA7AE"/>
<text x="358" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">/t/</text>
<circle cx="240" cy="232" r="8" fill="#9AA7AE"/>
<text x="240" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">en</text>
<circle cx="358" cy="232" r="16" fill="#1F4E5F"/>
<text x="358" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">FORCED</text>
<circle cx="476" cy="232" r="8" fill="#9AA7AE"/>
<text x="476" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">/t/</text>
<circle cx="240" cy="320" r="8" fill="#9AA7AE"/>
<text x="240" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">re</text>
<circle cx="358" cy="320" r="16" fill="#1F4E5F"/>
<text x="358" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">VIEWED</text>
<circle cx="476" cy="320" r="8" fill="#9AA7AE"/>
<text x="476" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">/d/</text>
<circle cx="240" cy="408" r="16" fill="#1F4E5F"/>
<text x="240" y="454" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">SIGNED</text>
<circle cx="358" cy="408" r="8" fill="#9AA7AE"/>
<text x="358" y="454" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">/d/</text>
<circle cx="240" cy="496" r="8" fill="#9AA7AE"/>
<text x="240" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a</text>
<circle cx="358" cy="496" r="16" fill="#1F4E5F"/>
<text x="358" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">MEND</text>
<circle cx="476" cy="496" r="8" fill="#9AA7AE"/>
<text x="476" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">ed</text>
<circle cx="594" cy="496" r="8" fill="#9AA7AE"/>
<text x="594" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">/ɪd/</text>
<circle cx="240" cy="584" r="8" fill="#9AA7AE"/>
<text x="240" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">in</text>
<circle cx="358" cy="584" r="16" fill="#1F4E5F"/>
<text x="358" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">SPECT</text>
<circle cx="476" cy="584" r="8" fill="#9AA7AE"/>
<text x="476" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">ed</text>
<circle cx="594" cy="584" r="8" fill="#9AA7AE"/>
<text x="594" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">/ɪd/</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Three endings, one spelling</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The sound before the -ed decides. Not the letter.</text>
<text x="1340" y="170" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">after an unvoiced sound: /t/</text>
<text x="1340" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">after /s/: /t/</text>
<text x="1340" y="346" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">after a vowel: /d/</text>
<text x="1340" y="434" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">after /n/: /d/</text>
<text x="1340" y="522" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">after /d/: an extra syllable</text>
<text x="1340" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">after /t/: an extra syllable</text>
</g>
</svg>
