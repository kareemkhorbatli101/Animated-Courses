<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>Six ways to attach the same clause</title>
<desc>A sectioned diagram of six relative structures from spoken English to formal written English, with the same content at each level.</desc>
