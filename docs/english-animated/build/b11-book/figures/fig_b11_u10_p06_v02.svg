<rect x="170" y="218.33333333333331" width="560" height="98.33333333333333" rx="0" fill="#E4ECEF" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="316.66666666666663" width="560" height="98.33333333333333" rx="0" fill="#F2EDE2" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="415.0" width="560" height="98.33333333333333" rx="0" fill="#F6F0E4" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="513.3333333333333" width="560" height="98.33333333333333" rx="0" fill="#F6E6D6" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="611.6666666666666" width="560" height="98.33333333333333" rx="0" fill="#F3DCDC" stroke="#1C2B33" stroke-width="1.6"/>
<path d="M 730 120 L 740 146 L 720 172 L 740 198 L 720 224 L 740 250 L 720 276 L 740 302 L 720 328 L 740 354 L 720 380 L 740 406 L 720 432 L 740 458 L 720 484 L 740 510 L 720 536 L 740 562 L 720 588 L 740 614 L 720 640 L 740 666 L 720 692 L 730 710" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="20_subject">
<text x="190" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">by far / a great deal</text>
<text x="190" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;a great deal better than the going rate&quot;</text>
<text x="712" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">enormous</text>
<text x="190" y="250.33333333333331" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">much / far / considerably</text>
<text x="190" y="276.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;considerably better than she is on&quot;</text>
<text x="712" y="250.33333333333331" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">large</text>
<text x="190" y="348.66666666666663" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">somewhat / rather</text>
<text x="190" y="374.66666666666663" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;somewhat better&quot;</text>
<text x="712" y="348.66666666666663" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">moderate</text>
<text x="190" y="447.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">slightly / marginally</text>
<text x="190" y="473.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;slightly better&quot;</text>
<text x="712" y="447.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">small</text>
<text x="190" y="545.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">barely / if anything</text>
<text x="190" y="571.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;barely better, if anything&quot;</text>
<text x="712" y="545.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">almost none</text>
<text x="190" y="643.6666666666666" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">nowhere near / not nearly</text>
<text x="190" y="669.6666666666666" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;nowhere near what she should be on&quot;</text>
<text x="712" y="643.6666666666666" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">a gap, not a gain</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Sizing a gap, six ways</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same nine per cent, described at six strengths.</text>
<circle cx="736" cy="179.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 179.0 L 866 179.0 L 866 179.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="184.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Use this and you had better</text>
<text x="880" y="204.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">have the number</text>
<circle cx="736" cy="297.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 297.0 L 866 297.0 L 866 297.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The honest description of nine</text>
<text x="880" y="322.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">per cent</text>
<circle cx="736" cy="426.8" r="4.5" fill="#C86B2B"/>
<path d="M 736 426.8 L 866 426.8 L 866 426.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="431.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Safe, and says almost nothing</text>
<circle cx="736" cy="544.8" r="4.5" fill="#C86B2B"/>
<path d="M 736 544.8 L 866 544.8 L 866 544.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="549.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Nine per cent, framed as</text>
<text x="880" y="570.0999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">nothing</text>
<circle cx="736" cy="668.7" r="4.5" fill="#C86B2B"/>
<path d="M 736 668.7 L 866 668.7 L 866 668.7" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="673.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">This one is about a different</text>
<text x="880" y="694.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">comparison entirely</text>
</g>
