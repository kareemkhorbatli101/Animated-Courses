<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>What survives a handover</title>
<desc>A line chart showing retention of four kinds of knowledge — the normal case, the timing, the exceptions and the reasons — across two handovers and six months.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="460" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="610.0" x2="1350" y2="610.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="615.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0%</text>
<line x1="170" y1="495.0" x2="1350" y2="495.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="500.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">25%</text>
<line x1="170" y1="380.0" x2="1350" y2="380.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="385.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">50%</text>
<line x1="170" y1="265.0" x2="1350" y2="265.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="270.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">75%</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">100%</text>
</g>
<g id="20_subject">
<path d="M 170.0 150.0 L 563.3 186.8 L 956.7 214.4 L 1350.0 223.6" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="150.0" r="5" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<circle cx="563.3333333333333" cy="186.79999999999995" r="5" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<circle cx="956.6666666666666" cy="214.40000000000003" r="5" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<circle cx="1350.0" cy="223.60000000000002" r="5" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<text x="1364.0" y="228.60000000000002" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="start" font-weight="600" font-style="normal">the normal case</text>
<path d="M 170.0 150.0 L 563.3 283.4 L 956.7 407.6 L 1350.0 435.2" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="150.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="563.3333333333333" cy="283.40000000000003" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="956.6666666666666" cy="407.6" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1350.0" cy="435.2" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<text x="1364.0" y="440.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">when to do it, and why then</text>
<path d="M 170.0 150.0 L 563.3 389.2 L 956.7 522.6 L 1350.0 545.6" fill="none" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="150.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="563.3333333333333" cy="389.20000000000005" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="956.6666666666666" cy="522.6" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="1350.0" cy="545.6" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<text x="1364.0" y="550.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">what goes wrong, and what to do</text>
<path d="M 170.0 150.0 L 563.3 444.4 L 956.7 568.6 L 1350.0 600.8" fill="none" stroke="#A8372E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="150.0" r="5" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<circle cx="563.3333333333333" cy="444.4" r="5" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<circle cx="956.6666666666666" cy="568.6" r="5" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<circle cx="1350.0" cy="600.8" r="5" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<text x="1364.0" y="605.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="start" font-weight="600" font-style="normal">why it was designed that way</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What survives a handover</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same procedure, traced through two handovers and six months.</text>
<text x="170.0" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">taught</text>
<text x="563.3333333333333" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">handover 1</text>
<text x="956.6666666666666" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">handover 2</text>
<text x="1350.0" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">six months</text>
<rect x="170" y="670" width="1180" height="38" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="695" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">The bottom line is the part the author is usually proudest of.</text>
<text x="170" y="744.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">The normal case survives almost anything, because it is practised daily. The exceptions are</text>
<text x="170" y="765.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">met once a quarter and are gone in two handovers — which is exactly when somebody needs them</text>
<text x="170" y="787.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">and nobody is left who has seen one.</text>
</g>
</svg>
