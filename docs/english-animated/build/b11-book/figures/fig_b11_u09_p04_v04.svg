<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>Two accounts of one afternoon</title>
<desc>Two accounts of the same meeting side by side, agreeing on most facts and differing on sequence and emphasis.</desc>
