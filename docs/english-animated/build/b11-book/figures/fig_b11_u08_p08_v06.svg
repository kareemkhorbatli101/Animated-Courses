<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>Eleven shillings, and where they go</title>
<desc>A waterfall chart breaking an eleven-shilling price premium into transport, cooperative fee, market levy, stall margin and the amount reaching the grower.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#FBF7F0"/>
</g>
