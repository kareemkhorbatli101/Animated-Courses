<text x="464.99999999999994" y="210.76923076923077" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">-1</text>
<rect x="598.7333333333332" y="270.3076923076923" width="125.86666666666666" height="31.846153846153868" rx="0" fill="#A8372E"/>
<text x="661.6666666666665" y="260.3076923076923" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">-1</text>
