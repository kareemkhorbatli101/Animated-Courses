<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>The same event, two first words</title>
<desc>A mirrored diagram showing an active and a passive version of the same sentence, with the agent visible in one and absent in the other.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="640" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
