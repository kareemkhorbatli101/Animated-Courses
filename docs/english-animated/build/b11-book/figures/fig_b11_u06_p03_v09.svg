<rect x="160" y="144" width="342.57142857142856" height="52" rx="5" fill="#C86B2B"/>
<text x="331.2857142857143" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">A tenant</text>
<rect x="508.57142857142856" y="144" width="400.66666666666663" height="52" rx="5" fill="#1F4E5F"/>
<text x="708.9047619047619" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">wedged open</text>
<rect x="915.2380952380952" y="144" width="458.76190476190476" height="52" rx="5" fill="#2E6F5E"/>
<text x="1144.6190476190475" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the fire door</text>
<rect x="160" y="344" width="418.34782608695656" height="52" rx="5" fill="#2E6F5E"/>
<text x="369.17391304347825" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">The fire door</text>
<rect x="584.3478260869565" y="344" width="471.3913043478261" height="52" rx="5" fill="#1F4E5F"/>
<text x="820.0434782608695" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">was wedged open</text>
<rect x="1061.7391304347825" y="344" width="312.26086956521743" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1217.8695652173913" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">(by a tenant)</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The same event, two first words</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The passive is not politer. It is a decision about what the sentence is about.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="522.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="549.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">by names the doer. with names the instrument. &quot;Wedged open by a tenant with an extinguisher&quot;</text>
<text x="184" y="571.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">— the extinguisher did not decide anything.</text>
</g>
