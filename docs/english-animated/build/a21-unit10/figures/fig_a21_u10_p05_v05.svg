<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>The notice of 3 June</title>
<desc>A market notice announcing a change to opening hours, with the objection procedure, the deadline and a very long sentence marked.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="790" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="790" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">PASAR CHOW KIT  -  NOTICE TO ALL TRADERS</text>
<text x="140" y="214" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Posted</text>
<text x="410" y="214" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3 June, board by the office</text>
<text x="140" y="246" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Vote</text>
<text x="410" y="246" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Thursday 18 June, 11.00</text>
<line x1="130" y1="278" x2="910" y2="278" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="314" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE PROPOSED RULE</text>
<text x="140" y="344.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">From 1 August the market will open at 05.00 rather than 04.00,</text>
<text x="140" y="365.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">with the exception of the fish and ice bays which may open at</text>
<text x="140" y="387.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">04.30 subject to a separate application being made in writing to</text>
<text x="140" y="409.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the office not later than fourteen days before the date on which</text>
<text x="140" y="431.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the trader wishes the arrangement to commence.</text>
<text x="140" y="466.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Words in that sentence</text>
<text x="410" y="466.75" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">41</text>
<line x1="130" y1="498.75" x2="910" y2="498.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="534.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">IF YOU WISH TO OBJECT</text>
<text x="140" y="564.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">How</text>
<text x="410" y="564.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">in writing, to the office</text>
<text x="140" y="596.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">By</text>
<text x="410" y="596.75" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">14 days from posting</text>
<text x="140" y="628.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Which is</text>
<text x="410" y="628.75" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">17 June</text>
<text x="140" y="660.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Objections received after this date will be recorded but will</text>
<text x="140" y="682.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">not be read to the meeting.</text>
<line x1="130" y1="718.25" x2="910" y2="718.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="750.25" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">THE WHOLE NOTICE:</text>
<text x="140" y="780.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">206 words. No headings. Nine point type. One copy, on one board,</text>
<text x="140" y="802.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">facing the office door.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The notice of 3 June</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two hundred and six words, one sentence of forty-one, and a board by the office.</text>
<circle cx="934" cy="199.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 199.0 L 1024 199.0 L 1024 199.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="204.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">One board, and you have to walk</text>
<text x="1040" y="224.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">past the office to see it</text>
<circle cx="934" cy="388.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 388.6 L 1024 388.6 L 1024 388.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="393.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Forty-one words, and the exception</text>
<text x="1040" y="413.90000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">is buried in the middle</text>
<circle cx="934" cy="609.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 609.8 L 1024 609.8 L 1024 609.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="614.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">In writing - which settles it for</text>
<text x="1040" y="635.0999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">three of the twelve</text>
<circle cx="934" cy="673.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 673.0 L 1024 673.0 L 1024 673.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="678.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Seventeenth. The vote is on the</text>
<text x="1040" y="698.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">eighteenth</text>
<circle cx="934" cy="736.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 736.2 L 1024 736.2 L 1024 736.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="741.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Recorded, but not read aloud</text>
<circle cx="934" cy="862.5999999999999" r="4.5" fill="#C86B2B"/>
<path d="M 934 862.5999999999999 L 1024 862.5999999999999 L 1024 862.5999999999999" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="867.5999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">One copy. The thing that caused</text>
<text x="1040" y="887.8999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">all of this</text>
</g>
</svg>
