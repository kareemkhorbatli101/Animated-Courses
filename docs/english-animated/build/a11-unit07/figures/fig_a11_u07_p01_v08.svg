<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>What goes with what</title>
<desc>Eight free-time activities in a ring with labelled lines joining the ones that share a quality, and two activities left unconnected.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="260" y1="480" x2="460" y2="680" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="360" y1="200" x2="260" y2="480" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="800" y1="180" x2="1100" y2="350" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="1180" y1="640" x2="840" y2="700" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="800" y1="180" x2="360" y2="200" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="1440" y1="250" x2="800" y2="180" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
</g>
<g id="20_subject">
<circle cx="360" cy="200" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="360" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">F</text>
<text x="360" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">football</text>
<text x="360" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">22 people</text>
<circle cx="260" cy="480" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="260" y="485" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">R</text>
<text x="260" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">running</text>
<text x="260" y="572" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">alone</text>
<circle cx="460" cy="680" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="460" y="685" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">C</text>
<text x="460" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">cycling</text>
<text x="460" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">alone, faster</text>
<circle cx="800" cy="180" r="54" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="800" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">M</text>
<text x="800" y="260" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">music</text>
<text x="800" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">alone or together</text>
<circle cx="1100" cy="350" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1100" y="355" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">D</text>
<text x="1100" y="422" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">dancing</text>
<text x="1100" y="442" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">together</text>
<circle cx="1180" cy="640" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1180" y="645" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">K</text>
<text x="1180" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">cooking</text>
<text x="1180" y="732" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">you can give it away</text>
<circle cx="840" cy="700" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="840" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">A</text>
<text x="840" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">drawing</text>
<text x="840" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">cheap and quiet</text>
<circle cx="1440" cy="250" r="48" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1440" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">H</text>
<text x="1440" y="324" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">hang out</text>
<text x="1440" y="344" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">no name for it</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What goes with what</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Eight things people do with a Saturday, and a line wherever two of them share something. Two have no line at all.</text>
<rect x="302.0" y="565.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="360.0" y="584.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nobody can talk to you</text>
<rect x="252.0" y="325.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="310.0" y="344.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">you come home tired</text>
<rect x="892.0" y="250.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="950.0" y="269.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">one makes the other possible</text>
<rect x="952.0" y="655.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1010.0" y="674.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">you have something at the end</text>
<rect x="522.0" y="175.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="580.0" y="194.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">both work with eleven people or with one</text>
<rect x="1062.0" y="200.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1120.0" y="219.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the only one with no equipment at all</text>
</g>
</svg>
