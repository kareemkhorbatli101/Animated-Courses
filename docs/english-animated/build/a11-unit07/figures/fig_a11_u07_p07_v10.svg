<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One sentence, four meanings</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same five words. The big circle moves, and the answer changes.</text>
<text x="1340" y="170" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">Who plays? - I do, not him</text>
<text x="1340" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">Do you watch? - no, I play</text>
<text x="1340" y="346" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">What do you play? - football, not tennis</text>
<text x="1340" y="434" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">When? - Saturday, not Sunday</text>
