<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>The form with no tense</title>
<desc>Two sentence diagrams of the same subordinate clause, the first in the ordinary present and the second in the mandative subjunctive with the bare verb.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="680" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="400.6666666666667" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="360.33333333333337" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">It is essential</text>
<rect x="566.6666666666667" y="144" width="212.97435897435898" height="52" rx="5" fill="#1F4E5F"/>
<text x="673.1538461538462" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">that</text>
<rect x="785.6410256410257" y="144" width="244.25641025641025" height="52" rx="5" fill="#C86B2B"/>
<text x="907.7692307692308" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">he</text>
<rect x="1035.897435897436" y="144" width="338.1025641025641" height="52" rx="5" fill="#2E6F5E"/>
<text x="1204.948717948718" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">is present</text>
<rect x="160" y="344" width="400.6666666666667" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="360.33333333333337" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">It is essential</text>
<rect x="566.6666666666667" y="344" width="212.97435897435898" height="52" rx="5" fill="#1F4E5F"/>
<text x="673.1538461538462" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">that</text>
<rect x="785.6410256410257" y="344" width="244.25641025641025" height="52" rx="5" fill="#C86B2B"/>
<text x="907.7692307692308" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">he</text>
<rect x="1035.897435897436" y="344" width="338.1025641025641" height="52" rx="5" fill="#2E6F5E"/>
<text x="1204.948717948718" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">be present</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The form with no tense</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same clause, twice. One of them agrees with its subject and one refuses to.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PRESENT</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">SUBJUNCTIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">no -s, no tense, no number: the form is about a state of affairs, not a moment</text>
</g>
</svg>
