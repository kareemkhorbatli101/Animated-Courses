<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<title>Article 9, every requirement weighed</title>
<desc>A port regulation annotated to show which of its requirements use the subjunctive, which have been enforced, and which were quietly rewritten in a later amendment.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1060" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="850" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="850" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">PORT REGULATION 1948  -  ARTICLE 9  -  WITH 2019 AMENDMENT</text>
<text x="140" y="214.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1948: &quot;It is essential that the harbourmaster be present at any</text>
<text x="140" y="235.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">meeting at which an inspection regime is ratified. It is</text>
<text x="140" y="257.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">advisable that notice be given.&quot;</text>
<text x="140" y="293.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2019: &quot;The harbourmaster shall attend or shall appoint a deputy</text>
<text x="140" y="315.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">in writing. Failing attendance or appointment, the ratification</text>
<text x="140" y="336.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">shall be void.&quot;</text>
<line x1="130" y1="372.5" x2="910" y2="372.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="140" y="376.5" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="396.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">IN THE REGULATION</text>
<text x="403.33333333333337" y="396.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">COUNT</text>
<text x="656.6666666666667" y="396.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ENFORCED</text>
<text x="150.0" y="426.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">REQUIREMENTS IN TOTAL</text>
<text x="403.33333333333337" y="426.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">214</text>
<text x="656.6666666666667" y="426.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<line x1="140" y1="436.5" x2="900" y2="436.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="456.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">USING THE SUBJUNCTIVE</text>
<text x="403.33333333333337" y="456.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">31</text>
<text x="656.6666666666667" y="456.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">6</text>
<line x1="140" y1="466.5" x2="900" y2="466.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="486.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ALSO IN THE 2019 TEXT</text>
<text x="403.33333333333337" y="486.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<text x="656.6666666666667" y="486.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<line x1="140" y1="496.5" x2="900" y2="496.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="516.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NEVER TESTED</text>
<text x="403.33333333333337" y="516.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">25</text>
<text x="656.6666666666667" y="516.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="526.5" x2="900" y2="526.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="546.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">DEROGATIONS SOUGHT SINCE 1961</text>
<text x="403.33333333333337" y="546.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<text x="656.6666666666667" y="546.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<line x1="140" y1="556.5" x2="900" y2="556.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="576.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ARTICLE 9: REQUIREMENTS</text>
<text x="403.33333333333337" y="576.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<text x="656.6666666666667" y="576.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="586.5" x2="900" y2="586.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="606.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ARTICLE 9: CONSEQUENCES STATED</text>
<text x="403.33333333333337" y="606.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<text x="656.6666666666667" y="606.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<line x1="140" y1="616.5" x2="900" y2="616.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="636.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2019: CONSEQUENCES STATED</text>
<text x="403.33333333333337" y="636.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="656.6666666666667" y="636.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<line x1="140" y1="646.5" x2="900" y2="646.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="674.5" x2="910" y2="674.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="710.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT EACH SENTENCE ACTUALLY REQUIRES</text>
<text x="140" y="740.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;it is essential that ... be&quot;</text>
<text x="410" y="740.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">absolute in tone, untested in fact</text>
<text x="140" y="772.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;it is advisable that ... be&quot;</text>
<text x="410" y="772.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">same verb form, no force at all</text>
<text x="140" y="804.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;shall attend&quot;</text>
<text x="410" y="804.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">written-in, with a consequence</text>
<text x="140" y="836.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;shall be void&quot;</text>
<text x="410" y="836.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the only sentence here a court could use</text>
<line x1="130" y1="868.5" x2="910" y2="868.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="890.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Two sentences in article 9 share a verb form and share nothing</text>
<text x="140" y="912.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">else. The 2019 text uses one verb form for both and says which</text>
<text x="140" y="934.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">is which.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Article 9, every requirement weighed</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two hundred and fourteen requirements, thirty-one subjunctives, six ever enforced.</text>
<circle cx="934" cy="188.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 188.0 L 1024 188.0 L 1024 188.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="193.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Two requirements, one verb form,</text>
<text x="1040" y="213.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">two different forces</text>
<circle cx="934" cy="324.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 324.0 L 1024 324.0 L 1024 324.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="329.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A consequence, in eleven words,</text>
<text x="1040" y="349.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">and article 9 has none</text>
<circle cx="934" cy="562.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 562.0 L 1024 562.0 L 1024 562.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="567.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Twenty-five rules kept by accident</text>
<text x="1040" y="587.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">for seventy-seven years</text>
<circle cx="934" cy="817.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 817.0 L 1024 817.0 L 1024 817.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="822.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The subjunctive marks the register</text>
<text x="1040" y="842.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">and not the force</text>
<circle cx="934" cy="936.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 936.0 L 1024 936.0 L 1024 936.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="941.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Only the last line could be used</text>
<text x="1040" y="961.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">by anybody</text>
</g>
</svg>
