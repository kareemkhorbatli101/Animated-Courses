<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Two hundred and fourteen requirements, six enforced</title>
<desc>An infographic of a port regulation showing its requirements, how many use the subjunctive, how many have been enforced and how many were rewritten in 2019.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="990" rx="0" fill="#FBF7F0"/>
</g>
