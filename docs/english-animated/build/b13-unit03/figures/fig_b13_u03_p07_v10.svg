<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>The rise that promises a disagreement</title>
<desc>Three pitch contours comparing admittedly with a rise, admittedly flat, and though in end position.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="680" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
