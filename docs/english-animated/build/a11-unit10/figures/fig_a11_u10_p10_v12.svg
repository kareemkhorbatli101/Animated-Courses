<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>One jacket, five months</title>
<desc>An infographic following one jacket across five months with bands for the price, the number of people who tried it on, the number sold and what the shop made.</desc>
