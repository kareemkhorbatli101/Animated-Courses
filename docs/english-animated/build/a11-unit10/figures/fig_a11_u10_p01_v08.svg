<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>One jacket, five numbers</title>
<desc>A jacket at the centre joined by labelled lines to five numbers: what it cost to make, what the shop paid, the first price, the sale price and what it is worth to the wearer.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="330" y1="200" x2="280" y2="580" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="280" y1="580" x2="800" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="400" x2="800" y2="140" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="800" y1="400" x2="1280" y2="230" stroke="#C86B2B" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="400" x2="1300" y2="600" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
<line x1="800" y1="400" x2="820" y2="700" stroke="#2E6F5E" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="62" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">J</text>
<text x="800" y="488" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">one jacket</text>
<text x="800" y="508" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the same object throughout</text>
<circle cx="330" cy="200" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="330" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="330" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">4 EUR</text>
<text x="330" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">to make it</text>
<circle cx="280" cy="580" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="280" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">22</text>
<text x="280" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">22 EUR</text>
<text x="280" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">what the shop paid</text>
<circle cx="800" cy="140" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="800" y="145" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">89</text>
<text x="800" y="212" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">89 EUR</text>
<text x="800" y="232" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">September to November</text>
<circle cx="1280" cy="230" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1280" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">39</text>
<text x="1280" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">39 EUR</text>
<text x="1280" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">1 December</text>
<circle cx="1300" cy="600" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1300" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">19</text>
<text x="1300" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">19 EUR</text>
<text x="1300" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6 January</text>
<circle cx="820" cy="700" r="52" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="820" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">?</text>
<text x="820" y="778" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">worth to you</text>
<text x="820" y="798" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">nobody knows this one</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One jacket, five numbers</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four of the five are known. The fifth is the only one that decides anything.</text>
<rect x="247.0" y="375.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="305.0" y="394.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">18 EUR, somewhere between</text>
<rect x="482.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="540.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">what it costs the shop to own it</text>
<rect x="742.0" y="255.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="800.0" y="274.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">11 people tried it on. Nobody bought it</text>
<rect x="982.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1040.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">sold in 4 minutes, untried</text>
<rect x="992.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1050.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">3 left, sold in 2 days</text>
<rect x="752.0" y="535.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="810.0" y="554.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and this is the only price that is yours</text>
</g>
</svg>
