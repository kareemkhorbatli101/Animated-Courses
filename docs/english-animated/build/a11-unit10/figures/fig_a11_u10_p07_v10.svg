<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>One ending, three sounds</title>
<desc>Three columns sorting regular past verbs that all end in -ed by the sound that ending makes, with the rule for each column underneath.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="112.0" y="130" width="442.6666666666667" height="460" rx="8" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="112.0" y="130" width="442.6666666666667" height="64" rx="8" fill="#1F4E5F"/>
<line x1="140.0" y1="532" x2="526.6666666666667" y2="532" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<rect x="578.6666666666667" y="130" width="442.6666666666667" height="460" rx="8" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="578.6666666666667" y="130" width="442.6666666666667" height="64" rx="8" fill="#2E6F5E"/>
<line x1="606.6666666666667" y1="532" x2="993.3333333333335" y2="532" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<rect x="1045.3333333333335" y="130" width="442.6666666666667" height="460" rx="8" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="1045.3333333333335" y="130" width="442.6666666666667" height="64" rx="8" fill="#C86B2B"/>
<line x1="1073.3333333333335" y1="532" x2="1460.0000000000002" y2="532" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
</g>
<g id="20_subject">
<text x="333.33333333333337" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">/t/</text>
<text x="333.33333333333337" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">asked</text>
<text x="333.33333333333337" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">looked</text>
<text x="333.33333333333337" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">stopped</text>
<text x="333.33333333333337" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">washed</text>
<text x="333.33333333333337" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">watched</text>
<text x="800.0000000000001" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">/d/</text>
<text x="800.0000000000001" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">tried</text>
<text x="800.0000000000001" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">opened</text>
<text x="800.0000000000001" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">called</text>
<text x="800.0000000000001" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">arrived</text>
<text x="800.0000000000001" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">played</text>
<text x="1266.6666666666667" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">/ɪd/</text>
<text x="1266.6666666666667" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">wanted</text>
<text x="1266.6666666666667" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">started</text>
<text x="1266.6666666666667" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">needed</text>
<text x="1266.6666666666667" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">decided</text>
<text x="1266.6666666666667" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">waited</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One ending, three sounds</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">All of these are spelled -ed. Only one of the three groups adds a beat to the word.</text>
<text x="333.33333333333337" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="middle" font-weight="600" font-style="normal">after a quiet sound, the ending stays quiet</text>
<text x="333.33333333333337" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">your voice is off for /k/ /p/ /sh/ /ch/, so it stays</text>
<text x="333.33333333333337" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">off - and no extra beat</text>
<text x="800.0000000000001" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">after a loud sound, the ending turns on</text>
<text x="800.0000000000001" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">your voice is on for a vowel and for /n/ /l/ /v/, so</text>
<text x="800.0000000000001" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">it stays on - still no beat</text>
<text x="1266.6666666666667" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="middle" font-weight="600" font-style="normal">after t or d, a whole syllable appears</text>
<text x="1266.6666666666667" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">two t sounds cannot touch, so English puts a vowel</text>
<text x="1266.6666666666667" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">between them - one extra beat</text>
</g>
</svg>
