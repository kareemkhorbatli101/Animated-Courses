<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Eight things, and the year each one changes</title>
<desc>Eight features of the train joined to the year each is expected to change - the engine, the tickets, the beds, the windows, the food, the staff, the route and the reason people book - with one marked by a question mark.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="340" y1="180" x2="800" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="240" y1="440" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="380" y1="680" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="800" y1="720" x2="800" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="1240" y1="660" x2="800" y2="400" stroke="#C86B2B" stroke-width="6" stroke-linecap="round"/>
<line x1="1340" y1="400" x2="800" y2="400" stroke="#A8372E" stroke-width="5" stroke-linecap="round"/>
<line x1="1180" y1="160" x2="800" y2="400" stroke="#D9A441" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="58" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">T</text>
<text x="800" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the train</text>
<text x="800" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">one object, eight answers</text>
<circle cx="340" cy="180" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="340" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">E</text>
<text x="340" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the engine</text>
<text x="340" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">electric by 2031</text>
<circle cx="240" cy="440" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="240" y="445" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">$</text>
<text x="240" y="512" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the tickets</text>
<text x="240" y="532" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">no paper by 2027</text>
<circle cx="380" cy="680" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="380" y="685" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">B</text>
<text x="380" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the beds</text>
<text x="380" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">refitted 2029</text>
<circle cx="800" cy="720" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="800" y="725" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">W</text>
<text x="800" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the windows</text>
<text x="800" y="812" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">unchanged since 1985</text>
<circle cx="1240" cy="660" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1240" y="665" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">F</text>
<text x="1240" y="732" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the food</text>
<text x="1240" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">machine, 2035</text>
<circle cx="1340" cy="400" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="1340" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="1340" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the staff</text>
<text x="1340" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">six to four, 2033</text>
<circle cx="1180" cy="160" r="52" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1180" y="165" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">?</text>
<text x="1180" y="238" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">why people book</text>
<text x="1180" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">no year, no plan</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Eight things, and the year each one changes</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Seven of the eight have a year on them. The eighth has a question mark, and it is the one the plan is really about.</text>
<rect x="512.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="570.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">2031 · the order is signed</text>
<rect x="462.0" y="405.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="520.0" y="424.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">2027 · already begun</text>
<rect x="532.0" y="525.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="590.0" y="544.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">2029 · costed</text>
<rect x="742.0" y="545.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="800.0" y="564.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">no plan, and no complaints either</text>
<rect x="962.0" y="515.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1020.0" y="534.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">2035 · saves 400,000 a year</text>
<rect x="1012.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1070.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">2033 · two fewer people</text>
<rect x="932.0" y="265.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="990.0" y="284.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">61 per cent say the dining car</text>
</g>
</svg>
