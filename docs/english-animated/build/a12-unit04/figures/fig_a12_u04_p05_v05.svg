<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>The family fare page</title>
<desc>The family fare page from the company website showing the offer, four conditions, definitions of child and adult, and a line about proof of relationship, with no definition of family anywhere.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="690" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="690" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">PRAIRIE LINE  -  FAMILY FARE</text>
<text x="140" y="224" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">TWO ADULTS AND UP TO THREE CHILDREN FOR THE PRICE OF TWO ADULTS</text>
<line x1="130" y1="254" x2="910" y2="254" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="290" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">CONDITIONS</text>
<rect x="140" y="302" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">NO.</text>
<text x="403.33333333333337" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">CONDITION</text>
<text x="656.6666666666667" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal"></text>
<text x="150.0" y="352" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="403.33333333333337" y="352" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ALL TRAVEL ON ONE BOOKING</text>
<text x="656.6666666666667" y="352" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="362" x2="900" y2="362" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="382" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<text x="403.33333333333337" y="382" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ALL TRAVEL TOGETHER, BOTH WAYS</text>
<text x="656.6666666666667" y="382" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="392" x2="900" y2="392" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="412" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="403.33333333333337" y="412" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">MAXIMUM THREE CHILDREN</text>
<text x="656.6666666666667" y="412" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="422" x2="900" y2="422" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="442" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<text x="403.33333333333337" y="442" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NOT VALID 20 DEC - 4 JAN</text>
<text x="656.6666666666667" y="442" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="452" x2="900" y2="452" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="480" x2="910" y2="480" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="516" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">DEFINITIONS</text>
<text x="140" y="546" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Child</text>
<text x="410" y="546" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2 to 15 inclusive</text>
<text x="140" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Infant (free)</text>
<text x="410" y="578" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">under 2</text>
<text x="140" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Adult</text>
<text x="410" y="610" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">16 and over</text>
<text x="140" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Family</text>
<text x="410" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">(not defined)</text>
<line x1="130" y1="674" x2="910" y2="674" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="696.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Proof of relationship may be requested.&quot; One line, at the</text>
<text x="140" y="717.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">bottom, in the same size as the rest. It is the only sentence on</text>
<text x="140" y="739.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the page that puts a person at a counter in charge of the</text>
<text x="140" y="761.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">answer.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The family fare page</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">It defines child. It defines adult. It never defines family.</text>
<circle cx="934" cy="202.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 202.8 L 1024 202.8 L 1024 202.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="207.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Two and three. The numbers are the</text>
<text x="1040" y="228.10000000000002" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">only thing that is certain</text>
<circle cx="934" cy="354.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 354.6 L 1024 354.6 L 1024 354.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="359.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Four conditions, and all four are</text>
<text x="1040" y="379.90000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">about the booking, not the people</text>
<circle cx="934" cy="534.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 534.0 L 1024 534.0 L 1024 534.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="539.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Two ages for child because</text>
<text x="1040" y="559.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">under-twos are free and sixteen is</text>
<text x="1040" y="579.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">an adult</text>
<circle cx="934" cy="603.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 603.0 L 1024 603.0 L 1024 603.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="608.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The word in the title, and it is</text>
<text x="1040" y="628.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">not defined anywhere</text>
<circle cx="934" cy="754.8000000000001" r="4.5" fill="#C86B2B"/>
<path d="M 934 754.8000000000001 L 1024 754.8000000000001 L 1024 754.8000000000001" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="759.8000000000001" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">May be requested. By whom, and on</text>
<text x="1040" y="780.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">what grounds?</text>
</g>
</svg>
