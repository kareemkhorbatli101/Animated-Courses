<g id="20_subject">
<text x="333.33333333333337" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">/s/</text>
<text x="333.33333333333337" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Dev's</text>
<text x="333.33333333333337" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Kate's</text>
<text x="333.33333333333337" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the guard's</text>
<text x="333.33333333333337" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">my aunt's</text>
<text x="333.33333333333337" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the cat's</text>
<text x="800.0000000000001" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">/z/</text>
<text x="800.0000000000001" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Sam's</text>
<text x="800.0000000000001" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Ruth's</text>
<text x="800.0000000000001" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">my brother's</text>
<text x="800.0000000000001" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the children's</text>
<text x="800.0000000000001" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the dog's</text>
<text x="1266.6666666666667" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">/ɪz/</text>
<text x="1266.6666666666667" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Ross's</text>
<text x="1266.6666666666667" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the nurse's</text>
<text x="1266.6666666666667" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">George's</text>
<text x="1266.6666666666667" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">my niece's</text>
<text x="1266.6666666666667" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the horse's</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One apostrophe, three sounds</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Exactly the rule you learned for plurals, and for he-she-it. The third time it is free.</text>
<text x="333.33333333333337" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="middle" font-weight="600" font-style="normal">after a quiet sound</text>
<text x="333.33333333333337" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the same rule as cats and works and asked - three</text>
<text x="333.33333333333337" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">units, one rule</text>
<text x="800.0000000000001" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">after a loud sound</text>
<text x="800.0000000000001" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">a vowel or /m/ /n/ /l/ /r/ before it, and your voice</text>
<text x="800.0000000000001" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">stays on</text>
<text x="1266.6666666666667" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="middle" font-weight="600" font-style="normal">after a hissing sound</text>
<text x="1266.6666666666667" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the word already ends in a hiss, so a vowel has to</text>
<text x="1266.6666666666667" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">come between</text>
</g>
</svg>
