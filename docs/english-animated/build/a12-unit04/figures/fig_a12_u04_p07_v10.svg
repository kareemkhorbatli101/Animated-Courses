<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>One apostrophe, three sounds</title>
<desc>Three columns of possessive forms sorted by the sound the ending makes, with the rule written under each.</desc>
