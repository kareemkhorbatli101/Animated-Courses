<text x="140" y="910.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;I do not follow the step from the second graph to the</text>
<text x="140" y="932.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">conclusion.&quot; The tutor said she could not answer it in the room,</text>
<text x="140" y="954.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">put it on the board, and opened the next session with it.</text>
<line x1="130" y1="989.75" x2="910" y2="989.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="1021.75" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">THANH, WHO HAS ASKED ONE QUESTION IN NINE WEEKS:</text>
<text x="140" y="1051.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;I write the question down first. By the time I have written it,</text>
<text x="140" y="1073.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">somebody else has asked something and the room has moved on. The</text>
<text x="140" y="1095.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">one I did ask was the one I had written the week before.&quot;</text>
