<text x="470.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">It's such a simple system.</text>
<text x="470.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">There are so many cameras because the coverage has to overlap.</text>
<rect x="815.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="887.6,199.2 940.4,199.2 980,435" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="889.6" y1="199.2" x2="938.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="980.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">It's too expensive to install ourselves.</text>
<text x="980.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">We don't have enough money to do it properly.</text>
