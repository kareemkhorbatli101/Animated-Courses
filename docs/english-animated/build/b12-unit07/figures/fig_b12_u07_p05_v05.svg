<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<title>The rota policy, and the rota</title>
<desc>A hospital night rota policy showing consecutive-shift limits, approval requirements and rest periods, alongside the actual rota with handwritten amendments.</desc>
