<text x="140" y="763.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">ADDED TO THE ROTA IN BIRO, BESIDE NIGHT 8:</text>
<text x="140" y="793.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;C says she is fine. - asked 02.40&quot;</text>
