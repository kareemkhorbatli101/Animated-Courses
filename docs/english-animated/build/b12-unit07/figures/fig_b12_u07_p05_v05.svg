<text x="150.0" y="509.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1 - 4</text>
<text x="403.33333333333337" y="509.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">printed rota</text>
<text x="656.6666666666667" y="509.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<line x1="140" y1="519.0" x2="900" y2="519.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
