<text x="150.0" y="569.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">7 - 9</text>
<text x="403.33333333333337" y="569.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">added by hand</text>
<text x="656.6666666666667" y="569.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">retrospectively</text>
<line x1="140" y1="579.0" x2="900" y2="579.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="599.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">10 - 11</text>
<text x="403.33333333333337" y="599.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">added by hand</text>
<text x="656.6666666666667" y="599.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">not recorded</text>
<line x1="140" y1="609.0" x2="900" y2="609.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="629.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">12</text>
<text x="403.33333333333337" y="629.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">on the printed rota</text>
<text x="656.6666666666667" y="629.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<line x1="140" y1="639.0" x2="900" y2="639.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="140" y="667.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Rest taken between nights</text>
<text x="410" y="667.0" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">9 h 20 avg</text>
<text x="140" y="699.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Night rate premium</text>
<text x="410" y="699.0" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">+33 %</text>
