<text x="1040" y="259.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three years, parts AND labour</text>
<circle cx="934" cy="301.70000000000005" r="4.5" fill="#C86B2B"/>
<path d="M 934 301.70000000000005 L 1024 301.70000000000005 L 1024 301.70000000000005" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
