<text x="1040" y="472.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Six months, and only one part</text>
<circle cx="934" cy="704.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 704.6 L 1024 704.6 L 1024 704.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="709.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The cheaper machine overtakes in</text>
<text x="1040" y="729.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">year nine</text>
<circle cx="934" cy="862.5999999999999" r="4.5" fill="#C86B2B"/>
<path d="M 934 862.5999999999999 L 1024 862.5999999999999 L 1024 862.5999999999999" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="867.5999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Seven words, and the compressor</text>
<text x="1040" y="887.8999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">costs 740</text>
