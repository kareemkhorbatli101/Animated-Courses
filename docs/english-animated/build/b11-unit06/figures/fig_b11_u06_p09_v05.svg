<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<title>The welcome email, and what it leaves out</title>
<desc>A welcome email sent to new tenants alongside a handwritten list of the unwritten rules a colleague told them in the first week.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="960" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="750" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="750" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">WELCOME TO JENGO HOUSE — sent to every new tenant</text>
<text x="140" y="214.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Welcome! Here is everything you need. Your key opens the street</text>
<text x="140" y="235.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">door and your own unit. Keys go back in the box by six. Wifi</text>
<text x="140" y="257.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">password is on the board. Bins are in the yard, separated into</text>
<text x="140" y="279.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">three. Any problems, message the group.</text>
<text x="140" y="325.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">— The Management</text>
<line x1="130" y1="355.0" x2="910" y2="355.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="391.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">What Grace told me in week one</text>
<rect x="140" y="403.0" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="423.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">#</text>
<text x="340.0" y="423.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE UNWRITTEN RULE</text>
<text x="530.0" y="423.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHO TELLS YOU</text>
<text x="720.0" y="423.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">HOW YOU FIND OUT</text>
<text x="150.0" y="453.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="340.0" y="453.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Never take the last desk by the window</text>
<text x="530.0" y="453.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a neighbour</text>
<text x="720.0" y="453.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a look</text>
<line x1="140" y1="463.0" x2="900" y2="463.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="483.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<text x="340.0" y="483.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">The third bin went two years ago; use the second</text>
<text x="530.0" y="483.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the cleaner</text>
<text x="720.0" y="483.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">after you use it</text>
<line x1="140" y1="493.0" x2="900" y2="493.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="513.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="340.0" y="513.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">The group chat is for problems, not chat</text>
<text x="530.0" y="513.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">nobody</text>
<text x="720.0" y="513.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">silence</text>
<line x1="140" y1="523.0" x2="900" y2="523.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="543.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<text x="340.0" y="543.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">If you book the room you clear the room</text>
<text x="530.0" y="543.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the next person</text>
<text x="720.0" y="543.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">passive aggression</text>
<line x1="140" y1="553.0" x2="900" y2="553.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="573.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">5</text>
<text x="340.0" y="573.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Mr Kamau is addressed as Mr Kamau</text>
<text x="530.0" y="573.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">everybody, instantly</text>
<text x="720.0" y="573.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">immediately</text>
<line x1="140" y1="583.0" x2="900" y2="583.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="603.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">6</text>
<text x="340.0" y="603.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Don't message the group after seven</text>
<text x="530.0" y="603.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">nobody</text>
<text x="720.0" y="603.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">nobody replies</text>
<line x1="140" y1="613.0" x2="900" y2="613.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="641.0" x2="910" y2="641.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="663.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">None of the six is written anywhere. Five of the six are enforced by somebody with no</text>
<text x="140" y="680.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">authority at all. The one rule in the welcome email that is actually followed — keys</text>
<text x="140" y="697.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">by six — is the one with a charge attached to it.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The welcome email, and what it leaves out</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Everything written down is on the left. Everything that matters is on the right.</text>
<circle cx="934" cy="210.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 210.0 L 1024 210.0 L 1024 210.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="215.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Six lines. Four of them are about</text>
<text x="1040" y="235.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">objects</text>
<circle cx="934" cy="270.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 270.0 L 1024 270.0 L 1024 270.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="275.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Signed by nobody in particular</text>
<circle cx="934" cy="420.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 420.0 L 1024 420.0 L 1024 420.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="425.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The welcome email is wrong about</text>
<text x="1040" y="445.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">the bins</text>
<circle cx="934" cy="495.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 495.0 L 1024 495.0 L 1024 495.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="500.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">&quot;Nobody tells you&quot; appears twice</text>
<circle cx="934" cy="585.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 585.0 L 1024 585.0 L 1024 585.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="590.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">This one is learned in a single</text>
<text x="1040" y="610.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">afternoon</text>
<circle cx="934" cy="780.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 780.0 L 1024 780.0 L 1024 780.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="785.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Authority and enforcement are in</text>
<text x="1040" y="805.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">different hands</text>
</g>
</svg>
