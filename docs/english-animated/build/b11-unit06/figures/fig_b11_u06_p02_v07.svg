<circle cx="520" cy="490" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="480.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">I have never been told what.</text>
<rect x="795.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="867.6,199.2 920.4,199.2 960,475" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
