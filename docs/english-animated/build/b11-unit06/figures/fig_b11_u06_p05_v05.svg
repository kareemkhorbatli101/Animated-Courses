<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
<title>The building rules notice</title>
<desc>A building rules notice listing nine rules with their dates, only one of which names an enforcement mechanism, and a final sentence reserving the right not to enforce.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1020" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="810" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="810" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">JENGO HOUSE · CONDITIONS OF OCCUPATION</text>
<text x="140" y="214" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Issued</text>
<text x="410" y="214" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">March 2019</text>
<text x="140" y="246" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Authority</text>
<text x="410" y="246" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">The Management</text>
<line x1="130" y1="278" x2="910" y2="278" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="140" y="282" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">#</text>
<text x="340.0" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">RULE</text>
<text x="530.0" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">SINCE</text>
<text x="720.0" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">IF BREACHED</text>
<text x="150.0" y="332" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="340.0" y="332" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Fire doors must not be propped open</text>
<text x="530.0" y="332" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2019</text>
<text x="720.0" y="332" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="342" x2="900" y2="342" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="362" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<text x="340.0" y="362" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Keys to be returned to the box by 18:00</text>
<text x="530.0" y="362" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2019</text>
<text x="720.0" y="362" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">replacement charged</text>
<line x1="140" y1="372" x2="900" y2="372" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="392" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="340.0" y="392" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">No cooking on the premises</text>
<text x="530.0" y="392" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2014</text>
<text x="720.0" y="392" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="402" x2="900" y2="402" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="422" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<text x="340.0" y="422" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Visitors to be signed in</text>
<text x="530.0" y="422" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2019</text>
<text x="720.0" y="422" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="432" x2="900" y2="432" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="452" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">5</text>
<text x="340.0" y="452" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">No storage in common parts</text>
<text x="530.0" y="452" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2014</text>
<text x="720.0" y="452" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="462" x2="900" y2="462" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="482" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">6</text>
<text x="340.0" y="482" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Music audible outside a unit after 19:00</text>
<text x="530.0" y="482" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2021</text>
<text x="720.0" y="482" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="492" x2="900" y2="492" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="512" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">7</text>
<text x="340.0" y="512" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Bicycles not to be brought above ground floor</text>
<text x="530.0" y="512" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2016</text>
<text x="720.0" y="512" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="522" x2="900" y2="522" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="542" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">8</text>
<text x="340.0" y="542" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Waste separated into the three bins</text>
<text x="530.0" y="542" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2022</text>
<text x="720.0" y="542" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="552" x2="900" y2="552" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="572" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">9</text>
<text x="340.0" y="572" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">The lift is not to be used during an alarm</text>
<text x="530.0" y="572" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2019</text>
<text x="720.0" y="572" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">—</text>
<line x1="140" y1="582" x2="900" y2="582" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="610" x2="910" y2="610" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="646" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">General</text>
<text x="140" y="676.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">These conditions form part of the occupation agreement.</text>
<text x="140" y="697.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Occupiers are reminded that the common parts are maintained for</text>
<text x="140" y="719.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the benefit of all.</text>
<line x1="130" y1="755.25" x2="910" y2="755.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="777.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">The Management reserves the right to vary, waive or not enforce any of these</text>
<text x="140" y="794.65" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">conditions at its discretion, and no failure to enforce shall constitute a waiver of</text>
<text x="140" y="812.05" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">the right to enforce subsequently. Queries to the managing agent.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The building rules notice</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Nine rules. One has teeth. One sentence at the bottom removes them.</text>
<circle cx="934" cy="298.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 298.2 L 1024 298.2 L 1024 298.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="303.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Rule 1. No consequence of any kind</text>
<circle cx="934" cy="338.70000000000005" r="4.5" fill="#C86B2B"/>
<path d="M 934 338.70000000000005 L 1024 338.70000000000005 L 1024 338.70000000000005" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="343.70000000000005" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The only rule with teeth — and it</text>
<text x="1040" y="364.00000000000006" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">is about money</text>
<circle cx="934" cy="379.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 379.2 L 1024 379.2 L 1024 379.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="384.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">2014. Nobody now in the building</text>
<text x="1040" y="404.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">was here</text>
<circle cx="934" cy="492.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 492.6 L 1024 492.6 L 1024 492.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="497.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">2022, and already ignored</text>
<circle cx="934" cy="703.1999999999999" r="4.5" fill="#C86B2B"/>
<path d="M 934 703.1999999999999 L 1024 703.1999999999999 L 1024 703.1999999999999" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="708.1999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">&quot;Reminded&quot; — the softest verb</text>
<text x="1040" y="728.4999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">available</text>
<circle cx="934" cy="849.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 849.0 L 1024 849.0 L 1024 849.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="854.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Here is the sentence that unmakes</text>
<text x="1040" y="874.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">the notice</text>
<circle cx="934" cy="889.5" r="4.5" fill="#C86B2B"/>
<path d="M 934 889.5 L 1024 889.5 L 1024 889.5" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="894.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">…and here is the one that keeps it</text>
<text x="1040" y="914.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">alive anyway</text>
</g>
</svg>
