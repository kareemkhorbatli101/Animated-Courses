<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
<title>Six weeks, nine questions, one gap</title>
<desc>An infographic of a survey from the brief through the fieldwork to publication, showing what was asked, who was asked and what was found afterwards.</desc>
