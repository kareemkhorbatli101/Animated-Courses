<text x="480.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">He asked how deep the water had been.</text>
<text x="480.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">He told them not to guess.</text>
<rect x="805.0" y="140" width="330" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="877.6,179.6 930.4,179.6 970,435" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
