<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Seven o'clock at the stall</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">He buys for a cafe. She has sold here for nineteen years. Neither says the real question.</text>
<rect x="355.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="427.6,199.2 480.4,199.2 520,455" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="429.6" y1="199.2" x2="478.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="520.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">How much is it?</text>
<text x="520.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Two kilos, please. And six eggs.</text>
<rect x="370.0" y="300" width="300" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#55646D" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="510.0" cy="398.8" r="6" fill="#FFFFFF" stroke="#55646D" stroke-width="1.5"/>
<circle cx="560" cy="470" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="520.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Can I sell two kilos before Thursday?</text>
<rect x="915.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="987.6,199.2 1040.4,199.2 1080,455" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="989.6" y1="199.2" x2="1038.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="1080.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Two twenty a kilo. How many do you want?</text>
<text x="1080.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">There aren't any eggs left. Tomorrow?</text>
<rect x="930.0" y="300" width="300" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#55646D" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="1070.0" cy="398.8" r="6" fill="#FFFFFF" stroke="#55646D" stroke-width="1.5"/>
<circle cx="1120" cy="470" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="1080.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Will he still come when I put the price up?</text>
</g>
