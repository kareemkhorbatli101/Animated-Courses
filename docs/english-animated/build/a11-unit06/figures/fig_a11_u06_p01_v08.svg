<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>One breakfast, backwards</title>
<desc>A network with one cup of coffee and one piece of bread at the centre, and lines running back to the shop, the market, the van, the farm and the port, each labelled with a distance and a time.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="400" y1="200" x2="800" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="360" y1="580" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1240" y1="190" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1240" y1="580" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="800" y1="690" x2="800" y2="400" stroke="#2E6F5E" stroke-width="6" stroke-linecap="round"/>
<line x1="1240" y1="190" x2="1480" y2="380" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="62" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">☕</text>
<text x="800" y="488" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">one breakfast</text>
<text x="800" y="508" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">coffee and bread</text>
<circle cx="400" cy="200" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="400" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">B</text>
<text x="400" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">bread</text>
<text x="400" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">2 streets, 4 hours</text>
<circle cx="360" cy="580" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="360" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">M</text>
<text x="360" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">milk</text>
<text x="360" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">11 km, yesterday</text>
<circle cx="1240" cy="190" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1240" y="195" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">C</text>
<text x="1240" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">coffee</text>
<text x="1240" y="282" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6,000 km, 3 weeks</text>
<circle cx="1240" cy="580" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1240" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">E</text>
<text x="1240" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">egg</text>
<text x="1240" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">40 km, Tuesday</text>
<circle cx="800" cy="690" r="48" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="800" y="695" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">W</text>
<text x="800" y="764" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">water</text>
<text x="800" y="784" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">under the street</text>
<circle cx="1480" cy="380" r="44" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1480" y="385" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">?</text>
<text x="1480" y="450" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">sugar</text>
<text x="1480" y="470" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">nobody knows</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One breakfast, backwards</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six things in a cup and on a plate, and how far each of them came. One line leaves the page.</text>
<rect x="542.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="600.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">walked, in a bag</text>
<rect x="522.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="580.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">a van, at six</text>
<rect x="962.0" y="280.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1020.0" y="299.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">a ship, then a lorry, then a shop</text>
<rect x="962.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1020.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">a crate, on Tuesday</text>
<rect x="742.0" y="530.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="800.0" y="549.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">it did not travel at all</text>
<rect x="1302.0" y="270.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1360.0" y="289.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and nobody has ever asked</text>
</g>
</svg>
