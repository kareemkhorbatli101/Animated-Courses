<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>One breakfast, as distance and time</title>
<desc>An infographic of one breakfast across four bands: how far each item travelled, how long it took, what it cost, and how many pairs of hands touched it between the field and the cup.</desc>
