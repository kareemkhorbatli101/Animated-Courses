<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890">
<title>Pouring four hours into Sunday</title>
<desc>Five panels showing four hours being poured into one Sunday: the first hour going in easily, the second slowly, the third spilling and the fourth not going in at all.</desc>
