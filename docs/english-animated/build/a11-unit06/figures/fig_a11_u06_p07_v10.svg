<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>Long ee and short e</title>
<desc>Two mouth cross-sections for the long ee and the short e, with the tongue high and forward for the first and lower for the second, and minimal pairs under each.</desc>
