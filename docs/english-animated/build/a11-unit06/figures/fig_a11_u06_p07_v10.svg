<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Long ee and short e</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Cheese and bread. The jaw moves between these two and most learners keep it still.</text>
<text x="470.0" y="545" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">/iː/</text>
<text x="470.0" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">long, high and far forward - the lips spread</text>
<text x="470.0" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">cheese · tea · meat · need · three</text>
<rect x="395.0" y="630" width="150" height="14" rx="7" fill="#C86B2B"/>
<text x="1130.0" y="545" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">/e/</text>
<text x="1130.0" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">short, and the jaw drops a little</text>
<text x="1130.0" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">bread · egg · ten · cent · left</text>
<rect x="1106.0" y="630" width="48" height="14" rx="7" fill="#C86B2B"/>
</g>
</svg>
