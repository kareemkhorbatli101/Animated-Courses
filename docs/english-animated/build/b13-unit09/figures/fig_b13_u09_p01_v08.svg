<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Four ways English can exclude somebody</title>
<desc>A network from jargon, slang, idiom and register to who is excluded, with code-switching shown as the escape route.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="200" x2="540" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="170" y1="600" x2="540" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="400" x2="900" y2="200" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="900" y1="200" x2="1270" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="400" x2="900" y2="600" stroke="#D9A441" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="900" y1="600" x2="1270" y2="400" stroke="#D9A441" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="20_subject">
<circle cx="170" cy="200" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="170" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Jargon</text>
<text x="170" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">excludes outside the field</text>
<circle cx="170" cy="600" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="170" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="170" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Slang</text>
<text x="170" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">excludes outside the group</text>
<circle cx="540" cy="400" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="540" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="540" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Idiom</text>
<text x="540" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">excludes outside the first language</text>
<circle cx="900" cy="200" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="900" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="900" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Register</text>
<text x="900" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a choice, and it has to be taught</text>
<circle cx="900" cy="600" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="900" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="900" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Code-switch</text>
<text x="900" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">doing it on purpose, both ways</text>
<circle cx="1270" cy="400" r="56" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1270" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1270" y="482" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The reader</text>
<text x="1270" y="502" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">who is in and who is out</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four ways English can exclude somebody</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six nodes. Two of them are the same mechanism with different social standing.</text>
<rect x="297.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="355.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">one is respected, the other is not</text>
<rect x="297.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="355.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and the mechanism is identical</text>
<rect x="662.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nobody teaches this, everybody marks it</text>
<rect x="1027.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1085.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and the reader decides what counts</text>
<rect x="662.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the way out</text>
<rect x="1027.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1085.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">which is a skill, not an inconsistency</text>
</g>
</svg>
