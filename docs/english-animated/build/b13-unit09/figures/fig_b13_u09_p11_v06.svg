<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Marks lost for expression this year</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Eleven reports, by the writer's first language and by what was actually marked.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#C86B2B"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">reports marked down</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#A8372E"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">containing an actual error</text>
<rect x="1390" y="238" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="253" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">given a written comment</text>
<text x="288.0" y="658" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">English first</text>
<text x="524.0" y="658" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Romance</text>
<text x="760.0" y="658" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Sinitic</text>
<text x="996.0" y="658" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Germanic</text>
<text x="1232.0" y="658" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Other</text>
<rect x="170" y="690" width="1180" height="65.5" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="717.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">No report by a first-language writer lost a mark for expression, two of the eleven contained an</text>
<text x="186" y="738.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">actual error, and none of the eleven was told what had been noticed.</text>
<text x="170" y="791.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">One unit, one year, 214 reports. Eleven lost marks under a criterion the rubric does not</text>
<text x="170" y="813.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">contain.</text>
