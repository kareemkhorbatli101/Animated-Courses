<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>What each box pays, and what it costs to prove</title>
<desc>A bar chart comparing the payout and the settlement time for each of three causes of loss on an insurance form.</desc>
