<rect x="1012.8571428571428" y="444.0" width="126.42857142857143" height="126.0" rx="0" fill="#D9A441"/>
<rect x="366.6666666666667" y="544.8" width="126.42857142857143" height="25.200000000000045" rx="0" fill="#1F4E5F"/>
<rect x="759.9999999999999" y="351.6" width="126.42857142857143" height="218.39999999999998" rx="0" fill="#1F4E5F"/>
<rect x="1153.3333333333333" y="544.8" width="126.42857142857143" height="25.200000000000045" rx="0" fill="#1F4E5F"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What each box pays, and what it costs to prove</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Three causes, three amounts, and the time each one takes to settle.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#D9A441"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">payout</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">weeks to settle (x400)</text>
<text x="366.66666666666663" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">A mooring</text>
<text x="759.9999999999999" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">B mechanical</text>
<text x="1153.3333333333333" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">C unknown</text>
<rect x="170" y="630" width="1180" height="38" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="655" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Box C is the only one with no evidence requirement, the only one the rope supports, and a third of the money.</text>
<text x="170" y="704.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Box B pays the same as box A and takes six months, because it needs an engineer report on a</text>
<text x="170" y="725.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">vessel that is two miles out.</text>
</g>
</svg>
