<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Donal, and the top road</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">One of them moved a car two days early. The other had sandbags in a shed.</text>
<rect x="305.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="377.6,199.2 430.4,199.2 470,435" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="379.6" y1="199.2" x2="428.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="470.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">If it happened again, I'd move it on the Wednesday.</text>
<text x="470.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">I'd rather look foolish than lose a car.</text>
<rect x="805.0" y="140" width="330" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="877.6,179.6 930.4,179.6 970,435" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="879.6" y1="179.6" x2="928.4" y2="179.6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="970.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">If I were you, I'd have gone earlier.</text>
</g>
