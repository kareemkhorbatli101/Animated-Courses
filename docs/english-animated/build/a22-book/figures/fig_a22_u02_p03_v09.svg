<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
<title>The result, and the activity</title>
<desc>Two parallel sentences compared, one present perfect simple with a number and one present perfect continuous with a duration.</desc>
