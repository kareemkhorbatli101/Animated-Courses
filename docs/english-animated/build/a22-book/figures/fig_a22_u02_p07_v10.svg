<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The word in the middle</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Been is the quietest word in a perfect continuous, and it is not pronounced bean.</text>
<text x="1370" y="150" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">been is /bɪn/, never /biːn/</text>
<text x="1370" y="236" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">four words, two beats</text>
<text x="1370" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">have survives as a v</text>
<text x="1370" y="408" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">three weak syllables in a row</text>
<text x="1370" y="494" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">full only when you are arguing</text>
