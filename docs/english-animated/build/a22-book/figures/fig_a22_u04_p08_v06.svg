<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>Each account, its instrument, and that instrument's error</title>
<desc>A bar chart of the time each resident gave against the true time, with the error of each instrument shown.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="420" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="570.0" x2="1350" y2="570.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="575.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="465.0" x2="1350" y2="465.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="470.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">10</text>
<line x1="170" y1="360.0" x2="1350" y2="360.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="365.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">20</text>
<line x1="170" y1="255.0" x2="1350" y2="255.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="260.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">30</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">40</text>
</g>
<g id="20_subject">
<rect x="212.14285714285714" y="255.0" width="94.82142857142858" height="315.0" rx="0" fill="#C86B2B"/>
<rect x="507.14285714285717" y="570.0" width="94.82142857142858" height="0.0" rx="0" fill="#C86B2B"/>
<rect x="802.1428571428571" y="517.5" width="94.82142857142858" height="52.5" rx="0" fill="#C86B2B"/>
<rect x="1097.142857142857" y="570.0" width="94.82142857142858" height="0.0" rx="0" fill="#C86B2B"/>
<rect x="317.50000000000006" y="454.5" width="94.82142857142858" height="115.5" rx="0" fill="#1F4E5F"/>
<rect x="612.5" y="412.5" width="94.82142857142858" height="157.5" rx="0" fill="#1F4E5F"/>
<rect x="907.5" y="517.5" width="94.82142857142858" height="52.5" rx="0" fill="#1F4E5F"/>
<rect x="1202.5" y="570.0" width="94.82142857142858" height="0.0" rx="0" fill="#1F4E5F"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Each account, its instrument, and that instrument's error</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Three residents, three ways of knowing the time, measured afterwards.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#C86B2B"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">minutes from 23.30</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">error in the instrument</text>
<text x="317.5" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">A: kitchen clock</text>
<text x="612.5" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">B: radio programme</text>
<text x="907.5" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">C: hall filling</text>
<text x="1202.5" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">metadata</text>
<rect x="170" y="630" width="1180" height="65.5" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="657.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Being right and being careful are not the same thing here, and a report that only prints the times</text>
<text x="186" y="678.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">makes the careful one look worst.</text>
<text x="170" y="731.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Resident B gave the closest time and had the largest instrument error. Resident A gave the</text>
<text x="170" y="753.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">furthest time and had checked an actual clock.</text>
</g>
</svg>
