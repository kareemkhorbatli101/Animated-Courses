<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>What a berth here has paid, each season, for ten years</title>
<desc>A line chart of seasonal earnings from a local berth over ten years against the rate offered in Galway, showing a steady decline locally.</desc>
