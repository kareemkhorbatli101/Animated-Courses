<circle cx="406.0" cy="265.5" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="642.0" cy="265.5" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="878.0" cy="255.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1114.0" cy="244.5" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1350.0" cy="244.5" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<text x="1364.0" y="249.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">the Galway rate</text>
