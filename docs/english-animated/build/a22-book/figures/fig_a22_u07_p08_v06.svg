<g id="20_subject">
<path d="M 170.0 297.0 L 406.0 307.5 L 642.0 328.5 L 878.0 349.5 L 1114.0 391.5 L 1350.0 423.0" fill="none" stroke="#C86B2B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
