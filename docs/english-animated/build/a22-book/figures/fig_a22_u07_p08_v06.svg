<circle cx="406.0" cy="307.5" r="5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.6"/>
<circle cx="642.0" cy="328.5" r="5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.6"/>
<circle cx="878.0" cy="349.5" r="5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.6"/>
<circle cx="1114.0" cy="391.5" r="5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.6"/>
<circle cx="1350.0" cy="423.0" r="5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.6"/>
<text x="1364.0" y="428.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">a berth here</text>
<path d="M 170.0 276.0 L 406.0 265.5 L 642.0 265.5 L 878.0 255.0 L 1114.0 244.5 L 1350.0 244.5" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
