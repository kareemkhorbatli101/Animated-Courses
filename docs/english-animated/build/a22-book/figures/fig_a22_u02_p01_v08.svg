<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>Why a job takes eight months</title>
<desc>A network from the flood through the survey, the appointment of a contractor, the scaffolding, the roof and the plasterboard, with the waiting marked on each link.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="400" x2="500" y2="230" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="500" y1="230" x2="500" y2="570" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="500" y1="570" x2="880" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="880" y1="400" x2="1270" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="170" y1="400" x2="880" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round"/>
<line x1="500" y1="570" x2="1270" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="170" cy="400" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="170" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The water</text>
<text x="170" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">14 January</text>
<circle cx="500" cy="230" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="500" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="500" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The survey</text>
<text x="500" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a man looked, and left</text>
<circle cx="500" cy="570" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="500" y="575" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="500" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The contractor</text>
<text x="500" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">appointed 9 March</text>
<circle cx="880" cy="400" r="54" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="880" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="880" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The roof</text>
<text x="880" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">three men, four weeks</text>
<circle cx="1270" cy="400" r="54" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="1270" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1270" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Plasterboard</text>
<text x="1270" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">ordered June. Still ordered</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Why a job takes eight months</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six stages. Only two of them are building work.</text>
<rect x="277.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="335.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nineteen days</text>
<rect x="442.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="500.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">five weeks, and no paper</text>
<rect x="632.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="690.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">six weeks to the scaffolding</text>
<rect x="1017.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1075.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and then they moved to the school</text>
<rect x="467.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="525.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the only finished thing</text>
<rect x="827.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="885.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">supplier changed in July</text>
</g>
</svg>
