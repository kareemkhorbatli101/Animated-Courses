<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>The word that becomes a letter</title>
<desc>Five phrases with would shown written and spoken, reduced to a d or a schwa in each.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="640" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="174" x2="1430" y2="174" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="260" x2="1430" y2="260" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="346" x2="1430" y2="346" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="432" x2="1430" y2="432" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="518" x2="1430" y2="518" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
</g>
<g id="20_subject">
<text x="190" y="150" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">I would</text>
<text x="760" y="150" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">→</text>
<text x="840" y="150" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">a</text>
<text x="860" y="150" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɪ</text>
<text x="880" y="150" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">d</text>
<text x="190" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">would you</text>
<text x="760" y="236" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">→</text>
<text x="840" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">w</text>
<text x="860" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="880" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">d</text>
<text x="900" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ʒ</text>
<text x="920" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="190" y="322" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">I would have</text>
<text x="760" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">→</text>
<text x="840" y="322" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">a</text>
<text x="860" y="322" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɪ</text>
<text x="880" y="322" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">d</text>
<text x="900" y="322" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="920" y="322" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">v</text>
<text x="190" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">if I were you</text>
<text x="760" y="408" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">→</text>
<text x="840" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɪ</text>
<text x="860" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">f</text>
<text x="880" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">a</text>
<text x="900" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɪ</text>
<text x="920" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">w</text>
<text x="940" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="960" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">j</text>
<text x="980" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="190" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">I WOULD do it</text>
<text x="760" y="494" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">→</text>
<text x="840" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">a</text>
<text x="860" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɪ</text>
<text x="880" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ˈ</text>
<text x="900" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">w</text>
<text x="920" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ʊ</text>
<text x="940" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">d</text>
<text x="960" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">d</text>
<text x="980" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">u</text>
<text x="1000" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">:</text>
<text x="1020" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɪ</text>
<text x="1040" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">t</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The word that becomes a letter</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Would is almost never said in full. It survives as a d.</text>
<text x="1370" y="150" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">one letter is all that is left</text>
<text x="1370" y="236" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">would + you run together</text>
<text x="1370" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">never &quot;would of&quot; in writing</text>
<text x="1370" y="408" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">were /wə/, you /jə/</text>
<text x="1370" y="494" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">full only when a but is coming</text>
</g>
</svg>
