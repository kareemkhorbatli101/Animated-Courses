<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>What was known, hour by hour</title>
<desc>A line chart of how many people knew the forecast had been revised, hour by hour, alongside the rising tide.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="420" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="570.0" x2="1350" y2="570.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="575.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="465.0" x2="1350" y2="465.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="470.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">5</text>
<line x1="170" y1="360.0" x2="1350" y2="360.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="365.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">10</text>
<line x1="170" y1="255.0" x2="1350" y2="255.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="260.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">15</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">20</text>
</g>
<g id="20_subject">
<path d="M 170.0 549.0 L 406.0 528.0 L 642.0 444.0 L 878.0 444.0 L 1114.0 402.0 L 1350.0 150.0" fill="none" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="549.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="406.0" cy="528.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="642.0" cy="444.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="878.0" cy="444.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="1114.0" cy="402.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="1350.0" cy="150.0" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<text x="1364.0" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">people who knew</text>
<path d="M 170.0 528.0 L 406.0 465.0 L 642.0 402.0 L 878.0 339.0 L 1114.0 276.0 L 1350.0 234.0" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="170.0" cy="528.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="406.0" cy="465.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="642.0" cy="402.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="878.0" cy="339.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1114.0" cy="276.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1350.0" cy="234.0" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<text x="1364.0" y="239.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">surge (tenths of a metre)</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What was known, hour by hour</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">From the forecast revision at 13.40 to the first water at 23.30.</text>
<text x="170.0" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">13.40</text>
<text x="406.0" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">16.00</text>
<text x="642.0" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">18.00</text>
<text x="878.0" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">20.00</text>
<text x="1114.0" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">21.50</text>
<text x="1350.0" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">23.30</text>
<rect x="170" y="630" width="1180" height="65.5" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="657.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">The council duty officer is not on this chart, because there is no record of when the revision was</text>
<text x="186" y="678.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">read.</text>
<text x="170" y="731.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">One person knew for two hours and twenty minutes. Six knew for five and a half hours.</text>
<text x="170" y="753.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Everybody knew when the water arrived.</text>
</g>
</svg>
