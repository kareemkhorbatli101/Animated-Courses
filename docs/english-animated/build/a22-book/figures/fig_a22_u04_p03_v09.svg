<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
<title>The words, and the report of them</title>
<desc>Two parallel sentences compared, one in direct speech and one reported, with the shifted elements highlighted.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="660" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="278.6666666666667" height="52" rx="5" fill="#C86B2B"/>
<text x="299.33333333333337" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">&quot;I</text>
<rect x="444.6666666666667" y="144" width="441.3333333333333" height="52" rx="5" fill="#1F4E5F"/>
<text x="665.3333333333334" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">HAVE checked</text>
<rect x="892.0" y="144" width="482.0" height="52" rx="5" fill="#2E6F5E"/>
<text x="1133.0" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">it NOW.&quot;</text>
<rect x="160" y="344" width="400.6666666666667" height="52" rx="5" fill="#C86B2B"/>
<text x="360.33333333333337" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">She said</text>
<rect x="566.6666666666667" y="344" width="400.6666666666667" height="52" rx="5" fill="#1F4E5F"/>
<text x="767.0000000000001" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">SHE HAD checked</text>
<rect x="973.3333333333335" y="344" width="400.6666666666667" height="52" rx="5" fill="#2E6F5E"/>
<text x="1173.6666666666667" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">it THEN.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The words, and the report of them</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Everything steps one back: the tense, the pronoun, and the time word.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="542.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="569.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">say that - never say somebody that. tell somebody that - never tell that. And no shift is</text>
<text x="184" y="591.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">needed when the thing is still true: she said the drain IS still blocked.</text>
</g>
</svg>
