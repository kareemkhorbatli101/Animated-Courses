<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>Where the stress goes when you report</title>
<desc>Five reported sentences with the stressed syllables drawn as large dots, showing how stressing the reporting verb adds doubt.</desc>
