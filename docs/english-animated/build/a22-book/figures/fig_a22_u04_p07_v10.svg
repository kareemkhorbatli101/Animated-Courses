<text x="358" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">told</text>
<circle cx="476" cy="496" r="8" fill="#9AA7AE"/>
<text x="476" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">me</text>
