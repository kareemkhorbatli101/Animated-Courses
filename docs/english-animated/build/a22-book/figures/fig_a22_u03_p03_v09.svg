<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The past before the past</title>
<desc>A timeline showing a past-simple event and, before it, an earlier event drawn with had plus past participle.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="160" y1="490" x2="1380" y2="490" stroke="#1C2B33" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="1380,490 1364,482 1364,498" fill="#1C2B33"/>
<line x1="1282.4" y1="330" x2="1282.4" y2="524" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="1282.4" y="548" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2">NOW</text>
</g>
<g id="20_subject">
<line x1="257.6" y1="436" x2="428.4" y2="436" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 6"/>
<line x1="428.4" y1="414" x2="428.4" y2="458" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<circle cx="648.0" cy="328" r="11" fill="#1F4E5F"/>
<line x1="648.0" y1="328" x2="648.0" y2="490" stroke="#1F4E5F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="892.0" y1="220" x2="1062.8" y2="220" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 6"/>
<line x1="1062.8" y1="198" x2="1062.8" y2="242" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The past before the past</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two events in the past. The earlier one takes had.</text>
<text x="257.6" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">EARLIER - past perfect</text>
<text x="257.6" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">The forecast had changed at 13.40.</text>
<text x="648.0" y="276" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">THE EVENT - past simple</text>
<text x="648.0" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">He moved the car at 16.00.</text>
<text x="892.0" y="172" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">AND BY THEN - past perfect again</text>
<text x="892.0" y="194" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">By the time the hall opened, the water had reached the doors.</text>
<rect x="160" y="582.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="609.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">You do not need the past perfect when the sentence order is the event order. You do need it</text>
<text x="184" y="631.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">when you go backwards.</text>
</g>
</svg>
