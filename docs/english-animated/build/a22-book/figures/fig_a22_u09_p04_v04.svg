<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>Equal shares, and shares by need</title>
<desc>Two panels comparing four equal portions of a fund with two full portions and two empty ones.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="720" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="60.0" y="130" width="720.0" height="480" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="60.0" y="130" width="720.0" height="42" rx="6" fill="#1F4E5F"/>
<rect x="60.0" y="160" width="720.0" height="12" rx="0" fill="#1F4E5F"/>
<text x="420.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">EQUAL - 45,000 each</text>
<rect x="820.0" y="130" width="720.0" height="480" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="820.0" y="130" width="720.0" height="42" rx="6" fill="#C86B2B"/>
<rect x="820.0" y="160" width="720.0" height="12" rx="0" fill="#C86B2B"/>
<text x="1180.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">BY NEED - two funded</text>
</g>
<g id="20_subject">
<line x1="80.0" y1="562" x2="760.0" y2="562" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="155.0" y="502" width="70" height="60" rx="0" fill="#9AA7AE" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="240.0" y="502" width="70" height="60" rx="0" fill="#9AA7AE" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="325.0" y="502" width="70" height="60" rx="0" fill="#9AA7AE" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="410.0" y="502" width="70" height="60" rx="0" fill="#9AA7AE" stroke="#1C2B33" stroke-width="1.6"/>
<text x="360.0" y="362" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="600" font-style="normal">four started, none finished</text>
<line x1="840.0" y1="562" x2="1520.0" y2="562" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="915.0" y="432" width="70" height="130" rx="0" fill="#2E6F5E" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="1000.0" y="432" width="70" height="130" rx="0" fill="#2E6F5E" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="1085.0" y="432" width="70" height="130" rx="0" fill="none" stroke="#9AA7AE" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="1170.0" y="432" width="70" height="130" rx="0" fill="none" stroke="#9AA7AE" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="1120.0" y="362" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">two finished, two angry</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Equal shares, and shares by need</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Learner A has the equal split. Learner B has the need split. Same total.</text>
<text x="800.0" y="654" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">Which split finishes something?</text>
<text x="800.0" y="686" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">6 differences — find them all</text>
</g>
</svg>
