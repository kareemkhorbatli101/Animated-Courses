<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>What a job is made of</title>
<desc>A network of the components of an employment arrangement, with the ones absent from an informal arrangement drawn dashed.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="200" y1="420" x2="560" y2="220" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="420" x2="560" y2="640" stroke="#A8372E" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="560" y1="640" x2="960" y2="400" stroke="#A8372E" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="200" y1="420" x2="1310" y2="220" stroke="#1F4E5F" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="420" x2="1310" y2="660" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<line x1="1310" y1="660" x2="960" y2="400" stroke="#D9A441" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5"/>
</g>
<g id="20_subject">
<circle cx="200" cy="420" r="56" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="200" y="425" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">DO</text>
<text x="200" y="502" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The work</text>
<text x="200" y="522" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">twelve hours, done</text>
<circle cx="560" cy="220" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="560" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">PAY</text>
<text x="560" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The pay</text>
<text x="560" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">weekly, cash</text>
<circle cx="560" cy="640" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="560" y="645" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">REC</text>
<text x="560" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The record</text>
<text x="560" y="732" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">none</text>
<circle cx="960" cy="400" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="960" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">SEC</text>
<text x="960" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Security</text>
<text x="960" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">notice, sick pay</text>
<circle cx="1310" cy="220" r="56" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="1310" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">FREE</text>
<text x="1310" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Control of the week</text>
<text x="1310" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">hers, entirely</text>
<circle cx="1310" cy="660" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1310" y="665" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">GW</text>
<text x="1310" y="732" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Goodwill</text>
<text x="1310" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">six years, both ways</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What a job is made of</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six parts. Grace has two of them. The dashed lines are the ones that do not exist for her.</text>
<rect x="322.0" y="305.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="324.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">weekly, in an envelope</text>
<rect x="322.0" y="515.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="534.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nothing written</text>
<rect x="702.0" y="505.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="760.0" y="524.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">no record, no notice</text>
<rect x="697.0" y="305.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="755.0" y="324.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">she sets the hours</text>
<rect x="697.0" y="525.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="755.0" y="544.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">six years</text>
<rect x="1077.0" y="515.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1135.0" y="534.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">does the job security would</text>
</g>
</svg>
