<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
<title>The modelled world, and the actual one</title>
<desc>Two panels comparing a modelled growth curve and the actual recorded figures, diverging after the second year.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="740" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="60.0" y="130" width="720.0" height="500" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="60.0" y="130" width="720.0" height="42" rx="6" fill="#1F4E5F"/>
<rect x="60.0" y="160" width="720.0" height="12" rx="0" fill="#1F4E5F"/>
<text x="420.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the model, 4 %</text>
<rect x="820.0" y="130" width="720.0" height="500" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="820.0" y="130" width="720.0" height="42" rx="6" fill="#C86B2B"/>
<rect x="820.0" y="160" width="720.0" height="12" rx="0" fill="#C86B2B"/>
<text x="1180.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the actuals, 9 %</text>
</g>
<g id="20_subject">
<line x1="80.0" y1="582" x2="760.0" y2="582" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="170.0" y="462" width="60" height="50" rx="0" fill="#D9A441" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="250.0" y="462" width="60" height="60" rx="0" fill="#D9A441" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="330.0" y="462" width="60" height="70" rx="0" fill="#D9A441" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="410.0" y="462" width="60" height="80" rx="0" fill="#D9A441" stroke="#1C2B33" stroke-width="1.6"/>
<text x="360.0" y="372" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="600" font-style="normal">8,350 by year three</text>
<line x1="840.0" y1="582" x2="1520.0" y2="582" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="930.0" y="462" width="60" height="50" rx="0" fill="#A8372E" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="1010.0" y="462" width="60" height="80" rx="0" fill="#A8372E" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="1090.0" y="462" width="60" height="110" rx="0" fill="#A8372E" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="1170.0" y="462" width="60" height="140" rx="0" fill="#A8372E" stroke="#1C2B33" stroke-width="1.6"/>
<text x="1120.0" y="372" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">9,610 by year three</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The modelled world, and the actual one</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Learner A has the assumptions. Learner B has six years of actuals. They agreed until 2022.</text>
<text x="800.0" y="674" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">In which year did the two stop agreeing?</text>
<text x="800.0" y="706" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">7 differences — find them all</text>
</g>
</svg>
