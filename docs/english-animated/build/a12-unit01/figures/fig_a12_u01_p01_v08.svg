<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>Who tells whom</title>
<desc>The crew drawn as a network - service manager, sleeping-car attendant, cook, guard and engineer - with labelled lines showing who passes information to whom, two of them drawn with a single arrow.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="1420" y1="180" x2="800" y2="180" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="800" y1="180" x2="380" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="380" y1="400" x2="640" y2="700" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="380" y1="400" x2="800" y2="620" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1240" y1="400" x2="800" y2="180" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="640" y1="700" x2="800" y2="180" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
</g>
<g id="20_subject">
<circle cx="800" cy="180" r="56" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="800" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">N</text>
<text x="800" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Nadia</text>
<text x="800" y="282" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">service manager, 11 years</text>
<circle cx="380" cy="400" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="380" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">D</text>
<text x="380" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Dev</text>
<text x="380" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">attendant, 9 days</text>
<circle cx="800" cy="620" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="800" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">R</text>
<text x="800" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Ruth</text>
<text x="800" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">cook, 23 years</text>
<circle cx="1240" cy="400" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="1240" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">G</text>
<text x="1240" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the guard</text>
<text x="1240" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">never sees a passenger</text>
<circle cx="1420" cy="180" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1420" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">E</text>
<text x="1420" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the engineer</text>
<text x="1420" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">at the front, alone</text>
<circle cx="640" cy="700" r="50" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="640" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">192</text>
<text x="640" y="776" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the passengers</text>
<text x="640" y="796" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">192 of them</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Who tells whom</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five people on one train. Two of the lines only go one way, and that is where the trouble starts.</text>
<rect x="1052.0" y="165.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1110.0" y="184.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">why we stopped</text>
<rect x="532.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="590.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">what to tell people</text>
<rect x="452.0" y="535.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="510.0" y="554.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the announcement</text>
<rect x="532.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="590.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">we need two hundred sandwiches</text>
<rect x="962.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1020.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">one way only - he reports, nobody tells him</text>
<rect x="662.0" y="425.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="444.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">one way only - they ask, and he answers</text>
</g>
</svg>
