<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
<title>Four jokes, four assumptions</title>
<desc>Four short pieces of humour from four places, annotated with what each one requires the reader to already know.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="960" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="750" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="750" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">FOUR THINGS PEOPLE FOUND FUNNY LAST YEAR</text>
<text x="140" y="228" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">1</text>
<text x="140" y="258.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">A sign outside a cafe: &quot;We do not have wifi. Talk to each other</text>
<text x="140" y="279.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">and pretend it is 1995.&quot;</text>
<text x="140" y="315.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">You need to know</text>
<text x="410" y="315.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">that cafes have wifi, and that 1995 is before it</text>
<text x="140" y="347.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Travels</text>
<text x="410" y="347.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">almost everywhere</text>
<line x1="130" y1="379.5" x2="910" y2="379.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="415.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">2</text>
<text x="140" y="445.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;The meeting could have been an email. The email could have been</text>
<text x="140" y="467.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a silence.&quot;</text>
<text x="140" y="503.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">You need to know</text>
<text x="410" y="503.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the office complaint it is built on</text>
<text x="140" y="535.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Travels</text>
<text x="410" y="535.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">anywhere with meetings</text>
<line x1="130" y1="567.0" x2="910" y2="567.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="603.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">3</text>
<text x="140" y="633.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">A radio presenter, after a long government statement: &quot;Well.</text>
<text x="140" y="654.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">There we are then.&quot;</text>
<text x="140" y="690.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">You need to know</text>
<text x="410" y="690.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">the statement, the presenter, and that the understatement is the whole joke</text>
<text x="140" y="722.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Travels</text>
<text x="410" y="722.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">badly - it is a tone, not a line</text>
<line x1="130" y1="754.5" x2="910" y2="754.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="790.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">4</text>
<text x="140" y="820.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">A note left on a shared fridge: &quot;Whoever is taking the milk - I</text>
<text x="140" y="842.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">know it is you, Daniel.&quot;</text>
<text x="140" y="878.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">You need to know</text>
<text x="410" y="878.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">that there is a Daniel, and that everybody knows</text>
<text x="140" y="910.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Travels</text>
<text x="410" y="910.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">only inside the building</text>
<line x1="130" y1="942.0" x2="910" y2="942.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="964.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">The ones that travel are not the best jokes. They are the ones whose assumptions are</text>
<text x="140" y="981.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">the most widely shared. Number 3 is the funniest to the people who get it and is</text>
<text x="140" y="998.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">unexplainable to anybody else - which is the test for a cultural boundary rather than</text>
<text x="140" y="1016.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">a language one.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four jokes, four assumptions</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Read them before the annotations. Mark the ones you merely understand.</text>
<circle cx="934" cy="225.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 225.0 L 1024 225.0 L 1024 225.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="230.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A fact, and a date. Both common</text>
<circle cx="934" cy="270.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 270.0 L 1024 270.0 L 1024 270.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="275.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">This one survives translation</text>
<text x="1040" y="295.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">intact</text>
<circle cx="934" cy="420.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 420.0 L 1024 420.0 L 1024 420.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="425.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A shared frustration, not a shared</text>
<text x="1040" y="445.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">fact</text>
<circle cx="934" cy="540.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 540.0 L 1024 540.0 L 1024 540.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="545.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A tone. You cannot translate a</text>
<text x="1040" y="565.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">tone</text>
<circle cx="934" cy="705.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 705.0 L 1024 705.0 L 1024 705.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="710.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Requires a specific person in a</text>
<text x="1040" y="730.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">specific building</text>
<circle cx="934" cy="810.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 810.0 L 1024 810.0 L 1024 810.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="815.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The best joke here travels least</text>
</g>
</svg>
