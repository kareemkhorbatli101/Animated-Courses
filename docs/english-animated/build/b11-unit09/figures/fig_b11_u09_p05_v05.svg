<text x="403.33333333333337" y="555.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<text x="656.6666666666667" y="555.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no</text>
<line x1="140" y1="565.25" x2="900" y2="565.25" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="140" y="593.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Nothing printed is inaccurate. The sentence that limits the quote - &quot;Not the work, the</text>
<text x="140" y="610.65" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">paperwork&quot; - follows it immediately in the recording and would have cost eleven words.</text>
<text x="140" y="628.05" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">The headline verb is admits. In the transcript he is answering a question he was</text>
<text x="140" y="645.45" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">asked.</text>
