<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<title>Things you count and things you weigh</title>
<desc>Two groups of boxes. On the left, countable foods with numbers in front of them; on the right, uncountable foods with containers in front of them instead.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="500" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="186.0" width="209.2941176470588" height="68" rx="5" fill="#1F4E5F"/>
<text x="264.6470588235294" y="227.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">six eggs</text>
<rect x="375.2941176470588" y="186.0" width="233.2156862745098" height="68" rx="5" fill="#1F4E5F"/>
<text x="491.9019607843137" y="227.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">eleven apples</text>
<rect x="614.5098039215686" y="186.0" width="233.2156862745098" height="68" rx="5" fill="#C86B2B"/>
<text x="731.1176470588235" y="227.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">some bread</text>
<rect x="853.7254901960785" y="186.0" width="233.2156862745098" height="68" rx="5" fill="#C86B2B"/>
<text x="970.3333333333334" y="227.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">some rice</text>
<rect x="1092.9411764705883" y="186.0" width="281.05882352941177" height="68" rx="5" fill="#2E6F5E"/>
<text x="1233.4705882352941" y="227.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">two loaves of bread</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Things you count and things you weigh</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same wheat is bread and a sandwich. The food did not change. The language did.</text>
<text x="264.6470588235294" y="282.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">countable</text>
<text x="491.9019607843137" y="282.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">countable</text>
<text x="731.1176470588235" y="282.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">uncountable</text>
<text x="970.3333333333334" y="282.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">uncountable</text>
<text x="1233.4705882352941" y="282.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the bridge</text>
<text x="160" y="328.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">How many goes with the blue. How much goes with the orange. The green is the bridge: put a container in front and anything becomes countable again.</text>
</g>
</svg>
