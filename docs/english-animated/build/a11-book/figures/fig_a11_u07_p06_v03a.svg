<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890">
<title>Going swimming, at six frequencies</title>
<desc>Six panels showing the same activity at six frequencies from every day down to once in a life, each panel showing the calendar pattern it makes.</desc>
