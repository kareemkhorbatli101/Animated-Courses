<text x="360" y="742" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the bins</text>
<text x="360" y="762" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">in the contract</text>
<circle cx="800" cy="720" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="800" y="725" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="800" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">lock up</text>
<text x="800" y="812" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">in the contract</text>
<circle cx="1240" cy="150" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1240" y="155" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1240" y="222" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the phone</text>
<text x="1240" y="242" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">7.00 to 8.30</text>
<circle cx="1420" cy="380" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1420" y="385" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1420" y="452" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the chairs in room 3</text>
<text x="1420" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">nobody asked</text>
<circle cx="1300" cy="620" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1300" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">7</text>
<text x="1300" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the delivery drivers</text>
<text x="1300" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">every morning</text>
<circle cx="900" cy="140" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="900" y="145" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">8</text>
<text x="900" y="212" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the radiator</text>
<text x="900" y="232" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">four managers told</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One job title, nine things</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The solid lines are in the contract. The dotted ones are not, and they are longer.</text>
<rect x="522.0" y="270.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="580.0" y="289.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">duty 1</text>
<rect x="462.0" y="400.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="520.0" y="419.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">duty 2</text>
<rect x="522.0" y="520.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="580.0" y="539.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">duty 3</text>
<rect x="742.0" y="545.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="800.0" y="564.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">duty 4</text>
<rect x="962.0" y="260.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1020.0" y="279.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nobody at the desk</text>
<rect x="1052.0" y="375.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1110.0" y="394.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the next class needs them</text>
<rect x="992.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1050.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">she is the only one there</text>
<rect x="792.0" y="255.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="850.0" y="274.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nothing happened</text>
</g>
</svg>
