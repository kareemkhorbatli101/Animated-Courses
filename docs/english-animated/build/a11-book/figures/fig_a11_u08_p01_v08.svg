<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>One job title, nine things</title>
<desc>A network with the job title cleaner at the centre and nine lines going out to the nine things the person actually does, four drawn solid for contracted duties and five dotted for everything else.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="800" y1="400" x2="360" y2="170" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="400" x2="240" y2="430" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="400" x2="360" y2="670" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="400" x2="800" y2="720" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="800" y1="400" x2="1240" y2="150" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="800" y1="400" x2="1420" y2="380" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="800" y1="400" x2="1300" y2="620" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="800" y1="400" x2="900" y2="140" stroke="#A8372E" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="62" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">C</text>
<text x="800" y="488" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">cleaner</text>
<text x="800" y="508" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the word on the contract</text>
<circle cx="360" cy="170" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="360" y="175" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="360" y="242" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">open at five</text>
<text x="360" y="262" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">in the contract</text>
<circle cx="240" cy="430" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="240" y="435" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="240" y="502" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">clean 3 floors</text>
<text x="240" y="522" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">in the contract</text>
<circle cx="360" cy="670" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
