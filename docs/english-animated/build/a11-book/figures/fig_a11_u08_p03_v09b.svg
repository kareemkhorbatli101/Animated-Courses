<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
<title>The same verb, two widths</title>
<desc>Two sentence diagrams of the same event. The first spreads across the whole week with a plain verb; the second is one minute wide and carries is and -ing as extra pieces.</desc>
