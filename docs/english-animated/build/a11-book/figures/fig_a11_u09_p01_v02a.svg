<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>The hill, in section</title>
<desc>A cutaway of the hill from the square at the bottom to the school at the top, showing what is on each level, with empty labels.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="154" y="104" width="592" height="582" rx="0" fill="#F3ECE0"/>
<rect x="170" y="120" width="560" height="550" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4"/>
<rect x="170" y="120.0" width="560" height="137.5" rx="0" fill="#F1EDE2" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="257.5" width="560" height="137.5" rx="0" fill="#EFE6DC" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="395.0" width="560" height="137.5" rx="0" fill="#E8EEF0" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="532.5" width="560" height="137.5" rx="0" fill="#F3EADA" stroke="#1C2B33" stroke-width="1.6"/>
<path d="M 730 120 L 740 146 L 720 172 L 740 198 L 720 224 L 740 250 L 720 276 L 740 302 L 720 328 L 740 354 L 720 380 L 740 406 L 720 432 L 740 458 L 720 484 L 740 510 L 720 536 L 740 562 L 720 588 L 740 614 L 720 640 L 740 666 L 730 670" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="20_subject">
<text x="190" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the top - 42 m up</text>
<text x="190" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">the school · the yellow building · the bell</text>
<text x="190" y="289.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">two thirds up</text>
<text x="190" y="315.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">three streets on the left · ignore all three</text>
<text x="190" y="427.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">one third up</text>
<text x="190" y="453.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">the bank · the hotel · the traffic lights</text>
<text x="190" y="564.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the square - 0 m</text>
<text x="190" y="590.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">the metro · the tram · the bus stop · the church · the pharmacy</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The hill, in section</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Eleven places. Eleven words. The gradient is the whole problem and you can see it here.</text>
<circle cx="736" cy="186.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 186.0 L 866 186.0 L 866 186.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="191.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Four hundred metres from the</text>
<text x="880" y="211.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">square, and forty-two metres</text>
<text x="880" y="231.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">above it</text>
<circle cx="736" cy="329.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 329.0 L 866 329.0 L 866 329.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="334.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three streets, and all three</text>
<text x="880" y="354.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">of them look like the right</text>
<text x="880" y="374.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">one</text>
<circle cx="736" cy="461.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 461.0 L 866 461.0 L 866 461.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="466.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The only turn in the whole</text>
<text x="880" y="486.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">route is here</text>
<circle cx="736" cy="604.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 604.0 L 866 604.0 L 866 604.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="609.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Everybody who telephones is</text>
<text x="880" y="629.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">standing on this line</text>
</g>
</svg>
