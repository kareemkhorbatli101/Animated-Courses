<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>The inventory list for room 3</title>
<desc>The school inventory list for room 3, with a printed column for how many items there should be and a handwritten column for how many there are, with four mismatched rows and an unsigned signature line.</desc>
