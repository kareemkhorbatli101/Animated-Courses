<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890">
<title>Open the window, at six temperatures</title>
<desc>Six panels showing the same request made at six levels of politeness, from a bare order to a long apologetic question.</desc>
