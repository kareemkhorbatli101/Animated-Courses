<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<title>Not, and the swap</title>
<desc>Two sentence diagrams showing not inserted after the verb, and the verb and the pronoun changing places to make a question.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="620" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="238.0" height="52" rx="5" fill="#C86B2B"/>
<text x="279.0" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">She</text>
<rect x="404.0" y="144" width="238.0" height="52" rx="5" fill="#1F4E5F"/>
<text x="523.0" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">is</text>
<rect x="648.0" y="144" width="265.1111111111111" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="780.5555555555555" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">not</text>
<rect x="919.1111111111111" y="144" width="454.8888888888889" height="52" rx="5" fill="#2E6F5E"/>
<text x="1146.5555555555557" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">a teacher</text>
<rect x="160" y="344" width="238.0" height="52" rx="5" fill="#1F4E5F"/>
<text x="279.0" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">Is</text>
<rect x="404.0" y="344" width="238.0" height="52" rx="5" fill="#C86B2B"/>
<text x="523.0" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">she</text>
<rect x="648.0" y="344" width="454.8888888888889" height="52" rx="5" fill="#2E6F5E"/>
<text x="875.4444444444445" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">a teacher</text>
<rect x="1108.888888888889" y="344" width="265.1111111111111" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1241.4444444444443" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">? the first two swap</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Not, and the swap</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">For a negative, put not after the verb. For a question, swap the first two words.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="502.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="529.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Negative: put not straight after am, is or are. Question: the verb goes first and the person</text>
<text x="184" y="551.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">goes second. Nothing else moves.</text>
</g>
</svg>
