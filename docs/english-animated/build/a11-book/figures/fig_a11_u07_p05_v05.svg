<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880">
<title>The poster on the noticeboard</title>
<desc>A poster for the school Friday club listing four activities with lines for names under each, showing eleven names on one, three on another, two on a third and none on the fourth, with a handwritten line at the bottom.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="880" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="670" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="670" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">FRIDAY CLUB  -  ROOM 3  -  18.00</text>
<text x="140" y="214.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">One hour. Free. A teacher stays. Put your name on one line.</text>
<line x1="130" y1="249.75" x2="910" y2="249.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="140" y="253.75" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="273.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ACTIVITY</text>
<text x="403.33333333333337" y="273.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">HOW OFTEN</text>
<text x="656.6666666666667" y="273.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">NAMES</text>
<text x="150.0" y="303.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">FILM CLUB</text>
<text x="403.33333333333337" y="303.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">once a month</text>
<text x="656.6666666666667" y="303.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">11</text>
<line x1="140" y1="313.75" x2="900" y2="313.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="333.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">FOOTBALL</text>
<text x="403.33333333333337" y="333.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">every week</text>
<text x="656.6666666666667" y="333.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<line x1="140" y1="343.75" x2="900" y2="343.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="363.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CONVERSATION HOUR</text>
<text x="403.33333333333337" y="363.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">every week</text>
<text x="656.6666666666667" y="363.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<line x1="140" y1="373.75" x2="900" y2="373.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="393.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">BOOK GROUP</text>
<text x="403.33333333333337" y="393.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">twice a month</text>
<text x="656.6666666666667" y="393.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="403.75" x2="900" y2="403.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="431.75" x2="910" y2="431.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="467.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT THE NAMES LOOK LIKE</text>
<text x="140" y="497.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Film club</text>
<text x="410" y="497.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">11 names, 9 in the same pen</text>
<text x="140" y="529.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Football</text>
<text x="410" y="529.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3 names, all of them already play on Saturday</text>
<text x="140" y="561.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Conversation hour</text>
<text x="410" y="561.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2 names, both of them teachers</text>
<text x="140" y="593.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Book group</text>
<text x="410" y="593.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no line drawn under it at all</text>
<line x1="130" y1="625.75" x2="910" y2="625.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="657.75" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">AND AT THE BOTTOM, IN A DIFFERENT PEN:</text>
<text x="140" y="687.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;or we can just hang out&quot; - no line for names under it, and four</text>
<text x="140" y="709.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ticks beside it put there by four different people.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The poster on the noticeboard</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four activities, four lines for names. Read the names, not the activities.</text>
<circle cx="934" cy="254.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 254.0 L 1024 254.0 L 1024 254.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="259.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Eleven. More than the other three</text>
<text x="1040" y="279.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">together</text>
<circle cx="934" cy="321.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 321.0 L 1024 321.0 L 1024 321.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="326.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Nought. And it is the one the</text>
<text x="1040" y="346.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">teacher suggested</text>
<circle cx="934" cy="468.40000000000003" r="4.5" fill="#C86B2B"/>
<path d="M 934 468.40000000000003 L 1024 468.40000000000003 L 1024 468.40000000000003" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="473.40000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Nine names in one pen means one</text>
<text x="1040" y="493.70000000000005" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">person signed up nine friends</text>
<circle cx="934" cy="562.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 562.2 L 1024 562.2 L 1024 562.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="567.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Both the conversation names are</text>
<text x="1040" y="587.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">staff</text>
<circle cx="934" cy="749.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 749.8 L 1024 749.8 L 1024 749.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="754.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">No line, no name, four ticks. This</text>
<text x="1040" y="775.0999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">is the real answer</text>
</g>
</svg>
