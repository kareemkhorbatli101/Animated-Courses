<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470">
<title>Four the same, and one with a letter on it</title>
<desc>Five boxes in a row. The first four read I check, you check, we check and they check in the same colour; the fifth reads he checks with the final s in a second colour and larger than the rest of the word.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="470" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="171.0" width="225.8" height="68" rx="5" fill="#1F4E5F"/>
<text x="272.9" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I check</text>
<rect x="391.8" y="171.0" width="225.8" height="68" rx="5" fill="#1F4E5F"/>
<text x="504.70000000000005" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">you check</text>
<rect x="623.6" y="171.0" width="225.8" height="68" rx="5" fill="#1F4E5F"/>
<text x="736.5" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">we check</text>
<rect x="855.4000000000001" y="171.0" width="225.8" height="68" rx="5" fill="#1F4E5F"/>
<text x="968.3000000000001" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">they check</text>
<rect x="1087.2" y="171.0" width="286.8" height="68" rx="5" fill="#C86B2B"/>
<text x="1230.6000000000001" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">he checkS</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four the same, and one with a letter on it</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The fifth box is the whole of the present simple. One letter, one group of people.</text>
<text x="272.9" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">I</text>
<text x="504.70000000000005" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">you</text>
<text x="736.5" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">we</text>
<text x="968.3000000000001" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">they</text>
<text x="1230.6000000000001" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">he · she · it</text>
<text x="160" y="313.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">One letter. It goes on for he, she and it, and nowhere else in the present simple. It is the only ending this tense has, and it is the one that gets left off.</text>
</g>
</svg>
