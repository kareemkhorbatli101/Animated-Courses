<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The sound that lives between your teeth</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two millimetres of tongue. It is the difference between there and dare.</text>
<text x="470.0" y="545" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">/ð/</text>
<text x="470.0" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">tongue between the teeth, voice ON - and it is the common one</text>
<text x="470.0" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">there · the · this · they · with</text>
<rect x="395.0" y="630" width="150" height="14" rx="7" fill="#C86B2B"/>
<text x="1130.0" y="545" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">/θ/</text>
<text x="1130.0" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the same place, voice OFF - just air</text>
<text x="1130.0" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">think · thing · three · thank · month</text>
<rect x="1106.0" y="630" width="48" height="14" rx="7" fill="#C86B2B"/>
</g>
</svg>
