<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>The sound that lives between your teeth</title>
<desc>Two mouth cross-sections. In the first the tongue tip is between the teeth with the voice on; in the second the same position with the voice off, with example words under each.</desc>
