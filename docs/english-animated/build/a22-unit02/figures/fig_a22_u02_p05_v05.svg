<text x="140" y="662.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Plasterboard delivery has been delayed by a change of supplier.</text>
<text x="140" y="683.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">This is outside the contractor's control. No extension of time</text>
