<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>From a direct cause to a shrug</title>
<desc>A sectioned diagram of six strengths of causal link, from a stated mechanism down to a proverb, with example wording at each level.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="154" y="104" width="592" height="622" rx="0" fill="#F3ECE0"/>
<rect x="170" y="120" width="560" height="590" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4"/>
<rect x="170" y="120.0" width="560" height="98.33333333333333" rx="0" fill="#DCE6EA" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="218.33333333333331" width="560" height="98.33333333333333" rx="0" fill="#E4ECEF" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="316.66666666666663" width="560" height="98.33333333333333" rx="0" fill="#F2EDE2" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="415.0" width="560" height="98.33333333333333" rx="0" fill="#F6F0E4" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="513.3333333333333" width="560" height="98.33333333333333" rx="0" fill="#F6E6D6" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="611.6666666666666" width="560" height="98.33333333333333" rx="0" fill="#F3DCDC" stroke="#1C2B33" stroke-width="1.6"/>
<path d="M 730 120 L 740 146 L 720 172 L 740 198 L 720 224 L 740 250 L 720 276 L 740 302 L 720 328 L 740 354 L 720 380 L 740 406 L 720 432 L 740 458 L 720 484 L 740 510 L 720 536 L 740 562 L 720 588 L 740 614 L 720 640 L 740 666 L 720 692 L 730 710" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="20_subject">
<text x="190" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a stated mechanism</text>
<text x="190" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;Availability is weighted first, which is why…&quot;</text>
<text x="712" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">testable</text>
<text x="190" y="250.33333333333331" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a named consequence</text>
<text x="190" y="276.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;The upshot is that nobody can swap.&quot;</text>
<text x="712" y="250.33333333333331" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">owned</text>
<text x="190" y="348.66666666666663" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a formal connector</text>
<text x="190" y="374.66666666666663" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;Consequently, allocation shifted.&quot;</text>
<text x="712" y="348.66666666666663" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">neutral</text>
<text x="190" y="447.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a conditional</text>
<text x="190" y="473.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;Provided that you log it, you can override.&quot;</text>
<text x="712" y="447.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">conditional</text>
<text x="190" y="545.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">an accident</text>
<text x="190" y="571.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;It inadvertently removed swapping.&quot;</text>
<text x="712" y="545.3333333333333" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">nobody chose it</text>
<text x="190" y="643.6666666666666" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a proverb</text>
<text x="190" y="669.6666666666666" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">&quot;One thing leads to another.&quot;</text>
<text x="712" y="643.6666666666666" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">nobody at all</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">From a direct cause to a shrug</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six strengths of &quot;and so&quot;. The lower you go, the less anybody owns it.</text>
<circle cx="736" cy="179.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 179.0 L 866 179.0 L 866 179.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="184.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Only this one can be checked</text>
<circle cx="736" cy="308.8" r="4.5" fill="#C86B2B"/>
<path d="M 736 308.8 L 866 308.8 L 866 308.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="313.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Somebody is prepared to be</text>
<text x="880" y="334.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">wrong about it</text>
<circle cx="736" cy="438.6" r="4.5" fill="#C86B2B"/>
<path d="M 736 438.6 L 866 438.6 L 866 438.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="443.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">True, and it names no actor</text>
<circle cx="736" cy="556.6" r="4.5" fill="#C86B2B"/>
<path d="M 736 556.6 L 866 556.6 L 866 556.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="561.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">&quot;Inadvertently&quot; does a lot of</text>
<text x="880" y="581.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">work here</text>
<circle cx="736" cy="668.7" r="4.5" fill="#C86B2B"/>
<path d="M 736 668.7 L 866 668.7 L 866 668.7" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="673.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">This is where responsibility</text>
<text x="880" y="694.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">goes to die</text>
</g>
</svg>
