<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>A childhood, drawn as a map</title>
<desc>A network map of childhood with the street, the playground, the house, the holiday coast and a faded node for the thing that has gone.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="200" y1="400" x2="560" y2="230" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="560" y1="230" x2="560" y2="570" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="400" x2="560" y2="570" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="560" y1="230" x2="940" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="560" y1="570" x2="1310" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="940" y1="400" x2="1310" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="200" cy="400" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="200" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="200" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The house</text>
<text x="200" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">cousins, a song</text>
<circle cx="560" cy="230" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="560" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="560" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The street</text>
<text x="560" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a game, every evening</text>
<circle cx="560" cy="570" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="560" y="575" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="560" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The playground</text>
<text x="560" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a toy you lost</text>
<circle cx="940" cy="400" r="54" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="940" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="940" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The holiday</text>
<text x="940" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">every summer, the coast</text>
<circle cx="1310" cy="400" r="54" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1310" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1310" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Gone</text>
<text x="1310" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">only in a photo now</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">A childhood, drawn as a map</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five places. The dashed line is the one you only find again in a photograph.</text>
<rect x="322.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">out of the door</text>
<rect x="502.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="560.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and round the corner</text>
<rect x="322.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">a neighbour took you</text>
<rect x="692.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="750.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">once a year</text>
<rect x="877.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="935.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">they built on it</text>
<rect x="1067.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1125.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the coast is still there</text>
</g>
</svg>
