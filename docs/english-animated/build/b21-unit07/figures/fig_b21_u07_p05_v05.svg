<text x="410" y="880.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a warning, and the only honest phrase here</text>
<line x1="130" y1="912.5" x2="910" y2="912.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="934.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Every decision on this page has been defended in public, one at</text>
<text x="140" y="956.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a time. The absence is not a decision anybody made, which is</text>
<text x="140" y="978.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">what makes it hard to answer.</text>
