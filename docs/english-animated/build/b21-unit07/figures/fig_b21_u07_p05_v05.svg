<text x="140" y="754.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHO IS THE AGENT OF EACH NOUN</text>
<text x="140" y="784.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;a reduction ... achieved&quot;</text>
