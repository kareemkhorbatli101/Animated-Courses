<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140">
<title>The chart page, every noun unpacked</title>
<desc>A city air-quality report page annotated to show its nominalisations, the agent hidden in each, and the four changes to the series that the chart does not display.</desc>
