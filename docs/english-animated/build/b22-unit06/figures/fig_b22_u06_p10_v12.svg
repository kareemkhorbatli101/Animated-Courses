<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Three hundred and ten posts, forty-one injuries</title>
<desc>An infographic of a port automation programme showing posts removed, posts placed, injuries prevented and the two productivity studies.</desc>
