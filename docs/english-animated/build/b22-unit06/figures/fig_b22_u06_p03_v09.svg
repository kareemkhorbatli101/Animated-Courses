<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
<title>Which half the reader is left holding</title>
<desc>A proportional bar showing a concessive clause and a main clause, with the share of the sentence each occupies and the fact the reader keeps.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="540" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="206.0" width="189.2" height="68" rx="5" fill="#9AA7AE"/>
<text x="254.60000000000002" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">While</text>
<rect x="355.2" y="206.0" width="408.8" height="68" rx="5" fill="#C86B2B"/>
<text x="559.6" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the programme costs 94 posts</text>
<rect x="770.0" y="206.0" width="604.0" height="68" rx="5" fill="#2E6F5E"/>
<text x="1072.0" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">injuries have fallen by 78 per cent</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Which half the reader is left holding</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Identical information, two orders, and the main clause is what survives the sentence.</text>
<text x="254.60000000000002" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the connector</text>
<text x="559.6" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">conceded - the reader lets it go</text>
<text x="1072.0" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the main clause - this is what they keep</text>
<text x="160" y="348.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Reverse the two and the information is identical and the reader walks away with the opposite</text>
<text x="160" y="369.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">fact. Choosing which half goes in the subordinate clause is a moral choice before it is a</text>
<text x="160" y="391.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">grammatical one.</text>
</g>
</svg>
