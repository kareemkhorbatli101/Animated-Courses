<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>One dataset, six numbers</title>
<desc>A network from one waiting list dataset into six different true statements about it, with the measure each one uses marked.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="400" x2="520" y2="180" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="170" y1="400" x2="520" y2="620" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="170" y1="400" x2="880" y2="180" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="520" y1="180" x2="880" y2="620" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="880" y1="620" x2="1270" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="520" y1="620" x2="1270" y2="400" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
</g>
<g id="20_subject">
<circle cx="170" cy="400" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="170" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">6,700 referrals</text>
<text x="170" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the whole dataset</text>
<circle cx="520" cy="180" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="520" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="520" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">94 %</text>
<text x="520" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">seen within six weeks</text>
<circle cx="520" cy="620" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="520" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="520" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Mean 19 days</text>
<text x="520" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">dragged by the tail</text>
<circle cx="880" cy="180" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="880" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="880" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Median 11 days</text>
<text x="880" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the typical patient</text>
<circle cx="880" cy="620" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="880" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="880" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">402 people</text>
<text x="880" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the six per cent</text>
<circle cx="1270" cy="400" r="54" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1270" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1270" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">51 over two years</text>
<text x="1270" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">on three pathways</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One dataset, six numbers</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">All six are true. Three of them reassure and three of them do not.</text>
<rect x="287.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="345.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the regional format</text>
<rect x="287.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="345.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and this one is almost never useful</text>
<rect x="467.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="525.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the number a patient wants</text>
<rect x="642.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="700.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the other six per cent</text>
<rect x="1017.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1075.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the bulk of them on three</text>
<rect x="837.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="895.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">fifty-one people move the mean by eight days</text>
</g>
</svg>
