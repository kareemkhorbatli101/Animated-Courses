<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>A hedge that is tighter than the data</title>
<desc>Two panels comparing a claim of substantial improvement with the actual change, showing the size of the claim against the size of the evidence.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="80.0" y="120" width="700.0" height="430.75" rx="8" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<circle cx="116.0" cy="158" r="20" fill="#A8372E"/>
<text x="116.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">✗</text>
<rect x="820.0" y="120" width="700.0" height="430.75" rx="8" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<circle cx="856.0" cy="158" r="20" fill="#2E6F5E"/>
<text x="856.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">✓</text>
</g>
<g id="20_subject">
<text x="152.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Waiting times have improved substantially.</text>
<line x1="360.0" y1="220" x2="360.0" y2="340" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<text x="360.0" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">what the data shows: 2.1 points</text>
<circle cx="654.0" cy="270" r="12" fill="#A8372E"/>
<path d="M 654.0 270 L 388.0 270" fill="none" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="654.0" y="240" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">what the word claims</text>
<text x="104.0" y="485.85" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Substantially is not a hedge; it is a magnifier. It commits the writer to a change</text>
<text x="104.0" y="506.15000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">large enough to be obvious, and the change is two points on a figure that moves by one</text>
<text x="104.0" y="526.45" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">or two every quarter.</text>
<text x="892.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Waiting times have improved marginally, by about two points.</text>
<line x1="1100.0" y1="220" x2="1100.0" y2="340" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<text x="1100.0" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">what the data shows: 2.1 points</text>
<circle cx="1072.0" cy="270" r="12" fill="#2E6F5E"/>
<path d="M 1072.0 270 L 1072.0 270" fill="none" stroke="#2E6F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1072.0" y="240" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">what the words claim</text>
<text x="844.0" y="485.85" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Marginally matches the size of the change and the number is given, so a reader can</text>
<text x="844.0" y="506.15000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">check it. Nothing is lost except an impression the data did not support.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">A hedge that is tighter than the data</text>
<rect x="80" y="582.75" width="1440" height="109.25" rx="6" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.6"/>
<text x="104" y="608.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">What the writer thought:</text>
<text x="104" y="630.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Substantially, considerably, notably and largely feel like careful words because they are long. They</text>
<text x="104" y="652.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">make a claim bigger, not vaguer, and a reader is entitled to hold you to them.</text>
</g>
</svg>
