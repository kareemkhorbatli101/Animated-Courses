<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Thirty-eight minutes, seven lines, twenty-six passives</title>
<desc>An infographic of a port incident showing the timeline of the release, the chain-of-custody signatures, the passives in the report and what the camera covered.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="990" rx="0" fill="#FBF7F0"/>
</g>
