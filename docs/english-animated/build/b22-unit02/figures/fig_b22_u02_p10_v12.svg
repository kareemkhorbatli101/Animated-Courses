<circle cx="384.0" cy="490" r="10" fill="#2E6F5E"/>
<line x1="384.0" y1="490" x2="384.0" y2="550" stroke="#2E6F5E" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="878.0000000000001" cy="490" r="10" fill="#A8372E"/>
