<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The same event, and where the agent goes</title>
<desc>Two sentence diagrams of the same event, the first active with the agent in subject position and the second passive with the agent removed entirely.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="400.6666666666667" height="52" rx="5" fill="#C86B2B"/>
<text x="360.33333333333337" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">The night supervisor</text>
<rect x="566.6666666666667" y="144" width="244.25641025641025" height="52" rx="5" fill="#1F4E5F"/>
<text x="688.7948717948718" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">opened</text>
<rect x="816.923076923077" y="144" width="306.8205128205128" height="52" rx="5" fill="#2E6F5E"/>
<text x="970.3333333333335" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the gate</text>
<rect x="1129.7435897435898" y="144" width="244.25641025641025" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1251.871794871795" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">at 02.02</text>
<rect x="160" y="344" width="271.27272727272725" height="52" rx="5" fill="#2E6F5E"/>
<text x="295.6363636363636" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">The gate</text>
<rect x="437.27272727272725" y="344" width="326.72727272727275" height="52" rx="5" fill="#1F4E5F"/>
<text x="600.6363636363636" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">was opened</text>
<rect x="770.0" y="344" width="243.54545454545453" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="891.7727272727273" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">at 02.02</text>
<rect x="1019.5454545454545" y="344" width="354.45454545454544" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1196.7727272727273" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">(by whom?)</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The same event, and where the agent goes</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Active, passive with the agent, passive without. Nothing is added and one name disappears.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the agent can be kept and placed last, or removed - and the grammar looks the same</text>
</g>
</svg>
