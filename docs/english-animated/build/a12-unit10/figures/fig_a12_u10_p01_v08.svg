<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Four thousand one hundred cards, seven kinds</title>
<desc>The comment cards sorted into seven kinds, each joined to the number of cards in it, with the largest group being stories and the smallest being complaints.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="320" y1="200" x2="800" y2="400" stroke="#2E6F5E" stroke-width="7" stroke-linecap="round"/>
<line x1="250" y1="520" x2="800" y2="400" stroke="#D9A441" stroke-width="6" stroke-linecap="round"/>
<line x1="900" y1="120" x2="800" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="420" y1="700" x2="320" y2="200" stroke="#8C6A9E" stroke-width="4" stroke-linecap="round"/>
<line x1="900" y1="720" x2="800" y2="400" stroke="#C86B2B" stroke-width="4" stroke-linecap="round"/>
<line x1="1300" y1="620" x2="800" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round"/>
<line x1="1340" y1="220" x2="800" y2="400" stroke="#A8372E" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="60" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">4100</text>
<text x="800" y="486" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the cards</text>
<text x="800" y="506" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">eleven years</text>
<circle cx="320" cy="200" r="54" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="320" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">1100</text>
<text x="320" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">a story</text>
<text x="320" y="300" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the largest group</text>
<circle cx="250" cy="520" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="250" y="525" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">940</text>
<text x="250" y="592" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">a thank you</text>
<circle cx="420" cy="700" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="420" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">400</text>
<text x="420" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">a name</text>
<text x="420" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">somebody else's</text>
<circle cx="900" cy="720" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="900" y="725" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">310</text>
<text x="900" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">a joke</text>
<circle cx="1300" cy="620" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1300" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">150</text>
<text x="1300" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">a drawing</text>
<circle cx="1340" cy="220" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="1340" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">210</text>
<text x="1340" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">a complaint</text>
<text x="1340" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">all 210 answered</text>
<circle cx="900" cy="120" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="900" y="125" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">990</text>
<text x="900" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">nothing at all</text>
<text x="900" y="212" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">blank, and returned</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four thousand one hundred cards, seven kinds</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The biggest group is not the one the company expected. The smallest is the one it reads.</text>
<rect x="502.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="560.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">1,100 · and nobody has read one</text>
<rect x="467.0" y="445.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="525.0" y="464.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">940</text>
<rect x="792.0" y="245.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="850.0" y="264.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">990 blank · somebody took the card and put it back</text>
<rect x="312.0" y="435.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="370.0" y="454.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">400 of the stories name a passenger</text>
<rect x="792.0" y="545.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="850.0" y="564.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">310</text>
<rect x="992.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1050.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">150</text>
<rect x="1012.0" y="295.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1070.0" y="314.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">210 · the only group with a process behind it</text>
</g>
</svg>
