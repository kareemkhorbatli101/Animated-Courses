<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
<title>Too much, enough, and not enough</title>
<desc>A line with a comfortable band in the middle, not enough below it, enough inside it and too above it, with the word order marked for each.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="540" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="206.0" width="247.20754716981133" height="68" rx="5" fill="#A8372E"/>
<text x="283.60377358490564" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">not enough</text>
<rect x="413.20754716981133" y="206.0" width="201.16981132075472" height="68" rx="5" fill="#2E6F5E"/>
<text x="513.7924528301887" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">enough</text>
<rect x="620.377358490566" y="206.0" width="201.16981132075472" height="68" rx="5" fill="#C86B2B"/>
<text x="720.9622641509434" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">too</text>
<rect x="827.5471698113208" y="206.0" width="270.22641509433964" height="68" rx="5" fill="#1F4E5F"/>
<text x="962.6603773584907" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">enough time</text>
<rect x="1103.7735849056605" y="206.0" width="270.22641509433964" height="68" rx="5" fill="#1F4E5F"/>
<text x="1238.8867924528304" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">long enough</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Too much, enough, and not enough</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Enough goes after an adjective and before a noun. Nothing else in English does this.</text>
<text x="283.60377358490564" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">less than you need</text>
<text x="513.7924528301887" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">right</text>
<text x="720.9622641509434" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">more than you want</text>
<text x="962.6603773584907" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">BEFORE a noun</text>
<text x="1238.8867924528304" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">AFTER an adjective</text>
<text x="160" y="348.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Too long is a complaint. Very long is a description. Not enough time is less than you need. The</text>
<text x="160" y="369.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">word enough changes sides depending on what it is next to, and reversing it - enough long - is</text>
<text x="160" y="391.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">the commonest error in this unit.</text>
</g>
</svg>
