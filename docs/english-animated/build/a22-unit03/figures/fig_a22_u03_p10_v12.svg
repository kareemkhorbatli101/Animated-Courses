<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
<title>Nine hours and fifty minutes</title>
<desc>An infographic of one night showing the forecast revision, the warnings, the drain, the hall opening and the first water, with what each person knew.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="840" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="40" y="130" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="164.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What the</text>
<text x="52" y="184.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">council had</text>
<line x1="150" y1="250" x2="1450" y2="250" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
