<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>BEFORE, and BY THE TIME</title>
<desc>Two panels comparing two events in sequence and one event already completed when a second arrives.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="60.0" y="130" width="720.0" height="460" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="60.0" y="130" width="720.0" height="42" rx="6" fill="#1F4E5F"/>
<rect x="60.0" y="160" width="720.0" height="12" rx="0" fill="#1F4E5F"/>
<text x="420.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">BEFORE - one, then the other</text>
<rect x="820.0" y="130" width="720.0" height="460" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="820.0" y="130" width="720.0" height="42" rx="6" fill="#C86B2B"/>
<rect x="820.0" y="160" width="720.0" height="12" rx="0" fill="#C86B2B"/>
<text x="1180.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">BY THE TIME - a deadline, already met</text>
</g>
<g id="20_subject">
<line x1="80.0" y1="542" x2="760.0" y2="542" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="135.0" y="486" width="110" height="56" rx="0" fill="#2E6F5E" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="275.0" y="486" width="110" height="56" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<text x="360.0" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">he moved it before the forecast changed</text>
<line x1="840.0" y1="542" x2="1520.0" y2="542" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="840.0" y="486" width="220" height="56" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<path d="M 1206.0 508 l 10 12 l 20 -26" fill="none" stroke="#2E6F5E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1120.0" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="600" font-style="normal">by the time it changed, he HAD moved it</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">BEFORE, and BY THE TIME</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Both put one thing earlier. One of them is a sequence; the other is a deadline.</text>
<text x="800.0" y="634" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">Which one tells you the first thing was finished?</text>
<text x="800.0" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">6 differences — find them all</text>
</g>
</svg>
