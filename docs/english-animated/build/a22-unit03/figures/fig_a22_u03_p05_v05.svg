<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
<title>The inquiry's timeline of the night</title>
<desc>An official inquiry timeline listing the forecast revision, warnings, the drain reversal, the hall opening and the first water, with sources and gaps.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1010" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
