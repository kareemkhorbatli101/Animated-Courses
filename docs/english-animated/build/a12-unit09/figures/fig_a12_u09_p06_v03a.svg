<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890">
<title>One plan, six weathers</title>
<desc>Six panels showing one plan under six weather conditions, from clear to forty below, with the plan surviving, moving and ending.</desc>
