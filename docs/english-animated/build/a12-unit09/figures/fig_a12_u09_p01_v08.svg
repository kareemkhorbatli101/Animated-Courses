<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Four seasons, and what each one does to a railway</title>
<desc>The four seasons drawn as a ring with the effect of each on the railway written on the lines between them and the number of days lost beside each.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="320" y1="220" x2="560" y2="120" stroke="#1F4E5F" stroke-width="7" stroke-linecap="round"/>
<line x1="560" y1="120" x2="800" y2="400" stroke="#9AA7AE" stroke-width="7" stroke-linecap="round"/>
<line x1="280" y1="580" x2="560" y2="700" stroke="#2E6F5E" stroke-width="5" stroke-linecap="round"/>
<line x1="560" y1="700" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1240" y1="220" x2="1040" y2="120" stroke="#A8372E" stroke-width="4" stroke-linecap="round"/>
<line x1="1300" y1="580" x2="800" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="58" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">062</text>
<text x="800" y="484" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the line</text>
<text x="800" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">4,400 km</text>
<circle cx="320" cy="220" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="320" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">W</text>
<text x="320" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">winter</text>
<text x="320" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Nov to Mar</text>
<circle cx="280" cy="580" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="280" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="280" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">spring</text>
<text x="280" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Apr to May</text>
<circle cx="1240" cy="220" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1240" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">J</text>
<text x="1240" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">summer</text>
<text x="1240" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Jun to Aug</text>
<circle cx="1300" cy="580" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1300" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">A</text>
<text x="1300" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">autumn</text>
<text x="1300" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Sep to Oct</text>
<circle cx="560" cy="120" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="560" y="125" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">41</text>
<text x="560" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">ice and frost heave</text>
<text x="560" y="212" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">41 days lost</text>
<circle cx="560" cy="700" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="560" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">12</text>
<text x="560" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">flooding</text>
<text x="560" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">12 days lost</text>
<circle cx="1040" cy="120" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="1040" y="125" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1040" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">fire near the line</text>
<text x="1040" y="212" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6 days lost</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four seasons, and what each one does to a railway</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Each line has the days lost beside it. The season with the fewest is the one nobody plans for.</text>
<rect x="382.0" y="155.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="440.0" y="174.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">minus forty, and the rail shortens</text>
<rect x="622.0" y="245.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="680.0" y="264.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">41 of the 59 lost days</text>
<rect x="362.0" y="625.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="420.0" y="644.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the thaw, and the culverts</text>
<rect x="622.0" y="535.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="680.0" y="554.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">12 days, and always the same four places</text>
<rect x="1082.0" y="155.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1140.0" y="174.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">dry grass and a spark</text>
<rect x="992.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1050.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">no days lost at all - and no plan for it either</text>
</g>
</svg>
