<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>The decision arrow that started too late</title>
<desc>Two panels comparing I will check it at four, said about a decision made that morning, with I am going to check it at four.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="720" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="80.0" y="120" width="700.0" height="429.0" rx="8" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<circle cx="116.0" cy="158" r="20" fill="#A8372E"/>
<text x="116.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">✗</text>
<rect x="820.0" y="120" width="700.0" height="429.0" rx="8" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<circle cx="856.0" cy="158" r="20" fill="#2E6F5E"/>
<text x="856.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">✓</text>
</g>
<g id="20_subject">
<text x="152.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">I'll check it again at four.</text>
<line x1="290.0" y1="220" x2="290.0" y2="340" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<text x="290.0" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">decided this morning</text>
<circle cx="542.0" cy="270" r="12" fill="#A8372E"/>
<path d="M 542.0 270 L 318.0 270" fill="none" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542.0" y="240" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">will - but will starts HERE, as you speak</text>
<text x="104.0" y="484.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Will says the decision is being made right now. If you decided eight hours ago, the</text>
<text x="104.0" y="504.40000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">listener hears a sudden idea where there was a plan. Nothing is ungrammatical - what</text>
<text x="104.0" y="524.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">has happened is that you have made yourself sound unprepared.</text>
<text x="892.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">I'm going to check it again at four.</text>
<line x1="1030.0" y1="220" x2="1030.0" y2="340" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<text x="1030.0" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">decided this morning</text>
<circle cx="1114.0" cy="270" r="12" fill="#2E6F5E"/>
<path d="M 1114.0 270 L 1058.0 270" fill="none" stroke="#2E6F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1114.0" y="240" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">going to - the arrow starts where you decided</text>
<text x="844.0" y="484.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Going to reaches back to the moment of the decision, or to the evidence you can see. It</text>
<text x="844.0" y="504.40000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">is the ordinary future for anything you have thought about, which is most things, and</text>
<text x="844.0" y="524.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">it is the one learners use least.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The decision arrow that started too late</text>
<rect x="80" y="581.0" width="1440" height="131.0" rx="6" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.6"/>
<text x="104" y="607.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">What the writer thought:</text>
<text x="104" y="628.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Will is taught first and taught as THE future, so it becomes the default. In real speech going to and</text>
<text x="104" y="650.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the present continuous between them do most of the work, and will is reserved for offers, promises and</text>
<text x="104" y="672.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">things decided mid-sentence.</text>
</g>
</svg>
