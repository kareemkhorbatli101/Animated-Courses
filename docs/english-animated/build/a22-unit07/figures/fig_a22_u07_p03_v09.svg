<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
<title>A decision, and a future that is simply running</title>
<desc>Two parallel sentences compared, one a spontaneous decision with will and one a future arrangement with will be plus -ing.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="660" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="299.0" height="52" rx="5" fill="#C86B2B"/>
<text x="309.5" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I'll</text>
<rect x="465.0" y="144" width="375.25" height="52" rx="5" fill="#1F4E5F"/>
<text x="652.625" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">take</text>
<rect x="846.25" y="144" width="527.75" height="52" rx="5" fill="#2E6F5E"/>
<text x="1110.125" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">it. - A DECISION, NOW</text>
<rect x="160" y="344" width="238.0" height="52" rx="5" fill="#C86B2B"/>
<text x="279.0" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I'll</text>
<rect x="404.0" y="344" width="421.0" height="52" rx="5" fill="#1F4E5F"/>
<text x="614.5" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">be taking</text>
<rect x="831.0" y="344" width="543.0" height="52" rx="5" fill="#2E6F5E"/>
<text x="1102.5" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the boat out at four. - ALREADY IN MOTION</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">A decision, and a future that is simply running</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Both use will. Only one of them is a decision being made in the sentence.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="564" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="588.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Will you be coming? is softer than Are you coming?, because it asks about your arrangements</text>
<text x="184" y="609.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">rather than your intentions.</text>
</g>
</svg>
