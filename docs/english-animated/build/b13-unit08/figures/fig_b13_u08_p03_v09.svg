<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>Did it happen, or not?</title>
<desc>A vertical ladder of hypothetical past forms arranged by whether the action happened, with needn't have at the top and should have below.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="606.0" y1="150.0" x2="674.0" y2="150.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="230.0" x2="674.0" y2="230.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="310.0" x2="674.0" y2="310.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="390.0" x2="674.0" y2="390.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="470.0" x2="674.0" y2="470.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="550.0" x2="674.0" y2="550.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="630.0" x2="674.0" y2="630.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="640.0" y1="130" x2="640.0" y2="650" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round"/>
</g>
<g id="20_subject">
<text x="698.0" y="156.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">needn't have done</text>
<text x="940.0" y="156.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">it was done, and it was unnecessary</text>
<text x="698.0" y="236.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">did not need to do</text>
<text x="940.0" y="236.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">and it probably was not done at all</text>
<text x="698.0" y="316.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">might have done</text>
<text x="940.0" y="316.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">possible - and nobody has established which</text>
<text x="698.0" y="396.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">could have done</text>
<text x="940.0" y="396.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">it was possible. Not done. Not yet a criticism</text>
<text x="698.0" y="476.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">would have done</text>
<text x="940.0" y="476.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the consequence of a condition that did not hold</text>
<text x="698.0" y="556.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ought to have done</text>
<text x="940.0" y="556.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a duty. Not done</text>
<text x="698.0" y="636.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">should have done</text>
<text x="940.0" y="636.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the right thing. Not done</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Did it happen, or not?</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five of these say it did not. One says it did, and it is the one everybody gets wrong.</text>
<text x="590.0" y="122" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="end" font-weight="700" font-style="normal">it DID happen</text>
<text x="590.0" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="end" font-weight="700" font-style="normal">it did NOT happen</text>
</g>
</svg>
