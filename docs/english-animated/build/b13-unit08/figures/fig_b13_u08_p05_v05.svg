<text x="140" y="814.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">TUTOR: &quot;Flagging a concern about [student], attendance and two</text>
