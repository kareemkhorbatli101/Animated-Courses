<text x="140" y="519.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1 unit outline · 2 assessment deadlines · 3 moderation · 4</text>
<text x="140" y="541.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">marking allocation · 5 room bookings · 6 reading list · 7 guest</text>
<text x="140" y="562.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">lecturers · 8 online materials · 9 budget codes · 10 staff</text>
