<text x="140" y="961.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Could it have been answered</text>
<text x="410" y="961.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes - by coordinator 1, who had left</text>
<line x1="130" y1="993.25" x2="910" y2="993.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="1025.25" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">THE ATTENDANCE THRESHOLD:</text>
<text x="140" y="1055.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Four consecutive absences.&quot; At four, a third of a twelve-week</text>
<text x="140" y="1077.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">semester is already gone. At a threshold of two it would have</text>
<text x="140" y="1098.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">fired in week two, when coordinator 1 was still in post.</text>
