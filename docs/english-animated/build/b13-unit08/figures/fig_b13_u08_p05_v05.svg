<text x="140" y="871.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">COORDINATOR 2: &quot;Happy to - is there any background on this one?</text>
