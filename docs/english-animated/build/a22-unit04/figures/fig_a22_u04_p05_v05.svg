<text x="1040" y="385.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">people, three verdicts</text>
<circle cx="934" cy="472.0" r="4.5" fill="#C86B2B"/>
