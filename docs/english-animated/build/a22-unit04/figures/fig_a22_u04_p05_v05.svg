<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
<title>The newspaper article</title>
<desc>A newspaper article about an inquiry section, showing the headline, the quoted paragraphs, the reporting verbs used for each witness and what was left out.</desc>
