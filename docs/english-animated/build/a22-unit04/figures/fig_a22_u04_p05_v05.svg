<text x="656.6666666666667" y="361.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">VERB USED</text>
<text x="150.0" y="391.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4.1 - times differ by 40 min</text>
<text x="403.33333333333337" y="391.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<text x="656.6666666666667" y="391.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the report states</text>
<line x1="140" y1="401.75" x2="900" y2="401.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="421.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4.2 - Resident A, clock</text>
<text x="403.33333333333337" y="421.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<text x="656.6666666666667" y="421.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">A claims</text>
<line x1="140" y1="431.75" x2="900" y2="431.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="451.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4.3 - Resident B, radio</text>
<text x="403.33333333333337" y="451.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<text x="656.6666666666667" y="451.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">B insists</text>
<line x1="140" y1="461.75" x2="900" y2="461.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="481.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4.4 - Resident C, the hall</text>
<text x="403.33333333333337" y="481.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<text x="656.6666666666667" y="481.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">C admits</text>
<line x1="140" y1="491.75" x2="900" y2="491.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="511.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4.5 - metadata adopted</text>
<text x="403.33333333333337" y="511.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes</text>
<text x="656.6666666666667" y="511.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the inquiry has settled on</text>
<line x1="140" y1="521.75" x2="900" y2="521.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="541.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4.6 - all accounts honest</text>
<text x="403.33333333333337" y="541.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NO</text>
<text x="656.6666666666667" y="541.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">-</text>
<line x1="140" y1="551.75" x2="900" y2="551.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="579.75" x2="910" y2="579.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="615.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ONE SENTENCE WITH NO SOURCE</text>
<text x="140" y="645.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;The inquiry is understood to have found the residents' evidence</text>
<text x="140" y="667.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">of limited value.&quot; No paragraph of the report says this.</text>
<line x1="130" y1="703.25" x2="910" y2="703.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="739.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE CORRECTION, ELEVEN DAYS LATER</text>
<text x="140" y="769.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Page</text>
<text x="410" y="769.25" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4, foot</text>
<text x="140" y="801.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Words</text>
<text x="410" y="801.25" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">31</text>
<line x1="130" y1="833.25" x2="910" y2="833.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="865.25" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">THE CORRECTION, IN FULL:</text>
<text x="140" y="895.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Our report of the 14th stated that the inquiry had found</text>
<text x="140" y="917.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">residents' evidence to be of limited value. The inquiry made no</text>
<text x="140" y="938.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">such finding. We apologise.&quot;</text>
</g>
<g id="40_callouts">
