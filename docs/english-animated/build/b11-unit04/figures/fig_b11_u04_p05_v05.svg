<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
<title>The 2019 inspection report</title>
<desc>A premises inspection report listing items for attention, with a compliance statement and a signature in a stated capacity.</desc>
