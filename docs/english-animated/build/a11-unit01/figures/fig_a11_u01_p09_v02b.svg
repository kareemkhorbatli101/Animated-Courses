<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>The desk from behind</title>
<desc>A cutaway of the reception desk seen from behind, showing the diary, the pigeonholes, the key cupboard and the forms that have not been entered.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="154" y="104" width="592" height="562" rx="0" fill="#F3ECE0"/>
<rect x="170" y="120" width="560" height="530" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4"/>
<rect x="170" y="120.0" width="560" height="132.5" rx="0" fill="#F3EADA" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="252.5" width="560" height="132.5" rx="0" fill="#E8EEF0" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="385.0" width="560" height="132.5" rx="0" fill="#EFE6DC" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="517.5" width="560" height="132.5" rx="0" fill="#F1EDE2" stroke="#1C2B33" stroke-width="1.6"/>
<path d="M 730 120 L 740 146 L 720 172 L 740 198 L 720 224 L 740 250 L 720 276 L 740 302 L 720 328 L 740 354 L 720 380 L 740 406 L 720 432 L 740 458 L 720 484 L 740 510 L 720 536 L 740 562 L 720 588 L 740 614 L 720 640 L 730 650" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="20_subject">
<text x="190" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">what you see</text>
<text x="190" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">A counter, and somebody who says good morning</text>
<text x="190" y="284.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the diary</text>
<text x="190" y="310.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Who is expected, and who has not come</text>
<text x="190" y="417.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the pigeonholes</text>
<text x="190" y="443.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">One for every name, and three with no name on them</text>
<text x="190" y="549.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the tray</text>
<text x="190" y="575.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Eleven forms, filled in, not yet typed in anywhere</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The desk from behind</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four layers. The learner only ever sees the first one.</text>
<circle cx="736" cy="183.6" r="4.5" fill="#C86B2B"/>
<path d="M 736 183.6 L 866 183.6 L 866 183.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="188.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The only layer a new student</text>
<text x="880" y="208.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">knows about</text>
<circle cx="736" cy="321.4" r="4.5" fill="#C86B2B"/>
<path d="M 736 321.4 L 866 321.4 L 866 321.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="326.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">And this is how she knew Yusuf</text>
<text x="880" y="346.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">was coming</text>
<circle cx="736" cy="448.6" r="4.5" fill="#C86B2B"/>
<path d="M 736 448.6 L 866 448.6 L 866 448.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="453.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three with no name. Nobody has</text>
<text x="880" y="473.90000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">asked who they are for</text>
<circle cx="736" cy="586.4" r="4.5" fill="#C86B2B"/>
<path d="M 736 586.4 L 866 586.4 L 866 586.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="591.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Eleven forms. The system is a</text>
<text x="880" y="611.6999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">tray</text>
</g>
</svg>
