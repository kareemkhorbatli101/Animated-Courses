<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<title>Four explanations, and where the point sat</title>
<desc>A study sheet of four learner explanations showing where the main point sat in each, how much the listener kept, and a framed version of each.</desc>
