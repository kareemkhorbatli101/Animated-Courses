<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>Do, and where it goes</title>
<desc>Two sentence diagrams. In the first, do not is inserted before the verb; in the second, do moves to the front of the sentence. The verb itself does not move in either.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="640" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="220.97674418604652" height="52" rx="5" fill="#C86B2B"/>
<text x="270.48837209302326" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I</text>
<rect x="386.9767441860465" y="144" width="334.4651162790698" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="554.2093023255813" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">do not</text>
<rect x="727.4418604651163" y="144" width="249.34883720930233" height="52" rx="5" fill="#1F4E5F"/>
<text x="852.1162790697674" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">work</text>
<rect x="982.7906976744187" y="144" width="391.2093023255814" height="52" rx="5" fill="#2E6F5E"/>
<text x="1178.3953488372094" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">on Saturday</text>
<rect x="160" y="344" width="291.5609756097561" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="305.780487804878" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">Do</text>
<rect x="457.5609756097561" y="344" width="232.0487804878049" height="52" rx="5" fill="#C86B2B"/>
<text x="573.5853658536586" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">you</text>
<rect x="695.609756097561" y="344" width="261.8048780487805" height="52" rx="5" fill="#1F4E5F"/>
<text x="826.5121951219512" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">work</text>
<rect x="963.4146341463415" y="344" width="410.5853658536585" height="52" rx="5" fill="#2E6F5E"/>
<text x="1168.7073170731708" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">on Saturday ?</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Do, and where it goes</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">For a negative, do not drops in before the verb. For a question, do jumps to the front.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">NEGATIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">QUESTION</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ the verb does not move. Only do moves.</text>
<rect x="160" y="500.75" width="1280" height="99.25" rx="6" fill="#F3ECE0"/>
<text x="184" y="527.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Negative: do not, or don't, goes in front of the verb. Question: do goes to the very front</text>
<text x="184" y="549.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">of the sentence. The verb stays as it is, both times. It never takes an s and it never</text>
<text x="184" y="571.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">moves.</text>
</g>
</svg>
