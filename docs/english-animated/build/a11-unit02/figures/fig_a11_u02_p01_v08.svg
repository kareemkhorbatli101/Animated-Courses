<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>A day is a circle</title>
<desc>Six moments of a day arranged in a ring - wake up, have breakfast, work, eat, study, go to bed - joined by lines labelled with the number of hours between them.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="800" y1="140" x2="1180" y2="280" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1180" y1="280" x2="1280" y2="560" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1280" y1="560" x2="880" y2="680" stroke="#9AA7AE" stroke-width="7" stroke-linecap="round"/>
<line x1="880" y1="680" x2="480" y2="600" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="480" y1="600" x2="400" y2="300" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="400" y1="300" x2="800" y2="140" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
</g>
<g id="20_subject">
<circle cx="800" cy="140" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="800" y="145" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="800" y="212" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">wake up</text>
<text x="800" y="232" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6.00</text>
<circle cx="1180" cy="280" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1180" y="285" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">6½</text>
<text x="1180" y="352" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">have breakfast</text>
<text x="1180" y="372" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6.30</text>
<circle cx="1280" cy="560" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="1280" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">7</text>
<text x="1280" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">work</text>
<text x="1280" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">7.00</text>
<circle cx="880" cy="680" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="880" y="685" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="880" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">eat</text>
<text x="880" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">15.00</text>
<circle cx="480" cy="600" r="50" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="480" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">7</text>
<text x="480" y="676" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">study</text>
<text x="480" y="696" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">19.00</text>
<circle cx="400" cy="300" r="46" fill="#FFFFFF" stroke="#55646D" stroke-width="3"/>
<text x="400" y="305" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="700" font-style="normal">10½</text>
<text x="400" y="372" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">go to bed</text>
<text x="400" y="392" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">22.30</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">A day is a circle</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six moments, and the hours on the lines between them. It comes back to where it started.</text>
<rect x="932.0" y="195.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="990.0" y="214.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">half an hour</text>
<rect x="1172.0" y="405.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1230.0" y="424.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">half an hour</text>
<rect x="1022.0" y="605.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1080.0" y="624.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">eight hours</text>
<rect x="622.0" y="625.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="680.0" y="644.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">four hours</text>
<rect x="382.0" y="435.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="440.0" y="454.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">three hours</text>
<rect x="542.0" y="205.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="600.0" y="224.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">seven and a half - and it starts again</text>
</g>
</svg>
