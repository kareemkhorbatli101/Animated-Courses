<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470">
<title>Four people, one verb</title>
<desc>Five boxes in a row. The first four read I work, you work, we work and they work in the same colour; the fifth is greyed out with a question mark and labelled Unit 3.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="470" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="171.0" width="238.0" height="68" rx="5" fill="#1F4E5F"/>
<text x="279.0" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I work</text>
<rect x="404.0" y="171.0" width="238.0" height="68" rx="5" fill="#1F4E5F"/>
<text x="523.0" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">you work</text>
<rect x="648.0" y="171.0" width="238.0" height="68" rx="5" fill="#1F4E5F"/>
<text x="767.0" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">we work</text>
<rect x="892.0" y="171.0" width="238.0" height="68" rx="5" fill="#1F4E5F"/>
<text x="1011.0" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">they work</text>
<rect x="1136.0" y="171.0" width="238.0" height="68" rx="5" fill="#9AA7AE"/>
<text x="1255.0" y="212.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">he work ?</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four people, one verb</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Look at the four boxes. They are the same colour because they are the same word.</text>
<text x="279.0" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">I</text>
<text x="523.0" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">you</text>
<text x="767.0" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">we</text>
<text x="1011.0" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">they</text>
<text x="1255.0" y="267.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Unit 3 - here it changes</text>
<text x="160" y="313.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Four boxes, one word. The verb does not change for I, you, we or they. In Unit 3 it changes for he, she and it - and that is the only place in the whole language where it changes at all.</text>
</g>
</svg>
