<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>The market gate, in section</title>
<desc>A market gatehouse drawn in section showing the roof aerial, the camera bracket, the office window and the till, each labelled with what it records.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="154" y="104" width="592" height="582" rx="0" fill="#F3ECE0"/>
<rect x="170" y="120" width="560" height="550" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4"/>
<rect x="170" y="120.0" width="560" height="137.5" rx="0" fill="#E4ECEF" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="257.5" width="560" height="137.5" rx="0" fill="#EFE2DD" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="395.0" width="560" height="137.5" rx="0" fill="#F6F0E4" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="170" y="532.5" width="560" height="137.5" rx="0" fill="#F2EDE2" stroke="#1C2B33" stroke-width="1.6"/>
<path d="M 730 120 L 740 146 L 720 172 L 740 198 L 720 224 L 740 250 L 720 276 L 740 302 L 720 328 L 740 354 L 720 380 L 740 406 L 720 432 L 740 458 L 720 484 L 740 510 L 720 536 L 740 562 L 720 588 L 740 614 L 720 640 L 740 666 L 730 670" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="20_subject">
<text x="190" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the roof</text>
<text x="190" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Wifi aerial - installed free, and it counts connections</text>
<text x="712" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">2026</text>
<text x="190" y="289.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the bracket</text>
<text x="190" y="315.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Two cameras - &quot;for counting vehicles&quot;, since 2023</text>
<text x="712" y="289.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">2023</text>
<text x="190" y="427.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the office window</text>
<text x="190" y="453.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">One camera, pointing in. Nobody asked for this one</text>
<text x="712" y="427.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">?</text>
<text x="190" y="564.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the till</text>
<text x="190" y="590.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Card reader - time, amount, and which stall</text>
<text x="712" y="564.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#C86B2B" text-anchor="end" font-weight="700" font-style="normal">2018</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The market gate, in section</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four levels, four things being counted, and one device nobody asked for.</text>
<circle cx="736" cy="186.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 186.0 L 866 186.0 L 866 186.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="191.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Free, and counting before</text>
<text x="880" y="211.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">anybody logs in</text>
<circle cx="736" cy="329.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 329.0 L 866 329.0 L 866 329.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="334.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Vehicles, allegedly. The</text>
<text x="880" y="354.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">question from 2011</text>
<circle cx="736" cy="461.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 461.0 L 866 461.0 L 866 461.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="466.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Pointing at the committee room</text>
<text x="880" y="486.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">door</text>
<circle cx="736" cy="604.0" r="4.5" fill="#C86B2B"/>
<path d="M 736 604.0 L 866 604.0 L 866 604.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="880" y="609.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The oldest one, and the only</text>
<text x="880" y="629.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">one anybody consented to</text>
</g>
</svg>
