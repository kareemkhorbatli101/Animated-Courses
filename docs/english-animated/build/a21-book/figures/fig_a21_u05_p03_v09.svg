<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The condition comes first, the result comes second</title>
<desc>A timeline showing an if-clause in the present tense and a will-clause for the result, with time clauses marked underneath.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="160" y1="490" x2="1380" y2="490" stroke="#1C2B33" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="1380,490 1364,482 1364,498" fill="#1C2B33"/>
<line x1="428.4" y1="330" x2="428.4" y2="524" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="428.4" y="548" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2">NOW</text>
</g>
<g id="20_subject">
<line x1="477.2" y1="436" x2="721.2" y2="436" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 6"/>
<line x1="721.2" y1="414" x2="721.2" y2="458" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<line x1="794.4" y1="328" x2="428.4" y2="328" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="794.4" cy="328" r="7" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<circle cx="428.4" cy="328" r="7" fill="#1F4E5F"/>
<circle cx="794.4" cy="220" r="11" fill="#1F4E5F"/>
<line x1="794.4" y1="220" x2="794.4" y2="490" stroke="#1F4E5F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The condition comes first, the result comes second</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Both halves are about the future. Only one of them is allowed to say will.</text>
<text x="477.2" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">IF + present - the condition</text>
<text x="477.2" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">If the van comes at six...</text>
<text x="794.4" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">WILL - the result</text>
<text x="794.4" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">...I'll open at half past.</text>
<text x="794.4" y="168" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">AS SOON AS / UNTIL / BY THE TIME + present</text>
<text x="794.4" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">I'll start as soon as it arrives.</text>
<rect x="160" y="604" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="628.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">After if, unless, when, as soon as, until and by the time, English uses the present even</text>
<text x="184" y="649.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">though you mean the future. Never If it will rain.</text>
</g>
</svg>
