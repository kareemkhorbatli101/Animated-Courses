<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
<title>The morning the slot moved</title>
<desc>An infographic of a market morning from four to ten showing deliveries, buyer types, the slot change and the cost of each option.</desc>
