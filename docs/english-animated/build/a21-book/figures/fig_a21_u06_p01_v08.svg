<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>Price is printed. Worth is argued about.</title>
<desc>A network connecting price, cost, running cost, value and worth, showing which are measurable and which are judgements.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="190" y1="400" x2="540" y2="230" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="190" y1="400" x2="540" y2="570" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="540" y1="230" x2="920" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="540" y1="570" x2="920" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="920" y1="400" x2="1300" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="190" y1="400" x2="1300" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="190" cy="400" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="190" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="190" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Price</text>
<text x="190" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">printed on the card</text>
<circle cx="540" cy="230" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="540" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="540" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Running cost</text>
<text x="540" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">every year, quietly</text>
<circle cx="540" cy="570" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="540" y="575" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="540" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">How long it lasts</text>
<text x="540" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">nobody tells you</text>
<circle cx="920" cy="400" r="54" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="920" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="920" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Value for money</text>
<text x="920" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">price ÷ years</text>
<circle cx="1300" cy="400" r="54" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1300" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1300" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Worth it?</text>
<text x="1300" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and that is a judgement</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Price is printed. Worth is argued about.</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five nodes. Only one of them has a number you can read off a label.</text>
<rect x="307.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="365.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the bill you forget</text>
<rect x="307.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="365.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the warranty hints at it</text>
<rect x="672.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="730.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">add it up over the years</text>
<rect x="672.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="730.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">divide by the years</text>
<rect x="1052.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1110.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and then you decide</text>
<rect x="687.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="745.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">what most people actually use</text>
</g>
</svg>
