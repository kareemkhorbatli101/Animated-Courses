<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The word you lean on</title>
<desc>Five sentences with the stressed syllables drawn as large dots, showing the stress on so and too but not on such.</desc>
