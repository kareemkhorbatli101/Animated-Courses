<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>How often hands are washed, by distance to the basin</title>
<desc>A bar chart of handwashing events per hour against the distance from the food to the basin, falling steeply beyond one metre.</desc>
