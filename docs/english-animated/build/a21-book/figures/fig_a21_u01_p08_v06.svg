<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>How long the traders have been here</title>
<desc>A bar chart of market traders grouped by how many years they have traded, showing a large group under two years and a second group over twenty.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="400" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="550.0" x2="1350" y2="550.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="555.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="450.0" x2="1350" y2="450.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="455.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">4</text>
<line x1="170" y1="350.0" x2="1350" y2="350.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="355.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">7</text>
<line x1="170" y1="250.0" x2="1350" y2="250.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="255.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">10</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">14</text>
</g>
<g id="20_subject">
<rect x="213.7037037037037" y="407.1428571428571" width="98.33333333333333" height="142.8571428571429" rx="0" fill="#1F4E5F"/>
<rect x="410.3703703703703" y="292.85714285714283" width="98.33333333333333" height="257.14285714285717" rx="0" fill="#1F4E5F"/>
<rect x="607.037037037037" y="435.7142857142857" width="98.33333333333333" height="114.28571428571428" rx="0" fill="#1F4E5F"/>
<rect x="803.7037037037037" y="378.57142857142856" width="98.33333333333333" height="171.42857142857144" rx="0" fill="#1F4E5F"/>
<rect x="1000.3703703703703" y="378.57142857142856" width="98.33333333333333" height="171.42857142857144" rx="0" fill="#1F4E5F"/>
<rect x="1197.037037037037" y="235.71428571428572" width="98.33333333333333" height="314.2857142857143" rx="0" fill="#1F4E5F"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">How long the traders have been here</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Forty-one traders in this part of the market.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">traders</text>
<text x="268.3333333333333" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">under 1 yr</text>
<text x="464.99999999999994" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">1-2 yrs</text>
<text x="661.6666666666666" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">3-5 yrs</text>
<text x="858.3333333333334" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6-10 yrs</text>
<text x="1055.0" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">11-20 yrs</text>
<text x="1251.6666666666665" y="578" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">over 20 yrs</text>
<rect x="170" y="610" width="1180" height="43.75" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="637.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Three years is also when you can apply for a permanent table. Look at the gap again.</text>
<text x="170" y="689.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Almost nobody stays between three and five years. The traders who get past five tend to stay</text>
<text x="170" y="711.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">for twenty.</text>
</g>
</svg>
