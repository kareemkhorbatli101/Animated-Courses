<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>A plan, and a hope</title>
<desc>Two panels compared: one showing a plan with named fallbacks and times, the other showing a single arrow with nothing behind it.</desc>
