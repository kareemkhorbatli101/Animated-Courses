<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>The -ed you cannot hear</title>
<desc>Five past participles shown written and spoken, with the -ed realised as a t, a d, a full syllable, or not present.</desc>
