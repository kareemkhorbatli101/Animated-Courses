<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>A habit that stopped, and one that did not</title>
<desc>A timeline with a long band for a past habit that stops before now and a second band that reaches now, labelled used to and still.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="160" y1="490" x2="1380" y2="490" stroke="#1C2B33" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="1380,490 1364,482 1364,498" fill="#1C2B33"/>
<line x1="1258.0" y1="330" x2="1258.0" y2="524" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="1258.0" y="548" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2">NOW</text>
</g>
<g id="20_subject">
<circle cx="233.2" cy="436" r="11" fill="#1F4E5F"/>
<line x1="233.2" y1="436" x2="233.2" y2="490" stroke="#1F4E5F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="526.0" y1="328" x2="1258.0" y2="328" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="526.0" cy="328" r="7" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<circle cx="1258.0" cy="328" r="7" fill="#1F4E5F"/>
<line x1="1062.8" y1="220" x2="1258.0" y2="220" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 6"/>
<line x1="1258.0" y1="198" x2="1258.0" y2="242" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">A habit that stopped, and one that did not</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Used to always ends. Still never does.</text>
<text x="233.2" y="384" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">USED TO - a habit, and it stopped</text>
<text x="233.2" y="406" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">She used to start at two.</text>
<text x="526.0" y="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">STILL - and it has not stopped</text>
<text x="526.0" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">I still make it the long way.</text>
<text x="1062.8" y="172" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">ANYMORE - only with a negative</text>
<text x="1062.8" y="194" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">People don't wait anymore.</text>
<rect x="160" y="604.25" width="1280" height="55.75" rx="6" fill="#F3ECE0"/>
<text x="184" y="631.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">used to needs a repeated past. One Tuesday is not a habit. Negative: didn't use to - no d.</text>
</g>
</svg>
