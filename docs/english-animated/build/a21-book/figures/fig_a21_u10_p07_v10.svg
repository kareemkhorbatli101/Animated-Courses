<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>The tag that rises, and the tag that does not</title>
<desc>Three question tags drawn as pitch contours, one rising into a genuine question and two falling into statements.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="680" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="200" y1="230" x2="1360" y2="230" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="200" y1="410" x2="1360" y2="410" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="200" y1="590" x2="1360" y2="590" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
</g>
<g id="20_subject">
<path d="M 200 220 L 366 225 L 531 230 L 697 235 L 863 240 L 1029 220 L 1194 199 L 1360 183" fill="none" stroke="#C86B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">You put it up last week, | didn't you? (rising)</text>
<path d="M 200 394 L 366 400 L 531 405 L 697 410 L 863 405 L 1029 410 L 1194 431 L 1360 452" fill="none" stroke="#C86B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="344" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">You put it up last week, | didn't you? (falling)</text>
<path d="M 200 580 L 366 585 L 531 590 L 697 595 L 863 595 L 1029 595 L 1194 616 L 1360 637" fill="none" stroke="#C86B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="524" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">Nobody's read it, | ... | have they?</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The tag that rises, and the tag that does not</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Identical words. The last three notes decide what kind of sentence it was.</text>
<text x="1370" y="236" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="end" font-weight="600" font-style="normal">a real question - the answer could be no</text>
<text x="1370" y="416" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="end" font-weight="600" font-style="normal">and we both know you did</text>
<text x="1370" y="596" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="end" font-weight="600" font-style="normal">the pause gives them a chance to say it first</text>
</g>
</svg>
