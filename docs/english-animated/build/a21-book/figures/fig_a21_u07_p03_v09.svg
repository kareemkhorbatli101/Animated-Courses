<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>The same event, two first words</title>
<desc>Two parallel sentences, one active and one passive, drawn as coloured slots showing the agent, the action and the affected thing.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="640" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="332.88888888888886" height="52" rx="5" fill="#C86B2B"/>
<text x="326.44444444444446" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">They</text>
<rect x="498.88888888888886" y="144" width="332.88888888888886" height="52" rx="5" fill="#1F4E5F"/>
<text x="665.3333333333333" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">grow</text>
<rect x="837.7777777777777" y="144" width="536.2222222222222" height="52" rx="5" fill="#2E6F5E"/>
<text x="1105.8888888888887" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">the garlic in China</text>
<rect x="160" y="344" width="507.68421052631584" height="52" rx="5" fill="#2E6F5E"/>
<text x="413.8421052631579" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">The garlic</text>
<rect x="673.6842105263158" y="344" width="379.2631578947369" height="52" rx="5" fill="#1F4E5F"/>
<text x="863.3157894736843" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">is grown in China</text>
<rect x="1058.9473684210527" y="344" width="315.0526315789474" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1216.4736842105265" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">(by whom?)</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The same event, two first words</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Active starts with the person. Passive starts with the thing, and can end without one.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="544" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="568.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three reasons to use the passive: nobody knows who, it does not matter who, or somebody</text>
<text x="184" y="589.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">would rather you did not ask. Only the third is suspicious.</text>
</g>
</svg>
