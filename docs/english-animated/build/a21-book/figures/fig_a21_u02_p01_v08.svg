<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>From the soil to your bag</title>
<desc>A network from seed and soil through farm, cold room, van and market to the buyer, with a dashed shortcut labelled straight from the farm.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="400" x2="500" y2="240" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="500" y1="240" x2="500" y2="560" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="500" y1="560" x2="870" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="500" y1="240" x2="870" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="870" y1="400" x2="1210" y2="250" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1210" y1="250" x2="1210" y2="560" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="500" y1="240" x2="1210" y2="560" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="170" cy="400" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="170" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Seed &amp; soil</text>
<text x="170" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">water, sun, rain</text>
<circle cx="500" cy="240" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="500" y="245" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="500" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The farm</text>
<text x="500" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the farmer picks</text>
<circle cx="500" cy="560" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="500" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="500" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Cold room</text>
<text x="500" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">12 degrees, not colder</text>
<circle cx="870" cy="400" r="54" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="870" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="870" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The van</text>
<text x="870" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">58 km, two hours</text>
<circle cx="1210" cy="250" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1210" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1210" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The market</text>
<text x="1210" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">04:00, price cards</text>
<circle cx="1210" cy="560" r="52" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1210" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1210" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Your bag</text>
<text x="1210" y="658" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">08:00, three of them</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">From the soil to your bag</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six stages. The dashed line is the one the label on the stall pretends happens.</text>
<rect x="277.0" y="305.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="335.0" y="324.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">it grows</text>
<rect x="442.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="500.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">forty crates</text>
<rect x="627.0" y="465.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="685.0" y="484.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">loaded at one</text>
<rect x="627.0" y="305.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="685.0" y="324.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">when the room is full</text>
<rect x="982.0" y="310.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1040.0" y="329.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">unloaded at 04:40</text>
<rect x="1152.0" y="390.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1210.0" y="409.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">you choose</text>
<rect x="797.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="855.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">&quot;straight from the farm&quot;</text>
</g>
</svg>
