<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660">
<title>Defining, and non-defining</title>
<desc>Two parallel sentences compared, one with a defining relative clause and no commas and one with a non-defining clause between commas.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="660" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="291.5609756097561" height="52" rx="5" fill="#C86B2B"/>
<text x="305.780487804878" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">The hall</text>
<rect x="457.5609756097561" y="144" width="529.609756097561" height="52" rx="5" fill="#1F4E5F"/>
<text x="722.3658536585366" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">THAT was built in 1884</text>
<rect x="993.1707317073171" y="144" width="380.82926829268297" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1183.5853658536587" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">(so there is another)</text>
<rect x="160" y="344" width="291.5609756097561" height="52" rx="5" fill="#C86B2B"/>
<text x="305.780487804878" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">The hall,</text>
<rect x="457.5609756097561" y="344" width="529.609756097561" height="52" rx="5" fill="#2E6F5E"/>
<text x="722.3658536585366" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">WHICH was built in 1884,</text>
<rect x="993.1707317073171" y="344" width="380.82926829268297" height="52" rx="5" fill="#1F4E5F"/>
<text x="1183.5853658536587" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">(there is one hall)</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Defining, and non-defining</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same words. One of them tells you there is another hall.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="564" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="588.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three rules for non-defining clauses: always commas, never that, and you can always delete</text>
<text x="184" y="609.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">the whole clause and the sentence survives.</text>
</g>
</svg>
