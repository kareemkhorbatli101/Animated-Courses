<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>Who does what, and the gap in the middle</title>
<desc>A network of market roles - manager, inspector, traders, driver - with the lines between them labelled, and one dashed line leading to an unassigned job.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="200" y1="400" x2="560" y2="580" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="560" y1="220" x2="560" y2="580" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="400" x2="560" y2="220" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="560" y1="580" x2="940" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="940" y1="400" x2="200" y2="400" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="560" y1="580" x2="1310" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="200" y1="400" x2="1310" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="200" cy="400" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="200" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="200" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Manager</text>
<text x="200" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the rota, the pitches</text>
<circle cx="560" cy="220" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="560" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="560" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Inspector</text>
<text x="560" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">no warning, ever</text>
<circle cx="560" cy="580" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="560" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="560" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The traders</text>
<text x="560" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">twelve of them</text>
<circle cx="940" cy="400" r="54" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="940" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="940" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The driver</text>
<text x="940" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">ice and crates</text>
<circle cx="1310" cy="400" r="54" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1310" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1310" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The drain</text>
<text x="1310" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">nobody</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Who does what, and the gap in the middle</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five roles. Every line is a question somebody has to answer. One line goes nowhere.</text>
<rect x="322.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">writes the rota</text>
<rect x="502.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="560.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">checks the handwash</text>
<rect x="322.0" y="295.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="314.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">gets the report</text>
<rect x="692.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="750.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">orders the ice</text>
<rect x="512.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="570.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">reports a late road</text>
<rect x="877.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="935.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">complains about it</text>
<rect x="697.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="755.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">&quot;not in the handbook&quot;</text>
</g>
</svg>
