<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>Four instruction styles at one kiosk</title>
<desc>A bar chart comparing four instruction styles on the error rate at the kiosk and the share of drivers observed reading the second line.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="460" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="610.0" x2="1350" y2="610.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="615.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="495.0" x2="1350" y2="495.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="500.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">25</text>
<line x1="170" y1="380.0" x2="1350" y2="380.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="385.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">50</text>
<line x1="170" y1="265.0" x2="1350" y2="265.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="270.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">75</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">100</text>
</g>
<g id="20_subject">
<rect x="212.14285714285714" y="545.6" width="94.82142857142858" height="64.39999999999998" rx="0" fill="#A8372E"/>
<rect x="507.14285714285717" y="582.4" width="94.82142857142858" height="27.600000000000023" rx="0" fill="#A8372E"/>
<rect x="802.1428571428571" y="596.2" width="94.82142857142858" height="13.799999999999955" rx="0" fill="#A8372E"/>
<rect x="1097.142857142857" y="573.2" width="94.82142857142858" height="36.799999999999955" rx="0" fill="#A8372E"/>
<rect x="317.50000000000006" y="591.6" width="94.82142857142858" height="18.399999999999977" rx="0" fill="#2E6F5E"/>
<rect x="612.5" y="508.8" width="94.82142857142858" height="101.19999999999999" rx="0" fill="#2E6F5E"/>
<rect x="907.5" y="329.40000000000003" width="94.82142857142858" height="280.59999999999997" rx="0" fill="#2E6F5E"/>
<rect x="1202.5" y="467.4" width="94.82142857142858" height="142.60000000000002" rx="0" fill="#2E6F5E"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four instruction styles at one kiosk</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four weeks each, same lane, same drivers, same booking system.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#A8372E"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">error rate (%)</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#2E6F5E"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">read line two (%)</text>
<text x="317.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">one long sentence</text>
<text x="612.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">action first</text>
<text x="907.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">action first + end-weight</text>
<text x="1202.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">bullets</text>
<rect x="170" y="670" width="1180" height="65.5" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="697.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Bullets perform worse than the sentence that uses them, which is the result nobody expects: four</text>
<text x="186" y="718.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">bullets are four first positions and no last one, so nothing in the set carries a final fall.</text>
<text x="170" y="771.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Putting the action first halves the errors. Ending the first sentence where it should end</text>
<text x="170" y="793.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">halves them again and multiplies second-line reading by fifteen.</text>
</g>
</svg>
