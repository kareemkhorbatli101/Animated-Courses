<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560">
<title>The two positions that do the work</title>
<desc>One instruction drawn as chunks with brackets marking the theme at the front, the middle and the focus position at the end.</desc>
