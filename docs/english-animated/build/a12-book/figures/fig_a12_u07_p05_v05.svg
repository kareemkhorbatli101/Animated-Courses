<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>The safety notice beside the handle</title>
<desc>The emergency safety notice beside the handle, with four numbered instructions, a penalty line in large type, a printing year and a three-part diagram.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="690" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="690" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">EMERGENCY DOOR RELEASE  -  CAR 6/7 VESTIBULE</text>
<text x="140" y="224" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">IMPROPER USE: FINE UP TO $500</text>
<line x1="130" y1="254" x2="910" y2="254" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="290" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">INSTRUCTIONS</text>
<rect x="140" y="302" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">NO.</text>
<text x="403.33333333333337" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">INSTRUCTION</text>
<text x="656.6666666666667" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">TYPE SIZE</text>
<text x="150.0" y="352" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="403.33333333333337" y="352" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">LIFT THE YELLOW COVER</text>
<text x="656.6666666666667" y="352" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">14 pt</text>
<line x1="140" y1="362" x2="900" y2="362" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="382" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<text x="403.33333333333337" y="382" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">PULL THE RED HANDLE DOWN</text>
<text x="656.6666666666667" y="382" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">14 pt</text>
<line x1="140" y1="392" x2="900" y2="392" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="412" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="403.33333333333337" y="412" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">STAND CLEAR OF THE DOOR</text>
<text x="656.6666666666667" y="412" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">14 pt</text>
<line x1="140" y1="422" x2="900" y2="422" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="442" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<text x="403.33333333333337" y="442" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">USE ONLY IN AN EMERGENCY</text>
<text x="656.6666666666667" y="442" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">7 pt</text>
<line x1="140" y1="452" x2="900" y2="452" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="480" x2="910" y2="480" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="502" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Penalty line</text>
<text x="410" y="502" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">24 pt</text>
<text x="140" y="534" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Printed</text>
<text x="410" y="534" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2011</text>
<text x="140" y="566" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Diagram</text>
<text x="410" y="566" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3 parts, no words</text>
<text x="140" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Who to tell afterwards</text>
<text x="410" y="598" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">not stated</text>
<line x1="130" y1="630" x2="910" y2="630" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="652.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Nothing on this notice says what counts as an emergency. The</text>
<text x="140" y="673.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">only sentence that mentions emergencies is the smallest line on</text>
<text x="140" y="695.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the page, and it is an instruction not to act rather than a</text>
<text x="140" y="717.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">description of when to.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The safety notice beside the handle</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The largest line on it is the penalty. The smallest is when to use it.</text>
<circle cx="934" cy="202.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 202.8 L 1024 202.8 L 1024 202.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="207.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Twenty-four point. It is the first</text>
<text x="1040" y="228.10000000000002" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">thing anybody reads</text>
<circle cx="934" cy="368.4" r="4.5" fill="#C86B2B"/>
<path d="M 934 368.4 L 1024 368.4 L 1024 368.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="373.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three instructions about the</text>
<text x="1040" y="393.7" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">mechanism</text>
<circle cx="934" cy="451.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 451.2 L 1024 451.2 L 1024 451.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="456.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Seven point. The only line about</text>
<text x="1040" y="476.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">when</text>
<circle cx="934" cy="603.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 603.0 L 1024 603.0 L 1024 603.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="608.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Printed in 2011, and the handle is</text>
<text x="1040" y="628.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">from 1985</text>
<circle cx="934" cy="754.8000000000001" r="4.5" fill="#C86B2B"/>
<path d="M 934 754.8000000000001 L 1024 754.8000000000001 L 1024 754.8000000000001" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="759.8000000000001" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A frightened person has about two</text>
<text x="1040" y="780.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">seconds to read all of this</text>
</g>
</svg>
