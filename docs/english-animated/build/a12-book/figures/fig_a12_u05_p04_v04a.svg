<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>The same advice, two openings</title>
<desc>Two versions of the same piece of advice side by side, one opening with you should and one opening with a question, with the outcome of each.</desc>
