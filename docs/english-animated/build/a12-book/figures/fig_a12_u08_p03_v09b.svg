<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
<title>Three kinds of participle, and one pair that matters</title>
<desc>Three groups of past participles - identical to the past, different from it, and identical to the infinitive - with been and gone drawn separately.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="540" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="206.0" width="286.8" height="68" rx="5" fill="#1F4E5F"/>
<text x="303.4" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">worked · bought</text>
<rect x="452.8" y="206.0" width="286.8" height="68" rx="5" fill="#C86B2B"/>
<text x="596.2" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">done · seen</text>
<rect x="745.6" y="206.0" width="238.0" height="68" rx="5" fill="#2E6F5E"/>
<text x="864.6" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">come · run</text>
<rect x="989.6" y="206.0" width="189.2" height="68" rx="5" fill="#D9A441"/>
<text x="1084.2" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">BEEN</text>
<rect x="1184.8" y="206.0" width="189.2" height="68" rx="5" fill="#A8372E"/>
<text x="1279.3999999999999" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">GONE</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Three kinds of participle, and one pair that matters</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Been and gone are the same journey and they end in different places.</text>
<text x="303.4" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">same as the past</text>
<text x="596.2" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">different</text>
<text x="864.6" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">same as the plain verb</text>
<text x="1084.2" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and back</text>
<text x="1279.3999999999999" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and not back</text>
<text x="160" y="348.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">She has been to Jasper - the journey is over and she is here. She has gone to Jasper - the</text>
<text x="160" y="369.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">journey is over and she is there. Same verb, same tense, opposite locations.</text>
</g>
</svg>
