<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Two oo sounds</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Both are rounded. The difference is length, and in should the l is not there at all.</text>
<text x="470.0" y="545" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">/ʊ/</text>
<text x="470.0" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">short, and the tongue is lower and further back</text>
<text x="470.0" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">should · could · good · book · foot</text>
<rect x="446.0" y="630" width="48" height="14" rx="7" fill="#C86B2B"/>
<text x="1130.0" y="545" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">/uː/</text>
<text x="1130.0" y="580" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">long, high and far back - the lips push forward</text>
<text x="1130.0" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">food · soon · move · blue · two</text>
