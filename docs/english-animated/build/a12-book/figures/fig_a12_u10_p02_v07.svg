<text x="520.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">It's the strangest thing in the box.</text>
<text x="520.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">That's the best part.</text>
<rect x="370.0" y="300" width="300" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#55646D" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="510.0" cy="398.8" r="6" fill="#FFFFFF" stroke="#55646D" stroke-width="1.5"/>
<circle cx="560" cy="470" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="520.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Nine times I have told this one.</text>
<rect x="915.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="987.6,199.2 1040.4,199.2 1080,455" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="989.6" y1="199.2" x2="1038.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="1080.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">There isn't enough time.</text>
<text x="1080.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">It's too long to read - four thousand cards.</text>
<rect x="930.0" y="300" width="300" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#55646D" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="1070.0" cy="398.8" r="6" fill="#FFFFFF" stroke="#55646D" stroke-width="1.5"/>
<circle cx="1120" cy="470" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="1080.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">What do I put in the report?</text>
