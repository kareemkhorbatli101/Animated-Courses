<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>The small words stay small</title>
<desc>Six phrases drawn as beats, with the strong syllables as large circles and than, as, a and the always drawn small.</desc>
