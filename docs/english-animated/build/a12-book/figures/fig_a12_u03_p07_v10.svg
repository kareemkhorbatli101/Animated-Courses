<text x="476" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">GOOD</text>
<circle cx="594" cy="320" r="8" fill="#9AA7AE"/>
<text x="594" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">as</text>
<circle cx="712" cy="320" r="16" fill="#1F4E5F"/>
<text x="712" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">THIS</text>
<circle cx="240" cy="408" r="8" fill="#9AA7AE"/>
<text x="240" y="454" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a</text>
<circle cx="358" cy="408" r="16" fill="#1F4E5F"/>
<text x="358" y="454" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">BIT</text>
<circle cx="476" cy="408" r="16" fill="#1F4E5F"/>
<text x="476" y="454" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">CHEAP-er</text>
<circle cx="240" cy="496" r="16" fill="#1F4E5F"/>
<text x="240" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">MUCH</text>
<circle cx="358" cy="496" r="16" fill="#1F4E5F"/>
<text x="358" y="542" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">BET-ter</text>
