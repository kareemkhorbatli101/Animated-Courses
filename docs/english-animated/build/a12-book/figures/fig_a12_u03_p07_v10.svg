<text x="594" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the</text>
<circle cx="712" cy="584" r="16" fill="#1F4E5F"/>
<text x="712" y="630" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">O-ther</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The small words stay small</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Than, as, a and the are never the loud word. Six phrases, and the pattern never breaks.</text>
<text x="1340" y="170" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">than is small, between two big ones</text>
<text x="1340" y="258" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">both as-words small</text>
<text x="1340" y="346" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">three small, two big</text>
<text x="1340" y="434" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">a is almost silent</text>
<text x="1340" y="522" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">much is big - it is carrying size</text>
<text x="1340" y="610" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="end" font-weight="400" font-style="italic">the twice, as once, and none of them heard</text>
</g>
</svg>
