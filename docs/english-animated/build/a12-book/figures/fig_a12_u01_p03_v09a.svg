<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<title>Bolted on, or changed inside</title>
<desc>Two rows of word boxes: regular verbs with -ed drawn as a separate piece bolted on the end, and irregular verbs with the vowel in the middle drawn in a different colour.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="520" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="196.0" width="238.0" height="68" rx="5" fill="#1F4E5F"/>
<text x="279.0" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">arriv</text>
<rect x="404.0" y="196.0" width="140.4" height="68" rx="5" fill="#9AA7AE"/>
<text x="474.2" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">+ ed</text>
<rect x="550.4" y="196.0" width="189.2" height="68" rx="5" fill="#2E6F5E"/>
<text x="645.0" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">c</text>
<rect x="745.5999999999999" y="196.0" width="140.4" height="68" rx="5" fill="#C86B2B"/>
<text x="815.8" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">a</text>
<rect x="891.9999999999999" y="196.0" width="189.2" height="68" rx="5" fill="#2E6F5E"/>
<text x="986.5999999999999" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">me</text>
<rect x="1087.1999999999998" y="196.0" width="286.8" height="68" rx="5" fill="#A8372E"/>
<text x="1230.6" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">go → went</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Bolted on, or changed inside</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">A regular verb grows a piece at the end. An irregular one changes in the middle.</text>
<text x="279.0" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">regular</text>
<text x="474.2" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">bolted on</text>
<text x="645.0" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">irregular</text>
<text x="815.8" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the vowel moves</text>
<text x="986.5999999999999" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and the rest stays</text>
<text x="1230.6" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">no pattern at all</text>
<text x="160" y="338.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Regular: the word is untouched and something is added. Irregular: nothing is added and the</text>
<text x="160" y="359.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">inside changes. About 180 verbs do the second thing, and they are the 180 you will use most</text>
<text x="160" y="381.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">often.</text>
</g>
</svg>
