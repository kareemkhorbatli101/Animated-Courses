<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Through the glass</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The window is closed. They have had this conversation about forty times.</text>
<rect x="355.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="427.6,199.2 480.4,199.2 520,455" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="429.6" y1="199.2" x2="478.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="520.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Did you travel last summer?</text>
<text x="520.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">When did you buy it?</text>
<rect x="370.0" y="300" width="300" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#55646D" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="510.0" cy="398.8" r="6" fill="#FFFFFF" stroke="#55646D" stroke-width="1.5"/>
<circle cx="560" cy="470" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="520.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">I already know why she is going.</text>
<rect x="915.0" y="140" width="330" height="59.199999999999996" rx="10" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<polygon points="987.6,199.2 1040.4,199.2 1080,455" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="1.8"/>
<line x1="989.6" y1="199.2" x2="1038.4" y2="199.2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
<text x="1080.0" y="162.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">I didn't book it. I bought it this morning.</text>
<text x="1080.0" y="181.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">A single. She didn't come back.</text>
<rect x="930.0" y="300" width="300" height="39.599999999999994" rx="10" fill="#FFFFFF" stroke="#55646D" stroke-width="1.8" stroke-dasharray="5 4"/>
<circle cx="1070.0" cy="398.8" r="6" fill="#FFFFFF" stroke="#55646D" stroke-width="1.5"/>
<circle cx="1120" cy="470" r="3.5" fill="#FFFFFF" stroke="#55646D" stroke-width="1.4"/>
<text x="1080.0" y="322.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="400" font-style="normal">Do I tell him, or does he know?</text>
</g>
