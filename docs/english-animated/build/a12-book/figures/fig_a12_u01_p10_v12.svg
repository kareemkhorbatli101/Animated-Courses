<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Four hours, four records</title>
<desc>An infographic of the four-hour delay with bands for where the train was, what the crew did, what the passengers knew and what the log recorded.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="990" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="40" y="130" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="164.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">The train</text>
<line x1="150" y1="250" x2="1450" y2="250" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="280" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="314.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">The crew</text>
<line x1="150" y1="400" x2="1450" y2="400" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="430" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="464.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">The</text>
<text x="52" y="484.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">passengers</text>
<text x="52" y="504.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">knew</text>
<line x1="150" y1="550" x2="1450" y2="550" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="580" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="614.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">People asking</text>
<line x1="150" y1="700" x2="1450" y2="700" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="730" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="764.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What the log</text>
<text x="52" y="784.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">recorded</text>
<line x1="150" y1="850" x2="1450" y2="850" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
</g>
<g id="20_subject">
<rect x="150.0" y="166" width="1118.0" height="50" rx="4" fill="#9AA7AE" opacity="0.9"/>
<rect x="1294.0" y="166" width="156.0" height="50" rx="4" fill="#2E6F5E" opacity="0.9"/>
