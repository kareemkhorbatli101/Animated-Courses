<circle cx="540.0" cy="665.0322580653216" r="4.5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.4"/>
<circle cx="865.0000000000001" cy="604.0000000027742" r="4.5" fill="#FFFFFF" stroke="#C86B2B" stroke-width="2.4"/>
