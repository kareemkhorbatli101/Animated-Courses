<rect x="904.0" y="316" width="442.0" height="50" rx="4" fill="#D9A441" opacity="0.9"/>
<circle cx="202.0" cy="490" r="10" fill="#9AA7AE"/>
<line x1="202.0" y1="490" x2="202.0" y2="550" stroke="#9AA7AE" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="540.0" cy="490" r="10" fill="#9AA7AE"/>
