<polygon points="280.0,766 332.0,778 280.0,790" fill="#D9A441"/>
<line x1="748.0" y1="766" x2="748.0" y2="834" stroke="#55646D" stroke-width="2" stroke-linecap="round"/>
<polygon points="748.0,766 800.0,778 748.0,790" fill="#D9A441"/>
<line x1="1060.0" y1="766" x2="1060.0" y2="834" stroke="#55646D" stroke-width="2" stroke-linecap="round"/>
<polygon points="1060.0,766 1112.0,778 1060.0,790" fill="#D9A441"/>
