<text x="140" y="824.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Winter: this stop is by request only. Requests must be made at</text>
