<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
<title>The crew log for that night</title>
<desc>The company crew log for one night, showing the date, train number, scheduled and actual departure, the delay in hours, a reason code, an incidents box containing the word NONE, and a signature.</desc>
