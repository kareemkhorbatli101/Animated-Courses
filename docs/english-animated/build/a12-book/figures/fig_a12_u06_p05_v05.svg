<line x1="140" y1="376" x2="900" y2="376" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="404" x2="910" y2="404" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
