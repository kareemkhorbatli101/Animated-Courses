<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>Four questions, four futures</title>
<desc>A branching diagram with four questions - is there evidence, did you decide before now, is it arranged with others, are you deciding now - each leading to a different future form.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="720" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<circle cx="160" cy="360.0" r="12" fill="#1C2B33"/>
<text x="160" y="402.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">the future</text>
</g>
<g id="20_subject">
<path d="M 160 360.0 C 440.6 360.0 440.6 160.0 721.2 160.0" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,160.0 705.2,152.0 705.2,168.0" fill="#1F4E5F"/>
<path d="M 160 360.0 C 440.6 360.0 440.6 300.0 721.2 300.0" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,300.0 705.2,292.0 705.2,308.0" fill="#2E6F5E"/>
<path d="M 160 360.0 C 440.6 360.0 440.6 440.0 721.2 440.0" fill="none" stroke="#C86B2B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,440.0 705.2,432.0 705.2,448.0" fill="#C86B2B"/>
<path d="M 160 360.0 C 440.6 360.0 440.6 580.0 721.2 580.0" fill="none" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,580.0 705.2,572.0 705.2,588.0" fill="#D9A441"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four questions, four futures</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Most learners only ever use the fourth. Ask the first three before you reach it.</text>
<text x="739.2" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">Is the evidence in front of you? — GOING TO</text>
<text x="739.2" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">Look at that sky. It's going to snow.</text>
<text x="739.2" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="start" font-weight="700" font-style="normal">Did you decide before now? — GOING TO</text>
<text x="739.2" y="318.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">I'm going to check again at four. -- decided this</text>
<text x="739.2" y="335.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">morning</text>
<text x="739.2" y="432.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">Is it arranged with other people? — PRESENT CONTINUOUS</text>
<text x="739.2" y="458.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">We're leaving at six tomorrow. -- it is on the board</text>
<text x="739.2" y="572.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="700" font-style="normal">Are you deciding as you speak? — WILL</text>
<text x="739.2" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">The phone is ringing - I'll get it.</text>
</g>
</svg>
