<text x="1360" y="316.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the h disappears</text>
<text x="1360" y="334.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">completely</text>
<text x="1360" y="402.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">and this one survives</text>
<text x="1360" y="420.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">intact</text>
<text x="1360" y="488.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">no collisions at all - say</text>
<text x="1360" y="506.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">it slowly and you will</text>
