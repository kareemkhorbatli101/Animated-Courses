<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The vowel in the middle</title>
<desc>Three columns of irregular verbs grouped by the vowel change between present and past, with the rule for each group written underneath.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="112.0" y="130" width="442.6666666666667" height="460" rx="8" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="112.0" y="130" width="442.6666666666667" height="64" rx="8" fill="#1F4E5F"/>
<line x1="140.0" y1="532" x2="526.6666666666667" y2="532" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<rect x="578.6666666666667" y="130" width="442.6666666666667" height="460" rx="8" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="578.6666666666667" y="130" width="442.6666666666667" height="64" rx="8" fill="#2E6F5E"/>
<line x1="606.6666666666667" y1="532" x2="993.3333333333335" y2="532" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<rect x="1045.3333333333335" y="130" width="442.6666666666667" height="460" rx="8" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="1045.3333333333335" y="130" width="442.6666666666667" height="64" rx="8" fill="#A8372E"/>
<line x1="1073.3333333333335" y1="532" x2="1460.0000000000002" y2="532" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
</g>
<g id="20_subject">
<text x="333.33333333333337" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">i → a</text>
<text x="333.33333333333337" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">begin → began</text>
<text x="333.33333333333337" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">sit → sat</text>
<text x="333.33333333333337" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">give → gave</text>
<text x="333.33333333333337" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">drink → drank</text>
<text x="333.33333333333337" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">swim → swam</text>
<text x="800.0000000000001" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">ee → e</text>
<text x="800.0000000000001" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">meet → met</text>
<text x="800.0000000000001" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">feel → felt</text>
<text x="800.0000000000001" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">keep → kept</text>
<text x="800.0000000000001" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">read → read</text>
<text x="800.0000000000001" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">sleep → slept</text>
<text x="1266.6666666666667" y="174" font-family="DejaVu Sans Mono, monospace" font-size="30" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">a new word</text>
<text x="1266.6666666666667" y="310" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">go → went</text>
<text x="1266.6666666666667" y="342.3" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">be → was / were</text>
<text x="1266.6666666666667" y="374.6" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">put → put</text>
<text x="1266.6666666666667" y="406.90000000000003" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">cut → cut</text>
<text x="1266.6666666666667" y="439.20000000000005" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">let → let</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The vowel in the middle</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The consonants do not move. One sound in the middle does all the work.</text>
<text x="333.33333333333337" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="middle" font-weight="600" font-style="normal">the commonest change of all</text>
<text x="333.33333333333337" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the consonants on both sides are identical in every</text>
<text x="333.33333333333337" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">pair</text>
<text x="800.0000000000001" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">the vowel gets shorter, not different</text>
<text x="800.0000000000001" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">read is spelled the same twice - only the length tells</text>
<text x="800.0000000000001" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">you which</text>
<text x="1266.6666666666667" y="228.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">no pattern, and no help</text>
<text x="1266.6666666666667" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the last three change nothing at all, which is the</text>
<text x="1266.6666666666667" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">hardest kind to hear</text>
</g>
</svg>
