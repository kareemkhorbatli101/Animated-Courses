<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>The dining car as four numbers</title>
<desc>An infographic of the dining car showing what it costs, what it earns, what it causes passengers to spend elsewhere, and why people say they booked.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="990" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="40" y="130" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="164.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What it costs</text>
<line x1="150" y1="250" x2="1450" y2="250" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="280" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="314.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What it earns</text>
<line x1="150" y1="400" x2="1450" y2="400" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="430" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="464.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What it</text>
<text x="52" y="484.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">causes</text>
<line x1="150" y1="550" x2="1450" y2="550" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="580" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="614.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">Why people</text>
<text x="52" y="634.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">booked</text>
<line x1="150" y1="700" x2="1450" y2="700" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="730" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="764.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What this</text>
<text x="52" y="784.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">shows</text>
<line x1="150" y1="850" x2="1450" y2="850" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
</g>
<g id="20_subject">
<rect x="150.0" y="166" width="676.0" height="50" rx="4" fill="#A8372E" opacity="0.9"/>
<rect x="150.0" y="316" width="416.0" height="50" rx="4" fill="#D9A441" opacity="0.9"/>
<rect x="150.0" y="466" width="1196.0" height="50" rx="4" fill="#2E6F5E" opacity="0.9"/>
<circle cx="540.0" cy="640" r="10" fill="#2E6F5E"/>
<line x1="540.0" y1="640" x2="540.0" y2="700" stroke="#2E6F5E" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="956.0" cy="640" r="10" fill="#1F4E5F"/>
<line x1="956.0" y1="640" x2="956.0" y2="700" stroke="#1F4E5F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="1268.0" cy="640" r="10" fill="#9AA7AE"/>
<line x1="1268.0" y1="640" x2="1268.0" y2="700" stroke="#9AA7AE" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="228.0" y1="766" x2="228.0" y2="834" stroke="#55646D" stroke-width="2" stroke-linecap="round"/>
<polygon points="228.0,766 280.0,778 228.0,790" fill="#D9A441"/>
<line x1="748.0" y1="766" x2="748.0" y2="834" stroke="#55646D" stroke-width="2" stroke-linecap="round"/>
<polygon points="748.0,766 800.0,778 748.0,790" fill="#D9A441"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The dining car as four numbers</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The first two bands are in the plan. The second two are in a different document.</text>
<text x="160.0" y="198" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal">staff, food and the car itself - $1.04 m</text>
<text x="160.0" y="348" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal">meals sold - $0.64 m</text>
<text x="160.0" y="498" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="700" font-style="normal">fares from people who booked for it - $1.84 m</text>
<text x="540.0" y="616" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">61% - the dining car</text>
<text x="956.0" y="616" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">22% - the scenery</text>
<text x="1268.0" y="616" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">17% - price, or fear of flying</text>
<text x="234.0" y="816.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">the loss is real and it is in the plan</text>
<text x="754.0" y="816.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">the third band is larger than the first two together, and is</text>
<text x="754.0" y="832.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">in no plan</text>
<line x1="150.0" y1="862" x2="150.0" y2="876" stroke="#9AA7AE" stroke-width="1.6" stroke-linecap="round"/>
<text x="150.0" y="900" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">0</text>
<line x1="583.3333333333333" y1="862" x2="583.3333333333333" y2="876" stroke="#9AA7AE" stroke-width="1.6" stroke-linecap="round"/>
<text x="583.3333333333333" y="900" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$0.7 m</text>
<line x1="1016.6666666666666" y1="862" x2="1016.6666666666666" y2="876" stroke="#9AA7AE" stroke-width="1.6" stroke-linecap="round"/>
<text x="1016.6666666666666" y="900" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$1.4 m</text>
<line x1="1450.0" y1="862" x2="1450.0" y2="876" stroke="#9AA7AE" stroke-width="1.6" stroke-linecap="round"/>
<text x="1450.0" y="900" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$2 m</text>
</g>
</svg>
