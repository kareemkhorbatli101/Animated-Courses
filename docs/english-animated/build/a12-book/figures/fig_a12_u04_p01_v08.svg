<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Eleven people, and what each is to each</title>
<desc>Eleven passengers drawn as a network with labelled lines saying what each is to the other, four of the lines dotted to show relationships the booking system has no record of.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="240" y1="200" x2="180" y2="520" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="240" y1="200" x2="400" y2="640" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="760" y1="200" x2="760" y2="640" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="1160" y1="200" x2="1160" y2="620" stroke="#D9A441" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="1460" y1="400" x2="1160" y2="200" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="180" y1="520" x2="760" y2="200" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
<line x1="1460" y1="400" x2="760" y2="640" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6"/>
</g>
<g id="20_subject">
<circle cx="240" cy="200" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="240" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">G</text>
<text x="240" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the grandmother</text>
<text x="240" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">3 full fares</text>
<circle cx="180" cy="520" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="180" y="525" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="180" y="592" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">grandchild</text>
<text x="180" y="612" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">age 9</text>
<circle cx="400" cy="640" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="400" y="645" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="400" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">grandchild</text>
<text x="400" y="732" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">age 6</text>
<circle cx="760" cy="200" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="760" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="760" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">sister one</text>
<text x="760" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">two children</text>
<circle cx="760" cy="640" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="760" y="645" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="760" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">sister two</text>
<text x="760" y="732" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">two children</text>
<circle cx="1160" cy="200" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1160" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">M</text>
<text x="1160" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the man in seat 9</text>
<text x="1160" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">his wife's mother</text>
<circle cx="1160" cy="620" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1160" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">81</text>
<text x="1160" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">she is 81</text>
<text x="1160" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">cannot travel alone</text>
<circle cx="1460" cy="400" r="52" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1460" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">17</text>
<text x="1460" y="478" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Sam</text>
<text x="1460" y="498" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">alone, and not lost</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Eleven people, and what each is to each</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four of the lines are dotted. Those are the ones the booking system does not know about.</text>
<rect x="152.0" y="345.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="210.0" y="364.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">grandmother</text>
<rect x="262.0" y="405.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="320.0" y="424.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">grandmother</text>
<rect x="702.0" y="405.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="760.0" y="424.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">sisters</text>
<rect x="1102.0" y="395.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1160.0" y="414.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">his wife's mother - and his wife is not here</text>
<rect x="1252.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1310.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">met on Tuesday</text>
<rect x="412.0" y="345.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="470.0" y="364.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">cousins - and nobody has told them</text>
<rect x="1052.0" y="505.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1110.0" y="524.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">she lent him the coat</text>
</g>
</svg>
