<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>One event, six doors</title>
<desc>A branching diagram from a single claim event into six conditional connectors, each with the width of opening it allows and an example sentence.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<circle cx="160" cy="400.0" r="12" fill="#1C2B33"/>
<text x="160" y="442.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">a claim is made</text>
</g>
<g id="20_subject">
<path d="M 160 400.0 C 440.6 400.0 440.6 160.0 721.2 160.0" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,160.0 705.2,152.0 705.2,168.0" fill="#2E6F5E"/>
<path d="M 160 400.0 C 440.6 400.0 440.6 260.0 721.2 260.0" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,260.0 705.2,252.0 705.2,268.0" fill="#2E6F5E"/>
<path d="M 160 400.0 C 440.6 400.0 440.6 360.0 721.2 360.0" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,360.0 705.2,352.0 705.2,368.0" fill="#1F4E5F"/>
<path d="M 160 400.0 C 440.6 400.0 440.6 460.0 721.2 460.0" fill="none" stroke="#C86B2B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,460.0 705.2,452.0 705.2,468.0" fill="#C86B2B"/>
<path d="M 160 400.0 C 440.6 400.0 440.6 560.0 721.2 560.0" fill="none" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,560.0 705.2,552.0 705.2,568.0" fill="#D9A441"/>
<path d="M 160 400.0 C 440.6 400.0 440.6 660.0 721.2 660.0" fill="none" stroke="#A8372E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,660.0 705.2,652.0 705.2,668.0" fill="#A8372E"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One event, six doors</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The same claim, and six ways of saying what has to be true before the cap applies.</text>
<text x="739.2" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="start" font-weight="700" font-style="normal">provided</text>
<text x="739.2" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a requirement, formal: provided the piece was</text>
<text x="739.2" y="195.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">disclosed</text>
<text x="739.2" y="252.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="start" font-weight="700" font-style="normal">as long as</text>
<text x="739.2" y="278.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the same, spoken: as long as you tell us first</text>
<text x="739.2" y="352.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">only if</text>
<text x="739.2" y="378.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">nothing else will do: only if the paper was told</text>
<text x="739.2" y="452.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">unless</text>
<text x="739.2" y="478.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">one exception, not a threat: unless you tell us</text>
<text x="739.2" y="552.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="700" font-style="normal">supposing</text>
<text x="739.2" y="578.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">an invited hypothesis: supposing nothing was</text>
<text x="739.2" y="595.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">disclosed</text>
<text x="739.2" y="652.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="start" font-weight="700" font-style="normal">but for</text>
<text x="739.2" y="678.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a condition on the past: but for the disclosure rule</text>
</g>
</svg>
