<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<title>Two leaders, every pronoun marked</title>
<desc>Two editorials set out with every first-person plural pronoun marked and the set each one claims, together with the perfects in each and what they import.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1180" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="970" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="970" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">LEADER PAGE  -  14 MARCH 2017</text>
<text x="140" y="214.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;The plan deserves a hearing. Our readers in the east end will</text>
<text x="140" y="235.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">want to know what it costs, and we will be asking.&quot;</text>
<line x1="130" y1="271.5" x2="910" y2="271.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="130" y="275.5" width="780" height="44" rx="4" fill="#F3ECE0"/>
<text x="146" y="305.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.0">LEADER PAGE  -  TODAY</text>
<text x="140" y="353.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;We have always opposed this plan. This paper believes the</text>
<text x="140" y="375.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">community affected has been neglected, and we have said so</text>
<text x="140" y="397.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">throughout.&quot;</text>
<line x1="130" y1="432.75" x2="910" y2="432.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="140" y="436.75" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="456.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">FEATURE</text>
<text x="403.33333333333337" y="456.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">2017</text>
<text x="656.6666666666667" y="456.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">TODAY</text>
<text x="150.0" y="486.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">WE / OUR</text>
<text x="403.33333333333337" y="486.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="656.6666666666667" y="486.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<line x1="140" y1="496.75" x2="900" y2="496.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="516.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">PERFECTS</text>
<text x="403.33333333333337" y="516.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<text x="656.6666666666667" y="516.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<line x1="140" y1="526.75" x2="900" y2="526.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="546.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">DATES</text>
<text x="403.33333333333337" y="546.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="656.6666666666667" y="546.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="556.75" x2="900" y2="556.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="576.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NAMED PEOPLE</text>
<text x="403.33333333333337" y="576.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<text x="656.6666666666667" y="576.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="586.75" x2="900" y2="586.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="606.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">BYLINE</text>
<text x="403.33333333333337" y="606.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NONE</text>
<text x="656.6666666666667" y="606.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NONE</text>
<line x1="140" y1="616.75" x2="900" y2="616.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="636.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">POSITION</text>
<text x="403.33333333333337" y="636.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">DESERVES A HEARING</text>
<text x="656.6666666666667" y="636.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">ALWAYS OPPOSED</text>
<line x1="140" y1="646.75" x2="900" y2="646.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="666.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">BOARD MEMBERS THEN</text>
<text x="403.33333333333337" y="666.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">9</text>
<text x="656.6666666666667" y="666.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">9</text>
<line x1="140" y1="676.75" x2="900" y2="676.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="696.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">SAME PEOPLE</text>
<text x="403.33333333333337" y="696.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<text x="656.6666666666667" y="696.75" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2 OF 9</text>
<line x1="140" y1="706.75" x2="900" y2="706.75" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="734.75" x2="910" y2="734.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="770.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT EACH WE CLAIMS</text>
<text x="140" y="800.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;our readers in the east end&quot;</text>
<text x="410" y="800.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a set that can be counted</text>
<text x="140" y="832.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;we will be asking&quot;</text>
<text x="410" y="832.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the newsroom, about nine people</text>
<text x="140" y="864.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;we have always opposed&quot;</text>
<text x="410" y="864.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the institution, since 1911</text>
<text x="140" y="896.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;we have said so throughout&quot;</text>
<text x="410" y="896.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">unspecifiable</text>
<line x1="130" y1="928.75" x2="910" y2="928.75" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="950.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Two of the nine board members are the same people. The word</text>
<text x="140" y="972.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">*always* covers a hundred and fourteen years and seven of the</text>
<text x="140" y="994.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">nine have changed.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Two leaders, every pronoun marked</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six years apart, on the same page, about the same plan.</text>
<circle cx="934" cy="197.60000000000002" r="4.5" fill="#C86B2B"/>
<path d="M 934 197.60000000000002 L 1024 197.60000000000002 L 1024 197.60000000000002" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="202.60000000000002" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A date, a place, and a promise</text>
<text x="1040" y="222.90000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">that can be checked</text>
<circle cx="934" cy="333.4" r="4.5" fill="#C86B2B"/>
<path d="M 934 333.4 L 1024 333.4 L 1024 333.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="338.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Four perfects and no dates at all</text>
<circle cx="934" cy="566.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 566.2 L 1024 566.2 L 1024 566.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="571.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The perfect count is the whole</text>
<text x="1040" y="591.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">difference between the two pieces</text>
<circle cx="934" cy="799.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 799.0 L 1024 799.0 L 1024 799.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="804.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The first we can be counted. The</text>
<text x="1040" y="824.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">last cannot</text>
<circle cx="934" cy="1031.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 1031.8 L 1024 1031.8 L 1024 1031.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="1036.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Always is covering a change of</text>
<text x="1040" y="1057.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">seven people out of nine</text>
</g>
</svg>
