<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>One guide, three channels, three readers</title>
<desc>An infographic comparing a newspaper, its newsletter and its app on readership, marker density and completion, against a style guide that covers only one of them.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="990" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="40" y="130" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="164.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">Who reads it</text>
<line x1="150" y1="250" x2="1450" y2="250" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="280" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="314.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">The app</text>
<line x1="150" y1="400" x2="1450" y2="400" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="430" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="464.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">Markers per</text>
<text x="52" y="484.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">1,000 words</text>
<line x1="150" y1="550" x2="1450" y2="550" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="580" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="614.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">Who finishes</text>
<text x="52" y="634.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">it</text>
<line x1="150" y1="700" x2="1450" y2="700" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="40" y="730" width="104" height="120" rx="5" fill="#F3ECE0"/>
<text x="52" y="764.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">What this</text>
<text x="52" y="784.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">shows</text>
<line x1="150" y1="850" x2="1450" y2="850" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
</g>
<g id="20_subject">
<rect x="150.0" y="166" width="429.0" height="50" rx="4" fill="#1F4E5F" opacity="0.9"/>
<rect x="605.0" y="166" width="169.0" height="50" rx="4" fill="#C86B2B" opacity="0.9"/>
<rect x="150.0" y="316" width="1300.0" height="50" rx="4" fill="#9AA7AE" opacity="0.9"/>
<circle cx="306.0" cy="490" r="10" fill="#1F4E5F"/>
