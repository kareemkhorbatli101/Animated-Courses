<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<title>Clause seven, every condition marked</title>
<desc>A contract clause annotated to show its conditions, the connector each one uses, what it lets in or keeps out, and the counts for each draft.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1120" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="910" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="910" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">CONTRIBUTOR AGREEMENT  -  DRAFT 4  -  CLAUSE 7</text>
<text x="140" y="214.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;The Contributor shall indemnify the Publisher, without limit,</text>
<text x="140" y="235.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">against any claim arising from the Contribution, notwithstanding</text>
<text x="140" y="257.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">any editorial amendment.&quot;</text>
<line x1="130" y1="293.25" x2="910" y2="293.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="130" y="297.25" width="780" height="44" rx="4" fill="#F3ECE0"/>
<text x="146" y="327.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.0">COUNTER-PROPOSAL  -  THE ASSOCIATION</text>
<text x="140" y="375.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Liability is capped at the fee paid, provided the Contribution</text>
<text x="140" y="397.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">was disclosed in full to a named editor before publication.</text>
<text x="140" y="418.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Unless that disclosure was made, the cap does not apply.&quot;</text>
<line x1="130" y1="454.5" x2="910" y2="454.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<rect x="140" y="458.5" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="478.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">FEATURE</text>
<text x="403.33333333333337" y="478.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">DRAFT 4</text>
<text x="656.6666666666667" y="478.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">COUNTER</text>
<text x="150.0" y="508.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">WORDS</text>
<text x="403.33333333333337" y="508.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">94</text>
<text x="656.6666666666667" y="508.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">41</text>
<line x1="140" y1="518.5" x2="900" y2="518.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="538.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CONDITIONS</text>
<text x="403.33333333333337" y="538.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="656.6666666666667" y="538.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">2</text>
<line x1="140" y1="548.5" x2="900" y2="548.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="568.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CAP</text>
<text x="403.33333333333337" y="568.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NONE</text>
<text x="656.6666666666667" y="568.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">THE FEE PAID</text>
<line x1="140" y1="578.5" x2="900" y2="578.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="598.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">SUBCLAUSES</text>
<text x="403.33333333333337" y="598.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="656.6666666666667" y="598.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<line x1="140" y1="608.5" x2="900" y2="608.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="628.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CONNECTORS USED</text>
<text x="403.33333333333337" y="628.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">NOTWITHSTANDING</text>
<text x="656.6666666666667" y="628.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">PROVIDED, UNLESS</text>
<line x1="140" y1="638.5" x2="900" y2="638.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="658.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">WHO DECIDES</text>
<text x="403.33333333333337" y="658.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">A COURT</text>
<text x="656.6666666666667" y="658.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">A NAMED EDITOR</text>
<line x1="140" y1="668.5" x2="900" y2="668.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="688.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">SIDE LETTERS ISSUED</text>
<text x="403.33333333333337" y="688.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">11</text>
<text x="656.6666666666667" y="688.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="698.5" x2="900" y2="698.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="718.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CLAIMS IN 9 YEARS</text>
<text x="403.33333333333337" y="718.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<text x="656.6666666666667" y="718.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<line x1="140" y1="728.5" x2="900" y2="728.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="756.5" x2="910" y2="756.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="792.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT EACH CONNECTOR DOES</text>
<text x="140" y="822.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">notwithstanding</text>
<text x="410" y="822.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">keeps the clause alive after an edit</text>
<text x="140" y="854.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">provided</text>
<text x="410" y="854.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a requirement, and it can be met</text>
<text x="140" y="886.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">unless</text>
<text x="410" y="886.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">one exception, named in advance</text>
<text x="140" y="918.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">without limit</text>
<text x="410" y="918.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">not a condition - a refusal to set one</text>
<line x1="130" y1="950.5" x2="910" y2="950.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="972.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">The shorter version is longer in one respect only: it names the</text>
<text x="140" y="994.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">person who decides whether the condition has been met.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Clause seven, every condition marked</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two drafts of one clause, and what each conditional connector lets in.</text>
<circle cx="934" cy="192.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 192.8 L 1024 192.8 L 1024 192.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="197.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Ninety-four words and one</text>
<text x="1040" y="218.10000000000002" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">condition, which is not a ratio</text>
<circle cx="934" cy="356.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 356.6 L 1024 356.6 L 1024 356.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="361.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Forty-one words and two conditions</text>
<text x="1040" y="381.90000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">a contributor can act on</text>
<circle cx="934" cy="593.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 593.2 L 1024 593.2 L 1024 593.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="598.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The row that matters is the one</text>
<text x="1040" y="618.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">naming who decides</text>
<circle cx="934" cy="811.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 811.6 L 1024 811.6 L 1024 811.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="816.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Without limit is a refusal,</text>
<text x="1040" y="836.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">dressed as a term</text>
<circle cx="934" cy="975.4" r="4.5" fill="#C86B2B"/>
<path d="M 934 975.4 L 1024 975.4 L 1024 975.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="980.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Readable and enforceable turned</text>
<text x="1040" y="1000.6999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">out to be the same change</text>
</g>
