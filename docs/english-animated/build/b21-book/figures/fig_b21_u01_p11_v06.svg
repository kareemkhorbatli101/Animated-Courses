<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>Corrections, trust and the cost nobody can price</title>
<desc>A line chart of corrections published per year against the proportion of readers saying they trust the paper, over six years, with a note about the lag between the two.</desc>
