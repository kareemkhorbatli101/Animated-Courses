<text x="150.0" y="672.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CAUSAL CLAIM IN PREPRINT</text>
<text x="403.33333333333337" y="672.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<text x="656.6666666666667" y="672.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<line x1="140" y1="682.25" x2="900" y2="682.25" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="702.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">CAUSAL CLAIM HERE</text>
<text x="403.33333333333337" y="702.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="656.6666666666667" y="702.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">PARA 1</text>
<line x1="140" y1="712.25" x2="900" y2="712.25" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="740.25" x2="910" y2="740.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="776.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT EACH CERTAINTY WORD CLAIMS</text>
<text x="140" y="806.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;demonstrably links&quot;</text>
<text x="410" y="806.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a causal link, which the authors refuse</text>
<text x="140" y="838.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;highly significant&quot;</text>
<text x="410" y="838.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">large - which is not what it means</text>
<text x="140" y="870.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;is said to be&quot;</text>
<text x="410" y="870.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">somebody else said it, unnamed</text>
<text x="140" y="902.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;is bound to prompt&quot;</text>
<text x="410" y="902.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a forecast at the top of the scale</text>
<text x="140" y="934.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;has yet to be&quot;</text>
<text x="410" y="934.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">true, accurate, and in the last line</text>
<line x1="130" y1="966.25" x2="910" y2="966.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="988.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">The press office is measured on coverage obtained. Nobody in the</text>
<text x="140" y="1010.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">building is measured on whether a reader could act on the</text>
<text x="140" y="1031.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">number.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The release, every certainty word marked</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Three hundred and ten words, and the only number in it is a ratio.</text>
<circle cx="934" cy="199.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 199.2 L 1024 199.2 L 1024 199.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="204.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A ratio in the headline and</text>
<text x="1040" y="224.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">nothing to divide it by</text>
<circle cx="934" cy="318.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 318.0 L 1024 318.0 L 1024 318.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="323.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Two certainty words above the</text>
<text x="1040" y="343.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">scale the data supports</text>
<circle cx="934" cy="555.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 555.6 L 1024 555.6 L 1024 555.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="560.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Four rows of nothing, and that is</text>
<text x="1040" y="580.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">the finding</text>
<circle cx="934" cy="832.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 832.8 L 1024 832.8 L 1024 832.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="837.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Significant means unlikely to be</text>
<text x="1040" y="858.0999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">chance, not large</text>
<circle cx="934" cy="1050.6" r="4.5" fill="#C86B2B"/>
<path d="M 934 1050.6 L 1024 1050.6 L 1024 1050.6" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="1055.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The incentive, stated plainly,</text>
<text x="1040" y="1075.8999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">explains the whole sheet</text>
</g>
