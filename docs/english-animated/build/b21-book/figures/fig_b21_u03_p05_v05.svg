<text x="403.33333333333337" y="612.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">310</text>
<text x="656.6666666666667" y="612.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">--</text>
<line x1="140" y1="622.25" x2="900" y2="622.25" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="642.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">PEER REVIEW NOTED</text>
<text x="403.33333333333337" y="642.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">1</text>
<text x="656.6666666666667" y="642.25" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">LAST LINE</text>
