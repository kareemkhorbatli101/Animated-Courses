<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
<title>The same story, twice</title>
<desc>Two versions of the same newspaper story side by side, the filed copy and the printed version, with the paragraphs that went marked.</desc>
