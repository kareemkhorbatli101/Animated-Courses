<rect x="0" y="0" width="1600" height="740" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="60.0" y="130" width="720.0" height="500" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="60.0" y="130" width="720.0" height="42" rx="6" fill="#1F4E5F"/>
<rect x="60.0" y="160" width="720.0" height="12" rx="0" fill="#1F4E5F"/>
<text x="420.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">as filed, 16:00</text>
<rect x="820.0" y="130" width="720.0" height="500" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<rect x="820.0" y="130" width="720.0" height="42" rx="6" fill="#C86B2B"/>
<rect x="820.0" y="160" width="720.0" height="12" rx="0" fill="#C86B2B"/>
<text x="1180.0" y="159" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">as printed, 18:02</text>
</g>
<g id="20_subject">
<line x1="80.0" y1="582" x2="760.0" y2="582" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="80.0" y="418" width="260" height="24" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="85.0" y="452" width="250" height="24" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="95.0" y="486" width="230" height="24" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<text x="360.0" y="364" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="600" font-style="normal">1,400 words · 2 names · 2 dates · 4 quotes</text>
<line x1="840.0" y1="582" x2="1520.0" y2="582" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="870.0" y="418" width="200" height="24" rx="0" fill="#C86B2B" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="845.0" y="452" width="250" height="24" rx="0" fill="none" stroke="#9AA7AE" stroke-width="1.8" stroke-dasharray="7 5"/>
<rect x="910.0" y="486" width="120" height="24" rx="0" fill="#C86B2B" stroke="#1C2B33" stroke-width="1.6"/>
<text x="1120.0" y="364" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="600" font-style="normal">600 words · 0 names · 0 dates · 1 quote</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The same story, twice</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Fourteen hundred words as filed, six hundred as printed.</text>
<text x="800.0" y="674" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">Find the six. One version contains two names and two dates. Which, and how long is the paragraph that carries them?</text>
<text x="800.0" y="706" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">6 differences — find them all</text>
</g>
</svg>
