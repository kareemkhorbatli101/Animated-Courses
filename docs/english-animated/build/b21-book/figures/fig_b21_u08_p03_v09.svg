<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>Two words carrying a four-word clause</title>
<desc>A proportional bar showing the two words actually spoken in a short answer, the clause the listener recovers from the question, and the information nobody can recover.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="640" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="256.0" width="152.6" height="68" rx="5" fill="#1F4E5F"/>
<text x="236.3" y="297.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">Dev</text>
<rect x="318.6" y="256.0" width="152.6" height="68" rx="5" fill="#1F4E5F"/>
<text x="394.90000000000003" y="297.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">has</text>
<rect x="477.20000000000005" y="256.0" width="482.0" height="68" rx="5" fill="#2E6F5E"/>
<text x="718.2" y="297.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">filed the story</text>
<rect x="965.2" y="256.0" width="408.8" height="68" rx="5" fill="#9AA7AE"/>
<text x="1169.6000000000001" y="297.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">when? to whom?</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Two words carrying a four-word clause</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">What the speaker said, what the listener rebuilt, and what nobody can rebuild at all.</text>
<text x="236.3" y="352.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">said</text>
<text x="394.90000000000003" y="352.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">said</text>
<text x="718.2" y="352.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">not said - rebuilt from the question</text>
<text x="1169.6000000000001" y="352.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">not said - and not rebuildable</text>
<text x="160" y="398.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Ellipsis is only possible where recovery is certain. The green block is free; the grey block is</text>
<text x="160" y="419.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">the bet. A cut that leaves grey has not been brief, it has been unclear.</text>
</g>
</svg>
