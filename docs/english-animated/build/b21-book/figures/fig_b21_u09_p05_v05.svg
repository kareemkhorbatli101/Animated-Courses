<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140">
<title>One paragraph, three channels</title>
<desc>Three versions of the same paragraph annotated with their discourse markers, the kind of each, and the one marker whose promise is broken.</desc>
