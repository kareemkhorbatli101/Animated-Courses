<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540">
<title>Three of these four mean the same thing</title>
<desc>A two-by-two arrangement of must, have to, mustn't and don't have to, with the last one coloured differently because its meaning is not a prohibition.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="540" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="206.0" width="253.5744680851064" height="68" rx="5" fill="#1F4E5F"/>
<text x="286.7872340425532" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">must</text>
<rect x="419.5744680851064" y="206.0" width="279.531914893617" height="68" rx="5" fill="#1F4E5F"/>
<text x="559.3404255319149" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">have to</text>
<rect x="705.1063829787233" y="206.0" width="279.531914893617" height="68" rx="5" fill="#A8372E"/>
<text x="844.8723404255318" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">mustn't</text>
<rect x="990.6382978723403" y="206.0" width="383.36170212765956" height="68" rx="5" fill="#2E6F5E"/>
<text x="1182.3191489361702" y="247.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">don't have to</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Three of these four mean the same thing</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The fourth is drawn in a different colour because it means something else entirely.</text>
<text x="286.7872340425532" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">compulsory</text>
<text x="559.3404255319149" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">compulsory</text>
<text x="844.8723404255318" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">forbidden</text>
<text x="1182.3191489361702" y="302.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">NOT NECESSARY - an open door</text>
<text x="160" y="348.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Must and have to are both a wall in front of you. Mustn't is a wall in the other direction.</text>
<text x="160" y="369.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Don't have to is not a wall at all - it is a door you may walk through or not, and swapping it</text>
<text x="160" y="391.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">with mustn't changes freedom into prohibition.</text>
</g>
</svg>
