<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Twenty-two handles, eleven years</title>
<desc>An infographic of the twenty-two emergency handles showing how many exist, how many have been used, what each use cost, and what the proposed cover would change.</desc>
