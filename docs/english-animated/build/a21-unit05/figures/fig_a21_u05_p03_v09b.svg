<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The road forks at four o'clock</title>
<desc>A branching diagram from a single condition into three outcomes: the van on time, the van late, and the van not coming at all.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<circle cx="160" cy="350.0" r="12" fill="#1C2B33"/>
<text x="160" y="392.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">if the van...</text>
</g>
<g id="20_subject">
<path d="M 160 350.0 C 440.6 350.0 440.6 160.0 721.2 160.0" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,160.0 705.2,152.0 705.2,168.0" fill="#2E6F5E"/>
<path d="M 160 350.0 C 440.6 350.0 440.6 293.33333333333337 721.2 293.33333333333337" fill="none" stroke="#C86B2B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,293.33333333333337 705.2,285.33333333333337 705.2,301.33333333333337" fill="#C86B2B"/>
<path d="M 160 350.0 C 440.6 350.0 440.6 426.6666666666667 721.2 426.6666666666667" fill="none" stroke="#A8372E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,426.6666666666667 705.2,418.6666666666667 705.2,434.6666666666667" fill="#A8372E"/>
<path d="M 160 350.0 C 440.6 350.0 440.6 560.0 721.2 560.0" fill="none" stroke="#9AA7AE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<polygon points="721.2,560.0 705.2,552.0 705.2,568.0" fill="#9AA7AE"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The road forks at four o'clock</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">One condition, three ends. A plan is the drawing, not the hope.</text>
<text x="739.2" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="start" font-weight="700" font-style="normal">...comes at four</text>
<text x="739.2" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">we unload and open as usual</text>
<text x="739.2" y="285.33333333333337" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">...comes at six</text>
<text x="739.2" y="311.33333333333337" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">I'll open at half past and lose the restaurants</text>
<text x="739.2" y="418.6666666666667" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="start" font-weight="700" font-style="normal">...doesn't come</text>
<text x="739.2" y="444.6666666666667" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">unless it is here by five, I won't open at all</text>
<text x="739.2" y="552.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#9AA7AE" text-anchor="start" font-weight="700" font-style="normal">...is early, which happens</text>
<text x="739.2" y="578.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">nobody has a plan for this one</text>
</g>
</svg>
