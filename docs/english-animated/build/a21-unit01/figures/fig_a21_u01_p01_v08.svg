<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>How you get good at something</title>
<desc>A network from beginner through watching, practising, making mistakes and correcting to confidence, with a dashed shortcut from beginner to confident.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="200" y1="400" x2="560" y2="250" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="560" y1="250" x2="560" y2="560" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="560" y1="560" x2="940" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="940" y1="400" x2="560" y2="250" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="940" y1="400" x2="1320" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="200" y1="400" x2="1320" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="200" cy="400" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="200" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="200" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Beginner</text>
<text x="200" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">you watch</text>
<circle cx="560" cy="250" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="560" y="255" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="560" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Practise</text>
<text x="560" y="342" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">you try</text>
<circle cx="560" cy="560" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="560" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="560" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Mistake</text>
<text x="560" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">every time</text>
<circle cx="940" cy="400" r="54" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="940" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="940" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Correct it</text>
<text x="940" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and repeat</text>
<circle cx="1320" cy="400" r="54" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1320" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1320" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Confident</text>
<text x="1320" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">you can explain it</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">How you get good at something</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five stages. The dashed line is the one people try to skip.</text>
<rect x="322.0" y="310.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="380.0" y="329.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">have a go</text>
<rect x="502.0" y="390.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="560.0" y="409.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">always</text>
<rect x="692.0" y="465.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="750.0" y="484.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">somebody shows you</text>
<rect x="692.0" y="310.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="750.0" y="329.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">again</text>
<rect x="1072.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1130.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">after a long time</text>
<rect x="702.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="760.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the shortcut nobody has found</text>
</g>
</svg>
