<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
<title>The background and the event</title>
<desc>A timeline with a long past-continuous band for the rain and short past-simple events for leaving the farm and the road closing, with while and when marked.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="700" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="160" y1="490" x2="1380" y2="490" stroke="#1C2B33" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="1380,490 1364,482 1364,498" fill="#1C2B33"/>
<line x1="1282.4" y1="330" x2="1282.4" y2="524" stroke="#C86B2B" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/>
<text x="1282.4" y="548" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2">NOW</text>
</g>
<g id="20_subject">
<line x1="257.6" y1="436" x2="1282.4" y2="436" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round"/>
<circle cx="257.6" cy="436" r="7" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<circle cx="1282.4" cy="436" r="7" fill="#1F4E5F"/>
<circle cx="574.8" cy="328" r="11" fill="#1F4E5F"/>
<line x1="574.8" y1="328" x2="574.8" y2="490" stroke="#1F4E5F" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<line x1="526.0" y1="220" x2="623.6" y2="220" stroke="#D9A441" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="9 6"/>
<line x1="623.6" y1="198" x2="623.6" y2="242" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The background and the event</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The long bar is the weather. The short mark is what happened in it.</text>
<text x="257.6" y="388" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">past continuous - the background</text>
<text x="257.6" y="410" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">It was raining all morning.</text>
<text x="574.8" y="276" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">past simple - the event</text>
<text x="574.8" y="298" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">The road closed.</text>
<text x="526.0" y="172" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#D9A441" text-anchor="start" font-weight="600" font-style="normal">WHILE - cuts the long one</text>
<text x="526.0" y="194" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">While I was loading, the road closed.  |  WHEN - names the short one</text>
<rect x="160" y="608" width="1220" height="54" rx="6" fill="#F3ECE0"/>
<text x="180" y="642.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">while + the long thing (while I was loading). when + the short thing (when the road closed). as</text>
<text x="180" y="663.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">works like while.</text>
</g>
</svg>
