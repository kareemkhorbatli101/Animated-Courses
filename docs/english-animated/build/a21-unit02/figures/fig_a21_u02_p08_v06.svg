<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Twenty-four delivery days. The line at 04:00 is the slot Ravi pays for.</text>
