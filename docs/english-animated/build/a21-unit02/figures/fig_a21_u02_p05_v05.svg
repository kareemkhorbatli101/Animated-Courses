<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<title>The delivery note</title>
<desc>A delivery note listing crates loaded and received, load and signature times, a cold room temperature reading and a handwritten line about the cold room door.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="980" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="770" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="770" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">HIGHLAND GREENS SDN BHD  -  DELIVERY NOTE  4417</text>
<text x="140" y="214" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Farm</text>
<text x="410" y="214" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Lot 9, Cameron Highlands</text>
<text x="140" y="246" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">To</text>
<text x="410" y="246" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Pasar Chow Kit, bay 2</text>
<line x1="130" y1="278" x2="910" y2="278" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="314" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">1 - WHAT WENT ON THE VAN</text>
<rect x="140" y="326" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="346" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ITEM</text>
<text x="403.33333333333337" y="346" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">LOADED</text>
<text x="656.6666666666667" y="346" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">RECEIVED</text>
<text x="150.0" y="376" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Tomatoes (crate)</text>
<text x="403.33333333333337" y="376" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">40</text>
<text x="656.6666666666667" y="376" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">38</text>
<line x1="140" y1="386" x2="900" y2="386" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="406" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Long beans (crate)</text>
<text x="403.33333333333337" y="406" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">12</text>
<text x="656.6666666666667" y="406" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">12</text>
<line x1="140" y1="416" x2="900" y2="416" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="436" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Herbs (tray)</text>
<text x="403.33333333333337" y="436" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">18</text>
<text x="656.6666666666667" y="436" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">18</text>
<line x1="140" y1="446" x2="900" y2="446" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="474" x2="910" y2="474" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">2 - TIMES</text>
<text x="140" y="540" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Cold room in</text>
<text x="410" y="540" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Tue 21:00</text>
<text x="140" y="572" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Loaded</text>
<text x="410" y="572" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Wed 00:55</text>
<text x="140" y="604" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Left farm</text>
<text x="410" y="604" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Wed 01:20</text>
<text x="140" y="636" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Signed for at bay</text>
<text x="410" y="636" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Wed 04:40</text>
<line x1="130" y1="668" x2="910" y2="668" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="704" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">3 - COLD ROOM READING</text>
<text x="140" y="734" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">At loading</text>
<text x="410" y="734" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">9 C</text>
<text x="140" y="766.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Reading taken at the grille. Driver is not responsible for the</text>
<text x="140" y="787.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">reading. Any dispute to be raised within 24 hours of signature.</text>
<line x1="130" y1="823.5" x2="910" y2="823.5" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="855.5" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">ADDED BY HAND, IN BLUE:</text>
<text x="140" y="885.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Door was open when I got there at midnight. Not mine. - Z.&quot;</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The delivery note</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Printed by the farm, signed at the bay, and one line added by hand at the bottom.</text>
<circle cx="934" cy="320.20000000000005" r="4.5" fill="#C86B2B"/>
<path d="M 934 320.20000000000005 L 1024 320.20000000000005 L 1024 320.20000000000005" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="325.20000000000005" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Two crates short, and nobody has</text>
<text x="1040" y="345.50000000000006" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">signed for the difference</text>
<circle cx="934" cy="489.59999999999997" r="4.5" fill="#C86B2B"/>
<path d="M 934 489.59999999999997 L 1024 489.59999999999997 L 1024 489.59999999999997" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="494.59999999999997" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Twenty-five minutes between loaded</text>
<text x="1040" y="514.9" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">and left</text>
<circle cx="934" cy="551.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 551.2 L 1024 551.2 L 1024 551.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="556.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Three hours twenty for fifty-eight</text>
<text x="1040" y="576.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">kilometres</text>
<circle cx="934" cy="674.4" r="4.5" fill="#C86B2B"/>
<path d="M 934 674.4 L 1024 674.4 L 1024 674.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="679.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Nine degrees - the explainer said</text>
<text x="1040" y="699.6999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">twelve</text>
<circle cx="934" cy="736.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 736.0 L 1024 736.0 L 1024 736.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="741.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Twenty-four hours, and it is</text>
<text x="1040" y="761.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">already eight</text>
<circle cx="934" cy="836.1" r="4.5" fill="#C86B2B"/>
<path d="M 934 836.1 L 1024 836.1 L 1024 836.1" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="841.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The only line with a person behind</text>
<text x="1040" y="861.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">it</text>
</g>
</svg>
