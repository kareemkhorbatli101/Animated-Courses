<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
<title>The word you nearly cannot hear</title>
<desc>Four phrases shown written and spoken, with was and were reduced to a single weak vowel.</desc>
