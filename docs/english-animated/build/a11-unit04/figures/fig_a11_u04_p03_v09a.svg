<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>One word, three destinations</title>
<desc>A branching diagram from the single word can to three destinations: ability, permission and prohibition, each with an example sentence.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="680" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<circle cx="160" cy="340.0" r="12" fill="#1C2B33"/>
<text x="160" y="382.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">can</text>
</g>
<g id="20_subject">
<path d="M 160 340.0 C 440.6 340.0 440.6 160.0 721.2 160.0" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,160.0 705.2,152.0 705.2,168.0" fill="#2E6F5E"/>
<path d="M 160 340.0 C 440.6 340.0 440.6 350.0 721.2 350.0" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,350.0 705.2,342.0 705.2,358.0" fill="#1F4E5F"/>
<path d="M 160 340.0 C 440.6 340.0 440.6 540.0 721.2 540.0" fill="none" stroke="#A8372E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,540.0 705.2,532.0 705.2,548.0" fill="#A8372E"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One word, three destinations</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Can does not change. What changes is the situation it lands in.</text>
<text x="739.2" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="start" font-weight="700" font-style="normal">ABILITY - a body or a mind</text>
<text x="739.2" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">I can carry it. I can't carry it up four floors. --</text>
<text x="739.2" y="195.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">nobody decided this</text>
<text x="739.2" y="342.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">PERMISSION - somebody decided</text>
<text x="739.2" y="368.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">You can use the lift. -- and they could decide</text>
<text x="739.2" y="385.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">otherwise tomorrow</text>
<text x="739.2" y="532.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="start" font-weight="700" font-style="normal">PROHIBITION - a rule, and no author</text>
<text x="739.2" y="558.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">You can't smoke here. -- the person who decided is</text>
<text x="739.2" y="575.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">not in the building</text>
</g>
</svg>
