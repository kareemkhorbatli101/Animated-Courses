<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Eleven signs, three questions each</title>
<desc>An infographic laying out the eleven signs in the building against three bands: the authority behind each sign, its age, and the proportion of people who follow it.</desc>
