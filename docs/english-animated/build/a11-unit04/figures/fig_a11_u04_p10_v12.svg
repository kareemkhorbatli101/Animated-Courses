<line x1="1008.0" y1="340" x2="1008.0" y2="400" stroke="#A8372E" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="1294.0" cy="340" r="10" fill="#A8372E"/>
<line x1="1294.0" y1="340" x2="1294.0" y2="400" stroke="#A8372E" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 4"/>
<rect x="150.0" y="466" width="286.0" height="50" rx="4" fill="#2E6F5E" opacity="0.9"/>
