<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">What is inside the marks, where it came from, and what each verb commits the inquiry to.</text>
<circle cx="934" cy="191.2" r="4.5" fill="#C86B2B"/>
