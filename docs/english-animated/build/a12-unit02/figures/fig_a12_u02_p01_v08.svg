<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Five stops, thirty-five years</title>
<desc>The rail line drawn as a network of five stops with distance and journey time on each leg and the population in 1991 and now under each stop.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="180" y1="400" x2="560" y2="260" stroke="#9AA7AE" stroke-width="7" stroke-linecap="round"/>
<line x1="560" y1="260" x2="800" y2="620" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/>
<line x1="800" y1="620" x2="1040" y2="260" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1040" y1="260" x2="1280" y2="560" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="1280" y1="560" x2="1460" y2="280" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="20_subject">
<circle cx="180" cy="400" r="56" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="180" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">T</text>
<text x="180" y="482" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Toronto</text>
<text x="180" y="502" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">2.3 m → 2.9 m</text>
<circle cx="560" cy="260" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="560" y="265" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">W</text>
<text x="560" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Winnipeg</text>
<text x="560" y="352" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">652 k → 749 k</text>
<circle cx="800" cy="620" r="52" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="800" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">M</text>
<text x="800" y="698" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Mirror Lake</text>
<text x="800" y="718" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">1,100 → 310</text>
<circle cx="1040" cy="260" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="1040" y="265" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="1040" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Saskatoon</text>
<text x="1040" y="352" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">186 k → 266 k</text>
<circle cx="1280" cy="560" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1280" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">J</text>
<text x="1280" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Jasper</text>
<text x="1280" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">4,000 → 4,100</text>
<circle cx="1460" cy="280" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="1460" y="285" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">V</text>
<text x="1460" y="352" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Vancouver</text>
<text x="1460" y="372" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">472 k → 662 k</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Five stops, thirty-five years</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The distance and the time on every leg, and under each stop the population then and now.</text>
<rect x="312.0" y="315.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="370.0" y="334.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">2,100 km · 36 h</text>
<rect x="622.0" y="425.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="680.0" y="444.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">240 km · 3 h · stops 40 seconds</text>
<rect x="862.0" y="425.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="920.0" y="444.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">470 km · 6 h</text>
<rect x="1102.0" y="395.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1160.0" y="414.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">860 km · 13 h</text>
<rect x="1312.0" y="405.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1370.0" y="424.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">880 km · 17 h</text>
</g>
</svg>
