<text x="186" y="717.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Converting the garden multiplies the yield by five and removes eight of the twelve growing cycles,</text>
