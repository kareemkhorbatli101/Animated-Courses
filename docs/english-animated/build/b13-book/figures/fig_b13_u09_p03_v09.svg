<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
<title>Where the object is allowed to stand</title>
<desc>A branching diagram of four phrasal verb types showing where an object noun and an object pronoun can go in each.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="740" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<circle cx="160" cy="370.0" r="12" fill="#1C2B33"/>
<text x="160" y="412.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">she ___ it</text>
</g>
<g id="20_subject">
<path d="M 160 370.0 C 440.6 370.0 440.6 160.0 721.2 160.0" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,160.0 705.2,152.0 705.2,168.0" fill="#1F4E5F"/>
<path d="M 160 370.0 C 440.6 370.0 440.6 270.0 721.2 270.0" fill="none" stroke="#A8372E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,270.0 705.2,262.0 705.2,278.0" fill="#A8372E"/>
<path d="M 160 370.0 C 440.6 370.0 440.6 380.0 721.2 380.0" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,380.0 705.2,372.0 705.2,388.0" fill="#2E6F5E"/>
<path d="M 160 370.0 C 440.6 370.0 440.6 490.0 721.2 490.0" fill="none" stroke="#C86B2B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,490.0 705.2,482.0 705.2,498.0" fill="#C86B2B"/>
<path d="M 160 370.0 C 440.6 370.0 440.6 600.0 721.2 600.0" fill="none" stroke="#9AA7AE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,600.0 705.2,592.0 705.2,608.0" fill="#9AA7AE"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Where the object is allowed to stand</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">One rule is absolute. The other three are about which group the verb belongs to.</text>
<text x="739.2" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">SEPARABLE - a noun goes either side</text>
<text x="739.2" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">mark the student down · mark down the student</text>
<text x="739.2" y="262.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="start" font-weight="700" font-style="normal">SEPARABLE - a pronoun MUST split it</text>
<text x="739.2" y="288.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">mark her down · NEVER mark down her</text>
<text x="739.2" y="372.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="start" font-weight="700" font-style="normal">INSEPARABLE - always after the particle</text>
<text x="739.2" y="398.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">look into it · come across it · get over it</text>
<text x="739.2" y="482.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">THREE-PART - never splits, ever</text>
<text x="739.2" y="508.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">put up with it · look forward to it · run out of it</text>
<text x="739.2" y="592.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#9AA7AE" text-anchor="start" font-weight="700" font-style="normal">NO OBJECT - nothing goes anywhere</text>
<text x="739.2" y="618.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">stand down · die down · look back</text>
</g>
</svg>
