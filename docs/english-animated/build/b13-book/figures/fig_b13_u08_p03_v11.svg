<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>needn't have, and the Thursday it describes</title>
<desc>Two panels comparing she needn't have come in with she did not need to come in.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="720" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="80.0" y="120" width="700.0" height="450.75" rx="8" fill="#FFFFFF" stroke="#A8372E" stroke-width="2.6"/>
<circle cx="116.0" cy="158" r="20" fill="#A8372E"/>
<text x="116.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">✗</text>
<rect x="820.0" y="120" width="700.0" height="450.75" rx="8" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="2.6"/>
<circle cx="856.0" cy="158" r="20" fill="#2E6F5E"/>
<text x="856.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">✓</text>
</g>
<g id="20_subject">
<text x="152.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">She needn't have come in, so she stayed at home.</text>
<line x1="360.0" y1="220" x2="360.0" y2="340" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<text x="360.0" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">needn't have come in</text>
<circle cx="598.0" cy="270" r="12" fill="#A8372E"/>
<path d="M 598.0 270 L 388.0 270" fill="none" stroke="#A8372E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="598.0" y="240" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">and the second half says she did not</text>
<text x="104.0" y="485.55" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">needn't have plus past participle says the action happened and was unnecessary. The</text>
<text x="104.0" y="505.85" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">sentence then says she stayed at home, which contradicts the first half. Two people</text>
<text x="104.0" y="526.15" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">reading this will picture two different Thursdays, and in a post-mortem that is the</text>
<text x="104.0" y="546.45" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">difference between a wasted trip and no trip.</text>
<text x="892.0" y="166" font-family="Inter, DejaVu Sans, sans-serif" font-size="17" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">She did not need to come in, so she stayed at home.</text>
<line x1="1128.0" y1="220" x2="1128.0" y2="340" stroke="#D9A441" stroke-width="4" stroke-linecap="round"/>
<text x="1128.0" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">did not need to come in</text>
<circle cx="1352.0" cy="270" r="12" fill="#2E6F5E"/>
<path d="M 1352.0 270 L 1156.0 270" fill="none" stroke="#2E6F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1352.0" y="240" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#2E6F5E" text-anchor="middle" font-weight="600" font-style="normal">and nothing happened, which is consistent</text>
<text x="844.0" y="485.55" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">did not need to describes the absence of an obligation and says nothing about what was</text>
<text x="844.0" y="505.85" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">done, so it sits with either ending. Use it when the action did not happen, and needn't</text>
<text x="844.0" y="526.15" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">have only when it did and was wasted.</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">needn't have, and the Thursday it describes</text>
<rect x="80" y="602.75" width="1440" height="109.25" rx="6" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.6"/>
<text x="104" y="628.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">What the writer thought:</text>
<text x="104" y="650.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Both forms translate the same way in most languages, so learners choose by register and hear them as</text>
<text x="104" y="672.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">interchangeable. In English the choice reports a fact: one of them says the person turned up.</text>
</g>
</svg>
