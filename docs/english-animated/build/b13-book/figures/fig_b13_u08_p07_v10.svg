<text x="594" y="190" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">asked</text>
<circle cx="240" cy="232" r="8" fill="#9AA7AE"/>
<text x="240" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">she</text>
<circle cx="358" cy="232" r="16" fill="#1F4E5F"/>
<text x="358" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">COULD</text>
<circle cx="476" cy="232" r="8" fill="#9AA7AE"/>
<text x="476" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">uhv</text>
<circle cx="594" cy="232" r="8" fill="#9AA7AE"/>
<text x="594" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">asked</text>
