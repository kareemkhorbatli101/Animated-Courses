<text x="240" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">it</text>
<circle cx="358" cy="320" r="16" fill="#1F4E5F"/>
<text x="358" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">OUGHT</text>
<circle cx="476" cy="320" r="8" fill="#9AA7AE"/>
<text x="476" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">tuhv</text>
<circle cx="594" cy="320" r="8" fill="#9AA7AE"/>
<text x="594" y="366" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">fired</text>
