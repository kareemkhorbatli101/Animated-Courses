<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>should've, could've, ought to've</title>
<desc>Four hypothetical past phrases marked for stress, showing have reduced to a single weak syllable.</desc>
