<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>What an interface is actually optimising</title>
<desc>A network from a prompt and a notification through autoplay and the feed to dwell time and time on site, with the opt-out shown as a long dashed path.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="230" x2="170" y2="570" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="170" y1="570" x2="540" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="400" x2="900" y2="230" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="900" y1="230" x2="1270" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="400" x2="900" y2="600" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<line x1="900" y1="600" x2="1270" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="170" cy="230" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="170" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Notification</text>
<text x="170" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the way back in</text>
<circle cx="170" cy="570" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="170" y="575" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="170" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The feed</text>
<text x="170" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">no end, by design</text>
<circle cx="540" cy="400" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="540" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="540" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Autoplay</text>
<text x="540" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">five seconds to decide</text>
<circle cx="900" cy="230" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="900" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="900" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Dwell</text>
<text x="900" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">how long on one item</text>
<circle cx="1270" cy="400" r="56" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1270" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1270" y="482" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Time on site</text>
<text x="1270" y="502" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the metric everything serves</text>
<circle cx="900" cy="600" r="50" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="900" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="900" y="676" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Opt out</text>
<text x="900" y="696" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">four levels down</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What an interface is actually optimising</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six nodes. Everything on the surface serves the one at the far right.</text>
<rect x="112.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="170.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and you are back</text>
<rect x="297.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="355.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the next one has already started</text>
<rect x="662.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">eleven more seconds, every time</text>
<rect x="1027.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1085.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">this is what is being raised</text>
<rect x="662.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">exists, in a submenu</text>
<rect x="1027.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1085.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and almost nobody finds it</text>
</g>
</svg>
