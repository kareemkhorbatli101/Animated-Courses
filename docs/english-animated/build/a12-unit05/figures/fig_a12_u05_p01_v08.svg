<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>One body, eight movements, nine hours</title>
<desc>A body at the centre joined by labelled lines to eight movements - stand, bend, lift, carry, stretch, breathe, turn and hold - each line carrying the number of times it occurs in a nine-hour shift.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="320" y1="180" x2="800" y2="400" stroke="#A8372E" stroke-width="7" stroke-linecap="round"/>
<line x1="240" y1="460" x2="800" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="400" y1="680" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="800" y1="720" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1200" y1="680" x2="800" y2="400" stroke="#2E6F5E" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="1360" y1="440" x2="800" y2="400" stroke="#8C6A9E" stroke-width="4" stroke-linecap="round"/>
<line x1="1280" y1="180" x2="800" y2="400" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="60" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">9h</text>
<text x="800" y="486" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">one shift</text>
<text x="800" y="506" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">nine hours</text>
<circle cx="320" cy="180" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="320" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="320" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">stand</text>
<text x="320" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">9 hours of it</text>
<circle cx="240" cy="460" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="240" y="465" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">B</text>
<text x="240" y="532" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">bend</text>
<text x="240" y="552" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">about 340 times</text>
<circle cx="400" cy="680" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="400" y="685" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">L</text>
<text x="400" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">lift</text>
<text x="400" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">about 120 times</text>
<circle cx="800" cy="720" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="800" y="725" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">C</text>
<text x="800" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">carry</text>
<text x="800" y="812" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">about 90 times</text>
<circle cx="1200" cy="680" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="1200" y="685" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">X</text>
<text x="1200" y="752" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">stretch</text>
<text x="1200" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">about 6 times</text>
<circle cx="1360" cy="440" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="1360" y="445" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">T</text>
<text x="1360" y="512" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">turn</text>
<text x="1360" y="532" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">about 1,100 times</text>
<circle cx="1280" cy="180" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="1280" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">H</text>
<text x="1280" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">hold the rail</text>
<text x="1280" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">every time it moves</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One body, eight movements, nine hours</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The number on each line is how many times that movement happens in one shift. The largest is the one nobody counts.</text>
<rect x="502.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="560.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nine hours, on one square metre</text>
<rect x="462.0" y="415.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="520.0" y="434.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">340 - and the knees are the question</text>
<rect x="542.0" y="525.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="600.0" y="544.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">120 - a second each</text>
<rect x="742.0" y="545.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="800.0" y="564.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">90 - a minute each</text>
<rect x="942.0" y="525.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1000.0" y="544.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">6, and all six in the last hour</text>
<rect x="1022.0" y="405.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1080.0" y="424.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">1,100 - nobody has ever counted this one</text>
<rect x="982.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1040.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">every curve, every point, for 23 years</text>
</g>
</svg>
