<line x1="130" y1="696.25" x2="910" y2="696.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="732.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT EACH CLAUSE CLAIMS</text>
<text x="140" y="762.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;four, cabled in 2021,&quot;</text>
<text x="410" y="762.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">non-defining - those four, all cabled</text>
<text x="140" y="794.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;calls using shore power&quot;</text>
<text x="410" y="794.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">reduced, defining - only those calls</text>
<text x="140" y="826.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;calls that do not&quot;</text>
<text x="410" y="826.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">defining - the comparison group</text>
<text x="140" y="858.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;the berths, which have...&quot;</text>
<text x="410" y="858.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">non-defining - all nine of them</text>
<line x1="130" y1="890.25" x2="910" y2="890.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="912.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Two commas in note 14 claim five berths that do not exist.</text>
<text x="140" y="934.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Nothing else in either document is inaccurate.</text>
