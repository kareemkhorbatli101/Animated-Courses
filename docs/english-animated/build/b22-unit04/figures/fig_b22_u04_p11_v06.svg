<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
<title>Four ways of publishing one study</title>
<desc>A bar chart comparing four publication formats on the share of readers who could state the finding and the share of claims traceable to a paragraph of the paper.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="820" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="460" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="610.0" x2="1350" y2="610.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="615.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="495.0" x2="1350" y2="495.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="500.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">25</text>
<line x1="170" y1="380.0" x2="1350" y2="380.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="385.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">50</text>
<line x1="170" y1="265.0" x2="1350" y2="265.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="270.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">75</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">100</text>
</g>
<g id="20_subject">
<rect x="212.14285714285714" y="315.59999999999997" width="94.82142857142858" height="294.40000000000003" rx="0" fill="#2E6F5E"/>
<rect x="507.14285714285717" y="522.6" width="94.82142857142858" height="87.39999999999998" rx="0" fill="#2E6F5E"/>
<rect x="802.1428571428571" y="343.20000000000005" width="94.82142857142858" height="266.79999999999995" rx="0" fill="#2E6F5E"/>
<rect x="1097.142857142857" y="283.40000000000003" width="94.82142857142858" height="326.59999999999997" rx="0" fill="#2E6F5E"/>
<rect x="317.50000000000006" y="610.0" width="94.82142857142858" height="0.0" rx="0" fill="#1F4E5F"/>
<rect x="612.5" y="150.0" width="94.82142857142858" height="460.0" rx="0" fill="#1F4E5F"/>
<rect x="907.5" y="421.4" width="94.82142857142858" height="188.60000000000002" rx="0" fill="#1F4E5F"/>
<rect x="1202.5" y="168.40000000000003" width="94.82142857142858" height="441.59999999999997" rx="0" fill="#1F4E5F"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four ways of publishing one study</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two hundred readers, the same finding, four publication formats.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#2E6F5E"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">stated the finding (%)</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">claims traceable (%)</text>
<text x="317.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">summary only</text>
<text x="612.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">paper only</text>
<text x="907.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">both, uncited</text>
<text x="1202.5" y="638" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">both, cited</text>
<rect x="170" y="670" width="1180" height="87.25" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="697.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">The &quot;both, uncited&quot; column is what most organisations already do, and its traceability figure of</text>
<text x="186" y="718.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">forty-one per cent is a measure of how many summary sentences happen to survive a check nobody</text>
<text x="186" y="740.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">performs.</text>
<text x="170" y="793.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Publishing the paper alone is unimpeachable and unread. Citing the summary is the only</text>
<text x="170" y="815.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">format where both numbers are high, and it is also the only one that works on the writer.</text>
</g>
</svg>
