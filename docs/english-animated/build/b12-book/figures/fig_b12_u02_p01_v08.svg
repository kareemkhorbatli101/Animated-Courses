<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Six things that had to line up</title>
<desc>A network of six contributing factors - labelling, a broken scanner, a locum, a rota, unread reports and a transcription - converging on one near miss.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="230" x2="900" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="170" y1="560" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="180" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="540" y1="620" x2="900" y2="400" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="900" y1="400" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="170" y1="230" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
</g>
<g id="20_subject">
<circle cx="170" cy="230" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="170" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The labelling</text>
<text x="170" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">changed and changed back</text>
<circle cx="170" cy="560" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="170" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="170" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The scanner</text>
<text x="170" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">broken since March</text>
<circle cx="540" cy="180" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="540" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="540" y="252" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">A locum</text>
<text x="540" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">week three</text>
<circle cx="540" cy="620" r="46" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="540" y="625" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="540" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The rota</text>
<text x="540" y="712" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">forty minutes over</text>
<circle cx="900" cy="400" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="900" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="900" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Three reports</text>
<text x="900" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">same cupboard, filed</text>
<circle cx="1290" cy="400" r="54" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="1290" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1290" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The bedside</text>
<text x="1290" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">16.08, a wristband</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Six things that had to line up</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Remove any one of them and nothing reaches the bedside. All six were in place by March.</text>
<rect x="477.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="535.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">reported in March, April, June</text>
<rect x="672.0" y="465.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="730.0" y="484.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nothing was checked on the way</text>
<rect x="857.0" y="275.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="915.0" y="294.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">three weeks in, and nobody told him</text>
<rect x="662.0" y="495.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="514.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the third form was not filed</text>
<rect x="1037.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1095.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">all three went to the same inbox</text>
<rect x="672.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="730.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">20 and 2 on adjacent shelves</text>
</g>
</svg>
