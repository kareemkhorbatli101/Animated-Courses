<text x="403.33333333333337" y="496" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<text x="656.6666666666667" y="496" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3</text>
<line x1="140" y1="506" x2="900" y2="506" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="140" y="534.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Factual corrections fall away. Clarity comments rise and then</text>
<text x="140" y="555.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">fall. Off-brief comments appear twice, both times early, and the</text>
<text x="140" y="577.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">second one is the only comment in twenty-nine that changed what</text>
<text x="140" y="599.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the project was about.</text>
<line x1="130" y1="635.0" x2="910" y2="635.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="671.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE COMMENT THAT CHANGED IT  (ROUND 2)</text>
<text x="140" y="701.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Your question was about capacity and this is about money.</text>
<text x="140" y="722.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Decide which one you are writing, because the data you need is</text>
<text x="140" y="744.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">different.&quot;</text>
<line x1="130" y1="780.25" x2="910" y2="780.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="816.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE COMMENT REPEATED IN ALL FOUR</text>
<text x="140" y="846.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;Put the assumption before the number it produces.&quot;</text>
<text x="140" y="882.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Acted on in round</text>
<text x="410" y="882.0" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">4</text>
<line x1="130" y1="914.0" x2="910" y2="914.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="946.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">LAST LINE OF ROUND FOUR:</text>
<text x="140" y="976.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;This works. I would still put the assumption first, and I</text>
<text x="140" y="997.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">notice I have now said that four times.&quot;</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Four rounds of comments on one proposal</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Twenty-nine comments. One of them changed the project, and it is in round two.</text>
<circle cx="934" cy="252.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 252.8 L 1024 252.8 L 1024 252.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="257.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Nine factual errors in round one,</text>
<text x="1040" y="278.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">none by round four</text>
<circle cx="934" cy="335.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 335.8 L 1024 335.8 L 1024 335.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="340.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Clarity comments peak in round</text>
<text x="1040" y="361.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">three, when the content is settled</text>
<circle cx="934" cy="485.2" r="4.5" fill="#C86B2B"/>
<path d="M 934 485.2 L 1024 485.2 L 1024 485.2" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="490.2" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Off-brief twice, both early - and</text>
<text x="1040" y="510.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">left late it wastes everything</text>
<text x="1040" y="530.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">after</text>
<circle cx="934" cy="618.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 618.0 L 1024 618.0 L 1024 618.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="623.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Twenty-six words, and the whole</text>
<text x="1040" y="643.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">project turned on them</text>
<circle cx="934" cy="767.4" r="4.5" fill="#C86B2B"/>
<path d="M 934 767.4 L 1024 767.4 L 1024 767.4" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="772.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Repeated four times, acted on once</text>
<circle cx="934" cy="900.1999999999999" r="4.5" fill="#C86B2B"/>
<path d="M 934 900.1999999999999 L 1024 900.1999999999999 L 1024 900.1999999999999" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="905.1999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">And the supervisor is counting too</text>
