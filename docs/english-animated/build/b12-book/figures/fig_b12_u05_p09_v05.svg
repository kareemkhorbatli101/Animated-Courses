<line x1="140" y1="346" x2="900" y2="346" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<rect x="140" y="356" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="376" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ROUND</text>
