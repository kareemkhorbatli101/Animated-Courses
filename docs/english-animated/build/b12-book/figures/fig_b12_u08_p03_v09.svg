<text x="973.3333333333333" y="443.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#8C6A9E" text-anchor="middle" font-weight="600" font-style="normal">the category, formal</text>
<text x="1312.2222222222222" y="443.6" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">THOSE ones - never</text>
