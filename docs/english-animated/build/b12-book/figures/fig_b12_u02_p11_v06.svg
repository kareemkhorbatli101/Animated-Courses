<circle cx="878.0" cy="448.2222222222222" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1114.0" cy="455.55555555555554" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<circle cx="1350.0" cy="401.7777777777778" r="5" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="2.6"/>
<text x="1364.0" y="406.7777777777778" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="start" font-weight="600" font-style="normal">reports filed</text>
<path d="M 170.0 555.8 L 406.0 550.9 L 642.0 538.7 L 878.0 531.3 L 1114.0 528.9 L 1350.0 526.4" fill="none" stroke="#2E6F5E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
