<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Reports filed, and actions taken, over six years</title>
<desc>A line chart of near-miss reports filed each year against recorded actions, with a marked fall in reports after signatures were introduced.</desc>
