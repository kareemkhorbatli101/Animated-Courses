<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Posts, applicants and attrition, over ten years</title>
<desc>A bar chart comparing unfilled posts, applicants per post and four-year attrition in two specialities over a decade.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="440" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="590.0" x2="1350" y2="590.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="595.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="480.0" x2="1350" y2="480.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="485.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">10</text>
<line x1="170" y1="370.0" x2="1350" y2="370.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="375.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">20</text>
<line x1="170" y1="260.0" x2="1350" y2="260.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="265.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">30</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">40</text>
</g>
<g id="20_subject">
<rect x="212.14285714285714" y="491.0" width="94.82142857142858" height="99.0" rx="0" fill="#A8372E"/>
<rect x="507.14285714285717" y="579.0" width="94.82142857142858" height="11.0" rx="0" fill="#A8372E"/>
<rect x="802.1428571428571" y="249.0" width="94.82142857142858" height="341.0" rx="0" fill="#A8372E"/>
<rect x="1097.142857142857" y="172.0" width="94.82142857142858" height="418.0" rx="0" fill="#A8372E"/>
<rect x="317.50000000000006" y="568.0" width="94.82142857142858" height="22.0" rx="0" fill="#2E6F5E"/>
<rect x="612.5" y="513.0" width="94.82142857142858" height="77.0" rx="0" fill="#2E6F5E"/>
<rect x="907.5" y="491.0" width="94.82142857142858" height="99.0" rx="0" fill="#2E6F5E"/>
<rect x="1202.5" y="436.0" width="94.82142857142858" height="154.0" rx="0" fill="#2E6F5E"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Posts, applicants and attrition, over ten years</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two specialities, and the shortage is not a recruitment problem.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#A8372E"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the shortage speciality</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#2E6F5E"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the one he is good at</text>
<text x="317.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">posts unfilled</text>
<text x="612.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">applicants/post</text>
<text x="907.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">attrition at 4 yr</text>
<text x="1202.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">attrition at 8 yr</text>
<rect x="170" y="650" width="1180" height="65.5" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="677.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Nine unfilled posts and thirty-one per cent attrition is one number, not two. The second causes the</text>
<text x="186" y="698.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">first, and only the first is ever advertised.</text>
<text x="170" y="751.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">The shortage speciality fills about one post in four and loses a third of those who take one</text>
<text x="170" y="773.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">within four years. Recruiting harder into it has been tried twice.</text>
</g>
</svg>
