<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<title>The curriculum contents page, and the survey answers</title>
<desc>A first-year curriculum contents page listing clinical domains and hours, alongside a summary of what 211 first-year doctors said they wished they had been taught.</desc>
