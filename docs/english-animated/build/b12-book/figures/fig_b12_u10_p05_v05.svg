<line x1="140" y1="376" x2="900" y2="376" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="396" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Ten further clinical domains</text>
<text x="403.33333333333337" y="396" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">338</text>
<text x="656.6666666666667" y="396" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">various</text>
<line x1="140" y1="406" x2="900" y2="406" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="140" y="434" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Added in the last five years</text>
<text x="410" y="434" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">prescribing safety (+40 h)</text>
<text x="140" y="466" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Removed</text>
<text x="410" y="466" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">induction week (-16 h)</text>
<line x1="130" y1="498" x2="910" y2="498" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="534" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WHAT 211 DOCTORS SAID THEY NEEDED</text>
<rect x="140" y="546" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="566" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ANSWER GROUP</text>
<text x="403.33333333333337" y="566" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">SHARE</text>
<text x="656.6666666666667" y="566" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">IN CURRICULUM?</text>
<text x="150.0" y="596" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Who to ask</text>
<text x="403.33333333333337" y="596" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">49 %</text>
<text x="656.6666666666667" y="596" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no  (nearest: 2 h, week 9)</text>
<line x1="140" y1="606" x2="900" y2="606" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="626" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">How to say I do not know</text>
<text x="403.33333333333337" y="626" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">27 %</text>
<text x="656.6666666666667" y="626" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no</text>
<line x1="140" y1="636" x2="900" y2="636" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="656" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">What is normal</text>
<text x="403.33333333333337" y="656" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">19 %</text>
<text x="656.6666666666667" y="656" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no</text>
<line x1="140" y1="666" x2="900" y2="666" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="686" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Clinical content</text>
<text x="403.33333333333337" y="686" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">5 %</text>
<text x="656.6666666666667" y="686" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">yes, 820 hours of it</text>
<line x1="140" y1="696" x2="900" y2="696" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="140" y="724.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">190 of the 211 responses described something the institution</text>
<text x="140" y="745.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">could have provided and did not. The institution has three times</text>
<text x="140" y="767.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">asked whether the clinical content is adequate.</text>
<line x1="130" y1="803.25" x2="910" y2="803.25" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="835.25" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">HAND ANNOTATION ON THE CONTENTS PAGE, BESIDE &quot;WORKING IN A TEAM&quot;:</text>
<text x="140" y="865.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;2 hours. In week nine. By which time you have either worked it</text>
<text x="140" y="887.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">out or stopped asking.&quot;</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The curriculum contents page, and the survey answers</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Eight hundred and twenty hours, fourteen domains, and three findings that are in none of them.</text>
<circle cx="934" cy="256.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 256.0 L 1024 256.0 L 1024 256.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
