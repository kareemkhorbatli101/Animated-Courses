<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<title>What the question is actually asking</title>
<desc>A decode sheet for exam questions showing task words ranked by how much judgement they require and scope words that set how much must be covered.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="118" y="130" width="820" height="830" rx="0" fill="#1C2B33" opacity="0.1"/>
<rect x="110" y="120" width="820" height="830" rx="0" fill="#FFFFFF" stroke="#1C2B33" stroke-width="2"/>
</g>
<g id="20_subject">
<rect x="110" y="120" width="820" height="70" rx="0" fill="#F3ECE0"/>
<text x="140" y="164" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">EXAM DECODE  -  TASK WORDS AND SCOPE WORDS</text>
<text x="140" y="228" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE TASK WORD</text>
<rect x="140" y="240" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="260" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">WORD</text>
<text x="403.33333333333337" y="260" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ASKS FOR</text>
<text x="656.6666666666667" y="260" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">YOUR JUDGEMENT?</text>
<text x="150.0" y="290" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Outline</text>
<text x="403.33333333333337" y="290" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the shape, briefly</text>
<text x="656.6666666666667" y="290" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">none</text>
<line x1="140" y1="300" x2="900" y2="300" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Describe</text>
<text x="403.33333333333337" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">what it is</text>
<text x="656.6666666666667" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">none</text>
<line x1="140" y1="330" x2="900" y2="330" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="350" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Explain</text>
<text x="403.33333333333337" y="350" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">why or how</text>
<text x="656.6666666666667" y="350" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a little</text>
<line x1="140" y1="360" x2="900" y2="360" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="380" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Compare</text>
<text x="403.33333333333337" y="380" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">similarities AND differences</text>
<text x="656.6666666666667" y="380" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">some</text>
<line x1="140" y1="390" x2="900" y2="390" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="410" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Justify</text>
<text x="403.33333333333337" y="410" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">reasons for a stated position</text>
<text x="656.6666666666667" y="410" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a lot</text>
<line x1="140" y1="420" x2="900" y2="420" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="440" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Evaluate</text>
<text x="403.33333333333337" y="440" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the case both ways, then a verdict</text>
<text x="656.6666666666667" y="440" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">all of it</text>
<line x1="140" y1="450" x2="900" y2="450" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="140" y="478.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Describe and explain are treated as synonyms in about a third of</text>
<text x="140" y="499.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">all answers. They are not: one asks what, the other asks why,</text>
<text x="140" y="521.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">and an answer to the wrong one can be complete and score</text>
<text x="140" y="543.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">nothing.</text>
<line x1="130" y1="579.0" x2="910" y2="579.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="615.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">THE SCOPE WORD</text>
<rect x="140" y="627.0" width="760" height="30" rx="0" fill="#F3ECE0"/>
<text x="150.0" y="647.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">PHRASE</text>
<text x="403.33333333333337" y="647.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">ASKS FOR</text>
<text x="656.6666666666667" y="647.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal"></text>
<text x="150.0" y="677.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the causes</text>
<text x="403.33333333333337" y="677.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">all of them, or you must say why not</text>
<text x="656.6666666666667" y="677.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="687.0" x2="900" y2="687.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="707.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a cause</text>
<text x="403.33333333333337" y="707.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">one, chosen and defended</text>
<text x="656.6666666666667" y="707.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="717.0" x2="900" y2="717.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="737.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the main causes</text>
<text x="403.33333333333337" y="737.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">a ranking, and a reason for the ranking</text>
<text x="656.6666666666667" y="737.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="747.0" x2="900" y2="747.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<text x="150.0" y="767.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">any two causes</text>
<text x="403.33333333333337" y="767.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">two, and the choice is not assessed</text>
<text x="656.6666666666667" y="767.0" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal"></text>
<line x1="140" y1="777.0" x2="900" y2="777.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="130" y1="805.0" x2="910" y2="805.0" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="837.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">WHAT THE THIRD STUDENT NOTICED:</text>
<text x="140" y="867.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">&quot;It says evaluate, and there is no conclusion anywhere in my</text>
<text x="140" y="888.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">answer.&quot;</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What the question is actually asking</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six task words, six scope words, and thirty-six different questions.</text>
<circle cx="934" cy="261.1" r="4.5" fill="#C86B2B"/>
<path d="M 934 261.1 L 1024 261.1 L 1024 261.1" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="266.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Two words that ask for nothing of</text>
<text x="1040" y="286.40000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">your own</text>
<circle cx="934" cy="352.40000000000003" r="4.5" fill="#C86B2B"/>
<path d="M 934 352.40000000000003 L 1024 352.40000000000003 L 1024 352.40000000000003" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="357.40000000000003" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Compare means both, and most</text>
<text x="1040" y="377.70000000000005" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">answers give one</text>
<circle cx="934" cy="402.20000000000005" r="4.5" fill="#C86B2B"/>
<path d="M 934 402.20000000000005 L 1024 402.20000000000005 L 1024 402.20000000000005" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="407.20000000000005" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Evaluate needs a verdict, and the</text>
<text x="1040" y="427.50000000000006" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">verdict is the marks</text>
<circle cx="934" cy="501.8" r="4.5" fill="#C86B2B"/>
<path d="M 934 501.8 L 1024 501.8 L 1024 501.8" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="506.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">A third of answers treat these two</text>
<text x="1040" y="527.1" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">as the same word</text>
<circle cx="934" cy="701.0" r="4.5" fill="#C86B2B"/>
<path d="M 934 701.0 L 1024 701.0 L 1024 701.0" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="706.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The definite article again, and</text>
<text x="1040" y="726.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">here it means all of them</text>
<circle cx="934" cy="900.1999999999999" r="4.5" fill="#C86B2B"/>
<path d="M 934 900.1999999999999 L 1024 900.1999999999999 L 1024 900.1999999999999" fill="none" stroke="#C86B2B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="905.1999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">And this is the commonest way to</text>
<text x="1040" y="925.4999999999999" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">lose a whole question</text>
</g>
</svg>
