<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Why eleven became three</title>
<desc>A network connecting price, working hours, who is at home in the afternoon, cooking time and fresh purchases, with the strength of each link shown.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="240" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="170" y1="560" x2="540" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="400" x2="900" y2="230" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="540" y1="400" x2="900" y2="570" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="900" y1="230" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="900" y1="570" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="170" y1="240" x2="900" y2="570" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="170" cy="240" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="170" y="245" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Price</text>
<text x="170" y="332" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">+40 % in real terms</text>
<circle cx="170" cy="560" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="170" y="565" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="170" y="632" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Shift patterns</text>
<text x="170" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the thing nobody names</text>
<circle cx="540" cy="400" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="540" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="540" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Who is at home at 3pm</text>
<text x="540" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">41 % down to 11 %</text>
<circle cx="900" cy="230" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="900" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="900" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Cooking time</text>
<text x="900" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">buy, cook and eat same day</text>
<circle cx="900" cy="570" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="900" y="575" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="900" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Tinned</text>
<text x="900" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">18 % up to 61 %</text>
<circle cx="1290" cy="400" r="54" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="1290" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1290" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Fresh fish</text>
<text x="1290" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">11 a month down to 3</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Why eleven became three</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six nodes. The one everybody names is not the one that moved most.</text>
<rect x="672.0" y="305.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="730.0" y="324.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the explanation everybody gives</text>
<rect x="297.0" y="465.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="355.0" y="484.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and this is the one that moved</text>
<rect x="662.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">nobody is in to cook it</text>
<rect x="662.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="720.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">so what keeps, wins</text>
<rect x="1037.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1095.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">fresh is early, not expensive</text>
<rect x="1037.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1095.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and it took eight purchases a month</text>
<rect x="477.0" y="390.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="535.0" y="409.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">+34 %, barely different</text>
</g>
</svg>
