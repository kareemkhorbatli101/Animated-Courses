<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
<title>One Thursday, four unreal pasts</title>
<desc>A branching diagram from one near miss into four counterfactual outcomes, each with its conditional form.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="720" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<circle cx="160" cy="360.0" r="12" fill="#1C2B33"/>
<text x="160" y="402.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">at 16.08...</text>
</g>
<g id="20_subject">
<path d="M 160 360.0 C 440.6 360.0 440.6 160.0 721.2 160.0" fill="none" stroke="#A8372E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,160.0 705.2,152.0 705.2,168.0" fill="#A8372E"/>
<path d="M 160 360.0 C 440.6 360.0 440.6 300.0 721.2 300.0" fill="none" stroke="#1F4E5F" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,300.0 705.2,292.0 705.2,308.0" fill="#1F4E5F"/>
<path d="M 160 360.0 C 440.6 360.0 440.6 440.0 721.2 440.0" fill="none" stroke="#C86B2B" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="721.2,440.0 705.2,432.0 705.2,448.0" fill="#C86B2B"/>
<path d="M 160 360.0 C 440.6 360.0 440.6 580.0 721.2 580.0" fill="none" stroke="#9AA7AE" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/>
<polygon points="721.2,580.0 705.2,572.0 705.2,588.0" fill="#9AA7AE"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One Thursday, four unreal pasts</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Every branch is the opposite of what happened. That is what the form is for.</text>
<text x="739.2" y="152.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#A8372E" text-anchor="start" font-weight="700" font-style="normal">IF HE HADN'T READ THE WRISTBAND</text>
<text x="739.2" y="178.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">she would have had twenty milligrams, and reversal</text>
<text x="739.2" y="195.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">is on the floor above</text>
<text x="739.2" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">HAD THE SCANNER BEEN WORKING</text>
<text x="739.2" y="318.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">it would have been stopped at the cupboard, forty</text>
<text x="739.2" y="335.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">minutes earlier</text>
<text x="739.2" y="432.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#C86B2B" text-anchor="start" font-weight="700" font-style="normal">IF ANYBODY HAD ACTED IN MARCH</text>
<text x="739.2" y="458.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">the cupboard would have been relabelled and we would</text>
<text x="739.2" y="475.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">not be here now</text>
<text x="739.2" y="572.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#9AA7AE" text-anchor="start" font-weight="700" font-style="normal">IF ONLY I HAD FILED THE THIRD ONE</text>
<text x="739.2" y="598.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">a regret, not a consequence - it would probably have</text>
<text x="739.2" y="615.4" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="start" font-weight="400" font-style="italic">changed nothing</text>
<rect x="160" y="602.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="629.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Everything in a third conditional is unreal. Both halves are the opposite of the facts. And</text>
<text x="184" y="651.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">would never appears in the if half.</text>
</g>
</svg>
