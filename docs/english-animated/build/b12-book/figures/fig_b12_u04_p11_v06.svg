<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>What a score of 31 actually predicts</title>
<desc>A bar chart of predicted deterioration rates by triage score band, with error bars of four points showing heavy overlap between adjacent bands.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
