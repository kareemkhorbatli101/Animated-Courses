<rect x="170" y="150" width="1180" height="440" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="590.0" x2="1350" y2="590.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="595.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="480.0" x2="1350" y2="480.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="485.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">25</text>
<line x1="170" y1="370.0" x2="1350" y2="370.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="375.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">50</text>
<line x1="170" y1="260.0" x2="1350" y2="260.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="265.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">75</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">100</text>
</g>
<g id="20_subject">
<rect x="203.71428571428572" y="453.6" width="75.85714285714286" height="136.39999999999998" rx="0" fill="#1F4E5F"/>
<rect x="439.7142857142857" y="396.4" width="75.85714285714286" height="193.60000000000002" rx="0" fill="#1F4E5F"/>
<rect x="675.7142857142857" y="334.8" width="75.85714285714286" height="255.2" rx="0" fill="#1F4E5F"/>
<rect x="911.7142857142857" y="277.6" width="75.85714285714286" height="312.4" rx="0" fill="#1F4E5F"/>
<rect x="1147.7142857142858" y="211.60000000000002" width="75.85714285714286" height="378.4" rx="0" fill="#1F4E5F"/>
<rect x="288.0" y="396.4" width="75.85714285714286" height="193.60000000000002" rx="0" fill="#9AA7AE"/>
<rect x="524.0" y="334.8" width="75.85714285714286" height="255.2" rx="0" fill="#9AA7AE"/>
<rect x="760.0" y="277.6" width="75.85714285714286" height="312.4" rx="0" fill="#9AA7AE"/>
<rect x="996.0" y="211.60000000000002" width="75.85714285714286" height="378.4" rx="0" fill="#9AA7AE"/>
<rect x="1232.0" y="176.40000000000003" width="75.85714285714286" height="413.59999999999997" rx="0" fill="#9AA7AE"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What a score of 31 actually predicts</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Deterioration within six hours, by score band, with the confidence interval drawn on.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">% who deteriorate in 6 h</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#9AA7AE"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the band this overlaps with</text>
<text x="288.0" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">25-27</text>
<text x="524.0" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">28-30</text>
<text x="760.0" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">31-33</text>
<text x="996.0" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">34-36</text>
<text x="1232.0" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">37-40</text>
<rect x="170" y="650" width="1180" height="38" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="675" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">The chart people quote is the solid line. The dashed line is the same data read at the top of the interval, and it is the reason page 4 exists.</text>
<text x="170" y="724.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">The confidence interval is four points, so every band overlaps the one above it. A 31 and a</text>
<text x="170" y="745.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">33 cannot be told apart by this instrument, and neither can two 31s.</text>
</g>
</svg>
