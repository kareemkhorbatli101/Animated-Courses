<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Modelled demand, and actual demand</title>
<desc>A line chart of projected waiting-list size at four per cent growth against the actual recorded figures, with the gap widening each year.</desc>
