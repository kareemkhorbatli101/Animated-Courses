<circle cx="642.0" cy="477.14" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="878.0" cy="441.83000000000004" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="1114.0" cy="405.09000000000003" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
<circle cx="1350.0" cy="366.91999999999996" r="5" fill="#FFFFFF" stroke="#D9A441" stroke-width="2.6"/>
