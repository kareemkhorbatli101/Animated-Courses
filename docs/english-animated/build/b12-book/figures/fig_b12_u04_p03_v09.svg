<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<title>Six levels, about the past</title>
<desc>A ladder of past deduction from must have at the top through might well have and unlikely to have down to cannot have at the bottom.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="760" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="606.0" y1="150.0" x2="674.0" y2="150.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="270.0" x2="674.0" y2="270.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="390.0" x2="674.0" y2="390.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="510.0" x2="674.0" y2="510.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="630.0" x2="674.0" y2="630.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="640.0" y1="130" x2="640.0" y2="650" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round"/>
</g>
<g id="20_subject">
<text x="698.0" y="156.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">There MUST HAVE BEEN two of them</text>
<text x="940.0" y="156.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">two pairs of gloves, and no other way for them to get there</text>
<text x="698.0" y="276.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">It's LIKELY TO HAVE BEEN a transfer</text>
<text x="940.0" y="276.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the commonest story that fits all six objects</text>
<text x="698.0" y="396.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">He MIGHT WELL HAVE been called away</text>
<text x="940.0" y="396.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">possible, and strengthened by the unused pack</text>
<text x="698.0" y="516.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">It's UNLIKELY TO HAVE BEEN an arrest</text>
<text x="940.0" y="516.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the crash trolley is sealed. Not impossible</text>
<text x="698.0" y="636.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">There CAN'T HAVE BEEN three</text>
<text x="940.0" y="636.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">the third pair is still sealed on the shelf</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Six levels, about the past</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Every rung has to be bought with a piece of evidence, and the price goes up as you climb.</text>
<text x="590.0" y="122" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="end" font-weight="700" font-style="normal">near certain, yes</text>
<text x="590.0" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="end" font-weight="700" font-style="normal">near certain, no</text>
<rect x="160" y="642.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="669.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The negative of must is can't. Mustn't means it is forbidden, which in a clinical note is an</text>
<text x="184" y="691.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">entirely different sentence.</text>
</g>
</svg>
