<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>The whole distribution, not the headline</title>
<desc>A bar chart of waiting times across the whole list showing a large group under six weeks and a long thin tail past a year.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="170" y="150" width="1180" height="440" rx="0" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="1.6"/>
<line x1="170" y1="590.0" x2="1350" y2="590.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="595.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="480.0" x2="1350" y2="480.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="485.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">1,125</text>
<line x1="170" y1="370.0" x2="1350" y2="370.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="375.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">2,250</text>
<line x1="170" y1="260.0" x2="1350" y2="260.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="265.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">3,375</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">4,500</text>
</g>
<g id="20_subject">
<rect x="213.7037037037037" y="187.15555555555557" width="98.33333333333333" height="402.84444444444443" rx="0" fill="#1F4E5F"/>
<rect x="410.3703703703703" y="377.04" width="98.33333333333333" height="212.95999999999998" rx="0" fill="#1F4E5F"/>
<rect x="607.037037037037" y="569.0755555555555" width="98.33333333333333" height="20.924444444444475" rx="0" fill="#1F4E5F"/>
<rect x="803.7037037037037" y="576.6044444444444" width="98.33333333333333" height="13.395555555555575" rx="0" fill="#1F4E5F"/>
<rect x="1000.3703703703703" y="576.6044444444444" width="98.33333333333333" height="13.395555555555575" rx="0" fill="#1F4E5F"/>
<rect x="1197.037037037037" y="585.0133333333333" width="98.33333333333333" height="4.986666666666679" rx="0" fill="#1F4E5F"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The whole distribution, not the headline</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six thousand seven hundred patients, by how long they waited.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">patients</text>
<text x="268.3333333333333" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">0-2 wk</text>
<text x="464.99999999999994" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">2-6 wk</text>
<text x="661.6666666666666" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6 wk-6 mo</text>
<text x="858.3333333333334" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">6-12 mo</text>
<text x="1055.0" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">1-2 yr</text>
<text x="1251.6666666666665" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">2 yr+</text>
<rect x="170" y="650" width="1180" height="38" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="675" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">The mean for the whole list is 19 days and the median is 11. Fifty-one people move the mean by about eight days, which is what a tail does to an average.</text>
<text x="170" y="724.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">The first two bars are the 94 per cent. The last four are 539 people, and the published</text>
<text x="170" y="745.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">figure describes none of them.</text>
</g>
</svg>
