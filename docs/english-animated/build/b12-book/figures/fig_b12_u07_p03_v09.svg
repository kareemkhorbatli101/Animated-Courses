<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680">
<title>Backwards, and forwards</title>
<desc>Two parallel sentences compared, one with stop plus -ing ending an activity and one with stop plus to naming a purpose.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="680" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="144" width="250.84210526315792" height="52" rx="5" fill="#C86B2B"/>
<text x="285.42105263157896" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I</text>
<rect x="416.8421052631579" y="144" width="379.2631578947369" height="52" rx="5" fill="#1F4E5F"/>
<text x="606.4736842105264" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">stopped</text>
<rect x="802.1052631578948" y="144" width="571.8947368421053" height="52" rx="5" fill="#2E6F5E"/>
<text x="1088.0526315789475" y="177" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">THINKING - the activity ended</text>
<rect x="160" y="344" width="250.84210526315792" height="52" rx="5" fill="#C86B2B"/>
<text x="285.42105263157896" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">I</text>
<rect x="416.8421052631579" y="344" width="379.2631578947369" height="52" rx="5" fill="#1F4E5F"/>
<text x="606.4736842105264" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">stopped</text>
<rect x="802.1052631578948" y="344" width="571.8947368421053" height="52" rx="5" fill="none" stroke="#9AA7AE" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1088.0526315789475" y="377" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="400" font-style="italic">TO THINK - I paused, in order to</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Backwards, and forwards</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The -ing form points at something already real. The to form points at a purpose.</text>
<text x="140" y="178" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">ACTIVE</text>
<text x="140" y="378" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="1.5">PASSIVE</text>
<text x="800.0" y="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">↕ same event, different first word</text>
<rect x="160" y="562.5" width="1280" height="77.5" rx="6" fill="#F3ECE0"/>
<text x="184" y="589.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">The pattern covers stop, remember, forget, go on and regret well, try and mean adequately,</text>
<text x="184" y="611.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">and need not at all. The eight verbs have to be learned.</text>
</g>
</svg>
