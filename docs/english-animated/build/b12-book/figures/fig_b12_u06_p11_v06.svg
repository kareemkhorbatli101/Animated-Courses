<text x="186" y="677.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Nothing in this chart records what happened to the 1,870 consultations that abandoned. That is not a</text>
<text x="186" y="698.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">gap in the data. It is the finding.</text>
<text x="170" y="751.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">The abandonment rate peaks at seventy per cent between ten and twelve, which is exactly when</text>
<text x="170" y="773.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">routine consents are taken.</text>
