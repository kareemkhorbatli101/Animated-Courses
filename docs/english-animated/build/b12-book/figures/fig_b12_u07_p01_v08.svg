<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>Why a habit holds</title>
<desc>A network of habit maintenance from a trigger through the act, the reward and the substitute, with willpower shown as a small and poorly connected node.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="170" y1="400" x2="520" y2="200" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="520" y1="200" x2="520" y2="600" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="520" y1="600" x2="170" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="170" y1="400" x2="900" y2="400" stroke="#9AA7AE" stroke-width="6" stroke-linecap="round"/>
<line x1="900" y1="400" x2="1260" y2="580" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="1260" y1="230" x2="1260" y2="580" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="170" cy="400" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="170" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="170" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The trigger</text>
<text x="170" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">a situation, not a craving</text>
<circle cx="520" cy="200" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="520" y="205" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="520" y="272" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The act</text>
<text x="520" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">eleven times a day</text>
<circle cx="520" cy="600" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="520" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="520" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The reward</text>
<text x="520" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and it is rarely the obvious one</text>
<circle cx="900" cy="400" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="900" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="900" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The substitute</text>
<text x="900" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">same trigger, different act</text>
<circle cx="1260" cy="230" r="50" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1260" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1260" y="306" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Willpower</text>
<text x="1260" y="326" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">explains nothing afterwards</text>
<circle cx="1260" cy="580" r="54" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="1260" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">6</text>
<text x="1260" y="660" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Relapse</text>
<text x="1260" y="680" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">or a slip. Nobody agrees</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Why a habit holds</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six nodes. Five of them are in the situation and one is in the person.</text>
<rect x="287.0" y="285.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="345.0" y="304.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">without noticing</text>
<rect x="462.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="520.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">going outside, not the cigarette</text>
<rect x="287.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="345.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and it strengthens the trigger</text>
<rect x="477.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="535.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">keep the trigger, change the act</text>
<rect x="1022.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1080.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">holds for about seven weeks</text>
<rect x="1202.0" y="390.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1260.0" y="409.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the explanation people reach for</text>
</g>
</svg>
