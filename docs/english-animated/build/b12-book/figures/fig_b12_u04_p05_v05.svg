<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<title>Two triage sheets, one bed</title>
<desc>Two triage assessment sheets side by side showing identical total scores with different component variables, arrival times and free-text notes.</desc>
