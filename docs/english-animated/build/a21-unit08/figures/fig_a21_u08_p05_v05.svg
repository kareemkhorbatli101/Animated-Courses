<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010">
<title>The inspection report</title>
<desc>A food safety inspection report with a grade, seven checked items, deadlines for the failures and a handwritten trader comment.</desc>
