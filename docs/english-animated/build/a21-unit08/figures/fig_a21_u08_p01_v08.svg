<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>A rule, and what becomes of it</title>
<desc>A network from an incident through a written rule, a sign, daily practice and inspection, with a dashed line showing the rule that quietly stops being followed.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="180" y1="400" x2="520" y2="230" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="520" y1="230" x2="520" y2="570" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="520" y1="570" x2="900" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="900" y1="400" x2="520" y2="230" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="520" y1="230" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="520" y1="570" x2="1290" y2="400" stroke="#9AA7AE" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
</g>
<g id="20_subject">
<circle cx="180" cy="400" r="46" fill="#FFFFFF" stroke="#A8372E" stroke-width="3"/>
<text x="180" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<text x="180" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Something happened</text>
<text x="180" y="492" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">usually once, badly</text>
<circle cx="520" cy="230" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="520" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<text x="520" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">A rule is written</text>
<text x="520" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">and a sign is printed</text>
<circle cx="520" cy="570" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="520" y="575" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<text x="520" y="642" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The ordinary day</text>
<text x="520" y="662" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">somebody moves a crate</text>
<circle cx="900" cy="400" r="54" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="900" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">4</text>
<text x="900" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">Inspection</text>
<text x="900" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">without warning</text>
<circle cx="1290" cy="400" r="54" fill="#FFFFFF" stroke="#9AA7AE" stroke-width="3"/>
<text x="1290" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#9AA7AE" text-anchor="middle" font-weight="700" font-style="normal">5</text>
<text x="1290" y="480" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">The reason</text>
<text x="1290" y="500" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">which nobody can now recall</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">A rule, and what becomes of it</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Five stages. Most rules die at stage three and nobody notices for six years.</text>
<rect x="292.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="350.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">so somebody writes it down</text>
<rect x="462.0" y="385.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="520.0" y="404.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">and it works, for a while</text>
<rect x="652.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="710.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">two or three metres later</text>
<rect x="652.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="710.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">written up, deadline given</text>
<rect x="847.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="905.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the reason is never on the sign</text>
<rect x="847.0" y="470.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="905.0" y="489.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">&quot;nobody has ever been ill&quot;</text>
</g>
</svg>
