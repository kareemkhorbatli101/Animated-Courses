<text x="840" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ˈ</text>
<text x="860" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">j</text>
<text x="880" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">u</text>
<text x="900" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ː</text>
<text x="920" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">s</text>
<text x="940" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">t</text>
<text x="960" y="408" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="190" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">not allowed to</text>
<text x="760" y="494" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">→</text>
<text x="840" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">n</text>
<text x="860" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ɒ</text>
<text x="880" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">t</text>
<text x="900" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="920" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ˈ</text>
<text x="940" y="494" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">l</text>
