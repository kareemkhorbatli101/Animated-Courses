<line x1="170" y1="174" x2="1430" y2="174" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="260" x2="1430" y2="260" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="346" x2="1430" y2="346" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="432" x2="1430" y2="432" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
<line x1="170" y1="518" x2="1430" y2="518" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
</g>
