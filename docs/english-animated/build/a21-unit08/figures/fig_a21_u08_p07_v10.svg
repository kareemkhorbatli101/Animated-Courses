<text x="1000" y="150" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">ə</text>
<text x="190" y="236" font-family="DejaVu Sans Mono, monospace" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="600" font-style="normal">have to</text>
