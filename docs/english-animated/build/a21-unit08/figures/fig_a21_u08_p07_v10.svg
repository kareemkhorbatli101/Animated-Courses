<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
<title>The phrase that lost a syllable</title>
<desc>Four phrases shown written and spoken, with the silent d in supposed to and used to and the f sound in have to.</desc>
