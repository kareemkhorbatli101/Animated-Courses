<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Two canteen menus, thirty-one years apart</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Typed in 1994 and laminated now, and only one of them has a cost note on it.</text>
<circle cx="934" cy="196.5" r="4.5" fill="#C86B2B"/>
