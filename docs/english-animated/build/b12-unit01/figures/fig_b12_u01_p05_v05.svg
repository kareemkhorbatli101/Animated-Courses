<text x="1040" y="289.8" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">second cheapest hot dish</text>
<circle cx="934" cy="375.0" r="4.5" fill="#C86B2B"/>
