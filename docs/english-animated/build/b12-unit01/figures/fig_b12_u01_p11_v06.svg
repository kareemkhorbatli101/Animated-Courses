<text x="156" y="595.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">0</text>
<line x1="170" y1="480.0" x2="1350" y2="480.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="485.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">8</text>
<line x1="170" y1="370.0" x2="1350" y2="370.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="375.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">15</text>
<line x1="170" y1="260.0" x2="1350" y2="260.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="265.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">22</text>
<line x1="170" y1="150.0" x2="1350" y2="150.0" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
<text x="156" y="155.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="end" font-weight="400" font-style="normal">30</text>
</g>
<g id="20_subject">
<rect x="212.14285714285714" y="428.6666666666667" width="94.82142857142858" height="161.33333333333331" rx="0" fill="#1F4E5F"/>
<rect x="507.14285714285717" y="590.0" width="94.82142857142858" height="0.0" rx="0" fill="#1F4E5F"/>
<rect x="802.1428571428571" y="267.33333333333337" width="94.82142857142858" height="322.66666666666663" rx="0" fill="#1F4E5F"/>
<rect x="1097.142857142857" y="590.0" width="94.82142857142858" height="0.0" rx="0" fill="#1F4E5F"/>
<rect x="317.50000000000006" y="296.6666666666667" width="94.82142857142858" height="293.3333333333333" rx="0" fill="#A8372E"/>
<rect x="612.5" y="296.6666666666667" width="94.82142857142858" height="293.3333333333333" rx="0" fill="#A8372E"/>
<rect x="907.5" y="487.3333333333333" width="94.82142857142858" height="102.66666666666669" rx="0" fill="#A8372E"/>
<rect x="1202.5" y="590.0" width="94.82142857142858" height="0.0" rx="0" fill="#A8372E"/>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">What each option saves, and who pays for it</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Three ways of closing a nineteen per cent gap on a canteen that feeds four hundred.</text>
<rect x="1390" y="170" width="18" height="18" rx="0" fill="#1F4E5F"/>
<text x="1416" y="185" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">% of budget saved</text>
<rect x="1390" y="204" width="18" height="18" rx="0" fill="#A8372E"/>
<text x="1416" y="219" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">people worse off (x0.05)</text>
<text x="317.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">processed line</text>
<text x="612.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">smaller portions</text>
<text x="907.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">close nights</text>
<text x="1202.5" y="618" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">do nothing</text>
<rect x="170" y="650" width="1180" height="38" rx="4" fill="#F7E7D6" stroke="#C86B2B" stroke-width="1.4"/>
<text x="186" y="675" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="start" font-weight="600" font-style="normal">Smaller portions save nothing on paper. They turned out to save thirty-one per cent of the waste, which nobody had modelled, because nobody weighs what goes in the bin.</text>
<text x="170" y="724.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Closing the night service saves twice as much as the processed line and affects a third as</text>
<text x="170" y="745.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">many people, which is exactly why it keeps being proposed.</text>
</g>
</svg>
