<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<title>Countable, uncountable, and what goes with each</title>
<desc>A four-panel strip pairing countable nouns with few and several and uncountable nouns with little and much.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="520" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<rect x="60.0" y="120" width="352.0" height="300" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<circle cx="86.0" cy="146" r="16" fill="#1F4E5F"/>
<text x="86.0" y="152" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">1</text>
<rect x="436.0" y="120" width="352.0" height="300" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<circle cx="462.0" cy="146" r="16" fill="#1F4E5F"/>
<text x="462.0" y="152" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">2</text>
<rect x="812.0" y="120" width="352.0" height="300" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<circle cx="838.0" cy="146" r="16" fill="#1F4E5F"/>
<text x="838.0" y="152" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">3</text>
<rect x="1188.0" y="120" width="352.0" height="300" rx="6" fill="#FFFFFF" stroke="#D8CFC2" stroke-width="2"/>
<circle cx="1214.0" cy="146" r="16" fill="#1F4E5F"/>
<text x="1214.0" y="152" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">4</text>
</g>
<g id="20_subject">
<line x1="80.0" y1="372" x2="392.0" y2="372" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="170.0" y="304" width="40" height="48" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="230.0" y="304" width="40" height="48" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<rect x="290.0" y="304" width="40" height="48" rx="0" fill="#1F4E5F" stroke="#1C2B33" stroke-width="1.6"/>
<text x="220.0" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="600" font-style="normal">few claims / several forms</text>
<line x1="456.0" y1="372" x2="768.0" y2="372" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<rect x="466.0" y="304" width="200" height="48" rx="0" fill="#C86B2B" stroke="#1C2B33" stroke-width="1.6"/>
<text x="596.0" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="600" font-style="normal">little money / much relief</text>
<line x1="832.0" y1="372" x2="1144.0" y2="372" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<path d="M 989.0 288 l 26 26 M 1015.0 288 l -26 26" fill="none" stroke="#A8372E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="972.0" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">plural, and you could count them</text>
<line x1="1208.0" y1="372" x2="1520.0" y2="372" stroke="#1C2B33" stroke-width="1.6" stroke-linecap="round" opacity="0.35"/>
<path d="M 1365.0 288 l 26 26 M 1391.0 288 l -26 26" fill="none" stroke="#A8372E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1348.0" y="192" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="middle" font-weight="600" font-style="normal">singular, and you cannot</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">Countable, uncountable, and what goes with each</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Four pairs. The quantifier changes and the noun stays where it is.</text>
<text x="70.0" y="448.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">FEW / SEVERAL - things you can count</text>
<text x="446.0" y="448.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">LITTLE / MUCH - things you cannot</text>
<text x="822.0" y="448.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">NONE OF THEM - the claims</text>
<text x="1198.0" y="448.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">NONE OF IT - the money</text>
<line x1="60" y1="484" x2="1540" y2="484" stroke="#9AA7AE" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="60" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="start" font-weight="400" font-style="normal">countable</text>
<text x="1540" y="510" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#9AA7AE" text-anchor="end" font-weight="400" font-style="normal">uncountable</text>
</g>
</svg>
