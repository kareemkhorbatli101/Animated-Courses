<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
<title>The strength dial</title>
<desc>A vertical ladder of hedged and boosted versions of one statement, from utterly unacceptable at the top to a distanced frame at the bottom.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="800" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="606.0" y1="150.0" x2="674.0" y2="150.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="254.0" x2="674.0" y2="254.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="358.0" x2="674.0" y2="358.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="462.0" x2="674.0" y2="462.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="566.0" x2="674.0" y2="566.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="606.0" y1="670.0" x2="674.0" y2="670.0" stroke="#1C2B33" stroke-width="2.4" stroke-linecap="round"/>
<line x1="640.0" y1="130" x2="640.0" y2="690" stroke="#9AA7AE" stroke-width="3" stroke-linecap="round"/>
</g>
<g id="20_subject">
<text x="698.0" y="156.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">utterly</text>
<text x="940.0" y="156.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">also without question - no room left to disagree</text>
<text x="698.0" y="260.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">markedly</text>
<text x="940.0" y="260.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">also by some margin - the figures must carry it</text>
<text x="698.0" y="364.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">considerably</text>
<text x="940.0" y="364.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">large, and defensible without being quoted</text>
<text x="698.0" y="468.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">rather</text>
<text x="940.0" y="468.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">up or down, and only the tune decides which</text>
<text x="698.0" y="572.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">somewhat</text>
<text x="940.0" y="572.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">also slightly - the claim shrinks, you still make it</text>
<text x="698.0" y="676.0" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#1F4E5F" text-anchor="start" font-weight="700" font-style="normal">it would seem</text>
<text x="940.0" y="676.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">full size, and you have stepped back from asserting it</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">The strength dial</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Six settings on one claim. The words change; the eight points do not.</text>
<text x="590.0" y="122" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="end" font-weight="700" font-style="normal">no room left</text>
<text x="590.0" y="706" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#A8372E" text-anchor="end" font-weight="700" font-style="normal">nothing asserted</text>
</g>
</svg>
