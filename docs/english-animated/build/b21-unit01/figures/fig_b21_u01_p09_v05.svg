<text x="410" y="440" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">four years of avoiding writing</text>
<text x="140" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;I can't understand films&quot;</text>
<text x="410" y="472" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no unscripted input at all</text>
<text x="140" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;My accent is the problem&quot;</text>
<text x="410" y="504" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">reduced speaking, raised anxiety</text>
<text x="140" y="536" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">&quot;I have a bad memory&quot;</text>
<text x="410" y="536" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">no system, because systems are for other people</text>
<line x1="130" y1="568" x2="910" y2="568" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="604" font-family="Inter, DejaVu Sans, sans-serif" font-size="22" fill="#1C2B33" text-anchor="start" font-weight="700" font-style="normal">CORROBORATION</text>
<text x="140" y="634" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Claims with a second source</text>
<text x="410" y="634" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0 of 4</text>
<text x="140" y="666" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Claims with a date</text>
<text x="410" y="666" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">3 of 4</text>
<text x="140" y="698" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="start" font-weight="400" font-style="normal">Claims tested in the last year</text>
<text x="410" y="698" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0 of 4</text>
<line x1="130" y1="730" x2="910" y2="730" stroke="#D8CFC2" stroke-width="1.4" stroke-linecap="round"/>
<text x="140" y="752.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">Every one of these would be held by a standards editor. All four</text>
<text x="140" y="773.75" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">have been running as settled fact for between two and six years,</text>
<text x="140" y="795.5" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">and each of them is doing more damage than the deficiency it</text>
<text x="140" y="817.25" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">describes.</text>
