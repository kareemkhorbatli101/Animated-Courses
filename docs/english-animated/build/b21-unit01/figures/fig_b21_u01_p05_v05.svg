<text x="1040" y="230.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">separate claims in them</text>
<circle cx="934" cy="358.0" r="4.5" fill="#C86B2B"/>
