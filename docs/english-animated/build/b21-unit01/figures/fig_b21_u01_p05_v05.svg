<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">The original ran at 15.52 on Tuesday. The correction ran on Friday, on page eleven.</text>
