<text x="656.6666666666667" y="393.5" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="normal">0</text>
<line x1="140" y1="403.5" x2="900" y2="403.5" stroke="#D8CFC2" stroke-width="1" stroke-linecap="round"/>
