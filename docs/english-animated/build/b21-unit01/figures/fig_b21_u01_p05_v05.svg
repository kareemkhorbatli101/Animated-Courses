<text x="1040" y="363.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">Is cutting against has confirmed -</text>
<text x="1040" y="383.3" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="start" font-weight="500" font-style="normal">the whole unit is in those two</text>
<circle cx="934" cy="426.0" r="4.5" fill="#C86B2B"/>
