<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
<title>Twenty minutes, two newspapers, one correction</title>
<desc>An infographic of the twenty minutes before the market close showing what each paper knew, what each published, the traffic each received, and the permanence of each piece of text.</desc>
