<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>The supplier's comparison sheet</title>
<desc>A supplier comparison sheet with two columns and eight rows, six favouring the synthetic cover, two rows left blank, and a green tick at the bottom of one column.</desc>
