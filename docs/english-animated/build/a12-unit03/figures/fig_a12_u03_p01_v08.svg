<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<title>One seat, five materials</title>
<desc>A seat at the centre joined by labelled lines to five materials - metal frame, wooden arm, plastic shell, cloth cover and foam - each line showing the cost and the lifetime of that part.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="780" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">
<line x1="340" y1="220" x2="800" y2="400" stroke="#9AA7AE" stroke-width="7" stroke-linecap="round"/>
<line x1="300" y1="580" x2="800" y2="400" stroke="#9AA7AE" stroke-width="4" stroke-linecap="round"/>
<line x1="800" y1="700" x2="800" y2="400" stroke="#9AA7AE" stroke-width="5" stroke-linecap="round"/>
<line x1="1280" y1="230" x2="800" y2="400" stroke="#C86B2B" stroke-width="6" stroke-linecap="round"/>
<line x1="1300" y1="600" x2="800" y2="400" stroke="#D9A441" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
</g>
<g id="20_subject">
<circle cx="800" cy="400" r="60" fill="#FFFFFF" stroke="#1C2B33" stroke-width="3"/>
<text x="800" y="405" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="middle" font-weight="700" font-style="normal">S</text>
<text x="800" y="486" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">one seat</text>
<text x="800" y="506" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">fourteen hundred of them</text>
<circle cx="340" cy="220" r="46" fill="#FFFFFF" stroke="#1F4E5F" stroke-width="3"/>
<text x="340" y="225" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">M</text>
<text x="340" y="292" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the metal frame</text>
<text x="340" y="312" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$96 · 30 years</text>
<circle cx="300" cy="580" r="46" fill="#FFFFFF" stroke="#8C6A9E" stroke-width="3"/>
<text x="300" y="585" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#8C6A9E" text-anchor="middle" font-weight="700" font-style="normal">W</text>
<text x="300" y="652" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the wooden arm</text>
<text x="300" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$22 · 20 years</text>
<circle cx="800" cy="700" r="46" fill="#FFFFFF" stroke="#2E6F5E" stroke-width="3"/>
<text x="800" y="705" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#2E6F5E" text-anchor="middle" font-weight="700" font-style="normal">P</text>
<text x="800" y="772" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the plastic shell</text>
<text x="800" y="792" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$34 · 12 years</text>
<circle cx="1280" cy="230" r="46" fill="#FFFFFF" stroke="#C86B2B" stroke-width="3"/>
<text x="1280" y="235" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#C86B2B" text-anchor="middle" font-weight="700" font-style="normal">C</text>
<text x="1280" y="302" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the cloth cover</text>
<text x="1280" y="322" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$41 · 7 years</text>
<circle cx="1300" cy="600" r="46" fill="#FFFFFF" stroke="#D9A441" stroke-width="3"/>
<text x="1300" y="605" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#D9A441" text-anchor="middle" font-weight="700" font-style="normal">F</text>
<text x="1300" y="672" font-family="Inter, DejaVu Sans, sans-serif" font-size="14" fill="#1C2B33" text-anchor="middle" font-weight="600" font-style="normal">the foam</text>
<text x="1300" y="692" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">$17 · 5 years</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">One seat, five materials</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Every line carries two numbers: what the part costs and how long it lasts.</text>
<rect x="512.0" y="295.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="570.0" y="314.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">it holds everything</text>
<rect x="492.0" y="475.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="550.0" y="494.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the only part people touch</text>
<rect x="742.0" y="535.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="800.0" y="554.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">it holds the shape</text>
<rect x="982.0" y="300.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1040.0" y="319.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the only part anybody sees</text>
<rect x="992.0" y="485.0" width="116" height="26" rx="12" fill="#FBF7F0"/>
<text x="1050.0" y="504.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="italic">the shortest life, and the cheapest</text>
</g>
</svg>
