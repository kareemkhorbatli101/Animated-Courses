<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<title>as … as, and not as … as</title>
<desc>Two sets of brackets drawn around pairs of objects, the first pair equal in height and the second with a shorter second bracket.</desc>
<g id="00_ground">
<rect x="0" y="0" width="1600" height="520" rx="0" fill="#FBF7F0"/>
</g>
<g id="10_context">

</g>
<g id="20_subject">
<rect x="160" y="196.0" width="141.24137931034483" height="68" rx="5" fill="#2E6F5E"/>
<text x="230.6206896551724" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">as</text>
<rect x="307.2413793103448" y="196.0" width="225.3793103448276" height="68" rx="5" fill="#1F4E5F"/>
<text x="419.9310344827586" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">strong</text>
<rect x="538.6206896551724" y="196.0" width="141.24137931034483" height="68" rx="5" fill="#2E6F5E"/>
<text x="609.2413793103449" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">as</text>
<rect x="685.8620689655172" y="196.0" width="225.3793103448276" height="68" rx="5" fill="#2E6F5E"/>
<text x="798.551724137931" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">cloth</text>
<rect x="917.2413793103448" y="196.0" width="183.31034482758622" height="68" rx="5" fill="#A8372E"/>
<text x="1008.8965517241379" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">NOT as</text>
<rect x="1106.551724137931" y="196.0" width="267.44827586206895" height="68" rx="5" fill="#A8372E"/>
<text x="1240.2758620689654" y="237.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal">good as cloth</text>
</g>
<g id="40_callouts">
<text x="800.0" y="46" font-family="Inter, DejaVu Sans, sans-serif" font-size="30" fill="#1F4E5F" text-anchor="middle" font-weight="700" font-style="normal">as … as, and not as … as</text>
<text x="800.0" y="72" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">Two brackets of the same height mean equal. A shorter second bracket means less.</text>
<text x="230.6206896551724" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">as</text>
<text x="419.9310344827586" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">the adjective, plain</text>
<text x="609.2413793103449" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">as</text>
<text x="798.551724137931" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">= equal</text>
<text x="1008.8965517241379" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">not as</text>
<text x="1240.2758620689654" y="292.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="12" fill="#55646D" text-anchor="middle" font-weight="400" font-style="normal">&lt; less</text>
<text x="160" y="338.0" font-family="Inter, DejaVu Sans, sans-serif" font-size="15" fill="#1C2B33" text-anchor="start" font-weight="400" font-style="italic">Two as-words, every time: as strong as, not as good as. One as on its own is not a comparison, and the adjective between them never takes -er.</text>
</g>
</svg>
