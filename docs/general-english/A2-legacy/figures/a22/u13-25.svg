<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="395" viewBox="0 0 1440 395"><rect width="1440" height="395" fill="#FFFFFF"/><rect x="74.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="250.1" y="111.6" width="50.6" height="46.0" rx="6.8999999999999995" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><rect x="303.0" y="123.1" width="18.4" height="23.0" rx="9.2" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><rect x="257.0" y="118.5" width="36.8" height="9.2" rx="3.4499999999999997" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><line x1="245.5" y1="164.5" x2="314.5" y2="164.5" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><text x="280.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">a pool</text><text x="280.0" y="288.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the lane: fast one side,</text><text x="280.0" y="320.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">slow the other</text><rect x="514.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="680.9" y="88.6" width="78.2" height="78.2" rx="5.75" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="694.7" y1="107.0" x2="745.3" y2="107.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="694.7" y1="125.4" x2="736.1" y2="125.4" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="694.7" y1="141.5" x2="745.3" y2="141.5" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="720.0" y1="166.8" x2="720.0" y2="187.5" stroke="#1F3864" stroke-width="6" stroke-linecap="round"/><text x="720.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">a cinema</text><text x="720.0" y="288.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the aisle seat, and whose</text><text x="720.0" y="320.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">knees move</text><rect x="954.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1109.4" y="109.3" width="101.2" height="50.6" rx="11.5" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><rect x="1118.6" y="118.5" width="34.5" height="20.7" rx="4.6" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="1164.6" y="118.5" width="34.5" height="20.7" rx="4.6" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><circle cx="1130.1" cy="162.2" r="11.5" fill="#1F3864" stroke="#1F3864" stroke-width="3"/><circle cx="1189.9" cy="162.2" r="11.5" fill="#1F3864" stroke="#1F3864" stroke-width="3"/><text x="1160.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">a night train</text><text x="1160.0" y="288.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the quiet carriage, nobody</text><text x="1160.0" y="320.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">wrote it down</text></svg>