<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="495" viewBox="0 0 1440 495"><rect width="1440" height="495" fill="#FFFFFF"/><rect x="60.0" y="27.5" width="600.0" height="95.0" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><text x="360.0" y="64.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">She said to tell you she can&#8217;t</text><text x="360.0" y="98.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">come.</text><line x1="700.0" y1="75.0" x2="776.0" y2="75.0" stroke="#009688" stroke-width="5" stroke-linecap="round"/><path d="M 770.0 64.0 L 790.0 75.0 L 770.0 86.0" fill="#009688" stroke="#009688" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830.0" y="27.5" width="550.0" height="95.0" rx="12" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><text x="1105.0" y="64.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">passing on a message you</text><text x="1105.0" y="98.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">were given</text><rect x="60.0" y="142.5" width="600.0" height="95.0" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><text x="360.0" y="196.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">Apparently there was a van.</text><line x1="700.0" y1="190.0" x2="776.0" y2="190.0" stroke="#009688" stroke-width="5" stroke-linecap="round"/><path d="M 770.0 179.0 L 790.0 190.0 L 770.0 201.0" fill="#009688" stroke="#009688" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830.0" y="142.5" width="550.0" height="95.0" rx="12" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><text x="1105.0" y="179.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">passing it on without standing</text><text x="1105.0" y="213.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">behind it</text><rect x="60.0" y="257.5" width="600.0" height="95.0" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><text x="360.0" y="311.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">Don&#8217;t say I told you.</text><line x1="700.0" y1="305.0" x2="776.0" y2="305.0" stroke="#009688" stroke-width="5" stroke-linecap="round"/><path d="M 770.0 294.0 L 790.0 305.0 L 770.0 316.0" fill="#009688" stroke="#009688" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830.0" y="257.5" width="550.0" height="95.0" rx="12" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><text x="1105.0" y="311.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">asking to be left out of it</text><rect x="60.0" y="372.5" width="600.0" height="95.0" rx="12" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><text x="360.0" y="426.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">I&#8217;ll ask her and let you know.</text><line x1="700.0" y1="420.0" x2="776.0" y2="420.0" stroke="#009688" stroke-width="5" stroke-linecap="round"/><path d="M 770.0 409.0 L 790.0 420.0 L 770.0 431.0" fill="#009688" stroke="#009688" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830.0" y="372.5" width="550.0" height="95.0" rx="12" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><text x="1105.0" y="409.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">refusing to guess, and</text><text x="1105.0" y="443.0" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="middle">promising to find out</text></svg>