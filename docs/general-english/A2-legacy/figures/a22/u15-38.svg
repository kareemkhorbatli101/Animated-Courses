<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="621" viewBox="0 0 1440 621"><rect width="1440" height="621" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Everybody says yes to a plan and nobody picks a day?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="360.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="221.3" y="276.0" width="80.0" height="72.0" rx="5.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="221.3" y="276.0" width="80.0" height="18.0" rx="5.0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><line x1="239.3" y1="268.0" x2="239.3" y2="282.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="283.3" y1="268.0" x2="283.3" y2="282.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><rect x="231.3" y="302.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="249.3" y="302.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="267.3" y="302.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="285.3" y="302.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="231.3" y="320.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="249.3" y="320.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="267.3" y="320.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><rect x="285.3" y="320.0" width="12.0" height="12.0" rx="2.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="2"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Pick a day yourself</text><text x="261.3" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">a plan with no date is</text><text x="261.3" y="485.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">not a plan</text><text x="261.3" y="528.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">somebody has to say no</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="360.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="720.0" cy="308.0" r="34.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 707.0 298.0 Q 707.0 282.0 720.0 282.0 Q 734.0 282.0 734.0 297.0 Q 734.0 307.0 720.0 313.0 L 720.0 321.0" fill="none" stroke="#1F3864" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720.0" cy="332.0" r="5.0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Ask once more</text><text x="720.0" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">nobody has to decide</text><text x="720.0" y="498.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you get another yes</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="360.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-wi