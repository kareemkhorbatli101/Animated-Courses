<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect width="1440" height="700" fill="#FFFFFF"/><rect x="70.0" y="33.0" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="33.0" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="116.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="116.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what and when</text><text x="670.0" y="114.5" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">Good morning.</text><rect x="70.0" y="196.0" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="196.0" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="279.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="279.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what went wrong</text><text x="670.0" y="262.5" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I bought a pair of boots from you three</text><text x="670.0" y="292.5" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">weeks.</text><rect x="70.0" y="359.0" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="359.0" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="442.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">3</text><text x="190.0" y="442.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what you want</text><text x="670.0" y="440.5" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I have the receipt and I can bring them.</text><rect x="70.0" y="522.0" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="522.0" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="605.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">4</text><text x="190.0" y="605.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">a reasonable tone</text><text x="670.0" y="603.5" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I am not asking for very much &#8212; a repair.</text></svg>