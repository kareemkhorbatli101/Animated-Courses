2088.3" y="1746.6" width="37.2" height="27.9" rx="3.1" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="1976.7" y1="1858.2" x2="2119.3" y2="1858.2" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="190.0" y1="2080.0" x2="2290.0" y2="2080.0" stroke="#AEB6C2" stroke-width="5" stroke-linecap="round"/><text x="190.0" y="2210.0" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#1F3864" text-anchor="start">By the end of this unit you can</text><rect x="196.0" y="2332.0" width="56.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#009688" stroke-width="7"/><text x="310.0" y="2380.0" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#1F3864" text-anchor="start">I can say what I was doing when something interrupted me.</text><rect x="196.0" y="2462.0" width="56.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#009688" stroke-width="7"/><text x="310.0" y="2510.0" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#1F3864" text-anchor="start">I can use while and when to join a long action and a short</text><text x="310.0" y="2576.0" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#1F3864" text-anchor="start">one.</text><rect x="196.0" y="2658.0" width="56.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#009688" stroke-width="7"/><text x="310.0" y="2706.0" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#1F3864" text-anchor="start">I can tell the story of twenty minutes in 90–110 words.</text><line x1="190.0" y1="3078.0" x2="2290.0" y2="3078.0" stroke="#AEB6C2" stroke-width="5" stroke-linecap="round"/><text x="190.0" y="3178.0" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#1F3864" text-anchor="start">Core track: Warm Up and Parts 1 to 6</text><text x="190.0" y="3258.0" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#1F3864" text-anchor="start">Plus track: Parts 7 to 10, optional</text><rect x="0.0" y="3418.0" width="2480.0" height="90.0" rx="0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/></svg>