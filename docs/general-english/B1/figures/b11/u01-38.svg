<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="687" viewBox="0 0 1440 687"><rect width="1440" height="687" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">There is sixty-one pounds. What does the building buy?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="426.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="215.3" y="334.0" width="24.0" height="18.0" rx="2.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="239.3" y="316.0" width="24.0" height="18.0" rx="2.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="263.3" y="298.0" width="24.0" height="18.0" rx="2.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="287.3" y="280.0" width="24.0" height="18.0" rx="2.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="215.3" y1="352.0" x2="307.3" y2="352.0" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">The staircase light,</text><text x="261.3" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">ninety pounds</text><text x="261.3" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the dangerous part is lit</text><text x="261.3" y="534.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">next autumn before</text><text x="261.3" y="565.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">anything else</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="426.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><path d="M 696.0 302.0 L 708.0 274.0 L 732.0 274.0 L 744.0 302.0 Z" fill="#C79A5C" stroke="#1F3864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720.0" cy="312.0" r="11.0" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><line x1="720.0" y1="322.0" x2="720.0" y2="344.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="706.0" y1="344.0" x2="734.0" y2="344.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">A box of lamps,</text><text x="720.0" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">twenty-two pounds</text><text x="720.0" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">something arrives this</text><text x="720.0" y="521.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">week</text><text x="720.0" y="564.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">a lamp in the dark is</text><text x="720.0" y="595.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">hard to find</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="426.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1140.7" y="266.0" width="76.0" height="84.0" rx="5.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="1150.7" y="278.0" width="12.0" height="12.0" rx="2.0" fill="#FFFFFF" stroke="#009688" stroke-width="3"/><line x1="1168.7" y1="284.0" x2="1206.7" y2="284.0" stroke="#6E88AC" stroke-width="4" stroke-linecap="round"/><rect x="1150.7" y="300.0" width="12.0" height="12.0" rx="2.0" fill="#FFFFFF" stroke="#009688" stroke-width="3"/><line x1="1168.7" y1="306.0" x2="1206.7" y2="306.0" stroke="#6E88AC" stroke-width="4" stroke-linecap="round"/><rect x="1150.7" y="322.0" width="12.0" height="12.0" rx="2.0" fill="#FFFFFF" stroke="#009688" stroke-width="3"/><line x1="1168.7" y1="328.0" x2="1206.7" y2="328.0" stroke="#6E88AC" stroke-width="4" stroke-linecap="round"/><text x="1178.7" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Spend nothing, write</text><text x="1178.7" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">the plan</text><text x="1178.7" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">somebody checks the</text><text x="1178.7" y="521.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">cupboard</text><text x="1178.7" y="564.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">a plan does not light a</text><text x="1178.7" y="595.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">staircase</text></svg>