<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440"><rect width="1440" height="440" fill="#FFFFFF"/><rect x="60.0" y="24.8" width="610.0" height="390.0" rx="18" fill="#FFFFFF" stroke="#AEB6C2" stroke-width="3"/><text x="365.0" y="92.8" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#1F3864" text-anchor="middle">Thursday &#8212; the letter</text><rect x="318.8" y="172.2" width="92.4" height="57.2" rx="3.3000000000000003" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><path d="M 318.8 172.2 L 365.0 205.2 L 411.2 172.2" fill="none" stroke="#1F3864" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="387.0" y="176.6" width="19.8" height="15.4" rx="2.2" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><text x="365.0" y="302.8" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#1F3864" text-anchor="middle">a letter on the fridge</text><text x="365.0" y="348.8" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#1F3864" text-anchor="middle">the street named on it</text><text x="365.0" y="394.8" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#1F3864" text-anchor="middle">no hours given at all</text><rect x="800.0" y="24.8" width="610.0" height="390.0" rx="18" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><text x="1105.0" y="92.8" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#1F3864" text-anchor="middle">Saturday &#8212; the filming</text><rect x="1058.8" y="176.6" width="92.4" height="55.0" rx="6.6000000000000005" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="1085.2" y="163.4" width="33.0" height="13.2" rx="3.3000000000000003" fill="#1F3864" stroke="#1F3864" stroke-width="3"/><circle cx="1100.6" cy="204.1" r="20.9" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><circle cx="1100.6" cy="204.1" r="11.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="0"/><circle cx="1133.6" cy="187.6" r="5.5" fill="#A97