<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="508" viewBox="0 0 1440 508"><rect width="1440" height="508" fill="#FFFFFF"/><rect x="60.0" y="29.2" width="620.0" height="450.0" rx="20" fill="#FFFFFF" stroke="#1F3864" stroke-width="4"/><rect x="60.0" y="29.2" width="620.0" height="80.0" rx="20" fill="#1F3864" stroke="none" stroke-width="0"/><text x="370.0" y="67.2" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Card A &#8212; you made the</text><text x="370.0" y="105.2" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">telephone call</text><rect x="569.3" y="144.4" width="37.4" height="65.5" rx="6.24" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="574.7" y="150.7" width="26.5" height="45.2" rx="2.34" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><line x1="582.5" y1="202.2" x2="593.5" y2="202.2" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><circle cx="104.0" cy="161.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="138.0" y="169.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">the job number you</text><text x="138.0" y="203.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">were given</text><circle cx="104.0" cy="247.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="138.0" y="255.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">Tuesday morning, not</text><text x="138.0" y="289.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">before</text><circle cx="104.0" cy="333.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="138.0" y="341.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">the charge goes to</text><text x="138.0" y="375.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">number 40</text><circle cx="104.0" cy="419.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="138.0" y="427.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">admit the one thing you</text><text x="138.0" y="461.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">got wrong</text><rect x="760.0" y="29.2" width="620.0" height="450.0" rx="20" fill="#FFFFFF" stroke="#1F3864" stroke-width="4"/><rect x="760.0" y="29.2" width="620.0" height="80.0" rx="20" fill="#1F3864" stroke="none" stroke-width="0"/><text x="1070.0" y="73.2" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Card B &#8212; you waited all day</text><circle cx="1288.0" cy="177.2" r="28.1" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="1288.0" y1="177.2" x2="1288.0" y2="160.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="1288.0" y1="177.2" x2="1300.5" y2="183.4" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><circle cx="804.0" cy="161.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="838.0" y="169.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">ask about the delivery</text><circle cx="804.0" cy="217.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="838.0" y="225.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">ask what the depot</text><text x="838.0" y="259.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">actually said</text><circle cx="804.0" cy="303.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="838.0" y="311.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">ask what happens on</text><text x="838.0" y="345.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">Tuesday</text><circle cx="804.0" cy="389.2" r="9.0" fill="#009688" stroke="#1F3864" stroke-width="0"/><text x="838.0" y="397.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">be annoyed, not</text><text x="838.0" y="431.2" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">unreasonable</text></svg>