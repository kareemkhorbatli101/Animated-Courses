<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="349" viewBox="0 0 1440 349"><rect width="1440" height="349" fill="#FFFFFF"/><rect x="70.0" y="20.3" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="20.3" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="103.8" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="103.8" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what you planned</text><text x="670.0" y="86.8" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I had four hours and a short list of three</text><text x="670.0" y="116.8" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">things.</text><rect x="70.0" y="183.3" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="183.3" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="266.8" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="266.8" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what took the time</text><text x="670.0" y="249.8" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">A delivery slot I did not choose ran until</text><text x="670.0" y="279.8" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">three.</text></svg>