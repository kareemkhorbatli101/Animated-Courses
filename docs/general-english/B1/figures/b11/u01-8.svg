<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="573" viewBox="0 0 1440 573"><rect width="1440" height="573" fill="#FFFFFF"/><rect x="60.0" y="31.4" width="620.0" height="510.0" rx="18" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="60.0" y="31.4" width="620.0" height="76.0" rx="18" fill="#1F3864" stroke="none" stroke-width="0"/><text x="370.0" y="83.4" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The van arrived.</text><text x="370.0" y="161.4" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">past simple &#8212; finished</text><line x1="104.0" y1="291.4" x2="636.0" y2="291.4" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><circle cx="284.9" cy="291.4" r="13.0" fill="#C79A5C" stroke="#1F3864" stroke-width="3"/><text x="370.0" y="343.4" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1F3864" text-anchor="middle">now</text><text x="370.0" y="411.4" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">One moment, and it was over.</text><rect x="760.0" y="31.4" width="620.0" height="510.0" rx="18" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="760.0" y="31.4" width="620.0" height="76.0" rx="18" fill="#1F3864" stroke="none" stroke-width="0"/><text x="1070.0" y="83.4" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Amina was waiting.</text><text x="1070.0" y="161.4" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">past continuous &#8212; going on</text><line x1="804.0" y1="291.4" x2="1336.0" y2="291.4" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><circle cx="889.1" cy="291.4" r="13.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><circle cx="942.3" cy="291.4" r="13.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><circle cx="995.5" cy="291.4" r="13.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><text x="1070.0" y="343.4" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1F3864" text-anchor="middle">now</text><text x="1070.0" y="411.4" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">She was in the middle of it.</text></svg>