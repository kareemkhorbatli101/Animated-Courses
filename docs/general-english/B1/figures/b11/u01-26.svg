<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="411" viewBox="0 0 1440 411"><rect width="1440" height="411" fill="#FFFFFF"/><rect x="60.0" y="23.4" width="1320.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="37.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="63.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can say what I was doing when something happened</text><rect x="60.0" y="99.3" width="1320.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="113.3" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="139.3" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can use while and when in one sentence</text><rect x="60.0" y="175.3" width="1320.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="189.3" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="215.3" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can talk about deliveries and street problems</text><rect x="60.0" y="251.3" width="1320.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="265.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="291.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can ring a company and ask for a job number</text><rect x="60.0" y="327.4" width="1320.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="341.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="367.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can write a short note for a noticeboard</text></svg>