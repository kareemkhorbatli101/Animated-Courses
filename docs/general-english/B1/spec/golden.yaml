  level_of_source: B2
  measured_on: 2026-10-09
  # what the measurement found
  total_words: 5899
  exercises: 59
  figures: 28
  sentences: 264
  mean_sentence: 9.94
  median_sentence: 9.0
  max_sentence: 26
  syllables_per_word: 1.268
