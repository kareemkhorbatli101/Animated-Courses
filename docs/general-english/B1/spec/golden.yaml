# The frozen architecture for B1. GENERATED from ../A2/spec/golden.yaml
# by tools/make_b1_spec.py -- do not hand-edit: re-run the generator so
# the structural parity with A2 stays a diff rather than a promise.
schema_version: 1
# B1 has NO source coursebook. A2's spec was measured out of one; there is no
# B1 equivalent in the repository and none was supplied, which 00-MASTER-PLAN.md
# section 1 calls Route B. So this spec declares its own derivation instead of
# claiming a measurement it does not have: the architecture is A2's, held
# constant and generated by tools/make_b1_spec.py; every length is re-derived
# from the specific B1 task that drives it (section 3.3 of the plan) against
# the A2 book's own measured lengths (section 2c); the level bounds come from
# the CEFR-J profiles. Every length here is a FORECAST until the Phase 4 gate
# measures Unit 1 and replaces it.
source:
  file: null
  derivation: tools/make_b1_spec.py from ../A2/spec/golden.yaml
  architecture_from: A2 (generated, not re-typed)
  lengths_from: 00-MASTER-PLAN.md section 3.3 (forecast, re-locked at Phase 4)
  level_from: CEFR-J Vocabulary Profile 1.5 + Grammar Profile 20180315
  derived_on: 2026-10-09

unit:
  bold_headings: 110
  subsections: 42
  # Prose, captions excluded. 6,201 is the sum of the eleven part targets in
  # section 3.3 of the plan, each one derived from the measured A2 length of
  # the specific text inside it. The band is +/- 6%, as A2's was.
  words: {target: 6201, min: 5830, max: 6575}
  source_words: null
  figures: 41
  # Figure captions are apparatus, not prose. K11 measures `words` minus these
  # against the unchanged source-derived budget; G27 bounds these on their own.
  # Measured 2026-10-08 at 14 figures a unit: 184-203 words. The allowance
  # moves with the figure count, as the page envelope does.
  caption_words: {target: 560, min: 480, max: 625}
  # 41 figures at the same 13.6 words a caption. Measured on Unit 1 once the
  # dense layout was built, not forecast: G27 reads this for a dense unit and
  # `caption_words` above for every other.
  caption_words_dense: {target: 560, min: 480, max: 625}
  audio_tracks: 5
  glossary_words: 10
  can_do_lines: 5
  writing_tasks: 5

title_pattern: '^\*\*Unit (\d+): (.+)\*\*$'
strap_pattern: '^\*English for Daily Life · Level: B1 · Tracks: \[CORE\] Warm-Up \+ Parts 1–6 · \[PLUS\] Parts 7–10\*$'

track_labels:
  permitted:
    - '[CORE] Core track · in-class starter'
    - '[CORE] Core track · pre-class input'
    - '[CORE] Core track · pre-class input · scripts printed inline'
    - '[CORE] Core track · in-class output'
    - '[CORE] Core track · in-class / homework'
    - '[PLUS] Plus track (optional) · stronger learners'
    - '[PLUS] Plus track · pre-read / discuss'
    - '[PLUS] Plus track · pre-read / decide'
    - '[CORE + PLUS] · homework / self-study'

# The 42 sub-sections, in order. `id` is stable; `heading` is a regex.
# `kind` drives the exercise-integrity checks.
sections:
  - {part: 'Warm Up', header: '**Warm Up**', track: '[CORE] Core track · in-class starter', subs: [
      {id: w1, kind: matching,   heading: '^\*\*Warm-up: .+\*\*$'},
      {id: w2, kind: gapfill,    heading: '^\*\*Warm-up: .+\*\*$'},
      {id: w3, kind: fig_mcq,    heading: '^\*\*Warm-up: .+\*\*$', figure: 4}]}
  - {part: 'Part 1', header: '**Part 1 · Vocabulary and Terminology**', track: '[CORE] Core track · pre-class input', subs: [
      {id: p1a, kind: matching,    heading: '^\*\*Part 1: .+\*\*$', seeded: true, standalone_seed: true},
      {id: p1b, kind: pronunciation, heading: '^\*\*Part 1: Pronunciation\*\*$', track_audio: 1},
      {id: p1c, kind: table_fill,  heading: '^\*\*Part 1: .+\*\*$', figure: 1, seeded: true},
      {id: p1d, kind: matching,    heading: '^\*\*Part 1: .+\*\*$', figure: 2},
      {id: p1e, kind: mcq,         heading: '^\*\*Part 1: .+\*\*$', items: 3},
      {id: p1f, kind: gapfill,     heading: '^\*\*Part 1: .+\*\*$', gaps: 4},
      {id: p1g, kind: short_write, heading: '^\*\*Part 1: .+\*\*$', model: true}]}
  - {part: 'Part 2', header: '**Part 2 · Grammar — .+**', track: '[CORE] Core track · pre-class input', subs: [
      {id: p2a, kind: notice,       heading: '^\*\*Part 2: Notice\*\*$'},
      {id: p2b, kind: focus_box,    heading: '^\*\*Part 2: Grammar Focus Box\*\*$'},
      {id: p2c, kind: gapfill,      heading: '^\*\*Part 2: Controlled Practice\*\*$', gaps: 4, seeded: true},
      {id: p2d, kind: gapfill,      heading: '^\*\*Part 2: .+\*\*$', gaps: 4, seeded: true},
      {id: p2e, kind: correct_sent, heading: '^\*\*Part 2: Correct the Sentence\*\*$', items: 4},
      {id: p2f, kind: freer,        heading: '^\*\*Part 2: Freer Practice\*\*$'},
      {id: p2g, kind: mcq,          heading: '^\*\*Part 2: Grammar Review\*\*$', items: 2, harvest: true}]}
  - {part: 'Part 3', header: '**Part 3 · Listening**', track: '[CORE] Core track · pre-class input · scripts printed inline', subs: [
      {id: p3a, kind: script_tfng,  heading: '^\*\*Part 3: .+\*\*$', track_audio: 2, items: 3, seeded: true},
      {id: p3b, kind: script_qa,    heading: '^\*\*Part 3: .+\*\*$', track_audio: 3, items: 3, seeded: true},
      {id: p3c, kind: script_match, heading: '^\*\*Part 3: .+\*\*$', track_audio: 4, seeded: true}]}
  - {part: 'Part 4', header: '**Part 4 · Speaking**', track: '[CORE] Core track · in-class output', subs: [
      {id: p4a, kind: discuss,    heading: '^\*\*Part 4: .+\*\*$'},
      {id: p4b, kind: infogap,    heading: '^\*\*Part 4: Find the Difference \(pairwork\)\*\*$'},
      {id: p4c, kind: roleplay,   heading: '^\*\*Part 4: .+\*\*$'},
      {id: p4d, kind: presentation, heading: '^\*\*Part 4: Mini-Presentation\*\*$'}]}
  - {part: 'Part 5', header: '**Part 5 · Reading**', track: '[CORE] Core track · pre-class input', subs: [
      {id: p5a, kind: text_mcq,   heading: '^\*\*Part 5: .+\*\*$', figure: 3, items: 3, seeded: true},
      {id: p5b, kind: matching,   heading: '^\*\*Part 5: Vocabulary in Context\*\*$'},
      {id: p5c, kind: text_qa,    heading: '^\*\*Part 5: .+\*\*$', items: 3, seeded: true}]}
  - {part: 'Part 6', header: '**Part 6 · Writing**', track: '[CORE] Core track · in-class / homework', subs: [
      {id: p6a, kind: writing, heading: '^\*\*Part 6: .+\(90–110 words\)\*\*$', words: [90,110], model: true, plan: true},
      {id: p6b, kind: writing, heading: '^\*\*Part 6: .+\(90–110 words\)\*\*$', words: [90,110], model: true},
      {id: p6c, kind: writing, heading: '^\*\*Part 6: .+\(90–110 words\)\*\*$', words: [90,110], model: true, plan: true},
      {id: p6d, kind: writing, heading: '^\*\*Part 6: Reflection — .+\(80–100 words\)\*\*$', words: [80,100], model: true}]}
  - {part: 'Part 7', header: '**Part 7 · Real-World File — .+**', track: '[PLUS] Plus track (optional) · stronger learners', subs: [
      {id: p7a, kind: matching,  heading: '^\*\*7A: Phrase Bank\*\*$'},
      {id: p7b, kind: script_qa, heading: '^\*\*7B: .+\*\*$', track_audio: 5, items: 3, seeded: true},
      {id: p7c, kind: ordering,  heading: '^\*\*7C: .+\*\*$', steps: 5, seeded: true},
      {id: p7d, kind: roleplay,  heading: '^\*\*7D: .+\*\*$'},
      {id: p7e, kind: writing,   heading: '^\*\*7E: .+\(100–120 words\)\*\*$', words: [100,120], model: true}]}
  - {part: 'Part 8', header: '**Part 8 · Global Story — .+**', track: '[PLUS] Plus track · pre-read / discuss', leading: {id: p8a, kind: text_qa, items: 3, seeded: true}, subs: [
      {id: p8b, kind: matching, heading: '^\*\*Part 8: Vocabulary in Context\*\*$'},
      {id: p8c, kind: discuss,  heading: '^\*\*Part 8: Discussion\*\*$', frames: true}]}
  - {part: 'Part 9', header: '**Part 9 · Close to Home — .+**', track: '[PLUS] Plus track · pre-read / decide', leading: {id: p9a, kind: text_qa, items: 3, seeded: true}, subs: [
      {id: p9b, kind: decision, heading: '^\*\*Part 9: Decision Task\*\*$', options: 3, model: true}]}
  - {part: 'Part 10', header: '**Part 10 · Review and Can-Do**', track: '[CORE + PLUS] · homework / self-study', subs: [
      {id: p10a, kind: gapfill, heading: '^\*\*Part 10: Spiral Review\*\*$', gaps: 8, seeded: true},
      {id: p10b, kind: cando,   heading: '^\*\*Part 10: Can-Do\*\*$', lines: 5},
      {id: p10c, kind: glossary,heading: '^\*\*Part 10: Glossary\*\*$', words: 10}]}

# Exact counts, per unit.
devices:
  seeded_zero:        {exact: 14, pattern: '^0\. '}
  not_needed:         {exact: 7,  pattern: 'is not needed'}
  model_read_first:   {exact: 7,  pattern: '\*\*Model — read this first:\*\*'}
  before_you_read:    {exact: 5,  pattern: 'Before you read:'}
  check_before:       {exact: 5,  pattern: '\*\*Check before you finish:\*\*'}
  useful_language:    {exact: 5,  pattern: 'Useful (language|phrases|questions):'}
  word_bank:          {min: 4, max: 5, pattern: '\*\*Word bank:\*\*'}
  # Source Gloss blocks carry 2 or 3 items (measured: 25 threes, 15 twos).
  # We allow up to 5 because E02 enforces a lexical band the source never
  # enforced on itself, so some blocks must carry a fourth or fifth word.
  # Recorded as a departure, not a defect; B10 caps it so it cannot drift.
  gloss:              {exact: 4,  pattern: '\*\*Gloss:\*\*', items_min: 2, items_max: 5}
  before_you_listen:  {exact: 3,  pattern: 'Before you listen:'}
  model_exchange:     {exact: 2,  pattern: 'Model exchange:'}
  stretch:            {exact: 2,  pattern: '\*Stretch \[PLUS\]:'}
  remember:           {exact: 1,  pattern: '\*\*Remember:\*\*'}
  watch_out:          {exact: 1,  pattern: '\*\*Watch out!\*\*'}
  harvest:            {exact: 1,  pattern: '→ Harvest:'}
  answer_frame:       {exact: 1,  pattern: 'Answer frame:'}
  phrase_bank:        {exact: 1,  pattern: '7A: Phrase Bank'}
  discussion_frames:  {exact: 1,  pattern: 'Discussion frames:'}
  plan_frame:         {min: 1, max: 2, pattern: '\*\*Plan \(fill in, then write\):\*\*'}
  pronunciation:      {exact: 1,  pattern: '\*\*Part 1: Pronunciation\*\*'}

# Per-part word budgets, measured across all ten source units, then adjusted
# for the one declared departure that changes length: the source's seven
# `Model — read this first:` headers are EMPTY (defect D2). Filling them adds
# prose the source does not carry, so each affected part's envelope is widened
# by its own model allowance. `source_*` keeps the raw measurement visible, so
# check K05 can still diff against the book as it actually is.
# PROSE budgets. Re-based once, 2026-10-08, when K11 moved from measuring
# total words to measuring prose -- see model.Unit.prose_words. Each part's
# the band is shifted DOWN by the part's caption load, two-sided because that
# load varies per unit: `max` drops by `caption_shift` (the minimum load the
# part ever carries) and `min` drops by caption_shift + `caption_spread`
# (the maximum). Any other rule squeezes one end: shifting both by the mean
# pushed four units over Part 2's max, shifting both by the minimum pushed
# three under Warm Up's and Part 8's min, in each case by two or three words
# of pure apparatus noise. The band widens by the spread alone -- 48 words
# across an ~5,000-word unit, under 1% -- and admits exactly the totals the
# old band admitted, whatever a unit's captions happen to weigh. The SPAN of every band is unchanged, so this is a
# change of basis and not a loosening: the same prose density is asked for,
# counted without the apparatus. `source_target` is untouched and is still the
# raw measurement from the source book, its own captions included.
word_budget:
  # Section 3.3 of 00-MASTER-PLAN.md. Each target is A2's measured part total
  # plus the measured growth of the one text inside it that B1 changes, and
  # nothing else moves. `a2_target` keeps A2's number visible so the step is
  # auditable; `driver` names the text that caused it. Bands are +/- 9%, as
  # A2's were before they were re-based on measurement; Phase 4 narrows them.
  'Warm Up': {target: 366, min: 333, max: 399,  a2_target: 310, driver: 'warm-up reading 86 -> 150'}
  'Part 1':  {target: 715, min: 651, max: 779,  a2_target: 610, driver: 'short writing model 45 -> 80, longer gloss and pronunciation'}
  'Part 2':  {target: 560, min: 510, max: 610,  a2_target: 442, driver: 'Notice text 61 -> 110, two-way contrast'}
  'Part 3':  {target: 820, min: 746, max: 894,  a2_target: 487, driver: 'three scripts 72/74/83 -> 200/150/220'}
  'Part 4':  {target: 421, min: 383, max: 459,  a2_target: 313, driver: 'scenario 125 -> 180, cards 63 -> 100'}
  'Part 5':  {target: 845, min: 769, max: 921,  a2_target: 562, driver: 'two readings 130/109 -> 300/220'}
  'Part 6':  {target: 624, min: 568, max: 680,  a2_target: 492, driver: 'four models 62/59/59/52 -> 105/100/100/90'}
  'Part 7':  {target: 652, min: 593, max: 711,  a2_target: 531, driver: '7B script 104 -> 200, 7E model 66 -> 105'}
  'Part 8':  {target: 498, min: 453, max: 543,  a2_target: 328, driver: 'Global Story 135 -> 300'}
  'Part 9':  {target: 475, min: 432, max: 518,  a2_target: 349, driver: 'Close to Home reading 133 -> 280'}
  'Part 10': {target: 225, min: 205, max: 245,  a2_target: 184, driver: 'fuller glossary gloss'}
model_allowance_words: {min: 80, max: 130}

figures:
  # Raised from the source's 4 on 2026-10-07: "I want visuals at the beginning
  # of every unit and almost in every page (of pedagogical value)". A unit runs
  # 12-16 pages, so 14 figures is roughly one a page. Every one of them is a
  # teaching device the text refers to, never decoration.
  per_unit: 41
  source_per_unit: null
  caption_pattern: '^\*Figure (\d+)\.(\d+) · (.+)\.\*$'
  # Numbered in document order, so Figure N.1 is the first the learner meets.
  # Renumbered 2026-10-08 by tools/renumber_figures.py. The numbers are spread
  # to leave room for the 27 new figures that land between them in phase 5;
  # every job, every piece of artwork and every caption is unchanged. The gaps
  # are deliberate and temporary.
  slots:
    1:  {part: 'Unit',    job: unit_opener_page, feeds: orientation, class: full_page}
    2:  {part: 'Warm Up', job: word_grid,        feeds: matching}
    3:  {part: 'Warm Up', job: bank_strip,       feeds: gapfill}
    4:  {part: 'Warm Up', job: scene,            feeds: fig_mcq}
    5:  {part: 'Part 1',  job: word_grid,        feeds: matching}
    # The job here is whichever one the unit's Pronunciation section asks
    # for: four units teach syllable stress (sound_shape), one teaches the
    # three sounds of -ed (sound_groups), two teach a changed form
    # (function_map) and three teach where the beat falls in a phrase
    # (annotated_lines). figure_source.pron_kind classifies the section.
    6:  {part: 'Part 1',  job: pronunciation,    feeds: pronunciation}
    7:  {part: 'Part 1',  job: category_set,     feeds: table_fill}
    8:  {part: 'Part 1',  job: label_me,         feeds: matching}
    9:  {part: 'Part 1',  job: bank_strip,       feeds: gapfill}
    10: {part: 'Part 1',  job: writing_frame,    feeds: short_write}
    11: {part: 'Part 2',  job: annotated_lines,  feeds: notice}
    12: {part: 'Part 2',  job: grammar_contrast, feeds: focus_box}
    13: {part: 'Part 2',  job: timeline,         feeds: gapfill}
    14: {part: 'Part 2',  job: sort_bins,        feeds: sorting}
    15: {part: 'Part 2',  job: error_pairs,      feeds: correct_sent}
    16: {part: 'Part 3',  job: speakers,         feeds: script_tfng}
    17: {part: 'Part 3',  job: dialogue_strip,   feeds: script_qa}
    18: {part: 'Part 3',  job: match_columns,    feeds: script_match}
    19: {part: 'Part 4',  job: question_cards,   feeds: discuss}
    20: {part: 'Part 4',  job: info_gap_pair,    feeds: infogap}
    21: {part: 'Part 4',  job: cue_cards,        feeds: roleplay}
    22: {part: 'Part 4',  job: talk_shape,       feeds: presentation}
    23: {part: 'Part 5',  job: process_strip,    feeds: text_mcq}
    24: {part: 'Part 5',  job: word_grid,        feeds: matching}
    25: {part: 'Part 5',  job: world_strip,      feeds: text_qa}
    26: {part: 'Part 6',  job: writing_frame,    feeds: writing}
    27: {part: 'Part 6',  job: writing_frame,    feeds: writing}
    28: {part: 'Part 6',  job: writing_frame,    feeds: writing}
    29: {part: 'Part 6',  job: writing_frame,    feeds: writing}
    30: {part: 'Part 7',  job: function_map,     feeds: matching}
    31: {part: 'Part 7',  job: dialogue_strip,   feeds: script_qa}
    32: {part: 'Part 7',  job: sequence_steps,   feeds: ordering}
    33: {part: 'Part 7',  job: cue_cards,        feeds: roleplay}
    34: {part: 'Part 7',  job: writing_frame,    feeds: writing}
    35: {part: 'Part 8',  job: before_after,     feeds: text_qa}
    36: {part: 'Part 8',  job: word_grid,        feeds: matching}
    37: {part: 'Part 9',  job: close_scene,      feeds: text_qa}
    38: {part: 'Part 9',  job: decision_fork,    feeds: decision}
    39: {part: 'Part 10', job: bank_strip,       feeds: gapfill}
    40: {part: 'Part 10', job: progress_strip,   feeds: cando}
    41: {part: 'Part 10', job: glossary_grid,    feeds: glossary}
  # The sub-sections that carry no figure, by position, so a later pass cannot
  # read a gap as an oversight and "fix" it. All twenty units have the same
  # shape (3-7-7-3-4-3-4-5-2-1-3 sub-sections), so a position is a stable name.
  # 00-VISUAL-PLAN.md section 4 named two of these. Measuring the real tree
  # found four: the plan's Part 1 and Part 2 rows accounted for six and five
  # sub-sections where the architecture has seven of each. The two extra are
  # recorded here with their reasons rather than given figures, because both
  # are tests of what has just been taught and a picture would answer them.
  no_figure_subs:
    - {part: 'Part 1', index: 5, reason: 'the multiple-choice test of Part 1 vocabulary; a picture of the answer is the answer'}
    - {part: 'Part 2', index: 6, reason: 'two lines of free writing about the learner''s own street; the Focus Box figure four sub-sections earlier is the only thing there is to draw, and a repeated figure teaches that figures can be skipped'}
    - {part: 'Part 2', index: 7, reason: 'the end-of-part grammar test; the contrast is already drawn at slot 12 and redrawing it here would cue every answer'}
    - {part: 'Part 8', index: 2, reason: 'three sentence frames and nothing else; the content is whatever the pair brings, so a two-people-talking icon would be decoration'}
  label_me_slot: 8
  category_set_slot: 7
  process_strip_slot: 23
  # One box for every figure is the source's law, and it is right for the small
  # in-text ones. The opener and the teaching diagrams need more of the page, so
  # each slot may name its own box. Declared departure, 2026-10-07.
  # every box edge is a whole 96-DPI pixel, because the placement law rounds to
  # one; 6.2708333 in = 602 px is the A4 text width to the pixel.
  # Raised 2026-10-08. The 1.979 in height cap was the measured source value
  # and it squashed every figure in the book: two of Unit 16's printed 4.79 and
  # 4.94 in wide instead of the full text width purely to stay under it. 6.268
  # is the text width exactly (9026 twips); 3.100 is 32% of the text height.
  # A declared departure, recorded in typography.yaml.
  box_default: {w: 6.2604166667, h: 3.0937500000}
  # A4 trim. Full-page images are placed at this size inside a zero-margin
  # section with fit: fill_trim rather than contain -- see typography.yaml.
  box_full_page: {w: 8.268333333333333, h: 11.693055555555556}
  full_page_covers: [front, back]
  full_page_slots: [1]      # the unit opener owns a whole page
  # EVERY dimension here is a whole number of 96-DPI pixels, and has to be.
  # The placement law rounds half-UP to a whole 96-DPI pixel, so a box whose
  # own size is not a whole pixel can be overflowed by its own rounding: the
  # text area is 601.73 px wide, and fitting to 6.268056 in rounds to 602 px
  # = 6.270833 in, which exceeds the box it was fitted to. 5.625 in hid this
  # for twenty units because it is exactly 540 px. Widths are 601 px, the
  # widest whole pixel inside the text area; heights are floored to whole px.
  # Check G11 asserts the invariant so it cannot be reintroduced.
  box_by_slot:
    # slot 1 is full-page now and takes box_full_page, so it needs no entry
    8:  {w: 6.2604166667, h: 2.8958333333}     # label-me: the rules must be writable
    12: {w: 6.2604166667, h: 2.9479166667}     # the grammar contrast is the unit's one diagram
    16: {w: 6.2604166667, h: 2.4479166667}
    21: {w: 6.2604166667, h: 2.4479166667}
    25: {w: 6.2604166667, h: 2.1979166667}
    26: {w: 6.2604166667, h: 2.4479166667}
    30: {w: 6.2604166667, h: 2.5416666667}
    35: {w: 6.2604166667, h: 2.3437500000}
    40: {w: 6.2604166667, h: 2.4479166667}
  px_width: 1440            # in-flow canvas
  px_width_full_page: 2480  # A4 at 300 DPI
  px_height_full_page: 3508
  px_height: {min: 320, max: 880}
  # the unit opener is a full-width banner the source has no analogue for;
  # its dark masthead costs more bytes than any source figure (max 38 KB).
  max_bytes: 98304
  # A full page of flat vector art compresses well but not to 96 KB; the
  # measured covers at this canvas are 155 and 395 KB.
  max_bytes_full_page: 786432
  # A portrait title page has margin by design, so the 8% empty-band cap that
  # suits a cropped in-flow figure would reject every opener.
  max_empty_band_fraction_full_page: 0.30
  min_glyph_px: 22
  max_empty_band_fraction: 0.08
  min_contrast_ratio: 4.5

mcq:
  options: 4
  option_pattern: '^> ○ ([A-D])\) '
  max_letter_share_per_unit: 0.40
  chi2_p_min: 0.05

language:
  # CEILINGS. Raised from A2's, which were measured from the source book.
  max_sentence_words: 32           # A2: 25. B1 admits subordination A2 refuses.
  mean_sentence_words_max: 16      # A2: 14. 17 is unreachable under fk_grade_max
                                   # -- see 00-MASTER-PLAN.md section 3.5.
  max_clause_depth: 3              # A2: 2. Relative + conditional + reported.
  fk_grade_max: 7.0                # A2: 5.0.
  min_band_coverage: 0.90          # unchanged; the BAND is 4,530, not 2,356.
  # FLOORS. New at B1, and the reason this spec can tell B1 from A2. Every one
  # of A2's twenty-six language checks is a ceiling, and a unit written
  # entirely in A2 language passes all of them with room to spare. These three
  # were calibrated against all twenty shipped A2 units, and L01 asserts that
  # every one of those units FAILS all three -- a floor nothing fails is not a
  # floor. Two of the first three numbers tried were wrong and were corrected
  # from the measurement: 11.0 failed A2 by 0.057 words, and 4.5 was passed
  # outright by one A2 unit.
  min_b1_tier_share: 0.06          # E27. A2 measures 0.001-0.012, mean 0.005.
  mean_sentence_words_min: 12.0    # E28. A2 measures 8.73-10.94.
  fk_grade_min: 5.5                # E29. A2 measures 3.14-4.61, and A2's own
                                   # CEILING is 5.0 -- B1 must start where A2
                                   # was forbidden to go.
  target_grammar_min_occurrences: 8
  glossary_plantings_before_part10: 3
  spelling: en-GB
  time_format: '\d{1,2}\.\d{2}'

# Three defects measured in the source that this course does not reproduce.
source_defects_not_reproduced:
