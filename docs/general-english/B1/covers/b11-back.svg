<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508"><rect width="2480" height="3508" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="2480.0" height="420.0" rx="0" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="0"/><text x="1240.0" y="200.0" font-family="DejaVu Sans" font-size="62" font-weight="bold" fill="#1F3864" text-anchor="middle">ENGLISH FOR DAILY LIFE</text><text x="1240.0" y="310.0" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#6E88AC" text-anchor="middle">B1 · Volume 1 · Looking Back</text><text x="220.0" y="580.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">English for Daily Life at B1 picks up the same six people two years later, on the</text><text x="220.0" y="645.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">same street, and gives them the past behind the past and the things that never</text><text x="220.0" y="710.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">happened: what was going on when something interrupted it, how long it has been going</text><text x="220.0" y="776.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">on, what had already happened by the time anybody said anything, what the rent used</text><text x="220.0" y="841.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">to be, what would happen if the money came, and what would have happened if they had</text><text x="220.0" y="906.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">taken the other flat. One unit, each with the same eleven parts and the same support</text><text x="220.0" y="971.9" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">as at A2: a worked example at the top of almost every task, a model before every</text><text x="220.0" y="1037.2" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">piece of writing, a word bank under every gap-fill and a checklist before you hand</text><text x="220.0" y="1102.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">anything in. The readings and the recordings are twice the length they were, because</text><text x="220.0" y="1167.9" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">that is what the level is. The Core track is for everybody; the Plus track is there</text><text x="220.0" y="1233.2" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">when you want it. Answers for every closed question are in the book.</text><text x="220.0" y="1358.5" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">In this book</text><text x="250.0" y="1438.5" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">1</text><text x="330.0" y="1438.5" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">The Night the Power Went Out</text><text x="1280.0" y="1438.5" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">past continuous vs past simple - while/when</text><text x="220.0" y="1560.5" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">By the end you will be able to</text><text x="250.0" y="1640.5" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1640.5" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can say what I was doing when something interrupted me, using the past continuous.</text><text x="250.0" y="1706.5" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1706.5" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can use *while* and *when* to join a long action and a short one.</text><text x="250.0" y="1772.5" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1772.5" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can describe a problem in a building and say what I want people to agree.</text><text x="250.0" y="1838.5" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1838.5" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can telephone to report a fault and ask for a job number.</text><text x="1240.0" y="3288.0" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="middle">CEFR B1 · Student Book with answer key · British English</text></svg>