# ---------------------------------------------------------------------------
# DECLARED DEPARTURES from the source, approved 2026-10-07 and extended on
# 2026-10-07 after review: "too crammed ... I want visuals at the beginning of
# every unit and almost in every page".
#
# The source sets 42 sub-sections of solid 11pt Calibri with no paragraph
# spacing, no heading hierarchy beyond bold, no page breaks and no cell
# padding. It is legible but it is a wall. Everything below is a deliberate
# change; the measured source values stay above so the diff is always visible.
# ---------------------------------------------------------------------------
departures:
  page_numbers: true
  running_footer: "Unit {unit} · {part}"
  layout: refined
  # 11-17 pages was the source's own density. The refined layout gives every
  # part its own page, 1.15 line spacing, 6pt paragraph spacing, padded cells
  # and 14 figures a unit, and runs 20-32. That is the point of the change.
  pages_per_unit: {min: 20, max: 34}
  pages_per_volume: {min: 230, max: 380}

