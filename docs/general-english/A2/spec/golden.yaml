# The A2 architecture. CEILINGS ONLY.
#
# Interpolated between A1 as SHIPPED (a book that exists: 20 units, 441 pages,
# ten check stages green) and B1 as MEASURED off source/PE_B2_U08_StudentBook.
# That is a better-founded derivation than A1 had, because the left-hand side
# is no longer a guess.
#
# There are no floors. Not on words, not on sentence length, not on reading
# grade, not on figure count. B1's first spec had them and they were the worst
# thing in that project: they made a unit harder and the suite called it
# quality. A unit of 3,000 words that teaches its forty-eight items and reads
# cleanly is a PASS.
schema_version: 1
level: A2
derived_from:
  - {file: A1/spec/golden.yaml, level: A1, note: the floor of the interpolation, as shipped}
  - {file: PE_B2_U08_StudentBook.docx, level: B2, note: the ceiling, measured}

unit:
  title_pattern: '^\*\*Unit (\d+): (.+)\*\*$'
  strap_pattern: '^\*In this unit you.+\*$'
  exercises: 38
  words_max: 4800          # ceiling only; no minimum exists

sections:
  - {part: Warm Up, header: "**Warm Up**", labels: [W1, W2, W3]}
  - {part: Part 1, header: "**Part 1 · Words & Sounds**", labels: [1A, 1B, 1C, 1D, 1E, 1F]}
  - {part: Part 2, header: "**Part 2 · Grammar**", labels: [2A, 2B, 2C, 2D, 2E, 2F]}
  - {part: Part 3, header: "**Part 3 · Listening**", labels: [3A, 3B, 3C, 3D]}
  - {part: Part 4, header: "**Part 4 · Speaking**", labels: [4A, 4B, 4C, 4D]}
  - {part: Part 5, header: "**Part 5 · Reading**", labels: [5A, 5B, 5C, 5D]}
  - {part: Part 6, header: "**Part 6 · Writing**", labels: [6A, 6B, 6C]}
  - {part: Part 7, header: "**Part 7 · Real-World File**", labels: [7A, 7B, 7C]}
  - {part: Part 8, header: "**Part 8 · Review & Can-Do**", labels: [8A, 8B, 8C, 8D, 8E]}

exercise:
  label_pattern: '^\*\*(W\d|\d[A-H])\*\*\s+(.+)$'
  rubric_max_words: 16
  example_pattern: '^0\.\s+.+\*\(example\)\*$'
  example_required: true
  items_min: 3
  items_max: 8
  item_max_words: 16
  item_mean_words_max: 9
  not_needed_line: 'One option is not needed.'

figures:
  # ONE FIGURE PER EXERCISE. Thirty-eight, numbered to match: Figure N.k is
  # the figure of the kth exercise of unit N, in order. That makes the mapping
  # between a task and its picture total and checkable -- G22 holds it -- and
  # it is why the figure budget per part is now exactly the exercise count of
  # that part rather than a 2-4 band.
  per_unit: 38
  per_exercise: 1
  caption_pattern: '^\*Figure (\d+)\.(\d+) · (.+)\.\*$'
  caption_max_words: 7
  jobs: [data, contrast, lexis, document]      # there is no fifth job

language:
  mean_sentence_words_max: 10
  max_sentence_words: 20
  fk_grade_max: 3.2
  clause_depth_max: 2
  long_texts_max: 5
  long_text_words_max: 130

mcq:
  options: 3
  option_pattern: '\((a|b|c)\)\s'
  max_letter_share_per_unit: 0.45

audio:
  scripts_per_unit: 4
  script_words_max: 140

lexis:
  new_items_max: 48
