<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2200" viewBox="0 0 1700 2200"><rect width="1700" height="2200" fill="#FFF9F0"/><rect x="0.00" y="0.00" width="1700.00" height="230.00" fill="#6E3F6E"/><text x="96.00" y="108.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="34.0" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="7">ENGLISH FOR DAILY LIFE</text><text x="96.00" y="176.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="44.0" font-weight="700" fill="#F1BB3E" text-anchor="start">A2 · Student Book</text><text x="96.00" y="330.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="54.0" font-weight="700" fill="#1F2933" text-anchor="start">The year after your first year.</text><text x="96.00" y="392.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="33.0" font-weight="400" fill="#52606D" text-anchor="start">A2 picks up where A1 left off, on the same street, with the same eight people. You tell a story in</text><text x="96.00" y="439.52" font-family="Inter, DejaVu Sans, sans-serif" font-size="33.0" font-weight="400" fill="#52606D" text-anchor="start">the past, say what you have done, describe a person, read a label and a timetable, and write the</text><text x="96.00" y="487.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="33.0" font-weight="400" fill="#52606D" text-anchor="start">letter that gets you the job. Nothing is explained in words you have not met.</text><text x="96.00" y="541.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="38.0" font-weight="700" fill="#1F2933" text-anchor="start">Every unit has nine parts</text><circle cx="105.00" cy="590.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="599.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Warm Up</text><text x="274.14" y="599.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— three ways in</text><circle cx="105.00" cy="642.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="651.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Words &amp; Sounds</text><text x="376.67" y="651.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— the new words, and how to say them</text><circle cx="105.00" cy="694.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="703.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Grammar</text><text x="275.62" y="703.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— the form, shown before it is named</text><circle cx="105.00" cy="746.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="755.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Listening</text><text x="274.39" y="755.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— four tasks, every script printed at the back</text><circle cx="105.00" cy="798.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="807.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Speaking</text><text x="276.73" y="807.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— four tasks you do with a partner</text><circle cx="105.00" cy="850.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="859.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Reading</text><text x="259.61" y="859.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— real things: a notice, a receipt, a message</text><circle cx="105.00" cy="902.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="911.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Writing</text><text x="247.86" y="911.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— a form, a frame, then your own lines</text><circle cx="105.00" cy="954.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="963.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Real-World File</text><text x="359.58" y="963.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— the thing outside the classroom</text><circle cx="105.00" cy="1006.04" r="9.00" fill="#2A4A7B"/><text x="132.00" y="1015.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="29.0" font-weight="700" fill="#1F2933" text-anchor="start">Review &amp; Can-Do</text><text x="388.09" y="1015.04" font-family="DejaVu Sans, sans-serif" font-size="29.0" font-weight="400" fill="#1F2933" text-anchor="start">— what you can do now, ticked by you</text><text x="96.00" y="1097.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="38.0" font-weight="700" fill="#1F2933" text-anchor="start">The twenty units</text><text x="118.00" y="1149.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">1</text><text x="136.00" y="1149.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">Back on Hill Road</text><text x="118.00" y="1189.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">2</text><text x="136.00" y="1189.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">Every Day and Right Now</text><text x="118.00" y="1229.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">3</text><text x="136.00" y="1229.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">A Place of My Own</text><text x="118.00" y="1269.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">4</text><text x="136.00" y="1269.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">How Much, How Many</text><text x="118.00" y="1309.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">5</text><text x="136.00" y="1309.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">What Happened</text><text x="892.00" y="1149.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">6</text><text x="910.00" y="1149.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">Getting There</text><text x="892.00" y="1189.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">7</text><text x="910.00" y="1189.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">Making Plans</text><text x="892.00" y="1229.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">8</text><text x="910.00" y="1229.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">At Work</text><text x="892.00" y="1269.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">9</text><text x="910.00" y="1269.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">Feeling Better</text><text x="892.00" y="1309.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#52606D" text-anchor="end">10</text><text x="910.00" y="1309.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">The Way I Am</text><text x="96.00" y="1385.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="34.0" font-weight="700" fill="#1F2933" text-anchor="start">And at the back of the book</text><text x="96.00" y="1433.04" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="400" fill="#52606D" text-anchor="start">Grammar File, one entry per unit · Word File, every word with the unit that teaches it and an Arabic gloss · Phrase</text><text x="96.00" y="1472.24" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="400" fill="#52606D" text-anchor="start">File · irregular verbs · sound and symbol table · Audio File, all the listening scripts to the word · Picture File ·</text><text x="96.00" y="1511.44" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="400" fill="#52606D" text-anchor="start">Can-Do Record.</text><rect x="96.00" y="1884.00" width="359.00" height="136.00" rx="18" ry="18" fill="#FFFFFF" stroke="#C5CCD3" stroke-width="3"/><text x="116.00" y="1954.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="50.0" font-weight="700" fill="#1F2933" text-anchor="start">10</text><text x="118.00" y="1996.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">units</text><rect x="479.00" y="1884.00" width="359.00" height="136.00" rx="18" ry="18" fill="#FFFFFF" stroke="#C5CCD3" stroke-width="3"/><text x="499.00" y="1954.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="50.0" font-weight="700" fill="#1F2933" text-anchor="start">380</text><text x="501.00" y="1996.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">exercises</text><rect x="862.00" y="1884.00" width="359.00" height="136.00" rx="18" ry="18" fill="#FFFFFF" stroke="#C5CCD3" stroke-width="3"/><text x="882.00" y="1954.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="50.0" font-weight="700" fill="#1F2933" text-anchor="start">380</text><text x="884.00" y="1996.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">figures</text><rect x="1245.00" y="1884.00" width="359.00" height="136.00" rx="18" ry="18" fill="#FFFFFF" stroke="#C5CCD3" stroke-width="3"/><text x="1265.00" y="1954.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="50.0" font-weight="700" fill="#1F2933" text-anchor="start">505</text><text x="1267.00" y="1996.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">words</text><text x="96.00" y="2064.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#52606D" text-anchor="start">No photographs. Every picture is drawn, and every one has a job: to carry what a task needs, to show one form against</text><text x="96.00" y="2099.88" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#52606D" text-anchor="start">another, to show what a word means, or to reproduce a real document.</text><rect x="0.00" y="2130.00" width="1700.00" height="70.00" fill="#6E3F6E"/><text x="96.00" y="2173.40" font-family="Inter, DejaVu Sans, sans-serif" font-size="34.0" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="3">HILL ROAD</text><text x="1604.00" y="2173.40" font-family="Inter, DejaVu Sans, sans-serif" font-size="34.0" font-weight="600" fill="#FFFFFF" text-anchor="end">A2 · Student Book</text></svg>