<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="651" viewBox="0 0 1440 651"><rect width="1440" height="651" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Somebody near you needs help and does not ask?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="390.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="221.3" y="274.0" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 245.3 324.0 L 255.3 346.0 L 269.3 324.0 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="235.3" y1="290.0" x2="287.3" y2="290.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="235.3" y1="304.0" x2="273.3" y2="304.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Offer directly</text><text x="261.3" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they have to say it out</text><text x="261.3" y="485.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">loud</text><text x="261.3" y="528.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you know they</text><text x="261.3" y="559.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">understood</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="390.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><path d="M 676.0 310.0 L 710.0 294.0 L 716.0 308.0 L 682.0 324.0 Z" fill="#E6C78F" stroke="#1F3864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 764.0 310.0 L 730.0 294.0 L 724.0 308.0 L 758.0 324.0 Z" fill="#C79A5C" stroke="#1F3864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720.0" cy="308.0" r="11.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Help without saying</text><text x="720.0" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">anything</text><text x="720.0" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it costs them nothing</text><text x="720.0" y="534.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they may not notice</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="390.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="1178.7" cy="308.0" r="36.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="1178.7" y1="308.0" x2="1178.7" y2="286.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="1178.7" y1="308.0" x2="1194.7" y2="316.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><text x="1178.7" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Wait until they ask</text><text x="1178.7" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#