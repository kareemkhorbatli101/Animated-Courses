<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="592" viewBox="0 0 1440 592"><rect width="1440" height="592" fill="#FFFFFF"/><rect x="50.0" y="29.3" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="91.3" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Somebody near you needs help and does not ask?</text><path d="M 720.0 125.3 L 720.0 177.3 L 261.3 177.3 L 261.3 227.3" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="227.3" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="221.3" y="273.3" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 245.3 323.3 L 255.3 345.3 L 269.3 323.3 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="235.3" y1="289.3" x2="287.3" y2="289.3" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="235.3" y1="303.3" x2="273.3" y2="303.3" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="261.3" y="389.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Offer directly</text><text x="261.3" y="453.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they have to say it out</text><text x="261.3" y="484.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">loud</text><text x="261.3" y="527.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you know they</text><text x="261.3" y="558.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">understood</text><path d="M 720.0 125.3 L 720.0 177.3 L 720.0 177.3 L 720.0 227.3" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="227.3" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><path d="M 676.0 309.3 L 710.0 293.3 L 716.0 307.3 L 682.0 323.3 Z" fill="#E6C78F" stroke="#1F3864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 764.0 309.3 L 730.0 293.3 L 724.0 307.3 L 758.0 323.3 Z" fill="#C79A5C" stroke="#1F3864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="720.0" cy="307.3" r="11.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><text x="720.0" y="389.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Help without saying</text><text x="720.0" y="425.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">anything</text><text x="720.0" y="489.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it costs them nothing</text><text x="720.0" y="533.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they may not notice</text><path d="M 720.0 125.3 L 720.0 177.3 L 1178.7 177.3 L 1178.7 227.3" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="227.3" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="1178.7" cy="307.3" r="36.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="1178.7" y1="307.3" x2="1178.7" y2="285.3" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="1178.7" y1="307.3" x2="1194.7" y2="315.3" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><text x="1178.7" y="389.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Wait until they ask</text><text x="1178.7" y="453.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#