<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="657" viewBox="0 0 1440 657"><rect width="1440" height="657" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your street has no useful numbers. What do you do?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="221.3" y="282.0" width="80.0" height="52.0" rx="4.0" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><rect x="229.3" y="290.0" width="64.0" height="36.0" rx="2.0" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><line x1="239.3" y1="302.0" x2="283.3" y2="302.0" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="239.3" y1="314.0" x2="271.3" y2="314.0" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Ask the city</text><text x="261.3" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the whole street is</text><text x="261.3" y="485.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">numbered</text><text x="261.3" y="528.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">eight years for one lamp</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><line x1="720.0" y1="352.0" x2="720.0" y2="288.0" stroke="#1F3864" stroke-width="6" stroke-linecap="round"/><rect x="714.0" y="262.0" width="52.0" height="20.0" rx="3.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="718.0" y1="272.0" x2="756.0" y2="272.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><rect x="674.0" y="288.0" width="52.0" height="20.0" rx="3.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="680.0" y1="298.0" x2="716.0" y2="298.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Put up your own sign</text><text x="720.0" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">one afternoon</text><text x="720.0" y="498.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it helps only at that</text><text x="720.0" y="529.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">junction</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1138.7" y="274.0" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 1162.7 324.0 L 1172.7 346.0 L 1186.7 324.0 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1152.7" y1="290.0" x2="1204.7" y2="290.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="1152.7" y1="304.0" x2="1190.7" y2="304.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="1178.7" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Tell everybody the</text><text x="1178.7" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">landmark</text><text x="1178.7" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it works better than a</text><text x="1178.7" y="521.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">number</text><text x="1178.7" y="564.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you say it every time</text></svg>