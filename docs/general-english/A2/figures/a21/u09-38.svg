<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="597" viewBox="0 0 1440 597"><rect width="1440" height="597" fill="#FFFFFF"/><rect x="50.0" y="29.6" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="91.6" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your street has no useful numbers. What do you do?</text><path d="M 720.0 125.6 L 720.0 177.6 L 261.3 177.6 L 261.3 227.6" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="227.6" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="221.3" y="281.6" width="80.0" height="52.0" rx="4.0" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><rect x="229.3" y="289.6" width="64.0" height="36.0" rx="2.0" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><line x1="239.3" y1="301.6" x2="283.3" y2="301.6" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="239.3" y1="313.6" x2="271.3" y2="313.6" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><text x="261.3" y="389.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Ask the city</text><text x="261.3" y="453.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the whole street is</text><text x="261.3" y="484.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">numbered</text><text x="261.3" y="527.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">eight years for one lamp</text><path d="M 720.0 125.6 L 720.0 177.6 L 720.0 177.6 L 720.0 227.6" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="227.6" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><line x1="720.0" y1="351.6" x2="720.0" y2="287.6" stroke="#1F3864" stroke-width="6" stroke-linecap="round"/><rect x="714.0" y="261.6" width="52.0" height="20.0" rx="3.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="718.0" y1="271.6" x2="756.0" y2="271.6" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><rect x="674.0" y="287.6" width="52.0" height="20.0" rx="3.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="680.0" y1="297.6" x2="716.0" y2="297.6" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="720.0" y="389.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Put up your own sign</text><text x="720.0" y="453.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">one afternoon</text><text x="720.0" y="497.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it helps only at that</text><text x="720.0" y="528.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">junction</text><path d="M 720.0 125.6 L 720.0 177.6 L 1178.7 177.6 L 1178.7 227.6" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="227.6" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1138.7" y="273.6" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 1162.7 323.6 L 1172.7 345.6 L 1186.7 323.6 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1152.7" y1="289.6" x2="1204.7" y2="289.6" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="1152.7" y1="303.6" x2="1190.7" y2="303.6" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="1178.7" y="389.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Tell everybody the</text><text x="1178.7" y="425.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">landmark</text><text x="1178.7" y="489.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it works better than a</text><text x="1178.7" y="520.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">number</text><text x="1178.7" y="563.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you say it every time</text></svg>