<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="486" viewBox="0 0 1280 486"><rect width="1280" height="486" fill="#FFFFFF"/><rect x="70.00" y="44.00" width="283.59" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">What is she like?</text><path d="M379.59,79.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M413.59,67.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="449.59" y="44.00" width="411.59" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="471.59" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Calm, and very generous.</text><rect x="70.00" y="148.00" width="342.30" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">How does she work?</text><path d="M438.30,183.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M472.30,171.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.30" y="148.00" width="468.70" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="530.30" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Slowly, but she never forgets.</text><rect x="70.00" y="252.00" width="415.55" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">How often does she chat?</text><path d="M511.55,287.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M545.55,275.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="581.55" y="252.00" width="389.91" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="603.55" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Hardly ever in the week.</text><rect x="70.00" y="356.00" width="371.62" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="402.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Is she as shy as Omar?</text><path d="M467.62,391.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M501.62,379.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="537.62" y="356.00" width="420.59" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="559.62" y="402.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">No, she is more confident.</text></svg>