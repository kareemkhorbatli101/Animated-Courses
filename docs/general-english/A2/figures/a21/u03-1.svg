oke-width="5" stroke-linecap="round"/><text x="190.0" y="3178.0" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#1F3864" text-anchor="start">Core track: Warm Up and Parts 1 to 6</text><text x="190.0" y="3258.0" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#1F3864" text-anchor="start">Plus track: Parts 7 to 9, when you are ready</text><rect x="0.0" y="3418.0" width="2480.0" height="90.0" rx="0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/></svg>