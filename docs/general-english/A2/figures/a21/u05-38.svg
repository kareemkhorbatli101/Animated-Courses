<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="578" viewBox="0 0 1440 578"><rect width="1440" height="578" fill="#FFFFFF"/><rect x="50.0" y="28.7" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="90.7" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your job needs you at the weekend. What do you do?</text><path d="M 720.0 124.7 L 720.0 176.7 L 261.3 176.7 L 261.3 226.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="226.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="245.3" cy="316.7" r="20.0" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><circle cx="275.3" cy="308.7" r="20.0" fill="#C79A5C" stroke="#1F3864" stroke-width="3"/><circle cx="259.3" cy="284.7" r="20.0" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><line x1="253.3" y1="284.7" x2="265.3" y2="284.7" stroke="#A97C43" stroke-width="4" stroke-linecap="round"/><text x="261.3" y="388.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Take the hours</text><text x="261.3" y="452.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the pay is better</text><text x="261.3" y="496.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you miss the dinner</text><path d="M 720.0 124.7 L 720.0 176.7 L 720.0 176.7 L 720.0 226.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="226.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="680.0" y="274.7" width="80.0" height="72.0" rx="5.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="680.0" y="274.7" width="80.0" height="18.0" rx="5.0" fill="#1F3864" stroke="#1F3864" stroke-