<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="298" viewBox="0 0 1280 298"><rect width="1280" height="298" fill="#FFFFFF"/><rect x="50.00" y="30.00" width="565.00" height="238.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="50.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#2A4A7B"/><rect x="50.00" y="62.00" width="565.00" height="30.00" fill="#2A4A7B"/><text x="70.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A NOTE FROM MAREK</text><text x="72.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Lili, welcome back!</text><text x="72.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Your key is with Rosa in flat 14.</text><text x="72.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">The heating works now.</text><rect x="665.00" y="30.00" width="565.00" height="238.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="665.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#247F7F"/><rect x="665.00" y="62.00" width="565.00" height="30.00" fill="#247F7F"/><text x="685.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A NOTE FROM BEN</text><text x="687.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">I am at the shop until six.</text><text x="687.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Come and say hello.</text><text x="687.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">I will make you a coffee.</text></svg>