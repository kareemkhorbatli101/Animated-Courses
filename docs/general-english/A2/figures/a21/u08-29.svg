<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="529" viewBox="0 0 1440 529"><rect width="1440" height="529" fill="#FFFFFF"/><rect x="70.0" y="29.2" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="29.2" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="112.7" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="112.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what you cannot do</text><text x="670.0" y="110.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I cannot read music.</text><rect x="70.0" y="192.2" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="192.2" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="275.7" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="275.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">why you want it</text><text x="670.0" y="258.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I can play three songs on a guitar by</text><text x="670.0" y="288.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">copying.</text><rect x="70.0" y="355.2" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="355.2" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="438.7" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">3</text><text x="190.0" y="438.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">what stops you</text><text x="670.0" y="436.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I would like to open a page and hear it.</text></svg>