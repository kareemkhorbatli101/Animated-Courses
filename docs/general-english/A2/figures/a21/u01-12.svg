<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="382" viewBox="0 0 1280 382"><rect width="1280" height="382" fill="#FFFFFF"/><rect x="70.00" y="44.00" width="325.16" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Where did you live?</text><path d="M421.16,79.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M455.16,67.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="491.16" y="44.00" width="339.83" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="513.16" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">In Madrid, for a year.</text><rect x="70.00" y="148.00" width="390.91" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Do you work there now?</text><path d="M486.91,183.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M520.91,171.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="556.91" y="148.00" width="270.53" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="578.91" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">No, I work here.</text><rect x="70.00" y="252.00" width="296.12" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="298.00" font-family="Inter, Deja