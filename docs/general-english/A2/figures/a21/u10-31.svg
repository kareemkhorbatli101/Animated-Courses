<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460"><rect width="1280" height="460" fill="#FFFFFF"/><text x="80.00" y="56.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="700" fill="#1F2933" text-anchor="start">WHAT ARE YOU LIKE? · FOUR QUESTIONS</text><rect x="80.00" y="94.00" width="1120.00" height="56.00" rx="10" ry="10" fill="#2A4A7B"/><text x="100.00" y="131.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#FFFFFF" text-anchor="start">Question</text><text x="682.40" y="131.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A</text><text x="951.20" y="131.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="700" fill="#FFFFFF" text-anchor="start">B</text><rect x="80.00" y="150.00" width="1120.00" height="58.00" fill="#FFF9F0"/><line x1="80.00" y1="208.00" x2="1200.00" y2="208.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="100.00" y="188.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="600" fill="#1F2933" text-anchor="start">At a party you</text><text x="682.40" y="188.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">talk to everybody</text><text x="951.20" y="188.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="24.5" font-weight="400" fill="#1F2933" text-anchor="start">stay with one friend</text><rect x="80.00" y="208.00" width="1120.00" height="58.00" fill="#FFFFFF"/><line x1="80.00" y1="266.00" x2="1200.00" y2="266.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="100.00" y="246.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="600" fill="#1F2933" text-anchor="start">A new job makes you</text><text x="682.40" y="246.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">excited</text><text x="951.20" y="246.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">nervous</text><rect x="80.00" y="266.00" width="1120.00" height="58.00" fill="#FFF9F0"/><line x1="80.00" y1="324.00" x2="1200.00" y2="324.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="100.00" y="304.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="600" fill="#1F2933" text-anchor="start">You work</text><text x="682.40" y="304.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">quickly</text><text x="951.20" y="304.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="24.5" font-weight="400" fill="#1F2933" text-anchor="start">slowly and carefully</text><rect x="80.00" y="324.00" width="1120.00" height="58.00" fill="#FFFFFF"/><line x1="80.00" y1="382.00" x2="1200.00" y2="382.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="100.00" y="362.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="600" fill="#1F2933" text-anchor="start">A friend is late. You</text><text x="682.40" y="362.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">ring at once</text><text x="951.20" y="362.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">wait quietly</text><rect x="80.00" y="94.00" width="1120.00" height="288.00" rx="10" ry="10" fill="none" stroke="#8A99A8" stroke-width="2.5"/></svg>