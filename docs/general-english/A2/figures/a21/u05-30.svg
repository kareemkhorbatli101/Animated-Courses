<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="462" viewBox="0 0 1280 462"><rect width="1280" height="462" fill="#FFFFFF"/><rect x="50.00" y="30.00" width="565.00" height="402.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="50.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#8A5BA6"/><rect x="50.00" y="62.00" width="565.00" height="30.00" fill="#8A5BA6"/><text x="70.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A MODEL REPORT</text><text x="72.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">I was going downstairs with a box.</text><text x="72.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">The light was not working.</text><text x="72.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">I slipped and I fell on the fourth step.</text><text x="72.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Marek telephoned and the ambulance</text><text x="72.00" y="272.50" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">came.</text><rect x="665.00" y="30.00" width="565.00" height="402.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="665.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#636E79"/><rect x="665.00" y="62.00" width="565.00" height="30.00" fill="#636E79"/><text x="685.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">THE FOUR LINES</text><text x="687.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">1 what you were doing</text><text x="687.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">2 what the problem was</text><text x="687.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">3 what suddenly happened</text><text x="687.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">4 what happened after that</text></svg>