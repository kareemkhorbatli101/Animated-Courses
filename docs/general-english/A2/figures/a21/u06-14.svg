<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="452" viewBox="0 0 1280 452"><rect width="1280" height="452" fill="#FFFFFF"/><text x="80.00" y="56.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="700" fill="#1F2933" text-anchor="start">FOUR DAYS AWAY</text><line x1="150.00" y1="86.00" x2="150.00" y2="402.00" stroke="#8A99A8" stroke-width="5" stroke-linecap="round"/><circle cx="150.00" cy="112.00" r="17.00" fill="#247F7F"/><text x="150.00" y="121.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="24.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="192.00" y="108.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="700" fill="#1F2933" text-anchor="start">Monday</text><text x="192.00" y="142.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">the station</text><text x="580.00" y="108.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">We take the 07.10 train.</text><circle cx="150.00" cy="190.00" r="17.00" fill="#247F7F"/><text x="150.00" y="199.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="24.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="192.00" y="186.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="700" fill="#1F2933" text-anchor="start">Tuesday</text><text x="192.00" y="220.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">the coast</text><text x="580.00" y="186.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">We walk along the beach.</text><circle cx="150.00" cy="268.00" r="17.00" fill="#247F7F"/><text x="150.00" y="277.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="24.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="192.00" y="264.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="700" fill="#1F2933" text-anchor="start">Wednesday</text><text x="192.00" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">the island</text><text x="580.00" y="264.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">We go across by ferry.</text><circle cx="150.00" cy="346.00" r="17.00" fill="#247F7F"/><text x="150.00" y="355.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="24.0" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="192.00" y="342.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="700" fill="#1F2933" text-anchor="start">Thursday</text><text x="192.00" y="376.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#52606D" text-anchor="start">home</text><text x="580.00" y="342.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="26.0" font-weight="400" fill="#1F2933" text-anchor="start">The last train is at eight.</text></svg>