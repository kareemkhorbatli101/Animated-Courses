<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="559" viewBox="0 0 1440 559"><rect width="1440" height="559" fill="#FFFFFF"/><rect x="50.0" y="27.7" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="89.7" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A new person moves in next week. What do you do?</text><path d="M 720.0 123.7 L 720.0 175.7 L 261.3 175.7 L 261.3 225.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="225.7" width="422.7" height="280.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="219.3" y="279.7" width="84.0" height="52.0" rx="3.0" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><path d="M 219.3 279.7 L 261.3 309.7 L 303.3 279.7" fill="none" stroke="#1F3864" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="281.3" y="283.7" width="18.0" height="14.0" rx="2.0" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><text x="261.3" y="387.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Knock with a note</text><text x="261.3" y="451.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">a shy person can read it</text><text x="261.3" y="482.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">later</text><text x="261.3" y="525.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it takes two minutes</text><path d="M 720.0 123.7 L 720.0 175.7 L 720.0 175.7 L 720.0 225.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="225.7" width="422.7" height="280.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="720.0" cy="305.7" r="36.0" fill="#EEF3F9" stroke="#1F3864" st