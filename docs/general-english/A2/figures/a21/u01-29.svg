<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="417" viewBox="0 0 1440 417"><rect width="1440" height="417" fill="#FFFFFF"/><rect x="70.0" y="23.7" width="1300.0" height="79.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="23.7" width="14.0" height="79.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="74.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="74.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">The morning</text><text x="670.0" y="72.2" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">My perfect weekday starts late.</text><rect x="70.0" y="120.7" width="1300.0" height="79.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="120.7" width="14.0" height="79.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="171.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="171.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">Until two</text><text x="670.0" y="169.2" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">I work until two, and then I stop.</text><rect x="70.0" y="217.7" width="1300.0" height="79.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="217.7" width="14.0" height="79.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="268.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">3</text><text x="190.0" y="268.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">The afternoon</text><text x="670.0" y="266.2" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">In the afternoon I read, and I cook.</text><rect x="70.0" y="314.7" width="1300.0" height="79.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="314.7" width="14.0" height="79.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="365.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">4</text><text x="190.0" y="365.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">The evening</text><text x="670.0" y="363.2" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">In the evening I see one friend.</text></svg>