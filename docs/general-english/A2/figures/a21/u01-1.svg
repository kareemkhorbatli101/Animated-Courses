ke-linecap="round"/><text x="190.0" y="2210.0" font-family="DejaVu Sans" font-size="58" font-weight="bold" fill="#1F3864" text-anchor="start">By the end of this unit you can</text><rect x="196.0" y="2332.0" width="56.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#009688" stroke-width="7"/><text x="310.0" y="2380.0" font-family="DejaVu Sans" font-size="50" font-weight="bold" fill="#1F3864" text-anchor="start">I can name the people around me: neighbour, flatmate, colleague.</text><rect x="196.0" y="2462.0" width="56.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#009688" stroke-width="7"/><text x="310.0" y="2510.0" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">I can use the present simple for routines and the present continuous for now.</text><rect x="196.0" y="2592.0" width="56.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#009688" stroke-width="7"/><text x="310.0" y="2640.0" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#1F3864" text-anchor="start">I can describe a person&#8217;s day in 50–70 words.</text><line x1="190.0" y1="3078.0" x2="2290.0" y2="3078.0" stroke="#AEB6C2" stroke-width="5" stroke-linecap="round"/><text x="190.0" y="3178.0" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#1F3864" text-anchor="start">Core track: Warm Up and Parts 1 to 6</text><text x="190.0" y="3258.0" font-family="DejaVu Sans" font-size="44" font-weight="bold" fill="#1F3864" text-anchor="start">Plus track: Parts 7 to 9, when you are ready</text><rect x="0.0" y="3418.0" width="2480.0" height="90.0" rx="0" fill="#1F3864" stroke="#1F3864" stroke-width="0"/></svg>