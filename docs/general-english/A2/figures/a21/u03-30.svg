<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530"><rect width="1280" height="530" fill="#FFFFFF"/><rect x="50.00" y="30.00" width="565.00" height="470.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="50.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#8A5BA6"/><rect x="50.00" y="62.00" width="565.00" height="30.00" fill="#8A5BA6"/><text x="70.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">LILI WRITES AN ADVERT</text><text x="72.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Two rooms on Hill Road.</text><text x="72.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">It has got a balcony and new heating.</text><text x="72.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">It has not got a garage.</text><text x="72.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">The rent is 600 and the deposit is one</text><text x="72.00" y="272.50" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">month.</text><rect x="665.00" y="30.00" width="565.00" height="470.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="665.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#636E79"/><rect x="665.00" y="62.00" width="565.00" height="30.00" fill="#636E79"/><text x="685.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">THE FOUR LINES</text><text x="687.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">1 how many rooms, and where</text><text x="687.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">2 what it has got</text><text x="687.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">3 what it has not got</text><text x="687.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">4 the rent and the deposit</text></svg>