<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="462" viewBox="0 0 1280 462"><rect width="1280" height="462" fill="#FFFFFF"/><rect x="50.00" y="30.00" width="565.00" height="402.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="50.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#2A4A7B"/><rect x="50.00" y="62.00" width="565.00" height="30.00" fill="#2A4A7B"/><text x="70.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">BY TRAIN</text><text x="72.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Leaves every half hour.</text><text x="72.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Twenty-eight minutes to the airport.</text><text x="72.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">You do not have to book.</text><text x="72.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">The fare is eleven pounds.</text><rect x="665.00" y="30.00" width="565.00" height="402.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="665.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#247F7F"/><rect x="665.00" y="62.00" width="565.00" height="30.00" fill="#247F7F"/><text x="685.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">BY BUS</text><text x="687.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Leaves every hour.</text><text x="687.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Fifty-five minutes, through the town.</text><text x="687.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">You have to pay the driver.</text><text x="687.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">The fare is four fifty.</text></svg>