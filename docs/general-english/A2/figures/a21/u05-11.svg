<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="382" viewBox="0 0 1280 382"><rect width="1280" height="382" fill="#FFFFFF"/><rect x="70.00" y="44.00" width="363.58" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">What were you doing?</text><path d="M459.58,79.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M493.58,67.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="529.58" y="44.00" width="382.17" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="551.58" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">I was going downstairs.</text><rect x="70.00" y="148.00" width="359.17" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">What happened then?</text><path d="M455.17,183.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M489.17,171.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="525.17" y="148.00" width="286.75" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="547.17" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">I slipped and fell.</text><rect x="70.00" y="252.00" width="383.73" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Was anybody with you?</text><path d="M479.73,287.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M513.73,275.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="549.73" y="252.00" width="271.28" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="571.73" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">No, I was alone.</text></svg>