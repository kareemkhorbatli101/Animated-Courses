<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="473" viewBox="0 0 1440 473"><rect width="1440" height="473" fill="#FFFFFF"/><rect x="70.0" y="26.4" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="26.4" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="83.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="83.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">Where to get off</text><text x="670.0" y="81.2" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">Get off at the stop by the bridge.</text><rect x="70.0" y="135.9" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="135.9" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="192.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="192.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">Which way</text><text x="670.0" y="190.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">Walk back towards the junction.</text><rect x="70.0" y="245.4" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="245.4" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="302.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">3</text><text x="190.0" y="302.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">One landmark</text><text x="670.0" y="300.2" font-family="DejaVu Sans" font-size="26" font-weight