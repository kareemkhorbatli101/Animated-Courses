<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="657" viewBox="0 0 1440 657"><rect width="1440" height="657" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A flat in your building is empty and the post is piling up?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="219.3" y="282.0" width="84.0" height="52.0" rx="3.0" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><path d="M 219.3 282.0 L 261.3 312.0 L 303.3 282.0" fill="none" stroke="#1F3864" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="281.3" y="286.0" width="18.0" height="14.0" rx="2.0" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Leave it alone</text><text x="261.3" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it costs nothing</text><text x="261.3" y="498.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the pile is bigger every</text><text x="261.3" y="529.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">week</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="690.0" cy="282.0" r="9.1" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><rect x="677.0" y="300.0" width="26.0" height="34.0" rx="8.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><circle cx="720.0" cy="274.0" r="10.5" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><rect x="705.0" y="292.0" width="30.0" height="34.0" rx="8.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><circle cx="750.0" cy="282.0" r="9.1" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><rect x="737.0" y="300.0" width="26.0" height="34.0" rx="8.0" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Ask the other</text><text x="720.0" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">neighbours</text><text x="720.0" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">somebody usually knows</text><text x="720.0" y="521.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">more</text><text x="720.0" y="564.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it is not official yet</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1138.7" y="282.0" width="80.0" height="52.0" rx="4.0" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><rect x="1146.7" y="290.0" width="64.0" height="36.0" rx="2.0" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><line x1="1156.7" y1="302.0" x2="1200.7" y2="302.0" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="1156.7" y1="314.0" x2="1188.7" y2="314.0" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><text x="1178.7" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Write to the council</text><text x="1178.7" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they can find the owner</text><text x="1178.7" y="498.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they ask questions you</text><text x="1178.7" y="529.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">cannot answer</text></svg>