<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="529" viewBox="0 0 1440 529"><rect width="1440" height="529" fill="#FFFFFF"/><rect x="70.0" y="29.2" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="29.2" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="112.7" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="112.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">First</text><text x="670.0" y="95.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">First, warm the teapot and pour the water</text><text x="670.0" y="125.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">away.</text><rect x="70.0" y="192.2" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="192.2" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="275.7" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="275.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">Then</text><text x="670.0" y="273.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">Put in one spoon of tea for each person.</text><rect x="70.0" y="355.2" width="1300.0" height="145.0" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="355.2" width="14.0" height="145.0" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="438.7" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">3</text><text x="190.0" y="438.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">What not to do</text><text x="670.0" y="421.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">Do not press the leaves, because it makes it</text><text x="670.0" y="451.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">bitter.</text></svg>