<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="486" viewBox="0 0 1280 486"><rect width="1280" height="486" fill="#FFFFFF"/><rect x="70.00" y="44.00" width="368.31" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">How long does it take?</text><path d="M464.31,79.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M498.31,67.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="534.31" y="44.00" width="326.66" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="556.31" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">About fifty minutes.</text><rect x="70.00" y="148.00" width="343.36" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Do I have to change?</text><path d="M439.36,183.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M473.36,171.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="509.36" y="148.00" width="401.66" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="531.36" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Only once, at the station.</text><rect x="70.00" y="252.00" width="362.89" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">How much is the fare?</text><path d="M458.89,287.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M492.89,275.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="528.89" y="252.00" width="317.58" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="550.89" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Four fifty, one way.</text><rect x="70.00" y="356.00" width="317.19" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="402.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Where do I get off?</text><path d="M413.19,391.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M447.19,379.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="483.19" y="356.00" width="245.48" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="505.19" y="402.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">At the market.</text></svg>