<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="462" viewBox="0 0 1280 462"><rect width="1280" height="462" fill="#FFFFFF"/><rect x="50.00" y="30.00" width="565.00" height="402.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="50.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#247F7F"/><rect x="50.00" y="62.00" width="565.00" height="30.00" fill="#247F7F"/><text x="70.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A COUGH · WHAT TO DO</text><text x="72.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Drink water every hour.</text><text x="72.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Rest for two or three days.</text><text x="72.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Take one tablet in the morning.</text><text x="72.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Ring us if the fever is still here.</text><rect x="665.00" y="30.00" width="565.00" height="402.00" rx="16" ry="16" fill="#FFF9F0" stroke="#C5CCD3" stroke-width="2"/><rect x="665.00" y="30.00" width="565.00" height="62.00" rx="16" ry="16" fill="#BD423B"/><rect x="665.00" y="62.00" width="565.00" height="30.00" fill="#BD423B"/><text x="685.00" y="72.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="28.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A COUGH · WHAT NOT TO DO</text><text x="687.00" y="136.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Do not smoke.</text><text x="687.00" y="170.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Do not carry anything heavy.</text><text x="687.00" y="204.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Do not take two tablets together.</text><text x="687.00" y="238.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="25.0" font-weight="400" fill="#1F2933" text-anchor="start">Do not go to work with a fever.</text></svg>