<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="382" viewBox="0 0 1280 382"><rect width="1280" height="382" fill="#FFFFFF"/><rect x="70.00" y="44.00" width="343.36" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Do I have to change?</text><path d="M439.36,79.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M473.36,67.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="509.36" y="44.00" width="308.53" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="531.36" y="90.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Yes, at the station.</text><rect x="70.00" y="148.00" width="342.09" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Do we have to book?</text><path d="M438.09,183.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M472.09,171.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.09" y="148.00" width="375.50" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="530.09" y="194.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">No, you do not have to.</text><rect x="70.00" y="252.00" width="350.64" height="70.00" rx="14" ry="14" fill="#BBDCF1" stroke="#3E7AA1" stroke-width="2.5"/><text x="92.00" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">Does he have to pay?</text><path d="M446.64,287.00 h46" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M480.64,275.00 l14,12 l-14,12" fill="none" stroke="#7B8794" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="516.64" y="252.00" width="380.17" height="70.00" rx="14" ry="14" fill="#CEE4B0" stroke="#5A7B2B" stroke-width="2.5"/><text x="538.64" y="298.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="30.0" font-weight="500" fill="#1F2933" text-anchor="start">No, children travel free.</text></svg>