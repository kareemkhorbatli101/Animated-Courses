<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="433" viewBox="0 0 1440 433"><rect width="1440" height="433" fill="#FFFFFF"/><rect x="60.0" y="24.5" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="40.5" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="66.5" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can report what somebody said</text><rect x="60.0" y="104.5" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="120.5" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="146.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can use said, told and asked correctly</text><rect x="60.0" y="184.4" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="200.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="226.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can report a question without making it a question</text><rect x="60.0" y="264.4" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="280.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="306.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can write a note passing on a message in 50–80 words</text><rect x="60.0" y="344.4" width="1320.0" height="64.0" rx="12" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="360.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="386.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can give two accounts of one event and say who said which</text><text x="1330.0" y="386.4" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1F3864" text-anchor="end">PLUS</text></svg>