<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="629" viewBox="0 0 1440 629"><rect width="1440" height="629" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A warning says bad weather might come, and it might not?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="261.3" cy="308.0" r="36.0" fill="#FFFFFF" stroke="#A97C43" stroke-width="6"/><line x1="247.3" y1="294.0" x2="275.3" y2="322.0" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><line x1="275.3" y1="294.0" x2="247.3" y2="322.0" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Do nothing until you</text><text x="261.3" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">are sure</text><text x="261.3" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">no work at all</text><text x="261.3" y="534.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">by then it is in the shop</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="720.0" cy="308.0" r="36.0" fill="#FFFFFF" stroke="#009688" stroke-width="6"/><path d="M 704.0 310.0 L 716.0 324.0 L 738