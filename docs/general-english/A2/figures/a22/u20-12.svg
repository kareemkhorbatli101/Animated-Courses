<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="595" viewBox="0 0 1440 595"><rect width="1440" height="595" fill="#FFFFFF"/><rect x="60.0" y="32.5" width="620.0" height="530.0" rx="18" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="60.0" y="32.5" width="620.0" height="76.0" rx="18" fill="#1F3864" stroke="none" stroke-width="0"/><text x="370.0" y="84.5" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="middle">“The van is outside.”</text><text x="370.0" y="162.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">said like this &#8212; the present</text><line x1="104.0" y1="292.5" x2="636.0" y2="292.5" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><circle cx="253.0" cy="292.5" r="13.0" fill="#C79A5C" stroke="#1F3864" stroke-width="3"/><text x="370.0" y="344.5" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1F3864" text-anchor="middle">now</text><text x="370.0" y="412.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">The words as they were said,</text><text x="370.0" y="452.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">with the mark.</text><rect x="760.0" y="32.5" width="620.0" height="530.0" rx="18" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="760.0" y="32.5" width="620.0" height="76.0" rx="18" fill="#1F3864" stroke="none" stroke-width="0"/><text x="1070.0" y="84.5" font-family="DejaVu Sans" font-size="38" font-weight="bold" fill="#FFFFFF" text-anchor="middle">She said the van was</text><text x="1070.0" y="162.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">reported like this &#8212; one step</text><text x="1070.0" y="202.5" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">back</text><line x1="804.0" y1="292.5" x2="1336.0" y2="292.5" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><circle cx="953.0" cy="292.5" r="13.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><circle cx="1080.6" cy="292.5" r="13.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><circle cx="1208.3" cy="292.5" r="13.0" fill="#009688" stroke="#1F3864" stroke-width="3"/><text x="1070.0" y="344.5" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#1F3864" text-anchor="middle">now</text><text x="1070.0" y="412.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">No mark, and the tense goes</text><text x="1070.0" y="452.5" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">back a step.</text></svg>