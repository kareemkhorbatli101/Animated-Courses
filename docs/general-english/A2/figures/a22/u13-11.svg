<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="473" viewBox="0 0 1440 473"><rect width="1440" height="473" fill="#FFFFFF"/><rect x="70.0" y="26.4" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="26.4" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="83.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">1</text><text x="190.0" y="83.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">One thing you must do</text><text x="670.0" y="81.2" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">You must wash anything you use.</text><rect x="70.0" y="135.9" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="135.9" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="192.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">2</text><text x="190.0" y="192.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">One thing you mustn&#8217;t</text><text x="670.0" y="190.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">You mustn&#8217;t leave food with no name on it.</text><rect x="70.0" y="245.4" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="245.4" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="302.2" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">3</text><text x="190.0" y="302.2" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">The reason</text><text x="670.0" y="300.2" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#1F3864" text-anchor="start">Somebody always throws it out and feels bad.</text><rect x="70.0" y="354.9" width="1300.0" height="91.5" rx="14" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="70.0" y="354.9" width="14.0" height="91.5" rx="0" fill="#009688" stroke="none" stroke-width="0"/><text x="132.0" y="411.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">4</text><text x="190.0" y="411.6" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="start">One thing that is free</text><text x="670.0" y="409.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="start">You don&#8217;t have to buy anything.</text></svg>