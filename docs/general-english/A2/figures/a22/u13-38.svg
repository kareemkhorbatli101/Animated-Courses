DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">station</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="426.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="680.0" y="274.0" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 704.0 324.0 L 714.0 346.0 L 728.0 324.0 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="694.0" y1="290.0" x2="746.0" y2="290.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="694.0" y1="304.0" x2="732.0" y2="304.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Tell each new person</text><text x="720.0" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">yourself</text><text x="720.0" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it is a way of meeting</text><text x="720.0" y="521.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">them</text><text x="720.0" y="564.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you have to be there</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="426.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="1178.7" cy="308.0" r="36.0" fill="#FFFFFF" stroke="#A97C43" stroke-width="6"/><line x1="1164.7" y1="294.0" x2="1192.7" y2="322.0" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><line x1="1192.7" y1="294.0" x2="1164.7" y2="322.0" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><text x="1178.7" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Leave it as it is</text><text x="1178.7" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">nothing to do</text><text x="1178.7" y="498.0" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#1F3864" text-anchor="middle">a new person finds out</text><text x="1178.7" y="527.0" font-family="DejaVu Sans" font-size="24" font-weight="normal" fill="#1F3864" text-anchor="middle">when somebody tells them</text></svg>