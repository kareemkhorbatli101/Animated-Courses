<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="657" viewBox="0 0 1440 657"><rect width="1440" height="657" fill="#FFFFFF"/><rect x="50.0" y="30.0" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="92.0" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Somebody made a plan for your home and did not ask you?</text><path d="M 720.0 126.0 L 720.0 178.0 L 261.3 178.0 L 261.3 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="241.3" cy="308.0" r="13.0" fill="#FFFFFF" stroke="#1F3864" stroke-width="4"/><line x1="254.3" y1="308.0" x2="289.3" y2="308.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="279.3" y1="308.0" x2="279.3" y2="322.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="289.3" y1="308.0" x2="289.3" y2="320.0" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><text x="261.3" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Join in</text><text x="261.3" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">it costs one set of keys</text><text x="261.3" y="498.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you did not choose it</text><path d="M 720.0 126.0 L 720.0 178.0 L 720.0 178.0 L 720.0 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="720.0" cy="308.0" r="36.0" fill="#FFFFFF" stroke="#A97C43" stroke-width="6"/><line x1="706.0" y1="294.0" x2="734.0" y2="322.0" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><line x1="734.0" y1="294.0" x2="706.0" y2="322.0" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><text x="720.0" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Say nothing and leave</text><text x="720.0" y="426.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">it</text><text x="720.0" y="490.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">no work at all</text><text x="720.0" y="534.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you get the good and</text><text x="720.0" y="565.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">none of the work</text><path d="M 720.0 126.0 L 720.0 178.0 L 1178.7 178.0 L 1178.7 228.0" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="228.0" width="422.7" height="396.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1138.7" y="274.0" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 1162.7 324.0 L 1172.7 346.0 L 1186.7 324.0 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1152.7" y1="290.0" x2="1204.7" y2="290.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="1152.7" y1="304.0" x2="1190.7" y2="304.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="1178.7" y="390.0" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Say it is too much</text><text x="1178.7" y="454.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you said what you think</text><text x="1178.7" y="498.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">somebody has to be</text><text x="1178.7" y="529.0" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">wrong first</text></svg>