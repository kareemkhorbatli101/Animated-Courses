<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="433" viewBox="0 0 1440 433"><rect width="1440" height="433" fill="#FFFFFF"/><rect x="60.0" y="24.5" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="40.5" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="66.5" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can describe a person by what they do</text><rect x="60.0" y="104.5" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="120.5" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="146.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can use who, which, that and where correctly</text><rect x="60.0" y="184.4" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="200.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="226.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can point somebody out to somebody else</text><rect x="60.0" y="264.4" width="1320.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="280.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="306.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can describe a person in 50–70 words without using a name</text><rect x="60.0" y="344.4" width="1320.0" height="64.0" rx="12" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="84.0" y="360.4" width="36.0" height="36.0" rx="6" fill="#FFFFFF" stroke="#009688" stroke-width="4"/><text x="156.0" y="386.4" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#1F3864" text-anchor="start">I can correct somebody about a name without a quarrel</text><text x="1330.0" y="386.4" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#1F3864" text-anchor="end">PLUS</text></svg>