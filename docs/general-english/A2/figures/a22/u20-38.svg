<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="599" viewBox="0 0 1440 599"><rect width="1440" height="599" fill="#FFFFFF"/><rect x="50.0" y="29.7" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="91.7" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">You keep notes on what people said. One of them has found out.</text><path d="M 720.0 125.7 L 720.0 177.7 L 261.3 177.7 L 261.3 227.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="227.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="261.3" cy="307.7" r="36.0" fill="#FFFFFF" stroke="#A97C43" stroke-width="6"/><line x1="247.3" y1="293.7" x2="275.3" y2="321.7" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><line x1="275.3" y1="293.7" x2="247.3" y2="321.7" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><text x="261.3" y="389.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Stop</text><text x="261.3" y="453.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she gets what she asked</text><text x="261.3" y="484.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">for</text><text x="261.3" y="527.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she still does not know</text><text x="261.3" y="558.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">what is on it</text><path d="M 720.0 125.7 L 720.0 177.7 L 720.0 177.7 L 720.0 227.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="227.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-widt