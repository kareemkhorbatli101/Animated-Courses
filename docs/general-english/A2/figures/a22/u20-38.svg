ans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">nothing</text><text x="1178.7" y="489.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the notebook goes on</text><text x="1178.7" y="533.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she goes on imagining</text><text x="1178.7" y="564.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">the page</text></svg>