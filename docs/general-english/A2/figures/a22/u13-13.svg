<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440"><rect width="1440" height="440" fill="#FFFFFF"/><rect x="60.0" y="24.8" width="610.0" height="390.0" rx="18" fill="#FFFFFF" stroke="#AEB6C2" stroke-width="3"/><text x="365.0" y="92.8" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#1F3864" text-anchor="middle">The room before</text><rect x="336.4" y="178.8" width="48.4" height="44.0" rx="6.6000000000000005" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><rect x="387.0" y="189.8" width="17.6" height="22.0" rx="8.8" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><rect x="343.0" y="185.4" width="35.2" height="8.8" rx="3.3000000000000003" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><line x1="332.0" y1="229.4" x2="398.0" y2="229.4" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><text x="365.0" y="302.8" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#1F3864" text-anchor="middle">smoke indoors</text><text x="365.0" y="348.8" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#1F3864" text-anchor="middle">thirty years of custom</text><text x="365.0" y="394.8" font-family="DejaVu Sans" font-size="27" font-weight="normal" fill="#1F3864" text-anchor="middle">“it will never hold”</text><rect x="800.0" y="24.8" width="610.0" height="390.0" rx="18" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><text x="1105.0" y="92.8" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#1F3864" text-anchor="middle">The room after</text><rect x="1067.6" y="156.8" width="74.8" height="74.8" rx="5.5" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><line x1="1080.8" y1="174.4" x2="1129.2" y2="174.4" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="1080.8" y1="192.0" x2="1120.4" y2="192.0" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="1080.8" y1="207.4" x2="1129.2" y2="207.4" stroke="#6E88AC" stroke-width="3" stroke-linecap