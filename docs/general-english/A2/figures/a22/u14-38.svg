<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="578" viewBox="0 0 1440 578"><rect width="1440" height="578" fill="#FFFFFF"/><rect x="50.0" y="28.7" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="90.7" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A neighbour is clearly ill and says they are fine?</text><path d="M 720.0 124.7 L 720.0 176.7 L 261.3 176.7 L 261.3 226.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="226.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="261.3" cy="306.7" r="36.0" fill="#FFFFFF" stroke="#A97C43" stroke-width="6"/><line x1="247.3" y1="292.7" x2="275.3" y2="320.7" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><line x1="275.3" y1="292.7" x2="247.3" y2="320.7" stroke="#A97C43" stroke-width="8" stroke-linecap="round"/><text x="261.3" y="388.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Say nothing</text><text x="261.3" y="452.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you ask them for nothing</text><text x="261.3" y="496.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they are worse by</text><text x="261.3" y="527.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">Thursday</text><path d="M 720.0 124.7 L 720.0 176.7 L 720.0 176.7 L 720.0 226.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="226.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="680.0" y="272.7" width="80.0" height="50.0" rx="12.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><path d="M 704.0 322.7 L 714.0 344.7 L 728.0 322.7 Z" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="694.0" y1="288.7" x2="746.0" y2="288.7" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><line x1="694.0" y1="302.7" x2="732.0" y2="302.7" stroke="#6E88AC" stroke-width="3" stroke-linecap="round"/><text x="720.0" y="388.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Ask once and leave it</text><text x="720.0" y="452.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they know you can see it</text><text x="720.0" y="496.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">an ill person has to</text><text x="720.0" y="527.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">answer</text><path d="M 720.0 124.7 L 720.0 176.7 L 1178.7 176.7 L 1178.7 226.7" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="226.7" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><path d="M 1138.7 298.7 Q 1178.7 348.7 1218.7 298.7 Z" fill="#E6C78F" stroke="#1F3864" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1134.7" y1="298.7" x2="1222.7" y2="298.7" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="1162.7" y1="336.7" x2="1194.7" y2="336.7" stroke="#A97C43" stroke-width="4" stroke-linecap="round"/><text x="1178.7" y="388.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Bring something</text><text x="1178.7" y="424.7" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">round</text><text x="1178.7" y="488.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">they do no work at all</text><text x="1178.7" y="532.7" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you may be in the way</text></svg>