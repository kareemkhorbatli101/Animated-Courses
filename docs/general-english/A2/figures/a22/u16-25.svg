ound"/><text x="720.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">Trams</text><text x="720.0" y="288.6" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#1F3864" text-anchor="middle">hard to move, which is why</text><text x="720.0" y="316.6" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#1F3864" text-anchor="middle">they went and why they return</text><rect x="954.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="1130.1" cy="150.7" r="20.7" fill="#FFFFFF" stroke="#1F3864" stroke-width="4"/><circle cx="1189.9" cy="150.7" r="20.7" fill="#FFFFFF" stroke="#1F3864" stroke-width="4"/><line x1="1130.1" y1="150.7" x2="1160.0" y2="118.5" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="1160.0" y1="118.5" x2="1189.9" y2="150.7" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="1130.1" y1="150.7" x2="1189.9" y2="150.7" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="1160.0" y1="118.5" x2="1150.8" y2="104.7" stroke="#1F3864" stroke-width="4" stroke-linecap="round"/><line x1="1139.3" y1="100.1" x2="1162.3" y2="100.1" stroke="#8FA8C8" stroke-width="5" stroke-linecap="round"/><text x="1160.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">The bicycle lane</text><text x="1160.0" y="288.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">kept in the Netherlands,</text><text x="1160.0" y="320.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">and back out of it</text></svg>