<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="592" viewBox="0 0 1440 592"><rect width="1440" height="592" fill="#FFFFFF"/><rect x="50.0" y="29.3" width="1340.0" height="96.0" rx="18" fill="#1F3864" stroke="#1F3864" stroke-width="0"/><text x="720.0" y="91.3" font-family="DejaVu Sans" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Somebody in your building has never spoken to anybody?</text><path d="M 720.0 125.3 L 720.0 177.3 L 261.3 177.3 L 261.3 227.3" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="50.0" y="227.3" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="231.3" y="261.3" width="60.0" height="92.0" rx="4.0" fill="#6E88AC" stroke="#1F3864" stroke-width="3"/><rect x="237.3" y="267.3" width="48.0" height="30.0" rx="2.0" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><circle cx="279.3" cy="311.3" r="5.0" fill="#E6C78F" stroke="#1F3864" stroke-width="2"/><text x="261.3" y="389.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Knock</text><text x="261.3" y="453.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">you meet her at last</text><text x="261.3" y="497.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she has to explain</text><text x="261.3" y="528.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">herself</text><path d="M 720.0 125.3 L 720.0 177.3 L 720.0 177.3 L 720.0 227.3" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508.7" y="227.3" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="678.0" y="281.3" width="84.0" height="52.0" rx="3.0" fill="#FFFFFF" stroke="#1F3864" stroke-width="3"/><path d="M 678.0 281.3 L 720.0 311.3 L 762.0 281.3" fill="none" stroke="#1F3864" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="740.0" y="285.3" width="18.0" height="14.0" rx="2.0" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><text x="720.0" y="389.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Write a note</text><text x="720.0" y="453.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she can answer when</text><text x="720.0" y="484.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she likes</text><text x="720.0" y="527.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">she has to answer</text><text x="720.0" y="558.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">something</text><path d="M 720.0 125.3 L 720.0 177.3 L 1178.7 177.3 L 1178.7 227.3" fill="none" stroke="#009688" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="967.3" y="227.3" width="422.7" height="320.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><circle cx="1178.7" cy="307.3" r="32.0" fill="#6E88AC" stroke="#1F3864" stroke-width="3"/><circle cx="1194.7" cy="295.3" r="26.0" fill="#FFFFFF" stroke="#1F3864" stroke-width="0"/><text x="1178.7" y="389.3" font-family="DejaVu Sans" font-size="30" font-weight="bold" fill="#1F3864" text-anchor="middle">Leave her alone</text><text x="1178.7" y="453.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">four words a year is a</text><text x="1178.7" y="484.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">decision</text><text x="1178.7" y="527.3" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">nobody ever met her</text></svg>