<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="395" viewBox="0 0 1440 395"><rect width="1440" height="395" fill="#FFFFFF"/><rect x="74.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="265.1" y="116.2" width="29.9" height="57.5" rx="5.75" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><rect x="273.1" y="88.6" width="13.8" height="27.6" rx="3.4499999999999997" fill="#8FA8C8" stroke="#1F3864" stroke-width="3"/><rect x="269.6" y="81.7" width="20.7" height="9.2" rx="3.4499999999999997" fill="#A97C43" stroke="#1F3864" stroke-width="3"/><line x1="271.9" y1="134.6" x2="288.1" y2="134.6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><text x="280.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">Glass</text><text x="280.0" y="288.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">melted and made again,</text><text x="280.0" y="320.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">and it can be done for ever</text><rect x="514.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="683.2" y="104.7" width="73.6" height="59.8" rx="4.6" fill="#E6C78F" stroke="#1F3864" stroke-width="3"/><line x1="720.0" y1="104.7" x2="720.0" y2="164.5" stroke="#1F3864" stroke-width="3" stroke-linecap="round"/><line x1="694.7" y1="120.8" x2="710.8" y2="120.8" stroke="#A97C43" stroke-width="3" stroke-linecap="round"/><line x1="729.2" y1="120.8" x2="745.3" y2="120.8" stroke="#A97C43" stroke-width="3" stroke-linecap="round"/><text x="720.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">Paper</text><text x="720.0" y="288.6" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#1F3864" text-anchor="middle">turned into pulp, and the fibres</text><text x="720.0" y="316.6" font-family="DejaVu Sans" font-size="22" font-weight="normal" fill="#1F3864" text-anchor="middle">are shortened each time</text><rect x="954.0" y="22.6" width="412.0" height="350.0" rx="16" fill="#EEF3F9" stroke="#CED4DD" stroke-width="3"/><rect x="1127.8" y="107.0" width="64.4" height="66.7" rx="5.75" fill="#EEF3F9" stroke="#1F3864" stroke-width="3"/><rect x="1120.9" y="95.5" width="78.2" height="13.8" rx="4.6" fill="#6E88AC" stroke="#1F3864" stroke-width="3"/><line x1="1148.5" y1="88.6" x2="1171.5" y2="88.6" stroke="#1F3864" stroke-width="5" stroke-linecap="round"/><line x1="1146.2" y1="118.5" x2="1146.2" y2="164.5" stroke="#AEB6C2" stroke-width="3" stroke-linecap="round"/><line x1="1160.0" y1="118.5" x2="1160.0" y2="164.5" stroke="#AEB6C2" stroke-width="3" stroke-linecap="round"/><line x1="1173.8" y1="118.5" x2="1173.8" y2="164.5" stroke="#AEB6C2" stroke-width="3" stroke-linecap="round"/><text x="1160.0" y="240.6" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#1F3864" text-anchor="middle">Metal</text><text x="1160.0" y="288.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">melted like glass, and it</text><text x="1160.0" y="320.6" font-family="DejaVu Sans" font-size="26" font-weight="normal" fill="#1F3864" text-anchor="middle">loses almost nothing</text></svg>