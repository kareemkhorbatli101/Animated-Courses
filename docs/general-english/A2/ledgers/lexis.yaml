# Append-only glossary ledger. 10 words a unit, 200 across both books.
# E10 and E11 reject any repeat; E09 requires three plantings before Part 10.
units:
  1:
    book: A2.1
    words: [routine, shift, flatmate, neighbour, colleague, commute, appointment, busy, usually, "at the moment"]
  2:
    book: A2.1
    words: [balcony, cupboard, rent, entrance, landing, view, roof, garden, furniture, lift]
  3:
    book: A2.1
    words: [market, bridge, crossing, bench, library, traffic, crowd, ticket, timetable, fare]
  4:
    book: A2.1
    words: [basket, aisle, receipt, fridge, weigh, fresh, slice, bottle, kilo, sugar]
  5:
    book: A2.1
    words: [museum, picnic, concert, guest, beach, forest, village, path, windy, cloudy]
  6:
    book: A2.1
    words: [suitcase, coach, gate, wallet, airport, luggage, delay, charger, spare, taxi]
  7:
    book: A2.1
    words: [quality, value, brand, battery, screen, deal, repair, model, second-hand, offer]
  8:
    book: A2.1
    words: [favour, lend, borrow, advice, course, lesson, beginner, patient, instrument, able]

# Fixed expressions that merely contain a glossary word without carrying its
# meaning. Measured in the source: it says `of course` seven times, from Unit 1
# on, as a discourse marker, and uses the noun `course` only in its own back
# matter ("End of the Course"). So `of course` is one lexical unit and is not an
# occurrence of `course`. E26 strips these before it matches.
fixed_phrases:
  - of course
