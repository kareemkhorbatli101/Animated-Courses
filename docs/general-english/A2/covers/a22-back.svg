<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508"><rect width="2480" height="3508" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="2480.0" height="420.0" rx="0" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="0"/><text x="1240.0" y="200.0" font-family="DejaVu Sans" font-size="62" font-weight="bold" fill="#1F3864" text-anchor="middle">ENGLISH FOR DAILY LIFE</text><text x="1240.0" y="310.0" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#6E88AC" text-anchor="middle">A2 · Volume 2 · Out in the World</text><text x="220.0" y="580.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">Volume two takes the same six people and the same ten-part unit out of the street and</text><text x="220.0" y="645.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">into the rest of life: plans, weather, rules, health, experience, how things are</text><text x="220.0" y="710.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">made, what might happen and what other people said. It ends at the border between A2</text><text x="220.0" y="776.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">and B1. As in volume one, every unit carries a worked example at the top of almost</text><text x="220.0" y="841.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">every task, a filled model before every piece of writing, a word bank under every</text><text x="220.0" y="906.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">gap-fill, and a checklist before you hand anything in. The Core track is for</text><text x="220.0" y="971.9" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">everybody; the Plus track is there when you want it, and optional when you are not.</text><text x="220.0" y="1037.2" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">Answers for every closed question are in the book, and every open task has marking</text><text x="220.0" y="1102.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">points and a sample answer for the person teaching it.</text><text x="220.0" y="1227.9" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">In this book</text><text x="250.0" y="1307.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">1</text><text x="330.0" y="1307.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Plans and Arrangements</text><text x="1280.0" y="1307.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">going to</text><text x="250.0" y="1379.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">2</text><text x="330.0" y="1379.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Weather and What Might Happen</text><text x="1280.0" y="1379.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">will</text><text x="220.0" y="1501.9" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">By the end you will be able to</text><text x="250.0" y="1581.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1581.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can talk about arrangements using the present continuous.</text><text x="250.0" y="1647.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1647.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can talk about decisions using going to.</text><text x="250.0" y="1713.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1713.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can invite somebody, and answer when I am invited.</text><text x="250.0" y="1779.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1779.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can write an invite in 50–70 words.</text><text x="250.0" y="1845.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1845.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can talk about the weather and say what it will do.</text><text x="250.0" y="1911.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1911.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can use will, won&#8217;t and might correctly.</text><text x="1240.0" y="3288.0" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="middle">CEFR A2 · Student Book with answer key · British English</text></svg>