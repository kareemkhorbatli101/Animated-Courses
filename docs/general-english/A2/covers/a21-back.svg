<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508"><rect width="2480" height="3508" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="2480.0" height="420.0" rx="0" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="0"/><text x="1240.0" y="200.0" font-family="DejaVu Sans" font-size="62" font-weight="bold" fill="#1F3864" text-anchor="middle">ENGLISH FOR DAILY LIFE</text><text x="1240.0" y="310.0" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#6E88AC" text-anchor="middle">A2 · Volume 1 · Everyday Life</text><text x="220.0" y="580.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">English for Daily Life takes an adult beginner who already knows a little English and</text><text x="220.0" y="645.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">gives them the present and the past: what is, what they do, and what happened. One</text><text x="220.0" y="710.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">unit follow six people who live at one address, so the vocabulary comes back week</text><text x="220.0" y="776.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">after week instead of arriving once and leaving. Every unit has the same ten parts,</text><text x="220.0" y="841.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">the same twelve kinds of exercise and the same support: a worked example at the top</text><text x="220.0" y="906.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">of almost every task, a model before every piece of writing, a word bank under every</text><text x="220.0" y="971.9" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">gap-fill and a checklist before you hand anything in. The Core track is for</text><text x="220.0" y="1037.2" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">everybody. The Plus track at the back of each unit is there when you are ready for</text><text x="220.0" y="1102.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">it, and optional when you are not. Answers for every closed question are in the book.</text><text x="220.0" y="1227.9" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">In this book</text><text x="250.0" y="1307.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">1</text><text x="330.0" y="1307.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">People and Routines</text><text x="1280.0" y="1307.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">present simple</text><text x="220.0" y="1429.9" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">By the end you will be able to</text><text x="250.0" y="1509.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1509.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can name the people around me: neighbour, flatmate, colleague.</text><text x="250.0" y="1575.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1575.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can use the present simple for routines and the present continuous for now.</text><text x="250.0" y="1641.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1641.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can understand a short conversation between neighbours.</text><text x="250.0" y="1707.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="1707.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can describe a person&#8217;s day in 50–70 words.</text><text x="1240.0" y="3288.0" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="middle">CEFR A2 · Student Book with answer key · British English</text></svg>