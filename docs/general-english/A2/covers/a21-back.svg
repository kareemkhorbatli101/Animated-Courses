<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 2480 3508"><rect width="2480" height="3508" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="2480.0" height="420.0" rx="0" fill="#EEF3F9" stroke="#EEF3F9" stroke-width="0"/><text x="1240.0" y="200.0" font-family="DejaVu Sans" font-size="62" font-weight="bold" fill="#1F3864" text-anchor="middle">ENGLISH FOR DAILY LIFE</text><text x="1240.0" y="310.0" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#6E88AC" text-anchor="middle">A2 · Volume 1 · Everyday Life</text><text x="220.0" y="580.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">English for Daily Life takes an adult beginner who already knows a little English and</text><text x="220.0" y="645.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">gives them the present and the past: what is, what they do, and what happened. Nine</text><text x="220.0" y="710.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">units follow six people who live at one address, so the vocabulary comes back week</text><text x="220.0" y="776.0" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">after week instead of arriving once and leaving. Every unit has the same ten parts,</text><text x="220.0" y="841.3" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">the same twelve kinds of exercise and the same support: a worked example at the top</text><text x="220.0" y="906.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">of almost every task, a model before every piece of writing, a word bank under every</text><text x="220.0" y="971.9" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">gap-fill and a checklist before you hand anything in. The Core track is for</text><text x="220.0" y="1037.2" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">everybody. The Plus track at the back of each unit is there when you are ready for</text><text x="220.0" y="1102.6" font-family="DejaVu Sans" font-size="46" font-weight="normal" fill="#1F3864" text-anchor="start">it, and optional when you are not. Answers for every closed question are in the book.</text><text x="220.0" y="1227.9" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">In this book</text><text x="250.0" y="1307.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">1</text><text x="330.0" y="1307.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">People and Routines</text><text x="1280.0" y="1307.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">present simple</text><text x="250.0" y="1379.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">2</text><text x="330.0" y="1379.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Home and Neighbourhood</text><text x="1280.0" y="1379.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">there is/are</text><text x="250.0" y="1451.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">3</text><text x="330.0" y="1451.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">A Day in the City</text><text x="1280.0" y="1451.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">present continuous vs present simple</text><text x="250.0" y="1523.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">4</text><text x="330.0" y="1523.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Food and Shopping</text><text x="1280.0" y="1523.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">countable/uncountable</text><text x="250.0" y="1595.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">5</text><text x="330.0" y="1595.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Last Weekend</text><text x="1280.0" y="1595.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">past simple - was/were and regular verbs</text><text x="250.0" y="1667.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">6</text><text x="330.0" y="1667.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Journeys and Mishaps</text><text x="1280.0" y="1667.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">past simple - irregular verbs</text><text x="250.0" y="1739.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">7</text><text x="330.0" y="1739.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Choosing and Comparing</text><text x="1280.0" y="1739.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">comparatives and superlatives</text><text x="250.0" y="1811.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">8</text><text x="330.0" y="1811.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Help and Ability</text><text x="1280.0" y="1811.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">can/can't</text><text x="250.0" y="1883.9" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#6E88AC" text-anchor="middle">9</text><text x="330.0" y="1883.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#1F3864" text-anchor="start">Finding Your Way</text><text x="1280.0" y="1883.9" font-family="DejaVu Sans" font-size="38" font-weight="normal" fill="#6E88AC" text-anchor="start">prepositions of place</text><text x="220.0" y="2005.9" font-family="DejaVu Sans" font-size="54" font-weight="bold" fill="#1F3864" text-anchor="start">By the end you will be able to</text><text x="250.0" y="2085.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="2085.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can name the people around me: neighbour, flatmate, colleague.</text><text x="250.0" y="2151.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="2151.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can use the present simple for routines and the present continuous for now.</text><text x="250.0" y="2217.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="2217.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can understand a short conversation between neighbours.</text><text x="250.0" y="2283.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="2283.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can describe a person&#8217;s day in 50–70 words.</text><text x="250.0" y="2349.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="2349.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can name the rooms and parts of a building.</text><text x="250.0" y="2415.9" font-family="DejaVu Sans" font-size="42" font-weight="bold" fill="#009688" text-anchor="middle">·</text><text x="320.0" y="2415.9" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="start">I can use there is and there are, and some, any, much and many.</text><text x="1240.0" y="3288.0" font-family="DejaVu Sans" font-size="40" font-weight="normal" fill="#1F3864" text-anchor="middle">CEFR A2 · Student Book with answer key · British English</text></svg>