<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520"><rect width="1280" height="520" fill="#D6B490"/><rect x="217.00" y="58.00" width="860.00" height="424.00" rx="4" ry="4" fill="#1F2933" opacity="0.16"/><rect x="210.00" y="48.00" width="860.00" height="424.00" rx="4" ry="4" fill="#FFFFFF" stroke="#C5CCD3" stroke-width="2"/><rect x="210.00" y="48.00" width="860.00" height="70.00" fill="#8A5BA6"/><text x="238.00" y="94.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="32.0" font-weight="700" fill="#FFFFFF" text-anchor="start">A LETTER FROM LILI</text><text x="240.00" y="176.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="600" fill="#1F2933" text-anchor="start">To</text><text x="1040.00" y="176.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="400" fill="#1F2933" text-anchor="end">everyone on Hill Road</text><line x1="240.00" y1="192.00" x2="1040.00" y2="192.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="240.00" y="232.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="600" fill="#1F2933" text-anchor="start">Day</text><text x="1040.00" y="232.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="400" fill="#1F2933" text-anchor="end">2 June</text><line x1="240.00" y1="248.00" x2="1040.00" y2="248.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="240.00" y="288.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="600" fill="#1F2933" text-anchor="start">News</text><text x="1040.00" y="288.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="400" fill="#1F2933" text-anchor="end">a new job in Spain</text><line x1="240.00" y1="304.00" x2="1040.00" y2="304.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="240.00" y="344.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="600" fill="#1F2933" text-anchor="start">Back</text><text x="1040.00" y="344.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="400" fill="#1F2933" text-anchor="end">next June</text><line x1="240.00" y1="360.00" x2="1040.00" y2="360.00" stroke="#D6D3CD" stroke-width="1.5" stroke-linecap="round"/><text x="240.00" y="400.00" font-family="Inter, DejaVu Sans, sans-serif" font-size="27.0" font-weight="400" fill="#1F2933" text-anchor="start">Thank you for a wonderful year. I will write every month.</text><circle cx="236.00" cy="62.00" r="11.00" fill="#D34A42"/><circle cx="233.00" cy="59.00" r="4.00" fill="#E69B97"/><circle cx="1044.00" cy="62.00" r="11.00" fill="#D34A42"/><circle cx="1041.00" cy="59.00" r="4.00" fill="#E69B97"/></svg>