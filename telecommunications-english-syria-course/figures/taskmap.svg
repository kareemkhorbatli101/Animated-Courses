<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300">
<rect width="980" height="300" fill="#fff"/><g font-family="Calibri,Arial">
<text x="490" y="20" text-anchor="middle" fill="#1F3864" font-size="17" font-weight="bold">ONE BATTERY IN THREE PARTS — the three forms partition the text and never test the same thing twice</text>
<g font-size="14" font-weight="bold">
<rect x="230" y="34" width="238" height="30" rx="6" fill="#1F3864"/><text x="349" y="54" text-anchor="middle" fill="#fff">MATCHING → STRUCTURE</text>
<rect x="474" y="34" width="238" height="30" rx="6" fill="#0F6E6E"/><text x="593" y="54" text-anchor="middle" fill="#fff">TRUE / FALSE → DETAIL</text>
<rect x="718" y="34" width="238" height="30" rx="6" fill="#C55A11"/><text x="837" y="54" text-anchor="middle" fill="#fff">GAP-FILL → THE WHOLE</text></g>
<g font-size="12" fill="#595959"><text x="349" y="78" text-anchor="middle">what each part is FOR</text><text x="593" y="78" text-anchor="middle">the facts, and what is NOT said</text><text x="837" y="78" text-anchor="middle">reconstruct the message</text></g>
<g font-size="15" font-weight="bold"><text x="10" y="112" fill="#1F3864">READING</text><text x="10" y="162" fill="#0F6E6E">LISTENING</text><text x="10" y="212" fill="#C55A11">WRITING</text><text x="10" y="262" fill="#C55A11">CASE STUDY</text></g>
<g font-size="13">
<rect x="230" y="92" width="238" height="34" rx="6" fill="#DEEAF6" stroke="#1F3864"/><text x="349" y="114" text-anchor="middle" fill="#1F3864">line → its job in the document</text>
<rect x="474" y="92" width="238" height="34" rx="6" fill="#E2F0EF" stroke="#0F6E6E"/><text x="593" y="114" text-anchor="middle" fill="#0F6E6E">6 statements on dates, names, figures</text>
<rect x="718" y="92" width="238" height="34" rx="6" fill="#FFF2CC" stroke="#C55A11"/><text x="837" y="114" text-anchor="middle" fill="#C55A11">summary of the text, 5 gaps</text>
<rect x="230" y="142" width="238" height="34" rx="6" fill="#DEEAF6" stroke="#1F3864"/><text x="349" y="164" text-anchor="middle" fill="#1F3864">speaker → what they want</text>
<rect x="474" y="142" width="238" height="34" rx="6" fill="#E2F0EF" stroke="#0F6E6E"/><text x="593" y="164" text-anchor="middle" fill="#0F6E6E">said / not said — two of the six</text>
<rect x="718" y="142" width="238" height="34" rx="6" fill="#FFF2CC" stroke="#C55A11"/><text x="837" y="164" text-anchor="middle" fill="#C55A11">complete the real form from the call</text>
<rect x="230" y="192" width="238" height="34" rx="6" fill="#DEEAF6" stroke="#1F3864"/><text x="349" y="214" text-anchor="middle" fill="#1F3864">sentence → opening/fact/reason/ask</text>
<rect x="474" y="192" width="238" height="34" rx="6" fill="#E2F0EF" stroke="#0F6E6E"/><text x="593" y="214" text-anchor="middle" fill="#0F6E6E">6 statements on the conventions</text>
<rect x="718" y="192" width="238" height="34" rx="6" fill="#FFF2CC" stroke="#C55A11"/><text x="837" y="214" text-anchor="middle" fill="#C55A11">the gapped model → then their own</text>
<rect x="230" y="242" width="238" height="34" rx="6" fill="#DEEAF6" stroke="#1F3864"/><text x="349" y="264" text-anchor="middle" fill="#1F3864">document → what it alone proves</text>
<rect x="474" y="242" width="238" height="34" rx="6" fill="#E2F0EF" stroke="#0F6E6E"/><text x="593" y="264" text-anchor="middle" fill="#0F6E6E">what the pack does NOT establish</text>
<rect x="718" y="242" width="238" height="34" rx="6" fill="#FFF2CC" stroke="#C55A11"/><text x="837" y="264" text-anchor="middle" fill="#C55A11">the output template, gapped</text>
</g>
<text x="490" y="292" text-anchor="middle" fill="#595959" font-size="13">All three appear in EVERY cycle. No fact is tested twice; together they cover the text once. Two discussion questions follow.</text>
</g></svg>
