<svg xmlns="http://www.w3.org/2000/svg" width="980" height="230" viewBox="0 0 980 230">
<rect width="980" height="230" fill="#fff"/><g font-family="Calibri,Arial">
<text x="490" y="20" text-anchor="middle" fill="#1F3864" font-size="17" font-weight="bold">THE LADDER — one colour per course, and the responsibility rises with it</text>
<rect x="30"  y="140" width="280" height="62" rx="10" fill="#E2F0EF" stroke="#0F6E6E" stroke-width="3"/>
<rect x="350" y="92"  width="280" height="62" rx="10" fill="#DEEAF6" stroke="#1F3864" stroke-width="3"/>
<rect x="670" y="44"  width="280" height="62" rx="10" fill="#FBE5D6" stroke="#C55A11" stroke-width="3"/>
<g font-size="16" font-weight="bold"><text x="170" y="166" text-anchor="middle" fill="#0F6E6E">COURSE 1 · Pre-Intermediate</text>
<text x="490" y="118" text-anchor="middle" fill="#1F3864">COURSE 2 · Intermediate</text>
<text x="810" y="70"  text-anchor="middle" fill="#C55A11">COURSE 3 · Upper-Intermediate</text></g>
<g font-size="14" fill="#444"><text x="170" y="188" text-anchor="middle">answerable for your own work</text>
<text x="490" y="140" text-anchor="middle">answerable for a task, file or client</text>
<text x="810" y="92"  text-anchor="middle">answerable for other people's work</text></g>
<g stroke="#A6A6A6" stroke-width="2" stroke-dasharray="5,4"><line x1="310" y1="160" x2="350" y2="130"/><line x1="630" y1="112" x2="670" y2="82"/></g>
<g font-size="13" fill="#595959"><text x="170" y="218" text-anchor="middle">teal · 12 sessions · 24 h</text><text x="490" y="218" text-anchor="middle">navy · 12 sessions · 24 h</text><text x="810" y="218" text-anchor="middle">orange · 12 sessions · 24 h</text></g>
</g></svg>
