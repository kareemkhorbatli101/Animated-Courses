<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimatedEverything</title>
<!--
  AnimatedEverything - the course catalogue. Engineered by Mohamad Khorbatli.

  The rules this page obeys are specified and checked in tools/frontend_checks.py (240 checks). Where a
  behaviour here looks arbitrary, it is not: it has a check, and changing it should change a check.

  Three language axes, independent (v4 s3):   catalogue text / spoken audio / one-or-two subtitle tracks.
  The page chrome is ENGLISH, always. Only the layout mirrors when the catalogue is Arabic.
-->
<style>
:root{
  /* Contrast-checked, not chosen by eye. --border was wrong twice at 1.4:1 and 1.75:1 before being
     solved numerically to 3.02:1 on --surface, which WCAG 1.4.11 requires of a control boundary. */
  --bg:#0E1116; --surface:#161B22; --surface2:#1F262E; --border:#5B677A;
  --text:#E6EDF3; --muted:#A9B4C0; --accent:#E8B418; --onAccent:#1A1200;
  --focus:#58A6FF; --danger:#E5534B; --ok:#3FB950;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans Arabic",sans-serif;
  --rail:340px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---- header ------------------------------------------------------------------------------- */
header{display:flex;align-items:baseline;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{margin:0;font-size:19px;letter-spacing:.2px;font-weight:650}
header h1 b{color:var(--accent);font-weight:650}
header .credit{color:var(--muted);font-size:12.5px}
header .spacer{flex:1}

/* ---- layout ------------------------------------------------------------------------------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:calc(100% - 53px)}
/* THE ASK PANE IS A THIRD COLUMN, not an overlay: it must be able to sit open beside the video
   while the lesson plays, the same way the rail does. Absent until asked for. */
#app.hasask{grid-template-columns:var(--rail) 1fr var(--askw,380px)}
#app.theatre.hasask{grid-template-columns:0 1fr var(--askw,380px)}
#app.theatre{grid-template-columns:0 1fr}
#app.theatre #browse{display:none}
#app.full #browse,#app.full header{display:none}

/* THE RAIL IS A COLUMN, not one scrolling block: filters, the tree, a splitter, the camera area.
   The tree takes what is left (1fr) and scrolls on its own, so the camera area can be given
   height without the tree collapsing to nothing. */
#browse{background:var(--surface);border-right:1px solid var(--border);padding:12px;
        display:grid;grid-template-rows:auto minmax(120px,1fr);gap:0;min-height:0;overflow:hidden}
#browse.hascam{grid-template-rows:auto minmax(120px,1fr) auto var(--camh,300px)}
#tree{overflow-y:auto;min-height:0}
#railsplit{height:10px;margin:6px -12px 2px;cursor:row-resize;display:none;
           align-items:center;justify-content:center;border-top:1px solid var(--border)}
#browse.hascam #railsplit{display:flex}
#railsplit i{display:block;width:44px;height:4px;border-radius:3px;background:var(--surface2);
             border:1px solid var(--border)}
#railsplit:hover i,#railsplit:focus-visible i{background:var(--accent);border-color:var(--accent)}
#railsplit:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#railcam{overflow-y:auto;min-height:0;display:none}
#browse.hascam #railcam{display:block}
#browse[dir=rtl]{border-right:0;border-left:1px solid var(--border)}
#main{display:flex;flex-direction:column;min-width:0;overflow-y:auto}

/* ---- the script -----------------------------------------------------------------------------
   TRACK A STANDS ALONE. The dialogue with speaker names, timings and both languages is a render of
   data the scene already holds - no model, no Ollama, nothing to install. It is also mode-independent:
   it reads the lesson's own scene file, so it works while watching the MP4 as well. */
#script{display:none;border-top:1px solid var(--border);background:var(--surface);padding:10px 15px}
#script.on{display:block}
#script h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600;
           display:flex;align-items:center;gap:10px}
#script h3 button{background:var(--surface2);border:1px solid var(--border);color:var(--text);
                  border-radius:6px;padding:3px 9px;font-size:11.5px;cursor:pointer}
#scriptbody{max-height:280px;overflow-y:auto}
.sline{display:grid;grid-template-columns:52px 84px 1fr;gap:10px;padding:5px 6px;border-radius:6px;
       cursor:pointer;align-items:start}
.sline:hover{background:var(--surface2)}
.sline.now{background:#1D2530;box-shadow:inset 2px 0 0 var(--accent)}
.sline .t{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.sline .who{color:var(--accent);font-size:12.5px;font-weight:600}
.sline .who i{display:block;color:var(--muted);font-weight:400;font-size:10.5px;font-style:normal}
.sline .say{font-size:13px;line-height:1.45}
.sline .say span{display:block}
.sline .say .alt{color:var(--muted);font-size:12.5px}

/* ---- the camera surfaces ------------------------------------------------------------------
   ONE state, several views of it. Neither the rail panel, the floating panel, nor either tab
   owns the camera: all of them render it and all of them send edits to the same place. That is
   the rule that makes drive() the single interpreter and tools/wire.py the single wire model.
   Everything here is ENGLISH, like every other control on the page, whatever the catalogue. */
.campanel{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px}
#campanel{position:absolute;right:14px;top:84px;width:284px;z-index:6;display:none;
          box-shadow:0 10px 30px rgba(0,0,0,.45)}
#campanel.on{display:block}
.camhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.camhead b{font-size:13.5px;flex:1}
.camhead button{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:2px 4px}
.camhead .x{color:var(--muted)}
.seg{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.seg button{flex:0 0 auto;background:var(--surface2);color:var(--text);border:1px solid var(--border);
            border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--onAccent);border-color:var(--accent);
                               font-weight:600}
.camtabs{display:flex;gap:5px;border-bottom:1px solid var(--border);margin-bottom:8px}
.camtabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
                padding:5px 10px;cursor:pointer;font-size:12.5px}
.camtabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.camsect{color:var(--muted);font-size:10.5px;letter-spacing:.06em;margin:8px 0 4px}
.camrow{display:grid;grid-template-columns:1fr auto auto auto auto;align-items:center;gap:4px;
        margin-bottom:4px}
.camrow label{font-size:12px;color:var(--muted)}
.camrow button{background:var(--surface2);border:1px solid var(--border);color:var(--text);
               border-radius:5px;width:24px;height:24px;cursor:pointer;line-height:1}
.camrow input{width:58px;padding:3px 5px;border-radius:5px;border:1px solid var(--border);
              background:#10151B;color:var(--text);font-size:12px;text-align:right}
.camrow input[readonly]{color:var(--muted);border-color:#2A323C}
.camrow .u{font-size:10.5px;color:var(--muted);width:22px}
/* the pad */
.padwrap{position:relative;margin:6px 0 4px}
#campad,#railpad{width:100%;aspect-ratio:1/1;border-radius:50%;background:#10151B;
                 border:1px solid var(--border);touch-action:none;cursor:grab;display:block}
#campad:active,#railpad:active{cursor:grabbing}
.padnote{font-size:11px;color:var(--muted);margin:2px 0 6px}
.padcap{font-size:12px;color:var(--accent);margin-bottom:4px}
.stops{display:flex;gap:3px;margin-bottom:4px}
.stops button{flex:1;background:#10151B;border:1px solid var(--border);color:var(--muted);
              border-radius:6px;padding:4px 2px;font-size:11.5px;cursor:pointer}
.stops button[aria-pressed=true]{background:var(--accent);color:var(--onAccent);font-weight:650}
.behav{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-bottom:4px}
.behav button{background:#10151B;border:1px solid var(--border);color:var(--muted);border-radius:11px;
              padding:3px 10px;font-size:11px;cursor:pointer}
.behav button[aria-pressed=true]{background:var(--accent);color:var(--onAccent)}
.camfoot{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.camfoot select{background:#10151B;border:1px solid var(--border);color:var(--text);border-radius:6px;
                padding:3px 6px;font-size:11.5px}
.camfoot button{background:var(--surface2);border:1px solid var(--border);color:var(--text);
                border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer}
#camsay{font-size:11.5px;color:var(--accent);margin-top:6px}
/* the checkbox, in the axes row */
.axis.chk{display:flex;align-items:flex-end}
.axis.chk label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;
                padding:7px 10px;border:1px solid var(--border);border-radius:7px;
                background:var(--surface2)}
.axis.chk input{accent-color:var(--accent);width:15px;height:15px}
.axis.chk label[aria-disabled=true]{opacity:.45;cursor:not-allowed}
/* Download is HIDDEN in the interactive modes, so its slot is RESERVED - otherwise the checkbox
   to its right would slide sideways every time the mode changed. */
.axis.dlslot{min-width:132px}
/* Download and the checkbox are ONE wrapping unit, so the row may fold but never between them. */
.dlgroup{display:flex;align-items:flex-end;gap:16px}

/* ---- filters ------------------------------------------------------------------------------ */
.filters{display:grid;gap:8px;margin-bottom:12px}
.filters input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2)}
.filters input::placeholder{color:var(--muted)}
.clear{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12.5px;padding:2px;text-align:start}
.clear:hover{color:var(--text)}

/* ---- the tree ----------------------------------------------------------------------------- */
.course{margin-bottom:4px}
.crow{display:flex;align-items:center;gap:8px;width:100%;padding:8px 9px;border-radius:7px;background:none;border:0;cursor:pointer;text-align:start}
.crow:hover{background:var(--surface2)}
.tw{color:var(--muted);font-size:11px;width:11px;flex:none;transition:transform .12s}
.course.open .tw{transform:rotate(90deg)}
[dir=rtl] .course.open .tw{transform:rotate(-90deg)}
.ctitle{font-weight:600;flex:1;min-width:0}
.count{color:var(--muted);font-size:12px;flex:none}
.videos{display:none;margin:2px 0 8px 0;padding-inline-start:19px;border-inline-start:1px solid var(--border)}
.course.open .videos{display:block}
.vrow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;background:none;border:0;cursor:pointer;text-align:start}
.vrow:hover{background:var(--surface2)}
.vrow.active{background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
[dir=rtl] .vrow.active{box-shadow:inset -3px 0 0 var(--accent)}
.vtitle{flex:1;min-width:0}
.vmeta{color:var(--muted);font-size:12px;flex:none;font-variant-numeric:tabular-nums}
.idonly{color:var(--danger);font-style:italic}
.empty{color:var(--muted);padding:14px 4px;font-size:13px}
.empty b{color:var(--text);font-weight:600}
.widen{margin-top:9px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:7px 11px;cursor:pointer;color:var(--text)}

/* ---- stage -------------------------------------------------------------------------------- */
#stagewrap{position:relative;background:#000;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 210px)}
#app.full #stagewrap{max-height:100vh;height:100vh}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage canvas{max-width:100%;max-height:100%;display:block}
#vid{position:absolute;inset:0;width:100%;height:100%;background:#000;display:none}
#vid.on{display:block}
.dl{display:inline-block;padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;font-size:12.5px}
.dl:hover{border-color:var(--accent);color:var(--accent)}
#axmode{min-width:230px}
#axmode option:disabled{color:var(--muted)}
#overlay{position:absolute;inset:0;pointer-events:none}
#poster{position:absolute;inset:0;background:#000 center/contain no-repeat;opacity:.45}

/* ---- the loading panel: a NUMBER past 10 s, never a spinner ------------------------------- */
#load{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px;background:rgba(14,17,22,.82);padding:22px;text-align:center}
#load.on{display:flex}
#load .what{font-weight:600}
#load .bar{width:min(460px,80%);height:7px;border-radius:4px;background:var(--surface2);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#load .bar.indet i{width:35%;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-inline-start:-35%}100%{margin-inline-start:100%}}
#load .nums{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
#load .stall{color:var(--accent);font-size:12.5px;min-height:1.2em}
#load .err{color:var(--danger)}
#load .btns{display:flex;gap:9px}
#load button{background:var(--accent);color:var(--onAccent);border:0;border-radius:7px;padding:7px 15px;font-weight:600;cursor:pointer}
#load button.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:500}

/* ---- controls ----------------------------------------------------------------------------- */
#bar{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border)}
#bar button{background:var(--accent);color:var(--onAccent);border:0;border-radius:7px;padding:7px 17px;font-weight:650;cursor:pointer}
#bar button[disabled]{opacity:.4;cursor:default}
#bar button.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:500}
#bar button.ghost[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#scrub{flex:1;min-width:70px;accent-color:var(--accent)}
#time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
#axes{display:flex;flex-wrap:wrap;gap:16px;padding:11px 15px;border-bottom:1px solid var(--border);background:var(--surface)}
.axis{display:flex;align-items:center;gap:7px}
.axis label{color:var(--muted);font-size:12.5px}
.axis select{padding:6px 9px;border-radius:7px;border:1px solid var(--border);background:var(--surface2)}
.axis select option:disabled{color:var(--muted)}
#about{padding:15px;color:var(--muted);font-size:13px}
#about h2{color:var(--text);font-size:16px;margin:0 0 5px}
#about .desc{margin:0 0 9px}
#note{padding:0 15px 15px;color:var(--muted);font-size:12.5px}

/* ---- the Ask pane -----------------------------------------------------------------------------
   Deliberately the same furniture as the left rail: one surface, one border, the same tokens. It is
   part of the page, not a widget bolted to it. */
#ask{background:var(--surface);border-left:1px solid var(--border);padding:10px;display:none;
     grid-template-rows:auto auto auto auto minmax(var(--logmin,220px),1fr) auto;
     gap:8px;min-height:0;overflow:hidden}
#app.hasask #ask{display:grid}
.askhead{display:flex;align-items:center;gap:8px}
.askhead .prov{max-width:120px;flex:none}
.dlmodel{width:100%;justify-content:center;background:var(--accent);color:var(--onAccent);
         border-color:var(--accent);font-weight:600}
.askhead .modelsel{flex:1;min-width:0;background:var(--surface2);color:var(--text);
                   border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-size:12.5px}
/* The dot is a function of the SELECTED model, never of the server. Selecting a model that has not
   answered turns it off - that was a real defect, not a hypothetical one. */
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)}
.dot.wait{background:var(--accent)} .dot.off{background:var(--muted);opacity:.5}
.askstate{color:var(--muted);font-size:12px;min-height:16px}
.setup{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;
       font-size:12.5px;color:var(--muted)}
.setup p{margin:0 0 6px} .setup ol{margin:0 0 8px 18px;padding:0} .setup li{margin:3px 0}
.setup a{color:var(--focus)}
.askacts{display:grid;gap:4px}
.ibtn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;
      padding:5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px}
.ibtn span{font-size:12.5px}
.ibtn:hover{border-color:var(--accent)}
.ibtn.on{border-color:var(--accent);color:var(--accent)}
.ibtn.primary{background:var(--accent);color:var(--onAccent);border-color:var(--accent);font-weight:600}
.ibtn:disabled{opacity:.45;cursor:default}
.ibtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* THE LOG DOES NOT SQUEEZE. Its row was minmax(80px,1fr), so as the rows around it grew a reader
   ended up peering at two lines through a slot. It now keeps a real minimum and SCROLLS, and the
   pane itself never outgrows the viewport. */
.asklog{overflow-y:auto;min-height:var(--logmin,220px);display:flex;flex-direction:column;
        gap:8px;padding-right:2px}
.turn .ibtn.expand{margin-top:6px;padding:2px 7px;font-size:12px;line-height:1.3}
/* ---- the expand modal ------------------------------------------------------------------- */
.modalback{position:fixed;inset:0;background:rgba(6,8,12,.72);display:flex;align-items:center;
           justify-content:center;z-index:80;padding:24px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;
       width:min(820px,94vw);max-height:86vh;display:grid;grid-template-rows:auto 1fr auto;
       box-shadow:0 18px 60px rgba(0,0,0,.55)}
.modal h4{margin:0;padding:12px 14px;font-size:14px;border-bottom:1px solid var(--border)}
.modal .mbody{overflow:auto;padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.modal .mfoot{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;
              border-top:1px solid var(--border)}
@media (max-width:760px){.modalback{padding:10px}.modal{width:100%;max-height:92vh}}
.turn{border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.45}
.turn.you{background:var(--surface2);border:1px solid var(--border)}
.turn.ai{background:transparent;border:1px solid var(--border)}
.turn .body{white-space:pre-wrap}
.turn .ghost{margin-top:6px;background:none;border:0;color:var(--muted);font-size:11.5px;
             text-decoration:underline;cursor:pointer;padding:0}
/* The measured facts, verbatim. An assistant that cites facts nobody can inspect is the thing this
   design exists to avoid, so the block is always one click away. */
.ground{white-space:pre-wrap;font-size:11px;color:var(--muted);background:var(--bg);
        border:1px solid var(--border);border-radius:6px;padding:7px;margin:6px 0 0;
        max-height:220px;overflow:auto}
.askform{display:grid;gap:6px}
.askinput{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);
          border-radius:6px;padding:7px;font-size:13px;resize:vertical}
.askrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.askrow .grow{flex:1}
.langsel{background:var(--surface2);color:var(--text);border:1px solid var(--border);
         border-radius:6px;padding:4px 5px;font-size:11.5px;max-width:132px}
/* A NARROW WINDOW MUST NOT SILENTLY SWALLOW THE PANE. The first version hid it outright below
   1100px, so ticking the box did nothing visible at all and the feature looked absent rather than
   unavailable - which is the exact complaint it produced. Something a person just switched on has to
   appear. So the LEFT rail yields instead: the lesson list is a few clicks away, the pane the viewer
   just asked for is not. */
@media (max-width:1100px){#app.hasask{grid-template-columns:0 1fr var(--askw,340px)}
                          #app.hasask #browse{display:none}}
@media (max-width:760px){#app.hasask{grid-template-columns:0 1fr}
                         #app.hasask #ask{position:fixed;inset:53px 0 0 auto;width:min(92vw,360px);
                                          z-index:40;box-shadow:-8px 0 24px rgba(0,0,0,.45)}}
@media (max-width:820px){#app{grid-template-columns:1fr;height:auto}#browse{border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head><body>

<header>
  <h1><b>Animated</b>Everything</h1>
  <span class="credit">engineered by Mohamad Khorbatli</span>
  <span class="spacer"></span>
  <span class="credit" id="tally"></span>
</header>

<div id="app">
  <!-- The browse rail. `dir` is set from the CATALOGUE axis only; the labels below stay English. -->
  <aside id="browse">
    <div class="filters">
      <!-- English labels, always. `dir=auto` so typing Arabic into them is not shown reversed. -->
      <input id="fcourse" type="search" dir="auto" placeholder="Filter course" aria-label="Filter course">
      <input id="fvideo"  type="search" dir="auto" placeholder="Filter video"  aria-label="Filter video">
      <button class="clear" id="fclear" hidden>Clear filters</button>
    </div>
    <div id="tree"></div>
    <!-- Drag to trade height between the tree and the camera area. Both keep a minimum, so
         neither can be crushed to nothing, and each scrolls on its own. -->
    <div id="railsplit" role="separator" aria-orientation="horizontal" tabindex="0"
         aria-label="Resize the course list and the camera controls"><i></i></div>
    <div id="railcam"></div>
  </aside>

  <main id="main">
    <div id="stagewrap">
      <div id="poster"></div>
      <div id="stage"></div>
      <!-- The MP4 modes play here. A finished video needs no WebGL, which is the whole point of
           offering it: it plays where the interactive mode cannot. -->
      <video id="vid" hidden controls preload="metadata" playsinline></video>
      <div id="overlay"></div>
      <!-- The floating surface. Theatre and full page hide the rail, which is exactly when
           someone wants to look closely - so this is the only surface in those modes. -->
      <div id="campanel" class="campanel" hidden></div>
      <div id="load">
        <div class="what" id="loadwhat">Loading</div>
        <div class="bar" id="loadbar"><i></i></div>
        <div class="nums" id="loadnums"></div>
        <div class="stall" id="loadstall"></div>
        <div class="btns">
          <!-- Cancel is always available while loading. A person who cannot wait should be able to
               stop, not close the tab - and waiting for as long as they like is equally valid, so
               nothing here ever times out on their behalf. -->
          <button id="loadcancel" class="ghost" hidden>Cancel download</button>
          <button id="loadretry" hidden>Retry</button>
        </div>
      </div>
    </div>

    <div id="bar">
      <button id="play" disabled>Play</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Position">
      <span id="time">0:00</span>
      <button class="ghost" id="bscript" aria-pressed="false" title="Show the script (s)">Script</button>
      <button class="ghost" id="btheatre" aria-pressed="false" title="Theatre mode (t)">Theatre</button>
      <button class="ghost" id="bfull" aria-pressed="false" title="Full page (f)">Full page</button>
    </div>

    <div id="axes">
      <div class="axis"><label for="axcat">Catalogue</label><select id="axcat"></select></div>
      <div class="axis"><label for="axspeech">Speech</label><select id="axspeech"></select></div>
      <div class="axis"><label for="axsub1">Subtitles</label><select id="axsub1"></select><select id="axsub2"></select></div>
      <!-- The two mode selectors, to the right of Subtitles. They carry the SIZE rather than an
           adjective: "Quality" would imply the exact file is better and push everyone toward the
           slowest option, and "Format" is jargon. The number is the trade-off, stated. -->
      <div class="axis"><label for="axmode">Watch as</label><select id="axmode"></select></div>
      <div class="dlgroup">
        <div class="axis dlslot"><a id="dl" class="dl" hidden download>Download</a></div>
        <!-- To the RIGHT of Download, off by default. Unchecked means ABSENT, not greyed -
             nobody should tab into a feature they never asked for. -->
        <div class="axis chk"><label id="camonlab" for="camon">
          <input type="checkbox" id="camon"> Camera controls</label></div>
        <!-- Same rule as the camera controls: OFF by default and ABSENT when off. The AI needs a model
             running on the viewer's own machine, so it is opt-in by nature, not merely by taste. -->
        <div class="axis chk"><label id="askonlab" for="askon">
          <input type="checkbox" id="askon"> Ask (AI)</label></div>
      </div>
    </div>

    <div id="script"><h3>Script <button id="scriptcopy">Copy</button><span id="scriptnote"></span></h3><div id="scriptbody"></div></div>
    <div id="about"></div>
    <div id="note"></div>
  </main>

  <aside id="ask" aria-label="Ask about this lesson"></aside>
</div>

<!-- The meshopt decoder. Required by the smaller interactive encoding, which is published BESIDE the
     exact bytes rather than instead of them - so choosing "Interactive" still gets geometry that is
     byte-identical to what the MP4 was rendered from.
     It is loaded unconditionally because the site always publishes it: making the tag conditional is
     how it came to be missing while compressed assets were being served, and the symptom was a scene
     that rendered without its models. That failure was at least LOUD - compressed assets mark the
     extension REQUIRED, so GLTFLoader refuses them rather than drawing a half-scene silently. -->
<script src="player/meshopt_decoder.js"></script>

<script src="player/overlay.js"></script>
<script src="player/music.js"></script>
<script src="player/speech_audio.js"></script>
<!-- The viewer's camera: a view laid over the authored one, applied after drive() and never
     inside it. Inert until a page sets a view, so it changes nothing for a page that does not. -->
<script src="player/camera_view.js"></script>
<script src="player/scene_player.js"></script>
