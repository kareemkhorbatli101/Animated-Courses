<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 · Accounting &amp; Finance B1</title>
<meta name="description" content="Unit 2 map — 21 interactive sections across the book's eleven parts.">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/eafm.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='7' y='5' width='34' height='38' rx='4' fill='%231f4e5f'/%3E%3Crect x='13' y='11' width='22' height='3' rx='1.5' fill='%23fdfbf6'/%3E%3Crect x='13' y='19' width='22' height='3' rx='1.5' fill='%239a5b13'/%3E%3Crect x='13' y='27' width='14' height='3' rx='1.5' fill='%23fdfbf6'/%3E%3Crect x='13' y='35' width='18' height='3' rx='1.5' fill='%23fdfbf6'/%3E%3C/svg%3E">
<script>window.EAFM_BASE='../';window.EAFM_MEDIA='https://kareemkhorbatli101.github.io/Animated-Courses-Media-accounting/';</script>
<script src="../assets/js/art.js"></script>
<script src="../assets/js/art-eafm.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/scene.js"></script>
<script src="../assets/data/unit2/meta.js"></script>
<script src="../assets/data/unit2/voices.js"></script>
<script src="../assets/data/unit2/narration.js"></script>
<script src="../assets/data/unit2/glossary.js"></script>
<script src="../assets/data/unit2/scenes.js"></script>
<script src="../assets/data/unit2/map.js"></script>
<script src="../assets/data/unit2/ar.js"></script>
<script src="../assets/data/unit2/audio.js"></script>
<script src="coverage.js"></script>
</head>
<body>
<noscript><p style="padding:40px;font:600 16px system-ui">This course needs JavaScript. Please enable it and reload.</p></noscript>
<script>
(function(){
  var U = EAFM.util, el = U.el, art = EAFM.art, P = EAFM.progress;
  var unit = 'unit2', meta = (EAFM.unitMeta || {})['unit2'] || {};
  var rows = EAFM.unitMaps[unit] || [];
  EAFM.chrome = { refresh: function(){} };

  /* topbar */
  var bar = el('header','topbar'), w1 = el('div','wrap');
  var brand = el('a','brand'); brand.href='../index.html';
  brand.innerHTML = art.logo() + '<span>' + EAFM.COURSE.name + '</span>';
  w1.appendChild(brand);
  var cr = el('div','crumbs');
  cr.innerHTML = '<span class="sep">\u25b8</span><span>Unit ' + (meta.n || 2) + '</span>';
  w1.appendChild(cr);
  w1.appendChild(el('div','spacer'));
  var tools = el('div','tb-tools');
  var th = el('button','btn btn-sm btn-ghost', art.icon('moon',16));
  th.title='Light / dark theme'; th.onclick=EAFM.toggleTheme; tools.appendChild(th);
  var tk = el('a','btn btn-sm btn-ghost', art.icon('book',16)+'<span class="hide-sm">Answer key</span>');
  tk.href='../teacher/answers-' + unit + '.html'; tools.appendChild(tk);
  w1.appendChild(tools); bar.appendChild(w1); document.body.appendChild(bar);

  var main = el('main','page-main'), wrap = el('div','wrap');

  /* head */
  var head = el('div','page-head');
  head.innerHTML =
    '<div class="eyebrow"><span>Unit ' + (meta.n || 2) + '</span>' +
    '<span class="bookchip">' + U.esc(meta.cefr || '') + ' \u00b7 ' + U.esc(meta.grammar || '') + '</span></div>' +
    '<h1>' + U.esc(meta.title || ('Unit ' + 2)) + '</h1>' +
    '<p class="wc" style="max-width:74ch">' + U.esc(meta.blurb || '') + '</p>';
  wrap.appendChild(head);

  /* progress across the whole unit */
  var sc = P.unitScore(unit);
  var done = 0, total = 0;
  rows.forEach(function(r){
    total += r.n || 0;
    var p = P.all[r.id];
    if (p) for (var k in p.cards) if (p.cards.hasOwnProperty(k) && p.cards[k].done) done++;
  });
  var prog = el('div','card'); var pb = el('div','card-body');
  pb.innerHTML = '<div class="eyebrow">Your progress</div>' +
    '<div class="meter" style="margin:10px 0"><i style="width:' +
      (total ? (done/total*100) : 0) + '%"></i></div>' +
    '<p class="wc">' + done + ' of ' + total + ' activities finished, across ' + rows.length +
    ' sections. Your work saves itself in this browser \u2014 no account, nothing sent anywhere.</p>';
  prog.appendChild(pb); wrap.appendChild(prog);

  /* Can-Do */
  if (meta.canDo && meta.canDo.length) {
    var cd = el('div','card'); var cb = el('div','card-body');
    cb.innerHTML = '<div class="eyebrow">Can-Do \u2014 by the end of this unit</div><ul class="wc" style="line-height:1.9;margin:8px 0 0;padding-left:20px">' +
      meta.canDo.map(function(x){ return '<li>' + U.esc(x) + '</li>'; }).join('') + '</ul>';
    cd.appendChild(cb); wrap.appendChild(cd);
  }

  /* the sections, grouped by the lesson field of the map */
  wrap.appendChild(el('h2','','The ' + rows.length + ' sections'));
  var groups = [], seen = {};
  rows.forEach(function(r){
    if (!seen[r.lesson]) { seen[r.lesson] = { name: r.lesson, rows: [] }; groups.push(seen[r.lesson]); }
    seen[r.lesson].rows.push(r);
  });
  groups.forEach(function(g){
    var sec = el('div','card'); var sb = el('div','card-body');
    sb.innerHTML = '<div class="eyebrow">' + U.esc(g.name) + '</div>';
    var list = el('div','sec-list');
    g.rows.forEach(function(r){
      var p = P.all[r.id], d = 0;
      if (p) for (var k in p.cards) if (p.cards.hasOwnProperty(k) && p.cards[k].done) d++;
      var a = el('a','sec-row');
      a.href = r.file + '.html';
      a.innerHTML = '<span class="sec-label">' + U.esc(r.label) + '</span>' +
        '<span class="sec-tag">' + (r.n ? (d >= r.n ? '\u2713 done' : d + ' / ' + r.n) : '') + '</span>';
      list.appendChild(a);
    });
    sb.appendChild(list); sec.appendChild(sb); wrap.appendChild(sec);
  });

  /* glossary */
  var gl = Object.keys(EAFM.glossaryData || {});
  if (gl.length) {
    var gc = el('div','card'); var gb = el('div','card-body');
    gb.innerHTML = '<div class="eyebrow">Glossary \u2014 ' + gl.length + ' terms</div>';
    var gw = el('div','cols');
    gl.sort().forEach(function(k){
      var g = EAFM.glossaryData[k];
      var it = el('div','');
      it.innerHTML = '<b>' + U.esc(k) + '</b><br><span class="wc">' + U.esc(g.en || g) + '</span>' +
        (g.ar ? '<br><span class="wc" dir="rtl" lang="ar">' + U.esc(g.ar) + '</span>' : '');
      gw.appendChild(it);
    });
    gb.appendChild(gw); gc.appendChild(gb); wrap.appendChild(gc);
  }

  /* coverage manifest */
  var cov = (EAFM.coverageData || {})[unit] || [];
  if (cov.length) {
    var cc = el('div','card'); var ccb = el('div','card-body');
    var todo = cov.filter(function(x){ return x.status === 'todo'; }).length;
    ccb.innerHTML = '<div class="eyebrow">Coverage \u2014 every exercise in the book unit</div>' +
      '<p class="wc">' + cov.length + ' exercises from the student book, ' +
      (cov.length - todo) + ' implemented' + (todo ? ', ' + todo + ' still to do' : '') + '.</p>';
    var tb = el('table','matrix');
    tb.innerHTML = '<thead><tr><th>Book</th><th>Screen</th><th>Card</th><th>Status</th></tr></thead><tbody>' +
      cov.map(function(x){
        return '<tr><th>' + U.esc(x.ref) + '</th><td><a href="' + U.esc(x.page) + '.html">' +
          U.esc(x.page) + '</a></td><td>' + U.esc(x.card) + '</td><td>' + U.esc(x.status) + '</td></tr>';
      }).join('') + '</tbody>';
    ccb.appendChild(tb); cc.appendChild(ccb); wrap.appendChild(cc);
  }

  var row = el('div','btn-row');
  var go = el('a','btn btn-primary btn-lg', art.icon('play',16)+'Start at \u00a71');
  go.href = rows[0].file + '.html'; row.appendChild(go);
  var home = el('a','btn', art.icon('map',16)+'All units');
  home.href = '../index.html'; row.appendChild(home);
  wrap.appendChild(row);

  main.appendChild(wrap); document.body.appendChild(main);
}());
</script>
</body>
</html>
