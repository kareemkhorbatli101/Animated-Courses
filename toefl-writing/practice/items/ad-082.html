<script>window.ITEM={"kind":"exercise","id":"AD 082","slug":"ad-082","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"History of science · cause ranking","payload":{"Strategy":"rank causes by which one made the others usable","Grammar":"nominal clauses as complements","Vocabulary":"instrumentation, paradigm, replication, patronage","Convention":"ranking causes of a scientific advance"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Jakob’s objection has the same structure as a common objection in causal reasoning. Name it.\u003c/p>\u003cp>b.  Why would the philosophical shift be hard to rank?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is replication, and what is patronage?\u003c/p>\u003cp>b.  What is instrumentation, and why is it more than apparatus?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three in one sentence using a removal test.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response ranks instruments second while calling them necessary. Why is that not a contradiction?\u003c/p>\u003cp>b.  Why is the philosophical shift demoted on methodological rather than historical grounds?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"That the instruments came first does not make them primary\" — identify the structure and say why it opens the paragraph.\u003c/p>\u003cp>b.  \"observations were testimony and could be denied as such\" — what does this claim establish?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  A variation argument: the proposed cause was present before the effect appeared, so something else must account for the timing.\u003c/p>\u003cp>b.  Because it is hard to distinguish from the practice it justified. If the shift and the institutions are the same development described two ways, neither can be the cause of the other.\u003c/p>","P2":"\u003cp>a.  Replication is independent repetition of an experiment to confirm its result; patronage is the funding and protection of enquiry by wealthy sponsors.\u003c/p>\u003cp>b.  Instrumentation includes the techniques, calibration and conventions for using apparatus — which is Jakob’s point in different words.\u003c/p>","P3":"\u003cp>Model: \"Remove the societies and observations stay testimony; remove the instruments and there is nothing to witness; remove the philosophy and the practice continues unarticulated.\"\u003c/p>","F1":"\u003cp>a.  Because necessity and primacy answer different questions. The instruments were indispensable and were already present, so they cannot explain why the change happened when it did — which is what the ranking is about.\u003c/p>\u003cp>b.  Because the historical evidence cannot separate it from the institutions. Ranking requires that causes be independently identifiable, and this one is partly constituted by its supposed effect.\u003c/p>","F2":"\u003cp>a.  A nominal that-clause as subject. It lets the sentence take the opposing argument as its topic and dispose of it in one line, which is the cleanest way to open a paragraph that demotes a strong candidate.\u003c/p>\u003cp>b.  That the problem was epistemic rather than technical. Testimony can be refused by anyone; a replicated result cannot, which is precisely the function the societies supplied.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, which is what the prompt asks for, and \"impossible to separate them\" is asserted rather than argued.\u003c/p>\u003cp>2.  Jakob’s specific objection — that instruments predate the practice by decades — is never addressed, so the strongest evidence in the discussion goes unused.\u003c/p>\u003cp>3.  The final sentence is about the seventeenth century in general and contributes nothing to the question; \"both partly right\" is the whole of the engagement with either speaker.\u003c/p>"},"model":["Jakob has the better of it, and the reason is that his candidate is what turned Mira’s into evidence.","An instrument on its own settles nothing. A telescope shows one man four moons; what makes those moons a fact is that others build the same instrument, look, and agree. Before the societies, observations were testimony and could be denied as such — which is exactly what happened to the early telescopic claims.","That the instruments came first does not make them primary. They were available for decades without producing cumulative knowledge, and nothing about the glass changed in the interval. What changed was the existence of a body that could certify a result, which is the condition under which an instrument becomes an argument.","The philosophical shift I would place third, not because it was unimportant but because it is hard to separate from the practice it describes. People argued for experiment while building the societies that did it, and a cause that is partly the same event as its effect cannot be ranked against it. So: institutions first, instruments second as the necessary material condition, philosophy third as articulation rather than engine."],"model_html":"\u003cp>Jakob has the better of it, and the reason is that his candidate is what turned Mira’s into evidence.\u003c/p>\u003cp>An instrument on its own settles nothing. A telescope shows one man four moons; what makes those moons a fact is that others build the same instrument, look, and agree. Before the societies, observations were testimony and could be denied as such — which is exactly what happened to the early telescopic claims.\u003c/p>\u003cp>That the instruments came first does not make them primary. They were available for decades without producing cumulative knowledge, and nothing about the glass changed in the interval. What changed was the existence of a body that could certify a result, which is the condition under which an instrument becomes an argument.\u003c/p>\u003cp>The philosophical shift I would place third, not because it was unimportant but because it is hard to separate from the practice it describes. People argued for experiment while building the societies that did it, and a cause that is partly the same event as its effect cannot be ranked against it. So: institutions first, instruments second as the necessary material condition, philosophy third as articulation rather than engine.\u003c/p>","model_band":5,"degraded":["In my opinion all three factors were essential and it is impossible to separate them because they developed together. New instruments allowed new observations, scientific societies allowed scientists to share their findings, and the new philosophy encouraged experimentation. Mira and Jakob are both partly right. The seventeenth century was a remarkable period of change in many areas of life, not only science, and I think the scientific revolution was part of this broader transformation of European society."],"degraded_html":"\u003cp>In my opinion all three factors were essential and it is impossible to separate them because they developed together. New instruments allowed new observations, scientific societies allowed scientists to share their findings, and the new philosophy encouraged experimentation. Mira and Jakob are both partly right. The seventeenth century was a remarkable period of change in many areas of life, not only science, and I think the scientific revolution was part of this broader transformation of European society.\u003c/p>","degraded_band":3,"model_words":192,"fault_list":{"tag":"F3","faults":["It refuses to rank, which is what the prompt asks for, and \"impossible to separate them\" is asserted rather than argued.","Jakob’s specific objection — that instruments predate the practice by decades — is never addressed, so the strongest evidence in the discussion goes unused.","The final sentence is about the seventeenth century in general and contributes nothing to the question; \"both partly right\" is the whole of the engagement with either speaker."],"html":["\u003cp>1.  It refuses to rank, which is what the prompt asks for, and \"impossible to separate them\" is asserted rather than argued.\u003c/p>","\u003cp>2.  Jakob’s specific objection — that instruments predate the practice by decades — is never addressed, so the strongest evidence in the discussion goes unused.\u003c/p>","\u003cp>3.  The final sentence is about the seventeenth century in general and contributes nothing to the question; \"both partly right\" is the whole of the engagement with either speaker.\u003c/p>"]},"prof_name":"Dr Whitfield","professor":"\u003cp>Why did experimental science develop so rapidly in seventeenth-century Europe? Candidate explanations include new instruments, new institutions such as scientific societies, and a philosophical shift towards experiment as a source of knowledge. Which was most important?\u003c/p>","students":[["Mira","Instruments. The telescope and the air pump let people see things no argument could settle, and the arguments changed because the evidence did."],["Jakob","Instruments existed for decades before anyone built a practice around them. What was new was that a society of people agreed to witness, record and repeat each other’s experiments — that is the invention."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"No alternative is offered, so a no ends the matter, and “I hope you can make an exception in my case” asks for special treatment rather than proposing a workable arrangement.","correct":false},{"text":"No third option is considered, so the problem is simply transferred; and “let me know as soon as you can” adds time pressure to a request that should not have been made.","correct":false},{"text":"The final sentence is about the seventeenth century in general and contributes nothing to the question; “both partly right” is the whole of the engagement with either speaker.","correct":true},{"text":"“It is really not fair that some people are doing all the work while others do nothing” turns a logistics email into a group conflict, which is specifically what the third bullet rules out — and it is also unfair to Priya, who did send her section.","correct":false},{"text":"Jakob’s specific objection — that instruments predate the practice by decades — is never addressed, so the strongest evidence in the discussion goes unused.","correct":true},{"text":"It refuses to rank, which is what the prompt asks for, and “impossible to separate them” is asserted rather than argued.","correct":true}],"key_html":"F3"}};</script>
