<script>window.ITEM={"kind":"exercise","id":"AD 041","slug":"ad-041","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban planning and transport · value trade-off","payload":{"Strategy":"ask who bears the cost and who gets the benefit, separately","Grammar":"contrastive whereas; the conditional qualification","Vocabulary":"induced demand, through-traffic, severance, displacement","Convention":"arguing about a policy that helps one group at another’s expense"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Amara is arguing about totals. What is Petros arguing about?\u003c/p>\u003cp>b.  Is there an empirical claim on which they actually disagree?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  \u003cem>Induced demand\u003c/em> is the finding that new road capacity generates new traffic. What does the reverse — removing capacity — predict?\u003c/p>\u003cp>b.  What is \u003cem>severance\u003c/em> in transport planning, and who experiences it?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, accept Petros’s distributional point and show that it argues for a bigger scheme rather than none. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “cities should balance the needs of all their residents” empty here?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response tells Petros his objection is about scale, then concedes it anyway in paragraph two. Why is that not a contradiction?\u003c/p>\u003cp>b.  The final sentence proposes something neither classmate suggested. What makes it follow from what came before?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “has to go somewhere \u003cem>only if\u003c/em> the total number of journeys is fixed”. What does \u003cem>only if\u003c/em> do that \u003cem>if\u003c/em> would not?\u003c/p>\u003cp>b.  “does not relocate traffic so much as evaporate some of it”. Name the structure, and say why it is better than \u003cem>does not relocate traffic but evaporates it\u003c/em>.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>evaporate\u003c/em> applied to traffic — is this the writer’s metaphor or the field’s term? Why does it matter which?\u003c/p>\u003cp>b.  \u003cem>exports its problem\u003c/em> — what does the economic verb accuse the scheme of?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: should cities charge drivers to enter the centre? One classmate says it cuts congestion; another says it prices out people who have no alternative. In 50 words, accept the second point and show it argues about design rather than principle.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Distribution — who gains and who pays, and whether those two groups are the same people. Amara is adding benefits across a city; Petros is asking where inside the city they land.\u003c/p>\u003cp>b.  Possibly not. Amara does not deny that traffic moves; Petros does not deny that the centre improves. They disagree about which fact decides the question, which is a disagreement about values wearing the clothes of a disagreement about evidence. Spotting that is what lets the response introduce an empirical claim — induced demand — that neither of them has brought to bear.\u003c/p>","P2":"\u003cp>a.  That removing capacity should reduce the total number of journeys, not merely redirect them — traffic evaporation. It is the strongest available answer to Petros, and it is empirical rather than moral.\u003c/p>\u003cp>b.  The way a major road cuts a neighbourhood in two, so that crossing it becomes difficult or dangerous. It is experienced by the people who live beside it, not by those driving through — which is exactly the asymmetry Petros is pointing at.\u003c/p>","P3":"\u003cp>Model: \u003cem>Petros is right that a small scheme exports its traffic — which is an argument for closing a district rather than six streets, not for closing nothing.\u003c/em>\u003c/p>\u003cp>The concession is total and the conclusion is reversed, because his premise was about scale all along.\u003c/p>","P4":"\u003cp>Because every participant already agrees that a city should weigh competing needs. The question is how to weigh these particular ones. A sentence that could be appended to any planning dispute has not contributed to this one.\u003c/p>","F1":"\u003cp>a.  Because the two paragraphs concede different things. The first rejects his \u003cem>mechanism\u003c/em> — displaced traffic need not simply relocate. The second accepts his \u003cem>politics\u003c/em> — the order in which schemes are built really does follow wealth. You can deny that a problem is inevitable while agreeing that, as things are done, it reliably happens.\u003c/p>\u003cp>b.  It follows because the two paragraphs have jointly established that the harm comes from sequencing rather than from pedestrianisation itself. Once the diagnosis is sequencing, the remedy is to change the sequence — and that remedy is available to neither classmate, because each had only half the diagnosis.\u003c/p>","F2":"\u003cp>a.  \u003cem>Only if\u003c/em> makes the condition necessary, not merely sufficient. The sentence therefore says: this consequence follows in exactly one circumstance, and I am about to show we are not in it. Plain \u003cem>if\u003c/em> would leave open that the traffic might relocate for other reasons too, and the argument would lose its grip.\u003c/p>\u003cp>b.  \u003cem>not so much X as Y\u003c/em> — a correlative that rejects one description in favour of a better one without denying it outright. It is better than \u003cem>not … but\u003c/em> here because some traffic genuinely does relocate; the claim is about proportion, not about absolutes, and \u003cem>so much as\u003c/em> encodes exactly that hedge.\u003c/p>","F3":"\u003cp>a.  It is the field’s term — traffic evaporation is the established name for the phenomenon. That matters because a reader who thinks you have invented a pretty metaphor will discount it, whereas the technical term signals that there is a literature behind the claim. Using a field’s own vocabulary is a cheap and very effective way to establish that you know the ground.\u003c/p>\u003cp>b.  Of solving its own problem by moving it somewhere with less power to refuse — the same thing a country does when it offshores a polluting industry. The verb carries the whole moral charge of Petros’s objection while remaining analytical in tone.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It concedes the central objection and then ignores it.\u003c/strong> “this is a problem, but we cannot stop all the progress”. Petros’s point is acknowledged and then overridden by an appeal to progress, which is not an argument.\u003c/p>\u003cp>2.  \u003cstrong>Nothing new, and a generic close.\u003c/strong> The benefits listed are Amara’s; the objection is Petros’s; the recommendation to improve public transport appears in every discussion of urban traffic and is not connected to the dispute about distribution.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.\u003c/p>","F5":"\u003cp>Model: \u003cem>The objection is right about who pays, but it indicts the flat charge rather than the idea. A levy that varied with income, or that exempted residents without transport alternatives, would cut congestion while leaving those drivers where they are. The question is how to price it, not whether.\u003c/em>\u003c/p>"},"model":["Petros is describing something real, but I think it is an argument about the size of the scheme rather than against the principle. Traffic displaced from a closed street has to go somewhere only if the total number of journeys is fixed, and the evidence on induced demand suggests it is not: capacity removed over a wide enough area does not relocate traffic so much as evaporate some of it. A scheme covering six streets exports its problem; one covering a district mostly does not.","Where I would hold on to his objection is in the sequencing. Schemes are built outward from the places with the loudest residents, so the districts that absorb the traffic in year one are the ones that will be pedestrianised in year ten, if ever. That is a real injustice and it is not answered by the aggregate numbers Amara cites. The fix is not to stop closing streets; it is to start somewhere other than the centre."],"model_html":"\u003cp>Petros is describing something real, but I think it is an argument about the size of the scheme rather than against the principle. Traffic displaced from a closed street has to go somewhere only if the total number of journeys is fixed, and the evidence on induced demand suggests it is not: capacity removed over a wide enough area does not relocate traffic so much as evaporate some of it. A scheme covering six streets exports its problem; one covering a district mostly does not.\u003c/p>\u003cp>Where I would hold on to his objection is in the sequencing. Schemes are built outward from the places with the loudest residents, so the districts that absorb the traffic in year one are the ones that will be pedestrianised in year ten, if ever. That is a real injustice and it is not answered by the aggregate numbers Amara cites. The fix is not to stop closing streets; it is to start somewhere other than the centre.\u003c/p>","model_band":5,"degraded":["I think both students have good points but I agree more with Amara because the city centre is used by all the citizens and not only by the rich people who live there. If we close the streets to the cars the air will be cleaner and the people can walk safely with their children and the shops will have more customers. Of course Petros is right that the traffic will go to other streets, this is a problem, but we cannot stop all the progress because of this. The government should also improve the public transport so less people will use their cars and then there will be less traffic everywhere in the city."],"degraded_html":"\u003cp>I think both students have good points but I agree more with Amara because the city centre is used by all the citizens and not only by the rich people who live there. If we close the streets to the cars the air will be cleaner and the people can walk safely with their children and the shops will have more customers. Of course Petros is right that the traffic will go to other streets, this is a problem, but we cannot stop all the progress because of this. The government should also improve the public transport so less people will use their cars and then there will be less traffic everywhere in the city.\u003c/p>","degraded_band":3,"model_words":163,"fault_list":{"tag":"F4","faults":["It concedes the central objection and then ignores it. “this is a problem, but we cannot stop all the progress”. Petros’s point is acknowledged and then overridden by an appeal to progress, which is not an argument.","Nothing new, and a generic close. The benefits listed are Amara’s; the objection is Petros’s; the recommendation to improve public transport appears in every discussion of urban traffic and is not connected to the dispute about distribution.","Language. “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”."],"html":["\u003cp>1.  \u003cstrong>It concedes the central objection and then ignores it.\u003c/strong> “this is a problem, but we cannot stop all the progress”. Petros’s point is acknowledged and then overridden by an appeal to progress, which is not an argument.\u003c/p>","\u003cp>2.  \u003cstrong>Nothing new, and a generic close.\u003c/strong> The benefits listed are Amara’s; the objection is Petros’s; the recommendation to improve public transport appears in every discussion of urban traffic and is not connected to the dispute about distribution.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>Many cities have closed central streets to cars. Supporters point to cleaner air, safer streets and busier shops. Opponents say the traffic does not disappear but moves to poorer neighbourhoods on the edge of the scheme. Which matters more here — the quality of the centre, or the distribution of the traffic?\u003c/p>","students":[["Amara","The centre, and I do not think it is close. Air quality improves where the most people walk and breathe, injuries fall, and the evidence on retail is better than opponents admit. A city that will not improve anywhere because it cannot improve everywhere will improve nothing."],["Petros","That argument always ends with the same people absorbing the cost. The streets traffic moves onto are not chosen at random — they are the ones without residents’ associations. The centre gets the plaza and the ring road gets the lorries."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The decision is taken away. “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.","correct":false},{"text":"“Everyone shares their notes and we go through the problem sets together” describes exactly the participatory format a reticent person would avoid, and nothing suggests they could come briefly or stay quiet.","correct":false},{"text":"It concedes the central objection and then ignores it. “this is a problem, but we cannot stop all the progress”. Petros’s point is acknowledged and then overridden by an appeal to progress, which is not an argument.","correct":true},{"text":"Nothing new, and a generic close. The benefits listed are Amara’s; the objection is Petros’s; the recommendation to improve public transport appears in every discussion of urban traffic and is not connected to the dispute about distribution.","correct":true},{"text":"It claims rather than asks. “I believe I am owed this money” and “calculate what I am due” assume the entitlement the email should be establishing — the third bullet fails.","correct":false},{"text":"Language. “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.","correct":true}],"key_html":"F4"}};</script>
