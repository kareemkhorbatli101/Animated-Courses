<script>window.ITEM={"kind":"exercise","id":"EM 013","slug":"em-013","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"report the charge, not the character of whoever made it","Grammar":"the concessive although","Vocabulary":"itemised, debit, in error, reconcile","Convention":"complaining about money without implying bad faith"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  This is almost certainly a system error. How should that shape the tone?\u003c/p>\u003cp>b.  What is the one detail that makes this provable?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which is the accounting word for a charge taken from an account: \u003cem>debit\u003c/em>, \u003cem>deduction\u003c/em>, \u003cem>withdrawal\u003c/em>?\u003c/p>\u003cp>b.  What does it mean to \u003cem>reconcile\u003c/em> two records, and what does \u003cem>in error\u003c/em> imply that \u003cem>wrongly\u003c/em> does not?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Report the double charge in one sentence that assumes it was a mistake.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Two timestamps one minute apart are quoted. What do they prove that “twice” does not?\u003c/p>\u003cp>b.  Find the phrase that lets the office fix it their own way.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  Why \u003cem>appears to have been debited\u003c/em> rather than \u003cem>was debited\u003c/em>?\u003c/p>\u003cp>b.  The complaint about being ignored sits inside an \u003cem>although\u003c/em>-clause. What does that placement do to its force?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It should be almost apologetic in its confidence: state the facts plainly, assume good faith, and ask. Nobody deliberately double-charges £8.40, so any hint of accusation makes you look unreasonable rather than wronged.\u003c/p>\u003cp>b.  The two timestamps. One minute apart is the signature of a card reader retrying, and it is the fact that will let the office find the transaction in seconds.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Debit\u003c/strong> — the term used of a card or account in a ledger. The others describe the movement of money generally.\u003c/p>\u003cp>b.  To \u003cstrong>reconcile\u003c/strong> is to compare two records and account for the difference. \u003cstrong>In error\u003c/strong> attributes the fault to the process; \u003cem>wrongly\u003c/em> hints at someone doing something wrong.\u003c/p>","P3":"\u003cp>Model: \u003cem>My card appears to have been debited twice for the same lunch on 4 March — £8.40 at 12:41 and £8.40 at 12:42.\u003c/em>\u003c/p>\u003cp>No agent, a hedge, and two timestamps. The sentence is both gentler and more damning than an accusation would be, because it is checkable.\u003c/p>","F1":"\u003cp>a.  They prove it was one transaction read twice rather than two lunches. “Twice” is a claim; 12:41 and 12:42 is evidence, and it tells the office exactly where to look.\u003c/p>\u003cp>b.  “If it is easier to reconcile it against the till record at your end … I am happy to leave it with you.” It offers to stop managing their process, which busy offices value more than help.\u003c/p>","F2":"\u003cp>a.  Because you are reading a statement, not their ledger. The hedge costs nothing, is more accurate, and means you are not contradicted if the explanation turns out to be something else.\u003c/p>\u003cp>b.  It subordinates it. The grievance is reported but is grammatically secondary to the fact that the charge is still there — so the email registers that you were ignored without making that the complaint.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It accuses and generalises.\u003c/strong> “You charged me”, “nobody did anything, as usual”. The second phrase turns one error into a character judgement about the department.\u003c/p>\u003cp>2.  \u003cstrong>It threatens, and supplies no evidence.\u003c/strong> The receipt, the card number and the timestamps are all missing, so the office cannot locate the transaction — and the threat arrives before they have had a chance to fix anything.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “two times” (twice), “I want it back immediately”, “Students Union” (Students’ Union), and no greeting to a named office.\u003c/p>"},"model":["Dear Catering Office,","My meal card (4418) appears to have been debited twice for the same lunch on 4 March — £8.40 at 12:41 and £8.40 at 12:42. I have the till receipt, which shows a single transaction, and can send a photograph of it.","Although I mentioned it at the counter the same week and was told it would be looked at, the second charge is still showing on my statement.","Could the duplicate be refunded to the card? If it is easier to reconcile it against the till record at your end than to work from my receipt, I am happy to leave it with you.","Thank you very much.","Best wishes,","Nia Okoro — card 4418"],"model_html":"\u003cp>Dear Catering Office,\u003c/p>\u003cp>My meal card (4418) appears to have been debited twice for the same lunch on 4 March — £8.40 at 12:41 and £8.40 at 12:42. I have the till receipt, which shows a single transaction, and can send a photograph of it.\u003c/p>\u003cp>Although I mentioned it at the counter the same week and was told it would be looked at, the second charge is still showing on my statement.\u003c/p>\u003cp>Could the duplicate be refunded to the card? If it is easier to reconcile it against the till record at your end than to work from my receipt, I am happy to leave it with you.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Nia Okoro — card 4418\u003c/p>","model_band":5,"degraded":["Hello,","You charged me two times for one lunch on 4 March, 8.40 each time. I already told your staff at the counter but nobody did anything, as usual. This is my money and I want it back on my card immediately. If this is not solved I will report it to the Students Union.","Nia"],"degraded_html":"\u003cp>Hello,\u003c/p>\u003cp>You charged me two times for one lunch on 4 March, 8.40 each time. I already told your staff at the counter but nobody did anything, as usual. This is my money and I want it back on my card immediately. If this is not solved I will report it to the Students Union.\u003c/p>\u003cp>Nia\u003c/p>","degraded_band":3,"model_words":121,"fault_list":{"tag":"F3","faults":["It accuses and generalises. “You charged me”, “nobody did anything, as usual”. The second phrase turns one error into a character judgement about the department.","It threatens, and supplies no evidence. The receipt, the card number and the timestamps are all missing, so the office cannot locate the transaction — and the threat arrives before they have had a chance to fix anything.","Language. “two times” (twice), “I want it back immediately”, “Students Union” (Students’ Union), and no greeting to a named office."],"html":["\u003cp>1.  \u003cstrong>It accuses and generalises.\u003c/strong> “You charged me”, “nobody did anything, as usual”. The second phrase turns one error into a character judgement about the department.\u003c/p>","\u003cp>2.  \u003cstrong>It threatens, and supplies no evidence.\u003c/strong> The receipt, the card number and the timestamps are all missing, so the office cannot locate the transaction — and the threat arrives before they have had a chance to fix anything.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “two times” (twice), “I want it back immediately”, “Students Union” (Students’ Union), and no greeting to a named office.\u003c/p>"]},"scenario":"\u003cp>Your meal card has been debited twice for the same lunch on 4 March, £8.40 each time. The catering office told you in person to email. You have the receipt.\u003c/p>","bullets":["State what the charge was and when.","Say what you have already done.","Say what you would like."],"header":[["To:","catering@northgate.ac.uk"],["Subject:","Duplicate debit, meal card 4418 — 4 March"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Elsa’s structural point is acknowledged and then dissolved by wishful thinking: “if more companies decide to do the right thing then it will become normal” simply asserts that the collective action problem solves itself.","correct":false},{"text":"It threatens, and supplies no evidence. The receipt, the card number and the timestamps are all missing, so the office cannot locate the transaction — and the threat arrives before they have had a chance to fix anything.","correct":true},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":false},{"text":"It restates the two positions as “efficiency versus freedom” and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.","correct":false},{"text":"It accuses and generalises. “You charged me”, “nobody did anything, as usual”. The second phrase turns one error into a character judgement about the department.","correct":true},{"text":"Language. “two times” (twice), “I want it back immediately”, “Students Union” (Students’ Union), and no greeting to a named office.","correct":true}],"key_html":"F3"}};</script>
