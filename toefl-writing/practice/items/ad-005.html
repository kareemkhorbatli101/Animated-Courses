<script>window.ITEM={"kind":"exercise","id":"AD 005","slug":"ad-005","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Technology and AI · value trade-off","payload":{"Strategy":"ask what the automated version makes impossible, not what it makes faster","Grammar":"contrastive whereas","Vocabulary":"triage, discretion, audit trail, edge case","Convention":"arguing about automation without romanticising human judgement"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both describe a failure mode. Name each in three words.\u003c/p>\u003cp>b.  Is there a version of the system that has neither failure?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is triage, and what is an edge case?\u003c/p>\u003cp>b.  What is an audit trail, and why would it matter to Mariam?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the trade-off in one sentence that refuses to call either side wrong.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response argues that one failure is worse. On what grounds?\u003c/p>\u003cp>b.  Find the sentence that solves Elias’s problem without requiring the system to be clever.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"whereas an automated decision that is wrong in the same way every time looks exactly like a correct one\" — what does \"whereas\" do here?\u003c/p>\u003cp>b.  \"they announce themselves\" — who are \"they\", and why is this the hinge of the argument?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Mariam: arbitrary human variation. Elias: rigid systematic error.\u003c/p>\u003cp>b.  Yes, if the two are separated in time: automate the decision, humanise the challenge. That is the response’s move, and neither classmate considers it because both treat the choice as happening once, at the point of decision.\u003c/p>","P2":"\u003cp>a.  Triage is sorting cases by urgency or type before deciding them. An edge case is one that falls at the boundary of a rule, where the rule’s author did not think clearly or at all.\u003c/p>\u003cp>b.  A record of what was decided and why. It matters to Mariam because her complaint about human discretion is precisely that it is unrecorded and unaccountable — so an automated system without an audit trail loses her main advantage.\u003c/p>","P3":"\u003cp>Model: \"Both are describing real failures, and the question is which one a system can be built to notice.\"\u003c/p>","F1":"\u003cp>a.  Detectability. Inconsistent error is self-advertising; consistent error is camouflaged by the very property that is supposed to demonstrate fairness. That is an argument neither classmate makes and it reframes consistency as a risk rather than a virtue.\u003c/p>\u003cp>b.  \"route any case the applicant disputes to a person with the power to depart from the rule\". The system does not have to identify edge cases; the affected person does it for free.\u003c/p>","F2":"\u003cp>a.  Straight contrast between two equally real situations — not concession. Neither clause is being given up, which is right, because the argument depends on both being true.\u003c/p>\u003cp>b.  The edge cases. It is the hinge because it dissolves the apparent need for a system clever enough to recognise its own limits: the information is already in the hands of the person affected, and the only design problem is making it cheap for them to transmit it.\u003c/p>","F3":"\u003cp>1.  The conclusion — computers do simple cases, humans do difficult ones — is exactly what both classmates already assume, and it begs the question, since identifying the difficult cases is the whole problem.\u003c/p>\u003cp>2.  The support is a cliche about machines lacking emotions, which is not what Elias argued; he argued about rules written in advance, which is a point about specification rather than feeling.\u003c/p>\u003cp>3.  Language: \"the governments\", \"the people\", \"the technology\" all over-articled; \"the human situations\" is vague; and the opening sentence contributes nothing.\u003c/p>"},"model":["Mariam and Elias are describing the two failure modes of the same system, and both happen. The useful question is which failure is visible. An inconsistent human decision leaves a trace — a different official, a different outcome, something to appeal against — whereas an automated decision that is wrong in the same way every time looks exactly like a correct one, because consistency is the evidence we normally use to detect fairness.","That points to a design rather than a choice between them. Automate the decision and keep the discretion at the point of challenge: a system that decides routinely but is required to explain, and to route any case the applicant disputes to a person with the power to depart from the rule. Elias is right that the edge cases are the difficulty, but they announce themselves — the person affected knows. What is needed is not a cleverer rule but a cheap and visible way of saying this one is wrong, which is precisely what automated systems are usually built without."],"model_html":"\u003cp>Mariam and Elias are describing the two failure modes of the same system, and both happen. The useful question is which failure is visible. An inconsistent human decision leaves a trace — a different official, a different outcome, something to appeal against — whereas an automated decision that is wrong in the same way every time looks exactly like a correct one, because consistency is the evidence we normally use to detect fairness.\u003c/p>\u003cp>That points to a design rather than a choice between them. Automate the decision and keep the discretion at the point of challenge: a system that decides routinely but is required to explain, and to route any case the applicant disputes to a person with the power to depart from the rule. Elias is right that the edge cases are the difficulty, but they announce themselves — the person affected knows. What is needed is not a cleverer rule but a cheap and visible way of saying this one is wrong, which is precisely what automated systems are usually built without.\u003c/p>","model_band":5,"degraded":["This is a very important topic in our modern society. I think that technology can help the governments to work faster and to treat all the people in the same way without discrimination, which is a big advantage. However the machines cannot understand the human situations and the special cases like Elias said, because they do not have emotions and they only follow the programming. In my opinion the best approach is a combination of both, so the computer can do the simple cases and the humans can check the difficult ones. In this way we can have the advantages of the technology and also the human understanding."],"degraded_html":"\u003cp>This is a very important topic in our modern society. I think that technology can help the governments to work faster and to treat all the people in the same way without discrimination, which is a big advantage. However the machines cannot understand the human situations and the special cases like Elias said, because they do not have emotions and they only follow the programming. In my opinion the best approach is a combination of both, so the computer can do the simple cases and the humans can check the difficult ones. In this way we can have the advantages of the technology and also the human understanding.\u003c/p>","degraded_band":3,"model_words":171,"fault_list":{"tag":"F3","faults":["The conclusion — computers do simple cases, humans do difficult ones — is exactly what both classmates already assume, and it begs the question, since identifying the difficult cases is the whole problem.","The support is a cliche about machines lacking emotions, which is not what Elias argued; he argued about rules written in advance, which is a point about specification rather than feeling.","Language: \"the governments\", \"the people\", \"the technology\" all over-articled; \"the human situations\" is vague; and the opening sentence contributes nothing."],"html":["\u003cp>1.  The conclusion — computers do simple cases, humans do difficult ones — is exactly what both classmates already assume, and it begs the question, since identifying the difficult cases is the whole problem.\u003c/p>","\u003cp>2.  The support is a cliche about machines lacking emotions, which is not what Elias argued; he argued about rules written in advance, which is a point about specification rather than feeling.\u003c/p>","\u003cp>3.  Language: \"the governments\", \"the people\", \"the technology\" all over-articled; \"the human situations\" is vague; and the opening sentence contributes nothing.\u003c/p>"]},"prof_name":"Dr Sorensen","professor":"\u003cp>Public bodies increasingly use automated systems to decide routine cases: benefit eligibility, visa triage, parking appeals. Supporters cite consistency and speed; critics cite the loss of discretion. Which matters more in administrative decisions — consistency, or the capacity to judge the particular case?\u003c/p>","students":[["Mariam","Consistency. Human discretion in these systems is not wise judgement, it is whichever official you happen to get, and it falls hardest on people who cannot argue back. A rule applied identically to everyone is the fairer thing."],["Elias","Discretion. Every rule written in advance meets a case its author did not imagine, and in administration those cases are not rare — they are the whole difficulty. A system that cannot recognise an exception will produce absurd outcomes with perfect consistency."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: “the governments”, “the people”, “the technology” all over-articled; “the human situations” is vague; and the opening sentence contributes nothing.","correct":true},{"text":"“Extremely busy” with no standard and no number, which is what everyone says. The second bullet is only formally met.","correct":false},{"text":"The support is a cliche about machines lacking emotions, which is not what Elias argued; he argued about rules written in advance, which is a point about specification rather than feeling.","correct":true},{"text":"“It would be unfair if we were penalised for something that was not explained properly” complains about a penalty that has not been imposed, which turns a factual question into a grievance; “several students are also confused” adds pressure rather than information.","correct":false},{"text":"The conclusion — computers do simple cases, humans do difficult ones — is exactly what both classmates already assume, and it begs the question, since identifying the difficult cases is the whole problem.","correct":true},{"text":"“Somebody to actually do something about it as soon as possible” names no action, no owner and no date, so the first bullet fails too.","correct":false}],"key_html":"F3"}};</script>
