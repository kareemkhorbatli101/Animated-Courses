<script>window.ITEM={"kind":"exercise","id":"EM 027","slug":"em-027","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"an apology to an institution still needs a named consequence","Grammar":"reason connectors","Vocabulary":"withdraw, stand down, cohort, at this stage","Convention":"withdrawing from something people have planned around"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The damage here is not emotional but logistical. What does that mean for the third bullet?\u003c/p>\u003cp>b.  Why withdraw now rather than closer to the date?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish withdraw, stand down and pull out by register.\u003c/p>\u003cp>b.  What does \"at this stage\" do in a sentence of this kind?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Say you are withdrawing in a sentence that also states when, so the reader can plan.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer names a replacement and copies them in. What problem does that solve for the reader?\u003c/p>\u003cp>b.  Find the clause that pre-empts the reader’s likely irritation.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"following a change of supervisor\" — why a prepositional phrase rather than a because-clause?\u003c/p>\u003cp>b.  \"I would rather say so in September than let you down in the week itself.\" Which structure is this, and what does the comparison achieve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It means the repair is a person, not a sentiment. The office needs a panellist in November; an apology that does not help produce one has not limited the damage.\u003c/p>\u003cp>b.  Because the cost of your withdrawal falls almost entirely on how much notice you give. In September it is an administrative task; in November it is a crisis. Early withdrawal is itself part of the apology.\u003c/p>","P2":"\u003cp>a.  \"Pull out\" is informal and faintly unreliable; \"withdraw\" is neutral and formal; \"stand down\" is the term of art for leaving a role or duty, and is the warmest of the three while still being correct.\u003c/p>\u003cp>b.  It marks the statement as true of the present position while allowing for change, and it signals you have thought about timing. It is useful in exactly this kind of email, where the news is bad but not final in every respect.\u003c/p>","P3":"\u003cp>Model: \"I need to stand down from the applicant panel in November.\" The date is in the sentence, so the reader knows immediately how much time they have.\u003c/p>","F1":"\u003cp>a.  It converts the email from a problem into a solved problem. The office’s task was to find a panellist; the writer has done it, and the named person is already in the thread and able to confirm.\u003c/p>\u003cp>b.  \"I am conscious my name is on the published material.\" It shows the writer has thought about the consequence the office cares about most, before the office has to raise it.\u003c/p>","F2":"\u003cp>a.  Because the cause is secondary. A because-clause would give the supervisor change equal weight with the deadline move, when it is only the reason behind the reason. The prepositional phrase keeps it subordinate and the sentence short.\u003c/p>\u003cp>b.  \"Would rather ... than\" with bare infinitives (family 7, structure 57). The comparison frames the withdrawal as the responsible choice of two, so the reader is invited to approve of it rather than simply absorb it.\u003c/p>","F3":"\u003cp>1.  No repair. \"I am sure you can find somebody else\" is the office’s problem handed back with an assurance attached. The third bullet is not addressed.\u003c/p>\u003cp>2.  The reason is thin and self-centred. \"I am very busy now\" could be said by anyone at any time; the actual constraint, a moved deadline and relocated fieldwork, is reduced to a clause.\u003c/p>\u003cp>3.  It ignores the published material and the notice period, and closes with \"Thank you for understanding\", which thanks them in advance for accepting what has already been decided.\u003c/p>"},"model":["Dear Admissions Team,","I am very sorry to say that I need to stand down from the applicant panel in November.","My dissertation submission has been brought forward to 2 December following a change of supervisor, and the fieldwork I had planned for October now has to happen in the first half of November. I would not be able to give the panel the time it needs, and I would rather say so in September than let you down in the week itself.","I am conscious my name is on the published material. If it helps, Yusuf Kaya sat on last year’s panel and has said he would be willing to take my place — I have copied him in. I am also happy to do the briefing session so that whoever replaces me has my notes on the shortlisting.","Apologies again for the change.","Yours sincerely,","Grace Mwangi"],"model_html":"\u003cp>Dear Admissions Team,\u003c/p>\u003cp>I am very sorry to say that I need to stand down from the applicant panel in November.\u003c/p>\u003cp>My dissertation submission has been brought forward to 2 December following a change of supervisor, and the fieldwork I had planned for October now has to happen in the first half of November. I would not be able to give the panel the time it needs, and I would rather say so in September than let you down in the week itself.\u003c/p>\u003cp>I am conscious my name is on the published material. If it helps, Yusuf Kaya sat on last year’s panel and has said he would be willing to take my place — I have copied him in. I am also happy to do the briefing session so that whoever replaces me has my notes on the shortlisting.\u003c/p>\u003cp>Apologies again for the change.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Grace Mwangi\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, Unfortunately I will not be able to participate in the applicant panel in November because my dissertation deadline has changed and I am very busy now. I am sorry for the inconvenience but I am sure you can find somebody else as there are many students who would like to do this. Thank you for understanding.","Grace"],"degraded_html":"\u003cp>Dear Sir/Madam, Unfortunately I will not be able to participate in the applicant panel in November because my dissertation deadline has changed and I am very busy now. I am sorry for the inconvenience but I am sure you can find somebody else as there are many students who would like to do this. Thank you for understanding.\u003c/p>\u003cp>Grace\u003c/p>","degraded_band":3,"model_words":148,"fault_list":{"tag":"F3","faults":["No repair. \"I am sure you can find somebody else\" is the office’s problem handed back with an assurance attached. The third bullet is not addressed.","The reason is thin and self-centred. \"I am very busy now\" could be said by anyone at any time; the actual constraint, a moved deadline and relocated fieldwork, is reduced to a clause.","It ignores the published material and the notice period, and closes with \"Thank you for understanding\", which thanks them in advance for accepting what has already been decided."],"html":["\u003cp>1.  No repair. \"I am sure you can find somebody else\" is the office’s problem handed back with an assurance attached. The third bullet is not addressed.\u003c/p>","\u003cp>2.  The reason is thin and self-centred. \"I am very busy now\" could be said by anyone at any time; the actual constraint, a moved deadline and relocated fieldwork, is reduced to a clause.\u003c/p>","\u003cp>3.  It ignores the published material and the notice period, and closes with \"Thank you for understanding\", which thanks them in advance for accepting what has already been decided.\u003c/p>"]},"scenario":"\u003cp>You agreed in June to serve on a student panel that interviews applicants in November. Your dissertation timetable has moved and you can no longer do it. The panel is already advertised with your name on it.\u003c/p>","bullets":["Say that you must withdraw.","Explain why.","Limit the damage."],"header":[["To:","admissions@northgate.ac.uk"],["Subject:","Applicant panel, November — standing down"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It ignores the published material and the notice period, and closes with “Thank you for understanding”, which thanks them in advance for accepting what has already been decided.","correct":true},{"text":"Language. “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.","correct":false},{"text":"The reason is thin and self-centred. “I am very busy now” could be said by anyone at any time; the actual constraint, a moved deadline and relocated fieldwork, is reduced to a clause.","correct":true},{"text":"No repair. “I am sure you can find somebody else” is the office’s problem handed back with an assurance attached. The third bullet is not addressed.","correct":true},{"text":"“Governments waste money on many less important things” does not answer Grace’s argument, which is about the best use of a fixed sum within this policy.","correct":false},{"text":"Language: “the main responsible” (those mainly responsible); “the pollution of the rivers”, “the infrastructure”, “the government” over-articled; “the rivers are dying” is rhetoric standing in for the measurement the question needed.","correct":false}],"key_html":"F3"}};</script>
