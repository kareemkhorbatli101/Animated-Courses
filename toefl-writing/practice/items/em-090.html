<script>window.ITEM={"kind":"exercise","id":"EM 090","slug":"em-090","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request to an authority","payload":{"Strategy":"separate the request from the grievance that prompted it","Grammar":"nominalisation for neutrality","Vocabulary":"allocation, oversubscribed, ballot, reallocate","Convention":"requesting a place that was allocated to someone else"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You have two things to say. Why not say both?\u003c/p>\u003cp>b.  What is the strongest fact in your favour?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does oversubscribed mean, and what is a ballot?\u003c/p>\u003cp>b.  Distinguish an allocation from an offer.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask in one sentence built on the written confirmation.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The complaint is mentioned and deferred. Why mention it at all?\u003c/p>\u003cp>b.  Three acceptable outcomes are listed. Does that weaken the request?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"how the reallocation was carried out\" — why the nominalisation rather than \"how you reallocated my place\"?\u003c/p>\u003cp>b.  \"it does not say so\" — why end the paragraph on four words?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because they need different handling. The place is a decision this office can make today; the handling of the allocation is a complaint that goes elsewhere and takes weeks. Combining them delays the only thing that is still recoverable.\u003c/p>\u003cp>b.  The written confirmation, with an unconditional wording and a date before the booking. It is documentary, it is in the office’s own records, and it creates a reliance they will want to resolve.\u003c/p>","P2":"\u003cp>a.  Oversubscribed means more applicants than places; a ballot allocates them at random when demand exceeds supply.\u003c/p>\u003cp>b.  An offer invites acceptance and may be conditional; an allocation records a place assigned. Written confirmation of an allocation is much harder to withdraw.\u003c/p>","P3":"\u003cp>Model: \"I received written confirmation of a place on 11 February and booked non-refundable flights on 14 February, so I am asking to be reinstated.\"\u003c/p>","F1":"\u003cp>a.  So that it is on the record and cannot later be characterised as an afterthought, and so the office knows the writer has chosen not to escalate yet. Saying it will go elsewhere also keeps this email about one decision.\u003c/p>\u003cp>b.  No — it strengthens it, because it gives the office a way to resolve the matter even if the place is genuinely gone. A request with one acceptable outcome can only be granted or refused.\u003c/p>","F2":"\u003cp>a.  Because the nominalisation names the process without accusing the reader, who may not have made the decision. The complaint stays available while the email remains something this officer can act on without defending themselves.\u003c/p>\u003cp>b.  It puts the weight on the document rather than on the writer’s belief. The confirmation either contains a condition or it does not, and the short sentence invites the reader to check — which is the whole case.\u003c/p>","F3":"\u003cp>1.  The grievance and the request are fused, so the office must answer \"who made the decision and on what basis\" before it can address the place. The second bullet fails.\u003c/p>\u003cp>2.  No alternative is offered and \"I expect my place to be reinstated immediately\" leaves no outcome but yes or no, so the third bullet fails.\u003c/p>\u003cp>3.  The confirmation is mentioned but not quoted, dated or attached, and the flight cost appears as a grievance rather than as the reliance that makes the case.\u003c/p>"},"model":["Dear Fieldwork Office,","On 11 February I received written confirmation of a place on the Cape Verde trip (email attached, from this address). On 3 April I was told the trip was oversubscribed and my place had gone. I am asking to be reinstated.","The basis is simply the written confirmation. I booked flights to Praia on 14 February for £310, non-refundable, on the strength of it, and I have no reason to think the confirmation was conditional — it does not say so.","If reinstatement is genuinely not possible, I would accept either a place on the September repeat trip, if the module can be completed late, or confirmation that the flight cost will be reimbursed. Any of the three resolves it from my side.","I do have concerns about how the reallocation was carried out, and I will put those separately to the department so that they do not sit in the way of this request.","Yours sincerely,","Tomas Reyes — 2200915"],"model_html":"\u003cp>Dear Fieldwork Office,\u003c/p>\u003cp>On 11 February I received written confirmation of a place on the Cape Verde trip (email attached, from this address). On 3 April I was told the trip was oversubscribed and my place had gone. I am asking to be reinstated.\u003c/p>\u003cp>The basis is simply the written confirmation. I booked flights to Praia on 14 February for £310, non-refundable, on the strength of it, and I have no reason to think the confirmation was conditional — it does not say so.\u003c/p>\u003cp>If reinstatement is genuinely not possible, I would accept either a place on the September repeat trip, if the module can be completed late, or confirmation that the flight cost will be reimbursed. Any of the three resolves it from my side.\u003c/p>\u003cp>I do have concerns about how the reallocation was carried out, and I will put those separately to the department so that they do not sit in the way of this request.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Tomas Reyes — 2200915\u003c/p>","model_band":5,"degraded":["Dear Fieldwork Office, I am extremely disappointed to have been told that my place on the Cape Verde trip has been given to someone else, especially as I was confirmed in writing back in February. I do not think this is at all fair or professional, and I would like to know on what basis the decision was made and who made it. I have already paid for flights which I cannot get back. I expect my place to be reinstated immediately.","Tomas"],"degraded_html":"\u003cp>Dear Fieldwork Office, I am extremely disappointed to have been told that my place on the Cape Verde trip has been given to someone else, especially as I was confirmed in writing back in February. I do not think this is at all fair or professional, and I would like to know on what basis the decision was made and who made it. I have already paid for flights which I cannot get back. I expect my place to be reinstated immediately.\u003c/p>\u003cp>Tomas\u003c/p>","degraded_band":3,"model_words":163,"fault_list":{"tag":"F3","faults":["The grievance and the request are fused, so the office must answer \"who made the decision and on what basis\" before it can address the place. The second bullet fails.","No alternative is offered and \"I expect my place to be reinstated immediately\" leaves no outcome but yes or no, so the third bullet fails.","The confirmation is mentioned but not quoted, dated or attached, and the flight cost appears as a grievance rather than as the reliance that makes the case."],"html":["\u003cp>1.  The grievance and the request are fused, so the office must answer \"who made the decision and on what basis\" before it can address the place. The second bullet fails.\u003c/p>","\u003cp>2.  No alternative is offered and \"I expect my place to be reinstated immediately\" leaves no outcome but yes or no, so the third bullet fails.\u003c/p>","\u003cp>3.  The confirmation is mentioned but not quoted, dated or attached, and the flight cost appears as a grievance rather than as the reliance that makes the case.\u003c/p>"]},"scenario":"\u003cp>A fieldwork place you were promised in writing has been given to someone else because the trip was oversubscribed. You want the place, and separately you think the allocation was handled badly.\u003c/p>","bullets":["Ask for the place.","Keep the complaint out of the request.","Say what you will accept instead."],"header":[["To:","fieldwork.geog@northgate.ac.uk"],["Subject:","Cape Verde allocation — request to be reinstated"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language: “control that they are respected” is a false friend for “enforce them”; “the whole society”, “the companies”, “the governments” over-articled; “a real change” is vague.","correct":false},{"text":"“We have to accept some sacrifices for the greater good” restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.","correct":false},{"text":"The confirmation is mentioned but not quoted, dated or attached, and the flight cost appears as a grievance rather than as the reliance that makes the case.","correct":true},{"text":"It takes no position. “Both have good arguments” followed by a compromise that neither would dispute.","correct":false},{"text":"The grievance and the request are fused, so the office must answer “who made the decision and on what basis” before it can address the place. The second bullet fails.","correct":true},{"text":"No alternative is offered and “I expect my place to be reinstated immediately” leaves no outcome but yes or no, so the third bullet fails.","correct":true}],"key_html":"F3"}};</script>
