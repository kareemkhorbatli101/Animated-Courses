<script>window.ITEM={"kind":"exercise","id":"AD 058","slug":"ad-058","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Linguistics · agree / disagree","payload":{"Strategy":"distinguish a descriptive claim from a prescriptive one","Grammar":"generic reference","Vocabulary":"prescriptive, descriptive, register, standard variety","Convention":"arguing about language change"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Ola and Ben are answering different questions. Identify each.\u003c/p>\u003cp>b.  The prompt asks whether there is \"anything to\" the complaint. Why is that phrasing an opening?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish prescriptive from descriptive claims about language.\u003c/p>\u003cp>b.  What is a standard variety, and what is register?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that separates the two questions.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response grants the complaint in a reduced form. What exactly is granted?\u003c/p>\u003cp>b.  Why does the second paragraph bring in the dual number?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"A language with a hundred million speakers does not degrade\" — why the generic, and what does it exclude?\u003c/p>\u003cp>b.  \"misdescribed rather than baseless\" — what work does this pairing do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Ola answers whether the language system is degrading — a descriptive question. Ben answers whether individuals are worse at producing a prestige variety — a question about skill distribution. Both can be answered independently.\u003c/p>\u003cp>b.  Because it does not ask whether the complaint is correct but whether any part of it tracks something real. That invites a reduced version rather than a straight yes or no, and the strongest response finds the part that survives.\u003c/p>","P2":"\u003cp>a.  A descriptive claim reports how people use language; a prescriptive claim says how they ought to. The deterioration thesis dresses the second as the first.\u003c/p>\u003cp>b.  A standard variety is the codified form used in education, publishing and administration; register is variation by situation — the ability to switch is what Ben is really describing.\u003c/p>","P3":"\u003cp>Model: \"The language is not deteriorating, but command of its standard variety is unequally distributed, and that is what the complaint is really noticing.\"\u003c/p>","F1":"\u003cp>a.  Not that the language is degrading, but that the thing people observe — writing that fails where the standard variety is expected — is real, and that the explanation they reach for is the wrong one. The observation is granted; the diagnosis is refused.\u003c/p>\u003cp>b.  Because it shows that mourning a distinction depends on living memory rather than on the distinction’s value. Nobody mourns the dual number, which was lost the same way, so the asymmetry exposes the complaint as generational rather than linguistic.\u003c/p>","F2":"\u003cp>a.  The generic makes a claim about languages of that kind rather than about English, so it does not depend on the particular distinctions in dispute. It excludes the real case of endangered languages with few speakers, where loss of resources is not redistribution — the hedge is doing genuine work.\u003c/p>\u003cp>b.  It separates two ways a complaint can fail. Baseless means there is nothing to see; misdescribed means the observation is sound and the account of it is wrong. Choosing the second is what lets the response agree with Ola on the linguistics and still take the complainants seriously.\u003c/p>","F3":"\u003cp>1.  Ben’s point is answered with what employers ought to do, which does not help the student in front of you and does not engage the claim about unequal command.\u003c/p>\u003cp>2.  \"Linguists have proven\" and \"language belongs to the people who speak it\" are appeals to authority and to slogan where an argument was needed.\u003c/p>\u003cp>3.  The Shakespeare example is not relevant to the complaint — nobody objects to coinage — and there is a comma splice in the second sentence.\u003c/p>"},"model":["Ola is right about the language and Ben about the writers, and the complaint survives only in that second form.","As a claim about the system the thesis is false, and Ola gives the reason: every distinction mourned was once an innovation: the loss of the subjunctive in English is mourned by people who do not mourn the loss of the dual number, the difference being that nobody alive remembers the second. A language with a hundred million speakers does not degrade; it redistributes its resources, losing an inflection and acquiring a discourse marker.","But Ben has identified what the complaint is about: not the system but command of one variety. The ability to produce standard written English on demand is unevenly distributed, is strongly correlated with schooling and class, and is still what gatekeepers test. A student who cannot switch into that register is disadvantaged whether or not linguistics approves of the gatekeeping.","So the complaint is misdescribed rather than baseless. What people notice is real — writing that fails where the standard variety is expected — and they explain it wrongly, as decay in the language rather than as unequal access to one register of it. The honest position is that nothing is wrong with the language and something is wrong with who gets taught to use its prestige form."],"model_html":"\u003cp>Ola is right about the language and Ben about the writers, and the complaint survives only in that second form.\u003c/p>\u003cp>As a claim about the system the thesis is false, and Ola gives the reason: every distinction mourned was once an innovation: the loss of the subjunctive in English is mourned by people who do not mourn the loss of the dual number, the difference being that nobody alive remembers the second. A language with a hundred million speakers does not degrade; it redistributes its resources, losing an inflection and acquiring a discourse marker.\u003c/p>\u003cp>But Ben has identified what the complaint is about: not the system but command of one variety. The ability to produce standard written English on demand is unevenly distributed, is strongly correlated with schooling and class, and is still what gatekeepers test. A student who cannot switch into that register is disadvantaged whether or not linguistics approves of the gatekeeping.\u003c/p>\u003cp>So the complaint is misdescribed rather than baseless. What people notice is real — writing that fails where the standard variety is expected — and they explain it wrongly, as decay in the language rather than as unequal access to one register of it. The honest position is that nothing is wrong with the language and something is wrong with who gets taught to use its prestige form.\u003c/p>","model_band":5,"degraded":["I completely agree with Ola because linguists have proven that language change is a natural process and not a decline. Older people always complain about young people, this has happened throughout history and it is a kind of prejudice. Shakespeare invented many words and nobody complains about him now. Ben says students need to write properly for jobs but I think employers should be more open-minded and accept different ways of writing instead of judging people by old fashioned rules. Language belongs to the people who speak it."],"degraded_html":"\u003cp>I completely agree with Ola because linguists have proven that language change is a natural process and not a decline. Older people always complain about young people, this has happened throughout history and it is a kind of prejudice. Shakespeare invented many words and nobody complains about him now. Ben says students need to write properly for jobs but I think employers should be more open-minded and accept different ways of writing instead of judging people by old fashioned rules. Language belongs to the people who speak it.\u003c/p>","degraded_band":3,"model_words":220,"fault_list":{"tag":"F3","faults":["Ben’s point is answered with what employers ought to do, which does not help the student in front of you and does not engage the claim about unequal command.","\"Linguists have proven\" and \"language belongs to the people who speak it\" are appeals to authority and to slogan where an argument was needed.","The Shakespeare example is not relevant to the complaint — nobody objects to coinage — and there is a comma splice in the second sentence."],"html":["\u003cp>1.  Ben’s point is answered with what employers ought to do, which does not help the student in front of you and does not engage the claim about unequal command.\u003c/p>","\u003cp>2.  \"Linguists have proven\" and \"language belongs to the people who speak it\" are appeals to authority and to slogan where an argument was needed.\u003c/p>","\u003cp>3.  The Shakespeare example is not relevant to the complaint — nobody objects to coinage — and there is a comma splice in the second sentence.\u003c/p>"]},"prof_name":"Dr Haddad","professor":"\u003cp>It is often said that language is deteriorating — that young people write less carefully, that distinctions are being lost, and that digital communication accelerates the decline. Linguists generally reject this. Is there anything to the complaint?\u003c/p>","students":[["Ola","Nothing at all. Every generation has said it since Latin. Change is not decay — the distinctions being \"lost\" were themselves innovations that someone once complained about."],["Ben","That answer is too quick. Even if the system is not degrading, individual writers can be worse at producing the variety that gets them a job. Telling them change is natural does not help them."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Nothing is offered in return and the swap is presented as neutral, so the second bullet fails — and “I am sure you understand” presumes the agreement.","correct":false},{"text":"The Shakespeare example is not relevant to the complaint — nobody objects to coinage — and there is a comma splice in the second sentence.","correct":true},{"text":"“Linguists have proven” and “language belongs to the people who speak it” are appeals to authority and to slogan where an argument was needed.","correct":true},{"text":"Ben’s point is answered with what employers ought to do, which does not help the student in front of you and does not engage the claim about unequal command.","correct":true},{"text":"No diagnosis, so no proposal follows. The cause offered is “some people never clean anything” — a complaint about individuals, which supports no scheme. The first bullet asked for the cause, and this does not supply one that leads anywhere.","correct":false},{"text":"“Very confusing and makes it impossible to plan” is a complaint about the institution’s communication, and “several times” is vaguer than the three and one the writer could have counted.","correct":false}],"key_html":"F3"}};</script>
