<script>window.ITEM={"kind":"exercise","id":"EM 067","slug":"em-067","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and reminder","payload":{"Strategy":"remind by supplying what the reader needs to act","Grammar":"present perfect continuous","Vocabulary":"chase, bump, outstanding, action","Convention":"chasing a third time without reproach"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Two emails have gone unanswered. What should change in the third?\u003c/p>\u003cp>b.  Why state the consequence rather than imply urgency?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to chase something, and what is an outstanding action?\u003c/p>\u003cp>b.  What is a bump, and when is the word inappropriate?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Write the first two lines so the whole task is visible without scrolling.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email opens with \"One signature, one page, attached\". Why not with the context?\u003c/p>\u003cp>b.  The third paragraph offers a route in which the reader does not sign at all. Is that giving up?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I have been trying to get this to you since 2 April\" — what does the present perfect continuous do that \"I emailed twice\" would not?\u003c/p>\u003cp>b.  \"Apologies for the third email\" — who is this apology actually for?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The amount of work the reader has to do. Two emails have established the request; the third should reduce the task to its smallest form and remove every reason not to act now.\u003c/p>\u003cp>b.  Because \"urgent\" is a word the reader discounts, while a date on which an offer is withdrawn is a fact they can check. It also makes the cost visible without blaming anyone.\u003c/p>","P2":"\u003cp>a.  To chase is to pursue an overdue response; an outstanding action is a task still awaiting completion.\u003c/p>\u003cp>b.  A bump is a short message pushing a thread back to the top. It is fine among peers and wrong to a senior academic, where it sounds like prodding.\u003c/p>","P3":"\u003cp>Model: \"One signature, one page, attached — if you can sign page 3 and reply with it attached, that is the whole task.\"\u003c/p>","F1":"\u003cp>a.  Because the reader has twice decided this email can wait, and the deciding factor is how big the task looks in the first line. Context in the first paragraph makes it look like reading; the task in the first line makes it look like thirty seconds.\u003c/p>\u003cp>b.  No — it is the one move that guarantees an outcome. The writer needs a signature or a reallocation, and offering the second makes silence the only option that costs the reader something, which is exactly the pressure a third email needs.\u003c/p>","F2":"\u003cp>a.  It presents the effort as continuing and unresolved rather than as two completed acts the reader failed to answer. That keeps the focus on the pending task instead of on their non-response, which would read as an accusation.\u003c/p>\u003cp>b.  The reader. It costs the writer nothing and it lets the reader act without first having to acknowledge two ignored emails. Removing that small embarrassment makes replying easier.\u003c/p>","F3":"\u003cp>1.  \"Sent twice, on 2 April and 11 April\" and \"I still have not received your signature\" put the reader’s failure at the centre, which makes replying an admission.\u003c/p>\u003cp>2.  \"The deadline is at the end of this month\" is wrong and vague — the real cut-off is 28 April because of countersigning. The second bullet is not met and the third fails entirely.\u003c/p>\u003cp>3.  No alternatives, no delegation, no reallocation route, and \"I am becoming quite worried\" asks the reader to manage the writer’s anxiety rather than to sign a page.\u003c/p>"},"model":["Dear Dr Whitfield,","One signature, one page, attached — the placement agreement for my summer position at Harlow Environmental. If you can sign page 3 and reply with it attached, that is the whole task.","I have been trying to get this to you since 2 April and I know the timing is bad with exam boards. The deadline is firm: Harlow withdraw the offer if the signed agreement is not with them by 30 April, and the placement office needs two days to countersign, so 28 April is my real cut-off.","If signing is the problem rather than the time, three alternatives: I can bring a paper copy to your office at any hour on Monday or Tuesday; Dr Oyelaran has said she will sign as acting supervisor if you would rather delegate it; or if you are not able to supervise this placement at all, tell me today and I will ask the office to reallocate.","Apologies for the third email.","Best wishes,","Tariq Haddad — 2198044"],"model_html":"\u003cp>Dear Dr Whitfield,\u003c/p>\u003cp>One signature, one page, attached — the placement agreement for my summer position at Harlow Environmental. If you can sign page 3 and reply with it attached, that is the whole task.\u003c/p>\u003cp>I have been trying to get this to you since 2 April and I know the timing is bad with exam boards. The deadline is firm: Harlow withdraw the offer if the signed agreement is not with them by 30 April, and the placement office needs two days to countersign, so 28 April is my real cut-off.\u003c/p>\u003cp>If signing is the problem rather than the time, three alternatives: I can bring a paper copy to your office at any hour on Monday or Tuesday; Dr Oyelaran has said she will sign as acting supervisor if you would rather delegate it; or if you are not able to supervise this placement at all, tell me today and I will ask the office to reallocate.\u003c/p>\u003cp>Apologies for the third email.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Tariq Haddad — 2198044\u003c/p>","model_band":5,"degraded":["Dear Dr Whitfield, I am writing again regarding the placement agreement which I have now sent twice, on 2 April and 11 April. I still have not received your signature and the deadline is at the end of this month. I understand you are very busy but this placement is extremely important for me and I am becoming quite worried about it. Could you please sign the form and send it back to me as soon as possible? I would be very grateful.","Tariq"],"degraded_html":"\u003cp>Dear Dr Whitfield, I am writing again regarding the placement agreement which I have now sent twice, on 2 April and 11 April. I still have not received your signature and the deadline is at the end of this month. I understand you are very busy but this placement is extremely important for me and I am becoming quite worried about it. Could you please sign the form and send it back to me as soon as possible? I would be very grateful.\u003c/p>\u003cp>Tariq\u003c/p>","degraded_band":3,"model_words":168,"fault_list":{"tag":"F3","faults":["\"Sent twice, on 2 April and 11 April\" and \"I still have not received your signature\" put the reader’s failure at the centre, which makes replying an admission.","\"The deadline is at the end of this month\" is wrong and vague — the real cut-off is 28 April because of countersigning. The second bullet is not met and the third fails entirely.","No alternatives, no delegation, no reallocation route, and \"I am becoming quite worried\" asks the reader to manage the writer’s anxiety rather than to sign a page."],"html":["\u003cp>1.  \"Sent twice, on 2 April and 11 April\" and \"I still have not received your signature\" put the reader’s failure at the centre, which makes replying an admission.\u003c/p>","\u003cp>2.  \"The deadline is at the end of this month\" is wrong and vague — the real cut-off is 28 April because of countersigning. The second bullet is not met and the third fails entirely.\u003c/p>","\u003cp>3.  No alternatives, no delegation, no reallocation route, and \"I am becoming quite worried\" asks the reader to manage the writer’s anxiety rather than to sign a page.\u003c/p>"]},"scenario":"\u003cp>You have asked twice for a signature on a placement agreement. Without it you lose the placement on 30 April. The person who must sign has not replied to either email.\u003c/p>","bullets":["Chase once more.","Make signing take under a minute.","Say what happens if it does not arrive."],"header":[["To:","j.whitfield@northgate.ac.uk"],["Subject:","Placement form — signature needed by 28 April"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Sent twice, on 2 April and 11 April” and “I still have not received your signature” put the reader’s failure at the centre, which makes replying an admission.","correct":true},{"text":"No alternatives, no delegation, no reallocation route, and “I am becoming quite worried” asks the reader to manage the writer’s anxiety rather than to sign a page.","correct":true},{"text":"Language: “the governments always make these decisions without thinking” is unsupported and rhetorical; “normal families”, “this economic situation”, “everything is becoming more expensive” are vague; “punish” prejudges the question.","correct":false},{"text":"Language. “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.","correct":false},{"text":"“The deadline is at the end of this month” is wrong and vague — the real cut-off is 28 April because of countersigning. The second bullet is not met and the third fails entirely.","correct":true},{"text":"“They collect our data and sell it to advertisers” is asserted without qualification and is not uniformly true. Language: “the companies”, “our data”, “these annoying windows” — register drops to the conversational, and “absolutely useless” is editorial.","correct":false}],"key_html":"F3"}};</script>
