<script>window.ITEM={"kind":"exercise","id":"EM 092","slug":"em-092","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Negotiation and rescheduling","payload":{"Strategy":"open with the constraint you can relax, not the one you cannot","Grammar":"both ... and for packaging","Vocabulary":"slot, swap, cover, trade","Convention":"negotiating with a peer where both of you lose something"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You both have fixed constraints. What is the only thing that makes a deal possible?\u003c/p>\u003cp>b.  Why open with what you can give?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish a swap, a trade and cover.\u003c/p>\u003cp>b.  Why is \"I need the mornings\" a bad opening sentence?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open the negotiation with a concession, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer gives something away in the first sentence. What, and why there?\u003c/p>\u003cp>b.  The proposal gives the other student more hours than the writer. Is that a mistake?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"both a full day and a shorter week\" — what does \"both ... and\" do that a list would not?\u003c/p>\u003cp>b.  \"I would rather we both got what we actually need than split everything down the middle\" — what principle is being rejected?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the constraints are different in shape. He cannot do Tuesdays and Thursdays; you need consecutive mornings. Those do not collide, which means a deal exists — the work is finding it, not winning it.\u003c/p>\u003cp>b.  Because it establishes immediately that this is a negotiation rather than a request, and because a concession offered before you ask for anything is worth far more than the same concession offered after.\u003c/p>","P2":"\u003cp>a.  A swap exchanges two slots directly; a trade exchanges unlike things for agreed value; cover is doing someone else’s slot for them without exchange.\u003c/p>\u003cp>b.  Because it states your requirement as the premise of the conversation, which leaves him only the options of agreeing or refusing. It also says nothing about what you are offering.\u003c/p>","P3":"\u003cp>Model: \"I can give up the Friday block entirely if that helps.\"\u003c/p>","F1":"\u003cp>a.  The Friday block — before any request, before the problem is even explained. Placed there it is unmistakably a gift rather than a bargaining chip, which changes how everything after it reads.\u003c/p>\u003cp>b.  No. The writer needs one specific thing (two consecutive mornings) and is indifferent to total hours; Olle values hours and a compressed week. Trading something you do not value for something you do is the whole of negotiation, and counting hours would have missed it.\u003c/p>","F2":"\u003cp>a.  It packages two separate benefits as a single offer, so they are received together rather than weighed one at a time. The correlative also signals that the writer has thought about what Olle wants, not just what he can spare.\u003c/p>\u003cp>b.  Splitting the difference — the instinct to divide everything evenly. It is rejected because equal shares here would leave both of them with unusable blocks, which is the exact failure the current rota already demonstrates.\u003c/p>","F3":"\u003cp>1.  It opens with its own problem and offers nothing. The Friday block, the obvious concession, is never mentioned, so the third bullet fails.\u003c/p>\u003cp>2.  It decides the other person’s constraints for them. \"The mornings should be fine for you anyway since you only need afternoons\" tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.\u003c/p>\u003cp>3.  \"Could you move your afternoons so that I can have ...\" asks him to absorb the whole adjustment, and \"Let me know if this is OK\" presents a single option as a decision already taken.\u003c/p>"},"model":["Hi Olle,","I can give up the Friday block entirely if that helps — I think we can make this work better than the current rota does for either of us.","My problem is that the incubation runs need two consecutive mornings, which at the moment I never get: I have Monday and Thursday, so the samples sit for two days in between and the second run is useless.","I know Tuesdays and Thursdays are out for you because of work. So what about this: I take Monday and Tuesday mornings, you take Monday and Wednesday afternoons plus all of Friday, and Thursday goes to whoever needs it that week. That gives you both a full day and a shorter week, and it gets me the consecutive pair.","If the Friday block matters more to you than I think, say so and I will rework it — I would rather we both got what we actually need than split everything down the middle.","Nour"],"model_html":"\u003cp>Hi Olle,\u003c/p>\u003cp>I can give up the Friday block entirely if that helps — I think we can make this work better than the current rota does for either of us.\u003c/p>\u003cp>My problem is that the incubation runs need two consecutive mornings, which at the moment I never get: I have Monday and Thursday, so the samples sit for two days in between and the second run is useless.\u003c/p>\u003cp>I know Tuesdays and Thursdays are out for you because of work. So what about this: I take Monday and Tuesday mornings, you take Monday and Wednesday afternoons plus all of Friday, and Thursday goes to whoever needs it that week. That gives you both a full day and a shorter week, and it gets me the consecutive pair.\u003c/p>\u003cp>If the Friday block matters more to you than I think, say so and I will rework it — I would rather we both got what we actually need than split everything down the middle.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi Olle, The current rota is not working for me at all because I need two mornings in a row for my incubations and at the moment I have Monday and Thursday which is useless. Could you move your afternoons so that I can have Monday and Tuesday mornings? I know you work on Tuesday and Thursday but the mornings should be fine for you anyway since you only need afternoons. Let me know if this is OK.","Nour"],"degraded_html":"\u003cp>Hi Olle, The current rota is not working for me at all because I need two mornings in a row for my incubations and at the moment I have Monday and Thursday which is useless. Could you move your afternoons so that I can have Monday and Tuesday mornings? I know you work on Tuesday and Thursday but the mornings should be fine for you anyway since you only need afternoons. Let me know if this is OK.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":162,"fault_list":{"tag":"F3","faults":["It opens with its own problem and offers nothing. The Friday block, the obvious concession, is never mentioned, so the third bullet fails.","It decides the other person’s constraints for them. \"The mornings should be fine for you anyway since you only need afternoons\" tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.","\"Could you move your afternoons so that I can have ...\" asks him to absorb the whole adjustment, and \"Let me know if this is OK\" presents a single option as a decision already taken."],"html":["\u003cp>1.  It opens with its own problem and offers nothing. The Friday block, the obvious concession, is never mentioned, so the third bullet fails.\u003c/p>","\u003cp>2.  It decides the other person’s constraints for them. \"The mornings should be fine for you anyway since you only need afternoons\" tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.\u003c/p>","\u003cp>3.  \"Could you move your afternoons so that I can have ...\" asks him to absorb the whole adjustment, and \"Let me know if this is OK\" presents a single option as a decision already taken.\u003c/p>"]},"scenario":"\u003cp>You and another student share a lab bench booked in four-hour blocks. Your experiment needs two consecutive mornings; theirs needs afternoons but they have a job on Tuesdays and Thursdays.\u003c/p>","bullets":["Say what you need.","Show that you have understood their constraint.","Propose something that costs you something too."],"header":[["To:","o.lindqvist@northgate.ac.uk"],["Subject:","Bench 6 — can we redo the rota?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It opens with its own problem and offers nothing. The Friday block, the obvious concession, is never mentioned, so the third bullet fails.","correct":true},{"text":"“Which is obviously good for society” does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.","correct":false},{"text":"It decides the other person’s constraints for them. “The mornings should be fine for you anyway since you only need afternoons” tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.","correct":true},{"text":"Rui’s exception is the only substantive point in the discussion and it is dismissed as “a detail” without argument — and it is exactly where the large emissions are.","correct":false},{"text":"The regulation proposal and the reference to children arrive at the end without argument. Language: “the companies”, “the users”, “the technology companies” over-articled; “addictive” is asserted rather than defined.","correct":false},{"text":"“Could you move your afternoons so that I can have ...” asks him to absorb the whole adjustment, and “Let me know if this is OK” presents a single option as a decision already taken.","correct":true}],"key_html":"F3"}};</script>
