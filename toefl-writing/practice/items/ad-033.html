<script>window.ITEM={"kind":"exercise","id":"AD 033","slug":"ad-033","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology and society · value trade-off","payload":{"Strategy":"ask which good is recoverable if you choose wrongly","Grammar":"comparative of importance","Vocabulary":"autonomy, paternalism, nudge, informed consent","Convention":"arguing about paternalism without insulting either side"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Theo says Juno’s argument \"proves too much\". What does that phrase mean?\u003c/p>\u003cp>b.  Does Juno’s point about neutrality survive his objection?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a nudge, and how is it distinguished from a mandate?\u003c/p>\u003cp>b.  What does informed consent require that a default does not?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the distinction that saves Juno’s point from Theo’s objection, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response substitutes one criterion for another. What for what?\u003c/p>\u003cp>b.  Why does it end by saying the test would rule several schemes out?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"not the benefit of the default but the cost of leaving it\" — name the structure and its function.\u003c/p>\u003cp>b.  \"which is true of rather more defaults than their designers admit\" — what is the function of this aside?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the argument, if valid, would also justify conclusions its author would reject — so something in it is too broad.\u003c/p>\u003cp>b.  Yes. The non-existence of a neutral default is simply true. What fails is the move from there to \"therefore choose the beneficial one\", which needs a further premise about who decides and how it is checked.\u003c/p>","P2":"\u003cp>a.  A nudge changes the architecture of a choice without removing options; a mandate removes them. The response argues that some nudges are mandates in practice.\u003c/p>\u003cp>b.  That the person knows they are choosing, understands the alternatives, and acts. A default requires none of these and often works precisely because they are absent.\u003c/p>","P3":"\u003cp>Model: \"The defence works where exit is cheap and fails where it is not, which is a distinction between defaults rather than between outcome and autonomy.\"\u003c/p>","F1":"\u003cp>a.  Benefit of the default, replaced by reversibility of the error. The first requires someone to adjudicate what is good for people, which is Theo’s objection; the second is a property of the scheme that can be assessed without that judgement.\u003c/p>\u003cp>b.  Because a criterion that endorses everything currently done is not a criterion. Showing that it bites — that it rules things out — is what demonstrates it is doing work rather than rationalising.\u003c/p>","F2":"\u003cp>a.  A \"not ... but\" correlative. It replaces the criterion in a single sentence, with the rejected one named so the reader can see exactly what has been swapped.\u003c/p>\u003cp>b.  It converts the distinction from a philosophical one into a practical accusation, and it does so in a subordinate clause so the claim is made without having to be defended at length — efficient, and worth noticing when it is done to you.\u003c/p>","F3":"\u003cp>1.  It restates the two positions as \"efficiency versus freedom\" and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.\u003c/p>\u003cp>2.  \"Too lazy or too busy\" is a judgement about the people the policy affects, offered as though it were an argument for the policy.\u003c/p>\u003cp>3.  Language: \"their own life and their own body\" (lives, bodies), \"choose consciously\" (make an informed choice), and \"a question of balance\" announces a conclusion the response never reaches.\u003c/p>"},"model":["Juno is right that there is no neutral default and Theo is right that the argument does not stop where she wants it to. What rescues her position is not the benefit of the default but the cost of leaving it: automatic enrolment in a pension is reversible in a form, while an automatic organ donation register is not reversible by anyone who did not notice they were on it. Those are not the same kind of policy merely because both are defaults.","So the trade-off is not outcome against choice-quality in general. It is whether a wrong default can be cheaply undone by the person it was wrong for. Where exit is one form and no stigma, Juno’s argument is close to decisive and Theo’s check is the exit itself. Where exit is costly, socially marked or impossible — which is true of rather more defaults than their designers admit — the default is functioning as a mandate and should be argued for as one. That would rule out several schemes currently defended by exactly the argument Juno is making."],"model_html":"\u003cp>Juno is right that there is no neutral default and Theo is right that the argument does not stop where she wants it to. What rescues her position is not the benefit of the default but the cost of leaving it: automatic enrolment in a pension is reversible in a form, while an automatic organ donation register is not reversible by anyone who did not notice they were on it. Those are not the same kind of policy merely because both are defaults.\u003c/p>\u003cp>So the trade-off is not outcome against choice-quality in general. It is whether a wrong default can be cheaply undone by the person it was wrong for. Where exit is one form and no stigma, Juno’s argument is close to decisive and Theo’s check is the exit itself. Where exit is costly, socially marked or impossible — which is true of rather more defaults than their designers admit — the default is functioning as a mandate and should be argued for as one. That would rule out several schemes currently defended by exactly the argument Juno is making.\u003c/p>","model_band":5,"degraded":["In my opinion this is a question of balance between efficiency and freedom. It is true that automatic enrolment increases participation a lot and that many people are too lazy or too busy to make these decisions themselves, so the default helps them. But on the other hand people must be free to decide about their own life and their own body, especially in the case of organ donation which is a very personal decision. I think the best solution is to have defaults but also to inform people very clearly about their options so they can choose consciously if they want."],"degraded_html":"\u003cp>In my opinion this is a question of balance between efficiency and freedom. It is true that automatic enrolment increases participation a lot and that many people are too lazy or too busy to make these decisions themselves, so the default helps them. But on the other hand people must be free to decide about their own life and their own body, especially in the case of organ donation which is a very personal decision. I think the best solution is to have defaults but also to inform people very clearly about their options so they can choose consciously if they want.\u003c/p>","degraded_band":3,"model_words":181,"fault_list":{"tag":"F3","faults":["It restates the two positions as \"efficiency versus freedom\" and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.","\"Too lazy or too busy\" is a judgement about the people the policy affects, offered as though it were an argument for the policy.","Language: \"their own life and their own body\" (lives, bodies), \"choose consciously\" (make an informed choice), and \"a question of balance\" announces a conclusion the response never reaches."],"html":["\u003cp>1.  It restates the two positions as \"efficiency versus freedom\" and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.\u003c/p>","\u003cp>2.  \"Too lazy or too busy\" is a judgement about the people the policy affects, offered as though it were an argument for the policy.\u003c/p>","\u003cp>3.  Language: \"their own life and their own body\" (lives, bodies), \"choose consciously\" (make an informed choice), and \"a question of balance\" announces a conclusion the response never reaches.\u003c/p>"]},"prof_name":"Dr Almeida","professor":"\u003cp>Policies that automatically enrol people in pension schemes, organ donation registers or default savings plans raise participation dramatically. Critics call them manipulation; defenders call them sensible defaults. Which matters more here — the outcome, or the quality of the choice?\u003c/p>","students":[["Juno","The outcome. Every option set has a default; there is no neutral arrangement. Choosing a default that benefits most people is not manipulation, it is the unavoidable exercise of a choice someone has to make."],["Theo","That argument proves too much. It would justify any default anyone thought beneficial, and the test of \"benefits most people\" is applied by the same body that sets it. The quality of the choice matters because it is the only check on whoever is choosing for us."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: “their own life and their own body” (lives, bodies), “choose consciously” (make an informed choice), and “a question of balance” announces a conclusion the response never reaches.","correct":true},{"text":"Nothing is offered for June and no autumn dates are proposed, so the third bullet fails and the partnership is left on “please do keep us in mind”.","correct":false},{"text":"“Too lazy or too busy” is a judgement about the people the policy affects, offered as though it were an argument for the policy.","correct":true},{"text":"It restates the two positions as “efficiency versus freedom” and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.","correct":true},{"text":"The register is institutional throughout — “we are delighted to invite you”, “a great opportunity”, “we look forward to welcoming you” — which reads as a formal occasion rather than a room with sandwiches in it.","correct":false},{"text":"“Trust your instinct, you usually know deep down” is reassurance rather than help, and “I am sure you will make the right decision” pre-approves any outcome, which makes it worthless as a judgement.","correct":false}],"key_html":"F3"}};</script>
