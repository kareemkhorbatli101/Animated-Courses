<script>window.ITEM={"kind":"family","id":"BAS 083–090","slug":"bas-family-11","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 11 of 12 — modality and hedging","payload":{"Strategy":"claim only as much as you can defend, and say how much that is","Grammar":"epistemic and deontic modals, perfect modals, hedging verbs","Vocabulary":"tend to, appear to, be likely to, be supposed to","Convention":"an unhedged generalisation is the easiest thing to attack"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>Modality is how English marks the difference between what is, what might be, and what ought to be. In the discussion task it does something more specific: it lets you make a strong claim without making an absolute one, and an absolute claim is the one a reader will go after first.\u003c/p>","preview":[{"tag":"P1","title":"How sure?","html":"\u003cp>Order these from least certain to most:\u003c/p>\u003cpre class=\"mono\">must be · might be · could well be · is · is likely to be · may be\u003c/pre>"},{"tag":"P2","title":"Looking back","html":"\u003cp>What is the difference between these, and what does each tell you about the form?\u003c/p>\u003cpre class=\"mono\">(a) It must have gone to the wrong address.\n(b) It should have arrived on Monday.\n(c) It could have been lost in the post.\u003c/pre>"},{"tag":"P3","title":"Defend the claim","html":"\u003cp>Which of these is easier to attack, and why?\u003c/p>\u003cpre class=\"mono\">(a) Students ignore feedback.\n(b) Students tend to ignore feedback unless it arrives\n    before the next assignment.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Calibrate","html":"\u003cp>Rewrite the flat claim at four levels of confidence, using a different device each time.\u003c/p>\u003cpre class=\"mono\">Smaller classes improve results.\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) It must gone to the wrong address.\n(b) You had better to send it tonight.\n(c) She might can come on Friday.\n(d) The form was supposed be signed.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Take a position you only half believe, and defend it in one hedged sentence.\u003c/p>\u003cpre class=\"mono\">Homework should be abolished in primary schools.\u003c/pre>"}],"keys":{"P1":"\u003cp>might be &lt; may be &lt; could well be &lt; is likely to be &lt; must be &lt; is.\u003c/p>\u003cp>Note where \u003cem>must\u003c/em> sits. In English \u003cem>it must be true\u003c/em> is weaker than \u003cem>it is true\u003c/em>: must signals that you are inferring rather than knowing.\u003c/p>","P2":"\u003cp>(a) a confident inference about what happened. (b) an expectation that was not met. (c) one possibility among several.\u003c/p>\u003cp>All three are modal + have + past participle. The modal changes; the frame does not.\u003c/p>","P3":"\u003cp>(a). It claims all students always do this, so a single counterexample destroys it.\u003c/p>\u003cp>(b) claims a tendency and names the condition under which it holds. It is a smaller claim and a far stronger position — and it reads as more expert, not less confident.\u003c/p>","F1":"\u003cp>Smaller classes may improve results.\u003c/p>\u003cp>Smaller classes tend to improve results.\u003c/p>\u003cp>Smaller classes are likely to improve results, at least in the early years.\u003c/p>\u003cp>Smaller classes must improve results, given what we know about contact time. — note this last is an inference, and invites the question of what exactly we know.\u003c/p>","F2":"\u003cp>(a) → must have gone.\u003c/p>\u003cp>(b) → had better send. No \u003cem>to\u003c/em>.\u003c/p>\u003cp>(c) → might be able to come. Two modals cannot stack.\u003c/p>\u003cp>(d) → was supposed to be signed.\u003c/p>","F3":"\u003cp>Model: \u003cem>Homework in the early primary years appears to do little for attainment and a good deal of harm to attitudes, though the evidence thins out sharply above the age of about nine.\u003c/em>\u003c/p>\u003cp>Three hedges — \u003cem>appears to\u003c/em>, \u003cem>little\u003c/em>, \u003cem>though the evidence thins\u003c/em> — and the position is still perfectly clear. Hedging is not vagueness; it is accuracy about your own confidence.\u003c/p>"},"rows":[83,84,85,86,87,88,89,90]};</script>
