<script>window.ITEM={"kind":"exercise","id":"EM 020","slug":"em-020","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"isolate the one fact in dispute and put it where it cannot be missed","Grammar":"the cleft for emphasis","Vocabulary":"standing order, lapse, pro rata, in credit","Convention":"complaining about a charge you have already paid"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The treasurer is a volunteer student, not an accounts department. How does that change the email?\u003c/p>\u003cp>b.  You might be wrong. How should that affect the way you state it?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a \u003cem>standing order\u003c/em>, and who cancels it — you or the recipient?\u003c/p>\u003cp>b.  What does it mean to be \u003cem>in credit\u003c/em>, and what does \u003cem>pro rata\u003c/em> mean?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Use a cleft sentence to put the disputed fact in the strongest position.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer blames himself twice. Count the instances and say what each is doing.\u003c/p>\u003cp>b.  Two outcomes are offered depending on facts the writer does not yet have. Why is that better than asserting one?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “It is the February one that I cannot account for.” Name the device and say why the plain version would be weaker.\u003c/p>\u003cp>b.  Why \u003cem>I think I may have paid\u003c/em> rather than \u003cem>I have paid\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Entirely. A volunteer treasurer has no system to blame and takes an accusation personally. Keep it light, make the work small, and explicitly allow for your own error.\u003c/p>\u003cp>b.  It should be in the grammar, not just the manners. Hedging the claim means that if the bank turns out to be at fault you have not accused anyone, and you can withdraw without embarrassment.\u003c/p>","P2":"\u003cp>a.  An instruction from you to your bank to pay a fixed sum regularly. Only \u003cstrong>you\u003c/strong> can cancel it — which is why this is probably the writer’s own oversight, and why saying so is honest rather than merely polite.\u003c/p>\u003cp>b.  \u003cstrong>In credit\u003c/strong> means the account holds money in your favour. \u003cstrong>Pro rata\u003c/strong> means in proportion — here, a part-year refund.\u003c/p>","P3":"\u003cp>Model: \u003cem>It is the February one that I cannot account for.\u003c/em>\u003c/p>\u003cp>The it-cleft isolates one payment from two and makes the disputed item impossible to miss, which matters when your reader is skimming on a phone.\u003c/p>","F1":"\u003cp>a.  Twice. “just as likely to be my mistake” opens the door to his own error before any claim is made; “I thought I had cancelled … but it looks as though I did not” then concedes the specific failure. The first sets the tone; the second gives the treasurer a complete explanation that costs her nothing to accept.\u003c/p>\u003cp>b.  Because he genuinely does not know whether the second payment reached the society. Branching on the fact means the treasurer can answer in one line either way, instead of having to correct him first.\u003c/p>","F2":"\u003cp>a.  An it-cleft (family 8, structure 59). \u003cem>I cannot account for the February one\u003c/em> buries the key item in the middle of the clause; the cleft puts it in focus position and contrasts it with the October payment, which is exactly the distinction the email turns on.\u003c/p>\u003cp>b.  Because he is reading his own bank statement, not the society’s books. The hedge is accurate, and it leaves him somewhere to stand if the second payment never arrived.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It accuses on a fact the writer got wrong.\u003c/strong> “obviously a mistake on your side because I cancelled the standing order” — but only the payer can cancel a standing order, so this is almost certainly his own oversight, asserted as the society’s fault.\u003c/p>\u003cp>2.  \u003cstrong>It insults a volunteer.\u003c/strong> “I am surprised that a society cannot keep proper records” is gratuitous and makes a simple correction awkward to deliver.\u003c/p>\u003cp>3.  \u003cstrong>No evidence and one rigid demand.\u003c/strong> No amounts, no payment dates from the statement, and only one acceptable outcome, where a credit against next year would have been far easier for the society to action.\u003c/p>"},"model":["Dear Priya,","I think I may have paid the membership twice, and I wanted to check before assuming anything, since it is just as likely to be my mistake as the society’s.","My statement shows £25 to Northgate Music Society on 7 October by card, and a further £25 on 3 February by standing order. It is the February one that I cannot account for — I thought I had cancelled the standing order when I paid by card, but it looks as though I did not.","If the society has only received one, then the second may have gone astray at the bank’s end and I will chase it there. If both have arrived, could the February one be refunded, or carried over as credit against next year? Either is fine, and there is no hurry.","Thanks very much — and sorry to add to the treasurer’s pile.","Best,","Tom Aldridge"],"model_html":"\u003cp>Dear Priya,\u003c/p>\u003cp>I think I may have paid the membership twice, and I wanted to check before assuming anything, since it is just as likely to be my mistake as the society’s.\u003c/p>\u003cp>My statement shows £25 to Northgate Music Society on 7 October by card, and a further £25 on 3 February by standing order. It is the February one that I cannot account for — I thought I had cancelled the standing order when I paid by card, but it looks as though I did not.\u003c/p>\u003cp>If the society has only received one, then the second may have gone astray at the bank’s end and I will chase it there. If both have arrived, could the February one be refunded, or carried over as credit against next year? Either is fine, and there is no hurry.\u003c/p>\u003cp>Thanks very much — and sorry to add to the treasurer’s pile.\u003c/p>\u003cp>Best,\u003c/p>\u003cp>Tom Aldridge\u003c/p>","model_band":5,"degraded":["Hi, You have charged me twice for the membership, once in October and once in February, which is obviously a mistake on your side because I cancelled the standing order long ago. Please refund the second payment as soon as possible. I am surprised that a society cannot keep proper records of who has paid.","Tom"],"degraded_html":"\u003cp>Hi, You have charged me twice for the membership, once in October and once in February, which is obviously a mistake on your side because I cancelled the standing order long ago. Please refund the second payment as soon as possible. I am surprised that a society cannot keep proper records of who has paid.\u003c/p>\u003cp>Tom\u003c/p>","degraded_band":3,"model_words":150,"fault_list":{"tag":"F3","faults":["It accuses on a fact the writer got wrong. “obviously a mistake on your side because I cancelled the standing order” — but only the payer can cancel a standing order, so this is almost certainly his own oversight, asserted as the society’s fault.","It insults a volunteer. “I am surprised that a society cannot keep proper records” is gratuitous and makes a simple correction awkward to deliver.","No evidence and one rigid demand. No amounts, no payment dates from the statement, and only one acceptable outcome, where a credit against next year would have been far easier for the society to action."],"html":["\u003cp>1.  \u003cstrong>It accuses on a fact the writer got wrong.\u003c/strong> “obviously a mistake on your side because I cancelled the standing order” — but only the payer can cancel a standing order, so this is almost certainly his own oversight, asserted as the society’s fault.\u003c/p>","\u003cp>2.  \u003cstrong>It insults a volunteer.\u003c/strong> “I am surprised that a society cannot keep proper records” is gratuitous and makes a simple correction awkward to deliver.\u003c/p>","\u003cp>3.  \u003cstrong>No evidence and one rigid demand.\u003c/strong> No amounts, no payment dates from the statement, and only one acceptable outcome, where a credit against next year would have been far easier for the society to action.\u003c/p>"]},"scenario":"\u003cp>You have been billed twice for your society membership: once by card in October and again by standing order in February, which you thought you had cancelled. The society treasurer says their records show one payment.\u003c/p>","bullets":["State what you believe happened.","Give the evidence.","Say what you want."],"header":[["To:","treasurer.musicsoc@northgate.ac.uk"],["Subject:","Membership 2024–25 — two payments on my statement"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It insults a volunteer. “I am surprised that a society cannot keep proper records” is gratuitous and makes a simple correction awkward to deliver.","correct":true},{"text":"No evidence and one rigid demand. No amounts, no payment dates from the statement, and only one acceptable outcome, where a credit against next year would have been far easier for the society to action.","correct":true},{"text":"Language. “our society will lose” (would lose — the whole sentence is hypothetical), “the next generations” (future generations), “much more money on the military than on the culture” (on culture), and “the wrong priorities of our politicians”.","correct":false},{"text":"It accuses on a fact the writer got wrong. “obviously a mistake on your side because I cancelled the standing order” — but only the payer can cancel a standing order, so this is almost certainly his own oversight, asserted as the society’s fault.","correct":true},{"text":"The twin study is described as proving that “both factors matter”, which nobody disputed, and “we should stop arguing about it” declines the question the prompt asks.","correct":false},{"text":"“They collect our data and sell it to advertisers” is asserted without qualification and is not uniformly true. Language: “the companies”, “our data”, “these annoying windows” — register drops to the conversational, and “absolutely useless” is editorial.","correct":false}],"key_html":"F3"}};</script>
