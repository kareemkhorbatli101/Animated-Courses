<script>window.ITEM={"kind":"exercise","id":"EM 065","slug":"em-065","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Invitation","payload":{"Strategy":"invite by naming the role you want them to play","Grammar":"purpose clause","Vocabulary":"panel, chair, discussant, brief","Convention":"inviting someone to do something harder than attend"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The role is more work and less glory than speaking. What does that oblige you to do?\u003c/p>\u003cp>b.  Why might someone want this role despite that?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does a discussant do, and how is it different from chairing?\u003c/p>\u003cp>b.  What is a brief, in the sense of instructions to a participant?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Explain the role in one sentence that includes the preparation required.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email quantifies the work. Why is that attractive rather than off-putting?\u003c/p>\u003cp>b.  The third paragraph explains why her, specifically. What is the argument?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"so the reading does not land in the same week as the conference\" — what does this purpose clause reveal?\u003c/p>\u003cp>b.  \"agreed and felt buried by it\" — why name the bad outcome so plainly?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  State the work precisely and give a reason the role is worth doing. A vague invitation to an onerous task gets declined or, worse, accepted and resented.\u003c/p>\u003cp>b.  Because it is intellectually interesting, because it is visible to the people whose work is read, and because being asked signals that your judgement is valued — all of which only operate if the email makes them visible.\u003c/p>","P2":"\u003cp>a.  A discussant reads the papers and responds substantively; a chair runs the session and manages time. The first is preparation-heavy, the second is not.\u003c/p>\u003cp>b.  A short set of instructions defining scope and expectations — and supplying one unasked is part of what makes an invitation like this easy to accept.\u003c/p>","P3":"\u003cp>Model: \"You would receive three papers a fortnight beforehand and speak for ten minutes responding to them — realistically half a day of reading and an afternoon at the conference.\"\u003c/p>","F1":"\u003cp>a.  Because the fear is unbounded commitment. A named quantity can be checked against a diary and accepted or refused; an unnamed one is assumed to be worse than it is, so precision almost always makes acceptance more likely.\u003c/p>\u003cp>b.  That the role cannot be filled by a student and that its value is specific to inexperienced authors. It is an argument about what she uniquely supplies rather than about how distinguished she is, which is both more persuasive and harder to deflect modestly.\u003c/p>","F2":"\u003cp>a.  That the organiser has thought about the recipient’s workload rather than only their own schedule. Small logistical courtesies of this kind are the clearest signal that an event is well run, which is itself a reason to accept.\u003c/p>\u003cp>b.  Because the thing that stops people declining is not wanting to seem unhelpful, and the thing that makes events bad is participants who agreed reluctantly. Naming the outcome gives her explicit permission to protect both of you.\u003c/p>","F3":"\u003cp>1.  The role is never explained. \"Participate as a discussant\" assumes she knows what that involves here, and the preparation — three papers, twelve thousand words — is completely concealed. The second bullet fails.\u003c/p>\u003cp>2.  \"A great opportunity for our students\" is a reason for them, not for her; nothing says why she was asked or what the role uniquely supplies. The third bullet fails.\u003c/p>\u003cp>3.  No timings, no panel subject, no travel offer, no exit, and the register is institutional throughout — \"we would be very pleased\", \"very valuable\" — which reads as a circular rather than an approach.\u003c/p>"},"model":["Dear Dr Ferreira,","I am writing to ask whether you would act as discussant on the methods panel at our postgraduate conference on 3 April.","I should be straightforward about what it involves, because it is more than a talk. You would receive three papers of about four thousand words a fortnight beforehand, and on the day you would speak for ten minutes responding to them, then take questions with the panel. Realistically that is half a day of reading and an afternoon at the conference.","The reason we are asking is that the three presenters are all first years and none has had their work read by anyone outside their supervision. A discussant who takes the papers seriously enough to disagree with them is the most useful thing that happens to a first-year paper, and it is the one role we cannot fill with another student.","We can cover travel, and I would send you the papers on 20 March so the reading does not land in the same week as the conference.","If it is too much, I would rather you said so than agreed and felt buried by it — and if a shorter version would work, we could cut it to two papers.","With best wishes,","Nadia Farouk — PG Conference Committee"],"model_html":"\u003cp>Dear Dr Ferreira,\u003c/p>\u003cp>I am writing to ask whether you would act as discussant on the methods panel at our postgraduate conference on 3 April.\u003c/p>\u003cp>I should be straightforward about what it involves, because it is more than a talk. You would receive three papers of about four thousand words a fortnight beforehand, and on the day you would speak for ten minutes responding to them, then take questions with the panel. Realistically that is half a day of reading and an afternoon at the conference.\u003c/p>\u003cp>The reason we are asking is that the three presenters are all first years and none has had their work read by anyone outside their supervision. A discussant who takes the papers seriously enough to disagree with them is the most useful thing that happens to a first-year paper, and it is the one role we cannot fill with another student.\u003c/p>\u003cp>We can cover travel, and I would send you the papers on 20 March so the reading does not land in the same week as the conference.\u003c/p>\u003cp>If it is too much, I would rather you said so than agreed and felt buried by it — and if a shorter version would work, we could cut it to two papers.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Nadia Farouk — PG Conference Committee\u003c/p>","model_band":5,"degraded":["Dear Dr Ferreira, We would be very pleased if you could participate as a discussant in our postgraduate conference on 3 April. It would be a great opportunity for our students to receive feedback from an experienced researcher like yourself, and we are sure your contribution would be very valuable. The conference will take place in the Dalton Building and there will be several panels throughout the day. Please let us know if you are able to participate.","Nadia"],"degraded_html":"\u003cp>Dear Dr Ferreira, We would be very pleased if you could participate as a discussant in our postgraduate conference on 3 April. It would be a great opportunity for our students to receive feedback from an experienced researcher like yourself, and we are sure your contribution would be very valuable. The conference will take place in the Dalton Building and there will be several panels throughout the day. Please let us know if you are able to participate.\u003c/p>\u003cp>Nadia\u003c/p>","degraded_band":3,"model_words":215,"fault_list":{"tag":"F3","faults":["The role is never explained. \"Participate as a discussant\" assumes she knows what that involves here, and the preparation — three papers, twelve thousand words — is completely concealed. The second bullet fails.","\"A great opportunity for our students\" is a reason for them, not for her; nothing says why she was asked or what the role uniquely supplies. The third bullet fails.","No timings, no panel subject, no travel offer, no exit, and the register is institutional throughout — \"we would be very pleased\", \"very valuable\" — which reads as a circular rather than an approach."],"html":["\u003cp>1.  The role is never explained. \"Participate as a discussant\" assumes she knows what that involves here, and the preparation — three papers, twelve thousand words — is completely concealed. The second bullet fails.\u003c/p>","\u003cp>2.  \"A great opportunity for our students\" is a reason for them, not for her; nothing says why she was asked or what the role uniquely supplies. The third bullet fails.\u003c/p>","\u003cp>3.  No timings, no panel subject, no travel offer, no exit, and the register is institutional throughout — \"we would be very pleased\", \"very valuable\" — which reads as a circular rather than an approach.\u003c/p>"]},"scenario":"\u003cp>You are organising a student research conference and want a postdoc to act as discussant on a panel — reading three papers in advance and responding to them. It is more work than a talk and less visible.\u003c/p>","bullets":["Invite her and explain the role.","Be honest about the work involved.","Say why the role matters."],"header":[["To:","h.ferreira@northgate.ac.uk"],["Subject:","Discussant invitation — PG conference, 3 April"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Young people want to travel and enjoy their freedom” treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored.","correct":false},{"text":"The role is never explained. “Participate as a discussant” assumes she knows what that involves here, and the preparation — three papers, twelve thousand words — is completely concealed. The second bullet fails.","correct":true},{"text":"“A great opportunity for our students” is a reason for them, not for her; nothing says why she was asked or what the role uniquely supplies. The third bullet fails.","correct":true},{"text":"“If some healthy students are contacted unnecessarily that is not a serious problem” asserts what the question asks us to weigh, with no account of what being contacted would involve.","correct":false},{"text":"No timings, no panel subject, no travel offer, no exit, and the register is institutional throughout — “we would be very pleased”, “very valuable” — which reads as a circular rather than an approach.","correct":true},{"text":"“They collect our data and sell it to advertisers” is asserted without qualification and is not uniformly true. Language: “the companies”, “our data”, “these annoying windows” — register drops to the conversational, and “absolutely useless” is editorial.","correct":false}],"key_html":"F3"}};</script>
