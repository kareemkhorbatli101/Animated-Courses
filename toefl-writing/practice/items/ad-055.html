<script>window.ITEM={"kind":"exercise","id":"AD 055","slug":"ad-055","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Public health · policy choice","payload":{"Strategy":"choose the option whose failure mode is cheapest","Grammar":"comparative conditionals","Vocabulary":"uptake, coverage, mandate, nudge","Convention":"choosing between a mandate and an incentive"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Both speakers are making predictions, not moral claims. What is each predicting?\u003c/p>\u003cp>b.  The prompt says the mandate achieves higher coverage. Does that settle it?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish uptake from coverage.\u003c/p>\u003cp>b.  What is a nudge, in the policy sense?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names what you are willing to lose.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response takes Nadia’s side but spends its longest paragraph on Theo. Why is that the right allocation?\u003c/p>\u003cp>b.  The final paragraph changes the basis of the decision. What is the new basis and why is it stronger?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"The more a requirement looks like administration, the less it looks like compulsion\" — name the structure and say what it buys.\u003c/p>\u003cp>b.  \"it has achieved almost none of the thing that matters\" — why this phrasing rather than \"it has failed\"?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Nadia predicts that a voluntary campaign plateaus below the level where coverage produces its benefit. Theo predicts that a mandate generates durable political opposition that raises the cost of future public health measures.\u003c/p>\u003cp>b.  No. Higher coverage now is one of the two things in dispute; the other is the cost imposed on later policies. A measure can win on the first and lose overall.\u003c/p>","P2":"\u003cp>a.  Uptake is the proportion who accept when offered; coverage is the proportion of the population protected. A campaign can have excellent uptake among those it reaches and poor coverage.\u003c/p>\u003cp>b.  A change to how a choice is presented that shifts behaviour without removing the option — reminders, defaults, small payments.\u003c/p>","P3":"\u003cp>Model: \"I would take the mandate and accept a political argument, because the alternative failure is an outbreak followed by the same mandate.\"\u003c/p>","F1":"\u003cp>a.  Because Nadia’s claim is granted by the prompt — it says the mandate achieves higher coverage — so defending it adds nothing. The only live question is whether Theo’s cost outweighs that, so the argument has to be won there.\u003c/p>\u003cp>b.  It moves from comparing expected outcomes to comparing what happens when each option fails. That is stronger because both speakers’ predictions are uncertain, while the two failure modes can be described concretely and are plainly asymmetric.\u003c/p>","F2":"\u003cp>a.  A double comparative conditional — the more X, the less Y. It states a relationship rather than a fact, which lets the response make a general claim about how mandates are received without having to prove it in a particular case.\u003c/p>\u003cp>b.  Because \"failed\" invites the reply that eighty-five per cent is a substantial achievement, which it is in uptake terms. The phrasing concedes the achievement and relocates the failure to the specific thing coverage was for, which is the non-linear benefit just described.\u003c/p>","F3":"\u003cp>1.  Theo’s objection is about future policy cost and the response answers it with \"we cannot let a small minority decide policy\", which addresses a different argument entirely.\u003c/p>\u003cp>2.  \"People who refuse science\" characterises the opposition rather than engaging with the prediction about backlash, and \"this is not something we should negotiate about\" declines the comparison the prompt asks for.\u003c/p>\u003cp>3.  No mechanism anywhere — nothing about coverage thresholds, exemption rates, or how a mandate is introduced, so the choice rests entirely on the assertion that health outweighs freedom.\u003c/p>"},"model":["I would take the mandate, and I would take it because of Theo’s objection rather than in spite of it.","Theo is describing a real cost, but he has the sequence wrong. Backlash is loudest where a mandate arrives after a voluntary campaign has visibly failed, because by then refusal has had time to organise. A mandate introduced as the ordinary condition of school enrolment, alongside the other dozen conditions nobody argues about, never becomes the subject of a campaign at all. The more a requirement looks like administration, the less it looks like compulsion.","Nadia’s point about coverage levels is the substantive one. Herd protection is not linear: the difference between eighty-five and ninety-two per cent is not seven per cent more benefit but the difference between outbreaks that burn out and outbreaks that do not. A voluntary campaign that plateaus at eighty-five has not achieved most of the goal; it has achieved almost none of the thing that matters.","What decides it for me is the failure mode. If the mandate is resisted, the city has high coverage and an argument on its hands. If the voluntary campaign underperforms, the city has an outbreak and then has to introduce the mandate anyway, in the worst possible conditions. I would rather manage the first failure than the second."],"model_html":"\u003cp>I would take the mandate, and I would take it because of Theo’s objection rather than in spite of it.\u003c/p>\u003cp>Theo is describing a real cost, but he has the sequence wrong. Backlash is loudest where a mandate arrives after a voluntary campaign has visibly failed, because by then refusal has had time to organise. A mandate introduced as the ordinary condition of school enrolment, alongside the other dozen conditions nobody argues about, never becomes the subject of a campaign at all. The more a requirement looks like administration, the less it looks like compulsion.\u003c/p>\u003cp>Nadia’s point about coverage levels is the substantive one. Herd protection is not linear: the difference between eighty-five and ninety-two per cent is not seven per cent more benefit but the difference between outbreaks that burn out and outbreaks that do not. A voluntary campaign that plateaus at eighty-five has not achieved most of the goal; it has achieved almost none of the thing that matters.\u003c/p>\u003cp>What decides it for me is the failure mode. If the mandate is resisted, the city has high coverage and an argument on its hands. If the voluntary campaign underperforms, the city has an outbreak and then has to introduce the mandate anyway, in the worst possible conditions. I would rather manage the first failure than the second.\u003c/p>","model_band":5,"degraded":["I think the city should choose the mandate because health is more important than personal freedom and the government has a duty to protect everybody, especially children who cannot decide for themselves. Theo worries about backlash but in my opinion we cannot let a small minority of people who refuse science decide policy for the majority. Nadia is completely right that voluntary campaigns do not work well enough. Vaccination has saved millions of lives and this is not something we should negotiate about."],"degraded_html":"\u003cp>I think the city should choose the mandate because health is more important than personal freedom and the government has a duty to protect everybody, especially children who cannot decide for themselves. Theo worries about backlash but in my opinion we cannot let a small minority of people who refuse science decide policy for the majority. Nadia is completely right that voluntary campaigns do not work well enough. Vaccination has saved millions of lives and this is not something we should negotiate about.\u003c/p>","degraded_band":3,"model_words":222,"fault_list":{"tag":"F3","faults":["Theo’s objection is about future policy cost and the response answers it with \"we cannot let a small minority decide policy\", which addresses a different argument entirely.","\"People who refuse science\" characterises the opposition rather than engaging with the prediction about backlash, and \"this is not something we should negotiate about\" declines the comparison the prompt asks for.","No mechanism anywhere — nothing about coverage thresholds, exemption rates, or how a mandate is introduced, so the choice rests entirely on the assertion that health outweighs freedom."],"html":["\u003cp>1.  Theo’s objection is about future policy cost and the response answers it with \"we cannot let a small minority decide policy\", which addresses a different argument entirely.\u003c/p>","\u003cp>2.  \"People who refuse science\" characterises the opposition rather than engaging with the prediction about backlash, and \"this is not something we should negotiate about\" declines the comparison the prompt asks for.\u003c/p>","\u003cp>3.  No mechanism anywhere — nothing about coverage thresholds, exemption rates, or how a mandate is introduced, so the choice rests entirely on the assertion that health outweighs freedom.\u003c/p>"]},"prof_name":"Professor Oyelaran","professor":"\u003cp>To raise vaccination rates, a city can either require vaccination for school enrolment, with exemptions, or run a voluntary campaign with free clinics, reminders and small payments. The mandate achieves higher coverage. The voluntary approach avoids resistance. Which should the city choose?\u003c/p>","students":[["Nadia","The mandate. Public health is not a matter of individual preference when the benefit depends on coverage levels. A voluntary campaign reaches the people who were already inclined and stalls exactly where it matters."],["Theo","Mandates create a political backlash that outlasts the policy. Once vaccination becomes a question of state compulsion, you have handed the refusers a cause, and the next vaccine is harder than this one."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Theo’s objection is about future policy cost and the response answers it with “we cannot let a small minority decide policy”, which addresses a different argument entirely.","correct":true},{"text":"No mechanism anywhere — nothing about coverage thresholds, exemption rates, or how a mandate is introduced, so the choice rests entirely on the assertion that health outweighs freedom.","correct":true},{"text":"“Something important” where a verifiable clash was available, which makes the request sound like a preference.","correct":false},{"text":"“Let me know what you decide” removes the writer from the process entirely, so the third bullet fails. There are also two comma splices.","correct":false},{"text":"“I will be more careful next time” names no change, so the third bullet fails; and “sorry if it caused any trouble” makes the harm hypothetical.","correct":false},{"text":"“People who refuse science” characterises the opposition rather than engaging with the prediction about backlash, and “this is not something we should negotiate about” declines the comparison the prompt asks for.","correct":true}],"key_html":"F3"}};</script>
