<script>window.ITEM={"kind":"exercise","id":"EM 060","slug":"em-060","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request to an authority","payload":{"Strategy":"ask for the smaller version of what you want","Grammar":"reporting verbs with that-clauses","Vocabulary":"precedent, discretion, waiver, concession","Convention":"requesting an exception to a published rule"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is asking for staff borrowing rights the wrong request?\u003c/p>\u003cp>b.  What would make a librarian comfortable granting this?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is discretion, in the administrative sense, and what is a waiver?\u003c/p>\u003cp>b.  Why do institutions worry about precedent?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask in one sentence that is narrower than what you actually want.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Two options are offered and the writer prefers the harder one. Why mention that the easier one would do?\u003c/p>\u003cp>b.  \"with whatever conditions you would attach\" — what is this inviting?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I know the reference collection is not normally lent at all, and I am not asking for that to change\" — what fear is this addressing?\u003c/p>\u003cp>b.  \"within what copyright allows\" — why include this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because borrowing rights are a category, and moving a student into the staff category is a policy change nobody at the counter can make. A one-off arrangement for three named books is a decision they can take this afternoon.\u003c/p>\u003cp>b.  A bounded request, conditions they choose, a named academic who can confirm the facts, and an alternative that costs them less. Each of those reduces what they are being asked to risk.\u003c/p>","P2":"\u003cp>a.  Discretion is the latitude an official has within the rules; a waiver is a formal setting-aside of a requirement.\u003c/p>\u003cp>b.  Because a concession granted once becomes the answer to the next person who asks. That is why \"I am not asking for the policy to change\" is worth saying explicitly.\u003c/p>","P3":"\u003cp>Model: \"I would like to ask about borrowing three reference-collection titles for five weeks, or failing that about scans of four chapters.\"\u003c/p>","F1":"\u003cp>a.  Because the librarian’s decision depends on cost to them, not on the writer’s preference. Saying the scans would nearly do converts a difficult request into an easy one and makes some form of yes very likely.\u003c/p>\u003cp>b.  It hands the shape of the concession to the person who has to live with it. They know which safeguards make an exception defensible, and being asked to set them is far easier than being asked to approve terms somebody else chose.\u003c/p>","F2":"\u003cp>a.  The fear of precedent. By naming the rule and disclaiming any attempt to change it, the writer makes this a one-off rather than the first of a queue.\u003c/p>\u003cp>b.  Because it removes the objection the librarian would otherwise have to raise, and it shows the writer has checked rather than assumed. Four chapters out of three books is specific enough to be assessed.\u003c/p>","F3":"\u003cp>1.  It asks for a change of borrowing category — \"like the staff have\" — which nobody reading the email can grant. The second bullet fails.\u003c/p>\u003cp>2.  No titles, no shelfmarks, no dates beyond \"this summer\", and no supervisor, so there is nothing concrete to approve.\u003c/p>\u003cp>3.  No alternative is offered, so a no ends the matter, and \"I hope you can make an exception in my case\" asks for special treatment rather than proposing a workable arrangement.\u003c/p>"},"model":["Dear Circulation Team,","I am a second-year geography student doing fieldwork in Cape Verde from 2 June to 8 July, and I would like to ask about borrowing three reference-collection titles for that period.","I know the reference collection is not normally lent at all, and I am not asking for that to change. What I am hoping for is one of two things: either a five-week loan of the three volumes with whatever conditions you would attach — a deposit, a shorter list, collection in person — or, if that is not possible, scans of the four chapters I actually need, which are about sixty pages in total and within what copyright allows.","The second option would suit me almost as well, so if it is simpler at your end please take it.","The three titles are listed below with shelfmarks. My supervisor Dr Mensah knows about the trip and is happy to confirm the dates.","Thank you for considering it.","Yours sincerely,","Lucia Barros — 2203118"],"model_html":"\u003cp>Dear Circulation Team,\u003c/p>\u003cp>I am a second-year geography student doing fieldwork in Cape Verde from 2 June to 8 July, and I would like to ask about borrowing three reference-collection titles for that period.\u003c/p>\u003cp>I know the reference collection is not normally lent at all, and I am not asking for that to change. What I am hoping for is one of two things: either a five-week loan of the three volumes with whatever conditions you would attach — a deposit, a shorter list, collection in person — or, if that is not possible, scans of the four chapters I actually need, which are about sixty pages in total and within what copyright allows.\u003c/p>\u003cp>The second option would suit me almost as well, so if it is simpler at your end please take it.\u003c/p>\u003cp>The three titles are listed below with shelfmarks. My supervisor Dr Mensah knows about the trip and is happy to confirm the dates.\u003c/p>\u003cp>Thank you for considering it.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Lucia Barros — 2203118\u003c/p>","model_band":5,"degraded":["Dear Circulation Team, I am a geography student and I will be doing fieldwork abroad for five weeks this summer. Unfortunately the loan period for students is only two weeks which is not long enough, and I cannot renew the books because they are in the reference collection. Could you please extend my borrowing rights to four weeks like the staff have, or ideally five weeks for my trip? This would really help my research a lot. I hope you can make an exception in my case.","Lucia"],"degraded_html":"\u003cp>Dear Circulation Team, I am a geography student and I will be doing fieldwork abroad for five weeks this summer. Unfortunately the loan period for students is only two weeks which is not long enough, and I cannot renew the books because they are in the reference collection. Could you please extend my borrowing rights to four weeks like the staff have, or ideally five weeks for my trip? This would really help my research a lot. I hope you can make an exception in my case.\u003c/p>\u003cp>Lucia\u003c/p>","degraded_band":3,"model_words":168,"fault_list":{"tag":"F3","faults":["It asks for a change of borrowing category — \"like the staff have\" — which nobody reading the email can grant. The second bullet fails.","No titles, no shelfmarks, no dates beyond \"this summer\", and no supervisor, so there is nothing concrete to approve.","No alternative is offered, so a no ends the matter, and \"I hope you can make an exception in my case\" asks for special treatment rather than proposing a workable arrangement."],"html":["\u003cp>1.  It asks for a change of borrowing category — \"like the staff have\" — which nobody reading the email can grant. The second bullet fails.\u003c/p>","\u003cp>2.  No titles, no shelfmarks, no dates beyond \"this summer\", and no supervisor, so there is nothing concrete to approve.\u003c/p>","\u003cp>3.  No alternative is offered, so a no ends the matter, and \"I hope you can make an exception in my case\" asks for special treatment rather than proposing a workable arrangement.\u003c/p>"]},"scenario":"\u003cp>The library allows four-week loans for staff and two for students. You are a student doing fieldwork abroad for five weeks and cannot renew online because the books are in the reference collection.\u003c/p>","bullets":["Explain the problem.","Ask for a workable exception.","Show you know what you are asking for."],"header":[["To:","circulation.library@northgate.ac.uk"],["Subject:","Fieldwork loan — request for a five-week arrangement"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It asks for a change of borrowing category — “like the staff have” — which nobody reading the email can grant. The second bullet fails.","correct":true},{"text":"Lin’s argument is dismissed with “now we know better and our moral understanding has progressed” — which assumes the reliability of current intuitions, the very thing in dispute.","correct":false},{"text":"No alternative is offered, so a no ends the matter, and “I hope you can make an exception in my case” asks for special treatment rather than proposing a workable arrangement.","correct":true},{"text":"“Politicians should listen to them more” is a recommendation where an explanation was asked for, and “young people are not lazy, they are disappointed” answers an accusation neither speaker made; the sentence is also a comma splice.","correct":false},{"text":"No titles, no shelfmarks, no dates beyond “this summer”, and no supervisor, so there is nothing concrete to approve.","correct":true},{"text":"The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: “the sugary drinks”, “the rates of diabetes” over-articled.","correct":false}],"key_html":"F3"}};</script>
