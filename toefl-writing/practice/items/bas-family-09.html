<script>window.ITEM={"kind":"family","id":"BAS 067–074","slug":"bas-family-09","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 9 of 12 — coordination and correlatives","payload":{"Strategy":"joining clauses correctly is the floor below which nothing else counts","Grammar":"and/but/so, not only, either/neither, both, parallelism, ellipsis","Vocabulary":"the correlative pairs and what each signals","Convention":"the comma splice, and why examiners treat it as consequential"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>This family contains the single error most likely to pull a response from band 4 to band 3: the comma splice. It also contains parallelism, which is invisible when you get it right and conspicuous when you do not.\u003c/p>","preview":[{"tag":"P1","title":"Comma or no comma","html":"\u003cp>Which of these needs a comma before the conjunction, and what is the rule?\u003c/p>\u003cpre class=\"mono\">(a) I got there late ___ but they still let me in.\n(b) I got there late ___ and apologised.\u003c/pre>"},{"tag":"P2","title":"The splice","html":"\u003cp>What is wrong with this, and give three different repairs.\u003c/p>\u003cpre class=\"mono\">The seminar was cancelled, nobody booked the room this week.\u003c/pre>"},{"tag":"P3","title":"Make them match","html":"\u003cp>Why does this list feel wrong, and what is the minimum fix?\u003c/p>\u003cpre class=\"mono\">The role involves running sessions, records, and to write a\nshort report.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Splice hunt","html":"\u003cp>Three of these four are comma splices. Find them and repair each a different way.\u003c/p>\u003cpre class=\"mono\">(a) The library closes at six, the lab stays open until ten.\n(b) The library closes at six, but the lab stays open.\n(c) I emailed twice, nobody replied.\n(d) It was raining, therefore we cancelled.\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) Neither the students nor the tutor were informed.\n(b) He is good at both writing and to speak.\n(c) Not only the parts were late but also the invoice.\n(d) She likes reading, to swim and cycling.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Write one sentence for each, on the topic of mandatory attendance.\u003c/p>\u003cpre class=\"mono\">(a) using not only … but also\n(b) using a three-item parallel list\n(c) joining two clauses with so, correctly punctuated\u003c/pre>"}],"keys":{"P1":"\u003cp>(a) needs the comma — two independent clauses. (b) does not — one subject with two verbs.\u003c/p>\u003cp>The test: can the words after the conjunction stand alone as a sentence? If yes, comma.\u003c/p>","P2":"\u003cp>Two independent clauses joined by nothing but a comma. Repairs: a full stop; a semicolon; or a conjunction (\u003cem>so nobody booked\u003c/em>).\u003c/p>\u003cp>Examiners treat this as consequential because it signals that the writer cannot tell where one sentence ends — which is exactly the judgement the band descriptors are making.\u003c/p>","P3":"\u003cp>Three items in three different forms: a gerund, a bare noun, an infinitive. Minimum fix: make all three gerunds — \u003cem>running sessions, keeping records and writing a short report\u003c/em>.\u003c/p>","F1":"\u003cp>(a), (c) and (d) are splices.\u003c/p>\u003cp>(a) → full stop: The library closes at six. The lab stays open until ten.\u003c/p>\u003cp>(c) → conjunction: I emailed twice, but nobody replied.\u003c/p>\u003cp>(d) → semicolon: It was raining; therefore we cancelled. \u003cem>therefore\u003c/em> is an adverb, not a conjunction — it cannot join clauses on its own.\u003c/p>\u003cp>(b) is correct as it stands.\u003c/p>","F2":"\u003cp>(a) → the tutor was informed. Agreement with the nearer subject.\u003c/p>\u003cp>(b) → both writing and speaking.\u003c/p>\u003cp>(c) → Not only were the parts late … .\u003c/p>\u003cp>(d) → reading, swimming and cycling.\u003c/p>","F3":"\u003cp>(a) Compulsory attendance not only fails to raise attainment but also diverts staff time into registers.\u003c/p>\u003cp>(b) A good lecture rewards attending, repays attention and justifies the hour; a poor one does none of the three.\u003c/p>\u003cp>(c) Attendance is already recorded electronically, so the administrative argument for a formal rule has largely disappeared.\u003c/p>"},"rows":[67,68,69,70,71,72,73,74]};</script>
