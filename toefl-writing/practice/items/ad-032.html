<script>window.ITEM={"kind":"exercise","id":"AD 032","slug":"ad-032","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Arts and culture · policy choice","payload":{"Strategy":"ask what a restitution rule implies for the cases nobody is arguing about","Grammar":"conditional qualification","Vocabulary":"provenance, restitution, deaccession, custodianship","Convention":"arguing about a sensitive claim without caricaturing either side"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  How much do Kemi and Henrik actually disagree about?\u003c/p>\u003cp>b.  Henrik raises \"no mechanism for getting it wrong\". What is he pointing at?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is provenance research, and what is deaccession?\u003c/p>\u003cp>b.  Distinguish ownership from custodianship.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Identify the real point of disagreement in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response separates two things usually treated as one. What?\u003c/p>\u003cp>b.  Why is the final sentence more damaging to Henrik than to Kemi?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the asymmetry of records is itself a product of the acquisition\" — what does this claim do to Henrik’s position?\u003c/p>\u003cp>b.  \"mixedness is an argument for case-by-case research, not for a presumption\" — name the structure.\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Less than the debate suggests. Both accept return for documented loot; the dispute is about the default where the record is incomplete.\u003c/p>\u003cp>b.  Irreversibility. A wrongly returned object cannot easily be recovered, and unlike a wrongly retained one there is no continuing institution to press the claim against.\u003c/p>","P2":"\u003cp>a.  Provenance research traces an object’s chain of ownership; deaccession is the formal removal of an item from a collection, which most museums are legally restricted in doing.\u003c/p>\u003cp>b.  Ownership is title; custodianship is care and possession without title. The distinction is what makes the response’s proposal possible.\u003c/p>","P3":"\u003cp>Model: \"They agree about documented loot, so the question is only who bears the burden where the record is incomplete.\"\u003c/p>","F1":"\u003cp>a.  Ownership from location. The debate is conducted as though returning title meant moving the object, and separating them dissolves most of the conflict.\u003c/p>\u003cp>b.  Because his position depends on the holder retaining the benefit of the doubt, and the sentence identifies that the holder is also the adjudicator — a conflict of interest that no appeal to curatorial expertise answers. Kemi’s position does not rest on anyone adjudicating their own case.\u003c/p>","F2":"\u003cp>a.  It turns his evidential difficulty into evidence against him: the records are poor because of how the objects were taken, so incompleteness cannot be a reason to favour the taker. It converts a practical obstacle into a moral argument.\u003c/p>\u003cp>b.  A \"not ... but\" correlative, used to accept a premise and deny the inference. It is the same move as AD 001 and AD 011 — granting the fact and disputing what follows is the most reusable single structure in this task.\u003c/p>","F3":"\u003cp>1.  It argues past Henrik rather than with him: he explicitly accepts return for documented loot, so \"they were stolen\" addresses a position nobody holds.\u003c/p>\u003cp>2.  The one engagement — that unequal power invalidates purchase — is a serious argument stated and then abandoned without development.\u003c/p>\u003cp>3.  \"The museums should be ashamed\" is moralising rather than argument, and \"return everything as soon as possible\" ignores the ambiguity the discussion was about. Language: \"the countries of origin\", \"the colonial period\", \"the power relation\" over-articled.\u003c/p>"},"model":["They agree about documented loot and disagree about where uncertainty should fall, which is the whole of the question and the part that usually goes unargued. Kemi’s burden-of-proof point is the strong one: an institution that cannot establish how it acquired something has no good answer to the person whose ancestors made it, and the asymmetry of records is itself a product of the acquisition. Henrik is right that collections are mixed, but mixedness is an argument for case-by-case research, not for a presumption in favour of the holder.","Where his objection has real force is in the irreversibility, and that is addressable without conceding the presumption. Transfer of title does not have to mean physical dispersal: a rule that returns ownership by default while allowing loan arrangements negotiated by the new owner gets Kemi’s principle and most of Henrik’s universal museum, and it puts the decision about where an object sits with the party that has the better claim to make it. The thing that cannot survive is the current arrangement, in which the institution that benefits from the ambiguity is also the one that adjudicates it."],"model_html":"\u003cp>They agree about documented loot and disagree about where uncertainty should fall, which is the whole of the question and the part that usually goes unargued. Kemi’s burden-of-proof point is the strong one: an institution that cannot establish how it acquired something has no good answer to the person whose ancestors made it, and the asymmetry of records is itself a product of the acquisition. Henrik is right that collections are mixed, but mixedness is an argument for case-by-case research, not for a presumption in favour of the holder.\u003c/p>\u003cp>Where his objection has real force is in the irreversibility, and that is addressable without conceding the presumption. Transfer of title does not have to mean physical dispersal: a rule that returns ownership by default while allowing loan arrangements negotiated by the new owner gets Kemi’s principle and most of Henrik’s universal museum, and it puts the decision about where an object sits with the party that has the better claim to make it. The thing that cannot survive is the current arrangement, in which the institution that benefits from the ambiguity is also the one that adjudicates it.\u003c/p>","model_band":5,"degraded":["I think that the museums should return all these objects to their countries of origin because they were stolen during the colonial period and they belong to the people who created them. It is not acceptable that European museums are full of treasures taken from Africa and Asia while the countries of origin have nothing. Henrik says that some objects were bought legally but at that time the power relation was completely unequal so these purchases were not really free. The museums should be ashamed and return everything as soon as possible."],"degraded_html":"\u003cp>I think that the museums should return all these objects to their countries of origin because they were stolen during the colonial period and they belong to the people who created them. It is not acceptable that European museums are full of treasures taken from Africa and Asia while the countries of origin have nothing. Henrik says that some objects were bought legally but at that time the power relation was completely unequal so these purchases were not really free. The museums should be ashamed and return everything as soon as possible.\u003c/p>","degraded_band":3,"model_words":192,"fault_list":{"tag":"F3","faults":["It argues past Henrik rather than with him: he explicitly accepts return for documented loot, so \"they were stolen\" addresses a position nobody holds.","The one engagement — that unequal power invalidates purchase — is a serious argument stated and then abandoned without development.","\"The museums should be ashamed\" is moralising rather than argument, and \"return everything as soon as possible\" ignores the ambiguity the discussion was about. Language: \"the countries of origin\", \"the colonial period\", \"the power relation\" over-articled."],"html":["\u003cp>1.  It argues past Henrik rather than with him: he explicitly accepts return for documented loot, so \"they were stolen\" addresses a position nobody holds.\u003c/p>","\u003cp>2.  The one engagement — that unequal power invalidates purchase — is a serious argument stated and then abandoned without development.\u003c/p>","\u003cp>3.  \"The museums should be ashamed\" is moralising rather than argument, and \"return everything as soon as possible\" ignores the ambiguity the discussion was about. Language: \"the countries of origin\", \"the colonial period\", \"the power relation\" over-articled.\u003c/p>"]},"prof_name":"Professor Rahimi","professor":"\u003cp>Museums in Europe and North America hold large collections acquired during colonial rule. Some have begun returning items to their countries of origin; others argue that universal museums serve a purpose that dispersal would destroy. Should such objects be returned?\u003c/p>","students":[["Kemi","Yes, as a default. The acquisition was not consensual and the burden of proof should sit with the holder, not the claimant. \"Universal museum\" is a nineteenth-century idea defended mainly by the institutions that benefit from it."],["Henrik","I accept the principle for documented loot and I am wary of a general default. Most collections are mixed — purchase, gift, excavation, seizure — and a rule that returns everything on a presumption will also move objects whose history is genuinely ambiguous, with no mechanism for getting it wrong."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The reason is both vague and over-shared. “some personal problems which I cannot explain here” gestures at something private without naming its shape, which invites more curiosity than a plain statement would. “I think also for most of the students” then recruits imaginary allies, which is presumptuous.","correct":false},{"text":"The one engagement — that unequal power invalidates purchase — is a serious argument stated and then abandoned without development.","correct":true},{"text":"The passage is not identified, the named third party is never mentioned, and “I will not use your real name if you prefer” is the only option offered; there is also a comma splice in the opening sentence.","correct":false},{"text":"It argues past Henrik rather than with him: he explicitly accepts return for documented loot, so “they were stolen” addresses a position nobody holds.","correct":true},{"text":"No question is asked. “I do not understand how you can reduce my support” expresses incomprehension rather than requesting the explanation, so the second bullet fails.","correct":false},{"text":"“The museums should be ashamed” is moralising rather than argument, and “return everything as soon as possible” ignores the ambiguity the discussion was about. Language: “the countries of origin”, “the colonial period”, “the power relation” over-articled.","correct":true}],"key_html":"F3"}};</script>
