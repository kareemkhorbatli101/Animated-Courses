<script>window.ITEM={"kind":"exercise","id":"AD 048","slug":"ad-048","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Education · cause ranking","payload":{"Strategy":"rank causes by which one the others run through","Grammar":"cleft for emphasis","Vocabulary":"retention, workload, attrition, induction","Convention":"ranking causes of a workforce problem"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Hana distinguishes real causes from stated reasons. Is that a fair move?\u003c/p>\u003cp>b.  What does Dmitri add to \"workload\" that makes it a different claim?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is attrition, and what is retention?\u003c/p>\u003cp>b.  What is induction, and why is it usually the first thing cut?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using which one the others operate through.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response distinguishes two things usually treated as one. What are they?\u003c/p>\u003cp>b.  Pay is ranked last and called a mechanism. What does that mean?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is the support in those years, not the pay or the workload, that determines ...\" — name the device.\u003c/p>\u003cp>b.  \"predictability is something you build rather than something you are given\" — what does this claim do to Dmitri’s position?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Yes, and it is a real methodological point: exit interviews collect socially acceptable reasons. But it cuts both ways — pay is also the most acceptable thing to say, so the same objection applies to her own answer.\u003c/p>\u003cp>b.  Variance rather than volume. Long hours you control are a different thing from long hours imposed at short notice, and only the second produces the loss of autonomy that drives people out.\u003c/p>","P2":"\u003cp>a.  Attrition is the rate of leaving; retention is the share who stay. They are complements, but policies are usually designed for one and measured by the other.\u003c/p>\u003cp>b.  Structured support for new entrants — mentoring, reduced timetable, observation. It is cut first because its benefit appears three years later and its cost appears now.\u003c/p>","P3":"\u003cp>Model: \"Pay and workload cause dissatisfaction, but it is the first two years that determine whether anyone acquires the means to tolerate them.\"\u003c/p>","F1":"\u003cp>a.  Causes of dissatisfaction and causes of leaving. People can be dissatisfied for a decade without acting; what converts dissatisfaction into departure is a separate question that neither classmate asks.\u003c/p>\u003cp>b.  That pay is how the departure happens — it provides the alternative and the comparison — rather than why the person wanted to go. Mechanisms matter for policy, but confusing them with motives produces the wrong remedy.\u003c/p>","F2":"\u003cp>a.  An it-cleft (family 8, structure 59). It is needed because the sentence is correcting a ranking: the cleft sets support against pay and workload explicitly rather than merely asserting a new first place.\u003c/p>\u003cp>b.  It accepts his diagnosis and relocates the remedy. If predictability is built by acquiring method and support, then unpredictable workload is a symptom of inadequate induction rather than an independent cause — which is why it ranks second rather than first.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, and then adds no analysis of its own.\u003c/p>\u003cp>2.  Hana’s point about stated reasons and Dmitri’s about unpredictability — the only two arguments in the discussion — are both absent.\u003c/p>\u003cp>3.  \"Society should value teachers more\" and \"educating the next generation\" are sentiment standing where the argument should be. Language: \"the responsibility they have\", \"the next generation\", \"the profession\" over-articled; \"correcting homework\" should be \"marking\".\u003c/p>"},"model":["Hana is right that stated reasons are unreliable and Dmitri is right about what the stated reasons are tracking. But I think both are ranking causes of dissatisfaction rather than causes of leaving, and those come apart. Plenty of dissatisfied teachers stay for years. What distinguishes the ones who go is almost always that they have a concrete alternative and a moment at which acting on it is possible, and that is where the first two years matter.","It is the support in those years, not the pay or the workload, that determines whether someone acquires the thing that makes the job bearable — a working method, a department that covers for them, a sense that next year will be easier. Without it the workload Dmitri describes never becomes predictable, because predictability is something you build rather than something you are given, and pay then does the work Hana attributes to it. So I would rank induction first, workload second as the thing induction is supposed to make survivable, and pay third: the mechanism by which people leave rather than the reason they want to."],"model_html":"\u003cp>Hana is right that stated reasons are unreliable and Dmitri is right about what the stated reasons are tracking. But I think both are ranking causes of dissatisfaction rather than causes of leaving, and those come apart. Plenty of dissatisfied teachers stay for years. What distinguishes the ones who go is almost always that they have a concrete alternative and a moment at which acting on it is possible, and that is where the first two years matter.\u003c/p>\u003cp>It is the support in those years, not the pay or the workload, that determines whether someone acquires the thing that makes the job bearable — a working method, a department that covers for them, a sense that next year will be easier. Without it the workload Dmitri describes never becomes predictable, because predictability is something you build rather than something you are given, and pay then does the work Hana attributes to it. So I would rank induction first, workload second as the thing induction is supposed to make survivable, and pay third: the mechanism by which people leave rather than the reason they want to.\u003c/p>","model_band":5,"degraded":["I think all three factors are important because teaching is a very difficult profession today. Teachers are not paid enough for the responsibility they have, they work in the evenings and at weekends correcting homework and preparing lessons, and young teachers are often left alone without any support in their first year. Society should value teachers more because they are educating the next generation and this is one of the most important jobs. Governments should increase salaries and reduce the administrative burden so that good teachers stay in the profession."],"degraded_html":"\u003cp>I think all three factors are important because teaching is a very difficult profession today. Teachers are not paid enough for the responsibility they have, they work in the evenings and at weekends correcting homework and preparing lessons, and young teachers are often left alone without any support in their first year. Society should value teachers more because they are educating the next generation and this is one of the most important jobs. Governments should increase salaries and reduce the administrative burden so that good teachers stay in the profession.\u003c/p>","degraded_band":3,"model_words":184,"fault_list":{"tag":"F3","faults":["It refuses to rank, and then adds no analysis of its own.","Hana’s point about stated reasons and Dmitri’s about unpredictability — the only two arguments in the discussion — are both absent.","\"Society should value teachers more\" and \"educating the next generation\" are sentiment standing where the argument should be. Language: \"the responsibility they have\", \"the next generation\", \"the profession\" over-articled; \"correcting homework\" should be \"marking\"."],"html":["\u003cp>1.  It refuses to rank, and then adds no analysis of its own.\u003c/p>","\u003cp>2.  Hana’s point about stated reasons and Dmitri’s about unpredictability — the only two arguments in the discussion — are both absent.\u003c/p>","\u003cp>3.  \"Society should value teachers more\" and \"educating the next generation\" are sentiment standing where the argument should be. Language: \"the responsibility they have\", \"the next generation\", \"the profession\" over-articled; \"correcting homework\" should be \"marking\".\u003c/p>"]},"prof_name":"Professor Adeyemi","professor":"\u003cp>In many systems around a third of new teachers leave within five years. Proposed explanations include pay, workload and the quality of support in the first two years. Which explains most of the attrition?\u003c/p>","students":[["Hana","Pay. Teaching competes with every other graduate employer, and the ones who leave mostly go somewhere that pays more for fewer hours. Everything else is a reason people give."],["Dmitri","Workload, and specifically its unpredictability. People tolerate long hours in plenty of professions. What they do not tolerate is having no control over which hours, which is what cover, marking deadlines and inspection cycles produce."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Society should value teachers more” and “educating the next generation” are sentiment standing where the argument should be. Language: “the responsibility they have”, “the next generation”, “the profession” over-articled; “correcting homework” should be “marking”.","correct":true},{"text":"The repayment is deferred indefinitely. “I will make it up to you soon when things calm down” names no date and no shift, so the third bullet fails.","correct":false},{"text":"No achievable ask and no identification. “Bring back the shuttle immediately” is the one thing this office may be unable to do, no alternative is offered, and the email is unsigned — so it cannot be answered at all.","correct":false},{"text":"It refuses to rank, and then adds no analysis of its own.","correct":true},{"text":"Social conventions. “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.","correct":false},{"text":"Hana’s point about stated reasons and Dmitri’s about unpredictability — the only two arguments in the discussion — are both absent.","correct":true}],"key_html":"F3"}};</script>
