<script>window.ITEM={"kind":"exercise","id":"EM 098","slug":"em-098","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline the terms while accepting the work","Grammar":"cleft with what","Vocabulary":"honorarium, scope, deliverable, revise","Convention":"declining the terms of an offer, not the offer"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is \"exposure\" not payment?\u003c/p>\u003cp>b.  What is the risk of declining the terms outright?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an honorarium, and what is scope?\u003c/p>\u003cp>b.  What does it mean to revise a deliverable, and why cap revisions?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in one sentence that accepts the work and reopens the terms.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The second option is free. Why offer a paid option at all?\u003c/p>\u003cp>b.  \"unpaid work gets amended until it is finished rather than until it is right\" — what is this explaining?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"What I cannot do is the version in your email\" — identify the structure and say what it separates.\u003c/p>\u003cp>b.  \"which is well below a studio rate and reflects that I am a student and you are a charity\" — why justify the figure?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because it cannot be spent, is not guaranteed, and is rarely delivered. More to the point, it is offered by the party who benefits from believing it is valuable.\u003c/p>\u003cp>b.  Losing the work and the relationship at once, when what you object to is only the arrangement. The charity may well have a budget or accept a bounded scope.\u003c/p>","P2":"\u003cp>a.  An honorarium is a modest payment for work not charged at a commercial rate; scope is the defined extent of what will be delivered.\u003c/p>\u003cp>b.  To revise is to amend after review; capping revisions is what stops an unpaid job expanding indefinitely.\u003c/p>","P3":"\u003cp>Model: \"I would like to do the report — what I cannot do is the version in your email.\"\u003c/p>","F1":"\u003cp>a.  Because the two options test different things. The fee tests whether there is a budget; the free-with-scope option tests whether the charity will accept limits. Offering only the second would concede the money before asking.\u003c/p>\u003cp>b.  Why the objection is not simply about money. It names the mechanism by which unpaid work overruns, which is what justifies asking for a defined scope even in the free version.\u003c/p>","F2":"\u003cp>a.  A what-cleft. It splits the offer into the work, which is accepted, and the terms, which are not — so the refusal lands on the arrangement rather than on the invitation.\u003c/p>\u003cp>b.  Because an unexplained figure invites negotiation, while one presented as already discounted does not. It also shows the writer has priced the charity’s position as well as their own.\u003c/p>","F3":"\u003cp>1.  No terms are proposed at all — \"if you have any budget I would be happy to discuss it\" puts the work of inventing an arrangement on the charity. The third bullet fails.\u003c/p>\u003cp>2.  \"I cannot work for free\" closes the option that might actually have suited both sides, so the refusal is broader than it needed to be.\u003c/p>\u003cp>3.  \"Exposure does not pay the rent\" is a complaint about the sector rather than about this offer, and there is a comma splice in the opening sentence.\u003c/p>"},"model":["Dear Mr Achebe,","I would like to do the report — it is exactly the kind of work I want in my portfolio. What I cannot do is the version in your email, and I would rather say why than quietly decline.","An annual report is roughly thirty hours for me: layout, charts, two rounds of amendments and print-ready files. Exposure does not cover that, and in practice unpaid work gets amended until it is finished rather than until it is right, because nobody is counting the hours.","Two arrangements I would be glad to accept. Either an honorarium of £450, which is well below a studio rate and reflects that I am a student and you are a charity; or no fee at all for a defined scope — twenty-four pages, one round of amendments, my credit on the inside cover, and the files mine to show. The second costs you nothing and I would be happy with it.","If neither works, no hard feelings at all — I would still be glad to be asked again.","Best wishes,","Nour Haddad"],"model_html":"\u003cp>Dear Mr Achebe,\u003c/p>\u003cp>I would like to do the report — it is exactly the kind of work I want in my portfolio. What I cannot do is the version in your email, and I would rather say why than quietly decline.\u003c/p>\u003cp>An annual report is roughly thirty hours for me: layout, charts, two rounds of amendments and print-ready files. Exposure does not cover that, and in practice unpaid work gets amended until it is finished rather than until it is right, because nobody is counting the hours.\u003c/p>\u003cp>Two arrangements I would be glad to accept. Either an honorarium of £450, which is well below a studio rate and reflects that I am a student and you are a charity; or no fee at all for a defined scope — twenty-four pages, one round of amendments, my credit on the inside cover, and the files mine to show. The second costs you nothing and I would be happy with it.\u003c/p>\u003cp>If neither works, no hard feelings at all — I would still be glad to be asked again.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Nour Haddad\u003c/p>","model_band":5,"degraded":["Dear Mr Achebe, Thank you very much for thinking of me for this project, I am very interested in it. However I am afraid I cannot work for free as I have to support myself and design work takes a lot of time and skill. Many organisations ask designers to work for exposure but unfortunately exposure does not pay the rent. If you have any budget at all for this I would be very happy to discuss it with you.","Nour"],"degraded_html":"\u003cp>Dear Mr Achebe, Thank you very much for thinking of me for this project, I am very interested in it. However I am afraid I cannot work for free as I have to support myself and design work takes a lot of time and skill. Many organisations ask designers to work for exposure but unfortunately exposure does not pay the rent. If you have any budget at all for this I would be very happy to discuss it with you.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":181,"fault_list":{"tag":"F3","faults":["No terms are proposed at all — \"if you have any budget I would be happy to discuss it\" puts the work of inventing an arrangement on the charity. The third bullet fails.","\"I cannot work for free\" closes the option that might actually have suited both sides, so the refusal is broader than it needed to be.","\"Exposure does not pay the rent\" is a complaint about the sector rather than about this offer, and there is a comma splice in the opening sentence."],"html":["\u003cp>1.  No terms are proposed at all — \"if you have any budget I would be happy to discuss it\" puts the work of inventing an arrangement on the charity. The third bullet fails.\u003c/p>","\u003cp>2.  \"I cannot work for free\" closes the option that might actually have suited both sides, so the refusal is broader than it needed to be.\u003c/p>","\u003cp>3.  \"Exposure does not pay the rent\" is a complaint about the sector rather than about this offer, and there is a comma splice in the opening sentence.\u003c/p>"]},"scenario":"\u003cp>A local charity asks you to design their annual report for free, promising \"good exposure\". You want the work for your portfolio but not on those terms.\u003c/p>","bullets":["Say yes to the work.","Decline the terms.","Propose terms you would accept."],"header":[["To:","director@riversidetrust.org"],["Subject:","Annual report — yes, with a different arrangement"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No terms are proposed at all — “if you have any budget I would be happy to discuss it” puts the work of inventing an arrangement on the charity. The third bullet fails.","correct":true},{"text":"“Society is always changing and we should not be nostalgic” answers nobody’s argument — neither speaker claimed the past was better, only that something measurable has changed.","correct":false},{"text":"Language: “the governments”, “the people”, “the technology” all over-articled; “the human situations” is vague; and the opening sentence contributes nothing.","correct":false},{"text":"“I cannot work for free” closes the option that might actually have suited both sides, so the refusal is broader than it needed to be.","correct":true},{"text":"“Exposure does not pay the rent” is a complaint about the sector rather than about this offer, and there is a comma splice in the opening sentence.","correct":true},{"text":"“Books are usually better than films anyway” is irrelevant to the question of how an adaptation should be judged, and “disrespectful to change it” assumes the conclusion.","correct":false}],"key_html":"F3"}};</script>
