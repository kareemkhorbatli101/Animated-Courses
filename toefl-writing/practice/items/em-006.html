<script>window.ITEM={"kind":"exercise","id":"EM 006","slug":"em-006","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"establish standing before you ask","Grammar":"the present perfect for present relevance","Vocabulary":"lending: sign out, deposit, liable, in good order","Convention":"asking to borrow something valuable"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The second bullet asks you to argue your own trustworthiness. What kind of evidence actually works?\u003c/p>\u003cp>b.  Why ask about the deposit rather than wait to be told?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a \u003cem>deposit\u003c/em> and what does it mean to be \u003cem>liable\u003c/em> for damage?\u003c/p>\u003cp>b.  Complete: to sign equipment ______ ; to return it ______ good order.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, say you borrowed from them before and returned things properly, without sounding as though you are owed something for it.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “We borrowed from you last year and there were no problems” weaker than it looks?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The trust argument is in paragraph two. List the three concrete details it uses, and say why each is more persuasive than an adjective would be.\u003c/p>\u003cp>b.  The writer raises liability before being asked. Why is that a strong move rather than a reckless one?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “We have borrowed from you once before” — why the present perfect, when the date (November) is known?\u003c/p>\u003cp>b.  “who would be liable if anything were damaged”. Two unreal forms in one clause. What would be lost by writing \u003cem>who is liable if anything is damaged\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>were hoping to borrow\u003c/em> rather than \u003cem>want to borrow\u003c/em>? What tense is it, and why is it not about the past?\u003c/p>\u003cp>b.  \u003cem>with the cases and cables complete\u003c/em> — identify the structure. (You met it in family 5.)\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Ask a department to lend your society a projector for one evening. In 50 words: the request, one concrete piece of evidence that you are reliable, and one question about conditions.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Specifics. A date, a named person who can confirm it, and a detail that only somebody who actually returned the kit would know — the cases and cables. Adjectives like \u003cem>reliable\u003c/em> and \u003cem>responsible\u003c/em> are free to claim and therefore worth nothing.\u003c/p>\u003cp>b.  Because asking shows you expect conditions and intend to meet them. Waiting to be told suggests you hoped there would be none.\u003c/p>","P2":"\u003cp>a.  A \u003cstrong>deposit\u003c/strong> is money held and returned if the equipment comes back undamaged. To be \u003cstrong>liable\u003c/strong> is to be legally responsible for the cost of damage.\u003c/p>\u003cp>b.  to sign equipment \u003cstrong>out\u003c/strong> ; to return it \u003cstrong>in\u003c/strong> good order.\u003c/p>","P3":"\u003cp>Model: \u003cem>We borrowed from you in November for the documentary night and returned everything on the Monday with the cases and cables complete.\u003c/em>\u003c/p>\u003cp>It states facts and draws no conclusion. The reader draws it, which is why it works — a conclusion you reach yourself is more convincing than one you are handed.\u003c/p>","P4":"\u003cp>\u003cem>There were no problems\u003c/em> is the absence of a complaint, not evidence of care, and it is unverifiable. It also puts the reader in the position of having to remember whether that is true. Give them something checkable instead.\u003c/p>","F1":"\u003cp>a.  The month and occasion (November, documentary night), the day of return (the Monday), and the state of return (cases and cables complete). Each is checkable, and the last one demonstrates the exact quality in question rather than asserting it.\u003c/p>\u003cp>b.  Because the risk exists whether or not it is mentioned, and the person who raises it is visibly the person who has thought about it. Raising it also lets you attach your offer to insure — which would look defensive if it came after they asked.\u003c/p>","F2":"\u003cp>a.  The point is not when it happened but that it is true now: there is an existing relationship, and a record. The present perfect is about present relevance. Note that the date then appears in a separate clause, which is how English keeps both.\u003c/p>\u003cp>b.  The unreal forms keep the damage hypothetical. \u003cem>if anything is damaged\u003c/em> treats it as a live prospect and makes the sentence sound like a negotiation over an accident that is going to happen.\u003c/p>","F3":"\u003cp>a.  Past continuous, used for a tentative present. \u003cem>I was hoping\u003c/em>, \u003cem>I was wondering\u003c/em> and \u003cem>I was thinking\u003c/em> all put the wish safely in the past so the reader is not facing a live demand. It is the same distancing you met in family 3.\u003c/p>\u003cp>b.  An absolute construction — \u003cem>the cases and cables\u003c/em> has its own subject and is not the subject of the main clause. Compare \u003cem>weather permitting\u003c/em>.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>The trust argument is an assertion.\u003c/strong> “there were no problems, so you can trust us” instructs the reader to reach a conclusion instead of giving grounds for it, so the second bullet is only half addressed.\u003c/p>\u003cp>2.  \u003cstrong>It pre-empts the conditions it was asked to ask about.\u003c/strong> “we hope there is no deposit … we are only students” turns a question into a plea, and “Please tell us when we can take them” assumes the answer is yes.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “our shooting in 14-15 March” (our shoot on 14–15 March), “waiting for your answer”, and “Hi” to a committee you are asking a favour of.\u003c/p>","F5":"\u003cp>Model: \u003cem>We should like to borrow a projector for our screening on 3 May. We borrowed one in January and returned it next morning. Is a deposit needed?\u003c/em>\u003c/p>"},"model":["Dear Drama Society,","I am writing on behalf of the Film Society. We are shooting a short over the weekend of 14–15 March and were hoping to borrow two of the LED lighting rigs, if they are not in use for your own production that weekend.","We have borrowed from you once before, in November for the documentary night, and returned everything on the Monday with the cases and cables complete. Marcus Reinholt handled it at your end and may remember.","Could you let me know what the conditions would be — in particular whether there is a deposit, and who would be liable if anything were damaged? We are happy to sign the equipment out formally and to insure it for the weekend if that is what you normally ask.","Thank you very much.","Best wishes,","Ines Carvalho — Northgate Film Society"],"model_html":"\u003cp>Dear Drama Society,\u003c/p>\u003cp>I am writing on behalf of the Film Society. We are shooting a short over the weekend of 14–15 March and were hoping to borrow two of the LED lighting rigs, if they are not in use for your own production that weekend.\u003c/p>\u003cp>We have borrowed from you once before, in November for the documentary night, and returned everything on the Monday with the cases and cables complete. Marcus Reinholt handled it at your end and may remember.\u003c/p>\u003cp>Could you let me know what the conditions would be — in particular whether there is a deposit, and who would be liable if anything were damaged? We are happy to sign the equipment out formally and to insure it for the weekend if that is what you normally ask.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ines Carvalho — Northgate Film Society\u003c/p>","model_band":5,"degraded":["Hi,","We are the Film Society and we need two lighting rigs for our shooting in 14-15 March. We borrowed from you before and there were no problems, so you can trust us. Please tell us when we can come and take them. Also we hope there is no deposit because our budget is very small this year and we are only students.","Thanks, waiting for your answer."],"degraded_html":"\u003cp>Hi,\u003c/p>\u003cp>We are the Film Society and we need two lighting rigs for our shooting in 14-15 March. We borrowed from you before and there were no problems, so you can trust us. Please tell us when we can come and take them. Also we hope there is no deposit because our budget is very small this year and we are only students.\u003c/p>\u003cp>Thanks, waiting for your answer.\u003c/p>","degraded_band":3,"model_words":142,"fault_list":{"tag":"F4","faults":["The trust argument is an assertion. “there were no problems, so you can trust us” instructs the reader to reach a conclusion instead of giving grounds for it, so the second bullet is only half addressed.","It pre-empts the conditions it was asked to ask about. “we hope there is no deposit … we are only students” turns a question into a plea, and “Please tell us when we can take them” assumes the answer is yes.","Language and register. “our shooting in 14-15 March” (our shoot on 14–15 March), “waiting for your answer”, and “Hi” to a committee you are asking a favour of."],"html":["\u003cp>1.  \u003cstrong>The trust argument is an assertion.\u003c/strong> “there were no problems, so you can trust us” instructs the reader to reach a conclusion instead of giving grounds for it, so the second bullet is only half addressed.\u003c/p>","\u003cp>2.  \u003cstrong>It pre-empts the conditions it was asked to ask about.\u003c/strong> “we hope there is no deposit … we are only students” turns a question into a plea, and “Please tell us when we can take them” assumes the answer is yes.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “our shooting in 14-15 March” (our shoot on 14–15 March), “waiting for your answer”, and “Hi” to a committee you are asking a favour of.\u003c/p>"]},"scenario":"\u003cp>Your film society wants to borrow two lighting rigs from the drama society for a weekend shoot. You have borrowed from them once before and returned everything on time. There is usually a deposit.\u003c/p>","bullets":["Say what you want to borrow and when.","Give them a reason to trust you with it.","Ask about the conditions, including any deposit."],"header":[["To:","drama.society@northgate.ac.uk"],["Subject:","Borrowing two lighting rigs, 14–15 March"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“A good translator finds a balance depending on the text” is the conclusion the question asks to be argued for, offered as if it were an argument.","correct":false},{"text":"It pre-empts the conditions it was asked to ask about. “we hope there is no deposit … we are only students” turns a question into a plea, and “Please tell us when we can take them” assumes the answer is yes.","correct":true},{"text":"The trust argument is an assertion. “there were no problems, so you can trust us” instructs the reader to reach a conclusion instead of giving grounds for it, so the second bullet is only half addressed.","correct":true},{"text":"“Nature has no price” is precisely the infinite-value claim, asserted rather than defended, and “find another route even if it costs more” ignores that cost falls on someone.","correct":false},{"text":"Language and register. “our shooting in 14-15 March” (our shoot on 14–15 March), “waiting for your answer”, and “Hi” to a committee you are asking a favour of.","correct":true},{"text":"“Doctors should decide based on professional judgement” avoids the problem — the dispute is about what rule that judgement should follow.","correct":false}],"key_html":"F4"}};</script>
