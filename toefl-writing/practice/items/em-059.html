<script>window.ITEM={"kind":"exercise","id":"EM 059","slug":"em-059","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Negotiation and scheduling","payload":{"Strategy":"offer the other side the easier half of the problem","Grammar":"would rather / sooner than","Vocabulary":"clash, cover, slot, swap","Convention":"negotiating a swap with a peer"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You know she dislikes Tuesdays. Should you mention it?\u003c/p>\u003cp>b.  What makes a swap request easy to refuse?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is cover, in a rota sense, and what is a slot?\u003c/p>\u003cp>b.  What is a clash, and why is it stronger than \"I am busy\"?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask in one sentence that already removes her main objection.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer names her dislike of Tuesdays rather than hiding it. Why is that the stronger move?\u003c/p>\u003cp>b.  \"you are not my only hope\" — what is this sentence protecting?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the ones you would rather not have\" — why this rather than \"the ones you hate\"?\u003c/p>\u003cp>b.  \"since cover has to be logged a week ahead\" — why justify the deadline?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Yes. She will think it whether you say it or not, and pretending the swap is neutral insults her. Naming the cost is what licenses the compensation that follows.\u003c/p>\u003cp>b.  One with no compensation, no alternative and an implied obligation. If refusing means leaving you stranded, she will resent agreeing — which is worse for you than a no.\u003c/p>","P2":"\u003cp>a.  Cover is someone standing in for a rostered duty; a slot is the scheduled block itself.\u003c/p>\u003cp>b.  A clash is a fixed, verifiable conflict between two commitments. \"Busy\" is a preference; a clash is a fact, and only the second justifies asking someone else to move.\u003c/p>","P3":"\u003cp>Model: \"I know Tuesday afternoons are the ones you would rather not have, so I will do the set-up for both sessions and give you a clear Tuesday in week 11.\"\u003c/p>","F1":"\u003cp>a.  Because it shows he has thought about the cost to her rather than only about his interview, and it pre-empts the obvious objection. A request that has already conceded the bad news is harder to refuse than one that pretends there is none.\u003c/p>\u003cp>b.  Her freedom to refuse, and therefore the relationship. Naming Sam removes the pressure, which is the difference between a favour and an obligation — and makes a genuine yes more likely.\u003c/p>","F2":"\u003cp>a.  Because \"hate\" overstates what she has said and puts words in her mouth, while the hedged version shows he has noticed without exaggerating. Overstating someone’s objection is a way of patronising them.\u003c/p>\u003cp>b.  Because an unexplained deadline reads as pressure. The logging requirement is external to both of them, so it sets the date without the writer appearing to impose it.\u003c/p>","F3":"\u003cp>1.  \"Something important\" where a verifiable clash was available, which makes the request sound like a preference.\u003c/p>\u003cp>2.  Nothing is offered in return and the swap is presented as neutral, so the second bullet fails — and \"I am sure you understand\" presumes the agreement.\u003c/p>\u003cp>3.  No alternative if she refuses, so the third bullet fails, and \"as soon as possible\" gives no date while sounding more urgent than a stated one.\u003c/p>"},"model":["Hi Paula,","Any chance you would swap your Tuesday 2–4 for my Thursday 10–12, just for the week of the 18th? I have an interview on the Thursday that I cannot move.","I know Tuesday afternoons are the ones you would rather not have, so I am not pretending this is a favour to you. Two things that might make it less bad: I will do the set-up for both sessions that week, which is the hour nobody wants, and I will take your Tuesday in week 11 as well so you get a clear one back.","If it does not work, say so and I will ask Sam — he has Friday and no teaching that week, so there is a second option and you are not my only hope.","Let me know either way by Thursday if you can, since cover has to be logged a week ahead.","Thanks,","Marco"],"model_html":"\u003cp>Hi Paula,\u003c/p>\u003cp>Any chance you would swap your Tuesday 2–4 for my Thursday 10–12, just for the week of the 18th? I have an interview on the Thursday that I cannot move.\u003c/p>\u003cp>I know Tuesday afternoons are the ones you would rather not have, so I am not pretending this is a favour to you. Two things that might make it less bad: I will do the set-up for both sessions that week, which is the hour nobody wants, and I will take your Tuesday in week 11 as well so you get a clear one back.\u003c/p>\u003cp>If it does not work, say so and I will ask Sam — he has Friday and no teaching that week, so there is a second option and you are not my only hope.\u003c/p>\u003cp>Let me know either way by Thursday if you can, since cover has to be logged a week ahead.\u003c/p>\u003cp>Thanks,\u003c/p>\u003cp>Marco\u003c/p>","model_band":5,"degraded":["Hi Paula, I hope you are well. I was wondering if you would be able to swap slots with me for the week of the 18th? I have something important on the Thursday and I really need that day free. It would help me enormously and I would be very grateful. I know it is short notice but I am sure you understand that sometimes these things come up unexpectedly. Please let me know as soon as possible.","Marco"],"degraded_html":"\u003cp>Hi Paula, I hope you are well. I was wondering if you would be able to swap slots with me for the week of the 18th? I have something important on the Thursday and I really need that day free. It would help me enormously and I would be very grateful. I know it is short notice but I am sure you understand that sometimes these things come up unexpectedly. Please let me know as soon as possible.\u003c/p>\u003cp>Marco\u003c/p>","degraded_band":3,"model_words":154,"fault_list":{"tag":"F3","faults":["\"Something important\" where a verifiable clash was available, which makes the request sound like a preference.","Nothing is offered in return and the swap is presented as neutral, so the second bullet fails — and \"I am sure you understand\" presumes the agreement.","No alternative if she refuses, so the third bullet fails, and \"as soon as possible\" gives no date while sounding more urgent than a stated one."],"html":["\u003cp>1.  \"Something important\" where a verifiable clash was available, which makes the request sound like a preference.\u003c/p>","\u003cp>2.  Nothing is offered in return and the swap is presented as neutral, so the second bullet fails — and \"I am sure you understand\" presumes the agreement.\u003c/p>","\u003cp>3.  No alternative if she refuses, so the third bullet fails, and \"as soon as possible\" gives no date while sounding more urgent than a stated one.\u003c/p>"]},"scenario":"\u003cp>You and a classmate are both rostered to run lab demonstrations. Your Thursday slot clashes with a job interview. She has Tuesday, which suits you, and you know she dislikes Tuesdays.\u003c/p>","bullets":["Ask for the swap.","Make it easy to say yes.","Say what happens if she cannot."],"header":[["To:","p.ferreira@northgate.ac.uk"],["Subject:","Swap Thursday for Tuesday?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language. “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion.","correct":false},{"text":"“All new technologies are unproven at first” does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.","correct":false},{"text":"“Something important” where a verifiable clash was available, which makes the request sound like a preference.","correct":true},{"text":"No alternative if she refuses, so the third bullet fails, and “as soon as possible” gives no date while sounding more urgent than a stated one.","correct":true},{"text":"Nothing is offered in return and the swap is presented as neutral, so the second bullet fails — and “I am sure you understand” presumes the agreement.","correct":true},{"text":"Language: “the health of the patients”, “the machines”, “the doctors” over-articled; “we cannot take any risk with human lives” is an absolute that no medical system has ever met.","correct":false}],"key_html":"F3"}};</script>
