<script>window.ITEM={"kind":"exercise","id":"AD 021","slug":"ad-021","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Health and medicine · policy choice","payload":{"Strategy":"ask what a policy does to the people it does not reach","Grammar":"the causal chain with result clauses","Vocabulary":"uptake, adherence, stigma, screening, threshold","Convention":"arguing about a sensitive policy without moralising"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Sofia is arguing about incentives. What is Tom arguing about?\u003c/p>\u003cp>b.  Both predict a behavioural effect. Whose prediction is easier to test, and does that make it more likely to be true?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish \u003cem>uptake\u003c/em> from \u003cem>adherence\u003c/em>.\u003c/p>\u003cp>b.  What is a \u003c/p>\u003cp>threshold effect\u003c/p>\u003cp>, and why might it matter for a fee that is small for most people?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, grant Sofia that the charge works and still conclude against it. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “Health care should be free for everybody because health is a human right” a weak contribution here, even though many people believe it?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The first paragraph concedes the central empirical claim. What has that bought?\u003c/p>\u003cp>b.  Find the sentence that turns Sofia’s own safeguard against her. Why is attacking the waiver more effective than attacking the fee?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “the cost arrives repeatedly, cannot be avoided by trying harder, and attaches itself to the clinic”. Three verbs in parallel. What is the cumulative effect?\u003c/p>\u003cp>b.  “improves its own headline measure while worsening the thing the measure exists to track”. What is \u003cem>while\u003c/em> doing — time or contrast?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>selecting against\u003c/em> — where does this phrase come from, and what does importing it here achieve?\u003c/p>\u003cp>b.  Why \u003cem>disengage\u003c/em> rather than \u003cem>stop coming\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: should employers be allowed to offer lower insurance premiums to staff who meet fitness targets? In 50 words, concede that the scheme would improve average fitness and argue against it anyway.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Distribution — not whether the incentive works on average, but on whom it works and whom it drives away. Sofia is reasoning about a representative patient; Tom about the tail.\u003c/p>\u003cp>b.  Sofia’s. A fall in missed appointments is easy to measure, and will appear. Tom’s prediction — that some patients quietly stop coming — shows up as an absence, which is precisely the kind of effect that does not get measured. Easier to test does not mean more likely to be true; it means more likely to be \u003cem>reported\u003c/em>, which is a different thing, and exploiting that gap is what the model response does.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Uptake\u003c/strong> is whether people start — attend at all. \u003cstrong>Adherence\u003c/strong> is whether they keep going, or follow a treatment through. A charge may improve one while destroying the other.\u003c/p>\u003cp>b.  An effect that only appears once a quantity crosses some level. A fee that is trivial for most people may cross a threshold for a minority, where it stops being a nuisance and becomes a reason to avoid the service altogether. Averages hide threshold effects, which is why a policy can look successful and still fail.\u003c/p>","P3":"\u003cp>Model: \u003cem>A charge probably does reduce missed appointments, but it reduces them by removing the patients who can least afford to be removed.\u003c/em>\u003c/p>\u003cp>Granting the mechanism and attacking the selection is far stronger than disputing whether the fee works — an argument you would probably lose.\u003c/p>","P4":"\u003cp>Because it answers a different question. Nobody asked whether care should be free; they asked whether a specific charge for a specific behaviour does more good than harm. Reaching for a general principle instead of engaging with the mechanism is the commonest way a strongly held view produces a weak discussion post.\u003c/p>","F1":"\u003cp>a.  Credibility and ground. Having agreed that the fee works, the writer can no longer be answered with evidence that it works — which is the only evidence Sofia has. The argument is moved onto territory where her strongest fact is already spent.\u003c/p>\u003cp>b.  “Hardship waivers do not rescue it, because a waiver has to be applied for.” Attacking the fee invites a defence; attacking the safeguard closes the escape route. Sofia’s position depends on the waiver doing the protective work, so showing that the waiver has the same distributional flaw as the fee undoes the whole structure rather than one part of it.\u003c/p>","F2":"\u003cp>a.  Accumulation. Each verb adds a separate property of the cost, and because they share one subject the reader experiences them as a single mounting burden rather than three claims. The parallel also makes the middle one — \u003cem>cannot be avoided by trying harder\u003c/em> — land as a fact about the world rather than an excuse.\u003c/p>\u003cp>b.  Contrast. \u003cem>While\u003c/em> has both senses, and here the simultaneity is the point: the two things happen at once and in opposite directions, which is exactly what makes the policy perverse.\u003c/p>","F3":"\u003cp>a.  From biology and statistics — selection pressure, selection bias. Importing it makes the charge sound like an impersonal filter operating on a population rather than a punishment aimed at individuals, which is both more accurate and more damning. It also avoids moralising, which was the trap this question set.\u003c/p>\u003cp>b.  \u003cem>Disengage\u003c/em> describes a relationship ending rather than a single act, and it carries no implication of a decision. That matters: the writer is arguing that these patients are not choosing to defy the clinic, they are drifting out of contact with it.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It argues from principle, not mechanism.\u003c/strong> “Health is a human right” is a claim about what ought to be free, which does not address whether this particular charge helps or harms. It also simply repeats Tom’s position with more feeling.\u003c/p>\u003cp>2.  \u003cstrong>The proposal ignores the question.\u003c/strong> “the government should give more money” is true of every health policy question and was not what was asked. No alternative to the charge is offered that could actually be implemented by a clinic.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “charge money from” (charge a fee to), “because of the transport or the work or the children” (over-articled), and a comma splice at “free for everybody, this is a basic principle”. The response is also longer than the band-5 model and makes a third as many distinct points.\u003c/p>","F5":"\u003cp>Model: \u003cem>Average fitness would almost certainly rise. But the premium is not really a reward for exercising; it is a penalty on the people whose jobs, health or hours make the targets unreachable — and those are the people already paying most for insurance.\u003c/em>\u003c/p>"},"model":["Sofia is almost certainly right that a charge reduces missed appointments. The question Tom is raising is what it does to the people it does not deter, and that is the one that decides the policy.","A fee works by making a missed slot costly. For a patient with a predictable week, the cost lands once and changes nothing else. For a patient whose week is not predictable, the cost arrives repeatedly, cannot be avoided by trying harder, and attaches itself to the clinic rather than to the behaviour — so the rational response is to disengage. The policy therefore improves its own headline measure while worsening the thing the measure exists to track.","Hardship waivers do not rescue it, because a waiver has to be applied for, and the paperwork falls hardest on exactly the patients it is meant to protect. I would spend the same administrative effort on reminders and on letting people rebook without speaking to anyone, both of which reduce missed appointments without selecting against anybody."],"model_html":"\u003cp>Sofia is almost certainly right that a charge reduces missed appointments. The question Tom is raising is what it does to the people it does not deter, and that is the one that decides the policy.\u003c/p>\u003cp>A fee works by making a missed slot costly. For a patient with a predictable week, the cost lands once and changes nothing else. For a patient whose week is not predictable, the cost arrives repeatedly, cannot be avoided by trying harder, and attaches itself to the clinic rather than to the behaviour — so the rational response is to disengage. The policy therefore improves its own headline measure while worsening the thing the measure exists to track.\u003c/p>\u003cp>Hardship waivers do not rescue it, because a waiver has to be applied for, and the paperwork falls hardest on exactly the patients it is meant to protect. I would spend the same administrative effort on reminders and on letting people rebook without speaking to anyone, both of which reduce missed appointments without selecting against anybody.\u003c/p>","model_band":5,"degraded":["I strongly agree with Tom about this question. In my opinion it is very unfair to charge money from the patients who miss their appointments because most of them are poor people who have difficult lives and many problems. Health is a human right and it should be free for everybody, this is a basic principle in a civilised society. Also the clinics should understand that sometimes people cannot come because of the transport or the work or the children. Instead of punishing these people the government should give more money to the health system so there will be more appointments available for everybody who needs them."],"degraded_html":"\u003cp>I strongly agree with Tom about this question. In my opinion it is very unfair to charge money from the patients who miss their appointments because most of them are poor people who have difficult lives and many problems. Health is a human right and it should be free for everybody, this is a basic principle in a civilised society. Also the clinics should understand that sometimes people cannot come because of the transport or the work or the children. Instead of punishing these people the government should give more money to the health system so there will be more appointments available for everybody who needs them.\u003c/p>","degraded_band":3,"model_words":169,"fault_list":{"tag":"F4","faults":["It argues from principle, not mechanism. “Health is a human right” is a claim about what ought to be free, which does not address whether this particular charge helps or harms. It also simply repeats Tom’s position with more feeling.","The proposal ignores the question. “the government should give more money” is true of every health policy question and was not what was asked. No alternative to the charge is offered that could actually be implemented by a clinic.","Language. “charge money from” (charge a fee to), “because of the transport or the work or the children” (over-articled), and a comma splice at “free for everybody, this is a basic principle”. The response is also longer than the band-5 model and makes a third as many distinct points."],"html":["\u003cp>1.  \u003cstrong>It argues from principle, not mechanism.\u003c/strong> “Health is a human right” is a claim about what ought to be free, which does not address whether this particular charge helps or harms. It also simply repeats Tom’s position with more feeling.\u003c/p>","\u003cp>2.  \u003cstrong>The proposal ignores the question.\u003c/strong> “the government should give more money” is true of every health policy question and was not what was asked. No alternative to the charge is offered that could actually be implemented by a clinic.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “charge money from” (charge a fee to), “because of the transport or the work or the children” (over-articled), and a comma splice at “free for everybody, this is a basic principle”. The response is also longer than the band-5 model and makes a third as many distinct points.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Some health systems charge a small fee for appointments missed without notice, arguing that missed slots waste capacity that others need. Others refuse, arguing that the patients who miss appointments are disproportionately those who can least afford a fine. Should missed appointments carry a charge?\u003c/p>","students":[["Sofia","Yes. A missed slot is not a victimless act — somebody else waited longer for it. A small charge is the clearest possible signal that the appointment has a value, and most systems waive it where there is genuine hardship."],["Tom","No. The people who miss appointments most are those with unstable work, caring duties or poor transport. A charge does not teach them the value of the slot; it teaches them that the clinic is somewhere that fines you, and they stop coming at all."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language and register. “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).","correct":false},{"text":"The proposal ignores the question. “the government should give more money” is true of every health policy question and was not what was asked. No alternative to the charge is offered that could actually be implemented by a clinic.","correct":true},{"text":"“Could you explain these things to me please” asks for an explanation of a contract rather than three facts, which is both more work for the reader and less useful to the writer.","correct":false},{"text":"It argues from principle, not mechanism. “Health is a human right” is a claim about what ought to be free, which does not address whether this particular charge helps or harms. It also simply repeats Tom’s position with more feeling.","correct":true},{"text":"The mark is mentioned and then explained away with “I was busy with other things”, which is the least informative possible account and leaves Lena unable to judge the risk.","correct":false},{"text":"Language. “charge money from” (charge a fee to), “because of the transport or the work or the children” (over-articled), and a comma splice at “free for everybody, this is a basic principle”. The response is also longer than the band-5 model and makes a third as many distinct points.","correct":true}],"key_html":"F4"}};</script>
