<script>window.ITEM={"kind":"exercise","id":"EM 061","slug":"em-061","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Invitation · anchor item","payload":{"Strategy":"an invitation must answer what, when, where, why me, and how to reply","Grammar":"the present continuous for fixed arrangements","Vocabulary":"host, chair, RSVP, drinks afterwards, informal","Convention":"warmth without over-familiarity, and an easy refusal"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are asking for her evening and for a speech. Which is the bigger ask, and which should you mention first?\u003c/p>\u003cp>b.  Why does an invitation need the second bullet at all?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Who \u003cem>hosts\u003c/em>, who \u003cem>chairs\u003c/em>, and who \u003cem>gives\u003c/em> a talk? Can one person do all three?\u003c/p>\u003cp>b.  What does RSVP ask for, and what is the polite English equivalent in a sentence?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, ask her to speak while making it clear that coming without speaking would be welcome too. Under 30 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Which closing gives her the easiest refusal?\u003c/p>\u003cpre class=\"mono\">(A) Please let me know by Friday if you can make it.\n(B) I do hope you can come — but please do not worry at\n    all if the date is difficult.\n(C) It would mean a lot to all of us if you were there.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The speech is asked for in a subordinate clause. Find it, and say why it is not a main clause.\u003c/p>\u003cp>b.  The invitation offers two different ways to say yes. What are they, and why does that raise the chance of a yes?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “The postgraduate society \u003cem>is running\u003c/em> an evening … on Thursday 12 May”. Why a present continuous for a future event?\u003c/p>\u003cp>b.  “if you \u003cem>were\u003c/em> willing” inside a sentence about a real invitation. What is the unreal form buying?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>nothing prepared is needed\u003c/em> — what objection is this sentence answering before it is made?\u003c/p>\u003cp>b.  Why \u003cem>do not worry in the least\u003c/em> rather than \u003cem>do not worry\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Invite a former employer to a careers evening at which you would like them to speak for ten minutes. In 60 words: the invitation, why them, and an easy refusal.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The speech. Mention the evening first: an invitation that opens with a request to perform reads as a booking, not an invitation. The speech should arrive attached to the invitation, not instead of it.\u003c/p>\u003cp>b.  Because “why me?” is the first thing anyone thinks on being invited somewhere they have no obligation to be. Answering it turns a general circular into a personal approach, and a personal approach is much harder to ignore.\u003c/p>","P2":"\u003cp>a.  The \u003cstrong>host\u003c/strong> holds the event; the \u003cstrong>chair\u003c/strong> runs the session and introduces speakers; a speaker \u003cstrong>gives\u003c/strong> a talk. One person can do all three at a small event, but the words are not interchangeable.\u003c/p>\u003cp>b.  It asks for a reply either way. In English prose you would write \u003cem>please let me know whether you are able to come\u003c/em> — and note that a bare \u003cem>RSVP\u003c/em> is for printed cards, not emails to colleagues.\u003c/p>","P3":"\u003cp>Model: \u003cem>I am writing to ask whether you would come — and, if you were willing, say a few words at the start.\u003c/em>\u003c/p>\u003cp>The dash and the conditional do it. The main invitation is unconditional; the speech is a bracketed extra she can decline separately.\u003c/p>","P4":"\u003cp>\u003cstrong>(B).\u003c/strong> (A) is administration, not invitation, and the deadline arrives before the welcome. (C) applies emotional pressure — \u003cem>it would mean a lot to all of us\u003c/em> makes refusing a small cruelty. (B) expresses the wish and then explicitly releases her from it, which is what a genuine invitation does.\u003c/p>","F1":"\u003cp>a.  “and, if you were willing, say a few words at the start” — attached to \u003cem>whether you would come\u003c/em> by \u003cem>and\u003c/em>, and conditioned by an if-clause. Making it a main clause (\u003cem>We would also like you to speak\u003c/em>) would turn the invitation into a two-part demand.\u003c/p>\u003cp>b.  Come and speak, or come as a guest. Offering a smaller version of the yes means she does not have to choose between the full commitment and nothing — and the smaller yes very often becomes the larger one on the night.\u003c/p>","F2":"\u003cp>a.  Because it is a fixed arrangement: the room is booked, the date is set, it is happening whether or not she comes. English uses the present continuous for scheduled future events, and \u003cem>will run\u003c/em> would make it sound less settled than it is.\u003c/p>\u003cp>b.  Distance. \u003cem>If you are willing\u003c/em> treats her willingness as a live question awaiting an answer; \u003cem>if you were willing\u003c/em> treats it as a hypothetical she is free to leave hypothetical. It is the same politeness mechanism as family 3, used inside an invitation rather than a request.\u003c/p>","F3":"\u003cp>a.  The fear that saying yes means an evening of preparation. The commonest reason a busy person declines a small speaking request is not the five minutes but the hour they imagine spending on it — so the sentence removes the real cost, not the stated one.\u003c/p>\u003cp>b.  Because \u003cem>do not worry\u003c/em> alone can sound like a formula, or even slightly clipped. \u003cem>In the least\u003c/em> makes the release emphatic and therefore believable, which is the whole point of offering it.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It books her rather than inviting her.\u003c/strong> “Please confirm your attendance until Friday so we can print the programme” assumes the yes, sets a deadline, and attaches a consequence. “We are waiting for your positive answer” then forecloses the refusal entirely — the third bullet is unmet.\u003c/p>\u003cp>2.  \u003cstrong>The reason is flattery, not a reason.\u003c/strong> “you are a famous teacher and all the students respect you” could be sent to anyone in the department. The actual connection — that the presenters were her students and the projects grew out of her course — is the thing that would make her want to come, and it is missing.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “in 12 May” (on), “in Dalton Room” (in the Dalton Room), “confirm your attendance until Friday” (by Friday), “It will be very nice if you accept” (It would be). The until/by error is consequential: it asks for the opposite of what is meant.\u003c/p>","F5":"\u003cp>Model: \u003cem>We are holding a careers evening on 4 June and I am writing to ask whether you would come and speak for ten minutes about moving from a science degree into publishing. I am asking you because that is exactly the route most of our final years are curious about. Please do say if the date is awkward — we run it every year.\u003c/em>\u003c/p>"},"model":["Dear Dr Berhane,","The postgraduate society is running an evening of short research talks on Thursday 12 May, and I am writing to ask whether you would come — and, if you were willing, say a few words at the start.","We are asking you in particular because almost everyone presenting took your research-methods course in their first year, and several of the projects began as coursework for it. It would be a good evening for you to see where that work ended up.","The talks run from six to half past seven in the Dalton Room, with drinks afterwards, and the opening remarks would be no more than five minutes — nothing prepared is needed. I do hope you can make it, but please do not worry in the least if the date is difficult; we would be glad to see you simply as a guest, or another year.","With best wishes,","Idris Mahmoud — Secretary, PG Society"],"model_html":"\u003cp>Dear Dr Berhane,\u003c/p>\u003cp>The postgraduate society is running an evening of short research talks on Thursday 12 May, and I am writing to ask whether you would come — and, if you were willing, say a few words at the start.\u003c/p>\u003cp>We are asking you in particular because almost everyone presenting took your research-methods course in their first year, and several of the projects began as coursework for it. It would be a good evening for you to see where that work ended up.\u003c/p>\u003cp>The talks run from six to half past seven in the Dalton Room, with drinks afterwards, and the opening remarks would be no more than five minutes — nothing prepared is needed. I do hope you can make it, but please do not worry in the least if the date is difficult; we would be glad to see you simply as a guest, or another year.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Idris Mahmoud — Secretary, PG Society\u003c/p>","model_band":5,"degraded":["Dear Dr Berhane,","We are organising an event of research talks in 12 May at 6 o’clock and we would like to invite you to come and make a speech for the opening. It will be very nice if you accept because you are a famous teacher in our department and all the students respect you very much. The event will be in Dalton Room and after we will have some drinks. Please confirm your attendance until Friday so we can print the programme.","We are waiting for your positive answer."],"degraded_html":"\u003cp>Dear Dr Berhane,\u003c/p>\u003cp>We are organising an event of research talks in 12 May at 6 o’clock and we would like to invite you to come and make a speech for the opening. It will be very nice if you accept because you are a famous teacher in our department and all the students respect you very much. The event will be in Dalton Room and after we will have some drinks. Please confirm your attendance until Friday so we can print the programme.\u003c/p>\u003cp>We are waiting for your positive answer.\u003c/p>","degraded_band":3,"model_words":157,"fault_list":{"tag":"F4","faults":["It books her rather than inviting her. “Please confirm your attendance until Friday so we can print the programme” assumes the yes, sets a deadline, and attaches a consequence. “We are waiting for your positive answer” then forecloses the refusal entirely — the third bullet is unmet.","The reason is flattery, not a reason. “you are a famous teacher and all the students respect you” could be sent to anyone in the department. The actual connection — that the presenters were her students and the projects grew out of her course — is the thing that would make her want to come, and it is missing.","Language. “in 12 May” (on), “in Dalton Room” (in the Dalton Room), “confirm your attendance until Friday” (by Friday), “It will be very nice if you accept” (It would be). The until/by error is consequential: it asks for the opposite of what is meant."],"html":["\u003cp>1.  \u003cstrong>It books her rather than inviting her.\u003c/strong> “Please confirm your attendance until Friday so we can print the programme” assumes the yes, sets a deadline, and attaches a consequence. “We are waiting for your positive answer” then forecloses the refusal entirely — the third bullet is unmet.\u003c/p>","\u003cp>2.  \u003cstrong>The reason is flattery, not a reason.\u003c/strong> “you are a famous teacher and all the students respect you” could be sent to anyone in the department. The actual connection — that the presenters were her students and the projects grew out of her course — is the thing that would make her want to come, and it is missing.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “in 12 May” (on), “in Dalton Room” (in the Dalton Room), “confirm your attendance until Friday” (by Friday), “It will be very nice if you accept” (It would be). The until/by error is consequential: it asks for the opposite of what is meant.\u003c/p>"]},"scenario":"\u003cp>Your department’s postgraduate society is holding an evening of short research talks on 12 May, followed by drinks. You are inviting Dr Berhane, who taught you last year, to come and to say a few words at the start. She is not on the organising committee and has no obligation to attend.\u003c/p>","bullets":["Invite her and say what the event is.","Explain why you are asking her in particular.","Give the practical details and make it easy to decline."],"header":[["To:","s.berhane@northgate.ac.uk"],["Subject:","Invitation — PG research evening, 12 May"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The reason is flattery, not a reason. “you are a famous teacher and all the students respect you” could be sent to anyone in the department. The actual connection — that the presenters were her students and the projects grew out of her course — is the thing that would make her want to come, and it is missing.","correct":true},{"text":"Language. “in 12 May” (on), “in Dalton Room” (in the Dalton Room), “confirm your attendance until Friday” (by Friday), “It will be very nice if you accept” (It would be). The until/by error is consequential: it asks for the opposite of what is meant.","correct":true},{"text":"Language. “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion.","correct":false},{"text":"“Women should not have to choose” is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.","correct":false},{"text":"It books her rather than inviting her. “Please confirm your attendance until Friday so we can print the programme” assumes the yes, sets a deadline, and attaches a consequence. “We are waiting for your positive answer” then forecloses the refusal entirely — the third bullet is unmet.","correct":true},{"text":"“Then people will choose to leave their cars at home voluntarily” ignores the induced-demand mechanism, which is the reason investment alone failed in the cities cited.","correct":false}],"key_html":"F4"}};</script>
