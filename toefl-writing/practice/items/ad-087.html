<script>window.ITEM={"kind":"exercise","id":"AD 087","slug":"ad-087","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Film studies · value trade-off","payload":{"Strategy":"weigh fidelity against what the medium can do","Grammar":"inversion after so","Vocabulary":"adaptation, source text, register, compression","Convention":"weighing fidelity against transformation"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Tom reframes the question. What is his new criterion?\u003c/p>\u003cp>b.  Why is compression not merely a practical problem?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a source text, and what is register?\u003c/p>\u003cp>b.  What does compression mean in adaptation?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that names the standard you would apply.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response adopts Tom’s standard and preserves Bea’s objection as an exception. Why is that stronger than rejecting her?\u003c/p>\u003cp>b.  Why is the interior monologue example chosen?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"So rarely is the complaint actually about quantity that the standard is doing no work\" — identify the inversion and say what it does.\u003c/p>\u003cp>b.  \"trading on something you have declined to deliver\" — what kind of objection is this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Whether what replaces the cut material performs the same function in the new medium, rather than how much was retained.\u003c/p>\u003cp>b.  Because what must be cut is not evenly distributed. Interiority, duration and narrative voice are the hardest things to carry over, so compression forces transformation rather than mere shortening.\u003c/p>","P2":"\u003cp>a.  The source text is the work being adapted; register is the level and tone of language appropriate to a situation.\u003c/p>\u003cp>b.  Condensing the source so that fewer elements carry more of the work — which usually requires inventing material rather than only removing it.\u003c/p>","P3":"\u003cp>Model: \"Judge an adaptation by whether its inventions do the work of what they replaced, not by how much survives.\"\u003c/p>","F1":"\u003cp>a.  Because her case is real and a standard that cannot accommodate it looks evasive. Isolating it as a narrow exception concedes the strongest example while denying it the status of a general rule.\u003c/p>\u003cp>b.  Because it is the clearest case where fidelity and function pull apart. Reproducing the monologue faithfully is impossible, so any solution is technically unfaithful — which shows fidelity cannot be the operative standard.\u003c/p>","F2":"\u003cp>a.  \"So rarely is the complaint ...\" fronts the degree adverb and inverts subject and auxiliary. It raises the register at the point of the strongest claim and places the emphasis on the rarity, which is what the argument turns on.\u003c/p>\u003cp>b.  An objection about honesty rather than about art. It concedes that the film may be good and locates the fault in the use of the title, which is exactly the narrow version of Bea’s complaint that survives.\u003c/p>","F3":"\u003cp>1.  \"Directors could make longer films or television series\" does not answer Tom’s point, which is about the different things the two media can do, not about duration.\u003c/p>\u003cp>2.  The argument is entirely personal — characters differing from how the writer imagined them is not a standard anyone could apply.\u003c/p>\u003cp>3.  \"Books are usually better than films anyway\" is irrelevant to the question of how an adaptation should be judged, and \"disrespectful to change it\" assumes the conclusion.\u003c/p>"},"model":["Tom has the better standard and Bea has identified the case where it fails, which is narrower than she thinks.","The fidelity standard cannot be applied consistently. Every adaptation cuts, and nobody counts the cuts; what people call infidelity is almost always a change they disliked rather than a measurable distance from the text. So rarely is the complaint actually about quantity that the standard is doing no work.","Tom’s criterion is better because it asks what a change achieves. A novel can give you a character’s interior monologue; a film cannot, so it must externalise that through gesture, framing or invented action. Judged by fidelity those inventions are departures. Judged by function they are translations, and the adaptation that refuses them produces the illustrated novel nobody wants.","Bea is right about one case, though: where a change removes what the source was for. An ending that reverses the book’s judgement of its own events is not a translation but a different claim, and borrowing the title is then a form of trading on something you have declined to deliver. That is a narrow exception rather than a standard."],"model_html":"\u003cp>Tom has the better standard and Bea has identified the case where it fails, which is narrower than she thinks.\u003c/p>\u003cp>The fidelity standard cannot be applied consistently. Every adaptation cuts, and nobody counts the cuts; what people call infidelity is almost always a change they disliked rather than a measurable distance from the text. So rarely is the complaint actually about quantity that the standard is doing no work.\u003c/p>\u003cp>Tom’s criterion is better because it asks what a change achieves. A novel can give you a character’s interior monologue; a film cannot, so it must externalise that through gesture, framing or invented action. Judged by fidelity those inventions are departures. Judged by function they are translations, and the adaptation that refuses them produces the illustrated novel nobody wants.\u003c/p>\u003cp>Bea is right about one case, though: where a change removes what the source was for. An ending that reverses the book’s judgement of its own events is not a translation but a different claim, and borrowing the title is then a form of trading on something you have declined to deliver. That is a narrow exception rather than a standard.\u003c/p>","model_band":5,"degraded":["In my opinion adaptations should be faithful to the original book because the author created that story and it is disrespectful to change it. I have often been disappointed when I read a book and then watched the film, because the characters were different from how I imagined them and important scenes were missing. Tom says films have less time but directors could make longer films or television series if they needed more space. Books are usually better than films anyway."],"degraded_html":"\u003cp>In my opinion adaptations should be faithful to the original book because the author created that story and it is disrespectful to change it. I have often been disappointed when I read a book and then watched the film, because the characters were different from how I imagined them and important scenes were missing. Tom says films have less time but directors could make longer films or television series if they needed more space. Books are usually better than films anyway.\u003c/p>","degraded_band":3,"model_words":189,"fault_list":{"tag":"F3","faults":["\"Directors could make longer films or television series\" does not answer Tom’s point, which is about the different things the two media can do, not about duration.","The argument is entirely personal — characters differing from how the writer imagined them is not a standard anyone could apply.","\"Books are usually better than films anyway\" is irrelevant to the question of how an adaptation should be judged, and \"disrespectful to change it\" assumes the conclusion."],"html":["\u003cp>1.  \"Directors could make longer films or television series\" does not answer Tom’s point, which is about the different things the two media can do, not about duration.\u003c/p>","\u003cp>2.  The argument is entirely personal — characters differing from how the writer imagined them is not a standard anyone could apply.\u003c/p>","\u003cp>3.  \"Books are usually better than films anyway\" is irrelevant to the question of how an adaptation should be judged, and \"disrespectful to change it\" assumes the conclusion.\u003c/p>"]},"prof_name":"Dr Haddad","professor":"\u003cp>Adaptations of novels are routinely criticised for departing from the book. Some argue fidelity is the proper standard, since the source is what audiences value. Others argue an adaptation that merely illustrates a novel has failed as a film. Which standard should apply?\u003c/p>","students":[["Bea","Fidelity, within reason. If you remove the ending, you have made a different story and attached a title that sells tickets."],["Tom","Every adaptation removes something — two hours against four hundred pages. The question is not what was cut but whether what replaced it does the same work."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Directors could make longer films or television series” does not answer Tom’s point, which is about the different things the two media can do, not about duration.","correct":true},{"text":"The argument is entirely personal — characters differing from how the writer imagined them is not a standard anyone could apply.","correct":true},{"text":"Social conventions. “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.","correct":false},{"text":"“Books are usually better than films anyway” is irrelevant to the question of how an adaptation should be judged, and “disrespectful to change it” assumes the conclusion.","correct":true},{"text":"No third option is considered, so the problem is simply transferred; and “let me know as soon as you can” adds time pressure to a request that should not have been made.","correct":false},{"text":"Language and register. “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).","correct":false}],"key_html":"F3"}};</script>
