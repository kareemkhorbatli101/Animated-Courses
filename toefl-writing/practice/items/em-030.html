<script>window.ITEM={"kind":"exercise","id":"EM 030","slug":"em-030","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"apologise once and then be useful","Grammar":"future with will for commitment","Vocabulary":"oversight, double-booked, reconcile, root cause","Convention":"apologising for an error that affected an event"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Four people are out of pocket. What must the email contain before anything else?\u003c/p>\u003cp>b.  Why keep the explanation short?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to reconcile two lists?\u003c/p>\u003cp>b.  What is a root cause, and why is it different from what happened?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Make the repair concrete in one sentence with a mechanism in it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The four are named. Why, in a message to the whole group?\u003c/p>\u003cp>b.  The last substantive paragraph is about November. What is it doing in an apology?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Send me a photo of your ticket and I will transfer the fare this week\" — why an imperative followed by a promise?\u003c/p>\u003cp>b.  \"it was a genuinely annoying way to start a Saturday\" — why end on this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The apology and the refund, in that order and in the first two lines. Everything else can wait; the money cannot, because until it is offered the apology is incomplete.\u003c/p>\u003cp>b.  Because the group does not need a forensic account and the length of an explanation is inversely related to how sincere it seems. Two sentences establish that you understand the cause; six start to sound like a defence.\u003c/p>","P2":"\u003cp>a.  To compare two records and account for every difference — exactly the step that was skipped.\u003c/p>\u003cp>b.  What happened is the double count; the root cause is keeping two lists with no reconciliation step. Fixing the first prevents nothing.\u003c/p>","P3":"\u003cp>Model: \"Send me a photo of your ticket and I will transfer the fare this week.\"\u003c/p>","F1":"\u003cp>a.  Because an apology addressed to \"the people affected\" lets everyone else assume it was somebody else’s problem, and lets the four wonder whether they count. Naming them makes the obligation specific and public.\u003c/p>\u003cp>b.  It converts the apology from a sentiment into a change. The four people know the fix, and the rest of the group can check it next time — which is what stops the same error recurring with a different organiser.\u003c/p>","F2":"\u003cp>a.  Because the imperative gives them the smallest possible action and the promise binds the writer to a date. An offer phrased as \"let me know if you would like a refund\" puts the asking back on the people owed money.\u003c/p>\u003cp>b.  It acknowledges the actual experience rather than the abstraction of being inconvenienced, and the light tone is appropriate once the substantive repair is already made. Ending on the cost to them rather than on the writer’s regret keeps the focus where it belongs.\u003c/p>","F3":"\u003cp>1.  Nobody is named, the number affected is \"a few\", and no refund is offered — \"if the people affected want to discuss compensation they can contact me\" makes them ask. The third bullet fails.\u003c/p>\u003cp>2.  \"I was doing my best to organise everything on my own which is not easy\" is a bid for sympathy inside an apology, and it shifts the frame to the writer’s difficulties.\u003c/p>\u003cp>3.  \"There was a mix-up with the numbers\" is agentless where responsibility was required, and nothing is said about preventing it. There is also a comma splice in the opening sentence.\u003c/p>"},"model":["Hi all,","To the four of you who ended up on the train on Saturday — Maya, Tom, Priya and Jonas — I am sorry. That was my mistake and I will refund your fares.","What happened is that I was keeping the sign-up in two places, the online form and a paper sheet at the seminar, and did not reconcile them before booking. Four names appeared on both and I counted them twice, so I booked a forty-seat coach for forty-four people.","Send me a photo of your ticket and I will transfer the fare this week. If anyone paid for a taxi at either end because of the time it took, send me that too.","For the November trip I will use one list only and post the final numbers to this thread a week before, so anyone can check their own name is on it.","Sorry again — it was a genuinely annoying way to start a Saturday.","Nour"],"model_html":"\u003cp>Hi all,\u003c/p>\u003cp>To the four of you who ended up on the train on Saturday — Maya, Tom, Priya and Jonas — I am sorry. That was my mistake and I will refund your fares.\u003c/p>\u003cp>What happened is that I was keeping the sign-up in two places, the online form and a paper sheet at the seminar, and did not reconcile them before booking. Four names appeared on both and I counted them twice, so I booked a forty-seat coach for forty-four people.\u003c/p>\u003cp>Send me a photo of your ticket and I will transfer the fare this week. If anyone paid for a taxi at either end because of the time it took, send me that too.\u003c/p>\u003cp>For the November trip I will use one list only and post the final numbers to this thread a week before, so anyone can check their own name is on it.\u003c/p>\u003cp>Sorry again — it was a genuinely annoying way to start a Saturday.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi everyone, I am really sorry about the confusion with the coach on Saturday, there was a mix-up with the numbers and unfortunately a few people could not get on. I feel really bad about it, it was not intentional and I was doing my best to organise everything on my own which is not easy. If the people affected want to discuss compensation they can contact me directly. Sorry again everyone!","Nour"],"degraded_html":"\u003cp>Hi everyone, I am really sorry about the confusion with the coach on Saturday, there was a mix-up with the numbers and unfortunately a few people could not get on. I feel really bad about it, it was not intentional and I was doing my best to organise everything on my own which is not easy. If the people affected want to discuss compensation they can contact me directly. Sorry again everyone!\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":162,"fault_list":{"tag":"F3","faults":["Nobody is named, the number affected is \"a few\", and no refund is offered — \"if the people affected want to discuss compensation they can contact me\" makes them ask. The third bullet fails.","\"I was doing my best to organise everything on my own which is not easy\" is a bid for sympathy inside an apology, and it shifts the frame to the writer’s difficulties.","\"There was a mix-up with the numbers\" is agentless where responsibility was required, and nothing is said about preventing it. There is also a comma splice in the opening sentence."],"html":["\u003cp>1.  Nobody is named, the number affected is \"a few\", and no refund is offered — \"if the people affected want to discuss compensation they can contact me\" makes them ask. The third bullet fails.\u003c/p>","\u003cp>2.  \"I was doing my best to organise everything on my own which is not easy\" is a bid for sympathy inside an apology, and it shifts the frame to the writer’s difficulties.\u003c/p>","\u003cp>3.  \"There was a mix-up with the numbers\" is agentless where responsibility was required, and nothing is said about preventing it. There is also a comma splice in the opening sentence.\u003c/p>"]},"scenario":"\u003cp>You were running the sign-up sheet for a departmental trip and double counted, so four people turned up who had no seat on the coach. They went by train at their own expense.\u003c/p>","bullets":["Apologise.","Explain what went wrong, briefly.","Make them whole."],"header":[["To:","geog-trip@northgate.ac.uk"],["Subject:","Saturday’s coach — my error, and refunds"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Nobody is named, the number affected is “a few”, and no refund is offered — “if the people affected want to discuss compensation they can contact me” makes them ask. The third bullet fails.","correct":true},{"text":"No distinction between demolition and alteration, no mention of what the rules actually protect, and “future generations will not thank us” is rhetoric standing in for the comparison.","correct":false},{"text":"Language and register. “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”.","correct":false},{"text":"“A theory that cannot be tested is not really scientific” restates the criterion under challenge, and there is a comma splice in the first sentence.","correct":false},{"text":"“I was doing my best to organise everything on my own which is not easy” is a bid for sympathy inside an apology, and it shifts the frame to the writer’s difficulties.","correct":true},{"text":"“There was a mix-up with the numbers” is agentless where responsibility was required, and nothing is said about preventing it. There is also a comma splice in the opening sentence.","correct":true}],"key_html":"F3"}};</script>
