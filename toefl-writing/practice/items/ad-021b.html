complainants is one thing\". The disagreement is about what else the same mechanism covers.\u003c/p>\u003cp>b.  Because each individual restriction can be defended on its merits while the aggregate is still bad. An argument about accumulation cannot be met by defending any particular case, which is what makes it hard to answer and easy to ignore.\u003c/p>","P2":"\u003cp>a.  \"In camera\" means the hearing itself is held in private; a reporting restriction allows the hearing to be attended but limits what may be published. The second is far less intrusive on open justice.\u003c/p>\u003cp>b.  Against secret proceedings, arbitrary decisions and judicial misconduct — it is a check on the court, not a right to know about the parties.\u003c/p>","P3":"\u003cp>Model: \"Both accept anonymity for complainants, so the real question is whether the same mechanism should be available to institutions.\"\u003c/p>","F1":"\u003cp>a.  Complainant anonymity in sexual offence cases. Noticing it matters because the entire public debate is conducted over that case, which neither of them disputes — so arguing it again would contribute nothing.\u003c/p>\u003cp>b.  Between automatic protections attaching to a category of person and discretionary ones granted on application. It is the distinction that separates Noor’s goal from Felix’s fear, and it is invisible while both are called \"reporting restrictions\".\u003c/p>","F2":"\u003cp>a.  A distributive argument about access to a legal mechanism. It says the discretionary rule is formally available to everyone and practically available to the well-resourced, which is why it drifts towards protecting institutions.\u003c/p>\u003cp>b.  It names the error the whole discussion has been making and attributes it to the debate rather than to either classmate, which lets the writer correct both without criticising either.\u003c/p>","F3":"\u003cp>1.  It restates the uncontroversial case at length and never reaches the disagreement, which is about institutional use of the same mechanism.\u003c/p>\u003cp>2.  The recommendation — judges decide case by case — is the status quo, and it is precisely what Felix’s accumulation argument is directed against, so it answers him by ignoring him.\u003c/p>\u003cp>3.  Language: \"the victims\", \"the justice\", \"the public attention\" over-articled; \"they have suffered enough\" is sentiment rather than argument; \"what is the best solution\" has statement order wrong in an embedded question.\u003c/p>"},"model":["They agree about the case that is usually argued and disagree about the one that matters. Noor’s distinction is the right one: open justice is a claim about scrutiny of the court, which is satisfied by the substance being reportable, and nothing about it requires a complainant’s name to be permanently searchable. Felix does not really dispute that. His worry is about who else uses the mechanism.","That suggests the balance should not be struck case by case at all, but by asking what the restriction protects. A rule that anonymises natural persons in defined categories operates automatically and cannot be applied for; a rule that lets a party apply for restrictions on grounds of harm is the one that institutions use, because they can afford the application and the complainant cannot. So I would extend the automatic protections Noor wants and narrow sharply the discretionary ones Felix fears, which are different instruments that the debate persistently treats as one."],"model_html":"\u003cp>They agree about the case that is usually argued and disagree about the one that matters. Noor’s distinction is the right one: open justice is a claim about scrutiny of the court, which is satisfied by the substance being reportable, and nothing about it requires a complainant’s name to be permanently searchable. Felix does not really dispute that. His worry is about who else uses the mechanism.\u003c/p>\u003cp>That suggests the balance should not be struck case by case at all, but by asking what the restriction protects. A rule that anonymises natural persons in defined categories operates automatically and cannot be applied for; a rule that lets a party apply for restrictions on grounds of harm is the one that institutions use, because they can afford the application and the complainant cannot. So I would extend the automatic protections Noor wants and narrow sharply the discretionary ones Felix fears, which are different instruments that the debate persistently treats as one.\u003c/p>","model_band":5,"degraded":["This is a very sensitive issue and I can see both sides. On one hand it is very important that the victims of serious crimes are protected and that their identity is not published in the newspapers, because they have suffered enough and they should not suffer again from the public attention. On the other hand Felix is right that the justice must be transparent because otherwise people will not trust the system. In my opinion the judges should decide in each case individually what is the best solution, taking into account all the circumstances."],"degraded_html":"\u003cp>This is a very sensitive issue and I can see both sides. On one hand it is very important that the victims of serious crimes are protected and that their identity is not published in the newspapers, because they have suffered enough and they should not suffer again from the public attention. On the other hand Felix is right that the justice must be transparent because otherwise people will not trust the system. In my opinion the judges should decide in each case individually what is the best solution, taking into account all the circumstances.\u003c/p>","degraded_band":3,"model_words":160,"fault_list":{"tag":"F3","faults":["It restates the uncontroversial case at length and never reaches the disagreement, which is about institutional use of the same mechanism.","The recommendation — judges decide case by case — is the status quo, and it is precisely what Felix’s accumulation argument is directed against, so it answers him by ignoring him.","Language: \"the victims\", \"the justice\", \"the public attention\" over-articled; \"they have suffered enough\" is sentiment rather than argument; \"what is the best solution\" has statement order wrong in an embedded question."],"html":["\u003cp>1.  It restates the uncontroversial case at length and never reaches the disagreement, which is about institutional use of the same mechanism.\u003c/p>","\u003cp>2.  The recommendation — judges decide case by case — is the status quo, and it is precisely what Felix’s accumulation argument is directed against, so it answers him by ignoring him.\u003c/p>","\u003cp>3.  Language: \"the victims\", \"the justice\", \"the public attention\" over-articled; \"they have suffered enough\" is sentiment rather than argument; \"what is the best solution\" has statement order wrong in an embedded question.\u003c/p>"]},"prof_name":"Dr Ferreira","professor":"\u003cp>Court proceedings are normally public, on the principle that justice must be seen to be done. In some cases — sexual offences, children, certain witnesses — reporting is restricted. Where should the balance lie between open justice and the protection of those involved?\u003c/p>","students":[["Noor","Protection, more often than now. Open justice is a principle about institutions being watched, and that is satisfied by the proceedings being attended and reported in substance. It does not require that a complainant’s name be searchable for ever."],["Felix","Open justice, and I am wary of the direction. Every restriction is justified by a sympathetic case, and the accumulated effect is a court system the public cannot follow. Anonymity for complainants is one thing; the same mechanism is used to protect institutions from embarrassment."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It restates the uncontroversial case at length and never reaches the disagreement, which is about institutional use of the same mechanism.","correct":true},{"text":"It accuses and then threatens. “clearly nothing is happening” and “I will complain to the head of department”. The reader is now defending themselves rather than finding the file.","correct":false},{"text":"The recommendation — judges decide case by case — is the status quo, and it is precisely what Felix’s accumulation argument is directed against, so it answers him by ignoring him.","correct":true},{"text":"Language: “the victims”, “the justice”, “the public attention” over-articled; “they have suffered enough” is sentiment rather than argument; “what is the best solution” has statement order wrong in an embedded question.","correct":true},{"text":"It claims rather than asks. “I believe I am owed this money” and “calculate what I am due” assume the entitlement the email should be establishing — the third bullet fails.","correct":false},{"text":"“The deadline is getting close so it would be good to know what you are planning to do” is a request wearing the clothes of an offer, and it puts the problem back on her.","correct":false}],"key_html":"F3"}};</script>
