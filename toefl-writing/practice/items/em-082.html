<script>window.ITEM={"kind":"exercise","id":"EM 082","slug":"em-082","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and chasing","payload":{"Strategy":"chase by supplying what is missing, not by asking why it is late","Grammar":"just / simply as softeners","Vocabulary":"outstanding, bear with, in the queue, action","Convention":"chasing someone more senior than you"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Your supervisor is senior and busy. What tone does the third bullet require?\u003c/p>\u003cp>b.  What is the smallest possible action you could ask for?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \"outstanding\" mean in this context?\u003c/p>\u003cp>b.  What do \"just\" and \"simply\" do to a request, and when do they backfire?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask for a one-word reply in a single sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer supplies the title in full. Why is that the most important line in the email?\u003c/p>\u003cp>b.  The deadline appears in the first sentence rather than the last. Why?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a one-word reply is all I need\" — what does this do to the cost of responding?\u003c/p>\u003cp>b.  \"apologies for the chase\" — who is actually at fault, and why apologise?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It requires the deadline to be stated as a fact about the department rather than as a demand on the reader. \"The department needs it by Friday\" is information; \"I need your answer by Friday\" is an instruction to a supervisor.\u003c/p>\u003cp>b.  A one-word confirmation — and supplying the title in full is what makes that possible. Without it the smallest action is \"find the old email\".\u003c/p>","P2":"\u003cp>a.  Still to be done or still unresolved — it describes the item rather than the person, which is why it is useful in a chase.\u003c/p>\u003cp>b.  They minimise the imposition. They backfire when the thing asked for is not in fact small, because the mismatch reads as manipulation — \"I just need you to read fifty pages by tomorrow\".\u003c/p>","P3":"\u003cp>Model: \"If that is still right, a one-word reply is all I need and I will file it.\"\u003c/p>","F1":"\u003cp>a.  Because it removes the search. The most common reason a small task stays undone is that doing it requires first finding something, and a busy reader defers anything that starts with a search.\u003c/p>\u003cp>b.  Because it is the reason for writing and the thing that justifies a third email. Held to the end it would read as pressure applied after the request; placed first it reads as context.\u003c/p>","F2":"\u003cp>a.  It reduces it to almost nothing, and in doing so removes the excuse. A reader who cannot manage a one-word reply has no account of why not, which is a gentle but real form of pressure.\u003c/p>\u003cp>b.  The supervisor is, on any reasonable view. Apologising anyway costs nothing, preserves a relationship the writer depends on for a year, and makes the reply easier to send — nobody likes answering an email that opens by convicting them.\u003c/p>","F3":"\u003cp>1.  It opens by establishing the reader’s failure. \"I sent you three weeks ago and I still have not received your confirmation\" is an accusation in the first sentence.\u003c/p>\u003cp>2.  The title is not supplied, so the smallest possible action is still \"search your inbox\". The second bullet fails entirely.\u003c/p>\u003cp>3.  \"This will cause serious problems for me\" transfers the consequence to the reader, and \"urgently\" plus \"as soon as possible\" instructs a supervisor on timing.\u003c/p>"},"model":["Dear Professor Whitfield,","Sorry to come back to this — the department needs the dissertation title registered by Friday and it is the last thing outstanding on my form.","The title we discussed was: \"Coastal sediment transport under storm surge conditions: a case study of the Dee estuary\". If that is still right, a one-word reply is all I need and I will file it. If you would rather change anything, I am around all day Thursday and happy to come to you.","Thank you — and apologies for the chase.","Best wishes,","Ella Fournier"],"model_html":"\u003cp>Dear Professor Whitfield,\u003c/p>\u003cp>Sorry to come back to this — the department needs the dissertation title registered by Friday and it is the last thing outstanding on my form.\u003c/p>\u003cp>The title we discussed was: \"Coastal sediment transport under storm surge conditions: a case study of the Dee estuary\". If that is still right, a one-word reply is all I need and I will file it. If you would rather change anything, I am around all day Thursday and happy to come to you.\u003c/p>\u003cp>Thank you — and apologies for the chase.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ella Fournier\u003c/p>","model_band":5,"degraded":["Dear Professor Whitfield, I am writing again about my dissertation title which I sent you three weeks ago and I still have not received your confirmation. The deadline for registration is this Friday so I really need your answer urgently, otherwise I will not be able to register and this will cause serious problems for me. Please could you reply as soon as possible. Thank you.","Ella"],"degraded_html":"\u003cp>Dear Professor Whitfield, I am writing again about my dissertation title which I sent you three weeks ago and I still have not received your confirmation. The deadline for registration is this Friday so I really need your answer urgently, otherwise I will not be able to register and this will cause serious problems for me. Please could you reply as soon as possible. Thank you.\u003c/p>\u003cp>Ella\u003c/p>","degraded_band":3,"model_words":94,"fault_list":{"tag":"F3","faults":["It opens by establishing the reader’s failure. \"I sent you three weeks ago and I still have not received your confirmation\" is an accusation in the first sentence.","The title is not supplied, so the smallest possible action is still \"search your inbox\". The second bullet fails entirely.","\"This will cause serious problems for me\" transfers the consequence to the reader, and \"urgently\" plus \"as soon as possible\" instructs a supervisor on timing."],"html":["\u003cp>1.  It opens by establishing the reader’s failure. \"I sent you three weeks ago and I still have not received your confirmation\" is an accusation in the first sentence.\u003c/p>","\u003cp>2.  The title is not supplied, so the smallest possible action is still \"search your inbox\". The second bullet fails entirely.\u003c/p>","\u003cp>3.  \"This will cause serious problems for me\" transfers the consequence to the reader, and \"urgently\" plus \"as soon as possible\" instructs a supervisor on timing.\u003c/p>"]},"scenario":"\u003cp>You asked your supervisor three weeks ago to confirm your dissertation title so the department can register it. The registration deadline is in four days. You have sent one reminder.\u003c/p>","bullets":["Remind them what is outstanding.","Make the action as small as possible.","Convey the deadline without pressure."],"header":[["To:","j.whitfield@northgate.ac.uk"],["Subject:","Dissertation title — registration closes Friday"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The conclusion abandons the task. “the truth is somewhere in the middle and we need more research” declines to take the position the task explicitly requires, and it does not say what research or what it would settle.","correct":false},{"text":"It argues from an undisputed principle. “Privacy is a fundamental human right” and “protected in many constitutions” are true and irrelevant: nobody in the discussion denies them, so they move nothing.","correct":false},{"text":"It opens by establishing the reader’s failure. “I sent you three weeks ago and I still have not received your confirmation” is an accusation in the first sentence.","correct":true},{"text":"The title is not supplied, so the smallest possible action is still “search your inbox”. The second bullet fails entirely.","correct":true},{"text":"Nothing is added. Every point is a restatement, and “give extra support to the weaker ones” is exactly the vague remedy that the question about streaming exists to interrogate.","correct":false},{"text":"“This will cause serious problems for me” transfers the consequence to the reader, and “urgently” plus “as soon as possible” instructs a supervisor on timing.","correct":true}],"key_html":"F3"}};</script>
