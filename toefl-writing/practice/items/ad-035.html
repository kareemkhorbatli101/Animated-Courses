<script>window.ITEM={"kind":"exercise","id":"AD 035","slug":"ad-035","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban planning and transport · cause ranking","payload":{"Strategy":"rank causes by which one the others depend on","Grammar":"cleft for emphasis","Vocabulary":"severance, modal shift, catchment, desire line","Convention":"ranking causes where the obvious one is a symptom"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Yuki concedes that infrastructure matters. What is her actual claim?\u003c/p>\u003cp>b.  Which position is harder to act on, and does that make it less likely to be true?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is modal shift, and what is a desire line?\u003c/p>\u003cp>b.  What is severance, and why does it matter for networks?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using which depends on which.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reinterprets the evidence Yuki relies on. How?\u003c/p>\u003cp>b.  Why does it call topography \"the one genuinely exogenous constraint\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is network completeness, not lane kilometres, that predicts the outcome\" — name the device and say why it is needed.\u003c/p>\u003cp>b.  \"behave like a lagging indicator\" — what does the phrase claim, and what evidence would refute it?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the same infrastructure produces different results depending on social meaning — so infrastructure is necessary but not sufficient.\u003c/p>\u003cp>b.  Culture is harder to act on. That has no bearing on whether it is true, and treating tractability as evidence is a common and invisible error — though it is a legitimate reason to prefer one policy over another once the causal question is settled.\u003c/p>","P2":"\u003cp>a.  Modal shift is movement of journeys from one mode to another. A desire line is the route people would take if unobstructed, which is why networks that ignore them go unused.\u003c/p>\u003cp>b.  Severance is a barrier cutting a route in two. It matters because a single severance can make an otherwise complete network useless for the journeys that cross it.\u003c/p>","P3":"\u003cp>Model: \"Network completeness explains most of the variation, topography constrains it, and culture mostly follows the network rather than preceding it.\"\u003c/p>","F1":"\u003cp>a.  By reinterpreting her counter-examples. The cities that built lanes without result were building disconnected segments, so they are not cases of the same infrastructure producing different outcomes — they are cases of different infrastructure.\u003c/p>\u003cp>b.  Because it is the only one of the three that policy cannot alter. Infrastructure is built and culture is downstream of it, but hills are given — which makes topography the only genuine independent variable and worth separating from the others.\u003c/p>","F2":"\u003cp>a.  An it-cleft (family 8, structure 59). It is needed because the sentence is correcting a measure rather than stating a fact: the contrast between completeness and kilometres is the content, and the cleft puts both terms in opposition where a plain sentence would bury one.\u003c/p>\u003cp>b.  That attitudes change after the behaviour rather than causing it. It would be refuted by well documented cases where a measured shift in attitudes preceded both the network and the rise in cycling — which is exactly the evidence the response says is absent.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, which was the question.\u003c/p>\u003cp>2.  The classmates are not engaged: Yuki’s point about the same lanes producing different results, which is the only real argument on the table, is replaced by a generic remark about mentality.\u003c/p>\u003cp>3.  The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: \"the topography\", \"the bicycle\", \"way of transport\" (means of transport), \"make campaigns\" (run campaigns).\u003c/p>"},"model":["Lars is right and Yuki has identified the thing that makes his claim look weaker than it is. The cities that built lanes and saw little change mostly built disconnected ones — a protected lane that ends at a roundabout is not infrastructure in the relevant sense, because the whole journey has to be rideable for any of it to be used. It is network completeness, not lane kilometres, that predicts the outcome, and the apparent cultural residual largely disappears when you measure the right thing.","That does not dispose of culture, but it relocates it. Attitudes look like a cause and behave like a lagging indicator: the cities now described as having a cycling culture mostly acquired it in the twenty years after they built the network, not before. If culture were the driver, the sequence would run the other way, and in the well documented cases it does not. So I would rank network completeness first, topography second — real, and the one genuinely exogenous constraint — and culture third, as something largely produced by the first and worth measuring as an outcome rather than an input."],"model_html":"\u003cp>Lars is right and Yuki has identified the thing that makes his claim look weaker than it is. The cities that built lanes and saw little change mostly built disconnected ones — a protected lane that ends at a roundabout is not infrastructure in the relevant sense, because the whole journey has to be rideable for any of it to be used. It is network completeness, not lane kilometres, that predicts the outcome, and the apparent cultural residual largely disappears when you measure the right thing.\u003c/p>\u003cp>That does not dispose of culture, but it relocates it. Attitudes look like a cause and behave like a lagging indicator: the cities now described as having a cycling culture mostly acquired it in the twenty years after they built the network, not before. If culture were the driver, the sequence would run the other way, and in the well documented cases it does not. So I would rank network completeness first, topography second — real, and the one genuinely exogenous constraint — and culture third, as something largely produced by the first and worth measuring as an outcome rather than an input.\u003c/p>","model_band":5,"degraded":["I think all three factors are important and they influence each other. Obviously you need good infrastructure because people will not cycle if it is dangerous, but you also need the right mentality because in some countries people think that cycling is only for poor people or for sport. The topography is also a factor because nobody wants to climb a big hill every day to go to work. So cities should build cycle lanes and at the same time make campaigns to promote cycling as a healthy and ecological way of transport, and then more people will use the bicycle."],"degraded_html":"\u003cp>I think all three factors are important and they influence each other. Obviously you need good infrastructure because people will not cycle if it is dangerous, but you also need the right mentality because in some countries people think that cycling is only for poor people or for sport. The topography is also a factor because nobody wants to climb a big hill every day to go to work. So cities should build cycle lanes and at the same time make campaigns to promote cycling as a healthy and ecological way of transport, and then more people will use the bicycle.\u003c/p>","degraded_band":3,"model_words":186,"fault_list":{"tag":"F3","faults":["It refuses to rank, which was the question.","The classmates are not engaged: Yuki’s point about the same lanes producing different results, which is the only real argument on the table, is replaced by a generic remark about mentality.","The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: \"the topography\", \"the bicycle\", \"way of transport\" (means of transport), \"make campaigns\" (run campaigns)."],"html":["\u003cp>1.  It refuses to rank, which was the question.\u003c/p>","\u003cp>2.  The classmates are not engaged: Yuki’s point about the same lanes producing different results, which is the only real argument on the table, is replaced by a generic remark about mentality.\u003c/p>","\u003cp>3.  The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: \"the topography\", \"the bicycle\", \"way of transport\" (means of transport), \"make campaigns\" (run campaigns).\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>Cycling rates differ enormously between cities that are otherwise similar in size, income and climate. Proposed explanations include infrastructure, topography and cultural attitudes to cycling. Which explains most of the variation?\u003c/p>","students":[["Lars","Infrastructure, and it is not close. Where there is a connected network of protected lanes, people cycle; where there is not, they do not, regardless of what they say they would like."],["Yuki","Culture is doing more work than that allows. Two cities can build the same lanes and get different results, because whether cycling is seen as normal or as something for a particular kind of person determines who will use them."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: “the topography”, “the bicycle”, “way of transport” (means of transport), “make campaigns” (run campaigns).","correct":true},{"text":"“Very frustrating”, “we do not learn properly” and “I am sure this would make a big difference” are affect rather than argument, and nothing is offered that the reader could forward.","correct":false},{"text":"It refuses to rank, which was the question.","correct":true},{"text":"The effective date is “starting in July” rather than a date, and “a great opportunity for me” centres the writer in an email whose job is to protect the committee’s business.","correct":false},{"text":"No terms are proposed at all — “if you have any budget I would be happy to discuss it” puts the work of inventing an arrangement on the charity. The third bullet fails.","correct":false},{"text":"The classmates are not engaged: Yuki’s point about the same lanes producing different results, which is the only real argument on the table, is replaced by a generic remark about mentality.","correct":true}],"key_html":"F3"}};</script>
