<script>window.ITEM={"kind":"exercise","id":"AD 079","slug":"ad-079","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Linguistics · policy choice","payload":{"Strategy":"choose by asking what the child loses either way","Grammar":"gerund subjects","Vocabulary":"immersion, transfer, bilingual, medium of instruction","Convention":"choosing a language of instruction"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both speakers want the child fluent in the national language. What divides them?\u003c/p>\u003cp>b.  What is being traded against what in the first three years?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a medium of instruction, and what is transfer?\u003c/p>\u003cp>b.  Distinguish immersion from submersion.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names what is lost in the first three years.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response gives Zofia’s concern a whole paragraph before disagreeing. What does that accomplish?\u003c/p>\u003cp>b.  Why is the transfer evidence called \"the crucial part\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"teaching in a language a child does not yet understand costs more than time\" — why a gerund as subject?\u003c/p>\u003cp>b.  \"not when the national language starts but whether it is ever actually mastered\" — what does this reframing do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  When it should be introduced as the medium, and whether the early years spent in the home language are a cost or an investment.\u003c/p>\u003cp>b.  Early fluency in the national language against comprehension of everything else being taught — numeracy, literacy and the habit of reasoning.\u003c/p>","P2":"\u003cp>a.  The medium of instruction is the language lessons are taught in; transfer is the carrying over of skills learned in one language to another.\u003c/p>\u003cp>b.  Immersion supports a learner in a new language with teaching designed for that; submersion simply places them in it unsupported. The second is what Tunde is objecting to.\u003c/p>","P3":"\u003cp>Model: \"Begin in the home language, because what is lost in those years is not vocabulary but numeracy and reading.\"\u003c/p>","F1":"\u003cp>a.  It establishes that the writer takes the cost of delayed fluency seriously, so the conclusion is not a preference for cultural accommodation over opportunity. The final proposal is then visibly designed to meet her requirement.\u003c/p>\u003cp>b.  Because without it, beginning in the home language is a delay to be justified by other goods. With it, the early years contribute directly to later national-language literacy, which removes the trade-off Zofia assumes.\u003c/p>","F2":"\u003cp>a.  The gerund phrase lets a whole action be the subject of a claim about its cost, which is the precise move: the response is not arguing about languages but about what the practice does. It also keeps the sentence short enough to land.\u003c/p>\u003cp>b.  It separates the thing Zofia cares about from the thing she is defending. Her goal is mastery; immersion is only a means, and the response can satisfy the goal while rejecting the means.\u003c/p>","F3":"\u003cp>1.  Zofia’s argument is answered with \"children can learn it later without any problem\", which is the claim in dispute and is asserted with no support.\u003c/p>\u003cp>2.  The response is about identity and cultural erasure, which neither speaker raised — the prompt asks which policy serves the child’s learning.\u003c/p>\u003cp>3.  No proposal: no transition point, no treatment of the national language as a subject, nothing about transfer, so the policy question is not answered.\u003c/p>"},"model":["Tunde has the stronger case, and the reason is that Zofia’s argument treats language acquisition as the only thing happening in a classroom.","Her point about later access is true and should not be minimised. A child who leaves school without the national language is shut out of higher education and most employment, and no amount of home-language literacy compensates for that. Any transitional model has to deliver fluency, not merely postpone it.","But teaching in a language a child does not yet understand costs more than time. Those years are when number sense, reading and the habit of following an argument are built, and losing them is not recoverable later in the way vocabulary is. The transfer evidence is the crucial part of Tunde’s case: literacy acquired in a first language carries over, so beginning at home is not a detour but a shorter route to the same place.","So I would begin in the home language with the national language taught as a subject from year one, and switch medium around year four. That answers Zofia’s real worry, which is not when the national language starts but whether it is ever actually mastered."],"model_html":"\u003cp>Tunde has the stronger case, and the reason is that Zofia’s argument treats language acquisition as the only thing happening in a classroom.\u003c/p>\u003cp>Her point about later access is true and should not be minimised. A child who leaves school without the national language is shut out of higher education and most employment, and no amount of home-language literacy compensates for that. Any transitional model has to deliver fluency, not merely postpone it.\u003c/p>\u003cp>But teaching in a language a child does not yet understand costs more than time. Those years are when number sense, reading and the habit of following an argument are built, and losing them is not recoverable later in the way vocabulary is. The transfer evidence is the crucial part of Tunde’s case: literacy acquired in a first language carries over, so beginning at home is not a detour but a shorter route to the same place.\u003c/p>\u003cp>So I would begin in the home language with the national language taught as a subject from year one, and switch medium around year four. That answers Zofia’s real worry, which is not when the national language starts but whether it is ever actually mastered.\u003c/p>","model_band":5,"degraded":["I think children should be taught in their mother tongue first because language is a fundamental part of identity and culture, and forcing children to abandon their home language is a form of cultural erasure. Many indigenous languages have disappeared because of education policies like this. Zofia says the national language opens doors but children can learn it later as a second language without any problem, as many bilingual people prove. Education should respect diversity."],"degraded_html":"\u003cp>I think children should be taught in their mother tongue first because language is a fundamental part of identity and culture, and forcing children to abandon their home language is a form of cultural erasure. Many indigenous languages have disappeared because of education policies like this. Zofia says the national language opens doors but children can learn it later as a second language without any problem, as many bilingual people prove. Education should respect diversity.\u003c/p>","degraded_band":3,"model_words":196,"fault_list":{"tag":"F3","faults":["Zofia’s argument is answered with \"children can learn it later without any problem\", which is the claim in dispute and is asserted with no support.","The response is about identity and cultural erasure, which neither speaker raised — the prompt asks which policy serves the child’s learning.","No proposal: no transition point, no treatment of the national language as a subject, nothing about transfer, so the policy question is not answered."],"html":["\u003cp>1.  Zofia’s argument is answered with \"children can learn it later without any problem\", which is the claim in dispute and is asserted with no support.\u003c/p>","\u003cp>2.  The response is about identity and cultural erasure, which neither speaker raised — the prompt asks which policy serves the child’s learning.\u003c/p>","\u003cp>3.  No proposal: no transition point, no treatment of the national language as a subject, nothing about transfer, so the policy question is not answered.\u003c/p>"]},"prof_name":"Dr Haddad","professor":"\u003cp>Where children speak a home language different from the national one, schools can teach in the national language from the start, for fastest acquisition, or begin in the home language and transition later, which protects early learning but delays fluency. Which should a system choose?\u003c/p>","students":[["Zofia","Immersion. The national language is what opens every door later, and children acquire it fastest when it is the only medium. Delaying it is a kindness that costs them at eighteen."],["Tunde","A child who cannot follow the lesson is not learning maths or the language. The evidence from transitional programmes is that they end up better at both — the early years are not a cost, they are the foundation."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Zofia’s argument is answered with “children can learn it later without any problem”, which is the claim in dispute and is asserted with no support.","correct":true},{"text":"“Somebody to actually do something about it as soon as possible” names no action, no owner and no date, so the first bullet fails too.","correct":false},{"text":"It blames the equipment. “It was already quite old and the head was always a little loose” shifts the fault to the department that lent it, which is both unfair and transparent.","correct":false},{"text":"It books her rather than inviting her. “Please confirm your attendance until Friday so we can print the programme” assumes the yes, sets a deadline, and attaches a consequence. “We are waiting for your positive answer” then forecloses the refusal entirely — the third bullet is unmet.","correct":false},{"text":"The response is about identity and cultural erasure, which neither speaker raised — the prompt asks which policy serves the child’s learning.","correct":true},{"text":"No proposal: no transition point, no treatment of the national language as a subject, nothing about transfer, so the policy question is not answered.","correct":true}],"key_html":"F3"}};</script>
