<script>window.ITEM={"kind":"exercise","id":"EM 029","slug":"em-029","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"apologise to the institution and to the person separately","Grammar":"reassurance formulae","Vocabulary":"breach, undertaking, confidentiality, inadvertently","Convention":"apologising for something with formal consequences"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why report this yourself rather than wait?\u003c/p>\u003cp>b.  What is the difference between reporting and apologising here, and which does the office need first?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a breach, and what does \"inadvertently\" add?\u003c/p>\u003cp>b.  What is an undertaking, in the sense of a promise given?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Report the facts in one sentence with three numbers in it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The first paragraph contains almost no feeling. Why is that right here?\u003c/p>\u003cp>b.  \"who knows the detail of what happened\" — why mention the student’s state of knowledge?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It was carelessness rather than anything else\" — what is this ruling out?\u003c/p>\u003cp>b.  Why \"I have not contacted anyone else about it\"?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because a self-report is treated very differently from a breach discovered later, and because the office needs the facts while the timeline can still be reconstructed.\u003c/p>\u003cp>b.  Reporting supplies facts for a record; apologising addresses the person harmed. The office needs the first, and the student needed the second — which is why they are in different places.\u003c/p>","P2":"\u003cp>a.  A breach is an unauthorised disclosure or loss of personal data. \"Inadvertently\" states that it was unintentional, which affects how it is handled but not whether it is reportable.\u003c/p>\u003cp>b.  A formal promise, often given in place of a sanction — which is one reason self-reporting early matters.\u003c/p>","P3":"\u003cp>Model: \"On 14 May at about 16:20 I forwarded one student’s marks to a list with eleven members.\"\u003c/p>","F1":"\u003cp>a.  Because the office is assessing scope and risk, and emotion in the first paragraph delays the facts they need. The distress is real and belongs later, briefly, if at all — their job is not to reassure the person who caused the breach.\u003c/p>\u003cp>b.  Because the office’s next question is whether the affected person has been informed and what they know. Answering it unprompted removes a step and shows the writer has thought about the student rather than about themselves.\u003c/p>","F2":"\u003cp>a.  Malice and any suggestion of a systems failure. It takes responsibility plainly in six words without inviting an investigation into mitigating circumstances that do not exist.\u003c/p>\u003cp>b.  Because uncontrolled spread is the office’s main concern after the initial disclosure. Confirming that the writer has not discussed it further bounds the problem, and it is information only they can supply.\u003c/p>","F3":"\u003cp>1.  Almost no facts. No date, no time, no list size, no description of what the email contained — so the office cannot assess the breach at all. The first bullet fails.\u003c/p>\u003cp>2.  The email is largely about the writer’s feelings, which makes the reader the one providing comfort.\u003c/p>\u003cp>3.  \"I hope the problem is solved now\" pre-empts the office’s judgement about whether it is, and \"I would never do something like this on purpose\" answers an accusation nobody made.\u003c/p>"},"model":["Dear Data Protection Team,","I am self-reporting a disclosure. On 14 May at about 16:20 I forwarded an email from Dr Mensah to the GEOG204 group list. It contained the coursework mark and feedback for one other student. The list has eleven members.","What I have done so far: I recalled the message, which failed; I emailed the list within ten minutes asking everyone to delete it without reading or forwarding; and I spoke to the student concerned the same afternoon, who knows the detail of what happened. I have not contacted anyone else about it.","It was carelessness rather than anything else — I was replying to the group and forwarded the wrong message. I understand this may need to be recorded and I am happy to provide a written account or to meet if that would help.","Yours sincerely,","Daniel Ofori — 2199031"],"model_html":"\u003cp>Dear Data Protection Team,\u003c/p>\u003cp>I am self-reporting a disclosure. On 14 May at about 16:20 I forwarded an email from Dr Mensah to the GEOG204 group list. It contained the coursework mark and feedback for one other student. The list has eleven members.\u003c/p>\u003cp>What I have done so far: I recalled the message, which failed; I emailed the list within ten minutes asking everyone to delete it without reading or forwarding; and I spoke to the student concerned the same afternoon, who knows the detail of what happened. I have not contacted anyone else about it.\u003c/p>\u003cp>It was carelessness rather than anything else — I was replying to the group and forwarded the wrong message. I understand this may need to be recorded and I am happy to provide a written account or to meet if that would help.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Daniel Ofori — 2199031\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I am writing because unfortunately I made a terrible mistake yesterday and accidentally sent an email with another student’s marks to my whole group. I feel absolutely awful about it and I have not been able to sleep. It was a genuine accident and I would never do something like this on purpose. I have already apologised to the student and asked everyone to delete the email so I hope the problem is solved now.","Daniel"],"degraded_html":"\u003cp>Dear Sir/Madam, I am writing because unfortunately I made a terrible mistake yesterday and accidentally sent an email with another student’s marks to my whole group. I feel absolutely awful about it and I have not been able to sleep. It was a genuine accident and I would never do something like this on purpose. I have already apologised to the student and asked everyone to delete the email so I hope the problem is solved now.\u003c/p>\u003cp>Daniel\u003c/p>","degraded_band":3,"model_words":145,"fault_list":{"tag":"F3","faults":["Almost no facts. No date, no time, no list size, no description of what the email contained — so the office cannot assess the breach at all. The first bullet fails.","The email is largely about the writer’s feelings, which makes the reader the one providing comfort.","\"I hope the problem is solved now\" pre-empts the office’s judgement about whether it is, and \"I would never do something like this on purpose\" answers an accusation nobody made."],"html":["\u003cp>1.  Almost no facts. No date, no time, no list size, no description of what the email contained — so the office cannot assess the breach at all. The first bullet fails.\u003c/p>","\u003cp>2.  The email is largely about the writer’s feelings, which makes the reader the one providing comfort.\u003c/p>","\u003cp>3.  \"I hope the problem is solved now\" pre-empts the office’s judgement about whether it is, and \"I would never do something like this on purpose\" answers an accusation nobody made.\u003c/p>"]},"scenario":"\u003cp>You forwarded an email containing another student’s marks to a group list by mistake. Eleven people saw it. You have told the student already. The department needs to know.\u003c/p>","bullets":["Report what happened.","Say what you have already done.","Avoid both minimising and dramatising."],"header":[["To:","dataprotection@northgate.ac.uk"],["Subject:","Disclosure of a student record — self-report, 14 May"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The email is largely about the writer’s feelings, which makes the reader the one providing comfort.","correct":true},{"text":"Language: “the main responsible” (those mainly responsible); “the pollution of the rivers”, “the infrastructure”, “the government” over-articled; “the rivers are dying” is rhetoric standing in for the measurement the question needed.","correct":false},{"text":"“It is about fifty-fifty” commits the exact error under discussion — treating the trait as divisible into two shares.","correct":false},{"text":"Language. “the big companies are producing” (produce — a habitual fact), “they should be controlled by the governments” (over-articled), “the people should change” (people), and a long comma splice through “everybody should do their part, the governments should make laws”.","correct":false},{"text":"Almost no facts. No date, no time, no list size, no description of what the email contained — so the office cannot assess the breach at all. The first bullet fails.","correct":true},{"text":"“I hope the problem is solved now” pre-empts the office’s judgement about whether it is, and “I would never do something like this on purpose” answers an accusation nobody made.","correct":true}],"key_html":"F3"}};</script>
