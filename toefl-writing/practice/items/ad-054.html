<script>window.ITEM={"kind":"exercise","id":"AD 054","slug":"ad-054","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Economics · agree / disagree","payload":{"Strategy":"concede the mechanism and dispute its reach","Grammar":"inversion after negative adverbials","Vocabulary":"subsidy, incidence, pass-through, deadweight","Convention":"disputing scope rather than direction"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Ravi and Elin are not actually disagreeing about the same thing. What are their two different claims?\u003c/p>\u003cp>b.  The prompt separates \"widens access\" from \"benefits those who would have attended anyway\". Why does that distinction matter?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is the incidence of a subsidy, and what is pass-through?\u003c/p>\u003cp>b.  What does it mean to say a policy is inframarginal — that it pays for behaviour that would have happened anyway?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that concedes Ravi’s mechanism and limits it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response agrees with Ravi’s mechanism and still rejects his conclusion. How is that consistent?\u003c/p>\u003cp>b.  Why does the response put numbers on the argument rather than arguing in general terms?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Nowhere in a free tuition system does the fee removal reach that filter\" — identify the inversion and say what it is for.\u003c/p>\u003cp>b.  \"That is not an argument against the transfer, but it is an argument against calling it an access policy\" — what is this distinction doing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Ravi claims that removing the fee increases total participation. Elin claims it does not change the social composition of who participates. Both can be true at once, which is why neither refutes the other.\u003c/p>\u003cp>b.  Because a policy can raise the headline number while spending almost all of its money on people whose behaviour it did not change. \"Widens access\" and \"is good value\" are separate questions, and the prompt is asking the first while the critics are answering the second.\u003c/p>","P2":"\u003cp>a.  Incidence is who actually ends up better off; pass-through is how much of the subsidy reaches the intended party rather than being absorbed elsewhere — by rising fees, for example.\u003c/p>\u003cp>b.  It means the policy pays people who were already inside the decision. Only the marginal cases are bought by the policy; everyone else receives a transfer.\u003c/p>","P3":"\u003cp>Model: \"Free tuition widens access, but it buys one additional student for every nineteen it simply pays.\"\u003c/p>","F1":"\u003cp>a.  Because the mechanism is about deterrence at the margin and the conclusion is about the policy as a whole. Granting that cost deters some students is compatible with holding that the policy is a poor instrument for reaching them, and conceding the mechanism is what makes the limitation credible.\u003c/p>\u003cp>b.  Because the whole dispute turns on proportion. \"Some students are helped\" is true under any numbers; the argument only becomes an argument once you show that the ratio of transfer to leverage is nineteen to one. Illustrative figures make a structural point visible.\u003c/p>","F2":"\u003cp>a.  The negative adverbial \"nowhere\" fronts the clause and forces inversion: \"does the fee removal reach\". It puts the emphasis on the absence rather than on the subject, and it raises the register at the point where the response is landing its strongest structural claim.\u003c/p>\u003cp>b.  It separates two objections that are easy to conflate. The response is not saying the money is wasted — a transfer to students may be defensible — it is saying the policy is misdescribed. That is a narrower and far more defensible claim.\u003c/p>","F3":"\u003cp>1.  No engagement with Elin at all beyond restating her point and dismissing it with \"this is changing slowly and we should be patient\", which is not an answer.\u003c/p>\u003cp>2.  The argument is anecdotal and then declarative: personal experience followed by \"a human right in my opinion\", which converts an empirical question about access into an assertion that cannot be examined.\u003c/p>\u003cp>3.  \"Which is obviously good for society\" does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.\u003c/p>"},"model":["Free tuition does widen access, but by less than its cost implies, and Elin says why: it is paid overwhelmingly to students who were already going.","Ravi is right that cost deters, and the participation figures are real. What they do not show is who the extra students are. If a subsidy worth thirty thousand a student lifts participation by five points, the state is paying twenty students in order to recruit one. The other nineteen are inframarginal: the money is a transfer to them rather than a lever on anybody. That is not an argument against the transfer, but it is an argument against calling it an access policy.","Elin’s point about attainment at sixteen is stronger because it identifies where the selection happens. A student who leaves school without the grades to apply is not helped by a zero fee; they were filtered out four years earlier. Nowhere in a free tuition system does the fee removal reach that filter.","The policy should be judged against the alternative use of the same money. Thirty thousand per marginal student, spent on early-years provision or on teaching in the lowest attaining schools, would alter who is eligible to apply rather than who can afford to accept. That is the harder intervention and the one that widens access."],"model_html":"\u003cp>Free tuition does widen access, but by less than its cost implies, and Elin says why: it is paid overwhelmingly to students who were already going.\u003c/p>\u003cp>Ravi is right that cost deters, and the participation figures are real. What they do not show is who the extra students are. If a subsidy worth thirty thousand a student lifts participation by five points, the state is paying twenty students in order to recruit one. The other nineteen are inframarginal: the money is a transfer to them rather than a lever on anybody. That is not an argument against the transfer, but it is an argument against calling it an access policy.\u003c/p>\u003cp>Elin’s point about attainment at sixteen is stronger because it identifies where the selection happens. A student who leaves school without the grades to apply is not helped by a zero fee; they were filtered out four years earlier. Nowhere in a free tuition system does the fee removal reach that filter.\u003c/p>\u003cp>The policy should be judged against the alternative use of the same money. Thirty thousand per marginal student, spent on early-years provision or on teaching in the lowest attaining schools, would alter who is eligible to apply rather than who can afford to accept. That is the harder intervention and the one that widens access.\u003c/p>","model_band":5,"degraded":["I agree with Ravi because cost is really the main barrier for students and if university is free then more students can afford to go, which is obviously good for society. Elin says the students are still middle class but I think this is changing slowly and we should be patient. In my country tuition is very expensive and many of my friends could not continue their studies because of money, so I know how important this issue is. Free tuition is a human right in my opinion and governments should pay for it."],"degraded_html":"\u003cp>I agree with Ravi because cost is really the main barrier for students and if university is free then more students can afford to go, which is obviously good for society. Elin says the students are still middle class but I think this is changing slowly and we should be patient. In my country tuition is very expensive and many of my friends could not continue their studies because of money, so I know how important this issue is. Free tuition is a human right in my opinion and governments should pay for it.\u003c/p>","degraded_band":3,"model_words":218,"fault_list":{"tag":"F3","faults":["No engagement with Elin at all beyond restating her point and dismissing it with \"this is changing slowly and we should be patient\", which is not an answer.","The argument is anecdotal and then declarative: personal experience followed by \"a human right in my opinion\", which converts an empirical question about access into an assertion that cannot be examined.","\"Which is obviously good for society\" does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows."],"html":["\u003cp>1.  No engagement with Elin at all beyond restating her point and dismissing it with \"this is changing slowly and we should be patient\", which is not an answer.\u003c/p>","\u003cp>2.  The argument is anecdotal and then declarative: personal experience followed by \"a human right in my opinion\", which converts an empirical question about access into an assertion that cannot be examined.\u003c/p>","\u003cp>3.  \"Which is obviously good for society\" does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.\u003c/p>"]},"prof_name":"Dr Alvarez","professor":"\u003cp>Some governments subsidise university tuition so that students pay little or nothing. Supporters argue this widens access to higher education. Critics argue the benefit flows mainly to students who would have attended anyway, and that the money would do more good earlier in the education system. Does free tuition widen access?\u003c/p>","students":[["Ravi","It obviously does. Cost is the single biggest thing stopping people from going to university. Remove it and more people go. Countries with free tuition have higher participation rates than countries without."],["Elin","But who actually goes? In the countries Ravi is thinking of, the students are still overwhelmingly middle class. The barrier was never only the fee — it was school attainment at sixteen, which free tuition does nothing about."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Which is obviously good for society” does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.","correct":true},{"text":"Nobody is named, the number affected is “a few”, and no refund is offered — “if the people affected want to discuss compensation they can contact me” makes them ask. The third bullet fails.","correct":false},{"text":"The argument is anecdotal and then declarative: personal experience followed by “a human right in my opinion”, which converts an empirical question about access into an assertion that cannot be examined.","correct":true},{"text":"No engagement with Elin at all beyond restating her point and dismissing it with “this is changing slowly and we should be patient”, which is not an answer.","correct":true},{"text":"No applicant reference, “some family problems” discloses vaguely where nothing needed disclosing, and “I hope this will not be a problem” asks for reassurance rather than information.","correct":false},{"text":"It defends rather than concedes: “I was only trying to help”, “nobody was answering them”, “everything I wrote was completely true as you know” — all three answer a charge that was not made, and the authority question is never acknowledged.","correct":false}],"key_html":"F3"}};</script>
