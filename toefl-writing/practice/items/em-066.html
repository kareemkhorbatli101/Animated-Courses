<script>window.ITEM={"kind":"exercise","id":"EM 066","slug":"em-066","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Invitation","payload":{"Strategy":"invite by removing the thing that stopped them last time","Grammar":"conditional attendance","Vocabulary":"drop-in, come and go, no obligation, informal","Convention":"inviting someone who declined before"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Two refusals is information. What does a third invitation have to do differently?\u003c/p>\u003cp>b.  Why is \"we would really love to have you\" the wrong move here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \"come and go\" signal that \"attend\" does not?\u003c/p>\u003cp>b.  Distinguish a drop-in from a meeting.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Invite them in one sentence that changes the offer rather than repeating it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer gives a reason for inviting again. Why is that necessary after two refusals?\u003c/p>\u003cp>b.  \"I will not ask again unless you say you would like me to.\" What does this sentence cost and what does it buy?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"we mostly worked in silence with occasional swearing at question six\" — why this detail?\u003c/p>\u003cp>b.  \"not because I was keeping count\" — what anxiety is this answering?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It has to offer something different. Repeating an offer that has been declined twice asks the recipient to change rather than the offer, and it turns an invitation into pressure.\u003c/p>\u003cp>b.  Because it increases the cost of saying no. Warmth that makes refusal feel like a rejection of the person is the opposite of what a third invitation needs.\u003c/p>","P2":"\u003cp>a.  That arrival and departure are unremarkable and unmonitored, which removes the commitment that a start and end time implies.\u003c/p>\u003cp>b.  A meeting has a start, an agenda and an expectation of staying; a drop-in has a window and none of the rest.\u003c/p>","P3":"\u003cp>Model: \"We have changed how the study group runs — it is now the back corner of the library, two till whenever, with no agenda.\"\u003c/p>","F1":"\u003cp>a.  Because otherwise it reads as persistence, which is what makes repeated invitations uncomfortable. Naming the changed format explains why this is a new offer rather than the same one again, and it also quietly says the previous refusals were reasonable.\u003c/p>\u003cp>b.  It costs the possibility of asking a fourth time, which is a real concession. It buys the removal of all pressure from this one — and paradoxically makes acceptance more likely, because the invitation can now be considered on its merits rather than as a social obligation.\u003c/p>","F2":"\u003cp>a.  Because it shows rather than claims that the group is low pressure. \"Informal and relaxed\" is what every invitation says; four people working in silence is a picture, and it answers the specific fear that a quiet person would have to perform.\u003c/p>\u003cp>b.  That the writer has noticed and minded the refusals, and that accepting is therefore owed. Addressing it directly removes the obligation, which is the last thing standing between Jo and a free choice.\u003c/p>","F3":"\u003cp>1.  The offer is unchanged — same room, same four hours, same shared-notes format. The second bullet fails entirely, so the email gives Jo no new reason to answer differently.\u003c/p>\u003cp>2.  \"You missed out last term\" is a reproach dressed as encouragement, and it raises the cost of a third refusal rather than lowering it. The third bullet fails.\u003c/p>\u003cp>3.  \"Everyone shares their notes and we go through the problem sets together\" describes exactly the participatory format a reticent person would avoid, and nothing suggests they could come briefly or stay quiet.\u003c/p>"},"model":["Hi Jo,","We have changed how the study group runs this term and I thought of you, because the old version was four hours with a schedule and I suspect that was not anyone’s idea of a good Tuesday.","It is now just the back corner of the library, two till whenever, and people come for half an hour or three hours depending on what they have on. There is no agenda and nobody presents anything. Last week there were four of us and we mostly worked in silence with occasional swearing at question six.","Come for twenty minutes if you want to see what it is like, or do not — genuinely either is fine and I will not ask again unless you say you would like me to. I only mentioned it because the format changed, not because I was keeping count.","Dan"],"model_html":"\u003cp>Hi Jo,\u003c/p>\u003cp>We have changed how the study group runs this term and I thought of you, because the old version was four hours with a schedule and I suspect that was not anyone’s idea of a good Tuesday.\u003c/p>\u003cp>It is now just the back corner of the library, two till whenever, and people come for half an hour or three hours depending on what they have on. There is no agenda and nobody presents anything. Last week there were four of us and we mostly worked in silence with occasional swearing at question six.\u003c/p>\u003cp>Come for twenty minutes if you want to see what it is like, or do not — genuinely either is fine and I will not ask again unless you say you would like me to. I only mentioned it because the format changed, not because I was keeping count.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Jo, Just checking whether you want to come to the study group this term? We meet on Tuesdays from 2 to 6 in room 3.12 and it is really useful, everyone shares their notes and we go through the problem sets together. It would be great to have you, you missed out last term! Let me know if you are interested.","Dan"],"degraded_html":"\u003cp>Hi Jo, Just checking whether you want to come to the study group this term? We meet on Tuesdays from 2 to 6 in room 3.12 and it is really useful, everyone shares their notes and we go through the problem sets together. It would be great to have you, you missed out last term! Let me know if you are interested.\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":144,"fault_list":{"tag":"F3","faults":["The offer is unchanged — same room, same four hours, same shared-notes format. The second bullet fails entirely, so the email gives Jo no new reason to answer differently.","\"You missed out last term\" is a reproach dressed as encouragement, and it raises the cost of a third refusal rather than lowering it. The third bullet fails.","\"Everyone shares their notes and we go through the problem sets together\" describes exactly the participatory format a reticent person would avoid, and nothing suggests they could come briefly or stay quiet."],"html":["\u003cp>1.  The offer is unchanged — same room, same four hours, same shared-notes format. The second bullet fails entirely, so the email gives Jo no new reason to answer differently.\u003c/p>","\u003cp>2.  \"You missed out last term\" is a reproach dressed as encouragement, and it raises the cost of a third refusal rather than lowering it. The third bullet fails.\u003c/p>","\u003cp>3.  \"Everyone shares their notes and we go through the problem sets together\" describes exactly the participatory format a reticent person would avoid, and nothing suggests they could come briefly or stay quiet.\u003c/p>"]},"scenario":"\u003cp>You invited a quiet classmate to a study group twice last term and they declined both times. You suspect the format — four hours in a booked room with a schedule — is the obstacle rather than you.\u003c/p>","bullets":["Invite them again.","Change what you are offering.","Make a third refusal costless."],"header":[["To:","j.murray@northgate.ac.uk"],["Subject:","Study group — different shape this term"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language: a comma splice in the first sentence, “the governments”, “the construction companies”, “the housing crisis will be solved” — an unhedged absolute of exactly the kind this topic punishes.","correct":false},{"text":"“Everyone shares their notes and we go through the problem sets together” describes exactly the participatory format a reticent person would avoid, and nothing suggests they could come briefly or stay quiet.","correct":true},{"text":"The offer is unchanged — same room, same four hours, same shared-notes format. The second bullet fails entirely, so the email gives Jo no new reason to answer differently.","correct":true},{"text":"“You missed out last term” is a reproach dressed as encouragement, and it raises the cost of a third refusal rather than lowering it. The third bullet fails.","correct":true},{"text":"It dismisses Sami by relabelling his point (“gentrification ... a different problem”) rather than engaging it, and never addresses who bears the local cost.","correct":false},{"text":"It argues past Henrik rather than with him: he explicitly accepts return for documented loot, so “they were stolen” addresses a position nobody holds.","correct":false}],"key_html":"F3"}};</script>
