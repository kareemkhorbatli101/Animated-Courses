<script>window.ITEM={"kind":"exercise","id":"EM 040","slug":"em-040","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and resolution","payload":{"Strategy":"complain about the process rather than the outcome","Grammar":"passive for institutional agents","Vocabulary":"remit, grounds, upheld, procedural","Convention":"complaining where the decision itself cannot be appealed"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is complaining about the refusal itself a weaker move than complaining about the process?\u003c/p>\u003cp>b.  What can the office realistically give you here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for a complaint to be upheld, and what are grounds?\u003c/p>\u003cp>b.  Distinguish a substantive from a procedural objection.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in one sentence that concedes the decision and names the real complaint.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The first paragraph gives away the right to contest the decision. What does that buy?\u003c/p>\u003cp>b.  The request has two parts, and the second is conditional. Why structure it that way?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the decision was issued six weeks after the fifteen working days the guidance promises\" — why the passive?\u003c/p>\u003cp>b.  \"only for the one I was given to be explained\" — why end here?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the decision is a judgement the office is entitled to make and you have no standing to overturn, while the process has written rules that were demonstrably broken. One is arguable; the other is checkable.\u003c/p>\u003cp>b.  Reasons, confirmation of what was on the file, and reconsideration if documents were missing. It cannot give you the grant, so asking for it wastes the email.\u003c/p>","P2":"\u003cp>a.  A complaint is upheld when the body accepts it was justified; grounds are the specific basis on which it is brought.\u003c/p>\u003cp>b.  A substantive objection says the decision was wrong; a procedural one says it was reached improperly. The second is available here and the first is not.\u003c/p>","P3":"\u003cp>Model: \"I am not contesting the refusal, which may well be right — I am writing about how it was handled.\"\u003c/p>","F1":"\u003cp>a.  Credibility and a narrower target. Once the writer is visibly not trying to overturn the outcome, the office has no reason to defend the outcome, and the procedural failures stand alone with nothing to deflect them.\u003c/p>\u003cp>b.  Because the reconsideration is only justified if the documents were missing, and asking for it unconditionally would look like contesting the decision after all. The condition makes the request follow from the facts rather than from the writer’s preference.\u003c/p>","F2":"\u003cp>a.  Because the agent is the institution and naming an individual would turn a procedural complaint into an accusation. The passive keeps the failure attached to the process, which is where the writer wants it.\u003c/p>\u003cp>b.  It restates the limit of the request in the last line, so the reader finishes the email knowing the writer wants an explanation rather than a reversal. That is what makes a reply cheap to send.\u003c/p>","F3":"\u003cp>1.  It contests the decision (\"extremely unfair\") and then compares itself to other students, which the office cannot discuss and which invites a flat refusal.\u003c/p>\u003cp>2.  The delay is mentioned only as a cause of stress, not as a breach of the fifteen-day guidance, so the one checkable failure is wasted. The second bullet fails.\u003c/p>\u003cp>3.  \"Reconsider my application urgently\" asks for the one thing the office has already refused, with no new basis, so the third bullet fails too.\u003c/p>"},"model":["Dear Student Funding Team,","I am not writing to contest the refusal of my hardship application, which may well be right. I am writing about how it was handled.","Two things went wrong. The letter I received on 2 May states only that the application \"did not meet the threshold\", without saying which threshold or what evidence was taken into account — so I cannot tell whether my bank statements were received at all. And the decision was issued six weeks after the fifteen working days the guidance promises, during which I was told twice that it was still with the panel.","What I would like is the reasons in a form I can read: which criterion was not met, and whether the documents I sent on 14 March were before the panel. If they were not, I would ask for the application to be reconsidered on the full file.","I understand the volume the office is dealing with and I am not asking for a different answer — only for the one I was given to be explained.","Yours sincerely,","Idris Kamara — 2201477"],"model_html":"\u003cp>Dear Student Funding Team,\u003c/p>\u003cp>I am not writing to contest the refusal of my hardship application, which may well be right. I am writing about how it was handled.\u003c/p>\u003cp>Two things went wrong. The letter I received on 2 May states only that the application \"did not meet the threshold\", without saying which threshold or what evidence was taken into account — so I cannot tell whether my bank statements were received at all. And the decision was issued six weeks after the fifteen working days the guidance promises, during which I was told twice that it was still with the panel.\u003c/p>\u003cp>What I would like is the reasons in a form I can read: which criterion was not met, and whether the documents I sent on 14 March were before the panel. If they were not, I would ask for the application to be reconsidered on the full file.\u003c/p>\u003cp>I understand the volume the office is dealing with and I am not asking for a different answer — only for the one I was given to be explained.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Idris Kamara — 2201477\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I am writing to complain about the refusal of my hardship application which I think is extremely unfair. I am in a very difficult financial situation and I do not understand how the panel could reject me when other students I know with similar circumstances received the grant. Also the decision took much longer than it was supposed to which caused me a lot of stress and anxiety. I would like you to reconsider my application urgently as I am struggling to pay my rent.","Idris"],"degraded_html":"\u003cp>Dear Sir/Madam, I am writing to complain about the refusal of my hardship application which I think is extremely unfair. I am in a very difficult financial situation and I do not understand how the panel could reject me when other students I know with similar circumstances received the grant. Also the decision took much longer than it was supposed to which caused me a lot of stress and anxiety. I would like you to reconsider my application urgently as I am struggling to pay my rent.\u003c/p>\u003cp>Idris\u003c/p>","degraded_band":3,"model_words":182,"fault_list":{"tag":"F3","faults":["It contests the decision (\"extremely unfair\") and then compares itself to other students, which the office cannot discuss and which invites a flat refusal.","The delay is mentioned only as a cause of stress, not as a breach of the fifteen-day guidance, so the one checkable failure is wasted. The second bullet fails.","\"Reconsider my application urgently\" asks for the one thing the office has already refused, with no new basis, so the third bullet fails too."],"html":["\u003cp>1.  It contests the decision (\"extremely unfair\") and then compares itself to other students, which the office cannot discuss and which invites a flat refusal.\u003c/p>","\u003cp>2.  The delay is mentioned only as a cause of stress, not as a breach of the fifteen-day guidance, so the one checkable failure is wasted. The second bullet fails.\u003c/p>","\u003cp>3.  \"Reconsider my application urgently\" asks for the one thing the office has already refused, with no new basis, so the third bullet fails too.\u003c/p>"]},"scenario":"\u003cp>You applied for a hardship grant and were refused. You accept the decision may be correct, but you were never told what evidence was considered, and the refusal arrived six weeks after the deadline it promised.\u003c/p>","bullets":["Say what went wrong.","Separate the decision from how it was made.","Ask for something that can actually be given."],"header":[["To:","studentfunding@northgate.ac.uk"],["Subject:","Hardship application 44021 — process, not outcome"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“In my country people still have very strong family and neighbour relationships” is a single observation set against population-level evidence, and no test or indicator is proposed anywhere.","correct":false},{"text":"It contests the decision (“extremely unfair”) and then compares itself to other students, which the office cannot discuss and which invites a flat refusal.","correct":true},{"text":"Language: “the justice becomes like a machine without humanity” is rhetoric rather than argument; “dangerous for the society”, “the automatic sentences”, “all the cases” are all over-articled.","correct":false},{"text":"“Companies do not care about their employees, so they will never choose better objectives” changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.","correct":false},{"text":"“Reconsider my application urgently” asks for the one thing the office has already refused, with no new basis, so the third bullet fails too.","correct":true},{"text":"The delay is mentioned only as a cause of stress, not as a breach of the fifteen-day guidance, so the one checkable failure is wasted. The second bullet fails.","correct":true}],"key_html":"F3"}};</script>
