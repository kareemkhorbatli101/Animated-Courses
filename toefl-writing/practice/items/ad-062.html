<script>window.ITEM={"kind":"exercise","id":"AD 062","slug":"ad-062","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Computer science · policy choice","payload":{"Strategy":"choose by asking who bears the cost of being wrong","Grammar":"conditional perfect","Vocabulary":"false positive, threshold, audit, appeal","Convention":"choosing where to set a decision threshold"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both speakers agree the tool errs. What do they disagree about?\u003c/p>\u003cp>b.  Why does the existence of an appeal process change the calculation?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a false positive, and what is a threshold?\u003c/p>\u003cp>b.  What does it mean to audit a decision process?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names who pays for each kind of error.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reframes the question rather than answering it as posed. Is that legitimate?\u003c/p>\u003cp>b.  Why does the final paragraph choose a low threshold when the second paragraph sided with Marta?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had the two errors been symmetrical, Tom’s argument would carry\" — identify the structure and say what it concedes.\u003c/p>\u003cp>b.  \"The expensive thing is the accusation, not the detection\" — why state it this way?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Which error is worse, and therefore which way the tool should be biased. Marta weighs concentrated harm to individuals; Tom weighs diffuse harm to the cohort.\u003c/p>\u003cp>b.  Because an appeal converts some false positives into corrected decisions, which lowers the cost of flagging — though not to zero, since the investigation itself is part of the harm.\u003c/p>","P2":"\u003cp>a.  A false positive is a flag raised where there was no misconduct; the threshold is the score above which the system raises one.\u003c/p>\u003cp>b.  To check a sample of its decisions independently, which is how you discover what the error rates actually are rather than what the vendor claims.\u003c/p>","P3":"\u003cp>Model: \"A false positive is paid for by one identifiable student and a miss by everybody slightly, so the threshold should protect the individual — and the flag should not be an accusation.\"\u003c/p>","F1":"\u003cp>a.  Yes, because the dilemma as posed assumes the flag and the accusation are the same event, and that assumption is a design choice rather than a fact. Attacking a false premise is stronger than choosing between the options it forces.\u003c/p>\u003cp>b.  Because the reason for siding with Marta was the cost of false accusations, and once a human filter sits between the flag and the accusation that cost falls sharply. The threshold can then be low without producing the harm she was protecting against.\u003c/p>","F2":"\u003cp>a.  An inverted conditional perfect. It concedes that Tom’s reasoning is valid and locates the disagreement in a premise — the symmetry of the two errors — which is a far more respectful and more damaging objection than denying his conclusion.\u003c/p>\u003cp>b.  Because it isolates which step in the process creates the harm. Framed that way, the design fix is obvious, whereas \"we should be careful with accusations\" would leave the reader with a sentiment rather than a mechanism.\u003c/p>","F3":"\u003cp>1.  \"Most students are honest so there is not much cheating to detect\" is an empirical claim with no support, and it denies Tom’s premise instead of weighing it.\u003c/p>\u003cp>2.  The justice principle is asserted as though the case were a criminal trial, without addressing Tom’s point that the diffuse harm also falls on innocent people.\u003c/p>\u003cp>3.  Nothing about design, appeal, human review or audit — the response accepts the dilemma exactly as posed and so cannot get beyond picking a side.\u003c/p>"},"model":["Marta is right about where the threshold should sit, but Tom has identified the cost she is asking honest students to absorb, and the answer is to stop treating the threshold as the only variable.","The asymmetry Marta describes is real. A flagged student faces an investigation, a delayed result and a file entry, and that happens whether or not the flag was sound; the cost of a miss falls on nobody in particular. Had the two errors been symmetrical, Tom’s argument would carry, but they are not, and the burden of proof belongs where the harm is concentrated.","What Tom’s objection should buy is not a lower threshold but a different design. A flag that triggers an automatic accusation forces the trade-off he describes; a flag that triggers a human reading of the script does not, because the second filter catches the false positives before they cost anybody anything.","So: set the threshold low enough to catch most misconduct, and make the flag an instruction to a human rather than a charge. The expensive thing is the accusation, not the detection, and once those are separated the dilemma mostly dissolves."],"model_html":"\u003cp>Marta is right about where the threshold should sit, but Tom has identified the cost she is asking honest students to absorb, and the answer is to stop treating the threshold as the only variable.\u003c/p>\u003cp>The asymmetry Marta describes is real. A flagged student faces an investigation, a delayed result and a file entry, and that happens whether or not the flag was sound; the cost of a miss falls on nobody in particular. Had the two errors been symmetrical, Tom’s argument would carry, but they are not, and the burden of proof belongs where the harm is concentrated.\u003c/p>\u003cp>What Tom’s objection should buy is not a lower threshold but a different design. A flag that triggers an automatic accusation forces the trade-off he describes; a flag that triggers a human reading of the script does not, because the second filter catches the false positives before they cost anybody anything.\u003c/p>\u003cp>So: set the threshold low enough to catch most misconduct, and make the flag an instruction to a human rather than a charge. The expensive thing is the accusation, not the detection, and once those are separated the dilemma mostly dissolves.\u003c/p>","model_band":5,"degraded":["I agree with Marta that it is better to set the threshold high because accusing an innocent student of cheating is a terrible thing that can ruin their reputation and their future. It is a basic principle of justice that it is better to let a guilty person go free than to punish an innocent one. Tom says honest students suffer from devalued degrees but I think this is a much smaller problem and anyway most students are honest so there is not much cheating to detect in the first place."],"degraded_html":"\u003cp>I agree with Marta that it is better to set the threshold high because accusing an innocent student of cheating is a terrible thing that can ruin their reputation and their future. It is a basic principle of justice that it is better to let a guilty person go free than to punish an innocent one. Tom says honest students suffer from devalued degrees but I think this is a much smaller problem and anyway most students are honest so there is not much cheating to detect in the first place.\u003c/p>","degraded_band":3,"model_words":192,"fault_list":{"tag":"F3","faults":["\"Most students are honest so there is not much cheating to detect\" is an empirical claim with no support, and it denies Tom’s premise instead of weighing it.","The justice principle is asserted as though the case were a criminal trial, without addressing Tom’s point that the diffuse harm also falls on innocent people.","Nothing about design, appeal, human review or audit — the response accepts the dilemma exactly as posed and so cannot get beyond picking a side."],"html":["\u003cp>1.  \"Most students are honest so there is not much cheating to detect\" is an empirical claim with no support, and it denies Tom’s premise instead of weighing it.\u003c/p>","\u003cp>2.  The justice principle is asserted as though the case were a criminal trial, without addressing Tom’s point that the diffuse harm also falls on innocent people.\u003c/p>","\u003cp>3.  Nothing about design, appeal, human review or audit — the response accepts the dilemma exactly as posed and so cannot get beyond picking a side.\u003c/p>"]},"prof_name":"Professor Zhou","professor":"\u003cp>A university is deploying software to flag possible plagiarism. It can be tuned to flag more cases, catching nearly all misconduct but generating many false accusations, or fewer, missing some but rarely accusing the innocent. Where should the threshold sit?\u003c/p>","students":[["Marta","Set it high — flag few. A false accusation of cheating follows a student for years even when it is withdrawn, and the harm is not symmetrical with letting someone get away with it."],["Tom","If the tool misses most cheating, honest students pay for it in devalued degrees and in the knowledge that the rules are unenforced. Under-detection is a harm too, just a diffuse one."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Nothing about design, appeal, human review or audit — the response accepts the dilemma exactly as posed and so cannot get beyond picking a side.","correct":true},{"text":"The reason is both vague and over-shared. “some personal problems which I cannot explain here” gestures at something private without naming its shape, which invites more curiosity than a plain statement would. “I think also for most of the students” then recruits imaginary allies, which is presumptuous.","correct":false},{"text":"“Most students are honest so there is not much cheating to detect” is an empirical claim with no support, and it denies Tom’s premise instead of weighing it.","correct":true},{"text":"The justice principle is asserted as though the case were a criminal trial, without addressing Tom’s point that the diffuse harm also falls on innocent people.","correct":true},{"text":"“This will cause serious problems for me” transfers the consequence to the reader, and “urgently” plus “as soon as possible” instructs a supervisor on timing.","correct":false},{"text":"“I am sorry you were upset” apologises for her reaction rather than for the act, which is the standard non-apology.","correct":false}],"key_html":"F3"}};</script>
