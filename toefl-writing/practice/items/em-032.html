<script>window.ITEM={"kind":"exercise","id":"EM 032","slug":"em-032","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"refuse the role, not the relationship","Grammar":"regret + infinitive","Vocabulary":"take on, capacity, bandwidth, in fairness to","Convention":"declining a request from someone you want to keep as a contact"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  What is the risk of saying yes badly, compared with saying no well?\u003c/p>\u003cp>b.  Why must the reason be about capacity rather than interest?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \"in fairness to\" do at the start of a clause?\u003c/p>\u003cp>b.  Distinguish \"I cannot take this on\" from \"I do not want to take this on\".\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline in one sentence that makes clear you would say yes in other circumstances.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer argues that refusing is better for the students. Is that a real argument or a polite fiction?\u003c/p>\u003cp>b.  Two offers are made. What is the difference in kind between them?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I am sorry to say I do not think I can\" — count the hedges and say whether this is too many.\u003c/p>\u003cp>b.  \"which is a fixed commitment I can plan around\" — what does this clause reassure the reader about?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Saying yes badly costs you the relationship over several months and damages two students on the way. Saying no well costs one email. The asymmetry is large and most people get it backwards.\u003c/p>\u003cp>b.  Because willingness is a judgement on the request and capacity is a fact about your week. A reason framed as capacity leaves the relationship untouched and makes a future yes natural.\u003c/p>","P2":"\u003cp>a.  It attributes your refusal to the interests of a third party, which removes the suggestion that you are protecting yourself. It only works if the claim is true.\u003c/p>\u003cp>b.  The first is about the world and is hard to argue with; the second is about your preferences and invites persuasion. Say the first when the first is true.\u003c/p>","P3":"\u003cp>Model: \"I am sorry to say I do not think I can take it on this term.\" The words \"this term\" do the work — they decline the instance while leaving the role open.\u003c/p>","F1":"\u003cp>a.  Real, and it is the strongest card in the email. A mentor who cancels is worse than no mentor, and a supervisor allocating students knows it. The argument is persuasive precisely because it is about the programme rather than about the writer.\u003c/p>\u003cp>b.  One is smaller in scope (a single session rather than a term); the other is later in time (January rather than now). Offering both lets the reader solve the problem either by shrinking the ask or by deferring it.\u003c/p>","F2":"\u003cp>a.  Three: \"I am sorry to say\", \"I do not think\", and \"can\". That is on the edge but defensible here, because the writer is refusing a senior person who did them a favour by asking. In a message to a peer it would be one hedge too many.\u003c/p>\u003cp>b.  That the writer has thought about why the main commitment fails and this one does not. Mentoring is open-ended and therefore unplannable; a single fixed session is not. It proves the refusal is about structure rather than enthusiasm.\u003c/p>","F3":"\u003cp>1.  No counter-offer. The third bullet is entirely unmet, so the email is a plain refusal with courtesies attached.\u003c/p>\u003cp>2.  The reason is generic. \"Extremely busy this term\" is what everybody says; nothing establishes that the writer has weighed the commitment seriously, so the refusal reads as reluctance.\u003c/p>\u003cp>3.  \"I hope you will ask me again another time\" asks the reader to do the future work of maintaining the relationship, and \"Thank you for your understanding\" thanks them in advance for accepting.\u003c/p>"},"model":["Dear Dr Olsen,","Thank you for thinking of me for the first-year mentoring — I am sorry to say I do not think I can take it on this term.","I am working twenty hours a week at the moment alongside a full module load, and in fairness to the students I would rather not agree to something I could only do half of. Two mentees who get a cancelled meeting every fortnight are worse off than two who were matched with somebody else.","If it would still be useful, I would be glad to do the single induction session in week two, which is a fixed commitment I can plan around, or to be on the list again from January when my hours drop. I would like to do this properly at some point.","With best wishes,","Rohan Mistry"],"model_html":"\u003cp>Dear Dr Olsen,\u003c/p>\u003cp>Thank you for thinking of me for the first-year mentoring — I am sorry to say I do not think I can take it on this term.\u003c/p>\u003cp>I am working twenty hours a week at the moment alongside a full module load, and in fairness to the students I would rather not agree to something I could only do half of. Two mentees who get a cancelled meeting every fortnight are worse off than two who were matched with somebody else.\u003c/p>\u003cp>If it would still be useful, I would be glad to do the single induction session in week two, which is a fixed commitment I can plan around, or to be on the list again from January when my hours drop. I would like to do this properly at some point.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Rohan Mistry\u003c/p>","model_band":5,"degraded":["Dear Dr Olsen, Thank you very much for your email. Unfortunately I am extremely busy this term with my job and my modules so I am afraid I cannot help you with the mentoring. I am very sorry about this and I hope you will ask me again another time. Thank you for your understanding.","Rohan"],"degraded_html":"\u003cp>Dear Dr Olsen, Thank you very much for your email. Unfortunately I am extremely busy this term with my job and my modules so I am afraid I cannot help you with the mentoring. I am very sorry about this and I hope you will ask me again another time. Thank you for your understanding.\u003c/p>\u003cp>Rohan\u003c/p>","degraded_band":3,"model_words":140,"fault_list":{"tag":"F3","faults":["No counter-offer. The third bullet is entirely unmet, so the email is a plain refusal with courtesies attached.","The reason is generic. \"Extremely busy this term\" is what everybody says; nothing establishes that the writer has weighed the commitment seriously, so the refusal reads as reluctance.","\"I hope you will ask me again another time\" asks the reader to do the future work of maintaining the relationship, and \"Thank you for your understanding\" thanks them in advance for accepting."],"html":["\u003cp>1.  No counter-offer. The third bullet is entirely unmet, so the email is a plain refusal with courtesies attached.\u003c/p>","\u003cp>2.  The reason is generic. \"Extremely busy this term\" is what everybody says; nothing establishes that the writer has weighed the commitment seriously, so the refusal reads as reluctance.\u003c/p>","\u003cp>3.  \"I hope you will ask me again another time\" asks the reader to do the future work of maintaining the relationship, and \"Thank you for your understanding\" thanks them in advance for accepting.\u003c/p>"]},"scenario":"\u003cp>A lecturer who supervised you has asked you to mentor two first-year students this term. You are working twenty hours a week alongside your course and cannot do it properly.\u003c/p>","bullets":["Decline.","Give a reason that is about capacity, not willingness.","Offer something smaller that you can actually sustain."],"header":[["To:","p.olsen@northgate.ac.uk"],["Subject:","First-year mentoring — I am afraid I cannot this term"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“I hope you will ask me again another time” asks the reader to do the future work of maintaining the relationship, and “Thank you for your understanding” thanks them in advance for accepting.","correct":true},{"text":"“The amounts are tiny compared to military budgets” answers the comparison with a different comparison, which does not establish that this spending beats a hospital.","correct":false},{"text":"It argues from principle, not mechanism. “Health is a human right” is a claim about what ought to be free, which does not address whether this particular charge helps or harms. It also simply repeats Tom’s position with more feeling.","correct":false},{"text":"No counter-offer. The third bullet is entirely unmet, so the email is a plain refusal with courtesies attached.","correct":true},{"text":"The reason is generic. “Extremely busy this term” is what everybody says; nothing establishes that the writer has weighed the commitment seriously, so the refusal reads as reluctance.","correct":true},{"text":"“Human life cannot be measured in money” is asserted and then immediately contradicted by the request that governments “find the money”, which is a measurement.","correct":false}],"key_html":"F3"}};</script>
