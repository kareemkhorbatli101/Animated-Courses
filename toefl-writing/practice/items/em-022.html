<script>window.ITEM={"kind":"exercise","id":"EM 022","slug":"em-022","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"apologise for the effect on them, not for your feelings about it","Grammar":"the unreal past for regret","Vocabulary":"cover, shift, leave in the lurch, short-staffed","Convention":"apologising to people who absorbed the cost"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Who absorbed the cost of your absence, and does your email reach them?\u003c/p>\u003cp>b.  The mistake is entirely yours and entirely trivial. Does that make the apology easier or harder?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to \u003cem>leave someone in the lurch\u003c/em>?\u003c/p>\u003cp>b.  To \u003cem>cover\u003c/em> a shift — who does it, and what is the noun?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Apologise in one sentence that mentions what happened to them, not how you feel.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Find the sentence that shows the writer understands the consequence, and say why it is worth more than another apology.\u003c/p>\u003cp>b.  The repair has two parts. Which one costs the writer more, and why is it the one that matters?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “I wish I had realised in time”. What form is this, and what does it express that \u003cem>I am sorry\u003c/em> does not?\u003c/p>\u003cp>b.  Why \u003cem>I gather\u003c/em> rather than \u003cem>I heard\u003c/em> or \u003cem>I know\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The volunteers who stayed and the people in the queue. Your email reaches the coordinator, so it has to acknowledge a cost that fell on people who will never read it — which is why naming the queue matters.\u003c/p>\u003cp>b.  Harder. There is no mitigating circumstance to lean on, so the whole weight falls on the quality of the apology and the repair. A trivial cause demands a better apology, not a smaller one.\u003c/p>","P2":"\u003cp>a.  To abandon them at a moment when they were relying on you and cannot easily recover — the emphasis is on their exposure, not your absence.\u003c/p>\u003cp>b.  Another volunteer \u003cstrong>covers\u003c/strong> it; the noun is \u003cstrong>cover\u003c/strong> (“we had no cover”). Note it is uncountable in that sense.\u003c/p>","P3":"\u003cp>Model: \u003cem>I gather it meant the morning ran two short, and I know what that does to the queue.\u003c/em>\u003c/p>\u003cp>The subject is the session and the queue. Nothing is said about how the writer feels, and it is far more convincing for that.\u003c/p>","F1":"\u003cp>a.  “I know what that does to the queue.” It proves the writer has thought about the consequence rather than the transgression. Apologies fail when they are about the apologiser; this one is about the Saturday morning.\u003c/p>\u003cp>b.  The standby list. Two shifts is a one-off repayment; putting your name down for the rest of term is an ongoing liability, and it addresses the organisation’s real problem, which is not your Saturday but their thin cover.\u003c/p>","F2":"\u003cp>a.  \u003cem>Wish\u003c/em> + past perfect — the unreal past, used for regret about something that cannot now be changed. It expresses counterfactual responsibility: not merely that you are sorry, but that there was a version of events in which you acted and did not.\u003c/p>\u003cp>b.  \u003cem>I gather\u003c/em> reports what you have pieced together without claiming to have been told officially, and without the slight presumption of \u003cem>I know\u003c/em>, which would imply you can judge the scale of a problem you were absent from.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It is about the writer’s feelings.\u003c/strong> “I feel terrible”, “thinking about it all weekend”, “really stupid of me”. The reader ends up reassuring the person who let them down.\u003c/p>\u003cp>2.  \u003cstrong>The repair is empty.\u003c/strong> “Let me know if there is anything I can do” puts the work of devising the remedy onto the coordinator. No shift is offered and no date named, so the third bullet fails.\u003c/p>\u003cp>3.  \u003cstrong>It minimises the harm.\u003c/strong> “I hope it was not too much of a problem” and “you managed okay without me” invite the reader to say it was fine, which is the opposite of taking responsibility. There is also a comma splice in the opening sentence.\u003c/p>"},"model":["Dear Marcus,","I am very sorry about Saturday. I had the shift down for this coming weekend rather than last, which is entirely my error — I should have checked the rota rather than my own calendar.","I gather it meant the morning ran two short, and I know what that does to the queue. I wish I had realised in time to find a replacement.","I am free this Saturday and next, and happy to take the early setup as well as the session if that is useful. If it would help, I am also glad to be put on the standby list for the rest of the term, so there is at least one extra name to call.","Sorry again — it will not happen twice.","Best wishes,","Leyla Demir"],"model_html":"\u003cp>Dear Marcus,\u003c/p>\u003cp>I am very sorry about Saturday. I had the shift down for this coming weekend rather than last, which is entirely my error — I should have checked the rota rather than my own calendar.\u003c/p>\u003cp>I gather it meant the morning ran two short, and I know what that does to the queue. I wish I had realised in time to find a replacement.\u003c/p>\u003cp>I am free this Saturday and next, and happy to take the early setup as well as the session if that is useful. If it would help, I am also glad to be put on the standby list for the rest of the term, so there is at least one extra name to call.\u003c/p>\u003cp>Sorry again — it will not happen twice.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Leyla Demir\u003c/p>","model_band":5,"degraded":["Hi, I am so sorry about Saturday, I feel terrible about it and I have been thinking about it all weekend. I had written the wrong date in my calendar which was really stupid of me. I hope it was not too much of a problem for you and that you managed okay without me. Please let me know if there is anything I can do. Sorry again!","Leyla"],"degraded_html":"\u003cp>Hi, I am so sorry about Saturday, I feel terrible about it and I have been thinking about it all weekend. I had written the wrong date in my calendar which was really stupid of me. I hope it was not too much of a problem for you and that you managed okay without me. Please let me know if there is anything I can do. Sorry again!\u003c/p>\u003cp>Leyla\u003c/p>","degraded_band":3,"model_words":130,"fault_list":{"tag":"F3","faults":["It is about the writer’s feelings. “I feel terrible”, “thinking about it all weekend”, “really stupid of me”. The reader ends up reassuring the person who let them down.","The repair is empty. “Let me know if there is anything I can do” puts the work of devising the remedy onto the coordinator. No shift is offered and no date named, so the third bullet fails.","It minimises the harm. “I hope it was not too much of a problem” and “you managed okay without me” invite the reader to say it was fine, which is the opposite of taking responsibility. There is also a comma splice in the opening sentence."],"html":["\u003cp>1.  \u003cstrong>It is about the writer’s feelings.\u003c/strong> “I feel terrible”, “thinking about it all weekend”, “really stupid of me”. The reader ends up reassuring the person who let them down.\u003c/p>","\u003cp>2.  \u003cstrong>The repair is empty.\u003c/strong> “Let me know if there is anything I can do” puts the work of devising the remedy onto the coordinator. No shift is offered and no date named, so the third bullet fails.\u003c/p>","\u003cp>3.  \u003cstrong>It minimises the harm.\u003c/strong> “I hope it was not too much of a problem” and “you managed okay without me” invite the reader to say it was fine, which is the opposite of taking responsibility. There is also a comma splice in the opening sentence.\u003c/p>"]},"scenario":"\u003cp>You failed to turn up for a volunteering shift at a food bank. You had written it in your calendar for the following week by mistake. They ran the session two people short.\u003c/p>","bullets":["Apologise.","Explain without excusing.","Offer something that actually helps."],"header":[["To:","volunteers@riversidefoodbank.org"],["Subject:","Saturday’s shift — my apologies"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It minimises the harm. “I hope it was not too much of a problem” and “you managed okay without me” invite the reader to say it was fine, which is the opposite of taking responsibility. There is also a comma splice in the opening sentence.","correct":true},{"text":"“A theory that cannot be tested is not really scientific” restates the criterion under challenge, and there is a comma splice in the first sentence.","correct":false},{"text":"“Basic economics” and “the law of supply and demand” are invoked as though they settle an empirical question about magnitudes and distribution, which they do not.","correct":false},{"text":"The repair is empty. “Let me know if there is anything I can do” puts the work of devising the remedy onto the coordinator. No shift is offered and no date named, so the third bullet fails.","correct":true},{"text":"It is about the writer’s feelings. “I feel terrible”, “thinking about it all weekend”, “really stupid of me”. The reader ends up reassuring the person who let them down.","correct":true},{"text":"Diego’s argument about the chain is never engaged; “the media always exaggerate” is a cruder version of it attributed to bad motive rather than structure.","correct":false}],"key_html":"F3"}};</script>
