<script>window.ITEM={"kind":"exercise","id":"EM 011","slug":"em-011","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy · anchor item","payload":{"Strategy":"complain about the fault, ask for the remedy, never prosecute the reader","Grammar":"the agentless passive; the perfect modal of reproach","Vocabulary":"faults and repairs: intermittent, report, log, attend to","Convention":"a complaint that names a remedy is twice as likely to get one"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are annoyed. Which of the three bullets is the one where that will leak out, and what will it cost you?\u003c/p>\u003cp>b.  The second bullet looks like background. Argue that it is actually the strongest part of your case.\u003c/p>\u003cp>c.  What is the difference between “please fix the heating” and a remedy?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which word describes a fault that comes and goes?\u003c/p>\u003cpre class=\"mono\">constant · intermittent · occasional · permanent\u003c/pre>\u003cp>b.  Match: to ______ a fault (first time) · to ______ a call · to ______ to a problem · to ______ a job.\u003c/p>\u003cpre class=\"mono\">attend · report · log · complete\u003c/pre>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Say that nobody came, without saying that anybody failed. One sentence.\u003c/p>"},{"tag":"P4","title":"Commit to a plan","html":"\u003cp>Seven minutes, the whole email. Decide in advance what you will ask for: a visit, a date, a temporary heater, or a reason. Only one of these is hard to refuse.\u003c/p>"},{"tag":"P5","title":"Predict the pitfall","html":"\u003cp>Which sentence belongs in a band-5 complaint?\u003c/p>\u003cpre class=\"mono\">(A) This is completely unacceptable and I have had enough.\n(B) I appreciate the department is busy, but three weeks\n    seems a long time for a heating fault in February.\n(C) If nobody comes this week I will be contacting the\n    Students’ Union.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Give each paragraph a one-word job.\u003c/p>\u003cp>b.  The email contains two reference numbers and a temperature. What do these do that adjectives could not?\u003c/p>\u003cp>c.  Find the only sentence that could be read as criticism. How has it been defused?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “As far as I know nobody has been able to look at it yet.” Rewrite as a plain accusation. Then list what the original has added: there are three separate softeners.\u003c/p>\u003cp>b.  “The heating \u003cem>has been failing\u003c/em> since the end of January.” Why this form and not \u003cem>failed\u003c/em> or \u003cem>is failing\u003c/em>?\u003c/p>\u003cp>c.  “or failing that, to borrow a portable heater” — what is the subject of \u003cem>to borrow\u003c/em>, and why is the ambiguity harmless here?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>logged the fault\u003c/em> rather than \u003cem>complained\u003c/em> or \u003cem>told you\u003c/em>?\u003c/p>\u003cp>b.  \u003cem>attend\u003c/em> is used here without an object. What does it mean in this register, and where else would you meet it?\u003c/p>\u003cp>c.  Why \u003cem>it is difficult to work in\u003c/em> rather than \u003cem>it is freezing\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>The hot water in your shared kitchen has not worked for ten days and two reports have gone unanswered. In 60 words write the middle of the email: the history, and a request that offers the office an easy way to say yes.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The second. Describing what you did and what did not happen is where the sentence “and nobody bothered to come” writes itself. It costs you the social-conventions mark, which is explicit in the descriptor for this task.\u003c/p>\u003cp>b.  Because it converts your complaint from a feeling into a record. Two dates and two reference numbers are facts the office can check against its own system, and they establish that the delay is theirs without you having to say so.\u003c/p>\u003cp>c.  A remedy is a specific, achievable action with a time attached. “Fix the heating” names an outcome the reader may not control this week; “someone to attend in the next few days, or a portable heater” names two things they can actually authorise today.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Intermittent\u003c/strong> — the technical word, and the one that tells a maintenance team something useful. \u003cem>Occasional\u003c/em> describes frequency but not the on-off pattern.\u003c/p>\u003cp>b.  to \u003cstrong>report\u003c/strong> a fault · to \u003cstrong>log\u003c/strong> a call · to \u003cstrong>attend\u003c/strong> to a problem · to \u003cstrong>complete\u003c/strong> a job.\u003c/p>","P3":"\u003cp>Model: \u003cem>As far as I know nobody has been able to look at it yet.\u003c/em>\u003c/p>\u003cp>Three devices in eleven words: \u003cem>as far as I know\u003c/em> limits the claim to your own knowledge, \u003cem>has been able to\u003c/em> attributes the gap to capacity rather than will, and \u003cem>yet\u003c/em> presupposes it is still going to happen.\u003c/p>","P4":"\u003cp>The portable heater. A visit requires a technician who may not be free; a date commits the office to something it may miss; a reason invites a defensive reply. A loan heater is cheap, immediate, within the reader’s authority, and visibly reasonable — and offering it as a fallback makes the first request easier to grant too.\u003c/p>","P5":"\u003cp>\u003cstrong>(B).\u003c/strong>\u003c/p>\u003cp>(A) is pure affect. It gives the reader nothing to act on and invites them to defend themselves rather than help you.\u003c/p>\u003cp>(C) is a threat. Escalation may be justified eventually, but announcing it in a first direct email converts a maintenance request into a dispute, and disputes move more slowly than requests.\u003c/p>\u003cp>(B) concedes a real constraint and then states the problem as a measurement (\u003cem>three weeks\u003c/em>). The concession is what earns it the right to the complaint.\u003c/p>","F1":"\u003cp>a.  Describe · Evidence · Request · Offer.\u003c/p>\u003cp>b.  They are checkable. \u003cem>Very cold\u003c/em> is a feeling the reader may discount; twelve degrees is a fact they must deal with. The same is true of the reference numbers, which turn “I reported it” into something verifiable in thirty seconds.\u003c/p>\u003cp>c.  “As far as I know nobody has been able to look at it yet.” Defused by the opening of the next paragraph — \u003cem>I appreciate that February is a busy month\u003c/em> — which supplies the excuse before the reader has to invent one.\u003c/p>","F2":"\u003cp>a.  Plain: \u003cem>You have not come.\u003c/em> The original adds: a limit on your own knowledge (\u003cem>as far as I know\u003c/em>), a shift from unwillingness to inability (\u003cem>has been able to\u003c/em>), and an expectation that it will still happen (\u003cem>yet\u003c/em>).\u003c/p>\u003cp>b.  Present perfect continuous: the failing started in the past, is still going on, and is the reason for writing. \u003cem>Failed\u003c/em> would close it off as finished; \u003cem>is failing\u003c/em> would lose the three weeks of history, which is the whole case.\u003c/p>\u003cp>c.  Strictly, the subject of \u003cem>to borrow\u003c/em> is the writer, while the subject of \u003cem>to have someone attend\u003c/em> is the office — so the parallel is imperfect. It is harmless because both are governed by \u003cem>would it be possible\u003c/em>, which is about the world rather than about any particular agent. In a formal report you would tidy it; in a seven-minute email nobody will notice, and it reads naturally.\u003c/p>","F3":"\u003cp>a.  Because \u003cem>logged\u003c/em> is the system’s own word for what you did. It frames your action as a correct use of their process rather than as an emotional event, and it implicitly asks them to check the log.\u003c/p>\u003cp>b.  “Come out to deal with it”. It is the standard verb in British maintenance and service English — \u003cem>an engineer will attend\u003c/em> — and also appears in medical contexts. Using the trade’s own verb signals that you know how the process works.\u003c/p>\u003cp>c.  Because it ties the complaint to a legitimate interest the institution recognises. \u003cem>Freezing\u003c/em> is about your comfort; \u003cem>difficult to work in\u003c/em> is about your studies, which is what the accommodation exists to support. Pick the version of your grievance that the reader is institutionally obliged to care about.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It prosecutes the reader.\u003c/strong> “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.\u003c/p>\u003cp>2.  \u003cstrong>No usable remedy and no evidence.\u003c/strong> “Please send someone immediately” names no alternative, no access times, and no reference numbers — so the office cannot even find the original reports. The second bullet is therefore only half addressed.\u003c/p>\u003cp>3.  \u003cstrong>Consequential errors.\u003c/strong> “is not working since three weeks” (has not been working for three weeks — both the tense and the preposition are wrong), “I reported two times” (twice), “Students Union” (Students’ Union). The tense error in particular obscures the history, which is the one thing the email needed to establish.\u003c/p>","F5":"\u003cp>Model: \u003cem>I reported the fault on 2 March and again on 6 March (references KT-118 and KT-140), and as far as I know nobody has been able to attend yet. I appreciate this is a busy time; would it be possible for someone to look at it this week, or for us to be told when it is likely to be scheduled?\u003c/em>\u003c/p>\u003cp>The fallback here is information rather than equipment — and a date is something an office can always give you, which is exactly why it makes a good second ask.\u003c/p>"},"model":["Dear Accommodation Office,","The heating in Room 212, Elmfield, has been failing intermittently since the end of January. It runs normally for a day or two and then goes cold, usually overnight, and the radiator stays cold until it resets itself.","I logged the fault through the portal on 4 February and again on 11 February, and received an automatic acknowledgement each time (references EF-2291 and EF-2340). As far as I know nobody has been able to look at it yet.","I appreciate that February is a busy month for maintenance. Would it be possible to have someone attend in the next few days, or failing that, to borrow a portable heater until the repair can be scheduled? The room has been around twelve degrees this week and it is difficult to work in.","I am in most mornings and happy to give access at any time.","Thank you very much.","Best wishes,","Ravi Shankar — Room 212, Elmfield"],"model_html":"\u003cp>Dear Accommodation Office,\u003c/p>\u003cp>The heating in Room 212, Elmfield, has been failing intermittently since the end of January. It runs normally for a day or two and then goes cold, usually overnight, and the radiator stays cold until it resets itself.\u003c/p>\u003cp>I logged the fault through the portal on 4 February and again on 11 February, and received an automatic acknowledgement each time (references EF-2291 and EF-2340). As far as I know nobody has been able to look at it yet.\u003c/p>\u003cp>I appreciate that February is a busy month for maintenance. Would it be possible to have someone attend in the next few days, or failing that, to borrow a portable heater until the repair can be scheduled? The room has been around twelve degrees this week and it is difficult to work in.\u003c/p>\u003cp>I am in most mornings and happy to give access at any time.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ravi Shankar — Room 212, Elmfield\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam,","I am writing to complain about the heating in my room 212 which is not working since three weeks. I reported two times on your website but nobody came, so obviously nobody is reading these reports. It is completely unacceptable that students must live in the cold in February while we are paying so much money for the accommodation. Please send someone immediately to repair it, otherwise I will have to contact the Students Union.","I hope for your urgent action."],"degraded_html":"\u003cp>Dear Sir/Madam,\u003c/p>\u003cp>I am writing to complain about the heating in my room 212 which is not working since three weeks. I reported two times on your website but nobody came, so obviously nobody is reading these reports. It is completely unacceptable that students must live in the cold in February while we are paying so much money for the accommodation. Please send someone immediately to repair it, otherwise I will have to contact the Students Union.\u003c/p>\u003cp>I hope for your urgent action.\u003c/p>","degraded_band":3,"model_words":160,"fault_list":{"tag":"F4","faults":["It prosecutes the reader. “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.","No usable remedy and no evidence. “Please send someone immediately” names no alternative, no access times, and no reference numbers — so the office cannot even find the original reports. The second bullet is therefore only half addressed.","Consequential errors. “is not working since three weeks” (has not been working for three weeks — both the tense and the preposition are wrong), “I reported two times” (twice), “Students Union” (Students’ Union). The tense error in particular obscures the history, which is the one thing the email needed to establish."],"html":["\u003cp>1.  \u003cstrong>It prosecutes the reader.\u003c/strong> “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.\u003c/p>","\u003cp>2.  \u003cstrong>No usable remedy and no evidence.\u003c/strong> “Please send someone immediately” names no alternative, no access times, and no reference numbers — so the office cannot even find the original reports. The second bullet is therefore only half addressed.\u003c/p>","\u003cp>3.  \u003cstrong>Consequential errors.\u003c/strong> “is not working since three weeks” (has not been working for three weeks — both the tense and the preposition are wrong), “I reported two times” (twice), “Students Union” (Students’ Union). The tense error in particular obscures the history, which is the one thing the email needed to establish.\u003c/p>"]},"scenario":"\u003cp>The heating in your room has been failing intermittently for three weeks. You reported it twice through the online portal and received an automatic acknowledgement each time, but nobody has come. The temperature dropped sharply this week.\u003c/p>","bullets":["Describe the fault and its history.","Explain what you have already done about it.","Say clearly what you would like to happen now."],"header":[["To:","accommodation@northgate.ac.uk"],["Subject:","Heating fault, Room 212 Elmfield — reported 4 and 11 Feb"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No usable remedy and no evidence. “Please send someone immediately” names no alternative, no access times, and no reference numbers — so the office cannot even find the original reports. The second bullet is therefore only half addressed.","correct":true},{"text":"Consequential errors. “is not working since three weeks” (has not been working for three weeks — both the tense and the preposition are wrong), “I reported two times” (twice), “Students Union” (Students’ Union). The tense error in particular obscures the history, which is the one thing the email needed to establish.","correct":true},{"text":"Language: “the readers”, “the newspapers”, “the market for literature” over-articled; “anymore” should be “any more”; and “connected with each other” is doing the work that an argument should.","correct":false},{"text":"It concedes the central objection and then ignores it. “this is a problem, but we cannot stop all the progress”. Petros’s point is acknowledged and then overridden by an appeal to progress, which is not an argument.","correct":false},{"text":"Lin’s argument is dismissed with “now we know better and our moral understanding has progressed” — which assumes the reliability of current intuitions, the very thing in dispute.","correct":false},{"text":"It prosecutes the reader. “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.","correct":true}],"key_html":"F4"}};</script>
