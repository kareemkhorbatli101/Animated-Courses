<script>window.ITEM={"kind":"exercise","id":"EM 087","slug":"em-087","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and chasing","payload":{"Strategy":"chase by changing the channel, not the volume","Grammar":"conditional urgency","Vocabulary":"portal, ticket, reference, escalate","Convention":"chasing a system rather than a person"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You were told not to duplicate. How do you write without doing so?\u003c/p>\u003cp>b.  What is the one thing an email can get that a portal ticket cannot?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for a ticket to be open, and what is escalation?\u003c/p>\u003cp>b.  Why is a reference number the most important thing in this email?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Justify writing by email in one sentence that does not criticise the portal.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer explains why this is not a duplicate. Why spend a sentence on that?\u003c/p>\u003cp>b.  \"a queue that moves\" — what is the request, precisely?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"may be sitting in a queue nobody is actively working\" — why the hedge?\u003c/p>\u003cp>b.  \"I am not asking for it to be prioritised over anyone else\" — what does this disclaim, and why?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By using a different channel and saying so. The instruction is about duplicate tickets in the queue; an email asking about the existing ticket adds no second item and explicitly says it has not.\u003c/p>\u003cp>b.  A human being who can look at the ticket outside the automated flow. The portal can only tell you what it already shows; a person can tell you whether anyone is working the queue.\u003c/p>","P2":"\u003cp>a.  Open means logged and unresolved — which is compatible with being actively worked or entirely forgotten. Escalation moves it to someone with authority to act outside the normal flow.\u003c/p>\u003cp>b.  Because without it nothing can be found, and the whole email is a request to look at one specific record.\u003c/p>","P3":"\u003cp>Model: \"I am writing by email because six weeks without an update is not something I can see or fix from my side.\"\u003c/p>","F1":"\u003cp>a.  Because the instruction gives the office a legitimate reason to disregard the message, and pre-empting it costs one sentence. Showing that you read and followed the process also makes the complaint about the process harder to deflect.\u003c/p>\u003cp>b.  Confirmation that the ticket is in an active workflow rather than a stalled one — which is a question about the system rather than about her case, and which almost anyone reading the email can answer.\u003c/p>","F2":"\u003cp>a.  Because the writer cannot know it. Stating it as fact would be an accusation about the office’s working practices; the hedge reports an inference from the only evidence available to her, which is unanswerable.\u003c/p>\u003cp>b.  Queue-jumping. Disclaiming it removes the most natural reason to refuse the request and makes clear she is asking about process rather than for a favour — which is the one thing an overloaded service can give immediately.\u003c/p>","F3":"\u003cp>1.  No reference number, so nothing can be located — the first bullet fails despite the email being entirely about a past submission.\u003c/p>\u003cp>2.  \"I have tried to contact you several times\" contradicts the instruction not to duplicate and is vague; nothing explains why email is being used now.\u003c/p>\u003cp>3.  \"Deal with my request immediately\" asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. \"Completely unacceptable for a university of this size\" is editorial.\u003c/p>"},"model":["Dear Student Services,","I submitted a fee refund request through the portal on 3 March (reference REF-88213). It still shows as open and I have had no contact about it.","I am aware the automated acknowledgement asks us not to submit duplicates, so I have not raised a second ticket. I am writing instead because six weeks without an update suggests the ticket may be sitting in a queue nobody is actively working, and that is not something I can see or fix from my side.","Could somebody look at REF-88213 and tell me either which stage it has reached or, if it has been missed, how to get it picked up? I am not asking for it to be prioritised over anyone else — only to know that it is in a queue that moves.","Thank you very much.","Yours sincerely,","Petra Nowak — 2206613"],"model_html":"\u003cp>Dear Student Services,\u003c/p>\u003cp>I submitted a fee refund request through the portal on 3 March (reference REF-88213). It still shows as open and I have had no contact about it.\u003c/p>\u003cp>I am aware the automated acknowledgement asks us not to submit duplicates, so I have not raised a second ticket. I am writing instead because six weeks without an update suggests the ticket may be sitting in a queue nobody is actively working, and that is not something I can see or fix from my side.\u003c/p>\u003cp>Could somebody look at REF-88213 and tell me either which stage it has reached or, if it has been missed, how to get it picked up? I am not asking for it to be prioritised over anyone else — only to know that it is in a queue that moves.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Petra Nowak — 2206613\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I submitted a refund request six weeks ago through your portal and nobody has replied to me, which is completely unacceptable for a university of this size. I have tried to contact you several times without success. Could you please deal with my request immediately as I have been waiting far too long already and I need this money. If I do not receive a response I will have to make a formal complaint.","Petra"],"degraded_html":"\u003cp>Dear Sir/Madam, I submitted a refund request six weeks ago through your portal and nobody has replied to me, which is completely unacceptable for a university of this size. I have tried to contact you several times without success. Could you please deal with my request immediately as I have been waiting far too long already and I need this money. If I do not receive a response I will have to make a formal complaint.\u003c/p>\u003cp>Petra\u003c/p>","degraded_band":3,"model_words":146,"fault_list":{"tag":"F3","faults":["No reference number, so nothing can be located — the first bullet fails despite the email being entirely about a past submission.","\"I have tried to contact you several times\" contradicts the instruction not to duplicate and is vague; nothing explains why email is being used now.","\"Deal with my request immediately\" asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. \"Completely unacceptable for a university of this size\" is editorial."],"html":["\u003cp>1.  No reference number, so nothing can be located — the first bullet fails despite the email being entirely about a past submission.\u003c/p>","\u003cp>2.  \"I have tried to contact you several times\" contradicts the instruction not to duplicate and is vague; nothing explains why email is being used now.\u003c/p>","\u003cp>3.  \"Deal with my request immediately\" asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. \"Completely unacceptable for a university of this size\" is editorial.\u003c/p>"]},"scenario":"\u003cp>A fee refund request submitted through the student portal has had no response for six weeks. The portal shows the ticket as \"open\". There is no named contact and the automated reply says not to send duplicate requests.\u003c/p>","bullets":["Explain what you have already done.","Explain why you are now writing by email.","Ask for something a human can do."],"header":[["To:","studentservices@northgate.ac.uk"],["Subject:","Ticket REF-88213 — open six weeks, no response"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“I have tried to contact you several times” contradicts the instruction not to duplicate and is vague; nothing explains why email is being used now.","correct":true},{"text":"It is not a contribution. It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":false},{"text":"“Deal with my request immediately” asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. “Completely unacceptable for a university of this size” is editorial.","correct":true},{"text":"Petros’s argument is acknowledged and then waved away with “better to do something than nothing”, which is the reasoning his objection was specifically about.","correct":false},{"text":"Language: “the dangerous nuclear power”, “the prices of the batteries”, “another place” — and the conclusion “one hundred per cent” is exactly the unhedged absolute the topic punishes.","correct":false},{"text":"No reference number, so nothing can be located — the first bullet fails despite the email being entirely about a past submission.","correct":true}],"key_html":"F3"}};</script>
