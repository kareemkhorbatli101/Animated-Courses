<script>window.ITEM={"kind":"exercise","id":"EM 053","slug":"em-053","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"say what you do not know, and the advice becomes usable","Grammar":"hedged generalisation","Vocabulary":"intensive, immersion, plateau, conversational","Convention":"advising on something you have only partly experienced"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Your experience was in a different country two years ago. Does that disqualify you?\u003c/p>\u003cp>b.  What is the difference between advice and a review here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to plateau in language learning?\u003c/p>\u003cp>b.  Distinguish immersion from an intensive course.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Give a recommendation in one sentence that names its own limits.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer discounts his own evidence in the first sentence. Why does that make the advice more useful rather than less?\u003c/p>\u003cp>b.  The concrete check is about accommodation, not teaching. What reasoning gets there?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"tends to be competent and similar everywhere\" — what does \"tends to\" protect against?\u003c/p>\u003cp>b.  \"that is usually an answer in itself\" — what is being implied, and why not say it directly?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No — but it limits what your experience is evidence for. It is good evidence about what varies between such courses and poor evidence about this particular school, and saying so is what lets your friend weigh it.\u003c/p>\u003cp>b.  A review reports what happened to you. Advice identifies which features of your experience will generalise to theirs — which requires separating the course from the circumstances.\u003c/p>","P2":"\u003cp>a.  To stop improving despite continued study, usually because the difficulty of the input has stopped rising.\u003c/p>\u003cp>b.  An intensive course is many hours of formal teaching; immersion is living in the language outside class. The second is what the model identifies as the real variable.\u003c/p>","P3":"\u003cp>Model: \"Worth it, I think, but with one condition — and my experience is two years old and in a different country, so treat it accordingly.\"\u003c/p>","F1":"\u003cp>a.  Because it tells Marta how much weight to put on each part. Advice offered as certain has to be either accepted or rejected whole; advice that marks its own reliability can be used selectively, which is how people actually make decisions.\u003c/p>\u003cp>b.  From separating the constant from the variable. If the teaching is similar everywhere, it cannot explain why one course works and another does not — so the explanation has to be in what differed, which was the afternoons.\u003c/p>","F2":"\u003cp>a.  Against the counterexample. Somebody will have had a brilliant or a terrible teacher, and an unhedged claim dies on that case. \"Tends to\" claims a central tendency, which is what the writer actually observed.\u003c/p>\u003cp>b.  That a school unwilling to disclose its nationality mix probably has a bad one. Saying it directly would be an accusation about a school he has no knowledge of; the indirect form passes the inference to Marta, who can test it.\u003c/p>","F3":"\u003cp>1.  It generalises from one bad experience without distinguishing what was the course from what was the circumstances — so the second bullet fails.\u003c/p>\u003cp>2.  The alternative offered (apps and online tutors) addresses a different goal, and no concrete thing to check is given, so the third bullet fails.\u003c/p>\u003cp>3.  It then withdraws the advice entirely: \"everyone is different so maybe for you it will be better, you never know\" leaves Marta with nothing. There are also two comma splices.\u003c/p>"},"model":["Hi Marta,","Worth it, I think, but with one condition that made most of the difference for me — and my experience is two years old and in Portugal rather than Spain, so treat it accordingly.","The teaching on these courses tends to be competent and similar everywhere; four hours a day of grammar will move you whoever is delivering it. What varied enormously was the afternoons. My first two weeks were with a group of English speakers and I plateaued almost immediately, because we all defaulted to English the moment class ended. The second fortnight I moved to a homestay and it was a different course entirely.","So the thing I would check is not the school but the accommodation and the nationality mix. Ask them what proportion of students are from English-speaking countries, and whether homestay is available rather than the shared flats. If they will not tell you the mix, that is usually an answer in itself.","Happy to send you the materials I still have, if useful.","Dan"],"model_html":"\u003cp>Hi Marta,\u003c/p>\u003cp>Worth it, I think, but with one condition that made most of the difference for me — and my experience is two years old and in Portugal rather than Spain, so treat it accordingly.\u003c/p>\u003cp>The teaching on these courses tends to be competent and similar everywhere; four hours a day of grammar will move you whoever is delivering it. What varied enormously was the afternoons. My first two weeks were with a group of English speakers and I plateaued almost immediately, because we all defaulted to English the moment class ended. The second fortnight I moved to a homestay and it was a different course entirely.\u003c/p>\u003cp>So the thing I would check is not the school but the accommodation and the nationality mix. Ask them what proportion of students are from English-speaking countries, and whether homestay is available rather than the shared flats. If they will not tell you the mix, that is usually an answer in itself.\u003c/p>\u003cp>Happy to send you the materials I still have, if useful.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Marta, I did a course like this two years ago and honestly it was not great, the classes were boring and I did not improve very much, so I would not spend so much money on it if I were you. You can learn the same things from apps and online tutors for a fraction of the price. But everyone is different so maybe for you it will be better, you never know.","Dan"],"degraded_html":"\u003cp>Hi Marta, I did a course like this two years ago and honestly it was not great, the classes were boring and I did not improve very much, so I would not spend so much money on it if I were you. You can learn the same things from apps and online tutors for a fraction of the price. But everyone is different so maybe for you it will be better, you never know.\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":172,"fault_list":{"tag":"F3","faults":["It generalises from one bad experience without distinguishing what was the course from what was the circumstances — so the second bullet fails.","The alternative offered (apps and online tutors) addresses a different goal, and no concrete thing to check is given, so the third bullet fails.","It then withdraws the advice entirely: \"everyone is different so maybe for you it will be better, you never know\" leaves Marta with nothing. There are also two comma splices."],"html":["\u003cp>1.  It generalises from one bad experience without distinguishing what was the course from what was the circumstances — so the second bullet fails.\u003c/p>","\u003cp>2.  The alternative offered (apps and online tutors) addresses a different goal, and no concrete thing to check is given, so the third bullet fails.\u003c/p>","\u003cp>3.  It then withdraws the advice entirely: \"everyone is different so maybe for you it will be better, you never know\" leaves Marta with nothing. There are also two comma splices.\u003c/p>"]},"scenario":"\u003cp>A classmate asks whether an expensive four-week intensive language course abroad is worth it. You did a similar course two years ago in a different country and had a mixed experience.\u003c/p>","bullets":["Give a view.","Be clear about the limits of your experience.","Give them something concrete to check."],"header":[["To:","m.novak@northgate.ac.uk"],["Subject:","That summer intensive — what I’d check first"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Companies do not care about their employees, so they will never choose better objectives” changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.","correct":false},{"text":"Language. “cutting their money” (their pay), “not fair for them” (unfair to them), “a small cut in the salary” (in salaries), and a long run-on at “jobs which is worse”.","correct":false},{"text":"The alternative offered (apps and online tutors) addresses a different goal, and no concrete thing to check is given, so the third bullet fails.","correct":true},{"text":"It generalises from one bad experience without distinguishing what was the course from what was the circumstances — so the second bullet fails.","correct":true},{"text":"It then withdraws the advice entirely: “everyone is different so maybe for you it will be better, you never know” leaves Marta with nothing. There are also two comma splices.","correct":true},{"text":"Neither speaker is engaged: Mei’s efficiency argument and Arno’s point about prognosis tracking advantage are both left untouched, and “every human life has equal value” is asserted without being connected to either rule.","correct":false}],"key_html":"F3"}};</script>
