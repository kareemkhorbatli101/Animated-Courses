<script>window.ITEM={"kind":"exercise","id":"AD 077","slug":"ad-077","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Agriculture · policy choice","payload":{"Strategy":"choose by asking which option is robust to being wrong","Grammar":"subordination with provided that","Vocabulary":"yield, subsidy, monoculture, resilience","Convention":"choosing between intensification and diversification"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Chiara is not disputing average yields. What is she disputing?\u003c/p>\u003cp>b.  Why might the right answer depend on how confident we are about future conditions?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a monoculture, and what is resilience?\u003c/p>\u003cp>b.  Distinguish average yield from yield variance.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names the risk you are buying.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response concedes the land-sparing argument in full. Why does that not decide the question?\u003c/p>\u003cp>b.  The final paragraph gives a reason for public support specifically. What is it?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Provided conditions stay within the range the optimisation assumed, that is a good trade\" — what does the subordinator do?\u003c/p>\u003cp>b.  \"variance is the thing policy has to buy\" — why end here?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The variance. She accepts that average yield is higher and argues that the distribution of outcomes, including rare total failures, is what matters for food security.\u003c/p>\u003cp>b.  Because optimisation is only safe within the range of conditions assumed. Greater uncertainty raises the value of resilience relative to average performance.\u003c/p>","P2":"\u003cp>a.  A monoculture is a single crop or variety grown over a large area; resilience is the capacity to keep functioning through a shock.\u003c/p>\u003cp>b.  Average yield is the expected output; variance is how much it fluctuates. A high average with high variance can be worse for food security than a lower, steadier one.\u003c/p>","P3":"\u003cp>Model: \"Tilt support towards diversification, accepting lower average yields, because correlated failure is the risk we can least afford.\"\u003c/p>","F1":"\u003cp>a.  Because it establishes only that intensification is better on average. The question is which to support under uncertainty, and an argument about expected yield does not address what happens in the tail.\u003c/p>\u003cp>b.  That resilience is a public good. Its benefit appears only in bad years and cannot be captured by the farmer who paid for it, so markets under-supply it while rewarding average yield — which is the classic case for subsidy.\u003c/p>","F2":"\u003cp>a.  It makes the concession conditional and names the condition precisely, so the agreement with Bram is genuine but bounded. The next sentence then removes the condition, which is far more economical than disputing his case directly.\u003c/p>\u003cp>b.  Because it states in one clause why this is a policy question at all. The market already does half the job, so public money should buy the half it cannot — which answers \"which should be supported\" rather than \"which is better\".\u003c/p>","F3":"\u003cp>1.  \"We could feed everyone already if we reduced food waste and ate less meat\" changes the subject — the prompt asks which agricultural policy to support, not whether demand could be reduced.\u003c/p>\u003cp>2.  Bram’s land-sparing argument is dismissed rather than weighed, and the deforestation consequence of lower yields is never addressed.\u003c/p>\u003cp>3.  \"Small farmers deserve support rather than large agribusiness\" substitutes a preference about who farms for the question of which system is more robust, and Chiara’s point about correlated failure goes unused.\u003c/p>"},"model":["Bram has the better argument under stable conditions and Chiara’s objection is about exactly the conditions we are heading into, which is why I would weight towards diversification.","The land-sparing case is strong and often under-appreciated. Doubling yields on existing farmland genuinely does protect forest, and a policy that lowers yields while demand rises exports deforestation elsewhere. That cost is real and falls on biodiversity, which is what Bram is defending.","Chiara’s point is about the shape of the risk rather than its size. A system optimised for average yield has correlated failure: the same variety, the same pathogen, the same drought, across a region at once. Provided conditions stay within the range the optimisation assumed, that is a good trade. Climate projections are precisely a statement that they will not.","So my position is intensification where the climate signal is weak and diversification where it is strong, with public support tilted towards the second because its benefit appears only in bad years and no individual farmer can capture it. Average yield is what a market already rewards; variance is the thing policy has to buy."],"model_html":"\u003cp>Bram has the better argument under stable conditions and Chiara’s objection is about exactly the conditions we are heading into, which is why I would weight towards diversification.\u003c/p>\u003cp>The land-sparing case is strong and often under-appreciated. Doubling yields on existing farmland genuinely does protect forest, and a policy that lowers yields while demand rises exports deforestation elsewhere. That cost is real and falls on biodiversity, which is what Bram is defending.\u003c/p>\u003cp>Chiara’s point is about the shape of the risk rather than its size. A system optimised for average yield has correlated failure: the same variety, the same pathogen, the same drought, across a region at once. Provided conditions stay within the range the optimisation assumed, that is a good trade. Climate projections are precisely a statement that they will not.\u003c/p>\u003cp>So my position is intensification where the climate signal is weak and diversification where it is strong, with public support tilted towards the second because its benefit appears only in bad years and no individual farmer can capture it. Average yield is what a market already rewards; variance is the thing policy has to buy.\u003c/p>","model_band":5,"degraded":["I think we should support diversification because industrial farming has done enormous damage to the environment with pesticides and fertilisers, and it is not sustainable in the long term. Traditional mixed farming is much better for soil health and biodiversity, and small farmers deserve support rather than large agribusiness. Bram says higher yields save land but I think we could feed everyone already if we reduced food waste and ate less meat, so we do not really need to increase yields at all."],"degraded_html":"\u003cp>I think we should support diversification because industrial farming has done enormous damage to the environment with pesticides and fertilisers, and it is not sustainable in the long term. Traditional mixed farming is much better for soil health and biodiversity, and small farmers deserve support rather than large agribusiness. Bram says higher yields save land but I think we could feed everyone already if we reduced food waste and ate less meat, so we do not really need to increase yields at all.\u003c/p>","degraded_band":3,"model_words":188,"fault_list":{"tag":"F3","faults":["\"We could feed everyone already if we reduced food waste and ate less meat\" changes the subject — the prompt asks which agricultural policy to support, not whether demand could be reduced.","Bram’s land-sparing argument is dismissed rather than weighed, and the deforestation consequence of lower yields is never addressed.","\"Small farmers deserve support rather than large agribusiness\" substitutes a preference about who farms for the question of which system is more robust, and Chiara’s point about correlated failure goes unused."],"html":["\u003cp>1.  \"We could feed everyone already if we reduced food waste and ate less meat\" changes the subject — the prompt asks which agricultural policy to support, not whether demand could be reduced.\u003c/p>","\u003cp>2.  Bram’s land-sparing argument is dismissed rather than weighed, and the deforestation consequence of lower yields is never addressed.\u003c/p>","\u003cp>3.  \"Small farmers deserve support rather than large agribusiness\" substitutes a preference about who farms for the question of which system is more robust, and Chiara’s point about correlated failure goes unused.\u003c/p>"]},"prof_name":"Dr Ferris","professor":"\u003cp>To feed a growing population, agricultural policy can support intensification — higher yields on less land, with more inputs — or diversification, with mixed cropping and lower average yields but greater resilience. Which should be supported?\u003c/p>","students":[["Bram","Intensification. Higher yields per hectare mean less land farmed, which is the single biggest thing we can do for biodiversity. Romanticising mixed farming costs forests."],["Chiara","Until the single variety fails. Monoculture is efficient right up to the year it is not, and then the failure is total and correlated across a whole region."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Small farmers deserve support rather than large agribusiness” substitutes a preference about who farms for the question of which system is more robust, and Chiara’s point about correlated failure goes unused.","correct":true},{"text":"“We could feed everyone already if we reduced food waste and ate less meat” changes the subject — the prompt asks which agricultural policy to support, not whether demand could be reduced.","correct":true},{"text":"It is not an apology. “actually it was not really my fault”, and the false claim that “nobody told me”. The first bullet asked for an apology; this is a defence with the word sorry attached at each end.","correct":false},{"text":"It attacks the only person who can help. “very careless” and “your mistake” make the post room a defendant, so the natural reply is a denial rather than a confirmation.","correct":false},{"text":"Bram’s land-sparing argument is dismissed rather than weighed, and the deforestation consequence of lower yields is never addressed.","correct":true},{"text":"It ignores the published material and the notice period, and closes with “Thank you for understanding”, which thanks them in advance for accepting what has already been decided.","correct":false}],"key_html":"F3"}};</script>
