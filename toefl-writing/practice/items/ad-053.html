<script>window.ITEM={"kind":"exercise","id":"AD 053","slug":"ad-053","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban planning and transport · agree or disagree with a claim","payload":{"Strategy":"test a claim against the case it was not built from","Grammar":"conditional qualification","Vocabulary":"density, amenity, catchment, viability","Convention":"disagreeing with a model that works somewhere else"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Marta and Oskar each identify a constraint. Which, respectively?\u003c/p>\u003cp>b.  Does Marta’s counter-example answer Oskar?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a catchment, and what makes a use viable?\u003c/p>\u003cp>b.  What is amenity, and how is it different from infrastructure?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the condition under which each is right, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reconciles the two by separating two variables. Which?\u003c/p>\u003cp>b.  It then identifies a third case. Why is that the contribution?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"her counter-example is doing the work his argument predicts\" — unpack this.\u003c/p>\u003cp>b.  \"Presented as a planning idea it sounds cheap\" — what is the criticism?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Marta identifies planning decisions — where things are put. Oskar identifies commercial viability — whether a use can survive once put there.\u003c/p>\u003cp>b.  Partly, and not in the way she intends. Dense poor areas have shops because density supplies the catchment, which is consistent with his argument rather than against it.\u003c/p>","P2":"\u003cp>a.  A catchment is the population a use can draw on. Viability is whether revenue from that catchment covers costs.\u003c/p>\u003cp>b.  Amenity is the day-to-day facilities that make a place usable — shops, parks, surgeries. Infrastructure is the network beneath them. The fifteen-minute idea is about amenity, which is why it is cheaper to assert than to deliver.\u003c/p>","P3":"\u003cp>Model: \"Density supplies the catchment and income determines what it supports, so the model needs density far more than wealth.\"\u003c/p>","F1":"\u003cp>a.  Density and income, which the debate treats as a single variable called deprivation. Once separated, Marta’s cases and Oskar’s stop contradicting each other.\u003c/p>\u003cp>b.  Because both classmates are arguing about dense areas, where the model works, and about whether poverty prevents it. The case where it genuinely fails — low density at any income — is the one neither raises, and it is where most of the population the policy is aimed at actually lives.\u003c/p>","F2":"\u003cp>a.  She offers dense poor neighbourhoods as evidence against his viability argument, but the thing that makes those neighbourhoods work is density, which is the mechanism his argument runs on. Her counter-example confirms his model while appearing to refute it.\u003c/p>\u003cp>b.  That the framing conceals the cost. Describing it as a planning principle implies the work is rezoning, when in the places it is most needed the work is rebuilding at higher density — which is a different scale of commitment and tends to go unmentioned.\u003c/p>","F3":"\u003cp>1.  It lists benefits nobody disputed and never engages Oskar’s viability argument, which is the only objection on the table.\u003c/p>\u003cp>2.  \"Easier in dense European cities than in American suburbs\" brushes against the real distinction and then drops it without analysis.\u003c/p>\u003cp>3.  \"Every city should try to move in this direction as much as possible\" is a recommendation with no content, and \"more human and liveable\" is doing the work evidence should. Language: \"local businesses\", \"the fifteen-minute city\" is fine but \"more time with their families\" is sentiment rather than argument.\u003c/p>"},"model":["Marta is right about dense poor neighbourhoods and Oskar is right about sparse ones, and her counter-example is doing the work his argument predicts. A dense low-income area has a catchment: not much money per household, but enough households within walking distance to support a shop. So the two constraints are not rivals — density supplies the catchment, income determines what kind of use it supports, and the model needs the first much more than the second.","That matters because it tells you where the idea fails, which is neither of the cases they are arguing about. It fails in low-density suburbs of any income, where no amount of zoning produces a catchment within a walk and the honest answer is either to accept car dependence or to change the density, which is a far larger intervention than the fifteen-minute framing suggests. Presented as a planning idea it sounds cheap; applied where it is most needed it is a redevelopment programme, and that is the thing its advocates tend not to say."],"model_html":"\u003cp>Marta is right about dense poor neighbourhoods and Oskar is right about sparse ones, and her counter-example is doing the work his argument predicts. A dense low-income area has a catchment: not much money per household, but enough households within walking distance to support a shop. So the two constraints are not rivals — density supplies the catchment, income determines what kind of use it supports, and the model needs the first much more than the second.\u003c/p>\u003cp>That matters because it tells you where the idea fails, which is neither of the cases they are arguing about. It fails in low-density suburbs of any income, where no amount of zoning produces a catchment within a walk and the honest answer is either to accept car dependence or to change the density, which is a far larger intervention than the fifteen-minute framing suggests. Presented as a planning idea it sounds cheap; applied where it is most needed it is a redevelopment programme, and that is the thing its advocates tend not to say.\u003c/p>","model_band":5,"degraded":["I think the fifteen-minute city is a very good idea because it reduces car use and pollution and it makes neighbourhoods more human and liveable. People would spend less time in traffic and more time with their families, and local businesses would benefit from having more customers nearby. Of course it is easier to implement in dense European cities than in American suburbs, but I think every city should try to move in this direction as much as possible, with better public transport and more mixed-use zoning."],"degraded_html":"\u003cp>I think the fifteen-minute city is a very good idea because it reduces car use and pollution and it makes neighbourhoods more human and liveable. People would spend less time in traffic and more time with their families, and local businesses would benefit from having more customers nearby. Of course it is easier to implement in dense European cities than in American suburbs, but I think every city should try to move in this direction as much as possible, with better public transport and more mixed-use zoning.\u003c/p>","degraded_band":3,"model_words":175,"fault_list":{"tag":"F3","faults":["It lists benefits nobody disputed and never engages Oskar’s viability argument, which is the only objection on the table.","\"Easier in dense European cities than in American suburbs\" brushes against the real distinction and then drops it without analysis.","\"Every city should try to move in this direction as much as possible\" is a recommendation with no content, and \"more human and liveable\" is doing the work evidence should. Language: \"local businesses\", \"the fifteen-minute city\" is fine but \"more time with their families\" is sentiment rather than argument."],"html":["\u003cp>1.  It lists benefits nobody disputed and never engages Oskar’s viability argument, which is the only objection on the table.\u003c/p>","\u003cp>2.  \"Easier in dense European cities than in American suburbs\" brushes against the real distinction and then drops it without analysis.\u003c/p>","\u003cp>3.  \"Every city should try to move in this direction as much as possible\" is a recommendation with no content, and \"more human and liveable\" is doing the work evidence should. Language: \"local businesses\", \"the fifteen-minute city\" is fine but \"more time with their families\" is sentiment rather than argument.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>The \"fifteen-minute city\" proposes that daily needs should be reachable within a short walk or cycle. Supporters point to reduced car dependence and stronger local economies; critics say it works only in places that are already dense and already wealthy. How far does the idea travel?\u003c/p>","students":[["Marta","It travels further than critics allow. The principle is about where things are put, not about how rich the area is — a school, a surgery and a shop within a walk is a planning decision, and plenty of poor dense neighbourhoods already have it."],["Oskar","The binding constraint is not planning, it is viability. A shop needs a catchment that spends. In a low-income low-density area you can zone for a high street all you like and nothing will open."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Easier in dense European cities than in American suburbs” brushes against the real distinction and then drops it without analysis.","correct":true},{"text":"Nothing is offered. “I will try to get it to you as soon as possible” names no deliverable and no date, so the second and third bullets both fail.","correct":false},{"text":"“I am sorry you were upset” apologises for her reaction rather than for the act, which is the standard non-apology.","correct":false},{"text":"“Every city should try to move in this direction as much as possible” is a recommendation with no content, and “more human and liveable” is doing the work evidence should. Language: “local businesses”, “the fifteen-minute city” is fine but “more time with their families” is sentiment rather than argument.","correct":true},{"text":"It lists benefits nobody disputed and never engages Oskar’s viability argument, which is the only objection on the table.","correct":true},{"text":"“Somebody to actually do something about it as soon as possible” names no action, no owner and no date, so the first bullet fails too.","correct":false}],"key_html":"F3"}};</script>
