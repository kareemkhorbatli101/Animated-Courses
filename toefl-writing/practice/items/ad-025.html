<script>window.ITEM={"kind":"exercise","id":"AD 025","slug":"ad-025","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban planning and transport · policy choice","payload":{"Strategy":"ask what a measure does to the people who cannot comply","Grammar":"conditional qualification","Vocabulary":"compliance, retrofit, grandfathering, phase-in","Convention":"arguing about a rule whose cost falls before its benefit"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Do Mette and Idris disagree about the policy or about the schedule?\u003c/p>\u003cp>b.  Mette makes a distributional argument too. How does it cut against Idris’s?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is grandfathering, and what is a phase-in?\u003c/p>\u003cp>b.  What is a retrofit, and why does it matter here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the real disagreement in one sentence and name what would resolve it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reclassifies Idris’s objection. From what to what, and why does that help him?\u003c/p>\u003cp>b.  The last sentence sets two costs against each other. What makes the comparison fair?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"owns a capital asset\" — why this phrase rather than \"owns a van\"?\u003c/p>\u003cp>b.  \"costs lives on a schedule\" — what does \"on a schedule\" add?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The schedule. Idris says explicitly that the principle is right, so arguing for the ban as such answers nobody.\u003c/p>\u003cp>b.  It identifies a different poor group — non-driving residents of polluted streets — whose interest runs the other way. That converts the question from rich against poor into poor against poor, which is harder and more honest.\u003c/p>","P2":"\u003cp>a.  Grandfathering exempts those already in a position when the rule changes; a phase-in applies the rule gradually to everyone. The first creates a permanent two-tier rule, the second does not.\u003c/p>\u003cp>b.  Fitting equipment to an existing vehicle to meet the standard. It matters because it is far cheaper than replacement, which changes the size of the problem Idris is describing.\u003c/p>","P3":"\u003cp>Model: \"Both want the ban, so the question is whether three years is a liquidity problem that can be financed or a real impossibility.\"\u003c/p>","F1":"\u003cp>a.  From a fairness objection to a liquidity one. It helps him because fairness objections are met with counter-claims about fairness, which he loses here; a liquidity problem has concrete remedies and therefore survives into the policy.\u003c/p>\u003cp>b.  Both are stated in their own units rather than converted into a common one. The writer is not claiming the lives are worth more than the money in some calculated sense, only that one cost is irreversible and the other is not — which is a claim about kind rather than magnitude.\u003c/p>","F2":"\u003cp>a.  Because it names the thing that undermines his case: a van is wealth, even when it cannot be converted to cash quickly. Using the economic term makes the concession precise and sets up the liquidity distinction in the next paragraph.\u003c/p>\u003cp>b.  That the deaths are not a vague background but a rate running while the decision is deferred. It makes delay an active choice with a quantity attached, which is Mette’s argument given sharper form.\u003c/p>","F3":"\u003cp>1.  It agrees with Idris without engaging Mette at all — the people harmed by the pollution never appear, so the distributional question is answered only on one side.\u003c/p>\u003cp>2.  The alternative proposed, public transport first, is offered with no timescale or cost and would delay the ban indefinitely, which is the thing at issue.\u003c/p>\u003cp>3.  Language: \"the governments always make these decisions without thinking\" is unsupported and rhetorical; \"normal families\", \"this economic situation\", \"everything is becoming more expensive\" are vague; \"punish\" prejudges the question.\u003c/p>"},"model":["They agree on the policy and disagree about three years, and Mette has the stronger half of the distributional argument. The people breathing the worst air are poorer than the people driving through it, and Idris’s tradesman, whatever his cash-flow problem, owns a capital asset. A delay transfers a measurable health cost from van owners to residents, and that trade should be made explicitly if it is made at all.","But his objection survives in a narrower form, and it is about liquidity rather than wealth. The problem with a three-year ban is not that compliance is unaffordable in total but that it is unaffordable now, by people whose asset cannot be sold for anything near what the replacement costs. That is a financing failure, and financing failures have financing answers: a scrappage payment tied to the ban date, or a retrofit grant, or a loan repaid out of the lower running costs. If I had to choose between delaying the ban and funding compliance, I would fund compliance — because the delay costs lives on a schedule and the money costs a budget line."],"model_html":"\u003cp>They agree on the policy and disagree about three years, and Mette has the stronger half of the distributional argument. The people breathing the worst air are poorer than the people driving through it, and Idris’s tradesman, whatever his cash-flow problem, owns a capital asset. A delay transfers a measurable health cost from van owners to residents, and that trade should be made explicitly if it is made at all.\u003c/p>\u003cp>But his objection survives in a narrower form, and it is about liquidity rather than wealth. The problem with a three-year ban is not that compliance is unaffordable in total but that it is unaffordable now, by people whose asset cannot be sold for anything near what the replacement costs. That is a financing failure, and financing failures have financing answers: a scrappage payment tied to the ban date, or a retrofit grant, or a loan repaid out of the lower running costs. If I had to choose between delaying the ban and funding compliance, I would fund compliance — because the delay costs lives on a schedule and the money costs a budget line.\u003c/p>","model_band":5,"degraded":["I agree with Idris because it is not fair to punish ordinary people who cannot afford to buy a new car, especially in this economic situation when everything is becoming more expensive. The governments always make these decisions without thinking about the consequences for normal families. Of course pollution is a problem and we must do something about it, but three years is really too short and people need more time to prepare. I think a better solution would be to improve public transport first so people will not need their cars, and then introduce the ban later when everybody has an alternative."],"degraded_html":"\u003cp>I agree with Idris because it is not fair to punish ordinary people who cannot afford to buy a new car, especially in this economic situation when everything is becoming more expensive. The governments always make these decisions without thinking about the consequences for normal families. Of course pollution is a problem and we must do something about it, but three years is really too short and people need more time to prepare. I think a better solution would be to improve public transport first so people will not need their cars, and then introduce the ban later when everybody has an alternative.\u003c/p>","degraded_band":3,"model_words":186,"fault_list":{"tag":"F3","faults":["It agrees with Idris without engaging Mette at all — the people harmed by the pollution never appear, so the distributional question is answered only on one side.","The alternative proposed, public transport first, is offered with no timescale or cost and would delay the ban indefinitely, which is the thing at issue.","Language: \"the governments always make these decisions without thinking\" is unsupported and rhetorical; \"normal families\", \"this economic situation\", \"everything is becoming more expensive\" are vague; \"punish\" prejudges the question."],"html":["\u003cp>1.  It agrees with Idris without engaging Mette at all — the people harmed by the pollution never appear, so the distributional question is answered only on one side.\u003c/p>","\u003cp>2.  The alternative proposed, public transport first, is offered with no timescale or cost and would delay the ban indefinitely, which is the thing at issue.\u003c/p>","\u003cp>3.  Language: \"the governments always make these decisions without thinking\" is unsupported and rhetorical; \"normal families\", \"this economic situation\", \"everything is becoming more expensive\" are vague; \"punish\" prejudges the question.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>Several cities have announced that older, higher-emission vehicles will be banned from central areas within three years. Supporters cite air quality; opponents say the burden falls on those least able to replace a car. Should such bans go ahead on that timetable?\u003c/p>","students":[["Mette","Yes. Air pollution kills people now, disproportionately the poorest, who live on the busiest roads and do not own cars at all. Delay is not neutral — it is a decision to keep the current deaths."],["Idris","The principle is right and three years is not. A van that is a tradesman’s entire business cannot be replaced on that timetable, and a ban that forces it will simply push those journeys and those people out of the city economy."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","correct":false},{"text":"Language: “the governments always make these decisions without thinking” is unsupported and rhetorical; “normal families”, “this economic situation”, “everything is becoming more expensive” are vague; “punish” prejudges the question.","correct":true},{"text":"The alternative proposed, public transport first, is offered with no timescale or cost and would delay the ban indefinitely, which is the thing at issue.","correct":true},{"text":"The outcome is never given — “I could not have finished the project” says nothing about how it did. The third bullet fails.","correct":false},{"text":"Social conventions. “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.","correct":false},{"text":"It agrees with Idris without engaging Mette at all — the people harmed by the pollution never appear, so the distributional question is answered only on one side.","correct":true}],"key_html":"F3"}};</script>
