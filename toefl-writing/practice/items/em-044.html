<script>window.ITEM={"kind":"exercise","id":"EM 044","slug":"em-044","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"one email, one decision","Grammar":"parallel question structure","Vocabulary":"tenancy, guarantor, deposit scheme, break clause","Convention":"enquiring where the answer will cost you money"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The reader is a letting agent, not a university office. What changes?\u003c/p>\u003cp>b.  Why say you intend to proceed?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a guarantor, and what is a break clause?\u003c/p>\u003cp>b.  What is a deposit protection scheme, and why ask which one?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Write the three questions in parallel grammatical form.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Clause numbers are cited twice. What does that achieve with a commercial reader?\u003c/p>\u003cp>b.  Why offer a phone call here, when the guide has generally preferred written answers?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  All three questions begin with a verb and name a clause. What does the parallelism do?\u003c/p>\u003cp>b.  \"I am ready to go ahead\" — why open with this rather than with the questions?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The register is commercial rather than institutional, and the reader is motivated by closing the let. Be brisk, be specific, and cite the contract — agents respond to clause numbers.\u003c/p>\u003cp>b.  Because it tells the agent the email is worth answering properly. An enquiry from a committed tenant gets a different reply from one that reads as shopping around.\u003c/p>","P2":"\u003cp>a.  A guarantor is someone who undertakes to pay if you do not. A break clause allows either party to end the tenancy early on stated terms.\u003c/p>\u003cp>b.  A government-approved scheme that holds the deposit so the landlord cannot simply withhold it. Asking which one is standard, and the answer is a fact an agent must give.\u003c/p>","P3":"\u003cp>Model: all three begin \"Is ...\" or \"Which ...\" and name the clause they refer to, so each can be answered in a line without re-reading the contract.\u003c/p>","F1":"\u003cp>a.  It signals you have read the agreement, which changes the reply from a sales answer to a contractual one and makes a vague response much harder to give.\u003c/p>\u003cp>b.  Because an agent is commercially motivated to answer quickly and the questions are factual rather than contested. The written record matters for the contract, which you will have anyway; what you want here is speed before signing.\u003c/p>","F2":"\u003cp>a.  It makes them scannable and separately answerable, so the reply comes back as three answers rather than one paragraph addressing whichever the agent remembered.\u003c/p>\u003cp>b.  Because it converts the email from a hurdle into the last step before a signature, which is the frame most likely to get a same-day reply.\u003c/p>","F3":"\u003cp>1.  The questions are not questions. \"The guarantor thing\" and \"what happens if I need to leave early\" name topics, not things that can be answered, and no clause is cited.\u003c/p>\u003cp>2.  It undercuts itself. \"I am interested\" plus \"is the flat still available\" signals that the writer is early in the process, which invites a slower and vaguer reply.\u003c/p>\u003cp>3.  \"Could you explain these things to me please\" asks for an explanation of a contract rather than three facts, which is both more work for the reader and less useful to the writer.\u003c/p>"},"model":["Dear Brookfield Lettings,","I am ready to go ahead with the tenancy at 14b Carlisle Road from 1 September and wanted to check three points in the agreement before signing.","1. Is a UK-based guarantor required, or is the six-month advance option in clause 7 available instead?","2. Which deposit protection scheme do you use, and when is the deposit registered?","3. Is there a break clause if I take an industrial placement from January? Clause 12 mentions early termination but not on what terms.","If it is simpler to answer by phone I am available most afternoons on 07700 900412.","Thank you.","Best wishes,","Chloe Barnett"],"model_html":"\u003cp>Dear Brookfield Lettings,\u003c/p>\u003cp>I am ready to go ahead with the tenancy at 14b Carlisle Road from 1 September and wanted to check three points in the agreement before signing.\u003c/p>\u003cp>1. Is a UK-based guarantor required, or is the six-month advance option in clause 7 available instead?\u003c/p>\u003cp>2. Which deposit protection scheme do you use, and when is the deposit registered?\u003c/p>\u003cp>3. Is there a break clause if I take an industrial placement from January? Clause 12 mentions early termination but not on what terms.\u003c/p>\u003cp>If it is simpler to answer by phone I am available most afternoons on 07700 900412.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Chloe Barnett\u003c/p>","model_band":5,"degraded":["Hi, I am interested in the flat at Carlisle Road but before I sign I have some questions. I am not sure about the guarantor thing, also about the deposit and what happens if I need to leave early because of my placement. Could you explain these things to me please? Also is the flat still available?","Chloe"],"degraded_html":"\u003cp>Hi, I am interested in the flat at Carlisle Road but before I sign I have some questions. I am not sure about the guarantor thing, also about the deposit and what happens if I need to leave early because of my placement. Could you explain these things to me please? Also is the flat still available?\u003c/p>\u003cp>Chloe\u003c/p>","degraded_band":3,"model_words":109,"fault_list":{"tag":"F3","faults":["The questions are not questions. \"The guarantor thing\" and \"what happens if I need to leave early\" name topics, not things that can be answered, and no clause is cited.","It undercuts itself. \"I am interested\" plus \"is the flat still available\" signals that the writer is early in the process, which invites a slower and vaguer reply.","\"Could you explain these things to me please\" asks for an explanation of a contract rather than three facts, which is both more work for the reader and less useful to the writer."],"html":["\u003cp>1.  The questions are not questions. \"The guarantor thing\" and \"what happens if I need to leave early\" name topics, not things that can be answered, and no clause is cited.\u003c/p>","\u003cp>2.  It undercuts itself. \"I am interested\" plus \"is the flat still available\" signals that the writer is early in the process, which invites a slower and vaguer reply.\u003c/p>","\u003cp>3.  \"Could you explain these things to me please\" asks for an explanation of a contract rather than three facts, which is both more work for the reader and less useful to the writer.\u003c/p>"]},"scenario":"\u003cp>You are about to sign a tenancy for a student flat. Three things in the contract are unclear: whether a guarantor is required, how the deposit is protected, and whether there is a break clause if you take a placement year.\u003c/p>","bullets":["Say which property and that you intend to proceed.","Ask the three questions.","Make the reply easy."],"header":[["To:","lettings@brookfieldproperty.co.uk"],["Subject:","14b Carlisle Road — three questions before signing"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The questions are not questions. “The guarantor thing” and “what happens if I need to leave early” name topics, not things that can be answered, and no clause is cited.","correct":true},{"text":"It undercuts itself. “I am interested” plus “is the flat still available” signals that the writer is early in the process, which invites a slower and vaguer reply.","correct":true},{"text":"Language: “the older people”, “family life”, “the government” over-articled; “do not care about their neighbours” is an unsupported claim about motives; and the nostalgia in the second sentence is doing the work that evidence should.","correct":false},{"text":"“Could you explain these things to me please” asks for an explanation of a contract rather than three facts, which is both more work for the reader and less useful to the writer.","correct":true},{"text":"Language: “the main responsible” (those mainly responsible); “the pollution of the rivers”, “the infrastructure”, “the government” over-articled; “the rivers are dying” is rhetoric standing in for the measurement the question needed.","correct":false},{"text":"“The developers are offering money which shows they are being responsible” treats the offer as evidence of good faith rather than examining whether it replaces what is lost.","correct":false}],"key_html":"F3"}};</script>
