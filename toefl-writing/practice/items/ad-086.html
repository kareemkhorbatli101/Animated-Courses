<script>window.ITEM={"kind":"exercise","id":"AD 086","slug":"ad-086","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Nutrition · policy choice","payload":{"Strategy":"choose the intervention that does not depend on attention","Grammar":"passive causatives","Vocabulary":"reformulation, labelling, salience, compliance","Convention":"choosing between information and product change"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Hana’s objection is about autonomy. Does reformulation actually restrict choice?\u003c/p>\u003cp>b.  Why does an intervention that \"requires nothing of anyone\" tend to work better?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is reformulation, and what is salience?\u003c/p>\u003cp>b.  What does compliance mean in a regulatory sense?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that answers the autonomy objection directly.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response argues that reformulation does not restrict choice. Is that the strongest reply to Hana?\u003c/p>\u003cp>b.  Why is the distributional point described as what settles it?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"having the limits set openly and the reductions published\" — what does the causative construction do?\u003c/p>\u003cp>b.  \"where almost nobody has the information to choose with\" — why end on this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Barely. It changes the composition of products on sale but forbids nothing, and discretionary salt remains available. Her objection assumes the salt in processed food is a consumer choice, which it mostly is not.\u003c/p>\u003cp>b.  Because it does not depend on attention, literacy, time or motivation, all of which are unevenly distributed and scarce exactly where intake is highest.\u003c/p>","P2":"\u003cp>a.  Reformulation is changing a product’s recipe to meet a standard; salience is how noticeable information is at the moment of choice.\u003c/p>\u003cp>b.  Whether regulated parties actually meet the requirement — which for a gradual limit is far easier to monitor than consumer behaviour.\u003c/p>","P3":"\u003cp>Model: \"Reformulate, because the salt in question was never chosen by the person eating it.\"\u003c/p>","F1":"\u003cp>a.  Yes, because it attacks the premise rather than outweighing it. Arguing that health beats autonomy concedes that autonomy is being overridden; showing that it is barely engaged leaves her objection with nothing to attach to.\u003c/p>\u003cp>b.  Because both policies have some effect, so effectiveness alone would be a matter of degree. The fact that labelling helps the already-healthy and widens inequality is a difference in kind, and it is decisive for a population measure.\u003c/p>","F2":"\u003cp>a.  It keeps the focus on the arrangement rather than on the agent, which suits a sentence about transparency: what matters is that limits are open and reductions published, not who publishes them.\u003c/p>\u003cp>b.  It returns the autonomy argument to Hana’s own terms and shows the shop to be the place where choice is least informed. That is a stronger ending than restating the health case.\u003c/p>","F3":"\u003cp>1.  \"Public health must take priority over individual preferences\" concedes that autonomy is being overridden, which gives Hana her argument back.\u003c/p>\u003cp>2.  The reason reformulation works — that it reaches people who never engage with the information — is stated only as \"people do not have time to read labels\", with nothing about distribution.\u003c/p>\u003cp>3.  The paragraph on salt and blood pressure answers a question nobody asked; neither speaker disputed that salt intake should fall.\u003c/p>"},"model":["Luis is right, and Hana’s objection applies less to reformulation than it first appears.","The autonomy argument needs the salt to be chosen, and mostly it is not. Salt in bread, sauces and processed meat is a manufacturing decision made before the shopper arrives, and a gradual limit changes what is on offer rather than what anyone is permitted to buy. Nobody is prevented from salting their food; the discretionary salt cellar is untouched, and it accounts for a small share of intake.","What settles it is distribution. Labelling works for people who read labels, and those are disproportionately the people already eating least salt, so an information policy widens the gap it is meant to close. Reformulation reaches everyone, including the people with the highest intake and the least time to be careful.","So I would reformulate, with labelling alongside rather than instead. Hana’s principle is better served by having the limits set openly and the reductions published than by leaving them to be chosen in a shop, where almost nobody has the information to choose with."],"model_html":"\u003cp>Luis is right, and Hana’s objection applies less to reformulation than it first appears.\u003c/p>\u003cp>The autonomy argument needs the salt to be chosen, and mostly it is not. Salt in bread, sauces and processed meat is a manufacturing decision made before the shopper arrives, and a gradual limit changes what is on offer rather than what anyone is permitted to buy. Nobody is prevented from salting their food; the discretionary salt cellar is untouched, and it accounts for a small share of intake.\u003c/p>\u003cp>What settles it is distribution. Labelling works for people who read labels, and those are disproportionately the people already eating least salt, so an information policy widens the gap it is meant to close. Reformulation reaches everyone, including the people with the highest intake and the least time to be careful.\u003c/p>\u003cp>So I would reformulate, with labelling alongside rather than instead. Hana’s principle is better served by having the limits set openly and the reductions published than by leaving them to be chosen in a shop, where almost nobody has the information to choose with.\u003c/p>","model_band":5,"degraded":["I agree with Luis that reformulation is more effective because most people do not have time to read labels when they are shopping, and even if they do, the information is often confusing. Salt causes high blood pressure which leads to heart disease and strokes, so this is a serious public health issue that governments have a duty to address. Hana talks about freedom of choice but public health must take priority over individual preferences in cases like this."],"degraded_html":"\u003cp>I agree with Luis that reformulation is more effective because most people do not have time to read labels when they are shopping, and even if they do, the information is often confusing. Salt causes high blood pressure which leads to heart disease and strokes, so this is a serious public health issue that governments have a duty to address. Hana talks about freedom of choice but public health must take priority over individual preferences in cases like this.\u003c/p>","degraded_band":3,"model_words":178,"fault_list":{"tag":"F3","faults":["\"Public health must take priority over individual preferences\" concedes that autonomy is being overridden, which gives Hana her argument back.","The reason reformulation works — that it reaches people who never engage with the information — is stated only as \"people do not have time to read labels\", with nothing about distribution.","The paragraph on salt and blood pressure answers a question nobody asked; neither speaker disputed that salt intake should fall."],"html":["\u003cp>1.  \"Public health must take priority over individual preferences\" concedes that autonomy is being overridden, which gives Hana her argument back.\u003c/p>","\u003cp>2.  The reason reformulation works — that it reaches people who never engage with the information — is stated only as \"people do not have time to read labels\", with nothing about distribution.\u003c/p>","\u003cp>3.  The paragraph on salt and blood pressure answers a question nobody asked; neither speaker disputed that salt intake should fall.\u003c/p>"]},"prof_name":"Professor Oyelaran","professor":"\u003cp>To reduce dietary salt intake, governments can require clear front-of-pack labelling, leaving the choice to consumers, or set mandatory limits that require manufacturers to reformulate products. Which approach should be preferred?\u003c/p>","students":[["Hana","Labelling. People have a right to choose what they eat, and a government that quietly changes recipes is making that decision for them."],["Luis","Nobody chooses the salt in bread. Reformulation worked in the UK because it required nothing of anyone — intake fell in people who never read a label in their lives."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The paragraph on salt and blood pressure answers a question nobody asked; neither speaker disputed that salt intake should fall.","correct":true},{"text":"“I have tried to contact you several times” contradicts the instruction not to duplicate and is vague; nothing explains why email is being used now.","correct":false},{"text":"Language. “explain me” (explain to me), “master students” (postgraduates, or master’s students), “I wait your reply” (I look forward to your reply), and a comma splice running through the whole central sentence.","correct":false},{"text":"The reason reformulation works — that it reaches people who never engage with the information — is stated only as “people do not have time to read labels”, with nothing about distribution.","correct":true},{"text":"No real cost is named. “A bit hard coming back” is mentioned and immediately dismissed as normal, so the second bullet fails and the one piece of evidence the writer has is wasted.","correct":false},{"text":"“Public health must take priority over individual preferences” concedes that autonomy is being overridden, which gives Hana her argument back.","correct":true}],"key_html":"F3"}};</script>
