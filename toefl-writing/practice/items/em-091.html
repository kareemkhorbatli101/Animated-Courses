<script>window.ITEM={"kind":"exercise","id":"EM 091","slug":"em-091","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Negotiation and rescheduling · anchor item","payload":{"Strategy":"open with what you can give, not with what you need","Grammar":"conditional concession pairs; would be willing to","Vocabulary":"accommodate, flexible, at a push, work around","Convention":"negotiating with someone who holds all the authority"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Your supervisor holds all the power here. How does that change the shape of a negotiation?\u003c/p>\u003cp>b.  The second bullet says “without going into private detail”. How much is enough?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which of these offers flexibility and which claims it: \u003cem>I am flexible\u003c/em> · \u003cem>I could do any afternoon\u003c/em> · \u003cem>whatever suits you\u003c/em>?\u003c/p>\u003cp>b.  What does \u003cem>at a push\u003c/em> mean, and what does it signal about the limit of your flexibility?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline Monday at eight while making clear that you are not simply refusing to be inconvenienced. One sentence, under 30 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “Unfortunately Mondays at 8 are impossible for me, could we find another time?” a weak reply despite being perfectly polite?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email opens by thanking the supervisor for the very thing it is about to decline. Why does that work?\u003c/p>\u003cp>b.  The writer offers three options. Rank them by how much they cost her, and say why offering the most expensive one last is deliberate.\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “I \u003cem>could manage\u003c/em> an early one roughly once a month”. Why \u003cem>could\u003c/em> and not \u003cem>can\u003c/em>?\u003c/p>\u003cp>b.  “I would much rather say so now than cancel at short notice later.” Identify the structure and say what the parallel is doing for the argument.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>a family commitment first thing on weekdays\u003c/em> — how much has she disclosed, and why is that the right amount?\u003c/p>\u003cp>b.  Why \u003cem>I will work around it\u003c/em> as the last line, rather than \u003cem>please let me know what you decide\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A group has scheduled its weekly meeting at a time you can never make. In 60 words: thank them, decline, and offer two alternatives of different cost to you.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  You cannot trade, so you must make agreeing attractive instead. That means: concede the legitimacy of their proposal, give them more than one way to say yes, and make clear that the decision remains theirs.\u003c/p>\u003cp>b.  Enough to show the constraint is real and recurring, and not a preference. \u003cem>A family commitment first thing on weekdays\u003c/em> does that in seven words. More would invite a judgement about whether your reason is good enough; less would sound like reluctance.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>I could do any afternoon\u003c/strong> offers it — it names a usable range. The other two \u003cem>claim\u003c/em> flexibility while leaving the reader to do the work of finding a time, and \u003cem>whatever suits you\u003c/em> is doubly unhelpful after you have just ruled something out.\u003c/p>\u003cp>b.  “With difficulty, but possible.” It marks the limit of what you are offering, which is more useful than a vague yes: it tells the reader not to make it a habit.\u003c/p>","P3":"\u003cp>Model: \u003cem>Monday mornings are the one part of the week I cannot manage — I would much rather say so now than cancel at short notice later in the term.\u003c/em>\u003c/p>\u003cp>\u003cem>The one part of the week\u003c/em> is doing a lot: it marks this as a single narrow exception rather than the first of many, which is the fear any supervisor has when a student starts negotiating.\u003c/p>","P4":"\u003cp>Because it makes the problem the reader’s to solve. It declines, gives no alternative, and asks them to go back to a diary they have already worked through once. \u003cem>Impossible\u003c/em> is also absolute where the truth is not — the writer could in fact manage one occasionally, and saying so is what turns a refusal into a negotiation.\u003c/p>","F1":"\u003cp>a.  Because the thanks is genuine and specific: a fixed weekly slot really is a favour, and acknowledging it establishes that the writer is not being difficult about the principle, only the hour. It also means the email does not open on a negative.\u003c/p>\u003cp>b.  Cheapest: any weekday afternoon. Then Monday afternoon, which costs her nothing extra but gives him what he wanted. Most expensive: a monthly early start. Offering the costly one last makes it read as a concession rather than an opening position — and it is placed where he will remember it, attached to a concrete proposal about how to use it.\u003c/p>","F2":"\u003cp>a.  \u003cem>Could\u003c/em> marks it as an effort she is willing to make rather than a routine availability. \u003cem>Can\u003c/em> would file it alongside the afternoons as another normal option, and she would find herself doing it weekly.\u003c/p>\u003cp>b.  \u003cem>would rather … than\u003c/em> with two bare infinitives (\u003cem>say\u003c/em>, \u003cem>cancel\u003c/em>) — family 7, structure 57. The parallel frames her refusal as the responsible of two options, so declining now becomes evidence of reliability rather than of difficulty.\u003c/p>","F3":"\u003cp>a.  Almost nothing: that it involves family, that it is in the morning, and that it recurs. That is the right amount because it establishes the three properties that matter — real, regular, non-negotiable — while leaving no opening for her supervisor to weigh her private life against his timetable.\u003c/p>\u003cp>b.  Because it returns the authority explicitly and ends on co-operation. \u003cem>Let me know what you decide\u003c/em> is neutral but slightly passive; \u003cem>I will work around it\u003c/em> promises effort after the decision, which is the reassurance a supervisor actually wants from a student who has just declined something.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>No real alternatives.\u003c/strong> “I am flexible and any other time is good for me” offers nothing usable and contradicts the paragraph that has just explained a constraint. The third bullet is unmet.\u003c/p>\u003cp>2.  \u003cstrong>The reason is both vague and over-shared.\u003c/strong> “some personal problems which I cannot explain here” gestures at something private without naming its shape, which invites more curiosity than a plain statement would. “I think also for most of the students” then recruits imaginary allies, which is presumptuous.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Dear Professor” without the name when it was in the address line, “impossible” as an absolute, “a time which is more convenient” (more convenient for whom?), and “Thank you for understanding my situation”, which thanks him in advance for agreeing and so removes his choice.\u003c/p>","F5":"\u003cp>Model: \u003cem>Thanks for getting a regular slot fixed — that will help a lot. Thursday at five is the one evening I can never do, as I work until seven. Any lunchtime works for me, and Wednesday lunchtime would suit the group best as far as I can tell; failing that, I could do Thursday late once a fortnight.\u003c/em>\u003c/p>"},"model":["Dear Professor Delacroix,","Thank you for sorting out a regular slot — having a fixed time each week will make a real difference.","Monday mornings are the one part of the week I cannot manage, unfortunately: I have a family commitment first thing on weekdays and I am forty minutes out, so an eight o’clock start is not something I could do reliably. I would much rather say so now than cancel at short notice later in the term.","Any weekday afternoon works for me, and Monday afternoon would keep the start-of-week rhythm you were after. If a morning is genuinely easier for your diary, I could manage an early one roughly once a month, so we could put the longer reviews there and keep the shorter catch-ups to the afternoon.","Whichever suits you best, I will work around it.","With best wishes,","Aisha Rahman"],"model_html":"\u003cp>Dear Professor Delacroix,\u003c/p>\u003cp>Thank you for sorting out a regular slot — having a fixed time each week will make a real difference.\u003c/p>\u003cp>Monday mornings are the one part of the week I cannot manage, unfortunately: I have a family commitment first thing on weekdays and I am forty minutes out, so an eight o’clock start is not something I could do reliably. I would much rather say so now than cancel at short notice later in the term.\u003c/p>\u003cp>Any weekday afternoon works for me, and Monday afternoon would keep the start-of-week rhythm you were after. If a morning is genuinely easier for your diary, I could manage an early one roughly once a month, so we could put the longer reviews there and keep the shorter catch-ups to the afternoon.\u003c/p>\u003cp>Whichever suits you best, I will work around it.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Aisha Rahman\u003c/p>","model_band":5,"degraded":["Dear Professor,","Unfortunately Monday 8 a.m. is impossible for me because I live very far from the campus and also I have some personal problems in the mornings which I cannot explain here. It is really too early for me and I think also for most of the students. Could we please find another time which is more convenient? I am flexible and any other time is good for me.","Thank you for understanding my situation."],"degraded_html":"\u003cp>Dear Professor,\u003c/p>\u003cp>Unfortunately Monday 8 a.m. is impossible for me because I live very far from the campus and also I have some personal problems in the mornings which I cannot explain here. It is really too early for me and I think also for most of the students. Could we please find another time which is more convenient? I am flexible and any other time is good for me.\u003c/p>\u003cp>Thank you for understanding my situation.\u003c/p>","degraded_band":3,"model_words":147,"fault_list":{"tag":"F4","faults":["No real alternatives. “I am flexible and any other time is good for me” offers nothing usable and contradicts the paragraph that has just explained a constraint. The third bullet is unmet.","The reason is both vague and over-shared. “some personal problems which I cannot explain here” gestures at something private without naming its shape, which invites more curiosity than a plain statement would. “I think also for most of the students” then recruits imaginary allies, which is presumptuous.","Language and register. “Dear Professor” without the name when it was in the address line, “impossible” as an absolute, “a time which is more convenient” (more convenient for whom?), and “Thank you for understanding my situation”, which thanks him in advance for agreeing and so removes his choice."],"html":["\u003cp>1.  \u003cstrong>No real alternatives.\u003c/strong> “I am flexible and any other time is good for me” offers nothing usable and contradicts the paragraph that has just explained a constraint. The third bullet is unmet.\u003c/p>","\u003cp>2.  \u003cstrong>The reason is both vague and over-shared.\u003c/strong> “some personal problems which I cannot explain here” gestures at something private without naming its shape, which invites more curiosity than a plain statement would. “I think also for most of the students” then recruits imaginary allies, which is presumptuous.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Dear Professor” without the name when it was in the address line, “impossible” as an absolute, “a time which is more convenient” (more convenient for whom?), and “Thank you for understanding my situation”, which thanks him in advance for agreeing and so removes his choice.\u003c/p>"]},"scenario":"\u003cp>Your supervisor has proposed moving your weekly meeting to Monday at eight in the morning. You live forty minutes away and have a caring responsibility on weekday mornings. You can do any afternoon, and you could manage an early start once a month if it were essential.\u003c/p>","bullets":["Respond to the proposal.","Explain your constraint without going into private detail.","Offer alternatives that give them a real choice."],"header":[["To:","r.delacroix@northgate.ac.uk"],["Subject:","Weekly supervision — timing"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language. “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.","correct":false},{"text":"Language and register. “Dear Professor” without the name when it was in the address line, “impossible” as an absolute, “a time which is more convenient” (more convenient for whom?), and “Thank you for understanding my situation”, which thanks him in advance for agreeing and so removes his choice.","correct":true},{"text":"The point about unmeasured subjects is a real one but it is asserted and dropped, and “each country should develop its own system” is the conclusion of no argument.","correct":false},{"text":"No real alternatives. “I am flexible and any other time is good for me” offers nothing usable and contradicts the paragraph that has just explained a constraint. The third bullet is unmet.","correct":true},{"text":"Neither speaker is engaged: Mei’s efficiency argument and Arno’s point about prognosis tracking advantage are both left untouched, and “every human life has equal value” is asserted without being connected to either rule.","correct":false},{"text":"The reason is both vague and over-shared. “some personal problems which I cannot explain here” gestures at something private without naming its shape, which invites more curiosity than a plain statement would. “I think also for most of the students” then recruits imaginary allies, which is presumptuous.","correct":true}],"key_html":"F4"}};</script>
