<script>window.ITEM={"kind":"exercise","id":"AD 004","slug":"ad-004","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business and economics · cause ranking","payload":{"Strategy":"rank by what is removable, not by what is largest","Grammar":"causal chain with result clauses","Vocabulary":"barrier to entry, network effect, moat","Convention":"ranking causes when one of them is unfashionable"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Lea treats concentration as natural and Sam as chosen. Which claim is easier to test?\u003c/p>\u003cp>b.  What would a third cause have to explain to beat both?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a barrier to entry, and what is a moat in this context?\u003c/p>\u003cp>b.  Why does \"network effect\" sound like an excuse and \"acquisition\" like an accusation?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using a removability test.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response uses Lea’s strongest fact against her. Which fact, and how?\u003c/p>\u003cp>b.  Why does it end by calling network effects \"the constant rather than the variable\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"with the result that the effect stopped conferring durable dominance\" — why a result clause rather than \"so\"?\u003c/p>\u003cp>b.  \"at the moment the competitor disappears\" — what does this phrase add that \"when it is bought\" would not?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Sam’s. Enforcement decisions are documented events — you can list the acquisitions that were and were not blocked. \"The market tends this way naturally\" is much harder to falsify.\u003c/p>\u003cp>b.  It would have to explain why the same forces produced concentration here and not in earlier markets with the same properties. That is the test the response applies.\u003c/p>","P2":"\u003cp>a.  A barrier to entry is anything that makes it costly for a new firm to compete; a moat is the incumbent’s term for the same thing seen from inside — a durable advantage that protects existing profits.\u003c/p>\u003cp>b.  Because one names a property of the system and the other names an act by a person. Which word a discussion settles on often decides the policy conclusion before any evidence is examined, which is worth noticing when it happens to you.\u003c/p>","P3":"\u003cp>Model: \"Network effects were present in markets that did not concentrate, so the variable is enforcement, with data cost as the reason acquisitions are worth making.\"\u003c/p>","F1":"\u003cp>a.  The telephone network. Lea offers network effects as a natural law; the telephone case shows the same law producing a different outcome under different regulation, which converts her constant into Sam’s variable.\u003c/p>\u003cp>b.  Because a cause that is always present cannot explain an outcome that varies. It is the same move as distinguishing a necessary from a sufficient condition, expressed in a way a reader remembers.\u003c/p>","F2":"\u003cp>a.  Because \"so\" would suggest a loose consequence, where the argument needs the regulation to be the specific thing that disarmed the effect. A result clause states a determinate outcome, which is what makes the counter-example bite.\u003c/p>\u003cp>b.  It makes the timing the point: the data advantage deepens exactly when the competitive threat ends, so the two effects compound. \"When it is bought\" would report the transaction; the fuller phrase reports the mechanism.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, although ranking was the question.\u003c/p>\u003cp>2.  Each cause is restated in the classmates’ own terms with nothing added, and the closing recommendation — stronger laws, more choice, better prices — follows from nothing in the response.\u003c/p>\u003cp>3.  Language: \"all the three factors\" (all three), \"they are working together\" for a general truth (work), \"the governments\" (governments).\u003c/p>"},"model":["Sam has the better of this, and the reason is in his own example. Lea is right that network effects are a property of the market rather than a wrongdoing, but telephone networks had them too and were regulated into interoperability, with the result that the effect stopped conferring durable dominance. So network effects are a necessary condition and not a sufficient one, which makes them a poor candidate for the main driver — they were present in cases that ended differently.","Where I would add something is the data cost, which neither of them ranks. It matters less as a barrier than as a reason acquisitions are so valuable: a firm buys a rival not for its revenue but for its behavioural data, which deepens its own advantage at the moment the competitor disappears. That links the two causes rather than ranking them separately. If I had to order them I would put enforcement first, because it is the only one a government can change, data second as the thing enforcement is failing to price, and network effects third — real, but the constant in the equation rather than the variable."],"model_html":"\u003cp>Sam has the better of this, and the reason is in his own example. Lea is right that network effects are a property of the market rather than a wrongdoing, but telephone networks had them too and were regulated into interoperability, with the result that the effect stopped conferring durable dominance. So network effects are a necessary condition and not a sufficient one, which makes them a poor candidate for the main driver — they were present in cases that ended differently.\u003c/p>\u003cp>Where I would add something is the data cost, which neither of them ranks. It matters less as a barrier than as a reason acquisitions are so valuable: a firm buys a rival not for its revenue but for its behavioural data, which deepens its own advantage at the moment the competitor disappears. That links the two causes rather than ranking them separately. If I had to order them I would put enforcement first, because it is the only one a government can change, data second as the thing enforcement is failing to price, and network effects third — real, but the constant in the equation rather than the variable.\u003c/p>","model_band":5,"degraded":["I think all the three factors mentioned by the professor are important and they are working together to create this situation. Lea is right about the network effects because people want to use the same platform as their friends, and Sam is right that the governments should control the big acquisitions better. Also the data is very important because the companies who have more data can make better products. So my opinion is that we need stronger laws and more competition in the market so the consumers will have more choice and better prices."],"degraded_html":"\u003cp>I think all the three factors mentioned by the professor are important and they are working together to create this situation. Lea is right about the network effects because people want to use the same platform as their friends, and Sam is right that the governments should control the big acquisitions better. Also the data is very important because the companies who have more data can make better products. So my opinion is that we need stronger laws and more competition in the market so the consumers will have more choice and better prices.\u003c/p>","degraded_band":3,"model_words":190,"fault_list":{"tag":"F3","faults":["It refuses to rank, although ranking was the question.","Each cause is restated in the classmates’ own terms with nothing added, and the closing recommendation — stronger laws, more choice, better prices — follows from nothing in the response.","Language: \"all the three factors\" (all three), \"they are working together\" for a general truth (work), \"the governments\" (governments)."],"html":["\u003cp>1.  It refuses to rank, although ranking was the question.\u003c/p>","\u003cp>2.  Each cause is restated in the classmates’ own terms with nothing added, and the closing recommendation — stronger laws, more choice, better prices — follows from nothing in the response.\u003c/p>","\u003cp>3.  Language: \"all the three factors\" (all three), \"they are working together\" for a general truth (work), \"the governments\" (governments).\u003c/p>"]},"prof_name":"Professor Danquah","professor":"\u003cp>A handful of firms dominate most digital markets. Explanations include network effects, the cost of data, and weak enforcement of competition law. Which of these do you think most explains the concentration?\u003c/p>","students":[["Lea","Network effects. A platform gets better as more people use it, so the leader pulls away for reasons that have nothing to do with conduct. It is a property of the market, not a wrongdoing."],["Sam","Enforcement. Network effects are real but they are not new — telephone networks had them. What is new is that regulators stopped blocking acquisitions, so leaders bought the competitors who might have displaced them."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It accuses the machine of theft and the office of indifference. “stole”, “of course nobody answered”, “always broken”, “wasting our money”. None of it is actionable and all of it invites a defensive reply.","correct":false},{"text":"Language: “all the three factors” (all three), “they are working together” for a general truth (work), “the governments” (governments).","correct":true},{"text":"Nobody is named, the number affected is “a few”, and no refund is offered — “if the people affected want to discuss compensation they can contact me” makes them ask. The third bullet fails.","correct":false},{"text":"“Very confusing and makes it impossible to plan” is a complaint about the institution’s communication, and “several times” is vaguer than the three and one the writer could have counted.","correct":false},{"text":"Each cause is restated in the classmates’ own terms with nothing added, and the closing recommendation — stronger laws, more choice, better prices — follows from nothing in the response.","correct":true},{"text":"It refuses to rank, although ranking was the question.","correct":true}],"key_html":"F3"}};</script>
