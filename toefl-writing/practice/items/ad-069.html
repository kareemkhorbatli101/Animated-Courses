<script>window.ITEM={"kind":"exercise","id":"AD 069","slug":"ad-069","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Statistics · agree / disagree","payload":{"Strategy":"distinguish a measurement problem from a substantive one","Grammar":"defining relative clauses","Vocabulary":"proxy, construct, validity, confounding","Convention":"challenging what a number measures"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Leila’s objection is about a feedback effect. State it in one sentence.\u003c/p>\u003cp>b.  Does Kofi’s \"better than nothing\" survive that objection?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a proxy, and what is construct validity?\u003c/p>\u003cp>b.  What does it mean for a measure to be gamed?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence about when a bad measure is worse than none.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says Kofi is making the wrong comparison. What is the right one?\u003c/p>\u003cp>b.  Why does it concede that transparency is a real gain?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a bad measure is worse than none whenever it is consequential enough to be optimised against\" — what does the relative clause do?\u003c/p>\u003cp>b.  \"the correlation that justified the proxy is the first thing destroyed\" — why end the paragraph here?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the act of measuring changes the behaviour being measured, so the measure’s validity degrades as its influence grows.\u003c/p>\u003cp>b.  Only if the alternative to a ranking is genuinely a vacuum. If the ranking actively redirects institutional spending, the comparison is between rumour and distorted incentives, which is a different question.\u003c/p>","P2":"\u003cp>a.  A proxy is an observable stand-in for something that cannot be measured directly; construct validity is the extent to which it actually captures the intended concept.\u003c/p>\u003cp>b.  To raise the score without improving the underlying quality it was meant to indicate.\u003c/p>","P3":"\u003cp>Model: \"A bad measure is worse than none once it is consequential enough that institutions reorganise around it.\"\u003c/p>","F1":"\u003cp>a.  Between the ranking and the world the ranking creates — not between the ranking and silence. Once a measure changes behaviour, the pre-measurement world is no longer the alternative on offer.\u003c/p>\u003cp>b.  Because it is true and because the concession isolates the real disagreement. Granting that rankings improve accountability makes the subsequent point — that accountability for the wrong quantity is of little value — harder to deflect.\u003c/p>","F2":"\u003cp>a.  It restricts the claim to a defined condition, so the response is not asserting that all imperfect measures are harmful. That restriction is what makes the position defensible and also identifies which rankings are the problem.\u003c/p>\u003cp>b.  Because it names the precise mechanism of the failure in one clause. The proxy was justified by a correlation, and optimisation attacks that correlation first, which is a sharper claim than saying the measure becomes inaccurate.\u003c/p>","F3":"\u003cp>1.  \"They create pressure and stress\" and \"many excellent universities are ranked low\" are complaints about rankings, not answers to Kofi’s argument that the alternative is worse.\u003c/p>\u003cp>2.  Leila’s feedback point is restated rather than developed — nothing explains why optimisation undermines the measure itself.\u003c/p>\u003cp>3.  \"Students should choose based on what is right for them personally\" is advice to individuals where the question is about an institutional measure, so the response never addresses the comparison it was asked to make.\u003c/p>"},"model":["Leila has the stronger argument, and the reason is that Kofi is comparing a ranking to no information when he should be comparing it to the behaviour it causes.","His point about transparency is fair. A published criterion can be disputed in a way that reputation cannot, and that is a genuine gain over a sector ordered by rumour. But it is a gain in accountability, not in accuracy, and accountability for the wrong quantity is not obviously worth having.","The effect Leila describes is what settles it. A measure that changes what it measures stops being a proxy for the thing and becomes a target in its own right. Spending per student was chosen because it correlated with teaching quality; once universities allocate budgets to raise it, the correlation that justified the proxy is the first thing destroyed.","So my position is narrow: a bad measure is worse than none whenever it is consequential enough to be optimised against. Rankings that nobody acted on would be harmless and useless; rankings that drive admissions and funding are neither, and that is precisely why the measurement problem here is a substantive one."],"model_html":"\u003cp>Leila has the stronger argument, and the reason is that Kofi is comparing a ranking to no information when he should be comparing it to the behaviour it causes.\u003c/p>\u003cp>His point about transparency is fair. A published criterion can be disputed in a way that reputation cannot, and that is a genuine gain over a sector ordered by rumour. But it is a gain in accountability, not in accuracy, and accountability for the wrong quantity is not obviously worth having.\u003c/p>\u003cp>The effect Leila describes is what settles it. A measure that changes what it measures stops being a proxy for the thing and becomes a target in its own right. Spending per student was chosen
