<script>window.ITEM={"kind":"exercise","id":"EM 051","slug":"em-051","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice · anchor item","payload":{"Strategy":"recommend by matching the thing to the person, not by praising it","Grammar":"the subjunctive after recommend; worth + gerund","Vocabulary":"suit, demanding, well regarded, a good fit","Convention":"advising a peer without presuming authority over their choice"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The third bullet matters more than it looks. What goes wrong if you skip it?\u003c/p>\u003cp>b.  Why would a recommendation that only lists the better module’s merits be a worse answer than one that names its drawback?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which of these describes a course that is hard work, and which a course that is highly thought of?\u003c/p>\u003cpre class=\"mono\">demanding · well regarded · intensive · sought after\u003c/pre>\u003cp>b.  Complete: it would ______ you ; it is ______ doing ; it is a good ______ for your strengths.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Recommend one module in a single sentence that refers to your friend’s strengths rather than to the module’s quality. Under 30 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>What is wrong with “You should definitely take Urban Systems, it is much better”?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer recommends the module they liked less. Why does that make the advice more useful?\u003c/p>\u003cp>b.  Find the sentence that hands the decision back. What stops it sounding like a retraction?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “Given that coursework is where you are strongest…” Identify the structure after \u003cem>where\u003c/em> and name the device. (You built it in family 8.)\u003c/p>\u003cp>b.  “if you would rather be taught well than assessed kindly”. Two passives inside a \u003cem>would rather … than\u003c/em> frame. Why is the parallelism worth the effort?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>For what it is worth\u003c/em> — what does it do to the authority of everything that follows, and why is that useful between peers?\u003c/p>\u003cp>b.  Why \u003cem>honestly a bit dry\u003c/em> rather than \u003cem>quite boring\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A friend asks whether to live in halls or a shared flat next year. In 60 words: recommend one, name its real drawback, and leave the choice with them.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  You take responsibility for an outcome you will not live with. Advice that forecloses the decision also makes it awkward for your friend to choose differently, which is a cost to them and to you.\u003c/p>\u003cp>b.  Because a recommendation with no drawback is not information — it is enthusiasm. Naming the weakness of the thing you are recommending is the fastest way to be believed about its strengths.\u003c/p>","P2":"\u003cp>a.  Hard work: \u003cstrong>demanding\u003c/strong> and \u003cstrong>intensive\u003c/strong>. Highly thought of: \u003cstrong>well regarded\u003c/strong> and \u003cstrong>sought after\u003c/strong> — though the last also implies competition for places.\u003c/p>\u003cp>b.  it would \u003cstrong>suit\u003c/strong> you ; it is \u003cstrong>worth\u003c/strong> doing ; a good \u003cstrong>fit\u003c/strong> for your strengths.\u003c/p>","P3":"\u003cp>Model: \u003cem>I would take Coastal Processes, mainly because it is all coursework and that is where you are strongest.\u003c/em>\u003c/p>\u003cp>The subject of the recommendation is your friend, not the module. That is what separates advice from a review.\u003c/p>","P4":"\u003cp>\u003cem>Definitely\u003c/em> removes their judgement from the process, and \u003cem>it is much better\u003c/em> is a claim about the module in the abstract — better for whom, at what? It also fails the second bullet entirely: no trade-off is named, so your friend cannot weigh anything. And it is a comma splice.\u003c/p>","F1":"\u003cp>a.  Because it demonstrates that the recommendation is built on your friend’s situation rather than on your own taste. Anyone can recommend what they enjoyed; recommending against your own preference proves you have actually done the matching.\u003c/p>\u003cp>b.  “That said, if you would rather be taught well than assessed kindly, Urban Systems is the one, and I would not try to talk you out of it.” It does not sound like a retraction because it names the condition under which the other choice is right — so it is a refinement of the advice, not a withdrawal of it.\u003c/p>","F2":"\u003cp>a.  \u003cem>where you are strongest\u003c/em> is a wh-clause used as a complement — a wh-cleft in miniature. It puts the key fact about your friend in the strongest slot in the sentence, just before the recommendation lands.\u003c/p>\u003cp>b.  Because the two halves are being weighed against each other, and parallel grammar is what lets a reader feel the weighing. \u003cem>taught well\u003c/em> against \u003cem>assessed kindly\u003c/em> — same structure, same length, opposed adverbs. Break the parallel and the choice stops being clean.\u003c/p>","F3":"\u003cp>a.  It marks the advice as one person’s view, offered without claim to authority. Between peers that is exactly right: you have information your friend lacks, but no standing to decide for them, and the phrase makes that distinction in five words.\u003c/p>\u003cp>b.  \u003cem>Honestly\u003c/em> signals that you are saying something against your own recommendation, which raises your credibility. \u003cem>A bit dry\u003c/em> is also calibrated — it concedes the flaw without overstating it, where \u003cem>quite boring\u003c/em> would undercut the advice you are about to give.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>No trade-off.\u003c/strong> The second bullet asked for the choice to be explained honestly; this gives one module all the virtues and the other all the faults, which tells the reader nothing about their own decision — above all, the assessment method, which is the one fact that matters for them, never appears.\u003c/p>\u003cp>2.  \u003cstrong>The decision is taken away.\u003c/strong> “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> Three comma splices (“Urban Systems, it is much better”, “a lot of interesting things, everybody”, “really boring and the lectures are terrible, the teacher”), and “is just reading” for a habitual fact (just reads).\u003c/p>","F5":"\u003cp>Model: \u003cem>I would go for the shared flat, mostly because you cook and halls catering would drive you mad by November. The real cost is admin — bills, a contract, and somebody has to chase the landlord, and that somebody is usually whoever minds most. If you would rather not think about any of that, halls is the easier year.\u003c/em>\u003c/p>"},"model":["Hi Jola,","For what it is worth, I would take Coastal Processes, mainly because of how it is assessed rather than because it is the better module.","Urban Systems is the better-taught of the two — Dr Weir is excellent and you would come out knowing more. But it is seventy per cent examination, and a hard exam at that: a lot of recall under time pressure. Coastal Processes is honestly a bit dry, and the lectures are read off slides, but it is two long pieces of coursework and no exam at all. Given that coursework is where you are strongest, I think you would come out with a better mark and a much better term.","That said, if you would rather be taught well than assessed kindly, Urban Systems is the one, and I would not try to talk you out of it. Happy to send you my notes from either if that helps you decide.","Dan"],"model_html":"\u003cp>Hi Jola,\u003c/p>\u003cp>For what it is worth, I would take Coastal Processes, mainly because of how it is assessed rather than because it is the better module.\u003c/p>\u003cp>Urban Systems is the better-taught of the two — Dr Weir is excellent and you would come out knowing more. But it is seventy per cent examination, and a hard exam at that: a lot of recall under time pressure. Coastal Processes is honestly a bit dry, and the lectures are read off slides, but it is two long pieces of coursework and no exam at all. Given that coursework is where you are strongest, I think you would come out with a better mark and a much better term.\u003c/p>\u003cp>That said, if you would rather be taught well than assessed kindly, Urban Systems is the one, and I would not try to talk you out of it. Happy to send you my notes from either if that helps you decide.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi,","You should definitely take Urban Systems, it is much better than the other one. The teacher is very good and you will learn a lot of interesting things, everybody in my year liked it. Coastal Processes is really boring and the lectures are terrible, the teacher is just reading the slides all the time. So in my opinion there is no question, choose Urban Systems, you will not regret it. Trust me, I did both of them.","Dan"],"degraded_html":"\u003cp>Hi,\u003c/p>\u003cp>You should definitely take Urban Systems, it is much better than the other one. The teacher is very good and you will learn a lot of interesting things, everybody in my year liked it. Coastal Processes is really boring and the lectures are terrible, the teacher is just reading the slides all the time. So in my opinion there is no question, choose Urban Systems, you will not regret it. Trust me, I did both of them.\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":159,"fault_list":{"tag":"F4","faults":["No trade-off. The second bullet asked for the choice to be explained honestly; this gives one module all the virtues and the other all the faults, which tells the reader nothing about their own decision — above all, the assessment method, which is the one fact that matters for them, never appears.","The decision is taken away. “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.","Language. Three comma splices (“Urban Systems, it is much better”, “a lot of interesting things, everybody”, “really boring and the lectures are terrible, the teacher”), and “is just reading” for a habitual fact (just reads)."],"html":["\u003cp>1.  \u003cstrong>No trade-off.\u003c/strong> The second bullet asked for the choice to be explained honestly; this gives one module all the virtues and the other all the faults, which tells the reader nothing about their own decision — above all, the assessment method, which is the one fact that matters for them, never appears.\u003c/p>","\u003cp>2.  \u003cstrong>The decision is taken away.\u003c/strong> “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> Three comma splices (“Urban Systems, it is much better”, “a lot of interesting things, everybody”, “really boring and the lectures are terrible, the teacher”), and “is just reading” for a habitual fact (just reads).\u003c/p>"]},"scenario":"\u003cp>A friend in the year below has asked which of two optional modules to take. You took both. One is better taught but heavily assessed by examination; the other is easier work but genuinely dull. Your friend is strong in coursework and anxious about exams.\u003c/p>","bullets":["Give your recommendation.","Explain the trade-off honestly.","Leave the decision with them."],"header":[["To:","j.okafor@northgate.ac.uk"],["Subject:","Those two optional modules"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language. Three comma splices (“Urban Systems, it is much better”, “a lot of interesting things, everybody”, “really boring and the lectures are terrible, the teacher”), and “is just reading” for a habitual fact (just reads).","correct":true},{"text":"“Users should report the abuse” places a duty on the harmed party without noticing. Language: “the platforms”, “the safety of their users”, “the most serious cases” over-articled; “artificial intelligence” is invoked as though it were a resource rather than a method.","correct":false},{"text":"No trade-off. The second bullet asked for the choice to be explained honestly; this gives one module all the virtues and the other all the faults, which tells the reader nothing about their own decision — above all, the assessment method, which is the one fact that matters for them, never appears.","correct":true},{"text":"Language: “the governments”, “the people”, “the technology” all over-articled; “the human situations” is vague; and the opening sentence contributes nothing.","correct":false},{"text":"Language: “the health of the patients”, “the machines”, “the doctors” over-articled; “we cannot take any risk with human lives” is an absolute that no medical system has ever met.","correct":false},{"text":"The decision is taken away. “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.","correct":true}],"key_html":"F4"}};</script>
