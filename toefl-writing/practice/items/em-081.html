<script>window.ITEM={"kind":"exercise","id":"EM 081","slug":"em-081","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and chasing · anchor item","payload":{"Strategy":"make it easy to be the person who finally answers","Grammar":"the present perfect continuous for duration; tentative reminder forms","Vocabulary":"chase, bear with, in hand, come back to me, nudge","Convention":"persisting without accusing, and escalating without threatening"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  This is your third contact. What is the one thing you must not do, and what does the reader most need from you?\u003c/p>\u003cp>b.  What is the specific thing to ask for, given that asking for the money has already failed twice?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \u003cem>in hand\u003c/em> mean in an office reply, and what does it not promise?\u003c/p>\u003cp>b.  Which are gentle and which are sharp: \u003cem>to chase\u003c/em> · \u003cem>to nudge\u003c/em> · \u003cem>to follow up\u003c/em> · \u003cem>to escalate\u003c/em>?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Say that seven weeks have passed, without the sentence implying that anyone has been idle. One sentence.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Which of these is the band-5 ask?\u003c/p>\u003cpre class=\"mono\">(A) Could you please process this immediately?\n(B) If I have not heard by Friday I will raise it with the\n    department office.\n(C) Could you tell me which stage it has reached, and\n    roughly when I might expect it?\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer explicitly declines to ask for the obvious thing. Find the phrase, and explain why not asking for the money is the fastest way to get it.\u003c/p>\u003cp>b.  One sentence offers an explanation that would make the delay the writer’s own fault. Why include it?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “It \u003cem>has now been\u003c/em> about seven weeks … and nothing \u003cem>has appeared\u003c/em>”. Why two present perfects rather than a simple past?\u003c/p>\u003cp>b.  “which I am sure it is”. What does \u003cem>it is\u003c/em> stand in for, and what would be lost by writing it out?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>bearing with me\u003c/em> in the closing, when the waiting has all been done by the writer?\u003c/p>\u003cp>b.  \u003cem>Rather than ask you to hurry it\u003c/em> — what is the rhetorical effect of naming the request you are choosing not to make?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A reference you requested a month ago has still not been sent and the application closes in a week. In 60 words, chase your referee without accusing them and give them the easiest possible route to acting.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  You must not accuse — the person reading this is probably not the person who stalled it, and may be able to help only if they feel able to. What they most need is the reference number and the dates, so they can find the case in under a minute.\u003c/p>\u003cp>b.  Information. Money requires authorisation this reader may not have; a status and an estimated date are things almost any clerk can supply from the screen in front of them. Ask for what the reader can actually give, and you get a reply instead of silence.\u003c/p>","P2":"\u003cp>a.  It means “it is in our system and someone has it”. It promises no date, no stage and no outcome — which is exactly why the model asks for a stage and a date.\u003c/p>\u003cp>b.  Gentle: \u003cstrong>nudge\u003c/strong> and \u003cstrong>follow up\u003c/strong>. Neutral to sharp: \u003cstrong>chase\u003c/strong> — common in British office English and not rude, but it does say that somebody is late. \u003cstrong>Escalate\u003c/strong> is sharp: it announces that you are going above the reader’s head.\u003c/p>","P3":"\u003cp>Model: \u003cem>It has now been about seven weeks, though, and nothing has appeared in my account.\u003c/em>\u003c/p>\u003cp>No agent anywhere. Time has passed and an event has not occurred; nobody has failed to do anything. \u003cem>About\u003c/em> also matters — an exact count of days reads as a grievance being maintained.\u003c/p>","P4":"\u003cp>\u003cstrong>(C).\u003c/strong> (A) asks for speed, which the reader may not control, and \u003cem>immediately\u003c/em> instructs. (B) is a threat, and a weak one: it converts a routine query into a dispute and makes the reader defensive. (C) asks for two things the reader can supply in one line, and therefore gets answered.\u003c/p>","F1":"\u003cp>a.  “Rather than ask you to hurry it”. Asking for speed places a demand the reader probably cannot meet, so the honest reply is silence. Asking for a status places a demand they can meet in thirty seconds — and once someone has opened your file and written to you, your case has a person attached to it, which is the actual mechanism by which stalled things move.\u003c/p>\u003cp>b.  “If it is waiting on something from me — a form, or bank details I have not supplied”. It is tactically generous: it offers the office a blameless explanation, which makes replying comfortable. It is also often true, and if it is, the writer has just saved seven more weeks.\u003c/p>","F2":"\u003cp>a.  Because both facts run from the past into the present and are the reason for writing. A simple past (\u003cem>nothing appeared\u003c/em>) would close the matter off as finished, which is precisely the opposite of the point.\u003c/p>\u003cp>b.  It stands in for \u003cem>in hand\u003c/em>. Writing it out — \u003cem>which I am sure it is in hand\u003c/em> — is ungrammatical, and the full form \u003cem>which I am sure is true\u003c/em> would be heavier and more formal than the light aside needs to be.\u003c/p>","F3":"\u003cp>a.  It is a deliberate courtesy, and a slightly generous fiction: it thanks them for their patience with \u003cem>you\u003c/em> for continuing to write. It costs nothing, it ends the email warmly after a paragraph of pressure, and it makes a third email feel like collaboration rather than complaint.\u003c/p>\u003cp>b.  It gets the force of the demand while formally withdrawing it. The reader registers that you could have asked them to hurry, and that you chose not to — which is both pressure and courtesy in the same six words. Naming the unmade request is one of the most efficient moves in polite English.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It accuses and then threatens.\u003c/strong> “clearly nothing is happening” and “I will complain to the head of department”. The reader is now defending themselves rather than finding the file.\u003c/p>\u003cp>2.  \u003cstrong>No reference, and the wrong ask.\u003c/strong> The reference number never appears, so the office cannot locate the case quickly; and “process my refund immediately” asks for the one thing this reader may be unable to do. “I expect your answer today” sets a deadline for somebody who owes you no deadline.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “I still didn’t receive” (have still not received), “in the end of February” (at the end), “since 7 weeks” (for seven weeks), “important for me” (to me), plus a comma splice at “important for me, it is not acceptable”. The \u003cem>since/for\u003c/em> error and the tense error together obscure the one fact the email needed to establish.\u003c/p>","F5":"\u003cp>Model: \u003cem>I am sorry to come back to you about the reference for the Wellcome placement — I know this is a heavy term. The portal closes on 14 March, and I wanted to check the link reached you, as these sometimes go to junk. If it is easier, I can ask them to resend it to a different address.\u003c/em>\u003c/p>\u003cp>The junk-folder line is the key move: it supplies a blameless reason for the silence, which lets a referee who simply forgot act without embarrassment.\u003c/p>"},"model":["Dear Finance Team,","I am writing about the refund for the cancelled Snowdonia field trip (reference FT-0881), which I applied for on 3 February.","I followed this up on 24 February and was told it was in hand, which I am sure it is — I appreciate this has been a busy term and that refunds of this kind go through several stages. It has now been about seven weeks, though, and nothing has appeared in my account.","Rather than ask you to hurry it, could you tell me which stage it has reached and roughly when I might expect it? If it is waiting on something from me — a form, or bank details I have not supplied — I would much rather know now and send it today.","Thank you for bearing with me on this.","Best wishes,","Owen Pritchard — GEOG204"],"model_html":"\u003cp>Dear Finance Team,\u003c/p>\u003cp>I am writing about the refund for the cancelled Snowdonia field trip (reference FT-0881), which I applied for on 3 February.\u003c/p>\u003cp>I followed this up on 24 February and was told it was in hand, which I am sure it is — I appreciate this has been a busy term and that refunds of this kind go through several stages. It has now been about seven weeks, though, and nothing has appeared in my account.\u003c/p>\u003cp>Rather than ask you to hurry it, could you tell me which stage it has reached and roughly when I might expect it? If it is waiting on something from me — a form, or bank details I have not supplied — I would much rather know now and send it today.\u003c/p>\u003cp>Thank you for bearing with me on this.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Owen Pritchard — GEOG204\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam,","This is already my third email about my refund of the field trip and I still didn’t receive anything. I applied in February and after that I wrote again in the end of February and somebody answered me that it is in hand but clearly nothing is happening since 7 weeks. I am a student and this money is important for me, it is not acceptable to wait so long for something which is not my mistake. Please process my refund immediately or I will complain to the head of department.","I expect your answer today."],"degraded_html":"\u003cp>Dear Sir/Madam,\u003c/p>\u003cp>This is already my third email about my refund of the field trip and I still didn’t receive anything. I applied in February and after that I wrote again in the end of February and somebody answered me that it is in hand but clearly nothing is happening since 7 weeks. I am a student and this money is important for me, it is not acceptable to wait so long for something which is not my mistake. Please process my refund immediately or I will complain to the head of department.\u003c/p>\u003cp>I expect your answer today.\u003c/p>","degraded_band":3,"model_words":141,"fault_list":{"tag":"F4","faults":["It accuses and then threatens. “clearly nothing is happening” and “I will complain to the head of department”. The reader is now defending themselves rather than finding the file.","No reference, and the wrong ask. The reference number never appears, so the office cannot locate the case quickly; and “process my refund immediately” asks for the one thing this reader may be unable to do. “I expect your answer today” sets a deadline for somebody who owes you no deadline.","Language. “I still didn’t receive” (have still not received), “in the end of February” (at the end), “since 7 weeks” (for seven weeks), “important for me” (to me), plus a comma splice at “important for me, it is not acceptable”. The since/for error and the tense error together obscure the one fact the email needed to establish."],"html":["\u003cp>1.  \u003cstrong>It accuses and then threatens.\u003c/strong> “clearly nothing is happening” and “I will complain to the head of department”. The reader is now defending themselves rather than finding the file.\u003c/p>","\u003cp>2.  \u003cstrong>No reference, and the wrong ask.\u003c/strong> The reference number never appears, so the office cannot locate the case quickly; and “process my refund immediately” asks for the one thing this reader may be unable to do. “I expect your answer today” sets a deadline for somebody who owes you no deadline.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “I still didn’t receive” (have still not received), “in the end of February” (at the end), “since 7 weeks” (for seven weeks), “important for me” (to me), plus a comma splice at “important for me, it is not acceptable”. The \u003cem>since/for\u003c/em> error and the tense error together obscure the one fact the email needed to establish.\u003c/p>"]},"scenario":"\u003cp>You applied for a refund of a cancelled field-trip fee seven weeks ago. You chased once after three weeks and were told it was “in hand”. Nothing has arrived. You need it before the end of term.\u003c/p>","bullets":["Remind them what this is about.","Say what has happened so far.","Ask for something specific."],"header":[["To:","finance.geog@northgate.ac.uk"],["Subject:","Field-trip refund — request of 3 February (ref FT-0881)"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Technology should serve people, not the other way round” is a slogan where a mechanism was needed.","correct":false},{"text":"No reference, and the wrong ask. The reference number never appears, so the office cannot locate the case quickly; and “process my refund immediately” asks for the one thing this reader may be unable to do. “I expect your answer today” sets a deadline for somebody who owes you no deadline.","correct":true},{"text":"Language. “I still didn’t receive” (have still not received), “in the end of February” (at the end), “since 7 weeks” (for seven weeks), “important for me” (to me), plus a comma splice at “important for me, it is not acceptable”. The since/for error and the tense error together obscure the one fact the email needed to establish.","correct":true},{"text":"Padding and an irrelevant appeal. “In my opinion” twice, and “in my country … the education system is working fine”, which is an anecdote offered as evidence for a causal claim it cannot support. The descriptor’s wording is part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":false},{"text":"It accuses and then threatens. “clearly nothing is happening” and “I will complain to the head of department”. The reader is now defending themselves rather than finding the file.","correct":true},{"text":"The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: “the sugary drinks”, “the rates of diabetes” over-articled.","correct":false}],"key_html":"F4"}};</script>
