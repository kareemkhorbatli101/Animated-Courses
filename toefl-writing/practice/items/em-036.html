<script>window.ITEM={"kind":"exercise","id":"EM 036","slug":"em-036","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline the terms while accepting the obligation","Grammar":"tentative suggestion with might","Vocabulary":"cover, shift, swap, goodwill","Convention":"declining a request from someone who has helped you before"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are in their debt. Does that oblige you to say yes?\u003c/p>\u003cp>b.  What is the difference between declining and refusing here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is goodwill in this sense, and how is it spent?\u003c/p>\u003cp>b.  Distinguish covering a shift from swapping one.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline in one sentence that acknowledges the debt in the same breath.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Three distinct things are offered. List them and say which one costs the writer most.\u003c/p>\u003cp>b.  The writer mentions a third person. Why is offering to ask Marta better than just naming her?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I might be able to do a Sunday\" — why \"might\" rather than \"can\"?\u003c/p>\u003cp>b.  \"I know you have bailed me out twice and I have not forgotten\" — why state the debt explicitly?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No — it obliges you to repay, which is not the same as repaying on the day they choose. A debt discharged at a cost that damages you is not what reciprocity asks for.\u003c/p>\u003cp>b.  Declining says no to this instance and keeps the relationship; refusing says no to the arrangement. The whole job of this email is to make clear which one is happening.\u003c/p>","P2":"\u003cp>a.  Accumulated willingness to help, built by past favours. It is spent by asking and replenished by giving — and like any account it can be overdrawn, which is what three weeks running begins to do.\u003c/p>\u003cp>b.  Covering is taking someone’s shift with nothing in return; swapping is exchanging it for one of yours. The model offers something closer to a swap, which is why it discharges the debt rather than deferring it.\u003c/p>","P3":"\u003cp>Model: \"I cannot do this Saturday — I have a hand-in on Monday — but I know you have bailed me out twice and I have not forgotten.\"\u003c/p>","F1":"\u003cp>a.  The 18th including the close; asking Marta on his behalf; a possible Sunday. The 18th costs most — it is a full day with a close, and it is the one the writer has checked he actually wants.\u003c/p>\u003cp>b.  Because naming her hands him another task. Offering to make the approach removes the work rather than redistributing it, which is what distinguishes a real offer from a helpful suggestion.\u003c/p>","F2":"\u003cp>a.  Because it is genuinely uncertain and depends on how the deadline goes. Promising a Sunday and then withdrawing it would be worse than not offering, and \"might\" keeps the offer honest while still putting it on the table.\u003c/p>\u003cp>b.  Because an unacknowledged debt is what makes a refusal feel like a betrayal. Naming it shows the writer is declining from a position of remembering rather than forgetting, which is the difference between a no and a slight.\u003c/p>","F3":"\u003cp>1.  The repayment is deferred indefinitely. \"I will make it up to you soon when things calm down\" names no date and no shift, so the third bullet fails.\u003c/p>\u003cp>2.  \"Hope you manage to find somebody else\" leaves him with the whole problem, when the writer knows of someone looking for hours.\u003c/p>\u003cp>3.  \"I appreciate it a lot\" acknowledges the debt in words while the email discharges none of it; and there are two comma splices.\u003c/p>"},"model":["Hi Kasper,","I cannot do this Saturday, I am afraid — I have a hand-in on Monday and the Saturday is the only full day I have left for it. I know you have bailed me out twice and I have not forgotten.","What I can do: I will take the whole of the following Saturday, the 18th, including the close, which I think is the one you said you wanted off for your brother’s thing. And if you are stuck this week, Marta mentioned she was looking for hours — she is trained on the till and I am happy to ask her for you rather than you having to chase round.","If the 18th is no use to you, tell me what would be and I will try to make it work. I might be able to do a Sunday if that is easier, depending on what the Monday deadline leaves behind it.","Sorry not to be more use this week.","Nour"],"model_html":"\u003cp>Hi Kasper,\u003c/p>\u003cp>I cannot do this Saturday, I am afraid — I have a hand-in on Monday and the Saturday is the only full day I have left for it. I know you have bailed me out twice and I have not forgotten.\u003c/p>\u003cp>What I can do: I will take the whole of the following Saturday, the 18th, including the close, which I think is the one you said you wanted off for your brother’s thing. And if you are stuck this week, Marta mentioned she was looking for hours — she is trained on the till and I am happy to ask her for you rather than you having to chase round.\u003c/p>\u003cp>If the 18th is no use to you, tell me what would be and I will try to make it work. I might be able to do a Sunday if that is easier, depending on what the Monday deadline leaves behind it.\u003c/p>\u003cp>Sorry not to be more use this week.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi Kasper, Sorry but I really cannot do Saturday this time, I have a big deadline on Monday and I am completely behind with it. I know you have helped me out before and I appreciate it a lot, I promise I will make it up to you soon when things calm down a bit. Hope you manage to find somebody else.","Nour"],"degraded_html":"\u003cp>Hi Kasper, Sorry but I really cannot do Saturday this time, I have a big deadline on Monday and I am completely behind with it. I know you have helped me out before and I appreciate it a lot, I promise I will make it up to you soon when things calm down a bit. Hope you manage to find somebody else.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":163,"fault_list":{"tag":"F3","faults":["The repayment is deferred indefinitely. \"I will make it up to you soon when things calm down\" names no date and no shift, so the third bullet fails.","\"Hope you manage to find somebody else\" leaves him with the whole problem, when the writer knows of someone looking for hours.","\"I appreciate it a lot\" acknowledges the debt in words while the email discharges none of it; and there are two comma splices."],"html":["\u003cp>1.  The repayment is deferred indefinitely. \"I will make it up to you soon when things calm down\" names no date and no shift, so the third bullet fails.\u003c/p>","\u003cp>2.  \"Hope you manage to find somebody else\" leaves him with the whole problem, when the writer knows of someone looking for hours.\u003c/p>","\u003cp>3.  \"I appreciate it a lot\" acknowledges the debt in words while the email discharges none of it; and there are two comma splices.\u003c/p>"]},"scenario":"\u003cp>A colleague on your part-time job asks you to cover their Saturday shift for the third week running. They covered twice for you in October. You have a deadline on Monday.\u003c/p>","bullets":["Decline this week.","Acknowledge what you owe them.","Offer something real."],"header":[["To:","k.jensen@northgate.ac.uk"],["Subject:","Saturday — I cannot this week, but"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Hope you manage to find somebody else” leaves him with the whole problem, when the writer knows of someone looking for hours.","correct":true},{"text":"“Impossible to understand literature without knowing the historical background” is far stronger than Rosa’s claim and is not defended; the Dickens anecdote shows only that context can help.","correct":false},{"text":"The evidence is a personal anecdote generalised to “nobody in my class”, and “makes them hate reading for the rest of their lives” is an unhedged causal claim.","correct":false},{"text":"“I appreciate it a lot” acknowledges the debt in words while the email discharges none of it; and there are two comma splices.","correct":true},{"text":"“All new technologies are unproven at first” does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.","correct":false},{"text":"The repayment is deferred indefinitely. “I will make it up to you soon when things calm down” names no date and no shift, so the third bullet fails.","correct":true}],"key_html":"F3"}};</script>
