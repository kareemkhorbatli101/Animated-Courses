<script>window.ITEM={"kind":"exercise","id":"AD 093","slug":"ad-093","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Translation studies · value trade-off","payload":{"Strategy":"weigh accuracy against the effect the original had","Grammar":"as if / as though clauses","Vocabulary":"equivalence, domestication, register, idiom","Convention":"weighing literal accuracy against equivalent effect"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Dan’s example is doing specific work. Why a joke?\u003c/p>\u003cp>b.  Can both standards be met at once? Under what conditions?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is equivalence, and what is domestication?\u003c/p>\u003cp>b.  What is an idiom, and why is it the hard case?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that distinguishes two kinds of strangeness.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says both speakers are missing a distinction. What is it, and why does it dissolve the dispute?\u003c/p>\u003cp>b.  Why does the second paragraph extend Dan’s point to insults and slogans?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"When a novel reads as though its narrator thinks in longer units\" — what does the as though clause do?\u003c/p>\u003cp>b.  \"a mistake wearing the clothes of fidelity\" — why this image?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because humour is defined by its effect. It is the clearest case where literal accuracy and faithful translation come apart, so it is hard for Pia to absorb without qualification.\u003c/p>\u003cp>b.  Yes, wherever the original was itself fluent and ordinary. The conflict only arises where the source is strange, and then the question is whose strangeness it is.\u003c/p>","P2":"\u003cp>a.  Equivalence is the relation a translation aims to have with its source; domestication is adapting a text to the target culture’s norms.\u003c/p>\u003cp>b.  An expression whose meaning is not derivable from its parts. It is the hard case because literal rendering preserves the words and destroys the meaning.\u003c/p>","P3":"\u003cp>Model: \"Keep the strangeness the original had and remove the strangeness the translation creates.\"\u003c/p>","F1":"\u003cp>a.  Between strangeness present in the source and strangeness produced by the act of translating. It dissolves the dispute because each speaker is right about one of those and they have been arguing as though there were only one.\u003c/p>\u003cp>b.  Because a principle resting on one example looks like an exception. Extending it to everything whose function is immediate shows Dan has identified a category rather than a special case, which is what makes the concession substantial.\u003c/p>","F2":"\u003cp>a.  It describes an impression the prose creates rather than a fact about the narrator, which is exactly the right register for a claim about how a translated text reads. Asserting it directly would overstate.\u003c/p>\u003cp>b.  Because it names the specific failure: not carelessness but a choice that presents itself as the careful one. That is the trap in Pia’s position, and the image makes it memorable without accusing her of anything.\u003c/p>","F3":"\u003cp>1.  \"A good translator finds a balance depending on the text\" is the conclusion the question asks to be argued for, offered as if it were an argument.\u003c/p>\u003cp>2.  Pia’s claim that fluency is not neutral — the most interesting thing said — is not engaged at all.\u003c/p>\u003cp>3.  No criterion for when to depart from the words, so the \"balance\" cannot be applied to any actual case.\u003c/p>"},"model":["Dan is right in the case he chooses and Pia is right about most other cases, and the distinction they are both missing is between strangeness that was there and strangeness the translation introduced.","His joke argument is unanswerable on its own terms. Humour works by effect; a joke that lands as a curiosity has failed completely, and the literal words are no defence. The same holds for anything whose function is immediate — insults, slogans, the rhythm of speech.","But most of a text is not like that. When a novel reads as though its narrator thinks in longer units than an English novelist would, that is a fact about the original and smoothing it away removes something the author did. Pia is right that fluency is not neutral: it is a choice that makes every literature sound like the translating one.","So my position is that the translator should preserve strangeness that the original had and remove strangeness that only the translation creates. The test is whether a first reader would have found the passage odd. Where they would, keeping it is accuracy; where they would not, keeping it is a mistake wearing the clothes of fidelity."],"model_html":"\u003cp>Dan is right in the case he chooses and Pia is right about most other cases, and the distinction they are both missing is between strangeness that was there and strangeness the translation introduced.\u003c/p>\u003cp>His joke argument is unanswerable on its own terms. Humour works by effect; a joke that lands as a curiosity has failed completely, and the literal words are no defence. The same holds for anything whose function is immediate — insults, slogans, the rhythm of speech.\u003c/p>\u003cp>But most of a text is not like that. When a novel reads as though its narrator thinks in longer units than an English novelist would, that is a fact about the original and smoothing it away removes something the author did. Pia is right that fluency is not neutral: it is a choice that makes every literature sound like the translating one.\u003c/p>\u003cp>So my position is that the translator should preserve strangeness that the original had and remove strangeness that only the translation creates. The test is whether a first reader would have found the passage odd. Where they would, keeping it is accuracy; where they would not, keeping it is a mistake wearing the clothes of fidelity.\u003c/p>","model_band":5,"degraded":["I think translators should try to be as faithful as possible to the original text because the author chose their words carefully and it is not the translator’s job to rewrite the book. At the same time the translation has to be readable, otherwise nobody will enjoy it. Dan gives a good example about jokes which shows that sometimes you have to change things. I think a good translator finds a balance between the two approaches depending on the text."],"degraded_html":"\u003cp>I think translators should try to be as faithful as possible to the original text because the author chose their words carefully and it is not the translator’s job to rewrite the book. At the same time the translation has to be readable, otherwise nobody will enjoy it. Dan gives a good example about jokes which shows that sometimes you have to change things. I think a good translator finds a balance between the two approaches depending on the text.\u003c/p>","degraded_band":3,"model_words":198,"fault_list":{"tag":"F3","faults":["\"A good translator finds a balance depending on the text\" is the conclusion the question asks to be argued for, offered as if it were an argument.","Pia’s claim that fluency is not neutral — the most interesting thing said — is not engaged at all.","No criterion for when to depart from the words, so the \"balance\" cannot be applied to any actual case."],"html":["\u003cp>1.  \"A good translator finds a balance depending on the text\" is the conclusion the question asks to be argued for, offered as if it were an argument.\u003c/p>","\u003cp>2.  Pia’s claim that fluency is not neutral — the most interesting thing said — is not engaged at all.\u003c/p>","\u003cp>3.  No criterion for when to depart from the words, so the \"balance\" cannot be applied to any actual case.\u003c/p>"]},"prof_name":"Dr Haddad","professor":"\u003cp>Translators choose between rendering a text closely, preserving its strangeness, and rendering it so that it reads as naturally as the original did to its first readers. The first respects the source; the second respects the reader. Which should take priority?\u003c/p>","students":[["Pia","Closeness. A translation that smooths everything into fluent English tells the reader nothing about how the original thought. The strangeness is information."],["Dan","Strangeness the author did not put there is not information, it is noise. A joke that was funny in Polish and is merely odd in English has been mistranslated, however literally."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Pia’s claim that fluency is not neutral — the most interesting thing said — is not engaged at all.","correct":true},{"text":"“Extremely insightful” is praise with no content — it does not show the article was read, and no specific claim from it is mentioned.","correct":false},{"text":"No alternatives, no delegation, no reallocation route, and “I am becoming quite worried” asks the reader to manage the writer’s anxiety rather than to sign a page.","correct":false},{"text":"“A good translator finds a balance depending on the text” is the conclusion the question asks to be argued for, offered as if it were an argument.","correct":true},{"text":"No criterion for when to depart from the words, so the “balance” cannot be applied to any actual case.","correct":true},{"text":"It prosecutes the reader. “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.","correct":false}],"key_html":"F3"}};</script>
