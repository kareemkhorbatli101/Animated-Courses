<script>window.ITEM={"kind":"exercise","id":"AD 026","slug":"ad-026","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business and economics · agree or disagree with a claim","payload":{"Strategy":"check whether a measured correlation points the way the claim assumes","Grammar":"counterfactual would have","Vocabulary":"causation, selection, productivity, attrition","Convention":"questioning a result that flatters everyone"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Owen names a specific methodological problem. What is it?\u003c/p>\u003cp>b.  Does his objection show the result is wrong?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is selection bias, and what is attrition in a trial?\u003c/p>\u003cp>b.  Why is \"productivity\" a slippery word across sectors?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Priya the finding and limit it, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says selection \"is what her explanation predicts\". Why is that a stronger move than treating them as rival explanations?\u003c/p>\u003cp>b.  What is the final sentence conceding, and to whom?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had participation been random, the effect would almost certainly be smaller\" — why the inverted conditional?\u003c/p>\u003cp>b.  \"more coherent and less generalisable at the same time\" — why point out that this is uncomfortable?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Selection bias — the participating firms are not a random sample, and the characteristic that made them volunteer is plausibly the one that produces the result.\u003c/p>\u003cp>b.  No. It shows the result may not generalise. The trials can be internally valid and externally limited at once, and collapsing those two is the commonest error in reading evidence of this kind.\u003c/p>","P2":"\u003cp>a.  Selection bias is non-random entry into the sample; attrition is non-random exit from it. Both distort, and attrition matters here because firms that failed may simply have stopped reporting.\u003c/p>\u003cp>b.  Because it means output per hour in some sectors and output per worker in others, and in services it is often measured by revenue, which responds to price as well as to work.\u003c/p>","P3":"\u003cp>Model: \"The trials show that a four-day week can work in firms that expect it to, which is a real finding and a much smaller one than the headline.\"\u003c/p>","F1":"\u003cp>a.  Because treating them as rivals invites an unresolvable argument about which is true. Showing that her mechanism generates his selection means both are true and the evidence becomes interpretable rather than contested.\u003c/p>\u003cp>b.  To both, and that is the point. Priya gets a real mechanism that works; Owen gets the limit on generalisation. The concession is that neither of their positions survives intact, which is usually what an honest reading produces.\u003c/p>","F2":"\u003cp>a.  Because the counterfactual is central and a fourth \"if\" would be clumsy in a paragraph already carrying conditionals. The inversion is also slightly more formal, which suits a claim about what the evidence would have shown.\u003c/p>\u003cp>b.  Because readers resist conclusions that do not resolve neatly, and naming the discomfort disarms the suspicion that the writer has failed to make up their mind. It signals that the untidiness is in the evidence rather than in the reasoning.\u003c/p>","F3":"\u003cp>1.  It asserts that the trials \"prove\" what Owen has just given a reason to doubt, and then dismisses his objection with \"somebody has to try it first\", which concedes his point without noticing.\u003c/p>\u003cp>2.  The supporting reasons are generic benefits rather than evidence about productivity, and the electricity saving is irrelevant to the claim at issue.\u003c/p>\u003cp>3.  \"All countries should move to a four-day week\" is an unhedged absolute drawn from evidence the response has just been told is non-representative. Language: \"the results of these trials prove\", \"the companies chose to participate\" over-articled.\u003c/p>"},"model":["Owen is describing selection and he is right that it limits what the trials show. But it limits it in a specific direction worth naming: the results tell us what happens when firms that expect to succeed try this, which is good evidence that it can work and poor evidence about the average firm. Had participation been random, the effect would almost certainly be smaller — though note it would have to be implausibly smaller to be zero, given the size of the reported gains.","What I would add is that the mechanism Priya describes predicts exactly this pattern. If the gain comes from cutting slack, then the firms with the most slack gain the most, and those are precisely the firms likely to volunteer. So selection is not an alternative explanation competing with hers; it is what her explanation predicts. That makes the evidence more coherent and less generalisable at the same time, which is an uncomfortable combination and probably the honest reading: a four-day week is a good way of removing waste where waste exists, and not a productivity technology."],"model_html":"\u003cp>Owen is describing selection and he is right that it limits what the trials show. But it limits it in a specific direction worth naming: the results tell us what happens when firms that expect to succeed try this, which is good evidence that it can work and poor evidence about the average firm. Had participation been random, the effect would almost certainly be smaller — though note it would have to be implausibly smaller to be zero, given the size of the reported gains.\u003c/p>\u003cp>What I would add is that the mechanism Priya describes predicts exactly this pattern. If the gain comes from cutting slack, then the firms with the most slack gain the most, and those are precisely the firms likely to volunteer. So selection is not an alternative explanation competing with hers; it is what her explanation predicts. That makes the evidence more coherent and less generalisable at the same time, which is an uncomfortable combination and probably the honest reading: a four-day week is a good way of removing waste where waste exists, and not a productivity technology.\u003c/p>","model_band":5,"degraded":["I think the four-day week is a very good idea and the results of these trials prove that it works. Employees who are less tired are more motivated and they concentrate better, so they can do the same amount of work in less time. It is also better for their mental health and for their families, and companies can save money on electricity and other costs. Owen says the companies chose to participate but I think this is normal because somebody has to try it first, and now other companies can follow their example. In my opinion all countries should move to a four-day week."],"degraded_html":"\u003cp>I think the four-day week is a very good idea and the results of these trials prove that it works. Employees who are less tired are more motivated and they concentrate better, so they can do the same amount of work in less time. It is also better for their mental health and for their families, and companies can save money on electricity and other costs. Owen says the companies chose to participate but I think this is normal because somebody has to try it first, and now other companies can follow their example. In my opinion all countries should move to a four-day week.\u003c/p>","degraded_band":3,"model_words":182,"fault_list":{"tag":"F3","faults":["It asserts that the trials \"prove\" what Owen has just given a reason to doubt, and then dismisses his objection with \"somebody has to try it first\", which concedes his point without noticing.","The supporting reasons are generic benefits rather than evidence about productivity, and the electricity saving is irrelevant to the claim at issue.","\"All countries should move to a four-day week\" is an unhedged absolute drawn from evidence the response has just been told is non-representative. Language: \"the results of these trials prove\", \"the companies chose to participate\" over-articled."],"html":["\u003cp>1.  It asserts that the trials \"prove\" what Owen has just given a reason to doubt, and then dismisses his objection with \"somebody has to try it first\", which concedes his point without noticing.\u003c/p>","\u003cp>2.  The supporting reasons are generic benefits rather than evidence about productivity, and the electricity saving is irrelevant to the claim at issue.\u003c/p>","\u003cp>3.  \"All countries should move to a four-day week\" is an unhedged absolute drawn from evidence the response has just been told is non-representative. Language: \"the results of these trials prove\", \"the companies chose to participate\" over-articled.\u003c/p>"]},"prof_name":"Dr Castellanos","professor":"\u003cp>Trials of a four-day week have generally reported that productivity is maintained or improved and that staff wellbeing rises. How convincing do you find this evidence?\u003c/p>","students":[["Priya","Quite convincing. The results replicate across sectors and countries, and the mechanism is plausible: people cut the meetings and the slack rather than the work."],["Owen","I would be careful. The firms in these trials volunteered. A company that thinks it can lose a day without losing output is a company with a day to lose, and that is not most companies."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The supporting reasons are generic benefits rather than evidence about productivity, and the electricity saving is irrelevant to the claim at issue.","correct":true},{"text":"It asserts that the trials “prove” what Owen has just given a reason to doubt, and then dismisses his objection with “somebody has to try it first”, which concedes his point without noticing.","correct":true},{"text":"“All countries should move to a four-day week” is an unhedged absolute drawn from evidence the response has just been told is non-representative. Language: “the results of these trials prove”, “the companies chose to participate” over-articled.","correct":true},{"text":"“Any advice you could give me” leaves her to invent the topic, and there is no release from replying, so ignoring it carries a small cost. The third bullet fails.","correct":false},{"text":"No specifics. “Looks like one of those scams” is a characterisation rather than a finding, and nothing in it can be checked, so the second bullet fails.","correct":false},{"text":"“The deadline is getting close so it would be good to know what you are planning to do” is a request wearing the clothes of an offer, and it puts the problem back on her.","correct":false}],"key_html":"F3"}};</script>
