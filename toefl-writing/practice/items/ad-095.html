em.\u003c/p>"},"model":["Idris has the better argument, and it is not about generosity but about which policy delivers more meals to poor children per pound spent.","Grace’s accounting is correct and incomplete. It assumes that targeting reaches the targeted, and the evidence is that it does not: application requires knowing about the scheme, producing documents, and declaring poverty to a school. Each step loses families, and the ones lost are disproportionately the most chaotic, which is to say the ones the policy exists for.","There is also the stigma effect, which Grace’s model has no place for. A child identified at the till as a free-meals case may not take the meal at all, and schools report exactly this. Universalism removes the identification along with the application, and that is not a side benefit — it is a large part of why take-up differs.","So I would provide universally and accept that some families who could pay will not, recovering what I could through the tax system rather than at the school gate. Grace is right that this subsidises people who do not need it; I would rather pay that than lose the third of eligible children a means test reliably loses."],"model_html":"\u003cp>Idris has the better argument, and it is not about generosity but about which policy delivers more meals to poor children per pound spent.\u003c/p>\u003cp>Grace’s accounting is correct and incomplete. It assumes that targeting reaches the targeted, and the evidence is that it does not: application requires knowing about the scheme, producing documents, and declaring poverty to a school. Each step loses families, and the ones lost are disproportionately the most chaotic, which is to say the ones the policy exists for.\u003c/p>\u003cp>There is also the stigma effect, which Grace’s model has no place for. A child identified at the till as a free-meals case may not take the meal at all, and schools report exactly this. Universalism removes the identification along with the applica
