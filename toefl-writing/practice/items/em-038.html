<script>window.ITEM={"kind":"exercise","id":"EM 038","slug":"em-038","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline by naming what you would be unable to do well","Grammar":"regret + infinitive","Vocabulary":"capacity, lead, deputy, step back","Convention":"declining a promotion within a volunteer organisation"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is \"I am too busy\" an inadequate reason inside a volunteer organisation?\u003c/p>\u003cp>b.  What problem does your refusal create for them?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to step back from a role?\u003c/p>\u003cp>b.  Distinguish a deputy from a successor.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline in one sentence that names the standard you would fail to meet.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer declines the role and then offers to do part of it. Why is that not a contradiction?\u003c/p>\u003cp>b.  \"the society has had one of those before\" — what does this short clause accomplish?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I am sorry to say I do not think I should take it on\" — why \"should\" rather than \"can\"?\u003c/p>\u003cp>b.  \"which I could actually do properly\" — what does \"actually\" carry?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because everyone in a volunteer organisation is busy, so it distinguishes nothing and reads as a polite formula. What distinguishes a real constraint is a number and a standard.\u003c/p>\u003cp>b.  They now have no president. An answer that leaves them exactly where they were before asking has declined the role and declined to help.\u003c/p>","P2":"\u003cp>a.  To withdraw from a role, usually without leaving the organisation — which is the distinction the writer is drawing.\u003c/p>\u003cp>b.  A deputy acts under the holder; a successor replaces them. The proposal here is neither — it is a split, which is why it has to be spelled out.\u003c/p>","P3":"\u003cp>Model: \"The role is about ten hours a week and I would be doing it at four, which is the sort of president who cancels things in week eight.\"\u003c/p>","F1":"\u003cp>a.  Because the refusal was about capacity against a defined standard, and the smaller role is one the writer can meet. Offering three hours after refusing ten is consistent; it would only be a contradiction if the reason given had been lack of interest.\u003c/p>\u003cp>b.  It supplies the evidence for the refusal from the society’s own history, so the writer does not have to argue that a half-committed president is bad. It also lets them decline without seeming to overrate their own importance.\u003c/p>","F2":"\u003cp>a.  Because \"can\" invites the committee to find ways round the constraint — fewer duties, more help — whereas \"should\" states a judgement about what is good for the society, which they cannot negotiate with.\u003c/p>\u003cp>b.  It points back to the ten-hour role and the four hours available, so \"properly\" is measured rather than modest. Without \"actually\" the clause would read as conventional self-deprecation.\u003c/p>","F3":"\u003cp>1.  \"Extremely busy\" with no standard and no number, which is what everyone says. The second bullet is only formally met.\u003c/p>\u003cp>2.  \"I am sure you will find somebody else\" hands the problem straight back, and no candidate, split or alternative is suggested. The third bullet fails.\u003c/p>\u003cp>3.  \"I will continue to help in any way I can\" is an offer with no content, and there is a comma splice in the opening sentence.\u003c/p>"},"model":["Dear all,","Thank you for asking — I am sorry to say I do not think I should take it on.","It is not that I do not want to. The role as Grace has run it is genuinely about ten hours a week in term, and with the dissertation I would be doing it at four or five. That is the sort of president who cancels things in week eight, and the society has had one of those before.","Two thoughts on filling it. Jonas has done the external speakers for two years and knows the part of the job nobody else has touched; he told me last month he would consider it if someone took the finance side off him. And if the committee would consider splitting the role — a president for the programme and a secretary with real authority over logistics — I would take the second of those, which is about three hours a week and which I could actually do properly.","Either way, I am happy to run the handover session in June as planned.","Nour"],"model_html":"\u003cp>Dear all,\u003c/p>\u003cp>Thank you for asking — I am sorry to say I do not think I should take it on.\u003c/p>\u003cp>It is not that I do not want to. The role as Grace has run it is genuinely about ten hours a week in term, and with the dissertation I would be doing it at four or five. That is the sort of president who cancels things in week eight, and the society has had one of those before.\u003c/p>\u003cp>Two thoughts on filling it. Jonas has done the external speakers for two years and knows the part of the job nobody else has touched; he told me last month he would consider it if someone took the finance side off him. And if the committee would consider splitting the role — a president for the programme and a secretary with real authority over logistics — I would take the second of those, which is about three hours a week and which I could actually do properly.\u003c/p>\u003cp>Either way, I am happy to run the handover session in June as planned.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Dear all, Thank you very much for thinking of me, I am really honoured that you considered me for this role. Unfortunately I am going to be extremely busy next year with my dissertation and my part-time job so I do not think I would have enough time to do it properly. I am sure you will find somebody else who is more available than me. I will of course continue to help the society in any way I can.","Nour"],"degraded_html":"\u003cp>Dear all, Thank you very much for thinking of me, I am really honoured that you considered me for this role. Unfortunately I am going to be extremely busy next year with my dissertation and my part-time job so I do not think I would have enough time to do it properly. I am sure you will find somebody else who is more available than me. I will of course continue to help the society in any way I can.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":179,"fault_list":{"tag":"F3","faults":["\"Extremely busy\" with no standard and no number, which is what everyone says. The second bullet is only formally met.","\"I am sure you will find somebody else\" hands the problem straight back, and no candidate, split or alternative is suggested. The third bullet fails.","\"I will continue to help in any way I can\" is an offer with no content, and there is a comma splice in the opening sentence."],"html":["\u003cp>1.  \"Extremely busy\" with no standard and no number, which is what everyone says. The second bullet is only formally met.\u003c/p>","\u003cp>2.  \"I am sure you will find somebody else\" hands the problem straight back, and no candidate, split or alternative is suggested. The third bullet fails.\u003c/p>","\u003cp>3.  \"I will continue to help in any way I can\" is an offer with no content, and there is a comma splice in the opening sentence.\u003c/p>"]},"scenario":"\u003cp>The society committee has asked you to take over as president next year. You are flattered but you are in your final year with a dissertation and you know the role properly done takes ten hours a week.\u003c/p>","bullets":["Decline.","Make clear it is about capacity, not interest.","Help them solve the problem you are creating."],"header":[["To:","committee.debatesoc@northgate.ac.uk"],["Subject:","President next year — I am going to have to say no"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“They create pressure and stress” and “many excellent universities are ranked low” are complaints about rankings, not answers to Kofi’s argument that the alternative is worse.","correct":false},{"text":"“I am sure you will find somebody else” hands the problem straight back, and no candidate, split or alternative is suggested. The third bullet fails.","correct":true},{"text":"“Most people are honest and would not waste their time” answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.","correct":false},{"text":"“I will continue to help in any way I can” is an offer with no content, and there is a comma splice in the opening sentence.","correct":true},{"text":"“If they communicate better and share information through a common digital system” assumes the solution rather than proposing it — the difficulty is that nobody is obliged to act on what is shared, which is never addressed.","correct":false},{"text":"“Extremely busy” with no standard and no number, which is what everyone says. The second bullet is only formally met.","correct":true}],"key_html":"F3"}};</script>
