<script>window.ITEM={"kind":"exercise","id":"EM 054","slug":"em-054","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"recommend by naming the condition under which you would advise the opposite","Grammar":"worth + gerund","Vocabulary":"placement, deferral, momentum, opportunity cost","Convention":"advising on a decision with no reversible option"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You know of two people who regretted it. Should you mention them?\u003c/p>\u003cp>b.  Why does naming what would change your advice make the advice stronger?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is opportunity cost, and what is momentum in this context?\u003c/p>\u003cp>b.  What does \"worth doing\" claim that \"a good idea\" does not?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Give the recommendation and its condition in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer leads with a recommendation and then spends most of the email on the case against. Why does that not undermine it?\u003c/p>\u003cp>b.  The regret of two people is reported precisely rather than generally. What does the precision buy?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a year of deciding rather than a year of deferring\" — what does the parallel do?\u003c/p>\u003cp>b.  \"It is worth doing if ...\" — why \"worth doing\" rather than \"you should do it\"?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Yes — and specifically. Suppressing the counter-evidence to make the advice cleaner is how advice becomes useless. Reporting what they regretted, which was the return rather than the placement, is more useful than either hiding it or letting it stand as a vague warning.\u003c/p>\u003cp>b.  Because it hands your friend the criterion instead of the conclusion. They know things about their own position that you do not, and advice that states its own condition can be applied by someone with better information than you have.\u003c/p>","P2":"\u003cp>a.  Opportunity cost is what you give up by choosing one option — here, a year. Momentum is the accumulated working rhythm and cohort familiarity that make a final year easier, and losing it is the hidden cost.\u003c/p>\u003cp>b.  \"Worth doing\" asserts that the benefit exceeds the cost, which invites the question of what the cost is. \"A good idea\" is an endorsement with no structure.\u003c/p>","P3":"\u003cp>Model: \"I would take it, provided the placement is somewhere you would genuinely consider working — otherwise the harder final year buys you nothing.\"\u003c/p>","F1":"\u003cp>a.  Because the recommendation is conditional and the case against is the material from which the condition is built. The email is not arguing with itself; it is showing the reader how the judgement was reached, which is what lets them reach their own.\u003c/p>\u003cp>b.  It converts a vague warning into a specific risk with a location. \"Some people regret it\" is unusable; \"returning was harder than expected and the dissertation suffered\" tells Anders exactly what to plan against, and is actionable rather than merely discouraging.\u003c/p>","F2":"\u003cp>a.  It sets two readings of the same year side by side in matched grammar, so the difference between them lands as a single distinction rather than as two claims. It is also the condition of the whole recommendation, compressed into six words.\u003c/p>\u003cp>b.  Because \"you should\" issues an instruction, while \"worth doing if\" states a conditional judgement the reader can test against facts only they have. The gerund also keeps the sentence about the action rather than about the person.\u003c/p>","F3":"\u003cp>1.  No real cost is named. \"A bit hard coming back\" is mentioned and immediately dismissed as normal, so the second bullet fails and the one piece of evidence the writer has is wasted.\u003c/p>\u003cp>2.  The advice is unconditional and forecloses the decision: \"definitely\", \"you will never regret\", \"you would be fine\", \"Go for it\". The third bullet is not addressed at all.\u003c/p>\u003cp>3.  \"One year is nothing in the long run\" is exactly the reassurance that turns out to be false for the people who regret it, and there are two comma splices.\u003c/p>"},"model":["Hi Anders,","I would take it, but the case is not as one-sided as people usually make it sound, so here is what I would actually weigh.","The real cost is not the year. It is that you come back to a cohort you do not know, into a final year everyone else has momentum in, and the two people I know who regretted it both said the same thing — not that the placement was bad, but that returning was harder than they expected and the dissertation suffered for it.","Against that, a year of real work before a final year tends to change what you can do with the degree rather than just what is on the CV. It is worth doing if the placement is somewhere you would genuinely consider working, because then it is a year of deciding rather than a year of deferring.","So the thing that would flip my advice is whether this placement is in the area you actually want. If it is a good company in a field you are lukewarm about, I would not do it — you would be buying a year of information you do not need at the price of a harder final year.","Dan"],"model_html":"\u003cp>Hi Anders,\u003c/p>\u003cp>I would take it, but the case is not as one-sided as people usually make it sound, so here is what I would actually weigh.\u003c/p>\u003cp>The real cost is not the year. It is that you come back to a cohort you do not know, into a final year everyone else has momentum in, and the two people I know who regretted it both said the same thing — not that the placement was bad, but that returning was harder than they expected and the dissertation suffered for it.\u003c/p>\u003cp>Against that, a year of real work before a final year tends to change what you can do with the degree rather than just what is on the CV. It is worth doing if the placement is somewhere you would genuinely consider working, because then it is a year of deciding rather than a year of deferring.\u003c/p>\u003cp>So the thing that would flip my advice is whether this placement is in the area you actually want. If it is a good company in a field you are lukewarm about, I would not do it — you would be buying a year of information you do not need at the price of a harder final year.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Anders, You should definitely take the placement, it is a great opportunity and you will get so much experience which employers really value these days. One year is nothing in the long run and you will never regret getting real work experience. I know a couple of people who found it a bit hard coming back but I think that is normal and you would be fine. Go for it, you will not regret it!","Dan"],"degraded_html":"\u003cp>Hi Anders, You should definitely take the placement, it is a great opportunity and you will get so much experience which employers really value these days. One year is nothing in the long run and you will never regret getting real work experience. I know a couple of people who found it a bit hard coming back but I think that is normal and you would be fine. Go for it, you will not regret it!\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":206,"fault_list":{"tag":"F3","faults":["No real cost is named. \"A bit hard coming back\" is mentioned and immediately dismissed as normal, so the second bullet fails and the one piece of evidence the writer has is wasted.","The advice is unconditional and forecloses the decision: \"definitely\", \"you will never regret\", \"you would be fine\", \"Go for it\". The third bullet is not addressed at all.","\"One year is nothing in the long run\" is exactly the reassurance that turns out to be false for the people who regret it, and there are two comma splices."],"html":["\u003cp>1.  No real cost is named. \"A bit hard coming back\" is mentioned and immediately dismissed as normal, so the second bullet fails and the one piece of evidence the writer has is wasted.\u003c/p>","\u003cp>2.  The advice is unconditional and forecloses the decision: \"definitely\", \"you will never regret\", \"you would be fine\", \"Go for it\". The third bullet is not addressed at all.\u003c/p>","\u003cp>3.  \"One year is nothing in the long run\" is exactly the reassurance that turns out to be false for the people who regret it, and there are two comma splices.\u003c/p>"]},"scenario":"\u003cp>A friend has been offered a year-long placement that would delay their graduation by a year. They are torn. You think they should take it but you know two people who regretted it.\u003c/p>","bullets":["Give your view.","Name the real cost honestly.","Tell them what would change your advice."],"header":[["To:","a.lindqvist@northgate.ac.uk"],["Subject:","The placement year — what I’d weigh"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“One year is nothing in the long run” is exactly the reassurance that turns out to be false for the people who regret it, and there are two comma splices.","correct":true},{"text":"No real cost is named. “A bit hard coming back” is mentioned and immediately dismissed as normal, so the second bullet fails and the one piece of evidence the writer has is wasted.","correct":true},{"text":"Language: “the dangerous nuclear power”, “the prices of the batteries”, “another place” — and the conclusion “one hundred per cent” is exactly the unhedged absolute the topic punishes.","correct":false},{"text":"Language: “the schools”, “the universities”, “the students themselves” over-articled; “make an effort and practise their writing” is vague; and the final sentence shifts to second person mid-paragraph.","correct":false},{"text":"No distinction between demolition and alteration, no mention of what the rules actually protect, and “future generations will not thank us” is rhetoric standing in for the comparison.","correct":false},{"text":"The advice is unconditional and forecloses the decision: “definitely”, “you will never regret”, “you would be fine”, “Go for it”. The third bullet is not addressed at all.","correct":true}],"key_html":"F3"}};</script>
