<script>window.ITEM={"kind":"exercise","id":"EM 062","slug":"em-062","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Invitation","payload":{"Strategy":"invite by making attendance easy, not by praising the event","Grammar":"present continuous for fixed arrangements","Vocabulary":"drop in, no need to book, informal, open to all","Convention":"inviting people who may feel they do not belong"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The barrier is not information but embarrassment. How does that change the email?\u003c/p>\u003cp>b.  Why might \"for students who are struggling\" be the worst possible description?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \"drop in\" imply that \"attend\" does not?\u003c/p>\u003cp>b.  Distinguish \"open to all\" from \"no need to book\".\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Describe the session in one sentence that a confident student would also want to attend.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email says the department described the session badly. What does admitting that achieve?\u003c/p>\u003cp>b.  Find the sentence in which the writer admits not knowing something. Why is it there?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"You can come for ten minutes, bring a half-finished sheet, or sit and work quietly\" — what do the three options have in common?\u003c/p>\u003cp>b.  Why repeat the time and room at the end when they appear already?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It means information is not the content. The email has to change what attending signifies, which is done by describing who actually comes rather than by issuing a warmer invitation.\u003c/p>\u003cp>b.  Because it names the group nobody wants to be seen joining. A description that makes attendance an admission guarantees that only the desperate attend — which then makes the description true.\u003c/p>","P2":"\u003cp>a.  That you may arrive and leave when you like, with no commitment and no registration. \"Attend\" implies a session you are expected to stay for.\u003c/p>\u003cp>b.  \"Open to all\" addresses eligibility; \"no need to book\" addresses friction. Here the barrier is neither — it is meaning — but both help once the meaning is fixed.\u003c/p>","P3":"\u003cp>Model: \"Two of us sit with the problem sets and anyone who wants to work through them can.\"\u003c/p>","F1":"\u003cp>a.  It gives the reader permission to have misunderstood. If the description was wrong, nobody who stayed away was being foolish — so coming this week is not an admission of anything.\u003c/p>\u003cp>b.  \"a question that nobody in the room had got out, including me.\" It is there to remove the status difference. A session where the staff member also gets stuck is not a place where being stuck is a confession.\u003c/p>","F2":"\u003cp>a.  Each names a way of attending that requires no public act — no question asked, no commitment made, nothing revealed. The list is engineered against the specific fear the email has diagnosed.\u003c/p>\u003cp>b.  Because the practical line is what people act on, and the body of the email is argument rather than information. Ending with the bare facts means a reader who skims still leaves with the time and the room.\u003c/p>","F3":"\u003cp>1.  It does exactly what the email was meant to undo: \"students who are having difficulties\", \"everybody who is struggling\". The second bullet is not merely unaddressed but actively worsened.\u003c/p>\u003cp>2.  Nothing lowers the commitment. No indication that you can come briefly, work alone, or bring nothing — so the third bullet fails.\u003c/p>\u003cp>3.  Register: institutional throughout (\"we encourage\", \"a valuable opportunity\", \"we look forward to seeing you there\"), which signals an official activity rather than a room where people sit and work.\u003c/p>"},"model":["Hi everyone,","A quick note about the Thursday drop-in, because I think we have described it badly.","It is not a remedial class. It is an hour in Room 2.14, four till five, where two of us sit with the problem sets and anyone who wants to work through them can. Most weeks the people who come are the ones who have nearly finished and want to check a method, or who want to see a neater way of doing question four. Last week three people came and we spent most of it on a question that nobody in the room had got out, including me.","There is nothing to book and nothing to prepare. You can come for ten minutes, bring a half-finished sheet, or sit and work quietly without asking anything at all.","Thursdays, 4–5, Room 2.14, every week until the end of term.","Jamie"],"model_html":"\u003cp>Hi everyone,\u003c/p>\u003cp>A quick note about the Thursday drop-in, because I think we have described it badly.\u003c/p>\u003cp>It is not a remedial class. It is an hour in Room 2.14, four till five, where two of us sit with the problem sets and anyone who wants to work through them can. Most weeks the people who come are the ones who have nearly finished and want to check a method, or who want to see a neater way of doing question four. Last week three people came and we spent most of it on a question that nobody in the room had got out, including me.\u003c/p>\u003cp>There is nothing to book and nothing to prepare. You can come for ten minutes, bring a half-finished sheet, or sit and work quietly without asking anything at all.\u003c/p>\u003cp>Thursdays, 4–5, Room 2.14, every week until the end of term.\u003c/p>\u003cp>Jamie\u003c/p>","model_band":5,"degraded":["Dear all, We would like to remind you that the Thursday help session is still running every week in Room 2.14 from 4 to 5. This session is designed to support students who are having difficulties with the material and who need extra help to keep up with the course. We encourage everybody who is struggling to attend, as it is a valuable opportunity to improve your understanding. We look forward to seeing you there.","The teaching team"],"degraded_html":"\u003cp>Dear all, We would like to remind you that the Thursday help session is still running every week in Room 2.14 from 4 to 5. This session is designed to support students who are having difficulties with the material and who need extra help to keep up with the course. We encourage everybody who is struggling to attend, as it is a valuable opportunity to improve your understanding. We look forward to seeing you there.\u003c/p>\u003cp>The teaching team\u003c/p>","degraded_band":3,"model_words":152,"fault_list":{"tag":"F3","faults":["It does exactly what the email was meant to undo: \"students who are having difficulties\", \"everybody who is struggling\". The second bullet is not merely unaddressed but actively worsened.","Nothing lowers the commitment. No indication that you can come briefly, work alone, or bring nothing — so the third bullet fails.","Register: institutional throughout (\"we encourage\", \"a valuable opportunity\", \"we look forward to seeing you there\"), which signals an official activity rather than a room where people sit and work."],"html":["\u003cp>1.  It does exactly what the email was meant to undo: \"students who are having difficulties\", \"everybody who is struggling\". The second bullet is not merely unaddressed but actively worsened.\u003c/p>","\u003cp>2.  Nothing lowers the commitment. No indication that you can come briefly, work alone, or bring nothing — so the third bullet fails.\u003c/p>","\u003cp>3.  Register: institutional throughout (\"we encourage\", \"a valuable opportunity\", \"we look forward to seeing you there\"), which signals an official activity rather than a room where people sit and work.\u003c/p>"]},"scenario":"\u003cp>Your department is running a weekly informal maths help session. Attendance has been poor, and the students who most need it seem to think it is only for people who are failing.\u003c/p>","bullets":["Say what the session is and when.","Address the reason people are not coming.","Make attending as low-commitment as possible."],"header":[["To:","stats2-all@northgate.ac.uk"],["Subject:","Thursday drop-in — what it actually is"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No distinction between demolition and alteration, no mention of what the rules actually protect, and “future generations will not thank us” is rhetoric standing in for the comparison.","correct":false},{"text":"Nothing lowers the commitment. No indication that you can come briefly, work alone, or bring nothing — so the third bullet fails.","correct":true},{"text":"“Most students are honest so there is not much cheating to detect” is an empirical claim with no support, and it denies Tom’s premise instead of weighing it.","correct":false},{"text":"It does exactly what the email was meant to undo: “students who are having difficulties”, “everybody who is struggling”. The second bullet is not merely unaddressed but actively worsened.","correct":true},{"text":"Register: institutional throughout (“we encourage”, “a valuable opportunity”, “we look forward to seeing you there”), which signals an official activity rather than a room where people sit and work.","correct":true},{"text":"Language: “the readers”, “the newspapers”, “the market for literature” over-articled; “anymore” should be “any more”; and “connected with each other” is doing the work that an argument should.","correct":false}],"key_html":"F3"}};</script>
