<script>window.ITEM={"kind":"exercise","id":"EM 048","slug":"em-048","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask the holder of the fact, not the holder of the opinion","Grammar":"noun clause after wonder","Vocabulary":"curriculum, contact hours, assessment weighting, elective","Convention":"enquiring before committing to something irreversible"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why would asking \"which pathway is better?\" get a useless answer?\u003c/p>\u003cp>b.  You are writing to an administrator, not an academic. What does that mean for what you ask?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What are contact hours, and what is an assessment weighting?\u003c/p>\u003cp>b.  What is an elective, and how does it differ from a pathway?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask for facts in a way that signals you are not asking for advice.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer explains why they need the figures. Is that necessary?\u003c/p>\u003cp>b.  The last paragraph anticipates a particular reply. Which, and what does anticipating it save?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"wondered whether you could help with two factual points\" — what does \"factual\" do here?\u003c/p>\u003cp>b.  \"that is for me and my tutor\" — what boundary is being drawn, and why politely?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the reader has no basis for the judgement and may not be permitted to make it. You would get either a refusal or an opinion from someone who does not know your situation — and either way you still lack the facts.\u003c/p>\u003cp>b.  Ask for records rather than judgements. Administrators hold timetables, weightings and regulations; academics hold advice. Asking the right person for the right kind of thing is most of what makes an enquiry work.\u003c/p>","P2":"\u003cp>a.  Contact hours are scheduled teaching time; assessment weighting is the proportion of the mark each component carries.\u003c/p>\u003cp>b.  An elective is a single optional module; a pathway is a structured group of them that usually appears on the degree title.\u003c/p>","P3":"\u003cp>Model: \"I am not asking which is the better choice; that is for me and my tutor.\"\u003c/p>","F1":"\u003cp>a.  Here, yes — briefly. It explains why the request is urgent and why the figures matter, which makes a prompt reply more likely. The test is whether the reason changes what the reader does; a deadline usually does.\u003c/p>\u003cp>b.  \"Those figures sit with the departments rather than centrally.\" Anticipating it saves the exchange in which the administrator says exactly that and the writer has to ask who instead — which is two days.\u003c/p>","F2":"\u003cp>a.  It signals the kind of answer wanted before the questions arrive, so the reader does not start composing advice. One word doing the work of a disclaimer.\u003c/p>\u003cp>b.  Between facts, which are the administrator’s, and judgement, which is not. Politely, because the boundary protects the reader as much as the writer — it frees them from having to decline to advise.\u003c/p>","F3":"\u003cp>1.  It asks for a recommendation from an office that cannot give one, which is the thing the task specifically excludes.\u003c/p>\u003cp>2.  \"Could you tell me more about the two pathways\" requests unbounded information rather than the two specific figures needed, so the second bullet fails and the reply will be a link to the handbook already consulted.\u003c/p>\u003cp>3.  \"Any advice would be very helpful\" invites exactly the wrong kind of response, and no student number is given.\u003c/p>"},"model":["Dear Sociology Administration,","I am choosing between the Social Policy and Social Research pathways for next year and wondered whether you could help with two factual points the handbook does not cover.","First, the contact hours per week for each pathway in the autumn term. Second, the assessment weighting on each — specifically the split between coursework and examination across the pathway as a whole.","I am not asking which is the better choice; that is for me and my tutor. It is only that the two decisions I have to make this week, about a part-time job and about whether to take a language module, both depend on the timetable and on how much of the year is examined.","If those figures sit with the two departments rather than centrally, I am happy to write to them directly if you can tell me who to ask.","Thank you very much.","Best wishes,","Tomas Reyes — 2201884"],"model_html":"\u003cp>Dear Sociology Administration,\u003c/p>\u003cp>I am choosing between the Social Policy and Social Research pathways for next year and wondered whether you could help with two factual points the handbook does not cover.\u003c/p>\u003cp>First, the contact hours per week for each pathway in the autumn term. Second, the assessment weighting on each — specifically the split between coursework and examination across the pathway as a whole.\u003c/p>\u003cp>I am not asking which is the better choice; that is for me and my tutor. It is only that the two decisions I have to make this week, about a part-time job and about whether to take a language module, both depend on the timetable and on how much of the year is examined.\u003c/p>\u003cp>If those figures sit with the two departments rather than centrally, I am happy to write to them directly if you can tell me who to ask.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Tomas Reyes — 2201884\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I am trying to decide between the Social Policy and Social Research pathways for next year but the handbook does not give much information. Could you tell me more about the two pathways and what the differences are between them? Which one would you recommend for someone who is interested in working in local government after graduating? Any advice would be very helpful.","Tomas"],"degraded_html":"\u003cp>Dear Sir/Madam, I am trying to decide between the Social Policy and Social Research pathways for next year but the handbook does not give much information. Could you tell me more about the two pathways and what the differences are between them? Which one would you recommend for someone who is interested in working in local government after graduating? Any advice would be very helpful.\u003c/p>\u003cp>Tomas\u003c/p>","degraded_band":3,"model_words":156,"fault_list":{"tag":"F3","faults":["It asks for a recommendation from an office that cannot give one, which is the thing the task specifically excludes.","\"Could you tell me more about the two pathways\" requests unbounded information rather than the two specific figures needed, so the second bullet fails and the reply will be a link to the handbook already consulted.","\"Any advice would be very helpful\" invites exactly the wrong kind of response, and no student number is given."],"html":["\u003cp>1.  It asks for a recommendation from an office that cannot give one, which is the thing the task specifically excludes.\u003c/p>","\u003cp>2.  \"Could you tell me more about the two pathways\" requests unbounded information rather than the two specific figures needed, so the second bullet fails and the reply will be a link to the handbook already consulted.\u003c/p>","\u003cp>3.  \"Any advice would be very helpful\" invites exactly the wrong kind of response, and no student number is given.\u003c/p>"]},"scenario":"\u003cp>You are choosing between two optional pathways. The handbook gives module titles but not assessment weightings or contact hours, and the two pathways are taught by different departments.\u003c/p>","bullets":["Say what you are deciding between.","Ask for the specific facts you need.","Make clear you are not asking which is better."],"header":[["To:","ugadmin.sociol@northgate.ac.uk"],["Subject:","Pathway choice — contact hours and assessment weightings"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Any advice would be very helpful” invites exactly the wrong kind of response, and no student number is given.","correct":true},{"text":"It asks for a recommendation from an office that cannot give one, which is the thing the task specifically excludes.","correct":true},{"text":"Pieter’s argument is called interesting and then set aside — “but I still think energy efficiency has to come first” — without any engagement with the accounting.","correct":false},{"text":"“Could you tell me more about the two pathways” requests unbounded information rather than the two specific figures needed, so the second bullet fails and the reply will be a link to the handbook already consulted.","correct":true},{"text":"Rafe is not answered. “I think the connection is very clear” restates the belief he questioned without engaging the objection, which was about causation.","correct":false},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":false}],"key_html":"F3"}};</script>
