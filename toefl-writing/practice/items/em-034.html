<script>window.ITEM={"kind":"exercise","id":"EM 034","slug":"em-034","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline a date, not the relationship, and name the next one","Grammar":"alternative-offer structures","Vocabulary":"clash, slot, pencil in, firm up","Convention":"declining a meeting with someone whose time is scarcer than yours"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The risk here is not offence but drift. What does that mean for the email?\u003c/p>\u003cp>b.  Why is \"I am free any time next week\" a poor offer?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to pencil something in, and to firm it up?\u003c/p>\u003cp>b.  Why is \"clash\" better than \"I am busy\"?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Offer alternatives in one sentence that requires only a yes.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer offers to take awkward times. What does that signal, and what is the risk?\u003c/p>\u003cp>b.  The final paragraph adds work for the writer. Why is that a good trade here?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Wednesday at two is the one slot I cannot do\" — what does \"the one\" do?\u003c/p>\u003cp>b.  \"would it help if I sent the two-page outline ahead\" — why frame an offer as a question?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the danger is the meeting quietly never happening. Every extra exchange is a chance for it to slip past her availability, so the email has to reduce the number of further emails to one.\u003c/p>\u003cp>b.  Because it asks her to search her own diary and propose, which is work. Naming three days and offering to take any hour converts her task from scheduling to choosing.\u003c/p>","P2":"\u003cp>a.  To pencil in is to arrange provisionally; to firm up is to confirm. Useful when you need a slot held before details are settled.\u003c/p>\u003cp>b.  Because \"clash\" names a conflict between two fixed commitments, which is a fact. \"I am busy\" describes your preferences and invites her to weigh them against hers.\u003c/p>","P3":"\u003cp>Model: \"I could do any of Monday, Tuesday or Thursday that week, at any hour you like.\"\u003c/p>","F1":"\u003cp>a.  It signals that the meeting matters more to the writer than her convenience does, which is the correct hierarchy when you are asking a senior person for supervision. The risk is sounding desperate, which is avoided here because it is one clause rather than the theme of the email.\u003c/p>\u003cp>b.  Because her constraint is time and the writer’s is not. Trading the writer’s preparation for the professor’s minutes is the whole logic of the relationship, and offering it now also demonstrates that the writer will be a low-maintenance student.\u003c/p>","F2":"\u003cp>a.  It marks the refusal as a single narrow exception rather than the first of several, which is exactly the reassurance a busy person needs before offering a second slot.\u003c/p>\u003cp>b.  Because an unsolicited attachment is a demand on her attention. Asking makes it hers to accept, and the question also supplies the reason — saving half an hour — which makes yes the obvious answer.\u003c/p>","F3":"\u003cp>1.  No alternatives are offered. \"Could we perhaps find another time\" hands the scheduling back to the busier person, so the third bullet fails.\u003c/p>\u003cp>2.  \"I am quite flexible\" claims flexibility without supplying any, and \"convenient for both of us\" introduces the writer’s convenience as a constraint when it is not one.\u003c/p>\u003cp>3.  Her stated departure is never acknowledged, so the urgency that should shape the whole email is absent, and the enthusiasm the second bullet asks for never appears beyond a formula.\u003c/p>"},"model":["Dear Professor Okonkwo,","Thank you — I would very much like to meet. Wednesday at two is the one slot I cannot do: it clashes with the compulsory Pembrokeshire field trip, which runs all day.","I could do any of Monday, Tuesday or Thursday that week, at any hour you like. If it is easier, I am happy to take whatever is left in your diary — early, late or between other meetings — and I can come to you.","Given that you are away after that, would it help if I sent the two-page outline ahead of the meeting, so we can start from something concrete rather than spending the first half hour on background?","Thank you again.","Yours sincerely,","Mira Halvorsen"],"model_html":"\u003cp>Dear Professor Okonkwo,\u003c/p>\u003cp>Thank you — I would very much like to meet. Wednesday at two is the one slot I cannot do: it clashes with the compulsory Pembrokeshire field trip, which runs all day.\u003c/p>\u003cp>I could do any of Monday, Tuesday or Thursday that week, at any hour you like. If it is easier, I am happy to take whatever is left in your diary — early, late or between other meetings — and I can come to you.\u003c/p>\u003cp>Given that you are away after that, would it help if I sent the two-page outline ahead of the meeting, so we can start from something concrete rather than spending the first half hour on background?\u003c/p>\u003cp>Thank you again.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Mira Halvorsen\u003c/p>","model_band":5,"degraded":["Dear Professor Okonkwo, Thank you very much for your email and for offering to meet me. Unfortunately I am not available on Wednesday at 2 because I have a field trip on that day which is compulsory for my course. Could we perhaps find another time that is convenient for both of us? I am quite flexible so please let me know when you are free.","Mira"],"degraded_html":"\u003cp>Dear Professor Okonkwo, Thank you very much for your email and for offering to meet me. Unfortunately I am not available on Wednesday at 2 because I have a field trip on that day which is compulsory for my course. Could we perhaps find another time that is convenient for both of us? I am quite flexible so please let me know when you are free.\u003c/p>\u003cp>Mira\u003c/p>","degraded_band":3,"model_words":121,"fault_list":{"tag":"F3","faults":["No alternatives are offered. \"Could we perhaps find another time\" hands the scheduling back to the busier person, so the third bullet fails.","\"I am quite flexible\" claims flexibility without supplying any, and \"convenient for both of us\" introduces the writer’s convenience as a constraint when it is not one.","Her stated departure is never acknowledged, so the urgency that should shape the whole email is absent, and the enthusiasm the second bullet asks for never appears beyond a formula."],"html":["\u003cp>1.  No alternatives are offered. \"Could we perhaps find another time\" hands the scheduling back to the busier person, so the third bullet fails.\u003c/p>","\u003cp>2.  \"I am quite flexible\" claims flexibility without supplying any, and \"convenient for both of us\" introduces the writer’s convenience as a constraint when it is not one.\u003c/p>","\u003cp>3.  Her stated departure is never acknowledged, so the urgency that should shape the whole email is absent, and the enthusiasm the second bullet asks for never appears beyond a formula.\u003c/p>"]},"scenario":"\u003cp>A potential dissertation supervisor has offered you a meeting on Wednesday at two. You have a compulsory field trip that day. She has said she is largely away after next week.\u003c/p>","bullets":["Decline the time.","Convey that you very much want the meeting.","Give her something easy to say yes to."],"header":[["To:","f.okonkwo@northgate.ac.uk"],["Subject:","Wednesday 2 p.m. — could we find another time?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No alternatives are offered. “Could we perhaps find another time” hands the scheduling back to the busier person, so the third bullet fails.","correct":true},{"text":"“Some things are simply wrong and we do not need a philosophical argument” declines the question, which is precisely whether that response is legitimate.","correct":false},{"text":"“Women should not have to choose” is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.","correct":false},{"text":"Her stated departure is never acknowledged, so the urgency that should shape the whole email is absent, and the enthusiasm the second bullet asks for never appears beyond a formula.","correct":true},{"text":"It never takes a position. It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.","correct":false},{"text":"“I am quite flexible” claims flexibility without supplying any, and “convenient for both of us” introduces the writer’s convenience as a constraint when it is not one.","correct":true}],"key_html":"F3"}};</script>
