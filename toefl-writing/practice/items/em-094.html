of you.\u003c/p>","P2":"\u003cp>a.  Cover is someone taking a duty in your place; a rota is the schedule allocating it. What they have is an informal rota with no cover, which is the structural problem.\u003c/p>\u003cp>b.  \"I am available\" states a fact about your diary; \"I would be willing to\" offers something you could decline, which is the right form for a favour that has not yet been accepted.\u003c/p>","P3":"\u003cp>Model: \"I know that leaves you with nothing, and I am not going to ask you to miss yours so I can go to mine.\"\u003c/p>","F1":"\u003cp>a.  It removes the fear that the email is building towards that request, so Dami reads the rest as problem-solving rather than bracing for an ask. It also rules out the laziest solution before anyone has to refuse it.\u003c/p>\u003cp>b.  On who bears the cost, lowest first. The first costs the writer an email, the second costs a third party a favour, the third costs the writer a seminar. Dami’s cost is zero in all three, which is the point.\u003c/p>","F2":"\u003cp>a.  Because the sister has not been asked in a way that binds her, and because presenting it as settled would pressure Dami to accept an arrangement involving someone they have not met. It also leaves room for the sister to decline without the writer having misled anyone.\u003c/p>\u003cp>b.  An open invitation rather than a request for a decision. It ends the email without asking Dami to do anything, which is consistent with the whole approach, and it treats them as a partner in the problem rather than its object.\u003c/p>","F3":"\u003cp>1.  It asks Dami to absorb the loss. \"Would you be able to take the children this Wednesday\" is exactly the request the situation rules out, and the offered repayment does not help someone who cannot miss this particular week.\u003c/p>\u003cp>2.  \"I really cannot miss this seminar\" asserts the writer’s priority over the other person’s without knowing theirs — and in fact theirs is assessed.\u003c/p>\u003cp>3.  No third option is considered, so the problem is simply transferred; and \"let me know as soon as you can\" adds time pressure to a request that should not have been made.\u003c/p>"},"model":["Hi Dami,","My Research Methods seminar has been moved to Wednesday two till four, which is exactly your slot. I know that leaves you with nothing, and I am not going to ask you to miss yours so I can go to mine.","Three things I can think of, in the order I would prefer them. I can ask the convenor to move me to the Thursday group — I have emailed and should know by Friday. If that fails, my sister is in the city on Wednesdays until June and would be willing to take both children for the two hours, which covers us both. If neither works, I will miss the seminar and catch up from the recording, because yours is assessed and mine is not.","Nothing changes before Friday either way, so there is no need to rearrange anything yet.","Is there an option I have not thought of?","Nour"],"model_html":"\u003cp>Hi Dami,\u003c/p>\u003cp>My Research Methods seminar has been moved to Wednesday two till four, which is exactly your slot. I know that leaves you with nothing, and I am not going to ask you to miss yours so I can go to mine.\u003c/p>\u003cp>Three things I can think of, in the order I would prefer them. I can ask the convenor to move me to the Thursday group — I have emailed and should know by Friday. If that fails, my sister is in the city on Wednesdays until June and would be willing to take both children for the two hours, which covers us both. If neither works, I will miss the seminar and catch up from the recording, because yours is assessed and mine is not.\u003c/p>\u003cp>Nothing changes before Friday either way, so there is no need to rearrange anything yet.\u003c/p>\u003cp>Is there an option I have not thought of?\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi Dami, Bad news — my seminar has been moved to Wednesday afternoon which is the same time as yours. I know this is annoying for both of us. Would you be able to take the children this Wednesday and then I could take them two weeks in a row to make up for it? I know it is not ideal but I really cannot miss this seminar as it is important for my dissertation. Let me know as soon as you can.","Nour"],"degraded_html":"\u003cp>Hi Dami, Bad news — my seminar has been moved to Wednesday afternoon which is the same time as yours. I know this is annoying for both of us. Would you be able to take the children this Wednesday and then I could take them two weeks in a row to make up for it? I know it is not ideal but I really cannot miss this seminar as it is important for my dissertation. Let me know as soon as you can.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":152,"fault_list":{"tag":"F3","faults":["It asks Dami to absorb the loss. \"Would you be able to take the children this Wednesday\" is exactly the request the situation rules out, and the offered repayment does not help someone who cannot miss this particular week.","\"I really cannot miss this seminar\" asserts the writer’s priority over the other person’s without knowing theirs — and in fact theirs is assessed.","No third option is considered, so the problem is simply transferred; and \"let me know as soon as you can\" adds time pressure to a request that should not have been made."],"html":["\u003cp>1.  It asks Dami to absorb the loss. \"Would you be able to take the children this Wednesday\" is exactly the request the situation rules out, and the offered repayment does not help someone who cannot miss this particular week.\u003c/p>","\u003cp>2.  \"I really cannot miss this seminar\" asserts the writer’s priority over the other person’s without knowing theirs — and in fact theirs is assessed.\u003c/p>","\u003cp>3.  No third option is considered, so the problem is simply transferred; and \"let me know as soon as you can\" adds time pressure to a request that should not have been made.\u003c/p>"]},"scenario":"\u003cp>You share childcare on Wednesdays with a classmate so each of you can attend a seminar. Your seminar has moved to Wednesday afternoon, which is their slot. They have no other option that week.\u003c/p>","bullets":["Explain what has changed.","Acknowledge the cost to them.","Propose something that does not simply transfer the problem."],"header":[["To:","d.okafor@northgate.ac.uk"],["Subject:","Wednesdays — my seminar has moved"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language: “the main responsible” (those mainly responsible); “the pollution of the rivers”, “the infrastructure”, “the government” over-articled; “the rivers are dying” is rhetoric standing in for the measurement the question needed.","correct":false},{"text":"No third option is considered, so the problem is simply transferred; and “let me know as soon as you can” adds time pressure to a request that should not have been made.","correct":true},{"text":"“Some things are simply wrong and we do not need a philosophical argument” declines the question, which is precisely whether that response is legitimate.","correct":false},{"text":"It asks Dami to absorb the loss. “Would you be able to take the children this Wednesday” is exactly the request the situation rules out, and the offered repayment does not help someone who cannot miss this particular week.","correct":true},{"text":"“I really cannot miss this seminar” asserts the writer’s priority over the other person’s without knowing theirs — and in fact theirs is assessed.","correct":true},{"text":"“Public health must take priority over individual preferences” concedes that autonomy is being overridden, which gives Hana her argument back.","correct":false}],"key_html":"F3"}};</script>
