<script>window.ITEM={"kind":"exercise","id":"AD 002","slug":"ad-002","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business and economics · value trade-off","payload":{"Strategy":"refuse a false choice by finding the variable both sides left out","Grammar":"the comparative of importance; conditional qualification","Vocabulary":"incentive, retention, turnover, margin, short-termism","Convention":"disagreeing with the question itself, politely"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both are arguing about consequences, not values. Over what time period is each of them right?\u003c/p>\u003cp>b.  The professor has asked which matters more. Is that the only possible answer shape?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Define: \u003cem>retention\u003c/em> · \u003cem>turnover\u003c/em> · \u003cem>short-termism\u003c/em>. Which two are opposites?\u003c/p>\u003cp>b.  A reason built into a system that makes people behave a certain way is an i________ .\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, say that both are right and that this is not a compromise. Under 30 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “I think there should be a balance between the two” a band-3 sentence however true it is?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The first sentence agrees with both classmates. How does it avoid being the both-sides opening you were warned about in AD 001?\u003c/p>\u003cp>b.  Find the sentence that reframes the professor’s question. What licenses the writer to do that?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “Over six months a wage cut is survival; over three years it is attrition.” Why a semicolon rather than \u003cem>but\u003c/em>?\u003c/p>\u003cp>b.  “has not discovered an economic necessity; it has revealed an order of priority”. Name the device, and say why the two verbs were chosen to contrast.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>attrition\u003c/em> — what does it mean here, and what does it suggest that \u003cem>people leaving\u003c/em> does not?\u003c/p>\u003cp>b.  \u003cem>compressible\u003c/em> is doing unusual work applied to dividends. What is the effect of using an engineering word about money?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: should firms be required to publish the ratio between their highest and median pay? One classmate says it shames firms into fairness; another says it is a meaningless number. In 50 words, refuse the choice by naming a variable both have left out.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Yusuf over months; Mei over years. Neither says so, which is why they appear to disagree.\u003c/p>\u003cp>b.  No. You may answer \u003cem>neither, as posed\u003c/em> provided you say why the framing fails and offer a better one. Refusing a question is only legitimate if you replace it; refusing without replacing is evasion, and reads as such.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Retention\u003c/strong> is keeping staff; \u003cstrong>turnover\u003c/strong> is losing and replacing them — those two are opposites. \u003cstrong>Short-termism\u003c/strong> is the habit of optimising the near horizon at the expense of the far one, which is the vice the whole discussion circles.\u003c/p>\u003cp>b.  an \u003cstrong>incentive\u003c/strong>.\u003c/p>","P3":"\u003cp>Model: \u003cem>Yusuf and Mei are both right, and not as a compromise — they are describing different time horizons.\u003c/em>\u003c/p>\u003cp>The dash and the denial (\u003cem>not as a compromise\u003c/em>) are what rescue it. Without them, agreeing with both is the empty both-sides move.\u003c/p>","P4":"\u003cp>Because it names no mechanism. Everyone agrees there should be a balance; the question is where, decided how, and by whom. A sentence that nobody in the discussion could disagree with has not contributed to it — and \u003cem>contribution\u003c/em> is the rubric’s own word.\u003c/p>","F1":"\u003cp>a.  Because it immediately explains \u003cem>why\u003c/em> both are right — different time horizons — which is a claim neither of them made. The both-sides opening is empty because it stops there; this one uses the agreement as a premise.\u003c/p>\u003cp>b.  “So I would put the question differently — not which to protect, but what a firm should be required to exhaust before wages are touched at all.” It is licensed by the preceding argument: the writer has already shown that the two-way choice omits several variables, so replacing it is a conclusion rather than a dodge.\u003c/p>","F2":"\u003cp>a.  Because the two halves are not in opposition — they are both true, of different periods. \u003cem>But\u003c/em> would assert a contrast the writer has just denied. The semicolon balances them as equals, which is exactly the point.\u003c/p>\u003cp>b.  Antithesis, built on a parallel frame (\u003cem>has not … ; it has …\u003c/em>). \u003cem>Discovered\u003c/em> implies the constraint was out there in the world; \u003cem>revealed\u003c/em> implies it was inside the firm all along. The whole accusation lives in the difference between those two verbs.\u003c/p>","F3":"\u003cp>a.  Gradual loss through people leaving one by one. It suggests something slow, cumulative and unnoticed until too late — and it borrows a military sense of being worn down, which fits an argument about surviving a downturn.\u003c/p>\u003cp>b.  It treats money as a material with physical properties, which quietly implies that the firm has a range of things it could squeeze and has chosen one. That is the argument of the paragraph, delivered by a single adjective.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It never takes a position.\u003c/strong> It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.\u003c/p>\u003cp>2.  \u003cstrong>The support is not argument.\u003c/strong> “they are human beings and they have families” is true of every employment question ever asked, so it distinguishes nothing. The final recommendation — managers should discuss with workers — is a procedure, not an answer.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “cutting their money” (their pay), “not fair for them” (unfair to them), “a small cut in the salary” (in salaries), and a long run-on at “jobs which is worse”.\u003c/p>","F5":"\u003cp>Model: \u003cem>The objection that the ratio is meaningless is right about the number and wrong about the disclosure. What makes it meaningless is that it ignores outsourcing: a firm can halve its ratio by contracting out its cleaners. Require the ratio to include contracted staff and it starts measuring something.\u003c/em>\u003c/p>"},"model":["Yusuf and Mei are both right, and not as a compromise — they are describing different time horizons. Over six months a wage cut is survival; over three years it is attrition, and Mei’s point is that the people who leave first are precisely the ones the recovery depends on.","What neither raises is that the choice as posed is mostly artificial. Wages are not the only variable: hours, dividends, executive pay and capital spending are all compressible, and which one a firm reaches for first says more about its governance than about its finances. A company that cuts wages before it cuts its dividend has not discovered an economic necessity; it has revealed an order of priority. So I would put the question differently — not which to protect, but what a firm should be required to exhaust before wages are touched at all."],"model_html":"\u003cp>Yusuf and Mei are both right, and not as a compromise — they are describing different time horizons. Over six months a wage cut is survival; over three years it is attrition, and Mei’s point is that the people who leave first are precisely the ones the recovery depends on.\u003c/p>\u003cp>What neither raises is that the choice as posed is mostly artificial. Wages are not the only variable: hours, dividends, executive pay and capital spending are all compressible, and which one a firm reaches for first says more about its governance than about its finances. A company that cuts wages before it cuts its dividend has not discovered an economic necessity; it has revealed an order of priority. So I would put the question differently — not which to protect, but what a firm should be required to exhaust before wages are touched at all.\u003c/p>","model_band":5,"degraded":["This is a very difficult question and both sides have good arguments. Yusuf is right that the company must survive because if it closes then all the workers will lose their jobs which is worse than a small cut in the salary. But Mei is also right because the workers are human beings and they have families and bills to pay, so cutting their money is not fair for them. In my opinion the best solution is to find a balance between the two sides and the managers should discuss with the workers to find a solution that is good for everybody."],"degraded_html":"\u003cp>This is a very difficult question and both sides have good arguments. Yusuf is right that the company must survive because if it closes then all the workers will lose their jobs which is worse than a small cut in the salary. But Mei is also right because the workers are human beings and they have families and bills to pay, so cutting their money is not fair for them. In my opinion the best solution is to find a balance between the two sides and the managers should discuss with the workers to find a solution that is good for everybody.\u003c/p>","degraded_band":3,"model_words":143,"fault_list":{"tag":"F4","faults":["It never takes a position. It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.","The support is not argument. “they are human beings and they have families” is true of every employment question ever asked, so it distinguishes nothing. The final recommendation — managers should discuss with workers — is a procedure, not an answer.","Language. “cutting their money” (their pay), “not fair for them” (unfair to them), “a small cut in the salary” (in salaries), and a long run-on at “jobs which is worse”."],"html":["\u003cp>1.  \u003cstrong>It never takes a position.\u003c/strong> It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.\u003c/p>","\u003cp>2.  \u003cstrong>The support is not argument.\u003c/strong> “they are human beings and they have families” is true of every employment question ever asked, so it distinguishes nothing. The final recommendation — managers should discuss with workers — is a procedure, not an answer.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “cutting their money” (their pay), “not fair for them” (unfair to them), “a small cut in the salary” (in salaries), and a long run-on at “jobs which is worse”.\u003c/p>"]},"prof_name":"Dr Castellanos","professor":"\u003cp>Firms under pressure often face a choice between cutting wages to protect margins and holding wages to protect staff. Some argue the first duty of a company is to survive, since a closed firm employs nobody. Others argue that the people who produce the value have the first claim on it. Which matters more in a downturn — protecting the business or protecting the workforce?\u003c/p>","students":[["Yusuf","Survival has to come first. A firm that pays wages it cannot afford is not being generous, it is simply failing more slowly, and when it goes under everybody loses their job rather than taking a temporary cut."],["Mei","I would protect the workforce. Cutting pay in a downturn is how you lose your best people, who are the ones with somewhere else to go. The firm then recovers into a market it has no skilled staff to serve."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Pick your brain” and “a short call” ask for unbounded time with no question specified, so the second bullet fails.","correct":false},{"text":"The support is not argument. “they are human beings and they have families” is true of every employment question ever asked, so it distinguishes nothing. The final recommendation — managers should discuss with workers — is a procedure, not an answer.","correct":true},{"text":"The role is never explained. “Participate as a discussant” assumes she knows what that involves here, and the preparation — three papers, twelve thousand words — is completely concealed. The second bullet fails.","correct":false},{"text":"It never takes a position. It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.","correct":true},{"text":"Language. “cutting their money” (their pay), “not fair for them” (unfair to them), “a small cut in the salary” (in salaries), and a long run-on at “jobs which is worse”.","correct":true},{"text":"The advice is unconditional and forecloses the decision: “definitely”, “you will never regret”, “you would be fine”, “Go for it”. The third bullet is not addressed at all.","correct":false}],"key_html":"F4"}};</script>
