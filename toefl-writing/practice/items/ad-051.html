<script>window.ITEM={"kind":"exercise","id":"AD 051","slug":"ad-051","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology and society · agree or disagree with a claim","payload":{"Strategy":"challenge the measure before you challenge the conclusion","Grammar":"hedged generalisation with tend to; the counterfactual","Vocabulary":"self-report, construct, baseline, confound","Convention":"questioning evidence without dismissing the people who cite it"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Yuki and Caleb are not disagreeing about the survey data. What are they disagreeing about?\u003c/p>\u003cp>b.  Caleb’s objection would, if right, also apply to almost all survey research. Does that strengthen or weaken it?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a \u003cem>construct\u003c/em> in psychology, and why can it be measured well or badly?\u003c/p>\u003cp>b.  Give one \u003cem>confound\u003c/em> that could produce the same curve without social media causing anything.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, accept Caleb’s objection and explain what evidence would get round it. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “I think social media has both positive and negative effects on young people” a band-3 contribution?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response converts a sceptical remark into a testable prediction. Find the sentence that does it.\u003c/p>\u003cp>b.  It ends with a claim smaller than either classmate’s. Argue that this is a strength.\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “If reporting has changed, then measures that do not depend on self-report \u003cem>should not\u003c/em> show the same rise.” Why \u003cem>should\u003c/em> rather than \u003cem>will\u003c/em>?\u003c/p>\u003cp>b.  “a technology which absorbs discretionary time \u003cem>tends to\u003c/em> crowd out …”. What does the hedge protect against?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>the number of people respondents say they could call at three in the morning\u003c/em> — why is this better evidence than a loneliness score?\u003c/p>\u003cp>b.  \u003cem>low-stakes contact\u003c/em> — what is the writer claiming friendship is made of, and why does the adjective do so much work?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: has remote working reduced workplace friendship? One classmate cites survey data; another says the surveys measure nostalgia. In 50 words, turn the sceptic’s point into a testable prediction.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  What the data measures. Yuki reads the scores as a measurement of loneliness; Caleb reads them as a measurement of willingness to report loneliness. Same numbers, two different constructs.\u003c/p>\u003cp>b.  It weakens it as stated, and that is the opening. An objection that applies to all self-report research is not a reason to disbelieve this particular finding — it is a reason to look for corroboration that does not depend on self-report. Turning a general scepticism into a specific test is exactly what the model response does.\u003c/p>","P2":"\u003cp>a.  A thing that cannot be observed directly and must be inferred from indicators — loneliness, intelligence, trust. Because the indicator is not the thing, a construct can be measured by an instrument that drifts while the thing itself stays put, which is precisely Caleb’s hypothesis.\u003c/p>\u003cp>b.  Several work: rising rates of living alone, later household formation, longer commutes, the collapse of cheap third places, or simply more students in higher education away from home. Any of these could bend the curve at the same time without social media doing anything.\u003c/p>","P3":"\u003cp>Model: \u003cem>If Caleb is right that reporting has changed, then behavioural measures that do not rely on self-report should not show the same rise — so the place to look is there.\u003c/em>\u003c/p>\u003cp>You have accepted his point completely and turned it into a prediction, which is the only way an objection like his can be settled rather than merely asserted.\u003c/p>","P4":"\u003cp>Because nobody disputes it, and because it answers a question that was not asked. The professor asked about a specific causal claim; “both positive and negative” is a stance of neutrality that engages with neither Yuki’s mechanism nor Caleb’s measurement objection.\u003c/p>","F1":"\u003cp>a.  “If reporting has changed, then measures that do not depend on self-report should not show the same rise — and some of them do not.” It supplies the consequence that follows from his hypothesis, and then reports whether it holds. That is the move that separates an argument from an exchange of intuitions.\u003c/p>\u003cp>b.  Because it is the claim the evidence will actually bear. Yuki claims causation from a correlation; Caleb claims the correlation is an artefact. The crowding-out claim is weaker than both and is consistent with all the data on the table, including the discrepancy between the two kinds of measure. In academic argument the smallest claim that explains everything is the strongest position you can hold.\u003c/p>","F2":"\u003cp>a.  Because \u003cem>should\u003c/em> states what follows from a hypothesis rather than what the world will do. It is the standard modal of prediction-under-a-theory, and using it signals that the writer understands this is a test, not a forecast.\u003c/p>\u003cp>b.  Against the counterexample. Someone can always name a person whose friendships were made online, and an unhedged claim dies on that example. \u003cem>Tends to\u003c/em> claims a central tendency, which is what the evidence supports and what the counterexample cannot touch.\u003c/p>","F3":"\u003cp>a.  Because it asks about a behaviour with a concrete referent rather than a feeling on a scale. A respondent can inflate a loneliness score without noticing; it is much harder to misreport how many people you could call at three in the morning, because answering requires you to count actual people.\u003c/p>\u003cp>b.  That friendship is built from accumulated small, unplanned contact rather than from significant conversations. \u003cem>Low-stakes\u003c/em> is doing the work because it explains why the loss is invisible: nobody notices the absence of interactions that never mattered individually, which is why the effect shows up slowly and in behaviour rather than suddenly and in self-report.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It does not engage the question.\u003c/strong> The professor asked about a causal claim and the two students disagreed about what the data measures. The response lists advantages and disadvantages of social media instead, which is a different topic.\u003c/p>\u003cp>2.  \u003cstrong>The conclusion abandons the task.\u003c/strong> “the truth is somewhere in the middle and we need more research” declines to take the position the task explicitly requires, and it does not say what research or what it would settle.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion.\u003c/p>","F5":"\u003cp>Model: \u003cem>If the surveys are measuring nostalgia rather than loss, then people who joined after the shift to remote work should not report the same decline — they have no office to be nostalgic about. That cohort comparison would settle it, and it is the one worth running.\u003c/em>\u003c/p>"},"model":["Caleb’s objection is the right one to start with, and it is testable rather than merely sceptical. If reporting has changed, then measures that do not depend on self-report should not show the same rise — and some of them do not. Time spent alone, club membership and the number of people respondents say they could call at three in the morning move much less sharply than the loneliness scores do.","That does not vindicate Caleb entirely, though, and here I think Yuki has the better of it. The behavioural measures do move, just slowly, and something has to explain the direction even if the magnitude is inflated. Where I would part from both is the word caused. The honest version is that a technology which absorbs discretionary time tends to crowd out the unplanned, low-stakes contact that friendships are actually made of — which is a smaller claim than Yuki’s and survives Caleb’s objection, because it predicts the slow movement in the behavioural data rather than the steep movement in the self-reports."],"model_html":"\u003cp>Caleb’s objection is the right one to start with, and it is testable rather than merely sceptical. If reporting has changed, then measures that do not depend on self-report should not show the same rise — and some of them do not. Time spent alone, club membership and the number of people respondents say they could call at three in the morning move much less sharply than the loneliness scores do.\u003c/p>\u003cp>That does not vindicate Caleb entirely, though, and here I think Yuki has the better of it. The behavioural measures do move, just slowly, and something has to explain the direction even if the magnitude is inflated. Where I would part from both is the word caused. The honest version is that a technology which absorbs discretionary time tends to crowd out the unplanned, low-stakes contact that friendships are actually made of — which is a smaller claim than Yuki’s and survives Caleb’s objection, because it predicts the slow movement in the behavioural data rather than the steep movement in the self-reports.\u003c/p>","model_band":5,"degraded":["In my opinion social media has both positive and negative effects on the young people. On the positive side they can stay in contact with their friends and family who live far away and they can find communities of people with the same interests. On the negative side they are spending too much time on the phone and they are comparing themselves with other people who look perfect on Instagram, so they feel bad about their own life. I agree with Yuki that the timing is suspicious but Caleb is also right that people talk more about mental health now. So I think the truth is somewhere in the middle and we need more research about this topic."],"degraded_html":"\u003cp>In my opinion social media has both positive and negative effects on the young people. On the positive side they can stay in contact with their friends and family who live far away and they can find communities of people with the same interests. On the negative side they are spending too much time on the phone and they are comparing themselves with other people who look perfect on Instagram, so they feel bad about their own life. I agree with Yuki that the timing is suspicious but Caleb is also right that people talk more about mental health now. So I think the truth is somewhere in the middle and we need more research about this topic.\u003c/p>","degraded_band":3,"model_words":174,"fault_list":{"tag":"F4","faults":["It does not engage the question. The professor asked about a causal claim and the two students disagreed about what the data measures. The response lists advantages and disadvantages of social media instead, which is a different topic.","The conclusion abandons the task. “the truth is somewhere in the middle and we need more research” declines to take the position the task explicitly requires, and it does not say what research or what it would settle.","Language. “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion."],"html":["\u003cp>1.  \u003cstrong>It does not engage the question.\u003c/strong> The professor asked about a causal claim and the two students disagreed about what the data measures. The response lists advantages and disadvantages of social media instead, which is a different topic.\u003c/p>","\u003cp>2.  \u003cstrong>The conclusion abandons the task.\u003c/strong> “the truth is somewhere in the middle and we need more research” declines to take the position the task explicitly requires, and it does not say what research or what it would settle.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion.\u003c/p>"]},"prof_name":"Dr Almeida","professor":"\u003cp>Surveys repeatedly find that reported loneliness has risen sharply among people under thirty over the past two decades, and the rise is often attributed to social media. What do you make of the claim that social media has made young people lonelier?\u003c/p>","students":[["Yuki","The timing is hard to ignore. The curve bends at almost exactly the point smartphones became universal, and the mechanism is obvious: time spent on a screen is time not spent with anyone."],["Caleb","I am sceptical. Loneliness is self-reported, and what has changed may be how willing people are to report it rather than how lonely they are. We have spent twenty years telling young people that mental health is worth talking about, and then we are surprised they talk about it."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It does not engage the question. The professor asked about a causal claim and the two students disagreed about what the data measures. The response lists advantages and disadvantages of social media instead, which is a different topic.","correct":true},{"text":"Language. “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion.","correct":true},{"text":"The conclusion abandons the task. “the truth is somewhere in the middle and we need more research” declines to take the position the task explicitly requires, and it does not say what research or what it would settle.","correct":true},{"text":"“I am waiting to continue my work” is pressure and probably untrue, and “as soon as possible” plus “when I can expect them” asks a busy supervisor to commit to a date.","correct":false},{"text":"“Clarify what the actual rule is” asks for an answer rather than a document, so the writer ends up with another verbal statement from another member of staff — the original problem.","correct":false},{"text":"“It is very successful there” is asserted without source, and “feel isolated and lost in their first year” repeats “first year” from the previous clause.","correct":false}],"key_html":"F4"}};</script>
