<script>window.ITEM={"kind":"exercise","id":"AD 088","slug":"ad-088","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Demography · cause ranking","payload":{"Strategy":"rank causes by which one others depend on","Grammar":"cleft with what","Vocabulary":"fertility, cohort, opportunity cost, provision","Convention":"ranking causes of a demographic change"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Jonas uses a variation argument. What is it?\u003c/p>\u003cp>b.  Why is \"changing values\" difficult to rank as a cause?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is opportunity cost, and what is a cohort?\u003c/p>\u003cp>b.  Distinguish postponement from a fall in completed fertility.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three in one sentence using a mechanism.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Mei’s cause is demoted but not discarded. What role does it keep?\u003c/p>\u003cp>b.  Why does the gap between desired and achieved fertility rank values last?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"What has changed everywhere is the opportunity cost\" — identify the structure and say what it does.\u003c/p>\u003cp>b.  \"an amplifier rather than an engine\" — why this metaphor?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the outcome fell in places where his opponent’s cause was absent, so that cause cannot account for the general pattern.\u003c/p>\u003cp>b.  Because values move together with the constraints that shape them, so it is hard to show they are causing the change rather than registering it.\u003c/p>","P2":"\u003cp>a.  Opportunity cost is the value of the best alternative given up; a cohort is a group sharing a defining event, here a birth year.\u003c/p>\u003cp>b.  Postponement shifts births later and may leave the final number unchanged; a fall in completed fertility means fewer children per woman by the end of her reproductive life. The two look identical for years.\u003c/p>","P3":"\u003cp>Model: \"Career cost first because it is present everywhere rates fell, housing second as an amplifier, values third because they follow the constraints.\"\u003c/p>","F1":"\u003cp>a.  It explains the geography of the effect. Housing does not account for the decline as such, but it explains why the decline is sharpest in particular cities, which is real explanatory work at a smaller scale.\u003c/p>\u003cp>b.  Because if people wanted fewer children, achieved fertility would match stated preferences. A persistent gap indicates constraint rather than preference, which places values downstream.\u003c/p>","F2":"\u003cp>a.  A what-cleft. It puts the writer’s candidate in focus position while implicitly contrasting it with the causes that did not change everywhere, so the ranking and its justification arrive in one sentence.\u003c/p>\u003cp>b.  Because it states the relationship precisely in two words: housing increases the size of an effect it did not create. That is more exact than calling it a secondary cause, and it explains why the correlation Mei observes is genuine.\u003c/p>","F3":"\u003cp>1.  No ranking at all — three causes are listed and none is weighed against the others.\u003c/p>\u003cp>2.  \"Women should not have to choose\" is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.\u003c/p>\u003cp>3.  \"Young people want to travel and enjoy their freedom\" treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored.\u003c/p>"},"model":["Jonas has the primary cause and Mei has correctly described how it operates in one kind of economy.","What has changed everywhere is the opportunity cost. A woman interrupting a career at twenty-eight loses earnings and seniority that do not return, and that penalty has grown precisely because women’s labour-market participation and qualifications have risen. Housing cannot explain the decline in countries where housing is cheap; the career penalty exists in all of them.","Mei’s evidence is still doing work, though not as a rival cause. Expensive housing raises the cost of the space a child requires and therefore sharpens the same calculation, which is why the effect is strongest in exactly the cities she names. It is an amplifier rather than an engine.","Values I would put third, because the direction of causation is unclear. Preferences about family size shift alongside the constraints rather than ahead of them, and surveys consistently find desired fertility well above achieved fertility — which is evidence that people are not getting what they want rather than wanting something different. So: opportunity cost first, housing second as amplifier, values third."],"model_html":"\u003cp>Jonas has the primary cause and Mei has correctly described how it operates in one kind of economy.\u003c/p>\u003cp>What has changed everywhere is the opportunity cost. A woman interrupting a career at twenty-eight loses earnings and seniority that do not return, and that penalty has grown precisely because women’s labour-market participation and qualifications have risen. Housing cannot explain the decline in countries where housing is cheap; the career penalty exists in all of them.\u003c/p>\u003cp>Mei’s evidence is still doing work, though not as a rival cause. Expensive housing raises the cost of the space a child requires and therefore sharpens the same calculation, which is why the effect is strongest in exactly the cities she names. It is an amplifier rather than an engine.\u003c/p>\u003cp>Values I would put third, because the direction of causation is unclear. Preferences about family size shift alongside the constraints rather than ahead of them, and surveys consistently find desired fertility well above achieved fertility — which is evidence that people are not getting what they want rather than wanting something different. So: opportunity cost first, housing second as amplifier, values third.\u003c/p>","model_band":5,"degraded":["I think the main reason is economic because young people today cannot afford to have children. Housing is extremely expensive, wages have not increased, and childcare costs are very high in most countries. Jonas mentions careers but women should not have to choose between work and family, and governments should provide better maternity leave and free childcare. Values have also changed because young people today want to travel and enjoy their freedom before settling down."],"degraded_html":"\u003cp>I think the main reason is economic because young people today cannot afford to have children. Housing is extremely expensive, wages have not increased, and childcare costs are very high in most countries. Jonas mentions careers but women should not have to choose between work and family, and governments should provide better maternity leave and free childcare. Values have also changed because young people today want to travel and enjoy their freedom before settling down.\u003c/p>","degraded_band":3,"model_words":187,"fault_list":{"tag":"F3","faults":["No ranking at all — three causes are listed and none is weighed against the others.","\"Women should not have to choose\" is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.","\"Young people want to travel and enjoy their freedom\" treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored."],"html":["\u003cp>1.  No ranking at all — three causes are listed and none is weighed against the others.\u003c/p>","\u003cp>2.  \"Women should not have to choose\" is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.\u003c/p>","\u003cp>3.  \"Young people want to travel and enjoy their freedom\" treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Birth rates have fallen well below replacement in many high-income countries. Explanations include the cost of housing, the career cost of childbearing for women, and changing values around family size. Which explains most of the decline?\u003c/p>","students":[["Mei","Housing. People have children when they have room for them, and in every expensive city the first birth is being postponed into the thirties."],["Jonas","Rates fell in countries with cheap housing too. What changed everywhere is what a woman gives up by having a child early — and that is a labour-market fact, not a housing one."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"No applicant reference, “some family problems” discloses vaguely where nothing needed disclosing, and “I hope this will not be a problem” asks for reassurance rather than information.","correct":false},{"text":"“Young people want to travel and enjoy their freedom” treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored.","correct":true},{"text":"“Could you tell me more about the two pathways” requests unbounded information rather than the two specific figures needed, so the second bullet fails and the reply will be a link to the handbook already consulted.","correct":false},{"text":"“Women should not have to choose” is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.","correct":true},{"text":"No alternatives, no delegation, no reallocation route, and “I am becoming quite worried” asks the reader to manage the writer’s anxiety rather than to sign a page.","correct":false},{"text":"No ranking at all — three causes are listed and none is weighed against the others.","correct":true}],"key_html":"F3"}};</script>
