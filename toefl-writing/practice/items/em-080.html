<script>window.ITEM={"kind":"exercise","id":"EM 080","slug":"em-080","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Resignation and handover","payload":{"Strategy":"resign by making your replacement’s job possible","Grammar":"future in the past","Vocabulary":"handover, successor, continuity, outstanding","Convention":"leaving a role mid-term"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  What is the difference between resigning and handing over?\u003c/p>\u003cp>b.  Why name the contentious item yourself?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a successor, and what does continuity mean here?\u003c/p>\u003cp>b.  What is outstanding business?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Resign in one sentence with a date and a reason.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The contentious item is given its own paragraph. Why not list it with the others?\u003c/p>\u003cp>b.  \"The committee should feel free to ignore the drafting, but the undertaking itself ought to be honoured\" — what distinction is this drawing?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I had expected to serve the full year\" — why the past perfect?\u003c/p>\u003cp>b.  \"so the thread does not die with me\" — what does this phrasing acknowledge?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Resigning ends your obligation; handing over transfers the work. A resignation without a handover converts your departure into somebody else’s problem.\u003c/p>\u003cp>b.  Because a commitment made on the record will otherwise be quietly lost, and the people who relied on it have no way of knowing. Flagging it is the only way the undertaking survives your departure.\u003c/p>","P2":"\u003cp>a.  A successor is the person who takes the role next; continuity is the preservation of the work across that change.\u003c/p>\u003cp>b.  Items formally before a body and not yet concluded — which is precisely what a handover has to enumerate.\u003c/p>","P3":"\u003cp>Model: \"I am resigning as student representative with effect from 30 June, as I will be on placement from July to December.\"\u003c/p>","F1":"\u003cp>a.  Because the other two are administrative and this one carries a promise to people outside the committee. Burying it in a list would let it be processed as routine, which is how undertakings disappear.\u003c/p>\u003cp>b.  Between the substance of the commitment and the writer’s version of it. Offering the draft while disclaiming ownership of the wording makes it easy for the committee to take up without feeling bound to a departing rep’s phrasing.\u003c/p>","F2":"\u003cp>a.  Because the expectation was formed before the placement intervened and no longer holds. The past perfect places it behind the change, which is what makes the apology sound like a fact rather than a formula.\u003c/p>\u003cp>b.  That business routed through one person usually stops when that person leaves. Naming the risk explains why Dr Mensah is copied, which otherwise looks like a courtesy rather than a handover step.\u003c/p>","F3":"\u003cp>1.  No handover of any kind — none of the three items is mentioned, so the second bullet fails and the third fails with it.\u003c/p>\u003cp>2.  \"Please let me know if there is anything I need to do before I leave\" puts the handover work on the committee secretary, who does not know what the rep was carrying.\u003c/p>\u003cp>3.  The effective date is \"starting in July\" rather than a date, and \"a great opportunity for me\" centres the writer in an email whose job is to protect the committee’s business.\u003c/p>"},"model":["Dear Dr Patel,","I am resigning as student representative with effect from 30 June, as I will be on placement in Cape Verde from July to December and could not attend. I had expected to serve the full year and I am sorry to leave it half done.","Three things are outstanding. The library opening-hours survey is complete and the report is attached — it needs tabling, not more work. The lab-safety induction review is with Dr Mensah and I have copied her here so the thread does not die with me.","The third is the one I want to flag rather than leave in a folder. The proposal to move SOC301 assessment to a single exam was opposed by every student I consulted, and I undertook at the May meeting to bring a written objection in September. Whoever replaces me will not know that promise was made, so I have drafted the objection and attached it. The committee should feel free to ignore the drafting, but the undertaking itself ought to be honoured by someone.","I have asked the Student Union to run a by-election in week 1 and I am happy to brief my successor by video call from the field.","Thank you for two useful terms.","Yours sincerely,","Lucia Barros"],"model_html":"\u003cp>Dear Dr Patel,\u003c/p>\u003cp>I am resigning as student representative with effect from 30 June, as I will be on placement in Cape Verde from July to December and could not attend. I had expected to serve the full year and I am sorry to leave it half done.\u003c/p>\u003cp>Three things are outstanding. The library opening-hours survey is complete and the report is attached — it needs tabling, not more work. The lab-safety induction review is with Dr Mensah and I have copied her here so the thread does not die with me.\u003c/p>\u003cp>The third is the one I want to flag rather than leave in a folder. The proposal to move SOC301 assessment to a single exam was opposed by every student I consulted, and I undertook at the May meeting to bring a written objection in September. Whoever replaces me will not know that promise was made, so I have drafted the objection and attached it. The committee should feel free to ignore the drafting, but the undertaking itself ought to be honoured by someone.\u003c/p>\u003cp>I have asked the Student Union to run a by-election in week 1 and I am happy to brief my successor by video call from the field.\u003c/p>\u003cp>Thank you for two useful terms.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Lucia Barros\u003c/p>","model_band":5,"degraded":["Dear Dr Patel, I am writing to let you know that unfortunately I will have to step down from my role as student representative, as I have been offered a placement abroad starting in July which is a great opportunity for me. I have really enjoyed being on the committee and I have learned a lot from it. I am sorry for any inconvenience this may cause. Please let me know if there is anything I need to do before I leave.","Lucia"],"degraded_html":"\u003cp>Dear Dr Patel, I am writing to let you know that unfortunately I will have to step down from my role as student representative, as I have been offered a placement abroad starting in July which is a great opportunity for me. I have really enjoyed being on the committee and I have learned a lot from it. I am sorry for any inconvenience this may cause. Please let me know if there is anything I need to do before I leave.\u003c/p>\u003cp>Lucia\u003c/p>","degraded_band":3,"model_words":215,"fault_list":{"tag":"F3","faults":["No handover of any kind — none of the three items is mentioned, so the second bullet fails and the third fails with it.","\"Please let me know if there is anything I need to do before I leave\" puts the handover work on the committee secretary, who does not know what the rep was carrying.","The effective date is \"starting in July\" rather than a date, and \"a great opportunity for me\" centres the writer in an email whose job is to protect the committee’s business."],"html":["\u003cp>1.  No handover of any kind — none of the three items is mentioned, so the second bullet fails and the third fails with it.\u003c/p>","\u003cp>2.  \"Please let me know if there is anything I need to do before I leave\" puts the handover work on the committee secretary, who does not know what the rep was carrying.\u003c/p>","\u003cp>3.  The effective date is \"starting in July\" rather than a date, and \"a great opportunity for me\" centres the writer in an email whose job is to protect the committee’s business.\u003c/p>"]},"scenario":"\u003cp>You are the student representative on a department committee and must resign because of a placement abroad. Three pieces of business are unfinished, one of them contentious.\u003c/p>","bullets":["Resign clearly, with a date.","Hand over the business.","Do not leave the contentious item to be discovered."],"header":[["To:","committee.secretary@northgate.ac.uk"],["Subject:","Student rep — resignation from 30 June, with handover"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Please let me know if there is anything I need to do before I leave” puts the handover work on the committee secretary, who does not know what the rep was carrying.","correct":true},{"text":"“Linguists have proven” and “language belongs to the people who speak it” are appeals to authority and to slogan where an argument was needed.","correct":false},{"text":"No handover of any kind — none of the three items is mentioned, so the second bullet fails and the third fails with it.","correct":true},{"text":"Luc’s actual argument — that the unbuilt third bridge carries risk of its own — is never addressed; “governments can always find the money if they really want to” denies the premise without evidence.","correct":false},{"text":"The effective date is “starting in July” rather than a date, and “a great opportunity for me” centres the writer in an email whose job is to protect the committee’s business.","correct":true},{"text":"“There is no real conflict between doing good and making money” denies the premise of the question, which is about what happens when there is one.","correct":false}],"key_html":"F3"}};</script>
