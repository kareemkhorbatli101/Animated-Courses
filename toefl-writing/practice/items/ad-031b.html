<script>window.ITEM={"kind":"exercise","id":"AD 031b","slug":"ad-031b","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environment · cause ranking","payload":{"Strategy":"rank by what each cause predicts about where the effect appears","Grammar":"causal chain with result clauses","Vocabulary":"runoff, abstraction, sewage, catchment","Convention":"ranking causes when one actor is politically unpopular"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Sara makes a claim about why sewage is salient. What is it?\u003c/p>\u003cp>b.  What measurement would settle the ranking?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a catchment, and what is diffuse pollution?\u003c/p>\u003cp>b.  What is abstraction, and why might it amplify the other two?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using where in the river each predicts damage.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response names a \"control\". What is it and why does it decide the question?\u003c/p>\u003cp>b.  It reranks abstraction upward on a different criterion. Which?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"with the result that the same nutrient load produces worse outcomes in a depleted river\" — why a result clause?\u003c/p>\u003cp>b.  \"Dag’s point survives in a different form\" — what does this sentence do for the response’s structure?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That visibility and photographability drive public attribution, which is a claim about perception rather than about ecology — and it explains Dag’s position without contradicting his facts.\u003c/p>\u003cp>b.  River length or site count in poor condition attributable to each source, and in particular the condition of sites with no sewage input.\u003c/p>","P2":"\u003cp>a.  A catchment is the whole area draining to a river. Diffuse pollution enters across that area rather than at a point, which is what makes it hard to attribute and regulate.\u003c/p>\u003cp>b.  Taking water out for supply. It amplifies because the same quantity of pollutant in less water is a higher concentration.\u003c/p>","P3":"\u003cp>Model: \"Sewage damage is concentrated below outfalls while nutrient damage appears in headwaters with no sewerage, so agriculture is the larger driver and abstraction the multiplier.\"\u003c/p>","F1":"\u003cp>a.  Headwater sites with no sewage infrastructure. They decide it because they isolate one cause: if those sites were healthy, sewage would be doing the work, and they are not.\u003c/p>\u003cp>b.  Tractability rather than magnitude — it is the cheapest lever because changing flow is easier than changing land use, and because it modifies the effect of everything else. Ranking by what you can move is a legitimate second ordering, provided you say that is what you are doing.\u003c/p>","F2":"\u003cp>a.  Because the argument needs the concentration effect to follow determinately from reduced flow. That is the whole basis for promoting abstraction to a multiplier, so a looser connector would weaken the claim the ranking depends on.\u003c/p>\u003cp>b.  It closes the response by returning to the classmate who was ranked second, and rescues his position on different ground. That is more generous and more interesting than simply declaring a winner, and it introduces the institutional point neither had made.\u003c/p>","F3":"\u003cp>1.  It never engages Sara’s spatial argument, which was the only evidence offered in the discussion.\u003c/p>\u003cp>2.  The reasoning is about culpability and resources rather than about causes: \"the farmers are small businesses\" is a reason not to fine them, not a reason they pollute less.\u003c/p>\u003cp>3.  Language: \"the main responsible\" (those mainly responsible); \"the pollution of the rivers\", \"the infrastructure\", \"the government\" over-articled; \"the rivers are dying\" is rhetoric standing in for the measurement the question needed.\u003c/p>"},"model":["Sara has the better of the comparison and Dag has the better of the politics, which is worth separating. The spatial test decides it: discharge damage is concentrated downstream of outfalls and recovers with distance, whereas nutrient enrichment appears across whole catchments including headwaters with no sewage infrastructure at all. Those headwater sites are the control, and they are in poor condition.","Abstraction I would rank second rather than third, because it is not really a parallel cause — it is a multiplier. Removing flow concentrates whatever else is present, with the result that the same nutrient load produces worse outcomes in a depleted river than in a full one. That makes it the cheapest lever even though it is not the largest source. Dag’s point survives in a different form: sewage is the cause with an identifiable defendant, and in a system where enforcement follows attribution, the diffuse source will go unaddressed however large it is. That is an argument about institutions rather than about rivers, and it is the better version of his case."],"model_html":"\u003cp>Sara has the better of the comparison and Dag has the better of the politics, which is worth separating. The spatial test decides it: discharge damage is concentrated downstream of outfalls and recovers with distance, whereas nutrient enrichment appears across whole catchments including headwaters with no sewage infrastructure at all. Those headwater sites are the control, and they are in poor condition.\u003c/p>\u003cp>Abstraction I would rank second rather than third, because it is not really a parallel cause — it is a multiplier. Removing flow concentrates whatever else is present, with the result that the same nutrient load produces worse outcomes in a depleted river than in a full one. That makes it the cheapest lever even though it is not the largest source. Dag’s point survives in a different form: sewage is the cause with an identifiable defendant, and in a system where enforcement follows attribution, the diffuse source will go unaddressed however large it is. That is an argument about institutions rather than about rivers, and it is the better version of his case.\u003c/p>","model_band":5,"degraded":["I agree with Dag that the water companies are the main responsible for the pollution of the rivers because they are discharging raw sewage directly into the water to save money, which is a scandal. They make enormous profits and pay dividends to their shareholders while the rivers are dying. Of course agriculture also pollutes with fertilisers and pesticides, but the farmers are small businesses and they do not have the same resources. The government must impose much heavier fines on the water companies and force them to invest in the infrastructure."],"degraded_html":"\u003cp>I agree with Dag that the water companies are the main responsible for the pollution of the rivers because they are discharging raw sewage directly into the water to save money, which is a scandal. They make enormous profits and pay dividends to their shareholders while the rivers are dying. Of course agriculture also pollutes with fertilisers and pesticides, but the farmers are small businesses and they do not have the same resources. The government must impose much heavier fines on the water companies and force them to invest in the infrastructure.\u003c/p>","degraded_band":3,"model_words":175,"fault_list":{"tag":"F3","faults":["It never engages Sara’s spatial argument, which was the only evidence offered in the discussion.","The reasoning is about culpability and resources rather than about causes: \"the farmers are small businesses\" is a reason not to fine them, not a reason they pollute less.","Language: \"the main responsible\" (those mainly responsible); \"the pollution of the rivers\", \"the infrastructure\", \"the government\" over-articled; \"the rivers are dying\" is rhetoric standing in for the measurement the question needed."],"html":["\u003cp>1.  It never engages Sara’s spatial argument, which was the only evidence offered in the discussion.\u003c/p>","\u003cp>2.  The reasoning is about culpability and resources rather than about causes: \"the farmers are small businesses\" is a reason not to fine them, not a reason they pollute less.\u003c/p>","\u003cp>3.  Language: \"the main responsible\" (those mainly responsible); \"the pollution of the rivers\", \"the infrastructure\", \"the government\" over-articled; \"the rivers are dying\" is rhetoric standing in for the measurement the question needed.\u003c/p>"]},"prof_name":"Professor Haugen","professor":"\u003cp>Rivers in many countries have deteriorated sharply in ecological condition. Candidate causes include sewage discharge, agricultural runoff, and water abstraction for supply. Which is the main driver?\u003c/p>","students":[["Dag","Sewage. It is the one with a named culprit, a public record of discharges and a regulator that has been asleep. Everything else is a diffuse story that lets the responsible party hide."],["Sara","Agriculture, by a distance. Nutrient runoff affects far more river length than discharge points do, and it does not stop when the rain does. Sewage is the one people can photograph, which is not the same as the one doing most of the damage."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“I hope you will ask me again another time” asks the reader to do the future work of maintaining the relationship, and “Thank you for your understanding” thanks them in advance for accepting.","correct":false},{"text":"No specific questions. “The procedure” leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.","correct":false},{"text":"Language: “the main responsible” (those mainly responsible); “the pollution of the rivers”, “the infrastructure”, “the government” over-articled; “the rivers are dying” is rhetoric standing in for the measurement the question needed.","correct":true},{"text":"It never engages Sara’s spatial argument, which was the only evidence offered in the discussion.","correct":true},{"text":"It accuses and generalises. “You charged me”, “nobody did anything, as usual”. The second phrase turns one error into a character judgement about the department.","correct":false},{"text":"The reasoning is about culpability and resources rather than about causes: “the farmers are small businesses” is a reason not to fine them, not a reason they pollute less.","correct":true}],"key_html":"F3"}};</script>
