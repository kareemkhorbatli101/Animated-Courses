<script>window.ITEM={"kind":"exercise","id":"EM 019","slug":"em-019","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"when the harm is potential rather than actual, say so precisely","Grammar":"the result clause","Vocabulary":"allergen, labelling, cross-contamination, protocol","Convention":"raising a safety matter without alarming or accusing"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Nothing bad actually happened. Does that make the email weaker?\u003c/p>\u003cp>b.  Who is this email really for — you, or the next person?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is \u003cem>cross-contamination\u003c/em>, and how does it differ from an ingredient being present?\u003c/p>\u003cp>b.  What is a \u003cem>protocol\u003c/em>, and why ask about one rather than about a person?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the risk in one sentence using a result clause, without dramatising it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer reports that nothing happened. Why state that plainly rather than leave the danger implied?\u003c/p>\u003cp>b.  What exactly is the request, and why is it not “fix the labels”?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “with the result that checking carefully was not enough”. Why a result clause rather than \u003cem>so I could have been seriously hurt\u003c/em>?\u003c/p>\u003cp>b.  “the labelling and the verbal confirmation both said the same wrong thing”. What does this sentence establish that neither failure alone would?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No — stronger. A near miss reported calmly is a gift to a manager: it identifies a failure before it causes harm, and it is far harder to dismiss than an account coloured by injury.\u003c/p>\u003cp>b.  The next person. Framing it that way is both true and tactically sound: it removes any suggestion that you are seeking something for yourself, which is what makes the safety point land.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Cross-contamination\u003c/strong> is traces transferred from another dish or surface; an ingredient being present is a recipe fact. Whole cashews are the second, which means the label was wrong rather than optimistic — a different and more serious failure.\u003c/p>\u003cp>b.  A \u003cstrong>protocol\u003c/strong> is the standing procedure. Asking about it directs the manager to the system rather than to the individual who served you, which is where the fix actually lives.\u003c/p>","P3":"\u003cp>Model: \u003cem>The labelling and the verbal confirmation both said the same wrong thing, with the result that checking carefully was not enough.\u003c/em>\u003c/p>\u003cp>It states the failure of the safety system itself, which is more alarming to a manager than any description of what might have happened to you.\u003c/p>","F1":"\u003cp>a.  Because it establishes that you are reporting rather than claiming. A manager braced for a complaint relaxes and starts thinking about the problem — and your credibility on everything else goes up.\u003c/p>\u003cp>b.  The protocol for updating allergen cards, and whether counter staff share the same source. Fixing one label fixes one dish; fixing the update path fixes every dish, which is what the third bullet asked for.\u003c/p>","F2":"\u003cp>a.  Because the result clause states what the failure \u003cem>did\u003c/em> rather than what it might have done. It is a fact about the system, not a hypothetical about your body, and a manager can act on the first.\u003c/p>\u003cp>b.  That the backup failed with the primary. One wrong label is an error; a wrong label plus a confirmation from staff reading the same wrong source is a single point of failure — which is a systems finding, and much more serious.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>Overstatement.\u003c/strong> “I almost died” is not what happened; the writer stopped after a mouthful and had no reaction. Overstating a safety report is the fastest way to have it treated as an emotional complaint.\u003c/p>\u003cp>2.  \u003cstrong>No usable request.\u003c/strong> “what are you going to do about it” and a demand for an apology. Nothing is asked about the labelling process, so the third bullet fails and nothing changes.\u003c/p>\u003cp>3.  \u003cstrong>Language and detail.\u003c/strong> No date, no refectory, no dish named precisely; “negligence” is a legal characterisation the writer cannot support; and there is a comma splice at “unacceptable, somebody could be killed”.\u003c/p>"},"model":["Dear Catering Manager,","On Thursday 16 May I took the vegetable tagine from the hot counter in the Lambert refectory. The allergen card beside it listed no nuts, and I checked again with the member of staff serving, who confirmed it. When I started eating I found whole cashews in it.","I have an anaphylactic nut allergy and carry an auto-injector. I stopped after the first mouthful and had no reaction, so nothing came of it this time. The point is that the labelling and the verbal confirmation both said the same wrong thing, with the result that checking carefully was not enough.","Could you tell me what the protocol is for updating an allergen card when a recipe changes, and whether the counter staff are working from the same information? I am not looking for anyone to be blamed — I would just rather the next person who asks gets a correct answer.","Thank you.","Yours sincerely,","Hannah Weiss"],"model_html":"\u003cp>Dear Catering Manager,\u003c/p>\u003cp>On Thursday 16 May I took the vegetable tagine from the hot counter in the Lambert refectory. The allergen card beside it listed no nuts, and I checked again with the member of staff serving, who confirmed it. When I started eating I found whole cashews in it.\u003c/p>\u003cp>I have an anaphylactic nut allergy and carry an auto-injector. I stopped after the first mouthful and had no reaction, so nothing came of it this time. The point is that the labelling and the verbal confirmation both said the same wrong thing, with the result that checking carefully was not enough.\u003c/p>\u003cp>Could you tell me what the protocol is for updating an allergen card when a recipe changes, and whether the counter staff are working from the same information? I am not looking for anyone to be blamed — I would just rather the next person who asks gets a correct answer.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Hannah Weiss\u003c/p>","model_band":5,"degraded":["Dear Manager, Yesterday I almost died because of your canteen. I am severely allergic to nuts and your staff told me the tagine had no nuts but it was full of cashews. This is extremely dangerous and completely unacceptable, somebody could be killed by this negligence. I want to know what you are going to do about it and I expect a full apology.","Hannah"],"degraded_html":"\u003cp>Dear Manager, Yesterday I almost died because of your canteen. I am severely allergic to nuts and your staff told me the tagine had no nuts but it was full of cashews. This is extremely dangerous and completely unacceptable, somebody could be killed by this negligence. I want to know what you are going to do about it and I expect a full apology.\u003c/p>\u003cp>Hannah\u003c/p>","degraded_band":3,"model_words":160,"fault_list":{"tag":"F3","faults":["Overstatement. “I almost died” is not what happened; the writer stopped after a mouthful and had no reaction. Overstating a safety report is the fastest way to have it treated as an emotional complaint.","No usable request. “what are you going to do about it” and a demand for an apology. Nothing is asked about the labelling process, so the third bullet fails and nothing changes.","Language and detail. No date, no refectory, no dish named precisely; “negligence” is a legal characterisation the writer cannot support; and there is a comma splice at “unacceptable, somebody could be killed”."],"html":["\u003cp>1.  \u003cstrong>Overstatement.\u003c/strong> “I almost died” is not what happened; the writer stopped after a mouthful and had no reaction. Overstating a safety report is the fastest way to have it treated as an emotional complaint.\u003c/p>","\u003cp>2.  \u003cstrong>No usable request.\u003c/strong> “what are you going to do about it” and a demand for an apology. Nothing is asked about the labelling process, so the third bullet fails and nothing changes.\u003c/p>","\u003cp>3.  \u003cstrong>Language and detail.\u003c/strong> No date, no refectory, no dish named precisely; “negligence” is a legal characterisation the writer cannot support; and there is a comma splice at “unacceptable, somebody could be killed”.\u003c/p>"]},"scenario":"\u003cp>A dish in the canteen was labelled as containing no nuts. You have a severe nut allergy, asked at the counter, was reassured, and then found cashews in it. You did not eat enough to react, but you could have.\u003c/p>","bullets":["Say exactly what happened.","Make clear what the risk was.","Ask for the thing that prevents a recurrence."],"header":[["To:","catering.manager@northgate.ac.uk"],["Subject:","Nut allergen in a dish labelled nut-free — 16 May, Lambert refectory"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The notice-period distinction, which is where the policy actually lives, never appears; and the ban proposed at the end is not connected to anything argued. Language: “the weaker party”, “the market”, “individual workers” over-articled; “companies always talk about” is unsupported.","correct":false},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":false},{"text":"No usable request. “what are you going to do about it” and a demand for an apology. Nothing is asked about the labelling process, so the third bullet fails and nothing changes.","correct":true},{"text":"It restates the two positions as “efficiency versus freedom” and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.","correct":false},{"text":"Overstatement. “I almost died” is not what happened; the writer stopped after a mouthful and had no reaction. Overstating a safety report is the fastest way to have it treated as an emotional complaint.","correct":true},{"text":"Language and detail. No date, no refectory, no dish named precisely; “negligence” is a legal characterisation the writer cannot support; and there is a comma splice at “unacceptable, somebody could be killed”.","correct":true}],"key_html":"F3"}};</script>
