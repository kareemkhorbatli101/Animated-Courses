<script>window.ITEM={"kind":"exercise","id":"AD 041b","slug":"ad-041b","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology and society · responsibility: who should act","payload":{"Strategy":"ask who can change the condition rather than who caused it","Grammar":"modals of obligation across agents","Vocabulary":"determinant, intervention, locus, upstream","Convention":"assigning duty without implying blame"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Sam makes an argument about feasibility. Does it answer Greta’s point?\u003c/p>\u003cp>b.  Greta raises a crowding-out worry. State it precisely.\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a determinant, and what does upstream mean here?\u003c/p>\u003cp>b.  What is the locus of an intervention?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State who should act in one sentence that avoids blaming anyone.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response takes Greta’s worry seriously and then rejects it. On what grounds?\u003c/p>\u003cp>b.  The final clause gives a reason for choosing local government. What makes it strong?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Being known is not a task\" — why is this five-word sentence the pivot of the response?\u003c/p>\u003cp>b.  \"by definition\" — what is it doing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Partly. It shows the duty cannot be enforced, but not that Greta is wrong about what happens when the state assumes it — those are different claims.\u003c/p>\u003cp>b.  That public provision may reduce the informal care families would otherwise supply, so the total rises by less than the service provides, or not at all.\u003c/p>","P2":"\u003cp>a.  A determinant is a factor that shapes an outcome; upstream means acting on the conditions rather than the symptom.\u003c/p>\u003cp>b.  The point in a causal chain where the intervention is applied — which is exactly what the response is choosing.\u003c/p>","P3":"\u003cp>Model: \"The duty should sit with local government, not because families have failed but because it is the only body that can find the people who have no family at all.\"\u003c/p>","F1":"\u003cp>a.  On the mechanism. Crowding out requires the service and the informal good to be substitutes, and the response argues they are not — so the worry is well founded in general and inapplicable here.\u003c/p>\u003cp>b.  It identifies something only that body can do, rather than something it would be nice for it to do. A duty allocated by unique capability is far harder to argue with than one allocated by resources or by fault.\u003c/p>","F2":"\u003cp>a.  Because the entire rejection of Greta’s worry turns on it. If being known were a task, a service could perform it and displacement would follow; because it is not, the substitution the worry requires cannot occur.\u003c/p>\u003cp>b.  It marks the claim as true by the meaning of the terms rather than by evidence: people who have nobody have, by definition, no family to notice them. That makes the justification for a public locus airtight rather than empirical.\u003c/p>","F3":"\u003cp>1.  It opens with a generalised lament about modern society that neither classmate raised and that supports no conclusion.\u003c/p>\u003cp>2.  It allocates to everyone — families, government, communities — which is the answer the question exists to improve on, and Greta’s crowding-out worry is contradicted without being noticed.\u003c/p>\u003cp>3.  Language: \"the older people\", \"family life\", \"the government\" over-articled; \"do not care about their neighbours\" is an unsupported claim about motives; and the nostalgia in the second sentence is doing the work that evidence should.\u003c/p>"},"model":["Sam is right that a duty nobody can discharge is not a duty, and Greta is pointing at something real that his objection does not reach. Her worry is not that families should be compelled but that provision can displace what it was meant to supplement — and there is some evidence for that in other domains. The question is whether it applies to this one.","I do not think it does, because the mechanism is wrong. Crowding out happens where a service substitutes for an identical good: paid care can replace unpaid care because the task is the same. Being known is not a task and no service supplies it, which means a befriending scheme cannot displace a relationship it is incapable of providing. What it can do is reduce the isolation that makes contact harder to restart. So I would place the duty with local government, on the narrow ground that it is the only body that can identify who is isolated at all — through housing, libraries, adult services — and that identifying them is the part families, by definition, cannot do for the people who have nobody."],"model_html":"\u003cp>Sam is right that a duty nobody can discharge is not a duty, and Greta is pointing at something real that his objection does not reach. Her worry is not that families should be compelled but that provision can displace what it was meant to supplement — and there is some evidence for that in other domains. The question is whether it applies to this one.\u003c/p>\u003cp>I do not think it does, because the mechanism is wrong. Crowding out happens where a service substitutes for an identical good: paid care can replace unpaid care because the task is the same. Being known is not a task and no service supplies it, which means a befriending scheme cannot displace a relationship it is incapable of providing. What it can do is reduce the isolation that makes contact harder to restart. So I would place the duty with local government, on the narrow ground that it is the only body that can identify who is isolated at all — through housing, libraries, adult services — and that identifying them is the part families, by definition, cannot do for the people who have nobody.\u003c/p>","model_band":5,"degraded":["I think this is a problem of modern society where people are more and more individualistic and do not care about their neighbours or even their own parents. In the past families lived together and the older people were respected and included in family life, but today everybody is busy with work and technology. In my opinion families should take more responsibility for their elderly relatives, but also the government should provide services like day centres and home visits, and communities should organise activities for older people so they do not feel alone."],"degraded_html":"\u003cp>I think this is a problem of modern society where people are more and more individualistic and do not care about their neighbours or even their own parents. In the past families lived together and the older people were respected and included in family life, but today everybody is busy with work and technology. In my opinion families should take more responsibility for their elderly relatives, but also the government should provide services like day centres and home visits, and communities should organise activities for older people so they do not feel alone.\u003c/p>","degraded_band":3,"model_words":188,"fault_list":{"tag":"F3","faults":["It opens with a generalised lament about modern society that neither classmate raised and that supports no conclusion.","It allocates to everyone — families, government, communities — which is the answer the question exists to improve on, and Greta’s crowding-out worry is contradicted without being noticed.","Language: \"the older people\", \"family life\", \"the government\" over-articled; \"do not care about their neighbours\" is an unsupported claim about motives; and the nostalgia in the second sentence is doing the work that evidence should."],"html":["\u003cp>1.  It opens with a generalised lament about modern society that neither classmate raised and that supports no conclusion.\u003c/p>","\u003cp>2.  It allocates to everyone — families, government, communities — which is the answer the question exists to improve on, and Greta’s crowding-out worry is contradicted without being noticed.\u003c/p>","\u003cp>3.  Language: \"the older people\", \"family life\", \"the government\" over-articled; \"do not care about their neighbours\" is an unsupported claim about motives; and the nostalgia in the second sentence is doing the work that evidence should.\u003c/p>"]},"prof_name":"Dr Almeida","professor":"\u003cp>Loneliness among older people is associated with worse health outcomes and higher care costs. Responsibility for addressing it is variously placed on families, local government and health services. Where does it belong?\u003c/p>","students":[["Greta","Families, uncomfortable as that is. No service replaces being known, and a state that takes over the duty removes the expectation that anyone else will perform it."],["Sam","That is a prescription nobody can act on. Families are dispersed, often working two jobs, sometimes estranged for good reasons. Assigning a duty to people who cannot discharge it is a way of assigning it to nobody."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It opens with a generalised lament about modern society that neither classmate raised and that supports no conclusion.","correct":true},{"text":"Language: “the older people”, “family life”, “the government” over-articled; “do not care about their neighbours” is an unsupported claim about motives; and the nostalgia in the second sentence is doing the work that evidence should.","correct":true},{"text":"No alternatives, no delegation, no reallocation route, and “I am becoming quite worried” asks the reader to manage the writer’s anxiety rather than to sign a page.","correct":false},{"text":"“Otherwise I will assume it is fine to go ahead” makes silence into consent, which is exactly backwards.","correct":false},{"text":"“Trust your instinct, you usually know deep down” is reassurance rather than help, and “I am sure you will make the right decision” pre-approves any outcome, which makes it worthless as a judgement.","correct":false},{"text":"It allocates to everyone — families, government, communities — which is the answer the question exists to improve on, and Greta’s crowding-out worry is contradicted without being noticed.","correct":true}],"key_html":"F3"}};</script>
