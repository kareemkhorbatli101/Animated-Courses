<script>window.ITEM={"kind":"exercise","id":"AD 092","slug":"ad-092","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Sport science · policy choice","payload":{"Strategy":"choose the rule whose enforcement is possible","Grammar":"relative clauses with whose","Vocabulary":"eligibility, category, enforcement, threshold","Convention":"choosing a rule that must be administrable"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Kwame is making an administrability argument. Why is that not merely practical?\u003c/p>\u003cp>b.  What does a category in sport have to do besides be accurate?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is eligibility, and what is a threshold?\u003c/p>\u003cp>b.  What does administrability mean for a rule?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names the precision you give up.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response treats administrability as a fairness question rather than a practical one. How does it get there?\u003c/p>\u003cp>b.  Why does it insist on publishing the threshold with its justification?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"A rule whose application requires contested measurements\" — what does the whose-clause contribute?\u003c/p>\u003cp>b.  \"accept the unfairness at the margins\" — why state the cost so plainly?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because a rule that cannot be applied uniformly produces different outcomes for similar athletes, and that is an unfairness of the same kind the accurate category was meant to remove.\u003c/p>\u003cp>b.  It has to be applicable by officials with ordinary resources, stable enough to plan a career around, and resistant to litigation.\u003c/p>","P2":"\u003cp>a.  Eligibility is whether an athlete may compete in a category; a threshold is the value at which the boundary is drawn.\u003c/p>\u003cp>b.  Whether it can be applied consistently by the people who must apply it, with the information actually available to them.\u003c/p>","P3":"\u003cp>Model: \"Use the fewest bright-line criteria that capture most of the difference, accepting unfairness at the margins.\"\u003c/p>","F1":"\u003cp>a.  By showing that inconsistent application produces outcomes tracking resources rather than physiology. Once the variation is systematic and falls on the least represented athletes, it is a fairness defect rather than an administrative one.\u003c/p>\u003cp>b.  Because a bright line that is admitted to be imprecise can be argued with and revised, while one presented as scientific invites endless litigation about the science. Publishing the reasoning is what makes a crude rule legitimate.\u003c/p>","F2":"\u003cp>a.  It attaches the disqualifying property to the rule in a single phrase, so the sentence can go straight to the consequence. It also echoes Kwame’s own construction, which marks the response as taking up his argument rather than restating it.\u003c/p>\u003cp>b.  Because every option in this question is unfair to someone, and a position that hides its cost is not a position. Naming it also pre-empts the obvious objection and makes the comparison with Ilse’s option honest.\u003c/p>","F3":"\u003cp>1.  \"There are no easy answers\" and \"consult experts\" avoid the choice the prompt requires.\u003c/p>\u003cp>2.  Kwame’s argument about enforcement is never engaged — \"based on the best available research\" is precisely the approach he says cannot be applied consistently.\u003c/p>\u003cp>3.  \"A level playing field\" and \"fairness is the most important principle\" restate the problem as if it were the solution, with no criterion, threshold or trade-off anywhere.\u003c/p>"},"model":["Kwame has the stronger principle, and the reason is that a rule nobody can apply consistently produces less fairness than a cruder rule applied the same way to everyone.","Ilse is right that inherited categories are crude and that better measurement is available. Where a trait demonstrably dominates performance, a category ignoring it is not a contest in any meaningful sense, and defending tradition for its own sake is not an argument.","But a category is not only a description; it is an instruction to officials. A rule whose application requires contested measurements, expert interpretation and a right of appeal will be applied differently in a national championship and a school meet, and the variation will track resources rather than physiology. That is a fairness cost, not an inconvenience, and it falls on exactly the athletes with least access to representation.","So I would set categories on the smallest number of bright-line criteria that capture most of the performance difference, accept the unfairness at the margins, and publish the threshold with its justification. Ilse’s precision is worth having only where it can be delivered identically at every level of the sport, which in practice means rarely."],"model_html":"\u003cp>Kwame has the stronger principle, and the reason is that a rule nobody can apply consistently produces less fairness than a cruder rule applied the same way to everyone.\u003c/p>\u003cp>Ilse is right that inherited categories are crude and that better measurement is available. Where a trait demonstrably dominates performance, a category ignoring it is not a contest in any meaningful sense, and defending tradition for its own sake is not an argument.\u003c/p>\u003cp>But a category is not only a description; it is an instruction to officials. A rule whose application requires contested measurements, expert interpretation and a right of appeal will be applied differently in der’s failure. “I sent you three weeks ago and I still have not received your confirmation” is an accusation in the first sentence.","correct":false},{"text":"Kwame’s argument about enforcement is never engaged — “based on the best available research” is precisely the approach he says cannot be applied consistently.","correct":true},{"text":"“There are no easy answers” and “consult experts” avoid the choice the prompt requires.","correct":true},{"text":"Language: three comma splices, and “nobody will know it on your CV” asserts something about an audience the writer has not identified.","correct":false}],"key_html":"F3"}};</script>
