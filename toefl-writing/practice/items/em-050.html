<script>window.ITEM={"kind":"exercise","id":"EM 050","slug":"em-050","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask for the document rather than the answer","Grammar":"enumerating with ordinals","Vocabulary":"terms of reference, minutes, policy, procedure","Convention":"enquiring where a written rule probably exists"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why ask for the policy rather than for permission?\u003c/p>\u003cp>b.  Why is it important not to argue the merits in this email?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What are terms of reference, and what are minutes?\u003c/p>\u003cp>b.  Distinguish a policy from a procedure.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask for the document in one sentence that does not imply it may not exist.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer says they are not disputing the time. Why open there?\u003c/p>\u003cp>b.  Three possible sources are named. What does that signal?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"so that we plan correctly\" — what does this purpose clause do for the request?\u003c/p>\u003cp>b.  \"knowing which it is would help, because the process ... is different\" — why justify the question?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the written rule is a fact and permission is a judgement. A request for a document is almost always granted and tells you what you are actually dealing with, including whether there is anything to appeal.\u003c/p>\u003cp>b.  Because arguing the merits turns an administrative request into a dispute, and the person who can send you a document is rarely the person who can change the rule. You need the document first in any case.\u003c/p>","P2":"\u003cp>a.  Terms of reference define a body’s scope and authority; minutes record what it decided.\u003c/p>\u003cp>b.  A policy states what applies; a procedure states how it is carried out. An exception to the first usually goes to a committee, to the second to an administrator — which is the distinction the email is really after.\u003c/p>","P3":"\u003cp>Model: \"Could you point me to the policy that sets the finishing time for student events in the building?\"\u003c/p>","F1":"\u003cp>a.  Because without it the request for the written rule reads as the first step in a challenge, and the reply becomes cautious. Disclaiming the dispute makes the document easy to hand over.\u003c/p>\u003cp>b.  That the writer understands how institutions hold rules, which makes a vague answer harder to give. It also converts an open question into a multiple choice, which is far quicker to answer.\u003c/p>","F2":"\u003cp>a.  It supplies a legitimate and unthreatening reason for wanting the document — planning rather than challenging — which is what makes the request routine.\u003c/p>\u003cp>b.  Because the reader might otherwise answer only the first half, with the time. Explaining that the source determines the writer’s next step makes the second half worth answering too.\u003c/p>","F3":"\u003cp>1.  It argues the merits in the final sentence, which is exactly what the third bullet rules out and which invites a defensive reply about licensing and staffing.\u003c/p>\u003cp>2.  \"Clarify what the actual rule is\" asks for an answer rather than a document, so the writer ends up with another verbal statement from another member of staff — the original problem.\u003c/p>\u003cp>3.  \"Very confusing and makes it impossible to plan\" is a complaint about the institution’s communication, and \"several times\" is vaguer than the three and one the writer could have counted.\u003c/p>"},"model":["Dear Venues Team,","We have been told on three occasions that events in the Union building must finish by 9 p.m., and on one occasion by 10 p.m. I am not writing to dispute either time — I would just like to work from the written version so that we plan correctly.","Could you point me to the policy that sets the finishing time for student events in the building? If it is in a document I can read myself, a link or a name is all I need. If it is a decision rather than a policy — a committee minute, say, or a condition of the building’s licence — knowing which it is would help, because the process for asking about an exception is different in each case.","Thank you very much.","Best wishes,","Ana Oyelaran — Northgate Film Society"],"model_html":"\u003cp>Dear Venues Team,\u003c/p>\u003cp>We have been told on three occasions that events in the Union building must finish by 9 p.m., and on one occasion by 10 p.m. I am not writing to dispute either time — I would just like to work from the written version so that we plan correctly.\u003c/p>\u003cp>Could you point me to the policy that sets the finishing time for student events in the building? If it is in a document I can read myself, a link or a name is all I need. If it is a decision rather than a policy — a committee minute, say, or a condition of the building’s licence — knowing which it is would help, because the process for asking about an exception is different in each case.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ana Oyelaran — Northgate Film Society\u003c/p>","model_band":5,"degraded":["Dear Venues Team, We have been told several times that we cannot have events after 9 p.m. but different members of staff have given us different information, which is very confusing and makes it impossible to plan. Could you please clarify what the actual rule is and where it comes from? It seems strange to us that a Students’ Union building should close so early when students are the ones using it.","Ana"],"degraded_html":"\u003cp>Dear Venues Team, We have been told several times that we cannot have events after 9 p.m. but different members of staff have given us different information, which is very confusing and makes it impossible to plan. Could you please clarify what the actual rule is and where it comes from? It seems strange to us that a Students’ Union building should close so early when students are the ones using it.\u003c/p>\u003cp>Ana\u003c/p>","degraded_band":3,"model_words":140,"fault_list":{"tag":"F3","faults":["It argues the merits in the final sentence, which is exactly what the third bullet rules out and which invites a defensive reply about licensing and staffing.","\"Clarify what the actual rule is\" asks for an answer rather than a document, so the writer ends up with another verbal statement from another member of staff — the original problem.","\"Very confusing and makes it impossible to plan\" is a complaint about the institution’s communication, and \"several times\" is vaguer than the three and one the writer could have counted."],"html":["\u003cp>1.  It argues the merits in the final sentence, which is exactly what the third bullet rules out and which invites a defensive reply about licensing and staffing.\u003c/p>","\u003cp>2.  \"Clarify what the actual rule is\" asks for an answer rather than a document, so the writer ends up with another verbal statement from another member of staff — the original problem.\u003c/p>","\u003cp>3.  \"Very confusing and makes it impossible to plan\" is a complaint about the institution’s communication, and \"several times\" is vaguer than the three and one the writer could have counted.\u003c/p>"]},"scenario":"\u003cp>Your society has been told it cannot hold events after 9 p.m. in the Students’ Union building. Nobody can point to a written rule and different staff have given different cut-off times.\u003c/p>","bullets":["Say what you have been told.","Ask for the rule itself.","Avoid arguing about whether it is reasonable."],"header":[["To:","venues.su@northgate.ac.uk"],["Subject:","Evening event curfew — request for the written policy"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Clarify what the actual rule is” asks for an answer rather than a document, so the writer ends up with another verbal statement from another member of staff — the original problem.","correct":true},{"text":"“We have to accept some sacrifices for the greater good” restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.","correct":false},{"text":"It argues the merits in the final sentence, which is exactly what the third bullet rules out and which invites a defensive reply about licensing and staffing.","correct":true},{"text":"“Linguists have proven” and “language belongs to the people who speak it” are appeals to authority and to slogan where an argument was needed.","correct":false},{"text":"Language: “a small problem”, “not fair for the quiet people”, “the hospitals”, “the urgent cases” — register is conversational throughout and the articles are systematically wrong.","correct":false},{"text":"“Very confusing and makes it impossible to plan” is a complaint about the institution’s communication, and “several times” is vaguer than the three and one the writer could have counted.","correct":true}],"key_html":"F3"}};</script>
