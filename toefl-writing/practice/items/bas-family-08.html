<script>window.ITEM={"kind":"family","id":"BAS 059–066","slug":"bas-family-08","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 8 of 12 — emphasis and information structure","payload":{"Strategy":"the end of the sentence is the loudest place; put the point there","Grammar":"it-clefts, wh-clefts, fronting, negative inversion, there, end weight","Vocabulary":"nothing new — this family rearranges what you already have","Convention":"inversion after a fronted negative is obligatory, not optional"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>English has fixed word order, so emphasis has to be built rather than spoken. These are the devices that build it. They are also the clearest single signal of a writer operating above band 3, because they require you to decide what your sentence is actually about.\u003c/p>","preview":[{"tag":"P1","title":"Move the spotlight","html":"\u003cp>The plain sentence is: \u003c/p>\u003cpre class=\"mono\">The timing put me off.\u003c/pre>\u003cp>Rewrite it twice, once beginning It was … and once beginning What … . What does each version emphasise?\u003c/p>"},{"tag":"P2","title":"The obligatory inversion","html":"\u003cp>One of these is wrong. Which, and what rule has been broken?\u003c/p>\u003cpre class=\"mono\">(i)  Never before had I seen such a crowd.\n(ii) Never before I had seen such a crowd.\u003c/pre>"},{"tag":"P3","title":"Why the long thing goes last","html":"\u003cp>Which of these reads better, and what principle decides it?\u003c/p>\u003cpre class=\"mono\">(a) The committee made the report it had suppressed for a\n    year public last week.\n(b) The committee made public last week the report it had\n    suppressed for a year.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Three ways to say one thing","html":"\u003cp>Rewrite as (a) an it-cleft, (b) a wh-cleft, (c) with negative inversion.\u003c/p>\u003cpre class=\"mono\">The lack of consultation annoyed people most.\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) Not only she was late, but she forgot the files.\n(b) It was the timing what put me off.\n(c) There is two places left.\n(d) Rarely I have seen such a poor turnout.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Open a discussion response with each device, on the question: should attendance at lectures be compulsory?\u003c/p>\u003cpre class=\"mono\">(a) an it-cleft\n(b) a wh-cleft\n(c) emphatic do\u003c/pre>"}],"keys":{"P1":"\u003cp>It was the timing that put me off. — isolates \u003cem>the timing\u003c/em> and implies a contrast with something else.\u003c/p>\u003cp>What put me off was the timing. — holds the answer back and lands it at the end.\u003c/p>\u003cp>Both move the same words; they differ in where the reader’s attention is when the key word arrives.\u003c/p>","P2":"\u003cp>\u003cstrong>(ii)\u003c/strong>. A fronted negative forces inversion: \u003cem>had I\u003c/em>, not \u003cem>I had\u003c/em>. This is not a stylistic preference; the uninverted version is simply ungrammatical.\u003c/p>","P3":"\u003cp>\u003cstrong>(b)\u003c/strong>. End weight: a thirteen-word object should not sit between \u003cem>made\u003c/em> and \u003cem>public\u003c/em>, where it makes the reader hold the verb open far too long. Short elements first, heavy ones last.\u003c/p>","F1":"\u003cp>(a) It was the lack of consultation that annoyed people most.\u003c/p>\u003cp>(b) What annoyed people most was the lack of consultation.\u003c/p>\u003cp>(c) Nothing annoyed people more than the lack of consultation. (Or: Not since the last reorganisation had feeling run so high.)\u003c/p>","F2":"\u003cp>(a) → Not only was she late … . Inversion is obligatory after fronted not only.\u003c/p>\u003cp>(b) → that put me off. An it-cleft takes \u003cem>that\u003c/em> or \u003cem>who\u003c/em>, never \u003cem>what\u003c/em>.\u003c/p>\u003cp>(c) → There are two places. The verb agrees with \u003cem>two places\u003c/em>, not with \u003cem>there\u003c/em>.\u003c/p>\u003cp>(d) → Rarely have I seen … .\u003c/p>","F3":"\u003cp>(a) It is the weakest students, not the strongest, that a compulsory register actually reaches.\u003c/p>\u003cp>(b) What compulsory attendance measures is presence, not learning.\u003c/p>\u003cp>(c) Lectures do matter; what does not follow is that attendance should be enforced.\u003c/p>\u003cp>All three put the position in the strongest slot in the sentence.\u003c/p>"},"rows":[59,60,61,62,63,64,65,66]};</script>
