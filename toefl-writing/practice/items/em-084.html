<script>window.ITEM={"kind":"exercise","id":"EM 084","slug":"em-084","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and chasing","payload":{"Strategy":"chase a decision by offering to make it smaller","Grammar":"tentative reminder forms","Vocabulary":"in principle, provisional, pending, hold","Convention":"chasing a committee rather than a person"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  A committee cannot be chased the way a person can. Why not?\u003c/p>\u003cp>b.  What is the smaller decision you could ask for?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \"in principle\" mean in a funding decision?\u003c/p>\u003cp>b.  Distinguish provisional, pending and on hold.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask for a partial decision in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer asks for £150 rather than £640. What makes that easier to grant?\u003c/p>\u003cp>b.  The last paragraph accepts a refusal. What does it extract in exchange?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Rather than ask the committee to hurry the whole application\" — what is gained by naming the request you are not making?\u003c/p>\u003cp>b.  \"after that it goes\" — why the bare, short clause?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because no individual is responsible for the delay and the next opportunity to act is a scheduled meeting. Pressure has nowhere to land, and a complaint about the delay is read by whichever member opens the inbox.\u003c/p>\u003cp>b.  A decision on the deposit element only — enough to hold the date, small enough that it may fall within a chair’s delegated authority rather than requiring the full committee.\u003c/p>","P2":"\u003cp>a.  Agreement to fund subject to details — the committee commits to the principle without releasing money or fixing an amount.\u003c/p>\u003cp>b.  Provisional means decided but subject to confirmation; pending means not yet decided; on hold means deliberately paused. Yours is pending, and saying so correctly avoids implying neglect.\u003c/p>","P3":"\u003cp>Model: \"Would it be possible to have a decision in principle on the £150 deposit element alone, with the rest considered in June as planned?\"\u003c/p>","F1":"\u003cp>a.  It is below the threshold at which a committee feels it is committing, it can plausibly be delegated to the chair, and it leaves the substantive decision untouched. Shrinking the ask is the most reliable way to unstick a stalled decision.\u003c/p>\u003cp>b.  Information, and the right to act on it. Knowing that partial decisions are impossible is worth almost as much as the decision itself, because it releases him to find a cheaper venue — and it is something any member can answer immediately.\u003c/p>","F2":"\u003cp>a.  It shows the writer understands the committee’s constraints and is choosing not to press on them. That buys the goodwill the smaller request then spends, and it is a courtesy that costs four words.\u003c/p>\u003cp>b.  After two sentences of dates and figures, the short clause lands the consequence without dramatising it. \"The venue will release the date to another booking\" would say the same thing and sound like a threat.\u003c/p>","F3":"\u003cp>1.  It opens on the committee’s failure — \"still not had any response, even though the committee has met twice\" — which is read by a volunteer who was probably not present.\u003c/p>\u003cp>2.  \"Make a decision as soon as possible\" asks for the full decision faster, which is the one thing a monthly committee cannot do, so the third bullet fails.\u003c/p>\u003cp>3.  \"Otherwise I will have to cancel it\" transfers the consequence to the reader, and the deposit deadline — the only date that actually matters — never appears.\u003c/p>"},"model":["Dear Grants Committee,","I am writing about application GR-2291, submitted on 3 April for the Riverside Readings event on 14 June. I appreciate the committee has a great deal to get through.","The position at my end is that the venue needs a deposit by 20 May to hold the date, and after that it goes. The full grant request was £640.","Rather than ask the committee to hurry the whole application, would it be possible to have a decision in principle on the £150 deposit element alone, with the rest considered at the June meeting as planned? That would let me secure the date without the committee committing to the full amount before it is ready to.","If a partial decision is not something the committee does, I would be grateful simply to know that, so I can look for a cheaper venue instead.","Thank you very much.","Best wishes,","Leo Tanaka — Riverside Readings"],"model_html":"\u003cp>Dear Grants Committee,\u003c/p>\u003cp>I am writing about application GR-2291, submitted on 3 April for the Riverside Readings event on 14 June. I appreciate the committee has a great deal to get through.\u003c/p>\u003cp>The position at my end is that the venue needs a deposit by 20 May to hold the date, and after that it goes. The full grant request was £640.\u003c/p>\u003cp>Rather than ask the committee to hurry the whole application, would it be possible to have a decision in principle on the £150 deposit element alone, with the rest considered at the June meeting as planned? That would let me secure the date without the committee committing to the full amount before it is ready to.\u003c/p>\u003cp>If a partial decision is not something the committee does, I would be grateful simply to know that, so I can look for a cheaper venue instead.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Leo Tanaka — Riverside Readings\u003c/p>","model_band":5,"degraded":["Dear Committee, I submitted my grant application GR-2291 seven weeks ago and I still have not had any response, even though the committee has met twice since then. My event is on 14 June and I need to book the venue urgently, otherwise I will have to cancel it. Could you please make a decision as soon as possible? It is very difficult to organise anything when we have to wait so long for an answer.","Leo"],"degraded_html":"\u003cp>Dear Committee, I submitted my grant application GR-2291 seven weeks ago and I still have not had any response, even though the committee has met twice since then. My event is on 14 June and I need to book the venue urgently, otherwise I will have to cancel it. Could you please make a decision as soon as possible? It is very difficult to organise anything when we have to wait so long for an answer.\u003c/p>\u003cp>Leo\u003c/p>","degraded_band":3,"model_words":156,"fault_list":{"tag":"F3","faults":["It opens on the committee’s failure — \"still not had any response, even though the committee has met twice\" — which is read by a volunteer who was probably not present.","\"Make a decision as soon as possible\" asks for the full decision faster, which is the one thing a monthly committee cannot do, so the third bullet fails.","\"Otherwise I will have to cancel it\" transfers the consequence to the reader, and the deposit deadline — the only date that actually matters — never appears."],"html":["\u003cp>1.  It opens on the committee’s failure — \"still not had any response, even though the committee has met twice\" — which is read by a volunteer who was probably not present.\u003c/p>","\u003cp>2.  \"Make a decision as soon as possible\" asks for the full decision faster, which is the one thing a monthly committee cannot do, so the third bullet fails.\u003c/p>","\u003cp>3.  \"Otherwise I will have to cancel it\" transfers the consequence to the reader, and the deposit deadline — the only date that actually matters — never appears.\u003c/p>"]},"scenario":"\u003cp>You applied for a small society grant seven weeks ago. The committee meets monthly and has now met twice without, as far as you can tell, deciding. Your event is in five weeks and you need to book a venue.\u003c/p>","bullets":["Remind them what is pending.","Explain why the timing now matters.","Offer something that lets them decide faster."],"header":[["To:","grants.su@northgate.ac.uk"],["Subject:","Grant application GR-2291 — event on 14 June"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It never engages Ines. Her argument is about the cost of decarbonisation; “the environment is more important than the money” answers an argument she did not make.","correct":false},{"text":"“Make a decision as soon as possible” asks for the full decision faster, which is the one thing a monthly committee cannot do, so the third bullet fails.","correct":true},{"text":"“Otherwise I will have to cancel it” transfers the consequence to the reader, and the deposit deadline — the only date that actually matters — never appears.","correct":true},{"text":"“People who refuse science” characterises the opposition rather than engaging with the prediction about backlash, and “this is not something we should negotiate about” declines the comparison the prompt asks for.","correct":false},{"text":"Lin’s argument is dismissed with “now we know better and our moral understanding has progressed” — which assumes the reliability of current intuitions, the very thing in dispute.","correct":false},{"text":"It opens on the committee’s failure — “still not had any response, even though the committee has met twice” — which is read by a volunteer who was probably not present.","correct":true}],"key_html":"F3"}};</script>
