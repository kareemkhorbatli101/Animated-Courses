<script>window.ITEM={"kind":"exercise","id":"AD 075","slug":"ad-075","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology · value trade-off","payload":{"Strategy":"weigh a benefit to the many against a cost to the few","Grammar":"concessive even if","Vocabulary":"screening, incidence, stigma, threshold","Convention":"weighing a benefit against a harm from false identification"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Emil’s objection is statistical. Why does low incidence matter?\u003c/p>\u003cp>b.  What does Yara’s argument depend on that is not about screening?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is incidence, and what is a threshold?\u003c/p>\u003cp>b.  What does it mean to pathologise something?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that names what you would change about the proposal.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response concedes the statistics entirely. Where does it find room to disagree?\u003c/p>\u003cp>b.  Why does the proposal insist students never see their own result?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Even if two-thirds of those identified are well\" — why the concessive?\u003c/p>\u003cp>b.  \"one declined email rather than a year of thinking something is wrong with them\" — what does this comparison do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the number of false positives depends on the size of the healthy group. With a rare condition that group is enormous, so even a small error rate produces more false flags than true ones.\u003c/p>\u003cp>b.  On the claim that those most in need will not self-refer. That is a premise about help-seeking behaviour, and the case for screening collapses without it.\u003c/p>","P2":"\u003cp>a.  Incidence is the rate of new cases in a population; a threshold is the score at which a screen counts as positive.\u003c/p>\u003cp>b.  To recast an ordinary experience as a medical disorder — the harm Emil attributes to mass screening.\u003c/p>","P3":"\u003cp>Model: \"Screen, but never report a score to a student — use it only to offer support, so a false positive costs one declined email.\"\u003c/p>","F1":"\u003cp>a.  In the consequences rather than the arithmetic. Emil treats the false-positive rate as settling the question, and the response points out that what a false positive costs depends entirely on how the result is used.\u003c/p>\u003cp>b.  Because the harm is the label, not the flag. A student who never learns they were identified cannot be pathologised by the identification, which is what converts Emil’s decisive objection into a manageable cost.\u003c/p>","F2":"\u003cp>a.  It grants the opponent his worst figure and argues from inside it, which is stronger than disputing the rate. If the position survives his numbers it does not depend on contesting them.\u003c/p>\u003cp>b.  It puts both costs in concrete, comparable terms, so the asymmetry is visible rather than asserted. \"Minimal harm\" would have been a claim; this is a description the reader can check against their own experience.\u003c/p>","F3":"\u003cp>1.  \"Better to be safe than sorry\" is exactly the reasoning Emil’s objection defeats, and the base-rate problem is never engaged.\u003c/p>\u003cp>2.  \"If some healthy students are contacted unnecessarily that is not a serious problem\" asserts what the question asks us to weigh, with no account of what being contacted would involve.\u003c/p>\u003cp>3.  Nothing is said about how a result would be communicated, recorded or acted on, so the response has no proposal — only a preference.\u003c/p>"},"model":["Yara is identifying a real failure and Emil is describing why her remedy would not fix it, and the proposal should be changed rather than adopted or dropped.","The statistical point has to be conceded. When a condition is rare, even an accurate instrument flags more well students than unwell ones, because the well group is so much larger. That is not a criticism of any particular questionnaire and cannot be engineered away by improving it.","But Emil’s conclusion does not follow, because the harm he describes comes from what the university does with a flag rather than from the flag itself. Even if two-thirds of those identified are well, a result that triggers an offer of a conversation rather than a diagnosis costs them very little. The pathologising he rightly fears is a consequence of treating a screening score as a finding.","So I would support screening that no student ever sees the output of — used to offer support universally to the flagged group, with no label attached and no record kept. That keeps Yara’s reach, and it means a false positive costs a student one declined email rather than a year of thinking something is wrong with them."],"model_html":"\u003cp>Yara is identifying a real failure and Emil is describing why her remedy would not fix it, and the proposal should be changed rather than adopted or dropped.\u003c/p>\u003cp>The statistical point has to be conceded. When a condition is rare, even an accurate instrument flags more well students than unwell ones, because the well group is so much larger. That is not a criticism of any particular questionnaire and cannot be engineered away by improving it.\u003c/p>\u003cp>But Emil’s conclusion does not follow, because the harm he describes comes from what the university does with a flag rather than from the flag itself. Even if two-thirds of those identified are well, a result that triggers an offer of a conversation rather than a diagnosis costs them very little. The pathologising he rightly fears is a consequence of treating a screening score as a finding.\u003c/p>\u003cp>So I would support screening that no student ever sees the output of — used to offer support universally to the flagged group, with no label attached and no record kept. That keeps Yara’s reach, and it means a false positive costs a student one declined email rather than a year of thinking something is wrong with them.\u003c/p>","model_band":5,"degraded":["I think mental health screening is a good idea because mental health problems among students are increasing and universities have a responsibility to support their students. Many students suffer in silence because of stigma and are afraid to ask for help, so screening could identify them early. Emil worries about false positives but I think it is better to be safe than sorry, and if some healthy students are contacted unnecessarily that is not a serious problem compared to helping someone in a crisis."],"degraded_html":"\u003cp>I think mental health screening is a good idea because mental health problems among students are increasing and universities have a responsibility to support their students. Many students suffer in silence because of stigma and are afraid to ask for help, so screening could identify them early. Emil worries about false positives but I think it is better to be safe than sorry, and if some healthy students are contacted unnecessarily that is not a serious problem compared to helping someone in a crisis.\u003c/p>","degraded_band":3,"model_words":201,"fault_list":{"tag":"F3","faults":["\"Better to be safe than sorry\" is exactly the reasoning Emil’s objection defeats, and the base-rate problem is never engaged.","\"If some healthy students are contacted unnecessarily that is not a serious problem\" asserts what the question asks us to weigh, with no account of what being contacted would involve.","Nothing is said about how a result would be communicated, recorded or acted on, so the response has no proposal — only a preference."],"html":["\u003cp>1.  \"Better to be safe than sorry\" is exactly the reasoning Emil’s objection defeats, and the base-rate problem is never engaged.\u003c/p>","\u003cp>2.  \"If some healthy students are contacted unnecessarily that is not a serious problem\" asserts what the question asks us to weigh, with no account of what being contacted would involve.\u003c/p>","\u003cp>3.  Nothing is said about how a result would be communicated, recorded or acted on, so the response has no proposal — only a preference.\u003c/p>"]},"prof_name":"Dr Brennan","professor":"\u003cp>Universities are considering routine mental-health screening at enrolment. Supporters say it finds students who would not come forward. Critics say large-scale screening produces many false positives, pathologises ordinary distress and may deter disclosure. Should it be introduced?\u003c/p>","students":[["Yara","Introduce it. The students who most need help are the least likely to ask for it, and an opt-out questionnaire costs almost nothing."],["Emil","Screening a low-incidence condition produces mostly false positives, however good the instrument. You would be telling hundreds of well students they may be unwell, and they talk to each other."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language and register. “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”.","correct":false},{"text":"“You can find good deals online if you look carefully” is advice that cannot be acted on from abroad in three days, and the guarantor problem is never mentioned.","correct":false},{"text":"“If some healthy students are contacted unnecessarily that is not a serious problem” asserts what the question asks us to weigh, with no account of what being contacted would involve.","correct":true},{"text":"Nothing is said about how a result would be communicated, recorded or acted on, so the response has no proposal — only a preference.","correct":true},{"text":"“Better to be safe than sorry” is exactly the reasoning Emil’s objection defeats, and the base-rate problem is never engaged.","correct":true},{"text":"“Meet the academic staff” is precisely the framing that kept people away, so the second bullet is not merely unaddressed but reinforced.","correct":false}],"key_html":"F3"}};</script>
