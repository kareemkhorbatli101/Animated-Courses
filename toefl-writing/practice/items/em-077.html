<script>window.ITEM={"kind":"exercise","id":"EM 077","slug":"em-077","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Proposal and solving a problem","payload":{"Strategy":"propose the version that survives you leaving","Grammar":"result clause with so that","Vocabulary":"handover, continuity, institutional memory, succession","Convention":"proposing something that will outlive you"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The system works. What exactly is the problem you are reporting?\u003c/p>\u003cp>b.  Why is \"I will write documentation\" usually an inadequate answer?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is institutional memory, and how is it lost?\u003c/p>\u003cp>b.  What is a handover, and what makes one successful?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the risk in one sentence that does not mention yourself flatteringly.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer proposes making their own work worse. Why is that the right call?\u003c/p>\u003cp>b.  Two people are trained rather than one. What problem does that solve?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"so that what is left is a table and two formulas anyone can follow\" — what does the purpose clause establish?\u003c/p>\u003cp>b.  \"the single point is me\" — why phrase it this way?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Not that the tracker is bad but that it depends on one person who is leaving. The system’s quality is irrelevant to the risk, which is why the first sentence concedes it works.\u003c/p>\u003cp>b.  Because documentation is written by the person who already understands the thing, read by nobody at the time, and stale by the time it is needed. It transfers the obligation to future readers rather than reducing the dependency.\u003c/p>","P2":"\u003cp>a.  The accumulated knowledge of how an organisation actually does things. It is lost when the people holding it leave without transferring it — which in a student society happens on a three-year cycle.\u003c/p>\u003cp>b.  Transferring responsibility and the knowledge to discharge it. It succeeds when the recipient can do the task unaided, not when they have been told how.\u003c/p>","P3":"\u003cp>Model: \"The tracker is a single point of failure and the single point is me.\"\u003c/p>","F1":"\u003cp>a.  Because the optimisation target is wrong. The spreadsheet is optimised for efficiency and should be optimised for transferability, given that its maintainer changes every few years. Thirty minutes a term is a small price for removing the dependency.\u003c/p>\u003cp>b.  The handover failing when the one trained person also leaves, or does not take the role. Training a backup converts a chain into a small network, at the cost of half an hour.\u003c/p>","F2":"\u003cp>a.  The criterion for success. It states what the simplification is for, which makes it possible to tell when it has gone far enough — and it is the test the committee can apply without the writer.\u003c/p>\u003cp>b.  Because it names the risk without either boasting or apologising. \"I am the only one who understands it\" could be read as pride; \"the single point is me\" uses the engineering term and makes the writer an instance of a known failure mode rather than a special case.\u003c/p>","F3":"\u003cp>1.  The problem is framed as continuity in general rather than as a dependency on one person, so the actual risk is never stated. The first bullet is only half met.\u003c/p>\u003cp>2.  The proposal is the manual — the solution that reliably fails — and nobody is trained, so the second bullet fails.\u003c/p>\u003cp>3.  \"I have put a lot of effort into building it and it has saved the society a lot of time\" is about the writer rather than the handover, and \"will be able to use it without problems\" is an assurance the writer cannot give.\u003c/p>"},"model":["Dear Committee,","The equipment tracker works, but it is a single point of failure and the single point is me. I graduate in June and at the moment nobody else can fix it if a formula breaks.","I would rather not solve this by writing a manual, because manuals for spreadsheets go unread and then go out of date. What I would suggest instead is to simplify it until it does not need one. There are three clever bits in it that save about ten minutes a term each and account for most of the complexity; I would strip those out, so that what is left is a table and two formulas anyone can follow.","Then two half-hour sessions in May: one with whoever takes over equipment, one with the secretary as a backup, both walking through an actual loan and an actual return rather than through the file.","The result would be slightly more manual work each term and no dependence on any one person, which I think is the better trade for a society where everybody leaves after three years.","Best wishes,","Ana Oyelaran"],"model_html":"\u003cp>Dear Committee,\u003c/p>\u003cp>The equipment tracker works, but it is a single point of failure and the single point is me. I graduate in June and at the moment nobody else can fix it if a formula breaks.\u003c/p>\u003cp>I would rather not solve this by writing a manual, because manuals for spreadsheets go unread and then go out of date. What I would suggest instead is to simplify it until it does not need one. There are three clever bits in it that save about ten minutes a term each and account for most of the complexity; I would strip those out, so that what is left is a table and two formulas anyone can follow.\u003c/p>\u003cp>Then two half-hour sessions in May: one with whoever takes over equipment, one with the secretary as a backup, both walking through an actual loan and an actual return rather than through the file.\u003c/p>\u003cp>The result would be slightly more manual work each term and no dependence on any one person, which I think is the better trade for a society where everybody leaves after three years.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ana Oyelaran\u003c/p>","model_band":5,"degraded":["Dear Committee, As you know I will be graduating in June and I wanted to make sure the equipment tracker continues to work after I leave. I have put a lot of effort into building it over the last two years and it has saved the society a lot of time. I will write a detailed guide explaining how everything works and send it to the committee before I go, so that whoever takes over will be able to use it without problems.","Ana"],"degraded_html":"\u003cp>Dear Committee, As you know I will be graduating in June and I wanted to make sure the equipment tracker continues to work after I leave. I have put a lot of effort into building it over the last two years and it has saved the society a lot of time. I will write a detailed guide explaining how everything works and send it to the committee before I go, so that whoever takes over will be able to use it without problems.\u003c/p>\u003cp>Ana\u003c/p>","degraded_band":3,"model_words":187,"fault_list":{"tag":"F3","faults":["The problem is framed as continuity in general rather than as a dependency on one person, so the actual risk is never stated. The first bullet is only half met.","The proposal is the manual — the solution that reliably fails — and nobody is trained, so the second bullet fails.","\"I have put a lot of effort into building it and it has saved the society a lot of time\" is about the writer rather than the handover, and \"will be able to use it without problems\" is an assurance the writer cannot give."],"html":["\u003cp>1.  The problem is framed as continuity in general rather than as a dependency on one person, so the actual risk is never stated. The first bullet is only half met.\u003c/p>","\u003cp>2.  The proposal is the manual — the solution that reliably fails — and nobody is trained, so the second bullet fails.\u003c/p>","\u003cp>3.  \"I have put a lot of effort into building it and it has saved the society a lot of time\" is about the writer rather than the handover, and \"will be able to use it without problems\" is an assurance the writer cannot give.\u003c/p>"]},"scenario":"\u003cp>You built a spreadsheet that the society uses to track equipment loans. It works but only you understand it. You graduate in June.\u003c/p>","bullets":["Say what the problem is.","Propose how to hand it over.","Make the proposal cheap for whoever inherits it."],"header":[["To:","committee.photosoc@northgate.ac.uk"],["Subject:","Equipment tracker — handover before June"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“All countries should move to a four-day week” is an unhedged absolute drawn from evidence the response has just been told is non-representative. Language: “the results of these trials prove”, “the companies chose to participate” over-articled.","correct":false},{"text":"“Students should choose based on what is right for them personally” is advice to individuals where the question is about an institutional measure, so the response never addresses the comparison it was asked to make.","correct":false},{"text":"“Small farmers deserve support rather than large agribusiness” substitutes a preference about who farms for the question of which system is more robust, and Chiara’s point about correlated failure goes unused.","correct":false},{"text":"“I have put a lot of effort into building it and it has saved the society a lot of time” is about the writer rather than the handover, and “will be able to use it without problems” is an assurance the writer cannot give.","correct":true},{"text":"The proposal is the manual — the solution that reliably fails — and nobody is trained, so the second bullet fails.","correct":true},{"text":"The problem is framed as continuity in general rather than as a dependency on one person, so the actual risk is never stated. The first bullet is only half met.","correct":true}],"key_html":"F3"}};</script>
