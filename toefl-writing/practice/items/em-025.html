<script>window.ITEM={"kind":"exercise","id":"EM 025","slug":"em-025","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"apologise for the thing you actually did, not the thing you are accused of","Grammar":"mitigating adverbials","Vocabulary":"misread, overstep, remit, out of turn","Convention":"apologising where you were partly in the right"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You were right on the facts and wrong on the authority. How do you apologise for one without retracting the other?\u003c/p>\u003cp>b.  Why is \"I was only trying to help\" a bad sentence here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to overstep, and what is your remit?\u003c/p>\u003cp>b.  What does \"out of turn\" mean, and why is it the precise phrase here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Apologise in one sentence that is specific about what you did wrong.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer refuses to retract the content. Why is that not undermining the apology?\u003c/p>\u003cp>b.  The last offer is more than was asked for. What does it signal?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"which is the part that matters\" — what does this clause do to the rest of the sentence?\u003c/p>\u003cp>b.  \"that is a separate question from whether I was the person to say it\" — why is this the hinge of the email?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By separating them explicitly. Concede the authority point fully and without qualification, then address the content as a distinct matter — in that order, so the apology is not conditional on the second part being accepted.\u003c/p>\u003cp>b.  Because it offers your intention as a defence against a complaint that was not about intention. Nobody suggested you were acting maliciously; the objection is that you acted without authority, and good motives do not answer it.\u003c/p>","P2":"\u003cp>a.  To overstep is to exceed the limits of your authority. Your remit is what you are authorised to deal with.\u003c/p>\u003cp>b.  It means acting before it was your place to — precisely an objection about sequence and standing rather than about content, which is exactly the charge here.\u003c/p>","P3":"\u003cp>Model: \"I should not have replied as the society — it was not my call to make and I made it without asking you.\"\u003c/p>","F1":"\u003cp>a.  Because the complaint was not about the content. Retracting something true to make an apology smoother is both dishonest and unhelpful: it would leave the society’s public statement in doubt. The apology is complete because it fully concedes the thing actually objected to.\u003c/p>\u003cp>b.  That the writer takes the authority point seriously rather than treating it as a formality. Offering to give up the access shows the concession is real, and volunteering it is far better than being asked.\u003c/p>","F2":"\u003cp>a.  It identifies which of the two faults is the real one. The sentence lists acting without authority and acting without asking, and the clause selects the second as the substance — which shows the writer has understood the complaint rather than merely received it.\u003c/p>\u003cp>b.  Because it is the distinction that lets the writer be both apologetic and honest. Without it the email must either retract a true statement or refuse to apologise, and both would damage the relationship.\u003c/p>","F3":"\u003cp>1.  \"I am sorry you were upset\" apologises for her reaction rather than for the act, which is the standard non-apology.\u003c/p>\u003cp>2.  It defends rather than concedes: \"I was only trying to help\", \"nobody was answering them\", \"everything I wrote was completely true as you know\" — all three answer a charge that was not made, and the authority question is never acknowledged.\u003c/p>\u003cp>3.  \"I will be more careful next time\" names no change, so the third bullet fails; and \"sorry if it caused any trouble\" makes the harm hypothetical.\u003c/p>"},"model":["Hi Grace,","You are right and I am sorry — I should not have replied as the society. It was not my call to make and I made it without asking you, which is the part that matters.","I stand by what I wrote as a matter of fact: the screening was cancelled by the venue and not by us, and I do not think saying so was wrong in itself. But that is a separate question from whether I was the person to say it, and on that I was clearly out of turn.","Going forward: I will not post as the society again without checking, and if something needs a quick response when you are not around I will draft it and send it to you rather than putting it up. If you would rather I came off the page admin list entirely, I am happy with that too.","Sorry, Grace.","Nour"],"model_html":"\u003cp>Hi Grace,\u003c/p>\u003cp>You are right and I am sorry — I should not have replied as the society. It was not my call to make and I made it without asking you, which is the part that matters.\u003c/p>\u003cp>I stand by what I wrote as a matter of fact: the screening was cancelled by the venue and not by us, and I do not think saying so was wrong in itself. But that is a separate question from whether I was the person to say it, and on that I was clearly out of turn.\u003c/p>\u003cp>Going forward: I will not post as the society again without checking, and if something needs a quick response when you are not around I will draft it and send it to you rather than putting it up. If you would rather I came off the page admin list entirely, I am happy with that too.\u003c/p>\u003cp>Sorry, Grace.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi Grace, I am sorry you were upset about my post on the page. I was only trying to help because people were complaining and nobody was answering them, and everything I wrote was completely true as you know. I did not think it would be a problem since it was just clarifying the facts. Anyway I am sorry if it caused any trouble and I will be more careful next time.","Nour"],"degraded_html":"\u003cp>Hi Grace, I am sorry you were upset about my post on the page. I was only trying to help because people were complaining and nobody was answering them, and everything I wrote was completely true as you know. I did not think it would be a problem since it was just clarifying the facts. Anyway I am sorry if it caused any trouble and I will be more careful next time.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":153,"fault_list":{"tag":"F3","faults":["\"I am sorry you were upset\" apologises for her reaction rather than for the act, which is the standard non-apology.","It defends rather than concedes: \"I was only trying to help\", \"nobody was answering them\", \"everything I wrote was completely true as you know\" — all three answer a charge that was not made, and the authority question is never acknowledged.","\"I will be more careful next time\" names no change, so the third bullet fails; and \"sorry if it caused any trouble\" makes the harm hypothetical."],"html":["\u003cp>1.  \"I am sorry you were upset\" apologises for her reaction rather than for the act, which is the standard non-apology.\u003c/p>","\u003cp>2.  It defends rather than concedes: \"I was only trying to help\", \"nobody was answering them\", \"everything I wrote was completely true as you know\" — all three answer a charge that was not made, and the authority question is never acknowledged.\u003c/p>","\u003cp>3.  \"I will be more careful next time\" names no change, so the third bullet fails; and \"sorry if it caused any trouble\" makes the harm hypothetical.\u003c/p>"]},"scenario":"\u003cp>You replied to a complaint on the society’s public page on behalf of the committee without being asked. What you wrote was accurate but the president is annoyed that you spoke for the society.\u003c/p>","bullets":["Apologise for the right thing.","Do not pretend the content was wrong if it was not.","Say what you will do differently."],"header":[["To:","president.filmsoc@northgate.ac.uk"],["Subject:","That reply on the page — I overstepped"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“I am sorry you were upset” apologises for her reaction rather than for the act, which is the standard non-apology.","correct":true},{"text":"It defends rather than concedes: “I was only trying to help”, “nobody was answering them”, “everything I wrote was completely true as you know” — all three answer a charge that was not made, and the authority question is never acknowledged.","correct":true},{"text":"Language: “the universities”, “the stigma”, “the admission decision” over-articled; “suffer in silence” and “feel safe to be honest” are stock phrases rather than analysis.","correct":false},{"text":"“There is no real conflict between doing good and making money” denies the premise of the question, which is about what happens when there is one.","correct":false},{"text":"“I will be more careful next time” names no change, so the third bullet fails; and “sorry if it caused any trouble” makes the harm hypothetical.","correct":true},{"text":"“It does not even solve the problem” contradicts Elif’s evidence by assertion, and the claim that rich drivers simply pay is inconsistent with traffic falling within a year.","correct":false}],"key_html":"F3"}};</script>
