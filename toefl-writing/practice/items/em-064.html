<script>window.ITEM={"kind":"exercise","id":"EM 064","slug":"em-064","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Invitation","payload":{"Strategy":"invite by removing the reasons to say no","Grammar":"conditional attendance","Vocabulary":"RSVP, dietary, accessible, drop-in","Convention":"inviting people who may feel out of place"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You know why people did not come last year. What does that let you do?\u003c/p>\u003cp>b.  Which practicalities actually keep people away from a free lunch?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Why is \"dietary requirements\" better than \"special diets\"?\u003c/p>\u003cp>b.  What does \"accessible\" cover, and why name it explicitly?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Correct last year’s misunderstanding in one sentence without referring to last year as a failure.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The second paragraph describes who will be in the room. Why is that more effective than saying \"all welcome\"?\u003c/p>\u003cp>b.  The last line gives permission not to come. Why would an organiser include that?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"an event you are being invited to observe\" — what misunderstanding is this naming?\u003c/p>\u003cp>b.  Why \"as standard\" after the food options?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Address it directly and specifically. A general \"everyone welcome\" does not touch a belief that the event is for staff; describing the actual composition of the room does.\u003c/p>\u003cp>b.  Not knowing who will be there, not knowing whether the food will suit them, not knowing whether they can leave early, and not knowing whether anyone will notice if they do not come. All four are answered here.\u003c/p>","P2":"\u003cp>a.  Because \"special\" marks the person as an exception, while \"requirement\" treats it as information the organiser needs. The second is now standard and the first reads as dated.\u003c/p>\u003cp>b.  Step-free access, accessible facilities, and often hearing and visual provision. Naming it explicitly saves people from having to ask, which is itself a barrier.\u003c/p>","P3":"\u003cp>Model: \"It is a lunch for you rather than an event you are being invited to observe.\"\u003c/p>","F1":"\u003cp>a.  Because \"all welcome\" is what every event says, including the ones where you would be the only student in a room of professors. A headcount of who will actually be present is checkable and answers the specific fear.\u003c/p>\u003cp>b.  Because an invitation that cannot be declined becomes an obligation, and obligations are avoided. Explicitly releasing people lowers the cost of saying yes — you can come without having committed to a social role.\u003c/p>","F2":"\u003cp>a.  Exactly the one reported last year: that the lunch was primarily a staff occasion at which students were guests. Naming it lets the reader recognise and discard their own assumption.\u003c/p>\u003cp>b.  It signals that halal and vegetarian food is not a special arrangement made on request but simply what is there — so nobody has to identify themselves to be fed.\u003c/p>","F3":"\u003cp>1.  \"Meet the academic staff\" is precisely the framing that kept people away, so the second bullet is not merely unaddressed but reinforced.\u003c/p>\u003cp>2.  An RSVP is required of everyone, which adds friction, and nothing is said about accessibility, food provision, or whether it is acceptable to arrive late or leave early.\u003c/p>\u003cp>3.  The register is institutional throughout — \"we are delighted to invite you\", \"a great opportunity\", \"we look forward to welcoming you\" — which reads as a formal occasion rather than a room with sandwiches in it.\u003c/p>"},"model":["Dear all,","There is a welcome lunch for new postgraduates on Thursday 2 October, half past twelve to two, in the Dalton Room.","It is a lunch for you rather than an event you are being invited to observe — the room will be almost entirely new postgraduates, with three or four of us from the department who will mostly be making tea. There are no speeches and no programme.","Practical things: there is no need to reply unless you have a dietary requirement, in which case email me by the Monday. The Dalton Room is step-free and the nearest accessible toilet is on the same floor. Food will include halal and vegetarian options as standard. Come for ten minutes if that is all you have, and bring anyone who has arrived with you.","If you would rather not come to something like this at all, that is entirely fine and nobody will notice.","Best wishes,","Dr Ruth Adeyemi"],"model_html":"\u003cp>Dear all,\u003c/p>\u003cp>There is a welcome lunch for new postgraduates on Thursday 2 October, half past twelve to two, in the Dalton Room.\u003c/p>\u003cp>It is a lunch for you rather than an event you are being invited to observe — the room will be almost entirely new postgraduates, with three or four of us from the department who will mostly be making tea. There are no speeches and no programme.\u003c/p>\u003cp>Practical things: there is no need to reply unless you have a dietary requirement, in which case email me by the Monday. The Dalton Room is step-free and the nearest accessible toilet is on the same floor. Food will include halal and vegetarian options as standard. Come for ten minutes if that is all you have, and bring anyone who has arrived with you.\u003c/p>\u003cp>If you would rather not come to something like this at all, that is entirely fine and nobody will notice.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Dr Ruth Adeyemi\u003c/p>","model_band":5,"degraded":["Dear all, We are delighted to invite you to our annual welcome lunch for new postgraduate students, which will take place on Thursday 2 October at 12.30 in the Dalton Room. This is a great opportunity to meet the academic staff and your fellow students in an informal setting. Please RSVP by Monday 29 September and let us know of any dietary requirements. We look forward to welcoming you.","The Postgraduate Office"],"degraded_html":"\u003cp>Dear all, We are delighted to invite you to our annual welcome lunch for new postgraduate students, which will take place on Thursday 2 October at 12.30 in the Dalton Room. This is a great opportunity to meet the academic staff and your fellow students in an informal setting. Please RSVP by Monday 29 September and let us know of any dietary requirements. We look forward to welcoming you.\u003c/p>\u003cp>The Postgraduate Office\u003c/p>","degraded_band":3,"model_words":159,"fault_list":{"tag":"F3","faults":["\"Meet the academic staff\" is precisely the framing that kept people away, so the second bullet is not merely unaddressed but reinforced.","An RSVP is required of everyone, which adds friction, and nothing is said about accessibility, food provision, or whether it is acceptable to arrive late or leave early.","The register is institutional throughout — \"we are delighted to invite you\", \"a great opportunity\", \"we look forward to welcoming you\" — which reads as a formal occasion rather than a room with sandwiches in it."],"html":["\u003cp>1.  \"Meet the academic staff\" is precisely the framing that kept people away, so the second bullet is not merely unaddressed but reinforced.\u003c/p>","\u003cp>2.  An RSVP is required of everyone, which adds friction, and nothing is said about accessibility, food provision, or whether it is acceptable to arrive late or leave early.\u003c/p>","\u003cp>3.  The register is institutional throughout — \"we are delighted to invite you\", \"a great opportunity\", \"we look forward to welcoming you\" — which reads as a formal occasion rather than a room with sandwiches in it.\u003c/p>"]},"scenario":"\u003cp>Your department is holding a welcome lunch for new postgraduates. Last year almost none of the international students came, and several said afterwards they had assumed it was mainly a staff event.\u003c/p>","bullets":["Invite them and say what it is.","Remove the specific reason people stayed away last year.","Deal with the practicalities that stop people coming."],"header":[["To:","pg-newintake@northgate.ac.uk"],["Subject:","Welcome lunch, 2 October — who it is actually for"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Yusuf’s argument is acknowledged and then answered with “subsidies or simplified forms”, which is a gesture rather than a mechanism and leaves the fixed cost in place.","correct":false},{"text":"The register is institutional throughout — “we are delighted to invite you”, “a great opportunity”, “we look forward to welcoming you” — which reads as a formal occasion rather than a room with sandwiches in it.","correct":true},{"text":"“Most people are honest and would not waste their time” answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.","correct":false},{"text":"“Meet the academic staff” is precisely the framing that kept people away, so the second bullet is not merely unaddressed but reinforced.","correct":true},{"text":"An RSVP is required of everyone, which adds friction, and nothing is said about accessibility, food provision, or whether it is acceptable to arrive late or leave early.","correct":true},{"text":"“This time it really is different because the scale is so much bigger” concedes that the difference is one of degree, which is exactly Felix’s point.","correct":false}],"key_html":"F3"}};</script>
