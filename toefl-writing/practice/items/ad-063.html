<script>window.ITEM={"kind":"exercise","id":"AD 063","slug":"ad-063","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Anthropology · agree / disagree","payload":{"Strategy":"distinguish what a practice does from what participants say it does","Grammar":"reduced relative clauses","Vocabulary":"informant, emic, function, reflexivity","Convention":"separating participants’ accounts from analysis"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Nina and Pavel use \"function\" and \"meaning\" differently. How?\u003c/p>\u003cp>b.  Is there a version of Pavel’s objection that survives Nina’s distinction?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does emic mean, and what is an informant?\u003c/p>\u003cp>b.  What is reflexivity in ethnographic method?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that separates two kinds of question.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response assigns each speaker a different question. What are the two questions?\u003c/p>\u003cp>b.  Why is the distinction between effects and purposes doing the decisive work?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"an account mentioning only ancestors is incomplete rather than wrong\" — identify the reduced relative and say why it is compressed.\u003c/p>\u003cp>b.  \"meanings reported by the people who hold them are the data\" — what does calling them data accomplish?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Nina uses function to mean the effect a practice reliably has; Pavel uses meaning to denote what it is for those who perform it. The two are not rivals unless function is read as purpose.\u003c/p>\u003cp>b.  Yes — the objection to inferring motive. Saying what a practice does is observational; saying it exists in order to do that, and that participants are mistaken about why they act, is the move Pavel is right to resist.\u003c/p>","P2":"\u003cp>a.  Emic describes an account framed in the participants’ own categories; an informant is a participant who supplies the ethnographer with such an account.\u003c/p>\u003cp>b.  The analyst’s systematic attention to their own position and its effect on what they record — the discipline’s answer to exactly Pavel’s worry.\u003c/p>","P3":"\u003cp>Model: \"An analyst may describe effects participants do not name, but may not replace their account of purpose with a better one.\"\u003c/p>","F1":"\u003cp>a.  What does this practice do, and what does it mean to those who perform it. The first is answerable from observation; the second only from participants. Treating them as one question is what generates the quarrel.\u003c/p>\u003cp>b.  Because it is the line between an addition and a replacement. Describing an effect adds to the participants’ account; attributing a hidden purpose overwrites it, and only the second is the imposition Pavel objects to.\u003c/p>","F2":"\u003cp>a.  \"mentioning only ancestors\" is a reduced relative for \"that mentions only ancestors\". The compression keeps the sentence’s weight on the contrast that follows — incomplete rather than wrong — which is the point being made.\u003c/p>\u003cp>b.  It gives them a definite methodological status. Data can be interpreted but not contradicted by the analyst, which is exactly the protection Pavel wants, stated in terms Nina cannot object to.\u003c/p>","F3":"\u003cp>1.  Neither speaker’s argument is engaged. The distinction between function and meaning, which is the whole dispute, is never addressed.\u003c/p>\u003cp>2.  \"Combine both perspectives\" is a refusal to take a position dressed as a synthesis, with no account of how the two would be combined or what happens when they conflict.\u003c/p>\u003cp>3.  \"Not impose their own Western ideas\" and \"science needs objective explanations\" are slogans from opposite sides placed side by side, and the colonial reference is decorative — it does no work in the argument.\u003c/p>"},"model":["Nina has the distinction right and Pavel has the warning right, and both are needed because they answer different questions.","A practice can have effects nobody intends, and describing them is not contradicting anyone. If a mortuary feast reliably moves protein from households with a surplus to households without one, that happens whether or not the participants have a word for it, and an account mentioning only ancestors is incomplete rather than wrong. Nina is right that this is not a competing belief.","Pavel’s objection bites at a different point. The danger is not explaining effects but inferring purposes — sliding from \"this redistributes food\" to \"this exists in order to redistribute food, and the ancestors are a story people tell themselves\". The second claim is about motive, it is usually unfalsifiable, and it is where the arrogance he describes lives.","So the rule I would take from both is that an analyst may describe consequences the participants do not name, and may not replace their account of purpose with a better one. Effects are observable; meanings reported by the people who hold them are the data, not a rival hypothesis to be corrected."],"model_html":"\u003cp>Nina has the distinction right and Pavel has the warning right, and both are needed because they answer different questions.\u003c/p>\u003cp>A practice can have effects nobody intends, and describing them is not contradicting anyone. If a mortuary feast reliably moves protein from households with a surplus to households without one, that happens whether or not the participants have a word for it, and an account mentioning only ancestors is incomplete rather than wrong. Nina is right that this is not a competing belief.\u003c/p>\u003cp>Pavel’s objection bites at a different point. The danger is not explaining effects but inferring purposes — sliding from \"this redistributes food\" to \"this exists in order to redistribute food, and the ancestors are a story people tell themselves\". The second claim is about motive, it is usually unfalsifiable, and it is where the arrogance he describes lives.\u003c/p>\u003cp>So the rule I would take from both is that an analyst may describe consequences the participants do not name, and may not replace their account of purpose with a better one. Effects are observable; meanings reported by the people who hold them are the data, not a rival hypothesis to be corrected.\u003c/p>","model_band":5,"degraded":["This is a very interesting question and I can see both sides. I think anthropologists should respect the culture they are studying and not impose their own Western ideas on other people, because this was a big problem in the colonial period. However science also needs to look for objective explanations. In my opinion the best approach is to combine both perspectives and listen carefully to what local people say while also doing careful analysis. Pavel is right that we should be humble about what we can know."],"degraded_html":"\u003cp>This is a very interesting question and I can see both sides. I think anthropologists should respect the culture they are studying and not impose their own Western ideas on other people, because this was a big problem in the colonial period. However science also needs to look for objective explanations. In my opinion the best approach is to combine both perspectives and listen carefully to what local people say while also doing careful analysis. Pavel is right that we should be humble about what we can know.\u003c/p>","degraded_band":3,"model_words":193,"fault_list":{"tag":"F3","faults":["Neither speaker’s argument is engaged. The distinction between function and meaning, which is the whole dispute, is never addressed.","\"Combine both perspectives\" is a refusal to take a position dressed as a synthesis, with no account of how the two would be combined or what happens when they conflict.","\"Not impose their own Western ideas\" and \"science needs objective explanations\" are slogans from opposite sides placed side by side, and the colonial reference is decorative — it does no work in the argument."],"html":["\u003cp>1.  Neither speaker’s argument is engaged. The distinction between function and meaning, which is the whole dispute, is never addressed.\u003c/p>","\u003cp>2.  \"Combine both perspectives\" is a refusal to take a position dressed as a synthesis, with no account of how the two would be combined or what happens when they conflict.\u003c/p>","\u003cp>3.  \"Not impose their own Western ideas\" and \"science needs objective explanations\" are slogans from opposite sides placed side by side, and the colonial reference is decorative — it does no work in the argument.\u003c/p>"]},"prof_name":"Dr Oyelaran","professor":"\u003cp>Anthropologists sometimes find that a practice persists for reasons quite different from those its participants give. Some argue the analyst’s account is then the better one. Others argue that overriding participants’ own understanding is both arrogant and bad method. What do you think?\u003c/p>","students":[["Nina","If the function of a ritual is to redistribute food in a lean season, that is what it does, whatever people say about ancestors. The analysis is not a competing belief, it is an explanation."],["Pavel","And who decides what the function is? That move has been used to tell people their own lives are false consciousness for a century. The participants are the only ones with access to what the practice means."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“It would be unfair if we were penalised for something that was not explained properly” complains about a penalty that has not been imposed, which turns a factual question into a grievance; “several students are also confused” adds pressure rather than information.","correct":false},{"text":"No usable remedy and no evidence. “Please send someone immediately” names no alternative, no access times, and no reference numbers — so the office cannot even find the original reports. The second bullet is therefore only half addressed.","correct":false},{"text":"“Trust your instinct, you usually know deep down” is reassurance rather than help, and “I am sure you will make the right decision” pre-approves any outcome, which makes it worthless as a judgement.","correct":false},{"text":"Neither speaker’s argument is engaged. The distinction between function and meaning, which is the whole dispute, is never addressed.","correct":true},{"text":"“Not impose their own Western ideas” and “science needs objective explanations” are slogans from opposite sides placed side by side, and the colonial reference is decorative — it does no work in the argument.","correct":true},{"text":"“Combine both perspectives” is a refusal to take a position dressed as a synthesis, with no account of how the two would be combined or what happens when they conflict.","correct":true}],"key_html":"F3"}};</script>
