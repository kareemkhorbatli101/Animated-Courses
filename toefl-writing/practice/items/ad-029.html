<script>window.ITEM={"kind":"exercise","id":"AD 029","slug":"ad-029","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Law and ethics · responsibility: who should act","payload":{"Strategy":"ask who can bear the duty without a conflict of interest","Grammar":"nominalisation for abstraction","Vocabulary":"self-regulation, capture, standing, duty of care","Convention":"allocating a duty between parties who both have reasons to avoid it"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Anja argues from enforceability, Pawel from fault. Which does the law usually follow?\u003c/p>\u003cp>b.  Pawel predicts two consequences. Are they both bad?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is regulatory capture, and what is standing?\u003c/p>\u003cp>b.  What is a duty of care, and what makes one reasonable to impose?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Pawel the fault point and keep Anja’s conclusion, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response introduces a principle neither classmate used. Name it and say what it settles.\u003c/p>\u003cp>b.  How does it use Pawel’s objections rather than rejecting them?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"not because it is culpable but because it is the only party positioned to impose a condition\" — name the structure and its effect.\u003c/p>\u003cp>b.  \"which is the one task none of the private parties can do without a conflict of interest\" — what does this clause do for the regulator?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Fault, ordinarily — but not exclusively. Several areas of law allocate liability by capacity to prevent rather than by blame, which is the opening the response uses.\u003c/p>\u003cp>b.  No. Shutting out small sellers is a genuine harm; a fee spread across buyers is a cost but may be an efficient one, since it prices the risk into the transaction. Separating them is what lets the second paragraph answer only the real objection.\u003c/p>","P2":"\u003cp>a.  Capture is a regulator coming to serve the industry it oversees. Standing is the right to bring a case at all — and the buyer often has none against a foreign manufacturer, which is Anja’s point.\u003c/p>\u003cp>b.  An obligation to take reasonable care to avoid harm to others. It is reasonable to impose where the party can foresee the harm and can act at proportionate cost.\u003c/p>","P3":"\u003cp>Model: \"Liability should follow the cheapest avoider rather than the designer, and on a marketplace that is the platform — not because it is at fault but because it is the only party able to set a condition on listing.\"\u003c/p>","F1":"\u003cp>a.  The cheapest-avoider principle. It settles the argument because it explains how Pawel can be right about fault while Anja is right about where liability belongs — the two were answering different questions about the same rule.\u003c/p>\u003cp>b.  It treats them as specifications. Each objection names a version of the rule that would fail, which tells you what the workable version must avoid: not testing every item, and not a duty so broad that compliance costs more than the harm.\u003c/p>","F2":"\u003cp>a.  A \"not ... but\" correlative. It rejects the ground Pawel assumed the argument had to be fought on while accepting his factual claim, which is what makes the conclusion survive his objection.\u003c/p>\u003cp>b.  It assigns the regulator the residual task and justifies it by a property — absence of conflict — rather than by authority. That makes the allocation principled rather than conventional, and it answers the third option in the professor’s question, which neither classmate addressed.\u003c/p>","F3":"\u003cp>1.  It answers a question about where responsibility should sit with a claim about who is at fault, and never engages Anja’s point that the manufacturer may be unreachable.\u003c/p>\u003cp>2.  The remedies offered are the status quo — take down on report, regulator should do better — with no account of why either currently fails.\u003c/p>\u003cp>3.  Language: \"the real responsibility is of the company\" (lies with); \"the sellers and the buyers\", \"the market\", \"the victims\" over-articled; \"they knew or should have known\" is a legal formula used without the standard it belongs to.\u003c/p>"},"model":["Pawel is right that the platform did not design the product, and Anja is right that fault without enforceability protects nobody. The way through is to notice that liability does not have to track blame; it often tracks the cheapest avoider — the party who could have prevented the harm at least cost. That is not the manufacturer, who is beyond jurisdiction, and it is not the buyer, who cannot test a kettle. It is the platform, not because it is culpable but because it is the only party positioned to impose a condition on listing.","Pawel’s consequences then become design constraints rather than objections. A liability rule that required testing of every item would indeed shut out small sellers; one that required a platform to hold proof of conformity for product categories with known failure modes, and to be liable only where it did not, would not. That is a much narrower duty, it is auditable, and it falls on information the platform already collects. The regulator’s role is then to specify the categories, which is the one task none of the private parties can do without a conflict of interest."],"model_html":"\u003cp>Pawel is right that the platform did not design the product, and Anja is right that fault without enforceability protects nobody. The way through is to notice that liability does not have to track blame; it often tracks the cheapest avoider — the party who could have prevented the harm at least cost. That is not the manufacturer, who is beyond jurisdiction, and it is not the buyer, who cannot test a kettle. It is the platform, not because it is culpable but because it is the only party positioned to impose a condition on listing.\u003c/p>\u003cp>Pawel’s consequences then become design constraints rather than objections. A liability rule that required testing of every item would indeed shut out small sellers; one that required a platform to hold proof of conformity for product categories with known failure modes, and to be liable only where it did not, would not. That is a much narrower duty, it is auditable, and it falls on information the platform already collects. The regulator’s role is then to specify the categories, which is the one task none of the private parties can do without a conflict of interest.\u003c/p>","model_band":5,"degraded":["I think the main responsibility must be on the manufacturer because they are the ones who made the dangerous product and they knew or should have known that it was not safe. The platform is just an intermediary which connects the sellers and the buyers, it cannot control millions of products. Of course the platform should remove the product when somebody reports it, and the regulator should also do its job better and check the products before they arrive on the market. But the real responsibility is of the company who produced the item and they should pay compensation to the victims."],"degraded_html":"\u003cp>I think the main responsibility must be on the manufacturer because they are the ones who made the dangerous product and they knew or should have known that it was not safe. The platform is just an intermediary which connects the sellers and the buyers, it cannot control millions of products. Of course the platform should remove the product when somebody reports it, and the regulator should also do its job better and check the products before they arrive on the market. But the real responsibility is of the company who produced the item and they should pay compensation to the victims.\u003c/p>","degraded_band":3,"model_words":191,"fault_list":{"tag":"F3","faults":["It answers a question about where responsibility should sit with a claim about who is at fault, and never engages Anja’s point that the manufacturer may be unreachable.","The remedies offered are the status quo — take down on report, regulator should do better — with no account of why either currently fails.","Language: \"the real responsibility is of the company\" (lies with); \"the sellers and the buyers\", \"the market\", \"the victims\" over-articled; \"they knew or should have known\" is a legal formula used without the standard it belongs to."],"html":["\u003cp>1.  It answers a question about where responsibility should sit with a claim about who is at fault, and never engages Anja’s point that the manufacturer may be unreachable.\u003c/p>","\u003cp>2.  The remedies offered are the status quo — take down on report, regulator should do better — with no account of why either currently fails.\u003c/p>","\u003cp>3.  Language: \"the real responsibility is of the company\" (lies with); \"the sellers and the buyers\", \"the market\", \"the victims\" over-articled; \"they knew or should have known\" is a legal formula used without the standard it belongs to.\u003c/p>"]},"prof_name":"Dr Ferreira","professor":"\u003cp>When a product sold online causes harm, responsibility may lie with the manufacturer, the platform that listed it, or the regulator that failed to catch it. Where should primary responsibility sit?\u003c/p>","students":[["Anja","The platform. It takes a commission on every sale, it controls who may list, and in many cases the manufacturer is beyond the reach of any court the buyer can use. Responsibility should follow the party that can actually be sued."],["Pawel","That is convenience dressed as principle. The platform did not design the product and cannot test every item on a marketplace of millions. Making it liable produces either censorship of small sellers or a fee that buyers pay, and in neither case does the dangerous product improve."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language. “in 12 May” (on), “in Dalton Room” (in the Dalton Room), “confirm your attendance until Friday” (by Friday), “It will be very nice if you accept” (It would be). The until/by error is consequential: it asks for the opposite of what is meant.","correct":false},{"text":"The remedies offered are the status quo — take down on report, regulator should do better — with no account of why either currently fails.","correct":true},{"text":"“My costs have increased considerably” and “no longer enough to cover my rent” argue need, which invites comparison with every other applicant, and no evidence is attached.","correct":false},{"text":"It answers a question about where responsibility should sit with a claim about who is at fault, and never engages Anja’s point that the manufacturer may be unreachable.","correct":true},{"text":"Language: “the real responsibility is of the company” (lies with); “the sellers and the buyers”, “the market”, “the victims” over-articled; “they knew or should have known” is a legal formula used without the standard it belongs to.","correct":true},{"text":"The grievance and the request are fused, so the office must answer “who made the decision and on what basis” before it can address the place. The second bullet fails.","correct":false}],"key_html":"F3"}};</script>
