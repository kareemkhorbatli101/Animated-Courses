<script>window.ITEM={"kind":"exercise","id":"AD 018","slug":"ad-018","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Education · value trade-off","payload":{"Strategy":"ask what each option forecloses, not what it delivers","Grammar":"comparative of importance","Vocabulary":"breadth, specialisation, transferable, cohort","Convention":"arguing about curriculum without defending your own subject"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Oskar makes a point about irreversibility and a point about equity. Separate them.\u003c/p>\u003cp>b.  Does Mira’s argument require specialisation at sixteen specifically?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What are transferable skills, and why is the term often used loosely?\u003c/p>\u003cp>b.  Distinguish breadth from superficiality.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Mira the depth argument and keep Oskar’s conclusion, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response claims an asymmetry. State it in one sentence.\u003c/p>\u003cp>b.  Find the sentence that reinterprets Oskar’s equity point. What does it add?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"One forecloses, the other merely delays.\" Why is this short sentence placed where it is?\u003c/p>\u003cp>b.  \"whichever ones were taught well\" — what claim is smuggled into this clause?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Irreversibility: a subject dropped at sixteen cannot realistically be resumed. Equity: students with advisers at home make that choice better, so the irreversibility bites unequally.\u003c/p>\u003cp>b.  No. It requires that students arrive at university with depth, which is compatible with specialising at seventeen or eighteen. Noticing that the argument does not reach the date is the opening.\u003c/p>","P2":"\u003cp>a.  Skills claimed to carry across domains. The term is loose because the evidence for transfer is weak for most of what is claimed, and it is often used to justify breadth without specifying what transfers.\u003c/p>\u003cp>b.  Breadth is range with sufficient depth to be real; superficiality is range without it. Mira is attacking the second and calling it the first.\u003c/p>","P3":"\u003cp>Model: \"Depth is an argument about what students arrive knowing, not about when they must narrow — and only one of the two errors is reversible.\"\u003c/p>","F1":"\u003cp>a.  Specialising a year too late costs some depth, which can be made up; specialising a year too early closes a subject permanently. The costs are not of the same kind, so they cannot simply be traded off.\u003c/p>\u003cp>b.  \"the apparent choice encodes the quality of the teaching the student happened to get, and then makes it permanent.\" It converts his fairness point into a causal mechanism: the system is not merely harder on some students, it systematically converts a school’s weakness into a pupil’s permanent limit.\u003c/p>","F2":"\u003cp>a.  At the end of the paragraph, where it lands as the conclusion of the asymmetry argument. Its brevity after two long sentences is what gives it force — the contrast in rhythm does work the words alone would not.\u003c/p>\u003cp>b.  That subject choice at sixteen is largely determined by teaching quality rather than aptitude or interest. It is a strong empirical claim, and placing it in a relative clause lets it function as a premise without being argued for — which is efficient, and worth noticing when others do it to you.\u003c/p>","F3":"\u003cp>1.  It takes no position, and the compromise proposed — specialise a little, keep some general subjects — is what every system already claims to do.\u003c/p>\u003cp>2.  Nothing is added. Both positions are restated, and the medicine and engineering examples support Mira without engaging Oskar’s irreversibility point at all.\u003c/p>\u003cp>3.  Language: \"this is a difficult question for every education system in the world\" is filler; \"decide your whole future\" and \"flexibility for the future\" repeat; \"a strong base\" should be \"a strong foundation\".\u003c/p>"},"model":["Mira is right that depth is what makes a first year possible, and that is an argument about what students arrive knowing, not about when the narrowing has to happen. Oskar’s point about irreversibility is the one that decides it: the asymmetry between dropping mathematics at sixteen and picking it up at twenty is severe, and it is not symmetric with the cost of specialising a year later. One forecloses, the other merely delays.","What neither says is that the two systems differ less in depth than in who does the choosing. A sixteen-year-old in a specialising system is not weighing subjects; they are following whichever ones went well in the previous two years, which largely means whichever ones were taught well. Oskar’s equity point is really this: the apparent choice encodes the quality of the teaching the student happened to get, and then makes it permanent. I would specialise late and narrowly rather than early and broadly — two subjects at seventeen rather than three at sixteen would keep Mira’s depth and most of Oskar’s doors."],"model_html":"\u003cp>Mira is right that depth is what makes a first year possible, and that is an argument about what students arrive knowing, not about when the narrowing has to happen. Oskar’s point about irreversibility is the one that decides it: the asymmetry between dropping mathematics at sixteen and picking it up at twenty is severe, and it is not symmetric with the cost of specialising a year later. One forecloses, the other merely delays.\u003c/p>\u003cp>What neither says is that the two systems differ less in depth than in who does the choosing. A sixteen-year-old in a specialising system is not weighing subjects; they are following whichever ones went well in the previous two years, which largely means whichever ones were taught well. Oskar’s equity point is really this: the apparent choice encodes the quality of the teaching the student happened to get, and then makes it permanent. I would specialise late and narrowly rather than early and broadly — two subjects at seventeen rather than three at sixteen would keep Mira’s depth and most of Oskar’s doors.\u003c/p>","model_band":5,"degraded":["I think both students make very good points and this is a difficult question for every education system in the world. Mira is right that students need deep knowledge to succeed at university, especially in subjects like medicine or engineering where you need a strong base. But Oskar is also right that sixteen is very young to decide your whole future and many students change their mind later. In my opinion the best system would be a balance where students specialise a little but also continue with some general subjects, so they have both depth and flexibility for the future."],"degraded_html":"\u003cp>I think both students make very good points and this is a difficult question for every education system in the world. Mira is right that students need deep knowledge to succeed at university, especially in subjects like medicine or engineering where you need a strong base. But Oskar is also right that sixteen is very young to decide your whole future and many students change their mind later. In my opinion the best system would be a balance where students specialise a little but also continue with some general subjects, so they have both depth and flexibility for the future.\u003c/p>","degraded_band":3,"model_words":178,"fault_list":{"tag":"F3","faults":["It takes no position, and the compromise proposed — specialise a little, keep some general subjects — is what every system already claims to do.","Nothing is added. Both positions are restated, and the medicine and engineering examples support Mira without engaging Oskar’s irreversibility point at all.","Language: \"this is a difficult question for every education system in the world\" is filler; \"decide your whole future\" and \"flexibility for the future\" repeat; \"a strong base\" should be \"a strong foundation\"."],"html":["\u003cp>1.  It takes no position, and the compromise proposed — specialise a little, keep some general subjects — is what every system already claims to do.\u003c/p>","\u003cp>2.  Nothing is added. Both positions are restated, and the medicine and engineering examples support Mira without engaging Oskar’s irreversibility point at all.\u003c/p>","\u003cp>3.  Language: \"this is a difficult question for every education system in the world\" is filler; \"decide your whole future\" and \"flexibility for the future\" repeat; \"a strong base\" should be \"a strong foundation\".\u003c/p>"]},"prof_name":"Professor Adeyemi","professor":"\u003cp>Some systems require students to specialise at sixteen; others keep a broad curriculum to eighteen or beyond. Specialists go deeper sooner; generalists keep their options open longer. Which matters more at that age — depth, or keeping options open?\u003c/p>","students":[["Mira","Depth. Three subjects taken seriously at seventeen is what makes a first year at university possible at all. Breadth sounds generous but it produces students who have touched nine things and can do none of them."],["Oskar","Options. Most sixteen-year-olds do not know what they want, and a choice made then is effectively irreversible — you cannot pick up mathematics at twenty if you dropped it at sixteen. The cost falls hardest on students without anyone at home to advise them."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It takes no position, and the compromise proposed — specialise a little, keep some general subjects — is what every system already claims to do.","correct":true},{"text":"No achievable ask and no identification. “Bring back the shuttle immediately” is the one thing this office may be unable to do, no alternative is offered, and the email is unsigned — so it cannot be answered at all.","correct":false},{"text":"“I hope it works out for you” closes without offering anything, so the third bullet fails; and there is a comma splice in the first sentence.","correct":false},{"text":"It refuses and offers nothing. “Make a list of pros and cons” is the method everyone already knows and the one that fails, so the second bullet fails.","correct":false},{"text":"Nothing is added. Both positions are restated, and the medicine and engineering examples support Mira without engaging Oskar’s irreversibility point at all.","correct":true},{"text":"Language: “this is a difficult question for every education system in the world” is filler; “decide your whole future” and “flexibility for the future” repeat; “a strong base” should be “a strong foundation”.","correct":true}],"key_html":"F3"}};</script>
