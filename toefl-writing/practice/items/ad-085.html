<script>window.ITEM={"kind":"exercise","id":"AD 085","slug":"ad-085","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Archaeology · agree / disagree","payload":{"Strategy":"argue from what the evidence could not show","Grammar":"modal speculation about the past","Vocabulary":"assemblage, stratigraphy, taphonomy, inference","Convention":"reasoning about absent evidence"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Priya is making a taphonomic objection. State it precisely.\u003c/p>\u003cp>b.  What would strengthen Nils’s inference without finding anything new?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an assemblage, and what is stratigraphy?\u003c/p>\u003cp>b.  What does taphonomy study?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence about what the absence can support.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response neither accepts nor rejects the original claim. Is that a position?\u003c/p>\u003cp>b.  Why does it propose a control rather than more excavation?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the absence of wooden weapons is exactly what we would see whether or not they existed\" — why the modal?\u003c/p>\u003cp>b.  \"that this was not reported is itself worth noticing\" — what is being implied?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the processes which form and preserve a deposit filter what survives, so an absence in the record may reflect preservation rather than past behaviour.\u003c/p>\u003cp>b.  Evidence that the deposits preserve comparable organic material in other categories, which would show that weapons would have survived had they been there.\u003c/p>","P2":"\u003cp>a.  An assemblage is the set of artefacts recovered from a context; stratigraphy is the layered sequence of deposits and what it shows about order in time.\u003c/p>\u003cp>b.  How remains are deposited, altered and destroyed between death or discard and excavation — the study of what the record has already filtered out.\u003c/p>","P3":"\u003cp>Model: \"The absence supports the claim only if the deposits are shown to preserve comparable organic material.\"\u003c/p>","F1":"\u003cp>a.  Yes — it is a position about what the evidence can support, which is what the prompt asks for. Declining to rule on whether the society was peaceful is the correct answer when the data cannot distinguish the two possibilities.\u003c/p>\u003cp>b.  Because the problem is not a shortage of finds but an untested assumption about preservation, and that assumption can be checked against material already excavated. More digging in the same soil would reproduce the same absence.\u003c/p>","F2":"\u003cp>a.  Because the claim is about what the evidence would look like under a hypothesis, not about what happened. The modal keeps the sentence in the space of possible records, which is where the whole objection lives.\u003c/p>\u003cp>b.  That the original interpretation did not consider the taphonomic question at all. The omission is evidence about the argument’s quality rather than about the site, and saying so is a stronger criticism than disputing the conclusion.\u003c/p>","F3":"\u003cp>1.  It repeats Priya’s slogan without explaining the mechanism, so nothing is added to the discussion.\u003c/p>\u003cp>2.  \"We can never really know what ancient people were like\" is a general scepticism that would defeat any archaeological claim, including the one it is defending.\u003c/p>\u003cp>3.  No control, no preservation conditions, no account of what would make the absence informative — so the response offers no way to assess the claim, which is what was asked.\u003c/p>"},"model":["Priya is right about the logic and Nils’s inference can be rescued, but only by adding something his argument currently assumes.","The objection is not that the site was violent. It is that preservation is selective, so an empty category may record the burial conditions rather than the behaviour. Acidic soil destroys wood and bone within centuries, and in such a deposit the absence of wooden weapons is exactly what we would see whether or not they existed.","What would repair the inference is a control. If the same deposits preserved wooden structures, textiles or unburnt bone from other contexts, then the absence of weapons becomes informative, because we know the soil would have kept them. Without that comparison Nils’s \"you would expect\" is doing work the evidence has not earned.","So the claim should be assessed as conditional rather than refuted. The site may well have been unusually peaceful; the excavation as reported cannot distinguish that from a site whose weapons rotted. Stating which preservation conditions obtained would settle it, and that this was not reported is itself worth noticing."],"model_html":"\u003cp>Priya is right about the logic and Nils’s inference can be rescued, but only by adding something his argument currently assumes.\u003c/p>\u003cp>The objection is not that the site was violent. It is that preservation is selective, so an empty category may record the burial conditions rather than the behaviour. Acidic soil destroys wood and bone within centuries, and in such a deposit the absence of wooden weapons is exactly what we would see whether or not they existed.\u003c/p>\u003cp>What would repair the inference is a control. If the same deposits preserved wooden structures, textiles or unburnt bone from other contexts, then the absence of weapons becomes informative, because we know the soil would have kept them. Without that comparison Nils’s \"you would expect\" is doing work the evidence has not earned.\u003c/p>\u003cp>So the claim should be assessed as conditional rather than refuted. The site may well have been unusually peaceful; the excavation as reported cannot distinguish that from a site whose weapons rotted. Stating which preservation conditions obtained would settle it, and that this was not reported is itself worth noticing.\u003c/p>","model_band":5,"degraded":["I think we should be very careful about saying that a society was peaceful just because we have not found weapons, because absence of evidence is not evidence of absence as Priya says. Archaeology always involves a lot of interpretation and we can never really know what ancient people were like. Many assumptions about the past have turned out to be wrong because archaeologists projected their own ideas onto the evidence. We should keep an open mind about this site."],"degraded_html":"\u003cp>I think we should be very careful about saying that a society was peaceful just because we have not found weapons, because absence of evidence is not evidence of absence as Priya says. Archaeology always involves a lot of interpretation and we can never really know what ancient people were like. Many assumptions about the past have turned out to be wrong because archaeologists projected their own ideas onto the evidence. We should keep an open mind about this site.\u003c/p>","degraded_band":3,"model_words":181,"fault_list":{"tag":"F3","faults":["It repeats Priya’s slogan without explaining the mechanism, so nothing is added to the discussion.","\"We can never really know what ancient people were like\" is a general scepticism that would defeat any archaeological claim, including the one it is defending.","No control, no preservation conditions, no account of what would make the absence informative — so the response offers no way to assess the claim, which is what was asked."],"html":["\u003cp>1.  It repeats Priya’s slogan without explaining the mechanism, so nothing is added to the discussion.\u003c/p>","\u003cp>2.  \"We can never really know what ancient people were like\" is a general scepticism that would defeat any archaeological claim, including the one it is defending.\u003c/p>","\u003cp>3.  No control, no preservation conditions, no account of what would make the absence informative — so the response offers no way to assess the claim, which is what was asked.\u003c/p>"]},"prof_name":"Dr Whitfield","professor":"\u003cp>Excavations of a settlement show no weapons and no defensive walls, and some archaeologists have described it as a peaceful society. Others argue that absence of evidence is being read as evidence of absence. How should such a claim be assessed?\u003c/p>","students":[["Nils","The inference is reasonable. If a society fought, you would expect fortification and weapon deposits somewhere in two hundred years of occupation."],["Priya","You would expect them to survive, which is a different claim. Wooden palisades and wooden spears leave almost nothing. The site may be telling us about its soil chemistry, not its politics."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It repeats Priya’s slogan without explaining the mechanism, so nothing is added to the discussion.","correct":true},{"text":"Language and register. “Dear Professor” without the name when it was in the address line, “impossible” as an absolute, “a time which is more convenient” (more convenient for whom?), and “Thank you for understanding my situation”, which thanks him in advance for agreeing and so removes his choice.","correct":false},{"text":"“Could you tell me more about the two pathways” requests unbounded information rather than the two specific figures needed, so the second bullet fails and the reply will be a link to the handbook already consulted.","correct":false},{"text":"“We can never really know what ancient people were like” is a general scepticism that would defeat any archaeological claim, including the one it is defending.","correct":true},{"text":"No control, no preservation conditions, no account of what would make the absence informative — so the response offers no way to assess the claim, which is what was asked.","correct":true},{"text":"Register: institutional throughout (“we encourage”, “a valuable opportunity”, “we look forward to seeing you there”), which signals an official activity rather than a room where people sit and work.","correct":false}],"key_html":"F3"}};</script>
