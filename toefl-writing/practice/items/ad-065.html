<script>window.ITEM={"kind":"exercise","id":"AD 065","slug":"ad-065","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Philosophy · agree / disagree","payload":{"Strategy":"test a principle against the case it was built to cover","Grammar":"subjunctive in hypotheticals","Vocabulary":"intuition, principle, defeasible, revise","Convention":"testing a moral principle against a counter-example"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Jonas and Lin disagree about evidence, not about the case. Explain.\u003c/p>\u003cp>b.  What would it take for a counter-example to defeat a principle?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a defeasible claim?\u003c/p>\u003cp>b.  Distinguish revising a principle from abandoning it.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence about what intuitions are evidence of.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response turns Lin’s historical argument against her. How exactly?\u003c/p>\u003cp>b.  Three marks of a trustworthy intuition are given. Why does the argument need them?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Were intuitions worthless, the intuition that slavery is monstrous would also be worthless\" — identify the structure and say why it is used here.\u003c/p>\u003cp>b.  \"has stopped being tested by anything\" — what kind of objection is this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Both accept that the organ case feels monstrous. They disagree about whether that feeling is evidence against the theory or a datum the theory may overrule.\u003c/p>\u003cp>b.  The intuition would have to be more secure than the principle’s support, and not explicable by bias, interest or error. A counter-example defeats a principle only when the judgement it rests on is harder to give up than the principle is.\u003c/p>","P2":"\u003cp>a.  One that provides genuine support but can be overridden by stronger considerations — as opposed to one that is either conclusive or worthless.\u003c/p>\u003cp>b.  Revising adds a constraint or qualification while keeping the core; abandoning discards it. Most counter-examples warrant the first.\u003c/p>","P3":"\u003cp>Model: \"Intuitions are defeasible evidence, which is why the organ case counts against the principle without settling everything.\"\u003c/p>","F1":"\u003cp>a.  By noting that the abolitionist conviction was itself an intuition. If intuitions have no evidential weight, the judgement Lin relies on to show they are unreliable is also weightless, so her argument undercuts its own premise.\u003c/p>\u003cp>b.  Because without them \"intuitions are defeasible evidence\" is unusable — anyone can call their own conviction the reliable kind. Stability under reflection, cross-traditional agreement and independence from self-interest give a test that the historical cases fail and the organ case passes.\u003c/p>","F2":"\u003cp>a.  An inverted subjunctive conditional. It states the opponent’s premise as a supposition and follows it to a consequence she must reject, which is cleaner than asserting that intuitions matter.\u003c/p>\u003cp>b.  A methodological one: a theory immune to counter-example is not confirmed but unfalsifiable. It shifts the complaint from the theory’s verdict to its relationship with evidence, which is harder to answer.\u003c/p>","F3":"\u003cp>1.  \"Some things are simply wrong and we do not need a philosophical argument\" declines the question, which is precisely whether that response is legitimate.\u003c/p>\u003cp>2.  Lin’s argument is dismissed with \"now we know better and our moral understanding has progressed\" — which assumes the reliability of current intuitions, the very thing in dispute.\u003c/p>\u003cp>3.  \"Human rights are universal\" is asserted rather than defended, and no distinction is drawn between revising the principle and rejecting it, so there is no position on the actual question.\u003c/p>"},"model":["Lin is right that intuitions are revisable and wrong to conclude that they carry no weight, and the organ case shows why.","Her historical point cuts both ways. Were intuitions worthless, the intuition that slavery is monstrous would also be worthless, and it was that intuition, pressed against the arguments of the day, which did the work. What history shows is not that intuitions are unreliable but that they are defeasible — evidence that can be outweighed, like any other.","That is enough to answer Jonas too. His case is strong not because the feeling is intense but because it is stable under reflection, shared across traditions that agree on little else, and not explicable as self-interest. Those are the marks of an intuition worth keeping, and they are absent in the historical cases Lin cites, which tracked the interests of those who held them.","So I would say the organ case defeats the principle in its simple form, and that the right response is revision rather than abandonment. If the theory cannot accommodate a constraint on using people, it should acquire one; a theory that survives only by telling us our firmest judgements are illusions has stopped being tested by anything."],"model_html":"\u003cp>Lin is right that intuitions are revisable and wrong to conclude that they carry no weight, and the organ case shows why.\u003c/p>\u003cp>Her historical point cuts both ways. Were intuitions worthless, the intuition that slavery is monstrous would also be worthless, and it was that intuition, pressed against the arguments of the day, which did the work. What history shows is not that intuitions are unreliable but that they are defeasible — evidence that can be outweighed, like any other.\u003c/p>\u003cp>That is enough to answer Jonas too. His case is strong not because the feeling is intense but because it is stable under reflection, shared across traditions that agree on little else, and not explicable as self-interest. Those are the marks of an intuition worth keeping, and they are absent in the historical cases Lin cites, which tracked the interests of those who held them.\u003c/p>\u003cp>So I would say the organ case defeats the principle in its simple form, and that the right response is revision rather than abandonment. If the theory cannot accommodate a constraint on using people, it should acquire one; a theory that survives only by telling us our firmest judgements are illusions has stopped being tested by anything.\u003c/p>","model_band":5,"degraded":["I agree with Jonas because some things are simply wrong and we do not need a philosophical argument to know that killing an innocent patient to take their organs is murder. No theory can justify such an act. Lin mentions slavery but I think this is a different situation because now we know better and our moral understanding has progressed. Human rights are universal and they cannot be sacrificed for the benefit of the majority, otherwise any crime could be justified by saying it helps more people."],"degraded_html":"\u003cp>I agree with Jonas because some things are simply wrong and we do not need a philosophical argument to know that killing an innocent patient to take their organs is murder. No theory can justify such an act. Lin mentions slavery but I think this is a different situation because now we know better and our moral understanding has progressed. Human rights are universal and they cannot be sacrificed for the benefit of the majority, otherwise any crime could be justified by saying it helps more people.\u003c/p>","degraded_band":3,"model_words":202,"fault_list":{"tag":"F3","faults":["\"Some things are simply wrong and we do not need a philosophical argument\" declines the question, which is precisely whether that response is legitimate.","Lin’s argument is dismissed with \"now we know better and our moral understanding has progressed\" — which assumes the reliability of current intuitions, the very thing in dispute.","\"Human rights are universal\" is asserted rather than defended, and no distinction is drawn between revising the principle and rejecting it, so there is no position on the actual question."],"html":["\u003cp>1.  \"Some things are simply wrong and we do not need a philosophical argument\" declines the question, which is precisely whether that response is legitimate.\u003c/p>","\u003cp>2.  Lin’s argument is dismissed with \"now we know better and our moral understanding has progressed\" — which assumes the reliability of current intuitions, the very thing in dispute.\u003c/p>","\u003cp>3.  \"Human rights are universal\" is asserted rather than defended, and no distinction is drawn between revising the principle and rejecting it, so there is no position on the actual question.\u003c/p>"]},"prof_name":"Dr Amari","professor":"\u003cp>A familiar principle holds that we should always act so as to produce the most good overall. Critics offer cases where this seems to license something monstrous — harming one person to benefit many. Defenders reply that our intuitions in such cases are unreliable. Who has the better of this?\u003c/p>","students":[["Jonas","The counter-examples are decisive. If a theory tells you to harvest one patient’s organs to save five, the theory is wrong, and no amount of argument should move you off that."],["Lin","Intuitions have licensed slavery and told us the sun goes round the earth. \"I just feel this is wrong\" is where an argument starts, not where it ends."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","correct":false},{"text":"Lin’s argument is dismissed with “now we know better and our moral understanding has progressed” — which assumes the reliability of current intuitions, the very thing in dispute.","correct":true},{"text":"Language. No order reference, no date, no count of the damage, and “immediately” as an instruction.","correct":false},{"text":"“Human rights are universal” is asserted rather than defended, and no distinction is drawn between revising the principle and rejecting it, so there is no position on the actual question.","correct":true},{"text":"“Some things are simply wrong and we do not need a philosophical argument” declines the question, which is precisely whether that response is legitimate.","correct":true},{"text":"It ignores the published material and the notice period, and closes with “Thank you for understanding”, which thanks them in advance for accepting what has already been decided.","correct":false}],"key_html":"F3"}};</script>
