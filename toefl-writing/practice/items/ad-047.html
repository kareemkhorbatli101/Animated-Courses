<script>window.ITEM={"kind":"exercise","id":"AD 047","slug":"ad-047","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business and economics · value trade-off","payload":{"Strategy":"ask what each option does to the people with least slack","Grammar":"comparative of importance","Vocabulary":"flexibility, precarity, predictability, scheduling","Convention":"weighing two goods that are both called flexibility"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ife claims the two interests differ in kind. On what basis?\u003c/p>\u003cp>b.  Tomas says predictability \"is not free\". Who does he think pays?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish flexibility from precarity.\u003c/p>\u003cp>b.  What is a zero-hours contract, and what is a guaranteed-hours floor?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the asymmetry in one sentence without dismissing the employer’s interest.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response uses Tomas’s own reasoning against his conclusion. How?\u003c/p>\u003cp>b.  It replaces the policy question. From what to what?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"while a worker cannot pool at all\" — why does this clause settle the risk argument?\u003c/p>\u003cp>b.  \"It is about who holds the option.\" Why the short sentence?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That one party’s interest is in managing costs and the other’s is in meeting fixed external obligations — childcare, study, a second job — which cannot be rescheduled at short notice.\u003c/p>\u003cp>b.  Ultimately workers, through fewer jobs, if the cost of carrying idle staffing capacity makes employment more expensive.\u003c/p>","P2":"\u003cp>a.  Flexibility is the capacity to vary; precarity is exposure to variation you do not control. The same contract can be one for the employer and the other for the worker.\u003c/p>\u003cp>b.  A zero-hours contract guarantees no minimum work; a guaranteed-hours floor commits the employer to a minimum while leaving the rest variable.\u003c/p>","P3":"\u003cp>Model: \"Both want flexibility, but the employer wants the option and the worker wants the predictability, and those cannot both be held by the same party.\"\u003c/p>","F1":"\u003cp>a.  He argues that predictability has a cost and somebody must pay. The response accepts that and asks who can carry the cost most cheaply — and on standard risk reasoning that is the party able to pool it, which is the firm. His premise reaches her conclusion.\u003c/p>\u003cp>b.  From how much variation should be permitted, to how much notice must be given. That converts an unresolvable conflict of interests into a measurable parameter.\u003c/p>","F2":"\u003cp>a.  Because the case for placing risk with the employer rests on pooling, and a single worker with one income stream has nothing to pool across. It is the step that makes the conclusion follow from Tomas’s own premise rather than from a competing value judgement.\u003c/p>\u003cp>b.  It lands the reframing in five words after two long sentences, which makes it read as a realisation rather than an assertion. The rhythm marks the pivot of the response.\u003c/p>","F3":"\u003cp>1.  It restates Ife with more force and never engages Tomas’s argument that predictability has a cost somebody bears.\u003c/p>\u003cp>2.  \"They have much more power and resources, so they should be the ones who adapt\" asserts a conclusion from an imbalance without showing why power implies the duty — the pooling argument that would justify it is absent.\u003c/p>\u003cp>3.  The notice-period distinction, which is where the policy actually lives, never appears; and the ban proposed at the end is not connected to anything argued. Language: \"the weaker party\", \"the market\", \"individual workers\" over-articled; \"companies always talk about\" is unsupported.\u003c/p>"},"model":["Ife is right about the asymmetry and Tomas is right that it has a price, and the question is who is best placed to carry it. Variation in demand is a fact about the business and somebody must absorb it; the argument is really about whether it is absorbed by an organisation with reserves and insurance or by individuals with neither. Put that way, Tomas’s own logic favours Ife: risk is cheapest where it can be pooled, and a firm pools across weeks and staff while a worker cannot pool at all.","The qualification I would add is that this is not really about flexibility, which both sides claim. It is about who holds the option. A shift offered with a fortnight’s notice that the worker may decline is flexibility for both; the same shift offered at twelve hours’ notice with consequences for refusing is flexibility for one. The policy question is therefore not how much variation to allow but how far in advance it must be announced, which is measurable, enforceable, and leaves the employer free to vary staffing as much as the business genuinely requires."],"model_html":"\u003cp>Ife is right about the asymmetry and Tomas is right that it has a price, and the question is who is best placed to carry it. Variation in demand is a fact about the business and somebody must absorb it; the argument is really about whether it is absorbed by an organisation with reserves and insurance or by individuals with neither. Put that way, Tomas’s own logic favours Ife: risk is cheapest where it can be pooled, and a firm pools across weeks and staff while a worker cannot pool at all.\u003c/p>\u003cp>The qualification I would add is that this is not really about flexibility, which both sides claim. It is about who holds the option. A shift offered with a fortnight’s notice that the worker may decline is flexibility for both; the same shift offered at twelve hours’ notice with consequences for refusing is flexibility for one. The policy question is therefore not how much variation to allow but how far in advance it must be announced, which is measurable, enforceable, and leaves the employer free to vary staffing as much as the business genuinely requires.\u003c/p>","model_band":5,"degraded":["In my opinion workers should have priority because they are the weaker party in this relationship and they need stability to organise their lives, especially if they have children or study at the same time. Companies always talk about flexibility but what they really mean is that they want to pay people only when they need them, without any commitment. Of course businesses need to adapt to the market, but they have much more power and resources than individual workers, so they should be the ones who adapt. Governments should ban zero-hours contracts and guarantee a minimum number of hours."],"degraded_html":"\u003cp>In my opinion workers should have priority because they are the weaker party in this relationship and they need stability to organise their lives, especially if they have children or study at the same time. Companies always talk about flexibility but what they really mean is that they want to pay people only when they need them, without any commitment. Of course businesses need to adapt to the market, but they have much more power and resources than individual workers, so they should be the ones who adapt. Governments should ban zero-hours contracts and guarantee a minimum number of hours.\u003c/p>","degraded_band":3,"model_words":187,"fault_list":{"tag":"F3","faults":["It restates Ife with more force and never engages Tomas’s argument that predictability has a cost somebody bears.","\"They have much more power and resources, so they should be the ones who adapt\" asserts a conclusion from an imbalance without showing why power implies the duty — the pooling argument that would justify it is absent.","The notice-period distinction, which is where the policy actually lives, never appears; and the ban proposed at the end is not connected to anything argued. Language: \"the weaker party\", \"the market\", \"individual workers\" over-articled; \"companies always talk about\" is unsupported."],"html":["\u003cp>1.  It restates Ife with more force and never engages Tomas’s argument that predictability has a cost somebody bears.\u003c/p>","\u003cp>2.  \"They have much more power and resources, so they should be the ones who adapt\" asserts a conclusion from an imbalance without showing why power implies the duty — the pooling argument that would justify it is absent.\u003c/p>","\u003cp>3.  The notice-period distinction, which is where the policy actually lives, never appears; and the ban proposed at the end is not connected to anything argued. Language: \"the weaker party\", \"the market\", \"individual workers\" over-articled; \"companies always talk about\" is unsupported.\u003c/p>"]},"prof_name":"Dr Castellanos","professor":"\u003cp>Flexible scheduling is defended both by employers, who want to match staffing to demand, and by workers, who want control over their hours. When those two conflict, whose flexibility should take priority?\u003c/p>","students":[["Tomas","The employer’s, within limits. A business that cannot adjust staffing to demand carries costs that eventually show up as fewer jobs. Predictability for workers is valuable but it is not free, and somebody pays for it."],["Ife","The worker’s, and I would put it more strongly. The employer’s flexibility is a cost-management preference; the worker’s is the ability to arrange childcare, a second job or a course. Those are not the same kind of interest."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Deal with my request immediately” asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. “Completely unacceptable for a university of this size” is editorial.","correct":false},{"text":"Language. “explain me” (explain to me), “master students” (postgraduates, or master’s students), “I wait your reply” (I look forward to your reply), and a comma splice running through the whole central sentence.","correct":false},{"text":"“They have much more power and resources, so they should be the ones who adapt” asserts a conclusion from an imbalance without showing why power implies the duty — the pooling argument that would justify it is absent.","correct":true},{"text":"The notice-period distinction, which is where the policy actually lives, never appears; and the ban proposed at the end is not connected to anything argued. Language: “the weaker party”, “the market”, “individual workers” over-articled; “companies always talk about” is unsupported.","correct":true},{"text":"It restates Ife with more force and never engages Tomas’s argument that predictability has a cost somebody bears.","correct":true},{"text":"The decision is taken away. “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.","correct":false}],"key_html":"F3"}};</script>
