<script>window.ITEM={"kind":"exercise","id":"AD 070","slug":"ad-070","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Architecture · value trade-off","payload":{"Strategy":"weigh a cost that is visible against one that is not","Grammar":"contrastive while clauses","Vocabulary":"fabric, retrofit, embodied carbon, listed","Convention":"weighing preservation against performance"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Pieter is making a counting argument, not an aesthetic one. Explain.\u003c/p>\u003cp>b.  Juno and Pieter may not actually be proposing different things. Why not?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is embodied carbon, and what is a retrofit?\u003c/p>\u003cp>b.  What does fabric mean in a building context, and what does listed mean?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that names what is being left out of the sum.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the two speakers are compatible. What makes that more than a dodge?\u003c/p>\u003cp>b.  Why mention that unaffordable buildings decay?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"they block internal insulation ... while permitting the slow decay of buildings nobody can afford to heat\" — what does the while-clause do?\u003c/p>\u003cp>b.  \"by which time the grid has largely decarbonised anyway\" — why include this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  He is claiming that the carbon already spent building the structure belongs in the comparison, and that leaving it out makes replacement look better than it is.\u003c/p>\u003cp>b.  Because Juno wants alteration and Pieter is arguing against demolition. Both can be satisfied by a rule that permits changing a retained building, which neither of them states.\u003c/p>","P2":"\u003cp>a.  Embodied carbon is the emissions from producing and assembling the materials; a retrofit upgrades an existing building’s performance.\u003c/p>\u003cp>b.  Fabric is the physical material of the building; listed means legally protected, which restricts what may be altered.\u003c/p>","P3":"\u003cp>Model: \"The carbon already in the walls belongs in the sum, which makes keeping the building right and the current alteration rules wrong.\"\u003c/p>","F1":"\u003cp>a.  That it identifies a specific distinction neither speaker drew — between demolishing and altering — and shows each argument applies to a different one. A dodge would assert that both have a point without locating where.\u003c/p>\u003cp>b.  Because it shows the current rules failing by the conservation standard itself. A building left to rot is a heritage loss, so the argument for reform no longer depends on climate priorities overriding conservation ones.\u003c/p>","F2":"\u003cp>a.  It sets the rules’ two effects against each other in one sentence — what they block and what they allow — which is the cleanest way to show that the regime is incoherent rather than merely strict.\u003c/p>\u003cp>b.  Because the operational saving from a new building is usually valued at today’s carbon intensity. If the grid cleans up during the payback period, the saving shrinks and the embodied debt does not, which strengthens Pieter’s case considerably.\u003c/p>","F3":"\u003cp>1.  Pieter’s argument is called interesting and then set aside — \"but I still think energy efficiency has to come first\" — without any engagement with the accounting.\u003c/p>\u003cp>2.  \"We do not have time to worry about old windows\" dismisses the conservation position rather than weighing it, which is what a trade-off question asks for.\u003c/p>\u003cp>3.  No distinction between demolition and alteration, no mention of what the rules actually protect, and \"future generations will not thank us\" is rhetoric standing in for the comparison.\u003c/p>"},"model":["Pieter is right about the accounting and Juno is right about the rules, and the two conclusions are compatible once demolition is separated from alteration.","The embodied carbon point is decisive against demolition. A masonry building represents emissions already spent, and replacing it with a better-performing one takes decades to repay that debt — by which time the grid has largely decarbonised anyway and the operational saving is worth much less. On those numbers conservation usually wins.","But that is not an argument against altering what stands, and this is where Juno has a point the accounting does not answer. Conservation rules often protect appearance rather than fabric, so they block internal insulation and secondary glazing that would cost no heritage at all, while permitting the slow decay of buildings nobody can afford to heat. The rules are failing on their own terms as well as on climate ones.","So my position is: keep the building, and change what the rules protect. A regime that defends the street elevation and leaves the inside alone would deliver nearly all of Juno’s saving and all of Pieter’s."],"model_html":"\u003cp>Pieter is right about the accounting and Juno is right about the rules, and the two conclusions are compatible once demolition is separated from alteration.\u003c/p>\u003cp>The embodied carbon point is decisive against demolition. A masonry building represents emissions already spent, and replacing it with a better-performing one takes decades to repay that debt — by which time the grid has largely decarbonised anyway and the operational saving is worth much less. On those numbers conservation usually wins.\u003c/p>\u003cp>But that is not an argument against altering what stands, and this is where Juno has a point the accounting does not answer. Conservation rules often protect appearance rather than fabric, so they block internal insulation and secondary glazing that would cost no heritage at all, while permitting the slow decay of buildings nobody can afford to heat. The rules are failing on their own terms as well as on climate ones.\u003c/p>\u003cp>So my position is: keep the building, and change what the rules protect. A regime that defends the street elevation and leaves the inside alone would deliver nearly all of Juno’s saving and all of Pieter’s.\u003c/p>","model_band":5,"degraded":["I believe we must prioritise the environment because climate change is an emergency and we do not have time to worry about old windows. Of course historic buildings are beautiful and part of our cultural heritage, and I understand why people want to protect them, but future generations will not thank us for saving facades if the planet is uninhabitable. Pieter makes an interesting point about embodied carbon which I had not considered, but I still think energy efficiency has to come first."],"degraded_html":"\u003cp>I believe we must prioritise the environment because climate change is an emergency and we do not have time to worry about old windows. Of course historic buildings are beautiful and part of our cultural heritage, and I understand why people want to protect them, but future generations will not thank us for saving facades if the planet is uninhabitable. Pieter makes an interesting point about embodied carbon which I had not considered, but I still think energy efficiency has to come first.\u003c/p>","degraded_band":3,"model_words":185,"fault_list":{"tag":"F3","faults":["Pieter’s argument is called interesting and then set aside — \"but I still think energy efficiency has to come first\" — without any engagement with the accounting.","\"We do not have time to worry about old windows\" dismisses the conservation position rather than weighing it, which is what a trade-off question asks for.","No distinction between demolition and alteration, no mention of what the rules actually protect, and \"future generations will not thank us\" is rhetoric standing in for the comparison."],"html":["\u003cp>1.  Pieter’s argument is called interesting and then set aside — \"but I still think energy efficiency has to come first\" — without any engagement with the accounting.\u003c/p>","\u003cp>2.  \"We do not have time to worry about old windows\" dismisses the conservation position rather than weighing it, which is what a trade-off question asks for.\u003c/p>","\u003cp>3.  No distinction between demolition and alteration, no mention of what the rules actually protect, and \"future generations will not thank us\" is rhetoric standing in for the comparison.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>Historic buildings are often poorly insulated and expensive to heat, but regulations and public feeling restrict alterations to their fabric. Some argue the climate case for deep retrofit must override conservation rules. Others say demolition and loss are worse. What should take priority?\u003c/p>","students":[["Juno","Retrofit, and stop treating window frames as sacred. Buildings are a quarter of emissions. A beautiful facade is not worth a century of gas."],["Pieter","Replacing a building emits more than heating an old one badly for decades — the carbon is already in the walls. Conservation is often the low-carbon option and nobody counts it that way."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“I hope you will accept my word on this” asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.","correct":false},{"text":"Pieter’s argument is called interesting and then set aside — “but I still think energy efficiency has to come first” — without any engagement with the accounting.","correct":true},{"text":"No distinction between demolition and alteration, no mention of what the rules actually protect, and “future generations will not thank us” is rhetoric standing in for the comparison.","correct":true},{"text":"“One year is nothing in the long run” is exactly the reassurance that turns out to be false for the people who regret it, and there are two comma splices.","correct":false},{"text":"“We do not have time to worry about old windows” dismisses the conservation position rather than weighing it, which is what a trade-off question asks for.","correct":true},{"text":"It decides the other person’s constraints for them. “The mornings should be fine for you anyway since you only need afternoons” tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.","correct":false}],"key_html":"F3"}};</script>
