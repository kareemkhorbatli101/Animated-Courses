<script>window.ITEM={"kind":"exercise","id":"AD 096","slug":"ad-096","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Philosophy of science · agree / disagree","payload":{"Strategy":"distinguish a demarcation problem from a quality problem","Grammar":"subjunctive in that-clauses after demand","Vocabulary":"falsifiable, auxiliary hypothesis, parsimony, prediction","Convention":"arguing about what makes a theory scientific"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Jonas’s example is well chosen. What does it establish?\u003c/p>\u003cp>b.  If the difference cannot be told in advance, what is the criterion still good for?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an auxiliary hypothesis, and what is parsimony?\u003c/p>\u003cp>b.  What does falsifiable mean, precisely?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence about what the criterion can do.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts the Neptune case fully. How does it recover the criterion?\u003c/p>\u003cp>b.  Why does it say the criterion was \"never going to be\" a line between science and non-science?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a demand ... that each modification itself be checkable\" — why the subjunctive?\u003c/p>\u003cp>b.  \"whatever it is called\" — what is this dismissing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That an ad hoc rescue can be correct, so being ad hoc is not sufficient for being unscientific. It blocks the simple version of the criterion.\u003c/p>\u003cp>b.  Assessing a research programme over time, and judging whether each modification adds testable content — retrospective or ongoing evaluation rather than a classification at a moment.\u003c/p>","P2":"\u003cp>a.  An auxiliary hypothesis is an added assumption that reconciles a theory with a recalcitrant observation; parsimony is the preference for fewer such assumptions.\u003c/p>\u003cp>b.  That the theory entails some observation statement which, if it were observed to be otherwise, would count against it. It is a property of the theory, not of the scientist.\u003c/p>","P3":"\u003cp>Model: \"The criterion works as a standard for each modification — it must itself be testable — not as a boundary around science.\"\u003c/p>","F1":"\u003cp>a.  By relocating it. Instead of asking whether the theory is falsifiable, it asks whether the rescue is — and the unseen planet was, while an accommodation predicting nothing further is not. That distinction is available at the time.\u003c/p>\u003cp>b.  Because theories are not tested in isolation: any prediction depends on auxiliary assumptions, so a failed prediction never points at one claim. A criterion classifying whole theories was always going to fail on that.\u003c/p>","F2":"\u003cp>a.  Because \"demand\" takes a subjunctive complement, and the form marks the clause as a requirement rather than a description. The grammar itself distinguishes a standard being imposed from a fact being reported.\u003c/p>\u003cp>b.  The demarcation question. Once the criterion is a standard for moves rather than a label for fields, whether something counts as science becomes a secondary matter — which is the response’s main structural claim.\u003c/p>","F3":"\u003cp>1.  \"This was a special case\" dismisses Jonas’s counter-example without saying what makes it special, which is precisely the question.\u003c/p>\u003cp>2.  Phlogiston and the ether show that theories are sometimes abandoned, which nobody denied — the issue is how to tell a legitimate rescue from an evasion.\u003c/p>\u003cp>3.  \"A theory that cannot be tested is not really scientific\" restates the criterion under challenge, and there is a comma splice in the first sentence.\u003c/p>"},"model":["Lin is right and Jonas has shown why her criterion cannot be applied when it would be most useful, which is a serious limitation rather than a refutation.","His Neptune case establishes that rescuing a theory with an auxiliary hypothesis is not in itself unscientific. The modification was ad hoc by any reasonable description, and it was also correct, and nothing available at the time distinguished it from the modifications that turned out to be evasions.","What survives is a demand, not a test: that each modification itself be checkable. The unseen planet was a prediction with a position and a mass, and it could have failed; an adjustment that merely accommodates the anomaly and predicts nothing further cannot. That distinction is available at the time, which is what Jonas’s objection seemed to deny.","So the criterion is not a line between science and non-science and was never going to be. It is a standard applied to each move a theory makes, and a research programme whose successive modifications generate no new testable content is degenerating, whatever it is called. Lin’s instinct is right and needs this reformulation to answer Jonas."],"model_html":"\u003cp>Lin is right and Jonas has shown why her criterion cannot be applied when it would be most useful, which is a serious limitation rather than a refutation.\u003c/p>\u003cp>His Neptune case establishes that rescuing a theory with an auxiliary hypothesis is not in itself unscientific. The modification was ad hoc by any reasonable description, and it was also correct, and nothing available at the time distinguished it from the modifications that turned out to be evasions.\u003c/p>\u003cp>What survives is a demand, not a test: that each modification itself be checkable. The unseen planet was a prediction with a position and a mass, and it could have failed; an adjustment that merely accommodates the anomaly and predicts nothing further cannot. That distinction is available at the time, which is what Jonas’s objection seemed to deny.\u003c/p>\u003cp>So the criterion is not a line between science and non-science and was never going to be. It is a standard applied to each move a theory makes, and a research programme whose successive modifications generate no new testable content is degenerating, whatever it is called. Lin’s instinct is right and needs this reformulation to answer Jonas.\u003c/p>","model_band":5,"degraded":["I agree with Lin that falsifiability is important because a theory that cannot be tested is not really scientific, it is more like a belief. Popper was right that science progresses by trying to refute theories rather than confirm them. Jonas gives an interesting example about Neptune but I think this was a special case, and in general scientists do abandon theories when the evidence is against them, as happened with phlogiston and the ether."],"degraded_html":"\u003cp>I agree with Lin that falsifiability is important because a theory that cannot be tested is not really scientific, it is more like a belief. Popper was right that science progresses by trying to refute theories rather than confirm them. Jonas gives an interesting example about Neptune but I think this was a special case, and in general scientists do abandon theories when the evidence is against them, as happened with phlogiston and the ether.\u003c/p>","degraded_band":3,"model_words":192,"fault_list":{"tag":"F3","faults":["\"This was a special case\" dismisses Jonas’s counter-example without saying what makes it special, which is precisely the question.","Phlogiston and the ether show that theories are sometimes abandoned, which nobody denied — the issue is how to tell a legitimate rescue from an evasion.","\"A theory that cannot be tested is not really scientific\" restates the criterion under challenge, and there is a comma splice in the first sentence."],"html":["\u003cp>1.  \"This was a special case\" dismisses Jonas’s counter-example without saying what makes it special, which is precisely the question.\u003c/p>","\u003cp>2.  Phlogiston and the ether show that theories are sometimes abandoned, which nobody denied — the issue is how to tell a legitimate rescue from an evasion.\u003c/p>","\u003cp>3.  \"A theory that cannot be tested is not really scientific\" restates the criterion under challenge, and there is a comma splice in the first sentence.\u003c/p>"]},"prof_name":"Dr Amari","professor":"\u003cp>A familiar criterion holds that a theory is scientific only if it makes predictions that could turn out false. Critics note that real theories are rarely abandoned on a single failed prediction — they acquire modifications instead. Does the criterion survive?\u003c/p>","students":[["Lin","It survives as a criterion for good practice even if not for demarcation. A field that answers every failure with a new modification has stopped testing anything."],["Jonas","But every successful theory did that too. Newtonian mechanics survived an anomalous orbit by positing an unseen planet, and the planet was there. You cannot tell the difference in advance."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“This was a special case” dismisses Jonas’s counter-example without saying what makes it special, which is precisely the question.","correct":true},{"text":"“It is very successful there” is asserted without source, and “feel isolated and lost in their first year” repeats “first year” from the previous clause.","correct":false},{"text":"Phlogiston and the ether show that theories are sometimes abandoned, which nobody denied — the issue is how to tell a legitimate rescue from an evasion.","correct":true},{"text":"Consequential errors. “in this week” (this week), “for finish it” (to finish it), “Please give me extension” (an extension), “Best regard” (regards), and a comma splice at “next week, I will send”. Individually small; together they are the accumulation the band-3 descriptor names.","correct":false},{"text":"The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","correct":false},{"text":"“A theory that cannot be tested is not really scientific” restates the criterion under challenge, and there is a comma splice in the first sentence.","correct":true}],"key_html":"F3"}};</script>
