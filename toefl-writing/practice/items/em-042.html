<script>window.ITEM={"kind":"exercise","id":"EM 042","slug":"em-042","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask the question that decides whether you apply at all, first","Grammar":"whether ... or","Vocabulary":"deferral, conditional offer, defer, intake","Convention":"enquiring about something you may not go through with"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You may not defer at all. How does that change what you write?\u003c/p>\u003cp>b.  Why is ordering the questions by consequence better than by topic?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish a conditional offer, an unconditional offer and a deferral.\u003c/p>\u003cp>b.  What is an intake, and why might deferral depend on it?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask about the deadline in a way that does not announce a decision.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Three questions are asked in one paragraph rather than numbered. Is that a mistake here?\u003c/p>\u003cp>b.  Find the sentence that protects the writer, and say what it protects her from.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"whether deferral is possible on a conditional offer or only once the conditions have been met\" — why \"whether ... or\" rather than \"if\"?\u003c/p>\u003cp>b.  \"before I have to\" — what has been left out, and what does the ellipsis achieve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It makes the email an enquiry rather than a request. Announcing an intention you may not act on can get your place released, your file flagged, or a conversation started that you then have to walk back.\u003c/p>\u003cp>b.  Because the first question may make the others irrelevant. If deferral is impossible on a conditional offer, the deadline and the conditions do not arise — and a reader who sees that structure answers more usefully.\u003c/p>","P2":"\u003cp>a.  A conditional offer depends on results still to come; an unconditional one does not; a deferral postpones entry to a later year, usually keeping the offer alive.\u003c/p>\u003cp>b.  The cohort admitted in a given year. Deferral often depends on it because places are capped per intake, so a deferred student occupies a place in a year that may already be full.\u003c/p>","P3":"\u003cp>Model: \"I wanted to understand the position before deciding anything.\" It establishes the enquiry as exploratory in the first sentence, before any question is asked.\u003c/p>","F1":"\u003cp>a.  No. The questions are short and sequentially dependent, and \"first ... Second ... And third\" marks them clearly enough to be answered in order. Numbering is for questions that are independent and longer; here it would look heavier than the enquiry warrants.\u003c/p>\u003cp>b.  \"I have not made a decision and may well take up the place this year\". It protects her from the file being treated as a withdrawal, and from the slight disadvantage of being known to be wavering.\u003c/p>","F2":"\u003cp>a.  Because the alternatives are spelled out. \"If\" works when there is a yes and a no; \"whether ... or\" is the form that carries two named possibilities, and it makes the question precise enough to answer in a line.\u003c/p>\u003cp>b.  \"Before I have to decide\". Leaving it out keeps the decision unspoken, which is the whole posture of the email — and it ends the paragraph lightly rather than on the word the writer is avoiding.\u003c/p>","F3":"\u003cp>1.  It announces a decision the writer has not made. \"I think I will not be able to come this year\" converts an enquiry into a withdrawal notice, which is exactly the risk the third bullet asked her to avoid.\u003c/p>\u003cp>2.  No specific questions. \"The procedure\" leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.\u003c/p>\u003cp>3.  No applicant reference, \"some family problems\" discloses vaguely where nothing needed disclosing, and \"I hope this will not be a problem\" asks for reassurance rather than information.\u003c/p>"},"model":["Dear Postgraduate Admissions,","I hold a conditional offer for the MSc in Public Health beginning this September (applicant reference PG-61204). I am looking into the possibility of deferring to the following year and wanted to understand the position before deciding anything.","Could you tell me, first, whether deferral is possible on a conditional offer or only once the conditions have been met? Second, what the latest date for requesting one would be. And third, whether a deferred place is held on the same conditions, or whether the offer is reassessed against the following year’s intake.","I should say that I have not made a decision and may well take up the place this year; I would simply rather know the rules before I have to.","Thank you very much for your help.","Yours sincerely,","Amira Haddad"],"model_html":"\u003cp>Dear Postgraduate Admissions,\u003c/p>\u003cp>I hold a conditional offer for the MSc in Public Health beginning this September (applicant reference PG-61204). I am looking into the possibility of deferring to the following year and wanted to understand the position before deciding anything.\u003c/p>\u003cp>Could you tell me, first, whether deferral is possible on a conditional offer or only once the conditions have been met? Second, what the latest date for requesting one would be. And third, whether a deferred place is held on the same conditions, or whether the offer is reassessed against the following year’s intake.\u003c/p>\u003cp>I should say that I have not made a decision and may well take up the place this year; I would simply rather know the rules before I have to.\u003c/p>\u003cp>Thank you very much for your help.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Amira Haddad\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I have an offer for the MSc Public Health in September but unfortunately because of some family problems I think I will not be able to come this year, so I would like to defer my place to next year. Could you please tell me the procedure for this and send me the necessary forms? I hope this will not be a problem.","Amira"],"degraded_html":"\u003cp>Dear Sir/Madam, I have an offer for the MSc Public Health in September but unfortunately because of some family problems I think I will not be able to come this year, so I would like to defer my place to next year. Could you please tell me the procedure for this and send me the necessary forms? I hope this will not be a problem.\u003c/p>\u003cp>Amira\u003c/p>","degraded_band":3,"model_words":137,"fault_list":{"tag":"F3","faults":["It announces a decision the writer has not made. \"I think I will not be able to come this year\" converts an enquiry into a withdrawal notice, which is exactly the risk the third bullet asked her to avoid.","No specific questions. \"The procedure\" leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.","No applicant reference, \"some family problems\" discloses vaguely where nothing needed disclosing, and \"I hope this will not be a problem\" asks for reassurance rather than information."],"html":["\u003cp>1.  It announces a decision the writer has not made. \"I think I will not be able to come this year\" converts an enquiry into a withdrawal notice, which is exactly the risk the third bullet asked her to avoid.\u003c/p>","\u003cp>2.  No specific questions. \"The procedure\" leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.\u003c/p>","\u003cp>3.  No applicant reference, \"some family problems\" discloses vaguely where nothing needed disclosing, and \"I hope this will not be a problem\" asks for reassurance rather than information.\u003c/p>"]},"scenario":"\u003cp>You hold a conditional offer for a masters course starting in September but may need to defer a year for family reasons. You do not want to signal that you are wavering, and you need to know the rules before deciding.\u003c/p>","bullets":["Identify yourself and your offer.","Ask what you need to know.","Avoid committing yourself either way."],"header":[["To:","pgadmissions@northgate.ac.uk"],["Subject:","Deferral policy — conditional offer, MSc Public Health"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It announces a decision the writer has not made. “I think I will not be able to come this year” converts an enquiry into a withdrawal notice, which is exactly the risk the third bullet asked her to avoid.","correct":true},{"text":"Language: “the governments always make these decisions without thinking” is unsupported and rhetorical; “normal families”, “this economic situation”, “everything is becoming more expensive” are vague; “punish” prejudges the question.","correct":false},{"text":"No applicant reference, “some family problems” discloses vaguely where nothing needed disclosing, and “I hope this will not be a problem” asks for reassurance rather than information.","correct":true},{"text":"No specific questions. “The procedure” leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.","correct":true},{"text":"Mei’s evidence is dismissed as “a small problem” without engaging it — and it was the only empirical claim in the discussion.","correct":false},{"text":"“Everyone should do what they reasonably can according to their circumstances” is unfalsifiable and sets no limit, so it takes no position on where the line falls.","correct":false}],"key_html":"F3"}};</script>
