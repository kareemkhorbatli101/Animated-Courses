<script>window.ITEM={"kind":"exercise","id":"AD 056","slug":"ad-056","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"History · cause ranking","payload":{"Strategy":"rank causes by what removing each would have changed","Grammar":"past counterfactual conditionals","Vocabulary":"proximate, structural, contingency, precipitate","Convention":"ranking causes of a historical outcome"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Mateo’s objection has a particular logical form. What is it?\u003c/p>\u003cp>b.  What would you need to know to rank these three causes rather than just list them?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish a proximate from a structural cause.\u003c/p>\u003cp>b.  What does it mean for an event to precipitate an outcome?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three in one sentence using a removal test.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response ranks Ines’s cause second and still calls it indispensable. How can both hold?\u003c/p>\u003cp>b.  Commerce is dismissed in three clauses. Is that too fast?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had the reformed churches not required households to read scripture themselves, cheap books would have been cheap books\" — identify the structure and say why it is used twice.\u003c/p>\u003cp>b.  \"A cause that is uniformly present cannot explain an outcome that varies\" — why state this as a general principle?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It is a variation argument: the proposed cause was present where the outcome was absent, so it cannot by itself account for the outcome. That does not show print was unimportant, only that it cannot explain the pattern.\u003c/p>\u003cp>b.  You need to know what each cause would have left unchanged if removed, and whether it varied in the same places and at the same times as the outcome. Ranking requires counterfactuals and co-variation, not a judgement about which sounds weightiest.\u003c/p>","P2":"\u003cp>a.  A proximate cause is the immediate trigger; a structural cause is the underlying condition that makes the trigger effective. Print is structural here and the reading obligation proximate.\u003c/p>\u003cp>b.  To bring it about sooner or more sharply than it would otherwise have occurred — which is a weaker claim than causing it, and often the honest one.\u003c/p>","P3":"\u003cp>Model: \"Remove reform and literacy stalls; remove print and it is impossible; remove commerce and it is slower — so reform first, print as the condition, commerce third.\"\u003c/p>","F2":"\u003cp>a.  An inverted past counterfactual — \"Had X not ..., Y would have ...\". It appears twice because the ranking rests entirely on removal tests, and the construction states the test in its own grammar: once to concede print’s necessity, once to establish reform’s explanatory priority.\u003c/p>\u003cp>b.  Because stating the principle makes the move transparent and portable, rather than looking like a convenient objection to Ines. It also does the work in one sentence that an accumulation of regional examples would otherwise require.\u003c/p>","F1":"\u003cp>a.  Because necessity and explanatory power are different things. Print is a condition without which nothing follows, and precisely because it was everywhere it cannot explain why literacy rose in some places and not others. Ranking is about the second question.\u003c/p>\u003cp>b.  It is brief but it gives a reason of the right kind — commerce raised demand in a group whose literacy was already probable, so removing it changes little about household literacy. The brevity is proportionate: a weaker candidate needs a reason, not a paragraph.\u003c/p>","F3":"\u003cp>1.  It refuses the task. The prompt asks which was most important and the response answers that all three were, which is not a position.\u003c/p>\u003cp>2.  \"They all worked together\" and \"history is usually complicated\" are claims about historiography, not about literacy, and they would fit any question of this shape.\u003c/p>\u003cp>3.  Neither Ines nor Mateo is engaged — \"both make good points\" is the only reference to either, and Mateo’s specific objection about print in low-literacy regions is left standing untouched.\u003c/p>"},"model":["Mateo has the better method even if his answer is incomplete, and the reason is that he is testing causes by variation rather than by plausibility.","Ines is describing a necessary condition. Had print not existed, mass literacy would have been impossible at any price, so the press belongs in any account. But necessary conditions are poor explanations of timing and distribution, and that is what the question asks about. Print was available across Europe within fifty years; literacy was not. A cause that is uniformly present cannot explain an outcome that varies.","That is why I would rank religious reform first. It supplied the one thing print could not: an obligation. Had the reformed churches not required households to read scripture themselves, cheap books would have been cheap books, and we can see what that looks like in the regions where print arrived without the obligation. Commerce I would put third, because it created demand among a narrow group — merchants and clerks — whose literacy was already likely, and it tends to follow prosperity rather than produce the broad household literacy the question is about.","So: reform as the cause that explains variation, print as the condition that made the variation possible, commerce as a reinforcing factor that deepened literacy where it had already arrived."],"model_html":"\u003cp>Mateo has the better method even if his answer is incomplete, and the reason is that he is testing causes by variation rather than by plausibility.\u003c/p>\u003cp>Ines is describing a necessary condition. Had print not existed, mass literacy would have been impossible at any price, so the press belongs in any account. But necessary conditions are poor explanations of timing and distribution, and that is what the question asks about. Print was available across Europe within fifty years; literacy was not. A cause that is uniformly present cannot explain an outcome that varies.\u003c/p>\u003cp>That is why I would rank religious reform first. It supplied the one thing print could not: an obligation. Had the reformed churches not required households to read scripture themselves, cheap books would have been cheap books, and we can see what that looks like in the regions where print arrived without the obligation. Commerce I would put third, because it created demand among a narrow group — merchants and clerks — whose literacy was already likely, and it tends to follow prosperity rather than produce the broad household literacy the question is about.\u003c/p>\u003cp>So: reform as the cause that explains variation, print as the condition that made the variation possible, commerce as a reinforcing factor that deepened literacy where it had already arrived.\u003c/p>","model_band":5,"degraded":["In my opinion all three factors were important and it is difficult to say which one was the most important because they all worked together. The printing press made books cheaper, religion made people want to read the Bible, and commerce meant that reading and writing were useful skills for business. I think Ines and Mateo both make good points. History is usually complicated like this and there is rarely one single cause for a big change in society. Probably the combination of all three is the real explanation."],"degraded_html":"\u003cp>In my opinion all three factors were important and it is difficult to say which one was the most important because they all worked together. The printing press made books cheaper, religion made people want to read the Bible, and commerce meant that reading and writing were useful skills for business. I think Ines and Mateo both make good points. History is usually complicated like this and there is rarely one single cause for a big change in society. Probably the combination of all three is the real explanation.\u003c/p>","degraded_band":3,"model_words":215,"fault_list":{"tag":"F3","faults":["It refuses the task. The prompt asks which was most important and the response answers that all three were, which is not a position.","\"They all worked together\" and \"history is usually complicated\" are claims about historiography, not about literacy, and they would fit any question of this shape.","Neither Ines nor Mateo is engaged — \"both make good points\" is the only reference to either, and Mateo’s specific objection about print in low-literacy regions is left standing untouched."],"html":["\u003cp>1.  It refuses the task. The prompt asks which was most important and the response answers that all three were, which is not a position.\u003c/p>","\u003cp>2.  \"They all worked together\" and \"history is usually complicated\" are claims about historiography, not about literacy, and they would fit any question of this shape.\u003c/p>","\u003cp>3.  Neither Ines nor Mateo is engaged — \"both make good points\" is the only reference to either, and Mateo’s specific objection about print in low-literacy regions is left standing untouched.\u003c/p>"]},"prof_name":"Dr Whitfield","professor":"\u003cp>Historians disagree about why literacy spread so rapidly in parts of early modern Europe. Candidate explanations include the printing press, religious reform that required personal reading of scripture, and the growth of commerce, which made record keeping valuable. Which was most important, and why?\u003c/p>","students":[["Ines","The press, clearly. Before it, books were scarce enough that literacy had almost no use outside a clerical career. Cheap print created the reason to learn."],["Mateo","Print existed in regions where literacy stayed low for two centuries. What varied was whether ordinary people were required to read something — and in the Protestant areas they were, by their own church."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“They all worked together” and “history is usually complicated” are claims about historiography, not about literacy, and they would fit any question of this shape.","correct":true},{"text":"It refuses the task. The prompt asks which was most important and the response answers that all three were, which is not a position.","correct":true},{"text":"The reason is flattery, not a reason. “you are a famous teacher and all the students respect you” could be sent to anyone in the department. The actual connection — that the presenters were her students and the projects grew out of her course — is the thing that would make her want to come, and it is missing.","correct":false},{"text":"The decision is taken away. “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.","correct":false},{"text":"Neither Ines nor Mateo is engaged — “both make good points” is the only reference to either, and Mateo’s specific objection about print in low-literacy regions is left standing untouched.","correct":true},{"text":"Consequential language errors. “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped that response was a verb-tense failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are.","correct":false}],"key_html":"F3"}};</script>
