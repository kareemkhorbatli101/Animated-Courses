<script>window.ITEM={"kind":"exercise","id":"AD 006","slug":"ad-006","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environment · agree or disagree with a claim","payload":{"Strategy":"separate a claim about physics from a claim about politics","Grammar":"hedged generalisation","Vocabulary":"baseload, intermittency, grid, dispatchable","Convention":"disagreeing on technical ground without claiming expertise"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Is their disagreement about physics or about dates?\u003c/p>\u003cp>b.  Neither is an engineer. How should that shape your response?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Define baseload, dispatchable and intermittency.\u003c/p>\u003cp>b.  Why is \"the grid\" a more useful subject than \"renewables\"?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Bea the physics and dispute the inference, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response concedes to Bea in the first clause. What does that make possible?\u003c/p>\u003cp>b.  It then disagrees with Kwame. Why is it important to do both?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"dispatchable is not a synonym for nuclear\" — why attack the word rather than the conclusion?\u003c/p>\u003cp>b.  \"which tends to mean the honest answer is about the last ten per cent\" — what is \"tends to\" protecting?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  About dates. Both accept that supply must match demand; they disagree about whether the cost figures that made nuclear necessary are current.\u003c/p>\u003cp>b.  It should argue about the structure of the claim rather than adjudicate the engineering — which is what the model does by separating a physical necessity from an economic one.\u003c/p>","P2":"\u003cp>a.  Baseload is the minimum continuous demand; dispatchable means able to be turned up on command; intermittency is supply that varies with weather rather than with need.\u003c/p>\u003cp>b.  Because the problem is a system property, not a property of any generator. Framing it as \"can renewables do it\" invites a yes or no; framing it as \"what does the grid need at each hour\" invites the actual answer.\u003c/p>","P3":"\u003cp>Model: \"Something must be dispatchable, but dispatchable is not a synonym for nuclear.\"\u003c/p>","F1":"\u003cp>a.  It establishes that the writer is not denying the constraint, so the disagreement that follows cannot be dismissed as wishful. Conceding the physics is what buys the right to dispute the economics.\u003c/p>\u003cp>b.  Because agreeing entirely with one classmate is rarely a contribution, and because Kwame overstates. Qualifying the side you broadly favour is the clearest signal that you are reasoning rather than choosing a team.\u003c/p>","F2":"\u003cp>a.  Because the conclusion follows validly from the premise once the word is read as a synonym. The argument is not wrong in its logic but in a hidden definition, and naming that is both more precise and harder to rebut.\u003c/p>\u003cp>b.  Against the charge of overclaiming. The writer is drawing an inference about where a debate should go, not stating a fact about grids, and the hedge marks the difference honestly.\u003c/p>","F3":"\u003cp>1.  It argues from a position rather than with the classmates. Nuclear waste is not what either of them raised, and Bea’s dispatchability point is never answered.\u003c/p>\u003cp>2.  The evidence is asserted and partly wrong-footed: Germany is offered as a success without noting what replaced the nuclear output, which is the obvious objection.\u003c/p>\u003cp>3.  Language: \"the dangerous nuclear power\", \"the prices of the batteries\", \"another place\" — and the conclusion \"one hundred per cent\" is exactly the unhedged absolute the topic punishes.\u003c/p>"},"model":["The argument is right about the physics and wrong about what follows from it. Bea is correct that something must be dispatchable: demand is inelastic over hours and the wind does drop. But dispatchable is not a synonym for nuclear — storage, interconnection and demand shifting are all dispatchable in the relevant sense, and the question is their cost rather than their existence. Kwame’s point about dates is the sharper one: an argument about what is affordable has to be re-run when the prices move, and these prices have moved by an order of magnitude.","Where I would be more cautious than Kwame is on scale. Storage at grid scale for several consecutive still winter days is a different problem from storage overnight, and the cost curves that have fallen so far are mostly for the second. So I would say the intermittency argument no longer shows that nuclear is unavoidable, but it has not yet been shown to be irrelevant either — which tends to mean the honest answer is about the last ten per cent of the grid rather than about renewables in general."],"model_html":"\u003cp>The argument is right about the physics and wrong about what follows from it. Bea is correct that something must be dispatchable: demand is inelastic over hours and the wind does drop. But dispatchable is not a synonym for nuclear — storage, interconnection and demand shifting are all dispatchable in the relevant sense, and the question is their cost rather than their existence. Kwame’s point about dates is the sharper one: an argument about what is affordable has to be re-run when the prices move, and these prices have moved by an order of magnitude.\u003c/p>\u003cp>Where I would be more cautious than Kwame is on scale. Storage at grid scale for several consecutive still winter days is a different problem from storage overnight, and the cost curves that have fallen so far are mostly for the second. So I would say the intermittency argument no longer shows that nuclear is unavoidable, but it has not yet been shown to be irrelevant either — which tends to mean the honest answer is about the last ten per cent of the grid rather than about renewables in general.\u003c/p>","model_band":5,"degraded":["I agree with Kwame because I believe that renewable energy is the future and we must stop using the dangerous nuclear power which creates waste for thousands of years. Many countries like Germany are closing their nuclear plants and investing in wind and solar, and the prices of the batteries are falling every year. Bea is worried about the wind not blowing but we can build more interconnections between the countries so when there is no wind in one place there is wind in another place. So I think with enough investment we can have a grid with one hundred per cent renewable energy."],"degraded_html":"\u003cp>I agree with Kwame because I believe that renewable energy is the future and we must stop using the dangerous nuclear power which creates waste for thousands of years. Many countries like Germany are closing their nuclear plants and investing in wind and solar, and the prices of the batteries are falling every year. Bea is worried about the wind not blowing but we can build more interconnections between the countries so when there is no wind in one place there is wind in another place. So I think with enough investment we can have a grid with one hundred per cent renewable energy.\u003c/p>","degraded_band":3,"model_words":185,"fault_list":{"tag":"F3","faults":["It argues from a position rather than with the classmates. Nuclear waste is not what either of them raised, and Bea’s dispatchability point is never answered.","The evidence is asserted and partly wrong-footed: Germany is offered as a success without noting what replaced the nuclear output, which is the obvious objection.","Language: \"the dangerous nuclear power\", \"the prices of the batteries\", \"another place\" — and the conclusion \"one hundred per cent\" is exactly the unhedged absolute the topic punishes."],"html":["\u003cp>1.  It argues from a position rather than with the classmates. Nuclear waste is not what either of them raised, and Bea’s dispatchability point is never answered.\u003c/p>","\u003cp>2.  The evidence is asserted and partly wrong-footed: Germany is offered as a success without noting what replaced the nuclear output, which is the obvious objection.\u003c/p>","\u003cp>3.  Language: \"the dangerous nuclear power\", \"the prices of the batteries\", \"another place\" — and the conclusion \"one hundred per cent\" is exactly the unhedged absolute the topic punishes.\u003c/p>"]},"prof_name":"Professor Haugen","professor":"\u003cp>It is sometimes argued that renewable energy cannot supply a modern grid because wind and solar are intermittent, and that nuclear is therefore unavoidable. How convincing do you find that argument?\u003c/p>","students":[["Bea","Fairly convincing. Demand does not fall when the wind drops. Something has to be dispatchable, and at the scale a national grid needs, that is nuclear or gas."],["Kwame","Not very. The intermittency argument was made when storage was expensive and interconnection was thin, and both have changed faster than the argument has. It is a claim about 2010 being repeated in 2026."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: “the dangerous nuclear power”, “the prices of the batteries”, “another place” — and the conclusion “one hundred per cent” is exactly the unhedged absolute the topic punishes.","correct":true},{"text":"Language and register. “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).","correct":false},{"text":"The evidence is asserted and partly wrong-footed: Germany is offered as a success without noting what replaced the nuclear output, which is the obvious objection.","correct":true},{"text":"The repair is handed back: “Let me know ... if there is anything I can do to help” makes the injured party design the remedy. The third bullet fails.","correct":false},{"text":"It argues from a position rather than with the classmates. Nuclear waste is not what either of them raised, and Bea’s dispatchability point is never answered.","correct":true},{"text":"No reference, and the wrong ask. The reference number never appears, so the office cannot locate the case quickly; and “process my refund immediately” asks for the one thing this reader may be unable to do. “I expect your answer today” sets a deadline for somebody who owes you no deadline.","correct":false}],"key_html":"F3"}};</script>
