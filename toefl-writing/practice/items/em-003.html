<script>window.ITEM={"kind":"exercise","id":"EM 003","slug":"em-003","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"name the obstacle, not the person who put it there","Grammar":"modal distancing: could, would, might","Vocabulary":"access and permissions: swipe, authorise, clearance, out of hours","Convention":"asking for something that may be against the rules"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The third bullet is unusual — it asks you to argue against yourself. Why would a task require that?\u003c/p>\u003cp>b.  What is the difference between asking for access and asking for the rule to be changed?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which of these would an institution use about a door?\u003c/p>\u003cpre class=\"mono\">open · authorise · enable · unlock · activate\u003c/pre>\u003cp>b.  Complete: access is ______ ; a card is ______ ; a room is ______ .\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, concede that the restriction may be there for a good reason while still asking for an exception. Under 30 words.\u003c/p>"},{"tag":"P4","title":"Commit to a plan","html":"\u003cp>Seven minutes. Decide where the concession goes: first, middle or last.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The request sits in paragraph three, after two paragraphs of context. Count the words before the ask. Is that too many for a seven-minute email?\u003c/p>\u003cp>b.  Find the sentence that pre-empts the most likely refusal.\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “Could our cards be authorised …” — why the passive, when you know exactly who would do the authorising?\u003c/p>\u003cp>b.  “if it is a question of the building being unstaffed”. Identify the structure after \u003cem>of\u003c/em> and explain why it is not \u003cem>the building is unstaffed\u003c/em>.\u003c/p>\u003cp>c.  Why \u003cem>we would be happy to\u003c/em> and not \u003cem>we are happy to\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>I appreciate there may be …\u003c/em> — what does \u003cem>appreciate\u003c/em> mean here, and why is it better than \u003cem>I know\u003c/em>?\u003c/p>\u003cp>b.  Why \u003cem>cut-off\u003c/em> rather than \u003cem>rule\u003c/em> or \u003cem>restriction\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>You need access to a laboratory at weekends. In 50 words, make the request and concede one possible reason for the restriction, offering a way round it.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because conceding the other side’s reason is what separates a request from a complaint. It also forces you to think about why the rule exists, which is the only way to find the offer that gets you past it.\u003c/p>\u003cp>b.  An exception is cheap: one decision, four cards, reversible. A rule change is expensive and above the reader’s authority. Ask for the cheap thing.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>authorise\u003c/strong>, \u003cstrong>enable\u003c/strong> and \u003cstrong>activate\u003c/strong> are the institutional words — they describe permissions rather than physical doors. \u003cem>Open\u003c/em> and \u003cem>unlock\u003c/em> describe the door, which is not what you are asking about.\u003c/p>\u003cp>b.  access is \u003cstrong>granted\u003c/strong> ; a card is \u003cstrong>activated\u003c/strong> (or authorised) ; a room is \u003cstrong>allocated\u003c/strong> (or booked).\u003c/p>","P3":"\u003cp>Model: \u003cem>I appreciate there may be good reasons for the six o’clock cut-off, but if it is a staffing question we would gladly sign in at the lodge instead.\u003c/em>\u003c/p>\u003cp>The concession is doing real work: by naming the likely reason you show you have thought about the reader’s problem, and you get to answer it before they raise it.\u003c/p>","P4":"\u003cp>After the request, in the same breath. Put it first and you have argued yourself out of the email before you have asked for anything.\u003c/p>","F1":"\u003cp>a.  About seventy. That is acceptable here because each paragraph removes an objection — who you are, why the room, why not elsewhere. Context that pre-empts a question earns its place; context that merely narrates does not.\u003c/p>\u003cp>b.  “if it is a question of the building being unstaffed, we would be happy to sign in and out at the lodge”. The writer has guessed the reason for the rule and answered it, unprompted.\u003c/p>","F2":"\u003cp>a.  Because naming the agent turns a request into an instruction addressed at a particular person (\u003cem>could you authorise our cards\u003c/em>). The passive asks for a state of affairs and lets the office decide who brings it about — which is also an accurate description of how institutions work.\u003c/p>\u003cp>b.  A gerund with its own subject: \u003cem>the building being unstaffed\u003c/em>. A preposition cannot take a finite clause, so \u003cem>of the building is unstaffed\u003c/em> is impossible. This is family 6, structure 49, doing real work.\u003c/p>\u003cp>c.  \u003cem>Would\u003c/em> keeps the offer hypothetical and therefore conditional on them saying yes. \u003cem>We are happy to sign in\u003c/em> sounds as though you have already started doing it.\u003c/p>","F3":"\u003cp>a.  “I recognise and accept” — not “I enjoy”. It concedes the point with grace, whereas \u003cem>I know there may be reasons\u003c/em> sounds like a prelude to dismissing them.\u003c/p>\u003cp>b.  \u003cem>Cut-off\u003c/em> describes the thing neutrally, as a time. \u003cem>Rule\u003c/em> and \u003cem>restriction\u003c/em> frame it as an exercise of authority over you, which invites the reader to defend it.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It argues instead of asking.\u003c/strong> “I don’t understand why the building must close so early, the library is open until midnight” challenges the reader’s policy. The third bullet asked for the opposite — an acknowledgement that the restriction may be reasonable — so this is an unaddressed requirement as well as a tonal failure.\u003c/p>\u003cp>2.  \u003cstrong>No offer, and an instruction instead of a request.\u003c/strong> “Please open our cards”, with nothing conceded and nothing offered. “Thank you in advance for your quick response” then sets the reader a deadline.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “the room 4.12” (Room 4.12), “busy in the day” (during the day), “full of noisy people” (a judgement, not a reason), and a comma splice at “early, the library”.\u003c/p>","F5":"\u003cp>Model: \u003cem>Would it be possible to have weekend access to Lab 2 for the next six weeks? I appreciate the restriction may be there because no technician is on duty; if so, I am happy to work only on the bench equipment and to log each visit with the department office.\u003c/em>\u003c/p>\u003cp>Note the shape: request, concession, and then a specific offer that answers the concession. All three in fifty words.\u003c/p>"},"model":["Dear Facilities Team,","I am writing on behalf of a four-person project group in the Geography department. We have been allocated Room 4.12 for our group work, but our cards stop opening it at six, and the only times all four of us are free are weekday evenings.","We have tried working in the ground-floor common room instead, but it is shared with the society meetings on three evenings a week and is not usable for discussion.","Could our cards be authorised for 4.12 until ten on weekdays? I appreciate there may be good reasons for the current cut-off — if it is a question of the building being unstaffed, we would be happy to sign in and out at the lodge, or to keep to a fixed set of evenings.","Thank you for considering it.","Best wishes,","Priya Raman — MSc Geography"],"model_html":"\u003cp>Dear Facilities Team,\u003c/p>\u003cp>I am writing on behalf of a four-person project group in the Geography department. We have been allocated Room 4.12 for our group work, but our cards stop opening it at six, and the only times all four of us are free are weekday evenings.\u003c/p>\u003cp>We have tried working in the ground-floor common room instead, but it is shared with the society meetings on three evenings a week and is not usable for discussion.\u003c/p>\u003cp>Could our cards be authorised for 4.12 until ten on weekdays? I appreciate there may be good reasons for the current cut-off — if it is a question of the building being unstaffed, we would be happy to sign in and out at the lodge, or to keep to a fixed set of evenings.\u003c/p>\u003cp>Thank you for considering it.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Priya Raman — MSc Geography\u003c/p>","model_band":5,"degraded":["Hello,","Our group was given the room 4.12 but we can’t enter after 6 o’clock which is a big problem for us because we are all busy in the day. The common room downstairs is always full of noisy people so we can’t work there. Please open our cards for this room in the evening. I don’t understand why the building must close so early, the library is open until midnight.","Thank you in advance for your quick response."],"degraded_html":"\u003cp>Hello,\u003c/p>\u003cp>Our group was given the room 4.12 but we can’t enter after 6 o’clock which is a big problem for us because we are all busy in the day. The common room downstairs is always full of noisy people so we can’t work there. Please open our cards for this room in the evening. I don’t understand why the building must close so early, the library is open until midnight.\u003c/p>\u003cp>Thank you in advance for your quick response.\u003c/p>","degraded_band":3,"model_words":146,"fault_list":{"tag":"F4","faults":["It argues instead of asking. “I don’t understand why the building must close so early, the library is open until midnight” challenges the reader’s policy. The third bullet asked for the opposite — an acknowledgement that the restriction may be reasonable — so this is an unaddressed requirement as well as a tonal failure.","No offer, and an instruction instead of a request. “Please open our cards”, with nothing conceded and nothing offered. “Thank you in advance for your quick response” then sets the reader a deadline.","Language and register. “the room 4.12” (Room 4.12), “busy in the day” (during the day), “full of noisy people” (a judgement, not a reason), and a comma splice at “early, the library”."],"html":["\u003cp>1.  \u003cstrong>It argues instead of asking.\u003c/strong> “I don’t understand why the building must close so early, the library is open until midnight” challenges the reader’s policy. The third bullet asked for the opposite — an acknowledgement that the restriction may be reasonable — so this is an unaddressed requirement as well as a tonal failure.\u003c/p>","\u003cp>2.  \u003cstrong>No offer, and an instruction instead of a request.\u003c/strong> “Please open our cards”, with nothing conceded and nothing offered. “Thank you in advance for your quick response” then sets the reader a deadline.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “the room 4.12” (Room 4.12), “busy in the day” (during the day), “full of noisy people” (a judgement, not a reason), and a comma splice at “early, the library”.\u003c/p>"]},"scenario":"\u003cp>Your project group needs the small study room on the fourth floor in the evenings. Your student cards do not open it after six, and the departmental office has told you informally that postgraduates can be given out-of-hours access on request.\u003c/p>","bullets":["Say what access you need and when.","Explain why the existing arrangements do not work.","Acknowledge that there may be a reason for the restriction."],"header":[["To:","facilities@northgate.ac.uk"],["Subject:","Out-of-hours access, Room 4.12"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language and register. “the room 4.12” (Room 4.12), “busy in the day” (during the day), “full of noisy people” (a judgement, not a reason), and a comma splice at “early, the library”.","correct":true},{"text":"It argues instead of asking. “I don’t understand why the building must close so early, the library is open until midnight” challenges the reader’s policy. The third bullet asked for the opposite — an acknowledgement that the restriction may be reasonable — so this is an unaddressed requirement as well as a tonal failure.","correct":true},{"text":"Language: “the governments always make these decisions without thinking” is unsupported and rhetorical; “normal families”, “this economic situation”, “everything is becoming more expensive” are vague; “punish” prejudges the question.","correct":false},{"text":"No offer, and an instruction instead of a request. “Please open our cards”, with nothing conceded and nothing offered. “Thank you in advance for your quick response” then sets the reader a deadline.","correct":true},{"text":"“Books are usually better than films anyway” is irrelevant to the question of how an adaptation should be judged, and “disrespectful to change it” assumes the conclusion.","correct":false},{"text":"Language. “the algorithms are promoting” (promote), “people are always interested” (are always interested is acceptable but “are working together” for a general truth is not), “control better their platforms” (control their platforms better — adverb placement), and a run-on opening sentence.","correct":false}],"key_html":"F4"}};</script>
