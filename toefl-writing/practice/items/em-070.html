<script>window.ITEM={"kind":"exercise","id":"EM 070","slug":"em-070","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Introduction and networking","payload":{"Strategy":"introduce yourself by what you can do, not what you want","Grammar":"relative clauses with which","Vocabulary":"placement, remit, scoping, deliverable","Convention":"writing a cold email to a practitioner"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is \"I would love to pick your brain\" a bad opening?\u003c/p>\u003cp>b.  What makes a cold email easy to answer?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a deliverable, and what is scoping?\u003c/p>\u003cp>b.  What does remit mean, and why might she cite hers?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Write the one question, in one sentence, that the whole email exists to ask.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email contains exactly one question. Why not three?\u003c/p>\u003cp>b.  \"no reply is needed at all and I will not follow up\" — why give away the follow-up?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"which is the point my own work has run into\" — what does the relative clause achieve?\u003c/p>\u003cp>b.  \"the dataset is public and the code will be on GitHub\" — why mention this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because it asks for an unbounded amount of her time without saying what for, so the only safe answer is no. It also makes her responsible for working out what you need.\u003c/p>\u003cp>b.  A single factual question she can answer from memory, a reason she is the right person, and an explicit release from replying. The lower the cost of answering, the more likely the answer.\u003c/p>","P2":"\u003cp>a.  A deliverable is a defined output; scoping is fixing the boundaries of a piece of work before starting it.\u003c/p>\u003cp>b.  Remit is the scope of what someone is authorised to deal with. She may decline on the grounds that pricing method is outside hers, which is a real constraint rather than a brush-off.\u003c/p>","P3":"\u003cp>Model: \"Is the elevation proxy applied at property level or aggregated to postcode before pricing?\"\u003c/p>","F1":"\u003cp>a.  Because one question can be answered in a line between meetings, and three require her to sit down. A cold email competes against everything else in her inbox on cost alone.\u003c/p>\u003cp>b.  It converts the email from an obligation into an offer. A stranger who promises not to chase can be ignored without guilt, which paradoxically makes a reply more likely rather than less.\u003c/p>","F2":"\u003cp>a.  It ties her published claim to the writer’s actual problem, which shows the article was read rather than found. The clause does in eleven words what a paragraph of praise would fail to do.\u003c/p>\u003cp>b.  It signals that nothing she says will end up behind a paywall or be attributed to her firm, and that the writer works in the open. For someone in a commercially sensitive role, that lowers the risk of replying.\u003c/p>","F3":"\u003cp>1.  \"Pick your brain\" and \"a short call\" ask for unbounded time with no question specified, so the second bullet fails.\u003c/p>\u003cp>2.  \"Extremely insightful\" is praise with no content — it does not show the article was read, and no specific claim from it is mentioned.\u003c/p>\u003cp>3.  \"Any advice you could give me\" leaves her to invent the topic, and there is no release from replying, so ignoring it carries a small cost. The third bullet fails.\u003c/p>"},"model":["Dear Dr Braathen,","I am a final-year geography student at Northgate writing a dissertation on how flood risk is priced where catchment mapping is incomplete. Your March piece in the Journal of Risk argued that insurers substitute elevation proxies in those cases, which is the point my own work has run into.","My question is narrow: is the elevation proxy applied at property level or aggregated to postcode before pricing? I have found both described in the literature and nothing that says which is standard. A one-line answer would settle it.","If that is commercially sensitive or simply not something you can answer, no reply is needed at all and I will not follow up — I know an unsolicited email from a student is not on your list.","If it is useful, I am happy to send the finished chapter in May; the dataset is public and the code will be on GitHub.","Thank you for the article in any case.","Yours sincerely,","Jo Whitfield — Northgate University"],"model_html":"\u003cp>Dear Dr Braathen,\u003c/p>\u003cp>I am a final-year geography student at Northgate writing a dissertation on how flood risk is priced where catchment mapping is incomplete. Your March piece in the Journal of Risk argued that insurers substitute elevation proxies in those cases, which is the point my own work has run into.\u003c/p>\u003cp>My question is narrow: is the elevation proxy applied at property level or aggregated to postcode before pricing? I have found both described in the literature and nothing that says which is standard. A one-line answer would settle it.\u003c/p>\u003cp>If that is commercially sensitive or simply not something you can answer, no reply is needed at all and I will not follow up — I know an unsolicited email from a student is not on your list.\u003c/p>\u003cp>If it is useful, I am happy to send the finished chapter in May; the dataset is public and the code will be on GitHub.\u003c/p>\u003cp>Thank you for the article in any case.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Jo Whitfield — Northgate University\u003c/p>","model_band":5,"degraded":["Dear Dr Braathen, I hope you do not mind me contacting you out of the blue. I am a geography student at Northgate University and I am very interested in your work on flood insurance, which I found extremely insightful. I am currently writing my dissertation on this topic and I would love to pick your brain about it if you have time. Would it be possible to arrange a short call in the next few weeks? Any advice you could give me would be hugely appreciated.","Jo"],"degraded_html":"\u003cp>Dear Dr Braathen, I hope you do not mind me contacting you out of the blue. I am a geography student at Northgate University and I am very interested in your work on flood insurance, which I found extremely insightful. I am currently writing my dissertation on this topic and I would love to pick your brain about it if you have time. Would it be possible to arrange a short call in the next few weeks? Any advice you could give me would be hugely appreciated.\u003c/p>\u003cp>Jo\u003c/p>","degraded_band":3,"model_words":169,"fault_list":{"tag":"F3","faults":["\"Pick your brain\" and \"a short call\" ask for unbounded time with no question specified, so the second bullet fails.","\"Extremely insightful\" is praise with no content — it does not show the article was read, and no specific claim from it is mentioned.","\"Any advice you could give me\" leaves her to invent the topic, and there is no release from replying, so ignoring it carries a small cost. The third bullet fails."],"html":["\u003cp>1.  \"Pick your brain\" and \"a short call\" ask for unbounded time with no question specified, so the second bullet fails.\u003c/p>","\u003cp>2.  \"Extremely insightful\" is praise with no content — it does not show the article was read, and no specific claim from it is mentioned.\u003c/p>","\u003cp>3.  \"Any advice you could give me\" leaves her to invent the topic, and there is no release from replying, so ignoring it carries a small cost. The third bullet fails.\u003c/p>"]},"scenario":"\u003cp>You want to do your dissertation on flood insurance. You find the name of an analyst at a reinsurance firm who published a short article on the topic. You have never met her.\u003c/p>","bullets":["Introduce yourself briefly.","Ask for something small.","Make it easy to ignore."],"header":[["To:","h.braathen@nordsure.no"],["Subject:","Flood pricing in unmapped catchments — one question"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Any advice you could give me” leaves her to invent the topic, and there is no release from replying, so ignoring it carries a small cost. The third bullet fails.","correct":true},{"text":"“Extremely insightful” is praise with no content — it does not show the article was read, and no specific claim from it is mentioned.","correct":true},{"text":"“Pick your brain” and “a short call” ask for unbounded time with no question specified, so the second bullet fails.","correct":true},{"text":"Language: “the governments always make these decisions without thinking” is unsupported and rhetorical; “normal families”, “this economic situation”, “everything is becoming more expensive” are vague; “punish” prejudges the question.","correct":false},{"text":"It is not a contribution. It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":false},{"text":"Petros’s argument is acknowledged and then waved away with “better to do something than nothing”, which is the reasoning his objection was specifically about.","correct":false}],"key_html":"F3"}};</script>
