<script>window.ITEM={"kind":"exercise","id":"AD 031","slug":"ad-031","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Media and communication · cause ranking","payload":{"Strategy":"rank causes by what changes if you remove each one","Grammar":"the comparative of importance; cleft for emphasis","Vocabulary":"amplify, incentive, attention economy, moderation","Convention":"ranking without dismissing the causes you rank lower"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both agree the algorithm promotes outrage. What exactly do they disagree about?\u003c/p>\u003cp>b.  The professor asks for the main driver. What test would let you rank causes rather than just list them?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to \u003cem>amplify\u003c/em> something, and how is it different from \u003cem>causing\u003c/em> it?\u003c/p>\u003cp>b.  In the phrase \u003c/p>\u003cp>attention economy\u003c/p>\u003cp>, what is being bought and sold?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, rank the three causes using the test you chose in P1b. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “all three causes are connected and it is impossible to say which is most important” a band-3 answer?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reorders the question’s own list. What justifies adding nothing new but reranking?\u003c/p>\u003cp>b.  Find the phrase that protects Jakob’s cause while ranking it last. Why does that matter?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “What changed is the distribution system.” Name the device and say why it is the right shape for this sentence.\u003c/p>\u003cp>b.  “a firm that optimised for accuracy instead \u003cem>would lose\u003c/em> to one that did not”. Why the unreal conditional for a claim the writer believes is true?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>downstream of\u003c/em> — what relation does it assert, and why is it more precise than \u003cem>caused by\u003c/em>?\u003c/p>\u003cp>b.  \u003cem>the lever you can actually pull\u003c/em> — what does this metaphor smuggle into the argument?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: what most explains falling attendance at live music — ticket prices, streaming, or changed social habits? In 50 words, rank them using a counterfactual test.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Whether the algorithm is the \u003cem>cause\u003c/em> or the \u003cem>amplifier\u003c/em>. Nour treats it as the thing generating the outcome; Jakob treats it as a mirror that finds what people already want.\u003c/p>\u003cp>b.  The counterfactual: remove each cause in turn and see what survives. A cause whose removal changes nothing is not doing the work, however necessary it is. This also separates \u003cem>necessary\u003c/em> from \u003cem>explanatory\u003c/em>, which is the distinction the whole question turns on.\u003c/p>","P2":"\u003cp>a.  To amplify is to increase the reach of something that already exists. A cause brings it into being. The word choice is the entire disagreement between Nour and Jakob, compressed into one verb.\u003c/p>\u003cp>b.  The user’s attention is the product; advertisers are the buyers; the platform is the seller. Naming this makes clear that the firm’s revenue rises with engagement regardless of what is engaging — which is the structural fact the model builds on.\u003c/p>","P3":"\u003cp>Model: \u003cem>Psychology is necessary but constant, so it cannot explain a change; what changed is the distribution system, and behind that, the model that pays for it.\u003c/em>\u003c/p>\u003cp>The move is to distinguish a necessary condition from an explanatory one. A constant can never explain a variable.\u003c/p>","P4":"\u003cp>Because the question asked for a ranking and this declines to produce one. “Everything is connected” is true of every causal question and therefore informative about none. It also abandons the one thing the task rewards: a position, supported.\u003c/p>","F1":"\u003cp>a.  The reranking \u003cem>is\u003c/em> the new thing. Neither classmate mentioned the business model as a separate cause from the algorithm, and separating them is what lets the writer explain why a decade of moderation has failed. A contribution need not be a new fact; a better-organised set of the existing facts counts, provided it explains something the original ordering could not.\u003c/p>\u003cp>b.  “not least important, but least changeable”. It matters because Jakob’s cause is genuinely fundamental, and a ranking that appeared to dismiss it would be both wrong and needlessly combative. The phrase keeps his point intact while explaining why it does not decide the policy.\u003c/p>","F2":"\u003cp>a.  A wh-cleft (family 8, structure 60). It is right here because the sentence is answering an implicit question — \u003cem>what changed?\u003c/em> — and the cleft puts the answer in the stressed final position, immediately after a sentence about what did \u003cem>not\u003c/em> change.\u003c/p>\u003cp>b.  Because no such firm exists to point at, so the claim is about a world we can reason about but not observe. The unreal form is honest about that, and paradoxically makes the argument harder to attack: it claims a mechanism rather than a fact.\u003c/p>","F3":"\u003cp>a.  That the algorithm is a consequence of the business model and constrained by it, in a one-way flow. \u003cem>Caused by\u003c/em> would be cruder — it suggests a single event producing another, where the real relation is an ongoing constraint. The metaphor also implies you cannot fix the lower thing without changing the higher one, which is the policy conclusion.\u003c/p>\u003cp>b.  That the purpose of ranking causes is to act on them. That is an assumption, not a given — one could rank causes to understand rather than to intervene. The metaphor makes the writer’s criterion feel like common sense, which is exactly what a good metaphor does in an argument. Worth noticing when it is done to you.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It refuses the task.\u003c/strong> The question asked which cause is the main driver; the answer is that it is impossible to say. Declining to rank is a position, but it needs to be argued for — here it is simply asserted and then abandoned.\u003c/p>\u003cp>2.  \u003cstrong>Nothing is added, and the close is generic.\u003c/strong> Both classmates are restated. The final recommendation — platforms should do better and people should be educated — appears in every discussion of this topic ever written and follows from nothing in the response.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the algorithms are promoting” (promote), “people are always interested” (are always interested is acceptable but “are working together” for a general truth is not), “control better their platforms” (control their platforms better — adverb placement), and a run-on opening sentence.\u003c/p>","F5":"\u003cp>Model: \u003cem>Remove streaming and people still stay in; remove cheap tickets and attendance falls but does not collapse; remove the social habit of going out together and nothing else matters. I would rank habit first, price second and streaming third — streaming is a symptom of the first, not a rival to it.\u003c/em>\u003c/p>"},"model":["The useful test is counterfactual: remove each cause and ask what remains. Remove human psychology and nothing spreads, so Jakob is right that it is necessary. But it is also constant — it was the same in 1600 — and a constant cannot explain a change. What changed is the distribution system, so Nour has the better claim to the main driver.","Where I would part company with Nour is the word overnight. The optimisation target is not a free engineering choice; it is downstream of a business model that sells attention, and a firm that optimised for accuracy instead would lose to one that did not. That is why the problem has survived a decade of moderation teams. Ranked properly, I would put the business model first, the algorithm second as its instrument, and psychology third — not least important, but least changeable, and in policy what matters is the lever you can actually pull."],"model_html":"\u003cp>The useful test is counterfactual: remove each cause and ask what remains. Remove human psychology and nothing spreads, so Jakob is right that it is necessary. But it is also constant — it was the same in 1600 — and a constant cannot explain a change. What changed is the distribution system, so Nour has the better claim to the main driver.\u003c/p>\u003cp>Where I would part company with Nour is the word overnight. The optimisation target is not a free engineering choice; it is downstream of a business model that sells attention, and a firm that optimised for accuracy instead would lose to one that did not. That is why the problem has survived a decade of moderation teams. Ranked properly, I would put the business model first, the algorithm second as its instrument, and psychology third — not least important, but least changeable, and in policy what matters is the lever you can actually pull.\u003c/p>","model_band":5,"degraded":["This is a very interesting question and I think all three causes are connected to each other so it is impossible to say which one is the most important. Nour is right that the algorithms are promoting the bad content because the companies want more clicks and more money. But Jakob is also right because people are always interested in shocking news and they like to share it with their friends to get attention. So in my opinion the algorithm and the psychology are working together and we cannot separate them. The solution is that the companies should control better their platforms and the people should be more educated about how to check the information before sharing it."],"degraded_html":"\u003cp>This is a very interesting question and I think all three causes are connected to each other so it is impossible to say which one is the most important. Nour is right that the algorithms are promoting the bad content because the companies want more clicks and more money. But Jakob is also right because people are always interested in shocking news and they like to share it with their friends to get attention. So in my opinion the algorithm and the psychology are working together and we cannot separate them. The solution is that the companies should control better their platforms and the people should be more educated about how to check the information before sharing it.\u003c/p>","degraded_band":3,"model_words":153,"fault_list":{"tag":"F4","faults":["It refuses the task. The question asked which cause is the main driver; the answer is that it is impossible to say. Declining to rank is a position, but it needs to be argued for — here it is simply asserted and then abandoned.","Nothing is added, and the close is generic. Both classmates are restated. The final recommendation — platforms should do better and people should be educated — appears in every discussion of this topic ever written and follows from nothing in the response.","Language. “the algorithms are promoting” (promote), “people are always interested” (are always interested is acceptable but “are working together” for a general truth is not), “control better their platforms” (control their platforms better — adverb placement), and a run-on opening sentence."],"html":["\u003cp>1.  \u003cstrong>It refuses the task.\u003c/strong> The question asked which cause is the main driver; the answer is that it is impossible to say. Declining to rank is a position, but it needs to be argued for — here it is simply asserted and then abandoned.\u003c/p>","\u003cp>2.  \u003cstrong>Nothing is added, and the close is generic.\u003c/strong> Both classmates are restated. The final recommendation — platforms should do better and people should be educated — appears in every discussion of this topic ever written and follows from nothing in the response.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the algorithms are promoting” (promote), “people are always interested” (are always interested is acceptable but “are working together” for a general truth is not), “control better their platforms” (control their platforms better — adverb placement), and a run-on opening sentence.\u003c/p>"]},"prof_name":"Dr Oyelowo","professor":"\u003cp>False stories spread faster online than accurate ones. Explanations offered include the design of recommendation systems, the business model that rewards attention, and ordinary human psychology. Which of these do you think is the main driver, and why?\u003c/p>","students":[["Nour","The algorithms. A recommendation system optimised for engagement will find that outrage engages, and promote it. Change the optimisation target and the problem shrinks overnight — it is an engineering decision, not a fact about people."],["Jakob","I would say psychology. People shared rumours long before there were feeds, and they share them now because novelty and indignation are rewarding. The algorithm only finds what is already there."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"No specific questions. “The procedure” leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.","correct":false},{"text":"It refuses the task. The question asked which cause is the main driver; the answer is that it is impossible to say. Declining to rank is a position, but it needs to be argued for — here it is simply asserted and then abandoned.","correct":true},{"text":"“Deal with my request immediately” asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. “Completely unacceptable for a university of this size” is editorial.","correct":false},{"text":"No condition is given under which it would be a bad choice, so the third bullet fails; “you are better at this kind of thing than I am” is flattery substituting for information; and there are two comma splices.","correct":false},{"text":"Language. “the algorithms are promoting” (promote), “people are always interested” (are always interested is acceptable but “are working together” for a general truth is not), “control better their platforms” (control their platforms better — adverb placement), and a run-on opening sentence.","correct":true},{"text":"Nothing is added, and the close is generic. Both classmates are restated. The final recommendation — platforms should do better and people should be educated — appears in every discussion of this topic ever written and follows from nothing in the response.","correct":true}],"key_html":"F4"}};</script>
