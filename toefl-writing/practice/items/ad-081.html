<script>window.ITEM={"kind":"exercise","id":"AD 081","slug":"ad-081","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Public policy · agree / disagree","payload":{"Strategy":"distinguish a target from an instrument","Grammar":"passive with by means of","Vocabulary":"incentive, mandate, elasticity, regressive","Convention":"arguing about how a goal should be pursued"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Owen does not dispute that charging works. What is his objection?\u003c/p>\u003cp>b.  Why does investment alone fail to reduce traffic?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does regressive mean, and what is elasticity of demand?\u003c/p>\u003cp>b.  Distinguish a target from an instrument.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that keeps both effects.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the two speakers answer different questions. What are they?\u003c/p>\u003cp>b.  Why insist on a published formula rather than a commitment?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"is progressive overall even though the charge itself is regressive\" — why is the distinction between the charge and the scheme important?\u003c/p>\u003cp>b.  \"which is a reason to bind it in the scheme rather than a reason not to charge\" — what move is this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the burden falls on those with the fewest alternatives, so the instrument achieves the target at the expense of the least able to adapt.\u003c/p>\u003cp>b.  Because freed road space is immediately taken up by journeys that were previously deterred by congestion. Without a price, capacity gains convert into more driving rather than less.\u003c/p>","P2":"\u003cp>a.  Regressive means taking a larger share of income from poorer payers; elasticity of demand is how much consumption responds to price.\u003c/p>\u003cp>b.  A target is the outcome sought; an instrument is the tool used to reach it. Owen’s objection is to the instrument’s incidence, not to the target.\u003c/p>","P3":"\u003cp>Model: \"Charge, and return the revenue as services for the people with the fewest alternatives.\"\u003c/p>","F1":"\u003cp>a.  Which instrument reduces traffic, and how its costs are distributed. Elif answers the first and Owen the second, so neither refutes the other and a complete answer needs both.\u003c/p>\u003cp>b.  Because Owen’s objection is empirically well founded — revenue promises are routinely broken. A formula written into the scheme is the only form of the commitment that survives a change of administration.\u003c/p>","F2":"\u003cp>a.  Because it separates the incidence of one payment from the incidence of the whole policy. A regressive charge inside a progressive scheme is a familiar and defensible design, and the distinction is what lets the response accept Owen’s facts without his conclusion.\u003c/p>\u003cp>b.  It converts an objection into a design requirement. The risk is granted and relocated to the part of the proposal that can be fixed, which leaves nothing attached to the instrument itself.\u003c/p>","F3":"\u003cp>1.  \"It does not even solve the problem\" contradicts Elif’s evidence by assertion, and the claim that rich drivers simply pay is inconsistent with traffic falling within a year.\u003c/p>\u003cp>2.  \"Then people will choose to leave their cars at home voluntarily\" ignores the induced-demand mechanism, which is the reason investment alone failed in the cities cited.\u003c/p>\u003cp>3.  Nothing is said about revenue use, so the one available answer to the fairness objection is never considered; there is also a comma splice in the second sentence.\u003c/p>"},"model":["Elif is right about what works and Owen is right about who pays, and these are answers to different questions — one about the instrument, one about its distribution.","The evidence on charging is not really contestable. Road space behaves like any other free good: expand supply and it fills, which is why investment alone leaves congestion flat. If the target is fewer cars, pricing is the only instrument that has reliably hit it.","Owen’s objection is therefore not an argument for investment instead. It is an argument about what is done with the revenue. A charge whose proceeds are returned as a flat rebate, or spent on the services used by the people least able to avoid the charge, is progressive overall even though the charge itself is regressive. The harm he describes is caused by the design rather than by the instrument.","So: charge, and hypothecate the revenue to night buses and outer-suburb services by means of a published formula rather than at a city’s discretion. Owen is right that this is usually promised and rarely delivered, which is a reason to bind it in the scheme rather than a reason not to charge."],"model_html":"\u003cp>Elif is right about what works and Owen is right about who pays, and these are answers to different questions — one about the instrument, one about its distribution.\u003c/p>\u003cp>The evidence on charging is not really contestable. Road space behaves like any other free good: expand supply and it fills, which is why investment alone leaves congestion flat. If the target is fewer cars, pricing is the only instrument that has reliably hit it.\u003c/p>\u003cp>Owen’s objection is therefore not an argument for investment instead. It is an argument about what is done with the revenue. A charge whose proceeds are returned as a flat rebate, or spent on the services used by the people least able to avoid the charge, is progressive overall even though the charge itself is regressive. The harm he describes is caused by the design rather than by the instrument.\u003c/p>\u003cp>So: charge, and hypothecate the revenue to night buses and outer-suburb services by means of a published formula rather than at a city’s discretion. Owen is right that this is usually promised and rarely delivered, which is a reason to bind it in the scheme rather than a reason not to charge.\u003c/p>","model_band":5,"degraded":["I agree with Owen because road charges are unfair to poor people who have no alternative but to drive, especially those who work night shifts or live far from the city centre. Rich people will simply pay the charge and continue driving, so it does not even solve the problem, it just turns the roads into a privilege for the wealthy. Cities should invest in good public transport that is cheap and reliable, and then people will choose to leave their cars at home voluntarily."],"degraded_html":"\u003cp>I agree with Owen because road charges are unfair to poor people who have no alternative but to drive, especially those who work night shifts or live far from the city centre. Rich people will simply pay the charge and continue driving, so it does not even solve the problem, it just turns the roads into a privilege for the wealthy. Cities should invest in good public transport that is cheap and reliable, and then people will choose to leave their cars at home voluntarily.\u003c/p>","degraded_band":3,"model_words":196,"fault_list":{"tag":"F3","faults":["\"It does not even solve the problem\" contradicts Elif’s evidence by assertion, and the claim that rich drivers simply pay is inconsistent with traffic falling within a year.","\"Then people will choose to leave their cars at home voluntarily\" ignores the induced-demand mechanism, which is the reason investment alone failed in the cities cited.","Nothing is said about revenue use, so the one available answer to the fairness objection is never considered; there is also a comma splice in the second sentence."],"html":["\u003cp>1.  \"It does not even solve the problem\" contradicts Elif’s evidence by assertion, and the claim that rich drivers simply pay is inconsistent with traffic falling within a year.\u003c/p>","\u003cp>2.  \"Then people will choose to leave their cars at home voluntarily\" ignores the induced-demand mechanism, which is the reason investment alone failed in the cities cited.\u003c/p>","\u003cp>3.  Nothing is said about revenue use, so the one available answer to the fairness objection is never considered; there is also a comma splice in the second sentence.\u003c/p>"]},"prof_name":"Professor Adeyemi","professor":"\u003cp>To cut urban car use, cities can charge for driving or invest in alternatives. Charging works quickly but falls hardest on those with least choice. Investment is fairer but slow and does not by itself reduce traffic. Which approach is right?\u003c/p>","students":[["Elif","Charge. Every city that priced driving saw traffic fall within a year; every city that only built transit saw congestion stay flat as new drivers filled the road."],["Owen","And in those cities the people who stopped driving were the ones who could least afford not to. A charge is a tax on people whose jobs start before the first bus."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Then people will choose to leave their cars at home voluntarily” ignores the induced-demand mechanism, which is the reason investment alone failed in the cities cited.","correct":true},{"text":"“It does not even solve the problem” contradicts Elif’s evidence by assertion, and the claim that rich drivers simply pay is inconsistent with traffic falling within a year.","correct":true},{"text":"Nothing is said about revenue use, so the one available answer to the fairness objection is never considered; there is also a comma splice in the second sentence.","correct":true},{"text":"“A very difficult month” and “extremely busy with exams and revision” are vague where exact dates were available, so the decline sounds like reluctance.","correct":false},{"text":"No offer, and an instruction instead of a request. “Please open our cards”, with nothing conceded and nothing offered. “Thank you in advance for your quick response” then sets the reader a deadline.","correct":false},{"text":"It minimises. “the minibus thing, that was annoying” describes a £60 loss to a shared account as a minor irritation, and there is a comma splice in the same sentence.","correct":false}],"key_html":"F3"}};</script>
