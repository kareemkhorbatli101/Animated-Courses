<script>window.ITEM={"kind":"exercise","id":"EM 069","slug":"em-069","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Thanks and acknowledgement","payload":{"Strategy":"thank by reporting the result","Grammar":"nominal that-clauses as subjects","Vocabulary":"referee, endorsement, intervene, vouch","Convention":"thanking for something that worked"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is the outcome more valuable to her than the thanks?\u003c/p>\u003cp>b.  She is leaving in July. How should that change the email?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a referee, and what does it mean to vouch for someone?\u003c/p>\u003cp>b.  Distinguish an endorsement from an intervention.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Write the first line so the outcome arrives before the thanks.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The outcome is in the first line with no preamble. Why?\u003c/p>\u003cp>b.  The writer quotes the convenor. What does that add that her own thanks could not?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"That you wrote the reference in four days is the reason I was in the running\" — identify the subject and say why it is built that way.\u003c/p>\u003cp>b.  \"it seems wrong for you not to see where it went\" — why frame the offer this way?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the outcome is the only part she does not already know. She knows she wrote the reference and she can guess she is being thanked; whether it worked is new information, and it is what makes writing the next one worthwhile.\u003c/p>\u003cp>b.  It makes this the last exchange of its kind, so anything the writer wants to say should be said now, and any continuing link — the report in September — has to be proposed rather than assumed.\u003c/p>","P2":"\u003cp>a.  A referee is someone who formally attests to your suitability; to vouch for someone is to stake your own credibility on them.\u003c/p>\u003cp>b.  An endorsement supports an application through the ordinary channel; an intervention is a step outside it. Four days at short notice is a strong endorsement, and calling it more would be overstating.\u003c/p>","P3":"\u003cp>Model: \"I got in — Monterrey confirmed yesterday, funded place, eight weeks from 6 July.\"\u003c/p>","F1":"\u003cp>a.  Because the result is the message. A paragraph of gratitude before the outcome makes her read it not knowing whether the application succeeded, which is the one thing she will want first.\u003c/p>\u003cp>b.  Independent evidence that the reference did specific work. The writer’s own gratitude is predictable; the convenor’s observation that most applicants could not get the quantitative side addressed shows exactly where the reference was decisive.\u003c/p>","F2":"\u003cp>a.  The subject is the nominal clause \"That you wrote the reference in four days\". Putting the whole act in subject position lets it be the thing that caused the result, which is a precise claim rather than a compliment.\u003c/p>\u003cp>b.  It makes the report an obligation of the writer rather than a favour asked of her. She can ignore it with no cost, and she is given a reason to want it — her own supervision is where the work began.\u003c/p>","F3":"\u003cp>1.  The outcome is buried in the fifth sentence after two paragraphs of thanks, so she reads the whole email in suspense. The first bullet is met only technically.\u003c/p>\u003cp>2.  Nothing specific about what the reference did — \"short notice\" and \"how busy you are\" describe her effort, not its effect. The second bullet fails.\u003c/p>\u003cp>3.  Her departure is not mentioned at all, so the third bullet fails; \"I hope this email finds you well\" and \"all your support during my studies\" are formulae that would fit any recipient, and there is a comma splice at the end.\u003c/p>"},"model":["Dear Dr Eze,","I got in — Monterrey confirmed yesterday, funded place, eight weeks from 6 July.","That you wrote the reference in four days is the reason I was in the running at all; the deadline had moved and I had no second referee with any knowledge of the fieldwork. The convenor mentioned in her email that the reference had addressed the quantitative side specifically, which she said was the part most applicants could not get anyone to speak to. So it was not a formality, and I wanted you to know what it did.","I gather you are leaving in July, so I will not be able to thank you in person once I am back. If it is useful, I will send you the final report in September — you supervised the work it grew out of, and it seems wrong for you not to see where it went.","Thank you, genuinely, for the four days.","Yours sincerely,","Mina Castellanos"],"model_html":"\u003cp>Dear Dr Eze,\u003c/p>\u003cp>I got in — Monterrey confirmed yesterday, funded place, eight weeks from 6 July.\u003c/p>\u003cp>That you wrote the reference in four days is the reason I was in the running at all; the deadline had moved and I had no second referee with any knowledge of the fieldwork. The convenor mentioned in her email that the reference had addressed the quantitative side specifically, which she said was the part most applicants could not get anyone to speak to. So it was not a formality, and I wanted you to know what it did.\u003c/p>\u003cp>I gather you are leaving in July, so I will not be able to thank you in person once I am back. If it is useful, I will send you the final report in September — you supervised the work it grew out of, and it seems wrong for you not to see where it went.\u003c/p>\u003cp>Thank you, genuinely, for the four days.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Mina Castellanos\u003c/p>","model_band":5,"degraded":["Dear Dr Eze, I hope this email finds you well. I wanted to write to thank you very much indeed for the reference you kindly wrote for me for the Monterrey summer programme. I really appreciate you doing it at such short notice, especially as I know how busy you are at this time of year. I am very happy to tell you that my application was successful. Thank you again for all your support during my studies, it has meant a great deal to me.","Mina"],"degraded_html":"\u003cp>Dear Dr Eze, I hope this email finds you well. I wanted to write to thank you very much indeed for the reference you kindly wrote for me for the Monterrey summer programme. I really appreciate you doing it at such short notice, especially as I know how busy you are at this time of year. I am very happy to tell you that my application was successful. Thank you again for all your support during my studies, it has meant a great deal to me.\u003c/p>\u003cp>Mina\u003c/p>","degraded_band":3,"model_words":161,"fault_list":{"tag":"F3","faults":["The outcome is buried in the fifth sentence after two paragraphs of thanks, so she reads the whole email in suspense. The first bullet is met only technically.","Nothing specific about what the reference did — \"short notice\" and \"how busy you are\" describe her effort, not its effect. The second bullet fails.","Her departure is not mentioned at all, so the third bullet fails; \"I hope this email finds you well\" and \"all your support during my studies\" are formulae that would fit any recipient, and there is a comma splice at the end."],"html":["\u003cp>1.  The outcome is buried in the fifth sentence after two paragraphs of thanks, so she reads the whole email in suspense. The first bullet is met only technically.\u003c/p>","\u003cp>2.  Nothing specific about what the reference did — \"short notice\" and \"how busy you are\" describe her effort, not its effect. The second bullet fails.\u003c/p>","\u003cp>3.  Her departure is not mentioned at all, so the third bullet fails; \"I hope this email finds you well\" and \"all your support during my studies\" are formulae that would fit any recipient, and there is a comma splice at the end.\u003c/p>"]},"scenario":"\u003cp>A lecturer wrote you a reference at short notice for a competitive summer programme. You have been accepted. You know she is leaving the university in July.\u003c/p>","bullets":["Report the outcome.","Be specific about what her reference did.","Close the loop, given she is leaving."],"header":[["To:","r.eze@northgate.ac.uk"],["Subject:","Monterrey programme — I got in"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Books are usually better than films anyway” is irrelevant to the question of how an adaptation should be judged, and “disrespectful to change it” assumes the conclusion.","correct":false},{"text":"Nothing specific about what the reference did — “short notice” and “how busy you are” describe her effort, not its effect. The second bullet fails.","correct":true},{"text":"Her departure is not mentioned at all, so the third bullet fails; “I hope this email finds you well” and “all your support during my studies” are formulae that would fit any recipient, and there is a comma splice at the end.","correct":true},{"text":"The outcome is buried in the fifth sentence after two paragraphs of thanks, so she reads the whole email in suspense. The first bullet is met only technically.","correct":true},{"text":"The support is not argument. “they are human beings and they have families” is true of every employment question ever asked, so it distinguishes nothing. The final recommendation — managers should discuss with workers — is a procedure, not an answer.","correct":false},{"text":"It asserts that the trials “prove” what Owen has just given a reason to doubt, and then dismisses his objection with “somebody has to try it first”, which concedes his point without noticing.","correct":false}],"key_html":"F3"}};</script>
