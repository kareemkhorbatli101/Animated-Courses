<script>window.ITEM={"kind":"exercise","id":"EM 078","slug":"em-078","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Correction of a record","payload":{"Strategy":"correct the record without accusing the record-keeper","Grammar":"passive with get for informal change","Vocabulary":"transcript, credit, ledger, amend","Convention":"correcting an administrative error"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why offer a theory about how the error happened?\u003c/p>\u003cp>b.  Why are two errors better reported together than separately?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a credit, and what does it mean to amend a record?\u003c/p>\u003cp>b.  Distinguish a transcript from a statement of results.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the two errors in one sentence each, with codes.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  \"The credit total is right, which is why I think the two have simply been exchanged\" — what does noting the total do?\u003c/p>\u003cp>b.  Why does the writer propose a fallback to the corrected transcript?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"though obviously you will know better than I do\" — what is this managing?\u003c/p>\u003cp>b.  \"there is another Sundaram in my cohort\" — why give the other student’s number?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because it turns a complaint into a diagnosis. A plausible mechanism tells the office where to look, which makes the fix a five-minute lookup rather than an investigation.\u003c/p>\u003cp>b.  Because they are almost certainly one event. Reported separately they look like two independent failures and may be handled by different people, neither of whom sees the pattern.\u003c/p>","P2":"\u003cp>a.  A credit is a unit of academic weight attached to a module; to amend a record is to correct it formally, leaving the correction traceable.\u003c/p>\u003cp>b.  A transcript is the full official record of modules and marks; a statement of results confirms a particular outcome. The second is quicker to issue, which is why it works as a fallback.\u003c/p>","P3":"\u003cp>Model: \"It lists GEOG215, which I never took, and omits GEOG247, which I passed in January with 64.\"\u003c/p>","F1":"\u003cp>a.  It rules out the two most likely alternative explanations — a missing module and an extra one — and points at a single swap. That is the difference between \"something is wrong\" and \"look at these two rows\".\u003c/p>\u003cp>b.  Because the deadline is external and the office may not be able to meet it. Naming a cheaper substitute means the writer gets what they actually need even if the full correction takes longer, and it shows they understand the office has a queue.\u003c/p>","F2":"\u003cp>a.  The risk of appearing to tell the records office how their own system failed. The hedge keeps the theory as an offer rather than a finding, which makes it easy to accept or discard.\u003c/p>\u003cp>b.  Because the whole value of the theory is that it can be checked in seconds, and that requires both numbers. Without them it is speculation; with them it is a lookup.\u003c/p>","F3":"\u003cp>1.  Neither module is named and no codes, credits or marks are given, so nothing can be checked. The first bullet fails.\u003c/p>\u003cp>2.  No explanation is offered, so the office must investigate from scratch, and no deadline or fallback is given — the third bullet fails too.\u003c/p>\u003cp>3.  \"I am surprised that such an important document was not checked properly\" and \"I would also like to know how this happened\" turn a correctable error into a complaint, which slows the correction down.\u003c/p>"},"model":["Dear Records Team,","My transcript, issued 3 June, has two errors.","It lists GEOG215 Coastal Processes, 20 credits, which I have never taken, and it omits GEOG247 Hydrology, 20 credits, which I passed in January with 64. The credit total is right, which is why I think the two have simply been exchanged.","For what it is worth, there is another Sundaram in my cohort — Anil, 2199380 — and my own number is 2199308. The digits are close enough that I would guess that is where it came from, though obviously you will know better than I do.","I need an amended transcript by 20 June, because the Monterrey programme requires it with the hydrology mark on it before they will confirm my place. If a corrected version cannot be issued that quickly, a letter confirming the hydrology result would probably be accepted and I can ask them.","Happy to send anything that helps — I still have the January results email.","Yours sincerely,","Ravi Sundaram — 2199308"],"model_html":"\u003cp>Dear Records Team,\u003c/p>\u003cp>My transcript, issued 3 June, has two errors.\u003c/p>\u003cp>It lists GEOG215 Coastal Processes, 20 credits, which I have never taken, and it omits GEOG247 Hydrology, 20 credits, which I passed in January with 64. The credit total is right, which is why I think the two have simply been exchanged.\u003c/p>\u003cp>For what it is worth, there is another Sundaram in my cohort — Anil, 2199380 — and my own number is 2199308. The digits are close enough that I would guess that is where it came from, though obviously you will know better than I do.\u003c/p>\u003cp>I need an amended transcript by 20 June, because the Monterrey programme requires it with the hydrology mark on it before they will confirm my place. If a corrected version cannot be issued that quickly, a letter confirming the hydrology result would probably be accepted and I can ask them.\u003c/p>\u003cp>Happy to send anything that helps — I still have the January results email.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Ravi Sundaram — 2199308\u003c/p>","model_band":5,"degraded":["Dear Records Team, I am writing because there are serious mistakes on my transcript. It shows a module I have never studied and it is missing one that I definitely passed in January. This is quite worrying as I need my transcript for an application and I am surprised that such an important document was not checked properly. Could you please correct it urgently and send me a new copy? I would also like to know how this happened.","Ravi"],"degraded_html":"\u003cp>Dear Records Team, I am writing because there are serious mistakes on my transcript. It shows a module I have never studied and it is missing one that I definitely passed in January. This is quite worrying as I need my transcript for an application and I am surprised that such an important document was not checked properly. Could you please correct it urgently and send me a new copy? I would also like to know how this happened.\u003c/p>\u003cp>Ravi\u003c/p>","degraded_band":3,"model_words":165,"fault_list":{"tag":"F3","faults":["Neither module is named and no codes, credits or marks are given, so nothing can be checked. The first bullet fails.","No explanation is offered, so the office must investigate from scratch, and no deadline or fallback is given — the third bullet fails too.","\"I am surprised that such an important document was not checked properly\" and \"I would also like to know how this happened\" turn a correctable error into a complaint, which slows the correction down."],"html":["\u003cp>1.  Neither module is named and no codes, credits or marks are given, so nothing can be checked. The first bullet fails.\u003c/p>","\u003cp>2.  No explanation is offered, so the office must investigate from scratch, and no deadline or fallback is given — the third bullet fails too.\u003c/p>","\u003cp>3.  \"I am surprised that such an important document was not checked properly\" and \"I would also like to know how this happened\" turn a correctable error into a complaint, which slows the correction down.\u003c/p>"]},"scenario":"\u003cp>Your transcript shows a module you never took, and omits one you passed. You suspect the credits were swapped with another student of the same surname.\u003c/p>","bullets":["State both errors.","Offer the likely explanation.","Say what you need and by when."],"header":[["To:","records@northgate.ac.uk"],["Subject:","Transcript 2199308 — two corrections needed"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Young people want to travel and enjoy their freedom” treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored.","correct":false},{"text":"“I am surprised that such an important document was not checked properly” and “I would also like to know how this happened” turn a correctable error into a complaint, which slows the correction down.","correct":true},{"text":"Language: “the artists” throughout, “his own personal vision” (redundant, and generic “their” would be better), and “freedom is the most important thing for creation” is assertion standing in for the conclusion.","correct":false},{"text":"Neither module is named and no codes, credits or marks are given, so nothing can be checked. The first bullet fails.","correct":true},{"text":"Language. “our society will lose” (would lose — the whole sentence is hypothetical), “the next generations” (future generations), “much more money on the military than on the culture” (on culture), and “the wrong priorities of our politicians”.","correct":false},{"text":"No explanation is offered, so the office must investigate from scratch, and no deadline or fallback is given — the third bullet fails too.","correct":true}],"key_html":"F3"}};</script>
