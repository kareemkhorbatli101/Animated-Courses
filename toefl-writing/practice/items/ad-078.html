<script>window.ITEM={"kind":"exercise","id":"AD 078","slug":"ad-078","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business · agree / disagree","payload":{"Strategy":"test a claim against the case where it costs something","Grammar":"conditional with unless","Vocabulary":"stakeholder, fiduciary, externality, mandate","Convention":"testing a claim about corporate purpose"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Max is making an accountability argument, not a moral one. Explain.\u003c/p>\u003cp>b.  What would a genuine test of stakeholder governance look like?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an externality, and what is a fiduciary duty?\u003c/p>\u003cp>b.  What does mandate mean here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that names the hard case.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response rejects both stated positions. What is its own?\u003c/p>\u003cp>b.  Why does it name \"a manager who underperforms and cites community benefit\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Unless a stakeholder obligation is specific and enforceable by someone, it functions as a defence rather than a duty\" — what does unless do here?\u003c/p>\u003cp>b.  \"narrower constraints\" rather than \"a broader objective\" — what is the contrast doing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  He is asking who can enforce an objective, not whether it is desirable. A goal nobody can measure or sanction is not a constraint on managers at all.\u003c/p>\u003cp>b.  A case where serving a stakeholder costs shareholders real money and the decision is challenged. If the framework only operates where interests align, it is doing no work.\u003c/p>","P2":"\u003cp>a.  An externality is a cost imposed on third parties and not borne by the firm; a fiduciary duty is a legal obligation to act in another party’s interest.\u003c/p>\u003cp>b.  The authority and instruction under which managers act — what they can be held to.\u003c/p>","P3":"\u003cp>Model: \"Stakeholder language helps only where the obligations are specific and enforceable; otherwise the hard case is a manager who underperforms and cites the community.\"\u003c/p>","F1":"\u003cp>a.  Enforceable sectoral constraints on emissions, wages and consultation, with a single measurable objective inside them. It accepts Ines’s diagnosis and Max’s accountability requirement rather than splitting the difference between their conclusions.\u003c/p>\u003cp>b.  Because that is the case where the two positions come apart. Stakeholder governance is costless where interests align, so any test of it has to be a case where someone loses — and the response shows nobody can contest the manager’s claim.\u003c/p>","F2":"\u003cp>a.  It makes the criticism conditional and states the condition that would answer it, so the response is not opposing stakeholder governance as such. That turns an objection into a specification.\u003c/p>\u003cp>b.  It names the structural choice. A broader objective dilutes accountability; narrower constraints preserve it while ruling out the behaviour Ines objects to, so the contrast carries the whole argument in four words.\u003c/p>","F3":"\u003cp>1.  \"There is no real conflict between doing good and making money\" denies the premise of the question, which is about what happens when there is one.\u003c/p>\u003cp>2.  Max’s accountability objection is named and then answered with a claim about long-run profitability, which is not about accountability at all.\u003c/p>\u003cp>3.  No mechanism, no enforcement, no hard case — the response agrees with a sentiment rather than taking a position on governance.\u003c/p>"},"model":["Max has the stronger objection and Ines is right about the problem, which means the answer is neither primacy nor stakeholderism as usually stated.","Ines’s diagnosis is accurate. A firm instructed to maximise one number will push every cost it can outside its own accounts, and pollution, insecure work and abandoned towns are what that looks like. Nobody defending shareholder value has a good answer to it.","But Max has identified why the alternative rarely helps. Unless a stakeholder obligation is specific and enforceable by someone, it functions as a defence rather than a duty: a manager can justify almost any decision by naming a stakeholder it served. The hard case is a manager who underperforms and cites community benefit, and under most stakeholder frameworks nobody has standing to challenge that.","So the improvement I would argue for is not a broader objective but narrower constraints — enforceable obligations on emissions, wages and consultation, with shareholders left to hold managers to account against what remains. That keeps Max’s accountability and removes Ines’s externalities, which a vaguer mandate does neither."],"model_html":"\u003cp>Max has the stronger objection and Ines is right about the problem, which means the answer is neither primacy nor stakeholderism as usually stated.\u003c/p>\u003cp>Ines’s diagnosis is accurate. A firm instructed to maximise one number will push every cost it can outside its own accounts, and pollution, insecure work and abandoned towns are what that looks like. Nobody defending shareholder value has a good answer to it.\u003c/p>\u003cp>But Max has identified why the alternative rarely helps. Unless a stakeholder obligation is specific and enforceable by someone, it functions as a defence rather than a duty: a manager can justify almost any decision by naming a stakeholder it served. The hard case is a manager who underperforms and cites community benefit, and under most stakeholder frameworks nobody has standing to challenge that.\u003c/p>\u003cp>So the improvement I would argue for is not a broader objective but narrower constraints — enforceable obligations on emissions, wages and consultation, with shareholders left to hold managers to account against what remains. That keeps Max’s accountability and removes Ines’s externalities, which a vaguer mandate does neither.\u003c/p>","model_band":5,"degraded":["I strongly agree that companies should consider all stakeholders because businesses do not exist in a vacuum and they have a social responsibility to the communities where they operate. Only caring about profit leads to exploitation of workers and destruction of the environment, as we have seen many times. Max worries about accountability but I think companies that treat people well are usually more successful in the long run anyway, so there is no real conflict between doing good and making money."],"degraded_html":"\u003cp>I strongly agree that companies should consider all stakeholders because businesses do not exist in a vacuum and they have a social responsibility to the communities where they operate. Only caring about profit leads to exploitation of workers and destruction of the environment, as we have seen many times. Max worries about accountability but I think companies that treat people well are usually more successful in the long run anyway, so there is no real conflict between doing good and making money.\u003c/p>","degraded_band":3,"model_words":178,"fault_list":{"tag":"F3","faults":["\"There is no real conflict between doing good and making money\" denies the premise of the question, which is about what happens when there is one.","Max’s accountability objection is named and then answered with a claim about long-run profitability, which is not about accountability at all.","No mechanism, no enforcement, no hard case — the response agrees with a sentiment rather than taking a position on governance."],"html":["\u003cp>1.  \"There is no real conflict between doing good and making money\" denies the premise of the question, which is about what happens when there is one.\u003c/p>","\u003cp>2.  Max’s accountability objection is named and then answered with a claim about long-run profitability, which is not about accountability at all.\u003c/p>","\u003cp>3.  No mechanism, no enforcement, no hard case — the response agrees with a sentiment rather than taking a position on governance.\u003c/p>"]},"prof_name":"Professor Zhou","professor":"\u003cp>It is often said that companies should serve all their stakeholders — workers, communities and the environment — rather than only shareholders. Critics argue this gives managers an excuse to answer to nobody. Is stakeholder governance an improvement?\u003c/p>","students":[["Ines","Obviously. A company that treats its workers and its town as costs to be minimised externalises everything it can. Shareholder primacy is how we got here."],["Max","And who holds a manager to account under the alternative? Shareholder value is a bad objective with one great virtue: it is measurable and someone can be fired for missing it."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: three comma splices, and “nobody will know it on your CV” asserts something about an audience the writer has not identified.","correct":false},{"text":"“I am sure our members would be very interested” points the wrong way and raises expectations the writer does not expect to meet.","correct":false},{"text":"Max’s accountability objection is named and then answered with a claim about long-run profitability, which is not about accountability at all.","correct":true},{"text":"No mechanism, no enforcement, no hard case — the response agrees with a sentiment rather than taking a position on governance.","correct":true},{"text":"“There is no real conflict between doing good and making money” denies the premise of the question, which is about what happens when there is one.","correct":true},{"text":"It prosecutes the reader. “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.","correct":false}],"key_html":"F3"}};</script>
