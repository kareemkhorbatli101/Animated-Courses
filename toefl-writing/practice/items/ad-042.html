<script>window.ITEM={"kind":"exercise","id":"AD 042","slug":"ad-042","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Arts and culture · value trade-off","payload":{"Strategy":"ask what the restriction protects and what it prevents","Grammar":"conditional qualification","Vocabulary":"canon, prescription, breadth, cultural capital","Convention":"arguing about curriculum without defending your own taste"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Sven does not deny the value of shared reference points. What does he deny?\u003c/p>\u003cp>b.  Leyla uses the phrase \"privatises the canon\". Unpack it.\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is cultural capital, and who has it before school starts?\u003c/p>\u003cp>b.  Distinguish prescription from a core with options.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Sven the point about endurance and keep Leyla’s goal, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response strengthens Leyla’s argument before using it. Why is that worth doing?\u003c/p>\u003cp>b.  What two functions of a list does it separate, and what follows?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the same furniture in their head\" is Leyla’s phrase and the response reuses it. Why, when AD 022 advised against reusing an opponent’s metaphor?\u003c/p>\u003cp>b.  \"turns a novel into a revision object\" — what is the force of the noun?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the list delivers them. His claim is about what happens in practice, not about whether a shared canon would be good if it worked.\u003c/p>\u003cp>b.  That abolishing a public list does not abolish selection; it moves it to individual teachers and schools, where it becomes invisible, unaccountable and unequal.\u003c/p>","P2":"\u003cp>a.  Familiarity with the references, habits and forms a society rewards. Children from book-owning households arrive with it, which is why Sven says they survive a bad list.\u003c/p>\u003cp>b.  Prescription fixes the texts; a core with options fixes some and leaves the rest open — which is the structure the response ends up proposing.\u003c/p>","P3":"\u003cp>Model: \"The endurance Sven describes comes from examining the text rather than from prescribing it, so you can keep the shared list and lose the compliance.\"\u003c/p>","F1":"\u003cp>a.  Because the weak version — shared culture is good — is easy to dismiss as nostalgia, and defeating it would prove nothing. Strengthening a position before engaging it is also the clearest signal that you are arguing rather than scoring.\u003c/p>\u003cp>b.  Specifying what is read, and specifying what is examined. Once separated, Sven’s harm attaches to the second and Leyla’s benefit to the first, so both can be had.\u003c/p>","F2":"\u003cp>a.  Because this phrase is a description rather than a frame. AD 022’s warning was about adopting a metaphor that builds in the conclusion; \"the same furniture in their head\" carries no conclusion and names the thing precisely, so reusing it is a courtesy rather than a concession.\u003c/p>\u003cp>b.  The nominalisation converts an activity into a category of object, which is exactly what the examination does to the novel. The grammar enacts the complaint.\u003c/p>","F3":"\u003cp>1.  It argues against prescription without engaging Leyla’s point that abolition privatises rather than removes the canon — the central argument in the discussion.\u003c/p>\u003cp>2.  The evidence is a personal anecdote generalised to \"nobody in my class\", and \"makes them hate reading for the rest of their lives\" is an unhedged causal claim.\u003c/p>\u003cp>3.  \"Books that speak to young people today\" is exactly the teacher-level selection Leyla identified as the problem, adopted without noticing. Language: a comma splice at \"understood anything, we just memorised\"; \"old books\" and \"modern books\" do no analytic work.\u003c/p>"},"model":["Leyla’s argument is stronger than the usual version of it, because it identifies what replaces a public list: not freedom but a hundred private lists, which will track the confidence and reading history of individual teachers. Sven is right that compliance is not reading, but that is an argument about which texts and how they are taught, not about whether anything is shared.","What both leave out is that a list does two separable things. It specifies what is read and it specifies what is examined, and the second is what produces the endurance Sven describes. A curriculum could name twenty texts, require four, and examine on the skill rather than the text — which keeps Leyla’s shared furniture, since the overlap across any four of twenty is substantial, while removing the mechanism that turns a novel into a revision object. I would keep prescription and move it off the examination, which is where the damage he identifies actually comes from."],"model_html":"\u003cp>Leyla’s argument is stronger than the usual version of it, because it identifies what replaces a public list: not freedom but a hundred private lists, which will track the confidence and reading history of individual teachers. Sven is right that compliance is not reading, but that is an argument about which texts and how they are taught, not about whether anything is shared.\u003c/p>\u003cp>What both leave out is that a list does two separable things. It specifies what is read and it specifies what is examined, and the second is what produces the endurance Sven describes. A curriculum could name twenty texts, require four, and examine on the skill rather than the text — which keeps Leyla’s shared furniture, since the overlap across any four of twenty is substantial, while removing the mechanism that turns a novel into a revision object. I would keep prescription and move it off the examination, which is where the damage he identifies actually comes from.\u003c/p>","model_band":5,"degraded":["In my opinion literature should not be imposed on students because every person has different tastes and interests, and forcing teenagers to read old books that they do not understand only makes them hate reading for the rest of their lives. I remember studying Shakespeare at school and nobody in my class understood anything, we just memorised what the teacher said for the exam. Teachers should be free to choose modern books that speak to young people today, and then maybe students will actually enjoy reading instead of seeing it as a punishment."],"degraded_html":"\u003cp>In my opinion literature should not be imposed on students because every person has different tastes and interests, and forcing teenagers to read old books that they do not understand only makes them hate reading for the rest of their lives. I remember studying Shakespeare at school and nobody in my class understood anything, we just memorised what the teacher said for the exam. Teachers should be free to choose modern books that speak to young people today, and then maybe students will actually enjoy reading instead of seeing it as a punishment.\u003c/p>","degraded_band":3,"model_words":160,"fault_list":{"tag":"F3","faults":["It argues against prescription without engaging Leyla’s point that abolition privatises rather than removes the canon — the central argument in the discussion.","The evidence is a personal anecdote generalised to \"nobody in my class\", and \"makes them hate reading for the rest of their lives\" is an unhedged causal claim.","\"Books that speak to young people today\" is exactly the teacher-level selection Leyla identified as the problem, adopted without noticing. Language: a comma splice at \"understood anything, we just memorised\"; \"old books\" and \"modern books\" do no analytic work."],"html":["\u003cp>1.  It argues against prescription without engaging Leyla’s point that abolition privatises rather than removes the canon — the central argument in the discussion.\u003c/p>","\u003cp>2.  The evidence is a personal anecdote generalised to \"nobody in my class\", and \"makes them hate reading for the rest of their lives\" is an unhedged causal claim.\u003c/p>","\u003cp>3.  \"Books that speak to young people today\" is exactly the teacher-level selection Leyla identified as the problem, adopted without noticing. Language: a comma splice at \"understood anything, we just memorised\"; \"old books\" and \"modern books\" do no analytic work.\u003c/p>"]},"prof_name":"Professor Rahimi","professor":"\u003cp>School literature curricula are often prescribed centrally, with a fixed list of set texts. Supporters say a shared canon gives everyone the same cultural reference points; critics say prescription crowds out texts that would actually be read. Which matters more?\u003c/p>","students":[["Leyla","Shared reference points. A common curriculum is one of the few things that gives a student from any background the same furniture in their head as everyone else. Abolishing the list does not free teachers, it privatises the canon."],["Sven","That assumes the shared texts are read rather than endured. A list that produces compliance rather than reading gives nobody anything, and the students who already have books at home are the ones who survive it."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The evidence is a personal anecdote generalised to “nobody in my class”, and “makes them hate reading for the rest of their lives” is an unhedged causal claim.","correct":true},{"text":"“A great opportunity for our students” is a reason for them, not for her; nothing says why she was asked or what the role uniquely supplies. The third bullet fails.","correct":false},{"text":"“Books that speak to young people today” is exactly the teacher-level selection Leyla identified as the problem, adopted without noticing. Language: a comma splice at “understood anything, we just memorised”; “old books” and “modern books” do no analytic work.","correct":true},{"text":"It argues against prescription without engaging Leyla’s point that abolition privatises rather than removes the canon — the central argument in the discussion.","correct":true},{"text":"It is vague where precision is the entire kindness. “Some of your work may have been lost”, “an older back-up somewhere I think” — she cannot plan her week from any of it, so the second bullet fails.","correct":false},{"text":"It instructs and then chases. “Please change me”, “it should be easy for you”, “Please do it quickly”. The writer decides the difficulty of the reader’s job and sets the schedule.","correct":false}],"key_html":"F3"}};</script>
