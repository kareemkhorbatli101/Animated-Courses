<script>window.ITEM={"kind":"exercise","id":"AD 045","slug":"ad-045","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban planning and transport · responsibility: who should act","payload":{"Strategy":"ask who owns the externality","Grammar":"modals of obligation across agents","Vocabulary":"externality, developer contribution, uplift, in perpetuity","Convention":"allocating cost between parties who all benefit"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Marek makes a feasibility argument. Does it concede Pia’s principle?\u003c/p>\u003cp>b.  Who actually bears a developer contribution in the long run?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is land value uplift, and what creates it?\u003c/p>\u003cp>b.  What does \"in perpetuity\" mean in a funding agreement, and why does it matter?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State who should pay in one sentence that distinguishes the capital cost from the running cost.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says \"the incidence depends almost entirely on timing\". Explain.\u003c/p>\u003cp>b.  What does the second paragraph accuse the whole debate of?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"and always will\" — three words at the end of a clause. What is their effect?\u003c/p>\u003cp>b.  \"which is not a failure of the system but a fact about what developer contributions can and cannot do\" — name the structure.\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It does not dispute that uplift is publicly created; it claims that a charge above some level stops the project. So the disagreement is about level rather than principle.\u003c/p>\u003cp>b.  Largely the landowner, through a lower land price — provided the charge is known before the land is bought. That is the fact the response builds on.\u003c/p>","P2":"\u003cp>a.  The increase in land value when permission to build is granted. It is created by the planning decision rather than by the owner.\u003c/p>\u003cp>b.  Continuing indefinitely. It matters because infrastructure has running costs that a one-off contribution cannot cover, which is the response’s central point.\u003c/p>","P3":"\u003cp>Model: \"Capital costs should come from uplift with the rate fixed before land is traded; running costs fall on general taxation and cannot be made to do otherwise.\"\u003c/p>","F1":"\u003cp>a.  If the charge is known before the land is purchased, the buyer bids less and the landowner bears it. If it is imposed afterwards, the developer has already paid a price assuming no charge and must absorb it from margin, which is where Marek’s viability failure comes from.\u003c/p>\u003cp>b.  Of treating the building as the expensive part. Both positions assume the question is who funds construction, when the recurring cost of staffing and operating is larger and cannot be met from a one-off payment at all.\u003c/p>","F2":"\u003cp>a.  They convert a concession into a settled fact and close off the expectation that some better arrangement might be found. The brevity is what makes it read as realism rather than resignation.\u003c/p>\u003cp>b.  A \"not ... but\" correlative, used to reframe a limitation as a definition. It prevents the admission being read as a criticism of the proposal, which is what would otherwise undermine the whole conclusion.\u003c/p>","F3":"\u003cp>1.  It never engages Marek’s viability argument, which was the only objection on the table.\u003c/p>\u003cp>2.  \"They always promise and then negotiate to reduce their obligations\" is an assertion about conduct offered instead of an argument about incidence, and the timing question that determines who actually pays is absent.\u003c/p>\u003cp>3.  The capital and running costs are never distinguished, so \"the new infrastructure is built before the houses are occupied\" addresses only the smaller half. Language: \"the developers\", \"the local community\", \"the local authority\", \"the government\" over-articled; \"huge profits\" is unsupported.\u003c/p>"},"model":["Pia is right about where the value comes from and Marek is right that a charge can be set high enough to stop the scheme, and the two are compatible because uplift is large. A contribution can take a substantial share and still leave the scheme viable; what matters is whether the charge is set before the land is bought, because a developer who has already paid a price that assumed no contribution really cannot absorb one. The incidence depends almost entirely on timing.","The distinction neither of them draws is between the capital cost and the running cost. A developer contribution can build a surgery; it cannot staff one in perpetuity, and almost every argument of this kind is conducted as though the building were the expensive part. It is not. So I would take the capital cost from uplift, as Pia wants, set the rate well in advance so Marek’s viability problem does not arise, and be honest that the recurring cost falls on general taxation and always will — which is not a failure of the system but a fact about what developer contributions can and cannot do."],"model_html":"\u003cp>Pia is right about where the value comes from and Marek is right that a charge can be set high enough to stop the scheme, and the two are compatible because uplift is large. A contribution can take a substantial share and still leave the scheme viable; what matters is whether the charge is set before the land is bought, because a developer who has already paid a price that assumed no contribution really cannot absorb one. The incidence depends almost entirely on timing.\u003c/p>\u003cp>The distinction neither of them draws is between the capital cost and the running cost. A developer contribution can build a surgery; it cannot staff one in perpetuity, and almost every argument of this kind is conducted as though the building were the expensive part. It is not. So I would take the capital cost from uplift, as Pia wants, set the rate well in advance so Marek’s viability problem does not arise, and be honest that the recurring cost falls on general taxation and always will — which is not a failure of the system but a fact about what developer contributions can and cannot do.\u003c/p>","model_band":5,"degraded":["I think the developers should pay because they are the ones who make huge profits from these projects while the local community has to deal with the consequences like traffic, overcrowded schools and waiting lists at the doctor. They always promise to contribute but then they negotiate to reduce their obligations and in the end the local authority has to pay with public money. The government should impose strict rules so that developers cannot escape their responsibilities and the new infrastructure is built before the houses are occupied."],"degraded_html":"\u003cp>I think the developers should pay because they are the ones who make huge profits from these projects while the local community has to deal with the consequences like traffic, overcrowded schools and waiting lists at the doctor. They always promise to contribute but then they negotiate to reduce their obligations and in the end the local authority has to pay with public money. The government should impose strict rules so that developers cannot escape their responsibilities and the new infrastructure is built before the houses are occupied.\u003c/p>","degraded_band":3,"model_words":190,"fault_list":{"tag":"F3","faults":["It never engages Marek’s viability argument, which was the only objection on the table.","\"They always promise and then negotiate to reduce their obligations\" is an assertion about conduct offered instead of an argument about incidence, and the timing question that determines who actually pays is absent.","The capital and running costs are never distinguished, so \"the new infrastructure is built before the houses are occupied\" addresses only the smaller half. Language: \"the developers\", \"the local community\", \"the local authority\", \"the government\" over-articled; \"huge profits\" is unsupported."],"html":["\u003cp>1.  It never engages Marek’s viability argument, which was the only objection on the table.\u003c/p>","\u003cp>2.  \"They always promise and then negotiate to reduce their obligations\" is an assertion about conduct offered instead of an argument about incidence, and the timing question that determines who actually pays is absent.\u003c/p>","\u003cp>3.  The capital and running costs are never distinguished, so \"the new infrastructure is built before the houses are occupied\" addresses only the smaller half. Language: \"the developers\", \"the local community\", \"the local authority\", \"the government\" over-articled; \"huge profits\" is unsupported.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>A new housing development will add two thousand residents to an area whose bus service, school places and surgery capacity are already full. Who should pay for the additional infrastructure — the developer, the local authority, or the new residents themselves?\u003c/p>","students":[["Pia","The developer. The value of the land rises the moment planning permission is granted, and that uplift is created by the public decision, not by anything the developer did. Capturing part of it to pay for the consequences is the least they can be asked."],["Marek","Charge the developer too much and the scheme does not get built, and the housing shortage that caused this is worse. The costs fall on everyone who benefits, which includes the existing residents whose area gets a better bus route."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“They always promise and then negotiate to reduce their obligations” is an assertion about conduct offered instead of an argument about incidence, and the timing question that determines who actually pays is absent.","correct":true},{"text":"No evidence and no fallback. “I am a very good student” is unverifiable; the prerequisite, the dissertation topic and any alternative to full enrolment are all missing, so bullets two and three are unaddressed.","correct":false},{"text":"It never engages Marek’s viability argument, which was the only objection on the table.","correct":true},{"text":"It accuses on a fact the writer got wrong. “obviously a mistake on your side because I cancelled the standing order” — but only the payer can cancel a standing order, so this is almost certainly his own oversight, asserted as the society’s fault.","correct":false},{"text":"Language and register. “Dear Professor” without a name, “in last year” (last year), “applying to a summer placement” (for), a comma splice at “remember me, I was”, and “I am waiting” as a closing line.","correct":false},{"text":"The capital and running costs are never distinguished, so “the new infrastructure is built before the houses are occupied” addresses only the smaller half. Language: “the developers”, “the local community”, “the local authority”, “the government” over-articled; “huge profits” is unsupported.","correct":true}],"key_html":"F3"}};</script>
