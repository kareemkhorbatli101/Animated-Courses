<script>window.ITEM={"kind":"exercise","id":"EM 001","slug":"em-001","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help · anchor item","payload":{"Strategy":"give the reason before the request, so the ask arrives already justified","Grammar":"the embedded question as a softener","Vocabulary":"register ladder for asking: want / need / would appreciate","Convention":"a request is a cost to the reader; acknowledge it once, not three times"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  What does Dr Haskins not know about you, and what follows for your tone?\u003c/p>\u003cp>b.  Two of the three bullets are easy. Which one is the request, and what makes it the difficult sentence?\u003c/p>\u003cp>c.  The third bullet was not asked for by politeness — it was asked for by the task. What is it actually for?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Order from most demanding to most deferential, then pick the one for a tutor you have never met:\u003c/p>\u003cpre class=\"mono\">(i)   I need an extension.\n(ii)  I would be grateful for a short extension.\n(iii) I want to ask for an extension.\n(iv)  Could I possibly ask for a short extension?\u003c/pre>\u003cp>b.  Which preposition? I am writing ______ regard ______ the deadline.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Turn this into one sentence that a stranger could read without bristling. Under 25 words.\u003c/p>\u003cpre class=\"mono\">Give me until Tuesday. I was ill.\u003c/pre>"},{"tag":"P4","title":"Commit to a plan","html":"\u003cp>Seven minutes, the whole email. Before you start, decide one thing: does the reason come before the request, or after it?\u003c/p>"},{"tag":"P5","title":"Predict the pitfall","html":"\u003cp>Which of these closes the email best, and what is wrong with the others?\u003c/p>\u003cpre class=\"mono\">(A) Sorry again for the trouble, I know you are very busy and\n    I am really very sorry to ask.\n(B) Please let me know as soon as possible.\n(C) I have attached the medical note, and I am happy to submit\n    whatever is ready on Friday if that helps.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Give each of the four paragraphs a one-word job.\u003c/p>\u003cp>b.  The request is in paragraph two, not paragraph one. Why does it land better there?\u003c/p>\u003cp>c.  Find the sentence that costs the writer something. Why include it?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “I was wondering whether it would be possible to …” Count the layers of distance in that phrase. Strip them off one at a time and watch the force increase.\u003c/p>\u003cp>b.  Why \u003cem>I have been ill since Monday\u003c/em> rather than \u003cem>I was ill since Monday\u003c/em>?\u003c/p>\u003cp>c.  “If it would help, I am happy to …” — what is the if-clause doing, given that the writer has already decided to offer?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>outstanding\u003c/em> has two common meanings. Which is used here, and how does the reader know?\u003c/p>\u003cp>b.  Why \u003cem>considering this\u003c/em> rather than \u003cem>accepting this\u003c/em> in the closing line?\u003c/p>\u003cp>c.  Fill the collocations: to ______ a deadline (two possible verbs, opposite meanings); to ______ an extension; to ______ work in.\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>You will miss a group presentation rehearsal because of a hospital appointment. In no more than 50 words, write the two middle sentences: one giving the reason, one making the request with an embedded question.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Nothing. She has no stock of goodwill to draw on, so everything has to be carried by the writing itself. That rules out familiarity (\u003cem>Hi\u003c/em>) and it also rules out the assumption that she will simply agree.\u003c/p>\u003cp>b.  The second. A request asks the reader to spend something — time, discretion, a departmental rule. The other two bullets only give information.\u003c/p>\u003cp>c.  It reduces the cost of saying yes. A reader who can see exactly what agreeing will involve agrees more readily than one who cannot.\u003c/p>","P2":"\u003cp>a.  (i) most demanding, then (iii), then (ii), then (iv). Use \u003cstrong>(ii)\u003c/strong> or \u003cstrong>(iv)\u003c/strong>. Note that \u003cem>I need\u003c/em> states your position as a fact about the world; \u003cem>I would be grateful\u003c/em> states it as a feeling you will have if she chooses to help.\u003c/p>\u003cp>b.  in regard \u003cstrong>to\u003c/strong> — or more naturally, \u003cem>about\u003c/em>. The model uses \u003cem>about\u003c/em>: the heavy formula is not a sign of good English.\u003c/p>","P3":"\u003cp>Model: \u003cem>I have been unwell since Monday, and I was wondering whether I might submit on Tuesday instead.\u003c/em>\u003c/p>\u003cp>Two changes carry it. The imperative has gone, and the reason now arrives first, so by the time the reader meets the request she already knows why it is being made.\u003c/p>","P4":"\u003cp>Reason first, almost always. A request that arrives before its justification makes the reader form a judgement on incomplete information, and first judgements are sticky.\u003c/p>\u003cp>The exception is a very short email to somebody who already knows the background, where the reason would be a delay.\u003c/p>","P5":"\u003cp>\u003cstrong>(C).\u003c/strong>\u003c/p>\u003cp>(A) apologises for the third time. One acknowledgement of the trouble is gracious; three makes the reader manage your feelings as well as your request.\u003c/p>\u003cp>(B) instructs the reader and sets a deadline for her, which inverts the relationship: you are the one asking.\u003c/p>\u003cp>(C) does two things at once — it supplies evidence and it offers a fallback. It is the only one of the three that makes agreeing easier.\u003c/p>","F1":"\u003cp>a.  Situate · Request · Evidence · Thank.\u003c/p>\u003cp>b.  Paragraph one has already established that the reason is medical and that the work is nearly done. The request then arrives as the obvious next step rather than as the point of the email.\u003c/p>\u003cp>c.  “I am happy to send you the sections that are already finished on Friday.” It offers up work in an unfinished state, which is a small cost to the writer. It buys credibility: somebody willing to show their work is probably telling the truth about it.\u003c/p>","F2":"\u003cp>a.  Four layers. \u003cem>Can I submit on Tuesday?\u003c/em> → \u003cem>Could I submit …\u003c/em> (modal) → \u003cem>Would it be possible to submit …\u003c/em> (the world, not the reader) → \u003cem>I was wondering whether it would be possible …\u003c/em> (and now it is not even a question, but a report of a thought you once had).\u003c/p>\u003cp>Each layer puts more distance between the asking and the asked. Use all four for a stranger and a real imposition; use one for a familiar colleague, or you will sound evasive.\u003c/p>\u003cp>b.  The illness started in the past and is still shaping the present situation, which is exactly what the present perfect is for. \u003cem>I was ill since Monday\u003c/em> is ungrammatical: \u003cem>since\u003c/em> requires a perfect form.\u003c/p>\u003cp>c.  It hands the reader control of something that costs her nothing to refuse. Offering unconditionally (\u003cem>I will send you the sections on Friday\u003c/em>) would commit her to reading them.\u003c/p>","F3":"\u003cp>a.  “Still to be done”, not “excellent”. The reader knows from \u003cem>the part still outstanding\u003c/em> — the other sense never takes \u003cem>still\u003c/em> and never describes a part of a task.\u003c/p>\u003cp>b.  \u003cem>Considering\u003c/em> thanks her for the act of weighing it up, which she will do whatever she decides. \u003cem>Accepting\u003c/em> thanks her in advance for saying yes, which quietly removes her option to say no — and readers notice.\u003c/p>\u003cp>c.  to \u003cstrong>meet\u003c/strong> / \u003cstrong>miss\u003c/strong> a deadline; to \u003cstrong>request\u003c/strong> (or \u003cem>grant\u003c/em>) an extension; to \u003cstrong>hand\u003c/strong> work in.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>Social conventions.\u003c/strong> “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.\u003c/p>\u003cp>2.  \u003cstrong>The third bullet is unaddressed.\u003c/strong> Nothing is offered to make the delay manageable, and the extension requested is vague (\u003cem>next week\u003c/em>) where the task called for something specific.\u003c/p>\u003cp>3.  \u003cstrong>Consequential errors.\u003c/strong> “in this week” (this week), “for finish it” (to finish it), “Please give me extension” (an extension), “Best regard” (regards), and a comma splice at “next week, I will send”. Individually small; together they are the accumulation the band-3 descriptor names.\u003c/p>","F5":"\u003cp>Model: \u003cem>I have a hospital appointment on Thursday afternoon that I have been waiting several months for, and I am afraid it clashes with the rehearsal. I was wondering whether the group might be able to run through my section on Friday instead.\u003c/em>\u003c/p>\u003cp>Check yours for two things: is the reason verifiable and outside your control, and is the request an embedded question rather than a statement of what you will do?\u003c/p>"},"model":["Dear Dr Haskins,","I am writing about the BIO214 lab report, which is due this Friday. I have been ill since Monday and have only just got back into the department; the write-up of the results section is the part still outstanding.","I was wondering whether it would be possible to submit on Tuesday 18th instead. That would give me the weekend to finish the analysis properly, rather than handing in something incomplete.","I have attached the note from the health centre. If it would help, I am happy to send you the sections that are already finished on Friday, so that you can see where the work stands.","Thank you for considering this.","With best wishes,","Amara Okonjo — BIO214, Group C"],"model_html":"\u003cp>Dear Dr Haskins,\u003c/p>\u003cp>I am writing about the BIO214 lab report, which is due this Friday. I have been ill since Monday and have only just got back into the department; the write-up of the results section is the part still outstanding.\u003c/p>\u003cp>I was wondering whether it would be possible to submit on Tuesday 18th instead. That would give me the weekend to finish the analysis properly, rather than handing in something incomplete.\u003c/p>\u003cp>I have attached the note from the health centre. If it would help, I am happy to send you the sections that are already finished on Friday, so that you can see where the work stands.\u003c/p>\u003cp>Thank you for considering this.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Amara Okonjo — BIO214, Group C\u003c/p>","model_band":5,"degraded":["Dear Teacher,","I am writing to you because I was very sick in this week and I couldn’t do the lab report. I need more time for finish it. Please give me extension until next week, I will send you the medical paper. I hope you understand my situation because it was not my fault.","Thanks a lot. Best regard,","Amara"],"degraded_html":"\u003cp>Dear Teacher,\u003c/p>\u003cp>I am writing to you because I was very sick in this week and I couldn’t do the lab report. I need more time for finish it. Please give me extension until next week, I will send you the medical paper. I hope you understand my situation because it was not my fault.\u003c/p>\u003cp>Thanks a lot. Best regard,\u003c/p>\u003cp>Amara\u003c/p>","degraded_band":3,"model_words":123,"fault_list":{"tag":"F4","faults":["Social conventions. “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.","The third bullet is unaddressed. Nothing is offered to make the delay manageable, and the extension requested is vague (next week) where the task called for something specific.","Consequential errors. “in this week” (this week), “for finish it” (to finish it), “Please give me extension” (an extension), “Best regard” (regards), and a comma splice at “next week, I will send”. Individually small; together they are the accumulation the band-3 descriptor names."],"html":["\u003cp>1.  \u003cstrong>Social conventions.\u003c/strong> “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.\u003c/p>","\u003cp>2.  \u003cstrong>The third bullet is unaddressed.\u003c/strong> Nothing is offered to make the delay manageable, and the extension requested is vague (\u003cem>next week\u003c/em>) where the task called for something specific.\u003c/p>","\u003cp>3.  \u003cstrong>Consequential errors.\u003c/strong> “in this week” (this week), “for finish it” (to finish it), “Please give me extension” (an extension), “Best regard” (regards), and a comma splice at “next week, I will send”. Individually small; together they are the accumulation the band-3 descriptor names.\u003c/p>"]},"scenario":"\u003cp>You have been ill for most of the week and will not finish your lab report by Friday. Your tutor, Dr Haskins, has not taught you before and does not know you well. You can realistically finish by the following Tuesday, and you have a medical note.\u003c/p>","bullets":["Explain why you cannot meet the deadline.","Ask for a specific extension.","Say what you will do to make the delay easy to accommodate."],"header":[["To:","a.haskins@northgate.ac.uk"],["Subject:","Lab report BIO214 — request for a short extension"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Social conventions. “Dear Teacher” is not how anyone is addressed in English; the name was in the prompt. “Please give me extension” is an imperative, and “I hope you understand” followed by “it was not my fault” puts the reader in the position of judge and then pre-emptively argues with her.","correct":true},{"text":"The third bullet is unaddressed. Nothing is offered to make the delay manageable, and the extension requested is vague (next week) where the task called for something specific.","correct":true},{"text":"“Better to be safe than sorry” is exactly the reasoning Emil’s objection defeats, and the base-rate problem is never engaged.","correct":false},{"text":"It refuses to rank, which is what the prompt asks for, and “impossible to separate them” is asserted rather than argued.","correct":false},{"text":"Consequential errors. “in this week” (this week), “for finish it” (to finish it), “Please give me extension” (an extension), “Best regard” (regards), and a comma splice at “next week, I will send”. Individually small; together they are the accumulation the band-3 descriptor names.","correct":true},{"text":"“The museums should be ashamed” is moralising rather than argument, and “return everything as soon as possible” ignores the ambiguity the discussion was about. Language: “the countries of origin”, “the colonial period”, “the power relation” over-articled.","correct":false}],"key_html":"F4"}};</script>
