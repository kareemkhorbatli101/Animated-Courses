<script>window.ITEM={"kind":"exercise","id":"EM 057","slug":"em-057","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"recommend a process, not an outcome, when you lack the facts","Grammar":"ranking adverbials","Vocabulary":"shortlist, criteria, weighting, deal-breaker","Convention":"advising when the decision is genuinely theirs"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Refusing to answer can look like evasion. How do you avoid that?\u003c/p>\u003cp>b.  Why would a confident recommendation here be worse than useless?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a deal-breaker, and why identify them first?\u003c/p>\u003cp>b.  What does it mean to weight criteria?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline to pick in one sentence that promises something better.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer refuses the question and the email is still useful. What makes it so?\u003c/p>\u003cp>b.  The last line offers something concrete. Why is that essential after a refusal?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"First ... Second ... Third, and this is the one people skip\" — what do the ordinals do?\u003c/p>\u003cp>b.  \"that is information\" — why understate it?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By replacing the answer with something of equal or greater value and saying why you cannot give the first. A refusal plus a method is help; a refusal alone is a deflection however kindly phrased.\u003c/p>\u003cp>b.  Because it would be a guess dressed as judgement, and your friend would weight it as though you knew something. Confident advice from someone without the facts is the most damaging kind.\u003c/p>","P2":"\u003cp>a.  A condition that disqualifies an option regardless of its other merits. Identifying them first is efficient because it eliminates rather than compares — and comparison is the expensive operation.\u003c/p>\u003cp>b.  To decide how much each criterion counts relative to the others, rather than treating all as equal — which is what an undifferentiated pros-and-cons list does.\u003c/p>","P3":"\u003cp>Model: \"I genuinely do not know enough about two of them — what I can do is give you the thing I use.\"\u003c/p>","F1":"\u003cp>a.  It supplies a method, a worked example of the method from the writer’s own case, and a specific next action. The friend finishes the email with three things to do rather than with reassurance.\u003c/p>\u003cp>b.  Because without it the email ends on the refusal, and the friend is back where they started. Offering to read the output converts a decline into a stage in a process the writer is still part of — which is what the third bullet asks for.\u003c/p>","F2":"\u003cp>a.  They impose a sequence on what would otherwise be advice in parallel, and the sequence matters — eliminate, then rank, then test. The aside on the third marks it as the valuable one without claiming so directly.\u003c/p>\u003cp>b.  Because the point is to leave the conclusion to the friend. \"That tells you not to take it\" would be the recommendation the writer has just declined to give; \"that is information\" hands them the signal and lets them read it.\u003c/p>","F3":"\u003cp>1.  It refuses and offers nothing. \"Make a list of pros and cons\" is the method everyone already knows and the one that fails, so the second bullet fails.\u003c/p>\u003cp>2.  \"Trust your instinct, you usually know deep down\" is reassurance rather than help, and \"I am sure you will make the right decision\" pre-approves any outcome, which makes it worthless as a judgement.\u003c/p>\u003cp>3.  \"Let me know what you decide\" removes the writer from the process entirely, so the third bullet fails. There are also two comma splices.\u003c/p>"},"model":["Hi Reza,","I keep not answering this and it is not evasion — I genuinely do not know enough about two of them, and more to the point I do not know what you want the next two years to look like. What I can do is give you the thing I use.","First, deal-breakers. Write down what would make you leave within six months whatever else was true — a commute over an hour, no training budget, a manager you did not warm to. Anything that fails one is out, and that usually removes at least one offer before any comparison starts.","Second, rank what is left on three things only. Most people can name eight criteria and genuinely act on about three. Mine were learning rate, the person I would report to, and whether I could leave at six. Yours will be different, but three is the number — more than that and you are weighing noise.","Third, and this is the one people skip: for each offer, write the sentence you would say to someone in two years about why you took it. If one of them produces a sentence you would be embarrassed by, that is information.","Send me the three lists if you want and I will tell you what I think they show. That I can actually do.","Dan"],"model_html":"\u003cp>Hi Reza,\u003c/p>\u003cp>I keep not answering this and it is not evasion — I genuinely do not know enough about two of them, and more to the point I do not know what you want the next two years to look like. What I can do is give you the thing I use.\u003c/p>\u003cp>First, deal-breakers. Write down what would make you leave within six months whatever else was true — a commute over an hour, no training budget, a manager you did not warm to. Anything that fails one is out, and that usually removes at least one offer before any comparison starts.\u003c/p>\u003cp>Second, rank what is left on three things only. Most people can name eight criteria and genuinely act on about three. Mine were learning rate, the person I would report to, and whether I could leave at six. Yours will be different, but three is the number — more than that and you are weighing noise.\u003c/p>\u003cp>Third, and this is the one people skip: for each offer, write the sentence you would say to someone in two years about why you took it. If one of them produces a sentence you would be embarrassed by, that is information.\u003c/p>\u003cp>Send me the three lists if you want and I will tell you what I think they show. That I can actually do.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Reza, Honestly it is impossible for me to say, it really depends on what you want and only you can know that. All three sound like good opportunities and I am sure you will make the right decision whichever you choose. Maybe make a list of pros and cons? Trust your instinct, you usually know deep down what you want. Let me know what you decide!","Dan"],"degraded_html":"\u003cp>Hi Reza, Honestly it is impossible for me to say, it really depends on what you want and only you can know that. All three sound like good opportunities and I am sure you will make the right decision whichever you choose. Maybe make a list of pros and cons? Trust your instinct, you usually know deep down what you want. Let me know what you decide!\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":223,"fault_list":{"tag":"F3","faults":["It refuses and offers nothing. \"Make a list of pros and cons\" is the method everyone already knows and the one that fails, so the second bullet fails.","\"Trust your instinct, you usually know deep down\" is reassurance rather than help, and \"I am sure you will make the right decision\" pre-approves any outcome, which makes it worthless as a judgement.","\"Let me know what you decide\" removes the writer from the process entirely, so the third bullet fails. There are also two comma splices."],"html":["\u003cp>1.  It refuses and offers nothing. \"Make a list of pros and cons\" is the method everyone already knows and the one that fails, so the second bullet fails.\u003c/p>","\u003cp>2.  \"Trust your instinct, you usually know deep down\" is reassurance rather than help, and \"I am sure you will make the right decision\" pre-approves any outcome, which makes it worthless as a judgement.\u003c/p>","\u003cp>3.  \"Let me know what you decide\" removes the writer from the process entirely, so the third bullet fails. There are also two comma splices.\u003c/p>"]},"scenario":"\u003cp>A friend has three job offers and keeps asking you which to take. You know very little about two of them and nothing about what they actually want from a job.\u003c/p>","bullets":["Decline to choose for them.","Give them something more useful than a pick.","Stay engaged rather than deflecting."],"header":[["To:","r.ahmadi@northgate.ac.uk"],["Subject:","Those three offers — a way to think about it"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Let me know what you decide” removes the writer from the process entirely, so the third bullet fails. There are also two comma splices.","correct":true},{"text":"“A theory that cannot be tested is not really scientific” restates the criterion under challenge, and there is a comma splice in the first sentence.","correct":false},{"text":"“Nobody is perfect” treats Noa’s objection as being about human weakness, which is the weaker reading and the one Kai can easily answer.","correct":false},{"text":"It refuses and offers nothing. “Make a list of pros and cons” is the method everyone already knows and the one that fails, so the second bullet fails.","correct":true},{"text":"“Trust your instinct, you usually know deep down” is reassurance rather than help, and “I am sure you will make the right decision” pre-approves any outcome, which makes it worthless as a judgement.","correct":true},{"text":"“Women should not have to choose” is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.","correct":false}],"key_html":"F3"}};</script>
