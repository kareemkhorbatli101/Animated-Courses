<script>window.ITEM={"kind":"exercise","id":"AD 083","slug":"ad-083","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Ethics · value trade-off","payload":{"Strategy":"weigh a duty to the near against a duty to the distant","Grammar":"correlative comparatives","Vocabulary":"obligation, impartiality, partiality, demandingness","Convention":"weighing special obligations against impartial ones"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Noa’s objection is about demandingness. Is that a moral objection or a psychological one?\u003c/p>\u003cp>b.  Why does Kai use the pond case rather than arguing from principle?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does impartiality mean here, and what is partiality?\u003c/p>\u003cp>b.  What is a supererogatory act?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that gives each side something.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response insists Noa’s objection is philosophical rather than psychological. Why does that matter?\u003c/p>\u003cp>b.  Why specify the duty as a share of income?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"The less open-ended the duty, the more likely it is to be met\" — identify the structure and say what it adds.\u003c/p>\u003cp>b.  \"a holiday, a friendship, a child’s music lessons\" — why these three examples?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Moral, if it is pressed properly. A theory implying that nearly every life is seriously wrong has a problem with its own subject matter, which is a reason to doubt it rather than a report of how hard it feels.\u003c/p>\u003cp>b.  Because it isolates the variable. Everyone agrees about the pond, so any difference in the distant case must come from a feature the pond case lacks — and those features look morally irrelevant.\u003c/p>","P2":"\u003cp>a.  Impartiality is giving everyone’s interests equal weight; partiality is the extra weight given to those close to us.\u003c/p>\u003cp>b.  An act that is good but beyond what duty requires — the category Noa needs and Kai’s principle threatens to abolish.\u003c/p>","P3":"\u003cp>Model: \"Accept the duty and cap it, because a bounded obligation is one people actually discharge.\"\u003c/p>","F1":"\u003cp>a.  Because a psychological complaint can be answered by telling people to try harder, while a structural objection to the theory cannot. Recasting it as philosophical is what earns Noa a modification of the principle rather than encouragement.\u003c/p>\u003cp>b.  Because a proportional duty is bounded, assessable and leaves room for the attachments Noa is defending, while \"whatever is left over\" has no upper limit and so generates exactly the objection.\u003c/p>","F2":"\u003cp>a.  Correlative comparatives — the less X, the more Y. They state the practical relationship the whole proposal rests on, and they let the response end on a consequence for the distant child rather than on a concession to comfort.\u003c/p>\u003cp>b.  Because they are ordinary and recognisably good, not luxuries. If the principle condemns friendship and a child’s music lessons, the objection cannot be dismissed as self-indulgence.\u003c/p>","F3":"\u003cp>1.  \"Everyone should do what they reasonably can according to their circumstances\" is unfalsifiable and sets no limit, so it takes no position on where the line falls.\u003c/p>\u003cp>2.  \"Nobody is perfect\" treats Noa’s objection as being about human weakness, which is the weaker reading and the one Kai can easily answer.\u003c/p>\u003cp>3.  Kai’s pond argument is accepted and its demanding implications are never faced, so the two halves of the response contradict each other without noticing.\u003c/p>"},"model":["Kai has the better argument and Noa has identified something his conclusion cannot accommodate, which means the principle needs a ceiling rather than a rejection.","The pond case does its work. Distance, nationality and visibility are not morally relevant features, and no one defending partiality has produced a reason why they should be. The more honestly you look at the comparison, the harder it is to say the near child matters more.","But Noa is not simply reporting discomfort. A principle with no upper bound makes every ordinary good — a holiday, a friendship, a child’s music lessons — into a wrong, and a theory on which almost every life is seriously immoral has lost contact with what it was built to explain. That is a philosophical objection, not a plea for comfort.","So I would accept Kai’s principle as the ground of a duty and Noa’s point as a limit on its extent: a demanding but bounded obligation, specified as a share of income rather than as whatever is left over. The less open-ended the duty, the more likely it is to be met — which matters more to the distant child than the theoretical maximum ever has."],"model_html":"\u003cp>Kai has the better argument and Noa has identified something his conclusion cannot accommodate, which means the principle needs a ceiling rather than a rejection.\u003c/p>\u003cp>The pond case does its work. Distance, nationality and visibility are not morally relevant features, and no one defending partiality has produced a reason why they should be. The more honestly you look at the comparison, the harder it is to say the near child matters more.\u003c/p>\u003cp>But Noa is not simply reporting discomfort. A principle with no upper bound makes every ordinary good — a holiday, a friendship, a child’s music lessons — into a wrong, and a theory on which almost every life is seriously immoral has lost contact with what it was built to explain. That is a philosophical objection, not a plea for comfort.\u003c/p>\u003cp>So I would accept Kai’s principle as the ground of a duty and Noa’s point as a limit on its extent: a demanding but bounded obligation, specified as a share of income rather than as whatever is left over. The less open-ended the duty, the more likely it is to be met — which matters more to the distant child than the theoretical maximum ever has.\u003c/p>","model_band":5,"degraded":["I agree with Kai that we have a duty to help people in need wherever they are, because all human beings have equal moral worth and it would be arbitrary to care less about someone just because they live far away. Of course Noa is right that we cannot give away everything, nobody is perfect and we all have our own families to look after. I think everyone should do what they reasonably can according to their circumstances."],"degraded_html":"\u003cp>I agree with Kai that we have a duty to help people in need wherever they are, because all human beings have equal moral worth and it would be arbitrary to care less about someone just because they live far away. Of course Noa is right that we cannot give away everything, nobody is perfect and we all have our own families to look after. I think everyone should do what they reasonably can according to their circumstances.\u003c/p>","degraded_band":3,"model_words":197,"fault_list":{"tag":"F3","faults":["\"Everyone should do what they reasonably can according to their circumstances\" is unfalsifiable and sets no limit, so it takes no position on where the line falls.","\"Nobody is perfect\" treats Noa’s objection as being about human weakness, which is the weaker reading and the one Kai can easily answer.","Kai’s pond argument is accepted and its demanding implications are never faced, so the two halves of the response contradict each other without noticing."],"html":["\u003cp>1.  \"Everyone should do what they reasonably can according to their circumstances\" is unfalsifiable and sets no limit, so it takes no position on where the line falls.\u003c/p>","\u003cp>2.  \"Nobody is perfect\" treats Noa’s objection as being about human weakness, which is the weaker reading and the one Kai can easily answer.\u003c/p>","\u003cp>3.  Kai’s pond argument is accepted and its demanding implications are never faced, so the two halves of the response contradict each other without noticing.\u003c/p>"]},"prof_name":"Dr Amari","professor":"\u003cp>If a stranger’s life can be saved at small cost, many argue we are obliged to do so, and that distance is morally irrelevant. Others reply that such a principle would consume our lives and leaves no room for the attachments that give them meaning. Where should the line be?\u003c/p>","students":[["Kai","The argument is sound and the discomfort is not a refutation. If you would pull a child from a pond, the fact that the child is in another country changes nothing morally."],["Noa","It changes everything practically. A principle that never stops demanding is not a moral theory, it is a recipe for burnout and for treating your own children as competing claims."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It defends rather than concedes: “I was only trying to help”, “nobody was answering them”, “everything I wrote was completely true as you know” — all three answer a charge that was not made, and the authority question is never acknowledged.","correct":false},{"text":"“There was a mix-up with the numbers” is agentless where responsibility was required, and nothing is said about preventing it. There is also a comma splice in the opening sentence.","correct":false},{"text":"“Everyone should do what they reasonably can according to their circumstances” is unfalsifiable and sets no limit, so it takes no position on where the line falls.","correct":true},{"text":"“Nobody is perfect” treats Noa’s objection as being about human weakness, which is the weaker reading and the one Kai can easily answer.","correct":true},{"text":"Kai’s pond argument is accepted and its demanding implications are never faced, so the two halves of the response contradict each other without noticing.","correct":true},{"text":"“I do not think we will be able to manage” hedges a decision that is actually certain, which leaves the school unsure whether to plan around it; there is also a comma splice in the opening sentence.","correct":false}],"key_html":"F3"}};</script>
