<script>window.ITEM={"kind":"exercise","id":"AD 066","slug":"ad-066","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Political science · cause ranking","payload":{"Strategy":"rank causes by which one the others operate through","Grammar":"passive with by-agents","Vocabulary":"turnout, salience, mobilisation, franchise","Convention":"ranking causes of low participation"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Owen’s objection is partly about evidence and partly about what explanations are for. Separate the two.\u003c/p>\u003cp>b.  How could disaffection and friction be the same story rather than rival ones?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is salience, and what is mobilisation?\u003c/p>\u003cp>b.  What is the franchise, and how does it differ from turnout?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three in one sentence using a mechanism, not a preference.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response ranks Dalia’s cause second but treats it as necessary. Is that coherent?\u003c/p>\u003cp>b.  Why is policy neglect placed third rather than first, given it causes the disaffection?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it is upstream of the disaffection and is itself partly produced by low turnout\" — what does the by-agent passive do here?\u003c/p>\u003cp>b.  \"it removes the margin of motivation that friction then consumes\" — why state the relationship this way?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The evidential part is that friction accounts for more measured variation in turnout. The other part is that disaffection, even if real, yields no intervention — it is an explanation that cannot be acted on.\u003c/p>\u003cp>b.  If disaffection lowers motivation and friction converts low motivation into abstention, they are stages in one mechanism. The question then becomes which stage is proximate and which removable.\u003c/p>","P2":"\u003cp>a.  Salience is how much an issue weighs in a voter’s decision; mobilisation is the organised effort to get supporters to vote.\u003c/p>\u003cp>b.  The franchise is the legal right to vote; turnout is the proportion who exercise it. Confusing them is how barriers get described as apathy.\u003c/p>","P3":"\u003cp>Model: \"Friction first because removing it moves turnout, disaffection second because it leaves no motivation to absorb friction, policy neglect third as the upstream cause of both.\"\u003c/p>","F1":"\u003cp>a.  Yes. Necessary and primary are different things. Disaffection supplies the background condition; friction is the step at which the outcome is actually decided, and ranking is about where the mechanism turns.\u003c/p>\u003cp>b.  Because it operates only through disaffection, which in turn operates only through friction, so it is two steps from the outcome. It is also partly an effect of low turnout, which makes it a poor candidate for the primary cause.\u003c/p>","F2":"\u003cp>a.  It names the agent while keeping policy neglect as the grammatical subject, so the sentence can state that the third-ranked cause is also an effect without losing the thread of the ranking. That is what identifies the loop.\u003c/p>\u003cp>b.  Because it makes the two causes sequential rather than competing. Each speaker’s candidate keeps its role, and the ranking follows from the order of the steps instead of from a judgement about which matters more.\u003c/p>","F3":"\u003cp>1.  It ranks nothing. The prompt asks which matters most and the response asserts one cause without comparing mechanisms or weighing evidence.\u003c/p>\u003cp>2.  Owen’s evidence — that turnout moves when registration changes and feeling does not — is dismissed as \"only a small practical issue\" with no counter-evidence.\u003c/p>\u003cp>3.  \"Politicians should listen to them more\" is a recommendation where an explanation was asked for, and \"young people are not lazy, they are disappointed\" answers an accusation neither speaker made; the sentence is also a comma splice.\u003c/p>"},"model":["Owen is right that friction explains more of the variation, and Dalia is describing the condition that makes friction decisive.","The evidence favours Owen. Turnout moves sharply when registration is made automatic or polling is brought onto campus, and it does so without any change in what young people think of parties. A cause whose removal shifts the outcome is doing explanatory work; disaffection, which is reported at similar levels in high-turnout and low-turnout systems, is not.","But this is where the two accounts join rather than compete. Friction deters only those who are not strongly motivated. A voter convinced the election matters will queue for an hour; one who suspects it does not will be stopped by a form. So disaffection does not cause abstention directly — it removes the margin of motivation that friction then consumes.","My ranking follows from that. Friction first, because it is the proximate cause and the one that is removable; disaffection second, as the condition that makes small costs decisive; and policy neglect third, since it is upstream of the disaffection and is itself partly produced by low turnout, which is how the cycle sustains itself."],"model_html":"\u003cp>Owen is right that friction explains more of the variation, and Dalia is describing the condition that makes friction decisive.\u003c/p>\u003cp>The evidence favours Owen. Turnout moves sharply when registration is made automatic or polling is brought onto campus, and it does so without any change in what young people think of parties. A cause whose removal shifts the outcome is doing explanatory work; disaffection, which is reported at similar levels in high-turnout and low-turnout systems, is not.\u003c/p>\u003cp>But this is where the two accounts join rather than compete. Friction deters only those who are not strongly motivated. A voter convinced the election matters will queue for an hour; one who suspects it does not will be stopped by a form. So disaffection does not cause abstention directly — it removes the margin of motivation that friction then consumes.\u003c/p>\u003cp>My ranking follows from that. Friction first, because it is the proximate cause and the one that is removable; disaffection second, as the condition that makes small costs decisive; and policy neglect third, since it is upstream of the disaffection and is itself partly produced by low turnout, which is how the cycle sustains itself.\u003c/p>","model_band":5,"degraded":["In my opinion the main reason young people do not vote is that politicians do not care about young people’s issues like housing and climate change, so young people feel that voting is pointless. Dalia is right about this. If parties offered real policies for young people then turnout would increase a lot. Owen talks about registration but I think this is only a small practical issue and the real problem is much deeper. Young people are not lazy, they are disappointed, and politicians should listen to them more."],"degraded_html":"\u003cp>In my opinion the main reason young people do not vote is that politicians do not care about young people’s issues like housing and climate change, so young people feel that voting is pointless. Dalia is right about this. If parties offered real policies for young people then turnout would increase a lot. Owen talks about registration but I think this is only a small practical issue and the real problem is much deeper. Young people are not lazy, they are disappointed, and politicians should listen to them more.\u003c/p>","degraded_band":3,"model_words":194,"fault_list":{"tag":"F3","faults":["It ranks nothing. The prompt asks which matters most and the response asserts one cause without comparing mechanisms or weighing evidence.","Owen’s evidence — that turnout moves when registration changes and feeling does not — is dismissed as \"only a small practical issue\" with no counter-evidence.","\"Politicians should listen to them more\" is a recommendation where an explanation was asked for, and \"young people are not lazy, they are disappointed\" answers an accusation neither speaker made; the sentence is also a comma splice."],"html":["\u003cp>1.  It ranks nothing. The prompt asks which matters most and the response asserts one cause without comparing mechanisms or weighing evidence.\u003c/p>","\u003cp>2.  Owen’s evidence — that turnout moves when registration changes and feeling does not — is dismissed as \"only a small practical issue\" with no counter-evidence.\u003c/p>","\u003cp>3.  \"Politicians should listen to them more\" is a recommendation where an explanation was asked for, and \"young people are not lazy, they are disappointed\" answers an accusation neither speaker made; the sentence is also a comma splice.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Voter turnout among citizens under thirty is far below that of older groups in most democracies. Suggested explanations include disaffection with parties, the practical difficulty of registering and voting, and the fact that policy rarely addresses young people’s priorities. Which matters most?\u003c/p>","students":[["Dalia","Disaffection. Young voters are not prevented from voting, they have concluded it changes nothing, and they are not obviously wrong."],["Owen","That is the explanation that flatters everyone and changes nothing. Turnout rises when registration is automatic and polling stations are near campuses. Friction explains more than feeling does."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Politicians should listen to them more” is a recommendation where an explanation was asked for, and “young people are not lazy, they are disappointed” answers an accusation neither speaker made; the sentence is also a comma splice.","correct":true},{"text":"The outcome is never given — “I could not have finished the project” says nothing about how it did. The third bullet fails.","correct":false},{"text":"Owen’s evidence — that turnout moves when registration changes and feeling does not — is dismissed as “only a small practical issue” with no counter-evidence.","correct":true},{"text":"It ranks nothing. The prompt asks which matters most and the response asserts one cause without comparing mechanisms or weighing evidence.","correct":true},{"text":"“I hope the problem is solved now” pre-empts the office’s judgement about whether it is, and “I would never do something like this on purpose” answers an accusation nobody made.","correct":false},{"text":"Language. “in 12 May” (on), “in Dalton Room” (in the Dalton Room), “confirm your attendance until Friday” (by Friday), “It will be very nice if you accept” (It would be). The until/by error is consequential: it asks for the opposite of what is meant.","correct":false}],"key_html":"F3"}};</script>
