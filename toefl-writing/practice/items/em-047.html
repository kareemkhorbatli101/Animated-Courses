<script>window.ITEM={"kind":"exercise","id":"EM 047","slug":"em-047","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask the question that distinguishes the two possibilities","Grammar":"indirect questions in series","Vocabulary":"tier, banding, means-tested, award","Convention":"enquiring about money without disclosing more than necessary"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Three explanations are possible and they need different responses from you. Why does that shape the email?\u003c/p>\u003cp>b.  Why not explain your financial situation in this first email?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a tier or band in an award scheme, and what does means-tested mean?\u003c/p>\u003cp>b.  Distinguish an award, an assessment and a reassessment.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask one question whose answer distinguishes all three possibilities.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer says they are not disputing the figure. Why say that at all?\u003c/p>\u003cp>b.  Why are the three possibilities listed rather than asked about one at a time?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"whether ... because ..., because ..., or because ...\" — what does this structure require of the reader?\u003c/p>\u003cp>b.  \"since the next step is different in each case\" — what does this justify?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the correct action differs: a reassessment needs evidence of your circumstances, a threshold change needs nothing, and an error needs correcting. Writing as though you knew which it was commits you to the wrong response.\u003c/p>\u003cp>b.  Because if the thresholds moved, your circumstances are irrelevant, and if it is an error, raising them invites a reassessment you did not ask for. Disclose when the information is needed, not before.\u003c/p>","P2":"\u003cp>a.  A band is a range of eligibility with a fixed award attached. Means-tested means the award depends on assessed income rather than on need as claimed.\u003c/p>\u003cp>b.  An award is what you are granted; an assessment is the calculation behind it; a reassessment is that calculation redone, usually because reported circumstances changed.\u003c/p>","P3":"\u003cp>Model: \"Could you tell me whether the band changed because of a reassessment, because the thresholds moved, or because of an error?\"\u003c/p>","F1":"\u003cp>a.  Because without it the email reads as the opening of an appeal, and the reply will be the appeals procedure rather than the information requested. It also lowers the reader’s defensiveness, which makes a frank answer about a possible error more likely.\u003c/p>\u003cp>b.  Because together they exhaust the possibilities, and presenting them as a set signals that the writer understands the system. It also makes the question answerable by selection rather than explanation, which is far faster.\u003c/p>","F2":"\u003cp>a.  That they identify which of three stated causes applies, rather than compose an account. It is much easier to answer and much harder to answer vaguely.\u003c/p>\u003cp>b.  The question itself — it explains why the writer needs to know the cause rather than merely the outcome, which pre-empts the reply \"the award is £900 as stated\".\u003c/p>","F3":"\u003cp>1.  It discloses circumstances before knowing whether they are relevant, and in doing so converts an enquiry into a claim — the third bullet is specifically failed.\u003c/p>\u003cp>2.  No question is asked. \"I do not understand how you can reduce my support\" expresses incomprehension rather than requesting the explanation, so the second bullet fails.\u003c/p>\u003cp>3.  No student number or award reference, so the record cannot be found; and \"review this decision\" requests an appeal outcome before establishing whether there is anything to appeal.\u003c/p>"},"model":["Dear Student Finance,","My bursary award for 2025–26 is £900, where last year it was £1,500. The letter shows me in band 3 rather than band 2, and there is no accompanying note.","Could you tell me whether the band has changed because of a reassessment of my household income, because the band thresholds themselves have moved for this year, or because of an error in the record? I am not disputing the figure — I would simply like to know which of those it is, since the next step is different in each case.","My student number is 2206613 and the award reference is BUR-11042.","Thank you very much.","Yours sincerely,","Petra Nowak"],"model_html":"\u003cp>Dear Student Finance,\u003c/p>\u003cp>My bursary award for 2025–26 is £900, where last year it was £1,500. The letter shows me in band 3 rather than band 2, and there is no accompanying note.\u003c/p>\u003cp>Could you tell me whether the band has changed because of a reassessment of my household income, because the band thresholds themselves have moved for this year, or because of an error in the record? I am not disputing the figure — I would simply like to know which of those it is, since the next step is different in each case.\u003c/p>\u003cp>My student number is 2206613 and the award reference is BUR-11042.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Petra Nowak\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I have just received my bursary letter and I was very shocked to see that my award has been reduced from 1500 to 900 pounds, which is a huge difference for me. My family situation has not improved at all, in fact my father lost his job last year, so I do not understand how you can reduce my support. I really need this money to continue my studies and I would ask you to review this decision as soon as possible.","Petra"],"degraded_html":"\u003cp>Dear Sir/Madam, I have just received my bursary letter and I was very shocked to see that my award has been reduced from 1500 to 900 pounds, which is a huge difference for me. My family situation has not improved at all, in fact my father lost his job last year, so I do not understand how you can reduce my support. I really need this money to continue my studies and I would ask you to review this decision as soon as possible.\u003c/p>\u003cp>Petra\u003c/p>","degraded_band":3,"model_words":116,"fault_list":{"tag":"F3","faults":["It discloses circumstances before knowing whether they are relevant, and in doing so converts an enquiry into a claim — the third bullet is specifically failed.","No question is asked. \"I do not understand how you can reduce my support\" expresses incomprehension rather than requesting the explanation, so the second bullet fails.","No student number or award reference, so the record cannot be found; and \"review this decision\" requests an appeal outcome before establishing whether there is anything to appeal."],"html":["\u003cp>1.  It discloses circumstances before knowing whether they are relevant, and in doing so converts an enquiry into a claim — the third bullet is specifically failed.\u003c/p>","\u003cp>2.  No question is asked. \"I do not understand how you can reduce my support\" expresses incomprehension rather than requesting the explanation, so the second bullet fails.\u003c/p>","\u003cp>3.  No student number or award reference, so the record cannot be found; and \"review this decision\" requests an appeal outcome before establishing whether there is anything to appeal.\u003c/p>"]},"scenario":"\u003cp>A bursary you receive has been reduced this year with no explanation. The award letter shows a different band. You need to know whether this is a reassessment, an error, or a change to the scheme.\u003c/p>","bullets":["Say what has changed.","Ask what would explain it.","Keep your own circumstances out of it until you know which it is."],"header":[["To:","studentfinance@northgate.ac.uk"],["Subject:","Bursary award 2025–26 — change in banding"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No question is asked. “I do not understand how you can reduce my support” expresses incomprehension rather than requesting the explanation, so the second bullet fails.","correct":true},{"text":"The emissions benefit — the actual environmental case for the line — is reduced to “save some time for passengers”, which misrepresents the other side. Language: “the environment”, “nature”, “future generations” used as slogans rather than as terms in an argument.","correct":false},{"text":"“Linguists have proven” and “language belongs to the people who speak it” are appeals to authority and to slogan where an argument was needed.","correct":false},{"text":"It discloses circumstances before knowing whether they are relevant, and in doing so converts an enquiry into a claim — the third bullet is specifically failed.","correct":true},{"text":"No student number or award reference, so the record cannot be found; and “review this decision” requests an appeal outcome before establishing whether there is anything to appeal.","correct":true},{"text":"“They always promise and then negotiate to reduce their obligations” is an assertion about conduct offered instead of an argument about incidence, and the timing question that determines who actually pays is absent.","correct":false}],"key_html":"F3"}};</script>
