<script>window.ITEM={"kind":"exercise","id":"EM 100","slug":"em-100","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Thanks and acknowledgement","payload":{"Strategy":"thank by naming what it cost the other person","Grammar":"mixed conditionals","Vocabulary":"secondment, cover, goodwill, discretion","Convention":"thanking someone who took a risk for you"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  He broke a rule to help you. What is the danger in thanking him in writing?\u003c/p>\u003cp>b.  What does he most want to know?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is goodwill, in this sense, and what is discretion?\u003c/p>\u003cp>b.  What does it mean to give someone cover?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Write the sentence that acknowledges the risk without recording the breach.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email never states what the arrangement actually was. Why not?\u003c/p>\u003cp>b.  The offer at the end is to vouch for safety compliance. Why that offer specifically?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"If you had said no in March, there would have been no project to submit — I would have handed in drawings\" — identify the conditional pattern and say what it proves.\u003c/p>\u003cp>b.  \"I have not forgotten which way you could have gone\" — why this rather than naming the risk?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the email becomes a record of the breach. Anything you write can be read by someone else, and a warm thank-you that describes an unauthorised arrangement is evidence.\u003c/p>\u003cp>b.  Whether it was worth it — that is, whether the project came off. That is the one thing he cannot find out for himself.\u003c/p>","P2":"\u003cp>a.  Goodwill is the credit built up by past favours; discretion is the latitude someone has to decide a matter themselves.\u003c/p>\u003cp>b.  To protect someone from the consequences of a decision — which is what the offer in the fourth paragraph is really about.\u003c/p>","P3":"\u003cp>Model: \"I know it was your call to make and that it cost you something to make it.\"\u003c/p>","F1":"\u003cp>a.  Because naming it would hand anyone who read the email a dated account of what he allowed. The gratitude is fully expressible without the specifics, and leaving them out is itself part of the thanks.\u003c/p>\u003cp>b.  Because it is the thing that would actually protect him if the arrangement ever surfaced. The exposure is not that he was generous but that something could have gone wrong, and a student confirming the procedures were followed is worth more than gratitude.\u003c/p>","F2":"\u003cp>a.  A mixed conditional: a past condition with a past consequence, followed by a counterfactual about the writer. It proves the help was decisive rather than merely convenient, which is what distinguishes real thanks from politeness.\u003c/p>\u003cp>b.  Because naming the risk would put the breach in writing, which is the one thing the email must not do. The hedged version shows the writer understood exactly what was at stake while leaving nothing on paper.\u003c/p>","F3":"\u003cp>1.  \"Technically you were not supposed to let students in without supervision\" records the breach in writing, which is the one thing the second bullet rules out.\u003c/p>\u003cp>2.  The outcome is never given — \"I could not have finished the project\" says nothing about how it did. The third bullet fails.\u003c/p>\u003cp>3.  \"Bending the rules\" and \"above and beyond\" are generic praise where something specific was available, and there is a comma splice before \"I could not have finished\".\u003c/p>"},"model":["Dear Jim,","It got a first — 72, and the external examiner singled out the cut tolerances, which were the whole reason I needed the extra time.","Thank you for the flexibility over those three weeks. I know it was your call to make and that it cost you something to make it, and I have not forgotten which way you could have gone. If you had said no in March, there would have been no project to submit — I would have handed in drawings.","I have not mentioned the arrangement to anyone and I do not intend to. If it is ever useful for me to say that the workshop induction and the safety procedure were followed every time, which they were, I am happy to put that on paper for whoever asks.","I am in Cape Verde from July but back in the autumn. If the workshop ever needs an unpaid pair of hands on an open day, I owe you several.","With thanks,","Tomas Reyes"],"model_html":"\u003cp>Dear Jim,\u003c/p>\u003cp>It got a first — 72, and the external examiner singled out the cut tolerances, which were the whole reason I needed the extra time.\u003c/p>\u003cp>Thank you for the flexibility over those three weeks. I know it was your call to make and that it cost you something to make it, and I have not forgotten which way you could have gone. If you had said no in March, there would have been no project to submit — I would have handed in drawings.\u003c/p>\u003cp>I have not mentioned the arrangement to anyone and I do not intend to. If it is ever useful for me to say that the workshop induction and the safety procedure were followed every time, which they were, I am happy to put that on paper for whoever asks.\u003c/p>\u003cp>I am in Cape Verde from July but back in the autumn. If the workshop ever needs an unpaid pair of hands on an open day, I owe you several.\u003c/p>\u003cp>With thanks,\u003c/p>\u003cp>Tomas Reyes\u003c/p>","model_band":5,"degraded":["Dear Jim, I just wanted to say a huge thank you for letting me use the laser cutter in the evenings and at weekends over the last three weeks, even though technically you were not supposed to let students in without supervision. I really appreciate you bending the rules for me, I could not have finished the project without it. You went above and beyond and I am very grateful. Thanks again for everything!","Tomas"],"degraded_html":"\u003cp>Dear Jim, I just wanted to say a huge thank you for letting me use the laser cutter in the evenings and at weekends over the last three weeks, even though technically you were not supposed to let students in without supervision. I really appreciate you bending the rules for me, I could not have finished the project without it. You went above and beyond and I am very grateful. Thanks again for everything!\u003c/p>\u003cp>Tomas\u003c/p>","degraded_band":3,"model_words":167,"fault_list":{"tag":"F3","faults":["\"Technically you were not supposed to let students in without supervision\" records the breach in writing, which is the one thing the second bullet rules out.","The outcome is never given — \"I could not have finished the project\" says nothing about how it did. The third bullet fails.","\"Bending the rules\" and \"above and beyond\" are generic praise where something specific was available, and there is a comma splice before \"I could not have finished\"."],"html":["\u003cp>1.  \"Technically you were not supposed to let students in without supervision\" records the breach in writing, which is the one thing the second bullet rules out.\u003c/p>","\u003cp>2.  The outcome is never given — \"I could not have finished the project\" says nothing about how it did. The third bullet fails.\u003c/p>","\u003cp>3.  \"Bending the rules\" and \"above and beyond\" are generic praise where something specific was available, and there is a comma splice before \"I could not have finished\".\u003c/p>"]},"scenario":"\u003cp>A technician let you use the laser-cutting workshop outside supervised hours for three weeks so you could finish a project. He was not strictly authorised to and could have been in trouble.\u003c/p>","bullets":["Thank him.","Acknowledge what he risked, without putting it in writing in a damaging way.","Report the outcome."],"header":[["To:","j.brennan@northgate.ac.uk"],["Subject:","Thank you — and it got a first"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Technically you were not supposed to let students in without supervision” records the breach in writing, which is the one thing the second bullet rules out.","correct":true},{"text":"Owen’s evidence — that turnout moves when registration changes and feeling does not — is dismissed as “only a small practical issue” with no counter-evidence.","correct":false},{"text":"“Human rights are universal” is asserted rather than defended, and no distinction is drawn between revising the principle and rejecting it, so there is no position on the actual question.","correct":false},{"text":"Language: “the artists” throughout, “his own personal vision” (redundant, and generic “their” would be better), and “freedom is the most important thing for creation” is assertion standing in for the conclusion.","correct":false},{"text":"“Bending the rules” and “above and beyond” are generic praise where something specific was available, and there is a comma splice before “I could not have finished”.","correct":true},{"text":"The outcome is never given — “I could not have finished the project” says nothing about how it did. The third bullet fails.","correct":true}],"key_html":"F3"}};</script>
