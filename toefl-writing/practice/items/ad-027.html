<script>window.ITEM={"kind":"exercise","id":"AD 027","slug":"ad-027","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Education · responsibility: who should act","payload":{"Strategy":"ask who is able to act, then who should pay","Grammar":"modals of obligation across agents","Vocabulary":"remit, capacity, statutory, discretionary","Convention":"assigning a duty that nobody currently owns"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both accept the students are here and need help. What is actually in dispute?\u003c/p>\u003cp>b.  Nils makes an argument about incentives. Restate it in one sentence.\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish statutory from discretionary duties.\u003c/p>\u003cp>b.  What is remediation, and why is the word contested?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Separate the duty to act from the duty to pay, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response splits one duty into two. Name them, and say why the split dissolves the argument.\u003c/p>\u003cp>b.  The final sentence identifies a third location for the problem. What is it?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"absorbing it quietly does remove the signal\" — what is the emphatic \"does\" doing?\u003c/p>\u003cp>b.  \"A duty that nobody can discharge is usually one that nobody has stated precisely enough.\" Why end on a generalisation?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Who bears the cost, and whether absorbing it has effects beyond the students currently enrolled.\u003c/p>\u003cp>b.  If universities quietly fix what schools failed to do, the school system faces no consequence and the failure repeats indefinitely.\u003c/p>","P2":"\u003cp>a.  A statutory duty is imposed by law and must be performed; a discretionary one may be performed at the body’s judgement. Writing support is almost everywhere discretionary, which is why it is funded first and cut first.\u003c/p>\u003cp>b.  Teaching that repairs a gap in prior preparation. It is contested because it implies deficiency in the student rather than mismatch between what was taught and what is assumed.\u003c/p>","P3":"\u003cp>Model: \"Universities have to act because the students are theirs now; schools have to answer because the recurrence is theirs.\"\u003c/p>","F1":"\u003cp>a.  The duty to act and the duty to pay or answer. The split dissolves the argument because each classmate was defending a different one, and nothing in either position requires the other to be false.\u003c/p>\u003cp>b.  The absence of a stated standard. Neither schools nor universities can be held to a level that has never been specified, so the duty cannot be allocated to either — which is a point neither classmate reached.\u003c/p>","F2":"\u003cp>a.  Conceding Nils’s point with emphasis before the response goes on to propose teaching anyway. The emphatic \"does\" makes the concession unmistakable, which buys permission for the proposal that follows (family 8, structure 65).\u003c/p>\u003cp>b.  Because the specific finding — no stated standard — is more useful as an instance of a general pattern the reader can apply elsewhere. It also lands the response on a claim rather than on a recommendation, which is harder to dismiss.\u003c/p>","F3":"\u003cp>1.  It allocates responsibility to everyone, which is the answer the question exists to improve on, and never engages Nils’s incentive argument.\u003c/p>\u003cp>2.  \"If everybody does their part then the problem can be solved\" is the conclusion of no argument, and the reading recommendation at the end belongs to a different question.\u003c/p>\u003cp>3.  Language: \"the schools\", \"the universities\", \"the students themselves\" over-articled; \"make an effort and practise their writing\" is vague; and the final sentence shifts to second person mid-paragraph.\u003c/p>"},"model":["Bea is right about who must act and Nils is right about who should pay, and the argument only looks like a disagreement because those two duties have been collapsed. The student in front of you is a university problem whatever its origin; the recurrence of the problem every September is a schools problem, and absorbing it quietly does remove the signal that would otherwise reach the school system.","The way to hold both is to teach and to publish. A university can run the writing provision Bea wants and report, by sending institution, what proportion of its intake needed it — which converts Nils’s incentive argument into something that operates without anyone refusing to teach anybody. If I had to locate the remaining gap it is not in either place but between them: nobody has ever had to specify what level of writing a course assumes, so the schools cannot aim at it and the universities cannot say it has been missed. A duty that nobody can discharge is usually one that nobody has stated precisely enough."],"model_html":"\u003cp>Bea is right about who must act and Nils is right about who should pay, and the argument only looks like a disagreement because those two duties have been collapsed. The student in front of you is a university problem whatever its origin; the recurrence of the problem every September is a schools problem, and absorbing it quietly does remove the signal that would otherwise reach the school system.\u003c/p>\u003cp>The way to hold both is to teach and to publish. A university can run the writing provision Bea wants and report, by sending institution, what proportion of its intake needed it — which converts Nils’s incentive argument into something that operates without anyone refusing to teach anybody. If I had to locate the remaining gap it is not in either place but between them: nobody has ever had to specify what level of writing a course assumes, so the schools cannot aim at it and the universities cannot say it has been missed. A duty that nobody can discharge is usually one that nobody has stated precisely enough.\u003c/p>","model_band":5,"degraded":["In my opinion the responsibility belongs to everybody in the education system. The schools should prepare the students better for university and teach them how to write academic essays, the universities should provide support courses for those who need them, and the students themselves must also make an effort and practise their writing. If everybody does their part then the problem can be solved. Also I think reading more books would help a lot because when you read good writing you learn how to write well yourself."],"degraded_html":"\u003cp>In my opinion the responsibility belongs to everybody in the education system. The schools should prepare the students better for university and teach them how to write academic essays, the universities should provide support courses for those who need them, and the students themselves must also make an effort and practise their writing. If everybody does their part then the problem can be solved. Also I think reading more books would help a lot because when you read good writing you learn how to write well yourself.\u003c/p>","degraded_band":3,"model_words":177,"fault_list":{"tag":"F3","faults":["It allocates responsibility to everyone, which is the answer the question exists to improve on, and never engages Nils’s incentive argument.","\"If everybody does their part then the problem can be solved\" is the conclusion of no argument, and the reading recommendation at the end belongs to a different question.","Language: \"the schools\", \"the universities\", \"the students themselves\" over-articled; \"make an effort and practise their writing\" is vague; and the final sentence shifts to second person mid-paragraph."],"html":["\u003cp>1.  It allocates responsibility to everyone, which is the answer the question exists to improve on, and never engages Nils’s incentive argument.\u003c/p>","\u003cp>2.  \"If everybody does their part then the problem can be solved\" is the conclusion of no argument, and the reading recommendation at the end belongs to a different question.\u003c/p>","\u003cp>3.  Language: \"the schools\", \"the universities\", \"the students themselves\" over-articled; \"make an effort and practise their writing\" is vague; and the final sentence shifts to second person mid-paragraph.\u003c/p>"]},"prof_name":"Professor Adeyemi","professor":"\u003cp>Many students arrive at university unable to write at the level their courses assume. Who should be responsible for addressing this — schools, universities, or the students themselves?\u003c/p>","students":[["Bea","Universities. Whatever schools should have done, the students are here now, and a university that admits someone has accepted that they can be taught. Pointing upstream is a way of not teaching them."],["Nils","Schools, and saying so matters. If universities absorb the problem silently, the school system never has to confront it, and every cohort arrives in the same state while universities spend teaching budgets on remediation."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“If everybody does their part then the problem can be solved” is the conclusion of no argument, and the reading recommendation at the end belongs to a different question.","correct":true},{"text":"Language and detail. No date, no refectory, no dish named precisely; “negligence” is a legal characterisation the writer cannot support; and there is a comma splice at “unacceptable, somebody could be killed”.","correct":false},{"text":"Language: “the schools”, “the universities”, “the students themselves” over-articled; “make an effort and practise their writing” is vague; and the final sentence shifts to second person mid-paragraph.","correct":true},{"text":"“I do not think we will be able to manage” hedges a decision that is actually certain, which leaves the school unsure whether to plan around it; there is also a comma splice in the opening sentence.","correct":false},{"text":"No alternatives, no delegation, no reallocation route, and “I am becoming quite worried” asks the reader to manage the writer’s anxiety rather than to sign a page.","correct":false},{"text":"It allocates responsibility to everyone, which is the answer the question exists to improve on, and never engages Nils’s incentive argument.","correct":true}],"key_html":"F3"}};</script>
