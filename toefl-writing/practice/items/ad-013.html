<script>window.ITEM={"kind":"exercise","id":"AD 013","slug":"ad-013","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Health and medicine · value trade-off","payload":{"Strategy":"ask whether the two goods are actually in competition","Grammar":"comparative of importance","Vocabulary":"triage, waiting list, acuity, capacity","Convention":"arguing about rationing without pretending it can be avoided"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ben is not arguing that arrival order is fairer in principle. What is he arguing?\u003c/p>\u003cp>b.  Is this a disagreement about values or about institutions?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is acuity, and how does it differ from urgency?\u003c/p>\u003cp>b.  What does it mean to game a system?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State what both would accept, and what follows, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says Alina has not answered Ben. Why not?\u003c/p>\u003cp>b.  It identifies the queue’s \"real virtue\" as something other than what Ben said. What is gained?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a rule requiring judgement will be bent towards whoever is best at applying pressure\" — why passive?\u003c/p>\u003cp>b.  \"answered by instrumentation rather than by abandoning the principle\" — what does the parallel do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That a need-based rule will be captured in practice by articulate and persistent patients, so its real-world distribution may be worse than a crude rule that cannot be influenced.\u003c/p>\u003cp>b.  About institutions. Both would prefer need if assessment were reliable; they disagree about whether it can be made so.\u003c/p>","P2":"\u003cp>a.  Acuity is the severity and instability of a condition — how sick, how fast deteriorating. Urgency is how soon intervention is needed, which usually follows from acuity but is not identical to it.\u003c/p>\u003cp>b.  To exploit the rules to get an outcome the rules were not intended to give, without breaking them.\u003c/p>","P3":"\u003cp>Model: \"Both would choose need if the assessment were reliable, so the question is whether it can be made auditable rather than which principle is better.\"\u003c/p>","F1":"\u003cp>a.  Because she replies to the ethical claim (\"indefensible\") when Ben conceded that and raised a different one about implementation. Answering the argument someone did not make is the commonest way a discussion stalls.\u003c/p>\u003cp>b.  It converts Ben’s point from a reason to keep queues into a design requirement for triage. Crudeness cannot be transferred to a clinical tool, but auditability can — so naming the right property is what makes the synthesis possible.\u003c/p>","F2":"\u003cp>a.  Because naming an agent would turn a structural claim into an accusation about particular clinicians. The passive keeps it a property of the rule, which is what the argument needs.\u003c/p>\u003cp>b.  It sets two responses to the same objection side by side in matched grammar, so the reader sees that abandoning the principle was only one of the available moves — and the weaker one.\u003c/p>","F3":"\u003cp>1.  It takes no position, despite the question asking which matters more.\u003c/p>\u003cp>2.  Ben’s argument is restated as \"some patients are more aggressive\", losing the institutional point entirely; the closing recommendation that the system should be \"fair and transparent\" is what everyone already wants and names no mechanism.\u003c/p>\u003cp>3.  Language: \"a small problem\", \"not fair for the quiet people\", \"the hospitals\", \"the urgent cases\" — register is conversational throughout and the articles are systematically wrong.\u003c/p>"},"model":["Ben is making an institutional argument rather than an ethical one, and Alina has not answered it. Nobody thinks arrival order is intrinsically fairer than need; the claim is that a rule requiring judgement will be bent towards whoever is best at applying pressure, and the evidence on that is not encouraging.","But the conclusion does not follow, because the choice is not between two rules applied by the same people. What makes need-based triage gameable is discretion exercised case by case at the point of contact. Formalise the assessment — a scored tool applied by someone other than the clinician the patient is lobbying, with the score recorded and auditable — and most of Ben’s problem goes. The queue’s real virtue is not its crudeness but its auditability, and that is a property you can build into a clinical measure. So I would say need, with Ben’s objection answered by instrumentation rather than by abandoning the principle."],"model_html":"\u003cp>Ben is making an institutional argument rather than an ethical one, and Alina has not answered it. Nobody thinks arrival order is intrinsically fairer than need; the claim is that a rule requiring judgement will be bent towards whoever is best at applying pressure, and the evidence on that is not encouraging.\u003c/p>\u003cp>But the conclusion does not follow, because the choice is not between two rules applied by the same people. What makes need-based triage gameable is discretion exercised case by case at the point of contact. Formalise the assessment — a scored tool applied by someone other than the clinician the patient is lobbying, with the score recorded and auditable — and most of Ben’s problem goes. The queue’s real virtue is not its crudeness but its auditability, and that is a property you can build into a clinical measure. So I would say need, with Ben’s objection answered by instrumentation rather than by abandoning the principle.\u003c/p>","model_band":5,"degraded":["This is a very difficult ethical question and I can understand both points of view. On one hand it is obvious that a patient with a serious condition must be treated before a patient with a small problem, because otherwise people could die while they are waiting. On the other hand Ben is right that some patients are more aggressive and they push to get treated faster, which is not fair for the quiet people. In my opinion the hospitals should treat the urgent cases first but also they should make sure that the system is fair and transparent for everybody."],"degraded_html":"\u003cp>This is a very difficult ethical question and I can understand both points of view. On one hand it is obvious that a patient with a serious condition must be treated before a patient with a small problem, because otherwise people could die while they are waiting. On the other hand Ben is right that some patients are more aggressive and they push to get treated faster, which is not fair for the quiet people. In my opinion the hospitals should treat the urgent cases first but also they should make sure that the system is fair and transparent for everybody.\u003c/p>","degraded_band":3,"model_words":157,"fault_list":{"tag":"F3","faults":["It takes no position, despite the question asking which matters more.","Ben’s argument is restated as \"some patients are more aggressive\", losing the institutional point entirely; the closing recommendation that the system should be \"fair and transparent\" is what everyone already wants and names no mechanism.","Language: \"a small problem\", \"not fair for the quiet people\", \"the hospitals\", \"the urgent cases\" — register is conversational throughout and the articles are systematically wrong."],"html":["\u003cp>1.  It takes no position, despite the question asking which matters more.\u003c/p>","\u003cp>2.  Ben’s argument is restated as \"some patients are more aggressive\", losing the institutional point entirely; the closing recommendation that the system should be \"fair and transparent\" is what everyone already wants and names no mechanism.\u003c/p>","\u003cp>3.  Language: \"a small problem\", \"not fair for the quiet people\", \"the hospitals\", \"the urgent cases\" — register is conversational throughout and the articles are systematically wrong.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>When demand exceeds capacity, should a health system treat patients in order of arrival, or in order of clinical need? Order of arrival is transparent and resists manipulation; order of need saves more life-years but requires judgements that can be disputed.\u003c/p>","students":[["Alina","Need, obviously. Treating a routine case ahead of an urgent one because it arrived first is indefensible, whatever its administrative virtues."],["Ben","I would not dismiss arrival order so quickly. Need-based triage is only as good as the assessment, and in practice the people who get reassessed upward are the ones who know how to insist. A queue is crude but it is very hard to game."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Ben’s argument is restated as “some patients are more aggressive”, losing the institutional point entirely; the closing recommendation that the system should be “fair and transparent” is what everyone already wants and names no mechanism.","correct":true},{"text":"It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","correct":false},{"text":"Language: “a small problem”, “not fair for the quiet people”, “the hospitals”, “the urgent cases” — register is conversational throughout and the articles are systematically wrong.","correct":true},{"text":"“Trust your instinct, you usually know deep down” is reassurance rather than help, and “I am sure you will make the right decision” pre-approves any outcome, which makes it worthless as a judgement.","correct":false},{"text":"Language. No order reference, no date, no count of the damage, and “immediately” as an instruction.","correct":false},{"text":"It takes no position, despite the question asking which matters more.","correct":true}],"key_html":"F3"}};</script>
