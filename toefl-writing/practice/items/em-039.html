<script>window.ITEM={"kind":"exercise","id":"EM 039","slug":"em-039","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline on behalf of a group without speaking for them","Grammar":"negative politeness forms","Vocabulary":"remit, mandate, consult, put to the committee","Convention":"declining when the decision is not yours alone"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You lack authority to accept or refuse. How do you write anything useful?\u003c/p>\u003cp>b.  Why not simply say you will ask the committee and stop there?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a mandate, and what does it mean to consult?\u003c/p>\u003cp>b.  What does it mean to put something to a committee?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Signal the likely answer without giving it, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer predicts the committee’s answer. Is that overstepping?\u003c/p>\u003cp>b.  Why mention the commitment that collapsed?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"What I think the committee would say yes to\" — how does this phrasing avoid committing anyone?\u003c/p>\u003cp>b.  \"it would be better to know that now\" — whose interest is this serving?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By separating prediction from decision. You can say what you expect and what you will recommend, provided you are clear that the decision is not yours — and that is far more useful to the other party than silence.\u003c/p>\u003cp>b.  Because it leaves her planning around a request that is probably going to be refused, for two more weeks. Honest early signalling is the main courtesy available here.\u003c/p>","P2":"\u003cp>a.  A mandate is authority to act on others’ behalf; to consult is to seek views before deciding. The writer has the second and not the first.\u003c/p>\u003cp>b.  To place it formally before them for decision — which is what the writer commits to doing, and all they can commit to.\u003c/p>","P3":"\u003cp>Model: \"Every Saturday for a term is almost certainly more than we can sustain.\"\u003c/p>","F1":"\u003cp>a.  No, because it is explicitly framed as a prediction and the decision is still put to them. Overstepping would be declining; this is reporting a judgement about his own organisation, which he is better placed to make than she is.\u003c/p>\u003cp>b.  Because it converts \"we probably cannot\" from reluctance into evidence. It also protects her: she now knows the risk of accepting an over-ambitious commitment from this society, which is information worth having.\u003c/p>","F2":"\u003cp>a.  The verb is \"think\" and the subject of the agreement is the committee, so nothing is promised. It gives her a planning assumption while leaving the decision formally untouched.\u003c/p>\u003cp>b.  Hers. If four Saturdays is useless to the charity she can look elsewhere immediately rather than waiting for a formal answer she will then have to act on in a hurry.\u003c/p>","F3":"\u003cp>1.  No indication of what is likely, so the charity waits two weeks on a request that will probably be reduced. The second bullet fails.\u003c/p>\u003cp>2.  \"I am sure our members would be very interested\" points the wrong way and raises expectations the writer does not expect to meet.\u003c/p>\u003cp>3.  No counter-offer of any kind, so if the committee says no the relationship ends on a refusal with nothing attached. The email is correct and entirely empty.\u003c/p>"},"model":["Dear Rachel,","Thank you for thinking of us — I will put this to the committee on the 9th, and I wanted to give you an honest sense of it in the meantime rather than leave you waiting on a maybe.","Every Saturday for a term is almost certainly more than we can sustain. We are about twenty people, most with weekend jobs, and the last open-ended commitment we took on ran for five weeks before it collapsed, which I would rather not repeat on your stall.","What I think the committee would say yes to is four Saturdays across the term, with the dates fixed in advance and two named people per date. That is something I can hold people to. If four is not enough to be worth your while, it would be better to know that now.","I will come back to you on the 10th either way.","Best wishes,","Tomas Reyes — Northgate Volunteering Society"],"model_html":"\u003cp>Dear Rachel,\u003c/p>\u003cp>Thank you for thinking of us — I will put this to the committee on the 9th, and I wanted to give you an honest sense of it in the meantime rather than leave you waiting on a maybe.\u003c/p>\u003cp>Every Saturday for a term is almost certainly more than we can sustain. We are about twenty people, most with weekend jobs, and the last open-ended commitment we took on ran for five weeks before it collapsed, which I would rather not repeat on your stall.\u003c/p>\u003cp>What I think the committee would say yes to is four Saturdays across the term, with the dates fixed in advance and two named people per date. That is something I can hold people to. If four is not enough to be worth your while, it would be better to know that now.\u003c/p>\u003cp>I will come back to you on the 10th either way.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Tomas Reyes — Northgate Volunteering Society\u003c/p>","model_band":5,"degraded":["Dear Rachel, Thank you very much for your email and for thinking of our society for this opportunity. I will need to discuss this with our committee before giving you an answer, as I cannot take this decision alone. We meet on the 9th so I will get back to you after that. I am sure our members would be very interested in supporting such a good cause.","Tomas"],"degraded_html":"\u003cp>Dear Rachel, Thank you very much for your email and for thinking of our society for this opportunity. I will need to discuss this with our committee before giving you an answer, as I cannot take this decision alone. We meet on the 9th so I will get back to you after that. I am sure our members would be very interested in supporting such a good cause.\u003c/p>\u003cp>Tomas\u003c/p>","degraded_band":3,"model_words":158,"fault_list":{"tag":"F3","faults":["No indication of what is likely, so the charity waits two weeks on a request that will probably be reduced. The second bullet fails.","\"I am sure our members would be very interested\" points the wrong way and raises expectations the writer does not expect to meet.","No counter-offer of any kind, so if the committee says no the relationship ends on a refusal with nothing attached. The email is correct and entirely empty."],"html":["\u003cp>1.  No indication of what is likely, so the charity waits two weeks on a request that will probably be reduced. The second bullet fails.\u003c/p>","\u003cp>2.  \"I am sure our members would be very interested\" points the wrong way and raises expectations the writer does not expect to meet.\u003c/p>","\u003cp>3.  No counter-offer of any kind, so if the committee says no the relationship ends on a refusal with nothing attached. The email is correct and entirely empty.\u003c/p>"]},"scenario":"\u003cp>A local charity has asked your society to run their fundraising stall every Saturday for a term. You think it is too much but you cannot commit the society on your own, and you do not want to lose the relationship.\u003c/p>","bullets":["Respond without committing the society.","Be honest that the full request is unlikely.","Keep the relationship open."],"header":[["To:","volunteers@riversidetrust.org"],["Subject:","Saturday stall — what we can realistically offer"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“I am sure our members would be very interested” points the wrong way and raises expectations the writer does not expect to meet.","correct":true},{"text":"“It is about fifty-fifty” commits the exact error under discussion — treating the trait as divisible into two shares.","correct":false},{"text":"Mei’s evidence is dismissed as “a small problem” without engaging it — and it was the only empirical claim in the discussion.","correct":false},{"text":"No counter-offer of any kind, so if the committee says no the relationship ends on a refusal with nothing attached. The email is correct and entirely empty.","correct":true},{"text":"“Which is obviously good for society” does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.","correct":false},{"text":"No indication of what is likely, so the charity waits two weeks on a request that will probably be reduced. The second bullet fails.","correct":true}],"key_html":"F3"}};</script>
