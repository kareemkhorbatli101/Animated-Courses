<script>window.ITEM={"kind":"exercise","id":"AD 091","slug":"ad-091","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Neuroscience · agree / disagree","payload":{"Strategy":"distinguish a finding from the claim built on it","Grammar":"hedged reporting verbs","Vocabulary":"correlate, localisation, inference, construct","Convention":"assessing what an imaging result shows"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ravi and Sofia agree about the inference. What do they disagree about?\u003c/p>\u003cp>b.  Why is reverse inference the central problem here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for two things to covary, and what is localisation?\u003c/p>\u003cp>b.  What is a psychological construct?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence about what an image supports.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response agrees with both speakers. Why is that not fence-sitting?\u003c/p>\u003cp>b.  Why does it define reverse inference rather than just name the problem?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is reported as established what the methods section carefully declines to assert\" — why the passive reporting verb?\u003c/p>\u003cp>b.  \"both are looking at something real\" — what does this resolve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Where responsibility for the overclaiming lies. Ravi locates it in reporting; Sofia argues the literature itself is published under claims it does not support.\u003c/p>\u003cp>b.  Because it is the step that turns a legitimate finding into an illegitimate conclusion — inferring the mental state from the activation rather than the activation from the state.\u003c/p>","P2":"\u003cp>a.  To covary is to vary together without any claim about cause; localisation is the attribution of a function to a particular region.\u003c/p>\u003cp>b.  A theoretical entity like attention or fear, defined by how it is measured rather than observed directly — which is part of why the inference is so fragile.\u003c/p>","P3":"\u003cp>Model: \"An image supports a statement that activity covaried with a task, and nothing about what the region is for.\"\u003c/p>","F1":"\u003cp>a.  Because it identifies that they are making claims about different objects — the inference as practised and the literature as published — and says so explicitly. Fence-sitting would be saying both have a point without locating where.\u003c/p>\u003cp>b.  Because the whole dispute turns on one inferential step, and naming it without explaining it leaves the reader unable to see why the criticism bites. The definition is doing the argumentative work.\u003c/p>","F2":"\u003cp>a.  It keeps the sentence on what the publication asserts rather than on who asserted it, which is the point: the overclaiming is a property of the literature regardless of whether the author or the editor wrote the title.\u003c/p>\u003cp>b.  It states the diagnosis in one clause: the two sides are describing different parts of the same practice, so the disagreement is not about facts. That explains the persistence of the dispute rather than just adjudicating it.\u003c/p>","F3":"\u003cp>1.  The response is about media exaggeration, which both speakers already agree on, so it contributes nothing to the point at issue.\u003c/p>\u003cp>2.  Sofia’s specific claim — that the papers themselves are titled as overclaims — is never addressed.\u003c/p>\u003cp>3.  \"Brain imaging is a very valuable tool that has taught us a great deal\" is a general endorsement standing in for a position on what an image supports.\u003c/p>"},"model":["Ravi is right about what the field claims and Sofia is right that the claim and the publication are not the same thing.","The methodological point is not in dispute. An image shows that activity in a region covaries with performance of a task, which licenses no statement about what the region does and certainly none about identity. The fallacy is reverse inference: observing that a region activates during fear does not entitle anyone to read fear off activation in that region, because the same region activates during a dozen other things.","Sofia’s complaint survives that concession. A title reading \"the brain’s fear centre\" is a claim, whoever wrote it, and the authors approved it. It is reported as established what the methods section carefully declines to assert, and the gap between the two is not journalism.","So the criticism is fair against the literature as published and unfair against the inference as practised. Those are different targets, and treating them as one is what lets each side feel vindicated — the researchers point at their methods and the critics at the titles, and both are looking at something real."],"model_html":"\u003cp>Ravi is right about what the field claims and Sofia is right that the claim and the publication are not the same thing.\u003c/p>\u003cp>The methodological point is not in dispute. An image shows that activity in a region covaries with performance of a task, which licenses no statement about what the region does and certainly none about identity. The fallacy is reverse inference: observing that a region activates during fear does not entitle anyone to read fear off activation in that region, because the same region activates during a dozen other things.\u003c/p>\u003cp>Sofia’s complaint survives that concession. A title reading \"the brain’s fear centre\" is a claim, whoever wrote it, and the authors approved it. It is reported as established what the methods section carefully declines to assert, and the gap between the two is not journalism.\u003c/p>\u003cp>So the criticism is fair against the literature as published and unfair against the inference as practised. Those are different targets, and treating them as one is what lets each side feel vindicated — the researchers point at their methods and the critics at the titles, and both are looking at something real.\u003c/p>","model_band":5,"degraded":["I agree with the critics because the media often exaggerates scientific findings and gives people a false impression of what neuroscience can actually do. Many popular articles claim that scientists can read our minds or detect lies from brain scans, which is not true. However I also think brain imaging is a very valuable tool that has taught us a great deal about the brain. Ravi is right that scientists themselves are usually more careful than journalists."],"degraded_html":"\u003cp>I agree with the critics because the media often exaggerates scientific findings and gives people a false impression of what neuroscience can actually do. Many popular articles claim that scientists can read our minds or detect lies from brain scans, which is not true. However I also think brain imaging is a very valuable tool that has taught us a great deal about the brain. Ravi is right that scientists themselves are usually more careful than journalists.\u003c/p>","degraded_band":3,"model_words":189,"fault_list":{"tag":"F3","faults":["The response is about media exaggeration, which both speakers already agree on, so it contributes nothing to the point at issue.","Sofia’s specific claim — that the papers themselves are titled as overclaims — is never addressed.","\"Brain imaging is a very valuable tool that has taught us a great deal\" is a general endorsement standing in for a position on what an image supports."],"html":["\u003cp>1.  The response is about media exaggeration, which both speakers already agree on, so it contributes nothing to the point at issue.\u003c/p>","\u003cp>2.  Sofia’s specific claim — that the papers themselves are titled as overclaims — is never addressed.\u003c/p>","\u003cp>3.  \"Brain imaging is a very valuable tool that has taught us a great deal\" is a general endorsement standing in for a position on what an image supports.\u003c/p>"]},"prof_name":"Dr Brennan","professor":"\u003cp>Brain imaging studies are often reported as showing that a mental state \"is\" a particular pattern of activity. Critics argue this confuses correlation with identity and that the inference from image to mind is far weaker than the headlines suggest. Is the criticism fair?\u003c/p>","students":[["Ravi","It is fair about the reporting and unfair about the science. No one in the field claims an image shows a thought. They claim a region’s activity covaries with a task."],["Sofia","Then why are the papers titled the way they are? If a discipline systematically publishes under claims it does not hold, the overclaiming is not only journalism."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Extremely busy” with no standard and no number, which is what everyone says. The second bullet is only formally met.","correct":false},{"text":"The repair is empty. “Let me know if there is anything I can do” puts the work of devising the remedy onto the coordinator. No shift is offered and no date named, so the third bullet fails.","correct":false},{"text":"“Brain imaging is a very valuable tool that has taught us a great deal” is a general endorsement standing in for a position on what an image supports.","correct":true},{"text":"The repayment is deferred indefinitely. “I will make it up to you soon when things calm down” names no date and no shift, so the third bullet fails.","correct":false},{"text":"Sofia’s specific claim — that the papers themselves are titled as overclaims — is never addressed.","correct":true},{"text":"The response is about media exaggeration, which both speakers already agree on, so it contributes nothing to the point at issue.","correct":true}],"key_html":"F3"}};</script>
