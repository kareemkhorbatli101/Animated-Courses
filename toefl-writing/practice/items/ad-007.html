<script>window.ITEM={"kind":"exercise","id":"AD 007","slug":"ad-007","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Health and medicine · responsibility: who should act","payload":{"Strategy":"ask which agent has both the information and the power","Grammar":"modals of obligation across agents","Vocabulary":"adherence, formulary, prescribing, gatekeeping","Convention":"assigning responsibility without blaming patients"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both cite shares of total use. Does the larger share settle it?\u003c/p>\u003cp>b.  What does Hana’s explanation of why doctors over-prescribe open up?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a formulary, and what is gatekeeping in clinical practice?\u003c/p>\u003cp>b.  Why is \"adherence\" better than \"patient compliance\"?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three targets in one sentence by tractability rather than size.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response rejects a comparison both classmates accept. Which one?\u003c/p>\u003cp>b.  It says awareness campaigns keep failing. What claim is that built on?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"those come apart sharply here\" — what is \"those\", and why is this sentence the pivot?\u003c/p>\u003cp>b.  \"the thing that makes refusal cheap\" — why define the target by its function rather than name the test first?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No. Share of use measures the size of a source, not how much of it can be removed per unit of effort, and those are different quantities. A large source that is hard to move may be a worse target than a small one that is easy.\u003c/p>\u003cp>b.  It reframes over-prescription as an incentive problem rather than an ignorance problem, which is what makes awareness campaigns the wrong instrument.\u003c/p>","P2":"\u003cp>a.  A formulary is the approved list of drugs a prescriber may use. Gatekeeping is the role of controlling access to a treatment or a referral — which is precisely the role that takes time to perform against a patient’s expectation.\u003c/p>\u003cp>b.  Because \"compliance\" frames the patient as obeying, which both misdescribes the relationship and locates the fault in them. \"Adherence\" describes the behaviour without the moralising, and is now the standard term.\u003c/p>","P3":"\u003cp>Model: \"Agriculture first because a few rules reach a few large buyers, prescribing second because the pressure is structural rather than informational, and course completion last because it is spread across everybody.\"\u003c/p>","F1":"\u003cp>a.  Share of total use. Hana implicitly defends her target despite it and Victor explicitly argues from it; the response says the comparison is the wrong one for choosing where effort goes.\u003c/p>\u003cp>b.  On Hana’s own account of the mechanism. If doctors already know and prescribe anyway because refusing is costly, then an intervention that supplies knowledge addresses something that was never missing.\u003c/p>","F2":"\u003cp>a.  Size of source and removability per unit of effort. It is the pivot because everything after it follows from treating those as two separate quantities, which is the response’s one original move.\u003c/p>\u003cp>b.  Because the function is the argument and the test is only one way of discharging it. Naming the function first makes the proposal survive being wrong about the specific technology.\u003c/p>","F3":"\u003cp>1.  It assigns responsibility to everyone, which is the one answer the question rules out by asking where the main effort should go.\u003c/p>\u003cp>2.  Nothing is weighed. The three causes are restated as a list of duties, and the recommendation — strict laws and education — is the generic pairing that follows from no particular analysis.\u003c/p>\u003cp>3.  Language: \"all the three causes\", \"a simple flu\" (flu is viral, so the example undercuts itself), \"the antibiotics for the future generations\".\u003c/p>"},"model":["Victor is right about the arithmetic and I do not think it decides the question. The relevant comparison is not which source is larger but which unit of effort removes more use, and those come apart sharply here. Agricultural use is concentrated in a small number of large buyers and is already regulated in several jurisdictions, so a single rule change moves a great deal; clinical over-prescription is spread across hundreds of thousands of individual consultations, each with its own two-minute pressure to agree.","That argues for Victor’s target and Hana’s diagnosis together. What she identifies is not a failure of knowledge — doctors know which infections are viral — but a structural incentive: refusing costs the clinician time they do not have. Campaigns aimed at prescriber awareness therefore keep failing, because awareness was never the binding constraint. If I had to put effort somewhere beyond agriculture, it would go to the thing that makes refusal cheap: a same-day point-of-care test, so the conversation ends with evidence rather than with a negotiation."],"model_html":"\u003cp>Victor is right about the arithmetic and I do not think it decides the question. The relevant comparison is not which source is larger but which unit of effort removes more use, and those come apart sharply here. Agricultural use is concentrated in a small number of large buyers and is already regulated in several jurisdictions, so a single rule change moves a great deal; clinical over-prescription is spread across hundreds of thousands of individual consultations, each with its own two-minute pressure to agree.\u003c/p>\u003cp>That argues for Victor’s target and Hana’s diagnosis together. What she identifies is not a failure of knowledge — doctors know which infections are viral — but a structural incentive: refusing costs the clinician time they do not have. Campaigns aimed at prescriber awareness therefore keep failing, because awareness was never the binding constraint. If I had to put effort somewhere beyond agriculture, it would go to the thing that makes refusal cheap: a same-day point-of-care test, so the conversation ends with evidence rather than with a negotiation.\u003c/p>","model_band":5,"degraded":["I think that all the three causes are responsible for this very serious problem which is threatening the health of all humanity. The doctors should be more careful and not give antibiotics for a simple flu, the patients should always finish their treatment even if they feel better, and the farmers should stop using antibiotics for the animals just to make them grow faster. Governments should make strict laws and also educate the population about this danger through campaigns in the media and in the schools. If everybody takes responsibility we can protect the antibiotics for the future generations."],"degraded_html":"\u003cp>I think that all the three causes are responsible for this very serious problem which is threatening the health of all humanity. The doctors should be more careful and not give antibiotics for a simple flu, the patients should always finish their treatment even if they feel better, and the farmers should stop using antibiotics for the animals just to make them grow faster. Governments should make strict laws and also educate the population about this danger through campaigns in the media and in the schools. If everybody takes responsibility we can protect the antibiotics for the future generations.\u003c/p>","degraded_band":3,"model_words":175,"fault_list":{"tag":"F3","faults":["It assigns responsibility to everyone, which is the one answer the question rules out by asking where the main effort should go.","Nothing is weighed. The three causes are restated as a list of duties, and the recommendation — strict laws and education — is the generic pairing that follows from no particular analysis.","Language: \"all the three causes\", \"a simple flu\" (flu is viral, so the example undercuts itself), \"the antibiotics for the future generations\"."],"html":["\u003cp>1.  It assigns responsibility to everyone, which is the one answer the question rules out by asking where the main effort should go.\u003c/p>","\u003cp>2.  Nothing is weighed. The three causes are restated as a list of duties, and the recommendation — strict laws and education — is the generic pairing that follows from no particular analysis.\u003c/p>","\u003cp>3.  Language: \"all the three causes\", \"a simple flu\" (flu is viral, so the example undercuts itself), \"the antibiotics for the future generations\".\u003c/p>"]},"prof_name":"Dr Ikeda","professor":"\u003cp>Antibiotic resistance is driven partly by over-prescription, partly by patients not completing courses, and partly by agricultural use. Where should the main effort to slow it be directed?\u003c/p>","students":[["Hana","At prescribing. Doctors write the prescriptions, and a meaningful share are written for conditions antibiotics cannot treat, often because the appointment is short and refusing takes longer than agreeing."],["Victor","At agriculture. Human medicine is a minority of total use in many countries. Tightening clinical prescribing while livestock use continues is rearranging the smaller half of the problem."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It assigns responsibility to everyone, which is the one answer the question rules out by asking where the main effort should go.","correct":true},{"text":"It opens by establishing the reader’s failure. “I sent you three weeks ago and I still have not received your confirmation” is an accusation in the first sentence.","correct":false},{"text":"The mark is mentioned and then explained away with “I was busy with other things”, which is the least informative possible account and leaves Lena unable to judge the risk.","correct":false},{"text":"It is about the writer’s feelings. “I feel terrible”, “thinking about it all weekend”, “really stupid of me”. The reader ends up reassuring the person who let them down.","correct":false},{"text":"Nothing is weighed. The three causes are restated as a list of duties, and the recommendation — strict laws and education — is the generic pairing that follows from no particular analysis.","correct":true},{"text":"Language: “all the three causes”, “a simple flu” (flu is viral, so the example undercuts itself), “the antibiotics for the future generations”.","correct":true}],"key_html":"F3"}};</script>
