<script>window.ITEM={"kind":"exercise","id":"EM 023","slug":"em-023","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"apologise to the person who was embarrassed, not the one who complained","Grammar":"that-clause after apologise","Vocabulary":"overrun, cut short, agenda, chair","Convention":"apologising for something that happened in public"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Two people were affected. Which one is harder to write to, and why does the task direct you at both?\u003c/p>\u003cp>b.  Your lateness was not entirely your fault. Does that help?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for a session to overrun, and what is it to cut a speaker short?\u003c/p>\u003cp>b.  Who chairs a seminar, and what do they actually do?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Apologise in one sentence that names the person who lost the ten minutes.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer asks permission before apologising to the third party. Why not simply do it?\u003c/p>\u003cp>b.  The train cancellation appears in the middle, briefly. What governs that placement?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I am sorry that it fell to you to rearrange the running order\" — what does the that-clause let the apology do?\u003c/p>\u003cp>b.  \"I should have allowed more margin ... and I did not.\" Why add the second clause when the first already concedes the point?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The visiting speaker. The task directs you at both because the chair absorbed the administrative cost and the guest absorbed the real one, and an apology that addresses only the person you report to is a political act rather than a moral one.\u003c/p>\u003cp>b.  Barely. A cancelled train explains the twenty minutes; it does not explain presenting without margin. The explanation covers the delay and the apology has to cover the judgement.\u003c/p>","P2":"\u003cp>a.  To overrun is to go past the allotted time; to cut someone short is to end their contribution early. The second is what happened to Dr Ferreira.\u003c/p>\u003cp>b.  The chair runs the session: introduces speakers, keeps time, manages questions. Reordering a session live is precisely their work, which is why it fell to Dr Petrov.\u003c/p>","P3":"\u003cp>Model: \"What I am most sorry about is that Dr Ferreira lost ten minutes of her slot because of it.\"\u003c/p>","F1":"\u003cp>a.  Because she is the chair’s guest and an unprompted email from a student might be unwelcome, or might reopen something already smoothed over. Asking shows the writer is thinking about the relationships rather than about clearing his own conscience.\u003c/p>\u003cp>b.  It is placed after the apology and before the part about Dr Ferreira, and kept to two sentences. Any earlier it reads as a defence; any longer and it becomes the subject of the email.\u003c/p>","F2":"\u003cp>a.  It lets the apology attach to a consequence rather than to an act. \"I am sorry for being late\" apologises for the thing the writer did; \"I am sorry that it fell to you\" apologises for what it cost the reader, which is what she actually experienced.\u003c/p>\u003cp>b.  Because \"I should have\" names the obligation and \"I did not\" states the failure. Together they close off the reading in which the writer is merely observing a general principle about margins.\u003c/p>","F3":"\u003cp>1.  It is an excuse. \"There was really nothing I could do about it\" denies responsibility entirely, and the question of leaving margin on a presentation morning never arises.\u003c/p>\u003cp>2.  Dr Ferreira is never mentioned. The third bullet fails, and the person who bore the actual cost is invisible.\u003c/p>\u003cp>3.  \"I hope it did not cause too many problems\" invites the reader to minimise it, and \"sorry for the inconvenience\" is the formula of an automated service message.\u003c/p>"},"model":["Dear Dr Petrov,","I am sorry about Thursday. Arriving twenty minutes into a session I was opening was not acceptable, and I am sorry that it fell to you to rearrange the running order with no notice.","The 8:40 from Elmfield was cancelled and the next one sat outside the station for fifteen minutes. I should have allowed more margin for a morning I was presenting in, and I did not.","What I am most sorry about is that Dr Ferreira lost ten minutes of her slot because of it. If you think it would be appropriate, I would like to write to her as well — I did not want to do so without checking with you first, since she was your guest.","It will not happen again.","With apologies,","Omar Khalil"],"model_html":"\u003cp>Dear Dr Petrov,\u003c/p>\u003cp>I am sorry about Thursday. Arriving twenty minutes into a session I was opening was not acceptable, and I am sorry that it fell to you to rearrange the running order with no notice.\u003c/p>\u003cp>The 8:40 from Elmfield was cancelled and the next one sat outside the station for fifteen minutes. I should have allowed more margin for a morning I was presenting in, and I did not.\u003c/p>\u003cp>What I am most sorry about is that Dr Ferreira lost ten minutes of her slot because of it. If you think it would be appropriate, I would like to write to her as well — I did not want to do so without checking with you first, since she was your guest.\u003c/p>\u003cp>It will not happen again.\u003c/p>\u003cp>With apologies,\u003c/p>\u003cp>Omar Khalil\u003c/p>","model_band":5,"degraded":["Dear Dr Petrov, I am very sorry for arriving late on Thursday but unfortunately my train was cancelled and then the next one was also delayed, so there was really nothing I could do about it. I hope it did not cause too many problems for the session. Sorry again for the inconvenience.","Omar"],"degraded_html":"\u003cp>Dear Dr Petrov, I am very sorry for arriving late on Thursday but unfortunately my train was cancelled and then the next one was also delayed, so there was really nothing I could do about it. I hope it did not cause too many problems for the session. Sorry again for the inconvenience.\u003c/p>\u003cp>Omar\u003c/p>","degraded_band":3,"model_words":133,"fault_list":{"tag":"F3","faults":["It is an excuse. \"There was really nothing I could do about it\" denies responsibility entirely, and the question of leaving margin on a presentation morning never arises.","Dr Ferreira is never mentioned. The third bullet fails, and the person who bore the actual cost is invisible.","\"I hope it did not cause too many problems\" invites the reader to minimise it, and \"sorry for the inconvenience\" is the formula of an automated service message."],"html":["\u003cp>1.  It is an excuse. \"There was really nothing I could do about it\" denies responsibility entirely, and the question of leaving margin on a presentation morning never arises.\u003c/p>","\u003cp>2.  Dr Ferreira is never mentioned. The third bullet fails, and the person who bore the actual cost is invisible.\u003c/p>","\u003cp>3.  \"I hope it did not cause too many problems\" invites the reader to minimise it, and \"sorry for the inconvenience\" is the formula of an automated service message.\u003c/p>"]},"scenario":"\u003cp>You arrived twenty minutes late to a seminar in which you were due to present first. The chair had to reorder the session and a visiting speaker lost ten minutes of their slot.\u003c/p>","bullets":["Apologise to the chair.","Say what happened.","Address the person who actually lost out."],"header":[["To:","l.petrov@northgate.ac.uk"],["Subject:","Thursday’s seminar — my apologies"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It is an excuse. “There was really nothing I could do about it” denies responsibility entirely, and the question of leaving margin on a presentation morning never arises.","correct":true},{"text":"Dr Ferreira is never mentioned. The third bullet fails, and the person who bore the actual cost is invisible.","correct":true},{"text":"It never engages Ines. Her argument is about the cost of decarbonisation; “the environment is more important than the money” answers an argument she did not make.","correct":false},{"text":"“I hope it did not cause too many problems” invites the reader to minimise it, and “sorry for the inconvenience” is the formula of an automated service message.","correct":true},{"text":"Nothing is added. Every point is a restatement, and “give extra support to the weaker ones” is exactly the vague remedy that the question about streaming exists to interrogate.","correct":false},{"text":"Language. “less people” (fewer people), “close the streets to the cars” (over-articled), “all the progress”, and a comma splice at “other streets, this is a problem”.","correct":false}],"key_html":"F3"}};</script>
