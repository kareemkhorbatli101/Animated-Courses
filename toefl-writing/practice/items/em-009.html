<script>window.ITEM={"kind":"exercise","id":"EM 009","slug":"em-009","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"ask for a place by removing the reasons to refuse you","Grammar":"the indirect speech act — a statement that works as a request","Vocabulary":"oversubscribed, waiting list, capped, prerequisite","Convention":"asking for an exception to a numerical limit"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The cap exists for a reason. What is it likely to be, and what follows for your argument?\u003c/p>\u003cp>b.  Why is “I really need this module” a weak argument however true?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish \u003cem>oversubscribed\u003c/em>, \u003cem>capped\u003c/em> and \u003cem>full\u003c/em>.\u003c/p>\u003cp>b.  What is a prerequisite, and why name yours unprompted?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Make a request without a question mark: one statement that functions as an ask.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer states the convenor’s reason for the cap, and agrees with it. Why is that the strongest move available?\u003c/p>\u003cp>b.  Two fallback offers are made. Which costs the convenor least, and why is that the one that will probably be taken?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “I wondered whether there might be any flexibility on the cap.” There is no question mark. What makes it a request?\u003c/p>\u003cp>b.  “I would not want to be the person who makes it unworkable” — what does this sentence do for the writer?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Seminar quality — above a certain number the discussion stops working. So the argument cannot be that one more makes no difference; it has to be that you will not be the one who breaks it, or that you can be added without counting against the cap.\u003c/p>\u003cp>b.  Because every student excluded from a full module needs it. Need does not distinguish you; a prerequisite, a specific dissertation topic and a willingness to audit do.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Full\u003c/strong> is the state; \u003cstrong>capped\u003c/strong> says a deliberate limit was set, which implies a person who could unset it; \u003cstrong>oversubscribed\u003c/strong> says demand exceeded places, which is the convenor’s framing and the sympathetic one.\u003c/p>\u003cp>b.  The condition you must have met to take the module. Naming yours unprompted removes the first and easiest reason to refuse you.\u003c/p>","P3":"\u003cp>Model: \u003cem>I wondered whether there might be any flexibility on the cap.\u003c/em>\u003c/p>\u003cp>It reports a thought rather than asking a question, so the reader is free to respond to it or not. That freedom is what makes it polite — and it is still unmistakably a request.\u003c/p>","F1":"\u003cp>a.  Because it proves you are not asking the convenor to pretend the problem does not exist. Once you have conceded that the cap is right, any flexibility he offers is his own judgement rather than a defeat — and people grant far more readily when agreeing does not mean admitting they were wrong.\u003c/p>\u003cp>b.  Auditing. It costs no assessment time, no marking and no place on the register, which means it falls outside the reason the cap exists. An offer engineered to sidestep the reader’s actual constraint is worth more than any amount of pleading.\u003c/p>","F2":"\u003cp>a.  Context and the modal stack. \u003cem>I wondered whether there might be any flexibility\u003c/em> could literally be a report of a private thought, but no reader takes it that way — an indirect speech act works precisely because both parties know what it means while neither has to say it.\u003c/p>\u003cp>b.  It pre-empts the convenor’s unspoken objection by voicing it first, and in doing so shows that the writer values the seminar for the same reason he does. It also makes refusal easy, which paradoxically makes acceptance likelier.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It argues against the cap.\u003c/strong> “one more student cannot make a big difference” tells the convenor his judgement is wrong, which is the one argument guaranteed not to work.\u003c/p>\u003cp>2.  \u003cstrong>No evidence and no fallback.\u003c/strong> “I am a very good student” is unverifiable; the prerequisite, the dissertation topic and any alternative to full enrolment are all missing, so bullets two and three are unaddressed.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Please add me to the list” is an instruction, “I am waiting for your positive answer” forecloses the refusal, and “very important for me” should be “to me”. There is also a comma splice at “the list, one more student”.\u003c/p>"},"model":["Dear Dr Nakamura,","I am writing about HIST430, which is showing as full. I wondered whether there might be any flexibility on the cap.","I took HIST212 last year and got a first, so I have the prerequisite, and my dissertation is on the Meiji land reforms — your seminar is the only place in the department where that material is taught. Without it I would be writing the dissertation from secondary sources alone.","I know a cap of sixteen is there to keep the discussion workable, and I would not want to be the person who makes it unworkable. If a seventeenth is genuinely too many, I would be glad to audit it instead and not take up assessment time, or to go on a waiting list in case anyone drops.","Thank you for considering it.","With best wishes,","Amelia Strand"],"model_html":"\u003cp>Dear Dr Nakamura,\u003c/p>\u003cp>I am writing about HIST430, which is showing as full. I wondered whether there might be any flexibility on the cap.\u003c/p>\u003cp>I took HIST212 last year and got a first, so I have the prerequisite, and my dissertation is on the Meiji land reforms — your seminar is the only place in the department where that material is taught. Without it I would be writing the dissertation from secondary sources alone.\u003c/p>\u003cp>I know a cap of sixteen is there to keep the discussion workable, and I would not want to be the person who makes it unworkable. If a seventeenth is genuinely too many, I would be glad to audit it instead and not take up assessment time, or to go on a waiting list in case anyone drops.\u003c/p>\u003cp>Thank you for considering it.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Amelia Strand\u003c/p>","model_band":5,"degraded":["Dear Professor,","I saw that your seminar HIST430 is full but I really need this module for my dissertation and it is very important for me. I am a very good student and I am sure I will not cause any problem in the class. Please add me to the list, one more student cannot make a big difference for the discussion. I am waiting for your positive answer.","Thank you."],"degraded_html":"\u003cp>Dear Professor,\u003c/p>\u003cp>I saw that your seminar HIST430 is full but I really need this module for my dissertation and it is very important for me. I am a very good student and I am sure I will not cause any problem in the class. Please add me to the list, one more student cannot make a big difference for the discussion. I am waiting for your positive answer.\u003c/p>\u003cp>Thank you.\u003c/p>","degraded_band":3,"model_words":141,"fault_list":{"tag":"F3","faults":["It argues against the cap. “one more student cannot make a big difference” tells the convenor his judgement is wrong, which is the one argument guaranteed not to work.","No evidence and no fallback. “I am a very good student” is unverifiable; the prerequisite, the dissertation topic and any alternative to full enrolment are all missing, so bullets two and three are unaddressed.","Language and register. “Please add me to the list” is an instruction, “I am waiting for your positive answer” forecloses the refusal, and “very important for me” should be “to me”. There is also a comma splice at “the list, one more student”."],"html":["\u003cp>1.  \u003cstrong>It argues against the cap.\u003c/strong> “one more student cannot make a big difference” tells the convenor his judgement is wrong, which is the one argument guaranteed not to work.\u003c/p>","\u003cp>2.  \u003cstrong>No evidence and no fallback.\u003c/strong> “I am a very good student” is unverifiable; the prerequisite, the dissertation topic and any alternative to full enrolment are all missing, so bullets two and three are unaddressed.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Please add me to the list” is an instruction, “I am waiting for your positive answer” forecloses the refusal, and “very important for me” should be “to me”. There is also a comma splice at “the list, one more student”.\u003c/p>"]},"scenario":"\u003cp>A seminar you need for your dissertation is full. The convenor has capped it at sixteen. You have the prerequisite, your dissertation depends on it, and you would take it pass/fail if that helped.\u003c/p>","bullets":["Ask to be added.","Show that you meet the requirements.","Reduce the cost to the convenor of saying yes."],"header":[["To:","h.nakamura@northgate.ac.uk"],["Subject:","HIST430 — request to be added to the seminar"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It never engages Marcus, whose entire point is that the market constrains invisibly. “Create whatever they want” is the claim he disputed.","correct":false},{"text":"The proposal ignores the question. “the government should give more money” is true of every health policy question and was not what was asked. No alternative to the charge is offered that could actually be implemented by a clinic.","correct":false},{"text":"No evidence and no fallback. “I am a very good student” is unverifiable; the prerequisite, the dissertation topic and any alternative to full enrolment are all missing, so bullets two and three are unaddressed.","correct":true},{"text":"Language and register. “Please add me to the list” is an instruction, “I am waiting for your positive answer” forecloses the refusal, and “very important for me” should be “to me”. There is also a comma splice at “the list, one more student”.","correct":true},{"text":"“Books that speak to young people today” is exactly the teacher-level selection Leyla identified as the problem, adopted without noticing. Language: a comma splice at “understood anything, we just memorised”; “old books” and “modern books” do no analytic work.","correct":false},{"text":"It argues against the cap. “one more student cannot make a big difference” tells the convenor his judgement is wrong, which is the one argument guaranteed not to work.","correct":true}],"key_html":"F3"}};</script>
