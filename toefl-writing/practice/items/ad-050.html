<script>window.ITEM={"kind":"exercise","id":"AD 050","slug":"ad-050","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Media and communication · value trade-off","payload":{"Strategy":"ask what each option does to the thing nobody is measuring","Grammar":"contrastive whereas","Vocabulary":"paywall, reach, sustainability, public good","Convention":"weighing access against survival"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Sofia argues about incentives and Ben about function. Can both be right?\u003c/p>\u003cp>b.  What does Ben mean by the accountability function?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a public good, and is journalism one?\u003c/p>\u003cp>b.  Distinguish reach from engagement.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the trade-off in one sentence that does not favour either side.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response uses two economic terms to split the question. What work do they do?\u003c/p>\u003cp>b.  The last clause says the subscribers pay a subsidy. Why end there?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"whereas Ben’s reach argument governs the part that has to be free\" — why \"whereas\"?\u003c/p>\u003cp>b.  \"which is an admission that the two functions have different economics\" — what does calling it an admission achieve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Yes. One is a claim about what funding does to editorial incentives; the other about what readership does to journalism’s civic effect. Neither contradicts the other.\u003c/p>\u003cp>b.  That journalism constrains those in power by making their conduct widely known — which depends on circulation rather than on revenue.\u003c/p>","P2":"\u003cp>a.  A good that is non-excludable and non-rival — nobody can be kept from the benefit and one person’s use does not reduce another’s. The accountability effect of journalism is one; the article itself need not be.\u003c/p>\u003cp>b.  Reach is how many are exposed; engagement is what they do with it. Ben’s argument needs only reach.\u003c/p>","P3":"\u003cp>Model: \"A subscription funds journalism well and a paywall defeats the part of it that works by being widely known.\"\u003c/p>","F1":"\u003cp>a.  They convert a values dispute into a classification one. Once the output is split into a club good and a public good, the funding question has a different answer for each, and the apparent conflict dissolves.\u003c/p>\u003cp>b.  Because it is the uncomfortable consequence the proposal carries, and declining to state it would make the solution look costless. Naming who pays is what distinguishes a policy from a wish.\u003c/p>","F2":"\u003cp>a.  Because both clauses are being asserted as true of different domains — straight contrast, not concession. Neither argument is being given up, which is the whole point of the split.\u003c/p>\u003cp>b.  It turns existing practice into evidence for the argument. Papers that drop the wall on important stories are already behaving as though the two functions differ, which is far stronger than asserting the distinction theoretically.\u003c/p>","F3":"\u003cp>1.  It never engages Ben, whose argument is that funded journalism nobody reads fails at its main job — cost is not his objection.\u003c/p>\u003cp>2.  The concession about poorer readers is treated as a pricing problem, which misses the point: the issue is the public effect of the reporting, not the affordability of the product.\u003c/p>\u003cp>3.  \"Readers must understand that good journalism has a cost\" is an exhortation rather than an argument. Language: \"the quality of the information\", \"the information\" over-articled; \"clickbait\" is used as an explanation rather than described.\u003c/p>"},"model":["Both are right and they are describing different products. Sofia is describing journalism as a service to its readers, which a subscription funds well; Ben is describing journalism as a check on power, which works through what everybody knows and cannot be funded by the people who benefit from it, because they are everybody. The first is a club good and the second is a public good, and expecting one funding model to produce both is the mistake.","That suggests the question is not which matters more but which part of the output should sit where. Several papers already do something like this, dropping the paywall on a story once it matters — which is an admission that the two functions have different economics. The honest version would be to decide in advance: investigations and anything bearing on a public decision outside the wall, everything else inside it. Sofia’s incentive argument then still holds for the funded part, whereas Ben’s reach argument governs the part that has to be free — and the cost of that free part is a subsidy the subscribers pay, which is worth saying out loud."],"model_html":"\u003cp>Both are right and they are describing different products. Sofia is describing journalism as a service to its readers, which a subscription funds well; Ben is describing journalism as a check on power, which works through what everybody knows and cannot be funded by the people who benefit from it, because they are everybody. The first is a club good and the second is a public good, and expecting one funding model to produce both is the mistake.\u003c/p>\u003cp>That suggests the question is not which matters more but which part of the output should sit where. Several papers already do something like this, dropping the paywall on a story once it matters — which is an admission that the two functions have different economics. The honest version would be to decide in advance: investigations and anything bearing on a public decision outside the wall, everything else inside it. Sofia’s incentive argument then still holds for the funded part, whereas Ben’s reach argument governs the part that has to be free — and the cost of that free part is a subsidy the subscribers pay, which is worth saying out loud.\u003c/p>","model_band":5,"degraded":["In my opinion quality journalism cannot be free because journalists need to be paid and investigations are very expensive to produce. If everything is free then newspapers have to depend on advertising and clickbait, which destroys the quality of the information. Of course it is a problem that poorer people cannot afford subscriptions, so maybe there could be reduced prices for students and low-income readers. But in general I think readers must understand that good journalism has a cost and that if they want it they have to pay for it."],"degraded_html":"\u003cp>In my opinion quality journalism cannot be free because journalists need to be paid and investigations are very expensive to produce. If everything is free then newspapers have to depend on advertising and clickbait, which destroys the quality of the information. Of course it is a problem that poorer people cannot afford subscriptions, so maybe there could be reduced prices for students and low-income readers. But in general I think readers must understand that good journalism has a cost and that if they want it they have to pay for it.\u003c/p>","degraded_band":3,"model_words":188,"fault_list":{"tag":"F3","faults":["It never engages Ben, whose argument is that funded journalism nobody reads fails at its main job — cost is not his objection.","The concession about poorer readers is treated as a pricing problem, which misses the point: the issue is the public effect of the reporting, not the affordability of the product.","\"Readers must understand that good journalism has a cost\" is an exhortation rather than an argument. Language: \"the quality of the information\", \"the information\" over-articled; \"clickbait\" is used as an explanation rather than described."],"html":["\u003cp>1.  It never engages Ben, whose argument is that funded journalism nobody reads fails at its main job — cost is not his objection.\u003c/p>","\u003cp>2.  The concession about poorer readers is treated as a pricing problem, which misses the point: the issue is the public effect of the reporting, not the affordability of the product.\u003c/p>","\u003cp>3.  \"Readers must understand that good journalism has a cost\" is an exhortation rather than an argument. Language: \"the quality of the information\", \"the information\" over-articled; \"clickbait\" is used as an explanation rather than described.\u003c/p>"]},"prof_name":"Dr Oyelowo","professor":"\u003cp>Many newspapers have moved behind paywalls, which has stabilised their finances but reduced readership. Others remain free and depend on advertising. Which matters more for journalism — reaching the largest audience, or being paid for by its readers?\u003c/p>","students":[["Sofia","Being paid by readers. Advertising funding makes the reader the product and rewards whatever holds attention, which is how we got the current mess. A paywall aligns the paper with the people who read it."],["Ben","Reach, because journalism that nobody outside the subscribing class reads is not doing the job. The accountability function works through being widely known, not through being well funded. A paywalled investigation that three thousand people read changes nothing."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Readers must understand that good journalism has a cost” is an exhortation rather than an argument. Language: “the quality of the information”, “the information” over-articled; “clickbait” is used as an explanation rather than described.","correct":true},{"text":"Overstatement destroys the evidence. “always late, every single morning” is refuted by one punctual day, and “this will affect my grade” overstates what attendance recording means.","correct":false},{"text":"The concession about poorer readers is treated as a pricing problem, which misses the point: the issue is the public effect of the reporting, not the affordability of the product.","correct":true},{"text":"It never engages Ben, whose argument is that funded journalism nobody reads fails at its main job — cost is not his objection.","correct":true},{"text":"No evidence and no fallback. “I am a very good student” is unverifiable; the prerequisite, the dissertation topic and any alternative to full enrolment are all missing, so bullets two and three are unaddressed.","correct":false},{"text":"“I have put a lot of effort into building it and it has saved the society a lot of time” is about the writer rather than the handover, and “will be able to use it without problems” is an assurance the writer cannot give.","correct":false}],"key_html":"F3"}};</script>
