<script>window.ITEM={"kind":"exercise","id":"AD 046","slug":"ad-046","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Policy choice — should X be required?","payload":{"Strategy":"find the axis of disagreement, then contribute a third thing","Grammar":"conditional qualification; the participial adverbial","Vocabulary":"stance markers that concede and reverse in one move","Convention":"engaging with classmates by name without merely agreeing"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Marco and Priya reach opposite conclusions. But are they arguing about the same thing? Write down, in one phrase each, what each of them is actually claiming.\u003c/p>\u003cp>b.  One is making a claim about \u003cem>values\u003c/em>; the other a claim about what will \u003cem>happen\u003c/em>. Which is which?\u003c/p>\u003cp class=\"note\">This question is the whole task in miniature. Two classmates who are answering different questions leave a gap, and the gap is where your own contribution goes.\u003c/p>"},{"tag":"P2","title":"Prime the stance markers","html":"\u003cp>a.  Order these by how strongly they concede, from weakest to strongest:\u003c/p>\u003cpre class=\"mono\">I suppose  ·  Granted  ·  Admittedly  ·  There is no denying that\u003c/pre>\u003cp>b.  Which of them set you up to reverse direction in the next clause, and which simply surrender the point?\u003c/p>\u003cp>c.  Supply the missing nouns for this debate: a rule that stops people acting is a d________ ; the act of making people follow it is e________ ; unclear wording that lets people escape is a________ .\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, concede Priya’s point and then take it away from her. Use the frame below, and do not exceed 30 words.\u003c/p>\u003cpre class=\"mono\">If the purpose of the rule were ________ , then ________ .\u003c/pre>"},{"tag":"P4","title":"Commit to a position","html":"\u003cp>Set a timer for 10 minutes and write your full response now. Before you start, write one sentence in the margin: \u003c/p>\u003cp class=\"note\">The one thing I will say that neither Marco nor Priya has said is …\u003c/p>\u003cp>If you cannot finish that sentence, you are not ready to write — and you are about to produce a response that only agrees.\u003c/p>"},{"tag":"P5","title":"Predict the pitfall","html":"\u003cp>Which of these openings cannot lead to a band-5 answer, and why?\u003c/p>\u003cpre class=\"mono\">(A) I agree with Marco. Academic honesty is very important for all\n    students in the university.\n(B) Priya’s objection is the serious one, but I think it misses what a\n    declaration is for.\n(C) I think both Marco and Priya make good points, and both sides of\n    this issue have advantages and disadvantages.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Give each of the six sentences a one-word job: concede, reframe, define, evidence, qualify, warn.\u003c/p>\u003cp>b.  Which single sentence is the \u003cem>contribution\u003c/em> — the thing neither classmate said?\u003c/p>\u003cp>c.  The response never uses the words \u003cem>I agree\u003c/em> or \u003cem>I disagree\u003c/em>. How does it make its position clear without them?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “If the purpose of the rule \u003cem>were\u003c/em> detection, it \u003cem>would\u003c/em> indeed be useless.” The writer agrees with this sentence — so why put it in the unreal conditional?\u003c/p>\u003cp>b.  “\u003cem>Applied indiscriminately\u003c/em>, the declaration becomes a box …” Expand this into a full clause. What has the participle bought in exchange for the words it saved?\u003c/p>\u003cp>c.  “Disclosure is worth requiring \u003cem>only where\u003c/em> …” Replace \u003cem>only where\u003c/em> with \u003cem>if\u003c/em>. Why is the original sharper?\u003c/p>\u003cp class=\"note\">The participial adverbial in (b) is structure 36 in Task 1. You drilled it as a sentence-building puzzle; here it is doing real argumentative work.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>Granted\u003c/em> — what does it do that \u003cem>I agree\u003c/em> cannot?\u003c/p>\u003cp>b.  The model says a rule can “\u003cem>quietly teach contempt\u003c/em>”. A rule cannot literally teach. What is this figure doing, and why is it safe to use in an academic discussion?\u003c/p>\u003cp>c.  Why “\u003cem>indiscriminately\u003c/em>” rather than “in all cases”?\u003c/p>\u003cp>d.  Distinguish: a deterrent, a safeguard, a formality, a sanction. Which one is the model accusing a badly-designed rule of becoming?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Below is another response to the same discussion. Using the official band descriptors at the front of this book, name the three things that hold it at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A different discussion: \u003cem>Should universities cap the number of hours students may work in paid jobs during term?\u003c/em> One classmate says yes, to protect study time; another says no, because poorer students need the income. In 40–60 words write only the concede-and-reframe move: grant the second classmate the premise, then show that it points somewhere neither of them went.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Marco: \u003cem>a grade is a claim about its owner, so undeclared help makes the claim false\u003c/em>. Priya: \u003cem>a rule that cannot be checked will be obeyed only by the people it was not aimed at\u003c/em>.\u003c/p>\u003cp>b.  Marco is arguing about \u003cstrong>values\u003c/strong> — what a grade ought to mean. Priya is arguing about \u003cstrong>consequences\u003c/strong> — what the rule will actually do. They are not contradicting each other at all: both could be entirely right.\u003c/p>\u003cp>Spotting that is what lets you write something new rather than picking a side. The model takes Priya’s factual premise, accepts it, and shows it does not reach Marco’s conclusion — because the rule has a purpose neither of them named.\u003c/p>","P2":"\u003cp>a.  I suppose &lt; Granted &lt; Admittedly &lt; There is no denying that.\u003c/p>\u003cp>b.  \u003cstrong>Granted\u003c/strong> and \u003cstrong>Admittedly\u003c/strong> are built for reversal: they are nearly always followed by \u003cem>but\u003c/em> or \u003cem>though\u003c/em>. \u003cem>There is no denying that\u003c/em> concedes so completely that it is hard to turn round afterwards, and \u003cem>I suppose\u003c/em> sounds grudging rather than fair-minded — it makes you look like a reluctant loser of the argument.\u003c/p>\u003cp>c.  a \u003cstrong>deterrent\u003c/strong> ; \u003cstrong>enforcement\u003c/strong> ; an \u003cstrong>ambiguity\u003c/strong> (or \u003cem>a loophole\u003c/em>).\u003c/p>","P3":"\u003cp>The model’s version: “If the purpose of the rule \u003cem>were detection\u003c/em>, it would indeed be useless.”\u003c/p>\u003cp>Notice the trick. You state your opponent’s strongest point as a \u003cstrong>hypothetical you do not hold\u003c/strong>. You have conceded nothing real, yet you sound completely fair.\u003c/p>","P4":"\u003cp>No single answer. But test your draft honestly: cover up Marco’s and Priya’s posts and read your response alone. If it still says something, you contributed. If it collapses into “yes, what Marco said”, you did not — and the rubric word is \u003cem>contribution\u003c/em>.\u003c/p>","P5":"\u003cp>\u003cstrong>(A) and (C) both fail.\u003c/strong>\u003c/p>\u003cp>(A) agrees and then restates a platitude. It can still reach 100 words, but it will reach them without adding anything — and the task asks for a \u003cem>contribution to the discussion in your own words\u003c/em>.\u003c/p>\u003cp>(C) is the commonest trap of all: the \u003cstrong>both-sides opening\u003c/strong>. It sounds balanced and is actually empty, because it postpones the moment of taking a position — and in a 10-minute task you may never arrive at one.\u003c/p>\u003cp>(B) names the strongest opposing argument in the first six words and announces that it is going to be answered. The reader now knows the position, the target, and that something is coming.\u003c/p>","F1":"\u003cp>a.  concede · reframe · define · evidence · qualify · warn.\u003c/p>\u003cp>b.  “The purpose, though, is not detection but definition.” Everything else supports it. Marco argued honesty, Priya argued enforceability; nobody had suggested the rule’s real value is forcing the \u003cem>department\u003c/em> to define its own standard.\u003c/p>\u003cp>c.  By \u003cem>doing\u003c/em> rather than \u003cem>announcing\u003c/em>. “misses what a declaration is for” is a disagreement; “I would qualify Marco’s position” is a partial agreement. Stating where you stand through the verbs costs no words and reads as far more confident than “I agree with …”.\u003c/p>","F2":"\u003cp>a.  Because the writer wants to grant the \u003cem>logic\u003c/em> without granting the \u003cem>premise\u003c/em>. The unreal form says: that conclusion would follow, in a world where the rule were about detection. Since we are not in that world, Priya’s objection is answered rather than denied. Agreeing with somebody’s reasoning while refusing their starting point is one of the most useful moves in academic writing, and English does it with the unreal conditional.\u003c/p>\u003cp>b.  Full clause: “\u003cem>If it is applied indiscriminately\u003c/em>, the declaration becomes …”. The participle saves three words, but what it really buys is \u003cstrong>subordination\u003c/strong>: the condition is pushed into the background so the main clause lands harder. Note the rule — the participle’s understood subject must be the subject of the main clause (\u003cem>the declaration\u003c/em>). Break that and you have written a dangling modifier.\u003c/p>\u003cp>c.  \u003cem>if\u003c/em> makes it a condition that might happen anywhere; \u003cstrong>only where\u003c/strong> makes it a boundary, and boundaries are what the question was about. The word \u003cem>only\u003c/em> is doing the argumentative work.\u003c/p>","F3":"\u003cp>a.  \u003cstrong>Granted\u003c/strong> concedes \u003cem>one specific point\u003c/em> while signalling that the main argument is still coming. \u003cem>I agree\u003c/em> concedes your whole position and leaves you nowhere to stand.\u003c/p>\u003cp>b.  It is a \u003cstrong>personification\u003c/strong> — the rule is given the power to teach. It is safe here because it is a \u003cem>conventional\u003c/em> one: institutions, laws and habits are routinely said to teach, reward or punish. Reach for a fresh, surprising metaphor in a 10-minute exam and you will usually produce something that reads as odd rather than vivid.\u003c/p>\u003cp>c.  \u003cem>in all cases\u003c/em> is neutral; \u003cstrong>indiscriminately\u003c/strong> carries the judgement inside the word — it means “in all cases, \u003cem>without thinking\u003c/em>”. One word that both describes and evaluates is exactly what the descriptor means by precise word choice.\u003c/p>\u003cp>d.  A \u003cstrong>formality\u003c/strong> — something performed because it is required, with no effect. (A deterrent discourages; a safeguard protects; a sanction punishes.)\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It is not a contribution.\u003c/strong> It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded \u003cem>part of an explanation, example or detail may be missing, unclear or irrelevant\u003c/em>.\u003c/p>\u003cp>2.  \u003cstrong>Padding instead of elaboration.\u003c/strong> “In my opinion” twice, “very important thing”, “honesty is the base of the education”. These reach the 100-word minimum without developing anything. Length is not the target; the minimum is a floor, not a goal.\u003c/p>\u003cp>3.  \u003cstrong>Accumulated error.\u003c/strong> “the academic honesty”, “very important thing” (a very important thing), “If … don’t say it, so the teacher” (a comma splice with a stray \u003cem>so\u003c/em>), “it is working good” (working well), “make some punishment” (impose a penalty). Individually survivable; together they are what the descriptor calls \u003cem>some noticeable lexical and grammatical errors\u003c/em>.\u003c/p>\u003cp class=\"note\">Worth noticing: this response is longer than the band-5 model. Students routinely believe more words mean more marks. They do not.\u003c/p>","F5":"\u003cp>A model move:\u003c/p>\u003cp>\u003cem>“The income argument is the one that has to be answered, and it is right as far as it goes. But it tells against a flat cap, not against any limit at all: a rule that bit only above, say, twenty-five hours would leave the students who need the money untouched and catch only the ones who are quietly failing.”\u003c/em>\u003c/p>\u003cp>Check yours: did you grant the premise \u003cstrong>in full\u003c/strong> before turning it? A half-granted premise reads as evasion, and the turn then convinces nobody.\u003c/p>"},"model":["Priya’s objection is the serious one, but I think it misses what a declaration is for. Granted, nobody can verify these statements, and if the purpose of the rule were detection, it would indeed be useless. The purpose, though, is not detection but definition. A disclosure requirement forces a department to say in writing what counts as acceptable assistance, and in my experience most students are unclear about that line rather than dishonest about crossing it.","I would qualify Marco’s position in one respect. Disclosure is worth requiring only where the assessment is genuinely a test of composition — a reflective essay, say, rather than a problem set whose answers are fixed. Applied indiscriminately, the declaration becomes a box that students tick without reading, and a rule that is routinely ignored quietly teaches contempt for the rules that do matter."],"model_html":"\u003cp>Priya’s objection is the serious one, but I think it misses what a declaration is for. Granted, nobody can verify these statements, and if the purpose of the rule were detection, it would indeed be useless. The purpose, though, is not detection but definition. A disclosure requirement forces a department to say in writing what counts as acceptable assistance, and in my experience most students are unclear about that line rather than dishonest about crossing it.\u003c/p>\u003cp>I would qualify Marco’s position in one respect. Disclosure is worth requiring only where the assessment is genuinely a test of composition — a reflective essay, say, rather than a problem set whose answers are fixed. Applied indiscriminately, the declaration becomes a box that students tick without reading, and a rule that is routinely ignored quietly teaches contempt for the rules that do matter.\u003c/p>","model_band":5,"degraded":["I agree with Marco’s opinion. In my opinion the disclosure of AI should be required because the academic honesty is very important thing in university life. If students use AI and don’t say it, so the teacher cannot know the real level of the student. Also Priya said nobody can verify, but I think the university can make some punishment for the students who are lying. In my country many universities are starting to do this rule and it is working good. So I believe that every student must write a declaration for every assignment because honesty is the base of the education."],"degraded_html":"\u003cp>I agree with Marco’s opinion. In my opinion the disclosure of AI should be required because the academic honesty is very important thing in university life. If students use AI and don’t say it, so the teacher cannot know the real level of the student. Also Priya said nobody can verify, but I think the university can make some punishment for the students who are lying. In my country many universities are starting to do this rule and it is working good. So I believe that every student must write a declaration for every assignment because honesty is the base of the education.\u003c/p>","degraded_band":3,"model_words":139,"fault_list":{"tag":"F4","faults":["It is not a contribution. It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded part of an explanation, example or detail may be missing, unclear or irrelevant.","Padding instead of elaboration. “In my opinion” twice, “very important thing”, “honesty is the base of the education”. These reach the 100-word minimum without developing anything. Length is not the target; the minimum is a floor, not a goal.","Accumulated error. “the academic honesty”, “very important thing” (a very important thing), “If … don’t say it, so the teacher” (a comma splice with a stray so), “it is working good” (working well), “make some punishment” (impose a penalty). Individually survivable; together they are what the descriptor calls some noticeable lexical and grammatical errors."],"html":["\u003cp>1.  \u003cstrong>It is not a contribution.\u003c/strong> It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded \u003cem>part of an explanation, example or detail may be missing, unclear or irrelevant\u003c/em>.\u003c/p>","\u003cp>2.  \u003cstrong>Padding instead of elaboration.\u003c/strong> “In my opinion” twice, “very important thing”, “honesty is the base of the education”. These reach the 100-word minimum without developing anything. Length is not the target; the minimum is a floor, not a goal.\u003c/p>","\u003cp>3.  \u003cstrong>Accumulated error.\u003c/strong> “the academic honesty”, “very important thing” (a very important thing), “If … don’t say it, so the teacher” (a comma splice with a stray \u003cem>so\u003c/em>), “it is working good” (working well), “make some punishment” (impose a penalty). Individually survivable; together they are what the descriptor calls \u003cem>some noticeable lexical and grammatical errors\u003c/em>.\u003c/p>"]},"prof_name":"Dr Lindqvist","professor":"\u003cp>Many universities now ask students to add a short statement declaring any use of generative AI tools in their written assignments. Supporters say disclosure protects academic honesty; critics say it is unenforceable and treats students as suspects. What do you think — should a declaration of AI use be a formal requirement for every written assignment? Why or why not?\u003c/p>","students":[["Marco","I support mandatory disclosure. Writing is assessed as evidence of a student’s own thinking, and if part of that thinking was outsourced, the grade no longer means what it claims to mean. A declaration is a small price for protecting the value of everyone’s degree."],["Priya","I’m against it. Nobody can actually verify these statements, so honest students will declare and dishonest ones simply won’t — the rule lands on exactly the people it doesn’t need to reach. We would be adding paperwork while changing nothing about real misconduct."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It is about the writer’s feelings. “I feel terrible”, “thinking about it all weekend”, “really stupid of me”. The reader ends up reassuring the person who let them down.","correct":false},{"text":"Padding instead of elaboration. “In my opinion” twice, “very important thing”, “honesty is the base of the education”. These reach the 100-word minimum without developing anything. Length is not the target; the minimum is a floor, not a goal.","correct":true},{"text":"Accumulated error. “the academic honesty”, “very important thing” (a very important thing), “If … don’t say it, so the teacher” (a comma splice with a stray so), “it is working good” (working well), “make some punishment” (impose a penalty). Individually survivable; together they are what the descriptor calls some noticeable lexical and grammatical errors.","correct":true},{"text":"It is not a contribution. It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":true},{"text":"It announces a decision the writer has not made. “I think I will not be able to come this year” converts an enquiry into a withdrawal notice, which is exactly the risk the third bullet asked her to avoid.","correct":false},{"text":"It is an excuse. “There was really nothing I could do about it” denies responsibility entirely, and the question of leaving margin on a presentation morning never arises.","correct":false}],"key_html":"F4"}};</script>
