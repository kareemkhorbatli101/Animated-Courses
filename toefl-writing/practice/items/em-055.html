<script>window.ITEM={"kind":"exercise","id":"EM 055","slug":"em-055","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"recommend the thing that fits the constraint they stated","Grammar":"comparative justification","Vocabulary":"commute, deposit, viewing, tenancy","Convention":"advising on a decision you have made differently yourself"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You preferred a flat. Why might that be irrelevant?\u003c/p>\u003cp>b.  Which of their three constraints is decisive, and why?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a deposit, and what is a viewing?\u003c/p>\u003cp>b.  Why does \"arriving three days before term\" matter for a tenancy?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Recommend in one sentence that refers to one of their constraints.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer discloses that they did the opposite. Why in the first sentence?\u003c/p>\u003cp>b.  The budget comparison corrects the obvious figure. Why is that the most useful paragraph?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the place nobody local would take\" — what is implied, and why not say it directly?\u003c/p>\u003cp>b.  \"Once I added those to my flat the gap was about thirty pounds a month\" — why first-person evidence here?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the preference was formed under different conditions — you were already here, you had contacts, you could view places. A preference is only transferable with the circumstances that produced it.\u003c/p>\u003cp>b.  The three days. Budget can be worked around and knowing nobody is temporary, but a flat search physically cannot be completed in that time from a standing start.\u003c/p>","P2":"\u003cp>a.  A deposit is money held against damage and returned at the end; a viewing is an appointment to see a property before renting it.\u003c/p>\u003cp>b.  Because tenancies require references, a guarantor and usually an in-person viewing, none of which can be arranged from abroad in three days.\u003c/p>","P3":"\u003cp>Model: \"Halls, mainly because three days is not enough time to find a flat here.\"\u003c/p>","F1":"\u003cp>a.  Because Wei will discover it anyway, and discovering it later would make the advice look like it was given without experience. Disclosing it immediately turns a weakness into a demonstration that the recommendation is about Wei rather than about the writer.\u003c/p>\u003cp>b.  Because the headline figure is the main reason people choose wrongly here, and Wei has a small budget so it is the number they will look at. Correcting it addresses the constraint that would otherwise override the advice.\u003c/p>","F2":"\u003cp>a.  That such flats are substandard or badly located. It is not said directly because the indirect form is both more vivid and more defensible — it reports a market fact rather than making a claim about particular properties.\u003c/p>\u003cp>b.  Because it is a concrete figure from a comparable case, and because it shows the writer actually did the arithmetic rather than repeating a received view. One personal number beats three general claims.\u003c/p>","F3":"\u003cp>1.  It recommends from the writer’s own experience with no reference to Wei’s constraints — the three days, the budget, knowing nobody, none appear. The second bullet fails.\u003c/p>\u003cp>2.  \"You can find good deals online if you look carefully\" is advice that cannot be acted on from abroad in three days, and the guarantor problem is never mentioned.\u003c/p>\u003cp>3.  No condition is given that would change the advice, so the third bullet fails; \"halls are mainly for first years who want to party\" is a stereotype offered as information; and there are two comma splices.\u003c/p>"},"model":["Hi Wei,","Halls for the first year, I think — though I did the opposite and was happy with it, so take that into account.","The thing that decides it is the three days. Finding a decent flat here takes two or three weeks of viewings, and anything you can secure from abroad without seeing it is either overpriced or the place nobody local would take. You would also need a UK guarantor or six months up front, which is a problem from outside the country. Halls want none of that and the contract is one term if it goes wrong.","On the budget: halls look more expensive on the headline figure, but bills, internet and the deposit are in it, and there is no agency fee. Once I added those to my flat the gap was about thirty pounds a month, not the two hundred it looked like.","What would flip this is if you already had two or three people to share with and one of them was here to do viewings. Then a flat is cheaper and better and I would say take it. On your own, three days out, I would not.","Dan"],"model_html":"\u003cp>Hi Wei,\u003c/p>\u003cp>Halls for the first year, I think — though I did the opposite and was happy with it, so take that into account.\u003c/p>\u003cp>The thing that decides it is the three days. Finding a decent flat here takes two or three weeks of viewings, and anything you can secure from abroad without seeing it is either overpriced or the place nobody local would take. You would also need a UK guarantor or six months up front, which is a problem from outside the country. Halls want none of that and the contract is one term if it goes wrong.\u003c/p>\u003cp>On the budget: halls look more expensive on the headline figure, but bills, internet and the deposit are in it, and there is no agency fee. Once I added those to my flat the gap was about thirty pounds a month, not the two hundred it looked like.\u003c/p>\u003cp>What would flip this is if you already had two or three people to share with and one of them was here to do viewings. Then a flat is cheaper and better and I would say take it. On your own, three days out, I would not.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Wei, I would definitely go for a private flat, halls are expensive and you have no privacy and you have to share a kitchen with people you do not know. I lived in a flat and it was much better, I had my own space and I could cook what I wanted. You can find good deals online if you look carefully. Halls are mainly for first years who want to party all the time. Good luck with the search!","Dan"],"degraded_html":"\u003cp>Hi Wei, I would definitely go for a private flat, halls are expensive and you have no privacy and you have to share a kitchen with people you do not know. I lived in a flat and it was much better, I had my own space and I could cook what I wanted. You can find good deals online if you look carefully. Halls are mainly for first years who want to party all the time. Good luck with the search!\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":196,"fault_list":{"tag":"F3","faults":["It recommends from the writer’s own experience with no reference to Wei’s constraints — the three days, the budget, knowing nobody, none appear. The second bullet fails.","\"You can find good deals online if you look carefully\" is advice that cannot be acted on from abroad in three days, and the guarantor problem is never mentioned.","No condition is given that would change the advice, so the third bullet fails; \"halls are mainly for first years who want to party\" is a stereotype offered as information; and there are two comma splices."],"html":["\u003cp>1.  It recommends from the writer’s own experience with no reference to Wei’s constraints — the three days, the budget, knowing nobody, none appear. The second bullet fails.\u003c/p>","\u003cp>2.  \"You can find good deals online if you look carefully\" is advice that cannot be acted on from abroad in three days, and the guarantor problem is never mentioned.\u003c/p>","\u003cp>3.  No condition is given that would change the advice, so the third bullet fails; \"halls are mainly for first years who want to party\" is a stereotype offered as information; and there are two comma splices.\u003c/p>"]},"scenario":"\u003cp>A classmate arriving from abroad asks whether to take university halls or a private flat. They have a small budget, arrive three days before term, and know nobody. You lived in a flat and preferred it.\u003c/p>","bullets":["Recommend one.","Explain the reasoning against their constraints, not yours.","Name the thing that would change your advice."],"header":[["To:","w.chen@northgate.ac.uk"],["Subject:","Halls or a flat — what I’d do in your position"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“A four-day week is a great idea in general” and “many companies have tried it with good results” answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure.","correct":false},{"text":"It recommends from the writer’s own experience with no reference to Wei’s constraints — the three days, the budget, knowing nobody, none appear. The second bullet fails.","correct":true},{"text":"Language and register. “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”.","correct":false},{"text":"“You can find good deals online if you look carefully” is advice that cannot be acted on from abroad in three days, and the guarantor problem is never mentioned.","correct":true},{"text":"“Obviously true because everybody knows” is precisely the reasoning the discussion was questioning, and Nadia’s trial evidence — the only thing that answers Lucas — is never mentioned.","correct":false},{"text":"No condition is given that would change the advice, so the third bullet fails; “halls are mainly for first years who want to party” is a stereotype offered as information; and there are two comma splices.","correct":true}],"key_html":"F3"}};</script>
