<script>window.ITEM={"kind":"exercise","id":"AD 074","slug":"ad-074","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Law · policy choice","payload":{"Strategy":"choose the rule that fails safely","Grammar":"relative clauses with whereby","Vocabulary":"burden, presumption, disclosure, remedy","Convention":"choosing who bears a burden of proof"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both speakers are predicting behaviour. What does each predict?\u003c/p>\u003cp>b.  Why does the location of the evidence matter to a burden rule?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a presumption, and what is disclosure?\u003c/p>\u003cp>b.  What is a remedy, in legal terms?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names the failure mode you accept.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Ren’s prediction as accurate. How does it still reject his conclusion?\u003c/p>\u003cp>b.  Why is visibility of failure treated as decisive?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a rule whereby the holder of the records decides what the court sees\" — what does the relative clause with whereby contribute?\u003c/p>\u003cp>b.  \"the error that shows up\" — why end on this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Sol predicts that a consumer-side burden systematically defeats valid claims. Ren predicts that a firm-side burden generates invalid ones that get settled rather than tested.\u003c/p>\u003cp>b.  Because a burden is only meaningful if the party bearing it can discharge it. Placing it on the side without access converts a standard of proof into an outcome.\u003c/p>","P2":"\u003cp>a.  A presumption is a conclusion the law draws unless rebutted; disclosure is the compelled production of documents to the other side.\u003c/p>\u003cp>b.  What a court can give a successful claimant — damages, repair, rescission. The adequacy of the remedy affects whether a claim is worth bringing at all.\u003c/p>","P3":"\u003cp>Model: \"Presume fault once a defect and a loss are shown, accepting that some weak claims will be settled rather than tested.\"\u003c/p>","F1":"\u003cp>a.  By treating it as a design problem with a known solution. A threshold requirement screens speculative claims without restoring the informational asymmetry, so his prediction becomes a constraint on how the presumption is built rather than an argument for the other rule.\u003c/p>\u003cp>b.  Because both rules produce errors, so the question is which errors a system can detect and correct. Invisible failures accumulate indefinitely; visible ones generate pressure for reform.\u003c/p>","F2":"\u003cp>a.  It compresses the mechanism of the objection into a single noun phrase, so the sentence can assert that such an arrangement is not a rule about fault. Spelling it out in a separate sentence would lose the force of the equation.\u003c/p>\u003cp>b.  Because it states the choice in one phrase and in the writer’s own terms. It also concedes openly that the preferred rule produces errors, which makes the position look chosen rather than assumed.\u003c/p>","F3":"\u003cp>1.  The argument is about resources and fairness in general, not about who holds the evidence — which is the actual basis for a burden rule.\u003c/p>\u003cp>2.  \"Most people are honest and would not waste their time\" answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.\u003c/p>\u003cp>3.  No threshold, no mechanism, no failure mode considered — \"consumer protection laws exist to defend the weaker party\" restates the conclusion as a premise.\u003c/p>"},"model":["Sol has the better rule, and Ren has identified the cost that has to be designed around rather than a reason to reject it.","The informational point is decisive. A burden placed on the party without access to the evidence is not a high standard but an unmeetable one, and a rule whereby the holder of the records decides what the court sees is not a rule about fault at all. That is the situation Sol is describing and it is indefensible.","Ren’s nuisance-claim worry is real but it is an argument about filtering, not about burdens. A presumption can be triggered only once a claimant shows a defect and a loss, which costs a genuine claimant little and a speculative one everything. Jurisdictions that reversed the burden without such a threshold did see the behaviour he predicts.","What settles it for me is which way each rule fails. Under Ren’s allocation the failures are invisible: consumers with good claims abandon them, and nothing appears in any statistic. Under Sol’s, the failures are visible and expensive — bad claims brought and settled — which is precisely why they get fixed. I would rather have the error that shows up."],"model_html":"\u003cp>Sol has the better rule, and Ren has identified the cost that has to be designed around rather than a reason to reject it.\u003c/p>\u003cp>The informational point is decisive. A burden placed on the party without access to the evidence is not a high standard but an unmeetable one, and a rule whereby the holder of the records decides what the court sees is not a rule about fault at all. That is the situation Sol is describing and it is indefensible.\u003c/p>\u003cp>Ren’s nuisance-claim worry is real but it is an argument about filtering, not about burdens. A presumption can be triggered only once a claimant shows a defect and a loss, which costs a genuine claimant little and a speculative one everything. Jurisdictions that reversed the burden without such a threshold did see the behaviour he predicts.\u003c/p>\u003cp>What settles it for me is which way each rule fails. Under Ren’s allocation the failures are invisible: consumers with good claims abandon them, and nothing appears in any statistic. Under Sol’s, the failures are visible and expensive — bad claims brought and settled — which is precisely why they get fixed. I would rather have the error that shows up.\u003c/p>","model_band":5,"degraded":["I think the burden should be on the company because large corporations have much more money and power than ordinary consumers, and they can afford expensive lawyers while a normal person cannot. It is simply not fair for a consumer to have to prove something when the company is hiding all the information. Ren is worried about false claims but I think most people are honest and would not waste their time making a claim with no reason. Consumer protection laws exist to defend the weaker party."],"degraded_html":"\u003cp>I think the burden should be on the company because large corporations have much more money and power than ordinary consumers, and they can afford expensive lawyers while a normal person cannot. It is simply not fair for a consumer to have to prove something when the company is hiding all the information. Ren is worried about false claims but I think most people are honest and would not waste their time making a claim with no reason. Consumer protection laws exist to defend the weaker party.\u003c/p>","degraded_band":3,"model_words":198,"fault_list":{"tag":"F3","faults":["The argument is about resources and fairness in general, not about who holds the evidence — which is the actual basis for a burden rule.","\"Most people are honest and would not waste their time\" answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.","No threshold, no mechanism, no failure mode considered — \"consumer protection laws exist to defend the weaker party\" restates the conclusion as a premise."],"html":["\u003cp>1.  The argument is about resources and fairness in general, not about who holds the evidence — which is the actual basis for a burden rule.\u003c/p>","\u003cp>2.  \"Most people are honest and would not waste their time\" answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.\u003c/p>","\u003cp>3.  No threshold, no mechanism, no failure mode considered — \"consumer protection laws exist to defend the weaker party\" restates the conclusion as a premise.\u003c/p>"]},"prof_name":"Dr Amari","professor":"\u003cp>In disputes between consumers and large firms, evidence is usually held by the firm. Some systems place the burden on the consumer to prove fault; others presume fault and require the firm to disprove it. Which allocation is better?\u003c/p>","students":[["Sol","Presume fault. The party holding the evidence should bear the burden, otherwise the rule rewards whoever controls the records."],["Ren","Reverse the burden and every disappointed customer has a free claim. Firms will settle nuisance cases rather than litigate, and the cost lands on honest customers in the price."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"No real alternatives. “I am flexible and any other time is good for me” offers nothing usable and contradicts the paragraph that has just explained a constraint. The third bullet is unmet.","correct":false},{"text":"“Most people are honest and would not waste their time” answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.","correct":true},{"text":"No threshold,
