<script>window.ITEM={"kind":"family","id":"BAS 019–026","slug":"bas-family-03","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 3 of 12 — conditionals","payload":{"Strategy":"conditionals let you argue about what is not the case","Grammar":"zero, first, second, third, mixed, inverted, and implied","Vocabulary":"unless, provided that, as long as, otherwise","Convention":"the unreal forms are the polite forms"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>Conditionals are worth more marks than any other family, because they do two jobs at once: they reason about possibilities, and they are the main politeness machinery of English. Everything you drill here comes back in the email task.\u003c/p>","preview":[{"tag":"P1","title":"Two steps back from now","html":"\u003cp>Fill the gaps with the pattern, not the example:\u003c/p>\u003cpre class=\"mono\">present real    If it ______ , the system ______ a fine.\nfuture possible If three ______ , it ______ go ahead.\npresent unreal  If I ______ eligible, I ______ apply.\npast unreal     If the parts ______ , we ______ finished.\u003c/pre>"},{"tag":"P2","title":"Why the past tense is polite","html":"\u003cp>Compare: \u003cem>If a room is free, can we have it?\u003c/em>  and  \u003cem>If a room were free, could we have it?\u003c/em>\u003c/p>\u003cp>Both ask the same thing. Which gives the reader an easier way to say no, and why does that make it the politer one?\u003c/p>"},{"tag":"P3","title":"Spot the one that is not a conditional","html":"\u003cpre class=\"mono\">(a) Unless you pay the deposit, your place will go.\n(b) Provided that you pay by Friday, you can still join.\n(c) Otherwise your place will go to someone else.\n(d) As long as the weather holds, we leave at seven.\u003c/pre>\u003cp>All four express a condition. Only one has no conditional clause at all. Which, and what is carrying the condition instead?\u003c/p>"}],"followup":[{"tag":"F1","title":"Shift the time","html":"\u003cp>Rewrite this as (a) a second conditional and (b) a third conditional, and say what changes about who is to blame.\u003c/p>\u003cpre class=\"mono\">If we book early, we get the lower rate.\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) If I will have time, I will call you.\n(b) If she would have told me, I would have helped.\n(c) Unless you don’t pay, your place will go.\n(d) If had I known, I would have come.\u003c/pre>"},{"tag":"F3","title":"Make it polite","html":"\u003cp>Rewrite each as an unreal conditional so the reader can refuse without embarrassment.\u003c/p>\u003cpre class=\"mono\">(a) Is a room free on Saturday? Give it to us.\n(b) Can you move the deadline? I need more time.\u003c/pre>"}],"keys":{"P1":"\u003cp>present real: \u003cstrong>comes · charges\u003c/strong>   future possible: \u003cstrong>sign up · will\u003c/strong>   present unreal: \u003cstrong>were · would\u003c/strong>   past unreal: \u003cstrong>had arrived · would have\u003c/strong>\u003c/p>\u003cp>The pattern is mechanical: each step away from reality is one step back in tense. That is the whole system.\u003c/p>","P2":"\u003cp>The second. The unreal form presents the room as probably \u003cem>not\u003c/em> free, so the reader is agreeing with your own expectation when they say no. The real form presupposes a room \u003cem>is\u003c/em> free, which makes refusing feel like a contradiction.\u003c/p>\u003cp>This is why the past tense is the polite tense in English. Distance in time stands for distance in imposition.\u003c/p>","P3":"\u003cp>\u003cstrong>(c)\u003c/strong>. There is no if-clause and no subordinate clause of any kind — \u003cem>otherwise\u003c/em> is an adverb that points back at the previous sentence and carries the condition on its own.\u003c/p>","F1":"\u003cp>(a) If we booked early, we would get the lower rate. — we are not booking early; no blame, just a possibility declined.\u003c/p>\u003cp>(b) If we had booked early, we would have got the lower rate. — we did not, the chance is gone, and this one sounds like a reproach. The third conditional is rarely neutral.\u003c/p>","F2":"\u003cp>(a) → If I have time … . No will in the if-clause.\u003c/p>\u003cp>(b) → If she had told me … . \u003cem>would have\u003c/em> belongs in the result clause only.\u003c/p>\u003cp>(c) → Unless you pay … . \u003cem>unless\u003c/em> already means \u003cem>if not\u003c/em>, so the extra negative reverses the meaning.\u003c/p>\u003cp>(d) → Had I known … . Once you invert, \u003cem>if\u003c/em> must go.\u003c/p>","F3":"\u003cp>(a) If a room were free on Saturday, we would be very glad of it.\u003c/p>\u003cp>(b) If there were any way of moving the deadline, it would make a great difference to me.\u003c/p>\u003cp>Notice what has happened in both: the imperative and the direct question have gone, and nobody is being asked to do anything. The request is now a description of a world.\u003c/p>"},"rows":[19,20,21,22,23,24,25,26]};</script>
