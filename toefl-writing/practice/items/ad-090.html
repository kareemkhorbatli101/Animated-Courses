<script>window.ITEM={"kind":"exercise","id":"AD 090","slug":"ad-090","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban studies · value trade-off","payload":{"Strategy":"weigh a benefit to residents against one to newcomers","Grammar":"fronted adverbials for contrast","Vocabulary":"tenure, displacement, density, affordability","Convention":"weighing incumbent interests against future ones"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Mark is making a representation argument. State it precisely.\u003c/p>\u003cp>b.  Why is displacement a different harm from change of character?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is tenure, and what is affordability as a technical term?\u003c/p>\u003cp>b.  Distinguish displacement from exclusion.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that names whose interest you are subordinating.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response splits Ada’s objection in two. Why does that strengthen the argument?\u003c/p>\u003cp>b.  Why does it concede her closing point in the last sentence?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Without that, Ada is right that...\" — what does the fronted adverbial accomplish?\u003c/p>\u003cp>b.  \"nobody is entitled to the version they arrived in\" — what kind of claim is this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the consultation process can only hear from people already present, so the interests of those excluded by high rents are systematically absent from the decision.\u003c/p>\u003cp>b.  Change of character is diffuse, gradual and falls on everyone; displacement is a severe loss concentrated on identifiable individuals, which makes it compensable and far harder to justify.\u003c/p>","P2":"\u003cp>a.  Tenure is the legal basis on which a home is held — ownership, social rent, private rent; affordability is usually defined as housing cost below a set share of income.\u003c/p>\u003cp>b.  Displacement removes people already there; exclusion keeps others out. Ada speaks for the displaced, Mark for the excluded.\u003c/p>","P3":"\u003cp>Model: \"Build, subordinating existing residents’ preferences to those priced out, but pay displacement in full with a right to return.\"\u003c/p>","F1":"\u003cp>a.  Because the two claims deserve different answers, and treating them together lets the weaker one borrow the force of the stronger. Separating them concedes the serious harm while denying that preference about character grounds a veto.\u003c/p>\u003cp>b.  Because it is correct about what usually happens. Granting it makes the compensation requirement a condition of the writer’s own position rather than a concession, and shows that the argument for building does not depend on ignoring her.\u003c/p>","F2":"\u003cp>a.  It makes the concession conditional on the proposal’s own safeguard, so the agreement with Ada is tied to the case where the recommendation is not followed. That is a way of conceding without retreating.\u003c/p>\u003cp>b.  A claim about entitlement rather than value. It accepts that something is lost and denies that the loss generates a right, which is the precise move needed to subordinate the interest without dismissing it.\u003c/p>","F3":"\u003cp>1.  Displacement — the concentrated harm at the centre of Ada’s case — is never mentioned, so nothing is weighed.\u003c/p>\u003cp>2.  \"A small number of homeowners\" mischaracterises her argument, which was about residents bearing disruption, not about property owners blocking change.\u003c/p>\u003cp>3.  \"The benefits are real and well documented\" asserts what she disputed without evidence, and \"preserve the character where possible\" is a qualification with no content.\u003c/p>"},"model":["Mark has the better argument and Ada has identified the harm that has to be paid for, which is a question of compensation rather than of veto.","His representation point is the strongest thing said here. Consultation systematically samples one side of the trade-off: present residents attend and absent ones cannot, so a process that weighs the testimony it receives will always understate the cost of not building. That is a structural bias, not a matter of who shouts loudest.","Ada’s objection should still be separated into two claims. Change of character is a real loss but not one that grounds a right — neighbourhoods change continuously and nobody is entitled to the version they arrived in. Displacement is different. Losing your home is a concentrated, severe and attributable harm, and the fact that the benefit is diffuse is exactly why it tends to go uncompensated.","So I would build, and subordinate the preferences of existing residents to the needs of people who cannot live there — while treating displacement as a cost to be paid in full, with a right to return at the old rent. Without that, Ada is right that city-wide benefit is a phrase that bills the poorest residents for everybody else’s housing."],"model_html":"\u003cp>Mark has the better argument and Ada has identified the harm that has to be paid for, which is a question of compensation rather than of veto.\u003c/p>\u003cp>His representation point is the strongest thing said here. Consultation systematically samples one side of the trade-off: present residents attend and absent ones cannot, so a process that weighs the testimony it receives will always understate the cost of not building. That is a structural bias, not a matter of who shouts loudest.\u003c/p>\u003cp>Ada’s objection should still be separated into two claims. Change of character is a real loss but not one that grounds a right — neighbourhoods change continuously and nobody is entitled to the version they arrived in. Displacement is different. Losing your home is a concentrated, severe and attributable harm, and the fact that the benefit is diffuse is exactly why it tends to go uncompensated.\u003c/p>\u003cp>So I would build, and subordinate the preferences of existing residents to the needs of people who cannot live there — while treating displacement as a cost to be paid in full, with a right to return at the old rent. Without that, Ada is right that city-wide benefit is a phrase that bills the poorest residents for everybody else’s housing.\u003c/p>","model_band":5,"degraded":["I think we need to build more housing because the housing crisis is affecting millions of people and young people cannot afford to live anywhere near their work. Of course we should be sensitive to existing communities and try to preserve the character of neighbourhoods where possible, but we cannot let a small number of homeowners block development that benefits everyone. Ada says developers always talk about city-wide benefits but in this case the benefits are real and well documented."],"degraded_html":"\u003cp>I think we need to build more housing because the housing crisis is affecting millions of people and young people cannot afford to live anywhere near their work. Of course we should be sensitive to existing communities and try to preserve the character of neighbourhoods where possible, but we cannot let a small number of homeowners block development that benefits everyone. Ada says developers always talk about city-wide benefits but in this case the benefits are real and well documented.\u003c/p>","degraded_band":3,"model_words":207,"fault_list":{"tag":"F3","faults":["Displacement — the concentrated harm at the centre of Ada’s case — is never mentioned, so nothing is weighed.","\"A small number of homeowners\" mischaracterises her argument, which was about residents bearing disruption, not about property owners blocking change.","\"The benefits are real and well documented\" asserts what she disputed without evidence, and \"preserve the character where possible\" is a qualification with no content."],"html":["\u003cp>1.  Displacement — the concentrated harm at the centre of Ada’s case — is never mentioned, so nothing is weighed.\u003c/p>","\u003cp>2.  \"A small number of homeowners\" mischaracterises her argument, which was about residents bearing disruption, not about property owners blocking change.\u003c/p>","\u003cp>3.  \"The benefits are real and well documented\" asserts what she disputed without evidence, and \"preserve the character where possible\" is a qualification with no content.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>Building dense housing in established neighbourhoods lowers city-wide rents over time but changes the character of those neighbourhoods and can displace existing residents during construction. Whose interests should planning serve?\u003c/p>","students":[["Ada","The people who already live there. They built the community, they will bear the disruption, and \"city-wide benefits\" is what developers always say."],["Mark","The people who cannot live there are not in the room. Every consultation hears from residents and never from the family priced into a two-hour commute, and planning that only listens to the present produces a city for whoever arrived first."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It argues against the cap. “one more student cannot make a big difference” tells the convenor his judgement is wrong, which is the one argument guaranteed not to work.","correct":false},{"text":"Language and register. “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).","correct":false},{"text":"It does exactly what the email was meant to undo: “students who are having difficulties”, “everybody who is struggling”. The second bullet is not merely unaddressed but actively worsened.","correct":false},{"text":"“The benefits are real and well documented” asserts what she disputed without evidence, and “preserve the character where possible” is a qualification with no content.","correct":true},{"text":"Displacement — the concentrated harm at the centre of Ada’s case — is never mentioned, so nothing is weighed.","correct":true},{"text":"“A small number of homeowners” mischaracterises her argument, which was about residents bearing disruption, not about property owners blocking change.","correct":true}],"key_html":"F3"}};</script>
