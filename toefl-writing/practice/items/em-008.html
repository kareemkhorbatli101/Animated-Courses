<script>window.ITEM={"kind":"exercise","id":"EM 008","slug":"em-008","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"offer something in return, and make the offer concrete","Grammar":"the conditional offer of reciprocity","Vocabulary":"accommodation, adjustment, invigilator, seating","Convention":"asking for an adjustment without disclosing more than you wish"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  How much medical detail does the office actually need?\u003c/p>\u003cp>b.  Three weeks is short. What should you do about that in the email itself?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  In an exams office, what is an \u003cem>adjustment\u003c/em>, and how does it differ from \u003cem>special consideration\u003c/em>?\u003c/p>\u003cp>b.  Who is the invigilator, and why might they need to know?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Explain the missing paperwork in one sentence that does not sound like an excuse.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  How much is disclosed about the condition, and how much about its effect? Why that balance?\u003c/p>\u003cp>b.  The writer offers three alternatives. What does offering a menu achieve that one request would not?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “which is why I wanted to raise it now rather than wait” — what does this clause pre-empt?\u003c/p>\u003cp>b.  Why \u003cem>whichever is least disruptive for you\u003c/em> rather than \u003cem>whichever you prefer\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Almost none about the condition; everything about the effect. The office is not assessing your health, it is allocating a seat — so what it needs is the functional consequence (front of room, away from the door) and evidence that it is real.\u003c/p>\u003cp>b.  Name it yourself, before they do. Acknowledging the short notice and explaining why it could not be helped removes the reply “you should have told us sooner”.\u003c/p>","P2":"\u003cp>a.  An \u003cstrong>adjustment\u003c/strong> changes the conditions in which you sit the exam. \u003cstrong>Special consideration\u003c/strong> is applied afterwards, to the mark, when something went wrong on the day. You are asking for the first.\u003c/p>\u003cp>b.  The person supervising the room. They need to know because the adjustment is useless if the invigilator moves you or does not know to face you when speaking.\u003c/p>","P3":"\u003cp>Model: \u003cem>There is nothing on my record yet because I was only diagnosed last month; the audiology report is dated 14 April and I can forward it today.\u003c/em>\u003c/p>\u003cp>A date and a document turn an explanation into evidence. Without them it is an assertion the office cannot act on.\u003c/p>","F1":"\u003cp>a.  One clause on the condition, two on the effect. That is the right balance because the effect is what the office can act on, and because you keep control of what you disclose.\u003c/p>\u003cp>b.  It converts a request they might refuse into a problem they can solve. A single demand has one answer; a menu almost always has at least one item the office can grant today.\u003c/p>","F2":"\u003cp>a.  The reply that you should have waited for the full assessment. By naming the slower, more correct route and explaining why you did not take it, you close off the easiest way to defer your request.\u003c/p>\u003cp>b.  Because \u003cem>you prefer\u003c/em> makes it a matter of their taste; \u003cem>least disruptive for you\u003c/em> names their actual constraint, which is workload. Speaking to the reader’s real problem is what gets a quick answer.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>No evidence and no offer.\u003c/strong> There is no report, no date and no alternative — the third bullet is unaddressed entirely, so the office has nothing to act on.\u003c/p>\u003cp>2.  \u003cstrong>It blames and then pressures.\u003c/strong> “the doctors in this country took very long time” and “which was not my fault” argue with an accusation nobody made; “otherwise I will not be able to do my exams properly” puts the consequence on them.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “sit in the front in the exams” (at the front, in exams), “very long time” (a very long time), “any document” (any documentation).\u003c/p>"},"model":["Dear Exams Office,","I am writing to ask about a seating adjustment for the May exams. I have a hearing impairment and need to sit near the front of the room and away from the corridor door, where the noise makes it hard to follow announcements.","There is nothing on my record yet because I was only diagnosed last month; the audiology report is dated 14 April and I can forward it today. I realise three weeks is not much notice, which is why I wanted to raise it now rather than wait for the full disability assessment.","If it helps, I am happy to sit in a different room, to take the paper at a different time, or to speak to the invigilator beforehand — whichever is least disruptive for you.","Thank you for looking at this.","Yours sincerely,","Tobias Lindemann — 2203118"],"model_html":"\u003cp>Dear Exams Office,\u003c/p>\u003cp>I am writing to ask about a seating adjustment for the May exams. I have a hearing impairment and need to sit near the front of the room and away from the corridor door, where the noise makes it hard to follow announcements.\u003c/p>\u003cp>There is nothing on my record yet because I was only diagnosed last month; the audiology report is dated 14 April and I can forward it today. I realise three weeks is not much notice, which is why I wanted to raise it now rather than wait for the full disability assessment.\u003c/p>\u003cp>If it helps, I am happy to sit in a different room, to take the paper at a different time, or to speak to the invigilator beforehand — whichever is least disruptive for you.\u003c/p>\u003cp>Thank you for looking at this.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Tobias Lindemann — 2203118\u003c/p>","model_band":5,"degraded":["Dear Sir or Madam,","I have a problem with my hearing and I need to sit in the front in the exams. Unfortunately I don’t have any document in my file because the doctors in this country took very long time to give me the diagnosis, which was not my fault. I hope you can arrange this for me because otherwise I will not be able to do my exams properly.","Thank you for understanding."],"degraded_html":"\u003cp>Dear Sir or Madam,\u003c/p>\u003cp>I have a problem with my hearing and I need to sit in the front in the exams. Unfortunately I don’t have any document in my file because the doctors in this country took very long time to give me the diagnosis, which was not my fault. I hope you can arrange this for me because otherwise I will not be able to do my exams properly.\u003c/p>\u003cp>Thank you for understanding.\u003c/p>","degraded_band":3,"model_words":142,"fault_list":{"tag":"F3","faults":["No evidence and no offer. There is no report, no date and no alternative — the third bullet is unaddressed entirely, so the office has nothing to act on.","It blames and then pressures. “the doctors in this country took very long time” and “which was not my fault” argue with an accusation nobody made; “otherwise I will not be able to do my exams properly” puts the consequence on them.","Language. “sit in the front in the exams” (at the front, in exams), “very long time” (a very long time), “any document” (any documentation)."],"html":["\u003cp>1.  \u003cstrong>No evidence and no offer.\u003c/strong> There is no report, no date and no alternative — the third bullet is unaddressed entirely, so the office has nothing to act on.\u003c/p>","\u003cp>2.  \u003cstrong>It blames and then pressures.\u003c/strong> “the doctors in this country took very long time” and “which was not my fault” argue with an accusation nobody made; “otherwise I will not be able to do my exams properly” puts the consequence on them.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “sit in the front in the exams” (at the front, in exams), “very long time” (a very long time), “any document” (any documentation).\u003c/p>"]},"scenario":"\u003cp>You have a hearing impairment and need to sit your exams near the front, away from the corridor door. You have no formal adjustment on file because you were only diagnosed last month. Exams begin in three weeks.\u003c/p>","bullets":["Explain what you need.","Say why there is nothing on file.","Offer whatever will help the office act quickly."],"header":[["To:","exams@northgate.ac.uk"],["Subject:","Seating adjustment request — exams, May sitting"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It blames and then pressures. “the doctors in this country took very long time” and “which was not my fault” argue with an accusation nobody made; “otherwise I will not be able to do my exams properly” puts the consequence on them.","correct":true},{"text":"The argument is anecdotal and then declarative: personal experience followed by “a human right in my opinion”, which converts an empirical question about access into an assertion that cannot be examined.","correct":false},{"text":"No evidence and no offer. There is no report, no date and no alternative — the third bullet is unaddressed entirely, so the office has nothing to act on.","correct":true},{"text":"“Students should choose based on what is right for them personally” is advice to individuals where the question is about an institutional measure, so the response never addresses the comparison it was asked to make.","correct":false},{"text":"Owen’s evidence — that turnout moves
