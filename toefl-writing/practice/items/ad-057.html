<script>window.ITEM={"kind":"exercise","id":"AD 057","slug":"ad-057","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Engineering · value trade-off","payload":{"Strategy":"price the trade-off in the units the decision is made in","Grammar":"result clauses with so ... that","Vocabulary":"tolerance, redundancy, overdesign, duty cycle","Convention":"trading cost against margin of safety"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Luc is not disagreeing that safety matters. What is he actually claiming?\u003c/p>\u003cp>b.  The prompt asks two questions. Why is the second one not a throwaway?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a tolerance, and what is redundancy?\u003c/p>\u003cp>b.  What is a duty cycle, and why would it change a margin?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that names the unit the trade-off is measured in.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response agrees with Luc’s arithmetic and refuses his conclusion. What is the dividing line?\u003c/p>\u003cp>b.  \"which is an argument she should want to hear\" — what is this doing for Hana’s position?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"If a standard is set so high that only two of three bridges are built\" — identify the structure and say why it suits this argument.\u003c/p>\u003cp>b.  \"made badly but legitimately\" — why concede the first adverb?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the trade-off is already being made implicitly, and that refusing to make it explicitly does not remove the risk but relocates it to places nobody is measuring.\u003c/p>\u003cp>b.  Because \"where should the balance sit\" and \"who should decide\" can have different answers. Agreeing that a trade-off exists does not settle who has the authority to make it, and that is the sharper question.\u003c/p>","P2":"\u003cp>a.  A tolerance is the permitted deviation from a specified value; redundancy is additional capacity or duplicate load paths so that one failure is not total.\u003c/p>\u003cp>b.  The pattern of loading over time. A structure loaded rarely and predictably needs a different margin from one cycled to near capacity daily, because fatigue accumulates.\u003c/p>","P3":"\u003cp>Model: \"The trade-off has to be priced in expected harm across the system, not cost per structure, and priced by governments rather than by engineers.\"\u003c/p>","F1":"\u003cp>a.  Between the calculation and the authority to make it. The response accepts that margins must be weighed against foregone projects, and denies that the weighing is an engineering decision — the engineer supplies the numbers and holds the floor.\u003c/p>\u003cp>b.  It reframes the systemic count as something that could support her goal rather than defeat it. If her standard costs net lives, she has a reason internal to her own commitments to revise it, which is a far more persuasive move than telling her that money matters too.\u003c/p>","F2":"\u003cp>a.  A result clause — so high that only two of three get built. It ties the consequence directly to the degree of the standard, which is exactly the relationship in dispute, and avoids asserting that high standards are bad in themselves.\u003c/p>\u003cp>b.  Because without it the sentence sounds like a defence of government competence, which nobody believes and which is not the point. Conceding that the decision is made badly isolates the real claim — that it is still the right body to make it — and makes that claim harder to dismiss.\u003c/p>","F3":"\u003cp>1.  \"Human life cannot be measured in money\" is asserted and then immediately contradicted by the request that governments \"find the money\", which is a measurement.\u003c/p>\u003cp>2.  Luc’s actual argument — that the unbuilt third bridge carries risk of its own — is never addressed; \"governments can always find the money if they really want to\" denies the premise without evidence.\u003c/p>\u003cp>3.  The prompt’s second question, who should decide, is not answered at all, and \"safety standards exist for a reason\" closes the discussion rather than contributing to it.\u003c/p>"},"model":["Luc is right about the arithmetic and wrong about who does it: the second half of the prompt is where this is decided.","Hana’s instinct is right at the level of a single component: an engineer who shaves a margin to save money on a load-bearing member has made an error, not a trade-off. But Luc has identified something real: margins are not free. If a standard is set so high that only two of three bridges are built, the risk has not been eliminated — it has been moved onto the road the third bridge would have replaced, where nobody is accountable for it.","The trade-off therefore has to be made in a common unit, and the only honest one is expected harm across the system rather than cost per structure. Once you count the third bridge, Hana’s standard may cost more lives than it saves, which is an argument she should want to hear.","That calculation is not an engineer’s to make, which is where I part from Luc. Their obligation is to state in numbers what each margin buys and costs, and to refuse to build below the floor. What to spend on avoided deaths is a decision made badly but legitimately by governments; an engineer who makes it privately substitutes their own risk appetite for everyone else’s."],"model_html":"\u003cp>Luc is right about the arithmetic and wrong about who does it: the second half of the prompt is where this is decided.\u003c/p>\u003cp>Hana’s instinct is right at the level of a single component: an engineer who shaves a margin to save money on a load-bearing member has made an error, not a trade-off. But Luc has identified something real: margins are not free. If a standard is set so high that only two of three bridges are built, the risk has not been eliminated — it has been moved onto the road the third bridge would have replaced, where nobody is accountable for it.\u003c/p>\u003cp>The trade-off therefore has to be made in a common unit, and the only honest one is expected harm across the system rather than cost per structure. Once you count the third bridge, Hana’s standard may cost more lives than it saves, which is an argument she should want to hear.\u003c/p>\u003cp>That calculation is not an engineer’s to make, which is where I part from Luc. Their obligation is to state in numbers what each margin buys and costs, and to refuse to build below the floor. What to spend on avoided deaths is a decision made badly but legitimately by governments; an engineer who makes it privately substitutes their own risk appetite for everyone else’s.\u003c/p>","model_band":5,"degraded":["I agree with Hana that safety should always come first because human life cannot be measured in money. Engineers have a professional and ethical responsibility to protect the public and if a design is not safe enough then it should not be built, no matter what it costs. Luc talks about bridges not being built but I think governments can always find the money if they really want to, especially for infrastructure which is so important for the economy. Safety standards exist for a reason and we should respect them."],"degraded_html":"\u003cp>I agree with Hana that safety should always come first because human life cannot be measured in money. Engineers have a professional and ethical responsibility to protect the public and if a design is not safe enough then it should not be built, no matter what it costs. Luc talks about bridges not being built but I think governments can always find the money if they really want to, especially for infrastructure which is so important for the economy. Safety standards exist for a reason and we should respect them.\u003c/p>","degraded_band":3,"model_words":223,"fault_list":{"tag":"F3","faults":["\"Human life cannot be measured in money\" is asserted and then immediately contradicted by the request that governments \"find the money\", which is a measurement.","Luc’s actual argument — that the unbuilt third bridge carries risk of its own — is never addressed; \"governments can always find the money if they really want to\" denies the premise without evidence.","The prompt’s second question, who should decide, is not answered at all, and \"safety standards exist for a reason\" closes the discussion rather than contributing to it."],"html":["\u003cp>1.  \"Human life cannot be measured in money\" is asserted and then immediately contradicted by the request that governments \"find the money\", which is a measurement.\u003c/p>","\u003cp>2.  Luc’s actual argument — that the unbuilt third bridge carries risk of its own — is never addressed; \"governments can always find the money if they really want to\" denies the premise without evidence.\u003c/p>","\u003cp>3.  The prompt’s second question, who should decide, is not answered at all, and \"safety standards exist for a reason\" closes the discussion rather than contributing to it.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>Engineers often face a choice between designing to the expected load with a modest safety margin, which is cheaper and lighter, and designing with substantial redundancy, which costs more and may never be needed. Where should the balance sit, and who should decide?\u003c/p>","students":[["Hana","Err on the side of redundancy. The cost of over-engineering is money; the cost of under-engineering can be lives. Those are not comparable quantities and should not be traded off."],["Luc","They are traded off, constantly, whether we admit it or not. A bridge built to Hana’s standard costs three times as much, so two of the three get built — and the people who would have used the third one drive on a worse road."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Human life cannot be measured in money” is asserted and then immediately contradicted by the request that governments “find the money”, which is a measurement.","correct":true},{"text":"Luc’s actual argument — that the unbuilt third bridge carries risk of its own — is never addressed; “governments can always find the money if they really want to” denies the premise without evidence.","correct":true},{"text":"The grievance and the request are fused, so the office must answer “who made the decision and on what basis” before it can address the place. The second bullet fails.","correct":false},{"text":"“I am sorry you were upset” apologises for her reaction rather than for the act, which is the standard non-apology.","correct":false},{"text":"The prompt’s second question, who should decide, is not answered at all, and “safety standards exist for a reason” closes the discussion rather than contributing to it.","correct":true},{"text":"“Any advice would be very helpful” invites exactly the wrong kind of response, and no student number is given.","correct":false}],"key_html":"F3"}};</script>
