<script>window.ITEM={"kind":"exercise","id":"EM 056","slug":"em-056","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"recommend against something you were asked to endorse","Grammar":"if I were you","Vocabulary":"intensive, credential, accredited, return on investment","Convention":"telling someone something they do not want to hear"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  They have already announced it. How does that change what you write?\u003c/p>\u003cp>b.  Why is \"I just do not think it is worth it\" insufficient?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does accredited mean, and who does the accrediting?\u003c/p>\u003cp>b.  What is a credential, and what makes one worth having?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in a way that does not require them to defend themselves.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The fourth paragraph distinguishes two things. What, and why does it matter?\u003c/p>\u003cp>b.  The writer supplies a sentence for the friend to tell their family. Why is that more than a kindness?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"which is a phrase rather than a status\" — what does this clause do to the course’s claim?\u003c/p>\u003cp>b.  \"I came out more doubtful than I expected\" — why report the change rather than just the conclusion?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It means the cost of changing their mind now includes embarrassment, so the email has to make reversing look like a decision rather than a retreat. Facts alone will not do it.\u003c/p>\u003cp>b.  Because it is a judgement without grounds, and against their enthusiasm a judgement will lose. What changes minds is checkable specifics they can verify themselves.\u003c/p>","P2":"\u003cp>a.  That a recognised body has assessed and approved the qualification. The accreditor is named and checkable — which is precisely what \"industry-recognised\" avoids.\u003c/p>\u003cp>b.  A qualification that signals something to a third party. It is worth having when the third party actually recognises it, which is an empirical question rather than a marketing one.\u003c/p>","P3":"\u003cp>Model: \"I had a proper look because you asked, and I came out more doubtful than I expected.\"\u003c/p>","F1":"\u003cp>a.  The quality of the content from the value of the certificate. It matters because Paulo may well learn something, so an attack on the whole thing would be both unfair and easy to dismiss — the precise objection is that the credential does not signal anything.\u003c/p>\u003cp>b.  It solves the real obstacle. The money is recoverable and the facts are checkable; what is not easily recovered is having told everyone. Supplying a true and creditable account removes the last reason to go ahead anyway.\u003c/p>","F2":"\u003cp>a.  It denies the claim its implied authority without calling anyone dishonest. \"Industry-recognised\" sounds like a status and is not one, and naming that is more damaging than any accusation would be.\u003c/p>\u003cp>b.  Because it shows the writer did not start from a conclusion. Reporting that you expected to find it fine makes the finding evidence rather than opinion, and it is much harder to dismiss as reflexive negativity.\u003c/p>","F3":"\u003cp>1.  No specifics. \"Looks like one of those scams\" is a characterisation rather than a finding, and nothing in it can be checked, so the second bullet fails.\u003c/p>\u003cp>2.  It leaves no way to proceed gracefully. \"Do not throw away 2400 pounds\" makes going ahead an act of stupidity, which tends to produce defensiveness rather than reconsideration. The third bullet fails.\u003c/p>\u003cp>3.  \"Employers do not care about these certificates at all\" overstates and is easy to refute with one counter-example, which would discredit the rest. Two comma splices.\u003c/p>"},"model":["Hi Paulo,","I had a proper look at the Meridian certificate because you asked, and I came out more doubtful than I expected. Writing it down in case any of it is useful before you pay.","Three things. It is not accredited by anyone — the site says \"industry-recognised\", which is a phrase rather than a status, and I could not find a named awarding body. The syllabus is twenty hours of video and no project work, so you would finish with nothing to show an employer. And the three testimonials on the site are the only graduates I could find anywhere; nobody on LinkedIn lists it.","None of that means the content is bad. It means the certificate itself probably does not do the thing you would be buying it for.","If I were you I would do the free Google one first — it is eight weeks, it has a capstone project, and if you still want something heavier afterwards you will know far better what you are buying. That is also a perfectly good thing to tell your family: you found a better starting point, which is true.","Say if you want me to look at anything else.","Dan"],"model_html":"\u003cp>Hi Paulo,\u003c/p>\u003cp>I had a proper look at the Meridian certificate because you asked, and I came out more doubtful than I expected. Writing it down in case any of it is useful before you pay.\u003c/p>\u003cp>Three things. It is not accredited by anyone — the site says \"industry-recognised\", which is a phrase rather than a status, and I could not find a named awarding body. The syllabus is twenty hours of video and no project work, so you would finish with nothing to show an employer. And the three testimonials on the site are the only graduates I could find anywhere; nobody on LinkedIn lists it.\u003c/p>\u003cp>None of that means the content is bad. It means the certificate itself probably does not do the thing you would be buying it for.\u003c/p>\u003cp>If I were you I would do the free Google one first — it is eight weeks, it has a capstone project, and if you still want something heavier afterwards you will know far better what you are buying. That is also a perfectly good thing to tell your family: you found a better starting point, which is true.\u003c/p>\u003cp>Say if you want me to look at anything else.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Paulo, Honestly I would not waste your money on that course, it looks like one of those scams that promise you a job and deliver nothing. There are loads of free resources online that teach exactly the same things, and employers do not care about these certificates at all, they only look at your projects and experience. I am sure you will find something better if you look around a bit more. Do not throw away 2400 pounds on this!","Dan"],"degraded_html":"\u003cp>Hi Paulo, Honestly I would not waste your money on that course, it looks like one of those scams that promise you a job and deliver nothing. There are loads of free resources online that teach exactly the same things, and employers do not care about these certificates at all, they only look at your projects and experience. I am sure you will find something better if you look around a bit more. Do not throw away 2400 pounds on this!\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":201,"fault_list":{"tag":"F3","faults":["No specifics. \"Looks like one of those scams\" is a characterisation rather than a finding, and nothing in it can be checked, so the second bullet fails.","It leaves no way to proceed gracefully. \"Do not throw away 2400 pounds\" makes going ahead an act of stupidity, which tends to produce defensiveness rather than reconsideration. The third bullet fails.","\"Employers do not care about these certificates at all\" overstates and is easy to refute with one counter-example, which would discredit the rest. Two comma splices."],"html":["\u003cp>1.  No specifics. \"Looks like one of those scams\" is a characterisation rather than a finding, and nothing in it can be checked, so the second bullet fails.\u003c/p>","\u003cp>2.  It leaves no way to proceed gracefully. \"Do not throw away 2400 pounds\" makes going ahead an act of stupidity, which tends to produce defensiveness rather than reconsideration. The third bullet fails.\u003c/p>","\u003cp>3.  \"Employers do not care about these certificates at all\" overstates and is easy to refute with one counter-example, which would discredit the rest. Two comma splices.\u003c/p>"]},"scenario":"\u003cp>A friend is about to pay £2,400 for an online certificate that promises to lead to data-analyst roles. You have looked at it and it is thin. They are enthusiastic and have already told family they are doing it.\u003c/p>","bullets":["Give your honest view.","Be specific about what is wrong with it.","Leave them a way to proceed without losing face."],"header":[["To:","p.santos@northgate.ac.uk"],["Subject:","That data course — what I found when I looked"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It leaves no way to proceed gracefully. “Do not throw away 2400 pounds” makes going ahead an act of stupidity, which tends to produce defensiveness rather than reconsideration. The third bullet fails.","correct":true},{"text":"No specifics. “Looks like one of those scams” is a characterisation rather than a finding, and nothing in it can be checked, so the second bullet fails.","correct":true},{"text":"The point about unmeasured subjects is a real one but it is asserted and dropped, and “each country should develop its own system” is the conclusion of no argument.","correct":false},{"text":"“Employers do not care about these certificates at all” overstates and is easy to refute with one counter-example, which would discredit the rest. Two comma splices.","correct":true},{"text":"“The only real solution” is asserted, with nothing about the energy cost that the prompt explicitly raises.","correct":false},{"text":"“The developers are offering money which shows they are being responsible” treats the offer as evidence of good faith rather than examining whether it replaces what is lost.","correct":false}],"key_html":"F3"}};</script>
