<script>window.ITEM={"kind":"exercise","id":"AD 097","slug":"ad-097","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Education · policy choice","payload":{"Strategy":"choose the option whose benefit is hardest to get otherwise","Grammar":"parallel structure in lists","Vocabulary":"streaming, mixed ability, attainment, differentiation","Convention":"choosing between two school structures"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Noor concedes Bea’s mechanism. What is her objection then?\u003c/p>\u003cp>b.  Why does the age of first grouping matter so much?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is differentiation, and what is streaming?\u003c/p>\u003cp>b.  Distinguish attainment from ability.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names what your option gives up.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response concedes that mixed-ability teaching also fails the lowest attainers. Why admit that?\u003c/p>\u003cp>b.  Why is the final paragraph’s test \"whose benefit cannot be obtained under the alternative\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a slower curriculum, lower expectations and less experienced teaching\" — why three items in that form?\u003c/p>\u003cp>b.  \"the gap that justified the placement widens until it justifies itself\" — what is being described?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the cost of the precision falls on the pupils it is least defensible to charge. She accepts that grouping improves pitching and denies that the gain justifies the distribution of the loss.\u003c/p>\u003cp>b.  Because an early placement is made on the least reliable evidence and is the most likely to become permanent, so the error compounds for the longest time.\u003c/p>","P2":"\u003cp>a.  Differentiation is adapting teaching to different learners within a class; streaming is assigning pupils to classes by attainment across subjects.\u003c/p>\u003cp>b.  Attainment is what a pupil has achieved so far; ability is a claim about capacity. Grouping measures the first and is routinely read as the second.\u003c/p>","P3":"\u003cp>Model: \"Mixed-ability classes with temporary in-class grouping, accepting that pitching will be harder, because permanence is what does the damage.\"\u003c/p>","F1":"\u003cp>a.  Because the concession is true and because it removes the easy objection. A position that denies any cost to mixed-ability teaching is not credible to anyone who has taught, and naming the cost lets the argument turn on which cost is worse.\u003c/p>\u003cp>b.  Because both options have benefits, so listing them settles nothing. Asking which benefit is unavailable under the other identifies what is genuinely at stake — and good teaching can improve a set but cannot move a pupil out of it.\u003c/p>","F2":"\u003cp>a.  The parallel noun phrases make the three effects read as one compound disadvantage rather than three separate complaints, which is the point: they arrive together and reinforce each other.\u003c/p>\u003cp>b.  A self-reinforcing loop. The placement produces the conditions that confirm it, so the evidence for the decision is partly created by the decision — which is why reviewing placements termly is the operative safeguard.\u003c/p>","F3":"\u003cp>1.  \"Good teachers can always find ways to help every student\" dismisses Bea’s practical objection by assertion, and would prove that no grouping is ever necessary.\u003c/p>\u003cp>2.  The argument is anecdotal — one school, poorly treated pupils — where the prompt points to evidence about attainment.\u003c/p>\u003cp>3.  \"Clever or stupid\" misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered.\u003c/p>"},"model":["Noor has the better of it, though not for the reason usually given, and Bea’s problem is real enough that the answer cannot simply be mixed-ability throughout.","The precision Bea describes is genuine: teaching a four-year span in one room is a practical impossibility, and pretending otherwise leaves the lowest attainers quietly unsupported in a different way. That is the cost of Noor’s position and it should be acknowledged.","But the evidence she points to is about something grouping does uniquely. A pupil placed low at seven receives a slower curriculum, lower expectations and less experienced teaching, and the gap that justified the placement widens until it justifies itself. That is a mechanism no amount of good teaching inside the set can offset, because it operates through what is taught rather than how well.","So I would choose mixed-ability classes with in-class grouping that is reviewed termly and never applied to the whole curriculum. It keeps the pitching Bea needs, it refuses the permanence that does the damage, and it is the one arrangement whose benefit cannot be obtained under the alternative — a pupil in the bottom stream cannot be regrouped by a better teacher."],"model_html":"\u003cp>Noor has the better of it, though not for the reason usually given, and Bea’s problem is real enough that the answer cannot simply be mixed-ability throughout.\u003c/p>\u003cp>The precision Bea describes is genuine: teaching a four-year span in one room is a practical impossibility, and pretending otherwise leaves the lowest attainers quietly unsupported in a different way. That is the cost of Noor’s position and it should be acknowledged.\u003c/p>\u003cp>But the evidence she points to is about something grouping does uniquely. A pupil placed low at seven receives a slower curriculum, lower expectations and less experienced teaching, and the gap that justified the placement widens until it justifies itself. That is a mechanism no amount of good teaching inside the set can offset, because it operates through what is taught rather than how well.\u003c/p>\u003cp>So I would choose mixed-ability classes with in-class grouping that is reviewed termly and never applied to the whole curriculum. It keeps the pitching Bea needs, it refuses the permanence that does the damage, and it is the one arrangement whose benefit cannot be obtained under the alternative — a pupil in the bottom stream cannot be regrouped by a better teacher.\u003c/p>","model_band":5,"degraded":["I think mixed ability classes are better because every child deserves an equal chance and it is wrong to label children as clever or stupid at a young age. This can damage their confidence and become a self-fulfilling prophecy. In my own school we were divided into groups and the students in the lower group were often treated badly by teachers and other students, which was very unfair. Bea says teachers cannot teach a wide range but good teachers can always find ways to help every student."],"degraded_html":"\u003cp>I think mixed ability classes are better because every child deserves an equal chance and it is wrong to label children as clever or stupid at a young age. This can damage their confidence and become a self-fulfilling prophecy. In my own school we were divided into groups and the students in the lower group were often treated badly by teachers and other students, which was very unfair. Bea says teachers cannot teach a wide range but good teachers can always find ways to help every student.\u003c/p>","degraded_band":3,"model_words":199,"fault_list":{"tag":"F3","faults":["\"Good teachers can always find ways to help every student\" dismisses Bea’s practical objection by assertion, and would prove that no grouping is ever necessary.","The argument is anecdotal — one school, poorly treated pupils — where the prompt points to evidence about attainment.","\"Clever or stupid\" misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered."],"html":["\u003cp>1.  \"Good teachers can always find ways to help every student\" dismisses Bea’s practical objection by assertion, and would prove that no grouping is ever necessary.\u003c/p>","\u003cp>2.  The argument is anecdotal — one school, poorly treated pupils — where the prompt points to evidence about attainment.\u003c/p>","\u003cp>3.  \"Clever or stupid\" misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered.\u003c/p>"]},"prof_name":"Professor Adeyemi","professor":"\u003cp>Schools can group pupils by attainment for core subjects or teach mixed-ability classes throughout. Grouping lets teaching be pitched precisely; mixed-ability classes avoid labelling pupils early and tend to lift the lowest attainers. Which should a school choose?\u003c/p>","students":[["Bea","Group them. A class spanning four years of attainment serves nobody — the teacher pitches to the middle and both ends are wasted."],["Noor","The evidence says the bottom set learns less, and children put in it at seven are still in it at sixteen. The precision is real but it is bought from the pupils who can least afford it."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Clever or stupid” misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered.","correct":true},{"text":"“Good teachers can always find ways to help every student” dismisses Bea’s practical objection by assertion, and would prove that no grouping is ever necessary.","correct":true},{"text":"The argument is anecdotal — one school, poorly treated pupils — where the prompt points to evidence about attainment.","correct":true},{"text":"No timings, no panel subject, no travel offer, no exit, and the register is institutional throughout — “we would be very pleased”, “very valuable” — which reads as a circular rather than an approach.","correct":false},{"text":"“Employers do not care about these certificates at all” overstates and is easy to refute with one counter-example, which would discredit the rest. Two comma splices.","correct":false},{"text":"It accuses and generalises. “You charged me”, “nobody did anything, as usual”. The second phrase turns one error into a character judgement about the department.","correct":false}],"key_html":"F3"}};</script>
