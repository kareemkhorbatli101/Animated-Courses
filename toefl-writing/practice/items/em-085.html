<script>window.ITEM={"kind":"exercise","id":"EM 085","slug":"em-085","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and chasing","payload":{"Strategy":"when the silence may be yours, check before you chase","Grammar":"present perfect continuous for duration","Vocabulary":"bounce, filter, resend, thread","Convention":"chasing when you are not sure the message arrived"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  There is a real chance the fault is yours. How should that shape the subject line?\u003c/p>\u003cp>b.  Why is \"I sent this eighteen days ago\" a risky opening?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for an email to bounce, and what is a filter?\u003c/p>\u003cp>b.  Why do large attachments and long threads cause problems?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in a way that assumes the message was lost rather than ignored.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The word \"chase\" never appears, nor does any reference to eighteen days. What replaces them?\u003c/p>\u003cp>b.  \"There is no urgency from my end\" — is that true, and does it matter?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I have been working on Chapter 4 in the meantime\" — why this tense, and what does the sentence do beyond reporting?\u003c/p>\u003cp>b.  \"please ignore this\" — what does giving the reader permission to do nothing achieve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The subject line should do the work of the apology: \"resending in case it did not arrive\" tells him before he opens it that this is not a complaint, and it offers the explanation that lets him act without embarrassment.\u003c/p>\u003cp>b.  Because it is a count of his silence. Even followed by courtesies it establishes that you have been keeping score, and it forecloses the face-saving explanation you want him to be able to use.\u003c/p>","P2":"\u003cp>a.  A bounce is a delivery failure returned to the sender; a filter diverts or blocks a message silently, which is the dangerous case because neither party knows.\u003c/p>\u003cp>b.  Size limits sit at several points between sender and recipient and are often lower than the sending limit, and long threads accumulate quoted attachments until the whole message exceeds them. Both fail quietly.\u003c/p>","P3":"\u003cp>Model: \"I am resending the Chapter 3 draft in case the original did not reach you.\"\u003c/p>","F1":"\u003cp>a.  A technical explanation that is plausible and flattering to nobody: a long thread and a 40 MB file. It accounts for the silence without attributing it, which is exactly what a chase to a senior person should do.\u003c/p>\u003cp>b.  Probably not quite, and it does not matter much — it is a conventional courtesy that lowers the pressure and is made true by the next clause, which shows she has not been blocked. The claim is doing social rather than factual work, and both parties know it.\u003c/p>","F2":"\u003cp>a.  Present perfect continuous, for an activity running from the past into the present. Beyond reporting, it removes his guilt: if she has been productive, his delay has cost her nothing, and there is no reproach to answer.\u003c/p>\u003cp>b.  It removes the obligation to reply to the chase itself, so the only remaining action is reading the chapter. A chase that generates an apologetic reply has consumed his attention without advancing anything.\u003c/p>","F3":"\u003cp>1.  It counts the days and reports the absence of feedback in the first sentence, which is an accusation however politely the rest is phrased.\u003c/p>\u003cp>2.  \"I am waiting to continue my work\" is pressure and probably untrue, and \"as soon as possible\" plus \"when I can expect them\" asks a busy supervisor to commit to a date.\u003c/p>\u003cp>3.  The resend is an afterthought in the final clause and repeats the original mistake — another large attachment to the same thread — so the third bullet fails.\u003c/p>"},"model":["Dear Professor Delacroix,","I am resending the Chapter 3 draft in case the original did not reach you — I attached it to a reply in a long thread and the file was rather large, so it may well have been stopped somewhere.","I have put it in the shared drive this time instead: the link is below and it should open without a login. There is no urgency from my end; I have been working on Chapter 4 in the meantime.","If it did arrive and you simply have not had a chance to look, please ignore this — I only wanted to rule out the possibility that it had gone astray.","With best wishes,","Mira Halvorsen"],"model_html":"\u003cp>Dear Professor Delacroix,\u003c/p>\u003cp>I am resending the Chapter 3 draft in case the original did not reach you — I attached it to a reply in a long thread and the file was rather large, so it may well have been stopped somewhere.\u003c/p>\u003cp>I have put it in the shared drive this time instead: the link is below and it should open without a login. There is no urgency from my end; I have been working on Chapter 4 in the meantime.\u003c/p>\u003cp>If it did arrive and you simply have not had a chance to look, please ignore this — I only wanted to rule out the possibility that it had gone astray.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Mira Halvorsen\u003c/p>","model_band":5,"degraded":["Dear Professor Delacroix, I sent you my Chapter 3 draft eighteen days ago but I have not received any feedback yet. I understand you are very busy but I am waiting to continue my work and I would really appreciate your comments as soon as possible. Could you please let me know when I can expect them? I am attaching the file again in case you did not receive it.","Mira"],"degraded_html":"\u003cp>Dear Professor Delacroix, I sent you my Chapter 3 draft eighteen days ago but I have not received any feedback yet. I understand you are very busy but I am waiting to continue my work and I would really appreciate your comments as soon as possible. Could you please let me know when I can expect them? I am attaching the file again in case you did not receive it.\u003c/p>\u003cp>Mira\u003c/p>","degraded_band":3,"model_words":116,"fault_list":{"tag":"F3","faults":["It counts the days and reports the absence of feedback in the first sentence, which is an accusation however politely the rest is phrased.","\"I am waiting to continue my work\" is pressure and probably untrue, and \"as soon as possible\" plus \"when I can expect them\" asks a busy supervisor to commit to a date.","The resend is an afterthought in the final clause and repeats the original mistake — another large attachment to the same thread — so the third bullet fails."],"html":["\u003cp>1.  It counts the days and reports the absence of feedback in the first sentence, which is an accusation however politely the rest is phrased.\u003c/p>","\u003cp>2.  \"I am waiting to continue my work\" is pressure and probably untrue, and \"as soon as possible\" plus \"when I can expect them\" asks a busy supervisor to commit to a date.\u003c/p>","\u003cp>3.  The resend is an afterthought in the final clause and repeats the original mistake — another large attachment to the same thread — so the third bullet fails.\u003c/p>"]},"scenario":"\u003cp>You sent a draft chapter to your supervisor eighteen days ago and have heard nothing. He is usually prompt. You attached it to a reply in a long thread and the file was 40 MB.\u003c/p>","bullets":["Check that it arrived.","Avoid implying he has ignored you.","Make it trivially easy to get the file now."],"header":[["To:","r.delacroix@northgate.ac.uk"],["Subject:","Chapter 3 draft — resending in case it did not arrive"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: “the topography”, “the bicycle”, “way of transport” (means of transport), “make campaigns” (run campaigns).","correct":false},{"text":"“I am waiting to continue my work” is pressure and probably untrue, and “as soon as possible” plus “when I can expect them” asks a busy supervisor to commit to a date.","correct":true},{"text":"“Managers can monitor the results carefully to make sure the data is accurate” proposes more observation as the cure for an observation effect, which makes it worse.","correct":false},{"text":"It counts the days and reports the absence of feedback in the first sentence, which is an accusation however politely the rest is phrased.","correct":true},{"text":"“A four-day week is a great idea in general” and “many companies have tried it with good results” answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure.","correct":false},{"text":"The resend is an afterthought in the final clause and repeats the original mistake — another large attachment to the same thread — so the third bullet fails.","correct":true}],"key_html":"F3"}};</script>
