<script>window.ITEM={"kind":"exercise","id":"AD 089","slug":"ad-089","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Information science · agree / disagree","payload":{"Strategy":"distinguish a problem of scale from a problem of kind","Grammar":"correlative conjunctions","Vocabulary":"curation, provenance, moderation, amplification","Convention":"arguing about whether something is genuinely new"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Felix’s argument has a form. What is it, and what is its weakness?\u003c/p>\u003cp>b.  What would make the current case different in kind rather than degree?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is provenance, and what is amplification?\u003c/p>\u003cp>b.  What is curation, and who used to do it?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that names what is new.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response concedes the historical parallel. How does it still establish novelty?\u003c/p>\u003cp>b.  Why does it say false claims are \"cheaper to make emotionally compelling\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"both that Felix is right about the panic and that Rosa is right about the mechanism\" — what do the correlatives do?\u003c/p>\u003cp>b.  \"whose errors were not systematically correlated with falsity\" — why the careful qualification?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  An induction from past cases: previous panics were overblown, therefore this one is. Its weakness is that it cannot distinguish a case that is genuinely different, and it ignores what the adaptations cost.\u003c/p>\u003cp>b.  A mechanism that selects for falsity rather than merely permitting it — something that makes false content systematically more likely to spread than true content.\u003c/p>","P2":"\u003cp>a.  Provenance is the traceable origin of a claim or document; amplification is the process by which a system increases a message’s reach.\u003c/p>\u003cp>b.  Curation is selecting and organising what gets circulated; editors, publishers and broadcasters used to do it, slowly and with mixed motives.\u003c/p>","P3":"\u003cp>Model: \"What is new is a distribution system that selects for emotional response, and so favours claims unconstrained by what happened.\"\u003c/p>","F1":"\u003cp>a.  By attacking the structure of Felix’s inference rather than his examples. An argument that would have been available in every past case cannot distinguish the case where the alarm is justified, so it cannot settle this one.\u003c/p>\u003cp>b.  Because it names the asymmetry precisely. A true account is limited by the facts; a false one can be optimised freely, so under a system that ranks by emotional response falsehood has a structural advantage.\u003c/p>","F2":"\u003cp>a.  \"Both ... and\" marks the two concessions as a single coordinated position rather than as a hedge, which matters because the response is agreeing with speakers who think they disagree.\u003c/p>\u003cp>b.  Because gatekeepers were obviously unreliable, and claiming otherwise would be easy to refute. The qualification concedes their failures while identifying the property that matters — their errors were not aligned with falsity, and a ranking algorithm’s are.\u003c/p>","F3":"\u003cp>1.  \"This time it really is different because the scale is so much bigger\" concedes that the difference is one of degree, which is exactly Felix’s point.\u003c/p>\u003cp>2.  Rosa’s argument about selection and engagement ranking — the one mechanism in the discussion — is never used.\u003c/p>\u003cp>3.  \"Companies should take more responsibility\" is a recommendation where the question asked whether the threat is new, and the elections and pandemic examples are asserted rather than analysed.\u003c/p>"},"model":["Rosa has identified something genuinely new, and Felix’s historical parallel is both correct and insufficient.","His argument is an induction from past panics, and its weakness is that it would have been equally available at every point in the history he cites, including the ones where the adaptation took a century and a great many people died in the interval. \"We adapted\" describes an outcome, not a mechanism, and it says nothing about cost.","What is new is neither the falsehood nor the speed but the selection. Earlier media had gatekeepers who were slow, biased and often wrong, but whose errors were not systematically correlated with falsity. An engagement-ranked feed is different in kind: it selects for emotional response, and false claims are cheaper to make emotionally compelling because they are not constrained by what happened. That is a mechanism which actively favours misinformation.","So I would say both that Felix is right about the panic and that Rosa is right about the mechanism. The institutions he expects us to build will have to do something no previous institution did — not filter content, but alter what the distribution system rewards."],"model_html":"\u003cp>Rosa has identified something genuinely new, and Felix’s historical parallel is both correct and insufficient.\u003c/p>\u003cp>His argument is an induction from past panics, and its weakness is that it would have been equally available at every point in the history he cites, including the ones where the adaptation took a century and a great many people died in the interval. \"We adapted\" describes an outcome, not a mechanism, and it says nothing about cost.\u003c/p>\u003cp>What is new is neither the falsehood nor the speed but the selection. Earlier media had gatekeepers who were slow, biased and often wrong, but whose errors were not systematically correlated with falsity. An engagement-ranked feed is different in kind: it selects for emotional response, and false claims are cheaper to make emotionally compelling because they are not constrained by what happened. That is a mechanism which actively favours misinformation.\u003c/p>\u003cp>So I would say both that Felix is right about the panic and that Rosa is right about the mechanism. The institutions he expects us to build will have to do something no previous institution did — not filter content, but alter what the distribution system rewards.\u003c/p>","model_band":5,"degraded":["I agree that online misinformation is a very serious new problem because social media allows false information to spread to millions of people within minutes, which was impossible in the past. We have seen the terrible consequences during elections and the pandemic. Felix says that every new technology causes panic but I think this time it really is different because the scale is so much bigger. Social media companies should take more responsibility for what is published on their platforms."],"degraded_html":"\u003cp>I agree that online misinformation is a very serious new problem because social media allows false information to spread to millions of people within minutes, which was impossible in the past. We have seen the terrible consequences during elections and the pandemic. Felix says that every new technology causes panic but I think this time it really is different because the scale is so much bigger. Social media companies should take more responsibility for what is published on their platforms.\u003c/p>","degraded_band":3,"model_words":191,"fault_list":{"tag":"F3","faults":["\"This time it really is different because the scale is so much bigger\" concedes that the difference is one of degree, which is exactly Felix’s point.","Rosa’s argument about selection and engagement ranking — the one mechanism in the discussion — is never used.","\"Companies should take more responsibility\" is a recommendation where the question asked whether the threat is new, and the elections and pandemic examples are asserted rather than analysed."],"html":["\u003cp>1.  \"This time it really is different because the scale is so much bigger\" concedes that the difference is one of degree, which is exactly Felix’s point.\u003c/p>","\u003cp>2.  Rosa’s argument about selection and engagement ranking — the one mechanism in the discussion — is never used.\u003c/p>","\u003cp>3.  \"Companies should take more responsibility\" is a recommendation where the question asked whether the threat is new, and the elections and pandemic examples are asserted rather than analysed.\u003c/p>"]},"prof_name":"Dr Alvarez","professor":"\u003cp>It is often claimed that online misinformation represents a new kind of threat. Sceptics reply that rumour, propaganda and forgery are as old as writing, and that the panic is a familiar response to a new medium. Is there anything new here?\u003c/p>","students":[["Rosa","The mechanism is new. Earlier falsehoods needed a printer or a broadcaster; now the distribution is automated and optimised for engagement, which selects for exactly the content that misleads."],["Felix","Every new medium has been described in those words. The printing press produced a century of witch-hunting manuals. We adapted, built institutions, and we will again."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language and register. “Please add me to the list” is an instruction, “I am waiting for your positive answer” forecloses the refusal, and “very important for me” should be “to me”. There is also a comma splice at “the list, one more student”.","correct":false},{"text":"“Companies should take more responsibility” is a recommendation where the question asked whether the threat is new, and the elections and pandemic examples are asserted rather than analysed.","correct":true},{"text":"Rosa’s argument about selection and engagement ranking — the one mechanism in the discussion — is never used.","correct":true},{"text":"It ignores the published material and the notice period, and closes with “Thank you for understanding”, which thanks them in advance for accepting what has already been decided.","correct":false},{"text":"It defends rather than concedes: “I was only trying to help”, “nobody was answering them”, “everything I wrote was completely true as you know” — all three answer a charge that was not made, and the authority question is never acknowledged.","correct":false},{"text":"“This time it really is different because the scale is so much bigger” concedes that the difference is one of degree, which is exactly Felix’s point.","correct":true}],"key_html":"F3"}};</script>
