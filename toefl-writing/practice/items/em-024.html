<script>window.ITEM={"kind":"exercise","id":"EM 024","slug":"em-024","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"when you cannot repair it, say so and offer what you can","Grammar":"conditional repair offer","Vocabulary":"irretrievable, back-up, overwrite, salvage","Convention":"apologising for something that cannot be undone"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The worst thing you can do here is delay. Why?\u003c/p>\u003cp>b.  What is the difference between apologising and reporting, and which does the first paragraph need to do?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to overwrite a file, and what is salvage?\u003c/p>\u003cp>b.  Distinguish irretrievable from irreversible.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the loss precisely in one sentence, with a number in it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Two different repairs are offered. What determines which is appropriate, and why does the writer not simply choose?\u003c/p>\u003cp>b.  Paragraph three is not an apology at all. What is it for?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"what is gone is the manual recoding ... and the Tuesday corrections\" — why a wh-cleft?\u003c/p>\u003cp>b.  \"This was careless.\" Why end on three words?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because every hour of delay is an hour she may spend building on something that no longer exists, and because a loss reported late looks concealed even when it was not.\u003c/p>\u003cp>b.  It needs to do both, in that order: the fact first because she needs it operationally, the apology immediately after because she needs that too. Reporting without apologising is cold; apologising before reporting delays the thing she has to act on.\u003c/p>","P2":"\u003cp>a.  To overwrite is to replace a file’s contents, destroying what was there. Salvage is recovering what can still be used from what remains.\u003c/p>\u003cp>b.  Irretrievable means it cannot be got back; irreversible means the action cannot be undone. The recoding is irretrievable; the overwrite was irreversible. Being precise about which is which is how you tell someone the real size of the loss.\u003c/p>","P3":"\u003cp>Model: \"There is a back-up from Sunday night, so what is gone is the manual recoding and the Tuesday corrections — about three days.\"\u003c/p>","F1":"\u003cp>a.  Whether the recoding judgements can be transferred. Only Hanne knows that, and choosing for her would be the same overreach that caused the problem. Offering both and letting her pick is the respectful form.\u003c/p>\u003cp>b.  Containment. It tells her the situation is now static and cannot get worse, which is the first thing anyone wants to know after a loss, and it reports a change already made rather than a promise.\u003c/p>","F2":"\u003cp>a.  Because the sentence is answering the question she is actually asking — what is gone? — and the cleft puts the answer in the stressed final position after the reassurance about what survived.\u003c/p>\u003cp>b.  Because it is a judgement on himself, offered without qualification, at the point where the email has nothing left to ask for. Anything longer would start to sound like a bid for reassurance.\u003c/p>","F3":"\u003cp>1.  It is vague where precision is the entire kindness. \"Some of your work may have been lost\", \"an older back-up somewhere I think\" — she cannot plan her week from any of it, so the second bullet fails.\u003c/p>\u003cp>2.  Responsibility is deflected. \"Something went wrong\", \"maybe there was a sync problem\" offers an agentless explanation for an action the writer took.\u003c/p>\u003cp>3.  The repair is handed back: \"Let me know ... if there is anything I can do to help\" makes the injured party design the remedy. The third bullet fails.\u003c/p>"},"model":["Hi Hanne,","I have overwritten the cleaned dataset and we have lost about three days of your work. I am very sorry.","What happened is that I ran the import script against the shared folder rather than my own copy, and it wrote over master_clean.csv. There is a back-up from Sunday night, so everything up to the duplicate-removal stage is intact; what is gone is the manual recoding of the free-text fields and the Tuesday corrections.","I have already restored Sunday’s version so nothing further is at risk, and I have moved my working copy out of the shared folder so it cannot happen again.","On the recoding — I would like to redo it myself. If you can send me the rules you were applying, I will work through it this weekend and have it back to you Monday for checking. If you would rather do it yourself because the judgements are hard to hand over, I understand, and I will take over whatever else is on your list this week instead.","I am sorry, Hanne. This was careless.","Dan"],"model_html":"\u003cp>Hi Hanne,\u003c/p>\u003cp>I have overwritten the cleaned dataset and we have lost about three days of your work. I am very sorry.\u003c/p>\u003cp>What happened is that I ran the import script against the shared folder rather than my own copy, and it wrote over master_clean.csv. There is a back-up from Sunday night, so everything up to the duplicate-removal stage is intact; what is gone is the manual recoding of the free-text fields and the Tuesday corrections.\u003c/p>\u003cp>I have already restored Sunday’s version so nothing further is at risk, and I have moved my working copy out of the shared folder so it cannot happen again.\u003c/p>\u003cp>On the recoding — I would like to redo it myself. If you can send me the rules you were applying, I will work through it this weekend and have it back to you Monday for checking. If you would rather do it yourself because the judgements are hard to hand over, I understand, and I will take over whatever else is on your list this week instead.\u003c/p>\u003cp>I am sorry, Hanne. This was careless.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Hanne, I am so sorry, something went wrong with the shared folder and I think some of your work on the dataset may have been lost. I am not sure exactly how it happened, maybe there was a sync problem. There is an older back-up somewhere I think. Let me know how bad it is and if there is anything I can do to help. Really sorry about this!","Dan"],"degraded_html":"\u003cp>Hi Hanne, I am so sorry, something went wrong with the shared folder and I think some of your work on the dataset may have been lost. I am not sure exactly how it happened, maybe there was a sync problem. There is an older back-up somewhere I think. Let me know how bad it is and if there is anything I can do to help. Really sorry about this!\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":185,"fault_list":{"tag":"F3","faults":["It is vague where precision is the entire kindness. \"Some of your work may have been lost\", \"an older back-up somewhere I think\" — she cannot plan her week from any of it, so the second bullet fails.","Responsibility is deflected. \"Something went wrong\", \"maybe there was a sync problem\" offers an agentless explanation for an action the writer took.","The repair is handed back: \"Let me know ... if there is anything I can do to help\" makes the injured party design the remedy. The third bullet fails."],"html":["\u003cp>1.  It is vague where precision is the entire kindness. \"Some of your work may have been lost\", \"an older back-up somewhere I think\" — she cannot plan her week from any of it, so the second bullet fails.\u003c/p>","\u003cp>2.  Responsibility is deflected. \"Something went wrong\", \"maybe there was a sync problem\" offers an agentless explanation for an action the writer took.\u003c/p>","\u003cp>3.  The repair is handed back: \"Let me know ... if there is anything I can do to help\" makes the injured party design the remedy. The third bullet fails.\u003c/p>"]},"scenario":"\u003cp>You overwrote a shared dataset that a colleague had spent a week cleaning. There is a back-up from four days ago, so three days of their work is gone.\u003c/p>","bullets":["Tell them what has happened.","Say what can and cannot be recovered.","Offer a repair proportionate to the loss."],"header":[["To:","h.sorensen@northgate.ac.uk"],["Subject:","The cleaned dataset — I have overwritten part of it"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Young people are very connected through social media” is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.","correct":false},{"text":"Responsibility is deflected. “Something went wrong”, “maybe there was a sync problem” offers an agentless explanation for an action the writer took.","correct":true},{"text":"“Everyone should do what they reasonably can according to their circumstances” is unfalsifiable and sets no limit, so it takes no position on where the line falls.","correct":false},{"text":"“Which is obviously good for society” does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.","correct":false},{"text":"It is vague where precision is the entire kindness. “Some of your work may have been lost”, “an older back-up somewhere I think” — she cannot plan her week from any of it, so the second bullet fails.","correct":true},{"text":"The repair is handed back: “Let me know ... if there is anything I can do to help” makes the injured party design the remedy. The third bullet fails.","correct":true}],"key_html":"F3"}};</script>
