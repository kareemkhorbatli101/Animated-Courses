<script>window.ITEM={"kind":"exercise","id":"EM 083","slug":"em-083","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Difficult news to a group","payload":{"Strategy":"deliver the decision before the reasoning","Grammar":"it-cleft for emphasis","Vocabulary":"wind up, dissolve, quorum, residual","Convention":"telling a group that something is ending"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why should the decision come before the reasoning?\u003c/p>\u003cp>b.  What is the difference between announcing and proposing here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a quorum, and what does it mean to wind up a society?\u003c/p>\u003cp>b.  What are residual funds?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in one sentence that names the proposal and the date.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The proposal is in the first line. What would be lost by building up to it?\u003c/p>\u003cp>b.  The email offers a way to reverse the decision, with a deadline. Why a deadline?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is not lack of interest that has done this\" — identify the structure and say what it protects.\u003c/p>\u003cp>b.  \"Either way the May observing evening goes ahead\" — why end here?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the reader will skim for the decision anyway, and a paragraph of preamble reads as softening bad news they have already guessed. Stating it first makes the reasoning look like reasons rather than justification.\u003c/p>\u003cp>b.  Announcing presents it as settled; proposing leaves the AGM a real decision. The chair cannot wind up a society alone, so announcing would also be inaccurate.\u003c/p>","P2":"\u003cp>a.  A quorum is the minimum attendance for valid business; to wind up is to close an organisation formally and distribute what it holds.\u003c/p>\u003cp>b.  Money left after obligations are met — which is why members will want to know where it goes.\u003c/p>","P3":"\u003cp>Model: \"At the AGM on 14 May I am going to propose that the society be wound up at the end of this term.\"\u003c/p>","F1":"\u003cp>a.  Trust. Members who find the proposal in the fourth paragraph will conclude the chair was managing them, and the reasoning will be read as self-justification rather than as facts.\u003c/p>\u003cp>b.  Because an open-ended reprieve means nothing happens until the AGM, when it is too late to organise. A date forces the decision while there is still time to withdraw the proposal, which is the only way the offer is real.\u003c/p>","F2":"\u003cp>a.  An it-cleft, used twice in that paragraph. It isolates the real cause and explicitly denies the one members will assume, which protects them from reading the closure as their own failure to care.\u003c/p>\u003cp>b.  It separates the society’s formal existence from the thing people actually value, and ensures nobody reads the email as cancelling the astronomy. Ending on something that continues is also the only consolation available that is not a platitude.\u003c/p>","F3":"\u003cp>1.  The proposal is buried and hedged into near-invisibility — \"I think we may unfortunately have no choice but to consider closing\" — so the first bullet fails.\u003c/p>\u003cp>2.  No attendance figures, no quorum requirement, no failed election, no affiliation review: the second bullet fails entirely, and \"I have been trying my best on my own\" substitutes the chair’s effort for the facts.\u003c/p>\u003cp>3.  No route to reverse it and no deadline, so the third bullet fails; nothing is said about the funds, and the AGM date is never given.\u003c/p>"},"model":["Dear all,","At the AGM on 14 May I am going to propose that the society be wound up at the end of this term. I would rather you heard that from me now than at the meeting.","The facts are these. We have held four meetings since January with attendance of 3, 3, 5 and 2; our constitution requires six for a quorum. Nobody stood for secretary or treasurer at the February election, and I have been doing all three jobs, which is not a committee. The Union withdraws affiliation from societies that cannot form one, and ours is up for review in June.","It is not lack of interest that has done this — the observing evenings are well attended. It is that nobody wants the administration, and that is a fair position rather than a failure of anyone’s.","This can still be stopped, and I would be glad if it were. If three people tell me before 7 May that they will stand for secretary, treasurer and chair, I will withdraw the proposal and hand over instead. Residual funds of about £340 would go to the Union societies pool if we wind up, or stay with us if we do not.","Either way the May observing evening goes ahead.","Haruki"],"model_html":"\u003cp>Dear all,\u003c/p>\u003cp>At the AGM on 14 May I am going to propose that the society be wound up at the end of this term. I would rather you heard that from me now than at the meeting.\u003c/p>\u003cp>The facts are these. We have held four meetings since January with attendance of 3, 3, 5 and 2; our constitution requires six for a quorum. Nobody stood for secretary or treasurer at the February election, and I have been doing all three jobs, which is not a committee. The Union withdraws affiliation from societies that cannot form one, and ours is up for review in June.\u003c/p>\u003cp>It is not lack of interest that has done this — the observing evenings are well attended. It is that nobody wants the administration, and that is a fair position rather than a failure of anyone’s.\u003c/p>\u003cp>This can still be stopped, and I would be glad if it were. If three people tell me before 7 May that they will stand for secretary, treasurer and chair, I will withdraw the proposal and hand over instead. Residual funds of about £340 would go to the Union societies pool if we wind up, or stay with us if we do not.\u003c/p>\u003cp>Either way the May observing evening goes ahead.\u003c/p>\u003cp>Haruki\u003c/p>","model_band":5,"degraded":["Dear all, I am afraid I have some rather sad news about the society. As you may have noticed, attendance at our meetings has been very low recently and it has become increasingly difficult to keep things running. I have been trying my best to organise everything on my own but it is simply not sustainable. Therefore I think we may unfortunately have no choice but to consider closing the society. We can discuss this at the AGM. I am sorry to be the bearer of bad news.","Haruki"],"degraded_html":"\u003cp>Dear all, I am afraid I have some rather sad news about the society. As you may have noticed, attendance at our meetings has been very low recently and it has become increasingly difficult to keep things running. I have been trying my best to organise everything on my own but it is simply not sustainable. Therefore I think we may unfortunately have no choice but to consider closing the society. We can discuss this at the AGM. I am sorry to be the bearer of bad news.\u003c/p>\u003cp>Haruki\u003c/p>","degraded_band":3,"model_words":212,"fault_list":{"tag":"F3","faults":["The proposal is buried and hedged into near-invisibility — \"I think we may unfortunately have no choice but to consider closing\" — so the first bullet fails.","No attendance figures, no quorum requirement, no failed election, no affiliation review: the second bullet fails entirely, and \"I have been trying my best on my own\" substitutes the chair’s effort for the facts.","No route to reverse it and no deadline, so the third bullet fails; nothing is said about the funds, and the AGM date is never given."],"html":["\u003cp>1.  The proposal is buried and hedged into near-invisibility — \"I think we may unfortunately have no choice but to consider closing\" — so the first bullet fails.\u003c/p>","\u003cp>2.  No attendance figures, no quorum requirement, no failed election, no affiliation review: the second bullet fails entirely, and \"I have been trying my best on my own\" substitutes the chair’s effort for the facts.\u003c/p>","\u003cp>3.  No route to reverse it and no deadline, so the third bullet fails; nothing is said about the funds, and the AGM date is never given.\u003c/p>"]},"scenario":"\u003cp>The society you chair has had three members at the last four meetings and cannot field a committee. You have decided to recommend winding it up at the AGM. Some members will be upset.\u003c/p>","bullets":["Say what is being proposed.","Give the facts behind it.","Leave a route to reverse it."],"header":[["To:","members.astrosoc@northgate.ac.uk"],["Subject:","AGM 14 May — proposal to wind up the society"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The proposal is buried and hedged into near-invisibility — “I think we may unfortunately have no choice but to consider closing” — so the first bullet fails.","correct":true},{"text":"Language: “their own life and their own body” (lives, bodies), “choose consciously” (make an informed choice), and “a question of balance” announces a conclusion the response never reaches.","correct":false},{"text":"No attendance figures, no quorum requirement, no failed election, no affiliation review: the second bullet fails entirely, and “I have been trying my best on my own” substitutes the chair’s effort for the facts.","correct":true},{"text":"“We should not criticise journalists for doing their job” declines the evaluation the prompt requests.","correct":false},{"text":"“A small number of homeowners” mischaracterises her argument, which was about residents bearing disruption, not about property owners blocking change.","correct":false},{"text":"No route to reverse it and no deadline, so the third bullet fails; nothing is said about the funds, and the AGM date is never given.","correct":true}],"key_html":"F3"}};</script>
