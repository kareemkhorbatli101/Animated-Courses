<script>window.ITEM={"kind":"exercise","id":"AD 012","slug":"ad-012","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environment · policy choice","payload":{"Strategy":"judge a scheme by what it does to the next decision, not this one","Grammar":"conditional consequence","Vocabulary":"offset, additionality, permanence, leakage","Convention":"criticising a popular mechanism without sounding obstructive"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ines argues from economics, Jonah from measurement. Which claim would have to be false for the other to win?\u003c/p>\u003cp>b.  Jonah makes two separate objections. Separate them.\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Define additionality, permanence and leakage.\u003c/p>\u003cp>b.  Why is \"a tonne is a tonne\" a claim about physics being used as a claim about accounting?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Ines the economics and keep Jonah’s conclusion, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response claims the two classmates’ positions are connected. What is the link?\u003c/p>\u003cp>b.  It ends by reinterpreting Jonah’s objection. What does the reinterpretation add?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"If verification were tight enough ... the price would rise\" — why the unreal conditional for an argument the writer believes?\u003c/p>\u003cp>b.  \"fungible with time\" — what does \"fungible\" mean, and why is the phrase the point of the whole response?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Neither, as stated — which is the opening. Ines argues offsets are efficient; Jonah argues they are not real. Both can be true of different offsets, and the response finds the mechanism that links them.\u003c/p>\u003cp>b.  That offsets are often not additional or permanent (a measurement failure), and that buying them delays real cuts (a behavioural consequence). The second survives even if the first is fixed.\u003c/p>","P2":"\u003cp>a.  Additionality: the reduction would not have happened without the payment. Permanence: it stays reduced. Leakage: the emitting activity moves elsewhere rather than stopping.\u003c/p>\u003cp>b.  Because physical equivalence does not imply accounting equivalence. A tonne avoided is identical to a tonne avoided; a tonne claimed is not, and the entire dispute is about the gap between them.\u003c/p>","P3":"\u003cp>Model: \"Offsets are cheap because they are unverifiable, so the efficiency Ines values and the unreality Jonah objects to are the same fact seen twice.\"\u003c/p>","F1":"\u003cp>a.  Price. Cheapness is produced by weak verification, so you cannot have Ines’s cost advantage and Jonah’s rigour at once. That turns an apparent disagreement into a trade-off with a mechanism behind it.\u003c/p>\u003cp>b.  It separates fraud from substitution. If offsets were merely fraudulent, better auditing would fix them. If the problem is that they trade against time, then even perfect offsets would still delay the slow capital decisions — which is a much harder objection and one Jonah had not quite made.\u003c/p>","F2":"\u003cp>a.  Because tight verification does not currently exist, so the claim is about a world we can reason about but not observe. The unreal form is honest about that and makes the argument about a mechanism rather than a disputed fact.\u003c/p>\u003cp>b.  Fungible means interchangeable, one unit substitutable for another. The phrase is the point because it identifies what is actually being traded: not pollution for trees, but action now for action later — and that trade is the one that cannot be made good.\u003c/p>","F3":"\u003cp>1.  It never engages Ines. Her argument is about the cost of decarbonisation; \"the environment is more important than the money\" answers an argument she did not make.\u003c/p>\u003cp>2.  Nothing is added beyond Jonah’s position restated with more indignation, and \"ban this practice\" arrives without any consideration of what replaces the finance.\u003c/p>\u003cp>3.  Language: \"the big companies\", \"the money\", \"the companies\" over-articled throughout; \"really sustainable\" is vague; and the geography (\"trees in Africa or South America\") is decorative rather than evidential.\u003c/p>"},"model":["Ines is right that cheapness matters and Jonah is right that most offsets are not real, and those two facts are connected rather than opposed. Offsets are cheap precisely because the market cannot verify additionality: a project that would have happened anyway costs almost nothing to certify, so the cheapest tonnes are systematically the least real ones. If verification were tight enough to satisfy Jonah, the price would rise to something close to the cost of cutting your own emissions, and Ines’s efficiency argument would largely disappear.","So I would not ban offsetting, but I would stop it counting towards a target. The distinction matters: as a voluntary payment on top of a reduction obligation, an offset does some good even if a fraction fail. As a substitute for the obligation it does harm, because it licenses postponement of exactly the capital decisions — furnaces, fleets, buildings — that take fifteen years to turn over. Jonah’s real point is not that offsets are fraudulent but that they are fungible with time, and time is the thing we cannot buy more of."],"model_html":"\u003cp>Ines is right that cheapness matters and Jonah is right that most offsets are not real, and those two facts are connected rather than opposed. Offsets are cheap precisely because the market cannot verify additionality: a project that would have happened anyway costs almost nothing to certify, so the cheapest tonnes are systematically the least real ones. If verification were tight enough to satisfy Jonah, the price would rise to something close to the cost of cutting your own emissions, and Ines’s efficiency argument would largely disappear.\u003c/p>\u003cp>So I would not ban offsetting, but I would stop it counting towards a target. The distinction matters: as a voluntary payment on top of a reduction obligation, an offset does some good even if a fraction fail. As a substitute for the obligation it does harm, because it licenses postponement of exactly the capital decisions — furnaces, fleets, buildings — that take fifteen years to turn over. Jonah’s real point is not that offsets are fraudulent but that they are fungible with time, and time is the thing we cannot buy more of.\u003c/p>","model_band":5,"degraded":["I agree with Jonah because carbon offsetting is just a way for the big companies to continue polluting while they pretend to be green. They plant some trees in Africa or South America and then they say they are carbon neutral, which is not true at all. Ines says it is cheaper but I think the environment is more important than the money. The companies should reduce their own emissions in their own factories instead of paying others to do it for them. Governments should ban this practice and force the companies to become really sustainable."],"degraded_html":"\u003cp>I agree with Jonah because carbon offsetting is just a way for the big companies to continue polluting while they pretend to be green. They plant some trees in Africa or South America and then they say they are carbon neutral, which is not true at all. Ines says it is cheaper but I think the environment is more important than the money. The companies should reduce their own emissions in their own factories instead of paying others to do it for them. Governments should ban this practice and force the companies to become really sustainable.\u003c/p>","degraded_band":3,"model_words":179,"fault_list":{"tag":"F3","faults":["It never engages Ines. Her argument is about the cost of decarbonisation; \"the environment is more important than the money\" answers an argument she did not make.","Nothing is added beyond Jonah’s position restated with more indignation, and \"ban this practice\" arrives without any consideration of what replaces the finance.","Language: \"the big companies\", \"the money\", \"the companies\" over-articled throughout; \"really sustainable\" is vague; and the geography (\"trees in Africa or South America\") is decorative rather than evidential."],"html":["\u003cp>1.  It never engages Ines. Her argument is about the cost of decarbonisation; \"the environment is more important than the money\" answers an argument she did not make.\u003c/p>","\u003cp>2.  Nothing is added beyond Jonah’s position restated with more indignation, and \"ban this practice\" arrives without any consideration of what replaces the finance.\u003c/p>","\u003cp>3.  Language: \"the big companies\", \"the money\", \"the companies\" over-articled throughout; \"really sustainable\" is vague; and the geography (\"trees in Africa or South America\") is decorative rather than evidential.\u003c/p>"]},"prof_name":"Dr Haugen","professor":"\u003cp>Carbon offsetting lets an emitter pay for reductions elsewhere — tree planting, cookstoves, avoided deforestation — instead of cutting its own emissions. Should offsetting count towards a company’s climate targets?\u003c/p>","students":[["Ines","Yes, with standards. A tonne is a tonne wherever it is avoided, and offsetting moves money to the places where reductions are cheapest. Refusing it on principle makes decarbonisation more expensive and therefore slower."],["Jonah","No. Most offsets fail the additionality test — the trees were going to be planted anyway, or they burn down in ten years. Companies buy a number, not a reduction, and the number lets them postpone the changes that matter."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: “the big companies”, “the money”, “the companies” over-articled throughout; “really sustainable” is vague; and the geography (“trees in Africa or South America”) is decorative rather than evidential.","correct":true},{"text":"Consequential errors. “is not working since three weeks” (has not been working for three weeks — both the tense and the preposition are wrong), “I reported two times” (twice), “Students Union” (Students’ Union). The tense error in particular obscures the history, which is the one thing the email needed to establish.","correct":false},{"text":"It never engages Ines. Her argument is about the cost of decarbonisation; “the environment is more important than the money” answers an argument she did not make.","correct":true},{"text":"No real cost is named. “A bit hard coming back” is mentioned and immediately dismissed as normal, so the second bullet fails and the one piece of evidence the writer has is wasted.","correct":false},{"text":"Nothing is added beyond Jonah’s position restated with more indignation, and “ban this practice” arrives without any consideration of what replaces the finance.","correct":true},{"text":"“Somebody to actually do something about it as soon as possible” names no action, no owner and no date, so the first bullet fails too.","correct":false}],"key_html":"F3"}};</script>
