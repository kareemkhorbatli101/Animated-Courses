<script>window.ITEM={"kind":"exercise","id":"AD 019","slug":"ad-019","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Technology and AI · agree or disagree with a claim","payload":{"Strategy":"check whether the comparison is with the alternative or with perfection","Grammar":"comparative of importance","Vocabulary":"baseline, error rate, automation bias, liability","Convention":"arguing about risk without demanding a standard nobody meets"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Does Dana dispute Lior’s accuracy claim?\u003c/p>\u003cp>b.  What would have to be true for Lior’s argument to go through?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a baseline, and why does the choice of baseline often settle an argument about technology?\u003c/p>\u003cp>b.  What is automation bias?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Lior the arithmetic and keep Dana’s objection, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the statistic both classmates argue about is the wrong one. Why?\u003c/p>\u003cp>b.  What does retaining a human reader \"on a sample\" achieve that retaining one for every scan would not?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it does not cancel, it accumulates\" — what is the effect of the bare repetition of structure?\u003c/p>\u003cp>b.  \"Lior’s point about missed cancers is not rhetorical\" — why insert this concession so late?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No. She concedes it implicitly and attacks the structure of the errors rather than their number, which is why Lior’s reply about blame misses her.\u003c/p>\u003cp>b.  That errors are comparable units — that one missed case from a model is equivalent to one from a human. Dana’s point is precisely that they are not, because they are correlated.\u003c/p>","P2":"\u003cp>a.  The thing you compare against. It settles arguments because comparing a new system with perfection almost always condemns it, while comparing it with current practice often vindicates it — and the choice is usually made silently.\u003c/p>\u003cp>b.  The tendency to accept an automated recommendation without the scrutiny one would apply to a human one, which is what makes a correlated error so hard to catch.\u003c/p>","P3":"\u003cp>Model: \"The right comparison is the radiologist rather than perfection, but human errors are independent and model errors are correlated, so the same accuracy figure means different things.\"\u003c/p>","F1":"\u003cp>a.  Because an aggregate rate averages over subgroups, and the failure Dana describes is concentrated in a subgroup. A system can beat the human average while being worse than the human for a particular population, and the headline figure will not show it.\u003c/p>\u003cp>b.  It preserves detection at a fraction of the cost. The point of the human is no longer to catch each error but to generate an independent signal that would diverge from the model if the model drifted — which is exactly what a sample can do.\u003c/p>","F2":"\u003cp>a.  The parallel clauses set the two behaviours side by side with nothing between them, so the contrast lands without being explained. Dropping the conjunction speeds the sentence up at the point where the argument turns.\u003c/p>\u003cp>b.  Because the writer has just spent a paragraph agreeing with Dana and is about to recommend deployment anyway. Conceding the force of Lior’s point immediately before the recommendation is what makes the recommendation read as a judgement rather than a hedge.\u003c/p>","F3":"\u003cp>1.  It engages neither classmate. Lior’s baseline argument and Dana’s correlation argument are both absent, replaced by general caution.\u003c/p>\u003cp>2.  \"The real world is different\" and \"unexpected situations\" are unfalsifiable, and the empathy point answers a question about diagnostic accuracy with one about consultation.\u003c/p>\u003cp>3.  Language: \"the health of the patients\", \"the machines\", \"the doctors\" over-articled; \"we cannot take any risk with human lives\" is an absolute that no medical system has ever met.\u003c/p>"},"model":["Lior is right about the comparison most critics get wrong: the baseline is the radiologist, not a system that never errs. But Dana is pointing at something his framing cannot capture, which is that the two kinds of error have different shapes. Independent human errors are roughly random and partly cancel across a population; a correlated model error does not cancel, it accumulates, and it accumulates in whichever subgroup was thin in the training data.","So the aggregate accuracy figure both of them are arguing about is the wrong statistic. What matters is the worst subgroup error rate and whether anyone is measuring it, and the honest answer at present is that licensing regimes mostly do not require it. I would deploy these systems — Lior’s point about missed cancers is not rhetorical — but with mandatory stratified reporting and a human reader retained on a sample, which is the only arrangement under which Dana’s failure mode would ever be detected."],"model_html":"\u003cp>Lior is right about the comparison most critics get wrong: the baseline is the radiologist, not a system that never errs. But Dana is pointing at something his framing cannot capture, which is that the two kinds of error have different shapes. Independent human errors are roughly random and partly cancel across a population; a correlated model error does not cancel, it accumulates, and it accumulates in whichever subgroup was thin in the training data.\u003c/p>\u003cp>So the aggregate accuracy figure both of them are arguing about is the wrong statistic. What matters is the worst subgroup error rate and whether anyone is measuring it, and the honest answer at present is that licensing regimes mostly do not require it. I would deploy these systems — Lior’s point about missed cancers is not rhetorical — but with mandatory stratified reporting and a human reader retained on a sample, which is the only arrangement under which Dana’s failure mode would ever be detected.\u003c/p>","model_band":5,"degraded":["I believe that we should be very careful with artificial intelligence in medicine because the health of the patients is the most important thing and we cannot take any risk with human lives. Even if the machines are more accurate in the tests, the real world is different and there can be many unexpected situations. Also the patients want to be treated by a human doctor who can understand their feelings and explain the results to them with empathy. So in my opinion AI can be used as a support tool for the doctors but the final decision must always be taken by a human being."],"degraded_html":"\u003cp>I believe that we should be very careful with artificial intelligence in medicine because the health of the patients is the most important thing and we cannot take any risk with human lives. Even if the machines are more accurate in the tests, the real world is different and there can be many unexpected situations. Also the patients want to be treated by a human doctor who can understand their feelings and explain the results to them with empathy. So in my opinion AI can be used as a support tool for the doctors but the final decision must always be taken by a human being.\u003c/p>","degraded_band":3,"model_words":159,"fault_list":{"tag":"F3","faults":["It engages neither classmate. Lior’s baseline argument and Dana’s correlation argument are both absent, replaced by general caution.","\"The real world is different\" and \"unexpected situations\" are unfalsifiable, and the empathy point answers a question about diagnostic accuracy with one about consultation.","Language: \"the health of the patients\", \"the machines\", \"the doctors\" over-articled; \"we cannot take any risk with human lives\" is an absolute that no medical system has ever met."],"html":["\u003cp>1.  It engages neither classmate. Lior’s baseline argument and Dana’s correlation argument are both absent, replaced by general caution.\u003c/p>","\u003cp>2.  \"The real world is different\" and \"unexpected situations\" are unfalsifiable, and the empathy point answers a question about diagnostic accuracy with one about consultation.\u003c/p>","\u003cp>3.  Language: \"the health of the patients\", \"the machines\", \"the doctors\" over-articled; \"we cannot take any risk with human lives\" is an absolute that no medical system has ever met.\u003c/p>"]},"prof_name":"Dr Sorensen","professor":"\u003cp>Automated systems now outperform human readers on several diagnostic imaging tasks under test conditions. Critics argue that errors by such systems are unacceptable in a way human errors are not. How do you assess that argument?\u003c/p>","students":[["Lior","The objection confuses two things. If the system is more accurate than the radiologist, refusing it means choosing more missed cancers in order to feel better about who made the mistake. That is a preference about blame, not about patients."],["Dana","It is not only about blame. A human error is one error; a systematic error in a model is the same error repeated across every hospital that licenses it, and nobody notices because consistency looks like competence."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“I hope you will accept my word on this” asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.","correct":false},{"text":"It engages neither classmate. Lior’s baseline argument and Dana’s correlation argument are both absent, replaced by general caution.","correct":true},{"text":"Language: “the health of the patients”, “the machines”, “the doctors” over-articled; “we cannot take any risk with human lives” is an absolute that no medical system has ever met.","correct":true},{"text":"“I have put a lot of effort into building it and it has saved the society a lot of time” is about the writer rather than the handover, and “will be able to use it without problems” is an assurance the writer cannot give.","correct":false},{"text":"“The real world is different” and “unexpected situations” are unfalsifiable, and the empathy point answers a question about diagnostic accuracy with one about consultation.","correct":true},{"text":"“I hope it works out for you” closes without offering anything, so the third bullet fails; and there is a comma splice in the first sentence.","correct":false}],"key_html":"F3"}};</script>
