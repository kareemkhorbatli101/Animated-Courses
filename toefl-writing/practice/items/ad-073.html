<script>window.ITEM={"kind":"exercise","id":"AD 073","slug":"ad-073","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Biology · agree / disagree","payload":{"Strategy":"refuse a false dichotomy by naming the interaction","Grammar":"comparative with as ... as","Vocabulary":"heritable, plasticity, phenotype, variance","Convention":"answering a nature-versus-nurture question properly"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Dan’s question is reasonable. What does he misunderstand about a heritability estimate?\u003c/p>\u003cp>b.  Why is Liv’s height example so effective?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a phenotype, and what is variance?\u003c/p>\u003cp>b.  What does plasticity mean in this context?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence about what heritability measures.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response agrees with Liv but spends most of its length on Dan. Why?\u003c/p>\u003cp>b.  Why does the last paragraph reject \"a bit of both\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"The number is as much a fact about the environment as about the genome\" — what does the comparative achieve?\u003c/p>\u003cp>b.  \"differences among contemporaries\" versus \"a change in conditions affecting everyone\" — why this contrast?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  He treats heritability as the share of the trait caused by genes, when it is the share of variation in one population attributable to genetic variation — a statistic about differences, not about causes within an individual.\u003c/p>\u003cp>b.  Because it gives two true statements that sound contradictory under Dan’s reading and are perfectly consistent under the correct one, which exposes the misunderstanding without having to define anything.\u003c/p>","P2":"\u003cp>a.  A phenotype is an observable characteristic; variance is the statistical spread of a trait across a population.\u003c/p>\u003cp>b.  The capacity of a genotype to produce different phenotypes under different conditions — which is precisely what a single heritability figure conceals.\u003c/p>","P3":"\u003cp>Model: \"Heritability measures how much of the variation in one population tracks genetic variation, not how much of a trait is caused by genes.\"\u003c/p>","F1":"\u003cp>a.  Because Liv’s position is correct but Dan’s objection is the one the discussion turns on. He has raised the strongest version of the lay view, and answering it is the only way to show the dichotomy is false rather than merely unfashionable.\u003c/p>\u003cp>b.  Because \"a bit of both\" accepts the premise that the trait divides into two portions, which is the error. The factors interact, so no partition exists to be split at any ratio.\u003c/p>","F2":"\u003cp>a.  The as ... as comparison makes the two readings equivalent rather than ranking them, which is the precise claim: the figure cannot be interpreted without knowing the environmental conditions of the population measured.\u003c/p>\u003cp>b.  It names the two different things the two statements are about. Once that is visible the apparent contradiction disappears, which is what makes the explanation do real work rather than just asserting that both matter.\u003c/p>","F3":"\u003cp>1.  \"It is about fifty-fifty\" commits the exact error under discussion — treating the trait as divisible into two shares.\u003c/p>\u003cp>2.  Dan’s specific question about what an 80% figure means is never addressed, so the response does not engage the point at issue.\u003c/p>\u003cp>3.  The twin study is described as proving that \"both factors matter\", which nobody disputed, and \"we should stop arguing about it\" declines the question the prompt asks.\u003c/p>"},"model":["Liv is right and Dan has put his finger on exactly why biologists sound evasive: the number he is quoting does not mean what its phrasing suggests.","Heritability is not the proportion of a trait caused by genes. It is the proportion of variation in a particular population at a particular time that tracks genetic variation. If everyone in a population eats well, nutrition stops contributing to the differences between them, and heritability rises without any gene becoming more powerful. The number is as much a fact about the environment as about the genome.","That is why Liv’s example settles it. Height can be 80% heritable within a generation and still shift ten centimetres between generations, because the first statement is about differences among contemporaries and the second about a change in conditions affecting everyone.","So the dichotomy is genuinely false, and not because the answer is \"a bit of both\". It is false because the two factors do not partition a trait at all — they interact, and the statistic that appears to divide them is measuring something else. Dan is owed that explanation rather than the usual refusal to answer."],"model_html":"\u003cp>Liv is right and Dan has put his finger on exactly why biologists sound evasive: the number he is quoting does not mean what its phrasing suggests.\u003c/p>\u003cp>Heritability is not the proportion of a trait caused by genes. It is the proportion of variation in a particular population at a particular time that tracks genetic variation. If everyone in a population eats well, nutrition stops contributing to the differences between them, and heritability rises without any gene becoming more powerful. The number is as much a fact about the environment as about the genome.\u003c/p>\u003cp>That is why Liv’s example settles it. Height can be 80% heritable within a generation and still shift ten centimetres between generations, because the first statement is about differences among contemporaries and the second about a change in conditions affecting everyone.\u003c/p>\u003cp>So the dichotomy is genuinely false, and not because the answer is \"a bit of both\". It is false because the two factors do not partition a trait at all — they interact, and the statistic that appears to divide them is measuring something else. Dan is owed that explanation rather than the usual refusal to answer.\u003c/p>","model_band":5,"degraded":["I agree that the question is too simple because obviously both genes and environment play an important role in human development. Scientists have shown that identical twins raised apart are similar in many ways but also different in others, which proves that both factors matter. For example a person may inherit a talent for music but they will never become a musician without training and opportunity. So in my opinion it is about fifty-fifty and we should stop arguing about it."],"degraded_html":"\u003cp>I agree that the question is too simple because obviously both genes and environment play an important role in human development. Scientists have shown that identical twins raised apart are similar in many ways but also different in others, which proves that both factors matter. For example a person may inherit a talent for music but they will never become a musician without training and opportunity. So in my opinion it is about fifty-fifty and we should stop arguing about it.\u003c/p>","degraded_band":3,"model_words":191,"fault_list":{"tag":"F3","faults":["\"It is about fifty-fifty\" commits the exact error under discussion — treating the trait as divisible into two shares.","Dan’s specific question about what an 80% figure means is never addressed, so the response does not engage the point at issue.","The twin study is described as proving that \"both factors matter\", which nobody disputed, and \"we should stop arguing about it\" declines the question the prompt asks."],"html":["\u003cp>1.  \"It is about fifty-fifty\" commits the exact error under discussion — treating the trait as divisible into two shares.\u003c/p>","\u003cp>2.  Dan’s specific question about what an 80% figure means is never addressed, so the response does not engage the point at issue.\u003c/p>","\u003cp>3.  The twin study is described as proving that \"both factors matter\", which nobody disputed, and \"we should stop arguing about it\" declines the question the prompt asks.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Public argument still treats traits as either inherited or produced by environment. Biologists usually say the question is malformed. Is that an evasion, or is the dichotomy genuinely false?\u003c/p>","students":[["Liv","It is not an evasion. Height is highly heritable and also rose ten centimetres in a century on better nutrition. Both statements are true and neither is a percentage of the other."],["Dan","That sounds like a way of never answering. Heritability estimates give numbers. If a trait is 80% heritable, surely that means something about how much environment can do."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Dan’s specific question about what an 80% figure means is never addressed, so the response does not engage the point at issue.","correct":true},{"text":"“I am quite flexible” claims flexibility without supplying any, and “convenient for both of us” introduces the writer’s convenience as a constraint when it is not one.","correct":false},{"text":"The twin study is described as proving that “both factors matter”, which nobody disputed, and “we should stop arguing about it” declines the question the prompt asks.","correct":true},{"text":"“It is about fifty-fifty” commits the exact error under discussion — treating the trait as divisible into two shares.","correct":true},{"text":"The mark is mentioned and then explained away with “I was busy with other things”, which is the least informative possible account and leaves Lena unable to judge the risk.","correct":false},{"text":"It accuses the machine of theft and the office of indifference. “stole”, “of course nobody answered”, “always broken”, “wasting our money”. None of it is actionable and all of it invites a defensive reply.","correct":false}],"key_html":"F3"}};</script>
