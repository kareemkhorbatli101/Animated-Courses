<script>window.ITEM={"kind":"exercise","id":"AD 030","slug":"ad-030","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Media and communication · policy choice","payload":{"Strategy":"ask what a rule does to the marginal case, not the obvious one","Grammar":"conditional qualification","Vocabulary":"verification, provenance, takedown, chilling effect","Convention":"arguing about speech rules without reaching for free-speech slogans"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Petros concedes the obvious case. What is his actual argument?\u003c/p>\u003cp>b.  Mina says the alternative is not neutrality. Why does that matter?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is provenance, and how does it differ from verification?\u003c/p>\u003cp>b.  What is a chilling effect, and who would feel it here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Accept Petros’s point about the marginal case and keep Mina’s conclusion, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response proposes a different kind of label. Why does that answer Petros rather than evade him?\u003c/p>\u003cp>b.  The last clause claims Mina loses almost nothing. On what grounds?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it has to resolve uncertainty in order to apply\" — why is this the decisive sentence?\u003c/p>\u003cp>b.  \"which is checkable against a public record\" — what does this phrase do to the scope of the proposal?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That a system justified by easy cases will inevitably be applied to hard ones, because the hard ones are the bulk of the traffic. It is an argument about scope creep, not about whether lies are bad.\u003c/p>\u003cp>b.  Because it denies the critics their implicit baseline. If doing nothing were neutral, intervention would need a strong justification; if doing nothing already amplifies falsehood, the comparison is between two interventions.\u003c/p>","P2":"\u003cp>a.  Provenance is the origin and history of a piece of content; verification is the determination that a claim is true. Provenance is largely a matter of record, which is why it can be automated.\u003c/p>\u003cp>b.  Deterrence of legitimate expression by the risk of sanction. Here it falls on people making uncertain but reasonable claims, who may self-censor rather than risk a label.\u003c/p>","P3":"\u003cp>Model: \"A truth label has to resolve uncertainty to apply, so it fails where the volume is — but a provenance label does not, and that is where most of the spread comes from.\"\u003c/p>","F1":"\u003cp>a.  Because his objection was precisely about the kind of judgement the label requires. A label that makes no truth judgement is not a narrower version of the thing he objected to; it is a different instrument that his argument does not reach.\u003c/p>\u003cp>b.  Because her case was about amplification, not adjudication. She wants false material to spread less; if provenance labelling achieves that, she has her outcome without needing anyone to rule on truth.\u003c/p>","F2":"\u003cp>a.  Because it identifies the structural reason the system fails at the margin, rather than merely asserting that it does. A label must take a side to be applied at all, so uncertainty is not a case it handles badly — it is a case it cannot handle.\u003c/p>\u003cp>b.  It narrows the surviving falsity label to a class where Petros’s objection does not apply, and does so by naming a test rather than a topic — which makes the scope auditable instead of a matter of judgement.\u003c/p>","F3":"\u003cp>1.  Petros’s argument is acknowledged and then waved away with \"better to do something than nothing\", which is the reasoning his objection was specifically about.\u003c/p>\u003cp>2.  Nothing is added: the pandemic example supports a claim nobody disputed, and \"the platforms have the money and the technology\" assumes the problem is resources when the difficulty identified was epistemic.\u003c/p>\u003cp>3.  Language: \"our democracies\", \"the platforms\", \"the money and the technology\" over-articled; \"fake news\" is used as though it were a defined category, which is the very thing at issue.\u003c/p>"},"model":["Mina is right that the status quo is not neutral, and Petros is right that the marginal case is where any rule actually lives. Those are compatible, and together they argue for labelling of a particular kind. The trouble with a true-or-false label is that it has to resolve uncertainty in order to apply, so it performs worst exactly where most of the volume is.","What does not have that problem is provenance. A label that reports where a claim came from, when it first appeared, and whether the image is what it purports to be makes no judgement about truth and is verifiable mechanically. It also happens to address the failure mode Mina identifies: engagement-driven amplification works best on material whose origins are obscure. I would label provenance universally and reserve falsity ratings for the narrow class where the claim is checkable against a public record — which concedes most of Petros’s territory while giving up almost nothing Mina wanted, since she was arguing about spread rather than about adjudication."],"model_html":"\u003cp>Mina is right that the status quo is not neutral, and Petros is right that the marginal case is where any rule actually lives. Those are compatible, and together they argue for labelling of a particular kind. The trouble with a true-or-false label is that it has to resolve uncertainty in order to apply, so it performs worst exactly where most of the volume is.\u003c/p>\u003cp>What does not have that problem is provenance. A label that reports where a claim came from, when it first appeared, and whether the image is what it purports to be makes no judgement about truth and is verifiable mechanically. It also happens to address the failure mode Mina identifies: engagement-driven amplification works best on material whose origins are obscure. I would label provenance universally and reserve falsity ratings for the narrow class where the claim is checkable against a public record — which concedes most of Petros’s territory while giving up almost nothing Mina wanted, since she was arguing about spread rather than about adjudication.\u003c/p>","model_band":5,"degraded":["I think platforms should definitely label false information because fake news is a very serious danger for our democracies and many people believe everything they read online without checking. During the pandemic we saw how dangerous misinformation can be for public health. Of course Petros is right that it is difficult to decide what is true and what is false in some cases, but I think it is better to do something than nothing. The platforms have the money and the technology to do this properly, and governments should force them to take responsibility."],"degraded_html":"\u003cp>I think platforms should definitely label false information because fake news is a very serious danger for our democracies and many people believe everything they read online without checking. During the pandemic we saw how dangerous misinformation can be for public health. Of course Petros is right that it is difficult to decide what is true and what is false in some cases, but I think it is better to do something than nothing. The platforms have the money and the technology to do this properly, and governments should force them to take responsibility.\u003c/p>","degraded_band":3,"model_words":173,"fault_list":{"tag":"F3","faults":["Petros’s argument is acknowledged and then waved away with \"better to do something than nothing\", which is the reasoning his objection was specifically about.","Nothing is added: the pandemic example supports a claim nobody disputed, and \"the platforms have the money and the technology\" assumes the problem is resources when the difficulty identified was epistemic.","Language: \"our democracies\", \"the platforms\", \"the money and the technology\" over-articled; \"fake news\" is used as though it were a defined category, which is the very thing at issue."],"html":["\u003cp>1.  Petros’s argument is acknowledged and then waved away with \"better to do something than nothing\", which is the reasoning his objection was specifically about.\u003c/p>","\u003cp>2.  Nothing is added: the pandemic example supports a claim nobody disputed, and \"the platforms have the money and the technology\" assumes the problem is resources when the difficulty identified was epistemic.\u003c/p>","\u003cp>3.  Language: \"our democracies\", \"the platforms\", \"the money and the technology\" over-articled; \"fake news\" is used as though it were a defined category, which is the very thing at issue.\u003c/p>"]},"prof_name":"Dr Oyelowo","professor":"\u003cp>Several platforms now label or demote posts that fact-checkers have rated false. Supporters say this reduces the spread of harmful claims; critics say it makes private companies arbiters of truth. Should platforms label content in this way?\u003c/p>","students":[["Mina","Yes. The alternative is not neutrality, it is amplification by whatever maximises engagement, which already favours the false. A label is a mild intervention against a strong existing bias."],["Petros","The strongest cases for labelling are the clearest ones, and those are not where the system operates. Most contested claims are uncertain rather than false, and a process built for the obvious case will be applied to the uncertain one, because that is where the volume is."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Extremely busy” with no standard and no number, which is what everyone says. The second bullet is only formally met.","correct":false},{"text":"Language and register. “Dear Sir” to a service team, “5 pounds” (£5), and the run-together opening line with the greeting on the same line as the first sentence.","correct":false},{"text":"Petros’s argument is acknowledged and then waved away with “better to do something than nothing”, which is the reasoning his objection was specifically about.","correct":true},{"text":"Language: “our democracies”, “the platforms”, “the money and the technology” over-articled; “fake news” is used as though it were a defined category, which is the very thing at issue.","correct":true},{"text":"Nothing is added: the pandemic example supports a claim nobody disputed, and “the platforms have the money and the technology” assumes the problem is resources when the difficulty identified was epistemic.","correct":true},{"text":"Tone. “this is not fair”, “Please cancel the fines and let me keep the book”, “Waiting for your reply”. The email accuses, instructs, and then chases, all in six lines. Band 5 asks for consistent social conventions; this is consistently the wrong ones.","correct":false}],"key_html":"F3"}};</script>
