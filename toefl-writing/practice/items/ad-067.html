<script>window.ITEM={"kind":"exercise","id":"AD 067","slug":"ad-067","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Medicine · policy choice","payload":{"Strategy":"choose by asking what the rule does in the hard case","Grammar":"passive with modal auxiliaries","Vocabulary":"triage, allocation, utility, prognosis","Convention":"choosing a rationing rule"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Arno is not denying that prognosis predicts outcome. What is he claiming?\u003c/p>\u003cp>b.  Why does the lottery have any appeal at all, given it ignores useful information?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is prognosis, and what is triage?\u003c/p>\u003cp>b.  What does utility mean in an allocation rule?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names the hard case your rule produces.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response adopts Mei’s rule and Arno’s safeguards. Is that a compromise or an argument?\u003c/p>\u003cp>b.  Why does the final proposal use a lottery only for close cases?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"that can be done without anyone intending it\" — why stress the absence of intent?\u003c/p>\u003cp>b.  \"a coin toss is not neutrality but indifference to the outcome\" — what distinction is being drawn?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That prognosis is correlated with social advantage, so scoring by it imports inequality into the allocation while appearing to use only clinical facts.\u003c/p>\u003cp>b.  Because it cannot be gamed, requires no contestable estimate, and treats every eligible patient as equally a candidate. Its appeal is procedural rather than outcome-based.\u003c/p>","P2":"\u003cp>a.  Prognosis is the predicted course of a condition; triage is sorting patients by urgency and likely benefit when resources are limited.\u003c/p>\u003cp>b.  The aggregate good produced — here, health gained across all patients rather than for any one of them.\u003c/p>","P3":"\u003cp>Model: \"Allocate by a narrow clinical benefit estimate, with a lottery wherever the estimates are close.\"\u003c/p>","F1":"\u003cp>a.  An argument, because each element answers a specific objection rather than splitting the difference. Mei’s rule survives where the differences are large; Arno’s constraint applies where the estimate stops being reliable.\u003c/p>\u003cp>b.  Because the lottery’s virtue is that it refuses to pretend to a precision that is not there. Where two estimates differ by months, the difference is inside the margin of error, and randomising is more honest than ranking.\u003c/p>","F2":"\u003cp>a.  Because the usual reply to Arno is that nobody is discriminating. Locating the harm in the scoring rather than in anyone’s motives makes the objection unanswerable by good faith, which is what forces a design change.\u003c/p>\u003cp>b.  Between a procedure that treats patients equally and one that declines to care what happens to them. It concedes that the lottery is impartial while denying that impartiality is the only value at stake.\u003c/p>","F3":"\u003cp>1.  It takes no position. \"A combination of both approaches\" specifies nothing about when each would apply, which is the entire question.\u003c/p>\u003cp>2.  \"Doctors should decide based on professional judgement\" avoids the problem — the dispute is about what rule that judgement should follow.\u003c/p>\u003cp>3.  Neither speaker is engaged: Mei’s efficiency argument and Arno’s point about prognosis tracking advantage are both left untouched, and \"every human life has equal value\" is asserted without being connected to either rule.\u003c/p>"},"model":["I would allocate by expected benefit with a floor, because the lottery buys fairness at a price that falls on the patients it is supposed to protect.","Mei’s case is strong where the differences are large. If one patient will gain fifteen years and another three months, a coin toss is not neutrality but indifference to the outcome, and the three months are not improved by having been chosen at random.","Arno’s objection should still be taken seriously, because it is about what gets counted. If prognosis is scored using factors that track prior access to care, the rule converts past disadvantage into future disadvantage, and that can be done without anyone intending it. The answer is to restrict what may be used in the estimate — the immediate clinical picture, not life expectancy or social circumstance.","So the rule I would defend is a narrow benefit estimate with a lottery among patients whose estimates are close. That keeps Mei’s gain where the differences are real and removes the spurious precision Arno is right to distrust, which is where a benefit rule does its quiet discriminating."],"model_html":"\u003cp>I would allocate by expected benefit with a floor, because the lottery buys fairness at a price that falls on the patients it is supposed to protect.\u003c/p>\u003cp>Mei’s case is strong where the differences are large. If one patient will gain fifteen years and another three months, a coin toss is not neutrality but indifference to the outcome, and the three months are not improved by having been chosen at random.\u003c/p>\u003cp>Arno’s objection should still be taken seriously, because it is about what gets counted. If prognosis is scored using factors that track prior access to care, the rule converts past disadvantage into future disadvantage, and that can be done without anyone intending it. The answer is to restrict what may be used in the estimate — the immediate clinical picture, not life expectancy or social circumstance.\u003c/p>\u003cp>So the rule I would defend is a narrow benefit estimate with a lottery among patients whose estimates are close. That keeps Mei’s gain where the differences are real and removes the spurious precision Arno is right to distrust, which is where a benefit rule does its quiet discriminating.\u003c/p>","model_band":5,"degraded":["This is a very difficult ethical question and I think both options have advantages and disadvantages. On the one hand we want to save as many lives as possible, but on the other hand every human life has equal value and it is wrong to say that one patient deserves treatment more than another. Doctors should decide based on their professional judgement and their medical knowledge. In my opinion a combination of both approaches would probably be the fairest solution for everyone."],"degraded_html":"\u003cp>This is a very difficult ethical question and I think both options have advantages and disadvantages. On the one hand we want to save as many lives as possible, but on the other hand every human life has equal value and it is wrong to say that one patient deserves treatment more than another. Doctors should decide based on their professional judgement and their medical knowledge. In my opinion a combination of both approaches would probably be the fairest solution for everyone.\u003c/p>","degraded_band":3,"model_words":185,"fault_list":{"tag":"F3","faults":["It takes no position. \"A combination of both approaches\" specifies nothing about when each would apply, which is the entire question.","\"Doctors should decide based on professional judgement\" avoids the problem — the dispute is about what rule that judgement should follow.","Neither speaker is engaged: Mei’s efficiency argument and Arno’s point about prognosis tracking advantage are both left untouched, and \"every human life has equal value\" is asserted without being connected to either rule."],"html":["\u003cp>1.  It takes no position. \"A combination of both approaches\" specifies nothing about when each would apply, which is the entire question.\u003c/p>","\u003cp>2.  \"Doctors should decide based on professional judgement\" avoids the problem — the dispute is about what rule that judgement should follow.\u003c/p>","\u003cp>3.  Neither speaker is engaged: Mei’s efficiency argument and Arno’s point about prognosis tracking advantage are both left untouched, and \"every human life has equal value\" is asserted without being connected to either rule.\u003c/p>"]},"prof_name":"Dr Ferris","professor":"\u003cp>When a scarce treatment cannot be given to everyone who needs it, hospitals must choose a rule. Some allocate by expected benefit, treating those likely to gain most. Others use a lottery among all eligible patients. Which rule is better?\u003c/p>","students":[["Mei","Expected benefit. A rule that ignores prognosis wastes the treatment, and the point of the treatment is to produce health."],["Arno","Prognosis tracks everything else — age, comorbidity, how well someone has been treated up to now. A benefit rule quietly allocates by advantage and calls it medicine."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Deal with my request immediately” asks for prioritisation with no grounds, and the threat of a formal complaint arrives before anyone has been asked to do anything specific. “Completely unacceptable for a university of this size” is editorial.","correct":false},{"text":"Register: institutional throughout (“we encourage”, “a valuable opportunity”, “we look forward to seeing you there”), which signals an official activity rather than a room where people sit and work.","correct":false},{"text":"It takes no position. “A combination of both approaches” specifies nothing about when each would apply, which is the entire question.","correct":true},{"text":"Neither speaker is engaged: Mei’s efficiency argument and Arno’s point about prognosis tracking advantage are both left untouched, and “every human life has equal value” is asserted without being connected to either rule.","correct":true},{"text":"“Exposure does not pay the rent” is a complaint about the sector rather than about this offer, and there is a comma splice in the opening sentence.","correct":false},{"text":"“Doctors should decide based on professional judgement” avoids the problem — the dispute is about what rule that judgement should follow.","correct":true}],"key_html":"F3"}};</script>
