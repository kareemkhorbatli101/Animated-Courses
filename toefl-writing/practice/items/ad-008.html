<script>window.ITEM={"kind":"exercise","id":"AD 008","slug":"ad-008","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Media and communication · agree or disagree with a claim","payload":{"Strategy":"test a claim about audiences against what audiences actually do","Grammar":"counterfactual would have","Vocabulary":"engagement, reach, legacy media, gatekeeper","Convention":"disagreeing with a popular diagnosis"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Rafe is making a specific methodological objection. Name it.\u003c/p>\u003cp>b.  What kind of evidence would answer him?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish reach, engagement and influence.\u003c/p>\u003cp>b.  What is a gatekeeper in media, and did local papers act as one?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State Rafe’s objection and what would settle it, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Rafe’s objection and then defeats it. With what?\u003c/p>\u003cp>b.  What does the final clause recommend, and why is it a contribution rather than a summary?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had the shift been purely economic, the two groups would have moved together.\" Identify the structure and say why the inversion suits a written argument.\u003c/p>\u003cp>b.  \"specific and unglamorous\" — what is the adjective pair doing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Confounding — a third variable producing both the closure and the civic decline, so the correlation between them is not causal.\u003c/p>\u003cp>b.  A comparison that holds the third variable fixed: towns in the same advertising market and the same years, differing only in whether a paper closed, with the timing of the effect checked against the closure date.\u003c/p>","P2":"\u003cp>a.  Reach is how many are exposed; engagement is what they do with it; influence is whether anything changes as a result. Media arguments slide between the three constantly.\u003c/p>\u003cp>b.  A gatekeeper decides what reaches the public. Local papers did act as one, which is both the strength of Pia’s case and a reason to be careful about romanticising them.\u003c/p>","P3":"\u003cp>Model: \"Rafe is describing confounding, and the test is whether the effect appears after closure in towns that lost a paper but not in comparable towns that did not.\"\u003c/p>","F1":"\u003cp>a.  With the design of the studies rather than with their conclusions — matched comparison towns and the timing of the effect relative to closure. Answering a methodological objection requires a methodological answer, not more results.\u003c/p>\u003cp>b.  Paying somebody to attend meetings, independently of whether a newspaper exists. It is a contribution because both classmates treat the newspaper as the unit: Pia defends it and Rafe doubts it, and neither separates the institution from the function it happened to perform.\u003c/p>","F2":"\u003cp>a.  An inverted third conditional (family 3, structure 24). The inversion is slightly more formal and avoids a fourth \"if\" in a paragraph already carrying conditionals, which keeps the prose from becoming monotonous.\u003c/p>\u003cp>b.  Lowering the emotional temperature deliberately. The civic-decline argument is usually made in grand terms; describing the mechanism as unglamorous signals that the writer is identifying a replaceable function rather than mourning an institution, which is what makes the final recommendation possible.\u003c/p>","F3":"\u003cp>1.  Rafe is not answered. \"I think the connection is very clear\" restates the belief he questioned without engaging the objection, which was about causation.\u003c/p>\u003cp>2.  The evidence is a single anecdote about the writer’s own city, which is exactly the kind of case Rafe’s objection predicts would look convincing and prove nothing.\u003c/p>\u003cp>3.  Language: \"the local newspapers\", \"the democracy\", \"the society\" all over-articled; \"control the local politicians\" is a false friend for \"hold to account\"; and the subsidy proposal appears without argument.\u003c/p>"},"model":["Rafe is describing confounding, and it is the right worry: if advertising revenue moved for reasons unrelated to civic life, then papers closing and attention drifting could both be effects of the same cause. But it is answerable, and some of the work has answered it. The studies Pia is thinking of mostly compare towns that lost a paper with similar towns that did not, in the same years and the same advertising market, and they find the borrowing-cost effect appearing after closure rather than before. Had the shift been purely economic, the two groups would have moved together.","What I would take from Rafe is a narrowing rather than a rejection. The mechanism that survives is specific and unglamorous: somebody attending meetings and writing down what was decided. That function is separable from newspapers, and where it has been replaced — by a funded local reporting scheme, or in a few places by a council obliged to publish minutes properly — the effects seem to soften. So the claim is true about the function and only incidentally about the paper, which matters, because you cannot bring back the advertising but you can pay somebody to sit in the room."],"model_html":"\u003cp>Rafe is describing confounding, and it is the right worry: if advertising revenue moved for reasons unrelated to civic life, then papers closing and attention drifting could both be effects of the same cause. But it is answerable, and some of the work has answered it. The studies Pia is thinking of mostly compare towns that lost a paper with similar towns that did not, in the same years and the same advertising market, and they find the borrowing-cost effect appearing after closure rather than before. Had the shift been purely economic, the two groups would have moved together.\u003c/p>\u003cp>What I would take from Rafe is a narrowing rather than a rejection. The mechanism that survives is specific and unglamorous: somebody attending meetings and writing down what was decided. That function is separable from newspapers, and where it has been replaced — by a funded local reporting scheme, or in a few places by a council obliged to publish minutes properly — the effects seem to soften. So the claim is true about the function and only incidentally about the paper, which matters, because you cannot bring back the advertising but you can pay somebody to sit in the room.\u003c/p>","model_band":5,"degraded":["I completely agree with Pia because the local newspapers are very important for the democracy. When there is no journalist to control the local politicians they can do whatever they want and nobody will know about the corruption. In my city the local newspaper closed two years ago and now we do not have any information about what is happening in the municipality. Rafe says maybe there is another reason but I think the connection is very clear. The governments should support the local press with subsidies so they can continue their important work for the society."],"degraded_html":"\u003cp>I completely agree with Pia because the local newspapers are very important for the democracy. When there is no journalist to control the local politicians they can do whatever they want and nobody will know about the corruption. In my city the local newspaper closed two years ago and now we do not have any information about what is happening in the municipality. Rafe says maybe there is another reason but I think the connection is very clear. The governments should support the local press with subsidies so they can continue their important work for the society.\u003c/p>","degraded_band":3,"model_words":199,"fault_list":{"tag":"F3","faults":["Rafe is not answered. \"I think the connection is very clear\" restates the belief he questioned without engaging the objection, which was about causation.","The evidence is a single anecdote about the writer’s own city, which is exactly the kind of case Rafe’s objection predicts would look convincing and prove nothing.","Language: \"the local newspapers\", \"the democracy\", \"the society\" all over-articled; \"control the local politicians\" is a false friend for \"hold to account\"; and the subsidy proposal appears without argument."],"html":["\u003cp>1.  Rafe is not answered. \"I think the connection is very clear\" restates the belief he questioned without engaging the objection, which was about causation.\u003c/p>","\u003cp>2.  The evidence is a single anecdote about the writer’s own city, which is exactly the kind of case Rafe’s objection predicts would look convincing and prove nothing.\u003c/p>","\u003cp>3.  Language: \"the local newspapers\", \"the democracy\", \"the society\" all over-articled; \"control the local politicians\" is a false friend for \"hold to account\"; and the subsidy proposal appears without argument.\u003c/p>"]},"prof_name":"Dr Oyelowo","professor":"\u003cp>It is often said that the decline of local newspapers has damaged civic life: fewer council meetings covered, lower turnout, more corruption. How far do you accept this account?\u003c/p>","students":[["Pia","I accept it. The studies are reasonably consistent — where a local paper closes, municipal borrowing costs rise and contested elections fall. Somebody was watching, and now nobody is."],["Rafe","I am not convinced the paper was the cause. Local papers declined because advertising moved, and the same shift changed how people spend their evenings. The watching and the turnout may both be downstream of something else."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“As soon as possible” gives no internal deadline, no compiling time is accounted for, and no easier alternative is offered, so the email asks for exactly what has already failed.","correct":false},{"text":"“The form was confusing and did not seem to apply” does not say what the form would actually have done, so the blocking problem is invisible. The third bullet fails.","correct":false},{"text":"Language: “the local newspapers”, “the democracy”, “the society” all over-articled; “control the local politicians” is a false friend for “hold to account”; and the subsidy proposal appears without argument.","correct":true},{"text":"“I am sure our members would be very interested” points the wrong way and raises expectations the writer does not expect to meet.","correct":false},{"text":"Rafe is not answered. “I think the connection is very clear” restates the belief he questioned without engaging the objection, which was about causation.","correct":true},{"text":"The evidence is a single anecdote about the writer’s own city, which is exactly the kind of case Rafe’s objection predicts would look convincing and prove nothing.","correct":true}],"key_html":"F3"}};</script>
