u003cp>3.  Language: \"these international comparisons\", \"the tables\", \"its own needs and values\" — and \"some Asian countries\" does a lot of work without naming anything checkable.\u003c/p>"},"model":["Marco is right that \"the data is confounded\" is not by itself an argument for ignoring data, and Elif is right that the confounders here are not minor. The way through is to notice that the tables support some inferences and not others. Ranking systems is almost worthless, because the ranking is dominated by intake. Tracking a single country’s change over time is much better, because the intake is roughly held constant and the thing that varies is policy.","That distinction also explains the pattern of failed borrowing. What gets imported is usually a visible feature of a high-ranking system — a curriculum, a testing regime — and what cannot be imported is the thing that most plausibly produced the result, such as how selective entry to teaching is or how early children are sorted. So I would use the tables as Marco wants but for Elif’s reasons: not to find out who is best, which they cannot tell us, but to find out which of our own changes moved anything, which they can."],"model_html":"\u003cp>Marco is right that \"the data is confounded\" is not by itself an argument for ignoring data, and Elif is right that the confounders here are not minor. The way through is to notice that the tables support some inferences and not others. Ranking systems is almost worthless, because the ranking is dominated by intake. Tracking a single country’s change over time is much better, because the intake is roughly held constant and the thing that varies is policy.\u003c/p>\u003cp>That distinction also explains the pattern of failed borrowing. What gets imported is usually a visible feature of a high-ranking system — a curriculum, a testing regime — and what cannot be imported is the thing that most plausibly produced the result, such as how selective entry to teaching is or
