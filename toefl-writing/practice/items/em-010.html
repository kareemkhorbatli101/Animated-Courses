<script>window.ITEM={"kind":"exercise","id":"EM 010","slug":"em-010","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"close by making the next step unambiguous","Grammar":"pre-closing formulae","Vocabulary":"transcript, certified, third party, on my behalf","Convention":"asking an office to send your data to someone else"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Everything here is administrative. What is the single way this email can still go wrong?\u003c/p>\u003cp>b.  Why mention the fee before they do?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What makes a transcript \u003cem>official\u003c/em> or \u003cem>certified\u003c/em>, and why will a PDF you forward yourself not do?\u003c/p>\u003cp>b.  What does \u003cem>on my behalf\u003c/em> mean, and who is the \u003cem>third party\u003c/em> here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Write a closing line that tells the reader exactly what happens next and who does it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Count the pieces of information the office would otherwise have had to ask for.\u003c/p>\u003cp>b.  The last line is a question. Why end on one rather than on thanks?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “provided the envelope is sealed and stamped” — why \u003cem>provided\u003c/em> rather than \u003cem>if\u003c/em>?\u003c/p>\u003cp>b.  “I have paid the fee this morning”. Why the present perfect with \u003cem>this morning\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By being incomplete. There is no argument to win and no tone to get right — the only failure mode is a missing address, deadline, record number or payment, each of which costs a round trip you cannot afford against a deadline.\u003c/p>\u003cp>b.  Because it is the one obstacle the office will otherwise stop at. Paying it unprompted removes a step and signals that you have read their procedure, which makes everything else you say more credible.\u003c/p>","P2":"\u003cp>a.  It is sent by the institution, usually sealed and stamped, so the recipient knows it has not passed through your hands. A PDF you forward proves nothing about its integrity, which is the entire point of the requirement.\u003c/p>\u003cp>b.  \u003cstrong>On my behalf\u003c/strong> means acting in your place, with your authority. The \u003cstrong>third party\u003c/strong> is the Varga Foundation — anyone who is neither you nor the university, and whose involvement is why the data protection question arises at all.\u003c/p>","P3":"\u003cp>Model: \u003cem>Could you confirm when it has been sent, so that I can tell them to expect it?\u003c/em>\u003c/p>\u003cp>It names the next action, who performs it, and why — and it gives you a record of dispatch, which is what you will need if it goes astray.\u003c/p>","F1":"\u003cp>a.  Nine: full postal address, named recipient, their deadline, your name, student number, programme, graduation year, the fee payment and its reference. Each one is a reply the office does not have to send.\u003c/p>\u003cp>b.  Because thanks closes a conversation and this one is not finished. A question leaves an action open and makes a reply the natural response — and you want the confirmation on record.\u003c/p>","F2":"\u003cp>a.  \u003cem>Provided\u003c/em> sets a requirement rather than imagining a possibility: it says the foundation permits this, and here is the exact condition. \u003cem>If\u003c/em> would leave the arrangement sounding uncertain.\u003c/p>\u003cp>b.  Because the relevance is present — the fee is paid, the obstacle is gone. \u003cem>This morning\u003c/em> is an unfinished period, so the present perfect is correct; after midnight it would have to be \u003cem>I paid yesterday\u003c/em>.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>No usable details.\u003c/strong> No address, no named recipient, no actual deadline, no student number. The office cannot send anything, so the first and second bullets both fail.\u003c/p>\u003cp>2.  \u003cstrong>It asks about the fee instead of settling it.\u003c/strong> That guarantees at least two more emails before anything is posted, against a deadline the writer calls urgent.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “I need you to send” is an instruction, “as fast as possible” is vague where a date was needed, and there is a comma splice at “as possible, I think”.\u003c/p>"},"model":["Dear Records Office,","I need an official transcript sent directly to a scholarship body, and I understand it has to come from the University rather than from me.","The details are: Varga Foundation, Admissions Office, 14 Rakoczi ut, 1088 Budapest, Hungary, marked for the attention of Dr Eszter Nagy. Their deadline for receipt is 6 June. My record: Jonas Weiss, 2184902, BSc Economics, graduated 2024.","I realise ten working days is the normal turnaround and that 6 June is close, so if it would help I can collect a sealed copy and arrange courier delivery myself — their rules allow that provided the envelope is sealed and stamped by the University.","I have paid the £15 fee online this morning; the reference is TR-44027.","Could you confirm when it has been sent, so that I can tell them to expect it?","Thank you very much.","Yours sincerely,","Jonas Weiss"],"model_html":"\u003cp>Dear Records Office,\u003c/p>\u003cp>I need an official transcript sent directly to a scholarship body, and I understand it has to come from the University rather than from me.\u003c/p>\u003cp>The details are: Varga Foundation, Admissions Office, 14 Rakoczi ut, 1088 Budapest, Hungary, marked for the attention of Dr Eszter Nagy. Their deadline for receipt is 6 June. My record: Jonas Weiss, 2184902, BSc Economics, graduated 2024.\u003c/p>\u003cp>I realise ten working days is the normal turnaround and that 6 June is close, so if it would help I can collect a sealed copy and arrange courier delivery myself — their rules allow that provided the envelope is sealed and stamped by the University.\u003c/p>\u003cp>I have paid the £15 fee online this morning; the reference is TR-44027.\u003c/p>\u003cp>Could you confirm when it has been sent, so that I can tell them to expect it?\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Jonas Weiss\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam,","I need you to send my transcript to a scholarship foundation in Hungary. It is quite urgent because their deadline is soon. Please send it as fast as possible, I think you have all my details in the system already. Also please tell me if there is any fee for this service.","Thanks in advance."],"degraded_html":"\u003cp>Dear Sir/Madam,\u003c/p>\u003cp>I need you to send my transcript to a scholarship foundation in Hungary. It is quite urgent because their deadline is soon. Please send it as fast as possible, I think you have all my details in the system already. Also please tell me if there is any fee for this service.\u003c/p>\u003cp>Thanks in advance.\u003c/p>","degraded_band":3,"model_words":149,"fault_list":{"tag":"F3","faults":["No usable details. No address, no named recipient, no actual deadline, no student number. The office cannot send anything, so the first and second bullets both fail.","It asks about the fee instead of settling it. That guarantees at least two more emails before anything is posted, against a deadline the writer calls urgent.","Language. “I need you to send” is an instruction, “as fast as possible” is vague where a date was needed, and there is a comma splice at “as possible, I think”."],"html":["\u003cp>1.  \u003cstrong>No usable details.\u003c/strong> No address, no named recipient, no actual deadline, no student number. The office cannot send anything, so the first and second bullets both fail.\u003c/p>","\u003cp>2.  \u003cstrong>It asks about the fee instead of settling it.\u003c/strong> That guarantees at least two more emails before anything is posted, against a deadline the writer calls urgent.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “I need you to send” is an instruction, “as fast as possible” is vague where a date was needed, and there is a comma splice at “as possible, I think”.\u003c/p>"]},"scenario":"\u003cp>A scholarship body needs an official transcript sent directly from the university, not by you. Their deadline is 6 June. The records office normally takes ten working days and charges a fee.\u003c/p>","bullets":["Say exactly what you need sent and to whom.","Give the deadline and acknowledge the processing time.","Deal with the fee without being asked."],"header":[["To:","records@northgate.ac.uk"],["Subject:","Official transcript to be sent to the Varga Foundation by 6 June"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language. “I need you to send” is an instruction, “as fast as possible” is vague where a date was needed, and there is a comma splice at “as possible, I think”.","correct":true},{"text":"No usable details. No address, no named recipient, no actual deadline, no student number. The office cannot send anything, so the first and second bullets both fail.","correct":true},{"text":"“Young people are very connected through social media” is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.","correct":false},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":false},{"text":"“Justice delayed is justice denied” is a slogan standing where the argument should be, and the final sentence addresses governments rather than the question. Language: “the justice system”, “the consequences”, “the digital evidence” over-articled.","correct":false},{"text":"It asks about the fee instead of settling it. That guarantees at least two more emails before anything is posted, against a deadline the writer calls urgent.","correct":true}],"key_html":"F3"}};</script>
