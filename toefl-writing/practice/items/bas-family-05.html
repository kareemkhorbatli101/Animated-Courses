<script>window.ITEM={"kind":"family","id":"BAS 035–042","slug":"bas-family-05","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 5 of 12 — participial and absolute phrases","payload":{"Strategy":"subordinate the less important half and the main point lands harder","Grammar":"present, past and perfect participles; absolutes; postmodifiers","Vocabulary":"nothing new — this family buys compression, not words","Convention":"the participle’s hidden subject must be the main subject"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>A participial phrase is a clause with the grammar taken out. It saves three or four words every time, and in a ten-minute task that matters but its real value is rhythm: it keeps one idea clearly subordinate to another. It also carries the one error examiners are trained to spot.\u003c/p>","preview":[{"tag":"P1","title":"Find the hidden subject","html":"\u003cp>Every participle has a subject even though none is written. Who is working in the first, and who is written in the second?\u003c/p>\u003cpre class=\"mono\">Working every evening, she finished the draft in a week.\nWritten in a hurry, it contained several errors.\u003c/pre>"},{"tag":"P2","title":"The error you must never make","html":"\u003cp>What is wrong with this, and why is it funny?\u003c/p>\u003cpre class=\"mono\">Left in the sun overnight, the technician found the sample\nhad spoiled.\u003c/pre>"},{"tag":"P3","title":"Cut it down","html":"\u003cp>Reduce each to a participial phrase.\u003c/p>\u003cpre class=\"mono\">(a) After he had recorded the results, he cleaned up.\n(b) While I was checking the figures, I spotted the error.\n(c) Anyone who is repeating a module must re-register.\u003c/pre>"}],"followup":[{"tag":"F1","title":"-ing or -ed?","html":"\u003cp>Choose, and say what decides it each time.\u003c/p>\u003cpre class=\"mono\">(a) ______ (lose/lost) in the move, the files were never found.\n(b) ______ (arrive/arriving) early, we got the best seats.\n(c) ______ (deliver/delivered) late, the parcel was refused.\u003c/pre>"},{"tag":"F2","title":"Dangling autopsy","html":"\u003cp>Each attaches its participle to the wrong noun. Repair without adding a conjunction.\u003c/p>\u003cpre class=\"mono\">(a) Having finished the experiment, the lab was locked.\n(b) Walking to campus, the rain started.\n(c) Written in 1890, we found the letter in the archive.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Compress each pair into one sentence with a participial phrase. These are the kinds of sentences the discussion task rewards.\u003c/p>\u003cpre class=\"mono\">(a) The rule is applied to every assignment. It becomes a formality.\n(b) The scheme was funded for one year only. It never had time to work.\u003c/pre>"}],"keys":{"P1":"\u003cp>In the first, \u003cstrong>she\u003c/strong> is working. In the second, \u003cstrong>it\u003c/strong> (the report) was written. In both cases the hidden subject is the subject of the main clause — that is the rule, and it has no exceptions outside the absolute construction.\u003c/p>","P2":"\u003cp>It says the \u003cem>technician\u003c/em> was left in the sun overnight. The participle grabs the nearest available subject, which is whatever the main clause starts with.\u003c/p>\u003cp>Repair: \u003cem>Left in the sun overnight, the sample spoiled.\u003c/em> Fix it by changing the main clause, not the phrase.\u003c/p>","P3":"\u003cp>(a) Having recorded the results, he cleaned up.\u003c/p>\u003cp>(b) While checking the figures, I spotted the error.\u003c/p>\u003cp>(c) Anyone repeating a module must re-register.\u003c/p>\u003cp>Note that (c) is a different animal: it modifies a noun, not a clause.\u003c/p>","F1":"\u003cp>(a) \u003cstrong>Lost\u003c/strong> — the files were lost; passive.\u003c/p>\u003cp>(b) \u003cstrong>Arriving\u003c/strong> — we arrived; active.\u003c/p>\u003cp>(c) \u003cstrong>Delivered\u003c/strong> — the parcel was delivered; passive.\u003c/p>\u003cp>The test is always the same: did the subject do it, or was it done to the subject?\u003c/p>","F2":"\u003cp>(a) → Having finished the experiment, \u003cstrong>we\u003c/strong> locked the lab.\u003c/p>\u003cp>(b) → Walking to campus, \u003cstrong>we were caught in the rain\u003c/strong>.\u003c/p>\u003cp>(c) → Written in 1890, \u003cstrong>the letter\u003c/strong> had lain in the archive for a century. (We did not write it.)\u003c/p>\u003cp>In every case the repair is to put the right noun in subject position.\u003c/p>","F3":"\u003cp>(a) Applied to every assignment, the rule becomes a formality.\u003c/p>\u003cp>(b) Funded for one year only, the scheme never had time to work.\u003c/p>\u003cp>Both now read as judgements: the participle has made the first the reason for the second.\u003c/p>"},"rows":[35,36,37,38,39,40,41,42]};</script>
