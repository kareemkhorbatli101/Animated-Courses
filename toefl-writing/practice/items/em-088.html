<script>window.ITEM={"kind":"exercise","id":"EM 088","slug":"em-088","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request to an authority","payload":{"Strategy":"give the decision-maker the evidence they will need to justify it","Grammar":"if-clauses with were to","Vocabulary":"mitigating, corroborate, substantiate, deadline","Convention":"requesting an extension on medical grounds"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The evidence will arrive late. What does that mean the email must do?\u003c/p>\u003cp>b.  Why is the person reading this not the obstacle?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to corroborate a claim, and to substantiate one?\u003c/p>\u003cp>b.  What are mitigating circumstances?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Make the request in one sentence that states the gap in the evidence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer offers a shorter extension than the one requested. Why weaken your own ask?\u003c/p>\u003cp>b.  The last paragraph says the work will be submitted regardless. What does that achieve?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"If the panel were to prefer a shorter provisional extension\" — why this construction rather than \"if you prefer\"?\u003c/p>\u003cp>b.  \"I want to be straightforward about that\" — why flag the honesty rather than just being honest?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It must supply whatever partial evidence exists now and commit to a date for the rest, so the panel can make a provisional decision rather than wait.\u003c/p>\u003cp>b.  Because the panel is applying a policy that already allows this. Their difficulty is documenting a decision, not deciding whether to be kind, so the email’s job is to make the file look complete.\u003c/p>","P2":"\u003cp>a.  To corroborate is to support a claim with independent material; to substantiate is to establish it with sufficient evidence.\u003c/p>\u003cp>b.  Circumstances outside the student’s control that affected performance and may justify an adjustment — the category this request has to fall into.\u003c/p>","P3":"\u003cp>Model: \"I am requesting a two-week extension on medical grounds; I can substantiate the illness but not before the deadline.\"\u003c/p>","F1":"\u003cp>a.  Because the panel’s real constraint is granting an extension without evidence in hand. A shorter provisional one is a decision they can defend today, and a timely week is worth more than a late fortnight.\u003c/p>\u003cp>b.  It removes the panel’s worst outcome — a student who submits nothing and appeals later. Once a submission is guaranteed either way, granting the extension carries no risk.\u003c/p>","F2":"\u003cp>a.  Because \"if you prefer\" asks about the reader’s inclination, while the hypothetical treats it as a panel decision under a policy. It is also more tentative, which suits an applicant proposing an alternative to their own request.\u003c/p>\u003cp>b.  Because the gap in the evidence would otherwise look like something the writer hoped would go unnoticed. Naming it as a disclosure turns a weakness in the application into a reason to trust the rest of it.\u003c/p>","F3":"\u003cp>1.  No dates of treatment, no attachments, no named provider, and no date by which evidence will arrive — the second bullet fails.\u003c/p>\u003cp>2.  \"I hope you will accept my word on this\" asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.\u003c/p>\u003cp>3.  \"Unwell for the past few weeks\" and \"badly behind\" describe the effect on the writer rather than the circumstance, and nothing is proposed for the interim, so the third bullet fails.\u003c/p>"},"model":["Dear Mitigating Circumstances Panel,","I am requesting a two-week extension on the GEOG390 chapter due 2 May, moving it to 16 May, on medical grounds. I can substantiate the illness but not before the deadline, and I want to be straightforward about that.","I was treated at Northgate Walk-in Centre on 14 and 19 April and have attached the discharge slips from both, which carry the dates and the presenting condition but not a prognosis. The GP letter the policy asks for requires an appointment, and the earliest available is 7 May. I can commit to sending it the same day.","If the panel were to prefer a shorter provisional extension pending that letter, a week would still be workable — I would rather have a decision I can plan around than the full two weeks decided late.","In the meantime I am continuing to write and will submit whatever is complete on 2 May if no extension is granted, so there is no question of a missed submission either way.","Thank you for considering it.","Yours sincerely,","Idris Kamara — 2201477"],"model_html":"\u003cp>Dear Mitigating Circumstances Panel,\u003c/p>\u003cp>I am requesting a two-week extension on the GEOG390 chapter due 2 May, moving it to 16 May, on medical grounds. I can substantiate the illness but not before the deadline, and I want to be straightforward about that.\u003c/p>\u003cp>I was treated at Northgate Walk-in Centre on 14 and 19 April and have attached the discharge slips from both, which carry the dates and the presenting condition but not a prognosis. The GP letter the policy asks for requires an appointment, and the earliest available is 7 May. I can commit to sending it the same day.\u003c/p>\u003cp>If the panel were to prefer a shorter provisional extension pending that letter, a week would still be workable — I would rather have a decision I can plan around than the full two weeks decided late.\u003c/p>\u003cp>In the meantime I am continuing to write and will submit whatever is complete on 2 May if no extension is granted, so there is no question of a missed submission either way.\u003c/p>\u003cp>Thank you for considering it.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Idris Kamara — 2201477\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I am writing to request an extension for my GEOG390 chapter which is due on 2 May. I have been quite unwell for the past few weeks and have not been able to work at my normal pace, which has put me badly behind. Unfortunately I cannot get a doctor’s letter before the deadline because the appointment system is very slow, but I hope you will accept my word on this. I would be very grateful if you could grant me two extra weeks.","Idris"],"degraded_html":"\u003cp>Dear Sir/Madam, I am writing to request an extension for my GEOG390 chapter which is due on 2 May. I have been quite unwell for the past few weeks and have not been able to work at my normal pace, which has put me badly behind. Unfortunately I cannot get a doctor’s letter before the deadline because the appointment system is very slow, but I hope you will accept my word on this. I would be very grateful if you could grant me two extra weeks.\u003c/p>\u003cp>Idris\u003c/p>","degraded_band":3,"model_words":182,"fault_list":{"tag":"F3","faults":["No dates of treatment, no attachments, no named provider, and no date by which evidence will arrive — the second bullet fails.","\"I hope you will accept my word on this\" asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.","\"Unwell for the past few weeks\" and \"badly behind\" describe the effect on the writer rather than the circumstance, and nothing is proposed for the interim, so the third bullet fails."],"html":["\u003cp>1.  No dates of treatment, no attachments, no named provider, and no date by which evidence will arrive — the second bullet fails.\u003c/p>","\u003cp>2.  \"I hope you will accept my word on this\" asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.\u003c/p>","\u003cp>3.  \"Unwell for the past few weeks\" and \"badly behind\" describe the effect on the writer rather than the circumstance, and nothing is proposed for the interim, so the third bullet fails.\u003c/p>"]},"scenario":"\u003cp>You need a two-week extension on a dissertation chapter because of a documented illness. The policy allows it but requires evidence, and your GP appointment for a letter is after the deadline.\u003c/p>","bullets":["Make the request.","Address the evidence problem.","Propose what happens in the meantime."],"header":[["To:","mitigating.geog@northgate.ac.uk"],["Subject:","Extension request — GEOG390 chapter 2, evidence to follow"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No dates of treatment, no attachments, no named provider, and no date by which evidence will arrive — the second bullet fails.","correct":true},{"text":"“If they communicate better and share information through a common digital system” assumes the solution rather than proposing it — the difficulty is that nobody is obliged to act on what is shared, which is never addressed.","correct":false},{"text":"“Clever or stupid” misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered.","correct":false},{"text":"“I hope you will accept my word on this” asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.","correct":true},{"text":"“Unwell for the past few weeks” and “badly behind” describe the effect on the writer rather than the circumstance, and nothing is proposed for the interim, so the third bullet fails.","correct":true},{"text":"The rebuttal of Lucas is an anecdotal claim (“many people start when they are already in difficulty”) offered against a statistical objection it cannot touch.","correct":false}],"key_html":"F3"}};</script>
