<script>window.ITEM={"kind":"family","id":"BAS 043–050","slug":"bas-family-06","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 6 of 12 — verb complementation","payload":{"Strategy":"the verb decides what may follow it; this is memory, not logic","Grammar":"gerund, infinitive, object + infinitive, bare infinitive, causative","Vocabulary":"the high-frequency verbs that select each pattern","Convention":"a few verbs change meaning with the pattern, not just form"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>There is no rule here that will save you. Which verbs take -ing and which take to is a fact about each verb, learned one at a time. What this family gives you is the dozen that appear most often in the writing tasks, plus the handful where the choice changes the meaning.\u003c/p>","preview":[{"tag":"P1","title":"Sort them now","html":"\u003cp>Which take -ing, which take to, and which take either?\u003c/p>\u003cpre class=\"mono\">keep · decide · avoid · manage · suggest\nremember · refuse · consider · stop · agree\u003c/pre>"},{"tag":"P2","title":"Meaning, not just form","html":"\u003cp>These two do not mean the same thing. Say what each means.\u003c/p>\u003cpre class=\"mono\">I remember locking the lab.\nI remembered to lock the lab.\u003c/pre>"},{"tag":"P3","title":"Who does what","html":"\u003cp>In which of these is somebody else doing the action?\u003c/p>\u003cpre class=\"mono\">(a) My tutor advised me to apply in writing.\n(b) My tutor agreed to write a reference.\n(c) I had the screen replaced.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Sort the answer key","html":"\u003cp>Go back to P1 and check yourself. Then add three more verbs of your own to each column from the items you have just built.\u003c/p>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) I suggest to meet on Thursday.\n(b) She made me to wait outside.\n(c) He apologised for not to tell us.\n(d) I am looking forward to hear from you.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Each of these is an email sentence. Complete it with the right form.\u003c/p>\u003cpre class=\"mono\">(a) I would be grateful if you could consider (extend) …\n(b) I am writing to apologise for (miss) …\n(c) Could I ask you (confirm) … ?\u003c/pre>"}],"keys":{"P1":"\u003cp>\u003cstrong>-ing:\u003c/strong> keep, avoid, suggest, consider.  \u003cstrong>to:\u003c/strong> decide, manage, refuse, agree.  \u003cstrong>either, with a change of meaning:\u003c/strong> remember, stop.\u003c/p>","P2":"\u003cp>The first means the locking happened and I can picture it. The second means the obligation existed and I discharged it.\u003c/p>\u003cp>Rule of thumb: \u003cstrong>-ing looks back\u003c/strong>, \u003cstrong>to looks forward\u003c/strong>. The same logic explains stop smoking (you quit) against stop to smoke (you paused in order to).\u003c/p>","P3":"\u003cp>\u003cstrong>(a) and (c).\u003c/strong> In (a) I apply; in (c) somebody at a repair shop replaces the screen. Only in (b) does the subject of the sentence do the thing the infinitive names.\u003c/p>\u003cp>This is why the causative is so useful in an email: \u003cem>I had the form signed\u003c/em> reports the outcome without a word about who signed it.\u003c/p>","F1":"\u003cp>No fixed answer — but if you could not place \u003cem>suggest\u003c/em> you should note it now. \u003cem>I suggest to meet\u003c/em> is among the commonest errors in written English, and it appears in F2.\u003c/p>","F2":"\u003cp>(a) → I suggest meeting on Thursday. (Or: I suggest that we meet.)\u003c/p>\u003cp>(b) → She made me wait. No to after make.\u003c/p>\u003cp>(c) → for not telling us. Preposition, therefore -ing.\u003c/p>\u003cp>(d) → looking forward to hearing. The \u003cem>to\u003c/em> here is a preposition, not part of an infinitive — which is exactly why this one catches even advanced writers.\u003c/p>","F3":"\u003cp>(a) consider \u003cstrong>extending\u003c/strong> the deadline\u003c/p>\u003cp>(b) apologise for \u003cstrong>missing\u003c/strong> the meeting\u003c/p>\u003cp>(c) ask you \u003cstrong>to confirm\u003c/strong>\u003c/p>\u003cp>Three different triggers: a verb that takes -ing, a preposition, and a verb that takes object + to.\u003c/p>"},"rows":[43,44,45,46,47,48,49,50]};</script>
