<script>window.ITEM={"kind":"exercise","id":"EM 043","slug":"em-043","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask what you cannot find out, not what you have not looked for","Grammar":"noun clause after wonder","Vocabulary":"accreditation, exemption, module credit, transfer","Convention":"enquiring across institutions"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Quoting the handbook could look like criticism. How do you avoid that?\u003c/p>\u003cp>b.  What will the office need from you before it can even consider this?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish exemption, credit transfer and accreditation of prior learning.\u003c/p>\u003cp>b.  What is a syllabus, and why send one unprompted?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask the single question that the whole email exists for.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer sends the syllabus without being asked. What does that save?\u003c/p>\u003cp>b.  Why ask \"who assesses\" rather than \"can I have an exemption\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I wanted to ask how to go about it\" — what does \"go about\" mean, and why is it right here?\u003c/p>\u003cp>b.  The handbook is quoted exactly. What does that precision do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Quote it neutrally and attach your purpose to the gap rather than to the writing. \"Mentions X but does not say how\" reports a limit; \"does not explain anything\" is a complaint about the author.\u003c/p>\u003cp>b.  Evidence of what the module contained and that you passed it — syllabus, credits, grade. Without those the office can only reply asking for them.\u003c/p>","P2":"\u003cp>a.  An exemption releases you from taking a module; credit transfer imports the credits themselves toward your degree; accreditation of prior learning is the broader process covering experience as well as study.\u003c/p>\u003cp>b.  The document listing what was taught and assessed. Sending it unprompted is what lets somebody make a judgement rather than open a correspondence.\u003c/p>","P3":"\u003cp>Model: \"Could you tell me who assesses an exemption request of this kind, and whether there is a form or deadline I should be working to?\"\u003c/p>","F1":"\u003cp>a.  A full round trip, and probably two — the office would otherwise ask for the syllabus, then for the credits, then forward it to an academic. Supplying the evidence unprompted can turn a three-week process into a three-day one.\u003c/p>\u003cp>b.  Because the office almost certainly cannot grant one; an academic does. Asking the reader a question they can answer gets a reply today; asking one they cannot gets forwarded or ignored.\u003c/p>","F2":"\u003cp>a.  \"How to proceed with it\" — idiomatic, slightly informal, and exactly right for asking about a process whose shape you do not yet know. It avoids implying there is an established route you have failed to find.\u003c/p>\u003cp>b.  It shows the writer has read the handbook, which pre-empts the reply \"please see the handbook\" — the single most common response to enquiries of this kind.\u003c/p>","F3":"\u003cp>1.  It argues the case instead of asking the question. \"I have already learned all this material and it would be a waste of time\" asserts the conclusion the assessor is supposed to reach, on no evidence.\u003c/p>\u003cp>2.  No evidence at all — no module name, credits, grade, syllabus or transcript — so the second bullet fails entirely and nothing can be assessed.\u003c/p>\u003cp>3.  It criticises the handbook (\"not very helpful\") and closes with \"please let me know what I should do\", which asks the reader to design the process.\u003c/p>"},"model":["Dear Undergraduate Office,","I am a second-year Psychology student and I took a statistics module at Leiden before transferring here last year. The handbook mentions that exemptions from PSY210 may be available but does not say how they are assessed, so I wanted to ask how to go about it.","The module was Statistiek II, 7.5 ECTS, passed with 8.0, covering descriptive statistics, t-tests, ANOVA and simple regression in SPSS. I have attached the English syllabus and my transcript extract.","Could you tell me who assesses an exemption request of this kind, and whether there is a form or deadline I should be working to?","Thank you very much.","Best wishes,","Lukas Brandt — 2207741"],"model_html":"\u003cp>Dear Undergraduate Office,\u003c/p>\u003cp>I am a second-year Psychology student and I took a statistics module at Leiden before transferring here last year. The handbook mentions that exemptions from PSY210 may be available but does not say how they are assessed, so I wanted to ask how to go about it.\u003c/p>\u003cp>The module was Statistiek II, 7.5 ECTS, passed with 8.0, covering descriptive statistics, t-tests, ANOVA and simple regression in SPSS. I have attached the English syllabus and my transcript extract.\u003c/p>\u003cp>Could you tell me who assesses an exemption request of this kind, and whether there is a form or deadline I should be working to?\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Lukas Brandt — 2207741\u003c/p>","model_band":5,"degraded":["Hello, I studied statistics in my previous university before coming to Northgate and I would like to know if I can be exempted from PSY210 because I have already learned all this material and it would be a waste of time to repeat it. The handbook says exemptions are available but it does not explain anything, which is not very helpful. Please let me know what I should do.","Lukas"],"degraded_html":"\u003cp>Hello, I studied statistics in my previous university before coming to Northgate and I would like to know if I can be exempted from PSY210 because I have already learned all this material and it would be a waste of time to repeat it. The handbook says exemptions are available but it does not explain anything, which is not very helpful. Please let me know what I should do.\u003c/p>\u003cp>Lukas\u003c/p>","degraded_band":3,"model_words":118,"fault_list":{"tag":"F3","faults":["It argues the case instead of asking the question. \"I have already learned all this material and it would be a waste of time\" asserts the conclusion the assessor is supposed to reach, on no evidence.","No evidence at all — no module name, credits, grade, syllabus or transcript — so the second bullet fails entirely and nothing can be assessed.","It criticises the handbook (\"not very helpful\") and closes with \"please let me know what I should do\", which asks the reader to design the process."],"html":["\u003cp>1.  It argues the case instead of asking the question. \"I have already learned all this material and it would be a waste of time\" asserts the conclusion the assessor is supposed to reach, on no evidence.\u003c/p>","\u003cp>2.  No evidence at all — no module name, credits, grade, syllabus or transcript — so the second bullet fails entirely and nothing can be assessed.\u003c/p>","\u003cp>3.  It criticises the handbook (\"not very helpful\") and closes with \"please let me know what I should do\", which asks the reader to design the process.\u003c/p>"]},"scenario":"\u003cp>You want to know whether a statistics module you passed at another university exempts you from the equivalent here. The handbook says \"exemptions may be available\" and nothing else.\u003c/p>","bullets":["Say what you are asking about and why the handbook does not settle it.","Give the information they will need.","Ask one clear question."],"header":[["To:","ugoffice.psych@northgate.ac.uk"],["Subject:","Possible exemption from PSY210 — prior statistics module"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Companies do not care about their employees, so they will never choose better objectives” changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.","correct":false},{"text":"No evidence at all — no module name, credits, grade, syllabus or transcript — so the second bullet fails entirely and nothing can be assessed.","correct":true},{"text":"Lin’s argument is dismissed with “now we know better and our moral understanding has progressed” — which assumes the reliability of current intuitions, the very thing in dispute.","correct":false},{"text":"It argues the case instead of asking the question. “I have already learned all this material and it would be a waste of time” asserts the conclusion the assessor is supposed to reach, on no evidence.","correct":true},{"text":"It criticises the handbook (“not very helpful”) and closes with “please let me know what I should do”, which asks the reader to design the process.","correct":true},{"text":"“They all worked together” and “history is usually complicated” are claims about historiography, not about literacy, and they would fit any question of this shape.","correct":false}],"key_html":"F3"}};</script>
