<script>window.ITEM={"kind":"exercise","id":"EM 058","slug":"em-058","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"recommend by describing what the thing is actually like","Grammar":"conditional benefit","Vocabulary":"workload, contact time, assessment, convenor","Convention":"advising someone whose situation is better than yours was"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You did badly and still recommend it. How do you make that credible?\u003c/p>\u003cp>b.  The convenor has changed. What does that do to your evidence?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is contact time, and what is a convenor?\u003c/p>\u003cp>b.  Distinguish a hard module from a badly taught one.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Recommend in one sentence that mentions your own mark.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer discloses a mediocre mark in the first line. What does that buy?\u003c/p>\u003cp>b.  Two reasons are given why it would be different for Lena. What kind of reasons are they?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a bad fortnight in March costs you the whole module\" — why is this more useful than \"the assessment is heavily weighted\"?\u003c/p>\u003cp>b.  \"the one I would protect if something had to go\" — what does this formulation convey?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By explaining where the mark came from. A 58 caused by a structural feature of the assessment is different evidence from a 58 caused by not following the material, and only the second would undermine the recommendation.\u003c/p>\u003cp>b.  It invalidates part of it. Anything about teaching, assessment design or pace may no longer hold, which is why the email has to say which of its claims are about the subject and which about the person who taught it.\u003c/p>","P2":"\u003cp>a.  Contact time is scheduled teaching; the convenor is the academic responsible for the module’s design and running.\u003c/p>\u003cp>b.  A hard module demands more of the student; a badly taught one fails to support the demand. The first is worth choosing and the second is not, and students routinely report the second as the first.\u003c/p>","P3":"\u003cp>Model: \"Take it — though I got a 58, which came from the assessment structure rather than from not following it.\"\u003c/p>","F1":"\u003cp>a.  Credibility. A recommendation from someone who did well is expected; one from someone who did not, with the reason given, is obviously not self-flattering — and the mark would surface eventually anyway.\u003c/p>\u003cp>b.  Specific and checkable: a changed convenor with a reported change to the assessment, and a prerequisite Lena has and the writer did not. Both identify exactly which part of the writer’s bad experience would not transfer.\u003c/p>","F2":"\u003cp>a.  Because it describes the consequence rather than the design. \"Heavily weighted\" is a fact about the syllabus; \"a bad fortnight in March costs you the whole module\" is a fact about what can go wrong, which is what the decision actually turns on.\u003c/p>\u003cp>b.  That the recommendation is comparative and costly. Anybody can say a module is good; saying it is the one you would keep at the expense of others ranks it against real alternatives.\u003c/p>","F3":"\u003cp>1.  The mark is mentioned and then explained away with \"I was busy with other things\", which is the least informative possible account and leaves Lena unable to judge the risk.\u003c/p>\u003cp>2.  Nothing distinguishes the writer’s experience from what Lena would get — the convenor change is never mentioned, so the second bullet fails.\u003c/p>\u003cp>3.  No condition is given under which it would be a bad choice, so the third bullet fails; \"you are better at this kind of thing than I am\" is flattery substituting for information; and there are two comma splices.\u003c/p>"},"model":["Hi Lena,","Take it — though I should say I got a 58 in it, which you can weigh however you like.","It was the hardest thing I did that year and it is the only module I still use. The reading is genuinely difficult rather than just long, and the assessment is one 4,000-word piece at the end with no coursework to carry you, so a bad fortnight in March costs you the whole module. That is where my 58 came from rather than from not understanding it.","Two things that make it different for you. Ferris has taken it over from Whitfield, and from what the current third years say the assessment is now split into two pieces, which removes the single point of failure that got me. And you have done the statistics module, which I had not — about a third of the difficulty for me was catching up on that.","I would not do it if you are already carrying two essay-based modules in the same term, because the reading is unbearable alongside them. Otherwise it is the one I would protect if something had to go.","Dan"],"model_html":"\u003cp>Hi Lena,\u003c/p>\u003cp>Take it — though I should say I got a 58 in it, which you can weigh however you like.\u003c/p>\u003cp>It was the hardest thing I did that year and it is the only module I still use. The reading is genuinely difficult rather than just long, and the assessment is one 4,000-word piece at the end with no coursework to carry you, so a bad fortnight in March costs you the whole module. That is where my 58 came from rather than from not understanding it.\u003c/p>\u003cp>Two things that make it different for you. Ferris has taken it over from Whitfield, and from what the current third years say the assessment is now split into two pieces, which removes the single point of failure that got me. And you have done the statistics module, which I had not — about a third of the difficulty for me was catching up on that.\u003c/p>\u003cp>I would not do it if you are already carrying two essay-based modules in the same term, because the reading is unbearable alongside them. Otherwise it is the one I would protect if something had to go.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Lena, I would recommend it, it was definitely the most interesting module I did and I learned a lot from it even though it was quite difficult. The reading list is long but you do not have to read everything, and the lecturer was good. I did not get a brilliant mark but that was mostly because I was busy with other things that term. I think you would enjoy it, you are better at this kind of thing than I am.","Dan"],"degraded_html":"\u003cp>Hi Lena, I would recommend it, it was definitely the most interesting module I did and I learned a lot from it even though it was quite difficult. The reading list is long but you do not have to read everything, and the lecturer was good. I did not get a brilliant mark but that was mostly because I was busy with other things that term. I think you would enjoy it, you are better at this kind of thing than I am.\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":194,"fault_list":{"tag":"F3","faults":["The mark is mentioned and then explained away with \"I was busy with other things\", which is the least informative possible account and leaves Lena unable to judge the risk.","Nothing distinguishes the writer’s experience from what Lena would get — the convenor change is never mentioned, so the second bullet fails.","No condition is given under which it would be a bad choice, so the third bullet fails; \"you are better at this kind of thing than I am\" is flattery substituting for information; and there are two comma splices."],"html":["\u003cp>1.  The mark is mentioned and then explained away with \"I was busy with other things\", which is the least informative possible account and leaves Lena unable to judge the risk.\u003c/p>","\u003cp>2.  Nothing distinguishes the writer’s experience from what Lena would get — the convenor change is never mentioned, so the second bullet fails.\u003c/p>","\u003cp>3.  No condition is given under which it would be a bad choice, so the third bullet fails; \"you are better at this kind of thing than I am\" is flattery substituting for information; and there are two comma splices.\u003c/p>"]},"scenario":"\u003cp>A second-year asks whether to take the module you took last year. You found it hard and got a mediocre mark, but you think it was the most useful thing you did and the convenor has since changed.\u003c/p>","bullets":["Give your view.","Separate your experience from what they would get.","Say what would make it a bad choice for them."],"header":[["To:","l.novak@northgate.ac.uk"],["Subject:","That module — worth doing, with caveats"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The mark is mentioned and then explained away with “I was busy with other things”, which is the least informative possible account and leaves Lena unable to judge the risk.","correct":true},{"text":"Nothing distinguishes the writer’s experience from what Lena would get — the convenor change is never mentioned, so the second bullet fails.","correct":true},{"text":"“Governments waste money on many less important things” does not answer Grace’s argument, which is about the best use of a fixed sum within this policy.","correct":false},{"text":"Mei’s evidence is dismissed as “a small problem” without engaging it — and it was the only empirical claim in the discussion.","correct":false},{"text":"“All new technologies are unproven at first” does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.","correct":false},{"text":"No condition is given under which it would be a bad choice, so the third bullet fails; “you are better at this kind of thing than I am” is flattery substituting for information; and there are two comma splices.","correct":true}],"key_html":"F3"}};</script>
