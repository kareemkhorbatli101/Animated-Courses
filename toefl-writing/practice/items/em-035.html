<script>window.ITEM={"kind":"exercise","id":"EM 035","slug":"em-035","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"refuse a request that is not yours to grant, and route it","Grammar":"negative politeness forms","Vocabulary":"remit, refer, defer to, in a position to","Convention":"declining because you lack the authority, not the will"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  A clear no sent kindly is better than a vague maybe. Why, here especially?\u003c/p>\u003cp>b.  What is the difference between \"I cannot\" and \"I am not in a position to\"?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a remit, and what does it mean to defer to someone?\u003c/p>\u003cp>b.  What is mitigating circumstances, procedurally?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline in one sentence that makes clear the limit is structural, not personal.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The refusal is in the first paragraph and the help is in the third. Why not reverse them?\u003c/p>\u003cp>b.  \"I have been through it with two other people this year.\" What does this line do?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it would not be right for me to try\" — what does adding this to \"I cannot\" achieve?\u003c/p>\u003cp>b.  \"What I can do is this.\" Name the device and say why it is placed there.\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because he is distressed and operating on a deadline. False hope costs him the days he needs for the process that can actually help, which is a far greater harm than disappointment now.\u003c/p>\u003cp>b.  \"I cannot\" states incapacity; \"I am not in a position to\" attributes it to the role rather than the person. The second is gentler and more accurate here, because the limit is structural.\u003c/p>","P2":"\u003cp>a.  A remit is the scope of what you are authorised to deal with. To defer to someone is to leave a decision to them because it is properly theirs.\u003c/p>\u003cp>b.  A formal process by which circumstances affecting performance are considered by a panel, usually with evidence and a deadline, and usually separate from the teaching staff.\u003c/p>","P3":"\u003cp>Model: \"Getting late work accepted is not something a student rep can do, and it would not be right for me to try.\"\u003c/p>","F1":"\u003cp>a.  Because the refusal is the thing he must not misunderstand. Leading with help and burying the no produces a reader who skims, takes the warmth, and still believes you are fixing it.\u003c/p>\u003cp>b.  It converts the offer from politeness into capability. Anyone can offer to come along; someone who has done it twice this year knows what the panel asks for, which is the thing he actually needs.\u003c/p>","F2":"\u003cp>a.  It removes the suspicion that the writer is declining out of reluctance. Saying the attempt would be improper makes the refusal principled rather than unwilling, and quietly explains why pressing her would be unfair.\u003c/p>\u003cp>b.  A wh-cleft (family 8, structure 60), placed at the hinge between what is impossible and what is available. It announces a turn, so the reader stops processing the refusal and starts reading the offer.\u003c/p>","F3":"\u003cp>1.  The refusal is softened into vagueness and the route is guesswork: \"maybe you could try\", \"there might be some kind of mitigating circumstances procedure you could look into\". He is left to find it himself, under deadline.\u003c/p>\u003cp>2.  The advice is partly wrong — it sends him to his tutor, when the process goes to the faculty office — and no deadline is given, which is the single most important fact.\u003c/p>\u003cp>3.  \"I hope it works out for you\" closes without offering anything, so the third bullet fails; and there is a comma splice in the first sentence.\u003c/p>"},"model":["Hi Joseph,","I am sorry you are in this position, and I want to be straight with you rather than leave you hoping: getting late work accepted is not something a student rep can do, and it would not be right for me to try. Decisions on late submission sit with the module convenor and, above that, the exam board.","What does exist is the mitigating circumstances process, and from what you have described it sounds as though you may well have grounds. It is a form plus evidence, it goes to the faculty office rather than to your tutor, and the deadline for this semester is 14 June — which matters, because that one is strict.","What I can do is this. I am happy to read the form before you submit it, I can tell you what the panel usually wants to see, and if you would rather not deal with the faculty office alone I will come with you. I have been through it with two other people this year.","Send me a draft whenever you like.","Best,","Nadia"],"model_html":"\u003cp>Hi Joseph,\u003c/p>\u003cp>I am sorry you are in this position, and I want to be straight with you rather than leave you hoping: getting late work accepted is not something a student rep can do, and it would not be right for me to try. Decisions on late submission sit with the module convenor and, above that, the exam board.\u003c/p>\u003cp>What does exist is the mitigating circumstances process, and from what you have described it sounds as though you may well have grounds. It is a form plus evidence, it goes to the faculty office rather than to your tutor, and the deadline for this semester is 14 June — which matters, because that one is strict.\u003c/p>\u003cp>What I can do is this. I am happy to read the form before you submit it, I can tell you what the panel usually wants to see, and if you would rather not deal with the faculty office alone I will come with you. I have been through it with two other people this year.\u003c/p>\u003cp>Send me a draft whenever you like.\u003c/p>\u003cp>Best,\u003c/p>\u003cp>Nadia\u003c/p>","model_band":5,"degraded":["Hi Joseph, I am really sorry to hear about your situation, that sounds very stressful. Unfortunately as a student rep I do not have the power to change decisions about coursework deadlines, that is up to the teaching staff. Maybe you could try talking to your tutor and explain the circumstances, or there might be some kind of mitigating circumstances procedure you could look into. I hope it works out for you.","Nadia"],"degraded_html":"\u003cp>Hi Joseph, I am really sorry to hear about your situation, that sounds very stressful. Unfortunately as a student rep I do not have the power to change decisions about coursework deadlines, that is up to the teaching staff. Maybe you could try talking to your tutor and explain the circumstances, or there might be some kind of mitigating circumstances procedure you could look into. I hope it works out for you.\u003c/p>\u003cp>Nadia\u003c/p>","degraded_band":3,"model_words":181,"fault_list":{"tag":"F3","faults":["The refusal is softened into vagueness and the route is guesswork: \"maybe you could try\", \"there might be some kind of mitigating circumstances procedure you could look into\". He is left to find it himself, under deadline.","The advice is partly wrong — it sends him to his tutor, when the process goes to the faculty office — and no deadline is given, which is the single most important fact.","\"I hope it works out for you\" closes without offering anything, so the third bullet fails; and there is a comma splice in the first sentence."],"html":["\u003cp>1.  The refusal is softened into vagueness and the route is guesswork: \"maybe you could try\", \"there might be some kind of mitigating circumstances procedure you could look into\". He is left to find it himself, under deadline.\u003c/p>","\u003cp>2.  The advice is partly wrong — it sends him to his tutor, when the process goes to the faculty office — and no deadline is given, which is the single most important fact.\u003c/p>","\u003cp>3.  \"I hope it works out for you\" closes without offering anything, so the third bullet fails; and there is a comma splice in the first sentence.\u003c/p>"]},"scenario":"\u003cp>A first-year has emailed you, as a student representative, asking you to get their late coursework accepted. You have no power to do this and it would be improper to try, but they are plainly distressed.\u003c/p>","bullets":["Decline clearly.","Explain why, without sounding bureaucratic.","Route them to what will actually help."],"header":[["To:","j.adeyemi@northgate.ac.uk"],["Subject:","Your coursework — what I can and cannot do"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Which is obviously good for society” does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.","correct":false},{"text":"The conclusion abandons the task. “the truth is somewhere in the middle and we need more research” declines to take the position the task explicitly requires, and it does not say what research or what it would settle.","correct":false},{"text":"Language: “all the three causes”, “a simple flu” (flu is viral, so the example undercuts itself), “the antibiotics for the future generations”.","correct":false},{"text":"The refusal is softened into vagueness and the route is guesswork: “maybe you could try”, “there might be some kind of mitigating circumstances procedure you could look into”. He is left to find it himself, under deadline.","correct":true},{"text":"“I hope it works out for you” closes without offering anything, so the third bullet fails; and there is a comma splice in the first sentence.","correct":true},{"text":"The advice is partly wrong — it sends him to his tutor, when the process goes to the faculty office — and no deadline is given, which is the single most important fact.","correct":true}],"key_html":"F3"}};</script>
