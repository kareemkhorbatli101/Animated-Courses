<script>window.ITEM={"kind":"exercise","id":"AD 003","slug":"ad-003","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Education · policy choice","payload":{"Strategy":"attack the assumption both sides share","Grammar":"conditional qualification","Vocabulary":"streaming, attainment gap, self-concept","Convention":"disagreeing with the question rather than the answers"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Nadia argues about teaching; what does Theo argue about?\u003c/p>\u003cp>b.  What do they both assume that the response could question?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an attainment gap, and what is a pupil’s self-concept?\u003c/p>\u003cp>b.  Distinguish streaming, setting and banding.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Accept Nadia’s teaching problem and Theo’s objection in one sentence, and point at what follows. Under 35 words.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response names something neither classmate said. What is it?\u003c/p>\u003cp>b.  The second paragraph rejects the obvious evidence. Why?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"which makes the original judgement true\" — what is being described, and why is it the strongest sentence in the response?\u003c/p>\u003cp>b.  \"a set reviewed every term ... is a different instrument from a stream assigned at seven\". Why \"instrument\"?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Theo argues about measurement and consequence — what the grouping decision is actually made on, and what it does to the pupil afterwards.\u003c/p>\u003cp>b.  That grouping is a single permanent act. Nadia defends it as such and Theo attacks it as such; neither considers a grouping that is reviewed, which is where the response goes.\u003c/p>","P2":"\u003cp>a.  The attainment gap is the difference in measured achievement between groups, usually by background. Self-concept is a pupil’s own sense of what kind of learner they are, and it is the mechanism by which a label becomes a result.\u003c/p>\u003cp>b.  Streaming puts a pupil in one group for everything; setting groups them subject by subject; banding is a coarser grouping into broad bands. The distinction matters because setting is reversible in a way streaming is not.\u003c/p>","P3":"\u003cp>Model: \"Theo’s objection is to irreversibility rather than to grouping, which means the answer is a set reviewed every term rather than no grouping at all.\"\u003c/p>","F1":"\u003cp>a.  That the bottom group gets the least experienced teachers and a narrowed curriculum. Nadia assumes grouping improves teaching for everyone; Theo assumes the harm is in the labelling. Neither names what actually happens to the lowest set after it is formed.\u003c/p>\u003cp>b.  Because average outcomes hide the distribution. If streaming helps the top and harms the bottom by similar amounts, the average shows nothing while the policy question — who bears the cost — is entirely unanswered.\u003c/p>","F2":"\u003cp>a.  A self-fulfilling prophecy: the prediction made at seven causes the conditions that make it come true. It is the strongest sentence because it converts Theo’s fairness objection into a causal claim, which is both harder to dismiss and open to a fix.\u003c/p>\u003cp>b.  Because an instrument is a tool chosen for a purpose and judged by whether it achieves it. Calling both things \"grouping\" hides the difference; calling them two instruments makes the design question visible.\u003c/p>","F3":"\u003cp>1.  It takes no position. \"Both have good arguments\" followed by a compromise that neither would dispute.\u003c/p>\u003cp>2.  Nothing is added. Every point is a restatement, and \"give extra support to the weaker ones\" is exactly the vague remedy that the question about streaming exists to interrogate.\u003c/p>\u003cp>3.  Language: \"when he is only seven years old\" (generic \"they\"), \"the schools should group the students\" (over-articled), \"nobody is left behind\" is a slogan rather than an argument.\u003c/p>"},"model":["Both are right about different things, and the thing they share is the assumption that grouping is permanent. Nadia’s problem is real: a single class spanning six levels is genuinely hard to teach well. Theo’s objection is also real, but it is an objection to irreversibility rather than to grouping as such — a set reviewed every term on current work is a different instrument from a stream assigned at seven.","So I would keep the grouping and attack the permanence. The evidence that matters here is not whether streamed pupils do better on average, which is roughly a wash, but what happens to the bottom group: they get the least experienced teachers and a narrowed curriculum, which makes the original judgement true. Fix the movement between sets and the staffing of the lowest one, and most of what Theo is objecting to disappears without costing Nadia her teachable class."],"model_html":"\u003cp>Both are right about different things, and the thing they share is the assumption that grouping is permanent. Nadia’s problem is real: a single class spanning six levels is genuinely hard to teach well. Theo’s objection is also real, but it is an objection to irreversibility rather than to grouping as such — a set reviewed every term on current work is a different instrument from a stream assigned at seven.\u003c/p>\u003cp>So I would keep the grouping and attack the permanence. The evidence that matters here is not whether streamed pupils do better on average, which is roughly a wash, but what happens to the bottom group: they get the least experienced teachers and a narrowed curriculum, which makes the original judgement true. Fix the movement between sets and the staffing of the lowest one, and most of what Theo is objecting to disappears without costing Nadia her teachable class.\u003c/p>","model_band":5,"degraded":["In my opinion this is a difficult question because both students have good arguments. Nadia is right that the teacher cannot teach all the levels at the same time and some students will be bored while others cannot follow. But Theo is also right that it is not fair to decide the future of a child when he is only seven years old. I think the best solution is that the schools should group the students but they should also give extra support to the weaker ones so everybody can improve and nobody is left behind."],"degraded_html":"\u003cp>In my opinion this is a difficult question because both students have good arguments. Nadia is right that the teacher cannot teach all the levels at the same time and some students will be bored while others cannot follow. But Theo is also right that it is not fair to decide the future of a child when he is only seven years old. I think the best solution is that the schools should group the students but they should also give extra support to the weaker ones so everybody can improve and nobody is left behind.\u003c/p>","degraded_band":3,"model_words":149,"fault_list":{"tag":"F3","faults":["It takes no position. \"Both have good arguments\" followed by a compromise that neither would dispute.","Nothing is added. Every point is a restatement, and \"give extra support to the weaker ones\" is exactly the vague remedy that the question about streaming exists to interrogate.","Language: \"when he is only seven years old\" (generic \"they\"), \"the schools should group the students\" (over-articled), \"nobody is left behind\" is a slogan rather than an argument."],"html":["\u003cp>1.  It takes no position. \"Both have good arguments\" followed by a compromise that neither would dispute.\u003c/p>","\u003cp>2.  Nothing is added. Every point is a restatement, and \"give extra support to the weaker ones\" is exactly the vague remedy that the question about streaming exists to interrogate.\u003c/p>","\u003cp>3.  Language: \"when he is only seven years old\" (generic \"they\"), \"the schools should group the students\" (over-articled), \"nobody is left behind\" is a slogan rather than an argument.\u003c/p>"]},"prof_name":"Dr Whitfield","professor":"\u003cp>Many schools group pupils by ability for core subjects, on the argument that teaching can then be pitched accurately. Others keep mixed classes, arguing that grouping entrenches early judgements. Should schools stream pupils by ability?\u003c/p>","students":[["Nadia","Yes. A teacher facing thirty pupils at six different levels teaches to the middle and loses both ends. Grouping lets the strong move and the struggling get the pace they need."],["Theo","No. Streaming decisions are made at seven or eight on evidence that is mostly about how much reading happened at home, and they are almost never reversed. You are not sorting ability, you are fixing a starting position in place."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The title is not supplied, so the smallest possible action is still “search your inbox”. The second bullet fails entirely.","correct":false},{"text":"“I hope you will accept my word on this” asks the panel to waive a requirement it cannot waive, instead of offering partial evidence it could record.","correct":false},{"text":"Nobody is named, the number affected is “a few”, and no refund is offered — “if the people affected want to discuss compensation they can contact me” makes them ask. The third bullet fails.","correct":false},{"text":"It takes no position. “Both have good arguments” followed by a compromise that neither would dispute.","correct":true},{"text":"Language: “when he is only seven years old” (generic “they”), “the schools should group the students” (over-articled), “nobody is left behind” is a slogan rather than an argument.","correct":true},{"text":"Nothing is added. Every point is a restatement, and “give extra support to the weaker ones” is exactly the vague remedy that the question about streaming exists to interrogate.","correct":true}],"key_html":"F3"}};</script>
