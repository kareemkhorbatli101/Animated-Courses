<script>window.ITEM={"kind":"exercise","id":"EM 014","slug":"em-014","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"separate the fault from the money you want back","Grammar":"the perfect modal of reproach, used sparingly","Vocabulary":"credit, retain, voucher, goodwill","Convention":"complaining to a machine’s owner rather than the machine"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The third bullet rules something out. Why?\u003c/p>\u003cp>b.  Which single piece of information makes this traceable?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Your account holds \u003cem>credit\u003c/em>. What verb goes with returning it — \u003cem>refund\u003c/em>, \u003cem>reimburse\u003c/em>, \u003cem>credit back\u003c/em>?\u003c/p>\u003cp>b.  What is a \u003cem>goodwill\u003c/em> payment, and why might an office prefer it to admitting a fault?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Say the machine kept your money without saying anyone stole it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer explicitly declines to ask about the machine. What does that buy?\u003c/p>\u003cp>b.  Why offer to accept a goodwill credit rather than insist on a traced refund?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “the credit is gone” — why not \u003cem>you took my credit\u003c/em>?\u003c/p>\u003cp>b.  “I imagine that has been done.” What is the function of this very short sentence?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the two requests have different owners and different speeds. Repairs go to a technician and take weeks; a credit adjustment is a clerk and takes a minute. Asking for both lets the fast one get stuck behind the slow one.\u003c/p>\u003cp>b.  The fault reference. It proves the report was made and dates it, which is the whole of your case for the two-week delay.\u003c/p>","P2":"\u003cp>a.  All three are possible, but \u003cstrong>credit back\u003c/strong> is the precise one for a balance on an internal account. \u003cem>Refund\u003c/em> suggests money returning to a bank; \u003cem>reimburse\u003c/em> suggests repaying an expense you incurred.\u003c/p>\u003cp>b.  A payment made without accepting liability. Offices like it because it settles the matter without creating a precedent or an admission — so offering to accept one is a genuine concession, not a surrender.\u003c/p>","P3":"\u003cp>Model: \u003cem>The printer took £5.00 of credit and then stopped before printing anything.\u003c/em>\u003c/p>\u003cp>The machine is the subject, the verb is neutral, and the sequence does the accusing.\u003c/p>","F1":"\u003cp>a.  Speed. It strips the email down to one request, owned by one person, actionable today — and it signals that you are not using a £5 problem as a platform for complaining about the service generally.\u003c/p>\u003cp>b.  Because tracing a failed transaction may be genuinely difficult or impossible, and insisting on it could leave the office unable to help you at all. You want the £5, not an audit.\u003c/p>","F2":"\u003cp>a.  Because the money has not gone to them in any meaningful sense — it has been lost between systems. Accusing the reader of taking it is both inaccurate and the fastest way to make a clerk defensive.\u003c/p>\u003cp>b.  It performs generosity cheaply. By assuming the repair has been handled, the writer avoids the implication that nothing has been done, while still making clear that the one thing that matters to him has not.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It accuses the machine of theft and the office of indifference.\u003c/strong> “stole”, “of course nobody answered”, “always broken”, “wasting our money”. None of it is actionable and all of it invites a defensive reply.\u003c/p>\u003cp>2.  \u003cstrong>It asks for the wrong things.\u003c/strong> The third bullet specifically ruled out asking for the machine to be fixed; this asks for that, for new machines, and for a refund, with no reference number to find the report.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Dear Sir” to a service team, “5 pounds” (£5), and the run-together opening line with the greeting on the same line as the first sentence.\u003c/p>"},"model":["Dear Print Services,","On 2 April the printer in the library foyer (LIB-07) took £5.00 of credit from my account and then stopped before printing anything. The job does not appear in my history, but the credit is gone.","I logged it on the touchscreen the same afternoon and was given reference PR-3318. That was a fortnight ago and the credit has not come back.","I am not asking for the machine to be looked at — I imagine that has been done. Could the £5.00 simply be credited back to my account? If it is easier to add it as a goodwill credit than to trace the original transaction, that would be perfectly fine by me.","Thank you.","Best wishes,","Ewan Carrick — 2199031"],"model_html":"\u003cp>Dear Print Services,\u003c/p>\u003cp>On 2 April the printer in the library foyer (LIB-07) took £5.00 of credit from my account and then stopped before printing anything. The job does not appear in my history, but the credit is gone.\u003c/p>\u003cp>I logged it on the touchscreen the same afternoon and was given reference PR-3318. That was a fortnight ago and the credit has not come back.\u003c/p>\u003cp>I am not asking for the machine to be looked at — I imagine that has been done. Could the £5.00 simply be credited back to my account? If it is easier to add it as a goodwill credit than to trace the original transaction, that would be perfectly fine by me.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ewan Carrick — 2199031\u003c/p>","model_band":5,"degraded":["Dear Sir, Your printer in the library stole 5 pounds from my account two weeks ago and printed nothing at all. I reported it immediately but of course nobody answered me. These machines are always broken and the university should buy new ones instead of wasting our money. Please return my 5 pounds and also fix the printer because other students are losing their money too.","Ewan"],"degraded_html":"\u003cp>Dear Sir, Your printer in the library stole 5 pounds from my account two weeks ago and printed nothing at all. I reported it immediately but of course nobody answered me. These machines are always broken and the university should buy new ones instead of wasting our money. Please return my 5 pounds and also fix the printer because other students are losing their money too.\u003c/p>\u003cp>Ewan\u003c/p>","degraded_band":3,"model_words":127,"fault_list":{"tag":"F3","faults":["It accuses the machine of theft and the office of indifference. “stole”, “of course nobody answered”, “always broken”, “wasting our money”. None of it is actionable and all of it invites a defensive reply.","It asks for the wrong things. The third bullet specifically ruled out asking for the machine to be fixed; this asks for that, for new machines, and for a refund, with no reference number to find the report.","Language and register. “Dear Sir” to a service team, “5 pounds” (£5), and the run-together opening line with the greeting on the same line as the first sentence."],"html":["\u003cp>1.  \u003cstrong>It accuses the machine of theft and the office of indifference.\u003c/strong> “stole”, “of course nobody answered”, “always broken”, “wasting our money”. None of it is actionable and all of it invites a defensive reply.\u003c/p>","\u003cp>2.  \u003cstrong>It asks for the wrong things.\u003c/strong> The third bullet specifically ruled out asking for the machine to be fixed; this asks for that, for new machines, and for a refund, with no reference number to find the report.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Dear Sir” to a service team, “5 pounds” (£5), and the run-together opening line with the greeting on the same line as the first sentence.\u003c/p>"]},"scenario":"\u003cp>A printing machine took £5 of credit and produced nothing. You reported it on the touchscreen fault log, which gave you a reference. Nothing has happened in two weeks.\u003c/p>","bullets":["Report what happened.","Say what you did about it.","Ask for the credit back, not for the machine to be fixed."],"header":[["To:","printservices@northgate.ac.uk"],["Subject:","Lost print credit — machine LIB-07, fault ref PR-3318"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It accuses the machine of theft and the office of indifference. “stole”, “of course nobody answered”, “always broken”, “wasting our money”. None of it is actionable and all of it invites a defensive reply.","correct":true},{"text":"Language and register. “Dear Sir” to a service team, “5 pounds” (£5), and the run-together opening line with the greeting on the same line as the first sentence.","correct":true},{"text":"Neither Ines nor Mateo is engaged — “both make good points” is the only reference to either, and Mateo’s specific objection about print in low-literacy regions is left standing untouched.","correct":false},{"text":"“Obviously true because everybody knows” is precisely the reasoning the discussion was questioning, and Nadia’s trial evidence — the only thing that answers Lucas — is never mentioned.","correct":false},{"text":"It asks for the wrong things. The third bullet specifically ruled out asking for the machine to be fixed; this asks for that, for new machines, and for a refund, with no reference number to find the report.","correct":true},{"text":"“If every community blocks wind farms” answers a general argument nobody made, and the possibility of a different site — the obvious move — is never considered.","correct":false}],"key_html":"F3"}};</script>
