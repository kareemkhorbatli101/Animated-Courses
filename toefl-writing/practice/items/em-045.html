<script>window.ITEM={"kind":"exercise","id":"EM 045","slug":"em-045","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask about the exception, not the rule","Grammar":"could you confirm whether","Vocabulary":"invigilation, remote sitting, time zone, concession","Convention":"enquiring about something the policy does not cover"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The regulations are silent. What does that usually mean, and how should you ask?\u003c/p>\u003cp>b.  Why state your fallback?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is invigilation, and why does it make remote sitting hard?\u003c/p>\u003cp>b.  What is a concession in an exams context?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask whether something is possible without implying you expect it to be.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The fallback paragraph asks for something too. What, and why is it clever to put it there?\u003c/p>\u003cp>b.  The writer offers the office an easy \"no\". Where, and why?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Could you confirm whether ... and if so what the basis would be\" — why does this get a better answer than \"can I sit remotely\"?\u003c/p>\u003cp>b.  \"a family matter that I cannot move\" — how much is disclosed, and why that much?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Usually that it is not routinely offered but may exist as a discretionary arrangement. So ask whether it is ever permitted and on what basis, rather than asking for it — the first is a question about policy, the second a request for an exception you have no grounds to claim yet.\u003c/p>\u003cp>b.  Because it removes any suggestion that you are trying to avoid the exam, and it converts a possible \"no\" into a useful reply: if the answer is no, you still get the dates.\u003c/p>","P2":"\u003cp>a.  Supervision of candidates during an exam. It makes remote sitting hard because the institution must guarantee the conditions, which usually means an approved centre rather than a laptop at home.\u003c/p>\u003cp>b.  A discretionary allowance made outside the normal regulations, usually on documented grounds.\u003c/p>","P3":"\u003cp>Model: \"Could you confirm whether remote sitting is ever permitted for resits, and if so what the basis would be?\"\u003c/p>","F1":"\u003cp>a.  The dates, as early as possible. It is clever because it is attached to the worst outcome, so granting it costs the office nothing and feels like a concession — and it is the thing that actually saves the writer money.\u003c/p>\u003cp>b.  \"I realise it may simply not be offered, in which case I would rather know now.\" A reader who can see that a refusal will not cause a fight replies faster and more frankly.\u003c/p>","F2":"\u003cp>a.  Because it asks two linked questions, neither of which requires the office to make a decision about the writer. \"Can I sit remotely\" is an application; this is an enquiry, and enquiries get answered by whoever opens the email.\u003c/p>\u003cp>b.  The minimum: that it is family, that it is in August, and that it is immovable. Those are the three properties that matter. More would invite a judgement about whether the reason is good enough, which is not a conversation worth starting.\u003c/p>","F3":"\u003cp>1.  It requests rather than enquires, and does so without any grounds — no documentation is offered and no basis in the regulations is identified.\u003c/p>\u003cp>2.  The reason given is cost and inconvenience, which is the one argument an exams office cannot act on. The real constraint, an immovable family matter, is softened into \"important family reasons\".\u003c/p>\u003cp>3.  No fallback, so a \"no\" ends the correspondence with the writer no better off; and \"Thank you in advance for your understanding\" thanks them for agreeing before they have.\u003c/p>"},"model":["Dear Exams Office,","I am due to sit two resits in the August period. I will be abroad for part of August for a family matter that I cannot move, and I wanted to ask about the options before the timetable is published.","Could you confirm whether remote sitting is ever permitted for resits, and if so what the basis would be — whether it requires an approved invigilation centre, or whether it is only available in specific documented circumstances? I realise it may simply not be offered, in which case I would rather know now.","If it is not possible, I would plan to return for the papers and would just need the dates as early as you can give them, so that I can book flights at a sensible price.","Thank you very much.","Yours sincerely,","Daniyar Seitov — 2184412"],"model_html":"\u003cp>Dear Exams Office,\u003c/p>\u003cp>I am due to sit two resits in the August period. I will be abroad for part of August for a family matter that I cannot move, and I wanted to ask about the options before the timetable is published.\u003c/p>\u003cp>Could you confirm whether remote sitting is ever permitted for resits, and if so what the basis would be — whether it requires an approved invigilation centre, or whether it is only available in specific documented circumstances? I realise it may simply not be offered, in which case I would rather know now.\u003c/p>\u003cp>If it is not possible, I would plan to return for the papers and would just need the dates as early as you can give them, so that I can book flights at a sensible price.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Daniyar Seitov — 2184412\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I need to sit my resits in August but unfortunately I will be in my home country at that time for important family reasons. Therefore I would like to request permission to take the exams online from there. I hope you can arrange this for me as it would be very difficult and expensive for me to travel back just for two exams. Thank you in advance for your understanding.","Daniyar"],"degraded_html":"\u003cp>Dear Sir/Madam, I need to sit my resits in August but unfortunately I will be in my home country at that time for important family reasons. Therefore I would like to request permission to take the exams online from there. I hope you can arrange this for me as it would be very difficult and expensive for me to travel back just for two exams. Thank you in advance for your understanding.\u003c/p>\u003cp>Daniyar\u003c/p>","degraded_band":3,"model_words":140,"fault_list":{"tag":"F3","faults":["It requests rather than enquires, and does so without any grounds — no documentation is offered and no basis in the regulations is identified.","The reason given is cost and inconvenience, which is the one argument an exams office cannot act on. The real constraint, an immovable family matter, is softened into \"important family reasons\".","No fallback, so a \"no\" ends the correspondence with the writer no better off; and \"Thank you in advance for your understanding\" thanks them for agreeing before they have."],"html":["\u003cp>1.  It requests rather than enquires, and does so without any grounds — no documentation is offered and no basis in the regulations is identified.\u003c/p>","\u003cp>2.  The reason given is cost and inconvenience, which is the one argument an exams office cannot act on. The real constraint, an immovable family matter, is softened into \"important family reasons\".\u003c/p>","\u003cp>3.  No fallback, so a \"no\" ends the correspondence with the writer no better off; and \"Thank you in advance for your understanding\" thanks them for agreeing before they have.\u003c/p>"]},"scenario":"\u003cp>You will be abroad for a compulsory family matter during the resit period. You want to know whether remote sitting is ever permitted, and if so on what basis. The regulations are silent.\u003c/p>","bullets":["Explain the situation briefly.","Ask whether the thing you want is possible at all.","Say what you will do if it is not."],"header":[["To:","exams@northgate.ac.uk"],["Subject:","Resit period — is remote sitting ever permitted?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No fallback, so a “no” ends the correspondence with the writer no better off; and “Thank you in advance for your understanding” thanks them for agreeing before they have.","correct":true},{"text":"The reason given is cost and inconvenience, which is the one argument an exams office cannot act on. The real constraint, an immovable family matter, is softened into “important family reasons”.","correct":true},{"text":"It is not a contribution. It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":false},{"text":"It requests rather than enquires, and does so without any grounds — no documentation is offered and no basis in the regulations is identified.","correct":true},{"text":"It never engages Marcus, whose entire point is that the market constrains invisibly. “Create whatever they want” is the claim he disputed.","correct":false},{"text":"“Readers must understand that good journalism has a cost” is an exhortation rather than an argument. Language: “the quality of the information”, “the information” over-articled; “clickbait” is used as an explanation rather than described.","correct":false}],"key_html":"F3"}};</script>
