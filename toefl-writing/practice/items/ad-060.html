<script>window.ITEM={"kind":"exercise","id":"AD 060","slug":"ad-060","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Sociology · agree / disagree","payload":{"Strategy":"convert a moral claim into a testable one","Grammar":"cleft sentences for emphasis","Vocabulary":"cohesion, atomisation, civic, associational","Convention":"testing a claim about social decline"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Idris is making a measurement objection. State it precisely.\u003c/p>\u003cp>b.  What would count as evidence that the forms had changed rather than declined?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is social cohesion, and what is atomisation?\u003c/p>\u003cp>b.  What does associational mean in this context?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that names what would settle it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Idris’s objection and then turns it against him. How?\u003c/p>\u003cp>b.  Why does the third paragraph propose a test?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is that function, not the membership figures, that I think has genuinely declined\" — identify the structure and say what it does.\u003c/p>\u003cp>b.  \"it is the unchosen contact rather than the clubhouse\" — why end on this contrast?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the indicator captures only one historical form of association, so a fall in it does not establish a fall in the underlying thing. The measure and the concept have come apart.\u003c/p>\u003cp>b.  Evidence that the functions the old institutions performed — repeated contact, mutual obligation, collective action — are now performed elsewhere. Showing that new groups exist is not enough; they have to do the same work.\u003c/p>","P2":"\u003cp>a.  Cohesion is the density of ties and shared obligation in a population; atomisation is its breakdown into separate individuals.\u003c/p>\u003cp>b.  Relating to formal membership organisations — which is exactly the narrow sense Idris is objecting to.\u003c/p>","P3":"\u003cp>Model: \"The question is whether people still have regular dealings with others they did not choose, and that is what the membership figures only indirectly measure.\"\u003c/p>","F1":"\u003cp>a.  By accepting that membership is a poor measure and then applying the same standard to his alternative. If the test is what the institutions did rather than what they were called, interest-based networks fail it, because they are chosen and the old forms were not.\u003c/p>\u003cp>b.  Because the dispute has become about which indicator is right, and that cannot be settled by assertion. Naming a test — contact with people unlike yourself — converts a disagreement about values into one about evidence.\u003c/p>","F2":"\u003cp>a.  A cleft: \"It is that function ... that has declined.\" It puts the writer’s candidate in focus position and explicitly displaces Sara’s, which is more precise than simply asserting a different indicator.\u003c/p>\u003cp>b.  Because it summarises the whole argument in one opposition. The clubhouse is the form Sara counted; the unchosen contact is the function the response says was lost, and ending there fixes the distinction in the reader’s mind.\u003c/p>","F3":"\u003cp>1.  \"Society is always changing and we should not be nostalgic\" answers nobody’s argument — neither speaker claimed the past was better, only that something measurable has changed.\u003c/p>\u003cp>2.  \"Young people are very connected through social media\" is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.\u003c/p>\u003cp>3.  \"In my country people still have very strong family and neighbour relationships\" is a single observation set against population-level evidence, and no test or indicator is proposed anywhere.\u003c/p>"},"model":["Sara is measuring something real and Idris is right that it is not quite the thing in dispute.","The membership figures are not in doubt. What is in doubt is whether membership of formal organisations is the right indicator of cohesion, and Idris has a point: an interest-based network leaves no register to count. But his alternative has to do the same work, and this is where I part from him. The function those institutions performed was repeated contact with people you had not chosen — neighbours, colleagues, fellow parishioners. Interest-based networks are selected, so they do not produce that contact at all.","It is that function, not the membership figures, that I think has genuinely declined. The test would be whether people still have regular dealings with others unlike themselves, and the available evidence on neighbourhood ties and cross-class friendship suggests they do not.","So the honest answer is that both are partly right and the dispute is about which loss matters. Idris is correct that counting clubs understates what exists now; Sara is correct that something has gone, and it is the unchosen contact rather than the clubhouse."],"model_html":"\u003cp>Sara is measuring something real and Idris is right that it is not quite the thing in dispute.\u003c/p>\u003cp>The membership figures are not in doubt. What is in doubt is whether membership of formal organisations is the right indicator of cohesion, and Idris has a point: an interest-based network leaves no register to count. But his alternative has to do the same work, and this is where I part from him. The function those institutions performed was repeated contact with people you had not chosen — neighbours, colleagues, fellow parishioners. Interest-based networks are selected, so they do not produce that contact at all.\u003c/p>\u003cp>It is that function, not the membership figures, that I think has genuinely declined. The test would be whether people still have regular dealings with others unlike themselves, and the available evidence on neighbourhood ties and cross-class friendship suggests they do not.\u003c/p>\u003cp>So the honest answer is that both are partly right and the dispute is about which loss matters. Idris is correct that counting clubs understates what exists now; Sara is correct that something has gone, and it is the unchosen contact rather than the clubhouse.\u003c/p>","model_band":5,"degraded":["I think both Sara and Idris have good arguments but I agree more with Idris because society is always changing and we should not be nostalgic about the past. Young people today are very connected through social media and online communities, which my grandparents never had. It is true that fewer people go to church but that does not mean they care less about each other. In my country people still have very strong family and neighbour relationships, so I do not think community is disappearing at all."],"degraded_html":"\u003cp>I think both Sara and Idris have good arguments but I agree more with Idris because society is always changing and we should not be nostalgic about the past. Young people today are very connected through social media and online communities, which my grandparents never had. It is true that fewer people go to church but that does not mean they care less about each other. In my country people still have very strong family and neighbour relationships, so I do not think community is disappearing at all.\u003c/p>","degraded_band":3,"model_words":192,"fault_list":{"tag":"F3","faults":["\"Society is always changing and we should not be nostalgic\" answers nobody’s argument — neither speaker claimed the past was better, only that something measurable has changed.","\"Young people are very connected through social media\" is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.","\"In my country people still have very strong family and neighbour relationships\" is a single observation set against population-level evidence, and no test or indicator is proposed anywhere."],"html":["\u003cp>1.  \"Society is always changing and we should not be nostalgic\" answers nobody’s argument — neither speaker claimed the past was better, only that something measurable has changed.\u003c/p>","\u003cp>2.  \"Young people are very connected through social media\" is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.\u003c/p>","\u003cp>3.  \"In my country people still have very strong family and neighbour relationships\" is a single observation set against population-level evidence, and no test or indicator is proposed anywhere.\u003c/p>"]},"prof_name":"Dr Brennan","professor":"\u003cp>It is often argued that community life is weakening — that people join fewer organisations, know fewer neighbours and trust strangers less than their grandparents did. Others say the forms have changed rather than declined. Which is closer to the truth?\u003c/p>","students":[["Sara","The decline is measurable. Membership of unions, churches, clubs and parent associations is down everywhere, and nothing has replaced them at the same scale."],["Idris","Measured by what, though? Those were the institutions the twentieth century happened to use. People now organise around interests rather than places, and that does not show up in membership figures at all."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“In my country people still have very strong family and neighbour relationships” is a single observation set against population-level evidence, and no test or indicator is proposed anywhere.","correct":true},{"text":"“Society is always changing and we should not be nostalgic” answers nobody’s argument — neither speaker claimed the past was better, only that something measurable has changed.","correct":true},{"text":"It opens on the committee’s failure — “still not had any response, even though the committee has met twice” — which is read by a volunteer who was probably not present.","correct":false},{"text":"“If you need any help just let me know” names no task, no hour and no date, so nothing is actually offered; there are also two comma splices.","correct":false},{"text":"“Young people are very connected through social media” is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.","correct":true},{"text":"The grievance and the request are fused, so the office must answer “who made the decision and on what basis” before it can address the place. The second bullet fails.","correct":false}],"key_html":"F3"}};</script>
