<script>window.ITEM={"kind":"family","id":"BAS 051–058","slug":"bas-family-07","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 7 of 12 — comparison","payload":{"Strategy":"most arguments are comparisons; say precisely how much more","Grammar":"comparatives, superlatives, equatives, correlatives, so/such","Vocabulary":"modifiers of degree: far, slightly, nowhere near, by far","Convention":"comparing like with like, and finishing the comparison"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>Two things earn marks here. One is the grammar of the comparison itself. The other is the modifier in front of it: a writer who says \u003c/p>\u003cp>slightly better rather than better is being precise, and precision is what the band-5 descriptor is asking for.\u003c/p>","preview":[{"tag":"P1","title":"How much more?","html":"\u003cp>Put these in order from smallest difference to largest:\u003c/p>\u003cpre class=\"mono\">far better · slightly better · no better · marginally better · vastly better\u003c/pre>"},{"tag":"P2","title":"Finish the comparison","html":"\u003cp>Each of these is incomplete in a way that would cost you a mark. What is missing?\u003c/p>\u003cpre class=\"mono\">(a) The online version is clearer.\n(b) This method is more reliable than the other one is.\n(c) The train costs more than the bus.\u003c/pre>\u003cp class=\"note\">Only one of the three is genuinely faulty. Decide which, and why the other two are acceptable.\u003c/p>"},{"tag":"P3","title":"Like with like","html":"\u003cp>What is wrong with this sentence, and what is it accidentally comparing?\u003c/p>\u003cpre class=\"mono\">The results of this trial were better than the first study.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Scale the claim","html":"\u003cp>Rewrite the bare claim three times, so that it is (a) barely true, (b) clearly true, (c) overwhelmingly true.\u003c/p>\u003cpre class=\"mono\">Online teaching is more flexible than classroom teaching.\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) This method is more easier to apply.\n(b) She is the most tallest in the group.\n(c) The weather here is worse than London.\n(d) I would rather to stay another night.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>The discussion task is almost always a comparison in disguise. Write one sentence for each, using a modified comparative.\u003c/p>\u003cpre class=\"mono\">(a) Which matters more for learning: class size or teacher quality?\n(b) Is a short deadline better or worse for the quality of work?\u003c/pre>"}],"keys":{"P1":"\u003cp>no better &lt; marginally &lt; slightly &lt; far &lt; vastly.\u003c/p>\u003cp>Keep this ladder in your head. Most candidates own exactly two rungs of it — \u003cem>better\u003c/em> and \u003cem>much better\u003c/em> — and the gap shows immediately in the vocabulary score.\u003c/p>","P2":"\u003cp>\u003cstrong>(a)\u003c/strong> is the faulty one: clearer \u003cem>than what?\u003c/em> A comparative with no second term leaves the reader to guess.\u003c/p>\u003cp>(b) is fine — repeating \u003cem>is\u003c/em> is optional but careful. (c) is fine; the second term is there.\u003c/p>","P3":"\u003cp>It compares \u003cem>results\u003c/em> with a \u003cem>study\u003c/em>. You need results with results: \u003cem>better than those of the first study\u003c/em>, or \u003cem>better than the first study’s\u003c/em>.\u003c/p>\u003cp>This is the commonest comparison error in academic writing, and it survives into very advanced work.\u003c/p>","F1":"\u003cp>(a) Online teaching is marginally more flexible than classroom teaching.\u003c/p>\u003cp>(b) Online teaching is considerably more flexible …\u003c/p>\u003cp>(c) Online teaching is far more flexible …, and nowhere near as constrained by timetabling.\u003c/p>\u003cp>Same claim, three different levels of commitment. Choosing the right one is an argumentative decision, not a stylistic one.\u003c/p>","F2":"\u003cp>(a) → easier, or more easy to apply. Never both markers.\u003c/p>\u003cp>(b) → the tallest.\u003c/p>\u003cp>(c) → worse than it is in London, or worse than London’s. As written it compares weather with a city.\u003c/p>\u003cp>(d) → I would rather stay. No \u003cem>to\u003c/em> after would rather.\u003c/p>","F3":"\u003cp>(a) Teacher quality matters considerably more than class size, at least above a certain threshold.\u003c/p>\u003cp>(b) A short deadline is marginally better for focus but far worse for revision.\u003c/p>\u003cp>The modifier does the arguing: it concedes something small to claim something large.\u003c/p>"},"rows":[51,52,53,54,55,56,57,58]};</script>
