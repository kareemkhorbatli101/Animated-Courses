<script>window.ITEM={"kind":"exercise","id":"AD 071","slug":"ad-071","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Arts and culture · responsibility: who should act","payload":{"Strategy":"ask what the money is actually buying before asking who should pay","Grammar":"the counterfactual would have; conditional qualification","Vocabulary":"subsidy, patronage, access, canon, crowding out","Convention":"defending public spending without appealing to taste"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ingrid argues about what the institutions hold. What does Diego argue about?\u003c/p>\u003cp>b.  Diego makes a concession at the end. What does he concede, and what does it open up?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish \u003cem>subsidy\u003c/em> from \u003cem>patronage\u003c/em>.\u003c/p>\u003cp>b.  What would it mean for public funding to \u003cem>crowd out\u003c/em> private giving?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, accept Diego’s distributional fact and use his own closing concession against his conclusion. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “art is essential to the human spirit” the worst available opening?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response takes something away from each classmate. What does it take from Ingrid, and why is conceding it a strong move?\u003c/p>\u003cp>b.  Find the empirical fact the writer brings in. What work does it do that an argument could not?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “Had the subsidy been spent on access rather than on seats, we would know by now …” Rewrite with \u003cem>if\u003c/em>. Why might the inverted form be preferred in a written argument?\u003c/p>\u003cp>b.  “those things are not consumed by the audience at all”. Why the passive, and why \u003cem>consumed\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>repetiteur\u003c/em> and \u003cem>conservator\u003c/em> — why name two obscure jobs instead of saying \u003cem>staff\u003c/em>?\u003c/p>\u003cp>b.  \u003cem>gives the argument away\u003c/em> — what does the idiom mean, and what is its tone?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: should public libraries spend their budgets on popular fiction or on specialist collections? In 50 words, concede the strongest point on one side and show what it implies about how the budget should be split.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  About who benefits — the distribution of the subsidy across income groups. He is not denying the value of the collections; he is asking who is being made to pay for whose pleasure.\u003c/p>\u003cp>b.  He concedes that if the real aim is preserving skills, that aim could be funded directly. That concession is a gift: it accepts Ingrid’s premise and proposes a different instrument, which means the dispute is now about mechanism rather than principle — and mechanisms can be argued to a conclusion.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Subsidy\u003c/strong> is public money given on public criteria, with accountability. \u003cstrong>Patronage\u003c/strong> is private money given on the giver’s criteria, historically with influence over the work. The distinction matters because the objection to each is different: subsidy raises questions of distribution, patronage of independence.\u003c/p>\u003cp>b.  That public money replaces private donations rather than adding to them — donors give less because the state is already paying, so total funding rises by less than the subsidy. It is the standard economic objection to arts funding and worth knowing.\u003c/p>","P3":"\u003cp>Model: \u003cem>Diego is right about who buys the tickets — but his own suggestion, to fund the training rather than the seat, is the answer to his objection rather than a reason to stop funding.\u003c/em>\u003c/p>","P4":"\u003cp>Because it is unfalsifiable and unshared. Diego has produced figures about who attends; answering with a claim about the human spirit concedes the empirical ground entirely and replaces it with an assertion he has no way to engage. It also sounds like special pleading from someone who likes opera, which is the exact suspicion the argument has to overcome.\u003c/p>","F1":"\u003cp>a.  The park analogy. Conceding it is strong because it is the weakest part of the case the writer is broadly defending — and a defender who gives up the bad argument is far more credible on the good one. It also pre-empts Diego: if the writer did not abandon the analogy, he would, and at a moment of his choosing.\u003c/p>\u003cp>b.  That free museum entry changed visitor numbers far less than expected. It does work no argument could, because the dispute had reached a point where both sides could assert that price was or was not the barrier. A natural experiment settles that, and the writer uses it to support a conclusion neither classmate wanted: that the audience is narrow for reasons money does not reach.\u003c/p>","F2":"\u003cp>a.  \u003cem>If the subsidy had been spent on access rather than on seats, we would know by now …\u003c/em>. The inverted form is more formal and slightly more emphatic, and it avoids a third \u003cem>if\u003c/em> in a paragraph that already has conditionals in it. (Family 3, structure 24.)\u003c/p>\u003cp>b.  The passive keeps the audience out of subject position, which matters because the whole sentence is about things the audience does not touch. \u003cem>Consumed\u003c/em> is chosen because it is the economic verb for what a beneficiary does with a subsidised good — so the sentence answers Diego in his own register.\u003c/p>","F3":"\u003cp>a.  Because the specific jobs make the abstraction concrete and demonstrate that the writer knows what an opera house actually contains. \u003cem>Staff\u003c/em> would invite the reply that staff are paid out of ticket revenue; naming a repetiteur and a conservator points at exactly the kinds of skilled work that no audience sees and no ticket price reflects, which is the argument.\u003c/p>\u003cp>b.  It means his own words reveal the weakness of his position without his intending it. The tone is confident and slightly wry, and it is risky: it works only because the next sentence immediately shows exactly what was given away. Used without that follow-through it would read as a sneer.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It never engages Diego’s argument.\u003c/strong> He gave a distributional objection and proposed an alternative instrument. The response answers with assertions about cultural identity, then attributes the narrow audience entirely to ticket prices without evidence — the one claim that actually needed support.\u003c/p>\u003cp>2.  \u003cstrong>It ends somewhere else entirely.\u003c/strong> Military spending is not what was asked about and does not bear on who should fund the arts; it is a change of subject in the final sentence, where the conclusion should be.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “our society will lose” (would lose — the whole sentence is hypothetical), “the next generations” (future generations), “much more money on the military than on the culture” (on culture), and “the wrong priorities of our politicians”.\u003c/p>","F5":"\u003cp>Model: \u003cem>The case for popular fiction is the strong one: lending figures are the only evidence libraries have that anyone wants them, and a library nobody uses loses its funding first. But that argues for buying popular stock with the acquisitions budget, not for letting the specialist collections rot — those are a storage cost, not a purchasing one.\u003c/em>\u003c/p>"},"model":["Diego’s figures are right and his last sentence gives the argument away. If what we are buying is the survival of skills and collections, then the subsidy should be judged on whether it buys them — and a subsidy attached to ticket prices is a remarkably indirect way of paying for a repetiteur or a conservator. Fund the training, the archive and the instrument workshop directly, and most of his transfer-upwards objection disappears, because those things are not consumed by the audience at all.","Ingrid’s park analogy is the weaker half of her case, though, and worth giving up. A park is genuinely open: the test of access is whether someone unfamiliar can walk in, and by that test an opera house fails for reasons that have very little to do with the price. Had the subsidy been spent on access rather than on seats, we would know by now whether the audience is narrow because of cost or because of everything else — and on the evidence of free museum entry, which changed numbers far less than expected, I suspect it is everything else."],"model_html":"\u003cp>Diego’s figures are right and his last sentence gives the argument away. If what we are buying is the survival of skills and collections, then the subsidy should be judged on whether it buys them — and a subsidy attached to ticket prices is a remarkably indirect way of paying for a repetiteur or a conservator. Fund the training, the archive and the instrument workshop directly, and most of his transfer-upwards objection disappears, because those things are not consumed by the audience at all.\u003c/p>\u003cp>Ingrid’s park analogy is the weaker half of her case, though, and worth giving up. A park is genuinely open: the test of access is whether someone unfamiliar can walk in, and by that test an opera house fails for reasons that have very little to do with the price. Had the subsidy been spent on access rather than on seats, we would know by now whether the audience is narrow because of cost or because of everything else — and on the evidence of free museum entry, which changed numbers far less than expected, I suspect it is everything else.\u003c/p>","model_band":5,"degraded":["I completely agree with Ingrid that the government must support the arts because art is essential to the human spirit and to our cultural identity. Without the museums and the orchestras our society will lose its history and the next generations will not know anything about their culture. Diego says that only rich people go to the opera but I think this is because the tickets are too expensive, so if the government gives more subsidy the prices will go down and everybody will be able to go. Also many countries are spending much more money on the military than on the culture, which shows the wrong priorities of our politicians."],"degraded_html":"\u003cp>I completely agree with Ingrid that the government must support the arts because art is essential to the human spirit and to our cultural identity. Without the museums and the orchestras our society will lose its history and the next generations will not know anything about their culture. Diego says that only rich people go to the opera but I think this is because the tickets are too expensive, so if the government gives more subsidy the prices will go down and everybody will be able to go. Also many countries are spending much more money on the military than on the culture, which shows the wrong priorities of our politicians.\u003c/p>","degraded_band":3,"model_words":184,"fault_list":{"tag":"F4","faults":["It never engages Diego’s argument. He gave a distributional objection and proposed an alternative instrument. The response answers with assertions about cultural identity, then attributes the narrow audience entirely to ticket prices without evidence — the one claim that actually needed support.","It ends somewhere else entirely. Military spending is not what was asked about and does not bear on who should fund the arts; it is a change of subject in the final sentence, where the conclusion should be.","Language. “our society will lose” (would lose — the whole sentence is hypothetical), “the next generations” (future generations), “much more money on the military than on the culture” (on culture), and “the wrong priorities of our politicians”."],"html":["\u003cp>1.  \u003cstrong>It never engages Diego’s argument.\u003c/strong> He gave a distributional objection and proposed an alternative instrument. The response answers with assertions about cultural identity, then attributes the narrow audience entirely to ticket prices without evidence — the one claim that actually needed support.\u003c/p>","\u003cp>2.  \u003cstrong>It ends somewhere else entirely.\u003c/strong> Military spending is not what was asked about and does not bear on who should fund the arts; it is a change of subject in the final sentence, where the conclusion should be.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “our society will lose” (would lose — the whole sentence is hypothetical), “the next generations” (future generations), “much more money on the military than on the culture” (on culture), and “the wrong priorities of our politicians”.\u003c/p>"]},"prof_name":"Professor Rahimi","professor":"\u003cp>Public funding for opera, orchestras and museums is often defended on the grounds that these forms could not survive on ticket sales alone. Critics reply that subsidy transfers money from the general public to the tastes of a wealthy minority. Who should pay for art that cannot pay for itself — the public, or its audience?\u003c/p>","students":[["Ingrid","The public, and without embarrassment. Nobody asks whether a public park pays for itself. These institutions hold collections and skills that take generations to build and an afternoon to lose, and no ticket price could ever capture that value."],["Diego","Then let the people who use them pay. Subsidised opera audiences are wealthier and better educated than average; the effect is a transfer upwards. If the argument is about preserving skills, fund the training, not the ticket."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language. “our society will lose” (would lose — the whole sentence is hypothetical), “the next generations” (future generations), “much more money on the military than on the culture” (on culture), and “the wrong priorities of our politicians”.","correct":true},{"text":"“Any advice would be very helpful” invites exactly the wrong kind of response, and no student number is given.","correct":false},{"text":"It never engages Diego’s argument. He gave a distributional objection and proposed an alternative instrument. The response answers with assertions about cultural identity, then attributes the narrow audience entirely to ticket prices without evidence — the one claim that actually needed support.","correct":true},{"text":"“I hope it did not cause too many problems” invites the reader to minimise it, and “sorry for the inconvenience” is the formula of an automated service message.","correct":false},{"text":"It ends somewhere else entirely. Military spending is not what was asked about and does not bear on who should fund the arts; it is a change of subject in the final sentence, where the conclusion should be.","correct":true},{"text":"It locates the cause in the reader. “Because you were not available” is the first clause of the email, and “I know you are very busy but” is the classic concessive that precedes an accusation.","correct":false}],"key_html":"F4"}};</script>
