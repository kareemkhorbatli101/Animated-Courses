<script>window.ITEM={"kind":"exercise","id":"EM 007","slug":"em-007","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"say what you need the account for, not just that you need it","Grammar":"the infinitive of purpose","Vocabulary":"reactivate, credentials, lapse, in order to","Convention":"writing to a service desk that handles hundreds of tickets"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  A service desk reads hundreds of these. What single thing makes yours answerable without a reply asking for more information?\u003c/p>\u003cp>b.  Why does the second bullet exist at all?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which verb: to \u003cem>reactivate\u003c/em> · to \u003cem>restore\u003c/em> · to \u003cem>renew\u003c/em> an account that was switched off?\u003c/p>\u003cp>b.  What are your credentials, and what does it mean for access to lapse?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the purpose of the request in one clause beginning with \u003cem>to\u003c/em>.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Which paragraph would a busy desk read first, and is it in the right place?\u003c/p>\u003cp>b.  Four separate identifiers appear. Name them and say why four is not excessive.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “\u003cem>in order to\u003c/em> access the e-journals”. What does the full form add over a bare \u003cem>to\u003c/em>?\u003c/p>\u003cp>b.  Why \u003cem>appears as inactive\u003c/em> rather than \u003cem>is deactivated\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Your student number. Without it the desk cannot find your record, and the first reply will simply ask for it — which costs you a day.\u003c/p>\u003cp>b.  Because it tells the desk how urgent the ticket is without you having to claim urgency. A deadline is a fact; “urgent” is an opinion they have heard already today.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Reactivate\u003c/strong> — it is the system’s own word for switching a dormant account back on. \u003cem>Renew\u003c/em> implies an expiry; \u003cem>restore\u003c/em> suggests data was lost.\u003c/p>\u003cp>b.  Your \u003cstrong>credentials\u003c/strong> are the username and password that prove who you are. Access \u003cstrong>lapses\u003c/strong> when it quietly expires through inaction rather than being withdrawn.\u003c/p>","P3":"\u003cp>Model: \u003cem>I need the account in order to access the e-journals and to print.\u003c/em>\u003c/p>\u003cp>The purpose clause is what converts a complaint about a broken system into a request with a reason attached.\u003c/p>","F1":"\u003cp>a.  The fourth — the identifiers. It is in the right place: the desk reads the first line to classify the ticket, then jumps to the details. Putting the student number first would read as a form rather than a message.\u003c/p>\u003cp>b.  Name, number, programme, date of return. Four, because each unlocks a different system — and supplying them unasked removes the single commonest cause of delay.\u003c/p>","F2":"\u003cp>a.  \u003cem>In order to\u003c/em> marks the purpose explicitly and slightly more formally. A bare \u003cem>to\u003c/em> would also work; the full form is useful when the infinitive sits a long way from its verb, as here, because it tells the reader at once that a reason is coming.\u003c/p>\u003cp>b.  Because you do not know that it was deactivated — you know what your screen says. Reporting the symptom rather than diagnosing the cause is both more accurate and less likely to send the desk down the wrong path.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>No identifiers.\u003c/strong> No student number, no programme, no name in the body. The third bullet is unaddressed and the ticket cannot be actioned.\u003c/p>\u003cp>2.  \u003cstrong>It instructs.\u003c/strong> “Please fix this problem urgently” claims a priority the writer cannot assign, and gives no deadline that would justify it.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “is not working since I came back” (has not worked since), “login” as a verb (log in), “one year of interruption” (a year’s interruption).\u003c/p>"},"model":["Dear Service Desk,","I interrupted my studies last September and returned this week. My student card opens the buildings again, but my library and printing account still appears as inactive when I try to log in.","I have two assessed essays due at the end of the month and need the account in order to access the e-journals and to print.","My details are: Rosa Ilundain, student number 2191447, MA History, returned from interruption on 20 October. Happy to come to the desk in person with my card if that is simpler.","Thank you very much.","Best wishes,","Rosa Ilundain"],"model_html":"\u003cp>Dear Service Desk,\u003c/p>\u003cp>I interrupted my studies last September and returned this week. My student card opens the buildings again, but my library and printing account still appears as inactive when I try to log in.\u003c/p>\u003cp>I have two assessed essays due at the end of the month and need the account in order to access the e-journals and to print.\u003c/p>\u003cp>My details are: Rosa Ilundain, student number 2191447, MA History, returned from interruption on 20 October. Happy to come to the desk in person with my card if that is simpler.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Rosa Ilundain\u003c/p>","model_band":5,"degraded":["Hello,","My account is not working since I came back to the university after one year of interruption. I can enter the buildings with my card but I cannot login to the system. Please fix this problem urgently because I need to print my essays. Thank you.","Rosa"],"degraded_html":"\u003cp>Hello,\u003c/p>\u003cp>My account is not working since I came back to the university after one year of interruption. I can enter the buildings with my card but I cannot login to the system. Please fix this problem urgently because I need to print my essays. Thank you.\u003c/p>\u003cp>Rosa\u003c/p>","degraded_band":3,"model_words":101,"fault_list":{"tag":"F3","faults":["No identifiers. No student number, no programme, no name in the body. The third bullet is unaddressed and the ticket cannot be actioned.","It instructs. “Please fix this problem urgently” claims a priority the writer cannot assign, and gives no deadline that would justify it.","Language. “is not working since I came back” (has not worked since), “login” as a verb (log in), “one year of interruption” (a year’s interruption)."],"html":["\u003cp>1.  \u003cstrong>No identifiers.\u003c/strong> No student number, no programme, no name in the body. The third bullet is unaddressed and the ticket cannot be actioned.\u003c/p>","\u003cp>2.  \u003cstrong>It instructs.\u003c/strong> “Please fix this problem urgently” claims a priority the writer cannot assign, and gives no deadline that would justify it.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “is not working since I came back” (has not worked since), “login” as a verb (log in), “one year of interruption” (a year’s interruption).\u003c/p>"]},"scenario":"\u003cp>Your library and printing account was deactivated when you interrupted your studies for a year. You have now returned, your student card works, but the online account does not.\u003c/p>","bullets":["Say who you are and what has stopped working.","Explain why you need it now.","Give the details that will let them find your record."],"header":[["To:","servicedesk@northgate.ac.uk"],["Subject:","Account not reactivated after return from interruption"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“There is no real conflict between doing good and making money” denies the premise of the question, which is about what happens when there is one.","correct":false},{"text":"No identifiers. No student number, no programme, no name in the body. The third bullet is unaddressed and the ticket cannot be actioned.","correct":true},{"text":"It instructs. “Please fix this problem urgently” claims a priority the writer cannot assign, and gives no deadline that would justify it.","correct":true},{"text":"Language. “cutting their money” (their pay), “not fair for them” (unfair to them), “a small cut in the salary” (in salaries), and a long run-on at “jobs which is worse”.","correct":false},{"text":"Language and register. “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”.","correct":false},{"text":"Language. “is not working since I came back” (has not worked since), “login” as a verb (log in), “one year of interruption” (a year’s interruption).","correct":true}],"key_html":"F3"}};</script>
