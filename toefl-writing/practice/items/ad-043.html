<script>window.ITEM={"kind":"exercise","id":"AD 043","slug":"ad-043","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Health and medicine · responsibility: who should act","payload":{"Strategy":"ask where the information and the authority meet","Grammar":"modals of obligation across agents","Vocabulary":"prescriber, dispensing, adherence, polypharmacy","Convention":"allocating a duty across a fragmented system"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ravi argues from relationship and record; Mei from information and time. Which is the binding constraint?\u003c/p>\u003cp>b.  Why does \"everything dispensed\" differ from \"everything prescribed\"?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is polypharmacy, and what is deprescribing?\u003c/p>\u003cp>b.  What does a prescriber do that a dispenser does not?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Allocate the duty in one sentence that acknowledges what each party uniquely has.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response gives specialists no role. What is the argument?\u003c/p>\u003cp>b.  \"which is not a failure of either of them\" — what does this clause protect?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"cannot stop any of them ... may not know they are all being taken\" — what does the parallel establish?\u003c/p>\u003cp>b.  \"collected and swallowed\" — why two verbs?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Information, if the question is who can detect the problem; authority, if it is who can fix it. The response’s move is to notice that they are held by different people.\u003c/p>\u003cp>b.  Because patients do not always collect prescriptions and do not always take what they collect, and because items bought without prescription never appear in the record at all.\u003c/p>","P2":"\u003cp>a.  Polypharmacy is being on many medicines at once; deprescribing is the deliberate withdrawal of some.\u003c/p>\u003cp>b.  A prescriber decides what should be taken and carries the clinical and legal responsibility; a dispenser supplies it and checks it, with no power to change the decision.\u003c/p>","P3":"\u003cp>Model: \"The review belongs with the pharmacist, who has the data and the time; the decision belongs with the GP, who has the authority.\"\u003c/p>","F1":"\u003cp>a.  That diffusing responsibility across four parties is precisely the current arrangement and the reason nobody does it. Adding a party to a coordination failure makes it worse, not better.\u003c/p>\u003cp>b.  It converts the argument from a criticism of individuals into one about structure, which is both fairer and more useful: if neither party is failing, exhortation will not help and only an obligation will.\u003c/p>","F2":"\u003cp>a.  A symmetry of partial capacity — each party is missing exactly what the other has. Setting the two clauses in parallel makes the complementarity visible in a single sentence, which is what licenses the split that follows.\u003c/p>\u003cp>b.  Because they are different failure points. A patient may collect and not take, or take and not collect what was prescribed, and both break the record in different ways. The pair specifies the gap precisely rather than gesturing at it.\u003c/p>","F3":"\u003cp>1.  It allocates to everyone and adds the family, which is the answer the question exists to improve on.\u003c/p>\u003cp>2.  \"If they communicate better and share information through a common digital system\" assumes the solution rather than proposing it — the difficulty is that nobody is obliged to act on what is shared, which is never addressed.\u003c/p>\u003cp>3.  Language: \"the health professionals\", \"the patient and his history\" (generic \"their\"), \"the medicines and their interactions\", \"the decisions about the treatment\" — over-articled throughout; and \"dangerous situations could be avoided\" is agentless where the whole question is about agency.\u003c/p>"},"model":["Mei has the better of this on information and Ravi on authority, and the gap between those two is exactly where the problem lives. A pharmacist can see that an eighty-year-old is on three drugs that should not be combined and cannot stop any of them; a GP can stop them and may not know they are all being taken, because the record shows what was prescribed rather than what was collected and swallowed.","So the duty should be split along that line rather than assigned whole. The review belongs with the pharmacist, who has the data and the time, and the decision belongs with the GP, who has the authority and the patient. What is missing is not a responsible party but an obligation on the first to send and on the second to respond — at present a pharmacist who spots an interaction can write to a GP and receive nothing, which is not a failure of either of them. Specialists I would leave out of the review entirely, not because they matter less but because a system in which four people are each partly responsible for the whole is the system we already have."],"model_html":"\u003cp>Mei has the better of this on information and Ravi on authority, and the gap between those two is exactly where the problem lives. A pharmacist can see that an eighty-year-old is on three drugs that should not be combined and cannot stop any of them; a GP can stop them and may not know they are all being taken, because the record shows what was prescribed rather than what was collected and swallowed.\u003c/p>\u003cp>So the duty should be split along that line rather than assigned whole. The review belongs with the pharmacist, who has the data and the time, and the decision belongs with the GP, who has the authority and the patient. What is missing is not a responsible party but an obligation on the first to send and on the second to respond — at present a pharmacist who spots an interaction can write to a GP and receive nothing, which is not a failure of either of them. Specialists I would leave out of the review entirely, not because they matter less but because a system in which four people are each partly responsible for the whole is the system we already have.\u003c/p>","model_band":5,"degraded":["I think that all the health professionals should work together as a team to solve this problem because each of them has important information about the patient. The specialists know their own field very well, the general practitioner knows the patient and his history, and the pharmacist knows the medicines and their interactions. If they communicate better and share the information through a common digital system then these dangerous situations could be avoided. The patient and the family should also be informed and involved in the decisions about the treatment."],"degraded_html":"\u003cp>I think that all the health professionals should work together as a team to solve this problem because each of them has important information about the patient. The specialists know their own field very well, the general practitioner knows the patient and his history, and the pharmacist knows the medicines and their interactions. If they communicate better and share the information through a common digital system then these dangerous situations could be avoided. The patient and the family should also be informed and involved in the decisions about the treatment.\u003c/p>","degraded_band":3,"model_words":198,"fault_list":{"tag":"F3","faults":["It allocates to everyone and adds the family, which is the answer the question exists to improve on.","\"If they communicate better and share information through a common digital system\" assumes the solution rather than proposing it — the difficulty is that nobody is obliged to act on what is shared, which is never addressed.","Language: \"the health professionals\", \"the patient and his history\" (generic \"their\"), \"the medicines and their interactions\", \"the decisions about the treatment\" — over-articled throughout; and \"dangerous situations could be avoided\" is agentless where the whole question is about agency."],"html":["\u003cp>1.  It allocates to everyone and adds the family, which is the answer the question exists to improve on.\u003c/p>","\u003cp>2.  \"If they communicate better and share information through a common digital system\" assumes the solution rather than proposing it — the difficulty is that nobody is obliged to act on what is shared, which is never addressed.\u003c/p>","\u003cp>3.  Language: \"the health professionals\", \"the patient and his history\" (generic \"their\"), \"the medicines and their interactions\", \"the decisions about the treatment\" — over-articled throughout; and \"dangerous situations could be avoided\" is agentless where the whole question is about agency.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Older patients are often taking many medicines prescribed by different specialists, with interactions nobody has reviewed. Who should be responsible for reviewing the whole list — the specialists, the general practitioner, or the pharmacist?\u003c/p>","students":[["Ravi","The general practitioner. They are the one clinician with a relationship to the whole patient rather than to one organ, and the record sits with them."],["Mei","The pharmacist, in practice. They are the only person who sees every item actually dispensed rather than everything intended, they are trained in interactions specifically, and they have more consultation time per patient than any GP does."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language. “the flat 14” (Flat 14), “I went two times” (twice), “this situation cannot continue like this” (redundant), and “they are playing” for a repeated habit (they play).","correct":false},{"text":"It decides the other person’s constraints for them. “The mornings should be fine for you anyway since you only need afternoons” tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.","correct":false},{"text":"Language: “the health professionals”, “the patient and his history” (generic “their”), “the medicines and their interactions”, “the decisions about the treatment” — over-articled throughout; and “dangerous situations could be avoided” is agentless where the whole question is about agency.","correct":true},{"text":"It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","correct":false},{"text":"It allocates to everyone and adds the family, which is the answer the question exists to improve on.","correct":true},{"text":"“If they communicate better and share information through a common digital system” assumes the solution rather than proposing it — the difficulty is that nobody is obliged to act on what is shared, which is never addressed.","correct":true}],"key_html":"F3"}};</script>
