<script>window.ITEM={"kind":"exercise","id":"EM 096","slug":"em-096","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Negotiation and rescheduling","payload":{"Strategy":"renegotiate by reopening the right term","Grammar":"subjunctive proposal","Vocabulary":"scope, milestone, deliverable, revise","Convention":"renegotiating something you already agreed to"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You agreed to this. How does that change the register?\u003c/p>\u003cp>b.  Why propose a specific new arrangement rather than ask to reduce?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a milestone, and what is a deliverable?\u003c/p>\u003cp>b.  What does it mean to revise scope, and who normally has to agree?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take responsibility in one sentence that does not grovel.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer blames themselves explicitly. Why is that more effective than citing the workload alone?\u003c/p>\u003cp>b.  Two things are offered to offset the reduction. Which is the stronger, and why?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I need to change what I committed to in October\" — why open with this rather than with the reason?\u003c/p>\u003cp>b.  \"rather than have me doing it badly\" — what does this concede, and what does it protect?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It makes this a renegotiation of a promise rather than a request. The committee planned a year round your commitment, so the email owes them an acknowledgement of that before it asks for anything.\u003c/p>\u003cp>b.  Because \"can I do less?\" leaves them to design the replacement, which is the work your withdrawal has created. A specific proposal hands back a solved problem.\u003c/p>","P2":"\u003cp>a.  A milestone is a checkpoint in a schedule; a deliverable is a thing handed over. Here the sessions are both.\u003c/p>\u003cp>b.  To change what is included. Normally whoever commissioned the work has to agree — which is why this is a proposal rather than a notification.\u003c/p>","P3":"\u003cp>Model: \"That is my misjudgement rather than anything that has changed on your side — I underestimated the dissertation and should have said so then.\"\u003c/p>","F1":"\u003cp>a.  Because workload alone is an excuse available to everybody and explains nothing about why this commitment was made. Naming the misjudgement is both true and more credible — it shows the writer has understood what went wrong rather than reporting that life is busy.\u003c/p>\u003cp>b.  Priya. Handouts are a consolation; a named person willing to cover two weeks is a partial replacement, and it converts the shortfall from ten sessions to eight. An offer that includes another person’s agreement is worth far more than one that only costs the writer effort.\u003c/p>","F2":"\u003cp>a.  Because it states the nature of the email before the reader has to work it out, and because leading with the reason would frame the message as an excuse looking for a conclusion. The order signals that responsibility comes first.\u003c/p>\u003cp>b.  It concedes that the writer might be the wrong person for the role at all, which is more than was asked. It protects the society, who would otherwise have to decide between accepting the reduction and causing offence — and it protects the writer from limping through a year of sessions done badly.\u003c/p>","F3":"\u003cp>1.  No responsibility is taken — \"my dissertation is taking much more time than I expected\" presents the problem as something that happened to the writer, so the second bullet fails.\u003c/p>\u003cp>2.  \"Would it be possible to do it every two weeks instead\" is a bare reduction with nothing offered, no dates and no session count, so the third bullet fails.\u003c/p>\u003cp>3.  \"I am completely overwhelmed\" and \"I hope you understand my situation\" ask the committee to manage the writer’s feelings, and no alternative is offered if fortnightly does not suit them.\u003c/p>"},"model":["Dear Committee,","I need to change what I committed to in October. I agreed to run the workshop weekly for the year, and from January I do not think I can do more than fortnightly. That is my misjudgement rather than anything that has changed on your side — I underestimated the dissertation and should have said so then.","What I would propose is fortnightly sessions from 14 January to the end of term, same slot and same format. In practice that means ten sessions rather than twenty.","To keep it from being a straight reduction: I will write up the four sessions I have already run as handouts so there is something for the weeks without a workshop, and Priya has said she would be willing to take two of the alternate weeks if the committee is happy with that. That gets you to twelve.","If fortnightly does not work for the society, I would rather you found someone else for the whole slot than have me doing it badly — and I would help whoever took it over.","Best wishes,","Ana Oyelaran"],"model_html":"\u003cp>Dear Committee,\u003c/p>\u003cp>I need to change what I committed to in October. I agreed to run the workshop weekly for the year, and from January I do not think I can do more than fortnightly. That is my misjudgement rather than anything that has changed on your side — I underestimated the dissertation and should have said so then.\u003c/p>\u003cp>What I would propose is fortnightly sessions from 14 January to the end of term, same slot and same format. In practice that means ten sessions rather than twenty.\u003c/p>\u003cp>To keep it from being a straight reduction: I will write up the four sessions I have already run as handouts so there is something for the weeks without a workshop, and Priya has said she would be willing to take two of the alternate weeks if the committee is happy with that. That gets you to twelve.\u003c/p>\u003cp>If fortnightly does not work for the society, I would rather you found someone else for the whole slot than have me doing it badly — and I would help whoever took it over.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ana Oyelaran\u003c/p>","model_band":5,"degraded":["Dear Committee, Unfortunately I am finding it very difficult to continue running the workshop every week because my dissertation is taking much more time than I expected and I am completely overwhelmed at the moment. Would it be possible to do it every two weeks instead from January? I am really sorry about this but I do not think I have any other option. I hope you understand my situation.","Ana"],"degraded_html":"\u003cp>Dear Committee, Unfortunately I am finding it very difficult to continue running the workshop every week because my dissertation is taking much more time than I expected and I am completely overwhelmed at the moment. Would it be possible to do it every two weeks instead from January? I am really sorry about this but I do not think I have any other option. I hope you understand my situation.\u003c/p>\u003cp>Ana\u003c/p>","degraded_band":3,"model_words":182,"fault_list":{"tag":"F3","faults":["No responsibility is taken — \"my dissertation is taking much more time than I expected\" presents the problem as something that happened to the writer, so the second bullet fails.","\"Would it be possible to do it every two weeks instead\" is a bare reduction with nothing offered, no dates and no session count, so the third bullet fails.","\"I am completely overwhelmed\" and \"I hope you understand my situation\" ask the committee to manage the writer’s feelings, and no alternative is offered if fortnightly does not suit them."],"html":["\u003cp>1.  No responsibility is taken — \"my dissertation is taking much more time than I expected\" presents the problem as something that happened to the writer, so the second bullet fails.\u003c/p>","\u003cp>2.  \"Would it be possible to do it every two weeks instead\" is a bare reduction with nothing offered, no dates and no session count, so the third bullet fails.\u003c/p>","\u003cp>3.  \"I am completely overwhelmed\" and \"I hope you understand my situation\" ask the committee to manage the writer’s feelings, and no alternative is offered if fortnightly does not suit them.\u003c/p>"]},"scenario":"\u003cp>You agreed in October to run a weekly workshop for the society all year. Your dissertation workload has turned out far heavier than expected. You want to cut to fortnightly from January without leaving them stuck.\u003c/p>","bullets":["Say what you can no longer sustain.","Take responsibility for having agreed to it.","Propose a change that keeps the thing running."],"header":[["To:","committee.codesoc@northgate.ac.uk"],["Subject:","Weekly workshops — proposing fortnightly from January"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language: “when he is only seven years old” (generic “they”), “the schools should group the students” (over-articled), “nobody is left behind” is a slogan rather than an argument.","correct":false},{"text":"“Would it be possible to do it every two weeks instead” is a bare reduction with nothing offered, no dates and no session count, so the third bullet fails.","correct":true},{"text":"“The benefits are real and well documented” asserts what she disputed without evidence, and “preserve the character where possible” is a qualification with no content.","correct":false},{"text":"No responsibility is taken — “my dissertation is taking much more time than I expected” presents the problem as something that happened to the writer, so the second bullet fails.","correct":true},{"text":"“The developers are offering money which shows they are being responsible” treats the offer as evidence of good faith rather than examining whether it replaces what is lost.","correct":false},{"text":"“I am completely overwhelmed” and “I hope you understand my situation” ask the committee to manage the writer’s feelings, and no alternative is offered if fortnightly does not suit them.","correct":true}],"key_html":"F3"}};</script>
