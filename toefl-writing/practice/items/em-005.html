<script>window.ITEM={"kind":"exercise","id":"EM 005","slug":"em-005","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"describe the clash, not the colleague who caused it","Grammar":"the agentless passive in a request","Vocabulary":"timetabling: clash, slot, cohort, swap, allocate","Convention":"never make a third party the villain of your request"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Somebody allocated you to a group that cannot work. Should you say so?\u003c/p>\u003cp>b.  Why does the third bullet say a swap \u003cem>may\u003c/em> be possible rather than that one is agreed?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which noun goes with which verb: to ______ a clash, to ______ a group, to ______ a swap, to ______ a slot.\u003c/p>\u003cpre class=\"mono\">arrange · allocate · resolve · free up\u003c/pre>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the problem in one sentence without using the word \u003cem>you\u003c/em> and without naming anybody.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>What is wrong with: “I have been put in a group that clashes with a compulsory lab, which obviously should have been checked”?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Who allocated the clashing group? Find the sentence that says so.\u003c/p>\u003cp>b.  What does “I have copied her in so she can confirm” save the office?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “I have been allocated the Tuesday 9 a.m. tutorial”. Rewrite in the active. Who appears, and what does their appearance do to the email?\u003c/p>\u003cp>b.  “As things stand I would have to miss one or the other.” Why \u003cem>would\u003c/em> and not \u003cem>will\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>clash\u003c/em> is both a noun and a verb here. Use each in a sentence about timetables.\u003c/p>\u003cp>b.  Why \u003cem>I should mention\u003c/em> rather than \u003cem>also\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Your exam has been scheduled on a religious holiday you observe. In 50 words, report the clash without blaming anyone and propose a solution.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No. The allocation was almost certainly automatic, the reader probably did not make it, and even if they did, saying so buys you nothing. The clash is a fact about the timetable; leave it that way.\u003c/p>\u003cp>b.  Because Hannah has agreed informally, not formally, and the office is the body that decides. Presenting it as settled would be claiming an authority you do not have — and if Hannah changes her mind you have misreported.\u003c/p>","P2":"\u003cp>to \u003cstrong>resolve\u003c/strong> a clash, to \u003cstrong>allocate\u003c/strong> a group, to \u003cstrong>arrange\u003c/strong> a swap, to \u003cstrong>free up\u003c/strong> a slot.\u003c/p>","P3":"\u003cp>Model: \u003cem>The Tuesday 9 a.m. tutorial clashes with the compulsory Earth Materials lab.\u003c/em>\u003c/p>\u003cp>Notice the subject: a \u003cem>slot\u003c/em>, not a person. Two timetable entries are in conflict, and no human being appears in the sentence at all.\u003c/p>","P4":"\u003cp>The relative clause editorialises. \u003cem>which obviously should have been checked\u003c/em> is a criticism of the reader’s office, delivered as if it were an afterthought — which makes it worse, not better. \u003cem>Obviously\u003c/em> is the giveaway word: it tells the reader that their failing is self-evident.\u003c/p>","F1":"\u003cp>a.  No sentence says so. \u003cem>I have been allocated\u003c/em> is agentless, and that is deliberate.\u003c/p>\u003cp>b.  A round of emails. The office would otherwise have to contact Hannah, wait, and chase. Doing their next step for them is the cheapest favour you can do an administrator, and it is reliably repaid.\u003c/p>","F2":"\u003cp>a.  \u003cem>You have allocated me the Tuesday tutorial\u003c/em> — and now the reader is the cause of your problem. The passive reports the same fact while keeping them out of it. This is the single most useful thing the passive does in correspondence.\u003c/p>\u003cp>b.  \u003cem>Would\u003c/em> treats the bad outcome as hypothetical, something that has not happened yet and can still be prevented. \u003cem>Will\u003c/em> states it as a settled fact, which edges towards a threat.\u003c/p>","F3":"\u003cp>a.  Noun: \u003cem>there is a clash between the two\u003c/em>. Verb: \u003cem>the lab clashes with the tutorial\u003c/em>. Note it takes \u003cem>with\u003c/em>, never \u003cem>to\u003c/em>.\u003c/p>\u003cp>b.  \u003cem>I should mention\u003c/em> marks the information as something you are volunteering, slightly outside the main request. That lowers its pressure — you are offering a fact, not instructing them to act on it.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It blames the reader.\u003c/strong> “Somebody in your office” and “clearly nobody checked”. The first bullet asked for the clash to be explained, not prosecuted.\u003c/p>\u003cp>2.  \u003cstrong>It instructs and then chases.\u003c/strong> “Please change me”, “it should be easy for you”, “Please do it quickly”. The writer decides the difficulty of the reader’s job and sets the schedule.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).\u003c/p>","F5":"\u003cp>Model: \u003cem>The resit paper has been scheduled for 12 April, which is a day I observe and cannot sit an examination. I understand the timetable is set centrally and that there may be little flexibility, but I wondered whether an alternative date or a deferred sitting might be possible.\u003c/em>\u003c/p>\u003cp>Two passives, no agent, and a concession before the request.\u003c/p>"},"model":["Dear Undergraduate Office,","I have been allocated the Tuesday 9 a.m. tutorial for GEOG201, but that slot clashes with the compulsory Earth Materials lab, which runs Tuesdays from nine until eleven. As things stand I would have to miss one or the other every week.","Would it be possible to move me to the Thursday 2 p.m. group? I have checked the timetable and that slot is clear for me for the rest of the term.","I should mention that Hannah Weiss in the Thursday group has said she would be glad to swap into the Tuesday slot, if that makes the change simpler at your end. I have copied her in so she can confirm.","Thank you very much.","Best wishes,","Daniel Ofori — GEOG201"],"model_html":"\u003cp>Dear Undergraduate Office,\u003c/p>\u003cp>I have been allocated the Tuesday 9 a.m. tutorial for GEOG201, but that slot clashes with the compulsory Earth Materials lab, which runs Tuesdays from nine until eleven. As things stand I would have to miss one or the other every week.\u003c/p>\u003cp>Would it be possible to move me to the Thursday 2 p.m. group? I have checked the timetable and that slot is clear for me for the rest of the term.\u003c/p>\u003cp>I should mention that Hannah Weiss in the Thursday group has said she would be glad to swap into the Tuesday slot, if that makes the change simpler at your end. I have copied her in so she can confirm.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Daniel Ofori — GEOG201\u003c/p>","model_band":5,"degraded":["Hello,","Somebody in your office put me in the Tuesday tutorial but I have a compulsory lab in the same time, so clearly nobody checked the timetable before doing the allocation. This is a problem for me every week. Please change me to Thursday group. Another girl told me she wants to swap with me so it should be easy for you.","Please do it quickly because the term already started."],"degraded_html":"\u003cp>Hello,\u003c/p>\u003cp>Somebody in your office put me in the Tuesday tutorial but I have a compulsory lab in the same time, so clearly nobody checked the timetable before doing the allocation. This is a problem for me every week. Please change me to Thursday group. Another girl told me she wants to swap with me so it should be easy for you.\u003c/p>\u003cp>Please do it quickly because the term already started.\u003c/p>","degraded_band":3,"model_words":127,"fault_list":{"tag":"F4","faults":["It blames the reader. “Somebody in your office” and “clearly nobody checked”. The first bullet asked for the clash to be explained, not prosecuted.","It instructs and then chases. “Please change me”, “it should be easy for you”, “Please do it quickly”. The writer decides the difficulty of the reader’s job and sets the schedule.","Language and register. “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started)."],"html":["\u003cp>1.  \u003cstrong>It blames the reader.\u003c/strong> “Somebody in your office” and “clearly nobody checked”. The first bullet asked for the clash to be explained, not prosecuted.\u003c/p>","\u003cp>2.  \u003cstrong>It instructs and then chases.\u003c/strong> “Please change me”, “it should be easy for you”, “Please do it quickly”. The writer decides the difficulty of the reader’s job and sets the schedule.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).\u003c/p>"]},"scenario":"\u003cp>You have been allocated the Tuesday 9 a.m. tutorial group, which clashes with a compulsory lab. Another student in the Thursday group has said informally that she would swap, but the administrator has to approve it.\u003c/p>","bullets":["Explain the clash.","Ask to be moved to the Thursday group.","Mention that a swap may already be possible."],"header":[["To:","ugoffice.geog@northgate.ac.uk"],["Subject:","Tutorial group clash — GEOG201, Tuesday 9 a.m."]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It blames the reader. “Somebody in your office” and “clearly nobody checked”. The first bullet asked for the clash to be explained, not prosecuted.","correct":true},{"text":"“Public health must take priority over individual preferences” concedes that autonomy is being overridden, which gives Hana her argument back.","correct":false},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":false},{"text":"It instructs and then chases. “Please change me”, “it should be easy for you”, “Please do it quickly”. The writer decides the difficulty of the reader’s job and sets the schedule.","correct":true},{"text":"Language and register. “in the same time” (at the same time), “to Thursday group” (the Thursday group), “Another girl” (a classmate — and she has a name), “the term already started” (has already started).","correct":true},{"text":"Language: “this is a difficult question for every education system in the world” is filler; “decide your whole future” and “flexibility for the future” repeat; “a strong base” should be “a strong foundation”.","correct":false}],"key_html":"F4"}};</script>
