<script>window.ITEM={"kind":"exercise","id":"EM 063","slug":"em-063","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Invitation","payload":{"Strategy":"invite a stranger by showing you know their work","Grammar":"would like + object + infinitive","Vocabulary":"convene, panel, honorarium, expenses","Convention":"inviting someone with no obligation to you at all"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  She receives invitations constantly. What makes one worth opening?\u003c/p>\u003cp>b.  You cannot pay. Should that appear early or late?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an honorarium, and how does it differ from a fee?\u003c/p>\u003cp>b.  What does it mean to convene a panel?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Show you have read her work in one sentence that is not flattery.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The second paragraph does the real work. What exactly does it prove?\u003c/p>\u003cp>b.  The absence of a fee is stated flatly rather than apologetically. Why is that better?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the thing that made those pieces useful was that they followed particular tenancies\" — name the device.\u003c/p>\u003cp>b.  \"If November is difficult, we run these in February and May as well.\" What does this do beyond offering dates?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Evidence that the sender knows who she is. A specific reference to particular work, and a reason why that work suits this audience, distinguishes the email from the dozen generic ones she deleted this morning.\u003c/p>\u003cp>b.  Clearly and in the practical paragraph — not buried at the end and not apologised for. She needs it to decide, and concealing it until she is interested wastes her time and burns the relationship.\u003c/p>","P2":"\u003cp>a.  An honorarium is a token payment for a service for which no fee is customary. A fee is the commercial rate. Offering neither is fine; pretending an honorarium is a fee is not.\u003c/p>\u003cp>b.  To bring together and chair a group of speakers. Useful to know because it is what you are asking her to be part of, and using the right word signals the event is organised.\u003c/p>","P3":"\u003cp>Model: \"the thing that made those pieces useful was that they followed particular tenancies through to the end.\"\u003c/p>\u003cp>It names what the work did rather than praising it, which is the only way to prove you read it.\u003c/p>","F1":"\u003cp>a.  That the invitation is addressed to her rather than to a category. It names a specific series, identifies the feature that made it distinctive, and connects that feature to a gap in the society’s programme. Flattery proves nothing; description proves you read it.\u003c/p>\u003cp>b.  Because an apologetic framing invites her to reassure the sender, and because treating the absence of a fee as embarrassing suggests the invitation is worth less than it is. Stating it as a fact, with an explicit exit, respects her time.\u003c/p>","F2":"\u003cp>a.  A wh-cleft (family 8, structure 60), which puts the distinctive feature of her work in the stressed final position and makes the sentence read as an observation rather than a compliment.\u003c/p>\u003cp>b.  It converts a possible no into a possible later. Offering alternative dates unprompted removes the awkwardness of declining and keeps the relationship open, at the cost of one line.\u003c/p>","F3":"\u003cp>1.  Nothing shows the invitation is for her specifically. \"We are big fans of your work\" and \"your experience as a journalist\" would fit any journalist alive, so the second bullet fails.\u003c/p>\u003cp>2.  The offer is concealed. \"A very limited budget\" does not say whether travel is covered or whether a fee exists, so she cannot evaluate it without a further exchange.\u003c/p>\u003cp>3.  No date, no time, no talk length, no question format. \"Please let us know if you are interested\" asks for a commitment before supplying the information needed to make one.\u003c/p>"},"model":["Dear Ms Mercer,","I am writing on behalf of the Northgate Housing Forum, a student group that runs four public events a year, to ask whether you would speak at our November meeting on the private rented sector.","We are asking you in particular because of the series you wrote on section 21 and the Birmingham caseworkers — almost everything students hear about renting is national and statistical, and the thing that made those pieces useful was that they followed particular tenancies through to the end. That is the gap we have never managed to fill with an academic speaker.","The practical details: Wednesday 12 November, 6 p.m., about eighty students, a twenty-minute talk and half an hour of questions. I should say plainly that we have no speaker budget — we can cover travel and a meal and nothing else, and I would completely understand if that rules it out.","If November is difficult, we run these in February and May as well.","With best wishes,","Ruth Adeyemi — Northgate Housing Forum"],"model_html":"\u003cp>Dear Ms Mercer,\u003c/p>\u003cp>I am writing on behalf of the Northgate Housing Forum, a student group that runs four public events a year, to ask whether you would speak at our November meeting on the private rented sector.\u003c/p>\u003cp>We are asking you in particular because of the series you wrote on section 21 and the Birmingham caseworkers — almost everything students hear about renting is national and statistical, and the thing that made those pieces useful was that they followed particular tenancies through to the end. That is the gap we have never managed to fill with an academic speaker.\u003c/p>\u003cp>The practical details: Wednesday 12 November, 6 p.m., about eighty students, a twenty-minute talk and half an hour of questions. I should say plainly that we have no speaker budget — we can cover travel and a meal and nothing else, and I would completely understand if that rules it out.\u003c/p>\u003cp>If November is difficult, we run these in February and May as well.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Ruth Adeyemi — Northgate Housing Forum\u003c/p>","model_band":5,"degraded":["Dear Ms Mercer, We are a student society at Northgate University and we would be honoured if you could come and give a talk at our event about housing in November. We are big fans of your work and we think our members would learn a lot from your experience as a journalist. The event will be in the evening and there will be around eighty students. Unfortunately as a student society we have a very limited budget. Please let us know if you are interested.","Ruth"],"degraded_html":"\u003cp>Dear Ms Mercer, We are a student society at Northgate University and we would be honoured if you could come and give a talk at our event about housing in November. We are big fans of your work and we think our members would learn a lot from your experience as a journalist. The event will be in the evening and there will be around eighty students. Unfortunately as a student society we have a very limited budget. Please let us know if you are interested.\u003c/p>\u003cp>Ruth\u003c/p>","degraded_band":3,"model_words":172,"fault_list":{"tag":"F3","faults":["Nothing shows the invitation is for her specifically. \"We are big fans of your work\" and \"your experience as a journalist\" would fit any journalist alive, so the second bullet fails.","The offer is concealed. \"A very limited budget\" does not say whether travel is covered or whether a fee exists, so she cannot evaluate it without a further exchange.","No date, no time, no talk length, no question format. \"Please let us know if you are interested\" asks for a commitment before supplying the information needed to make one."],"html":["\u003cp>1.  Nothing shows the invitation is for her specifically. \"We are big fans of your work\" and \"your experience as a journalist\" would fit any journalist alive, so the second bullet fails.\u003c/p>","\u003cp>2.  The offer is concealed. \"A very limited budget\" does not say whether travel is covered or whether a fee exists, so she cannot evaluate it without a further exchange.\u003c/p>","\u003cp>3.  No date, no time, no talk length, no question format. \"Please let us know if you are interested\" asks for a commitment before supplying the information needed to make one.\u003c/p>"]},"scenario":"\u003cp>Your society wants a journalist who writes on housing to speak at a student event. You have no budget beyond travel expenses. She has never heard of you.\u003c/p>","bullets":["Invite her and say what the event is.","Show that the invitation is not generic.","Be honest about what you can and cannot offer."],"header":[["To:","contact@rjmercer.net"],["Subject:","Invitation to speak — Northgate housing forum, 12 November"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Nothing shows the invitation is for her specifically. “We are big fans of your work” and “your experience as a journalist” would fit any journalist alive, so the second bullet fails.","correct":true},{"text":"The final sentence is about the seventeenth century in general and contributes nothing to the question; “both partly right” is the whole of the engagement with either speaker.","correct":false},{"text":"The offer is concealed. “A very limited budget” does not say whether travel is covered or whether a fee exists, so she cannot evaluate it without a further exchange.","correct":true},{"text":"“The real world is different” and “unexpected situations” are unfalsifiable, and the empathy point answers a question about diagnostic accuracy with one about consultation.","correct":false},{"text":"“They have much more power and resources, so they should be the ones who adapt” asserts a conclusion from an imbalance without showing why power implies the duty — the pooling argument that would justify it is absent.","correct":false},{"text":"No date, no time, no talk length, no question format. “Please let us know if you are interested” asks for a commitment before supplying the information needed to make one.","correct":true}],"key_html":"F3"}};</script>
