<script>window.ITEM={"kind":"exercise","id":"AD 028","slug":"ad-028","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Technology and AI · cause ranking","payload":{"Strategy":"rank by which cause would still produce the effect alone","Grammar":"cleft for emphasis","Vocabulary":"friction, default, dark pattern, attention","Convention":"ranking causes where one is a design choice"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Jonas’s historical comparison is doing argumentative work. What work?\u003c/p>\u003cp>b.  What would show that design adds something habit does not?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is friction in interface design, and what is a default?\u003c/p>\u003cp>b.  What is a dark pattern?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using what each predicts about the size of the gap.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response narrows Rosa’s claim. To what, and why is the narrower version stronger?\u003c/p>\u003cp>b.  Why is the third cause \"treated with suspicion\" rather than simply ranked last?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it is the stopping point, not the appetite, that the design teams were working on\" — name the device and say what it achieves.\u003c/p>\u003cp>b.  \"cannot explain a change\" — where have you met this principle before in this book?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It separates the appetite from the technology, which undermines the claim that design created the problem. If the overshoot predates the phone, design cannot be its cause.\u003c/p>\u003cp>b.  Evidence that the size of the gap changed when the design changed, holding the appetite constant — which is what the removal of stopping points provides.\u003c/p>","P2":"\u003cp>a.  Friction is anything that makes an action take more effort; a default is what happens if the user does nothing. Both are design choices and both are invisible to the user.\u003c/p>\u003cp>b.  An interface deliberately designed to produce a choice the user would not make if the options were presented neutrally.\u003c/p>","P3":"\u003cp>Model: \"Habit explains the appetite and is constant; design explains the size of the overshoot because it removed the stopping points that used to bound it.\"\u003c/p>","F1":"\u003cp>a.  To the claim that design removed the natural terminators rather than that it manufactured the desire. It is stronger because it survives Jonas’s historical comparison — indeed it uses it — whereas the broad version does not.\u003c/p>\u003cp>b.  Because treating it as a cause at all may be an error. The response argues it is downstream of the other two, so ranking it third without comment would concede that it belongs on the same list.\u003c/p>","F2":"\u003cp>a.  An it-cleft (family 8, structure 59). It isolates the stopping point from the appetite and contrasts them explicitly, which is the precise distinction the whole ranking rests on.\u003c/p>\u003cp>b.  In AD 001 (psychology constant, distribution system changed), AD 004 (network effects) and AD 023 (inactivity). A constant cannot explain a variable, and it is the most reliable single tool in these cause-ranking questions.\u003c/p>","F3":"\u003cp>1.  It never engages Jonas’s argument, which was that the pattern predates the technology. \"Habit also plays a role\" acknowledges him without answering.\u003c/p>\u003cp>2.  The explanation offered is motive rather than mechanism — advertising revenue explains why firms would want more time, not how they obtain it against the user’s stated preference.\u003c/p>\u003cp>3.  The regulation proposal and the reference to children arrive at the end without argument. Language: \"the companies\", \"the users\", \"the technology companies\" over-articled; \"addictive\" is asserted rather than defined.\u003c/p>"},"model":["Jonas is right that the phenomenon predates the technology, and that is exactly what makes the comparison useful rather than decisive. Television produced the same overshoot, but the gap was bounded by things design cannot remove: the schedule ended, the tape ran out, the programme finished. What is new is not the appetite but the removal of every natural stopping point, and it is the stopping point, not the appetite, that the design teams were working on.","So I would put design first, on a narrow and defensible version of Rosa’s claim: design did not create the habit, it deleted the friction that used to terminate it. Habit I would rank second, since without it there is nothing for the design to act on — but it is the constant across a century and cannot explain a change. The absence of competing activities I would put third and treat with suspicion, because it is mostly an effect: the alternatives did not disappear and then leave a vacuum, they became harder to choose once the default required no decision at all."],"model_html":"\u003cp>Jonas is right that the phenomenon predates the technology, and that is exactly what makes the comparison useful rather than decisive. Television produced the same overshoot, but the gap was bounded by things design cannot remove: the schedule ended, the tape ran out, the programme finished. What is new is not the appetite but the removal of every natural stopping point, and it is the stopping point, not the appetite, that the design teams were working on.\u003c/p>\u003cp>So I would put design first, on a narrow and defensible version of Rosa’s claim: design did not create the habit, it deleted the friction that used to terminate it. Habit I would rank second, since without it there is nothing for the design to act on — but it is the constant across a century and cannot explain a change. The absence of competing activities I would put third and treat with suspicion, because it is mostly an effect: the alternatives did not disappear and then leave a vacuum, they became harder to choose once the default required no decision at all.\u003c/p>","model_band":5,"degraded":["I think the main reason is the design of the applications because the companies want us to spend as much time as possible on their platforms so they can show us more advertisements and make more money. They hire psychologists to make the apps addictive, with notifications and infinite scrolling and all these tricks. Of course habit also plays a role as Jonas says, and people should have more self-control, but I think it is mainly the responsibility of the technology companies. Governments should regulate these practices to protect the users, especially children who are the most vulnerable."],"degraded_html":"\u003cp>I think the main reason is the design of the applications because the companies want us to spend as much time as possible on their platforms so they can show us more advertisements and make more money. They hire psychologists to make the apps addictive, with notifications and infinite scrolling and all these tricks. Of course habit also plays a role as Jonas says, and people should have more self-control, but I think it is mainly the responsibility of the technology companies. Governments should regulate these practices to protect the users, especially children who are the most vulnerable.\u003c/p>","degraded_band":3,"model_words":179,"fault_list":{"tag":"F3","faults":["It never engages Jonas’s argument, which was that the pattern predates the technology. \"Habit also plays a role\" acknowledges him without answering.","The explanation offered is motive rather than mechanism — advertising revenue explains why firms would want more time, not how they obtain it against the user’s stated preference.","The regulation proposal and the reference to children arrive at the end without argument. Language: \"the companies\", \"the users\", \"the technology companies\" over-articled; \"addictive\" is asserted rather than defined."],"html":["\u003cp>1.  It never engages Jonas’s argument, which was that the pattern predates the technology. \"Habit also plays a role\" acknowledges him without answering.\u003c/p>","\u003cp>2.  The explanation offered is motive rather than mechanism — advertising revenue explains why firms would want more time, not how they obtain it against the user’s stated preference.\u003c/p>","\u003cp>3.  The regulation proposal and the reference to children arrive at the end without argument. Language: \"the companies\", \"the users\", \"the technology companies\" over-articled; \"addictive\" is asserted rather than defined.\u003c/p>"]},"prof_name":"Dr Sorensen","professor":"\u003cp>People spend far longer on their phones than they report wanting to. Explanations include the design of the applications, the absence of competing activities, and ordinary habit. Which explains most of the gap?\u003c/p>","students":[["Rosa","Design. Infinite scroll, autoplay and notifications are not accidents; they are the output of teams measured on time spent. The gap between wanting and doing is manufactured."],["Jonas","Habit. People overshoot on everything they do automatically — television did this before phones, and radio before that. Blaming design flatters us: it makes an old failure of self-command into something done to us."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Employers do not care about these certificates at all” overstates and is easy to refute with one counter-example, which would discredit the rest. Two comma splices.","correct":false},{"text":"No timings, no panel subject, no travel offer, no exit, and the register is institutional throughout — “we would be very pleased”, “very valuable” — which reads as a circular rather than an approach.","correct":false},{"text":"It asks for a change of borrowing category — “like the staff have” — which nobody reading the email can grant. The second bullet fails.","correct":false},{"text":"The regulation proposal and the reference to children arrive at the end without argument. Language: “the companies”, “the users”, “the technology companies” over-articled; “addictive” is asserted rather than defined.","correct":true},{"text":"The explanation offered is motive rather than mechanism — advertising revenue explains why firms would want more time, not how they obtain it against the user’s stated preference.","correct":true},{"text":"It never engages Jonas’s argument, which was that the pattern predates the technology. “Habit also plays a role” acknowledges him without answering.","correct":true}],"key_html":"F3"}};</script>
