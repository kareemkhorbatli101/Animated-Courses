<script>window.ITEM={"kind":"exercise","id":"EM 021","slug":"em-021","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation · anchor item","payload":{"Strategy":"apologise once, explain briefly, repair concretely","Grammar":"the past perfect for prior cause; the unreal past for regret","Vocabulary":"let down, make up for, oversight, at short notice","Convention":"the difference between an explanation and an excuse"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  An explanation and an excuse contain the same facts. What makes the difference?\u003c/p>\u003cp>b.  Part of what happened is genuinely not your fault, and part of it is. Which should get more words?\u003c/p>\u003cp>c.  Who is the reader here, and how does writing to peers rather than to staff change the register?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which of these admits fault, and which deflects it?\u003c/p>\u003cpre class=\"mono\">I am sorry that you were inconvenienced.\nI am sorry for missing the meeting.\nI apologise if anyone was put out.\nI let you all down on Wednesday.\u003c/pre>\u003cp>b.  Complete: an ______ (a failure to notice); to ______ up for something; at short ______ .\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>One sentence that gives the reason without using it as a defence. Under 30 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Three versions of the explanation. Which is the apology, and what are the other two?\u003c/p>\u003cpre class=\"mono\">(A) I had my resit that afternoon and my phone was off, so\n    there was really no way I could have known.\n(B) I had my resit that afternoon and had my phone off; that\n    is why I missed the messages, but I should have checked\n    the calendar on Monday and I did not.\n(C) Sorry, I completely forgot, it has been a mad week for\n    everyone I think.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Count the apologies. Where are they, and why not more?\u003c/p>\u003cp>b.  Find the sentence that refuses the available excuse. Why does giving up a defence make the email stronger?\u003c/p>\u003cp>c.  The repair is more than an offer to help. What exactly makes it proportionate to the damage?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “my resit \u003cem>had been moved\u003c/em> to Wednesday afternoon and I \u003cem>had turned\u003c/em> my phone off”. Why two past perfects, when the missing happened on Wednesday too?\u003c/p>\u003cp>b.  “I \u003cem>should have been\u003c/em> there” and “I \u003cem>should have checked\u003c/em>”. What does this form do that \u003cem>I am sorry\u003c/em> alone cannot?\u003c/p>\u003cp>c.  “That explains the silence, but not the absence.” What has been left out after \u003cem>not\u003c/em>, and why is the ellipsis effective here?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>let you down\u003c/em> versus \u003cem>inconvenienced you\u003c/em> — which belongs among peers, and what does the other sound like?\u003c/p>\u003cp>b.  Why \u003cem>make up for it\u003c/em> rather than \u003cem>compensate\u003c/em>?\u003c/p>\u003cp>c.  \u003cem>starting from scratch\u003c/em> — what does the idiom mean, and what is it doing at the end of that sentence?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>You returned a borrowed camera two days late and the next user lost a shoot. In 60 words: apologise once, explain without excusing, and offer a repair proportionate to the harm.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  An explanation accounts for the facts and leaves the responsibility where it falls. An excuse uses the same facts to move the responsibility somewhere else. The giveaway is usually a word like \u003cem>so\u003c/em> or \u003cem>because\u003c/em> pointing at the conclusion \u003cem>therefore not my fault\u003c/em>.\u003c/p>\u003cp>b.  The part that is your fault. The exam explains the silence and costs you nothing to say; the forgotten calendar entry is the actual failure, and an apology that dwells on the blameless half reads as self-serving.\u003c/p>\u003cp>c.  Peers can take \u003cem>Hi all\u003c/em> and a first name, and they do not need formal constructions. But register is not the same as seriousness: the apology still has to be unambiguous, and among peers it has to be \u003cem>more\u003c/em> concrete, because they are the ones who did your work.\u003c/p>","P2":"\u003cp>a.  Admits fault: \u003cstrong>I am sorry for missing the meeting\u003c/strong> and \u003cstrong>I let you all down\u003c/strong>. Deflects: \u003cem>sorry that you were inconvenienced\u003c/em> (apologises for their reaction, not your act) and \u003cem>sorry if anyone was put out\u003c/em> (makes the harm hypothetical). The \u003cem>if\u003c/em>-apology is the most recognisable non-apology in English.\u003c/p>\u003cp>b.  an \u003cstrong>oversight\u003c/strong> ; to \u003cstrong>make\u003c/strong> up for something ; at short \u003cstrong>notice\u003c/strong>.\u003c/p>","P3":"\u003cp>Model: \u003cem>My resit had been moved to that afternoon and my phone was off, which explains the silence but not the absence.\u003c/em>\u003c/p>\u003cp>The second clause is what converts an excuse into an explanation. Without it, the facts do all the deflecting on their own.\u003c/p>","P4":"\u003cp>\u003cstrong>(B) is the apology.\u003c/strong>\u003c/p>\u003cp>(A) is an excuse: \u003cem>no way I could have known\u003c/em> claims the outcome was unavoidable, which is not true — the calendar was there on Monday.\u003c/p>\u003cp>(C) is an evasion dressed as informality. \u003cem>It has been a mad week for everyone\u003c/em> spreads the fault across the whole group, which quietly asks the people you let down to share the blame for it.\u003c/p>\u003cp>(B) separates the two halves and keeps the blame on the right one.\u003c/p>","F1":"\u003cp>a.  Two — one at the start, one at the end, both short. More would make the group manage your feelings; fewer would look casual. The weight of the email sits in the repair, which is where it belongs.\u003c/p>\u003cp>b.  “That explains the silence, but not the absence: I had simply not put the meeting in my calendar.” The writer had a usable excuse and declined it. That is what makes the apology credible — anyone can apologise for something they are defending at the same time.\u003c/p>\u003cp>c.  It does the work the meeting would have done. The group lost a week on the site decision, and the attachment hands that week back. An offer to “help more next time” would not have been proportionate because it repairs nothing.\u003c/p>","F2":"\u003cp>a.  Both events happened \u003cem>before\u003c/em> the point the narrative is anchored at — the missed meeting. The past perfect marks them as prior causes rather than as part of the same sequence, which is exactly the relation an explanation needs.\u003c/p>\u003cp>b.  It accepts an obligation that existed and was not met. \u003cem>I am sorry\u003c/em> reports a feeling; \u003cem>I should have checked\u003c/em> names the specific thing you failed to do. Readers believe the second and discount the first, because only the second could be wrong.\u003c/p>\u003cp>c.  \u003cem>but not the absence\u003c/em> leaves out \u003cem>that does not explain\u003c/em>. The compression makes the two halves land as a single balanced judgement, and it sounds like someone thinking honestly rather than constructing a case.\u003c/p>","F3":"\u003cp>a.  \u003cstrong>Let you down\u003c/strong> belongs among peers: it names a relationship and a failure of it. \u003cem>Inconvenienced you\u003c/em> is the language of a utility company apologising for roadworks — institutional, distant, and faintly insulting between friends.\u003c/p>\u003cp>b.  \u003cem>Compensate\u003c/em> suggests a transaction and a sum. \u003cem>Make up for\u003c/em> is about restoring a relationship, which is what is actually damaged here.\u003c/p>\u003cp>c.  “From nothing, with no preparation.” It is doing contrastive work: it names the bad outcome the attachment prevents, so the reader can see the size of the repair without being told to admire it.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It is not an apology.\u003c/strong> “actually it was not really my fault”, and the false claim that “nobody told me”. The first bullet asked for an apology; this is a defence with the word \u003cem>sorry\u003c/em> attached at each end.\u003c/p>\u003cp>2.  \u003cstrong>The repair is missing and the blame is redistributed.\u003c/strong> The third bullet is answered by a proposal that the \u003cem>group\u003c/em> change its practices — so the person at fault ends by recommending that everybody else do better.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “in the same afternoon” (that afternoon), “moved to this day” (that day), “the messages of Priya” (Priya’s messages), “so this kind of problem will not happen” (would not happen). None is fatal alone; together with the register they hold it at 3.\u003c/p>","F5":"\u003cp>Model: \u003cem>I am sorry about the camera — getting it back two days late cost Yara her shoot, and that is on me. I had assumed the booking ran to Friday and did not check. I have spoken to the store and booked the same body for her on Saturday at my own cost, if that date works for her.\u003c/em>\u003c/p>\u003cp>Note the order: apology, named harm, admission, repair. The repair is specific, already actioned, and costs the writer something.\u003c/p>"},"model":["Hi all,","I am sorry about Wednesday — I should have been there and I let you down, particularly as it meant the site decision had to wait another week.","What happened is that my resit had been moved to Wednesday afternoon and I had turned my phone off for it, so I missed Priya’s messages. That explains the silence, but not the absence: I had simply not put the meeting in my calendar, and I should have checked on Monday like everyone else.","To make up for it, I have gone through the two site options and written up the access and cost comparison we were going to discuss — it is attached, so we can come to the meeting on Monday with the groundwork done rather than starting from scratch. I am also happy to take the write-up section nobody wanted.","Sorry again, and thanks for rescheduling.","Dan"],"model_html":"\u003cp>Hi all,\u003c/p>\u003cp>I am sorry about Wednesday — I should have been there and I let you down, particularly as it meant the site decision had to wait another week.\u003c/p>\u003cp>What happened is that my resit had been moved to Wednesday afternoon and I had turned my phone off for it, so I missed Priya’s messages. That explains the silence, but not the absence: I had simply not put the meeting in my calendar, and I should have checked on Monday like everyone else.\u003c/p>\u003cp>To make up for it, I have gone through the two site options and written up the access and cost comparison we were going to discuss — it is attached, so we can come to the meeting on Monday with the groundwork done rather than starting from scratch. I am also happy to take the write-up section nobody wanted.\u003c/p>\u003cp>Sorry again, and thanks for rescheduling.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi guys,","Sorry for Wednesday but actually it was not really my fault because I had my resit exam in the same afternoon and nobody told me that the meeting was moved to this day. My phone was off during the exam so I could not see the messages of Priya. I think next time we should confirm the meetings earlier so this kind of problem will not happen again to anybody. Anyway sorry again and see you on Monday.","Dan"],"degraded_html":"\u003cp>Hi guys,\u003c/p>\u003cp>Sorry for Wednesday but actually it was not really my fault because I had my resit exam in the same afternoon and nobody told me that the meeting was moved to this day. My phone was off during the exam so I could not see the messages of Priya. I think next time we should confirm the meetings earlier so this kind of problem will not happen again to anybody. Anyway sorry again and see you on Monday.\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":149,"fault_list":{"tag":"F4","faults":["It is not an apology. “actually it was not really my fault”, and the false claim that “nobody told me”. The first bullet asked for an apology; this is a defence with the word sorry attached at each end.","The repair is missing and the blame is redistributed. The third bullet is answered by a proposal that the group change its practices — so the person at fault ends by recommending that everybody else do better.","Language. “in the same afternoon” (that afternoon), “moved to this day” (that day), “the messages of Priya” (Priya’s messages), “so this kind of problem will not happen” (would not happen). None is fatal alone; together with the register they hold it at 3."],"html":["\u003cp>1.  \u003cstrong>It is not an apology.\u003c/strong> “actually it was not really my fault”, and the false claim that “nobody told me”. The first bullet asked for an apology; this is a defence with the word \u003cem>sorry\u003c/em> attached at each end.\u003c/p>","\u003cp>2.  \u003cstrong>The repair is missing and the blame is redistributed.\u003c/strong> The third bullet is answered by a proposal that the \u003cem>group\u003c/em> change its practices — so the person at fault ends by recommending that everybody else do better.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “in the same afternoon” (that afternoon), “moved to this day” (that day), “the messages of Priya” (Priya’s messages), “so this kind of problem will not happen” (would not happen). None is fatal alone; together with the register they hold it at 3.\u003c/p>"]},"scenario":"\u003cp>You missed a group meeting on Wednesday without telling anyone. Your phone had been off because you were sitting a rescheduled exam, and you simply forgot the meeting existed. The group had to postpone a decision because you were not there.\u003c/p>","bullets":["Apologise for missing the meeting.","Explain what happened.","Propose how to put it right."],"header":[["To:","geog-group4@northgate.ac.uk"],["Subject:","Wednesday’s meeting — apologies"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It is not an apology. “actually it was not really my fault”, and the false claim that “nobody told me”. The first bullet asked for an apology; this is a defence with the word sorry attached at each end.","correct":true},{"text":"Language. “in the same afternoon” (that afternoon), “moved to this day” (that day), “the messages of Priya” (Priya’s messages), “so this kind of problem will not happen” (would not happen). None is fatal alone; together with the register they hold it at 3.","correct":true},{"text":"The repair is missing and the blame is redistributed. The third bullet is answered by a proposal that the group change its practices — so the person at fault ends by recommending that everybody else do better.","correct":true},{"text":"“Managers can monitor the results carefully to make sure the data is accurate” proposes more observation as the cure for an observation effect, which makes it worse.","correct":false},{"text":"“Users should report the abuse” places a duty on the harmed party without noticing. Language: “the platforms”, “the safety of their users”, “the most serious cases” over-articled; “artificial intelligence” is invoked as though it were a resource rather than a method.","correct":false},{"text":"“Small farmers deserve support rather than large agribusiness” substitutes a preference about who farms for the question of which system is more robust, and Chiara’s point about correlated failure goes unused.","correct":false}],"key_html":"F4"}};</script>
