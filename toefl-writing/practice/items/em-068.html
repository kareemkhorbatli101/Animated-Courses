<script>window.ITEM={"kind":"exercise","id":"EM 068","slug":"em-068","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Offer of help","payload":{"Strategy":"offer the specific hour rather than the open promise","Grammar":"offers with shall and can","Vocabulary":"capacity, hand over, shadow, step in","Convention":"offering help without taking over"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  What is the risk in an offer of help to someone who is ill?\u003c/p>\u003cp>b.  Why is \"let me know if you need anything\" not an offer?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to shadow someone, and to step in?\u003c/p>\u003cp>b.  Distinguish handing over from taking over.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Make the offer concrete in one sentence with an hour in it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  \"No need to reply to this today or at all\" — what does opening here accomplish?\u003c/p>\u003cp>b.  \"your code, my hands\" — why offer this version as well?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"if you would rather nobody went near it, that is completely fine\" — why spell out the refusal?\u003c/p>\u003cp>b.  \"We moved the integration week to the 12th on Tuesday and it cost us nothing\" — why the detail?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That it arrives as another task — something to answer, be grateful for, and negotiate — at a moment when she has no capacity for any of those.\u003c/p>\u003cp>b.  Because it transfers the work of specifying, asking and justifying to the person who is already struggling. A real offer names the task, the time and the start date so that \"yes\" is the only word required.\u003c/p>","P2":"\u003cp>a.  To shadow is to work alongside someone and learn the task; to step in is to take it over temporarily.\u003c/p>\u003cp>b.  Handing over is a transfer she controls; taking over happens to her. The distinction is what the whole email is managing.\u003c/p>","P3":"\u003cp>Model: \"I could take the data-loading module off you — say the word and I will start on Saturday.\"\u003c/p>","F1":"\u003cp>a.  It removes the obligation before she has read anything else, so the rest of the email is information rather than a demand. An unanswered email is only restful if someone has said so explicitly.\u003c/p>\u003cp>b.  Because for some people losing control of their code is worse than being behind, and this version keeps her as the author. Offering two shapes of help lets her choose the one that costs her least pride.\u003c/p>","F2":"\u003cp>a.  Because the polite reflex is to accept help you do not want. Naming the refusal as completely fine, and promising not to raise it again, is what makes declining genuinely available.\u003c/p>\u003cp>b.  It converts \"do not worry\" into evidence. A specific change already made at no cost proves the group is not waiting on her, where reassurance alone would sound like kindness covering a problem.\u003c/p>","F3":"\u003cp>1.  \"The deadline is getting close so it would be good to know what you are planning to do\" is a request wearing the clothes of an offer, and it puts the problem back on her.\u003c/p>\u003cp>2.  \"We are all managing fine and we understand completely\" implies there is something to understand — that is, that she has let the group down. The second bullet fails.\u003c/p>\u003cp>3.  \"If you need any help just let me know\" names no task, no hour and no date, so nothing is actually offered; there are also two comma splices.\u003c/p>"},"model":["Hi Anja,","No need to reply to this today or at all — nothing in it needs an answer.","I have looked at the repository and I could take the data-loading module off you. It is the self-contained part and I think I can do it in a weekend without touching anything you have written. If that would help, say the word and I will start on Saturday; if you would rather nobody went near it, that is completely fine and I will say nothing more about it.","The group is not waiting on you, whatever anyone has said. We moved the integration week to the 12th on Tuesday and it cost us nothing, so there is slack.","If it is easier, I can also just sit on a call for an hour and have you tell me what to type — your code, my hands. Some people find that less annoying than handing a module over.","Get well. The project is genuinely fine.","Dev"],"model_html":"\u003cp>Hi Anja,\u003c/p>\u003cp>No need to reply to this today or at all — nothing in it needs an answer.\u003c/p>\u003cp>I have looked at the repository and I could take the data-loading module off you. It is the self-contained part and I think I can do it in a weekend without touching anything you have written. If that would help, say the word and I will start on Saturday; if you would rather nobody went near it, that is completely fine and I will say nothing more about it.\u003c/p>\u003cp>The group is not waiting on you, whatever anyone has said. We moved the integration week to the 12th on Tuesday and it cost us nothing, so there is slack.\u003c/p>\u003cp>If it is easier, I can also just sit on a call for an hour and have you tell me what to type — your code, my hands. Some people find that less annoying than handing a module over.\u003c/p>\u003cp>Get well. The project is genuinely fine.\u003c/p>\u003cp>Dev\u003c/p>","model_band":5,"degraded":["Hi Anja, I hope you are feeling better! I heard you have been in hospital, that must be really hard. Do not worry about the project at all, we are all managing fine and we understand completely. If you need any help with your part just let me know, I would be happy to help with the coding if you want. The deadline is getting close so it would be good to know what you are planning to do. Get well soon!","Dev"],"degraded_html":"\u003cp>Hi Anja, I hope you are feeling better! I heard you have been in hospital, that must be really hard. Do not worry about the project at all, we are all managing fine and we understand completely. If you need any help with your part just let me know, I would be happy to help with the coding if you want. The deadline is getting close so it would be good to know what you are planning to do. Get well soon!\u003c/p>\u003cp>Dev\u003c/p>","degraded_band":3,"model_words":165,"fault_list":{"tag":"F3","faults":["\"The deadline is getting close so it would be good to know what you are planning to do\" is a request wearing the clothes of an offer, and it puts the problem back on her.","\"We are all managing fine and we understand completely\" implies there is something to understand — that is, that she has let the group down. The second bullet fails.","\"If you need any help just let me know\" names no task, no hour and no date, so nothing is actually offered; there are also two comma splices."],"html":["\u003cp>1.  \"The deadline is getting close so it would be good to know what you are planning to do\" is a request wearing the clothes of an offer, and it puts the problem back on her.\u003c/p>","\u003cp>2.  \"We are all managing fine and we understand completely\" implies there is something to understand — that is, that she has let the group down. The second bullet fails.\u003c/p>","\u003cp>3.  \"If you need any help just let me know\" names no task, no hour and no date, so nothing is actually offered; there are also two comma splices.\u003c/p>"]},"scenario":"\u003cp>A friend on your course has been in hospital for a fortnight and is behind on a group project where she is the group’s only programmer. The group is quietly panicking. You can code a little.\u003c/p>","bullets":["Offer help.","Do not imply she has let anyone down.","Make the offer easy to decline or limit."],"header":[["To:","a.novak@northgate.ac.uk"],["Subject:","Project — an offer, not a request"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“The deadline is getting close so it would be good to know what you are planning to do” is a request wearing the clothes of an offer, and it puts the problem back on her.","correct":true},{"text":"It takes no position. “A combination of both approaches” specifies nothing about when each would apply, which is the entire question.","correct":false},{"text":"Language: “the health professionals”, “the patient and his history” (generic “their”), “the medicines and their interactions”, “the decisions about the treatment” — over-articled throughout; and “dangerous situations could be avoided” is agentless where the whole question is about agency.","correct":false},{"text":"“We are all managing fine and we understand completely” implies there is something to understand — that is, that she has let the group down. The second bullet fails.","correct":true},{"text":"Language: “the real responsibility is of the company” (lies with); “the sellers and the buyers”, “the market”, “the victims” over-articled; “they knew or should have known” is a legal formula used without the standard it belongs to.","correct":false},{"text":"“If you need any help just let me know” names no task, no hour and no date, so nothing is actually offered; there are also two comma splices.","correct":true}],"key_html":"F3"}};</script>
