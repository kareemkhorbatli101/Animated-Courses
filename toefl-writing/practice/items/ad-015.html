<script>window.ITEM={"kind":"exercise","id":"AD 015","slug":"ad-015","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Law and ethics · agree or disagree with a claim","payload":{"Strategy":"test a rule by the cases it was not written for","Grammar":"the counterfactual","Vocabulary":"precedent, codify, discretion, bright line","Convention":"arguing about rules without invoking natural justice"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Mei and Tomas use \"equality\" differently. How?\u003c/p>\u003cp>b.  What evidence would distinguish their positions?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a bright-line rule, and what is its advantage?\u003c/p>\u003cp>b.  Distinguish precedent from guideline.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the distinction between uniformity and equality in one sentence, and say what follows.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reframes the choice in the fourth sentence. What are the two options it offers instead?\u003c/p>\u003cp>b.  Why does it say Mei’s fact is \"the harder\" one?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had the argument been about whether circumstances matter it would be unanswerable on his side\" — identify the structure and say what the concession achieves.\u003c/p>\u003cp>b.  \"unexplained variance\" — where is this phrase borrowed from, and what does importing it do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Mei means equality of outcome for like cases, measured across defendants. Tomas means equality of treatment as individuals, which requires attending to unlike features. The word covers two different things.\u003c/p>\u003cp>b.  Data on what unstructured discretion actually tracks. If it correlates with morally relevant features, Tomas is vindicated; if with the judge’s identity or the time of day, Mei is — and that evidence exists.\u003c/p>","P2":"\u003cp>a.  A rule with a sharp threshold and no discretion at the boundary. Its advantage is predictability and resistance to pressure; its cost is that it cannot see cases near the line.\u003c/p>\u003cp>b.  Precedent binds through decided cases and develops incrementally; a guideline is issued in advance and states a range. Guidelines constrain more predictably but adapt more slowly.\u003c/p>","P3":"\u003cp>Model: \"Uniformity is treating cases alike; equality is treating relevantly similar cases alike, which means the question is who decides what is relevant and whether they have to say so.\"\u003c/p>","F1":"\u003cp>a.  Discretion that is unexamined, and discretion that has to be written down. Neither classmate offered the second, and it dissolves the apparent choice between seeing differences and ignoring them.\u003c/p>\u003cp>b.  Because Tomas’s claim is a priori — of course cases differ — while Mei’s is empirical and uncomfortable. An argument that has to accommodate an unwelcome fact is doing more work than one that only has to accommodate an obvious one.\u003c/p>","F2":"\u003cp>a.  An inverted third conditional. The concession is generous — it grants that on one reading Tomas simply wins — and that generosity is what makes the reinterpretation persuasive rather than evasive.\u003c/p>\u003cp>b.  From statistics: variance not accounted for by the model. Importing it reframes judicial discretion as something measurable, which is precisely Mei’s ground, and lets the writer treat \"unexplained\" as the defect rather than \"discretionary\".\u003c/p>","F3":"\u003cp>1.  Mei’s evidence is dismissed as \"a small problem\" without engaging it — and it was the only empirical claim in the discussion.\u003c/p>\u003cp>2.  The remedy, better training, is asserted with no account of why it would fix effects that are largely unconscious, and nothing new is contributed.\u003c/p>\u003cp>3.  Language: \"the justice becomes like a machine without humanity\" is rhetoric rather than argument; \"dangerous for the society\", \"the automatic sentences\", \"all the cases\" are all over-articled.\u003c/p>"},"model":["Tomas is right that the cases differ and Mei is right about where discretion actually goes, and the second is the harder fact. If unstructured judgement reliably tracked morally relevant differences we would not see the day-of-the-week effects; what it tracks instead is whatever the judge finds salient, which includes things nobody would defend if asked. So the choice is not between seeing the differences and ignoring them. It is between discretion that is unexamined and discretion that has to be written down.","That points to structured rather than fixed guidelines: a starting point by offence, with the mitigating factors enumerated, and a requirement to state in writing which ones were applied and why. Coerced participation is then visible as a named reason rather than as an unexplained variance, and Tomas gets his distinction in a form Mei can audit. Had the argument been about whether circumstances matter it would be unanswerable on his side; it is really about whether they are better handled silently or on the record."],"model_html":"\u003cp>Tomas is right that the cases differ and Mei is right about where discretion actually goes, and the second is the harder fact. If unstructured judgement reliably tracked morally relevant differences we would not see the day-of-the-week effects; what it tracks instead is whatever the judge finds salient, which includes things nobody would defend if asked. So the choice is not between seeing the differences and ignoring them. It is between discretion that is unexamined and discretion that has to be written down.\u003c/p>\u003cp>That points to structured rather than fixed guidelines: a starting point by offence, with the mitigating factors enumerated, and a requirement to state in writing which ones were applied and why. Coerced participation is then visible as a named reason rather than as an unexplained variance, and Tomas gets his distinction in a form Mei can audit. Had the argument been about whether circumstances matter it would be unanswerable on his side; it is really about whether they are better handled silently or on the record.\u003c/p>","model_band":5,"degraded":["In my opinion the judges should have the freedom to decide the sentence because every case is different and only the judge who sees the defendant can understand the real situation. If we apply fixed rules then the justice becomes like a machine without humanity, which is very dangerous for the society. Of course Mei is right that there are some differences between the judges but I think this is a small problem compared to the risk of injustice from the automatic sentences. The solution is to train the judges better so they can take fair decisions in all the cases."],"degraded_html":"\u003cp>In my opinion the judges should have the freedom to decide the sentence because every case is different and only the judge who sees the defendant can understand the real situation. If we apply fixed rules then the justice becomes like a machine without humanity, which is very dangerous for the society. Of course Mei is right that there are some differences between the judges but I think this is a small problem compared to the risk of injustice from the automatic sentences. The solution is to train the judges better so they can take fair decisions in all the cases.\u003c/p>","degraded_band":3,"model_words":172,"fault_list":{"tag":"F3","faults":["Mei’s evidence is dismissed as \"a small problem\" without engaging it — and it was the only empirical claim in the discussion.","The remedy, better training, is asserted with no account of why it would fix effects that are largely unconscious, and nothing new is contributed.","Language: \"the justice becomes like a machine without humanity\" is rhetoric rather than argument; \"dangerous for the society\", \"the automatic sentences\", \"all the cases\" are all over-articled."],"html":["\u003cp>1.  Mei’s evidence is dismissed as \"a small problem\" without engaging it — and it was the only empirical claim in the discussion.\u003c/p>","\u003cp>2.  The remedy, better training, is asserted with no account of why it would fix effects that are largely unconscious, and nothing new is contributed.\u003c/p>","\u003cp>3.  Language: \"the justice becomes like a machine without humanity\" is rhetoric rather than argument; \"dangerous for the society\", \"the automatic sentences\", \"all the cases\" are all over-articled.\u003c/p>"]},"prof_name":"Dr Ferreira","professor":"\u003cp>Some argue that sentencing should follow fixed guidelines so that identical offences receive identical penalties. Others argue that identical offences are rarer than they look, and that fixed tariffs produce injustice in the name of consistency. What is your view?\u003c/p>","students":[["Mei","Fixed guidelines. Disparities in sentencing track the judge, the day of the week and the defendant’s background far more than anyone is comfortable admitting. Consistency is not a bureaucratic value; it is what equality before the law means in practice."],["Tomas","Guidelines flatten exactly the differences that matter. Two identical thefts committed by a first offender and by someone coerced into it are not the same case, and a tariff that cannot see the difference is not delivering equality, only uniformity."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","correct":false},{"text":"The remedy, better training, is asserted with no account of why it would fix effects that are largely unconscious, and nothing new is contributed.","correct":true},{"text":"Language: “the justice becomes like a machine without humanity” is rhetoric rather than argument; “dangerous for the society”, “the automatic sentences”, “all the cases” are all over-articled.","correct":true},{"text":"The repair is empty. “Let me know if there is anything I can do” puts the work of devising the remedy onto the coordinator. No shift is offered and no date named, so the third bullet fails.","correct":false},{"text":"It pre-empts the conditions it was asked to ask about. “we hope there is no deposit … we are only students” turns a question into a plea, and “Please tell us when we can take them” assumes the answer is yes.","correct":false},{"text":"Mei’s evidence is dismissed as “a small problem” without engaging it — and it was the only empirical claim in the discussion.","correct":true}],"key_html":"F3"}};</script>
