<script>window.ITEM={"kind":"exercise","id":"EM 015","slug":"em-015","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"quantify the harm; a number is harder to dismiss than an adjective","Grammar":"quantifier precision","Vocabulary":"intact, in transit, liable, signed for","Convention":"complaining to people who did not break the thing"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The post room did not break the glassware. What are you actually asking them for?\u003c/p>\u003cp>b.  Why does the signature matter more than the damage?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which is precise: \u003cem>some were broken\u003c/em> · \u003cem>two of six were broken\u003c/em> · \u003cem>a lot were broken\u003c/em>?\u003c/p>\u003cp>b.  What does \u003cem>in transit\u003c/em> mean, and who is usually \u003cem>liable\u003c/em> for damage there?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Report the damage in one sentence containing exactly two numbers.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  What is the actual request, and why is it not “replace the flasks”?\u003c/p>\u003cp>b.  The writer exonerates the reader in the second paragraph. What does that buy in the third?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “The outer box \u003cem>had been crushed\u003c/em>”. Why the past perfect?\u003c/p>\u003cp>b.  Why \u003cem>without anyone here being out of pocket\u003c/em> rather than \u003cem>so I get my money back\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  A statement of fact in writing. They cannot replace the glassware and did not break it; what they can do is confirm what the box looked like, which is the only thing the supplier needs.\u003c/p>\u003cp>b.  Because the signature is what the supplier is relying on to refuse. Undo its effect and the claim succeeds; argue about the breakage and you are arguing with the wrong party.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Two of six\u003c/strong>. It is checkable, it shows you counted, and it tells the reader the scale without an adjective they can discount.\u003c/p>\u003cp>b.  \u003cstrong>In transit\u003c/strong> means while being carried. The carrier is normally liable — which is exactly why a signature saying “good condition” is so damaging.\u003c/p>","P3":"\u003cp>Model: \u003cem>Two of the six volumetric flasks were broken, and the outer box had been crushed along one side.\u003c/em>\u003c/p>","F1":"\u003cp>a.  A written confirmation that the packaging was visibly damaged. It is the smallest thing that solves the problem, it costs the reader two minutes, and it is entirely within their power — three properties that make a request likely to be granted.\u003c/p>\u003cp>b.  It removes the reader’s need to defend themselves, so by the time the request arrives they are a witness rather than a suspect. Witnesses help; suspects consult their manager.\u003c/p>","F2":"\u003cp>a.  The crushing happened before the arrival that the sentence is anchored at. The past perfect marks it as prior — which is the whole argument that it did not happen on campus.\u003c/p>\u003cp>b.  It widens the harm from you to the institution and avoids sounding like a personal grievance. It also quietly reminds the reader that the money is the university’s, which is the fact most likely to move an internal office.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It attacks the only person who can help.\u003c/strong> “very careless” and “your mistake” make the post room a defendant, so the natural reply is a denial rather than a confirmation.\u003c/p>\u003cp>2.  \u003cstrong>It asks for the impossible.\u003c/strong> The post room cannot arrange a replacement with a third-party supplier. The one thing they could supply — a statement about the packaging — is never requested, so the third bullet fails.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> No order reference, no date, no count of the damage, and “immediately” as an instruction.\u003c/p>"},"model":["Dear Post Room,","A parcel for the Chemistry teaching lab (order GL-2207) was signed for on 11 May. The outer box had been crushed along one side, and two of the six volumetric flasks inside were broken.","I realise the damage almost certainly happened in transit rather than with you. The difficulty is that the delivery was signed for as received in good condition, and the supplier is declining to replace the flasks on that basis.","Would it be possible for you to confirm in writing that the outer packaging was visibly damaged when it arrived? That is all the supplier has asked for, and it would let me claim the replacement without anyone here being out of pocket.","Thank you very much.","Best wishes,","Dr Farida Hassan — Chemistry"],"model_html":"\u003cp>Dear Post Room,\u003c/p>\u003cp>A parcel for the Chemistry teaching lab (order GL-2207) was signed for on 11 May. The outer box had been crushed along one side, and two of the six volumetric flasks inside were broken.\u003c/p>\u003cp>I realise the damage almost certainly happened in transit rather than with you. The difficulty is that the delivery was signed for as received in good condition, and the supplier is declining to replace the flasks on that basis.\u003c/p>\u003cp>Would it be possible for you to confirm in writing that the outer packaging was visibly damaged when it arrived? That is all the supplier has asked for, and it would let me claim the replacement without anyone here being out of pocket.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Dr Farida Hassan — Chemistry\u003c/p>","model_band":5,"degraded":["Dear Sir, Your post room signed for a parcel of broken glassware without checking it, which is very careless. Now the supplier refuses to replace the items and my department has lost money because of your mistake. Please take responsibility and arrange the replacement immediately.","Dr Hassan"],"degraded_html":"\u003cp>Dear Sir, Your post room signed for a parcel of broken glassware without checking it, which is very careless. Now the supplier refuses to replace the items and my department has lost money because of your mistake. Please take responsibility and arrange the replacement immediately.\u003c/p>\u003cp>Dr Hassan\u003c/p>","degraded_band":3,"model_words":130,"fault_list":{"tag":"F3","faults":["It attacks the only person who can help. “very careless” and “your mistake” make the post room a defendant, so the natural reply is a denial rather than a confirmation.","It asks for the impossible. The post room cannot arrange a replacement with a third-party supplier. The one thing they could supply — a statement about the packaging — is never requested, so the third bullet fails.","Language. No order reference, no date, no count of the damage, and “immediately” as an instruction."],"html":["\u003cp>1.  \u003cstrong>It attacks the only person who can help.\u003c/strong> “very careless” and “your mistake” make the post room a defendant, so the natural reply is a denial rather than a confirmation.\u003c/p>","\u003cp>2.  \u003cstrong>It asks for the impossible.\u003c/strong> The post room cannot arrange a replacement with a third-party supplier. The one thing they could supply — a statement about the packaging — is never requested, so the third bullet fails.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> No order reference, no date, no count of the damage, and “immediately” as an instruction.\u003c/p>"]},"scenario":"\u003cp>A parcel of lab glassware you ordered arrived at the post room in a crushed box. Two of six items are broken. The post room signed for it as received in good condition.\u003c/p>","bullets":["Say what arrived and in what state.","Say who signed for it.","Say what you want done."],"header":[["To:","postroom@northgate.ac.uk"],["Subject:","Damaged delivery signed for 11 May — order GL-2207"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The final sentence is about the seventeenth century in general and contributes nothing to the question; “both partly right” is the whole of the engagement with either speaker.","correct":false},{"text":"It refuses to rank, which is what the prompt asks for, and “impossible to separate them” is asserted rather than argued.","correct":false},{"text":"Language. No order reference, no date, no count of the damage, and “immediately” as an instruction.","correct":true},{"text":"It asks for the impossible. The post room cannot arrange a replacement with a third-party supplier. The one thing they could supply — a statement about the packaging — is never requested, so the third bullet fails.","correct":true},{"text":"It attacks the only person who can help. “very careless” and “your mistake” make the post room a defendant, so the natural reply is a denial rather than a confirmation.","correct":true},{"text":"Language: “their own life and their own body” (lives, bodies), “choose consciously” (make an informed choice), and “a question of balance” announces a conclusion the response never reaches.","correct":false}],"key_html":"F3"}};</script>
