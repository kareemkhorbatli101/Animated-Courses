<script>window.ITEM={"kind":"exercise","id":"AD 068","slug":"ad-068","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Literature · agree / disagree","payload":{"Strategy":"argue from what the text does rather than what it means","Grammar":"present tense for textual description","Vocabulary":"canon, close reading, context, intention","Convention":"arguing about how a text should be read"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Rosa’s example is chosen carefully. Why satire?\u003c/p>\u003cp>b.  Is Theo committed to rejecting all external information?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is close reading, and what is the canon?\u003c/p>\u003cp>b.  Distinguish an author’s intention from a work’s meaning.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence that says what context is for.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response splits context into two uses. What are they?\u003c/p>\u003cp>b.  Why does it say a reader without the target reads \"a different text\" rather than a worse one?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"satire depends on a target\" — why is the whole response written in the present tense?\u003c/p>\u003cp>b.  \"We need the history to read the sentence and the sentence to judge the book\" — what does the symmetry accomplish?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because satire has a referent outside itself. It is the clearest case where missing the context produces not a thinner reading but a wrong one, so it is hard for Theo to absorb.\u003c/p>\u003cp>b.  No. He is rejecting intention as authority over meaning, which is compatible with using historical information to establish what words denoted. His position only looks extreme if those are run together.\u003c/p>","P2":"\u003cp>a.  Close reading is detailed attention to the text’s own language; the canon is the body of works a tradition treats as central.\u003c/p>\u003cp>b.  Intention is what the author aimed to do; meaning is what the work supports. They can diverge, and the divergence is itself a critical subject.\u003c/p>","P3":"\u003cp>Model: \"Context tells us what the words meant; it does not tell us what the work achieves.\"\u003c/p>","F1":"\u003cp>a.  Decoding — recovering what the words denoted to their first readers — and adjudication, using the author’s intentions to settle what the work means. The first is necessary, the second is what Theo rightly rejects.\u003c/p>\u003cp>b.  Because \"worse\" implies the same object imperfectly grasped, while a satire read straight is a different object altogether. That is what makes Rosa’s case decisive rather than a matter of degree.\u003c/p>","F2":"\u003cp>a.  Because claims about what a text does are treated as standing facts about the work rather than as historical events. The present tense is the convention that marks textual description, and using it consistently keeps description separate from the historical claims around it.\u003c/p>\u003cp>b.  It assigns each side one half of the process in a single balanced sentence, so the resolution is audible in the structure. It also stops the conclusion sounding like a concession to either speaker.\u003c/p>","F3":"\u003cp>1.  Theo’s actual argument — that intention is not authority — is acknowledged and then set aside with \"but context is still very important\", which does not answer it.\u003c/p>\u003cp>2.  \"Impossible to understand literature without knowing the historical background\" is far stronger than Rosa’s claim and is not defended; the Dickens anecdote shows only that context can help.\u003c/p>\u003cp>3.  No distinction is drawn between context as decoding and context as authority, so the response never reaches the point at issue.\u003c/p>"},"model":["Rosa wins the particular case and Theo is right about the general principle, and the two are reconciled once we ask what context supplies.","Her example is well chosen because satire depends on a target. A reader who does not know what is being mocked does not read the satire weakly; they read a different text, often a straight one. Context here is not interpretation but decoding — it tells you what the words meant, in the way a dictionary does.","That is quite different from what Theo is refusing. His target is the move from \"the author said she meant X\" to \"the work means X\", and he is right to refuse it. An author’s account of her own book is evidence about her intentions and not about what she produced; the gap between the two is where most interesting criticism happens.","So I would say context is admissible as evidence of what the words did at the time, and inadmissible as a verdict on what the work achieves. We need the history to read the sentence and the sentence to judge the book, and confusing those two uses is what makes this argument feel unresolvable."],"model_html":"\u003cp>Rosa wins the particular case and Theo is right about the general principle, and the two are reconciled once we ask what context supplies.\u003c/p>\u003cp>Her example is well chosen because satire depends on a target. A reader who does not know what is being mocked does not read the satire weakly; they read a different text, often a straight one. Context here is not interpretation but decoding — it tells you what the words meant, in the way a dictionary does.\u003c/p>\u003cp>That is quite different from what Theo is refusing. His target is the move from \"the author said she meant X\" to \"the work means X\", and he is right to refuse it. An author’s account of her own book is evidence about her intentions and not about what she produced; the gap between the two is where most interesting criticism happens.\u003c/p>\u003cp>So I would say context is admissible as evidence of what the words did at the time, and inadmissible as a verdict on what the work achieves. We need the history to read the sentence and the sentence to judge the book, and confusing those two uses is what makes this argument feel unresolvable.\u003c/p>","model_band":5,"degraded":["I agree with Rosa because I think it is impossible to understand literature without knowing the historical background of the period in which it was written. Every writer is influenced by their society and their personal experiences, so if we ignore this we will certainly misunderstand the text. For example when I studied Dickens at school our teacher explained the social conditions of Victorian England and this helped us a lot. Theo is right that authors can be wrong about their own work but context is still very important."],"degraded_html":"\u003cp>I agree with Rosa because I think it is impossible to understand literature without knowing the historical background of the period in which it was written. Every writer is influenced by their society and their personal experiences, so if we ignore this we will certainly misunderstand the text. For example when I studied Dickens at school our teacher explained the social conditions of Victorian England and this helped us a lot. Theo is right that authors can be wrong about their own work but context is still very important.\u003c/p>","degraded_band":3,"model_words":196,"fault_list":{"tag":"F3","faults":["Theo’s actual argument — that intention is not authority — is acknowledged and then set aside with \"but context is still very important\", which does not answer it.","\"Impossible to understand literature without knowing the historical background\" is far stronger than Rosa’s claim and is not defended; the Dickens anecdote shows only that context can help.","No distinction is drawn between context as decoding and context as authority, so the response never reaches the point at issue."],"html":["\u003cp>1.  Theo’s actual argument — that intention is not authority — is acknowledged and then set aside with \"but context is still very important\", which does not answer it.\u003c/p>","\u003cp>2.  \"Impossible to understand literature without knowing the historical background\" is far stronger than Rosa’s claim and is not defended; the Dickens anecdote shows only that context can help.\u003c/p>","\u003cp>3.  No distinction is drawn between context as decoding and context as authority, so the response never reaches the point at issue.\u003c/p>"]},"prof_name":"Professor Haddad","professor":"\u003cp>Some critics hold that a work should be read on its own terms, without reference to the author’s life or intentions. Others argue that this makes criticism a parlour game and that historical context is essential to understanding. Where do you stand?\u003c/p>","students":[["Theo","The text is what we have. An author’s stated intention is just another reader’s opinion, and often a worse one — writers are notoriously bad at saying what they made."],["Rosa","That works for lyric poems and nothing else. You cannot read a satire without knowing what it satirises. Context is not optional decoration, it is sometimes the entire meaning."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“There was a mix-up with the numbers” is agentless where responsibility was required, and nothing is said about preventing it. There is also a comma splice in the opening sentence.","correct":false},{"text":"No distinction is drawn between context as decoding and context as authority, so the response never reaches the point at issue.","correct":true},{"text":"“Impossible to understand literature without knowing the historical background” is far stronger than Rosa’s claim and is not defended; the Dickens anecdote shows only that context can help.","correct":true},{"text":"It pre-emptively disclaims responsibility (“not my fault”) and then reassures the reader on her own subject — “I am sure it will be fine” is a judgement about the group’s risk that the writer is not the one carrying.","correct":false},{"text":"Theo’s actual argument — that intention is not authority — is acknowledged and then set aside with “but context is still very important”, which does not answer it.","correct":true},{"text":"Register: institutional throughout (“we encourage”, “a valuable opportunity”, “we look forward to seeing you there”), which signals an official activity rather than a room where people sit and work.","correct":false}],"key_html":"F3"}};</script>
