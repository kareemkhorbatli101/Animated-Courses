<script>window.ITEM={"kind":"exercise","id":"EM 031","slug":"em-031","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"refuse, then repair - never let a refusal be the last thing you say","Grammar":"the unreal conditional as a politeness device","Vocabulary":"softening adverbials; collocations for rooms and bookings","Convention":"how much apology is too much, and whose fault it is"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Who will read this email, and what is your relationship to them?\u003c/p>\u003cp>b.  Which of the three required points carries a risk of sounding rude, and why?\u003c/p>\u003cp>c.  The bullets are given in a particular order. Is that order an accident?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Put these in order from most casual to most formal, then choose the two that belong in this email:\u003c/p>\u003cpre class=\"mono\">(i)   Sunday’s no good for us.\n(ii)  Sunday is unfortunately not workable for us.\n(iii) Sunday does not work for us.\n(iv)  Sunday is impossible.\u003c/pre>\u003cp>b.  Which verbs collocate with a room?   book  ·  reserve  ·  order  ·  hire\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rewrite this so that it could be sent to a stranger who has done nothing wrong. Keep it under 25 words.\u003c/p>\u003cpre class=\"mono\">Sunday is no good. Give us another room on Saturday.\u003c/pre>\u003cp class=\"note\">Write your version down before you look at the key. You will not notice what the model does unless you have first tried to do it yourself.\u003c/p>"},{"tag":"P4","title":"Commit to a plan","html":"\u003cp>Set a timer for 7 minutes and write the whole email now. Before you start, write three words in the margin — one for the job each paragraph will do.\u003c/p>"},{"tag":"P5","title":"Predict the pitfall","html":"\u003cp>Three candidates opened their email like this. One scores well and two lose marks. Which is which, and what exactly is wrong?\u003c/p>\u003cpre class=\"mono\">(A) I am writing to complain about the double-booking of the Rehearsal Hall.\n(B) Thank you so much for your email. I am extremely sorry to trouble you\n    and I do apologise for any inconvenience caused, and I hope you will\n    forgive me for writing to you again about this matter...\n(C) Thank you for letting me know so quickly, and for offering us the\n    Sunday slot.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Give each paragraph a one-word job description.\u003c/p>\u003cp>b.  Which sentence discharges which of the three required bullets?\u003c/p>\u003cp>c.  One sentence does work that no bullet asked for. Find it. Why does it earn marks instead of wasting words?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  Find the unreal conditional. Why “if any other space \u003cem>were\u003c/em> free … we \u003cem>could\u003c/em> go ahead” rather than “if any other space \u003cem>is\u003c/em> free … we \u003cem>can\u003c/em> go ahead”?\u003c/p>\u003cp>b.  Rewrite “would it be possible to keep our Saturday booking” as a direct question. What changes — not in meaning, but in force?\u003c/p>\u003cp>c.  “Moving the session to Sunday would mean cancelling it” — what is the subject of \u003cem>would mean\u003c/em>? Why is a gerund useful to you here, in an email where somebody has made a mistake?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cstrong>at\u003c/strong> short notice — why not \u003cstrong>in\u003c/strong> short notice?\u003c/p>\u003cp>b.  Why “a seminar room … would \u003cem>serve\u003c/em> us perfectly well”, rather than \u003cem>work\u003c/em> or \u003cem>suit\u003c/em>?\u003c/p>\u003cp>c.  What does \u003cem>Failing that\u003c/em> do in two words that a plainer phrase needs more words to do?\u003c/p>\u003cp>d.  Complete: the hall was double-________ ; the two bookings ________.\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Below is another answer to the same task. Using the official band descriptors at the front of this book, name the three things that hold it at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>The library has cancelled your group’s study-room booking for the evening before a deadline, and offered you a morning slot instead. In no more than 60 words write only the middle of the email: one sentence that declines with a reason, and one unreal conditional that proposes a way round it.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  \u003cstrong>An administrative colleague you have never met\u003c/strong> — not a friend, and not somebody you need to flatter. That fixes the register as neutral-professional: \u003cem>Dear Bookings Office\u003c/em> is right; \u003cem>Hi there\u003c/em> and \u003cem>Dear Sir or Madam\u003c/em> are respectively too warm and too distant for a named office.\u003c/p>\u003cp>b.  \u003cstrong>The second\u003c/strong>. Saying “no” to something that was offered as a favour is the one moment in this email where you can give offence. Everything the examiner calls \u003cem>social conventions\u003c/em> is really about how you handle that sentence.\u003c/p>\u003cp>c.  \u003cstrong>No.\u003c/strong> Thanks → problem → solution puts the refusal between two positives. You may reorder the bullets, but if you move the refusal to the end the email finishes on a negative and reads as a complaint.\u003c/p>","P2":"\u003cp>a.  (i) &lt; (iii) &lt; (ii).  Use \u003cstrong>(ii)\u003c/strong> or \u003cstrong>(iii)\u003c/strong>. Note the trap: \u003cstrong>(iv)\u003c/strong> is formal in \u003cem>shape\u003c/em> but absolute in \u003cem>force\u003c/em> — “impossible” shuts the door and invites no negotiation, which is the opposite of what you want from an office that has just offered to help.\u003c/p>\u003cp>b.  \u003cstrong>book\u003c/strong> and \u003cstrong>reserve\u003c/strong> both collocate with \u003cem>a room\u003c/em>. \u003cem>hire\u003c/em> implies you are paying for a venue; \u003cem>order\u003c/em> does not go with rooms at all. Collocation is not logic — it is memorised in chunks.\u003c/p>","P3":"\u003cp>Many rewrites work. The one the model chooses is the \u003cstrong>unreal conditional\u003c/strong>: “If another room were free on Saturday afternoon, we could keep the session as planned.”\u003c/p>\u003cp>Look at what that does. It turns a \u003cem>request aimed at a person\u003c/em> into a \u003cem>hypothetical state of the world\u003c/em>. Nobody is being told to do anything, so nobody has to defend themselves.\u003c/p>","P4":"\u003cp>No single answer. Score your own draft against three questions:\u003c/p>\u003cul>\u003cli>Did you thank them for something specific, or just say “thank you”?\u003c/li>\u003cli>Did you give a reason, or only a refusal? A refusal without a reason reads as a preference.\u003c/li>\u003cli>Did you propose something somebody could actually act on, or only ask for help?\u003c/li>\u003c/ul>","P5":"\u003cp>\u003cstrong>(C) is the strong one.\u003c/strong>\u003c/p>\u003cp>(A) \u003cstrong>misreads the task.\u003c/strong> The office is not the offender here — it has spotted a problem and offered a remedy. Opening with “complain” picks a fight with somebody who is trying to help, and the rubric scores exactly this.\u003c/p>\u003cp>(B) \u003cstrong>over-apologises.\u003c/strong> Thirty-five words before any content, apologising for a mistake that is not yours. In a 7-minute task that is a quarter of your time spent sounding unconfident.\u003c/p>\u003cp>(C) thanks them for \u003cem>two specific things\u003c/em> — the speed and the offer. Specific thanks reads as sincere; generic thanks reads as a formula.\u003c/p>","F1":"\u003cp>a.  Thank · Refuse · Repair · Offer.\u003c/p>\u003cp>b.  Bullet 1 → sentence 1. Bullet 2 → “Unfortunately Sunday will not work … rather than postponing it.” Bullet 3 → the whole of paragraph three, which contains \u003cstrong>two\u003c/strong> proposals, not one.\u003c/p>\u003cp>c.  “I am happy to come by the office …”. No bullet asked for it. It earns marks because the band-5 descriptor rewards \u003cem>elaboration that effectively supports the communicative purpose\u003c/em> — and this sentence lowers the cost to the reader of saying yes. That is elaboration doing a job, which is quite different from padding.\u003c/p>","F2":"\u003cp>a.  The real conditional (“if … is free”) presupposes that a room \u003cem>probably\u003c/em> is free, so it presses for a yes. The unreal form presents the possibility as remote, which leaves the reader genuinely free to say no — and it is that freedom which makes it polite. Politeness in English is largely the grammar of giving people an exit.\u003c/p>\u003cp>b.  Direct: “Can you keep our Saturday booking and give the other group Sunday?” That is an \u003cem>instruction addressed to the reader\u003c/em>. “Would it be possible to …” asks about the \u003cem>world\u003c/em>, not about their willingness, so refusing costs them nothing.\u003c/p>\u003cp>c.  The subject is the gerund phrase \u003cstrong>moving the session to Sunday\u003c/strong>. A gerund lets you make the \u003cem>event\u003c/em> the subject and keep a person out of the sentence: compare “\u003cem>you would make us cancel\u003c/em>”, which assigns blame. When somebody has made a mistake, grammar that avoids naming an agent is worth a great deal.\u003c/p>","F3":"\u003cp>a.  \u003cstrong>at short notice\u003c/strong> (British) or \u003cstrong>on short notice\u003c/strong> (American). Neither preposition is derivable from meaning — fixed phrases have to be stored whole.\u003c/p>\u003cp>b.  \u003cstrong>serve\u003c/strong> takes a person as object (\u003cem>serve us\u003c/em>) and means “be adequate for the purpose”. It concedes the room is not ideal while confirming it is enough — both at once. \u003cem>work\u003c/em> is correct but flat; \u003cem>suit\u003c/em> suggests preference rather than sufficiency. This is what the band-5 descriptor means by \u003cem>precise, idiomatic word choice\u003c/em>.\u003c/p>\u003cp>c.  \u003cstrong>Failing that\u003c/strong> = “if that is not possible”, and it marks what follows as a \u003cem>ranked fallback\u003c/em>. In two words it tells the reader you have thought in order of preference. “If that is not possible” needs five words; “Otherwise” is shorter but vaguer.\u003c/p>\u003cp>d.  double-\u003cstrong>booked\u003c/strong> ; the two bookings \u003cstrong>clash\u003c/strong>.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>Social conventions.\u003c/strong> “But” immediately after the thanks cancels the thanks, and “please give us the hall … like we booked it before” is a demand dressed as a request. The band-5 line asks for \u003cem>consistent use of appropriate social conventions\u003c/em>.\u003c/p>\u003cp>2.  \u003cstrong>The third bullet is never addressed.\u003c/strong> No alternative is proposed at all — the writer only repeats the original demand. Band 3 is worded \u003cem>elaboration that partially supports the communicative purpose\u003c/em>, and this is what that looks like.\u003c/p>\u003cp>3.  \u003cstrong>Consequential language errors.\u003c/strong> “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped \u003cem>that\u003c/em> response was a \u003cem>verb-tense\u003c/em> failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are.\u003c/p>","F5":"\u003cp>A model middle:\u003c/p>\u003cp>\u003cem>“Unfortunately the morning slot will not help us, as two of the group are in labs until one o’clock and the work has to be finished that day. If a room were free after six, even for an hour, we could still get the draft done.”\u003c/em>\u003c/p>\u003cp>Check yours for three things: an \u003cstrong>external\u003c/strong> reason rather than a preference; an unreal conditional rather than a request; and a \u003cstrong>specific\u003c/strong> alternative (“after six”), because vague alternatives give the reader nothing to say yes to.\u003c/p>"},"model":["Dear Bookings Office,","Thank you for letting me know so quickly, and for offering us the Sunday slot — I appreciate you finding an alternative at such short notice.","Unfortunately Sunday will not work for us. The workshop is being led by a visiting director who is travelling down for the day, and Saturday 14 March is the only date she is available; moving the session to Sunday would mean cancelling it altogether rather than postponing it.","If any other space were free on Saturday afternoon, we could go ahead as planned — the group is small, so a seminar room with the chairs cleared would serve us perfectly well. Failing that, would it be possible to keep our Saturday booking and offer the other group the Sunday slot instead?","I am happy to come by the office and sort this out in person if that is easier.","Best wishes,","Layla Haddad — Secretary, Northgate Drama Society"],"model_html":"\u003cp>Dear Bookings Office,\u003c/p>\u003cp>Thank you for letting me know so quickly, and for offering us the Sunday slot — I appreciate you finding an alternative at such short notice.\u003c/p>\u003cp>Unfortunately Sunday will not work for us. The workshop is being led by a visiting director who is travelling down for the day, and Saturday 14 March is the only date she is available; moving the session to Sunday would mean cancelling it altogether rather than postponing it.\u003c/p>\u003cp>If any other space were free on Saturday afternoon, we could go ahead as planned — the group is small, so a seminar room with the chairs cleared would serve us perfectly well. Failing that, would it be possible to keep our Saturday booking and offer the other group the Sunday slot instead?\u003c/p>\u003cp>I am happy to come by the office and sort this out in person if that is easier.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Layla Haddad — Secretary, Northgate Drama Society\u003c/p>","model_band":5,"degraded":["Dear Sir,","Thank you for your email. But Sunday is impossible for us because our director cannot come in this day. He is very busy person and we are already prepare everything for Saturday. So please give us the hall in Saturday like we booked it before. We don’t want to cancel the workshop.","Thank you. Best regards."],"degraded_html":"\u003cp>Dear Sir,\u003c/p>\u003cp>Thank you for your email. But Sunday is impossible for us because our director cannot come in this day. He is very busy person and we are already prepare everything for Saturday. So please give us the hall in Saturday like we booked it before. We don’t want to cancel the workshop.\u003c/p>\u003cp>Thank you. Best regards.\u003c/p>","degraded_band":3,"model_words":154,"fault_list":{"tag":"F4","faults":["Social conventions. “But” immediately after the thanks cancels the thanks, and “please give us the hall … like we booked it before” is a demand dressed as a request. The band-5 line asks for consistent use of appropriate social conventions.","The third bullet is never addressed. No alternative is proposed at all — the writer only repeats the original demand. Band 3 is worded elaboration that partially supports the communicative purpose, and this is what that looks like.","Consequential language errors. “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped that response was a verb-tense failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are."],"html":["\u003cp>1.  \u003cstrong>Social conventions.\u003c/strong> “But” immediately after the thanks cancels the thanks, and “please give us the hall … like we booked it before” is a demand dressed as a request. The band-5 line asks for \u003cem>consistent use of appropriate social conventions\u003c/em>.\u003c/p>","\u003cp>2.  \u003cstrong>The third bullet is never addressed.\u003c/strong> No alternative is proposed at all — the writer only repeats the original demand. Band 3 is worded \u003cem>elaboration that partially supports the communicative purpose\u003c/em>, and this is what that looks like.\u003c/p>","\u003cp>3.  \u003cstrong>Consequential language errors.\u003c/strong> “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped \u003cem>that\u003c/em> response was a \u003cem>verb-tense\u003c/em> failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are.\u003c/p>"]},"scenario":"\u003cp>Your student drama society reserved the Rehearsal Hall for Saturday 14 March for a workshop with a visiting director. The bookings office has just emailed to say that the hall was double-booked, and has offered you the Sunday instead. Your visiting director can only travel on the Saturday.\u003c/p>","bullets":["Thank the office for offering an alternative date.","Explain why Sunday will not work for your society.","Propose a solution that could still allow the workshop to go ahead."],"header":[["To:","bookings@northgate.ac.uk"],["Subject:","Rehearsal Hall booking, Saturday 14 March"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Social conventions. “But” immediately after the thanks cancels the thanks, and “please give us the hall … like we booked it before” is a demand dressed as a request. The band-5 line asks for consistent use of appropriate social conventions.","correct":true},{"text":"“Students should choose based on what is right for them personally” is advice to individuals where the question is about an institutional measure, so the response never addresses the comparison it was asked to make.","correct":false},{"text":"“We should not criticise journalists for doing their job” declines the evaluation the prompt requests.","correct":false},{"text":"Consequential language errors. “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped that response was a verb-tense failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are.","correct":true},{"text":"The third bullet is never addressed. No alternative is proposed at all — the writer only repeats the original demand. Band 3 is worded elaboration that partially supports the communicative purpose, and this is what that looks like.","correct":true},{"text":"Language: “the big multinationals”, “the small subcontractors”, “the products they buy” over-articled; “nobody controls” should be “nobody oversees”; “exploitation often happens” is asserted without any source.","correct":false}],"key_html":"F4"}};</script>
