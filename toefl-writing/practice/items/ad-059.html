<script>window.ITEM={"kind":"exercise","id":"AD 059","slug":"ad-059","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business · policy choice","payload":{"Strategy":"choose by asking which option is reversible","Grammar":"concessive although / while clauses","Vocabulary":"pilot, roll-out, sunk cost, attrition","Convention":"choosing between a pilot and a full roll-out"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Priya is making a methodological objection, not a political one. State it precisely.\u003c/p>\u003cp>b.  The prompt says full adoption \"cannot easily be reversed\". Is that true, and does it matter?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is attrition, and what is a sunk cost?\u003c/p>\u003cp>b.  Distinguish a pilot from a phased roll-out.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that answers Priya’s objection rather than ignoring it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Priya’s objection and still chooses Yuki’s option. What makes that coherent?\u003c/p>\u003cp>b.  \"and I would say so openly to the division\" — why does this matter methodologically?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Although a pilot cannot measure sustained productivity, it can measure ...\" — why the concessive, and why in that order?\u003c/p>\u003cp>b.  \"a withdrawn benefit does more damage than a benefit never granted\" — what kind of claim is this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the pilot’s conditions change the behaviour being measured, so the result does not generalise to the permanent policy. It is an observation effect, not a claim that pilots are unfair.\u003c/p>\u003cp>b.  Partly. It could be withdrawn, but withdrawing a benefit already granted imposes costs — morale, attrition, reputation — that make it practically very difficult. That asymmetry is what makes reversibility the decisive consideration.\u003c/p>","P2":"\u003cp>a.  Attrition is the rate at which staff leave; a sunk cost is an expenditure already incurred, which should not influence a forward-looking decision but usually does.\u003c/p>\u003cp>b.  A pilot tests whether to proceed and may be abandoned; a phased roll-out has already decided to proceed and is sequencing the implementation.\u003c/p>","P3":"\u003cp>Model: \"Pilot it, but measure feasibility rather than productivity, because that is the part observation does not distort.\"\u003c/p>","F1":"\u003cp>a.  Because her objection defeats one use of a pilot, not pilots as such. Once the research question is narrowed to operational feasibility, the observation effect she describes no longer threatens the finding, so the method survives with a smaller claim attached.\u003c/p>\u003cp>b.  Because telling the division that the pilot is not assessing their output removes the incentive Priya identified. The observation effect depends on what people believe is being judged, so changing that belief is part of the design rather than a courtesy.\u003c/p>","F2":"\u003cp>a.  The concessive puts the conceded point first, so the response is seen to accept Priya’s objection before limiting it. Reversing the order would read as a rebuttal with a grudging qualifier, which is a weaker position from which to then adopt her opponent’s option.\u003c/p>\u003cp>b.  An empirical claim about how losses are experienced relative to gains, used here to establish that the two failure modes are not symmetric. It is the load-bearing premise of the final decision, which is why it is stated plainly rather than assumed.\u003c/p>","F3":"\u003cp>1.  Priya’s objection is acknowledged and then answered with \"most employees would be honest\", which misreads it — the effect she describes needs no dishonesty.\u003c/p>\u003cp>2.  \"Managers can monitor the results carefully to make sure the data is accurate\" proposes more observation as the cure for an observation effect, which makes it worse.\u003c/p>\u003cp>3.  \"A four-day week is a great idea in general\" and \"many companies have tried it with good results\" answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure.\u003c/p>"},"model":["Priya has found the real flaw, and the response is not to drop the pilot but to change what it measures.","Her objection is sound. A division that knows its four-day week is conditional on good numbers will produce them, and the mechanism is obvious: people compress, skip breaks and answer email on the fifth day. Six months of that says nothing about the steady state. Yuki’s cheap evidence is cheap partly because it is not evidence.","But the conclusion does not follow. Although a pilot cannot measure sustained productivity, it can measure things that observation does not contaminate — whether coverage gaps appear on Fridays, whether clients notice, whether the scheduling system can actually handle it. Those are the operational questions that sink the policy in practice, and they are answerable precisely because they do not depend on anyone’s goodwill.","So I would pilot, with the question narrowed to feasibility rather than performance, and I would say so openly to the division. What decides it is reversibility: a pilot that fails costs a division six awkward months, while a full adoption that fails has to be withdrawn from everyone, and a withdrawn benefit does more damage than a benefit never granted. When the downside is asymmetric, the reversible option is worth a weaker test."],"model_html":"\u003cp>Priya has found the real flaw, and the response is not to drop the pilot but to change what it measures.\u003c/p>\u003cp>Her objection is sound. A division that knows its four-day week is conditional on good numbers will produce them, and the mechanism is obvious: people compress, skip breaks and answer email on the fifth day. Six months of that says nothing about the steady state. Yuki’s cheap evidence is cheap partly because it is not evidence.\u003c/p>\u003cp>But the conclusion does not follow. Although a pilot cannot measure sustained productivity, it can measure things that observation does not contaminate — whether coverage gaps appear on Fridays, whether clients notice, whether the scheduling system can actually handle it. Those are the operational questions that sink the policy in practice, and they are answerable precisely because they do not depend on anyone’s goodwill.\u003c/p>\u003cp>So I would pilot, with the question narrowed to feasibility rather than performance, and I would say so openly to the division. What decides it is reversibility: a pilot that fails costs a division six awkward months, while a full adoption that fails has to be withdrawn from everyone, and a withdrawn benefit does more damage than a benefit never granted. When the downside is asymmetric, the reversible option is worth a weaker test.\u003c/p>","model_band":5,"degraded":["I think the company should pilot the four-day week first because it is much safer to test a big change before applying it everywhere. If the pilot is successful then they can expand it, and if not they have not wasted money. Priya makes an interesting point about people being watched but I think most employees would be honest and anyway managers can monitor the results carefully to make sure the data is accurate. A four-day week is a great idea in general and many companies have tried it with good results."],"degraded_html":"\u003cp>I think the company should pilot the four-day week first because it is much safer to test a big change before applying it everywhere. If the pilot is successful then they can expand it, and if not they have not wasted money. Priya makes an interesting point about people being watched but I think most employees would be honest and anyway managers can monitor the results carefully to make sure the data is accurate. A four-day week is a great idea in general and many companies have tried it with good results.\u003c/p>","degraded_band":3,"model_words":215,"fault_list":{"tag":"F3","faults":["Priya’s objection is acknowledged and then answered with \"most employees would be honest\", which misreads it — the effect she describes needs no dishonesty.","\"Managers can monitor the results carefully to make sure the data is accurate\" proposes more observation as the cure for an observation effect, which makes it worse.","\"A four-day week is a great idea in general\" and \"many companies have tried it with good results\" answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure."],"html":["\u003cp>1.  Priya’s objection is acknowledged and then answered with \"most employees would be honest\", which misreads it — the effect she describes needs no dishonesty.\u003c/p>","\u003cp>2.  \"Managers can monitor the results carefully to make sure the data is accurate\" proposes more observation as the cure for an observation effect, which makes it worse.\u003c/p>","\u003cp>3.  \"A four-day week is a great idea in general\" and \"many companies have tried it with good results\" answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>A company considering a four-day week can pilot it in one division for six months or adopt it across the company at once. A pilot generates evidence but signals that the change may be withdrawn. A full adoption commits everyone but cannot easily be reversed. Which approach is better?\u003c/p>","students":[["Yuki","Pilot it. You do not restructure an entire company on a hypothesis. Six months of data on one division costs almost nothing and tells you whether the thing works."],["Priya","A pilot of a four-day week measures the wrong thing. People in the pilot division know they are being watched and that the policy might be taken away, so they overwork to protect it. You learn how people behave under observation, not how the policy performs."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language and register. “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”.","correct":false},{"text":"“Managers can monitor the results carefully to make sure the data is accurate” proposes more observation as the cure for an observation effect, which makes it worse.","correct":true},{"text":"“A four-day week is a great idea in general” and “many companies have tried it with good results” answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure.","correct":true},{"text":"“Sent twice, on 2 April and 11 April” and “I still have not received your signature” put the reader’s failure at the centre, which makes replying an admission.","correct":false},{"text":"“Hope you manage to find somebody else” leaves him with the whole problem, when the writer knows of someone looking for hours.","correct":false},{"text":"Priya’s objection is acknowledged and then answered with “most employees would be honest”, which misreads it — the effect she describes needs no dishonesty.","correct":true}],"key_html":"F3"}};</script>
