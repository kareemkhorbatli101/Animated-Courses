<script>window.ITEM={"kind":"exercise","id":"EM 079","slug":"em-079","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Permission request","payload":{"Strategy":"ask permission by removing the reasons to refuse","Grammar":"modals of permission and obligation","Vocabulary":"consent, attribution, embargo, redact","Convention":"asking permission to use someone else’s material"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  She already agreed to be interviewed. Why ask again?\u003c/p>\u003cp>b.  What is she actually being asked to risk?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to redact something, and what is an embargo?\u003c/p>\u003cp>b.  Distinguish consent from attribution.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask in one sentence that states exactly where the words will appear.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email tells her the dissertation will be public \"now or in twenty years\". Why volunteer that?\u003c/p>\u003cp>b.  Silence is treated as a refusal. Why is that the right default?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"That is the part I would want you to look at before agreeing\" — what does this sentence do for the consent?\u003c/p>\u003cp>b.  \"any of them is fine by me\" — why say this explicitly?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because she agreed to talk, not to be quoted at length in a permanently public document that names a third party. Consent to an interview is not consent to every use of it.\u003c/p>\u003cp>b.  Her relationship with the council officer she named, and her own position as a campaigner who has to keep dealing with that council. The risk is concrete and ongoing, not abstract.\u003c/p>","P2":"\u003cp>a.  To redact is to remove identifying or sensitive material before release; an embargo delays public access for a set period.\u003c/p>\u003cp>b.  Consent is her agreement to the use; attribution is whether her name is attached. She can consent and decline attribution, which is one of the options offered.\u003c/p>","P3":"\u003cp>Model: \"May I quote about 180 words in the dissertation, which will be in the library’s public catalogue indefinitely?\"\u003c/p>","F1":"\u003cp>a.  Because permanence is the part she is least likely to have considered, and consent given without it is not informed. Volunteering the inconvenient fact is what makes the agreement worth having.\u003c/p>\u003cp>b.  Because consent must be given, not merely not withheld. Treating silence as agreement would put the burden of refusing on her, and she may simply not have read the email.\u003c/p>","F2":"\u003cp>a.  It directs her attention to the specific risk — the named officer — rather than leaving her to assess 180 words of her own speech. Consent is only meaningful if she knows which part might cost her something.\u003c/p>\u003cp>b.  Because she will otherwise read the options as ranked, with anonymity a disappointment to the writer. Saying they are equally acceptable removes the social pressure to pick the one that helps the dissertation most.\u003c/p>","F3":"\u003cp>1.  Nothing is said about the library deposit, public catalogue or permanence, so the consent would not be informed. The second bullet fails.\u003c/p>\u003cp>2.  \"Otherwise I will assume it is fine to go ahead\" makes silence into consent, which is exactly backwards.\u003c/p>\u003cp>3.  The passage is not identified, the named third party is never mentioned, and \"I will not use your real name if you prefer\" is the only option offered; there is also a comma splice in the opening sentence.\u003c/p>"},"model":["Dear Ms Achebe,","Thank you again for the hour in March. I am writing to ask whether you are happy for me to quote you at some length in the finished dissertation, and to tell you what that would actually mean.","The dissertation will be deposited in the university library and listed in its public catalogue, which means anyone can read it, now or in twenty years. The passage I would most like to use is the one about the 2019 consultation — about 180 words — and it names the council officer you dealt with. That is the part I would want you to look at before agreeing.","You have four options and any of them is fine by me: quote with your name; quote as \"a campaigner\"; quote with the officer’s name removed; or not at all, in which case I will paraphrase the argument without quoting. I can also ask the library for a two-year embargo so it is not publicly readable until 2028.","I have attached the passage as I would use it, in context. There is no deadline pressure — if I have heard nothing by 1 May I will assume the answer is no and paraphrase.","Yours sincerely,","Lucia Barros"],"model_html":"\u003cp>Dear Ms Achebe,\u003c/p>\u003cp>Thank you again for the hour in March. I am writing to ask whether you are happy for me to quote you at some length in the finished dissertation, and to tell you what that would actually mean.\u003c/p>\u003cp>The dissertation will be deposited in the university library and listed in its public catalogue, which means anyone can read it, now or in twenty years. The passage I would most like to use is the one about the 2019 consultation — about 180 words — and it names the council officer you dealt with. That is the part I would want you to look at before agreeing.\u003c/p>\u003cp>You have four options and any of them is fine by me: quote with your name; quote as \"a campaigner\"; quote with the officer’s name removed; or not at all, in which case I will paraphrase the argument without quoting. I can also ask the library for a two-year embargo so it is not publicly readable until 2028.\u003c/p>\u003cp>I have attached the passage as I would use it, in context. There is no deadline pressure — if I have heard nothing by 1 May I will assume the answer is no and paraphrase.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Lucia Barros\u003c/p>","model_band":5,"degraded":["Dear Ms Achebe, Thank you so much again for agreeing to be interviewed for my dissertation, it was really interesting and helpful for my research. I am writing to ask if it is okay for me to quote what you said in my final dissertation. Of course I will not use your real name if you prefer. Please let me know if you have any concerns, otherwise I will assume it is fine to go ahead. Thank you again for your time and help!","Lucia"],"degraded_html":"\u003cp>Dear Ms Achebe, Thank you so much again for agreeing to be interviewed for my dissertation, it was really interesting and helpful for my research. I am writing to ask if it is okay for me to quote what you said in my final dissertation. Of course I will not use your real name if you prefer. Please let me know if you have any concerns, otherwise I will assume it is fine to go ahead. Thank you again for your time and help!\u003c/p>\u003cp>Lucia\u003c/p>","degraded_band":3,"model_words":204,"fault_list":{"tag":"F3","faults":["Nothing is said about the library deposit, public catalogue or permanence, so the consent would not be informed. The second bullet fails.","\"Otherwise I will assume it is fine to go ahead\" makes silence into consent, which is exactly backwards.","The passage is not identified, the named third party is never mentioned, and \"I will not use your real name if you prefer\" is the only option offered; there is also a comma splice in the opening sentence."],"html":["\u003cp>1.  Nothing is said about the library deposit, public catalogue or permanence, so the consent would not be informed. The second bullet fails.\u003c/p>","\u003cp>2.  \"Otherwise I will assume it is fine to go ahead\" makes silence into consent, which is exactly backwards.\u003c/p>","\u003cp>3.  The passage is not identified, the named third party is never mentioned, and \"I will not use your real name if you prefer\" is the only option offered; there is also a comma splice in the opening sentence.\u003c/p>"]},"scenario":"\u003cp>You want to quote a long passage from an interview you conducted with a local campaigner for your dissertation, which will be deposited in the university library and may be read by anyone.\u003c/p>","bullets":["Ask permission.","Explain what will happen to the words.","Offer a way to limit it."],"header":[["To:","m.achebe@riversidecampaign.org"],["Subject:","Your interview — permission to quote, and your options"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Otherwise I will assume it is fine to go ahead” makes silence into consent, which is exactly backwards.","correct":true},{"text":"Yusuf’s argument is acknowledged and then answered with “subsidies or simplified forms”, which is a gesture rather than a mechanism and leaves the fixed cost in place.","correct":false},{"text":"The passage is not identified, the named third party is never mentioned, and “I will not use your real name if you prefer” is the only option offered; there is also a comma splice in the opening sentence.","correct":true},{"text":"Nothing is said about the library deposit, public catalogue or permanence, so the consent would not be informed. The second bullet fails.","correct":true},{"text":"“They can hide evidence” is a serious claim made without qualification, and disclosure obligations go unmentioned. Language: “the lawyers”, “the truth”, “poor people who depend on public defenders” — and “not fair for” should be “unfair to”.","correct":false},{"text":"“All new technologies are unproven at first” does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.","correct":false}],"key_html":"F3"}};</script>
