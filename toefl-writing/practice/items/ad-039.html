<script>window.ITEM={"kind":"exercise","id":"AD 039","slug":"ad-039","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environment · value trade-off","payload":{"Strategy":"ask whether the two goods are measured on the same scale","Grammar":"comparative of importance","Vocabulary":"biodiversity, offset, irreversibility, discounting","Convention":"weighing a present cost against a future one"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Aisha is making a claim about kinds rather than quantities. Restate it.\u003c/p>\u003cp>b.  Nils raises a practical worry. What is it, and is it fair?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is discounting, and why is it contested for environmental goods?\u003c/p>\u003cp>b.  What is an offset, and why is it harder here than for carbon?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the asymmetry in one sentence without claiming either good is infinite.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says Nils is answering a claim Aisha did not make. What claim?\u003c/p>\u003cp>b.  The proposed rule is specific. What does it require of the transport case?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"not an infinite one\" — why insert this three-word qualification?\u003c/p>\u003cp>b.  \"that most planning systems claim to hold and routinely do not\" — what does the closing clause achieve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the two options differ in whether error can be corrected, which is a structural property rather than a quantity on the same scale.\u003c/p>\u003cp>b.  That if everything irreplaceable is decisive, nothing is ever built. It is fair as stated, and it is why the response proposes a higher bar rather than a veto.\u003c/p>","P2":"\u003cp>a.  Discounting is valuing future costs and benefits at less than present ones. It is contested for environmental goods because at any positive rate an irreversible loss far enough ahead becomes negligible, which many find absurd.\u003c/p>\u003cp>b.  An offset is compensating a loss elsewhere. It is harder here because a carbon tonne is fungible and a four-hundred-year-old ecosystem is not — planting trees does not produce ancient woodland for four centuries.\u003c/p>","P3":"\u003cp>Model: \"The two errors differ in kind: one can be revisited and the other cannot, which is a reason to demand more of the irreversible option rather than to forbid it.\"\u003c/p>","F1":"\u003cp>a.  That the woodland is infinitely valuable, or that irreplaceability is automatically decisive. Aisha claimed only that irreversibility has a particular structure.\u003c/p>\u003cp>b.  That it survives the loss of the cheaper alternative alignments — in other words, that the case must be strong enough to justify this route specifically, not merely a rail line in general. That is a demanding and checkable test.\u003c/p>","F2":"\u003cp>a.  It blocks the reading Nils is primed for, in which any argument for extra weight is an argument for a veto. Three words prevent the whole response from being dismissed as the position he has already rebutted.\u003c/p>\u003cp>b.  It turns the proposal from an invention into a standard already nominally in force, which makes it far harder to reject — and lands the criticism on practice rather than on principle.\u003c/p>","F3":"\u003cp>1.  It argues the position Nils already answered, treating the woodland as decisive without engaging his point that this would stop all building.\u003c/p>\u003cp>2.  \"Nature has no price\" is precisely the infinite-value claim, asserted rather than defended, and \"find another route even if it costs more\" ignores that cost falls on someone.\u003c/p>\u003cp>3.  The emissions benefit — the actual environmental case for the line — is reduced to \"save some time for passengers\", which misrepresents the other side. Language: \"the environment\", \"nature\", \"future generations\" used as slogans rather than as terms in an argument.\u003c/p>"},"model":["Aisha’s point is the stronger one and it is narrower than it sounds. She is not claiming the woodland is infinitely valuable, which is the claim Nils is answering; she is claiming that an error has different properties in each direction. If we build and are wrong, nothing restores the woodland. If we do not build and are wrong, the route can be revisited, at a cost, for as long as the land remains undeveloped.","That argues for a decision rule rather than a verdict: where one option forecloses and the other does not, the foreclosing option should have to clear a higher bar, not an infinite one. Applied here it means the transport case has to be strong enough to survive the loss of the cheapest alternative alignments, and those are usually the ones rejected early on cost. Nils is right that treating everything irreplaceable as decisive would stop all building; he is wrong that the alternative is treating it as one cost among others. There is a middle position, and it is the one that most planning systems claim to hold and routinely do not."],"model_html":"\u003cp>Aisha’s point is the stronger one and it is narrower than it sounds. She is not claiming the woodland is infinitely valuable, which is the claim Nils is answering; she is claiming that an error has different properties in each direction. If we build and are wrong, nothing restores the woodland. If we do not build and are wrong, the route can be revisited, at a cost, for as long as the land remains undeveloped.\u003c/p>\u003cp>That argues for a decision rule rather than a verdict: where one option forecloses and the other does not, the foreclosing option should have to clear a higher bar, not an infinite one. Applied here it means the transport case has to be strong enough to survive the loss of the cheapest alternative alignments, and those are usually the ones rejected early on cost. Nils is right that treating everything irreplaceable as decisive would stop all building; he is wrong that the alternative is treating it as one cost among others. There is a middle position, and it is the one that most planning systems claim to hold and routinely do not.\u003c/p>","model_band":5,"degraded":["I think the environment must come first because once we destroy an ancient forest it is gone for ever and future generations will never see it. We already have too much infrastructure and we are destroying nature everywhere for economic reasons. The train would save some time for passengers but is this really more important than a forest which has existed for four hundred years and which is home to many species? In my opinion the government should find another route even if it costs more money, because nature has no price."],"degraded_html":"\u003cp>I think the environment must come first because once we destroy an ancient forest it is gone for ever and future generations will never see it. We already have too much infrastructure and we are destroying nature everywhere for economic reasons. The train would save some time for passengers but is this really more important than a forest which has existed for four hundred years and which is home to many species? In my opinion the government should find another route even if it costs more money, because nature has no price.\u003c/p>","degraded_band":3,"model_words":187,"fault_list":{"tag":"F3","faults":["It argues the position Nils already answered, treating the woodland as decisive without engaging his point that this would stop all building.","\"Nature has no price\" is precisely the infinite-value claim, asserted rather than defended, and \"find another route even if it costs more\" ignores that cost falls on someone.","The emissions benefit — the actual environmental case for the line — is reduced to \"save some time for passengers\", which misrepresents the other side. Language: \"the environment\", \"nature\", \"future generations\" used as slogans rather than as terms in an argument."],"html":["\u003cp>1.  It argues the position Nils already answered, treating the woodland as decisive without engaging his point that this would stop all building.\u003c/p>","\u003cp>2.  \"Nature has no price\" is precisely the infinite-value claim, asserted rather than defended, and \"find another route even if it costs more\" ignores that cost falls on someone.\u003c/p>","\u003cp>3.  The emissions benefit — the actual environmental case for the line — is reduced to \"save some time for passengers\", which misrepresents the other side. Language: \"the environment\", \"nature\", \"future generations\" used as slogans rather than as terms in an argument.\u003c/p>"]},"prof_name":"Professor Haugen","professor":"\u003cp>A proposed rail line would cut journey times substantially and reduce road traffic, but would pass through an ancient woodland that cannot be recreated. Which should weigh more heavily — the long-term transport benefit, or the irreversible loss?\u003c/p>","students":[["Nils","The transport benefit. Emissions avoided over a century are real and cumulative; a few hundred hectares of woodland, however old, is a local loss. We cannot treat every irreplaceable thing as infinitely valuable or nothing gets built."],["Aisha","Irreversibility is not just a large cost, it is a different kind of cost. A mistake about emissions can be corrected by later policy; a mistake about a four-hundred-year-old woodland cannot be corrected by anything. That asymmetry should dominate."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It claims rather than asks. “I believe I am owed this money” and “calculate what I am due” assume the entitlement the email should be establishing — the third bullet fails.","correct":false},{"text":"Language. “I still didn’t receive” (have still not received), “in the end of February” (at the end), “since 7 weeks” (for seven weeks), “important for me” (to me), plus a comma splice at “important for me, it is not acceptable”. The since/for error and the tense error together obscure the one fact the email needed to establish.","correct":false},{"text":"“Unwell for the past few weeks” and “badly behind” describe the effect on the writer rather than the circumstance, and nothing is proposed for the interim, so the third bullet fails.","correct":false},{"text":"The emissions benefit — the actual environmental case for the line — is reduced to “save some time for passengers”, which misrepresents the other side. Language: “the environment”, “nature”, “future generations” used as slogans rather than as terms in an argument.","correct":true},{"text":"It argues the position Nils already answered, treating the woodland as decisive without engaging his point that this would stop all building.","correct":true},{"text":"“Nature has no price” is precisely the infinite-value claim, asserted rather than defended, and “find another route even if it costs more” ignores that cost falls on someone.","correct":true}],"key_html":"F3"}};</script>
