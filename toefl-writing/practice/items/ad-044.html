<script>window.ITEM={"kind":"exercise","id":"AD 044","slug":"ad-044","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Law and ethics · cause ranking","payload":{"Strategy":"rank causes by which one the remedy would have to address","Grammar":"causal chain with result clauses","Vocabulary":"backlog, disclosure, legal aid, attrition","Convention":"ranking causes of an institutional failure"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Nour’s and Erik’s causes act on different quantities. Which, respectively?\u003c/p>\u003cp>b.  Why does the third cause, legal aid, matter for attrition rather than for delay?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is disclosure, and why is it the slow stage?\u003c/p>\u003cp>b.  What is attrition in a justice system?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using what a remedy would have to change.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the two causes \"multiply rather than add\". Why does that matter?\u003c/p>\u003cp>b.  It ranks legal aid third and then says it is first for something else. Is that evasion?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"with the result that the backlog resumes rising from a lower base\" — why a result clause?\u003c/p>\u003cp>b.  \"it is simply causing a different harm\" — what does \"simply\" do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Nour on the rate at which cases can be processed; Erik on the work each case requires.\u003c/p>\u003cp>b.  Because an unrepresented or poorly represented defendant affects whether a case proceeds and how it ends, not how long the queue is — so it shows up in outcomes rather than in waiting times.\u003c/p>","P2":"\u003cp>a.  The process of identifying and sharing material that might assist the defence or undermine the prosecution. It is slow because the volume must be reviewed by someone qualified to judge relevance.\u003c/p>\u003cp>b.  Cases dropping out of the system before resolution — withdrawn, discontinued, or collapsing at trial.\u003c/p>","P3":"\u003cp>Model: \"Reopening courts changes the level and reducing the disclosure burden changes the slope, so disclosure is the cause a remedy has to reach.\"\u003c/p>","F1":"\u003cp>a.  Because additive causes can be offset by fixing either one, while multiplicative ones cannot — halving the per-case burden and halving the capacity leaves you where you started. It explains why the delay grew faster than either input changed.\u003c/p>\u003cp>b.  No, because it gives a reason: legal aid acts on a different outcome variable. Evasion would be refusing to rank; this ranks it on the stated question and then says what it is the main cause of, which is more informative rather than less.\u003c/p>","F2":"\u003cp>a.  Because the argument needs a determinate consequence of the partial remedy — that the growth resumes — and that consequence is the whole case for ranking disclosure first. A looser connector would leave it as a possibility rather than a prediction.\u003c/p>\u003cp>b.  It marks the correction as small and obvious, which lets the writer rescue legal aid from irrelevance without appearing to overturn their own ranking. A longer qualification would make the point seem like a retraction.\u003c/p>","F3":"\u003cp>1.  It replaces all three candidate causes with a single upstream one and so answers a different question — ranking was required and none is offered.\u003c/p>\u003cp>2.  \"If there were enough resources the system could handle it\" dismisses Erik’s point without engaging the claim that the work per case is growing faster than capacity could plausibly follow.\u003c/p>\u003cp>3.  \"Justice delayed is justice denied\" is a slogan standing where the argument should be, and the final sentence addresses governments rather than the question. Language: \"the justice system\", \"the consequences\", \"the digital evidence\" over-articled.\u003c/p>"},"model":["Nour is describing reduced capacity and Erik increased work per case, and those multiply rather than add — which is why the delay has grown faster than either change on its own. The way to rank them is to ask which a remedy would have to address. Reopening courts without reducing the disclosure burden buys a proportional improvement and leaves the growth rate untouched, with the result that the backlog resumes rising from a lower base. Reducing the per-case burden changes the slope.","So I would put disclosure first, not because the effect is larger today — it may not be — but because it is the term that is still growing. Capacity second, since it sets the level. Legal aid I would rank third for delay and first for something else: its effect is on who is represented and therefore on how many cases collapse or are resolved badly, which does not show up as waiting time at all. That is worth saying because a delay-focused debate will keep finding legal aid irrelevant, and it is not — it is simply causing a different harm."],"model_html":"\u003cp>Nour is describing reduced capacity and Erik increased work per case, and those multiply rather than add — which is why the delay has grown faster than either change on its own. The way to rank them is to ask which a remedy would have to address. Reopening courts without reducing the disclosure burden buys a proportional improvement and leaves the growth rate untouched, with the result that the backlog resumes rising from a lower base. Reducing the per-case burden changes the slope.\u003c/p>\u003cp>So I would put disclosure first, not because the effect is larger today — it may not be — but because it is the term that is still growing. Capacity second, since it sets the level. Legal aid I would rank third for delay and first for something else: its effect is on who is represented and therefore on how many cases collapse or are resolved badly, which does not show up as waiting time at all. That is worth saying because a delay-focused debate will keep finding legal aid irrelevant, and it is not — it is simply causing a different harm.\u003c/p>","model_band":5,"degraded":["In my opinion the main cause is the lack of funding for the justice system in general. Governments have been cutting budgets for years and the consequences are visible everywhere: courts are closing, there are not enough judges and staff, legal aid is disappearing so many people cannot defend themselves properly. Of course the digital evidence also creates more work as Erik says, but if there were enough resources the system could handle it. Justice delayed is justice denied, and governments must understand that this is not a sector where you can save money without serious consequences."],"degraded_html":"\u003cp>In my opinion the main cause is the lack of funding for the justice system in general. Governments have been cutting budgets for years and the consequences are visible everywhere: courts are closing, there are not enough judges and staff, legal aid is disappearing so many people cannot defend themselves properly. Of course the digital evidence also creates more work as Erik says, but if there were enough resources the system could handle it. Justice delayed is justice denied, and governments must understand that this is not a sector where you can save money without serious consequences.\u003c/p>","degraded_band":3,"model_words":184,"fault_list":{"tag":"F3","faults":["It replaces all three candidate causes with a single upstream one and so answers a different question — ranking was required and none is offered.","\"If there were enough resources the system could handle it\" dismisses Erik’s point without engaging the claim that the work per case is growing faster than capacity could plausibly follow.","\"Justice delayed is justice denied\" is a slogan standing where the argument should be, and the final sentence addresses governments rather than the question. Language: \"the justice system\", \"the consequences\", \"the digital evidence\" over-articled."],"html":["\u003cp>1.  It replaces all three candidate causes with a single upstream one and so answers a different question — ranking was required and none is offered.\u003c/p>","\u003cp>2.  \"If there were enough resources the system could handle it\" dismisses Erik’s point without engaging the claim that the work per case is growing faster than capacity could plausibly follow.\u003c/p>","\u003cp>3.  \"Justice delayed is justice denied\" is a slogan standing where the argument should be, and the final sentence addresses governments rather than the question. Language: \"the justice system\", \"the consequences\", \"the digital evidence\" over-articled.\u003c/p>"]},"prof_name":"Dr Ferreira","professor":"\u003cp>Criminal cases in many jurisdictions now take far longer to reach trial than a decade ago. Proposed causes include court closures, the volume of digital evidence, and cuts to legal aid. Which explains most of the delay?\u003c/p>","students":[["Nour","Court closures. Fewer courtrooms and fewer sitting days means a queue, and everything else is a detail on top of a capacity problem."],["Erik","Digital disclosure. A case that once involved a few statements now involves three phones and forty thousand messages, all of which must be reviewed. The work per case has grown faster than the capacity has shrunk."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It is vague where precision is the entire kindness. “Some of your work may have been lost”, “an older back-up somewhere I think” — she cannot plan her week from any of it, so the second bullet fails.","correct":false},{"text":"“Justice delayed is justice denied” is a slogan standing where the argument should be, and the final sentence addresses governments rather than the question. Language: “the justice system”, “the consequences”, “the digital evidence” over-articled.","correct":true},{"text":"It prescribes the punishment. “this person needs training in customer service” is a recommendation about an employee the writer has no standing to make, and it guarantees a defensive reply.","correct":false},{"text":"The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","correct":false},{"text":"It replaces all three candidate causes with a single upstream one and so answers a different question — ranking was required and none is offered.","correct":true},{"text":"“If there were enough resources the system could handle it” dismisses Erik’s point without engaging the claim that the work per case is growing faster than capacity could plausibly follow.","correct":true}],"key_html":"F3"}};</script>
