<script>window.ITEM={"kind":"exercise","id":"EM 086","slug":"em-086","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Follow-up and chasing","payload":{"Strategy":"chase a group by making one person responsible","Grammar":"polite escalation","Vocabulary":"action, owner, outstanding, circulate","Convention":"chasing people who are all equally not responsible"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Your first email failed. What was almost certainly wrong with it?\u003c/p>\u003cp>b.  Why does naming people change the dynamics of a group email?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an owner, in the sense of a task having one?\u003c/p>\u003cp>b.  What does it mean to circulate something, and how is it different from sending it?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Name what is outstanding in a way nobody can read past.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email lists names under two headings. What does that do that prose could not?\u003c/p>\u003cp>b.  The writer offers to do other people’s work. Why is that not a reward for ignoring them?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"just so nobody is surprised\" — what is this softening, and does it work?\u003c/p>\u003cp>b.  \"that is genuinely easier for me than chasing\" — why say this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It addressed everyone and therefore nobody. A request sent to four people with no name attached is a request each of them can reasonably assume is mostly about the others.\u003c/p>\u003cp>b.  It removes the diffusion of responsibility. Once \"Jonas (background)\" is written down, Jonas knows that everyone else knows, which is a far stronger incentive than any amount of urgency in the abstract.\u003c/p>","P2":"\u003cp>a.  The single person accountable for a task being done, as distinct from the people doing it. Tasks without owners are the ones that do not happen.\u003c/p>\u003cp>b.  To circulate is to send to a group for comment or information, usually with an expectation of response from each — which is exactly the expectation that fails here.\u003c/p>","P3":"\u003cp>Model: \"Still to come: Jonas (background), Lena (case study), Tom (policy section).\"\u003c/p>","F1":"\u003cp>a.  It makes the state of play scannable and attributable in one glance, and it does so without a single accusatory sentence. The list is neutral in tone and impossible to misread, which prose carrying the same information cannot manage.\u003c/p>\u003cp>b.  Because the goal is the document, not fairness. Lowering the barrier to contributing gets the content in; insisting on the original terms gets an argument and no content. The fairness question can be dealt with afterwards, and the group has a record of who did what.\u003c/p>","F2":"\u003cp>a.  The escalation to individual messages. It works because it frames the next step as courtesy rather than threat — announcing it removes the sting while still making clear it will happen.\u003c/p>\u003cp>b.  Because an offer to help can read as passive aggression if it sounds like a sacrifice. Stating that it is genuinely the cheaper option for the writer makes it a practical suggestion rather than a reproach.\u003c/p>","F3":"\u003cp>1.  Nobody is named, so the second bullet fails and the email has the same weakness as the first one.\u003c/p>\u003cp>2.  \"It is really not fair that some people are doing all the work while others do nothing\" turns a logistics email into a group conflict, which is specifically what the third bullet rules out — and it is also unfair to Priya, who did send her section.\u003c/p>\u003cp>3.  \"As soon as possible\" gives no internal deadline, no compiling time is accounted for, and no easier alternative is offered, so the email asks for exactly what has already failed.\u003c/p>"},"model":["Hi all,","Quick update on the draft. Where we are:","Received: Priya (methods, Monday).","Still to come: Jonas (background), Lena (case study), Tom (policy section).","I need all three by Thursday lunchtime to have any chance of compiling, formatting and proofing before the Friday deadline. If two paragraphs is not realistic for anyone at this point, send me bullet points and I will write it up — that is genuinely easier for me than chasing.","If I have not heard from someone by Wednesday evening I will message them directly, just so nobody is surprised.","Nour"],"model_html":"\u003cp>Hi all,\u003c/p>\u003cp>Quick update on the draft. Where we are:\u003c/p>\u003cp>Received: Priya (methods, Monday).\u003c/p>\u003cp>Still to come: Jonas (background), Lena (case study), Tom (policy section).\u003c/p>\u003cp>I need all three by Thursday lunchtime to have any chance of compiling, formatting and proofing before the Friday deadline. If two paragraphs is not realistic for anyone at this point, send me bullet points and I will write it up — that is genuinely easier for me than chasing.\u003c/p>\u003cp>If I have not heard from someone by Wednesday evening I will message them directly, just so nobody is surprised.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi everyone, Just a reminder that we agreed to send our sections last week and I have only received one so far. The deadline is on Friday so please could everybody send me their parts as soon as possible, otherwise we will not be able to finish in time. It is really not fair that some people are doing all the work while others do nothing. Thanks.","Nour"],"degraded_html":"\u003cp>Hi everyone, Just a reminder that we agreed to send our sections last week and I have only received one so far. The deadline is on Friday so please could everybody send me their parts as soon as possible, otherwise we will not be able to finish in time. It is really not fair that some people are doing all the work while others do nothing. Thanks.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":95,"fault_list":{"tag":"F3","faults":["Nobody is named, so the second bullet fails and the email has the same weakness as the first one.","\"It is really not fair that some people are doing all the work while others do nothing\" turns a logistics email into a group conflict, which is specifically what the third bullet rules out — and it is also unfair to Priya, who did send her section.","\"As soon as possible\" gives no internal deadline, no compiling time is accounted for, and no easier alternative is offered, so the email asks for exactly what has already failed."],"html":["\u003cp>1.  Nobody is named, so the second bullet fails and the email has the same weakness as the first one.\u003c/p>","\u003cp>2.  \"It is really not fair that some people are doing all the work while others do nothing\" turns a logistics email into a group conflict, which is specifically what the third bullet rules out — and it is also unfair to Priya, who did send her section.\u003c/p>","\u003cp>3.  \"As soon as possible\" gives no internal deadline, no compiling time is accounted for, and no easier alternative is offered, so the email asks for exactly what has already failed.\u003c/p>"]},"scenario":"\u003cp>You asked your four-person project group a week ago to each send two paragraphs. One person has. The deadline for the combined draft is Friday and you are the one compiling it.\u003c/p>","bullets":["Remind them what is outstanding.","Make it harder to ignore than the first email.","Avoid making it a group argument."],"header":[["To:","group4.env@northgate.ac.uk"],["Subject:","Draft due Friday — still waiting on three sections"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Nobody is named, so the second bullet fails and the email has the same weakness as the first one.","correct":true},{"text":"“Governments waste money on many less important things” does not answer Grace’s argument, which is about the best use of a fixed sum within this policy.","correct":false},{"text":"“It is really not fair that some people are doing all the work while others do nothing” turns a logistics email into a group conflict, which is specifically what the third bullet rules out — and it is also unfair to Priya, who did send her section.","correct":true},{"text":"It never takes a position. It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.","correct":false},{"text":"Luc’s actual argument — that the unbuilt third bridge carries risk of its own — is never addressed; “governments can always find the money if they really want to” denies the premise without evidence.","correct":false},{"text":"“As soon as possible” gives no internal deadline, no compiling time is accounted for, and no easier alternative is offered, so the email asks for exactly what has already failed.","correct":true}],"key_html":"F3"}};</script>
