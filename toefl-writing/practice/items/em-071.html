<script>window.ITEM={"kind":"exercise","id":"EM 071","slug":"em-071","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Proposal and solving a problem · anchor item","payload":{"Strategy":"diagnose, propose, cost, and name the first step","Grammar":"cause-effect connectors; the cleft to foreground a solution","Vocabulary":"rota, uptake, pilot, roll out, administrative burden","Convention":"proposing work that somebody else will have to do"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The warden has no budget and no time. What does that rule out, and what does it leave?\u003c/p>\u003cp>b.  Why does the first bullet ask for the cause as well as the problem?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Define: a \u003cem>rota\u003c/em> · \u003cem>uptake\u003c/em> · a \u003cem>pilot\u003c/em> · \u003cem>to roll out\u003c/em>.\u003c/p>\u003cp>b.  What is an \u003c/p>\u003cp>administrative burden\u003c/p>\u003cp>, and why is naming it useful in a proposal?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the cause of the problem in one sentence without blaming any resident.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “Something needs to be done about the kitchen” the weakest possible opening for a proposal?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The proposal asks the warden for exactly two things. What are they, and what does the writer take on instead?\u003c/p>\u003cp>b.  Why is the last sentence (a one-month trial on one floor) worth more than the rest of the proposal put together?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “What would fix most of it, I think, is a one-week rota.” Name the device, and say what it does that \u003cem>I think a one-week rota would fix most of it\u003c/em> does not.\u003c/p>\u003cp>b.  “because no one is responsible in particular, no one clears up”. Why put the cause clause first?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>I am told it works\u003c/em> rather than \u003cem>it works\u003c/em>?\u003c/p>\u003cp>b.  \u003cem>so that it reads as the building’s scheme\u003c/em> — what is the writer actually asking the warden to supply, and why is it the cleverest sentence in the email?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Propose a bicycle repair stand for your building to an office with no budget. In 60 words: cause, proposal, and the smallest possible first step.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It rules out anything costing money or staff time — more cleaning, new equipment, enforcement. What is left is organisation, which is free, and the warden’s authority, which is also free.\u003c/p>\u003cp>b.  Because the cause determines the solution. If the cause were carelessness, the remedy would be enforcement; if it is diffusion of responsibility, the remedy is a rota. Stating the cause is how you make the proposal follow rather than merely appear.\u003c/p>","P2":"\u003cp>a.  A \u003cstrong>rota\u003c/strong> is a schedule of whose turn it is. \u003cstrong>Uptake\u003c/strong> is how many people actually use a scheme. A \u003cstrong>pilot\u003c/strong> is a small trial before full adoption, and to \u003cstrong>roll out\u003c/strong> is to extend it everywhere.\u003c/p>\u003cp>b.  The work a scheme creates for the people running it. Naming it is useful because it is the real reason proposals are refused — so a proposal that addresses it directly has removed the main objection before it is raised.\u003c/p>","P3":"\u003cp>Model: \u003cem>The difficulty is not really that people are careless, but that nothing identifies whose turn it is.\u003c/em>\u003c/p>\u003cp>The \u003cem>not … but\u003c/em> frame does double work: it rejects the blaming diagnosis explicitly, which protects your neighbours, and it sets up the structural one, which points straight at the rota.\u003c/p>","P4":"\u003cp>It names no cause, no solution, no cost and no agent. It is a complaint wearing the clothes of a proposal, and it leaves the entire burden of thinking with the reader — who, having no time, will file it.\u003c/p>","F1":"\u003cp>a.  A laminated sheet and his name at the bottom. The writer takes on drawing it up, collecting names, putting it up, and running the trial.\u003c/p>\u003cp>b.  Because it makes the decision reversible. A warden agreeing to a building-wide scheme is making a commitment; a warden agreeing to one floor for a month is agreeing to an experiment that costs him nothing and ends by itself. Almost every proposal is easier to accept when it is small, temporary, and somebody else’s work.\u003c/p>","F2":"\u003cp>a.  A wh-cleft (family 8, structure 60). It puts the solution at the end of the sentence, where the stress falls, and it frames the whole thing as an answer to an implied question — \u003cem>what would fix it?\u003c/em> The flat version buries the rota in the middle and leads with \u003cem>I think\u003c/em>, which is the least important part.\u003c/p>\u003cp>b.  Because the sentence is tracing a mechanism, and the reader needs the cause in hand before the effect lands. It also puts \u003cem>no one clears up\u003c/em> at the end of the sentence, where it carries most weight — and that clause is the problem the whole email exists to solve.\u003c/p>","F3":"\u003cp>a.  Because the writer has not seen Beechwood’s rota working and should not claim to have. Marking the source costs four words and protects the claim — and a proposal caught overstating one fact loses the reader’s trust in all the others.\u003c/p>\u003cp>b.  Authority. The writer has identified that the scheme will fail unless it appears to come from the building rather than from a resident, and is asking for exactly the one thing the warden has in abundance and can give away for free. It is clever because it turns the warden’s lack of budget and time from an obstacle into irrelevance: what is needed from him is neither.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>No diagnosis, so no proposal follows.\u003c/strong> The cause offered is “some people never clean anything” — a complaint about individuals, which supports no scheme. The first bullet asked for the cause, and this does not supply one that leads anywhere.\u003c/p>\u003cp>2.  \u003cstrong>The solutions are the reader’s to fund, not the writer’s to run.\u003c/strong> More cleaning staff and surveillance cameras both cost money the warden does not have, and the third bullet — what would be needed to start — is never addressed at all.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”.\u003c/p>","F5":"\u003cp>Model: \u003cem>Most people here cycle, and the nearest pump is twenty minutes away, so bikes sit unused over small faults. A wall-mounted stand with a pump and two tools costs about forty pounds and needs no supervision. If the Union would fund it, could we fix one to the bin-store wall for a term and see whether it is used?\u003c/em>\u003c/p>"},"model":["Dear Mr Achebe,","I wanted to put a small suggestion to you about the fourth-floor kitchen. The difficulty is not really that people are careless, but that nothing identifies whose turn it is: the cleaner comes on Mondays, by Wednesday the surfaces are covered, and because no one is responsible in particular, no one clears up.","What would fix most of it, I think, is a one-week rota on the door — eight names, one slot each, ten minutes of wiping down and emptying the bin. Several floors in Beechwood already run something similar and I am told it works, largely because the names are visible.","Getting it started would need almost nothing from the office: a laminated sheet and your name at the bottom, so that it reads as the building’s scheme rather than one student’s idea. I am happy to draw it up, collect the names and put it up myself, and to try it for a month on our floor before anyone considers it anywhere else.","Thank you for reading this.","Best wishes,","Chloe Mbeki — Flat 4C, Elmfield"],"model_html":"\u003cp>Dear Mr Achebe,\u003c/p>\u003cp>I wanted to put a small suggestion to you about the fourth-floor kitchen. The difficulty is not really that people are careless, but that nothing identifies whose turn it is: the cleaner comes on Mondays, by Wednesday the surfaces are covered, and because no one is responsible in particular, no one clears up.\u003c/p>\u003cp>What would fix most of it, I think, is a one-week rota on the door — eight names, one slot each, ten minutes of wiping down and emptying the bin. Several floors in Beechwood already run something similar and I am told it works, largely because the names are visible.\u003c/p>\u003cp>Getting it started would need almost nothing from the office: a laminated sheet and your name at the bottom, so that it reads as the building’s scheme rather than one student’s idea. I am happy to draw it up, collect the names and put it up myself, and to try it for a month on our floor before anyone considers it anywhere else.\u003c/p>\u003cp>Thank you for reading this.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Chloe Mbeki — Flat 4C, Elmfield\u003c/p>","model_band":5,"degraded":["Dear Warden,","I am writing because something must be done about our kitchen on the fourth floor. It is always dirty and disgusting, some people never clean anything and they leave their plates for days, it is really not acceptable for the other students who are trying to cook. The cleaner comes only one time per week which is clearly not enough. I think the university should employ more cleaning staff or install cameras to see who is making the mess.","Please solve this problem as soon as possible."],"degraded_html":"\u003cp>Dear Warden,\u003c/p>\u003cp>I am writing because something must be done about our kitchen on the fourth floor. It is always dirty and disgusting, some people never clean anything and they leave their plates for days, it is really not acceptable for the other students who are trying to cook. The cleaner comes only one time per week which is clearly not enough. I think the university should employ more cleaning staff or install cameras to see who is making the mess.\u003c/p>\u003cp>Please solve this problem as soon as possible.\u003c/p>","degraded_band":3,"model_words":182,"fault_list":{"tag":"F4","faults":["No diagnosis, so no proposal follows. The cause offered is “some people never clean anything” — a complaint about individuals, which supports no scheme. The first bullet asked for the cause, and this does not supply one that leads anywhere.","The solutions are the reader’s to fund, not the writer’s to run. More cleaning staff and surveillance cameras both cost money the warden does not have, and the third bullet — what would be needed to start — is never addressed at all.","Language and register. “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”."],"html":["\u003cp>1.  \u003cstrong>No diagnosis, so no proposal follows.\u003c/strong> The cause offered is “some people never clean anything” — a complaint about individuals, which supports no scheme. The first bullet asked for the cause, and this does not supply one that leads anywhere.\u003c/p>","\u003cp>2.  \u003cstrong>The solutions are the reader’s to fund, not the writer’s to run.\u003c/strong> More cleaning staff and surveillance cameras both cost money the warden does not have, and the third bullet — what would be needed to start — is never addressed at all.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”.\u003c/p>"]},"scenario":"\u003cp>The shared kitchen on your floor is permanently dirty. There is no rota, and the cleaner comes once a week. You want to propose a simple scheme. The warden is sympathetic but has no budget and very little time.\u003c/p>","bullets":["State the problem and its cause.","Propose a specific solution.","Say what would be needed to start it."],"header":[["To:","warden.elmfield@northgate.ac.uk"],["Subject:","A proposal for the fourth-floor kitchen"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"No diagnosis, so no proposal follows. The cause offered is “some people never clean anything” — a complaint about individuals, which supports no scheme. The first bullet asked for the cause, and this does not supply one that leads anywhere.","correct":true},{"text":"Language: “the justice becomes like a machine without humanity” is rhetoric rather than argument; “dangerous for the society”, “the automatic sentences”, “all the cases” are all over-articled.","correct":false},{"text":"Petros’s argument is acknowledged and then waved away with “better to do something than nothing”, which is the reasoning his objection was specifically about.","correct":false},{"text":"Language and register. “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”.","correct":true},{"text":"The solutions are the reader’s to fund, not the writer’s to run. More cleaning staff and surveillance cameras both cost money the warden does not have, and the third bullet — what would be needed to start — is never addressed at all.","correct":true},{"text":"“A four-day week is a great idea in general” and “many companies have tried it with good results” answer a question the prompt did not ask, and nothing is said about reversibility or about what the pilot should measure.","correct":false}],"key_html":"F4"}};</script>
