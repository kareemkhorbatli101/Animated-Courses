<script>window.ITEM={"kind":"exercise","id":"EM 052","slug":"em-052","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Recommendation and advice","payload":{"Strategy":"recommend against the obvious choice and say why","Grammar":"if I were you","Vocabulary":"placement, intake, cohort, well regarded","Convention":"advising someone whose situation differs from yours"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Your friend wants academia. How does that change which offer is better?\u003c/p>\u003cp>b.  Why is the larger, more prestigious offer not automatically the right advice?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does \"well regarded\" mean, and well regarded by whom?\u003c/p>\u003cp>b.  Distinguish a structured scheme from informal supervision in what each actually gives you.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Recommend in one sentence that refers to their goal rather than the employers.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The recommendation is hedged at the end by a condition. Does that weaken it?\u003c/p>\u003cp>b.  The writer names a concrete thing to check before deciding. Why is that more useful than the recommendation itself?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"If I were you I would take the charity\" — why the unreal conditional for advice you actually mean?\u003c/p>\u003cp>b.  \"which is a real cost\" — what is conceded, and what does conceding it buy?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It changes the criterion from prestige to evidence of independent research. An application to a doctoral programme is read by academics looking for outputs, not by recruiters looking for brands.\u003c/p>\u003cp>b.  Because \"better offer\" is meaningless without an end. The consultancy is better for most purposes and worse for this one, which is exactly the kind of judgement advice exists to make.\u003c/p>","P2":"\u003cp>a.  Respected by a particular community. The consultancy is well regarded by employers; the charity may be well regarded by the researchers who will read the application. Always ask by whom.\u003c/p>\u003cp>b.  A structured scheme gives training, breadth and a recognised name. Informal supervision gives ownership of real work — or nothing at all, depending entirely on the person supervising.\u003c/p>","P3":"\u003cp>Model: \"If I were you I would take the charity, and the reason is the academia plan rather than anything about the two organisations.\"\u003c/p>","F1":"\u003cp>a.  No — it strengthens it, because it names the one premise the advice depends on. Advice that states its own conditions is advice the recipient can actually use; advice that does not is a guess presented as certainty.\u003c/p>\u003cp>b.  Because the recommendation turns on a fact the writer does not have. Whether informal supervision is a cost or a disaster depends on who is reading the drafts, and only Reza can find that out.\u003c/p>","F2":"\u003cp>a.  Because the decision is not the writer’s to make. \"Take the charity\" is an instruction; \"if I were you I would\" offers a view from a position the speaker explicitly does not occupy, which leaves the choice where it belongs.\u003c/p>\u003cp>b.  That the charity is disorganised — the strongest point against the recommendation being made. Conceding it first means the reader does not have to raise it, and makes everything else more credible.\u003c/p>","F3":"\u003cp>1.  It recommends against the stated goal without noticing there is one. Academia is never mentioned, so the second bullet — the trade-off against their plan — is entirely unaddressed.\u003c/p>\u003cp>2.  It forecloses the decision. \"Definitely\", \"Trust me\", \"you will not regret it\" leave Reza nowhere to disagree.\u003c/p>\u003cp>3.  Language: three comma splices, and \"nobody will know it on your CV\" asserts something about an audience the writer has not identified.\u003c/p>"},"model":["Hi Reza,","If I were you I would take the charity, and the reason is the academia plan rather than anything about the two organisations.","The consultancy scheme is the better-run of the two and you would come out with a line on your CV that everyone recognises. But what a doctoral application wants to see is evidence you can run a piece of work and write it up — and a structured scheme gives you rotations and a final presentation, not an output with your name on it. The charity is disorganised, which is a real cost, but the published briefings come out under the researcher’s name, and you would have one by September.","The thing I would check before deciding is whether anyone there will actually read your drafts. Informal supervision is fine if someone competent is paying attention and useless if not — so I would ask them directly who you would report to and how often.","That said, if you are less sure about academia than you were in January, the consultancy is the safer place to be undecided, and I would not think any worse of that.","Dan"],"model_html":"\u003cp>Hi Reza,\u003c/p>\u003cp>If I were you I would take the charity, and the reason is the academia plan rather than anything about the two organisations.\u003c/p>\u003cp>The consultancy scheme is the better-run of the two and you would come out with a line on your CV that everyone recognises. But what a doctoral application wants to see is evidence you can run a piece of work and write it up — and a structured scheme gives you rotations and a final presentation, not an output with your name on it. The charity is disorganised, which is a real cost, but the published briefings come out under the researcher’s name, and you would have one by September.\u003c/p>\u003cp>The thing I would check before deciding is whether anyone there will actually read your drafts. Informal supervision is fine if someone competent is paying attention and useless if not — so I would ask them directly who you would report to and how often.\u003c/p>\u003cp>That said, if you are less sure about academia than you were in January, the consultancy is the safer place to be undecided, and I would not think any worse of that.\u003c/p>\u003cp>Dan\u003c/p>","model_band":5,"degraded":["Hi Reza, I think you should definitely take the consultancy, it is a much bigger name and everybody knows it, and the training programme is excellent so you will learn a lot of useful skills. The charity sounds interesting but it is very small and nobody will know it on your CV, and if the supervision is informal you might not learn anything properly. Trust me, go for the consultancy, you will not regret it.","Dan"],"degraded_html":"\u003cp>Hi Reza, I think you should definitely take the consultancy, it is a much bigger name and everybody knows it, and the training programme is excellent so you will learn a lot of useful skills. The charity sounds interesting but it is very small and nobody will know it on your CV, and if the supervision is informal you might not learn anything properly. Trust me, go for the consultancy, you will not regret it.\u003c/p>\u003cp>Dan\u003c/p>","degraded_band":3,"model_words":192,"fault_list":{"tag":"F3","faults":["It recommends against the stated goal without noticing there is one. Academia is never mentioned, so the second bullet — the trade-off against their plan — is entirely unaddressed.","It forecloses the decision. \"Definitely\", \"Trust me\", \"you will not regret it\" leave Reza nowhere to disagree.","Language: three comma splices, and \"nobody will know it on your CV\" asserts something about an audience the writer has not identified."],"html":["\u003cp>1.  It recommends against the stated goal without noticing there is one. Academia is never mentioned, so the second bullet — the trade-off against their plan — is entirely unaddressed.\u003c/p>","\u003cp>2.  It forecloses the decision. \"Definitely\", \"Trust me\", \"you will not regret it\" leave Reza nowhere to disagree.\u003c/p>","\u003cp>3.  Language: three comma splices, and \"nobody will know it on your CV\" asserts something about an audience the writer has not identified.\u003c/p>"]},"scenario":"\u003cp>A friend has two placement offers: a large consultancy with a structured scheme and a small research charity where the work is more interesting but the supervision is informal. They want to go into academia.\u003c/p>","bullets":["Recommend one.","Explain the trade-off against their goal.","Leave the decision with them."],"header":[["To:","r.ahmadi@northgate.ac.uk"],["Subject:","Those two placements — my two pennyworth"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It never takes a position. It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.","correct":false},{"text":"Lin’s argument is dismissed with “now we know better and our moral understanding has progressed” — which assumes the reliability of current intuitions, the very thing in dispute.","correct":false},{"text":"Language: three comma splices, and “nobody will know it on your CV” asserts something about an audience the writer has not identified.","correct":true},{"text":"It recommends against the stated goal without noticing there is one. Academia is never mentioned, so the second bullet — the trade-off against their plan — is entirely unaddressed.","correct":true},{"text":"It forecloses the decision. “Definitely”, “Trust me”, “you will not regret it” leave Reza nowhere to disagree.","correct":true},{"text":"Language: “the schools”, “the universities”, “the students themselves” over-articled; “make an effort and practise their writing” is vague; and the final sentence shifts to second person mid-paragraph.","correct":false}],"key_html":"F3"}};</script>
