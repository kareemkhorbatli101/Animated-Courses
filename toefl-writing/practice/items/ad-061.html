<script>window.ITEM={"kind":"exercise","id":"AD 061","slug":"ad-061","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Law and ethics · policy choice","payload":{"Strategy":"separate what a rule forbids from what it can be enforced to forbid","Grammar":"the cleft for emphasis; nominalisation for abstraction","Vocabulary":"provision, precedent, chilling effect, proportionate","Convention":"arguing a legal question without claiming legal authority"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Lina argues from the individual case. What does Omar argue from?\u003c/p>\u003cp>b.  Does Omar deny that Lina’s nineteen-year-old deserves protection?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a \u003cem>chilling effect\u003c/em>, and who experiences it in this dispute?\u003c/p>\u003cp>b.  \u003cem>Proportionate\u003c/em> is a legal term of art. Proportionate to what?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, accept Omar’s structural worry and show it is an argument about who decides, not about whether the right exists. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “privacy is a fundamental human right” a weak opening here?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response concedes that Omar is right about the abuse and still rejects his conclusion. Name the step.\u003c/p>\u003cp>b.  Find the sentence that identifies the real defect. Why is it more damaging to the status quo than Omar’s own objection?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “That is the actual flaw: a commercial body with every incentive to delist quietly …” Why a colon rather than a full stop?\u003c/p>\u003cp>b.  “The right is defensible; the delegation of it is not.” Identify the two nominalisations and say what the final sentence gains from them.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>delegation\u003c/em> — what does choosing this noun imply about where the right came from?\u003c/p>\u003cp>b.  Why \u003cem>becomes a much harder case\u003c/em> rather than \u003cem>would be refused\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: should universities be able to discipline students for speech made off campus? In 50 words, accept the strongest objection to your position and show it is about procedure rather than principle.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  From the structure of the rule — who else can use it, and what it will become in hands other than the sympathetic ones. This is the classic legal move: argue from the general provision rather than the particular case.\u003c/p>\u003cp>b.  No, and that is the opening. He never says the teenager should be exposed; he says the same provision is available to people who should not benefit from it. So the disagreement is not about who deserves protection but about whether a rule can distinguish them.\u003c/p>","P2":"\u003cp>a.  The deterrence of lawful speech by the risk of legal consequences, even where no action is ever brought. Here it would fall on journalists and archives, who may remove material pre-emptively rather than contest a request — which is Omar’s point in its sharpest form.\u003c/p>\u003cp>b.  To the legitimate aim being pursued. A measure is proportionate if the harm it does is no greater than necessary to achieve that aim, which is why Lina stresses that the archive survives: she is arguing the interference is the minimum that works.\u003c/p>","P3":"\u003cp>Model: \u003cem>Omar is right that the provision is available to the powerful, but that is an argument about who should decide and on what published reasons, not about whether the right exists.\u003c/em>\u003c/p>","P4":"\u003cp>Because it is not disputed and it decides nothing. Omar does not deny that privacy matters; he says this particular mechanism will be captured. Invoking a general right in answer to a specific structural objection is a change of subject, and in a ten-minute task it usually consumes the words you needed for the actual argument.\u003c/p>","F1":"\u003cp>a.  It generalises his objection until it proves too much. If “the strong can use this remedy” were a reason to abolish a remedy, we would have to abolish defamation law and injunctions as well. An objection that would destroy institutions we all accept cannot by itself condemn this one — so it must be pointing at something narrower, which the second paragraph then identifies.\u003c/p>\u003cp>b.  “At present a search company decides, privately, on a balance of reputational risk to itself.” It is more damaging because Omar’s objection applies to any version of the right, including well-designed ones, and so can be met with trade-offs. This one identifies a specific feature of the existing arrangement that is indefensible on anybody’s account — and a criticism everybody must accept is worth more than one that can be argued about.\u003c/p>","F2":"\u003cp>a.  Because what follows is an identification rather than a new statement: the colon says “here is what I mean by that”. It also lets the noun phrase stand alone without a verb, which makes it land as a diagnosis rather than as another sentence of argument.\u003c/p>\u003cp>b.  \u003cem>The right\u003c/em> and \u003cem>the delegation\u003c/em> — both abstractions standing in for whole processes. The gain is compression and balance: two nominalisations let the entire argument resolve into a seven-word antithesis, and a reader remembers that sentence rather than the paragraph above it.\u003c/p>","F3":"\u003cp>a.  That the power originates elsewhere — with the public, or the courts — and has been handed to the search company, which means it can be taken back. \u003cem>The power of search companies\u003c/em> would imply it was theirs to begin with, and the argument would lose its remedy.\u003c/p>\u003cp>b.  Because the writer is claiming a change in the \u003cem>difficulty\u003c/em> of the case, not predicting a result. A tribunal might still delist for a politician in some circumstances, and claiming otherwise would overstate. The comparative keeps the claim exactly as large as the argument supports.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It does not answer Omar.\u003c/strong> His objection is that the provision will be captured by the powerful; the response says “the judges can decide”, which assumes away the problem rather than addressing it — and is factually wrong about how delisting currently works.\u003c/p>\u003cp>2.  \u003cstrong>It argues from an undisputed principle.\u003c/strong> “Privacy is a fundamental human right” and “protected in many constitutions” are true and irrelevant: nobody in the discussion denies them, so they move nothing.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”.\u003c/p>","F5":"\u003cp>Model: \u003cem>The strongest objection is that a university investigating off-campus speech becomes a court without any of a court’s safeguards. That is right, and it argues for published standards, an appeal and a narrow definition of harm — not for a blanket rule that nothing said outside the gates can ever matter.\u003c/em>\u003c/p>"},"model":["Omar’s worry is the serious one, but I think it is an argument about who holds the power rather than about whether the right should exist. Every remedy that protects the weak is available to the strong; that is true of defamation law, of privacy injunctions, and of the courts generally, and we do not conclude from it that those should be abolished. What follows is that the decision should not sit where it currently sits.","At present a search company decides, privately, on a balance of reputational risk to itself. That is the actual flaw: a commercial body with every incentive to delist quietly and no incentive to defend the public interest. Move the decision to a tribunal that publishes its reasons, and Omar’s politician becomes a much harder case than Lina’s nineteen-year-old — which is exactly the discrimination the current arrangement cannot make. The right is defensible; the delegation of it is not."],"model_html":"\u003cp>Omar’s worry is the serious one, but I think it is an argument about who holds the power rather than about whether the right should exist. Every remedy that protects the weak is available to the strong; that is true of defamation law, of privacy injunctions, and of the courts generally, and we do not conclude from it that those should be abolished. What follows is that the decision should not sit where it currently sits.\u003c/p>\u003cp>At present a search company decides, privately, on a balance of reputational risk to itself. That is the actual flaw: a commercial body with every incentive to delist quietly and no incentive to defend the public interest. Move the decision to a tribunal that publishes its reasons, and Omar’s politician becomes a much harder case than Lina’s nineteen-year-old — which is exactly the discrimination the current arrangement cannot make. The right is defensible; the delegation of it is not.\u003c/p>","model_band":5,"degraded":["I agree with Lina because I think everybody has the right to privacy and everybody can make a mistake when they are young. It is not fair that one stupid photo or one bad article will destroy your whole life and your career for ever. Privacy is a fundamental human right and it is protected in many constitutions around the world. Omar says that politicians can also use this law but I think the judges can decide which cases are acceptable and which are not. So in my opinion this right should exist but with some conditions and limits to avoid the abuse by powerful people."],"degraded_html":"\u003cp>I agree with Lina because I think everybody has the right to privacy and everybody can make a mistake when they are young. It is not fair that one stupid photo or one bad article will destroy your whole life and your career for ever. Privacy is a fundamental human right and it is protected in many constitutions around the world. Omar says that politicians can also use this law but I think the judges can decide which cases are acceptable and which are not. So in my opinion this right should exist but with some conditions and limits to avoid the abuse by powerful people.\u003c/p>","degraded_band":3,"model_words":156,"fault_list":{"tag":"F4","faults":["It does not answer Omar. His objection is that the provision will be captured by the powerful; the response says “the judges can decide”, which assumes away the problem rather than addressing it — and is factually wrong about how delisting currently works.","It argues from an undisputed principle. “Privacy is a fundamental human right” and “protected in many constitutions” are true and irrelevant: nobody in the discussion denies them, so they move nothing.","Language and register. “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”."],"html":["\u003cp>1.  \u003cstrong>It does not answer Omar.\u003c/strong> His objection is that the provision will be captured by the powerful; the response says “the judges can decide”, which assumes away the problem rather than addressing it — and is factually wrong about how delisting currently works.\u003c/p>","\u003cp>2.  \u003cstrong>It argues from an undisputed principle.\u003c/strong> “Privacy is a fundamental human right” and “protected in many constitutions” are true and irrelevant: nobody in the discussion denies them, so they move nothing.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”.\u003c/p>"]},"prof_name":"Dr Ferreira","professor":"\u003cp>Several jurisdictions now give individuals a right to have search results about them delisted after a period of time. Supporters describe it as a right to be forgotten; critics call it the editing of the public record. Should such a right exist?\u003c/p>","students":[["Lina","Yes. A person who made a mistake at nineteen should not meet it in every job interview at forty. The record still exists — delisting removes the shortcut, not the archive — and that is a proportionate way of letting consequences fade."],["Omar","I am against it. Whoever decides what gets delisted is editing what the public can easily find, and that power will not stay with sympathetic cases. The same provision that protects a teenager protects a politician."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It does not answer Omar. His objection is that the provision will be captured by the powerful; the response says “the judges can decide”, which assumes away the problem rather than addressing it — and is factually wrong about how delisting currently works.","correct":true},{"text":"The questions are not questions. “The guarantor thing” and “what happens if I need to leave early” name topics, not things that can be answered, and no clause is cited.","correct":false},{"text":"“I will be more careful next time” names no change, so the third bullet fails; and “sorry if it caused any trouble” makes the harm hypothetical.","correct":false},{"text":"Language and register. “one stupid photo”, “destroy your whole life” and “for ever” are overstated for an academic forum; “with some conditions and limits” names no conditions; and “the abuse by powerful people” should be “abuse by powerful people”.","correct":true},{"text":"“Any advice would be very helpful” invites exactly the wrong kind of response, and no student number is given.","correct":false},{"text":"It argues from an undisputed principle. “Privacy is a fundamental human right” and “protected in many constitutions” are true and irrelevant: nobody in the discussion denies them, so they move nothing.","correct":true}],"key_html":"F4"}};</script>
