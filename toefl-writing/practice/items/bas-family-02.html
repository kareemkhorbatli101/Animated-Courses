<script>window.ITEM={"kind":"family","id":"BAS 011–018","slug":"bas-family-02","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 2 of 12 — noun clauses and embedded questions","payload":{"Strategy":"a clause can fill a noun slot: subject, object or complement","Grammar":"that-clauses, embedded questions, extraposed it, backshift","Vocabulary":"verbs and adjectives that select a that-clause","Convention":"an embedded question keeps statement word order"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>A noun clause does the job of a noun. The single most valuable thing in this family is the word order of embedded questions, because it is wrong in the speech of most learners at every level, and it is wrong in a way examiners always notice.\u003c/p>","preview":[{"tag":"P1","title":"The rule that matters most here","html":"\u003cp>One of these is wrong. Which, and why?\u003c/p>\u003cpre class=\"mono\">(i)  Nobody told us when the results would be published.\n(ii) Nobody told us when would the results be published.\u003c/pre>"},{"tag":"P2","title":"What follows what","html":"\u003cp>Which of these can be followed directly by a that-clause?\u003c/p>\u003cpre class=\"mono\">decide · relieved · discuss · clear · explain · suggest\u003c/pre>"},{"tag":"P3","title":"Why bother with it","html":"\u003cp>English dislikes a long clause in subject position. Compare:\u003c/p>\u003cpre class=\"mono\">That the scheme had been underfunded was clear.\nIt was clear that the scheme had been underfunded.\u003c/pre>\u003cp>Both are grammatical. Why is the second the one people actually write?\u003c/p>"}],"followup":[{"tag":"F1","title":"The order test","html":"\u003cp>Rewrite each as an embedded clause after the words given.\u003c/p>\u003cpre class=\"mono\">(a) Where has the meeting been moved to?  → Could you tell me …\n(b) Did she submit the form?             → I am not sure …\n(c) How much will it cost?               → Nobody has said …\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) I asked him what does he want.\n(b) It is obvious that must we change the plan.\n(c) He explained me that the lab was closed.\n(d) I am not sure that will she come.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Each of these appears in the Email and Discussion tasks constantly. Write one sentence of your own using each.\u003c/p>\u003cpre class=\"mono\">(a) I was wondering whether …\n(b) It is worth noting that …\n(c) The fact that … means that …\u003c/pre>"}],"keys":{"P1":"\u003cp>(ii) is wrong. Inside a larger sentence the question stops being a question and becomes a noun clause, so it takes statement order: \u003cem>when the results would be published\u003c/em>. Keeping the inversion is the single most persistent error in learner English.\u003c/p>","P2":"\u003cp>All except \u003cstrong>discuss\u003c/strong>. You \u003cem>discuss something\u003c/em>, never \u003cem>discuss that …\u003c/em>. The others all take a clause: decided that, relieved that, clear that, explained that, suggest that.\u003c/p>","P3":"\u003cp>End weight. English puts short things first and long things last, so a clause eight words long sits badly in subject position. \u003cem>It\u003c/em> holds the subject slot open and lets the clause go where it is comfortable — and the reader meets the point (\u003cem>was clear\u003c/em>) before the detail.\u003c/p>","F1":"\u003cp>(a) Could you tell me where the meeting has been moved to?\u003c/p>\u003cp>(b) I am not sure whether she submitted the form.\u003c/p>\u003cp>(c) Nobody has said how much it will cost.\u003c/p>\u003cp>In all three: no inversion, no question mark, and in (b) \u003cem>did submit\u003c/em> collapses back to \u003cem>submitted\u003c/em>.\u003c/p>","F2":"\u003cp>(a) → I asked him what he wanted. (Inversion removed, and backshift after a past verb.)\u003c/p>\u003cp>(b) → It is obvious that we must change the plan.\u003c/p>\u003cp>(c) → He explained to me that … . \u003cem>explain\u003c/em> cannot take a person as its direct object; \u003cem>tell\u003c/em> can. He told me that … is fine.\u003c/p>\u003cp>(d) → I am not sure whether she will come.\u003c/p>","F3":"\u003cp>Models: \u003cem>I was wondering whether the deadline could be moved. · It is worth noting that attendance has risen every year. · The fact that nobody objected means that we can go ahead.\u003c/em>\u003c/p>\u003cp>All three are structures you will be given credit for in the written tasks, and all three are noun clauses.\u003c/p>"},"rows":[11,12,13,14,15,16,17,18]};</script>
