<script>window.ITEM={"kind":"exercise","id":"AD 034","slug":"ad-034","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Health and medicine · agree or disagree with a claim","payload":{"Strategy":"separate what a study measured from what it is cited for","Grammar":"hedged generalisation","Vocabulary":"surrogate endpoint, relative risk, absolute risk, power","Convention":"questioning a headline finding without rejecting the science"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Clara blames the statistics and Diego the transmission. Are they incompatible?\u003c/p>\u003cp>b.  What would improve the situation on each diagnosis?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish relative risk from absolute risk with an example.\u003c/p>\u003cp>b.  What is a surrogate endpoint, and why is it a risk?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State what the reader should actually do with such a report, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response prefers one diagnosis for a reason other than truth. What reason?\u003c/p>\u003cp>b.  The final sentence adds a third problem. What is it, and why is it placed last?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the paper says association, the press release says linked to, the headline says causes\" — what does the bare sequence achieve?\u003c/p>\u003cp>b.  \"nobody along the way has said anything they would have to retract\" — why is this the most damning clause in the paragraph?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No — they are consecutive. Clara describes a property of the measure, Diego a property of its transmission, and both are true.\u003c/p>\u003cp>b.  On Clara’s, statistical literacy among readers. On Diego’s, an intervention at a specific handover point. The second is far more tractable, which is the response’s argument.\u003c/p>","P2":"\u003cp>a.  If risk rises from 2 in 10,000 to 3 in 10,000, the relative risk is 50 per cent and the absolute increase is 1 in 10,000. Both are true; only one belongs in a headline.\u003c/p>\u003cp>b.  A measurable stand-in for the outcome you care about — cholesterol for heart attacks, tumour shrinkage for survival. It is a risk because interventions can move the surrogate without moving the outcome.\u003c/p>","P3":"\u003cp>Model: \"Find the absolute risk before reacting to the percentage, and check whether the study claims association or causation.\"\u003c/p>","F1":"\u003cp>a.  Tractability. Both diagnoses may be correct, but one yields an intervention at a single identifiable point and the other yields a thirty-year education programme that has already been tried. Preferring the actionable diagnosis is legitimate provided you say that is the criterion.\u003c/p>\u003cp>b.  Publication incentives — that the choice of question and the power of the study make a positive finding near certain. It goes last because it undermines the proposed remedy as well as the problem, and acknowledging that is more honest than closing on a tidy fix.\u003c/p>","F2":"\u003cp>a.  It enacts the drift it describes. Three clauses, three verbs, each a small step from the last, so the reader experiences the slide rather than being told about it.\u003c/p>\u003cp>b.  Because it rules out the comforting explanation. If nobody lied, the failure is in the structure rather than in anyone’s conduct — which means it will recur indefinitely unless the structure changes, and no amount of good faith prevents it.\u003c/p>","F3":"\u003cp>1.  Diego’s argument about the chain is never engaged; \"the media always exaggerate\" is a cruder version of it attributed to bad motive rather than structure.\u003c/p>\u003cp>2.  Industry funding is introduced as a third factor without evidence and without connection to the two positions on the table.\u003c/p>\u003cp>3.  \"Use common sense and follow a balanced diet\" abandons the question, which was how to read such reports. Language: \"the media\", \"the food industry\", \"the newspapers\" over-articled; \"anymore\" should be \"any more\".\u003c/p>"},"model":["Clara and Diego are describing two links in the same chain, and I think Diego has identified the one that breaks. Relative risk is not a distortion in the paper — it is the right measure for a question about mechanism, and the absolute figures are usually in the tables. What happens is that each handover drops a qualifier: the paper says association, the press release says linked to, the headline says causes, and nobody along the way has said anything they would have to retract.","That diagnosis has a practical upshot, which is what makes it worth preferring. If the problem were statistical naivety, the remedy would be educating readers, which has been tried for thirty years. If the problem is a chain in which each step is locally defensible, the remedy is structural: require the absolute risk in the press release, which is the single point where the number is still attached to the people who calculated it. I would add only that this tends to understate how much the original choice of question matters — a study powered to detect a small effect in a large cohort will find one, and finding one is what makes it publishable at all."],"model_html":"\u003cp>Clara and Diego are describing two links in the same chain, and I think Diego has identified the one that breaks. Relative risk is not a distortion in the paper — it is the right measure for a question about mechanism, and the absolute figures are usually in the tables. What happens is that each handover drops a qualifier: the paper says association, the press release says linked to, the headline says causes, and nobody along the way has said anything they would have to retract.\u003c/p>\u003cp>That diagnosis has a practical upshot, which is what makes it worth preferring. If the problem were statistical naivety, the remedy would be educating readers, which has been tried for thirty years. If the problem is a chain in which each step is locally defensible, the remedy is structural: require the absolute risk in the press release, which is the single point where the number is still attached to the people who calculated it. I would add only that this tends to understate how much the original choice of question matters — a study powered to detect a small effect in a large cohort will find one, and finding one is what makes it publishable at all.\u003c/p>","model_band":5,"degraded":["I agree with Clara that we should be sceptical about these studies because the media always exaggerate to get more clicks and attention. One day they say coffee is good for you and the next day they say it causes cancer, so people do not know what to believe anymore. Also many studies are financed by the food industry which has an interest in the results. In my opinion people should use common sense and follow a balanced diet instead of worrying about every new study that comes out in the newspapers."],"degraded_html":"\u003cp>I agree with Clara that we should be sceptical about these studies because the media always exaggerate to get more clicks and attention. One day they say coffee is good for you and the next day they say it causes cancer, so people do not know what to believe anymore. Also many studies are financed by the food industry which has an interest in the results. In my opinion people should use common sense and follow a balanced diet instead of worrying about every new study that comes out in the newspapers.\u003c/p>","degraded_band":3,"model_words":201,"fault_list":{"tag":"F3","faults":["Diego’s argument about the chain is never engaged; \"the media always exaggerate\" is a cruder version of it attributed to bad motive rather than structure.","Industry funding is introduced as a third factor without evidence and without connection to the two positions on the table.","\"Use common sense and follow a balanced diet\" abandons the question, which was how to read such reports. Language: \"the media\", \"the food industry\", \"the newspapers\" over-articled; \"anymore\" should be \"any more\"."],"html":["\u003cp>1.  Diego’s argument about the chain is never engaged; \"the media always exaggerate\" is a cruder version of it attributed to bad motive rather than structure.\u003c/p>","\u003cp>2.  Industry funding is introduced as a third factor without evidence and without connection to the two positions on the table.\u003c/p>","\u003cp>3.  \"Use common sense and follow a balanced diet\" abandons the question, which was how to read such reports. Language: \"the media\", \"the food industry\", \"the newspapers\" over-articled; \"anymore\" should be \"any more\".\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Reports regularly announce that a particular food or habit raises the risk of a disease by some percentage. Critics say these findings are routinely overstated. How should we read them?\u003c/p>","students":[["Clara","Sceptically, but not dismissively. Most are observational, the effect sizes are small, and the reported figure is almost always relative risk, which sounds enormous when the underlying risk is tiny."],["Diego","I would go further. The problem is not the studies, which usually state their limits, but the chain between the paper and the headline. Each step is individually reasonable and the output is routinely false."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Industry funding is introduced as a third factor without evidence and without connection to the two positions on the table.","correct":true},{"text":"“Use common sense and follow a balanced diet” abandons the question, which was how to read such reports. Language: “the media”, “the food industry”, “the newspapers” over-articled; “anymore” should be “any more”.","correct":true},{"text":"Language and register. “our shooting in 14-15 March” (our shoot on 14–15 March), “waiting for your answer”, and “Hi” to a committee you are asking a favour of.","correct":false},{"text":"Diego’s argument about the chain is never engaged; “the media always exaggerate” is a cruder version of it attributed to bad motive rather than structure.","correct":true},{"text":"No responsibility is taken — “my dissertation is taking much more time than I expected” presents the problem as something that happened to the writer, so the second bullet fails.","correct":false},{"text":"“I have tried to contact you several times” contradicts the instruction not to duplicate and is vague; nothing explains why email is being used now.","correct":false}],"key_html":"F3"}};</script>
