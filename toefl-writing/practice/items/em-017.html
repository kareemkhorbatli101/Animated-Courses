<script>window.ITEM={"kind":"exercise","id":"EM 017","slug":"em-017","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"a complaint about a person should still be about an event","Grammar":"reported speech for prior contact","Vocabulary":"allocate, duty of care, raise, informally","Convention":"complaining about staff conduct proportionately"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Two complaints are in play. Which is the main one, and what happens if you reverse them?\u003c/p>\u003cp>b.  Why say explicitly what you do not want?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Why \u003cem>I raised it\u003c/em> rather than \u003cem>I complained\u003c/em>?\u003c/p>\u003cp>b.  What is the difference between raising something \u003cem>informally\u003c/em> and \u003cem>making a formal complaint\u003c/em>?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Report the dismissive response in one sentence without an adjective about the person.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer reports an unhelpful exchange and then protects the staff member twice. Find both protections.\u003c/p>\u003cp>b.  The last sentence reframes the staff behaviour as a system problem. Why is that both kinder and more effective?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “I \u003cem>was told\u003c/em> that the lockers were not the desk’s responsibility”. Why the passive, and why the backshift to \u003cem>were\u003c/em>?\u003c/p>\u003cp>b.  “the conversation ended there” — what does this avoid saying?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The locker. Lead with the conduct and the email becomes a staff complaint, which goes to a different process, takes weeks, and still leaves your locker broken.\u003c/p>\u003cp>b.  Because an unqualified report of rudeness may trigger a formal process whether you want one or not. Saying what you are not asking for keeps the response proportionate — and it protects somebody who was probably just busy.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Raised\u003c/strong> describes bringing something to attention; \u003cem>complained\u003c/em> describes a grievance and implies a process. The first leaves you more room.\u003c/p>\u003cp>b.  Informally means mentioning it to someone who can fix it; formally means invoking a procedure with records, timescales and a right of reply. Most problems are solved in the first and ruined by reaching for the second too early.\u003c/p>","P3":"\u003cp>Model: \u003cem>I was told that the lockers were not the desk’s responsibility, and when I said they were all allocated, the conversation ended there.\u003c/em>\u003c/p>\u003cp>Everything is reported action. The reader forms the judgement you would otherwise have had to make yourself.\u003c/p>","F1":"\u003cp>a.  “I am sure it was a busy moment”, and “I am not asking for it to be taken any further”. The first supplies an excuse, the second rules out escalation.\u003c/p>\u003cp>b.  Kinder because it moves the fault from a person to a process. More effective because a process can be changed today, whereas a person’s manner takes months and may never reach you. It also makes the manager’s job easy, which is how things actually get done.\u003c/p>","F2":"\u003cp>a.  The passive keeps the individual out of subject position, so the sentence reports what was said rather than who said it. The backshift is automatic after a past reporting verb (family 2, structure 16) and marks the words as reported rather than endorsed.\u003c/p>\u003cp>b.  That the staff member walked away, or refused to engage. The phrase records the outcome and declines to characterise the behaviour — which is exactly the restraint that makes the complaint credible.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>The locker is secondary.\u003c/strong> The email is framed as a conduct complaint, so the actual remedy — repair or reallocation — is never requested. The third bullet fails.\u003c/p>\u003cp>2.  \u003cstrong>It prescribes the punishment.\u003c/strong> “this person needs training in customer service” is a recommendation about an employee the writer has no standing to make, and it guarantees a defensive reply.\u003c/p>\u003cp>3.  \u003cstrong>Unsupported characterisation.\u003c/strong> “extremely rude” and “just turned away” are judgements, not reports, and there are no dates for either conversation.\u003c/p>"},"model":["Dear Sport Centre,","Locker 212 in the main changing room has not locked since the middle of April — the mechanism turns but does not engage, so anything left in it is unsecured.","I mentioned it at the desk on 2 May and again on 15 May. On the second occasion I was told that the lockers were not the desk’s responsibility and that I should use a different one; when I said they were all allocated, the conversation ended there. I am sure it was a busy moment and I am not asking for it to be taken any further.","What I would like is simply for the locker to be repaired, or for me to be reallocated to one that works. It might also be worth the desk team knowing who to pass locker faults to, since it seemed genuinely unclear.","Thank you.","Best wishes,","Marek Dvorak — membership 7741"],"model_html":"\u003cp>Dear Sport Centre,\u003c/p>\u003cp>Locker 212 in the main changing room has not locked since the middle of April — the mechanism turns but does not engage, so anything left in it is unsecured.\u003c/p>\u003cp>I mentioned it at the desk on 2 May and again on 15 May. On the second occasion I was told that the lockers were not the desk’s responsibility and that I should use a different one; when I said they were all allocated, the conversation ended there. I am sure it was a busy moment and I am not asking for it to be taken any further.\u003c/p>\u003cp>What I would like is simply for the locker to be repaired, or for me to be reallocated to one that works. It might also be worth the desk team knowing who to pass locker faults to, since it seemed genuinely unclear.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Marek Dvorak — membership 7741\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I am writing to complain about one of your staff who was extremely rude to me when I told him about my broken locker. He told me it was not his problem and just turned away, which is unacceptable behaviour for someone working with the public. The locker 212 has been broken for one month and nobody is doing anything. I think this person needs training in customer service.","Marek"],"degraded_html":"\u003cp>Dear Sir/Madam, I am writing to complain about one of your staff who was extremely rude to me when I told him about my broken locker. He told me it was not his problem and just turned away, which is unacceptable behaviour for someone working with the public. The locker 212 has been broken for one month and nobody is doing anything. I think this person needs training in customer service.\u003c/p>\u003cp>Marek\u003c/p>","degraded_band":3,"model_words":150,"fault_list":{"tag":"F3","faults":["The locker is secondary. The email is framed as a conduct complaint, so the actual remedy — repair or reallocation — is never requested. The third bullet fails.","It prescribes the punishment. “this person needs training in customer service” is a recommendation about an employee the writer has no standing to make, and it guarantees a defensive reply.","Unsupported characterisation. “extremely rude” and “just turned away” are judgements, not reports, and there are no dates for either conversation."],"html":["\u003cp>1.  \u003cstrong>The locker is secondary.\u003c/strong> The email is framed as a conduct complaint, so the actual remedy — repair or reallocation — is never requested. The third bullet fails.\u003c/p>","\u003cp>2.  \u003cstrong>It prescribes the punishment.\u003c/strong> “this person needs training in customer service” is a recommendation about an employee the writer has no standing to make, and it guarantees a defensive reply.\u003c/p>","\u003cp>3.  \u003cstrong>Unsupported characterisation.\u003c/strong> “extremely rude” and “just turned away” are judgements, not reports, and there are no dates for either conversation.\u003c/p>"]},"scenario":"\u003cp>The gym locker you were allocated has not worked for a month. You have mentioned it twice at the desk; the second time the staff member was dismissive. You want the locker fixed and do not want anyone disciplined.\u003c/p>","bullets":["Report the fault.","Report what happened when you raised it.","Say what you want, and what you do not want."],"header":[["To:","sport@northgate.ac.uk"],["Subject:","Locker 212 — and a note about raising it"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Justice delayed is justice denied” is a slogan standing where the argument should be, and the final sentence addresses governments rather than the question. Language: “the justice system”, “the consequences”, “the digital evidence” over-articled.","correct":false},{"text":"It prescribes the punishment. “this person needs training in customer service” is a recommendation about an employee the writer has no standing to make, and it guarantees a defensive reply.","correct":true},{"text":"“Technology should serve people, not the other way round” is a slogan where a mechanism was needed.","correct":false},{"text":"Language: “the schools”, “the universities”, “the students themselves” over-articled; “make an effort and practise their writing” is vague; and the final sentence shifts to second person mid-paragraph.","correct":false},{"text":"Unsupported characterisation. “extremely rude” and “just turned away” are judgements, not reports, and there are no dates for either conversation.","correct":true},{"text":"The locker is secondary. The email is framed as a conduct complaint, so the actual remedy — repair or reallocation — is never requested. The third bullet fails.","correct":true}],"key_html":"F3"}};</script>
