<script>window.ITEM={"kind":"exercise","id":"AD 076","slug":"ad-076","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Journalism · agree / disagree","payload":{"Strategy":"distinguish a duty to report from a duty to publish","Grammar":"modal perfect for retrospective judgement","Vocabulary":"verification, public interest, embargo, source","Convention":"judging a publication decision"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Joy is not disputing the story. What is she separating?\u003c/p>\u003cp>b.  Why is the identification of the source a different question from publication?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is verification, and what is an embargo?\u003c/p>\u003cp>b.  What does public interest mean as a journalistic test?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that separates two decisions.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response agrees with Nils about the story. Why spend a paragraph on that before disagreeing?\u003c/p>\u003cp>b.  Why insist the test applies \"to each piece of information separately\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"The paper should have published the substance and withheld the name\" — why the modal perfect throughout this paragraph?\u003c/p>\u003cp>b.  \"the one person in the account who took a risk to make it possible\" — what does this phrasing achieve?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The decision to publish the substance from the decision to identify the source. She accepts the first and objects only to the second.\u003c/p>\u003cp>b.  Because the source’s identity carries no public interest of its own, while publishing it imposes a severe cost on one identifiable person. The two pieces of information have to be justified separately.\u003c/p>","P2":"\u003cp>a.  Verification is independently establishing that material is genuine; an embargo is an agreed delay before publication.\u003c/p>\u003cp>b.  That the value of the information to the public outweighs the harm or the breach involved in obtaining and publishing it.\u003c/p>","P3":"\u003cp>Model: \"Publishing the falsified records was justified; naming the employee who leaked them was not, because that name served no public interest.\"\u003c/p>","F1":"\u003cp>a.  Because Nils’s argument is correct as far as it goes, and conceding it fully removes any suggestion that the objection is squeamishness about leaks. The disagreement then lands precisely where it belongs.\u003c/p>\u003cp>b.  Because a package test lets a strong justification for one element carry everything published alongside it. Applying it item by item is what exposes the identification as unjustified while leaving the story intact.\u003c/p>","F2":"\u003cp>a.  Because the decision has already been taken and the question is retrospective. \"Should have published ... could have done so\" evaluates a completed act, which is what the prompt asks for, rather than recommending a policy.\u003c/p>\u003cp>b.  It locates the cost on a specific person and notes what they did for the story, so the objection is not abstract ethics but a concrete unfairness. It also contrasts their exposure with the official’s, which is the point.\u003c/p>","F3":"\u003cp>1.  Joy’s distinction is acknowledged and then dissolved — \"the public interest must come first\" answers a question about the story with a claim that is supposed to cover the name as well.\u003c/p>\u003cp>2.  \"We should not criticise journalists for doing their job\" declines the evaluation the prompt requests.\u003c/p>\u003cp>3.  \"Unfortunate for that person\" treats a serious and avoidable harm as a side effect, and nothing is said about whether the name was necessary to the story.\u003c/p>"},"model":["Joy has the sharper analysis, and the reason is that two decisions have been collapsed into one and only the first of them was defensible.","Nils is right about the story. A documented lie about a safety inspection is squarely in the public interest, and the manner of acquisition does not weigh against publishing what the documents show. A paper that declined would have been protecting the official, whatever it told itself.","But identifying the employee served no part of that interest. Readers needed to know that the inspection records had been falsified; they did not need to know who photocopied them. The paper should have published the substance and withheld the name, and it could have done so without weakening the story at all — provenance can be attested without being disclosed.","So my position is that the public-interest test applies to each piece of information separately, not to the story as a package. Nils’s argument justifies the first decision and is silent on the second, which is how a paper ends up exposing the one person in the account who took a risk to make it possible."],"model_html":"\u003cp>Joy has the sharper analysis, and the reason is that two decisions have been collapsed into one and only the first of them was defensible.\u003c/p>\u003cp>Nils is right about the story. A documented lie about a safety inspection is squarely in the public interest, and the manner of acquisition does not weigh against publishing what the documents show. A paper that declined would have been protecting the official, whatever it told itself.\u003c/p>\u003cp>But identifying the employee served no part of that interest. Readers needed to know that the inspection records had been falsified; they did not need to know who photocopied them. The paper should have published the substance and withheld the name, and it could have done so without weakening the story at all — provenance can be attested without being disclosed.\u003c/p>\u003cp>So my position is that the public-interest test applies to each piece of information separately, not to the story as a package. Nils’s argument justifies the first decision and is silent on the second, which is how a paper ends up exposing the one person in the account who took a risk to make it possible.\u003c/p>","model_band":5,"degraded":["I agree that the newspaper was right to publish because the public has a right to know when officials lie, especially about something as important as safety. Journalism plays an essential role in holding power accountable and we should not criticise journalists for doing their job. Joy makes a fair point about the leaker and I agree it was unfortunate for that person, but ultimately the public interest must come first and the story was clearly in the public interest."],"degraded_html":"\u003cp>I agree that the newspaper was right to publish because the public has a right to know when officials lie, especially about something as important as safety. Journalism plays an essential role in holding power accountable and we should not criticise journalists for doing their job. Joy makes a fair point about the leaker and I agree it was unfortunate for that person, but ultimately the public interest must come first and the story was clearly in the public interest.\u003c/p>","degraded_band":3,"model_words":189,"fault_list":{"tag":"F3","faults":["Joy’s distinction is acknowledged and then dissolved — \"the public interest must come first\" answers a question about the story with a claim that is supposed to cover the name as well.","\"We should not criticise journalists for doing their job\" declines the evaluation the prompt requests.","\"Unfortunate for that person\" treats a serious and avoidable harm as a side effect, and nothing is said about whether the name was necessary to the story."],"html":["\u003cp>1.  Joy’s distinction is acknowledged and then dissolved — \"the public interest must come first\" answers a question about the story with a claim that is supposed to cover the name as well.\u003c/p>","\u003cp>2.  \"We should not criticise journalists for doing their job\" declines the evaluation the prompt requests.\u003c/p>","\u003cp>3.  \"Unfortunate for that person\" treats a serious and avoidable harm as a side effect, and nothing is said about whether the name was necessary to the story.\u003c/p>"]},"prof_name":"Professor Oyelaran","professor":"\u003cp>A newspaper obtained and published documents showing that a public official had lied about a safety inspection. The documents were leaked in breach of confidentiality, and publication identified the junior employee who leaked them. Was publication justified?\u003c/p>","students":[["Nils","Yes. The lie was about public safety. A newspaper that sits on that because of how it arrived has confused its own comfort with ethics."],["Joy","The story was justified; identifying the leaker was not. They published the public interest and the source in the same breath, and only one of those was necessary."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Could you explain these things to me please” asks for an explanation of a contract rather than three facts, which is both more work for the reader and less useful to the writer.","correct":false},{"text":"“Unfortunate for that person” treats a serious and avoidable harm as a side effect, and nothing is said about whether the name was necessary to the story.","correct":true},{"text":"“A very difficult month” and “extremely busy with exams and revision” are vague where exact dates were available, so the decline sounds like reluctance.","correct":false},{"text":"“Could you move your afternoons so that I can have ...” asks him to absorb the whole adjustment, and “Let me know if this is OK” presents a single option as a decision already taken.","correct":false},{"text":"Joy’s distinction is acknowledged and then dissolved — “the public interest must come first” answers a question about the story with a claim that is supposed to cover the name as well.","correct":true},{"text":"“We should not criticise journalists for doing their job” declines the evaluation the prompt requests.","correct":true}],"key_html":"F3"}};</script>
