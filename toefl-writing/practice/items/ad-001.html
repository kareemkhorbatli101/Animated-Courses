<script>window.ITEM={"kind":"exercise","id":"AD 001","slug":"ad-001","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Education · agree or disagree with a claim · anchor item","payload":{"Strategy":"concede the evidence, dispute what it is evidence of","Grammar":"the concessive while, fronted","Vocabulary":"proxy, attainment, correlate, confound","Convention":"disagreeing with a classmate without correcting them"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Write down in one phrase what each of them is actually claiming.\u003c/p>\u003cp>b.  Lucia does not deny that the data is comparable. What does she deny instead?\u003c/p>\u003cp class=\"note\">When one speaker argues about whether information exists and the other about what it measures, they are not contradicting each other. That gap is where your contribution goes.\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  A measurement used because the thing you actually care about cannot be measured directly is called a p______ .\u003c/p>\u003cp>b.  Two things that move together are c________ ; a hidden third factor that explains both is a c________ .\u003c/p>\u003cp>c.  Which noun does education use for what pupils achieve: \u003c/p>\u003cpre class=\"mono\">attainment · achievement · progress · value added\u003c/pre>\u003cp>and which one would answer Lucia’s objection?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, grant Lucia’s point completely and then show that it argues for a different kind of publication rather than for none. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Commit to a position","html":"\u003cp>Ten minutes, the whole response. First write in the margin: \u003c/p>\u003cp class=\"note\">The one thing I will say that neither Hassan nor Lucia has said is …\u003c/p>"},{"tag":"P5","title":"Predict the pitfall","html":"\u003cp>Which opening cannot reach band 5?\u003c/p>\u003cpre class=\"mono\">(A) Lucia is right that raw rankings measure intake, but that\n    is an argument about which figure to publish, not whether\n    to publish.\n(B) Both Hassan and Lucia raise important points, and there\n    are advantages and disadvantages on both sides.\n(C) I agree with Lucia. League tables are unfair to schools\n    in poor areas.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Give each of the five sentences a one-word job.\u003c/p>\u003cp>b.  Which sentence is the contribution — the thing neither classmate said?\u003c/p>\u003cp>c.  The response disagrees with both of them. Find the two different ways it does so, and say which is gentler.\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “While a league table of final grades does little more than rediscover the catchment, a measure of progress does not.” What does \u003cem>does not\u003c/em> stand in for, and why is the ellipsis worth the words it saves?\u003c/p>\u003cp>b.  “Publish raw grades and they recruit selectively.” There is no \u003cem>if\u003c/em> here. Rewrite it as a conditional and say what the imperative version gains.\u003c/p>\u003cp>c.  “no measure survives being made the target” — identify the two non-finite forms stacked after \u003cem>survives\u003c/em>.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>rediscover the catchment\u003c/em> — what is the figure of speech, and what does it accuse the league table of?\u003c/p>\u003cp>b.  Why \u003cem>optimise\u003c/em> rather than \u003cem>improve\u003c/em>?\u003c/p>\u003cp>c.  The last clause says \u003cem>rank by none\u003c/em> rather than \u003cem>not rank them\u003c/em>. What has the parallel with \u003cem>publish several\u003c/em> bought?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A different discussion: should universities publish graduate salary data by degree subject? One classmate says yes, for informed choice; another says it will kill the humanities. In 50 words, grant the second classmate’s premise and show it points somewhere neither of them went.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Hassan: \u003cem>imperfect comparable information beats no information\u003c/em>. Lucia: \u003cem>this particular measure is not information about schools at all\u003c/em>.\u003c/p>\u003cp>b.  She denies that it measures \u003cstrong>the school\u003c/strong>. Her objection is about validity, not fairness — the number is reliable and comparable, and still tells you about the neighbourhood rather than the teaching.\u003c/p>\u003cp>Hassan is arguing that something is better than nothing; Lucia is arguing that this is not a something. Both can be right at once, and the response exploits exactly that.\u003c/p>","P2":"\u003cp>a.  a \u003cstrong>proxy\u003c/strong>.\u003c/p>\u003cp>b.  \u003cstrong>correlated\u003c/strong> ; a \u003cstrong>confounder\u003c/strong> (or confounding variable).\u003c/p>\u003cp>c.  \u003cstrong>Value added\u003c/strong> answers her — it is the technical term for progress between entry and exit, with intake controlled for. Knowing the field’s own term for the thing you are proposing is worth a great deal: it is the difference between having an idea and knowing it already exists.\u003c/p>","P3":"\u003cp>Model: \u003cem>Lucia is right that raw rankings measure intake, but that is an argument about which figure to publish rather than about whether to publish anything.\u003c/em>\u003c/p>\u003cp>The move is to accept the premise in full and attack the inference. You have conceded a fact and given up no ground at all, because the fact never supported her conclusion.\u003c/p>","P4":"\u003cp>No single answer. The test: cover both classmates’ posts and read yours alone. If it still says something, you contributed. If it collapses into “yes, what Lucia said”, you did not.\u003c/p>","P5":"\u003cp>\u003cstrong>(B) and (C) both fail.\u003c/strong>\u003c/p>\u003cp>(C) agrees and restates. It can reach a hundred words without adding anything, and the task asks for a contribution in your own words.\u003c/p>\u003cp>(B) is the both-sides opening, which sounds balanced and is empty. It postpones the position, and in ten minutes you may never arrive at one.\u003c/p>\u003cp>(A) names the strongest opposing argument, grants it, and turns it inside the first sentence.\u003c/p>","F1":"\u003cp>a.  Concede · reframe · propose · complicate · conclude.\u003c/p>\u003cp>b.  “no measure survives being made the target”. Hassan argued about availability, Lucia about validity; neither raised what happens to a measure once schools know they are judged by it.\u003c/p>\u003cp>c.  Lucia is contradicted on an inference (\u003cem>that is an argument about which figure\u003c/em>); Hassan is contradicted on a diagnosis (\u003cem>the deeper problem … is not that the data is unfair but that\u003c/em>). The second is gentler, because it accepts his position and claims only to go further than it.\u003c/p>","F2":"\u003cp>a.  It stands in for \u003cem>does not do little more than rediscover the catchment\u003c/em> — which is unsayable. The ellipsis saves the reader from a triple negative and keeps the contrast sharp, which is exactly the job of ellipsis in coordination (family 9, structure 73).\u003c/p>\u003cp>b.  Conditional: \u003cem>If you publish raw grades, they will recruit selectively.\u003c/em> The imperative version is shorter, puts the two halves in parallel with the next clause, and reads as a demonstration rather than a prediction — you are inviting the reader to run the experiment.\u003c/p>\u003cp>c.  A gerund (\u003cem>being made\u003c/em>) which is itself passive, governing a past participle. \u003cem>Survive\u003c/em> takes a gerund directly, with no preposition.\u003c/p>","F3":"\u003cp>a.  It is ironic understatement: the table claims to discover something about schools and in fact rediscovers something already known about neighbourhoods. The accusation is not that it is wrong but that it is redundant — a sharper charge, and harder to answer.\u003c/p>\u003cp>b.  \u003cem>Optimise\u003c/em> is neutral about whether the result is good. Schools made to optimise a number will raise the number, which is not the same as improving. The whole argument of the last two sentences lives inside that distinction.\u003c/p>\u003cp>c.  A matched pair — \u003cem>publish several\u003c/em> / \u003cem>rank by none\u003c/em> — so the conclusion arrives as a single balanced formula rather than as two separate recommendations. Parallelism makes a proposal sound considered.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It is not a contribution.\u003c/strong> It opens by agreeing with Lucia and then restates her argument at length. The one original thought — that parents could visit schools — is dropped after half a sentence and never developed.\u003c/p>\u003cp>2.  \u003cstrong>Padding and an irrelevant appeal.\u003c/strong> “In my opinion” twice, and “in my country … the education system is working fine”, which is an anecdote offered as evidence for a causal claim it cannot support. The descriptor’s wording is \u003cem>part of an explanation, example or detail may be missing, unclear or irrelevant\u003c/em>.\u003c/p>\u003cp>3.  \u003cstrong>Accumulated error.\u003c/strong> “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.\u003c/p>","F5":"\u003cp>Model: \u003cem>The worry about the humanities is well founded, but it is an objection to publishing salary alone. Publish salary beside employment rate, further study and reported satisfaction, and the subject that looks poor on one axis is often strong on another — which is the information applicants actually need.\u003c/em>\u003c/p>\u003cp>The same move as the model: grant the premise, then show it indicts the narrowness of the measure rather than the act of publishing.\u003c/p>"},"model":["Lucia is right that raw rankings largely measure intake, but I think that is an argument about which figure to publish rather than about whether to publish anything. While a league table of final grades does little more than rediscover the catchment, a measure of progress between entry and exit does not: it asks what the school added, and on that measure the wealthy school often does rather badly.","So I would keep publication and change the number. The deeper problem with Hassan’s position is not that the data is unfair but that any single published figure becomes the thing schools optimise. Publish raw grades and they recruit selectively; publish progress and they will find the children whose entry scores can be depressed. The honest conclusion is that no measure survives being made the target, which is a reason to publish several and rank by none."],"model_html":"\u003cp>Lucia is right that raw rankings largely measure intake, but I think that is an argument about which figure to publish rather than about whether to publish anything. While a league table of final grades does little more than rediscover the catchment, a measure of progress between entry and exit does not: it asks what the school added, and on that measure the wealthy school often does rather badly.\u003c/p>\u003cp>So I would keep publication and change the number. The deeper problem with Hassan’s position is not that the data is unfair but that any single published figure becomes the thing schools optimise. Publish raw grades and they recruit selectively; publish progress and they will find the children whose entry scores can be depressed. The honest conclusion is that no measure survives being made the target, which is a reason to publish several and rank by none.\u003c/p>","model_band":5,"degraded":["I agree with Lucia’s opinion about this topic. In my opinion the league tables are not fair because the schools in the rich areas always get the best results and the schools in the poor areas get the bad results, so the table is not showing the quality of the teaching. Also Hassan said that parents need information but I think they can visit the school and talk with the teachers to know if it is good. In my country there are no league tables and the education system is working fine. So I believe that the government should stop publishing these tables because they are giving a wrong picture to the parents."],"degraded_html":"\u003cp>I agree with Lucia’s opinion about this topic. In my opinion the league tables are not fair because the schools in the rich areas always get the best results and the schools in the poor areas get the bad results, so the table is not showing the quality of the teaching. Also Hassan said that parents need information but I think they can visit the school and talk with the teachers to know if it is good. In my country there are no league tables and the education system is working fine. So I believe that the government should stop publishing these tables because they are giving a wrong picture to the parents.\u003c/p>","degraded_band":3,"model_words":146,"fault_list":{"tag":"F4","faults":["It is not a contribution. It opens by agreeing with Lucia and then restates her argument at length. The one original thought — that parents could visit schools — is dropped after half a sentence and never developed.","Padding and an irrelevant appeal. “In my opinion” twice, and “in my country … the education system is working fine”, which is an anecdote offered as evidence for a causal claim it cannot support. The descriptor’s wording is part of an explanation, example or detail may be missing, unclear or irrelevant.","Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less."],"html":["\u003cp>1.  \u003cstrong>It is not a contribution.\u003c/strong> It opens by agreeing with Lucia and then restates her argument at length. The one original thought — that parents could visit schools — is dropped after half a sentence and never developed.\u003c/p>","\u003cp>2.  \u003cstrong>Padding and an irrelevant appeal.\u003c/strong> “In my opinion” twice, and “in my country … the education system is working fine”, which is an anecdote offered as evidence for a causal claim it cannot support. The descriptor’s wording is \u003cem>part of an explanation, example or detail may be missing, unclear or irrelevant\u003c/em>.\u003c/p>","\u003cp>3.  \u003cstrong>Accumulated error.\u003c/strong> “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.\u003c/p>"]},"prof_name":"Professor Adeyemi","professor":"\u003cp>Several countries now publish school league tables based on examination results, on the argument that parents cannot choose well without comparable information. Others have abandoned them, saying they distort what schools do. What do you think — should school performance data be published in ranked form? Why or why not?\u003c/p>","students":[["Hassan","I think publication is clearly right. Parents are making one of the biggest decisions of their child’s life, often with nothing to go on but a school’s own brochure. Whatever the imperfections of exam data, it is at least the same measure applied to everyone."],["Lucia","I disagree. Ranking schools by raw results mostly ranks their intakes. A school in a wealthy catchment will top the table whatever its teaching, and a school doing remarkable work with difficult intakes will look like a failure. That is not information; it is a map of house prices."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Consequential language errors. “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped that response was a verb-tense failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are.","correct":false},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":true},{"text":"“I am waiting to continue my work” is pressure and probably untrue, and “as soon as possible” plus “when I can expect them” asks a busy supervisor to commit to a date.","correct":false},{"text":"Padding and an irrelevant appeal. “In my opinion” twice, and “in my country … the education system is working fine”, which is an anecdote offered as evidence for a causal claim it cannot support. The descriptor’s wording is part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":true},{"text":"It is not a contribution. It opens by agreeing with Lucia and then restates her argument at length. The one original thought — that parents could visit schools — is dropped after half a sentence and never developed.","correct":true},{"text":"Language and register. “dirty and disgusting”, “really not acceptable”, “one time per week” (once a week), “Please solve this problem as soon as possible”, and a long comma splice through “anything, they leave their plates for days, it is really”.","correct":false}],"key_html":"F4"}};</script>
