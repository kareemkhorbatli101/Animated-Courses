<script>window.ITEM={"kind":"exercise","id":"EM 076","slug":"em-076","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Proposal and solving a problem","payload":{"Strategy":"propose a measurement before proposing a solution","Grammar":"conditional consequence","Vocabulary":"baseline, pilot, uptake, iterate","Convention":"proposing when you do not yet know the cause"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are arguing against doing something. How do you avoid sounding obstructive?\u003c/p>\u003cp>b.  What makes a diagnosis cheap enough to be worth doing first?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a baseline, and why do you need one before changing anything?\u003c/p>\u003cp>b.  What does it mean to iterate on a format?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Propose the diagnostic step in one sentence that includes its cost.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer lists four alternative causes. What does the list do?\u003c/p>\u003cp>b.  The last line offers to help with the thing being argued against. Why?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"we will have spent the one intervention we can easily make\" — what does the metaphor of spending contribute?\u003c/p>\u003cp>b.  \"If it comes back saying Tuesday at four is the problem, we move it on much firmer ground\" — what does this concede?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By proposing something rather than only objecting, and by making the proposed step small, fast and performed by you. An objection with a cheaper alternative attached is a contribution; an objection alone is an obstacle.\u003c/p>\u003cp>b.  It has to cost less than the risk it removes. Ten minutes of writing against a term of disruption is an easy case, and saying the numbers is what makes it obvious.\u003c/p>","P2":"\u003cp>a.  A measurement of the current state. Without one you cannot tell whether a change helped, so you lose the information the change would have given you.\u003c/p>\u003cp>b.  To make small successive adjustments, testing after each, rather than one large change — which requires knowing what moved.\u003c/p>","P3":"\u003cp>Model: \"Four questions on the mailing list, ten minutes to write, and I am happy to do it and summarise the answers.\"\u003c/p>","F1":"\u003cp>a.  It converts a bare doubt into a demonstration that the proposed fix addresses one of several candidate causes. The reader can see the odds for themselves rather than being asked to accept the writer’s scepticism.\u003c/p>\u003cp>b.  Because the decision is hers and the email has made its case. Offering to help with the alternative shows the objection is about the department rather than about winning the argument — and it costs nothing, since the work would happen anyway.\u003c/p>","F2":"\u003cp>a.  It frames the move as a scarce resource rather than a free action. You can only reasonably move a seminar once; using that move on an untested hypothesis forecloses using it on the right one.\u003c/p>\u003cp>b.  That the organiser may well be right. Conceding the likeliest outcome of the diagnosis removes the suspicion that the writer is using a survey to block a decision they dislike.\u003c/p>","F3":"\u003cp>1.  It substitutes one untested hypothesis for another. The specialisation theory is asserted with no more evidence than the day theory it objects to, so the second bullet fails.\u003c/p>\u003cp>2.  No diagnostic step is proposed and nothing is costed, so the third bullet fails — the email is an opinion against another opinion.\u003c/p>\u003cp>3.  \"I do not think this will solve the problem\" opens on contradiction with no alternative yet offered, and the proposed remedy — invite different speakers — is far more work than the thing being objected to.\u003c/p>"},"model":["Dear Professor Kaur,","I gather the plan is to move the seminar to Thursday. Before anyone does the work of rearranging it, could I suggest finding out why people have stopped coming?","The reason I am cautious is that Thursday only helps if the problem is the day. If it is the hour, the room, the length, or that the speakers this term have been outside most people’s area, moving it will cost a term of disruption and change nothing — and we will have spent the one intervention we can easily make.","What I would suggest is four questions in an email to the mailing list: do you come, if not why not, what time would work, and what would make it worth an hour. That is ten minutes to write and I am happy to write it, collate the answers and send you a one-page summary. If it comes back saying Tuesday at four is the problem, we move it on much firmer ground, and we will know what else to change at the same time.","If you would rather just move it, I will of course help with that instead.","Best wishes,","Tomas Reyes — third year"],"model_html":"\u003cp>Dear Professor Kaur,\u003c/p>\u003cp>I gather the plan is to move the seminar to Thursday. Before anyone does the work of rearranging it, could I suggest finding out why people have stopped coming?\u003c/p>\u003cp>The reason I am cautious is that Thursday only helps if the problem is the day. If it is the hour, the room, the length, or that the speakers this term have been outside most people’s area, moving it will cost a term of disruption and change nothing — and we will have spent the one intervention we can easily make.\u003c/p>\u003cp>What I would suggest is four questions in an email to the mailing list: do you come, if not why not, what time would work, and what would make it worth an hour. That is ten minutes to write and I am happy to write it, collate the answers and send you a one-page summary. If it comes back saying Tuesday at four is the problem, we move it on much firmer ground, and we will know what else to change at the same time.\u003c/p>\u003cp>If you would rather just move it, I will of course help with that instead.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Tomas Reyes — third year\u003c/p>","model_band":5,"degraded":["Dear Professor Kaur, I heard that you are planning to move the seminar to Thursday but I do not think this will solve the problem. In my opinion people are not coming because the topics are too specialised and not interesting for most of the department, so changing the day will not make any difference. I think we should invite more speakers from other fields and make the seminars more accessible for students who are not specialists.","Tomas"],"degraded_html":"\u003cp>Dear Professor Kaur, I heard that you are planning to move the seminar to Thursday but I do not think this will solve the problem. In my opinion people are not coming because the topics are too specialised and not interesting for most of the department, so changing the day will not make any difference. I think we should invite more speakers from other fields and make the seminars more accessible for students who are not specialists.\u003c/p>\u003cp>Tomas\u003c/p>","degraded_band":3,"model_words":199,"fault_list":{"tag":"F3","faults":["It substitutes one untested hypothesis for another. The specialisation theory is asserted with no more evidence than the day theory it objects to, so the second bullet fails.","No diagnostic step is proposed and nothing is costed, so the third bullet fails — the email is an opinion against another opinion.","\"I do not think this will solve the problem\" opens on contradiction with no alternative yet offered, and the proposed remedy — invite different speakers — is far more work than the thing being objected to."],"html":["\u003cp>1.  It substitutes one untested hypothesis for another. The specialisation theory is asserted with no more evidence than the day theory it objects to, so the second bullet fails.\u003c/p>","\u003cp>2.  No diagnostic step is proposed and nothing is costed, so the third bullet fails — the email is an opinion against another opinion.\u003c/p>","\u003cp>3.  \"I do not think this will solve the problem\" opens on contradiction with no alternative yet offered, and the proposed remedy — invite different speakers — is far more work than the thing being objected to.\u003c/p>"]},"scenario":"\u003cp>Attendance at your department’s weekly seminar has halved. Nobody knows why. The organiser is talking about moving it to a different day, which would be a lot of work and might not help.\u003c/p>","bullets":["Say what is being proposed and why you are cautious.","Propose finding out first.","Make the finding-out cheap."],"header":[["To:","seminars.phys@northgate.ac.uk"],["Subject:","Before we move the seminar — could we ask first?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“I do not think this will solve the problem” opens on contradiction with no alternative yet offered, and the proposed remedy — invite different speakers — is far more work than the thing being objected to.","correct":true},{"text":"“Most people are honest and would not waste their time” answers Ren’s incentive argument with an assertion about character, and ignores that firms settle rather than litigate regardless of the claim’s merit.","correct":false},{"text":"No diagnostic step is proposed and nothing is costed, so the third bullet fails — the email is an opinion against another opinion.","correct":true},{"text":"It takes no position. “Both have good arguments” followed by a compromise that neither would dispute.","correct":false},{"text":"It substitutes one untested hypothesis for another. The specialisation theory is asserted with no more evidence than the day theory it objects to, so the second bullet fails.","correct":true},{"text":"“If some healthy students are contacted unnecessarily that is not a serious problem” asserts what the question asks us to weigh, with no account of what being contacted would involve.","correct":false}],"key_html":"F3"}};</script>
