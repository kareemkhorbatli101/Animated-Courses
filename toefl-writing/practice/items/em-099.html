<script>window.ITEM={"kind":"exercise","id":"EM 099","slug":"em-099","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline for the group without disparaging the request","Grammar":"hedged assertions","Vocabulary":"bandwidth, remit, pro bono, in kind","Convention":"declining a repeat request from a regular partner"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why is \"we are too busy\" risky with a regular partner?\u003c/p>\u003cp>b.  What does the school actually need from you?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does pro bono mean, and what is support in kind?\u003c/p>\u003cp>b.  What is bandwidth in this sense, and is it appropriate here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline in one sentence that names the specific clash.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  \"the fourth ask and the first no\" — why count?\u003c/p>\u003cp>b.  Three substitutes are offered, of decreasing cost to the school. What is that structure doing?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is the only three weeks in the year we have nobody\" — why this sentence immediately after the refusal?\u003c/p>\u003cp>b.  \"since I am not sitting exams\" — why explain the one exception?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because a regular partner has heard it before and cannot distinguish it from losing interest. A specific, dated clash is verifiable; busyness is what people say when they are withdrawing.\u003c/p>\u003cp>b.  Something for their pupils in June, and confidence that the partnership continues. The first can be met without volunteers; the second needs dates.\u003c/p>","P2":"\u003cp>a.  Pro bono is professional work done free; support in kind is help given as goods or services rather than money — which is what the workshop pack is.\u003c/p>\u003cp>b.  Bandwidth means available capacity. It is office jargon and would read as evasive here, where a named exam period is available.\u003c/p>","P3":"\u003cp>Model: \"We cannot run the June session — our volunteers are the students sitting Northgate finals from 3 to 19 June.\"\u003c/p>","F1":"\u003cp>a.  Because the school is keeping score whether or not it says so, and naming the ratio shows the writer knows what a first refusal looks like from the other side. It also makes the reassurance that follows credible rather than routine.\u003c/p>\u003cp>b.  It lets the school take as much as it can use. The pack costs them staff time, the call costs twenty minutes, the assembly costs nothing — so there is almost certainly one they will accept, which is what keeps a no from reading as nothing.\u003c/p>","F2":"\u003cp>a.  Because it bounds the refusal. Without it, \"our volunteers are students\" sounds like a permanent constraint that will recur every time; with it, the no is confined to three weeks and the autumn offer becomes plausible.\u003c/p>\u003cp>b.  Because offering to come personally after declining on behalf of the group would otherwise look inconsistent. The clause shows the constraint is real and applies to the volunteers rather than to the writer’s willingness.\u003c/p>","F3":"\u003cp>1.  \"A very difficult month\" and \"extremely busy with exams and revision\" are vague where exact dates were available, so the decline sounds like reluctance.\u003c/p>\u003cp>2.  Nothing is offered for June and no autumn dates are proposed, so the third bullet fails and the partnership is left on \"please do keep us in mind\".\u003c/p>\u003cp>3.  \"I do not think we will be able to manage\" hedges a decision that is actually certain, which leaves the school unsure whether to plan around it; there is also a comma splice in the opening sentence.\u003c/p>"},"model":["Dear Ms Dunne,","We cannot run the June session, and the reason is narrow: our volunteers are the students sitting Northgate finals from 3 to 19 June. It is the only three weeks in the year we have nobody.","I am conscious this is the fourth ask and the first no, so I want to be clear it is a calendar problem rather than a change of heart. The autumn series is the part of our year we plan around Fairfield, and I would like to put three dates in now — 8, 15 and 22 October — so it is in both diaries before term starts.","For June itself, two things we can do without volunteers on site. I can send the full workshop pack — slides, worksheets and the telescope-building instructions — for your own staff to run, and I am happy to do a twenty-minute video call with whoever delivers it so they are not working from paper alone. If a Year 9 assembly talk in late June would help, I can do that myself, since I am not sitting exams.","Sorry it is a no this time.","Best wishes,","Dev Kapoor — Northgate Astronomy Outreach"],"model_html":"\u003cp>Dear Ms Dunne,\u003c/p>\u003cp>We cannot run the June session, and the reason is narrow: our volunteers are the students sitting Northgate finals from 3 to 19 June. It is the only three weeks in the year we have nobody.\u003c/p>\u003cp>I am conscious this is the fourth ask and the first no, so I want to be clear it is a calendar problem rather than a change of heart. The autumn series is the part of our year we plan around Fairfield, and I would like to put three dates in now — 8, 15 and 22 October — so it is in both diaries before term starts.\u003c/p>\u003cp>For June itself, two things we can do without volunteers on site. I can send the full workshop pack — slides, worksheets and the telescope-building instructions — for your own staff to run, and I am happy to do a twenty-minute video call with whoever delivers it so they are not working from paper alone. If a Year 9 assembly talk in late June would help, I can do that myself, since I am not sitting exams.\u003c/p>\u003cp>Sorry it is a no this time.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Dev Kapoor — Northgate Astronomy Outreach\u003c/p>","model_band":5,"degraded":["Dear Ms Dunne, Thank you very much for inviting us again, we always enjoy working with Fairfield. Unfortunately June is a very difficult month for us as our volunteers are all students and they are extremely busy with exams and revision at that time. I am really sorry but I do not think we will be able to manage a workshop in June this year. I hope we can work together again soon and please do keep us in mind for future events.","Dev"],"degraded_html":"\u003cp>Dear Ms Dunne, Thank you very much for inviting us again, we always enjoy working with Fairfield. Unfortunately June is a very difficult month for us as our volunteers are all students and they are extremely busy with exams and revision at that time. I am really sorry but I do not think we will be able to manage a workshop in June this year. I hope we can work together again soon and please do keep us in mind for future events.\u003c/p>\u003cp>Dev\u003c/p>","degraded_band":3,"model_words":196,"fault_list":{"tag":"F3","faults":["\"A very difficult month\" and \"extremely busy with exams and revision\" are vague where exact dates were available, so the decline sounds like reluctance.","Nothing is offered for June and no autumn dates are proposed, so the third bullet fails and the partnership is left on \"please do keep us in mind\".","\"I do not think we will be able to manage\" hedges a decision that is actually certain, which leaves the school unsure whether to plan around it; there is also a comma splice in the opening sentence."],"html":["\u003cp>1.  \"A very difficult month\" and \"extremely busy with exams and revision\" are vague where exact dates were available, so the decline sounds like reluctance.\u003c/p>","\u003cp>2.  Nothing is offered for June and no autumn dates are proposed, so the third bullet fails and the partnership is left on \"please do keep us in mind\".\u003c/p>","\u003cp>3.  \"I do not think we will be able to manage\" hedges a decision that is actually certain, which leaves the school unsure whether to plan around it; there is also a comma splice in the opening sentence.\u003c/p>"]},"scenario":"\u003cp>A school you have run three workshops for asks for a fourth, in exam week. Your volunteers are students sitting those exams. You want the partnership to continue.\u003c/p>","bullets":["Decline this one.","Protect the partnership.","Offer something that costs you less."],"header":[["To:","enrichment@fairfieldschool.org"],["Subject:","June workshop — not this time, but here is what we can do"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Clever or stupid” misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered.","correct":false},{"text":"Nothing is offered for June and no autumn dates are proposed, so the third bullet fails and the partnership is left on “please do keep us in mind”.","correct":true},{"text":"“I do not think we will be able to manage” hedges a decision that is actually certain, which leaves the school unsure whether to plan around it; there is also a comma splice in the opening sentence.","correct":true},{"text":"Language: “the universities”, “the stigma”, “the admission decision” over-articled; “suffer in silence” and “feel safe to be honest” are stock phrases rather than analysis.","correct":false},{"text":"“A very difficult month” and “extremely busy with exams and revision” are vague where exact dates were available, so the decline sounds like reluctance.","correct":true},{"text":"Language. “the big companies are producing” (produce — a habitual fact), “they should be controlled by the governments” (over-articled), “the people should change” (people), and a long comma splice through “everybody should do their part, the governments should make laws”.","correct":false}],"key_html":"F3"}};</script>
