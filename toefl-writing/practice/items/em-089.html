<script>window.ITEM={"kind":"exercise","id":"EM 089","slug":"em-089","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request to an authority","payload":{"Strategy":"ask for a decision by removing the need for judgement","Grammar":"embedded conditionals","Vocabulary":"eligibility, criteria, pro rata, reassess","Convention":"requesting a reassessment under published criteria"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The form does not fit your situation. Why say so explicitly?\u003c/p>\u003cp>b.  Why cite the criterion rather than explain your need?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does pro rata mean, and what is eligibility?\u003c/p>\u003cp>b.  What is a change of circumstances, in funding terms?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in one sentence that names the change and the clause.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer quotes a clause number. What does that change about the reply?\u003c/p>\u003cp>b.  \"I am not asking for backdating\" — why rule out something nobody raised?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"If I have read that correctly, using the form would cost me the award I already hold\" — why the conditional?\u003c/p>\u003cp>b.  \"which cannot be what 7.4 intends\" — what is this inviting the reader to do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the reader will otherwise tell you to use the form. Naming the specific defect — that it would close the existing award — is what makes an alternative route necessary rather than merely convenient.\u003c/p>\u003cp>b.  Because need is not the test; the criterion is. A reassessment under 7.4 is something the office administers, while an appeal to hardship is something it has to judge.\u003c/p>","P2":"\u003cp>a.  Pro rata means proportionally, by the part of the period that applies; eligibility is whether you meet the conditions for an award at all.\u003c/p>\u003cp>b.  A material change in the facts on which an award was calculated — which is what triggers the clause being cited.\u003c/p>","P3":"\u003cp>Model: \"I now have two dependent children rather than one, from 3 April, and I am writing under clause 7.4, which provides for reassessment.\"\u003c/p>","F1":"\u003cp>a.  It makes the reply a matter of routing rather than discretion. The officer no longer has to decide whether the writer deserves more money, only which process applies — and that is a question they can answer in two lines.\u003c/p>\u003cp>b.  Because backdating is the expensive part, and an officer reading the email will wonder whether it is being asked for. Disclaiming it makes the request cheap and removes the main reason to escalate it.\u003c/p>","F2":"\u003cp>a.  Because the writer is interpreting the office’s own guidance and may have it wrong. The conditional makes the reading correctable, which keeps the email from asserting something the reader would have to contradict.\u003c/p>\u003cp>b.  To read the clause with the writer rather than defend the form. Framing the problem as a conflict between the form and the policy’s purpose puts the officer on the same side as the request.\u003c/p>","F3":"\u003cp>1.  No clause is cited and no date of change is given, so the second bullet fails — the office is being asked to exercise judgement rather than apply a rule.\u003c/p>\u003cp>2.  \"The form was confusing and did not seem to apply\" does not say what the form would actually have done, so the blocking problem is invisible. The third bullet fails.\u003c/p>\u003cp>3.  \"My costs have increased considerably\" and \"no longer enough to cover my rent\" argue need, which invites comparison with every other applicant, and no evidence is attached.\u003c/p>"},"model":["Dear Bursaries Team,","My circumstances have changed since my award was set: I now have two dependent children rather than one, from 3 April. I am writing under clause 7.4 of the Accommodation Bursary criteria, which provides for reassessment on a change of circumstances.","My difficulty is procedural. The online form offers only \"new application\", which would close my current award and restart the assessment from the beginning, and the guidance says new applications are considered in September. If I have read that correctly, using the form would cost me the award I already hold, which cannot be what 7.4 intends.","Could you either tell me the right route for a 7.4 reassessment, or treat this email as the notification if that is what the clause requires? I have attached the birth certificate and the revised household details.","If the reassessment is pro rata from the date of change rather than from the start of the year, that is understood — I am not asking for backdating.","Yours sincerely,","Amara Nwosu — 2187702"],"model_html":"\u003cp>Dear Bursaries Team,\u003c/p>\u003cp>My circumstances have changed since my award was set: I now have two dependent children rather than one, from 3 April. I am writing under clause 7.4 of the Accommodation Bursary criteria, which provides for reassessment on a change of circumstances.\u003c/p>\u003cp>My difficulty is procedural. The online form offers only \"new application\", which would close my current award and restart the assessment from the beginning, and the guidance says new applications are considered in September. If I have read that correctly, using the form would cost me the award I already hold, which cannot be what 7.4 intends.\u003c/p>\u003cp>Could you either tell me the right route for a 7.4 reassessment, or treat this email as the notification if that is what the clause requires? I have attached the birth certificate and the revised household details.\u003c/p>\u003cp>If the reassessment is pro rata from the date of change rather than from the start of the year, that is understood — I am not asking for backdating.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Amara Nwosu — 2187702\u003c/p>","model_band":5,"degraded":["Dear Bursaries Team, I am writing because my situation has changed since I received my accommodation bursary. I now have two children instead of one, so my costs have increased considerably and the current award is no longer enough to cover my rent and living expenses. I tried to use the online form but it was confusing and did not seem to apply to my case. Could you please increase my bursary to reflect my new circumstances? I would really appreciate your help with this.","Amara"],"degraded_html":"\u003cp>Dear Bursaries Team, I am writing because my situation has changed since I received my accommodation bursary. I now have two children instead of one, so my costs have increased considerably and the current award is no longer enough to cover my rent and living expenses. I tried to use the online form but it was confusing and did not seem to apply to my case. Could you please increase my bursary to reflect my new circumstances? I would really appreciate your help with this.\u003c/p>\u003cp>Amara\u003c/p>","degraded_band":3,"model_words":174,"fault_list":{"tag":"F3","faults":["No clause is cited and no date of change is given, so the second bullet fails — the office is being asked to exercise judgement rather than apply a rule.","\"The form was confusing and did not seem to apply\" does not say what the form would actually have done, so the blocking problem is invisible. The third bullet fails.","\"My costs have increased considerably\" and \"no longer enough to cover my rent\" argue need, which invites comparison with every other applicant, and no evidence is attached."],"html":["\u003cp>1.  No clause is cited and no date of change is given, so the second bullet fails — the office is being asked to exercise judgement rather than apply a rule.\u003c/p>","\u003cp>2.  \"The form was confusing and did not seem to apply\" does not say what the form would actually have done, so the blocking problem is invisible. The third bullet fails.\u003c/p>","\u003cp>3.  \"My costs have increased considerably\" and \"no longer enough to cover my rent\" argue need, which invites comparison with every other applicant, and no evidence is attached.\u003c/p>"]},"scenario":"\u003cp>Your accommodation bursary was set when you declared one dependent. You now have two, and the published criteria say awards are reassessed on a change of circumstances, but the form only has a box for new applications.\u003c/p>","bullets":["Say what has changed.","Point to the criterion that applies.","Make clear which form problem is blocking you."],"header":[["To:","bursaries@northgate.ac.uk"],["Subject:","Change of circumstances — reassessment, not a new application"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“This time it really is different because the scale is so much bigger” concedes that the difference is one of degree, which is exactly Felix’s point.","correct":false},{"text":"Language: “the dangerous nuclear power”, “the prices of the batteries”, “another place” — and the conclusion “one hundred per cent” is exactly the unhedged absolute the topic punishes.","correct":false},{"text":"“The form was confusing and did not seem to apply” does not say what the form would actually have done, so the blocking problem is invisible. The third bullet fails.","correct":true},{"text":"“Basic economics” and “the law of supply and demand” are invoked as though they settle an empirical question about magnitudes and distribution, which they do not.","correct":false},{"text":"“My costs have increased considerably” and “no longer enough to cover my rent” argue need, which invites comparison with every other applicant, and no evidence is attached.","correct":true},{"text":"No clause is cited and no date of change is given, so the second bullet fails — the office is being asked to exercise judgement rather than apply a rule.","correct":true}],"key_html":"F3"}};</script>
