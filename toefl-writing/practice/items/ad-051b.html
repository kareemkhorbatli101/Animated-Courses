<script>window.ITEM={"kind":"exercise","id":"AD 051b","slug":"ad-051b","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Law and ethics · agree or disagree with a claim","payload":{"Strategy":"check what a comparison between two systems holds constant","Grammar":"counterfactual would have","Vocabulary":"adversarial, inquisitorial, conviction rate, due process","Convention":"disagreeing about a system you have not lived under"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Priya accuses Anders of a specific comparison error. Name it.\u003c/p>\u003cp>b.  What evidence would actually settle the question?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish adversarial from inquisitorial.\u003c/p>\u003cp>b.  Why is conviction rate a poor measure of accuracy?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the comparison error in one sentence and what it implies.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response refuses to decide. Why is that not a failure to take a position?\u003c/p>\u003cp>b.  What is the argument about the proxies?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had the two produced identical error rates, the adversarial one would still report more errors\" — what does the counterfactual demonstrate?\u003c/p>\u003cp>b.  \"each side compares its own system as designed with the other as practised\" — why is this formulation efficient?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Comparing the ideal form of one system with the actual operation of the other — sometimes called the nirvana fallacy.\u003c/p>\u003cp>b.  A measure of accuracy independent of the systems themselves, which is precisely what does not exist — the response’s second paragraph.\u003c/p>","P2":"\u003cp>a.  In an adversarial system two parties investigate and contest, and the judge arbitrates. In an inquisitorial one the judge directs the investigation and the parties have a narrower role.\u003c/p>\u003cp>b.  Because it confounds how many guilty people are convicted with how many innocent ones are, and both move with prosecutorial discretion rather than with trial accuracy.\u003c/p>","P3":"\u003cp>Model: \"Each side is comparing its own system as designed with the other as practised, which guarantees that whichever system you start from wins.\"\u003c/p>","F1":"\u003cp>a.  Because it takes a definite position about the evidence — that the available comparisons are systematically biased and cannot support either conclusion. That is a claim with content, and it is argued for. Declining to answer an unanswerable question is only evasion if you do not show it is unanswerable.\u003c/p>\u003cp>b.  That exoneration and reversal rates measure how easy a system makes it to reopen a case, not how often it was wrong. A system that surfaces its errors will look worse than one that conceals them, independently of accuracy.\u003c/p>","F2":"\u003cp>a.  That the measurement bias exists even in the case where the two systems are equally accurate — which isolates the artefact from any real difference and shows it cannot be corrected by better data of the same kind.\u003c/p>\u003cp>b.  It names the error once, abstractly, in a form that applies to both classmates simultaneously. Diagnosing both positions in a single clause is far more economical than answering each in turn, and it is more even-handed.\u003c/p>","F3":"\u003cp>1.  It commits exactly the error Priya identified — the neutral truth-seeking judge is the idealised version, set against lawyers described at their worst.\u003c/p>\u003cp>2.  Her actual objection, that nobody reviews the line of inquiry the judge did not pursue, is answered with \"judges are trained to be objective\", which assumes away the structural point.\u003c/p>\u003cp>3.  \"They can hide evidence\" is a serious claim made without qualification, and disclosure obligations go unmentioned. Language: \"the lawyers\", \"the truth\", \"poor people who depend on public defenders\" — and \"not fair for\" should be \"unfair to\".\u003c/p>"},"model":["Priya has identified the error that makes most of this debate unproductive: each side compares its own system as designed with the other as practised. Anders is right that resource inequality distorts adversarial trials; Priya is right that an investigating judge concentrates the choice of line of inquiry in one unreviewed place. Both failures are real and neither follows from the design.","What would settle it is not available in the form the question assumes. We cannot observe accuracy directly, because the ground truth is exactly what the trial was trying to establish. The usable proxies — exoneration rates, appellate reversal, retrial outcomes — are themselves artefacts of how easy each system makes it to reopen a case, and inquisitorial systems tend to make it harder. Had the two produced identical error rates, the adversarial one would still report more errors, because it is built to surface them. That is not a reason to prefer either, but it is a reason to distrust every comparison that has been offered in either direction."],"model_html":"\u003cp>Priya has identified the error that makes most of this debate unproductive: each side compares its own system as designed with the other as practised. Anders is right that resource inequality distorts adversarial trials; Priya is right that an investigating judge concentrates the choice of line of inquiry in one unreviewed place. Both failures are real and neither follows from the design.\u003c/p>\u003cp>What would settle it is not available in the form the question assumes. We cannot observe accuracy directly, because the ground truth is exactly what the trial was trying to establish. The usable proxies — exoneration rates, appellate reversal, retrial outcomes — are themselves artefacts of how easy each system makes it to reopen a case, and inquisitorial systems tend to make it harder. Had the two produced identical error rates, the adversarial one would still report more errors, because it is built to surface them. That is not a reason to prefer either, but it is a reason to distrust every comparison that has been offered in either direction.\u003c/p>","model_band":5,"degraded":["I think the inquisitorial system is better because the judge is neutral and looks for the truth, while in the adversarial system the lawyers only want to win their case and they can hide evidence that is not favourable to their client. Also rich defendants can pay expensive lawyers and get better results, which is not fair for poor people who depend on public defenders. Priya says that the judge can also make mistakes but at least there is no conflict of interest, and judges are professionals who are trained to be objective."],"degraded_html":"\u003cp>I think the inquisitorial system is better because the judge is neutral and looks for the truth, while in the adversarial system the lawyers only want to win their case and they can hide evidence that is not favourable to their client. Also rich defendants can pay expensive lawyers and get better results, which is not fair for poor people who depend on public defenders. Priya says that the judge can also make mistakes but at least there is no conflict of interest, and judges are professionals who are trained to be objective.\u003c/p>","degraded_band":3,"model_words":170,"fault_list":{"tag":"F3","faults":["It commits exactly the error Priya identified — the neutral truth-seeking judge is the idealised version, set against lawyers described at their worst.","Her actual objection, that nobody reviews the line of inquiry the judge did not pursue, is answered with \"judges are trained to be objective\", which assumes away the structural point.","\"They can hide evidence\" is a serious claim made without qualification, and disclosure obligations go unmentioned. Language: \"the lawyers\", \"the truth\", \"poor people who depend on public defenders\" — and \"not fair for\" should be \"unfair to\"."],"html":["\u003cp>1.  It commits exactly the error Priya identified — the neutral truth-seeking judge is the idealised version, set against lawyers described at their worst.\u003c/p>","\u003cp>2.  Her actual objection, that nobody reviews the line of inquiry the judge did not pursue, is answered with \"judges are trained to be objective\", which assumes away the structural point.\u003c/p>","\u003cp>3.  \"They can hide evidence\" is a serious claim made without qualification, and disclosure obligations go unmentioned. Language: \"the lawyers\", \"the truth\", \"poor people who depend on public defenders\" — and \"not fair for\" should be \"unfair to\".\u003c/p>"]},"prof_name":"Dr Ferreira","professor":"\u003cp>It is sometimes argued that inquisitorial systems, in which a judge directs the investigation, produce more accurate verdicts than adversarial ones, in which two parties contest the evidence. How convincing is this?\u003c/p>","students":[["Anders","Fairly convincing. An adversarial trial is a contest between unequally resourced parties, and the better-funded side wins more often than the truth does. A judge who directs the investigation has no client."],["Priya","That compares an idealised inquisitorial judge with a real adversarial lawyer. A judge who both investigates and decides has nobody checking the line of inquiry they chose not to pursue, and the failures of inquisitorial systems are exactly that."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It commits exactly the error Priya identified — the neutral truth-seeking judge is the idealised version, set against lawyers described at their worst.","correct":true},{"text":"“You can find good deals online if you look carefully” is advice that cannot be acted on from abroad in three days, and the guarantor problem is never mentioned.","correct":false},{"text":"“They can hide evidence” is a serious claim made without qualification, and disclosure obligations go unmentioned. Language: “the lawyers”, “the truth”, “poor people who depend on public defenders” — and “not fair for” should be “unfair to”.","correct":true},{"text":"No remedy. “Let me know what you want me to do” hands the problem back, and “a bit wobbly” understates damage that makes the item unusable. The third bullet fails.","correct":false},{"text":"Her actual objection, that nobody reviews the line of inquiry the judge did not pursue, is answered with “judges are trained to be objective”, which assumes away the structural point.","correct":true},{"text":"The repayment is not a commitment. “At some point this month” with “just remind me if I forget” transfers the chasing to the person already out of pocket. The third bullet fails.","correct":false}],"key_html":"F3"}};</script>
