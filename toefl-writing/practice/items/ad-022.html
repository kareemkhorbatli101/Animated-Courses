<script>window.ITEM={"kind":"exercise","id":"AD 022","slug":"ad-022","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Arts and culture · agree or disagree with a claim","payload":{"Strategy":"separate a claim about quality from a claim about conditions","Grammar":"counterfactual would have","Vocabulary":"patronage, commission, precarity, canon","Convention":"disagreeing with a nostalgic claim"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Marcus is not defending patronage. What is he doing?\u003c/p>\u003cp>b.  What evidence could decide between them?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is precarity, and how does it differ from poverty?\u003c/p>\u003cp>b.  What is a commission, and who sets its terms?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State what both agree on and where they actually differ, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reframes the question in the second paragraph. From what to what?\u003c/p>\u003cp>b.  Why does it say \"what makes Ilse right is plurality rather than freedom\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Had the market consisted only of its largest buyers, Marcus would be straightforwardly right\" — what does the concession achieve?\u003c/p>\u003cp>b.  \"nobody signs the commission\" is Marcus’s phrase. Why does the response not reuse it?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Arguing that the market is also a patron, differing in visibility rather than in kind. He is attacking the premise that the market is the absence of a patron.\u003c/p>\u003cp>b.  What gets made under each system, particularly at the margins — what patronage left unmade, and what the market leaves unmade. Both are visible in the historical record.\u003c/p>","P2":"\u003cp>a.  Precarity is insecurity of income and status — unpredictability rather than absolute lack. An artist can be precarious without being poor, and the instability is itself the constraint.\u003c/p>\u003cp>b.  A work ordered in advance, with the terms set by whoever pays. Marcus’s point is that the market issues the same instruction without anyone having to write it down.\u003c/p>","P3":"\u003cp>Model: \"They agree that art follows the money and differ about whether a diffuse payer constrains less than a named one.\"\u003c/p>","F1":"\u003cp>a.  From which constraint is tighter, to whether the constraint can be escaped. That shifts the argument onto structure, where the plurality of buyers becomes the decisive fact.\u003c/p>\u003cp>b.  Because freedom is Ilse’s word and it overstates: no artist is unconstrained. Plurality is the property that actually does the work — many buyers of different sizes — and it is a weaker and more defensible claim.\u003c/p>","F2":"\u003cp>a.  It grants Marcus the strongest version of his position under a specified condition, which both shows the argument has been taken seriously and identifies exactly what the disagreement turns on. A concession that names its own condition is an argument, not a courtesy.\u003c/p>\u003cp>b.  Because reusing an opponent’s phrase adopts his framing. The response accepts the observation and declines the metaphor, which is what allows it to arrive at a different conclusion from the same fact.\u003c/p>","F3":"\u003cp>1.  It never engages Marcus, whose entire point is that the market constrains invisibly. \"Create whatever they want\" is the claim he disputed.\u003c/p>\u003cp>2.  The internet is introduced as evidence of freedom without noticing that it is the clearest case of his argument — reach at scale, rewarding legibility.\u003c/p>\u003cp>3.  Language: \"the artists\" throughout, \"his own personal vision\" (redundant, and generic \"their\" would be better), and \"freedom is the most important thing for creation\" is assertion standing in for the conclusion.\u003c/p>"},"model":["Both agree that art is shaped by whoever pays, and they differ about whether a diffuse payer constrains less than a named one. Ilse has the better of the comparison as she frames it: a duke could require specific content, and a market cannot. But Marcus is pointing at something the comparison hides, which is that the two systems fail differently. Patronage produced flattery and left everything outside the patron’s interest unmade; the market produces legibility and leaves unmade whatever cannot find an audience quickly.","What decides it, I think, is not which constraint is tighter but whether the constraint can be escaped. Under patronage there was one route and refusing it meant not working. A market has many buyers of different sizes, and the small ones subsidise exactly the work the large ones will not take — which is why the mid-list and the small press matter out of all proportion to their revenue. Had the market consisted only of its largest buyers, Marcus would be straightforwardly right; what makes Ilse right is plurality rather than freedom."],"model_html":"\u003cp>Both agree that art is shaped by whoever pays, and they differ about whether a diffuse payer constrains less than a named one. Ilse has the better of the comparison as she frames it: a duke could require specific content, and a market cannot. But Marcus is pointing at something the comparison hides, which is that the two systems fail differently. Patronage produced flattery and left everything outside the patron’s interest unmade; the market produces legibility and leaves unmade whatever cannot find an audience quickly.\u003c/p>\u003cp>What decides it, I think, is not which constraint is tighter but whether the constraint can be escaped. Under patronage there was one route and refusing it meant not working. A market has many buyers of different sizes, and the small ones subsidise exactly the work the large ones will not take — which is why the mid-list and the small press matter out of all proportion to their revenue. Had the market consisted only of its largest buyers, Marcus would be straightforwardly right; what makes Ilse right is plurality rather than freedom.\u003c/p>","model_band":5,"degraded":["I agree with Ilse that the market gave the artists freedom because now they can create whatever they want without asking permission from a rich patron. In the past the artists were like servants and they had to follow the orders of the church or the aristocracy, which limited their creativity a lot. Today an artist can express his own personal vision and find his public directly, especially with the internet which allows everybody to publish their work without intermediaries. Of course it is difficult to earn money from art but at least the artists are free, and freedom is the most important thing for creation."],"degraded_html":"\u003cp>I agree with Ilse that the market gave the artists freedom because now they can create whatever they want without asking permission from a rich patron. In the past the artists were like servants and they had to follow the orders of the church or the aristocracy, which limited their creativity a lot. Today an artist can express his own personal vision and find his public directly, especially with the internet which allows everybody to publish their work without intermediaries. Of course it is difficult to earn money from art but at least the artists are free, and freedom is the most important thing for creation.\u003c/p>","degraded_band":3,"model_words":178,"fault_list":{"tag":"F3","faults":["It never engages Marcus, whose entire point is that the market constrains invisibly. \"Create whatever they want\" is the claim he disputed.","The internet is introduced as evidence of freedom without noticing that it is the clearest case of his argument — reach at scale, rewarding legibility.","Language: \"the artists\" throughout, \"his own personal vision\" (redundant, and generic \"their\" would be better), and \"freedom is the most important thing for creation\" is assertion standing in for the conclusion."],"html":["\u003cp>1.  It never engages Marcus, whose entire point is that the market constrains invisibly. \"Create whatever they want\" is the claim he disputed.\u003c/p>","\u003cp>2.  The internet is introduced as evidence of freedom without noticing that it is the clearest case of his argument — reach at scale, rewarding legibility.\u003c/p>","\u003cp>3.  Language: \"the artists\" throughout, \"his own personal vision\" (redundant, and generic \"their\" would be better), and \"freedom is the most important thing for creation\" is assertion standing in for the conclusion.\u003c/p>"]},"prof_name":"Professor Rahimi","professor":"\u003cp>It is sometimes said that art has suffered since artists stopped being supported by patrons and had to survive in a market. Others argue the market freed artists from the tastes of the powerful. What do you think?\u003c/p>","students":[["Ilse","The market freed them. Patronage meant painting what a cardinal or a duke wanted, on his terms, with his relatives in the corner of the picture. Whatever the market’s faults, nobody has to flatter anybody to sell a novel."],["Marcus","The market has its own patron, which is scale. You do not have to flatter a duke, you have to be legible to a hundred thousand strangers, and that constrains what can be made just as effectively — only invisibly, because nobody signs the commission."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It never engages Marcus, whose entire point is that the market constrains invisibly. “Create whatever they want” is the claim he disputed.","correct":true},{"text":"“Pick your brain” and “a short call” ask for unbounded time with no question specified, so the second bullet fails.","correct":false},{"text":"Language: “the artists” throughout, “his own personal vision” (redundant, and generic “their” would be better), and “freedom is the most important thing for creation” is assertion standing in for the conclusion.","correct":true},{"text":"No usable request. “what are you going to do about it” and a demand for an apology. Nothing is asked about the labelling process, so the third bullet fails and nothing changes.","correct":false},{"text":"“We are all managing fine and we understand completely” implies there is something to understand — that is, that she has let the group down. The second bullet fails.","correct":false},{"text":"The internet is introduced as evidence of freedom without noticing that it is the clearest case of his argument — reach at scale, rewarding legibility.","correct":true}],"key_html":"F3"}};</script>
