<script>window.ITEM={"kind":"family","id":"BAS 075–082","slug":"bas-family-10","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 10 of 12 — subordination and connectors","payload":{"Strategy":"subordination tells the reader which of two facts you think matters","Grammar":"concession, contrast, purpose, result, time, reason","Vocabulary":"although / despite / whereas / given that / so that","Convention":"conjunction, preposition or adverb — and the punctuation each takes"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>Most of the trouble in this family comes from one confusion: although is a conjunction and takes a clause, despite is a preposition and takes a noun, and however is an adverb and takes neither. Sorting those three out removes a whole class of error.\u003c/p>","preview":[{"tag":"P1","title":"Three words, three grammars","html":"\u003cp>Complete each with the same idea, and notice what has to change:\u003c/p>\u003cpre class=\"mono\">Although ______________ , nearly two hundred came.\nDespite  ______________ , nearly two hundred came.\nIt rained. ______________ , nearly two hundred came.\u003c/pre>"},{"tag":"P2","title":"Which half matters?","html":"\u003cp>These report the same two facts. What is different about what the writer thinks?\u003c/p>\u003cpre class=\"mono\">Although the conference was too long, I learned a great deal.\nAlthough I learned a great deal, the conference was too long.\u003c/pre>"},{"tag":"P3","title":"Purpose or result?","html":"\u003cp>Both use so that. Which is which, and what is the grammatical give-away?\u003c/p>\u003cpre class=\"mono\">(a) I wrote again so that there would be a record.\n(b) The system went down, so that nobody could submit.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Swap the grammar","html":"\u003cp>Rewrite each sentence twice, using the other two words.\u003c/p>\u003cpre class=\"mono\">Although the fee was high, the course was worth it.\n  → despite …\n  → however …\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) Despite the fee was high, I enrolled.\n(b) Although it was expensive, but I enrolled.\n(c) The fee was high, however I enrolled.\n(d) I saved for a year so that I could to afford it.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Concede and then counter, in one sentence each, on: should museums charge for entry?\u003c/p>\u003cpre class=\"mono\">(a) with although\n(b) with despite\n(c) with whereas\u003c/pre>"}],"keys":{"P1":"\u003cp>Although \u003cstrong>it rained\u003c/strong> — a clause.\u003c/p>\u003cp>Despite \u003cstrong>the rain\u003c/strong> — a noun phrase.\u003c/p>\u003cp>It rained. \u003cstrong>However\u003c/strong>, nearly two hundred came — a separate sentence.\u003c/p>\u003cp>Three grammars for one idea. Choosing the wrong one is not a style error; it is a structural one, and it reads as such.\u003c/p>","P2":"\u003cp>The main clause carries the writer’s real view. In the first the conference was worth it; in the second it was not.\u003c/p>\u003cp>Everything you put in an although-clause you are agreeing to give away. Make sure it is the part you can afford to lose.\u003c/p>","P3":"\u003cp>(a) is purpose — note \u003cem>would\u003c/em>, and no comma. (b) is result — note the comma, and no modal.\u003c/p>\u003cp>The give-away is the modal: intention needs one, consequence does not.\u003c/p>","F1":"\u003cp>Despite the high fee, the course was worth it.\u003c/p>\u003cp>The fee was high; however, the course was worth it.\u003c/p>\u003cp>Note that \u003cem>despite\u003c/em> forced the clause to become a noun phrase.\u003c/p>","F2":"\u003cp>(a) → Despite the high fee, or Although the fee was high.\u003c/p>\u003cp>(b) → drop \u003cem>but\u003c/em>. English allows one connector per join, not two.\u003c/p>\u003cp>(c) → The fee was high; however, I enrolled.\u003c/p>\u003cp>(d) → so that I could afford it. No \u003cem>to\u003c/em> after a modal.\u003c/p>","F3":"\u003cp>(a) Although free entry undoubtedly raises visitor numbers, it shifts the cost onto taxpayers who may never visit.\u003c/p>\u003cp>(b) Despite the obvious appeal of free access, the museums that charge are the ones still able to fund conservation.\u003c/p>\u003cp>(c) Entry charges deter casual visitors, whereas membership schemes deter only the occasional ones.\u003c/p>"},"rows":[75,76,77,78,79,80,81,82]};</script>
