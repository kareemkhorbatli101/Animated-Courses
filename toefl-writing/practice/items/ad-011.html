<script>window.ITEM={"kind":"exercise","id":"AD 011","slug":"ad-011","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environment · responsibility: who should act","payload":{"Strategy":"distinguish levels — individual, firm, state — before assigning blame","Grammar":"modals of obligation across different agents","Vocabulary":"externality, offset, systemic, discretionary","Convention":"disagreeing with a moral position without sounding cynical"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Freya is talking about where emissions are produced. What is Daniel talking about?\u003c/p>\u003cp>b.  Could both be entirely right? What would have to be true?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  An \u003cem>externality\u003c/em> is a cost not paid by whoever causes it. Who pays the externality of a cheap flight?\u003c/p>\u003cp>b.  Distinguish \u003cem>systemic\u003c/em> from \u003cem>discretionary\u003c/em>. Which word describes a choice a person can actually make?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>In one sentence, accept Daniel’s mechanism and show that it supports Freya’s conclusion. Under 35 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “both individuals and institutions have a role to play” a band-3 sentence?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response agrees with Daniel and sides with Freya. Trace the step that makes that possible.\u003c/p>\u003cp>b.  Find the sentence that redefines the question. What is gained by replacing “who is responsible” with “who can change the price”?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “Demand \u003cem>does\u003c/em> drive production.” Why the emphatic \u003cem>do\u003c/em> here?\u003c/p>\u003cp>b.  “not because their emissions are large but because they … set the conditions”. Name the structure, and say why the first half has to be conceded for the second to land.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>political rather than arithmetical\u003c/em> — what distinction is this drawing, and why is it the key to the whole response?\u003c/p>\u003cp>b.  \u003cem>free-floating\u003c/em> applied to demand. What picture does it deny?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Using the official band descriptors at the front of this book, name the three things that hold the response below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Discussion: should airlines be required to show the emissions of each flight at the point of booking? One classmate says it will change behaviour; another says people will ignore it. In 50 words, accept the second classmate’s prediction and show it argues for the policy anyway.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Where emissions are \u003cstrong>caused\u003c/strong> — which is not the same as where they are produced. Freya is pointing at a smokestack; Daniel is pointing at the purchase that lit it.\u003c/p>\u003cp>b.  Yes. It only requires that production and causation can come apart — which they do whenever the conditions of choice are set by someone other than the chooser. That gap is the whole of the response.\u003c/p>","P2":"\u003cp>a.  Everyone except the passenger and the airline — which is precisely what makes it an externality, and why individual virtue cannot fix it.\u003c/p>\u003cp>b.  \u003cstrong>Discretionary\u003c/strong> — a choice genuinely at the person’s discretion. \u003cem>Systemic\u003c/em> describes the structure the choice is made inside. Most arguments about personal responsibility turn on whether a given choice is actually discretionary.\u003c/p>","P3":"\u003cp>Model: \u003cem>Demand does drive production, but demand is itself shaped by price and availability — which are set by exactly the institutions Freya is pointing at.\u003c/em>\u003c/p>\u003cp>You have granted his causal chain in full and simply followed it one link further back.\u003c/p>","P4":"\u003cp>Because nobody in the discussion denies it. Freya does not claim individuals are irrelevant; Daniel does not claim firms are blameless. A sentence both participants already agree with adds nothing, and \u003cem>contribution\u003c/em> is the rubric’s word.\u003c/p>","F1":"\u003cp>a.  By separating the \u003cem>mechanism\u003c/em> from the \u003cem>conclusion\u003c/em>. Daniel’s mechanism is that demand drives production. The response accepts it, then asks what drives demand — and the answer is institutions. His own causal chain reaches her conclusion if you follow it one step further.\u003c/p>\u003cp>b.  “So the question is less who is to blame than who can change the price.” Blame is backward-looking and produces an argument nobody wins; capacity to act is forward-looking and has an answer. It also dissolves the false opposition, because the agent who can change the price is not necessarily the agent who emitted the carbon.\u003c/p>","F2":"\u003cp>a.  Because the writer is about to disagree with Daniel and wants the concession to be unmistakable first. The emphatic \u003cem>do\u003c/em> grants the point more strongly than a plain assertion would, which buys permission for the \u003cem>but\u003c/em>. (Family 8, structure 65.)\u003c/p>\u003cp>b.  \u003cem>not because … but because …\u003c/em> — a correlative pair setting two explanations against each other. The first has to be conceded because it is Freya’s own stated reason: the response is telling her that her conclusion is right for a better reason than the one she gave, which is a far more interesting move than simply agreeing.\u003c/p>","F3":"\u003cp>a.  Between action that reduces emissions by its own quantity, and action that changes who holds power. Arithmetically one household’s diet is negligible; politically it produces a voter who will support regulation. The distinction rescues individual action from Freya’s dismissal without conceding Daniel’s point — and it is a claim neither of them made.\u003c/p>\u003cp>b.  The picture of demand as something that simply exists, prior to and independent of the market — as if preferences arrived from nowhere. Denying that picture is what licenses the whole argument.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It takes no position.\u003c/strong> It restates Freya, restates Daniel, and concludes that everybody should do their part. The task requires an opinion; this carefully avoids having one.\u003c/p>\u003cp>2.  \u003cstrong>Nothing is added.\u003c/strong> Every claim in it has already been made by one of the two classmates. There is no mechanism, no distinction, no example — and the closing sentence about working together for future generations could be attached to any environmental question ever asked.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the big companies are producing” (produce — a habitual fact), “they should be controlled by the governments” (over-articled), “the people should change” (people), and a long comma splice through “everybody should do their part, the governments should make laws”.\u003c/p>","F5":"\u003cp>Model: \u003cem>The prediction is probably right: most people will book the cheap flight anyway. But a label that is ignored at the point of sale still creates the dataset and the public number that regulation later needs. Disclosure rules rarely change behaviour directly; they change what can be argued about afterwards.\u003c/em>\u003c/p>"},"model":["Daniel is right about the mechanism and I think it points the other way. Demand does drive production — but demand is not a free-floating sum of private choices; it is shaped by what is cheap, available and default. A household that flies because the train costs three times as much has not made a discretionary choice in any useful sense.","So the question is less who is to blame than who can change the price. Freya’s hundred firms matter not because their emissions are large but because they, and the governments that tax them, set the conditions under which individual choices are made. Individual action still counts, though I would count it differently: its real value is political rather than arithmetical. People who have already changed their own habits are the ones who vote for the regulation that makes everyone else change theirs."],"model_html":"\u003cp>Daniel is right about the mechanism and I think it points the other way. Demand does drive production — but demand is not a free-floating sum of private choices; it is shaped by what is cheap, available and default. A household that flies because the train costs three times as much has not made a discretionary choice in any useful sense.\u003c/p>\u003cp>So the question is less who is to blame than who can change the price. Freya’s hundred firms matter not because their emissions are large but because they, and the governments that tax them, set the conditions under which individual choices are made. Individual action still counts, though I would count it differently: its real value is political rather than arithmetical. People who have already changed their own habits are the ones who vote for the regulation that makes everyone else change theirs.\u003c/p>","model_band":5,"degraded":["In my opinion both individuals and institutions have a role to play in this important issue. Freya is right that the big companies are producing most of the pollution and they should be controlled by the governments with strict laws and big fines. But Daniel is also right because if people continue to buy these products then the companies will continue to produce them, so the consumers have power too. I think the best solution is that everybody should do their part, the governments should make laws, the companies should be more responsible and the people should change their habits. If we all work together we can solve this problem for the future generations."],"degraded_html":"\u003cp>In my opinion both individuals and institutions have a role to play in this important issue. Freya is right that the big companies are producing most of the pollution and they should be controlled by the governments with strict laws and big fines. But Daniel is also right because if people continue to buy these products then the companies will continue to produce them, so the consumers have power too. I think the best solution is that everybody should do their part, the governments should make laws, the companies should be more responsible and the people should change their habits. If we all work together we can solve this problem for the future generations.\u003c/p>","degraded_band":3,"model_words":144,"fault_list":{"tag":"F4","faults":["It takes no position. It restates Freya, restates Daniel, and concludes that everybody should do their part. The task requires an opinion; this carefully avoids having one.","Nothing is added. Every claim in it has already been made by one of the two classmates. There is no mechanism, no distinction, no example — and the closing sentence about working together for future generations could be attached to any environmental question ever asked.","Language. “the big companies are producing” (produce — a habitual fact), “they should be controlled by the governments” (over-articled), “the people should change” (people), and a long comma splice through “everybody should do their part, the governments should make laws”."],"html":["\u003cp>1.  \u003cstrong>It takes no position.\u003c/strong> It restates Freya, restates Daniel, and concludes that everybody should do their part. The task requires an opinion; this carefully avoids having one.\u003c/p>","\u003cp>2.  \u003cstrong>Nothing is added.\u003c/strong> Every claim in it has already been made by one of the two classmates. There is no mechanism, no distinction, no example — and the closing sentence about working together for future generations could be attached to any environmental question ever asked.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the big companies are producing” (produce — a habitual fact), “they should be controlled by the governments” (over-articled), “the people should change” (people), and a long comma splice through “everybody should do their part, the governments should make laws”.\u003c/p>"]},"prof_name":"Dr Haugen","professor":"\u003cp>Campaigns to reduce household emissions ask individuals to fly less, eat less meat and insulate their homes. Critics argue that this shifts attention from the small number of firms and governments whose decisions dominate the total. Where should responsibility for reducing emissions mainly lie — with individuals, or with institutions?\u003c/p>","students":[["Freya","With institutions, clearly. A hundred companies account for most industrial emissions since the 1980s. Asking households to change their diet while those decisions go unexamined is a distraction, and I think a deliberate one."],["Daniel","I think that lets us all off too easily. Firms produce what people buy. If demand for flights and beef does not fall, a regulation simply moves production somewhere else. Individual choices are where demand actually comes from."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It takes no position. It restates Freya, restates Daniel, and concludes that everybody should do their part. The task requires an opinion; this carefully avoids having one.","correct":true},{"text":"Nothing is added. Every claim in it has already been made by one of the two classmates. There is no mechanism, no distinction, no example — and the closing sentence about working together for future generations could be attached to any environmental question ever asked.","correct":true},{"text":"The decision is taken away. “there is no question”, “you will not regret it”, “Trust me”. The third bullet is not addressed at all.","correct":false},{"text":"Language. “the big companies are producing” (produce — a habitual fact), “they should be controlled by the governments” (over-articled), “the people should change” (people), and a long comma splice through “everybody should do their part, the governments should make laws”.","correct":true},{"text":"It prosecutes the reader. “obviously nobody is reading these reports”, “completely unacceptable”, and a threat to escalate. The task asked for a remedy; this asks for an admission of guilt.","correct":false},{"text":"The reason is flattery, not a reason. “you are a famous teacher and all the students respect you” could be sent to anyone in the department. The actual connection — that the presenters were her students and the projects grew out of her course — is the thing that would make her want to come, and it is missing.","correct":false}],"key_html":"F4"}};</script>
