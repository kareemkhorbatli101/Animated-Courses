<script>window.ITEM={"kind":"exercise","id":"AD 049","slug":"ad-049","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Technology and AI · policy choice","payload":{"Strategy":"ask what the rule costs the people it is meant to protect","Grammar":"conditional qualification","Vocabulary":"consent, data minimisation, friction, opt-out","Convention":"arguing about a protective rule that may not protect"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Omar is not defending the banners. What is he defending?\u003c/p>\u003cp>b.  Lena’s objection is about effectiveness. Does Omar deny it?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is data minimisation, and how does it differ from consent?\u003c/p>\u003cp>b.  What is friction, and why is it sometimes protective?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State what both would accept, in one sentence, and what follows.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the banner is \"a symptom\". Of what?\u003c/p>\u003cp>b.  What does the proposal give each classmate?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"a larger target than a user who decides for themselves badly\" — what is the implied argument?\u003c/p>\u003cp>b.  \"small enough that a meaningful choice could actually be presented\" — why is this the key clause?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Individual decision rights — the principle that the person the data is about should have a say, as distinct from the banner as a mechanism.\u003c/p>\u003cp>b.  No. He concedes the implementation is broken and argues about what replaces it, which is why Lena’s evidence does not reach him.\u003c/p>","P2":"\u003cp>a.  Data minimisation limits collection to what is necessary for a stated purpose, regardless of permission. Consent asks whether the person agrees. One constrains the company, the other the user.\u003c/p>\u003cp>b.  Anything that makes an action take more effort. It is protective when it slows a choice people would regret making quickly — though a banner adds friction without adding deliberation, which is why it fails.\u003c/p>","P3":"\u003cp>Model: \"Both accept the banners fail, so the question is whether consent should govern everything or only what survives a floor of prohibited collection.\"\u003c/p>","F1":"\u003cp>a.  Of a permissive underlying rule. If consent can authorise almost anything, it becomes the only place where any control is exercised, and the pressure on it produces the banner.\u003c/p>\u003cp>b.  Lena gets collection limits that do not depend on anyone reading anything; Omar keeps individual choice over the residual, where it is both meaningful and reviewable.\u003c/p>","F2":"\u003cp>a.  That errors by a central decision-maker are correlated and affect everyone, while errors by individuals are distributed and partly cancel — the same structural argument that appeared about model error in AD 019.\u003c/p>\u003cp>b.  Because it explains why the proposal fixes consent rather than abandoning it. A choice over a small, comprehensible domain can be a real choice; the banner fails precisely because the domain is unbounded.\u003c/p>","F3":"\u003cp>1.  It agrees with Lena and never engages Omar, whose objection — that removing consent relocates the judgement — is the only argument against her position.\u003c/p>\u003cp>2.  \"Prohibit collection without a real necessity\" is precisely Lena’s proposal restated, with \"real necessity\" left undefined, so nothing is contributed.\u003c/p>\u003cp>3.  \"They collect our data and sell it to advertisers\" is asserted without qualification and is not uniformly true. Language: \"the companies\", \"our data\", \"these annoying windows\" — register drops to the conversational, and \"absolutely useless\" is editorial.\u003c/p>"},"model":["Both accept that the banners fail and disagree about what replaces them, and Omar’s worry is the one usually waved away. He is not defending consent as practised; he is pointing out that the alternative concentrates the judgement somewhere, and a regulator who decides what may be collected about everyone is a larger target than a user who decides for themselves badly.","What resolves it is that the two are not exclusive. The reason consent is doing so much work is that almost everything is permitted if the user agrees, so the banner is the only control point. Set a floor of prohibited collection regardless of consent — as Lena wants — and consent then governs only the territory above it, which is small enough that a meaningful choice could actually be presented. That gives Omar his individual judgement where individual judgement is appropriate, and removes it from the cases where nobody’s click should make a difference. The banner is a symptom of a rule that permits too much, not an argument against asking people what they want."],"model_html":"\u003cp>Both accept that the banners fail and disagree about what replaces them, and Omar’s worry is the one usually waved away. He is not defending consent as practised; he is pointing out that the alternative concentrates the judgement somewhere, and a regulator who decides what may be collected about everyone is a larger target than a user who decides for themselves badly.\u003c/p>\u003cp>What resolves it is that the two are not exclusive. The reason consent is doing so much work is that almost everything is permitted if the user agrees, so the banner is the only control point. Set a floor of prohibited collection regardless of consent — as Lena wants — and consent then governs only the territory above it, which is small enough that a meaningful choice could actually be presented. That gives Omar his individual judgement where individual judgement is appropriate, and removes it from the cases where nobody’s click should make a difference. The banner is a symptom of a rule that permits too much, not an argument against asking people what they want.\u003c/p>","model_band":5,"degraded":["I completely agree with Lena because these cookie banners are absolutely useless and everybody just clicks accept to make them disappear. Nobody has time to read pages of legal text for every website they visit, and anyway the companies write them in a way that nobody can understand. They collect our data and sell it to advertisers and we have no real control over it. Governments should simply prohibit the collection of personal data without a real necessity, instead of making us click on these annoying windows all day."],"degraded_html":"\u003cp>I completely agree with Lena because these cookie banners are absolutely useless and everybody just clicks accept to make them disappear. Nobody has time to read pages of legal text for every website they visit, and anyway the companies write them in a way that nobody can understand. They collect our data and sell it to advertisers and we have no real control over it. Governments should simply prohibit the collection of personal data without a real necessity, instead of making us click on these annoying windows all day.\u003c/p>","degraded_band":3,"model_words":176,"fault_list":{"tag":"F3","faults":["It agrees with Lena and never engages Omar, whose objection — that removing consent relocates the judgement — is the only argument against her position.","\"Prohibit collection without a real necessity\" is precisely Lena’s proposal restated, with \"real necessity\" left undefined, so nothing is contributed.","\"They collect our data and sell it to advertisers\" is asserted without qualification and is not uniformly true. Language: \"the companies\", \"our data\", \"these annoying windows\" — register drops to the conversational, and \"absolutely useless\" is editorial."],"html":["\u003cp>1.  It agrees with Lena and never engages Omar, whose objection — that removing consent relocates the judgement — is the only argument against her position.\u003c/p>","\u003cp>2.  \"Prohibit collection without a real necessity\" is precisely Lena’s proposal restated, with \"real necessity\" left undefined, so nothing is contributed.\u003c/p>","\u003cp>3.  \"They collect our data and sell it to advertisers\" is asserted without qualification and is not uniformly true. Language: \"the companies\", \"our data\", \"these annoying windows\" — register drops to the conversational, and \"absolutely useless\" is editorial.\u003c/p>"]},"prof_name":"Dr Sorensen","professor":"\u003cp>Privacy regulation typically requires websites to obtain consent before collecting data. In practice this produces consent banners that almost everyone accepts without reading. Should consent remain the basis of data protection?\u003c/p>","students":[["Lena","No. Consent that nobody reads is not consent, and the banner has become a way of transferring responsibility to the user. The basis should be what a company is permitted to do, not what it can get somebody to click."],["Omar","I would keep consent but fix its implementation. Removing it means somebody else decides what data about me may be collected, and the record of regulators making that judgement well is not encouraging."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“They collect our data and sell it to advertisers” is asserted without qualification and is not uniformly true. Language: “the companies”, “our data”, “these annoying windows” — register drops to the conversational, and “absolutely useless” is editorial.","correct":true},{"text":"No repair. “I am sure you can find somebody else” is the office’s problem handed back with an assurance attached. The third bullet is not addressed.","correct":false},{"text":"“Prohibit collection without a real necessity” is precisely Lena’s proposal restated, with “real necessity” left undefined, so nothing is contributed.","correct":true},{"text":"It agrees with Lena and never engages Omar, whose objection — that removing consent relocates the judgement — is the only argument against her position.","correct":true},{"text":"Language. “I still didn’t receive” (have still not received), “in the end of February” (at the end), “since 7 weeks” (for seven weeks), “important for me” (to me), plus a comma splice at “important for me, it is not acceptable”. The since/for error and the tense error together obscure the one fact the email needed to establish.","correct":false},{"text":"“Bending the rules” and “above and beyond” are generic praise where something specific was available, and there is a comma splice before “I could not have finished”.","correct":false}],"key_html":"F3"}};</script>
