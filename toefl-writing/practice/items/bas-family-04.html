<script>window.ITEM={"kind":"family","id":"BAS 027–034","slug":"bas-family-04","task":"bas","task_label":"Build a Sentence","time":"8 items","function":"Family 4 of 12 — the passive","payload":{"Strategy":"the passive chooses what the sentence is about, and who vanishes","Grammar":"simple, modal, perfect, get-, infinitive, reporting, double-object","Vocabulary":"by-phrase or no by-phrase","Convention":"leaving the agent out is a social act, not just a grammatical one"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>The passive is not a politer way of saying the same thing; it is a different sentence about a different topic. Its real power in the email task is that it lets you describe a problem without naming whoever caused it.\u003c/p>","preview":[{"tag":"P1","title":"What the passive is for","html":"\u003cp>Both are correct. When would you write each?\u003c/p>\u003cpre class=\"mono\">Someone double-booked the hall.\nThe hall was double-booked.\u003c/pre>"},{"tag":"P2","title":"Where the agent goes","html":"\u003cp>Three of these need no by-phrase at all. Which one does, and why?\u003c/p>\u003cpre class=\"mono\">(a) The essays are marked ______ two tutors independently.\n(b) My bike got stolen ______ outside the library.\n(c) The decision was taken ______ without consultation.\n(d) The lab is being refitted ______ over the vacation.\u003c/pre>"},{"tag":"P3","title":"Build the chain","html":"\u003cp>Put be into each form before you meet them:\u003c/p>\u003cpre class=\"mono\">modal      It should ______ reported.\nperfect    It has ______ changed twice.\ncontinuous It is ______ refitted.\ngerund     She hates ______ corrected.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Who disappeared?","html":"\u003cp>For each, say whether the missing agent is unknown, obvious, or deliberately hidden.\u003c/p>\u003cpre class=\"mono\">(a) The decision was taken last night.\n(b) My bike got stolen.\n(c) The essays are marked twice.\n(d) Mistakes were made.\u003c/pre>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) The timetable has changed twice by the office.\n(b) It should reported immediately.\n(c) The students were explained the new rules.\n(d) The lab is been refitted.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Rewrite each so the person responsible disappears. You are writing to the office that made the mistake.\u003c/p>\u003cpre class=\"mono\">(a) You double-booked our hall.\n(b) You never sent us the confirmation.\u003c/pre>"}],"keys":{"P1":"\u003cp>The active when the \u003cem>someone\u003c/em> matters — you are reporting who did it. The passive when the hall is what you are talking about, or when naming the person would be an accusation you do not want to make.\u003c/p>\u003cp>Topic first: whatever you put in subject position is what the sentence is about.\u003c/p>","P2":"\u003cp>\u003cstrong>(a)\u003c/strong> — \u003cem>by two tutors\u003c/em>. In the others the agent is unknown (b), deliberately withheld (c), or irrelevant (d). Roughly four passives in five have no by-phrase at all; adding one out of habit is the commonest overcorrection.\u003c/p>","P3":"\u003cp>should \u003cstrong>be\u003c/strong> · has \u003cstrong>been\u003c/strong> · is \u003cstrong>being\u003c/strong> · hates \u003cstrong>being\u003c/strong>. One rule covers all four: whatever form the sentence needs, it lands on \u003cem>be\u003c/em>, and the main verb stays a past participle.\u003c/p>","F1":"\u003cp>(a) deliberately hidden — somebody decided, and the sentence declines to say who.\u003c/p>\u003cp>(b) unknown — nobody knows the thief.\u003c/p>\u003cp>(c) obvious — tutors mark essays; saying so would be noise.\u003c/p>\u003cp>(d) the famous evasion. Grammatically identical to (a), and the reason that phrase has become a joke: the passive is doing moral work, and everybody can see it.\u003c/p>","F2":"\u003cp>(a) → has been changed twice by the office.\u003c/p>\u003cp>(b) → It should be reported.\u003c/p>\u003cp>(c) → The new rules were explained to the students. \u003cem>explain\u003c/em> does not take a person as object, so it has no personal passive.\u003c/p>\u003cp>(d) → is being refitted.\u003c/p>","F3":"\u003cp>(a) Our hall appears to have been double-booked.\u003c/p>\u003cp>(b) We do not seem to have received the confirmation.\u003c/p>\u003cp>Both say exactly what happened and accuse nobody. Note the second goes further still — it puts the failure on our side of the exchange, which is the cheapest possible way to buy goodwill when you need something fixed.\u003c/p>"},"rows":[27,28,29,30,31,32,33,34]};</script>
