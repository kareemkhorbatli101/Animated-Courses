<script>window.ITEM={"kind":"exercise","id":"AD 020","slug":"ad-020","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business and economics · responsibility: who should act","payload":{"Strategy":"locate the actor who bears the cost of acting and the benefit of not","Grammar":"modals of obligation across agents","Vocabulary":"free rider, first mover, externality, collective action","Convention":"assigning duties when acting alone is self-defeating"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Elsa names a structural problem. What is it called?\u003c/p>\u003cp>b.  Karim offers counter-examples. What would make them decisive, and are they?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a free rider, and what is a first-mover disadvantage?\u003c/p>\u003cp>b.  What is a collective action problem?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Karim his examples and keep Elsa’s conclusion, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says Karim’s examples are \"selected on the variable that does the work\". Explain.\u003c/p>\u003cp>b.  It then declines to simply endorse Elsa. On what basis?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"nobody can defect from it\" — where does \"defect\" come from, and what does importing it do?\u003c/p>\u003cp>b.  \"coffee sourcing, not warehouse scheduling\" — why two concrete examples rather than a general statement?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  A collective action problem, with a first-mover disadvantage: the cost is private and the benefit is shared, so the rational individual move is to wait.\u003c/p>\u003cp>b.  They would be decisive if they were drawn from cases where the improvement was invisible to buyers. They are not, which is what the response identifies.\u003c/p>","P2":"\u003cp>a.  A free rider takes a benefit without paying for it. A first-mover disadvantage is the cost borne by whoever acts before the others, which the free riders then share in.\u003c/p>\u003cp>b.  A situation in which everyone would be better off if all acted, but each is individually better off not acting. It is the entire content of Elsa’s argument.\u003c/p>","P3":"\u003cp>Model: \"His examples are all cases where the buyer could see the standard, which is exactly the condition under which the collective action problem does not arise.\"\u003c/p>","F1":"\u003cp>a.  The examples are not a random sample of firms that raised standards; they are the ones where raising standards was commercially visible. Since visibility is precisely what determines whether the market rewards the move, the sample is selected on the explanatory variable and cannot test the claim.\u003c/p>\u003cp>b.  On speed and on the existence of an alternative instrument. Her diagnosis is right but her remedy is too narrow: what the problem needs is a binding floor, and a regulator is one way of producing one but not the only way.\u003c/p>","F2":"\u003cp>a.  From game theory, where defection is the unilateral move away from a cooperative agreement. Importing it names the precise property the floor must have, and makes clear that the issue is enforceability rather than authority.\u003c/p>\u003cp>b.  Because the distinction between visible and invisible standards is abstract and the examples make it instantly checkable. The reader tests the claim against two cases they already understand, which is faster than any definition.\u003c/p>","F3":"\u003cp>1.  It distributes responsibility to everyone, which is the answer the question was designed to make you improve on.\u003c/p>\u003cp>2.  Elsa’s structural point is acknowledged and then dissolved by wishful thinking: \"if more companies decide to do the right thing then it will become normal\" simply asserts that the collective action problem solves itself.\u003c/p>\u003cp>3.  Language: \"control that they are respected\" is a false friend for \"enforce them\"; \"the whole society\", \"the companies\", \"the governments\" over-articled; \"a real change\" is vague.\u003c/p>"},"model":["Elsa has the structure right and Karim’s examples do not touch it. The firms that raised standards unilaterally and prospered are mostly ones where the standard was visible to customers — coffee sourcing, not warehouse scheduling. Where the improvement is invisible at the point of sale, there is no mechanism by which the market rewards it, and the first mover simply pays. His counter-examples are therefore selected on the variable that does the work.","But the conclusion is not simply the state, because the state is slow and industry bodies exist precisely for this. The useful distinction is between standards that can be verified by a buyer and standards that cannot. The first can be left to firms with a credible label behind them; the second need a floor that applies to everyone simultaneously, which is what removes the disadvantage of moving first. That floor can come from a regulator or from a binding industry agreement — what matters is not which body issues it but that nobody can defect from it, which is the one feature Karim’s voluntarism cannot supply."],"model_html":"\u003cp>Elsa has the structure right and Karim’s examples do not touch it. The firms that raised standards unilaterally and prospered are mostly ones where the standard was visible to customers — coffee sourcing, not warehouse scheduling. Where the improvement is invisible at the point of sale, there is no mechanism by which the market rewards it, and the first mover simply pays. His counter-examples are therefore selected on the variable that does the work.\u003c/p>\u003cp>But the conclusion is not simply the state, because the state is slow and industry bodies exist precisely for this. The useful distinction is between standards that can be verified by a buyer and standards that cannot. The first can be left to firms with a credible label behind them; the second need a floor that applies to everyone simultaneously, which is what removes the disadvantage of moving first. That floor can come from a regulator or from a binding industry agreement — what matters is not which body issues it but that nobody can defect from it, which is the one feature Karim’s voluntarism cannot supply.\u003c/p>","model_band":5,"degraded":["In my opinion all three actors have responsibility in this matter because improving standards is a shared goal for the whole society. The companies should act ethically and not only think about their profits, the industry associations should create codes of conduct for their members, and the governments should make laws and control that they are respected. Elsa is right that it is difficult for one company alone but if more companies decide to do the right thing then it will become normal in the sector and the others will follow. So I think we need cooperation between all the actors to achieve a real change."],"degraded_html":"\u003cp>In my opinion all three actors have responsibility in this matter because improving standards is a shared goal for the whole society. The companies should act ethically and not only think about their profits, the industry associations should create codes of conduct for their members, and the governments should make laws and control that they are respected. Elsa is right that it is difficult for one company alone but if more companies decide to do the right thing then it will become normal in the sector and the others will follow. So I think we need cooperation between all the actors to achieve a real change.\u003c/p>","degraded_band":3,"model_words":180,"fault_list":{"tag":"F3","faults":["It distributes responsibility to everyone, which is the answer the question was designed to make you improve on.","Elsa’s structural point is acknowledged and then dissolved by wishful thinking: \"if more companies decide to do the right thing then it will become normal\" simply asserts that the collective action problem solves itself.","Language: \"control that they are respected\" is a false friend for \"enforce them\"; \"the whole society\", \"the companies\", \"the governments\" over-articled; \"a real change\" is vague."],"html":["\u003cp>1.  It distributes responsibility to everyone, which is the answer the question was designed to make you improve on.\u003c/p>","\u003cp>2.  Elsa’s structural point is acknowledged and then dissolved by wishful thinking: \"if more companies decide to do the right thing then it will become normal\" simply asserts that the collective action problem solves itself.\u003c/p>","\u003cp>3.  Language: \"control that they are respected\" is a false friend for \"enforce them\"; \"the whole society\", \"the companies\", \"the governments\" over-articled; \"a real change\" is vague.\u003c/p>"]},"prof_name":"Dr Castellanos","professor":"\u003cp>Firms that raise wages, cut emissions or lengthen contracts ahead of their competitors often lose market share for doing so. Who should be responsible for raising standards — individual firms, industry bodies, or the state?\u003c/p>","students":[["Karim","Firms. Waiting for regulation is how nothing happens for twenty years. Plenty of companies have raised standards unilaterally and survived, and some have been rewarded for it."],["Elsa","The state. A firm that moves first takes the whole cost and shares the benefit with every competitor who did not. Asking individual firms to solve that is asking them to lose on purpose, and most boards are not permitted to."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: “control that they are respected” is a false friend for “enforce them”; “the whole society”, “the companies”, “the governments” over-articled; “a real change” is vague.","correct":true},{"text":"It argues the case instead of asking the question. “I have already learned all this material and it would be a waste of time” asserts the conclusion the assessor is supposed to reach, on no evidence.","correct":false},{"text":"It distributes responsibility to everyone, which is the answer the question was designed to make you improve on.","correct":true},{"text":"Elsa’s structural point is acknowledged and then dissolved by wishful thinking: “if more companies decide to do the right thing then it will become normal” simply asserts that the collective action problem solves itself.","correct":true},{"text":"The offer is concealed. “A very limited budget” does not say whether travel is covered or whether a fee exists, so she cannot evaluate it without a further exchange.","correct":false},{"text":"It accuses rather than reports. “totally unacceptable” and “the university is always talking about student safety but then you cut the services” make it a political argument rather than a request, and address it to a clerk who did not take the decision.","correct":false}],"key_html":"F3"}};</script>
