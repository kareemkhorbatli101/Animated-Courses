<script>window.ITEM={"kind":"exercise","id":"AD 094","slug":"ad-094","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Operations research · agree / disagree","payload":{"Strategy":"question what an optimum is defined over","Grammar":"relative clauses with for which","Vocabulary":"objective function, constraint, optimum, robustness","Convention":"questioning the objective rather than the solution"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Pavel concedes the criticism. What is his counter-claim?\u003c/p>\u003cp>b.  Why might some objectives be hard to write down at all?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is an objective function, and what is a constraint?\u003c/p>\u003cp>b.  What does robustness mean for a schedule?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence about what optimisation can and cannot fix.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Nina’s diagnosis and Pavel’s remedy. Where does it go beyond both?\u003c/p>\u003cp>b.  Why does it list specific constraints?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"no shift pattern for which an employee has less than eleven hours between shifts\" — what does the for which clause contribute?\u003c/p>\u003cp>b.  \"anything uncosted becomes a free variable the solver will spend\" — what does this explain?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the fault is in the objective rather than in optimisation, and that the alternative — human scheduling — was also optimising, for worse things.\u003c/p>\u003cp>b.  Because some values are contextual: which particular weekend matters depends on circumstances the worker knows and the system cannot, so no general function captures them.\u003c/p>","P2":"\u003cp>a.  The objective function is the quantity being maximised or minimised; a constraint is a condition any admissible solution must satisfy.\u003c/p>\u003cp>b.  How well it survives disruption — sickness, demand spikes — without cascading changes through everyone else’s shifts.\u003c/p>","P3":"\u003cp>Model: \"Optimisation can absorb any preference that can be stated, so what cannot be stated must be left outside the solver.\"\u003c/p>","F1":"\u003cp>a.  In distinguishing preferences that can be written as constraints from those that cannot, and proposing that the second be handled by leaving slack for workers to allocate themselves. Neither speaker separates those.\u003c/p>\u003cp>b.  Because Pavel’s claim that objectives can be improved is only persuasive if improvement is demonstrable. Three concrete constraints show the claim is not hand-waving, and they also mark where the list stops.\u003c/p>","F2":"\u003cp>a.  It lets a constraint be expressed as a property of the pattern itself, which is how such rules are actually written. The precision is the point: it shows the response knows what a constraint looks like rather than gesturing at \"better objectives\".\u003c/p>\u003cp>b.  Why the harm is systematic rather than malicious. A solver does not neglect uncosted goods; it actively consumes them, because they are the cheapest thing available to trade. That is a stronger account than indifference.\u003c/p>","F3":"\u003cp>1.  \"Companies do not care about their employees, so they will never choose better objectives\" changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.\u003c/p>\u003cp>2.  \"Technology should serve people, not the other way round\" is a slogan where a mechanism was needed.\u003c/p>\u003cp>3.  No distinction between statable and contextual preferences, no constraint, no proposal — and Pavel’s point that hand-made rosters favoured the supervisor’s friends is never answered.\u003c/p>"},"model":["Both are true, and Pavel’s remedy is right about the method and incomplete about what it can reach.","Nina’s diagnosis is exact. An optimum is only ever optimal for the function it was given, and the things a roster destroys — predictability, the ability to arrange childcare, a weekend that coincides with somebody else’s — are not usually in the function. They are not excluded deliberately; they are absent because nobody could cost them, and anything uncosted becomes a free variable the solver will spend.","His reply is still substantially right. The comparison is not with a perfect roster but with a human one, which was optimal for convenience and favour, and many of these preferences can in fact be written down: no shift pattern for which an employee has less than eleven hours between shifts, two consecutive days off a fortnight, stability of the pattern itself.","What his answer cannot reach is anything whose value is contextual rather than statable — which weekend matters to which person this month. So I would optimise against far more constraints and leave a block of shifts for workers to swap among themselves, because what cannot be written into the objective has to be left outside the solver rather than treated as having no value."],"model_html":"\u003cp>Both are true, and Pavel’s remedy is right about the method and incomplete about what it can reach.\u003c/p>\u003cp>Nina’s diagnosis is exact. An optimum is only ever optimal for the function it was given, and the things a roster destroys — predictability, the ability to arrange childcare, a weekend that coincides with somebody else’s — are not usually in the function. They are not excluded deliberately; they are absent because nobody could cost them, and anything uncosted becomes a free variable the solver will spend.\u003c/p>\u003cp>His reply is still substantially right. The comparison is not with a perfect roster but with a human one, which was optimal for convenience and favour, and many of these preferences can in fact be written down: no shift pattern for which an employee has less than eleven hours between shifts, two consecutive days off a fortnight, stability of the pattern itself.\u003c/p>\u003cp>What his answer cannot reach is anything whose value is contextual rather than statable — which weekend matters to which person this month. So I would optimise against far more constraints and leave a block of shifts for workers to swap among themselves, because what cannot be written into the objective has to be left outside the solver rather than treated as having no value.\u003c/p>","model_band":5,"degraded":["I agree that algorithms can produce bad results for workers because they only care about efficiency and not about human beings. Companies use these systems to maximise profit and minimise labour costs, which means unpredictable hours and stressful working conditions. Technology should serve people, not the other way round. Pavel says we should write better objectives but I think the real problem is that companies do not care about their employees, so they will never choose objectives that prioritise worker wellbeing."],"degraded_html":"\u003cp>I agree that algorithms can produce bad results for workers because they only care about efficiency and not about human beings. Companies use these systems to maximise profit and minimise labour costs, which means unpredictable hours and stressful working conditions. Technology should serve people, not the other way round. Pavel says we should write better objectives but I think the real problem is that companies do not care about their employees, so they will never choose objectives that prioritise worker wellbeing.\u003c/p>","degraded_band":3,"model_words":209,"fault_list":{"tag":"F3","faults":["\"Companies do not care about their employees, so they will never choose better objectives\" changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.","\"Technology should serve people, not the other way round\" is a slogan where a mechanism was needed.","No distinction between statable and contextual preferences, no constraint, no proposal — and Pavel’s point that hand-made rosters favoured the supervisor’s friends is never answered."],"html":["\u003cp>1.  \"Companies do not care about their employees, so they will never choose better objectives\" changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.\u003c/p>","\u003cp>2.  \"Technology should serve people, not the other way round\" is a slogan where a mechanism was needed.\u003c/p>","\u003cp>3.  No distinction between statable and contextual preferences, no constraint, no proposal — and Pavel’s point that hand-made rosters favoured the supervisor’s friends is never answered.\u003c/p>"]},"prof_name":"Professor Zhou","professor":"\u003cp>Scheduling algorithms now allocate shifts in hospitals, warehouses and call centres, producing rosters that are provably optimal against stated objectives. Critics say the results are nonetheless worse for the people working them. Can both be true?\u003c/p>","students":[["Nina","Of course both are true. The optimum is optimal for the objective someone wrote down, and nobody wrote down \"a life\"."],["Pavel","Then the fix is to write better objectives, not to abandon optimisation. Hand-made rosters were optimal for whoever was friends with the supervisor."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"No distinction between statable and contextual preferences, no constraint, no proposal — and Pavel’s point that hand-made rosters favoured the supervisor’s friends is never answered.","correct":true},{"text":"“Very frustrating”, “we do not learn properly” and “I am sure this would make a big difference” are affect rather than argument, and nothing is offered that the reader could forward.","correct":false},{"text":"It asks Dami to absorb the loss. “Would you be able to take the children this Wednesday” is exactly the request the situation rules out, and the offered repayment does not help someone who cannot miss this particular week.","correct":false},{"text":"Consequential language errors. “in this day” / “in Saturday” (on), “very busy person” (a very busy person), “we are already prepare” (have already prepared). Compare the official ETS email sample reproduced at the front of this book: it contains three misspellings and still earns a 4. What capped that response was a verb-tense failure. Errors cost you marks in proportion to how much they damage meaning, not in proportion to how many there are.","correct":false},{"text":"“Companies do not care about their employees, so they will never choose better objectives” changes the subject from whether optimisation can accommodate the values to whether anyone wants it to.","correct":true},{"text":"“Technology should serve people, not the other way round” is a slogan where a mechanism was needed.","correct":true}],"key_html":"F3"}};</script>
