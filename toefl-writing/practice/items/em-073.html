<script>window.ITEM={"kind":"exercise","id":"EM 073","slug":"em-073","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Clarification request","payload":{"Strategy":"quote the ambiguity rather than describing it","Grammar":"embedded questions","Vocabulary":"rubric, weighting, criterion, verbatim","Convention":"asking about an ambiguous instruction"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why quote the brief verbatim rather than paraphrase it?\u003c/p>\u003cp>b.  There is a penalty for over-length. How does that change the urgency?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a rubric, and what is a criterion?\u003c/p>\u003cp>b.  What does verbatim mean, and why does it matter here?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask the question in one sentence containing both readings.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The brief is quoted exactly, including the brackets. Why does that matter?\u003c/p>\u003cp>b.  \"The two versions are different pieces of work\" — what is this sentence for?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Does the 2,000 apply to the whole submission or to each review?\" — why a direct question here rather than \"I was wondering whether...\"?\u003c/p>\u003cp>b.  \"even a one-word reply today\" — what does this do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the ambiguity is in the wording itself. Quoted, the reader can see the problem in two seconds; paraphrased, they have to go and find the brief and may read it the same way the writer did.\u003c/p>\u003cp>b.  It makes the question consequential rather than pedantic. Without the penalty the writer could simply pick one; with it, guessing wrong costs marks, which justifies asking.\u003c/p>","P2":"\u003cp>a.  A rubric is the published scheme by which work is marked; a criterion is one dimension within it.\u003c/p>\u003cp>b.  Word for word. It signals that the ambiguity is in the official text rather than in the writer’s understanding.\u003c/p>","P3":"\u003cp>Model: \"Does the 2,000 apply to the whole submission or to each review?\"\u003c/p>","F1":"\u003cp>a.  Because the bracket placement is the source of the ambiguity, and an exact quotation shows the office that the brief genuinely admits both readings. That makes it their drafting problem to resolve rather than the student’s comprehension problem to overcome.\u003c/p>\u003cp>b.  It forecloses the obvious unhelpful reply, which is that the student should write to the shorter limit to be safe. Explaining that the two readings produce different structures, not just different lengths, shows why a decision is actually needed.\u003c/p>","F2":"\u003cp>a.  Because an embedded question wrapped in \"I was wondering\" buries the thing being asked and invites a general reply about word limits. The direct question in the second line is the whole email, and it can be answered in one word.\u003c/p>\u003cp>b.  It names the smallest sufficient response, so the reader knows they are not being asked to draft an explanation. Reducing the implied reply to one word is what makes a same-day answer plausible.\u003c/p>","F3":"\u003cp>1.  The brief is described rather than quoted, so the office cannot see the ambiguity and may simply restate the limit.\u003c/p>\u003cp>2.  Neither reading’s consequence is spelled out, so the second bullet fails — nothing shows why the writer cannot just pick one.\u003c/p>\u003cp>3.  \"It would be unfair if we were penalised for something that was not explained properly\" complains about a penalty that has not been imposed, which turns a factual question into a grievance; \"several students are also confused\" adds pressure rather than information.\u003c/p>"},"model":["Dear Coursework Office,","The SOC301 brief reads, verbatim: \"a critical review of two papers (2,000 words)\". Does the 2,000 apply to the whole submission or to each review?","It matters because the rubric imposes a 10% penalty beyond the limit. On the first reading I have about 900 words per paper; on the second I have 4,000 in total, and a submission built for one would be heavily penalised under the other. The two versions are different pieces of work rather than the same one at different lengths.","I am not asking for an extension or for the limit to be changed — only for which reading is intended. Since the deadline is Friday, even a one-word reply today would let me carry on; if it is easier, I am happy to take whichever answer the module convenor gives and proceed on that.","Thank you.","Best wishes,","Ravi Sundaram — 2204822"],"model_html":"\u003cp>Dear Coursework Office,\u003c/p>\u003cp>The SOC301 brief reads, verbatim: \"a critical review of two papers (2,000 words)\". Does the 2,000 apply to the whole submission or to each review?\u003c/p>\u003cp>It matters because the rubric imposes a 10% penalty beyond the limit. On the first reading I have about 900 words per paper; on the second I have 4,000 in total, and a submission built for one would be heavily penalised under the other. The two versions are different pieces of work rather than the same one at different lengths.\u003c/p>\u003cp>I am not asking for an extension or for the limit to be changed — only for which reading is intended. Since the deadline is Friday, even a one-word reply today would let me carry on; if it is easier, I am happy to take whichever answer the module convenor gives and proceed on that.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ravi Sundaram — 2204822\u003c/p>","model_band":5,"degraded":["Dear Coursework Office, I am writing about the word limit for the SOC301 assignment. The brief is not very clear about whether the 2,000 words is for both papers together or for each one separately, and several students in my seminar group are also confused about this. Could you please clarify as soon as possible? The deadline is on Friday so this is quite urgent and it would be unfair if we were penalised for something that was not explained properly.","Ravi"],"degraded_html":"\u003cp>Dear Coursework Office, I am writing about the word limit for the SOC301 assignment. The brief is not very clear about whether the 2,000 words is for both papers together or for each one separately, and several students in my seminar group are also confused about this. Could you please clarify as soon as possible? The deadline is on Friday so this is quite urgent and it would be unfair if we were penalised for something that was not explained properly.\u003c/p>\u003cp>Ravi\u003c/p>","degraded_band":3,"model_words":153,"fault_list":{"tag":"F3","faults":["The brief is described rather than quoted, so the office cannot see the ambiguity and may simply restate the limit.","Neither reading’s consequence is spelled out, so the second bullet fails — nothing shows why the writer cannot just pick one.","\"It would be unfair if we were penalised for something that was not explained properly\" complains about a penalty that has not been imposed, which turns a factual question into a grievance; \"several students are also confused\" adds pressure rather than information."],"html":["\u003cp>1.  The brief is described rather than quoted, so the office cannot see the ambiguity and may simply restate the limit.\u003c/p>","\u003cp>2.  Neither reading’s consequence is spelled out, so the second bullet fails — nothing shows why the writer cannot just pick one.\u003c/p>","\u003cp>3.  \"It would be unfair if we were penalised for something that was not explained properly\" complains about a penalty that has not been imposed, which turns a factual question into a grievance; \"several students are also confused\" adds pressure rather than information.\u003c/p>"]},"scenario":"\u003cp>The assignment brief says \"a critical review of two papers (2,000 words)\". You cannot tell whether that means 2,000 words in total or per paper, and the marking rubric mentions a 10% penalty for over-length.\u003c/p>","bullets":["Quote the wording.","Say what both readings would mean for you.","Ask for a decision you can act on today."],"header":[["To:","coursework.soc@northgate.ac.uk"],["Subject:","SOC301 brief — 2,000 words total or each?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“It would be unfair if we were penalised for something that was not explained properly” complains about a penalty that has not been imposed, which turns a factual question into a grievance; “several students are also confused” adds pressure rather than information.","correct":true},{"text":"The twin study is described as proving that “both factors matter”, which nobody disputed, and “we should stop arguing about it” declines the question the prompt asks.","correct":false},{"text":"“Books are usually better than films anyway” is irrelevant to the question of how an adaptation should be judged, and “disrespectful to change it” assumes the conclusion.","correct":false},{"text":"It does not answer Omar. His objection is that the provision will be captured by the powerful; the response says “the judges can decide”, which assumes away the problem rather than addressing it — and is factually wrong about how delisting currently works.","correct":false},{"text":"The brief is described rather than quoted, so the office cannot see the ambiguity and may simply restate the limit.","correct":true},{"text":"Neither reading’s consequence is spelled out, so the second bullet fails — nothing shows why the writer cannot just pick one.","correct":true}],"key_html":"F3"}};</script>
