<script>window.ITEM={"kind":"exercise","id":"EM 012","slug":"em-012","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"complain about behaviour, never about people","Grammar":"nominalisation to depersonalise","Vocabulary":"noise: carry, travel, audible, consideration, quiet hours","Convention":"complaining about neighbours you must go on living beside"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You will still be living below these people next month. How should that shape the email?\u003c/p>\u003cp>b.  What is the difference between asking for enforcement and asking for a reminder?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Noise does not \u003cem>go\u003c/em> through a ceiling. Which verbs does English use?\u003c/p>\u003cpre class=\"mono\">carry · travel · pass · come through · leak\u003c/pre>\u003cp>b.  Turn these into nouns: to disturb → ; to be considerate → ; to repeat → .\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Describe the problem in one sentence in which no person is the subject.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why would “the students in Flat 14 are extremely inconsiderate” damage your case even if it is true?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer reports that the neighbours were polite. Why include something that weakens the complaint?\u003c/p>\u003cp>b.  Find the sentence that tells the office exactly how much action is wanted. Why is naming the ceiling as well as the floor important?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “music has been playing in the flat above”. Who is playing it? Rewrite with the neighbours as subject and describe what changes.\u003c/p>\u003cp>b.  “I am not asking for anyone to be disciplined.” Why state what you are \u003cem>not\u003c/em> asking for?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  \u003cem>audible\u003c/em> versus \u003cem>loud\u003c/em> — why is the first the better word in a complaint?\u003c/p>\u003cp>b.  What does \u003cem>carry more weight\u003c/em> mean, and why is it flattering to the reader?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A neighbour’s smoking is coming through your window. In 50 words, describe it without a human subject and ask for something proportionate.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It has to survive being read aloud on the landing. Anything you would not say to their faces should not be in it — and the request should be the smallest one that solves your problem, because you will be living with the consequences of the office’s response.\u003c/p>\u003cp>b.  Enforcement makes the neighbours your opponents and the office your instrument. A reminder lets everybody keep their standing: nobody is accused, nobody is punished, and the behaviour still changes.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>carry\u003c/strong>, \u003cstrong>travel\u003c/strong> and \u003cstrong>come through\u003c/strong> are all idiomatic. \u003cem>Pass\u003c/em> is odd, and \u003cem>leak\u003c/em> is used of light and secrets rather than sound.\u003c/p>\u003cp>b.  a \u003cstrong>disturbance\u003c/strong> ; \u003cstrong>consideration\u003c/strong> ; \u003cstrong>repetition\u003c/strong>. Each turns an action into a thing, which is precisely how you talk about behaviour without talking about a person.\u003c/p>","P3":"\u003cp>Model: \u003cem>Music has been playing in the flat above until well after midnight, three or four nights a week.\u003c/em>\u003c/p>\u003cp>The subject is \u003cem>music\u003c/em>. Nobody is doing anything to you; a sound is occurring. That is the whole technique.\u003c/p>","P4":"\u003cp>Because it is a judgement about character, and character is not something the office can investigate or remedy. It also forces them to take a side. Report the behaviour and the hours, and let the conclusion be theirs — it will be the same conclusion, and it will be one they can act on.\u003c/p>","F1":"\u003cp>a.  Because it is true, and because it makes the writer credible. Someone who concedes the other side was pleasant is obviously not exaggerating the rest. It also rules out the office’s easiest response — “have you tried talking to them?”\u003c/p>\u003cp>b.  “Would it be possible for the office simply to send the flat a general reminder about quiet hours, without naming me?” The ceiling is the limit of what is wanted; the floor is \u003cem>without naming me\u003c/em>. Setting both tells the reader exactly which action is acceptable, and prevents a well-meant escalation you would have to live with.\u003c/p>","F2":"\u003cp>a.  The neighbours, obviously — but naming them makes them agents of an act done to you. \u003cem>The students in Flat 14 have been playing music until after midnight\u003c/em> is an accusation; the original is an observation. Same facts, different relationship.\u003c/p>\u003cp>b.  Because the office’s standard response to a noise complaint is a disciplinary process, and once that starts you cannot stop it. Ruling it out explicitly is the only way to get the small remedy rather than the large one.\u003c/p>","F3":"\u003cp>a.  \u003cem>Audible\u003c/em> states a measurable fact: it can be heard, with the door shut. \u003cem>Loud\u003c/em> is relative to the hearer and invites the reply that it did not seem loud to anyone else.\u003c/p>\u003cp>b.  It means “be taken more seriously”. It is flattering because it attributes authority to the reader — and a reader who has just been told their word counts is more likely to spend it.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It attacks people, not behaviour.\u003c/strong> “very noisy and inconsiderate people”, “they don’t care”, “they just laughed”. None of this is actionable, and the last claim is unverifiable.\u003c/p>\u003cp>2.  \u003cstrong>The remedy is disproportionate.\u003c/strong> Asking for residents to be moved over music is a request the office will not grant, so the email achieves nothing — and the third bullet asked for something proportionate.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the flat 14” (Flat 14), “I went two times” (twice), “this situation cannot continue like this” (redundant), and “they are playing” for a repeated habit (they play).\u003c/p>","F5":"\u003cp>Model: \u003cem>Cigarette smoke comes through my window most evenings from the balcony next door. I would rather not raise it directly. Could you circulate a reminder?\u003c/em>\u003c/p>"},"model":["Dear Residences Team,","I live in Flat 10, Beechwood, directly below Flat 14. Over the past month music has been playing in the flat above until well after midnight, usually three or four nights a week. The bass carries through the ceiling clearly enough to be audible with the door shut.","I have been up twice to mention it, and on both occasions I was met perfectly pleasantly and the music was turned down for that night. The pattern has returned each week, though, and I do not think another knock on the door is going to change it.","I am not asking for anyone to be disciplined. Would it be possible for the office simply to send the flat a general reminder about quiet hours, without naming me? I think a note from residences would carry more weight than another conversation on the landing.","Thank you for considering it.","Best wishes,","Elena Novak — Flat 10, Beechwood"],"model_html":"\u003cp>Dear Residences Team,\u003c/p>\u003cp>I live in Flat 10, Beechwood, directly below Flat 14. Over the past month music has been playing in the flat above until well after midnight, usually three or four nights a week. The bass carries through the ceiling clearly enough to be audible with the door shut.\u003c/p>\u003cp>I have been up twice to mention it, and on both occasions I was met perfectly pleasantly and the music was turned down for that night. The pattern has returned each week, though, and I do not think another knock on the door is going to change it.\u003c/p>\u003cp>I am not asking for anyone to be disciplined. Would it be possible for the office simply to send the flat a general reminder about quiet hours, without naming me? I think a note from residences would carry more weight than another conversation on the landing.\u003c/p>\u003cp>Thank you for considering it.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Elena Novak — Flat 10, Beechwood\u003c/p>","model_band":5,"degraded":["Dear Sir,","The students who live in the flat 14 are very noisy and inconsiderate people. They are playing loud music every night until 2 or 3 o’clock and they don’t care about other people who must study. I went two times to speak with them but they just laughed and continued. I think you should give them a warning or move them to another building because this situation cannot continue like this.","Please take action urgently."],"degraded_html":"\u003cp>Dear Sir,\u003c/p>\u003cp>The students who live in the flat 14 are very noisy and inconsiderate people. They are playing loud music every night until 2 or 3 o’clock and they don’t care about other people who must study. I went two times to speak with them but they just laughed and continued. I think you should give them a warning or move them to another building because this situation cannot continue like this.\u003c/p>\u003cp>Please take action urgently.\u003c/p>","degraded_band":3,"model_words":157,"fault_list":{"tag":"F4","faults":["It attacks people, not behaviour. “very noisy and inconsiderate people”, “they don’t care”, “they just laughed”. None of this is actionable, and the last claim is unverifiable.","The remedy is disproportionate. Asking for residents to be moved over music is a request the office will not grant, so the email achieves nothing — and the third bullet asked for something proportionate.","Language. “the flat 14” (Flat 14), “I went two times” (twice), “this situation cannot continue like this” (redundant), and “they are playing” for a repeated habit (they play)."],"html":["\u003cp>1.  \u003cstrong>It attacks people, not behaviour.\u003c/strong> “very noisy and inconsiderate people”, “they don’t care”, “they just laughed”. None of this is actionable, and the last claim is unverifiable.\u003c/p>","\u003cp>2.  \u003cstrong>The remedy is disproportionate.\u003c/strong> Asking for residents to be moved over music is a request the office will not grant, so the email achieves nothing — and the third bullet asked for something proportionate.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “the flat 14” (Flat 14), “I went two times” (twice), “this situation cannot continue like this” (redundant), and “they are playing” for a repeated habit (they play).\u003c/p>"]},"scenario":"\u003cp>The flat above yours plays music late on weeknights. You have knocked twice and been met politely but nothing changed. You do not want the residents disciplined; you want to sleep. Quiet hours are after eleven.\u003c/p>","bullets":["Describe the problem factually.","Say what you have already tried.","Ask for something proportionate."],"header":[["To:","residences@northgate.ac.uk"],["Subject:","Noise after quiet hours — Flat 14, Beechwood"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language: “the main responsible” (those mainly responsible); “the pollution of the rivers”, “the infrastructure”, “the government” over-articled; “the rivers are dying” is rhetoric standing in for the measurement the question needed.","correct":false},{"text":"“A theory that cannot be tested is not really scientific” restates the criterion under challenge, and there is a comma splice in the first sentence.","correct":false},{"text":"The remedy is disproportionate. Asking for residents to be moved over music is a request the office will not grant, so the email achieves nothing — and the third bullet asked for something proportionate.","correct":true},{"text":"“Use common sense and follow a balanced diet” abandons the question, which was how to read such reports. Language: “the media”, “the food industry”, “the newspapers” over-articled; “anymore” should be “any more”.","correct":false},{"text":"Language. “the flat 14” (Flat 14), “I went two times” (twice), “this situation cannot continue like this” (redundant), and “they are playing” for a repeated habit (they play).","correct":true},{"text":"It attacks people, not behaviour. “very noisy and inconsiderate people”, “they don’t care”, “they just laughed”. None of this is actionable, and the last claim is unverifiable.","correct":true}],"key_html":"F4"}};</script>
