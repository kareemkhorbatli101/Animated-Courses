<script>window.ITEM={"kind":"exercise","id":"AD 024","slug":"ad-024","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology and society · cause ranking","payload":{"Strategy":"prefer the cause that explains the timing","Grammar":"causal chain with result clauses","Vocabulary":"cohort effect, period effect, self-report, salience","Convention":"ranking causes for a trend everyone has a theory about"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both cite timing. What would decide between two causes that both move at roughly the right moment?\u003c/p>\u003cp>b.  What is the third explanation doing in the question, and why do neither of them take it seriously?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish a cohort effect from a period effect.\u003c/p>\u003cp>b.  Why is \"expectations\" the hardest of the three to measure?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using a case where they come apart.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response uses a comparison to break a tie. Reconstruct it in one sentence.\u003c/p>\u003cp>b.  It rescues the explanation both classmates dismissed. How?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"with the result that people search longer\" — why a result clause rather than \"so\"?\u003c/p>\u003cp>b.  \"the one neither of them will touch\" — what is the effect of withholding the name until the next paragraph?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  A case where one is present and the other absent. If the trend appears when only one cause is present, that one is doing the work; if it appears in both, something common to both is.\u003c/p>\u003cp>b.  It is the explanation that cannot be measured with administrative data, so both reach for the variables that come with statistics. That is a selection effect in the argument rather than in the world, and the response exploits it.\u003c/p>","P2":"\u003cp>a.  A cohort effect is a lasting difference between people born at different times; a period effect hits everyone alive at a given moment regardless of age. Housing shocks are period effects; changed expectations look more like cohort ones.\u003c/p>\u003cp>b.  Because it is available only through self-report, and what people say they expect is shaped by what is currently normal — so the measure moves with the outcome it is meant to explain.\u003c/p>","P3":"\u003cp>Model: \"The shift appears in places with cheap housing and in places with short education, so whatever is common to both — the rising cost of choosing wrongly — is the better candidate.\"\u003c/p>","F1":"\u003cp>a.  The trend appears both where housing is cheap and where education is short, so neither alone can be the engine, and the cause common to both cases is the one to look for.\u003c/p>\u003cp>b.  By giving it a version that is not self-reported: not \"people want different things\" but \"the expected duration and symmetry of the commitment rose, which raises the cost of error\". That is a structural claim with testable consequences.\u003c/p>","F2":"\u003cp>a.  Because the argument needs the longer search to follow determinately from the raised cost of error. A result clause asserts that connection; \"so\" would leave it as a loose association, and the whole ranking depends on it holding.\u003c/p>\u003cp>b.  It creates a small gap the reader fills themselves, and the reader almost always fills it correctly — which means the third explanation arrives as their own thought rather than as the writer’s assertion. It also marks the paragraph break as a turn.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, listing all three with equal weight.\u003c/p>\u003cp>2.  Nothing is tested. Each cause is asserted with a plausible story and none is checked against a case where it would fail, which is what the question was asking for.\u003c/p>\u003cp>3.  The recommendation does not follow: if education and expectations matter as the response itself says, housing subsidies address a third of the problem. Language: \"like their parents did at the same age\" needs \"as\"; \"young people today want to enjoy their freedom\" is a stereotype offered as evidence.\u003c/p>"},"model":["The way to choose between Tove and Hugo is to find somewhere the two come apart, and they do. Countries with cheap housing and long education — much of eastern Europe through the 2000s — still show the shift, which is hard for Tove; countries where education lengths were stable but housing costs tripled show it too, which is hard for Hugo. A cause present in both arms of that comparison is doing the work, and the obvious candidate is the one neither of them will touch.","Changed expectations is treated as soft because it is self-reported, but it has a hard version: the expected duration of the commitment rose. When a partnership is expected to last and to involve equal careers, the cost of choosing wrongly rises, with the result that people search longer. That predicts exactly what we see — later first partnership, not fewer partnerships — and it predicts it in rich and poor housing markets alike. I would put expectations first, education second as the thing that supplies the opportunity to search, and housing third: a real constraint, but one that should produce different living arrangements rather than later ones, and largely does."],"model_html":"\u003cp>The way to choose between Tove and Hugo is to find somewhere the two come apart, and they do. Countries with cheap housing and long education — much of eastern Europe through the 2000s — still show the shift, which is hard for Tove; countries where education lengths were stable but housing costs tripled show it too, which is hard for Hugo. A cause present in both arms of that comparison is doing the work, and the obvious candidate is the one neither of them will touch.\u003c/p>\u003cp>Changed expectations is treated as soft because it is self-reported, but it has a hard version: the expected duration of the commitment rose. When a partnership is expected to last and to involve equal careers, the cost of choosing wrongly rises, with the result that people search longer. That predicts exactly what we see — later first partnership, not fewer partnerships — and it predicts it in rich and poor housing markets alike. I would put expectations first, education second as the thing that supplies the opportunity to search, and housing third: a real constraint, but one that should produce different living arrangements rather than later ones, and largely does.\u003c/p>","model_band":5,"degraded":["I think that all these reasons contribute to this phenomenon which we can observe in many countries today. Of course housing is very expensive now and young people cannot buy an apartment like their parents did at the same age, so they postpone having a family. Also they study for many years and they want to build their career first before thinking about children. And society has changed a lot, young people today want to enjoy their freedom and travel before they settle down. In my opinion governments should help young families with subsidies and affordable housing so they can start a family earlier."],"degraded_html":"\u003cp>I think that all these reasons contribute to this phenomenon which we can observe in many countries today. Of course housing is very expensive now and young people cannot buy an apartment like their parents did at the same age, so they postpone having a family. Also they study for many years and they want to build their career first before thinking about children. And society has changed a lot, young people today want to enjoy their freedom and travel before they settle down. In my opinion governments should help young families with subsidies and affordable housing so they can start a family earlier.\u003c/p>","degraded_band":3,"model_words":194,"fault_list":{"tag":"F3","faults":["It refuses to rank, listing all three with equal weight.","Nothing is tested. Each cause is asserted with a plausible story and none is checked against a case where it would fail, which is what the question was asking for.","The recommendation does not follow: if education and expectations matter as the response itself says, housing subsidies address a third of the problem. Language: \"like their parents did at the same age\" needs \"as\"; \"young people today want to enjoy their freedom\" is a stereotype offered as evidence."],"html":["\u003cp>1.  It refuses to rank, listing all three with equal weight.\u003c/p>","\u003cp>2.  Nothing is tested. Each cause is asserted with a plausible story and none is checked against a case where it would fail, which is what the question was asking for.\u003c/p>","\u003cp>3.  The recommendation does not follow: if education and expectations matter as the response itself says, housing subsidies address a third of the problem. Language: \"like their parents did at the same age\" needs \"as\"; \"young people today want to enjoy their freedom\" is a stereotype offered as evidence.\u003c/p>"]},"prof_name":"Dr Almeida","professor":"\u003cp>Across many countries, the age at which people form long-term partnerships and have children has risen steadily. Explanations offered include housing costs, longer education, and changed expectations about what a relationship should be. Which best explains the shift?\u003c/p>","students":[["Tove","Housing. The age curve tracks the price-to-income ratio almost everywhere, and it moved in the countries where housing moved. Expectations are downstream of being unable to afford a spare room."],["Hugo","Education and the labour market it feeds. People finish training later, start earning later, and move cities more often in their twenties. Housing is part of that story but it is not the engine."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Responsibility is deflected. “Something went wrong”, “maybe there was a sync problem” offers an agentless explanation for an action the writer took.","correct":false},{"text":"Nothing is tested. Each cause is asserted with a plausible story and none is checked against a case where it would fail, which is what the question was asking for.","correct":true},{"text":"The recommendation does not follow: if education and expectations matter as the response itself says, housing subsidies address a third of the problem. Language: “like their parents did at the same age” needs “as”; “young people today want to enjoy their freedom” is a stereotype offered as evidence.","correct":true},{"text":"It refuses to rank, listing all three with equal weight.","correct":true},{"text":"“Sent twice, on 2 April and 11 April” and “I still have not received your signature” put the reader’s failure at the centre, which makes replying an admission.","correct":false},{"text":"“I was doing my best to organise everything on my own which is not easy” is a bid for sympathy inside an apology, and it shifts the frame to the writer’s difficulties.","correct":false}],"key_html":"F3"}};</script>
