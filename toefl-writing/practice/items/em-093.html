<script>window.ITEM={"kind":"exercise","id":"EM 093","slug":"em-093","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Negotiation and rescheduling","payload":{"Strategy":"negotiate the scope before negotiating the deadline","Grammar":"unless as a negotiating hinge","Vocabulary":"deliverable, scope, descope, interim","Convention":"negotiating with someone who cannot move the deadline"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The final deadline is immovable and so is your data. What is left to negotiate?\u003c/p>\u003cp>b.  Why is \"I will do my best\" the worst possible answer here?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to descope something, and what is an interim deliverable?\u003c/p>\u003cp>b.  How does \"unless\" differ from \"if not\" in a negotiation?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Offer a partial deliverable in one sentence with a date and a content.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer offers to make their own work worse. Why is that a strong move?\u003c/p>\u003cp>b.  Find the sentence that reassures the group leader about the real deadline.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Unless you would rather I cut the survey element\" — why \"unless\" rather than \"or alternatively\"?\u003c/p>\u003cp>b.  \"it is a question of what the group would rather defend\" — what does this hand over?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Scope and sequence. If neither end can move, what remains is what is delivered when — which means breaking your section into parts that have different dependencies.\u003c/p>\u003cp>b.  Because it promises effort rather than output, which is exactly what a group leader cannot plan with. She needs to know what will exist on which date.\u003c/p>","P2":"\u003cp>a.  To descope is to remove something from what will be delivered; an interim deliverable is a partial output handed over before the final one.\u003c/p>\u003cp>b.  \"Unless\" presents the alternative as a condition that would change everything just said, which keeps it subordinate to your main proposal. \"Or alternatively\" presents two equal options and invites the reader to choose the easier one.\u003c/p>","P3":"\u003cp>Model: \"What I can give you on the 24th is the method section, the literature framing and the tables set up with dummy numbers.\"\u003c/p>","F1":"\u003cp>a.  Because it proves the writer is optimising for the group’s deadline rather than for their own section. A negotiator who will not accept any cost is not negotiating, and the offer also tests whether the leader actually values the survey element.\u003c/p>\u003cp>b.  \"I can have that to you by the evening of the 29th, which still leaves two days.\" It converts the delay from an open risk into a bounded one with slack stated.\u003c/p>","F2":"\u003cp>a.  Because it frames the alternative as a departure from the proposal rather than a rival to it, so the default stays the better plan. It also signals that the writer has a preference without stating one, which leaves the leader free to choose.\u003c/p>\u003cp>b.  The judgement about quality against risk, which is properly the group’s and not the writer’s. It also reframes both options as defensible, so choosing the safer one is not an admission that the work will be poor.\u003c/p>","F3":"\u003cp>1.  Nothing is offered. \"I will try to get it to you as soon as possible\" names no deliverable and no date, so the second and third bullets both fail.\u003c/p>\u003cp>2.  It pre-emptively disclaims responsibility (\"not my fault\") and then reassures the reader on her own subject — \"I am sure it will be fine\" is a judgement about the group’s risk that the writer is not the one carrying.\u003c/p>\u003cp>3.  No partial delivery is even considered, although two thirds of the section has no dependency on the survey at all, which is the fact the whole email should have been built on.\u003c/p>"},"model":["Hi Sana,","I cannot have the full section by the 24th, but I can have most of it, and I would rather tell you now than hand you a gap on the 1st.","The survey closes on the 28th, so the analysis and the findings paragraphs genuinely cannot exist before then. What I can give you on the 24th is the method section, the literature framing and the tables set up with dummy numbers, which is about two-thirds of the word count and all of the formatting.","That means the only work left after the 28th is dropping in figures and writing roughly four hundred words of findings. I can have that to you by the evening of the 29th, which still leaves two days.","Unless you would rather I cut the survey element entirely and write the section from the secondary data — that would hit the 24th cleanly and the section would be weaker. I am happy either way; it is a question of what the group would rather defend.","Nour"],"model_html":"\u003cp>Hi Sana,\u003c/p>\u003cp>I cannot have the full section by the 24th, but I can have most of it, and I would rather tell you now than hand you a gap on the 1st.\u003c/p>\u003cp>The survey closes on the 28th, so the analysis and the findings paragraphs genuinely cannot exist before then. What I can give you on the 24th is the method section, the literature framing and the tables set up with dummy numbers, which is about two-thirds of the word count and all of the formatting.\u003c/p>\u003cp>That means the only work left after the 28th is dropping in figures and writing roughly four hundred words of findings. I can have that to you by the evening of the 29th, which still leaves two days.\u003c/p>\u003cp>Unless you would rather I cut the survey element entirely and write the section from the secondary data — that would hit the 24th cleanly and the section would be weaker. I am happy either way; it is a question of what the group would rather defend.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi Sana, I am afraid I will not be able to send you my section by the 24th because my survey data only arrives on the 28th, which is not my fault as the platform decides the closing date. I will try to get it to you as soon as possible after that and I am sure it will be fine because we still have a few days before the final deadline. Sorry about this.","Nour"],"degraded_html":"\u003cp>Hi Sana, I am afraid I will not be able to send you my section by the 24th because my survey data only arrives on the 28th, which is not my fault as the platform decides the closing date. I will try to get it to you as soon as possible after that and I am sure it will be fine because we still have a few days before the final deadline. Sorry about this.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":173,"fault_list":{"tag":"F3","faults":["Nothing is offered. \"I will try to get it to you as soon as possible\" names no deliverable and no date, so the second and third bullets both fail.","It pre-emptively disclaims responsibility (\"not my fault\") and then reassures the reader on her own subject — \"I am sure it will be fine\" is a judgement about the group’s risk that the writer is not the one carrying.","No partial delivery is even considered, although two thirds of the section has no dependency on the survey at all, which is the fact the whole email should have been built on."],"html":["\u003cp>1.  Nothing is offered. \"I will try to get it to you as soon as possible\" names no deliverable and no date, so the second and third bullets both fail.\u003c/p>","\u003cp>2.  It pre-emptively disclaims responsibility (\"not my fault\") and then reassures the reader on her own subject — \"I am sure it will be fine\" is a judgement about the group’s risk that the writer is not the one carrying.\u003c/p>","\u003cp>3.  No partial delivery is even considered, although two thirds of the section has no dependency on the survey at all, which is the fact the whole email should have been built on.\u003c/p>"]},"scenario":"\u003cp>A group project report is due on 2 May and cannot be extended. Your section depends on survey data that will not arrive until 28 April. The group leader wants your draft by 24 April.\u003c/p>","bullets":["Say why 24 April is not possible.","Propose what you can deliver by then.","Protect the group’s deadline."],"header":[["To:","group7.mgmt@northgate.ac.uk"],["Subject:","My section — what I can have ready by the 24th"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Nothing is offered. “I will try to get it to you as soon as possible” names no deliverable and no date, so the second and third bullets both fail.","correct":true},{"text":"No partial delivery is even considered, although two thirds of the section has no dependency on the survey at all, which is the fact the whole email should have been built on.","correct":true},{"text":"It pre-emptively disclaims responsibility (“not my fault”) and then reassures the reader on her own subject — “I am sure it will be fine” is a judgement about the group’s risk that the writer is not the one carrying.","correct":true},{"text":"Language: “the health professionals”, “the patient and his history” (generic “their”), “the medicines and their interactions”, “the decisions about the treatment” — over-articled throughout; and “dangerous situations could be avoided” is agentless where the whole question is about agency.","correct":false},{"text":"Accumulated error. “the schools in the rich areas” (over-articled), “get the bad results”, “the table is not showing” (does not show — a habitual fact), “they are giving a wrong picture” (give a misleading picture). Note also that it is longer than the band-5 model and says less.","correct":false},{"text":"The reason reformulation works — that it reaches people who never engage with the information — is stated only as “people do not have time to read labels”, with nothing about distribution.","correct":false}],"key_html":"F3"}};</script>
