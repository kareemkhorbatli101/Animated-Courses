<script>window.ITEM={"kind":"exercise","id":"EM 041","slug":"em-041","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking · anchor item","payload":{"Strategy":"number your questions so they can be answered in one reply","Grammar":"indirect questions in series; whether … or","Vocabulary":"eligibility, criteria, deadline, supporting documents","Convention":"asking several things without sounding like an interrogation"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You have three questions. What happens to a reply if you bury them in a paragraph?\u003c/p>\u003cp>b.  Should you mention that the web page is out of date?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Which noun: the conditions you must meet to apply are the e________ c________ ; the papers you send with the form are the s________ d________ .\u003c/p>\u003cp>b.  \u003cem>Deadline\u003c/em>, \u003cem>closing date\u003c/em>, \u003cem>cut-off\u003c/em> — which would an office use in a formal notice?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Turn these into one indirect question: \u003c/p>\u003cpre class=\"mono\">Can postgraduates apply? Or is it only undergraduates?\u003c/pre>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Why is “Your website is wrong, it still shows last year’s date” a bad first sentence even though it is true and useful?\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The questions are numbered and each carries one line of context. What does that context do for the person replying?\u003c/p>\u003cp>b.  Find the sentence that offers the office a shortcut. Why is that the most useful line in the email?\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “Is the scheme open to postgraduates, \u003cem>or is it restricted\u003c/em> to undergraduates?” This is a direct question, not an embedded one. Why is that acceptable here when the guide has spent so long on indirect forms?\u003c/p>\u003cp>b.  “the scheme page \u003cem>may not have been updated\u003c/em>”. Three things are stacked on the verb. Name them, and say what the sentence would lose if written \u003cem>your page is out of date\u003c/em>.\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>Could you confirm\u003c/em> rather than \u003cem>Could you tell me\u003c/em> for question 1?\u003c/p>\u003cp>b.  \u003cem>either way\u003c/em> — what does it add to “the eligibility section does not say”?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>You need to know three things about a summer language course: whether accommodation is included, whether there is a placement test, and whether the fee can be paid in instalments. In 60 words, ask all three so they can be answered in one reply.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  One of them gets answered. A reader working through a paragraph answers the question they noticed and moves on, and you then need a second email for the other two — which costs you days.\u003c/p>\u003cp>b.  Yes, but as a reason for writing rather than as a complaint. \u003cem>as the scheme page may not have been updated for this round\u003c/em> explains why you are asking things the website ought to answer, without accusing anyone of neglecting it.\u003c/p>","P2":"\u003cp>a.  the \u003cstrong>eligibility criteria\u003c/strong> ; the \u003cstrong>supporting documents\u003c/strong>.\u003c/p>\u003cp>b.  \u003cstrong>Closing date\u003c/strong>. It is the formal term in notices and regulations. \u003cem>Deadline\u003c/em> is ordinary and perfectly usable; \u003cem>cut-off\u003c/em> is informal.\u003c/p>","P3":"\u003cp>Model: \u003cem>I wanted to ask whether the scheme is open to postgraduates or only to undergraduates.\u003c/em>\u003c/p>\u003cp>Note \u003cem>whether … or\u003c/em> rather than \u003cem>if\u003c/em>: when the alternatives are spelled out, \u003cem>whether\u003c/em> is the form that carries them.\u003c/p>","P4":"\u003cp>Because it opens with the reader’s failure rather than your purpose. The office knows the page is stale, or will discover it; what they do not know is who you are and what you need. Lead with the request, carry the criticism as a subordinate clause, and you get the same information across without the defensiveness.\u003c/p>","F1":"\u003cp>a.  It lets them answer without opening the file. “The page currently shows 15 March 2025” tells them exactly what is wrong and where, so the reply can be a single line. Context attached to a question is the difference between a one-minute answer and a ten-minute one.\u003c/p>\u003cp>b.  “If it is easier to send me the current guidance notes rather than answer each of these …”. It converts three questions into one attachment, which is the cheapest possible action for the office — and an email that offers the reader a cheaper way to help you is far more likely to be answered the same day.\u003c/p>","F2":"\u003cp>a.  Because these are questions to an office whose job is to answer them, not requests for a favour. Indirectness buys politeness at the cost of length, and here there is nothing to soften: you are not imposing, you are using the service. Over-hedging a routine enquiry reads as nervous, and in a numbered list it would be unbearable.\u003c/p>\u003cp>b.  A modal of possibility (\u003cem>may\u003c/em>), a perfect (\u003cem>have\u003c/em>), and a passive (\u003cem>been updated\u003c/em>). Together they say: this might be the case, it happened before now, and nobody in particular did it. \u003cem>Your page is out of date\u003c/em> asserts it flatly and attaches it to the reader with \u003cem>your\u003c/em>.\u003c/p>","F3":"\u003cp>a.  \u003cem>Confirm\u003c/em> presupposes that an answer exists and that the office knows it; it asks for a yes or a correction. \u003cem>Tell me\u003c/em> asks them to look it up from nothing. The first is a smaller request and gets a faster reply.\u003c/p>\u003cp>b.  It makes clear you looked and found genuine silence, rather than that you could not find the answer. It pre-empts the unhelpful reply “it is on the website”.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>The questions are unusable.\u003c/strong> All three are buried in one run-on sentence, so no reply can address them systematically — and the second bullet asked for them to be asked clearly.\u003c/p>\u003cp>2.  \u003cstrong>It complains and then over-asks.\u003c/strong> “your website is not updated and it is very confusing” opens on criticism; “please explain me everything … send me all the information” then asks for unbounded work instead of three specific answers.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “explain me” (explain to me), “master students” (postgraduates, or master’s students), “I wait your reply” (I look forward to your reply), and a comma splice running through the whole central sentence.\u003c/p>","F5":"\u003cp>Model: \u003cem>I am hoping to join the July intensive course and wanted to check three things before applying. 1. Is accommodation included in the published fee, or arranged separately? 2. Is there a placement test, and if so when is it held? 3. Can the fee be paid in instalments? If there is a current information pack, that would answer all three.\u003c/em>\u003c/p>"},"model":["Dear Scholarships Office,","I am a first-year MSc student in Archaeology and I am hoping to apply for the Nakamura Travel Scholarship for fieldwork this summer. Before I start the application I wanted to check three things, as the scheme page may not have been updated for this round.","1. Could you confirm the closing date for this year? The page currently shows 15 March 2025.","2. Is the scheme open to postgraduates, or is it restricted to undergraduates? The eligibility section does not say either way.","3. The form mentions one academic reference — should that come from my supervisor, or from any member of academic staff who knows my work?","If it is easier to send me the current guidance notes rather than answer each of these, that would be very welcome.","Thank you very much for your help.","Yours sincerely,","Marta Kowalczyk — MSc Archaeology"],"model_html":"\u003cp>Dear Scholarships Office,\u003c/p>\u003cp>I am a first-year MSc student in Archaeology and I am hoping to apply for the Nakamura Travel Scholarship for fieldwork this summer. Before I start the application I wanted to check three things, as the scheme page may not have been updated for this round.\u003c/p>\u003cp>1. Could you confirm the closing date for this year? The page currently shows 15 March 2025.\u003c/p>\u003cp>2. Is the scheme open to postgraduates, or is it restricted to undergraduates? The eligibility section does not say either way.\u003c/p>\u003cp>3. The form mentions one academic reference — should that come from my supervisor, or from any member of academic staff who knows my work?\u003c/p>\u003cp>If it is easier to send me the current guidance notes rather than answer each of these, that would be very welcome.\u003c/p>\u003cp>Thank you very much for your help.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Marta Kowalczyk — MSc Archaeology\u003c/p>","model_band":5,"degraded":["Hello,","I want to apply for the Nakamura scholarship but your website is not updated and it is very confusing, it shows the date of last year and it doesn’t explain if master students can apply or not and also about the reference I don’t know who must write it, maybe the supervisor or maybe another teacher, please explain me everything about this scholarship and send me all the information because I don’t want to make a mistake in my application.","Thank you, I wait your reply soon."],"degraded_html":"\u003cp>Hello,\u003c/p>\u003cp>I want to apply for the Nakamura scholarship but your website is not updated and it is very confusing, it shows the date of last year and it doesn’t explain if master students can apply or not and also about the reference I don’t know who must write it, maybe the supervisor or maybe another teacher, please explain me everything about this scholarship and send me all the information because I don’t want to make a mistake in my application.\u003c/p>\u003cp>Thank you, I wait your reply soon.\u003c/p>","degraded_band":3,"model_words":147,"fault_list":{"tag":"F4","faults":["The questions are unusable. All three are buried in one run-on sentence, so no reply can address them systematically — and the second bullet asked for them to be asked clearly.","It complains and then over-asks. “your website is not updated and it is very confusing” opens on criticism; “please explain me everything … send me all the information” then asks for unbounded work instead of three specific answers.","Language. “explain me” (explain to me), “master students” (postgraduates, or master’s students), “I wait your reply” (I look forward to your reply), and a comma splice running through the whole central sentence."],"html":["\u003cp>1.  \u003cstrong>The questions are unusable.\u003c/strong> All three are buried in one run-on sentence, so no reply can address them systematically — and the second bullet asked for them to be asked clearly.\u003c/p>","\u003cp>2.  \u003cstrong>It complains and then over-asks.\u003c/strong> “your website is not updated and it is very confusing” opens on criticism; “please explain me everything … send me all the information” then asks for unbounded work instead of three specific answers.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “explain me” (explain to me), “master students” (postgraduates, or master’s students), “I wait your reply” (I look forward to your reply), and a comma splice running through the whole central sentence.\u003c/p>"]},"scenario":"\u003cp>You are considering applying for a travel scholarship. The web page is out of date: it gives last year’s deadline, does not say whether postgraduates may apply, and mentions a reference without saying who it should come from.\u003c/p>","bullets":["Say briefly who you are and what you are asking about.","Ask your questions clearly.","Make it easy for the office to reply."],"header":[["To:","scholarships@northgate.ac.uk"],["Subject:","Nakamura Travel Scholarship — three questions"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The questions are unusable. All three are buried in one run-on sentence, so no reply can address them systematically — and the second bullet asked for them to be asked clearly.","correct":true},{"text":"“Human rights are universal” is asserted rather than defended, and no distinction is drawn between revising the principle and rejecting it, so there is no position on the actual question.","correct":false},{"text":"Language. “explain me” (explain to me), “master students” (postgraduates, or master’s students), “I wait your reply” (I look forward to your reply), and a comma splice running through the whole central sentence.","correct":true},{"text":"Language: “the readers”, “the newspapers”, “the market for literature” over-articled; “anymore” should be “any more”; and “connected with each other” is doing the work that an argument should.","correct":false},{"text":"“Everyone should do what they reasonably can according to their circumstances” is unfalsifiable and sets no limit, so it takes no position on where the line falls.","correct":false},{"text":"It complains and then over-asks. “your website is not updated and it is very confusing” opens on criticism; “please explain me everything … send me all the information” then asks for unbounded work instead of three specific answers.","correct":true}],"key_html":"F4"}};</script>
