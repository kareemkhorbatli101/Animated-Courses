<script>window.ITEM={"kind":"exercise","id":"AD 084","slug":"ad-084","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Materials science · policy choice","payload":{"Strategy":"choose the option that keeps the next decision open","Grammar":"participial clauses","Vocabulary":"recycling, feedstock, degradation, lifecycle","Convention":"choosing between two waste strategies"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Rafa concedes mechanical recycling works. What is his objection?\u003c/p>\u003cp>b.  What does \"locks in\" mean, and why is it a serious charge?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is feedstock, and what is degradation in this context?\u003c/p>\u003cp>b.  What is a lifecycle assessment?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Choose in one sentence that names what your choice keeps available.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response gives each speaker a different budget. Why is that not evasion?\u003c/p>\u003cp>b.  Why does the shared infrastructure matter so much to the argument?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Having built sorting infrastructure ... a region does acquire an interest\" — what does the participial clause do?\u003c/p>\u003cp>b.  \"procure sorting equipment specified to feed either\" — why is this the operative recommendation?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That it cannot close the loop. Each cycle degrades the material, so the waste is deferred rather than eliminated, and investment in it entrenches a system with a built-in endpoint.\u003c/p>\u003cp>b.  It means that investment creates sunk costs, contracts and interests that make later change expensive. It is serious because it turns a reasonable interim choice into a long-term constraint.\u003c/p>","P2":"\u003cp>a.  Feedstock is raw input material for manufacture; degradation is the loss of polymer properties with each reprocessing cycle.\u003c/p>\u003cp>b.  An accounting of environmental impacts across a product’s whole life, from extraction to disposal — which is how the energy cost of chemical recycling gets compared with the tonnes mechanical recycling diverts.\u003c/p>","P3":"\u003cp>Model: \"Deploy mechanical recycling now and fund chemical research, buying sorting equipment that can feed either.\"\u003c/p>","F1":"\u003cp>a.  Because deployment and development answer different questions, and the response says which gets which and why. Evasion would be funding both without specifying the role of each or addressing the lock-in risk.\u003c/p>\u003cp>b.  Because lock-in is the whole of Rafa’s objection, and it depends on the investment being specific to one route. If the expensive assets serve both, the objection shrinks to the reprocessing plants themselves.\u003c/p>","F2":"\u003cp>a.  It compresses the causal history into the front of the sentence, so the sentence can state the consequence without a separate clause. That keeps the concession to Rafa brisk rather than laboured.\u003c/p>\u003cp>b.  Because it is the one decision that actually preserves the option. Everything else in the proposal would be compatible with lock-in; specifying the sorting equipment is what prevents it.\u003c/p>","F3":"\u003cp>1.  \"All new technologies are unproven at first\" does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.\u003c/p>\u003cp>2.  \"The only real solution\" is asserted, with nothing about the energy cost that the prompt explicitly raises.\u003c/p>\u003cp>3.  No account of lock-in, shared infrastructure, or how the two routes might be sequenced — so the policy question is answered by preference rather than by argument.\u003c/p>"},"model":["Ida should get the money now and Rafa should get it in the research budget, because the two claims operate on different timescales.","Her case is simply that one technology exists. Mechanical recycling diverts material today at a cost per tonne that chemical processes will not match for years, and for packaging the quality loss is largely irrelevant. Waiting for the better option has a measurable cost in landfilled tonnes.","Rafa’s lock-in point is the one that needs care. Having built sorting infrastructure, collection contracts and reprocessing plants around mechanical recycling, a region does acquire an interest in continuing with it, and that is a real risk rather than a speculative one. But most of that infrastructure — collection, sorting, washing — is needed by chemical recycling too. The lock-in is weaker than it looks because the shared half is the expensive half.","So: fund mechanical recycling for deployment and chemical recycling for development, and procure sorting equipment specified to feed either. That takes the tonnes Ida can deliver now without foreclosing the system Rafa wants, which is the only part of his objection that money can answer."],"model_html":"\u003cp>Ida should get the money now and Rafa should get it in the research budget, because the two claims operate on different timescales.\u003c/p>\u003cp>Her case is simply that one technology exists. Mechanical recycling diverts material today at a cost per tonne that chemical processes will not match for years, and for packaging the quality loss is largely irrelevant. Waiting for the better option has a measurable cost in landfilled tonnes.\u003c/p>\u003cp>Rafa’s lock-in point is the one that needs care. Having built sorting infrastructure, collection contracts and reprocessing plants around mechanical recycling, a region does acquire an interest in continuing with it, and that is a real risk rather than a speculative one. But most of that infrastructure — collection, sorting, washing — is needed by chemical recycling too. The lock-in is weaker than it looks because the shared half is the expensive half.\u003c/p>\u003cp>So: fund mechanical recycling for deployment and chemical recycling for development, and procure sorting equipment specified to feed either. That takes the tonnes Ida can deliver now without foreclosing the system Rafa wants, which is the only part of his objection that money can answer.\u003c/p>","model_band":5,"degraded":["I think we should invest in chemical recycling because it is the only real solution to the plastic crisis, which is one of the biggest environmental problems we face. Mechanical recycling is not true recycling because the plastic gets worse each time and eventually ends up in landfill or the ocean anyway. We need to think long term and invest in innovation rather than continuing with inadequate solutions. Ida says chemical recycling is unproven but all new technologies are unproven at first."],"degraded_html":"\u003cp>I think we should invest in chemical recycling because it is the only real solution to the plastic crisis, which is one of the biggest environmental problems we face. Mechanical recycling is not true recycling because the plastic gets worse each time and eventually ends up in landfill or the ocean anyway. We need to think long term and invest in innovation rather than continuing with inadequate solutions. Ida says chemical recycling is unproven but all new technologies are unproven at first.\u003c/p>","degraded_band":3,"model_words":188,"fault_list":{"tag":"F3","faults":["\"All new technologies are unproven at first\" does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.","\"The only real solution\" is asserted, with nothing about the energy cost that the prompt explicitly raises.","No account of lock-in, shared infrastructure, or how the two routes might be sequenced — so the policy question is answered by preference rather than by argument."],"html":["\u003cp>1.  \"All new technologies are unproven at first\" does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.\u003c/p>","\u003cp>2.  \"The only real solution\" is asserted, with nothing about the energy cost that the prompt explicitly raises.\u003c/p>","\u003cp>3.  No account of lock-in, shared infrastructure, or how the two routes might be sequenced — so the policy question is answered by preference rather than by argument.\u003c/p>"]},"prof_name":"Professor Zhou","professor":"\u003cp>For plastic waste, a region can invest in mechanical recycling, which is cheap but degrades the material each cycle, or in chemical recycling, which recovers feedstock quality but is energy-intensive and commercially unproven. Which should receive public investment?\u003c/p>","students":[["Ida","Mechanical. It works now, at scale, and most plastic waste is packaging that does not need virgin-quality material. Chemical recycling is a promise with a pilot plant."],["Rafa","Mechanical recycling just postpones disposal — four or five cycles and it is waste anyway. Investing in it locks in a system that cannot close the loop."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It books her rather than inviting her. “Please confirm your attendance until Friday so we can print the programme” assumes the yes, sets a deadline, and attaches a consequence. “We are waiting for your positive answer” then forecloses the refusal entirely — the third bullet is unmet.","correct":false},{"text":"No real alternatives. “I am flexible and any other time is good for me” offers nothing usable and contradicts the paragraph that has just explained a constraint. The third bullet is unmet.","correct":false},{"text":"No account of lock-in, shared infrastructure, or how the two routes might be sequenced — so the policy question is answered by preference rather than by argument.","correct":true},{"text":"“The only real solution” is asserted, with nothing about the energy cost that the prompt explicitly raises.","correct":true},{"text":"“All new technologies are unproven at first” does not answer Ida’s point, which is about what can be deployed now against a measurable cost in landfilled tonnes.","correct":true},{"text":"It asks for a change of borrowing category — “like the staff have” — which nobody reading the email can grant. The second bullet fails.","correct":false}],"key_html":"F3"}};</script>
