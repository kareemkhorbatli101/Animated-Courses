<script>window.ITEM={"kind":"exercise","id":"AD 014","slug":"ad-014","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology and society · policy choice","payload":{"Strategy":"separate the effect of a policy from the effect of announcing it","Grammar":"nominalisation for abstraction","Vocabulary":"disclosure, stigma, salience, uptake","Convention":"arguing about a measure intended to help a group it might expose"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both want the same outcome. What exactly do they disagree about?\u003c/p>\u003cp>b.  Idris makes a claim about what applicants believe. Does it matter whether the belief is true?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is salience, and what is uptake?\u003c/p>\u003cp>b.  Distinguish stigma from discrimination.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Grant Idris’s point about fear and keep Ruth’s outcome, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the current question is \"worse than useless\". Why worse?\u003c/p>\u003cp>b.  Ruth’s stronger claim is handled separately at the end. Why not earlier?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it depends on applicants believing they might\" — why is this distinction the hinge of the argument?\u003c/p>\u003cp>b.  \"That is Ruth’s timing without Idris’s coercion.\" What is the effect of naming both classmates in one short sentence?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Timing and conditions, not principle. Both want support arranged early; they disagree about whether a question asked during a competitive process can collect honest answers.\u003c/p>\u003cp>b.  No, and that is the strongest form of his argument. If applicants believe disclosure is risky they will under-report whether or not the belief is accurate, so the data is corrupted either way.\u003c/p>","P2":"\u003cp>a.  Salience is how prominent something is in attention; uptake is how many people actually use a service offered.\u003c/p>\u003cp>b.  Stigma is the social mark attached to a condition; discrimination is differential treatment. Stigma can suppress disclosure entirely in the absence of any discrimination.\u003c/p>","P3":"\u003cp>Model: \"The fear is rational whether or not it is justified, which is an argument for moving the question after the offer rather than removing it.\"\u003c/p>","F1":"\u003cp>a.  Because a partial list presented as complete is more dangerous than no list. A university that believes it knows who needs support will plan against that figure, and the students missing from it are the ones Ruth identified as most at risk.\u003c/p>\u003cp>b.  Because it survives the main argument. Once the timing is fixed, her claim about non-disclosure is still live — and dealing with it last shows the writer has followed the argument to the end rather than stopping at a tidy synthesis.\u003c/p>","F2":"\u003cp>a.  Because it makes the objection immune to the obvious rebuttal. A university can truthfully say it does not discriminate; it cannot make applicants believe that, and belief is what determines the answers. The argument therefore survives the reassurance that would otherwise defeat it.\u003c/p>\u003cp>b.  It presents the proposal as a synthesis rather than a third position, which makes it much harder to object to — each classmate is being offered the thing they asked for.\u003c/p>","F3":"\u003cp>1.  The proposed solution is exactly what Idris pre-empted. Guaranteeing confidentiality and explaining that it will not affect admission is a reassurance; his argument was that reassurance does not change behaviour under competitive pressure.\u003c/p>\u003cp>2.  No position is really taken and nothing is added: both are restated, and the timing question — the actual axis of disagreement — is never identified.\u003c/p>\u003cp>3.  Language: \"the universities\", \"the stigma\", \"the admission decision\" over-articled; \"suffer in silence\" and \"feel safe to be honest\" are stock phrases rather than analysis.\u003c/p>"},"model":["Idris is right about the mechanism and I think it argues for changing when the question is asked rather than whether. His point does not actually depend on universities discriminating; it depends on applicants believing they might, and that belief is rational given how little anyone can verify about how a declaration is used. So the question as currently framed collects the least information from exactly the people Ruth wants to reach — which makes it worse than useless, because it also produces a list that looks complete.","The fix is separation. Ask after the offer is unconditional and before registration, by which point the applicant has nothing left to lose and support can still be arranged for September. That is Ruth’s timing without Idris’s coercion. The remaining difficulty is her stronger claim, that the students most in need will not come forward unprompted — but that is an argument for asking everyone a routine question at registration, not for asking it while the place is still in doubt."],"model_html":"\u003cp>Idris is right about the mechanism and I think it argues for changing when the question is asked rather than whether. His point does not actually depend on universities discriminating; it depends on applicants believing they might, and that belief is rational given how little anyone can verify about how a declaration is used. So the question as currently framed collects the least information from exactly the people Ruth wants to reach — which makes it worse than useless, because it also produces a list that looks complete.\u003c/p>\u003cp>The fix is separation. Ask after the offer is unconditional and before registration, by which point the applicant has nothing left to lose and support can still be arranged for September. That is Ruth’s timing without Idris’s coercion. The remaining difficulty is her stronger claim, that the students most in need will not come forward unprompted — but that is an argument for asking everyone a routine question at registration, not for asking it while the place is still in doubt.\u003c/p>","model_band":5,"degraded":["I think this is a very sensitive topic and both students raise important points about mental health which is a serious issue among young people today. Ruth is right that the universities should prepare the support in advance because many students suffer in silence and do not ask for help. However Idris is also right that students may be afraid to declare their condition because of the stigma and the possible discrimination. In my opinion universities should ask the question but they must guarantee complete confidentiality and explain clearly that the answer will not affect the admission decision, so the students will feel safe to be honest."],"degraded_html":"\u003cp>I think this is a very sensitive topic and both students raise important points about mental health which is a serious issue among young people today. Ruth is right that the universities should prepare the support in advance because many students suffer in silence and do not ask for help. However Idris is also right that students may be afraid to declare their condition because of the stigma and the possible discrimination. In my opinion universities should ask the question but they must guarantee complete confidentiality and explain clearly that the answer will not affect the admission decision, so the students will feel safe to be honest.\u003c/p>","degraded_band":3,"model_words":167,"fault_list":{"tag":"F3","faults":["The proposed solution is exactly what Idris pre-empted. Guaranteeing confidentiality and explaining that it will not affect admission is a reassurance; his argument was that reassurance does not change behaviour under competitive pressure.","No position is really taken and nothing is added: both are restated, and the timing question — the actual axis of disagreement — is never identified.","Language: \"the universities\", \"the stigma\", \"the admission decision\" over-articled; \"suffer in silence\" and \"feel safe to be honest\" are stock phrases rather than analysis."],"html":["\u003cp>1.  The proposed solution is exactly what Idris pre-empted. Guaranteeing confidentiality and explaining that it will not affect admission is a reassurance; his argument was that reassurance does not change behaviour under competitive pressure.\u003c/p>","\u003cp>2.  No position is really taken and nothing is added: both are restated, and the timing question — the actual axis of disagreement — is never identified.\u003c/p>","\u003cp>3.  Language: \"the universities\", \"the stigma\", \"the admission decision\" over-articled; \"suffer in silence\" and \"feel safe to be honest\" are stock phrases rather than analysis.\u003c/p>"]},"prof_name":"Dr Almeida","professor":"\u003cp>Some universities now ask applicants to declare mental health conditions so that support can be arranged in advance. Others have stopped asking, arguing that the question deters applications and that disclosure should be voluntary and late. Should universities ask at the application stage?\u003c/p>","students":[["Ruth","They should ask. Support arranged in September is support that works; support arranged in February, after a crisis, is damage limitation. The students who most need it are the least likely to come forward unprompted."],["Idris","They should not. An applicant deciding whether to tick a box on a competitive application is not making a free choice, and many will conclude that honesty costs them a place. You cannot build a support system on a question people are afraid to answer truthfully."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"No position is really taken and nothing is added: both are restated, and the timing question — the actual axis of disagreement — is never identified.","correct":true},{"text":"“The deadline is at the end of this month” is wrong and vague — the real cut-off is 28 April because of countersigning. The second bullet is not met and the third fails entirely.","correct":false},{"text":"The work is assigned to the reader. “The committee should organise it and find volunteers” is the whole scheme handed to an overstretched group, with “I would be happy to help if you need me” attached.","correct":false},{"text":"Nothing is offered. “I will try to get it to you as soon as possible” names no deliverable and no date, so the second and third bullets both fail.","correct":false},{"text":"Language: “the universities”, “the stigma”, “the admission decision” over-articled; “suffer in silence” and “feel safe to be honest” are stock phrases rather than analysis.","correct":true},{"text":"The proposed solution is exactly what Idris pre-empted. Guaranteeing confidentiality and explaining that it will not affect admission is a reassurance; his argument was that reassurance does not change behaviour under competitive pressure.","correct":true}],"key_html":"F3"}};</script>
