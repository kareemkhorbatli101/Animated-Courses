<script>window.ITEM={"kind":"exercise","id":"EM 097","slug":"em-097","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request to an authority","payload":{"Strategy":"ask the person who can act, and say why it is them","Grammar":"passive infinitives","Vocabulary":"escalate, triage, referral, caseworker","Convention":"writing to the right person after being passed around"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why does escalating require evidence of the normal route?\u003c/p>\u003cp>b.  Why not criticise the staff who passed you between offices?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to escalate something, and what is triage?\u003c/p>\u003cp>b.  What is a caseworker, and what is a referral?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Open in one sentence containing the fault, the duration and the count of referrals.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  \"Each of those was the right answer from the office that gave it\" — why defend the staff who failed to fix it?\u003c/p>\u003cp>b.  The writer asks for an owner rather than a repair. Why?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"without the repair being carried out\" — why the passive infinitive?\u003c/p>\u003cp>b.  \"which seems likely to be cheaper than a rent rebate for five weeks\" — what is this doing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because escalation is a claim that the normal route has failed, and that claim has to be demonstrable. Without the record, the obvious reply is to send you back to the accommodation office.\u003c/p>\u003cp>b.  Because each referral was probably correct within its own remit, and attacking staff gives the reader someone to defend. The failure is structural, and saying so is both truer and more useful.\u003c/p>","P2":"\u003cp>a.  To escalate is to raise a matter to a level with more authority; triage is sorting incoming cases by urgency.\u003c/p>\u003cp>b.  A caseworker is a named individual responsible for a case; a referral passes it to another office — which is exactly the difference the email is asking for.\u003c/p>","P3":"\u003cp>Model: \"The heater in 412 Ashdown has not worked since 14 March, five weeks, and I have been referred three times without the repair being carried out.\"\u003c/p>","F1":"\u003cp>a.  Because it removes the only easy reply — that a member of staff got it wrong and will be spoken to. If every individual acted correctly and the heater is still broken, the problem is the process, which is what the head of service can actually change.\u003c/p>\u003cp>b.  Because the repair has been requested four times already. The missing thing is not a request but accountability, and an owner is something only someone at this level can assign.\u003c/p>","F2":"\u003cp>a.  It keeps the sentence on the fault and the delay without naming who failed to act, which would turn the opening line into an accusation. The passive lets the writer state five weeks of inaction neutrally.\u003c/p>\u003cp>b.  It gives the reader a reason internal to their own budget. A temporary move stops the clock on a liability the handbook has already created, which is more persuasive than the writer’s discomfort.\u003c/p>","F3":"\u003cp>1.  No dates, no ticket number, no temperatures, no handbook commitment — nothing checkable, so the second bullet fails.\u003c/p>\u003cp>2.  \"Nobody in your organisation seems willing to take responsibility\" attacks the staff, which the third bullet rules out and which invites a defensive reply.\u003c/p>\u003cp>3.  \"Somebody to actually do something about it as soon as possible\" names no action, no owner and no date, so the first bullet fails too.\u003c/p>"},"model":["Dear Ms Oyelaran,","The heater in room 412 Ashdown has not worked since 14 March, five weeks, and I have been referred three times between offices without the repair being carried out. I am writing to you because the referrals suggest nobody below your level owns the problem.","The record, briefly: reported to the hall manager on 14 March, told to log it with Accommodation; logged 17 March (ticket 88214), told in April it was with Estates; referred to Welfare on 9 April, who told me correctly that they cannot order repairs. Each of those was the right answer from the office that gave it.","What I need is one person to own ticket 88214 until the heater works, and a date. The room has been measured at 13°C in the mornings; the handbook commits to 18°C.","If a repair cannot be scheduled this week, I would ask to be moved temporarily to another room, which seems likely to be cheaper than a rent rebate for five weeks.","Yours sincerely,","Priya Raman — 2201339, room 412 Ashdown"],"model_html":"\u003cp>Dear Ms Oyelaran,\u003c/p>\u003cp>The heater in room 412 Ashdown has not worked since 14 March, five weeks, and I have been referred three times between offices without the repair being carried out. I am writing to you because the referrals suggest nobody below your level owns the problem.\u003c/p>\u003cp>The record, briefly: reported to the hall manager on 14 March, told to log it with Accommodation; logged 17 March (ticket 88214), told in April it was with Estates; referred to Welfare on 9 April, who told me correctly that they cannot order repairs. Each of those was the right answer from the office that gave it.\u003c/p>\u003cp>What I need is one person to own ticket 88214 until the heater works, and a date. The room has been measured at 13°C in the mornings; the handbook commits to 18°C.\u003c/p>\u003cp>If a repair cannot be scheduled this week, I would ask to be moved temporarily to another room, which seems likely to be cheaper than a rent rebate for five weeks.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Priya Raman — 2201339, room 412 Ashdown\u003c/p>","model_band":5,"degraded":["Dear Ms Oyelaran, I am writing to you because I have completely run out of patience. My heater has been broken for over a month and nobody in your organisation seems willing to take responsibility for it. Every time I contact someone they tell me it is not their department and send me to someone else. This is unacceptable in a building that students pay a lot of money to live in. I would like somebody to actually do something about it as soon as possible.","Priya"],"degraded_html":"\u003cp>Dear Ms Oyelaran, I am writing to you because I have completely run out of patience. My heater has been broken for over a month and nobody in your organisation seems willing to take responsibility for it. Every time I contact someone they tell me it is not their department and send me to someone else. This is unacceptable in a building that students pay a lot of money to live in. I would like somebody to actually do something about it as soon as possible.\u003c/p>\u003cp>Priya\u003c/p>","degraded_band":3,"model_words":178,"fault_list":{"tag":"F3","faults":["No dates, no ticket number, no temperatures, no handbook commitment — nothing checkable, so the second bullet fails.","\"Nobody in your organisation seems willing to take responsibility\" attacks the staff, which the third bullet rules out and which invites a defensive reply.","\"Somebody to actually do something about it as soon as possible\" names no action, no owner and no date, so the first bullet fails too."],"html":["\u003cp>1.  No dates, no ticket number, no temperatures, no handbook commitment — nothing checkable, so the second bullet fails.\u003c/p>","\u003cp>2.  \"Nobody in your organisation seems willing to take responsibility\" attacks the staff, which the third bullet rules out and which invites a defensive reply.\u003c/p>","\u003cp>3.  \"Somebody to actually do something about it as soon as possible\" names no action, no owner and no date, so the first bullet fails too.\u003c/p>"]},"scenario":"\u003cp>You have been referred three times between the accommodation office, the welfare team and your hall manager about a broken heater, now in its fifth week. You are writing to the head of residential services.\u003c/p>","bullets":["Say what you need.","Show you have used the normal route.","Avoid attacking the people who referred you."],"header":[["To:","head.residences@northgate.ac.uk"],["Subject:","Room 412 Ashdown — heating, five weeks, three referrals"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The proposal ignores the question. “the government should give more money” is true of every health policy question and was not what was asked. No alternative to the charge is offered that could actually be implemented by a clinic.","correct":false},{"text":"Language: “all the three factors” (all three), “they are working together” for a general truth (work), “the governments” (governments).","correct":false},{"text":"No dates, no ticket number, no temperatures, no handbook commitment — nothing checkable, so the second bullet fails.","correct":true},{"text":"“Somebody to actually do something about it as soon as possible” names no action, no owner and no date, so the first bullet fails too.","correct":true},{"text":"“Nobody in your organisation seems willing to take responsibility” attacks the staff, which the third bullet rules out and which invites a defensive reply.","correct":true},{"text":"The notice-period distinction, which is where the policy actually lives, never appears; and the ban proposed at the end is not connected to anything argued. Language: “the weaker party”, “the market”, “individual workers” over-articled; “companies always talk about” is unsupported.","correct":false}],"key_html":"F3"}};</script>
