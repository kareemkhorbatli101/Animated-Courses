<script>window.ITEM={"kind":"exercise","id":"AD 040","slug":"ad-040","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Media and communication · responsibility: who should act","payload":{"Strategy":"ask which party can act without needing anyone’s permission","Grammar":"modals of obligation across agents","Vocabulary":"moderation, scale, liability, redress","Convention":"allocating duty where the obvious candidate cannot cope"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Felix concedes that the police do this badly. What is his argument despite that?\u003c/p>\u003cp>b.  Reem makes a capacity argument. Does Felix answer it?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is redress, and why does it matter that moderation offers none?\u003c/p>\u003cp>b.  Why does scale change what moderation can be?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Separate what each party can do, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says both are describing the same act. Which, and why is noticing that decisive?\u003c/p>\u003cp>b.  The third option in the question is dismissed in one sentence. Is that adequate?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the only party who can act without anyone’s permission\" — what criterion is being applied?\u003c/p>\u003cp>b.  \"it is an absence of one\" — what does the short final clause do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That a private process cannot deliver what a legal one can — a finding, a record, an appeal — so treating moderation as the remedy abandons redress even where it removes the content.\u003c/p>\u003cp>b.  No. He addresses what the police ought to provide and not whether they can provide it at volume, which is the gap the response fills.\u003c/p>","P2":"\u003cp>a.  Redress is a remedy for a wrong — a determination that it happened and a consequence. Moderation offers neither, so the person harmed gets quiet rather than justice.\u003c/p>\u003cp>b.  Because at a billion messages a day, moderation cannot be adjudication. It becomes classification under time pressure, which is a different activity with different error properties.\u003c/p>","P3":"\u003cp>Model: \"Platforms can stop the conduct immediately but offer no finding; the police can offer a finding but cannot reach the volume.\"\u003c/p>","F1":"\u003cp>a.  Removal of content. It is decisive because once you see that removal is only one component of a remedy, the question stops being who should do it and becomes who should do which part.\u003c/p>\u003cp>b.  Yes, provided the dismissal gives a reason, which it does: assigning responsibility to the person being harmed is not an allocation of duty but a failure to make one. Brevity is appropriate because the option does not survive being stated clearly.\u003c/p>","F2":"\u003cp>a.  Capacity to act unilaterally. A duty placed on a party that must first obtain a warrant, a court order or another company’s cooperation will not be discharged at speed, which is the whole problem with the status quo.\u003c/p>\u003cp>b.  It lands the judgement after a long sentence, in four words, and converts a policy proposal into a definition. The rhythm does the work: anything longer would argue the point where the short form simply settles it.\u003c/p>","F3":"\u003cp>1.  It allocates to everyone and then adds fines, without engaging Felix’s argument that private processes offer no redress.\u003c/p>\u003cp>2.  \"They could certainly do much more if they wanted\" attributes the problem to unwillingness and never addresses scale, which was Reem’s actual claim.\u003c/p>\u003cp>3.  \"Users should report the abuse\" places a duty on the harmed party without noticing. Language: \"the platforms\", \"the safety of their users\", \"the most serious cases\" over-articled; \"artificial intelligence\" is invoked as though it were a resource rather than a method.\u003c/p>"},"model":["Felix is right about what is lost and Reem is right about what is possible, and the disagreement survives because both are describing the same act — removal of a post — as though it were the whole remedy. It is not. Platform action stops the conduct and offers no finding, no record and no appeal; criminal process offers all three and reaches perhaps one case in a thousand. Those are complements, not rivals.","What is missing is the thing neither provides: a route by which a pattern becomes visible. A platform sees every message and treats them one at a time; the police see one report and cannot see the account history behind it. So I would put immediate action with the platforms, because they are the only party who can act without anyone’s permission, and place on them a duty to preserve and disclose on request — which is what converts a thousand deleted posts into the evidence Felix’s process needs. The users themselves I would leave out of it entirely: responsibility that falls on the person being harmed is not a policy, it is an absence of one."],"model_html":"\u003cp>Felix is right about what is lost and Reem is right about what is possible, and the disagreement survives because both are describing the same act — removal of a post — as though it were the whole remedy. It is not. Platform action stops the conduct and offers no finding, no record and no appeal; criminal process offers all three and reaches perhaps one case in a thousand. Those are complements, not rivals.\u003c/p>\u003cp>What is missing is the thing neither provides: a route by which a pattern becomes visible. A platform sees every message and treats them one at a time; the police see one report and cannot see the account history behind it. So I would put immediate action with the platforms, because they are the only party who can act without anyone’s permission, and place on them a duty to preserve and disclose on request — which is what converts a thousand deleted posts into the evidence Felix’s process needs. The users themselves I would leave out of it entirely: responsibility that falls on the person being harmed is not a policy, it is an absence of one.\u003c/p>","model_band":5,"degraded":["In my opinion the platforms have the main responsibility because they created these spaces and they are earning a lot of money from them, so they must also take care of the safety of their users. They have thousands of engineers and artificial intelligence, so they could certainly do much more if they wanted, but they prefer not to spend money on moderation. Of course the police should also intervene in the most serious cases, and users should report the abuse when they see it. Governments should impose heavy fines on the platforms that do not protect their users."],"degraded_html":"\u003cp>In my opinion the platforms have the main responsibility because they created these spaces and they are earning a lot of money from them, so they must also take care of the safety of their users. They have thousands of engineers and artificial intelligence, so they could certainly do much more if they wanted, but they prefer not to spend money on moderation. Of course the police should also intervene in the most serious cases, and users should report the abuse when they see it. Governments should impose heavy fines on the platforms that do not protect their users.\u003c/p>","degraded_band":3,"model_words":188,"fault_list":{"tag":"F3","faults":["It allocates to everyone and then adds fines, without engaging Felix’s argument that private processes offer no redress.","\"They could certainly do much more if they wanted\" attributes the problem to unwillingness and never addresses scale, which was Reem’s actual claim.","\"Users should report the abuse\" places a duty on the harmed party without noticing. Language: \"the platforms\", \"the safety of their users\", \"the most serious cases\" over-articled; \"artificial intelligence\" is invoked as though it were a resource rather than a method."],"html":["\u003cp>1.  It allocates to everyone and then adds fines, without engaging Felix’s argument that private processes offer no redress.\u003c/p>","\u003cp>2.  \"They could certainly do much more if they wanted\" attributes the problem to unwillingness and never addresses scale, which was Reem’s actual claim.\u003c/p>","\u003cp>3.  \"Users should report the abuse\" places a duty on the harmed party without noticing. Language: \"the platforms\", \"the safety of their users\", \"the most serious cases\" over-articled; \"artificial intelligence\" is invoked as though it were a resource rather than a method.\u003c/p>"]},"prof_name":"Dr Oyelowo","professor":"\u003cp>Online harassment of individuals is widespread and the response is inconsistent. Who should bear primary responsibility for dealing with it — the platforms, the police, or the users themselves?\u003c/p>","students":[["Reem","The platforms. They have the data, the tools and the contractual relationship with the abuser. The police cannot act at this volume and will not act for most of it."],["Felix","The police, however badly they do it now. Harassment is a crime and the remedy for a crime should not be a company’s terms of service, decided privately with no appeal and no record. Handing it to platforms means giving up on redress."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The title is not supplied, so the smallest possible action is still “search your inbox”. The second bullet fails entirely.","correct":false},{"text":"Language. “I got your email” (received), “I need this book very much”, “in Science library” (the Science library), “Waiting for your reply” (a sentence with no subject). The errors are not dense, but the register is wrong throughout, and register is scored.","correct":false},{"text":"“They could certainly do much more if they wanted” attributes the problem to unwillingness and never addresses scale, which was Reem’s actual claim.","correct":true},{"text":"No condition is given under which it would be a bad choice, so the third bullet fails; “you are better at this kind of thing than I am” is flattery substituting for information; and there are two comma splices.","correct":false},{"text":"“Users should report the abuse” places a duty on the harmed party without noticing. Language: “the platforms”, “the safety of their users”, “the most serious cases” over-articled; “artificial intelligence” is invoked as though it were a resource rather than a method.","correct":true},{"text":"It allocates to everyone and then adds fines, without engaging Felix’s argument that private processes offer no redress.","correct":true}],"key_html":"F3"}};</script>
