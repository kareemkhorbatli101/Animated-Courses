<script>window.ITEM={"kind":"exercise","id":"EM 095","slug":"em-095","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Negotiation and rescheduling","payload":{"Strategy":"negotiate by giving the other side the choice you can live with","Grammar":"alternative time structures","Vocabulary":"slot, lead time, turnaround, firm up","Convention":"negotiating with a supplier who has the upper hand"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You cannot pay the rush fee and cannot move the event. What is left?\u003c/p>\u003cp>b.  Why is \"is there any chance of a discount?\" a weak opening?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is lead time, and what is turnaround?\u003c/p>\u003cp>b.  What does it mean to firm up an order?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Propose a change to the job rather than to the price, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Three alternatives are offered. What do they have in common?\u003c/p>\u003cp>b.  The last paragraph gives up the negotiation. What does that achieve?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"whatever stock you already have on the shelf\" — why is this phrasing better than naming a cheaper paper?\u003c/p>\u003cp>b.  \"please do not hold the order on our account\" — what is being released?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  The specification. If price and date are both fixed, the only remaining variable is what is being printed — quantity, stock, finish, or how it is delivered.\u003c/p>\u003cp>b.  Because it asks the supplier to absorb the cost of your constraint for nothing in return, and it treats the price as the problem when the problem is the schedule.\u003c/p>","P2":"\u003cp>a.  Lead time is the interval between order and delivery; turnaround is how long the job itself takes once started. A rush fee usually buys queue position rather than speed.\u003c/p>\u003cp>b.  To confirm the details so production can begin — after which changes cost money.\u003c/p>","P3":"\u003cp>Model: \"We could drop from 150 booklets to 100, or move to whatever cover stock you already have on the shelf.\"\u003c/p>","F1":"\u003cp>a.  Each reduces the printer’s cost or constraint rather than asking them to give something up. A shorter run, a stock already held, and a split delivery all make the job easier to slot in, which is what actually moves a schedule.\u003c/p>\u003cp>b.  It removes the pressure and so makes agreement more likely. A supplier who knows the customer will not be angry at a no is free to look properly for a yes — and the society has protected itself from paying a rate it cannot afford.\u003c/p>","F2":"\u003cp>a.  Because it asks about their constraint rather than specifying a solution. Naming a paper might name one they would have to order, which would make things worse; \"already on the shelf\" defines the request by the property that actually matters.\u003c/p>\u003cp>b.  Their obligation to find a way. It tells them the order can proceed on the original timetable without further negotiation, which means no one has to keep the file open or make a decision under pressure.\u003c/p>","F3":"\u003cp>1.  Both requests are about price — a faster job at normal rate, or a discount on the rush — so the second bullet fails and the supplier is asked to absorb the whole problem.\u003c/p>\u003cp>2.  No change to the specification is considered, although quantity and stock are the obvious levers and cost the printer nothing.\u003c/p>\u003cp>3.  \"We are a non-profit\" and the offer of a mention are appeals for charity rather than proposals, and nothing releases the printer if the answer is no.\u003c/p>"},"model":["Dear Caldwell Print,","Thank you for the quote on order CP-4471. The difficulty is that our event is on 14 May, which gives eight working days rather than ten, and the rush rate is beyond what a student society can cover.","Rather than ask you to discount the rush service, I wondered whether any of the following would help:","We could drop from 150 booklets to 100, which is closer to what we actually need. We could move from the 170gsm cover to whatever stock you already have on the shelf. Or we could take delivery in two parts — eighty for the event and the rest whenever suits you — if a partial run is easier to fit in.","If none of those changes the schedule, we would rather have the full job late and hand out a single-sheet programme on the day than pay the rush rate, so please do not hold the order on our account.","Thank you.","Best wishes,","Tomas Reyes — Northgate Film Society"],"model_html":"\u003cp>Dear Caldwell Print,\u003c/p>\u003cp>Thank you for the quote on order CP-4471. The difficulty is that our event is on 14 May, which gives eight working days rather than ten, and the rush rate is beyond what a student society can cover.\u003c/p>\u003cp>Rather than ask you to discount the rush service, I wondered whether any of the following would help:\u003c/p>\u003cp>We could drop from 150 booklets to 100, which is closer to what we actually need. We could move from the 170gsm cover to whatever stock you already have on the shelf. Or we could take delivery in two parts — eighty for the event and the rest whenever suits you — if a partial run is easier to fit in.\u003c/p>\u003cp>If none of those changes the schedule, we would rather have the full job late and hand out a single-sheet programme on the day than pay the rush rate, so please do not hold the order on our account.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Tomas Reyes — Northgate Film Society\u003c/p>","model_band":5,"degraded":["Dear Caldwell Print, Thank you for your quote but unfortunately ten working days is too long for us as our event is on 14 May, and the rush service is far too expensive for a student society with a small budget. Is there any chance you could do it faster at the normal price, or give us a discount on the rush service? We are a non-profit organisation and we would be very grateful for any help you can offer. We could also mention your company in our programme.","Tomas"],"degraded_html":"\u003cp>Dear Caldwell Print, Thank you for your quote but unfortunately ten working days is too long for us as our event is on 14 May, and the rush service is far too expensive for a student society with a small budget. Is there any chance you could do it faster at the normal price, or give us a discount on the rush service? We are a non-profit organisation and we would be very grateful for any help you can offer. We could also mention your company in our programme.\u003c/p>\u003cp>Tomas\u003c/p>","degraded_band":3,"model_words":168,"fault_list":{"tag":"F3","faults":["Both requests are about price — a faster job at normal rate, or a discount on the rush — so the second bullet fails and the supplier is asked to absorb the whole problem.","No change to the specification is considered, although quantity and stock are the obvious levers and cost the printer nothing.","\"We are a non-profit\" and the offer of a mention are appeals for charity rather than proposals, and nothing releases the printer if the answer is no."],"html":["\u003cp>1.  Both requests are about price — a faster job at normal rate, or a discount on the rush — so the second bullet fails and the supplier is asked to absorb the whole problem.\u003c/p>","\u003cp>2.  No change to the specification is considered, although quantity and stock are the obvious levers and cost the printer nothing.\u003c/p>","\u003cp>3.  \"We are a non-profit\" and the offer of a mention are appeals for charity rather than proposals, and nothing releases the printer if the answer is no.\u003c/p>"]},"scenario":"\u003cp>A print shop says your society’s programme booklets will take ten working days. Your event is in eight. They have offered a rush service at double the price, which you cannot afford.\u003c/p>","bullets":["Explain your constraint.","Avoid simply asking for a discount.","Propose options that cost them little."],"header":[["To:","orders@caldwellprint.co.uk"],["Subject:","Order CP-4471 — eight days rather than ten?"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“We are a non-profit” and the offer of a mention are appeals for charity rather than proposals, and nothing releases the printer if the answer is no.","correct":true},{"text":"No change to the specification is considered, although quantity and stock are the obvious levers and cost the printer nothing.","correct":true},{"text":"Language. “the young people” (young people), “they are spending too much time” (spend — habitual), “their own life” (lives), “communities of people with the same interests” is fine but “the timing is suspicious” mistranslates Yuki’s point, which was about correlation, not suspicion.","correct":false},{"text":"“Young people want to travel and enjoy their freedom” treats values as a cause with no evidence, and the fact that rates fell in cheap-housing countries — the one piece of evidence in the discussion — is ignored.","correct":false},{"text":"“A small number of homeowners” mischaracterises her argument, which was about residents bearing disruption, not about property owners blocking change.","correct":false},{"text":"Both requests are about price — a faster job at normal rate, or a discount on the rush — so the second bullet fails and the supplier is asked to absorb the whole problem.","correct":true}],"key_html":"F3"}};</script>
