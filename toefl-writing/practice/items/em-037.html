<script>window.ITEM={"kind":"exercise","id":"EM 037","slug":"em-037","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline the terms, not the project","Grammar":"tentative suggestion with might","Vocabulary":"scope, deliverable, remit, revisit","Convention":"declining part of a request while keeping the rest"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You want to say yes to something. How does that change the shape of the refusal?\u003c/p>\u003cp>b.  Why is it dangerous to say yes to an unrealistic brief even if you want the experience?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish scope, remit and deliverable.\u003c/p>\u003cp>b.  What does it mean to revisit something, and why is it a useful word in a negotiation?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Decline the brief and accept the project in a single sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer itemises the brief before refusing it. Why is that more effective than saying it is too big?\u003c/p>\u003cp>b.  The email ends with a question. What does that do to the negotiation?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"The editing interface might be something to revisit next year\" — what does \"might\" protect here?\u003c/p>\u003cp>b.  \"which would be worse for the project than not starting\" — whose interest is this appealing to, and why that one?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It stops being a refusal and becomes a counter-proposal. The email has to spend most of its words on what you will do, not on what you will not.\u003c/p>\u003cp>b.  Because the failure arrives in September, publicly, with your name on it. An unrealistic yes damages the relationship you were trying to build, which is the thing you actually wanted from the work.\u003c/p>","P2":"\u003cp>a.  The scope is how much is included; the remit is what you are authorised to decide; a deliverable is a specific thing handed over at the end. Disputes are usually about scope and are usually settled by listing deliverables.\u003c/p>\u003cp>b.  To return to something later, with the implication that it is deferred rather than refused. It is useful because it lets you set something aside without either party conceding anything.\u003c/p>","P3":"\u003cp>Model: \"I would very much like to be involved, and I think I can do a useful version of this, though not the one in the brief.\"\u003c/p>","F1":"\u003cp>a.  Because the itemised list proves the judgement rather than asserting it. A lecturer who wrote the brief quickly may not have added it up; seeing the three components side by side makes the conclusion his rather than yours.\u003c/p>\u003cp>b.  It moves the exchange from a decision to a process. Instead of asking him to accept a reduced project, it asks him to look at a page — a much smaller yes, and one that puts the writer in control of how the reduced version is presented.\u003c/p>","F2":"\u003cp>a.  It keeps the dropped component alive without committing anyone. A flat \"I will not build the CMS\" invites a negotiation about the CMS; \"might be something to revisit\" parks it with the implication that it is a real possibility later.\u003c/p>\u003cp>b.  The project’s, not the writer’s. Appealing to your own workload invites the reply that others manage; appealing to the outcome aligns you with the reader’s interest and makes the reduced scope his best option too.\u003c/p>","F3":"\u003cp>1.  It argues about fairness rather than scope. \"Without payment\" and \"expect a student to build a whole database for free\" may be true, but they turn a scoping conversation into a grievance.\u003c/p>\u003cp>2.  The counter-proposal is empty. \"A smaller part of it if you can find other people for the rest\" names nothing, and makes recruiting others the lecturer’s problem. The third bullet fails.\u003c/p>\u003cp>3.  It never says what the writer wants from the project, so the enthusiasm that would make the counter-offer attractive is entirely absent.\u003c/p>"},"model":["Dear Dr Adeyemi,","Thank you — I would very much like to be involved, and I think I can do a useful version of this, though not the one in the brief.","As written it covers a custom database, a public search interface and a content management system for four editors. That is three months of full-time work, and I would be doing it alongside a job; I would end up delivering something half-finished in September, which would be worse for the project than not starting.","What I think I could do well in the time is a static site presenting the existing dataset, with the search built on the data as it stands rather than a new database. That covers what most visitors will actually want, and it would be live before term starts. The editing interface might be something to revisit next year, or to scope properly as a paid piece of work.","Shall I put together a one-page outline of what that version would include, so you can see whether it is worth having?","Best wishes,","Sofia Marchetti"],"model_html":"\u003cp>Dear Dr Adeyemi,\u003c/p>\u003cp>Thank you — I would very much like to be involved, and I think I can do a useful version of this, though not the one in the brief.\u003c/p>\u003cp>As written it covers a custom database, a public search interface and a content management system for four editors. That is three months of full-time work, and I would be doing it alongside a job; I would end up delivering something half-finished in September, which would be worse for the project than not starting.\u003c/p>\u003cp>What I think I could do well in the time is a static site presenting the existing dataset, with the search built on the data as it stands rather than a new database. That covers what most visitors will actually want, and it would be live before term starts. The editing interface might be something to revisit next year, or to scope properly as a paid piece of work.\u003c/p>\u003cp>Shall I put together a one-page outline of what that version would include, so you can see whether it is worth having?\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Sofia Marchetti\u003c/p>","model_band":5,"degraded":["Dear Dr Adeyemi, Thank you for the offer. Unfortunately the project you describe is far too much work for one person to do in a summer, especially without payment, and I do not think it is realistic to expect a student to build a whole database and CMS for free. I would be happy to help with a smaller part of it if you can find other people for the rest.","Sofia"],"degraded_html":"\u003cp>Dear Dr Adeyemi, Thank you for the offer. Unfortunately the project you describe is far too much work for one person to do in a summer, especially without payment, and I do not think it is realistic to expect a student to build a whole database and CMS for free. I would be happy to help with a smaller part of it if you can find other people for the rest.\u003c/p>\u003cp>Sofia\u003c/p>","degraded_band":3,"model_words":183,"fault_list":{"tag":"F3","faults":["It argues about fairness rather than scope. \"Without payment\" and \"expect a student to build a whole database for free\" may be true, but they turn a scoping conversation into a grievance.","The counter-proposal is empty. \"A smaller part of it if you can find other people for the rest\" names nothing, and makes recruiting others the lecturer’s problem. The third bullet fails.","It never says what the writer wants from the project, so the enthusiasm that would make the counter-offer attractive is entirely absent."],"html":["\u003cp>1.  It argues about fairness rather than scope. \"Without payment\" and \"expect a student to build a whole database for free\" may be true, but they turn a scoping conversation into a grievance.\u003c/p>","\u003cp>2.  The counter-proposal is empty. \"A smaller part of it if you can find other people for the rest\" names nothing, and makes recruiting others the lecturer’s problem. The third bullet fails.\u003c/p>","\u003cp>3.  It never says what the writer wants from the project, so the enthusiasm that would make the counter-offer attractive is entirely absent.\u003c/p>"]},"scenario":"\u003cp>A lecturer has asked you to build a website for a research project, unpaid, over the summer. You would like the experience but the brief as written is three months of full-time work. You could do a smaller version.\u003c/p>","bullets":["Respond to the request.","Explain why the brief as written does not work.","Propose a version that does."],"header":[["To:","k.adeyemi@northgate.ac.uk"],["Subject:","Project website — scope and what I could realistically do"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It never says what the writer wants from the project, so the enthusiasm that would make the counter-offer attractive is entirely absent.","correct":true},{"text":"“Which is a disaster for the planet” and “we should all buy less and repair more” are exhortation rather than analysis. Language: “the production of new goods”, “the general problem of consumerism”, “the planet” — and “for no reason” is a claim about motives offered as fact.","correct":false},{"text":"The counter-proposal is empty. “A smaller part of it if you can find other people for the rest” names nothing, and makes recruiting others the lecturer’s problem. The third bullet fails.","correct":true},{"text":"It is not a contribution. It opens “I agree with Marco” and then restates Marco. The one original idea — punishing students who lie — is dropped after half a sentence. Band 3 is worded part of an explanation, example or detail may be missing, unclear or irrelevant.","correct":false},{"text":"It argues about fairness rather than scope. “Without payment” and “expect a student to build a whole database for free” may be true, but they turn a scoping conversation into a grievance.","correct":true},{"text":"The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: “the sugary drinks”, “the rates of diabetes” over-articled.","correct":false}],"key_html":"F3"}};</script>
