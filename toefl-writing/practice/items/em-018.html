<script>window.ITEM={"kind":"exercise","id":"EM 018","slug":"em-018","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"understatement is stronger than emphasis when the facts are bad","Grammar":"understatement as politeness","Vocabulary":"allow for, consistently, margin, knock-on","Convention":"complaining about something that has already cost you"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are angry. Why is understatement the better instrument here?\u003c/p>\u003cp>b.  What turns “the bus is often late” into evidence?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to \u003cem>allow for\u003c/em> something, and what is a \u003cem>knock-on\u003c/em> effect?\u003c/p>\u003cp>b.  Which is stronger in a complaint: \u003cem>consistently late\u003c/em> or \u003cem>always late\u003c/em>?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Describe four weeks of lateness in one sentence with one number and no adjective.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  “it has begun to matter rather more than it did” is a serious complaint in mild clothes. Why does the mildness help?\u003c/p>\u003cp>b.  Two solutions are offered, one of which does not involve running the bus any earlier. Why include it?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “after the half hour on most mornings, usually by ten to fifteen minutes”. Why the ranges rather than an average?\u003c/p>\u003cp>b.  Why \u003cem>I wanted to flag\u003c/em> rather than \u003cem>I am writing to complain about\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because the facts are strong enough to carry themselves. An angry email invites the reader to discount the anger; a calm one leaves them with nothing to discount but the numbers.\u003c/p>\u003cp>b.  A period, a frequency and a magnitude. “Four weeks, most mornings, ten to fifteen minutes” is a dataset; “often late” is a mood.\u003c/p>","P2":"\u003cp>a.  To \u003cstrong>allow for\u003c/strong> something is to build it into your plan in advance. A \u003cstrong>knock-on\u003c/strong> effect is a consequence that falls on something further down the chain — here, the seminar.\u003c/p>\u003cp>b.  \u003cstrong>Consistently\u003c/strong>. It claims a pattern, which is both more defensible and more damaging than \u003cem>always\u003c/em>, which one punctual morning refutes.\u003c/p>","P3":"\u003cp>Model: \u003cem>Over the past four weeks it has arrived after the half hour on most mornings, usually by ten to fifteen minutes.\u003c/em>\u003c/p>","F1":"\u003cp>a.  Because the reader supplies the force themselves. “Rather more than it did” invites them to work out what is at stake, and a conclusion a reader reaches is held more firmly than one they are handed.\u003c/p>\u003cp>b.  Because publishing a realistic time costs nothing and can be done this week, while moving the departure may require a driver rota change. Always include the option your reader can action alone.\u003c/p>","F2":"\u003cp>a.  Because a range is honest about variation and an average invites argument about method. The ranges also show you observed rather than estimated.\u003c/p>\u003cp>b.  \u003cem>Flag\u003c/em> presents the email as information being passed on, which makes the reader a colleague rather than a defendant. Complaint language puts them in a process.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>Overstatement destroys the evidence.\u003c/strong> “always late, every single morning” is refuted by one punctual day, and “this will affect my grade” overstates what attendance recording means.\u003c/p>\u003cp>2.  \u003cstrong>It blames the drivers and asks for nothing specific.\u003c/strong> “standing around talking” is speculation about cause; “somebody should do something” and “sort this out” name no action, so the third bullet fails.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> No dates, no measurements, and a long run-on sentence carrying the whole of the first paragraph.\u003c/p>"},"model":["Dear Transport Office,","I wanted to flag the timekeeping of the 08:20 shuttle from Beechwood. Over the past four weeks it has arrived at the science campus after the half hour on most mornings, usually by ten to fifteen minutes and twice by more than twenty.","The knock-on is that the 08:45 seminar starts without several of us. I have been late four times, and attendance is now being recorded, so it has begun to matter rather more than it did.","I appreciate the traffic on Parkside is outside your control. Would it be possible either to move the departure to 08:10, or to publish a realistic arrival time so that the departments can allow for it? Either would solve it from our end.","Thank you for looking at this.","Best wishes,","Sanne de Vries"],"model_html":"\u003cp>Dear Transport Office,\u003c/p>\u003cp>I wanted to flag the timekeeping of the 08:20 shuttle from Beechwood. Over the past four weeks it has arrived at the science campus after the half hour on most mornings, usually by ten to fifteen minutes and twice by more than twenty.\u003c/p>\u003cp>The knock-on is that the 08:45 seminar starts without several of us. I have been late four times, and attendance is now being recorded, so it has begun to matter rather more than it did.\u003c/p>\u003cp>I appreciate the traffic on Parkside is outside your control. Would it be possible either to move the departure to 08:10, or to publish a realistic arrival time so that the departments can allow for it? Either would solve it from our end.\u003c/p>\u003cp>Thank you for looking at this.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Sanne de Vries\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, Your 08:20 bus is always late, every single morning, and because of this I am always late to my seminar and now my tutor is taking attendance so this will affect my grade. This is completely unacceptable and somebody should do something about it. The drivers should leave on time instead of standing around talking. Please sort this out.","Sanne"],"degraded_html":"\u003cp>Dear Sir/Madam, Your 08:20 bus is always late, every single morning, and because of this I am always late to my seminar and now my tutor is taking attendance so this will affect my grade. This is completely unacceptable and somebody should do something about it. The drivers should leave on time instead of standing around talking. Please sort this out.\u003c/p>\u003cp>Sanne\u003c/p>","degraded_band":3,"model_words":139,"fault_list":{"tag":"F3","faults":["Overstatement destroys the evidence. “always late, every single morning” is refuted by one punctual day, and “this will affect my grade” overstates what attendance recording means.","It blames the drivers and asks for nothing specific. “standing around talking” is speculation about cause; “somebody should do something” and “sort this out” name no action, so the third bullet fails.","Language. No dates, no measurements, and a long run-on sentence carrying the whole of the first paragraph."],"html":["\u003cp>1.  \u003cstrong>Overstatement destroys the evidence.\u003c/strong> “always late, every single morning” is refuted by one punctual day, and “this will affect my grade” overstates what attendance recording means.\u003c/p>","\u003cp>2.  \u003cstrong>It blames the drivers and asks for nothing specific.\u003c/strong> “standing around talking” is speculation about cause; “somebody should do something” and “sort this out” name no action, so the third bullet fails.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> No dates, no measurements, and a long run-on sentence carrying the whole of the first paragraph.\u003c/p>"]},"scenario":"\u003cp>The campus shuttle has run between ten and twenty minutes late on most mornings this term. You have been late to a timetabled seminar four times and the tutor has started marking attendance.\u003c/p>","bullets":["Describe the pattern.","Say what it has cost you.","Ask for something specific."],"header":[["To:","transport@northgate.ac.uk"],["Subject:","Morning shuttle timekeeping — 08:20 service"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Overstatement destroys the evidence. “always late, every single morning” is refuted by one punctual day, and “this will affect my grade” overstates what attendance recording means.","correct":true},{"text":"Language. No dates, no measurements, and a long run-on sentence carrying the whole of the first paragraph.","correct":true},{"text":"Language: “the big multinationals”, “the small subcontractors”, “the products they buy” over-articled; “nobody controls” should be “nobody oversees”; “exploitation often happens” is asserted without any source.","correct":false},{"text":"It blames the drivers and asks for nothing specific. “standing around talking” is speculation about cause; “somebody should do something” and “sort this out” name no action, so the third bullet fails.","correct":true},{"text":"“Women should not have to choose” is a value judgement offered where Jonas made an empirical claim about opportunity cost, so his argument is not engaged.","correct":false},{"text":"Owen’s evidence — that turnout moves when registration changes and feeling does not — is dismissed as “only a small practical issue” with no counter-evidence.","correct":false}],"key_html":"F3"}};</script>
