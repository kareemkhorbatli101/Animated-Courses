<script>window.ITEM={"kind":"exercise","id":"AD 037","slug":"ad-037","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Business and economics · policy choice","payload":{"Strategy":"ask who the rule binds and who it merely inconveniences","Grammar":"conditional consequence","Vocabulary":"compliance cost, threshold, de minimis, disclosure","Convention":"arguing about regulation without reaching for burden or greed"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Both are making distributional arguments. About what, respectively?\u003c/p>\u003cp>b.  Is there a version of the rule that avoids both problems?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a compliance cost, and what does de minimis mean?\u003c/p>\u003cp>b.  Why is a fixed cost described as regressive?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the design problem in one sentence rather than taking a side.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response traces both positions to one underlying fact. What is it?\u003c/p>\u003cp>b.  What does the proposal do that a threshold cannot?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"it has been conducted as though the only options were everyone and the big ones\" — what is this sentence doing?\u003c/p>\u003cp>b.  \"an order of magnitude cheaper\" — why quantify loosely rather than precisely?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Ines about where the harm falls — on workers in small subcontractors. Yusuf about where the cost falls — on small firms. They are arguing about different distributions and both are correct.\u003c/p>\u003cp>b.  Yes, if the duty is relocated rather than scaled. That is the response’s move and neither classmate considers it, because both treat the duty as necessarily attaching to each firm.\u003c/p>","P2":"\u003cp>a.  The cost of meeting a regulation, as distinct from any penalty. De minimis is a threshold below which a rule does not apply because the amounts are too small to be worth administering.\u003c/p>\u003cp>b.  Because it takes a larger share of a small firm’s revenue than a large one’s — the same mechanism by which a flat tax is regressive.\u003c/p>","P3":"\u003cp>Model: \"The audit cost is largely fixed, so any rule that attaches it to each firm must either crush small ones or exempt them and leak.\"\u003c/p>","F1":"\u003cp>a.  That audit costs are largely fixed rather than proportional. Exemptions are attractive because of it and leaky because of it, so one feature generates the whole dilemma.\u003c/p>\u003cp>b.  It cannot be escaped by restructuring. A threshold applies to a unit and units can be split; a chain-wide duty on the lead firm follows the goods rather than the corporate form, so reorganising below it achieves nothing.\u003c/p>","F2":"\u003cp>a.  Naming the unexamined assumption shared by both sides, which is how the response earns the right to introduce a third option. It also attributes the error to the debate rather than to either classmate.\u003c/p>\u003cp>b.  Because the writer does not have the figure and should not pretend to. The argument needs only that the difference is large, and a loose but honest quantification is stronger than a precise invented one.\u003c/p>","F3":"\u003cp>1.  Yusuf’s argument is acknowledged and then answered with \"subsidies or simplified forms\", which is a gesture rather than a mechanism and leaves the fixed cost in place.\u003c/p>\u003cp>2.  The final sentence is Ines’s point restated, not a contribution, and the response never asks who should hold the duty.\u003c/p>\u003cp>3.  Language: \"the big multinationals\", \"the small subcontractors\", \"the products they buy\" over-articled; \"nobody controls\" should be \"nobody oversees\"; \"exploitation often happens\" is asserted without any source.\u003c/p>"},"model":["Ines is right about where the abuses sit and Yusuf is right about who pays, and both follow from the same feature: the cost of an audit is largely fixed. That is what makes exemption thresholds attractive and also what makes them leaky, because a chain can be reorganised into units below any threshold you set.","If the problem is a fixed cost, the answer is to stop each firm bearing it separately. Require the disclosure from the firm at the top of the chain, for the whole chain, rather than from each participant: one audit, paid for by the party with the margin to absorb it, covering precisely the small suppliers Ines is worried about. Yusuf’s twelve-person firm then has an obligation to answer questions rather than to commission a report, which is an order of magnitude cheaper and cannot be escaped by splitting the company. The threshold debate is really an argument about who holds the duty, and it has been conducted as though the only options were everyone and the big ones."],"model_html":"\u003cp>Ines is right about where the abuses sit and Yusuf is right about who pays, and both follow from the same feature: the cost of an audit is largely fixed. That is what makes exemption thresholds attractive and also what makes them leaky, because a chain can be reorganised into units below any threshold you set.\u003c/p>\u003cp>If the problem is a fixed cost, the answer is to stop each firm bearing it separately. Require the disclosure from the firm at the top of the chain, for the whole chain, rather than from each participant: one audit, paid for by the party with the margin to absorb it, covering precisely the small suppliers Ines is worried about. Yusuf’s twelve-person firm then has an obligation to answer questions rather than to commission a report, which is an order of magnitude cheaper and cannot be escaped by splitting the company. The threshold debate is really an argument about who holds the duty, and it has been conducted as though the only options were everyone and the big ones.\u003c/p>","model_band":5,"degraded":["I agree with Ines that all companies should be obliged to publish these audits because consumers have the right to know how the products they buy are made, and because exploitation often happens exactly in the small subcontractors that nobody controls. Of course it is more difficult for small companies but the government could give them subsidies or simplified forms to help them. If we only regulate the big multinationals they will just move their production to smaller suppliers to avoid the rules, which is exactly what we want to prevent."],"degraded_html":"\u003cp>I agree with Ines that all companies should be obliged to publish these audits because consumers have the right to know how the products they buy are made, and because exploitation often happens exactly in the small subcontractors that nobody controls. Of course it is more difficult for small companies but the government could give them subsidies or simplified forms to help them. If we only regulate the big multinationals they will just move their production to smaller suppliers to avoid the rules, which is exactly what we want to prevent.\u003c/p>","degraded_band":3,"model_words":176,"fault_list":{"tag":"F3","faults":["Yusuf’s argument is acknowledged and then answered with \"subsidies or simplified forms\", which is a gesture rather than a mechanism and leaves the fixed cost in place.","The final sentence is Ines’s point restated, not a contribution, and the response never asks who should hold the duty.","Language: \"the big multinationals\", \"the small subcontractors\", \"the products they buy\" over-articled; \"nobody controls\" should be \"nobody oversees\"; \"exploitation often happens\" is asserted without any source."],"html":["\u003cp>1.  Yusuf’s argument is acknowledged and then answered with \"subsidies or simplified forms\", which is a gesture rather than a mechanism and leaves the fixed cost in place.\u003c/p>","\u003cp>2.  The final sentence is Ines’s point restated, not a contribution, and the response never asks who should hold the duty.\u003c/p>","\u003cp>3.  Language: \"the big multinationals\", \"the small subcontractors\", \"the products they buy\" over-articled; \"nobody controls\" should be \"nobody oversees\"; \"exploitation often happens\" is asserted without any source.\u003c/p>"]},"prof_name":"Dr Castellanos","professor":"\u003cp>Proposals to require companies to publish detailed supply-chain audits are often resisted on the grounds of cost, particularly for smaller firms. Should such reporting be required of all companies, or only of large ones?\u003c/p>","students":[["Ines","All of them, with support for the small. Exempting small firms creates a tier where the practices you are trying to stop simply relocate, and the subcontracting chains that hide the worst abuses are made of small firms."],["Yusuf","Thresholds exist for a reason. A fixed compliance cost is regressive: it is a rounding error for a multinational and a month of margin for a firm with twelve employees. Universal rules written for big companies kill small ones and call it fairness."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The passage is not identified, the named third party is never mentioned, and “I will not use your real name if you prefer” is the only option offered; there is also a comma splice in the opening sentence.","correct":false},{"text":"The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","correct":false},{"text":"The final sentence is Ines’s point restated, not a contribution, and the response never asks who should hold the duty.","correct":true},{"text":"Yusuf’s argument is acknowledged and then answered with “subsidies or simplified forms”, which is a gesture rather than a mechanism and leaves the fixed cost in place.","correct":true},{"text":"“It is very successful there” is asserted without source, and “feel isolated and lost in their first year” repeats “first year” from the previous clause.","correct":false},{"text":"Language: “the big multinationals”, “the small subcontractors”, “the products they buy” over-articled; “nobody controls” should be “nobody oversees”; “exploitation often happens” is asserted without any source.","correct":true}],"key_html":"F3"}};</script>
