it will be refused.\u003c/p>\u003cp>3.  The actual mechanism — the seventy-two-hour hold — is never identified, so the email diagnoses nothing; and \"we cannot keep losing rooms like this\" is pressure rather than analysis.\u003c/p>"},"model":["Hi Grace,","Two bookings have fallen through this term — the November debate and the social — and I think it is a process thing rather than anybody dropping the ball.","Both times the request sat waiting for sign-off while you were away, and the room went. The booking system releases held rooms after seventy-two hours, so any absence longer than three days loses whatever is in the queue. It is not about how quickly you reply; it is that one approver and a seventy-two-hour clock cannot both be true.","The smallest fix I can see is a named deputy approver who can sign off only when a request has been sitting for more than forty-eight hours. That keeps every normal booking with you and only moves the ones that are about to expire, so that nothing is decided behind your back and nothing times out either.","If you would rather not change the approver, the other option is asking Estates to extend our hold window, though I suspect that is a longer conversation. Happy to do either, or neither.","Nour"],"model_html":"\u003cp>Hi Grace,\u003c/p>\u003cp>Two bookings have fallen through this term — the November debate and the social — and I think it is a process thing rather than anybody dropping the ball.\u003c/p>\u003cp>Both times the request sat waiting for sign-off while you were away, and the room went. The booking system releases held rooms after seventy-two hours, so any absence longer than three days loses whatever is in the queue. It is not about how quickly you reply; it is that one approver and a seventy-two-hour clock cannot both be true.\u003c/p>\u003cp>The smallest fix I can see is a named deputy approver who can sign off only when a request has been sitting for more than forty-eight hours. That keeps every normal booking with you and only moves the ones that are about to expire, so that nothing is decided behind your back and nothing times out either.\u003c/p>\u003cp>If you would rather not change the approver, the other option is asking Estates to extend our hold window, though I suspect that is a longer conversation. Happy to do either, or neither.\u003c/p>\u003cp>Nour\u003c/p>","model_band":5,"degraded":["Hi Grace, We have lost two bookings this term because you were not available to approve them in time. I know you are very busy but this is causing real problems for the society and we cannot keep losing rooms like this. I think we need to change the system so that other committee members can also approve bookings, because at the moment everything depends on one person which is not practical. Let me know what you think.","Nour"],"degraded_html":"\u003cp>Hi Grace, We have lost two bookings this term because you were not available to approve them in time. I know you are very busy but this is causing real problems for the society and we cannot keep losing rooms like this. I think we need to change the system so that other committee members can also approve bookings, because at the moment everything depends on one person which is not practical. Let me know what you think.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":184,"fault_list":{"tag":"F3","faults":["It locates the cause in the reader. \"Because you were not available\" is the first clause of the email, and \"I know you are very busy but\" is the classic concessive that precedes an accusation.","The proposal is vague and maximal: \"other committee members can also approve bookings\" removes her control entirely rather than covering the failure case, so it will be refused.","The actual mechanism — the seventy-two-hour hold — is never identified, so the email diagnoses nothing; and \"we cannot keep losing rooms like this\" is pressure rather than analysis."],"html":["\u003cp>1.  It locates the cause in the reader.  is about an institutional measure, so the response never addresses the comparison it was asked to make.","correct":false},{"text":"It locates the cause in the reader. “Because you were not available” is the first clause of the email, and “I know you are very busy but” is the classic concessive that precedes an accusation.","correct":true}],"key_html":"F3"}};</script>
