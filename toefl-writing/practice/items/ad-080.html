<script>window.ITEM={"kind":"exercise","id":"AD 080","slug":"ad-080","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Astronomy · value trade-off","payload":{"Strategy":"justify a cost by what only this project can produce","Grammar":"infinitives of purpose","Vocabulary":"aperture, baseline, duplication, cadence","Convention":"justifying expenditure on fundamental research"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Samir is not hostile to astronomy. What is he demanding?\u003c/p>\u003cp>b.  Why might the honest defence and the effective defence be different?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is aperture, and what is a baseline in observational astronomy?\u003c/p>\u003cp>b.  What does cadence mean, and why does it matter to a survey?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State your position in one sentence that names what only this spending buys.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Samir’s framing. What does it refuse to accept?\u003c/p>\u003cp>b.  Why mention detector technology and trained people?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"is built to observe things no existing instrument can reach\" — what do the infinitives of purpose contribute?\u003c/p>\u003cp>b.  \"accept that the comparison with a hospital is legitimate\" — why concede this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  A comparative justification — a reason to prefer this spending to the next best use of the same money. He accepts the value and rejects the refusal to rank.\u003c/p>\u003cp>b.  Because the honest reason is non-comparative, and budget decisions are comparative. A true account of why something is valuable need not answer why it is more valuable than the alternative.\u003c/p>","P2":"\u003cp>a.  Aperture is the collecting area of a telescope, which sets what faint objects it can see; a baseline is the separation between instruments, which sets resolution.\u003c/p>\u003cp>b.  How often a survey revisits the same patch of sky — which determines whether changing phenomena can be detected at all.\u003c/p>","P3":"\u003cp>Model: \"Defend it by naming the questions only this aperture can settle, not by promising applications.\"\u003c/p>","F1":"\u003cp>a.  It refuses the implication that a comparative case must be an applied one. The comparison can be made in terms of what becomes measurable, which is a reason of the right kind without pretending the telescope will cure anything.\u003c/p>\u003cp>b.  Because they are comparative benefits that do not require overselling. They are produced by this spending and not by the alternative, which is exactly the form of argument Samir asked for, while remaining true.\u003c/p>","F2":"\u003cp>a.  They state the instrument’s purpose as its justification, which is the structure of the whole argument: the case rests on what it is for rather than on what might follow from it.\u003c/p>\u003cp>b.  Because refusing the comparison is what makes scientists sound as though they are claiming exemption. Granting that the hospital is a real alternative is the precondition for being taken seriously when you then argue you should win.\u003c/p>","F3":"\u003cp>1.  \"Nobody thought quantum mechanics would be useful but now we have computers\" is exactly the application-based defence Petra rejects, and it is offered without noticing the contradiction.\u003c/p>\u003cp>2.  \"The amounts are tiny compared to military budgets\" answers the comparison with a different comparison, which does not establish that this spending beats a hospital.\u003c/p>\u003cp>3.  \"Curiosity is what makes us human\" is a slogan, and nothing is said about what this particular facility would make measurable.\u003c/p>"},"model":["Petra is right about what the value is and Samir is right that she has not answered the question actually being asked.","Her defence is honest and insufficient. \"A good in itself\" is true of many things competing for the same money, so it establishes that astronomy belongs in the category of things worth funding without saying how much. A finance ministry is not asking whether knowledge is valuable; it is asking what this instrument delivers that the next cheapest option does not.","That question can be answered. A facility of this aperture is built to observe things no existing instrument can reach, and the case for it rests on what becomes measurable rather than on eventual applications. It also produces things that are not knowledge at all — detector technology, large-scale data methods, and several thousand people trained to solve problems nobody has solved before.","So I would defend it as Samir demands and on Petra’s grounds: specify the questions only this aperture can settle, state the spillovers without overselling them, and accept that the comparison with a hospital is legitimate. Refusing the comparison is what makes the request look like a subsidy for curiosity."],"model_html":"\u003cp>Petra is right about what the value is and Samir is right that she has not answered the question actually being asked.\u003c/p>\u003cp>Her defence is honest and insufficient. \"A good in itself\" is true of many things competing for the same money, so it establishes that astronomy belongs in the category of things worth funding without saying how much. A finance ministry is not asking whether knowledge is valuable; it is asking what this instrument delivers that the next cheapest option does not.\u003c/p>\u003cp>That question can be answered. A facility of this aperture is built to observe things no existing instrument can reach, and the case for it rests on what becomes measurable rather than on eventual applications. It also produces things that are not knowledge at all — detector technology, large-scale data methods, and several thousand people trained to solve problems nobody has solved before.\u003c/p>\u003cp>So I would defend it as Samir demands and on Petra’s grounds: specify the questions only this aperture can settle, state the spillovers without overselling them, and accept that the comparison with a hospital is legitimate. Refusing the comparison is what makes the request look like a subsidy for curiosity.\u003c/p>","model_band":5,"degraded":["I believe we should continue to fund fundamental research because science has always driven human progress and many great discoveries had no obvious application at first. For example nobody thought quantum mechanics would be useful but now we have computers and lasers. Samir asks why a telescope rather than a hospital but I think this is a false choice because the amounts spent on science are tiny compared to military budgets. Curiosity is what makes us human."],"degraded_html":"\u003cp>I believe we should continue to fund fundamental research because science has always driven human progress and many great discoveries had no obvious application at first. For example nobody thought quantum mechanics would be useful but now we have computers and lasers. Samir asks why a telescope rather than a hospital but I think this is a false choice because the amounts spent on science are tiny compared to military budgets. Curiosity is what makes us human.\u003c/p>","degraded_band":3,"model_words":196,"fault_list":{"tag":"F3","faults":["\"Nobody thought quantum mechanics would be useful but now we have computers\" is exactly the application-based defence Petra rejects, and it is offered without noticing the contradiction.","\"The amounts are tiny compared to military budgets\" answers the comparison with a different comparison, which does not establish that this spending beats a hospital.","\"Curiosity is what makes us human\" is a slogan, and nothing is said about what this particular facility would make measurable."],"html":["\u003cp>1.  \"Nobody thought quantum mechanics would be useful but now we have computers\" is exactly the application-based defence Petra rejects, and it is offered without noticing the contradiction.\u003c/p>","\u003cp>2.  \"The amounts are tiny compared to military budgets\" answers the comparison with a different comparison, which does not establish that this spending beats a hospital.\u003c/p>","\u003cp>3.  \"Curiosity is what makes us human\" is a slogan, and nothing is said about what this particular facility would make measurable.\u003c/p>"]},"prof_name":"Professor Lindgren","professor":"\u003cp>Large astronomical facilities cost billions and answer questions with no foreseeable application. Some argue that in a period of competing public needs this is indefensible. Others argue that fundamental science cannot be justified by application and should not try. How should such spending be defended?\u003c/p>","students":[["Petra","Not by pretending it will cure something. The honest defence is that knowing how the universe works is a good in itself, and a society rich enough to argue about this can afford it."],["Samir","That defence loses every budget round, and deserves to. If you cannot say why this telescope rather than a hospital, you are asking for a subsidy for curiosity."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Nobody thought quantum mechanics would be useful but now we have computers” is exactly the application-based defence Petra rejects, and it is offered without noticing the contradiction.","correct":true},{"text":"It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","correct":false},{"text":"“Curiosity is what makes us human” is a slogan, and nothing is said about what this particular facility would make measurable.","correct":true},{"text":"“Please let me know if there is anything I need to do before I leave” puts the handover work on the committee secretary, who does not know what the rep was carrying.","correct":false},{"text":"“The amounts are tiny compared to military budgets” answers the comparison with a different comparison, which does not establish that this spending beats a hospital.","correct":true},{"text":"“I am waiting to continue my work” is pressure and probably untrue, and “as soon as possible” plus “when I can expect them” asks a busy supervisor to commit to a date.","correct":false}],"key_html":"F3"}};</script>
