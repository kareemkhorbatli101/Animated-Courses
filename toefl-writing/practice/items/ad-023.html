<script>window.ITEM={"kind":"exercise","id":"AD 023","slug":"ad-023","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Health and medicine · cause ranking","payload":{"Strategy":"rank by what each cause predicts about who is affected","Grammar":"causal chain with result clauses","Vocabulary":"incidence, confounder, gradient, upstream","Convention":"ranking causes where one is behavioural and one is structural"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Ravi says diet is \"one step too early\". What does he mean?\u003c/p>\u003cp>b.  Is there a version of Ana’s claim that survives his objection?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is incidence, and how does it differ from prevalence?\u003c/p>\u003cp>b.  What does \"upstream\" mean in public health?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three causes in one sentence using what each predicts about who gets ill.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response splits the question in two. What are the two questions, and why is that not evasion?\u003c/p>\u003cp>b.  The last sentence makes a policy claim. How does it follow from the ranking?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"with the result that the same income now buys a different metabolic exposure\" — why a result clause here?\u003c/p>\u003cp>b.  \"a slow trend cannot produce a fast change\" — what general principle is this, and where else in this book have you met it?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That diet is itself an effect of income and conditions, so naming it as the cause stops before reaching what determines it.\u003c/p>\u003cp>b.  Yes — that what changed over time was the composition of cheap food, which is a claim about a variable that moved, not about individual choice. That is the version the response rescues.\u003c/p>","P2":"\u003cp>a.  Incidence is new cases in a period; prevalence is total cases at a time. A rise in prevalence can reflect better survival rather than more disease, so the distinction matters.\u003c/p>\u003cp>b.  Acting on the conditions that produce exposure rather than on the exposure itself — income, housing, food environment rather than individual behaviour.\u003c/p>","P3":"\u003cp>Model: \"The gradient predicts who gets ill, diet composition predicts when the rate rose, and inactivity predicts neither on the relevant timescale.\"\u003c/p>","F1":"\u003cp>a.  Why the rate rose, and who it falls on. It is not evasion because each question gets a definite answer and a reason; evasion would be declining to rank at all. Separating them is what reveals that the two classmates were never answering the same question.\u003c/p>\u003cp>b.  If the gradient determines who can act on advice, then an intervention requiring individual capacity will be taken up unevenly — improving the mean while widening the spread. The ranking supplies the mechanism and the policy claim follows from it.\u003c/p>","F2":"\u003cp>a.  Because the argument needs a determinate consequence: the change in food composition produced a specific altered exposure at constant income. A looser connector would leave the causal claim vaguer than the argument requires.\u003c/p>\u003cp>b.  That a constant or slowly moving variable cannot explain a rapidly moving outcome. You met it in AD 001 with league tables and in AD 004 with network effects — it is one of the most reliable tools in cause ranking.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, which was the question, and lists causes instead.\u003c/p>\u003cp>2.  The two classmates are not engaged: Ana’s timing argument and Ravi’s gradient argument both disappear into a general description of modern life.\u003c/p>\u003cp>3.  The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: \"the sugary drinks\", \"the rates of diabetes\" over-articled.\u003c/p>"},"model":["Ravi is right that the gradient is the better predictor and I do not think that settles it, because the two claims answer different questions. The gradient explains who gets ill; it does not explain why the rate rose, since income inequality in several of these countries moved far less than incidence did. Ana’s point survives that test: the composition of cheap calories changed quickly, with the result that the same income now buys a different metabolic exposure than it did in 1980.","So I would rank them by question rather than against each other. For the rise, diet composition first, because it is the variable that moved on the right timescale. For the distribution, the gradient first, because it determines who meets that exposure and who can avoid it. Inactivity I would put third on both counts — real, but a slow trend cannot produce a fast change. The practical consequence is that interventions aimed at individual behaviour tend to work best on people who have the slack to use them, which is why they so often widen the gradient while improving the average."],"model_html":"\u003cp>Ravi is right that the gradient is the better predictor and I do not think that settles it, because the two claims answer different questions. The gradient explains who gets ill; it does not explain why the rate rose, since income inequality in several of these countries moved far less than incidence did. Ana’s point survives that test: the composition of cheap calories changed quickly, with the result that the same income now buys a different metabolic exposure than it did in 1980.\u003c/p>\u003cp>So I would rank them by question rather than against each other. For the rise, diet composition first, because it is the variable that moved on the right timescale. For the distribution, the gradient first, because it determines who meets that exposure and who can avoid it. Inactivity I would put third on both counts — real, but a slow trend cannot produce a fast change. The practical consequence is that interventions aimed at individual behaviour tend to work best on people who have the slack to use them, which is why they so often widen the gradient while improving the average.\u003c/p>","model_band":5,"degraded":["I think that all these factors are important and they are all connected to each other in a complex way. Modern people eat too much sugar and processed food, they sit all day in the office and in the car, and they do not have time to cook healthy meals or to do exercise because of their stressful lives. Also poor people cannot afford healthy food which is more expensive than junk food. In my opinion governments should educate people about nutrition from childhood and also tax the sugary drinks so people will consume less of them and the rates of diabetes will decrease."],"degraded_html":"\u003cp>I think that all these factors are important and they are all connected to each other in a complex way. Modern people eat too much sugar and processed food, they sit all day in the office and in the car, and they do not have time to cook healthy meals or to do exercise because of their stressful lives. Also poor people cannot afford healthy food which is more expensive than junk food. In my opinion governments should educate people about nutrition from childhood and also tax the sugary drinks so people will consume less of them and the rates of diabetes will decrease.\u003c/p>","degraded_band":3,"model_words":184,"fault_list":{"tag":"F3","faults":["It refuses to rank, which was the question, and lists causes instead.","The two classmates are not engaged: Ana’s timing argument and Ravi’s gradient argument both disappear into a general description of modern life.","The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: \"the sugary drinks\", \"the rates of diabetes\" over-articled."],"html":["\u003cp>1.  It refuses to rank, which was the question, and lists causes instead.\u003c/p>","\u003cp>2.  The two classmates are not engaged: Ana’s timing argument and Ravi’s gradient argument both disappear into a general description of modern life.\u003c/p>","\u003cp>3.  The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: \"the sugary drinks\", \"the rates of diabetes\" over-articled.\u003c/p>"]},"prof_name":"Professor Ikeda","professor":"\u003cp>Rates of type 2 diabetes have risen sharply in most high-income countries. Explanations include diet, physical inactivity and the social gradient in income and work. Which of these best explains the rise?\u003c/p>","students":[["Ana","Diet, and specifically what changed in it. Activity levels have fallen slowly for a century; the composition of cheap food changed fast and the curve bends with it."],["Ravi","The gradient. Incidence tracks income more tightly than it tracks any individual behaviour, and the behaviours themselves follow the income. Treating diet as the cause stops the analysis one step too early."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: “the sugary drinks”, “the rates of diabetes” over-articled.","correct":true},{"text":"It is not an apology. “actually it was not really my fault”, and the false claim that “nobody told me”. The first bullet asked for an apology; this is a defence with the word sorry attached at each end.","correct":false},{"text":"No specific questions. “The procedure” leaves the three things she actually needs — eligibility on a conditional offer, the deadline, and whether conditions carry over — entirely unasked.","correct":false},{"text":"The two classmates are not engaged: Ana’s timing argument and Ravi’s gradient argument both disappear into a general description of modern life.","correct":true},{"text":"It refuses to rank, which was the question, and lists causes instead.","correct":true},{"text":"The trust argument is an assertion. “there were no problems, so you can trust us” instructs the reader to reach a conclusion instead of giving grounds for it, so the second bullet is only half addressed.","correct":false}],"key_html":"F3"}};</script>
