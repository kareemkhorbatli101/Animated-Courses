<script>window.ITEM={"kind":"exercise","id":"EM 049","slug":"em-049","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask the question that reveals whether the rule applies to you","Grammar":"polite pre-sequence","Vocabulary":"eligibility, concession, pro rata, reckonable","Convention":"enquiring about an entitlement you may not have"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why does the subject line say what it does?\u003c/p>\u003cp>b.  What is the risk of writing this as a claim?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does pro rata mean, and what are reckonable hours?\u003c/p>\u003cp>b.  Distinguish eligibility from entitlement.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask the question in one sentence that makes clear you may not qualify.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer disclaims a claim twice — in the subject line and in the body. Is that excessive?\u003c/p>\u003cp>b.  Why mention the average hours?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I should say I am asking rather than claiming\" — what is this kind of sentence called and what does it do?\u003c/p>\u003cp>b.  \"that is a perfectly good answer and I will leave it there\" — why offer this?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because payroll receives claims and queries through the same inbox, and they are handled very differently. Signalling which this is gets it to the right person and sets the tone before the email is opened.\u003c/p>\u003cp>b.  If you are not entitled, you have accused the university of withholding money it never owed you — which is awkward, and makes the relationship harder if you work there again.\u003c/p>","P2":"\u003cp>a.  Pro rata means in proportion — here, entitlement scaled to hours worked. Reckonable hours are those that count towards the calculation, which is precisely the thing in doubt.\u003c/p>\u003cp>b.  Eligibility is whether the rule applies to you at all; entitlement is what you are owed under it. The question is about the first.\u003c/p>","P3":"\u003cp>Model: \"I wanted to ask whether holiday pay applies to casual student staff, and if so how it is calculated.\"\u003c/p>","F1":"\u003cp>a.  No, because they do different work. The subject line routes the email; the body sentence sets the tone for whoever reads it and makes a frank \"no\" easy to give. Both are one line, and neither repeats the other’s wording.\u003c/p>\u003cp>b.  Because entitlement is usually calculated pro rata, so the figure determines whether the question is even worth answering. Supplying it unasked means the reply can be definitive rather than a request for more information.\u003c/p>","F2":"\u003cp>a.  A pre-sequence — a move that prepares the ground for what follows and tells the hearer how to take it. It reclassifies everything after it as enquiry rather than demand.\u003c/p>\u003cp>b.  Because it removes the incentive to be cautious. A payroll clerk who fears that \"no\" will start a dispute will escalate or delay; one who is told a no is acceptable can simply answer.\u003c/p>","F3":"\u003cp>1.  It claims rather than asks. \"I believe I am owed this money\" and \"calculate what I am due\" assume the entitlement the email should be establishing — the third bullet fails.\u003c/p>\u003cp>2.  \"Employees are entitled to holiday pay\" is true and may not apply to casual contracts, which is the entire question and is never raised.\u003c/p>\u003cp>3.  \"This should have been paid automatically without me having to ask\" is an accusation resting on an assumption not yet tested, and no hours or working pattern are given, so nothing can be calculated anyway.\u003c/p>"},"model":["Dear Payroll,","I worked as casual staff in the Library between October and May (payroll number 44821), averaging about eight hours a week during term.","I wanted to ask whether holiday pay applies to casual student staff, and if so how it is calculated — I have seen it mentioned but cannot tell from the staff pages whether it covers my type of contract or only fixed-hours roles.","I should say I am asking rather than claiming: if casual hours are not reckonable for this, that is a perfectly good answer and I will leave it there.","Thank you very much.","Yours sincerely,","Leo Tanaka — payroll 44821"],"model_html":"\u003cp>Dear Payroll,\u003c/p>\u003cp>I worked as casual staff in the Library between October and May (payroll number 44821), averaging about eight hours a week during term.\u003c/p>\u003cp>I wanted to ask whether holiday pay applies to casual student staff, and if so how it is calculated — I have seen it mentioned but cannot tell from the staff pages whether it covers my type of contract or only fixed-hours roles.\u003c/p>\u003cp>I should say I am asking rather than claiming: if casual hours are not reckonable for this, that is a perfectly good answer and I will leave it there.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Leo Tanaka — payroll 44821\u003c/p>","model_band":5,"degraded":["Dear Payroll, I worked in the Library from October to May as casual staff and I have just found out that employees are entitled to holiday pay. I never received any holiday pay during this period, so I believe I am owed this money. Could you please calculate what I am due and let me know when it will be paid? I think this should have been paid automatically without me having to ask.","Leo"],"degraded_html":"\u003cp>Dear Payroll, I worked in the Library from October to May as casual staff and I have just found out that employees are entitled to holiday pay. I never received any holiday pay during this period, so I believe I am owed this money. Could you please calculate what I am due and let me know when it will be paid? I think this should have been paid automatically without me having to ask.\u003c/p>\u003cp>Leo\u003c/p>","degraded_band":3,"model_words":107,"fault_list":{"tag":"F3","faults":["It claims rather than asks. \"I believe I am owed this money\" and \"calculate what I am due\" assume the entitlement the email should be establishing — the third bullet fails.","\"Employees are entitled to holiday pay\" is true and may not apply to casual contracts, which is the entire question and is never raised.","\"This should have been paid automatically without me having to ask\" is an accusation resting on an assumption not yet tested, and no hours or working pattern are given, so nothing can be calculated anyway."],"html":["\u003cp>1.  It claims rather than asks. \"I believe I am owed this money\" and \"calculate what I am due\" assume the entitlement the email should be establishing — the third bullet fails.\u003c/p>","\u003cp>2.  \"Employees are entitled to holiday pay\" is true and may not apply to casual contracts, which is the entire question and is never raised.\u003c/p>","\u003cp>3.  \"This should have been paid automatically without me having to ask\" is an accusation resting on an assumption not yet tested, and no hours or working pattern are given, so nothing can be calculated anyway.\u003c/p>"]},"scenario":"\u003cp>You worked part-time for the university for eight months and think you may be owed holiday pay, but you are unsure whether student casual staff are covered. You do not want to make a claim you are not entitled to.\u003c/p>","bullets":["Say who you are and what the period was.","Ask whether the entitlement applies.","Make clear you are asking rather than claiming."],"header":[["To:","payroll@northgate.ac.uk"],["Subject:","Casual staff holiday entitlement — query, not a claim"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“They always promise and then negotiate to reduce their obligations” is an assertion about conduct offered instead of an argument about incidence, and the timing question that determines who actually pays is absent.","correct":false},{"text":"“We have to accept some sacrifices for the greater good” restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.","correct":false},{"text":"It claims rather than asks. “I believe I am owed this money” and “calculate what I am due” assume the entitlement the email should be establishing — the third bullet fails.","correct":true},{"text":"The recommendations contradict the one analytic point it makes — having said poor people cannot afford healthy food, it proposes education and a consumption tax, both of which fall hardest on the same group. Language: “the sugary drinks”, “the rates of diabetes” over-articled.","correct":false},{"text":"“Employees are entitled to holiday pay” is true and may not apply to casual contracts, which is the entire question and is never raised.","correct":true},{"text":"“This should have been paid automatically without me having to ask” is an accusation resting on an assumption not yet tested, and no hours or working pattern are given, so nothing can be calculated anyway.","correct":true}],"key_html":"F3"}};</script>
