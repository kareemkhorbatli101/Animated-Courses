<script>window.ITEM={"kind":"exercise","id":"EM 072","slug":"em-072","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Proposal and solving a problem","payload":{"Strategy":"propose the trial, not the scheme","Grammar":"enumerated steps in parallel","Vocabulary":"pilot, uptake, opt in, low-cost","Convention":"proposing something that creates work for volunteers"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The committee is overstretched. What does a proposal have to prove before anything else?\u003c/p>\u003cp>b.  Why propose a term rather than a permanent scheme?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for a scheme to be opt-in, and why does that affect uptake?\u003c/p>\u003cp>b.  What is a pilot, and what is it meant to establish?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Describe who does the work in one sentence that does not end with \"the committee\".\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The committee is asked to do one thing. Why is naming the limit more persuasive than offering to help?\u003c/p>\u003cp>b.  The proposal includes its own failure condition. What does that do to the risk of saying yes?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"one coffee in week two and one in week seven\" — why these details rather than \"regular meetings\"?\u003c/p>\u003cp>b.  \"nobody need mention it again\" — what form is \"need\" here, and what does it convey?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That it will not become their problem. Every proposal to a volunteer committee is read as a question about workload before it is read as an idea.\u003c/p>\u003cp>b.  Because a term is reversible. Agreeing to a permanent scheme is a decision with consequences; agreeing to a term is agreeing to an experiment that ends by itself.\u003c/p>","P2":"\u003cp>a.  Participants choose to join rather than being enrolled. Uptake is usually far lower, but the people who join have actually agreed to it, which matters for a scheme that depends on effort.\u003c/p>\u003cp>b.  A small trial run to establish whether something works before committing to it — and, just as importantly, to make the first decision small.\u003c/p>","P3":"\u003cp>Model: \"I would write the sign-up form, do the matching and send the two reminder emails.\"\u003c/p>","F1":"\u003cp>a.  Because \"I am happy to help\" leaves the division of labour undefined, and an undefined division defaults to the committee. Naming the single task they must do tells them exactly what they are agreeing to.\u003c/p>\u003cp>b.  It removes it almost entirely. The worst outcome is explicitly specified and is costless: a form in a newsletter twice, and then silence. There is nothing left to refuse.\u003c/p>","F2":"\u003cp>a.  Because \"regular meetings\" is an open-ended commitment that every volunteer will read as a burden, while two coffees is a quantity they can picture and agree to. Specificity is what converts a worthy idea into something people sign up for.\u003c/p>\u003cp>b.  The semi-modal \"need\" in a negative-polarity context — \"nobody need mention it\" rather than \"nobody needs to mention it\". It is lightly formal and conveys release from an obligation, which is exactly the reassurance the sentence is offering.\u003c/p>","F3":"\u003cp>1.  The work is assigned to the reader. \"The committee should organise it and find volunteers\" is the whole scheme handed to an overstretched group, with \"I would be happy to help if you need me\" attached.\u003c/p>\u003cp>2.  Nothing is specific: no numbers, no matching basis, no duration, no meeting pattern. The second bullet fails, so there is nothing to say yes to.\u003c/p>\u003cp>3.  \"It is very successful there\" is asserted without source, and \"feel isolated and lost in their first year\" repeats \"first year\" from the previous clause.\u003c/p>"},"model":["Dear Committee,","A suggestion, and I am happy to do the work if you think it is worth trying.","Most first-years never speak to anyone in the second or third year except by accident. The practical cost is that they ask nobody about module choices, placements or which textbooks to ignore, and they find out in May.","I would like to run a buddy scheme for one term, deliberately small: twenty first-years, twenty volunteers from years two and three, matched on degree stream, one coffee in week two and one in week seven. Nothing more structured than that.","The work would divide as follows. I would write the sign-up form, do the matching and send the two reminder emails. The committee would need to do one thing only: put the form in the society newsletter twice. If fewer than ten pairs sign up, I will drop it and nobody need mention it again.","Thanks for considering it.","Best wishes,","Nour Bakri — second year"],"model_html":"\u003cp>Dear Committee,\u003c/p>\u003cp>A suggestion, and I am happy to do the work if you think it is worth trying.\u003c/p>\u003cp>Most first-years never speak to anyone in the second or third year except by accident. The practical cost is that they ask nobody about module choices, placements or which textbooks to ignore, and they find out in May.\u003c/p>\u003cp>I would like to run a buddy scheme for one term, deliberately small: twenty first-years, twenty volunteers from years two and three, matched on degree stream, one coffee in week two and one in week seven. Nothing more structured than that.\u003c/p>\u003cp>The work would divide as follows. I would write the sign-up form, do the matching and send the two reminder emails. The committee would need to do one thing only: put the form in the society newsletter twice. If fewer than ten pairs sign up, I will drop it and nobody need mention it again.\u003c/p>\u003cp>Thanks for considering it.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Nour Bakri — second year\u003c/p>","model_band":5,"degraded":["Dear Committee, I think it would be a great idea to start a buddy scheme in our department because many first year students feel isolated and lost in their first year and they do not know anybody from the older years who could give them advice. This kind of scheme exists in other departments and it is very successful there. I think the committee should organise it and find volunteers, and I would be happy to help if you need me. Please let me know what you think.","Nour"],"degraded_html":"\u003cp>Dear Committee, I think it would be a great idea to start a buddy scheme in our department because many first year students feel isolated and lost in their first year and they do not know anybody from the older years who could give them advice. This kind of scheme exists in other departments and it is very successful there. I think the committee should organise it and find volunteers, and I would be happy to help if you need me. Please let me know what you think.\u003c/p>\u003cp>Nour\u003c/p>","degraded_band":3,"model_words":166,"fault_list":{"tag":"F3","faults":["The work is assigned to the reader. \"The committee should organise it and find volunteers\" is the whole scheme handed to an overstretched group, with \"I would be happy to help if you need me\" attached.","Nothing is specific: no numbers, no matching basis, no duration, no meeting pattern. The second bullet fails, so there is nothing to say yes to.","\"It is very successful there\" is asserted without source, and \"feel isolated and lost in their first year\" repeats \"first year\" from the previous clause."],"html":["\u003cp>1.  The work is assigned to the reader. \"The committee should organise it and find volunteers\" is the whole scheme handed to an overstretched group, with \"I would be happy to help if you need me\" attached.\u003c/p>","\u003cp>2.  Nothing is specific: no numbers, no matching basis, no duration, no meeting pattern. The second bullet fails, so there is nothing to say yes to.\u003c/p>","\u003cp>3.  \"It is very successful there\" is asserted without source, and \"feel isolated and lost in their first year\" repeats \"first year\" from the previous clause.\u003c/p>"]},"scenario":"\u003cp>Many first-years in your department never speak to anyone in the years above. You want to propose a simple buddy scheme to the student society, whose committee is already overstretched.\u003c/p>","bullets":["Say what the problem is.","Propose something specific and small.","Say exactly who does what."],"header":[["To:","committee.physsoc@northgate.ac.uk"],["Subject:","A small buddy scheme — proposal for one term"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Theo’s actual argument — that intention is not authority — is acknowledged and then set aside with “but context is still very important”, which does not answer it.","correct":false},{"text":"The work is assigned to the reader. “The committee should organise it and find volunteers” is the whole scheme handed to an overstretched group, with “I would be happy to help if you need me” attached.","correct":true},{"text":"Nothing is specific: no numbers, no matching basis, no duration, no meeting pattern. The second bullet fails, so there is nothing to say yes to.","correct":true},{"text":"“It is very successful there” is asserted without source, and “feel isolated and lost in their first year” repeats “first year” from the previous clause.","correct":true},{"text":"Language: “these international comparisons”, “the tables”, “its own needs and values” — and “some Asian countries” does a lot of work without naming anything checkable.","correct":false},{"text":"“They have much more power and resources, so they should be the ones who adapt” asserts a conclusion from an imbalance without showing why power implies the duty — the pooling argument that would justify it is absent.","correct":false}],"key_html":"F3"}};</script>
