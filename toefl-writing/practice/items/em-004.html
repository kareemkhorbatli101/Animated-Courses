<script>window.ITEM={"kind":"exercise","id":"EM 004","slug":"em-004","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"make it easy to refuse, and you make it easier to accept","Grammar":"the if-clause as a politeness hedge","Vocabulary":"reference, referee, vouch for, in support of an application","Convention":"asking a busy person for unpaid work"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are asking for perhaps two hours of unpaid work. What does that oblige you to do that an ordinary request would not?\u003c/p>\u003cp>b.  Why does the third bullet ask for “a way out”?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Who is the \u003cem>referee\u003c/em> and who is the \u003cem>applicant\u003c/em>? What does a referee \u003cem>do\u003c/em> — write, provide, act as, or all three?\u003c/p>\u003cp>b.  Which is right: a reference ______ my application? (for / to / in support of)\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>One sentence that asks and simultaneously gives her permission to decline. Under 30 words.\u003c/p>"},{"tag":"P4","title":"Predict the pitfall","html":"\u003cp>Which opening is best?\u003c/p>\u003cpre class=\"mono\">(A) You probably don’t remember me, but I was in your\n    second-year group.\n(B) I hope you are well. I am writing to ask a favour.\n(C) I was one of your second-year project students last year\n    — I worked on the river-sediment survey with Jonas Hale.\u003c/pre>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email names a second student and a specific project. Why?\u003c/p>\u003cp>b.  Paragraph four actively invites refusal. Argue that it makes a yes more likely, not less.\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “If you would rather not, or simply do not have the time … please do say so.” Two things are happening to the verb \u003cem>say\u003c/em>. Name both.\u003c/p>\u003cp>b.  Why \u003cem>I am told it takes about twenty minutes\u003c/em> rather than \u003cem>it takes twenty minutes\u003c/em>?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>act as a referee\u003c/em> rather than \u003cem>write a reference\u003c/em> in the request itself?\u003c/p>\u003cp>b.  What is the difference between \u003cem>in case they are useful\u003c/em> and \u003cem>because they are useful\u003c/em>?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>Ask a former employer for a reference, in 50 words: identify yourself, make the request, and give them an exit.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Identify yourself precisely, state the deadline up front, and keep the email short. Every minute she spends working out who you are is a minute taken from the favour you are asking for.\u003c/p>\u003cp>b.  Because a referee who agrees reluctantly writes a lukewarm reference, which is worse for you than a refusal. Giving her an exit is self-interested as well as courteous.\u003c/p>","P2":"\u003cp>a.  The \u003cstrong>referee\u003c/strong> is Dr Alvarez — the person who provides the reference. You are the \u003cstrong>applicant\u003c/strong>. A referee \u003cem>acts as\u003c/em> a referee and \u003cem>provides\u003c/em> or \u003cem>writes\u003c/em> a reference. Note that English reverses the sporting sense of the word here, which catches people out.\u003c/p>\u003cp>b.  \u003cstrong>in support of\u003c/strong> my application. \u003cem>for\u003c/em> is acceptable; \u003cem>to\u003c/em> is not.\u003c/p>","P3":"\u003cp>Model: \u003cem>I was wondering whether you would be willing to act as a referee — though please do say if it is not a good month for it.\u003c/em>\u003c/p>\u003cp>The dash is doing structural work: it attaches the exit to the request so the two arrive together, rather than leaving the refusal option to a separate, more formal sentence.\u003c/p>","P4":"\u003cp>\u003cstrong>(C).\u003c/strong> (A) tells her she has forgotten you, which is both presumptuous and a bad start. (B) delays the content and the word \u003cem>favour\u003c/em> frames the whole email as an imposition. (C) identifies you with two concrete hooks — a named collaborator and a named project — which is how memory actually works.\u003c/p>","F1":"\u003cp>a.  Memory is associative. A name and a project will retrieve you far faster than your own name will, especially a year later and across perhaps sixty students.\u003c/p>\u003cp>b.  A reference is only valuable if it is warm. By making refusal easy and costless, the writer ensures that a yes is a real yes. She also signals confidence — somebody who can afford to be refused is somebody worth recommending.\u003c/p>","F2":"\u003cp>a.  \u003cstrong>do\u003c/strong> is the emphatic \u003cem>do\u003c/em> from family 8, and \u003cem>say so\u003c/em> uses \u003cem>so\u003c/em> as a pro-form standing in for the whole clause. Together they make the invitation to refuse sound sincere rather than formulaic.\u003c/p>\u003cp>b.  Because she will discover the true figure herself, and if it turns out to be an hour you will have misled her. \u003cem>I am told\u003c/em> reports the claim and marks its source, which costs nothing and protects you.\u003c/p>","F3":"\u003cp>a.  \u003cem>Act as a referee\u003c/em> names a role she can accept in principle; \u003cem>write a reference\u003c/em> names a task with a word count and an evening attached. Ask for the role, supply the task details afterwards.\u003c/p>\u003cp>b.  \u003cem>In case\u003c/em> means you are providing them against a possible need, so she is not obliged to read them. \u003cem>Because\u003c/em> asserts they are useful, which quietly instructs her to look.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>It assumes the yes.\u003c/strong> “Could you please write it for me?” followed by “please send it before this date” sets her a deadline before she has agreed to anything, and offers no way to decline.\u003c/p>\u003cp>2.  \u003cstrong>It tells the referee what to write.\u003c/strong> “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.\u003c/p>\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Dear Professor” without a name, “in last year” (last year), “applying to a summer placement” (for), a comma splice at “remember me, I was”, and “I am waiting” as a closing line.\u003c/p>","F5":"\u003cp>Model: \u003cem>I worked in your Camden branch over the summers of 2023 and 2024, mostly on the returns desk. I am applying for a logistics traineeship and need one employment reference — would you be willing to provide it? If you would rather not, please just say; I have other options.\u003c/em>\u003c/p>"},"model":["Dear Dr Alvarez,","I was one of your second-year project students last year — I worked on the river-sediment survey with Jonas Hale, and you supervised the write-up in the spring.","I am applying for a summer research placement at the Institute of Hydrology, and the application asks for one academic reference. I was wondering whether you would be willing to act as a referee for me.","The deadline is 30 June and the form is a short online one — they email a link directly to you, and I am told it takes about twenty minutes. I have attached my transcript and the project description in case they are useful.","If you would rather not, or simply do not have the time this month, please do say so — I have asked no one else yet and there is still room to approach somebody in the department.","Thank you very much for considering it.","With best wishes,","Nadia Farouk"],"model_html":"\u003cp>Dear Dr Alvarez,\u003c/p>\u003cp>I was one of your second-year project students last year — I worked on the river-sediment survey with Jonas Hale, and you supervised the write-up in the spring.\u003c/p>\u003cp>I am applying for a summer research placement at the Institute of Hydrology, and the application asks for one academic reference. I was wondering whether you would be willing to act as a referee for me.\u003c/p>\u003cp>The deadline is 30 June and the form is a short online one — they email a link directly to you, and I am told it takes about twenty minutes. I have attached my transcript and the project description in case they are useful.\u003c/p>\u003cp>If you would rather not, or simply do not have the time this month, please do say so — I have asked no one else yet and there is still room to approach somebody in the department.\u003c/p>\u003cp>Thank you very much for considering it.\u003c/p>\u003cp>With best wishes,\u003c/p>\u003cp>Nadia Farouk\u003c/p>","model_band":5,"degraded":["Dear Professor,","I hope you remember me, I was your student in last year. Now I am applying to a summer placement and they need a reference from a teacher. Could you please write it for me? The deadline is 30 June so please send it before this date. I attach my transcript. I am sure you will write good things about me because my project was one of the best in the group.","Thank you so much, I am waiting."],"degraded_html":"\u003cp>Dear Professor,\u003c/p>\u003cp>I hope you remember me, I was your student in last year. Now I am applying to a summer placement and they need a reference from a teacher. Could you please write it for me? The deadline is 30 June so please send it before this date. I attach my transcript. I am sure you will write good things about me because my project was one of the best in the group.\u003c/p>\u003cp>Thank you so much, I am waiting.\u003c/p>","degraded_band":3,"model_words":160,"fault_list":{"tag":"F4","faults":["It assumes the yes. “Could you please write it for me?” followed by “please send it before this date” sets her a deadline before she has agreed to anything, and offers no way to decline.","It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","Language and register. “Dear Professor” without a name, “in last year” (last year), “applying to a summer placement” (for), a comma splice at “remember me, I was”, and “I am waiting” as a closing line."],"html":["\u003cp>1.  \u003cstrong>It assumes the yes.\u003c/strong> “Could you please write it for me?” followed by “please send it before this date” sets her a deadline before she has agreed to anything, and offers no way to decline.\u003c/p>","\u003cp>2.  \u003cstrong>It tells the referee what to write.\u003c/strong> “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.\u003c/p>","\u003cp>3.  \u003cstrong>Language and register.\u003c/strong> “Dear Professor” without a name, “in last year” (last year), “applying to a summer placement” (for), a comma splice at “remember me, I was”, and “I am waiting” as a closing line.\u003c/p>"]},"scenario":"\u003cp>You are applying for a summer research placement and need an academic reference by the 30th. Dr Alvarez supervised your second-year project and knows your work, but you have not spoken to her since June.\u003c/p>","bullets":["Remind her who you are and what you worked on.","Ask whether she would be willing to act as a referee.","Give her the practical details and a way out."],"header":[["To:","c.alvarez@northgate.ac.uk"],["Subject:","Reference for summer placement — deadline 30 June"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Language and register. “Dear Professor” without a name, “in last year” (last year), “applying to a summer placement” (for), a comma splice at “remember me, I was”, and “I am waiting” as a closing line.","correct":true},{"text":"The recommendation does not follow: if education and expectations matter as the response itself says, housing subsidies address a third of the problem. Language: “like their parents did at the same age” needs “as”; “young people today want to enjoy their freedom” is a stereotype offered as evidence.","correct":false},{"text":"It assumes the yes. “Could you please write it for me?” followed by “please send it before this date” sets her a deadline before she has agreed to anything, and offers no way to decline.","correct":true},{"text":"Language: “the big multinationals”, “the small subcontractors”, “the products they buy” over-articled; “nobody controls” should be “nobody oversees”; “exploitation often happens” is asserted without any source.","correct":false},{"text":"“The amounts are tiny compared to military budgets” answers the comparison with a different comparison, which does not establish that this spending beats a hospital.","correct":false},{"text":"It tells the referee what to write. “I am sure you will write good things about me because my project was one of the best” is both presumptuous and a request to compromise her judgement. It also fails to identify the project.","correct":true}],"key_html":"F4"}};</script>
