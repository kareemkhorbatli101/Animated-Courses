<script>window.ITEM={"kind":"exercise","id":"AD 016","slug":"ad-016","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Arts and culture · cause ranking","payload":{"Strategy":"rank causes by what each predicts that the others do not","Grammar":"cleft for emphasis","Vocabulary":"canon, gatekeeping, discoverability, long tail","Convention":"ranking causes in a field where taste is at stake"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Olga and Pavel both accept the volume figure. What do they disagree about?\u003c/p>\u003cp>b.  Which position predicts that recommendation algorithms should have solved the problem?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is discoverability, and what is the long tail?\u003c/p>\u003cp>b.  What does a gatekeeper do, and what is lost when one disappears?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the causes in one sentence using what each predicts.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response uses a prediction to decide between the two accounts. State it in one sentence.\u003c/p>\u003cp>b.  Retail is promoted from third cause to something else. What?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"It is the loss of the mid-list that removed the commercial space\" — name the device and say why it suits this sentence.\u003c/p>\u003cp>b.  \"the condition the other two were supposed to manage\" — what does this do to Olga’s position?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Whether volume is sufficient on its own. Olga treats it as the cause; Pavel treats it as a condition that only became harmful when the filter went.\u003c/p>\u003cp>b.  Olga’s. If the problem is purely matching at scale, better matching technology should have resolved it — which is the test the response applies.\u003c/p>","P2":"\u003cp>a.  Discoverability is how easily a work can be found by someone who would want it. The long tail is the large number of low-selling titles that collectively rival the hits.\u003c/p>\u003cp>b.  A gatekeeper decides what reaches the public. What is lost is not only selection but the shared reference point: when everyone read the same three reviewers, a recommendation created a conversation as well as a sale.\u003c/p>","P3":"\u003cp>Model: \"If volume were the cause, recommendation algorithms would have solved it; they have concentrated attention instead, which is what a curation failure predicts.\"\u003c/p>","F1":"\u003cp>a.  If capacity to match readers to books were the binding constraint, the enormous increase in that capacity would have eased the problem; it did not, so the constraint lies elsewhere.\u003c/p>\u003cp>b.  Into the enabling condition for curation — the reason a review could work at all. That is a structural relation rather than a parallel cause, and recognising it is what allows a ranking instead of a list.\u003c/p>","F2":"\u003cp>a.  An it-cleft (family 8, structure 59). It isolates the mid-list from the several things that changed in retail and contrasts it with them, which is precisely the discrimination the sentence needs to make.\u003c/p>\u003cp>b.  It concedes that she is describing something real while denying it explanatory force — volume is the problem the system existed to solve, so its presence cannot explain the system’s failure. The concession is what keeps the ranking from reading as a dismissal.\u003c/p>","F3":"\u003cp>1.  It refuses to rank, and then introduces a fourth cause (streaming) that was not in the question and is not weighed against the others.\u003c/p>\u003cp>2.  Nothing distinguishes the causes; each is asserted and none is tested, and the recommendations at the end — publishers should promote, schools should encourage — follow from no part of the analysis.\u003c/p>\u003cp>3.  Language: \"the readers\", \"the newspapers\", \"the market for literature\" over-articled; \"anymore\" should be \"any more\"; and \"connected with each other\" is doing the work that an argument should.\u003c/p>"},"model":["Pavel has the better account, and the test is what each explanation predicts. If volume alone were the problem, algorithmic recommendation should have fixed it — there has never been more capacity to match a book to a reader. It has not, and what it produces instead is concentration: recommendations are trained on sales, so they amplify whatever is already moving. That is a curation failure, not a capacity one, and it is exactly what Pavel’s account predicts and Olga’s does not.","What I would add is that retail economics is not a third cause but the reason the first two interact. It is the loss of the mid-list — the book expected to sell modestly — that removed the commercial space in which a slow-building reputation used to be possible. A reviewer’s recommendation only mattered because a bookshop would keep the title on the shelf long enough for it to work. So I would rank curation first, retail second as the thing that made curation effective, and volume third: real, but the condition the other two were supposed to manage."],"model_html":"\u003cp>Pavel has the better account, and the test is what each explanation predicts. If volume alone were the problem, algorithmic recommendation should have fixed it — there has never been more capacity to match a book to a reader. It has not, and what it produces instead is concentration: recommendations are trained on sales, so they amplify whatever is already moving. That is a curation failure, not a capacity one, and it is exactly what Pavel’s account predicts and Olga’s does not.\u003c/p>\u003cp>What I would add is that retail economics is not a third cause but the reason the first two interact. It is the loss of the mid-list — the book expected to sell modestly — that removed the commercial space in which a slow-building reputation used to be possible. A reviewer’s recommendation only mattered because a bookshop would keep the title on the shelf long enough for it to work. So I would rank curation first, retail second as the thing that made curation effective, and volume third: real, but the condition the other two were supposed to manage.\u003c/p>","model_band":5,"degraded":["I think all these reasons are true and they are connected with each other. It is certainly true that there are too many books today and the readers cannot know which one to choose, and also the newspapers do not have book reviews anymore because they are losing money. Another reason is that young people prefer to watch series on streaming platforms instead of reading novels, so the market for literature is becoming smaller every year. In my opinion publishers should invest more in promoting new authors and schools should encourage children to read more books from an early age."],"degraded_html":"\u003cp>I think all these reasons are true and they are connected with each other. It is certainly true that there are too many books today and the readers cannot know which one to choose, and also the newspapers do not have book reviews anymore because they are losing money. Another reason is that young people prefer to watch series on streaming platforms instead of reading novels, so the market for literature is becoming smaller every year. In my opinion publishers should invest more in promoting new authors and schools should encourage children to read more books from an early age.\u003c/p>","degraded_band":3,"model_words":180,"fault_list":{"tag":"F3","faults":["It refuses to rank, and then introduces a fourth cause (streaming) that was not in the question and is not weighed against the others.","Nothing distinguishes the causes; each is asserted and none is tested, and the recommendations at the end — publishers should promote, schools should encourage — follow from no part of the analysis.","Language: \"the readers\", \"the newspapers\", \"the market for literature\" over-articled; \"anymore\" should be \"any more\"; and \"connected with each other\" is doing the work that an argument should."],"html":["\u003cp>1.  It refuses to rank, and then introduces a fourth cause (streaming) that was not in the question and is not weighed against the others.\u003c/p>","\u003cp>2.  Nothing distinguishes the causes; each is asserted and none is tested, and the recommendations at the end — publishers should promote, schools should encourage — follow from no part of the analysis.\u003c/p>","\u003cp>3.  Language: \"the readers\", \"the newspapers\", \"the market for literature\" over-articled; \"anymore\" should be \"any more\"; and \"connected with each other\" is doing the work that an argument should.\u003c/p>"]},"prof_name":"Professor Rahimi","professor":"\u003cp>Fewer new novels reach a wide readership than a generation ago, although more are published. Suggested explanations include the collapse of book review pages, the economics of retail and the sheer volume of competition. Which best explains it?\u003c/p>","students":[["Olga","Volume. When four hundred literary novels appear in a season, attention has to fragment — no mechanism could make them all visible, and the ones that break through do so almost at random."],["Pavel","Reviews. What has gone is not attention but curation. A reader used to have three or four trusted sources that would surface ten books a year. Volume only became a problem once the filter disappeared."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Nothing distinguishes the causes; each is asserted and none is tested, and the recommendations at the end — publishers should promote, schools should encourage — follow from no part of the analysis.","correct":true},{"text":"“Would it be possible to do it every two weeks instead” is a bare reduction with nothing offered, no dates and no session count, so the third bullet fails.","correct":false},{"text":"It refuses to rank, and then introduces a fourth cause (streaming) that was not in the question and is not weighed against the others.","correct":true},{"text":"It instructs. “Please fix this problem urgently” claims a priority the writer cannot assign, and gives no deadline that would justify it.","correct":false},{"text":"Language: “the readers”, “the newspapers”, “the market for literature” over-articled; “anymore” should be “any more”; and “connected with each other” is doing the work that an argument should.","correct":true},{"text":"Language and register. “Dear Professor” without a name, “in last year” (last year), “applying to a summer placement” (for), a comma splice at “remember me, I was”, and “I am waiting” as a closing line.","correct":false}],"key_html":"F3"}};</script>
