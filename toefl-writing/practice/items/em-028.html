<script>window.ITEM={"kind":"exercise","id":"EM 028","slug":"em-028","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"an apology for a mistake that cost money should name the sum","Grammar":"the future with will for commitment","Vocabulary":"invoice, reconcile, out of pocket, settle","Convention":"apologising where money has to change hands"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  The treasurer is a peer, not an institution. What does that change and what does it not change?\u003c/p>\u003cp>b.  Why name the exact sum?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean to be out of pocket, and who is here?\u003c/p>\u003cp>b.  To settle an amount: what does the verb imply about finality?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Commit to repayment in one sentence with a date in it.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The first sentence contains the fault, the sum and the deadline. Why all three at once?\u003c/p>\u003cp>b.  Find the sentence that acknowledges a cost beyond the money.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"I will transfer the £60 on Friday\" — why \"will\" rather than \"I am going to\" or \"I can\"?\u003c/p>\u003cp>b.  \"that should not have landed on you\" — what is the perfect modal doing?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  It changes the register — first names, no formal closing. It does not change the obligations: a peer who has paid your mistake out of a shared account is owed a sum, a date and an apology, exactly as an institution would be.\u003c/p>\u003cp>b.  Because a vague promise to repay is what people say when they do not intend to. The sum and the date are what make it a commitment rather than a sentiment.\u003c/p>","P2":"\u003cp>a.  To have paid something yourself that somebody else should have borne. Here it is the society, and in a sense Dev, who had to action it.\u003c/p>\u003cp>b.  Settling implies the matter is closed by the payment — not merely that money moved, but that the obligation ends. That is exactly what you want to promise.\u003c/p>","P3":"\u003cp>Model: \"I will transfer the £60 on Friday when I am paid, and I will send you the confirmation.\"\u003c/p>\u003cp>A sum, a date, a reason the date is credible, and evidence to follow. Each element removes a reason to doubt you.\u003c/p>","F1":"\u003cp>a.  Because they are the three things Dev needs and the only three he is entitled to before any explanation. Front-loading them means the rest of the email is read by somebody who is no longer worried.\u003c/p>\u003cp>b.  \"that should not have landed on you\". It recognises that Dev absorbed the administrative and personal burden of fixing someone else’s error, which is a real cost even once the money is returned.\u003c/p>","F2":"\u003cp>a.  \"Will\" makes it a promise at the moment of speaking, which is what a commitment is. \"Going to\" reports a prior intention and sounds weaker; \"I can\" offers an ability rather than undertaking anything.\u003c/p>\u003cp>b.  Expressing that an obligation existed and was breached by events rather than by Dev. \"Should not have\" places the fault in the past and attaches it to the situation the writer caused, without making Dev a victim in so many words.\u003c/p>","F3":"\u003cp>1.  It shifts blame. \"nobody told me the final date was the 21st\" contradicts the admission in the previous clause and makes the error the group’s.\u003c/p>\u003cp>2.  The repayment is not a commitment. \"At some point this month\" with \"just remind me if I forget\" transfers the chasing to the person already out of pocket. The third bullet fails.\u003c/p>\u003cp>3.  It minimises. \"the minibus thing, that was annoying\" describes a £60 loss to a shared account as a minor irritation, and there is a comma splice in the same sentence.\u003c/p>"},"model":["Hi Dev,","The £60 cancellation on the minibus was my mistake, and I will put it back into the account by Friday.","I booked it for the 14th instead of the 21st. I had the dates from the first draft of the plan and did not check against the final one before confirming, so by the time I spotted it we were inside the free cancellation window.","I am sorry you had to settle it out of the society account in the meantime — that should not have landed on you. I will transfer the £60 on Friday when I am paid, and I will send you the confirmation. If the society needs it sooner than that, say so and I will move some things around.","Sorry, Dev.","Leo"],"model_html":"\u003cp>Hi Dev,\u003c/p>\u003cp>The £60 cancellation on the minibus was my mistake, and I will put it back into the account by Friday.\u003c/p>\u003cp>I booked it for the 14th instead of the 21st. I had the dates from the first draft of the plan and did not check against the final one before confirming, so by the time I spotted it we were inside the free cancellation window.\u003c/p>\u003cp>I am sorry you had to settle it out of the society account in the meantime — that should not have landed on you. I will transfer the £60 on Friday when I am paid, and I will send you the confirmation. If the society needs it sooner than that, say so and I will move some things around.\u003c/p>\u003cp>Sorry, Dev.\u003c/p>\u003cp>Leo\u003c/p>","model_band":5,"degraded":["Hey Dev, Sorry about the minibus thing, that was annoying. I got the dates mixed up because the plan kept changing and nobody told me the final date was the 21st. Anyway I will sort out the money at some point this month, just remind me if I forget. Cheers mate.","Leo"],"degraded_html":"\u003cp>Hey Dev, Sorry about the minibus thing, that was annoying. I got the dates mixed up because the plan kept changing and nobody told me the final date was the 21st. Anyway I will sort out the money at some point this month, just remind me if I forget. Cheers mate.\u003c/p>\u003cp>Leo\u003c/p>","degraded_band":3,"model_words":128,"fault_list":{"tag":"F3","faults":["It shifts blame. \"nobody told me the final date was the 21st\" contradicts the admission in the previous clause and makes the error the group’s.","The repayment is not a commitment. \"At some point this month\" with \"just remind me if I forget\" transfers the chasing to the person already out of pocket. The third bullet fails.","It minimises. \"the minibus thing, that was annoying\" describes a £60 loss to a shared account as a minor irritation, and there is a comma splice in the same sentence."],"html":["\u003cp>1.  It shifts blame. \"nobody told me the final date was the 21st\" contradicts the admission in the previous clause and makes the error the group’s.\u003c/p>","\u003cp>2.  The repayment is not a commitment. \"At some point this month\" with \"just remind me if I forget\" transfers the chasing to the person already out of pocket. The third bullet fails.\u003c/p>","\u003cp>3.  It minimises. \"the minibus thing, that was annoying\" describes a £60 loss to a shared account as a minor irritation, and there is a comma splice in the same sentence.\u003c/p>"]},"scenario":"\u003cp>You booked a minibus for a society trip and gave the wrong date. The company charged a £60 cancellation fee. The society treasurer has paid it from the society account.\u003c/p>","bullets":["Apologise to the treasurer.","Say exactly what went wrong.","Settle the money."],"header":[["To:","treasurer.hikingsoc@northgate.ac.uk"],["Subject:","Minibus cancellation fee — my error, and repayment"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: “the topography”, “the bicycle”, “way of transport” (means of transport), “make campaigns” (run campaigns).","correct":false},{"text":"Pieter’s argument is called interesting and then set aside — “but I still think energy efficiency has to come first” — without any engagement with the accounting.","correct":false},{"text":"The repayment is not a commitment. “At some point this month” with “just remind me if I forget” transfers the chasing to the person already out of pocket. The third bullet fails.","correct":true},{"text":"It minimises. “the minibus thing, that was annoying” describes a £60 loss to a shared account as a minor irritation, and there is a comma splice in the same sentence.","correct":true},{"text":"The reason reformulation works — that it reaches people who never engage with the information — is stated only as “people do not have time to read labels”, with nothing about distribution.","correct":false},{"text":"It shifts blame. “nobody told me the final date was the 21st” contradicts the admission in the previous clause and makes the error the group’s.","correct":true}],"key_html":"F3"}};</script>
