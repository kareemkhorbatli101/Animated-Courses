<script>window.ITEM={"kind":"exercise","id":"EM 074","slug":"em-074","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Proposal and solving a problem","payload":{"Strategy":"cost the problem before proposing the fix","Grammar":"nominalisation in a proposal register","Vocabulary":"throughput, bottleneck, turnaround, uptake","Convention":"proposing to someone who must justify the spend upward"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Your reader may have to justify this to someone else. What does that mean for the email?\u003c/p>\u003cp>b.  Why does the first bullet insist on a number?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a bottleneck, and what is throughput?\u003c/p>\u003cp>b.  What is turnaround, and why is it the manager’s metric?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the cost of the problem in one sentence containing two numbers.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The fourth paragraph is written for someone who is not the reader. Who, and how can you tell?\u003c/p>\u003cp>b.  The alternative to approval is spelled out. Why does naming the status quo help?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the cost is one-off, it comes from maintenance rather than capital\" — why does this distinction matter to an approver?\u003c/p>\u003cp>b.  \"with a figure attached\" in the opening line — what does it promise?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  That the email should contain the sentences your reader will need to repeat. A proposal that arrives pre-justified can be forwarded; one that does not must be rewritten by the person approving it, which is work they may not do.\u003c/p>\u003cp>b.  Because \"there is a queue\" is an impression and \"ninety minutes against the forty allowed\" is a measurement. Only one of them can appear in a justification.\u003c/p>","P2":"\u003cp>a.  A bottleneck is the stage that limits the rate of the whole process; throughput is how much gets through per unit time.\u003c/p>\u003cp>b.  Turnaround is the time from start to completion. It is the manager’s metric because overruns cascade into other bookings, which is their problem rather than the students’.\u003c/p>","P3":"\u003cp>Model: \"Eleven of the sixteen left before finishing, and the session ran twenty-five minutes over.\"\u003c/p>","F1":"\u003cp>a.  Whoever signs off the spend. You can tell because it answers administrative questions a lab manager would already know the answers to — budget line, procurement, one-off versus recurring — and because it is phrased as justification rather than information.\u003c/p>\u003cp>b.  Because an approver is comparing the proposal against doing nothing, and doing nothing usually looks free. Naming its cost — a third of the cohort not completing — puts a price on the default.\u003c/p>","F2":"\u003cp>a.  Because maintenance and capital are different budgets with different approval thresholds, and one-off spending does not commit future years. An approver’s first two questions are which pot and how often, and answering them unasked can be the difference between a yes this week and a conversation next term.\u003c/p>\u003cp>b.  That the email will not be a complaint. It signals in six words that a quantified problem and a costed solution are coming, which changes how the rest is read.\u003c/p>","F3":"\u003cp>1.  No numbers anywhere — not the group size, the overrun, the proportion unable to finish, or the cost. The first bullet fails entirely.\u003c/p>\u003cp>2.  The proposal is to buy a microscope, with no price, source or route; the free unit in Pathology, which is what makes the whole thing viable, is never mentioned. The second bullet fails.\u003c/p>\u003cp>3.  \"Very frustrating\", \"we do not learn properly\" and \"I am sure this would make a big difference\" are affect rather than argument, and nothing is offered that the reader could forward.\u003c/p>"},"model":["Dear Dr Ferris,","A suggestion about the Thursday practical, with a figure attached.","With one microscope and sixteen students, the slide-reading section takes about ninety minutes against the forty allowed. Last week eleven of the sixteen left before finishing, and the session ran twenty-five minutes over, which pushes into the 4 p.m. lecture.","Pathology has a spare Leitz unit they have offered us. It is working but needs a service and a new stage clip — Hallam quoted £195 including collection. Two microscopes would bring the section to roughly fifty minutes, which fits.","If it helps for the paperwork: the cost is one-off, it comes from maintenance rather than capital, the unit is already university property so there is no procurement process, and the alternative is either splitting the cohort across two sessions or accepting that a third of them do not complete the exercise. I am happy to arrange the collection and the service myself if you approve it.","Thank you.","Best wishes,","Ana Oyelaran — second year"],"model_html":"\u003cp>Dear Dr Ferris,\u003c/p>\u003cp>A suggestion about the Thursday practical, with a figure attached.\u003c/p>\u003cp>With one microscope and sixteen students, the slide-reading section takes about ninety minutes against the forty allowed. Last week eleven of the sixteen left before finishing, and the session ran twenty-five minutes over, which pushes into the 4 p.m. lecture.\u003c/p>\u003cp>Pathology has a spare Leitz unit they have offered us. It is working but needs a service and a new stage clip — Hallam quoted £195 including collection. Two microscopes would bring the section to roughly fifty minutes, which fits.\u003c/p>\u003cp>If it helps for the paperwork: the cost is one-off, it comes from maintenance rather than capital, the unit is already university property so there is no procurement process, and the alternative is either splitting the cohort across two sessions or accepting that a third of them do not complete the exercise. I am happy to arrange the collection and the service myself if you approve it.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ana Oyelaran — second year\u003c/p>","model_band":5,"degraded":["Dear Dr Ferris, I wanted to raise the problem with the microscope in the Thursday practical. There is only one for the whole group so everybody has to wait a long time and many students cannot finish the exercise, which is very frustrating and means we do not learn properly. I think the department should buy another microscope so that we can all do the work in the time available. I am sure this would make a big difference for everybody.","Ana"],"degraded_html":"\u003cp>Dear Dr Ferris, I wanted to raise the problem with the microscope in the Thursday practical. There is only one for the whole group so everybody has to wait a long time and many students cannot finish the exercise, which is very frustrating and means we do not learn properly. I think the department should buy another microscope so that we can all do the work in the time available. I am sure this would make a big difference for everybody.\u003c/p>\u003cp>Ana\u003c/p>","degraded_band":3,"model_words":171,"fault_list":{"tag":"F3","faults":["No numbers anywhere — not the group size, the overrun, the proportion unable to finish, or the cost. The first bullet fails entirely.","The proposal is to buy a microscope, with no price, source or route; the free unit in Pathology, which is what makes the whole thing viable, is never mentioned. The second bullet fails.","\"Very frustrating\", \"we do not learn properly\" and \"I am sure this would make a big difference\" are affect rather than argument, and nothing is offered that the reader could forward."],"html":["\u003cp>1.  No numbers anywhere — not the group size, the overrun, the proportion unable to finish, or the cost. The first bullet fails entirely.\u003c/p>","\u003cp>2.  The proposal is to buy a microscope, with no price, source or route; the free unit in Pathology, which is what makes the whole thing viable, is never mentioned. The second bullet fails.\u003c/p>","\u003cp>3.  \"Very frustrating\", \"we do not learn properly\" and \"I am sure this would make a big difference\" are affect rather than argument, and nothing is offered that the reader could forward.\u003c/p>"]},"scenario":"\u003cp>The single microscope in the teaching lab creates a queue every Thursday. Sessions overrun and students miss the next class. A second-hand unit is available from another department for nothing but needs a £200 service.\u003c/p>","bullets":["Describe the bottleneck with a number.","Propose the fix and its cost.","Make the approval easy to justify."],"header":[["To:","lab.manager.bio@northgate.ac.uk"],["Subject:","Thursday microscope queue — a £200 fix"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Accumulated error. “the academic honesty”, “very important thing” (a very important thing), “If … don’t say it, so the teacher” (a comma splice with a stray so), “it is working good” (working well), “make some punishment” (impose a penalty). Individually survivable; together they are what the descriptor calls some noticeable lexical and grammatical errors.","correct":false},{"text":"It never engages Ines. Her argument is about the cost of decarbonisation; “the environment is more important than the money” answers an argument she did not make.","correct":false},{"text":"No numbers anywhere — not the group size, the overrun, the proportion unable to finish, or the cost. The first bullet fails entirely.","correct":true},{"text":"“Very frustrating”, “we do not learn properly” and “I am sure this would make a big difference” are affect rather than argument, and nothing is offered that the reader could forward.","correct":true},{"text":"The proposal is to buy a microscope, with no price, source or route; the free unit in Pathology, which is what makes the whole thing viable, is never mentioned. The second bullet fails.","correct":true},{"text":"Theo’s actual argument — that intention is not authority — is acknowledged and then set aside with “but context is still very important”, which does not answer it.","correct":false}],"key_html":"F3"}};</script>
