<script>window.ITEM={"kind":"exercise","id":"AD 046b","slug":"ad-046b","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environment · agree or disagree with a claim","payload":{"Strategy":"check whether the comparison controls for the thing being compared","Grammar":"hedged generalisation with tend to","Vocabulary":"life cycle, embodied carbon, footprint, boundary","Convention":"disagreeing with a claim that sounds quantitative"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  How much do Ana and Rui actually disagree?\u003c/p>\u003cp>b.  What determines which of them is right for a given object?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is embodied carbon, and what is a use phase?\u003c/p>\u003cp>b.  What is a system boundary, and why does it decide the answer?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State the condition that separates the two cases, in one sentence.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response accepts Rui and then defends the claim he criticised. On what grounds?\u003c/p>\u003cp>b.  What test is being applied to the heuristic?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"tend to sit well on Ana’s side\" — why hedge a claim the writer has just called a matter of known ratios?\u003c/p>\u003cp>b.  \"second-hand unless it burns something or runs continuously\" — why is this formulation better than the accurate one?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Very little about the facts. Ana says manufacture dominates and Rui agrees for most goods; he adds a category where it does not.\u003c/p>\u003cp>b.  The ratio of embodied to operational emissions over the remaining life — which is an empirical question with known answers by product type.\u003c/p>","P2":"\u003cp>a.  Embodied carbon is emitted making the object; the use phase is what it emits while in service.\u003c/p>\u003cp>b.  What you count as part of the system. It decides the answer because excluding the use phase makes second-hand always better by construction, which is how the \"always\" claim survives.\u003c/p>","P3":"\u003cp>Model: \"Ana is right where manufacture dominates the footprint and Rui where use does, which is a question about the object rather than about the principle.\"\u003c/p>","F1":"\u003cp>a.  On the grounds that the claim is a decision rule rather than a description, and rules are judged by the aggregate quality of the decisions they produce. A rule that is wrong in ten per cent of cases may still beat case-by-case analysis that nobody performs.\u003c/p>\u003cp>b.  Whether it produces better decisions than the realistic alternative — which is not perfect analysis but the default behaviour people fall back on.\u003c/p>","F2":"\u003cp>a.  Because the writer does not have the figures to hand and the categories are not uniform — some furniture contains electronics, some tools are powered. The hedge keeps the claim exactly as strong as the knowledge behind it.\u003c/p>\u003cp>b.  Because it can be applied in a shop in two seconds without data. An accurate rule nobody can execute is worse than an approximate rule that everyone can, which is the whole argument of the paragraph enacted in its own conclusion.\u003c/p>","F3":"\u003cp>1.  Rui’s exception is the only substantive point in the discussion and it is dismissed as \"a detail\" without argument — and it is exactly where the large emissions are.\u003c/p>\u003cp>2.  The response answers a different question, about consumerism, which neither classmate raised.\u003c/p>\u003cp>3.  \"Which is a disaster for the planet\" and \"we should all buy less and repair more\" are exhortation rather than analysis. Language: \"the production of new goods\", \"the general problem of consumerism\", \"the planet\" — and \"for no reason\" is a claim about motives offered as fact.\u003c/p>"},"model":["Rui is right and the disagreement is narrower than it looks: Ana’s claim holds for objects whose footprint is dominated by manufacture, and his for objects dominated by use. That is not a matter of opinion but of the ratio, and the ratio is known for most product categories. Clothes, furniture and tools tend to sit well on Ana’s side; anything with a motor or a heating element tends to sit on Rui’s.","What neither says is that the \"always\" in the original claim is doing something other than describing the world. It is a heuristic, and heuristics are judged by the decisions they produce rather than by their accuracy in every case. Told to weigh embodied against operational carbon for each purchase, most people will do neither and will buy new, because that is the default the advertising supports. Told always to buy second-hand, they will be right on most purchases and wrong on a few large ones. I would keep the rule and attach the exception to it explicitly — second-hand unless it burns something or runs continuously — which is still a rule a person can follow in a shop."],"model_html":"\u003cp>Rui is right and the disagreement is narrower than it looks: Ana’s claim holds for objects whose footprint is dominated by manufacture, and his for objects dominated by use. That is not a matter of opinion but of the ratio, and the ratio is known for most product categories. Clothes, furniture and tools tend to sit well on Ana’s side; anything with a motor or a heating element tends to sit on Rui’s.\u003c/p>\u003cp>What neither says is that the \"always\" in the original claim is doing something other than describing the world. It is a heuristic, and heuristics are judged by the decisions they produce rather than by their accuracy in every case. Told to weigh embodied against operational carbon for each purchase, most people will do neither and will buy new, because that is the default the advertising supports. Told always to buy second-hand, they will be right on most purchases and wrong on a few large ones. I would keep the rule and attach the exception to it explicitly — second-hand unless it burns something or runs continuously — which is still a rule a person can follow in a shop.\u003c/p>","model_band":5,"degraded":["I completely agree that buying second-hand is better for the environment because it reduces waste and avoids the production of new goods which consumes a lot of energy and raw materials. Our society is based on overconsumption and people change their phones and clothes every year for no reason, which is a disaster for the planet. Rui says that old fridges consume more electricity but I think this is a detail compared to the general problem of consumerism. We should all buy less and repair more instead of always looking for something new."],"degraded_html":"\u003cp>I completely agree that buying second-hand is better for the environment because it reduces waste and avoids the production of new goods which consumes a lot of energy and raw materials. Our society is based on overconsumption and people change their phones and clothes every year for no reason, which is a disaster for the planet. Rui says that old fridges consume more electricity but I think this is a detail compared to the general problem of consumerism. We should all buy less and repair more instead of always looking for something new.\u003c/p>","degraded_band":3,"model_words":193,"fault_list":{"tag":"F3","faults":["Rui’s exception is the only substantive point in the discussion and it is dismissed as \"a detail\" without argument — and it is exactly where the large emissions are.","The response answers a different question, about consumerism, which neither classmate raised.","\"Which is a disaster for the planet\" and \"we should all buy less and repair more\" are exhortation rather than analysis. Language: \"the production of new goods\", \"the general problem of consumerism\", \"the planet\" — and \"for no reason\" is a claim about motives offered as fact."],"html":["\u003cp>1.  Rui’s exception is the only substantive point in the discussion and it is dismissed as \"a detail\" without argument — and it is exactly where the large emissions are.\u003c/p>","\u003cp>2.  The response answers a different question, about consumerism, which neither classmate raised.\u003c/p>","\u003cp>3.  \"Which is a disaster for the planet\" and \"we should all buy less and repair more\" are exhortation rather than analysis. Language: \"the production of new goods\", \"the general problem of consumerism\", \"the planet\" — and \"for no reason\" is a claim about motives offered as fact.\u003c/p>"]},"prof_name":"Dr Haugen","professor":"\u003cp>It is often said that buying a second-hand item is always better for the environment than buying new, however inefficient the old item is. How far do you accept this?\u003c/p>","students":[["Ana","Mostly accept it. The carbon is already in the object. Manufacturing dominates the footprint of most goods, so extending a life avoids the largest single emission."],["Rui","For most goods yes, but \"always\" is doing a lot of work. For anything that consumes energy over a long life — a fridge, a car, a boiler — the use phase dwarfs manufacture, and keeping an inefficient one going can be worse than replacing it."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Which is a disaster for the planet” and “we should all buy less and repair more” are exhortation rather than analysis. Language: “the production of new goods”, “the general problem of consumerism”, “the planet” — and “for no reason” is a claim about motives offered as fact.","correct":true},{"text":"It ignores the published material and the notice period, and closes with “Thank you for understanding”, which thanks them in advance for accepting what has already been decided.","correct":false},{"text":"No terms are proposed at all — “if you have any budget I would be happy to discuss it” puts the work of inventing an arrangement on the charity. The third bullet fails.","correct":false},{"text":"It blames and then pressures. “the doctors in this country took very long time” and “which was not my fault” argue with an accusation nobody made; “otherwise I will not be able to do my exams properly” puts the consequence on them.","correct":false},{"text":"The response answers a different question, about consumerism, which neither classmate raised.","correct":true},{"text":"Rui’s exception is the only substantive point in the discussion and it is dismissed as “a detail” without argument — and it is exactly where the large emissions are.","correct":true}],"key_html":"F3"}};</script>
