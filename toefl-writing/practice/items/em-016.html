<script>window.ITEM={"kind":"exercise","id":"EM 016","slug":"em-016","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Complaint and remedy","payload":{"Strategy":"report a withdrawal of service by its effect on you, not its injustice","Grammar":"sequencing adverbials","Vocabulary":"reinstate, divert, service, provision","Convention":"complaining to a body that owes you nothing contractually"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You have no contractual right to the shuttle. What argument is left?\u003c/p>\u003cp>b.  Why is the unlit walk a stronger point than the inconvenience?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is the difference between \u003cem>withdrawn\u003c/em>, \u003cem>suspended\u003c/em> and \u003cem>diverted\u003c/em>?\u003c/p>\u003cp>b.  To \u003cem>reinstate\u003c/em> a service: what does the prefix tell you about what you are asking for?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Describe the consequence in one sentence that an institution would have to take seriously.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The email never says the withdrawal was wrong. What does it say instead?\u003c/p>\u003cp>b.  Find the sentence that gives the office an easy way to help without restoring the service.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  “It was not there on Monday or on Wednesday”. Why two specific days rather than \u003cem>for the last week\u003c/em>?\u003c/p>\u003cp>b.  “Several of the group have simply stopped attending.” Why is this the most effective sentence in the email?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Consequence. You cannot claim an entitlement, but you can report what follows from the change — and an institution that learns its decision is driving down lab attendance has a problem of its own.\u003c/p>\u003cp>b.  Because safety is an interest the university is obliged to take seriously and keeps records about. Inconvenience is a preference; an unlit forty-minute walk at night is a risk.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>Withdrawn\u003c/strong> is permanent, \u003cstrong>suspended\u003c/strong> is temporary, \u003cstrong>diverted\u003c/strong> means it still runs but by another route. Asking which it is forces a definite answer.\u003c/p>\u003cp>b.  \u003cem>Re-\u003c/em> means you are asking for something back rather than for something new — a much cheaper request, and one that implies the service was justified once.\u003c/p>","P3":"\u003cp>Model: \u003cem>The alternative is a forty-minute walk, about half of it along the unlit stretch of the reservoir path.\u003c/em>\u003c/p>\u003cp>Two measurements and a named location. No adjective does as much work as \u003cem>unlit\u003c/em> plus a route.\u003c/p>","F1":"\u003cp>a.  That it has had effects: attendance has fallen, the walk is unsafe, and nobody was told. Reporting consequences lets the reader reach the conclusion that the decision was wrong without being told so.\u003c/p>\u003cp>b.  “even a note on the board saying so would help”. It costs nothing, is entirely within their power, and makes it impossible to reply with silence.\u003c/p>","F2":"\u003cp>a.  Because two dates are a record and a week is an impression. It also shows you checked twice before writing, which pre-empts the reply that you must have missed it.\u003c/p>\u003cp>b.  Because it converts a personal complaint into an institutional problem. One inconvenienced student is a query; falling attendance at timetabled labs is something the office will have to explain to a department.\u003c/p>","F3":"\u003cp>1.  \u003cstrong>It accuses rather than reports.\u003c/strong> “totally unacceptable” and “the university is always talking about student safety but then you cut the services” make it a political argument rather than a request, and address it to a clerk who did not take the decision.\u003c/p>\u003cp>2.  \u003cstrong>No achievable ask and no identification.\u003c/strong> “Bring back the shuttle immediately” is the one thing this office may be unable to do, no alternative is offered, and the email is unsigned — so it cannot be answered at all.\u003c/p>\u003cp>3.  \u003cstrong>Language and evidence.\u003c/strong> No dates, no route, no times. “Cancelled” is asserted where the writer only knows the bus did not come.\u003c/p>"},"model":["Dear Transport Office,","The 21:15 shuttle from the science campus appears to have stopped running. It was not there on Monday or on Wednesday, and there is nothing on the timetable board or the app to say it has been withdrawn.","Lab sessions on the science campus finish at nine, so for those of us on evening labs the shuttle was the only way back. The alternative is a forty-minute walk, about half of it along the unlit stretch of the reservoir path. Several of the group have simply stopped attending the late sessions.","Could you tell me whether the service has been withdrawn permanently or suspended? If it cannot be reinstated, even a note on the board saying so would help, and it would be worth the department knowing, as the evening labs may have to move.","Thank you.","Best wishes,","Idrissa Bah — BSc Biochemistry"],"model_html":"\u003cp>Dear Transport Office,\u003c/p>\u003cp>The 21:15 shuttle from the science campus appears to have stopped running. It was not there on Monday or on Wednesday, and there is nothing on the timetable board or the app to say it has been withdrawn.\u003c/p>\u003cp>Lab sessions on the science campus finish at nine, so for those of us on evening labs the shuttle was the only way back. The alternative is a forty-minute walk, about half of it along the unlit stretch of the reservoir path. Several of the group have simply stopped attending the late sessions.\u003c/p>\u003cp>Could you tell me whether the service has been withdrawn permanently or suspended? If it cannot be reinstated, even a note on the board saying so would help, and it would be worth the department knowing, as the evening labs may have to move.\u003c/p>\u003cp>Thank you.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Idrissa Bah — BSc Biochemistry\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I want to complain that you cancelled the night shuttle from the science campus without telling anybody. This is totally unacceptable and dangerous, especially for female students who must walk alone in the dark. The university is always talking about student safety but then you cut the services that keep us safe. Please bring back the shuttle immediately.","A concerned student"],"degraded_html":"\u003cp>Dear Sir/Madam, I want to complain that you cancelled the night shuttle from the science campus without telling anybody. This is totally unacceptable and dangerous, especially for female students who must walk alone in the dark. The university is always talking about student safety but then you cut the services that keep us safe. Please bring back the shuttle immediately.\u003c/p>\u003cp>A concerned student\u003c/p>","degraded_band":3,"model_words":148,"fault_list":{"tag":"F3","faults":["It accuses rather than reports. “totally unacceptable” and “the university is always talking about student safety but then you cut the services” make it a political argument rather than a request, and address it to a clerk who did not take the decision.","No achievable ask and no identification. “Bring back the shuttle immediately” is the one thing this office may be unable to do, no alternative is offered, and the email is unsigned — so it cannot be answered at all.","Language and evidence. No dates, no route, no times. “Cancelled” is asserted where the writer only knows the bus did not come."],"html":["\u003cp>1.  \u003cstrong>It accuses rather than reports.\u003c/strong> “totally unacceptable” and “the university is always talking about student safety but then you cut the services” make it a political argument rather than a request, and address it to a clerk who did not take the decision.\u003c/p>","\u003cp>2.  \u003cstrong>No achievable ask and no identification.\u003c/strong> “Bring back the shuttle immediately” is the one thing this office may be unable to do, no alternative is offered, and the email is unsigned — so it cannot be answered at all.\u003c/p>","\u003cp>3.  \u003cstrong>Language and evidence.\u003c/strong> No dates, no route, no times. “Cancelled” is asserted where the writer only knows the bus did not come.\u003c/p>"]},"scenario":"\u003cp>The late shuttle between the science campus and the halls has been withdrawn without notice. You finish labs at nine and the walk takes forty minutes, much of it unlit.\u003c/p>","bullets":["Say what has changed and when you noticed.","Explain the effect.","Ask for something achievable."],"header":[["To:","transport@northgate.ac.uk"],["Subject:","Withdrawal of the 21:15 science campus shuttle"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“There is no real conflict between doing good and making money” denies the premise of the question, which is about what happens when there is one.","correct":false},{"text":"“Clever or stupid” misstates what grouping claims to measure, and no actual arrangement is proposed, so the policy question is not answered.","correct":false},{"text":"No achievable ask and no identification. “Bring back the shuttle immediately” is the one thing this office may be unable to do, no alternative is offered, and the email is unsigned — so it cannot be answered at all.","correct":true},{"text":"It accuses rather than reports. “totally unacceptable” and “the university is always talking about student safety but then you cut the services” make it a political argument rather than a request, and address it to a clerk who did not take the decision.","correct":true},{"text":"Language and evidence. No dates, no route, no times. “Cancelled” is asserted where the writer only knows the bus did not come.","correct":true},{"text":"It never takes a position. It restates Yusuf, restates Mei, and recommends “a balance”. The task asks you to express and support an opinion; this expresses an unwillingness to have one.","correct":false}],"key_html":"F3"}};</script>
