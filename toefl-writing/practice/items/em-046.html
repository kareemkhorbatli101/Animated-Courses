<script>window.ITEM={"kind":"exercise","id":"EM 046","slug":"em-046","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Inquiry and information seeking","payload":{"Strategy":"ask the question whose answer you cannot look up","Grammar":"could you confirm whether","Vocabulary":"accredited, provisional, conditional, recognised","Convention":"enquiring where the answer affects a decision with a deadline"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  \"Internationally recognised\" is a marketing phrase. How do you say so without accusing them of marketing?\u003c/p>\u003cp>b.  What makes a question about recognition answerable?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Distinguish accredited, recognised and approved.\u003c/p>\u003cp>b.  What is a regulator, and why does recognition depend on the destination rather than the provider?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Ask the question in a form that cannot be answered with a brochure phrase.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Two versions of the question are asked. Why does the second one matter?\u003c/p>\u003cp>b.  The writer offers to go elsewhere. What does that achieve?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"What I need to establish is narrower\" — what does this do to the prospectus claim without contradicting it?\u003c/p>\u003cp>b.  \"or if it is not something you track\" — why offer this escape?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  By treating it as true but insufficiently specific for your purpose. \"The prospectus describes it as internationally recognised; what I need to establish is narrower\" accepts their claim and moves past it.\u003c/p>\u003cp>b.  Naming the specific body and the specific use. Recognition is always recognition by someone for something, and a question that omits either can be answered truthfully and uselessly.\u003c/p>","P2":"\u003cp>a.  Accredited: assessed against a standard by an accrediting body. Recognised: accepted by a particular authority for a particular purpose. Approved: on a named list. They are not interchangeable and providers often rely on the confusion.\u003c/p>\u003cp>b.  The body that controls who may practise. Recognition depends on the destination because the regulator in your country decides what it accepts — the provider cannot confer it.\u003c/p>","P3":"\u003cp>Model: \"Could you confirm whether the diploma currently appears on the Council’s list of approved qualifications?\"\u003c/p>","F1":"\u003cp>a.  Because the first may be answered \"we are not on their list but that does not mean it is not accepted\", which leaves her nowhere. Asking whether any graduate has actually registered converts an institutional question into a factual one that has a yes or a no.\u003c/p>\u003cp>b.  It removes the incentive to bluff. An institution that does not know the answer can now say so without losing face, which is far more useful to her than a confident vagueness.\u003c/p>","F2":"\u003cp>a.  It reframes the gap as a difference of scope rather than as a falsehood. The prospectus can be entirely true and still not answer her question, and saying it that way keeps the exchange cooperative.\u003c/p>\u003cp>b.  Because providers often genuinely do not track foreign regulatory status, and pretending otherwise is the easiest path for whoever replies. Offering the honest answer as acceptable is what makes it likely.\u003c/p>","F3":"\u003cp>1.  The question is as vague as the claim it is querying. \"Recognised internationally\" and \"work with it in my country\" name no regulator, so any answer will be as empty as the prospectus.\u003c/p>\u003cp>2.  \"Please send me more information\" asks for documents rather than a fact, which invites a brochure.\u003c/p>\u003cp>3.  The deadline is \"soon\" rather than 30 April, so it cannot be prioritised; and \"it does not give details\" is a complaint where a specific request was needed.\u003c/p>"},"model":["Dear Admissions,","Thank you for the offer of a place on the Diploma in Clinical Audiology. Before I accept I need to check one thing about recognition, and I could not find it on the website.","The prospectus describes the diploma as internationally recognised. What I need to establish is narrower: whether it is accepted by the Jordanian Higher Health Council for registration as a practising audiologist. Could you confirm whether the diploma currently appears on their list of approved qualifications, or whether any graduate has registered with them on the strength of it?","If the answer is no, or if it is not something you track, I would be grateful to know that too — I can then ask the Council directly rather than assume.","I have been asked to confirm my place by 30 April, so I would be very glad of an answer before then if that is possible.","Thank you very much.","Yours sincerely,","Rania Haddad"],"model_html":"\u003cp>Dear Admissions,\u003c/p>\u003cp>Thank you for the offer of a place on the Diploma in Clinical Audiology. Before I accept I need to check one thing about recognition, and I could not find it on the website.\u003c/p>\u003cp>The prospectus describes the diploma as internationally recognised. What I need to establish is narrower: whether it is accepted by the Jordanian Higher Health Council for registration as a practising audiologist. Could you confirm whether the diploma currently appears on their list of approved qualifications, or whether any graduate has registered with them on the strength of it?\u003c/p>\u003cp>If the answer is no, or if it is not something you track, I would be grateful to know that too — I can then ask the Council directly rather than assume.\u003c/p>\u003cp>I have been asked to confirm my place by 30 April, so I would be very glad of an answer before then if that is possible.\u003c/p>\u003cp>Thank you very much.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Rania Haddad\u003c/p>","model_band":5,"degraded":["Dear Sir/Madam, I have received an offer for the Diploma in Clinical Audiology and before accepting I would like to know if this diploma is recognised internationally and if I will be able to work with it in my country after finishing the course. Your website says it is recognised but it does not give details. Please send me more information about this as soon as possible because I have to decide soon.","Rania"],"degraded_html":"\u003cp>Dear Sir/Madam, I have received an offer for the Diploma in Clinical Audiology and before accepting I would like to know if this diploma is recognised internationally and if I will be able to work with it in my country after finishing the course. Your website says it is recognised but it does not give details. Please send me more information about this as soon as possible because I have to decide soon.\u003c/p>\u003cp>Rania\u003c/p>","degraded_band":3,"model_words":159,"fault_list":{"tag":"F3","faults":["The question is as vague as the claim it is querying. \"Recognised internationally\" and \"work with it in my country\" name no regulator, so any answer will be as empty as the prospectus.","\"Please send me more information\" asks for documents rather than a fact, which invites a brochure.","The deadline is \"soon\" rather than 30 April, so it cannot be prioritised; and \"it does not give details\" is a complaint where a specific request was needed."],"html":["\u003cp>1.  The question is as vague as the claim it is querying. \"Recognised internationally\" and \"work with it in my country\" name no regulator, so any answer will be as empty as the prospectus.\u003c/p>","\u003cp>2.  \"Please send me more information\" asks for documents rather than a fact, which invites a brochure.\u003c/p>","\u003cp>3.  The deadline is \"soon\" rather than 30 April, so it cannot be prioritised; and \"it does not give details\" is a complaint where a specific request was needed.\u003c/p>"]},"scenario":"\u003cp>You have been offered a place on a professional training course and need to know whether it is recognised by the regulator in your home country. The provider says \"internationally recognised\", which means nothing.\u003c/p>","bullets":["Say what you have been told and why it is not enough.","Ask the precise question.","Say why you need to know by when."],"header":[["To:","admissions@caldwellinstitute.org"],["Subject:","Recognition status — Diploma in Clinical Audiology"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"It restates the two positions as “efficiency versus freedom” and proposes informing people, which is Juno’s position with a leaflet attached and does not engage Theo’s point about who checks the chooser.","correct":false},{"text":"“Please send me more information” asks for documents rather than a fact, which invites a brochure.","correct":true},{"text":"The question is as vague as the claim it is querying. “Recognised internationally” and “work with it in my country” name no regulator, so any answer will be as empty as the prospectus.","correct":true},{"text":"The deadline is “soon” rather than 30 April, so it cannot be prioritised; and “it does not give details” is a complaint where a specific request was needed.","correct":true},{"text":"“Which is obviously good for society” does the work that the argument was supposed to do, and the whole response ignores the prompt’s actual question about where the benefit flows.","correct":false},{"text":"“Young people are very connected through social media” is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.","correct":false}],"key_html":"F3"}};</script>
