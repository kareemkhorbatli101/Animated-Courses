<script>window.ITEM={"kind":"family","id":"BAS 091–100","slug":"bas-family-12","task":"bas","task_label":"Build a Sentence","time":"10 items","function":"Family 12 of 12 — noun phrase, agreement and determiners","payload":{"Strategy":"find the real head of the subject before you choose the verb","Grammar":"articles, quantifiers, agreement, appositives, adjective order","Vocabulary":"countable and uncountable pairs that trip writers up","Convention":"singular they, and possessives of people against things"},"intro":"\u003cp>One sentence is complete; the reply has its words out of order. Move them into a reply that is both grammatical and a sensible answer to the cue. No partial credit.\u003c/p>\u003cp>This last family collects the errors that survive longest. They are small, they are frequent, and because they cluster in the noun phrase they tend to arrive several at a time — which is exactly the accumulation the band descriptors are measuring.\u003c/p>","preview":[{"tag":"P1","title":"Find the head","html":"\u003cp>Which word decides the verb in each?\u003c/p>\u003cpre class=\"mono\">The list of corrections at the back ______ incomplete.\nThe microscopes in the lab ______ not covered.\nEvery seminar room ______ a projector.\u003c/pre>"},{"tag":"P2","title":"Countable or not","html":"\u003cp>Which of these can take a and a plural?\u003c/p>\u003cpre class=\"mono\">identification · form · advice · recommendation\nequipment · device · research · study\u003c/pre>"},{"tag":"P3","title":"Whose what","html":"\u003cp>Which sounds right, and what is the principle?\u003c/p>\u003cpre class=\"mono\">(a) the supervisor’s signature / the signature of the supervisor\n(b) the page’s bottom / the bottom of the page\u003c/pre>"}],"followup":[{"tag":"F1","title":"Delete the middle","html":"\u003cp>Cross out everything between the head noun and the verb, then choose.\u003c/p>\u003cpre class=\"mono\">(a) The quality of the submissions ______ (has/have) fallen.\n(b) A number of students ______ (was/were) waiting.\n(c) The number of students ______ (was/were) falling.\u003c/pre>\u003cp class=\"note\">Items (b) and (c) look identical and behave differently. That is the point of the exercise.\u003c/p>"},{"tag":"F2","title":"Error autopsy","html":"\u003cpre class=\"mono\">(a) I need an advice about the equipments.\n(b) Each of the students have their own tutor.\n(c) She gave me a many useful informations.\n(d) The report’s conclusion of the committee was ignored.\u003c/pre>"},{"tag":"F3","title":"Put it to work","html":"\u003cp>Write the opening sentence of an email reporting a problem, using a subject whose head noun is separated from its verb by at least four words. Then check the agreement by deleting the middle.\u003c/p>"}],"keys":{"P1":"\u003cp>list \u003cstrong>is\u003c/strong> · microscopes \u003cstrong>are\u003c/strong> · every seminar room \u003cstrong>has\u003c/strong>.\u003c/p>\u003cp>In each case the verb reaches back to the head of the subject, ignoring everything in between.\u003c/p>","P2":"\u003cp>\u003cstrong>form, recommendation, device, study\u003c/strong> are countable. \u003cstrong>identification, advice, equipment, research\u003c/strong> are not: no a, no plural, ever.\u003c/p>\u003cp>Note the pairs: \u003cem>advice\u003c/em> is uncountable but \u003cem>a recommendation\u003c/em> is countable; \u003cem>research\u003c/em> is uncountable but \u003cem>a study\u003c/em> is countable. English is not being consistent, and there is nothing to do but learn them.\u003c/p>","P3":"\u003cp>(a) both are acceptable, and the possessive is more natural because a supervisor is a person.\u003c/p>\u003cp>(b) only \u003cstrong>the bottom of the page\u003c/strong>. Inanimate things take of.\u003c/p>\u003cp>The principle is animacy: people own things, pages have parts.\u003c/p>","F1":"\u003cp>(a) \u003cstrong>has\u003c/strong> — head is quality.\u003c/p>\u003cp>(b) \u003cstrong>were\u003c/strong> — \u003cem>a number of\u003c/em> is a quantifier meaning several, so the real head is students.\u003c/p>\u003cp>(c) \u003cstrong>was\u003c/strong> — \u003cem>the number\u003c/em> is a genuine head noun, singular. The article is the only difference between them.\u003c/p>","F2":"\u003cp>(a) → some advice about the equipment. Both uncountable.\u003c/p>\u003cp>(b) → Each of the students has their own tutor. \u003cem>each\u003c/em> is the head, not \u003cem>students\u003c/em>.\u003c/p>\u003cp>(c) → a great deal of useful information.\u003c/p>\u003cp>(d) → The committee’s report was ignored, or The conclusion of the committee’s report was ignored. As written the modifiers have been stacked in the wrong order.\u003c/p>","F3":"\u003cp>Model: \u003cem>The confirmation email for the three rooms we booked in March has still not arrived.\u003c/em>\u003c/p>\u003cp>Delete the middle: \u003cem>The confirmation email … has not arrived.\u003c/em> Agreement holds. This is the only reliable way to check a long subject, and it takes two seconds.\u003c/p>"},"rows":[91,92,93,94,95,96,97,98,99,100]};</script>
