<script>window.ITEM={"kind":"exercise","id":"EM 026","slug":"em-026","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Apology and explanation","payload":{"Strategy":"when you have damaged something, lead with the replacement","Grammar":"the participial cause clause","Vocabulary":"warped, out of true, replacement, as-new","Convention":"apologising to someone who lent you something in good faith"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  Why should the replacement come before the explanation?\u003c/p>\u003cp>b.  What is the one word that must appear somewhere in this email?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What does it mean for something to be out of true?\u003c/p>\u003cp>b.  Distinguish a replacement, a repair and a refund.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take responsibility in one sentence with no subordinate clause.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The second paragraph is a single short sentence. What is it for?\u003c/p>\u003cp>b.  The writer offers to return a broken object. Why is that not pointless?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"That was careless of me and there is nothing else to it.\" What does the second clause close off?\u003c/p>\u003cp>b.  \"Leaving it in a car boot, the head warped\" would be wrong. Why?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Because it is the only thing the reader actually needs. Everything else is context for a decision that has already been made, and leading with it proves the apology is real before the explanation can be mistaken for an excuse.\u003c/p>\u003cp>b.  A form of \"I will replace it\". An apology for damaging borrowed equipment that does not mention replacement is not an apology, it is a notification.\u003c/p>","P2":"\u003cp>a.  Not straight or not level, said of something that should be. It is the precise word for a mounting plate that no longer sits flat, and using it shows you understand what is wrong.\u003c/p>\u003cp>b.  A replacement is a new item; a repair restores the old one; a refund is money instead of either. Offer the first and let them propose the others.\u003c/p>","P3":"\u003cp>Model: \"I have damaged tripod TR-4 and I will replace it.\"\u003c/p>\u003cp>No \"unfortunately\", no \"somehow\", no passive. The absence of hedging is the content of the sentence.\u003c/p>","F1":"\u003cp>a.  It is the whole message. Isolating it as a paragraph means the reader has the fault and the remedy before any explanation arrives, so the explanation cannot be read as a bid for sympathy.\u003c/p>\u003cp>b.  Because the department may be able to salvage the legs, and because returning it removes any suggestion that you are buying your way out of the problem. It also lets them verify the damage without asking.\u003c/p>","F2":"\u003cp>a.  It closes off the search for mitigating circumstances — both the reader’s and the writer’s. It says: do not look for a reason, there is not one, and I am not going to offer you a bad one.\u003c/p>\u003cp>b.  Because the understood subject of the participle must be the subject of the main clause, and the head did not leave the tripod in the car. That is the dangling modifier of family 5, structure 39 — and here it would accidentally remove the writer from the sentence entirely, which is the opposite of what an apology needs.\u003c/p>","F3":"\u003cp>1.  Responsibility is evaded throughout. \"Something happened\", \"the heat affected the plastic somehow\" — the writer never appears as the agent, and the second bullet fails.\u003c/p>\u003cp>2.  It blames the equipment. \"It was already quite old and the head was always a little loose\" shifts the fault to the department that lent it, which is both unfair and transparent.\u003c/p>\u003cp>3.  No remedy. \"Let me know what you want me to do\" hands the problem back, and \"a bit wobbly\" understates damage that makes the item unusable. The third bullet fails.\u003c/p>"},"model":["Dear Technicians,","I have damaged tripod TR-4 and I will replace it.","I left it in a car boot over a hot weekend and the plastic head has warped; the plate no longer sits true, so a camera will not stay level on it. That was careless of me and there is nothing else to it.","I have found the same model new for £92 and can order it to the department this week, or pay the equivalent into the departmental account if you would rather order it yourselves. I will bring the damaged one back either way, in case the legs are still usable.","Sorry about this.","Best wishes,","Ana Ferreira — MA Media Practice"],"model_html":"\u003cp>Dear Technicians,\u003c/p>\u003cp>I have damaged tripod TR-4 and I will replace it.\u003c/p>\u003cp>I left it in a car boot over a hot weekend and the plastic head has warped; the plate no longer sits true, so a camera will not stay level on it. That was careless of me and there is nothing else to it.\u003c/p>\u003cp>I have found the same model new for £92 and can order it to the department this week, or pay the equivalent into the departmental account if you would rather order it yourselves. I will bring the damaged one back either way, in case the legs are still usable.\u003c/p>\u003cp>Sorry about this.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Ana Ferreira — MA Media Practice\u003c/p>","model_band":5,"degraded":["Hi, I am really sorry but something happened to the tripod I borrowed. I think the heat in the car affected the plastic somehow and now it is a bit wobbly. To be fair it was already quite old and the head was always a little loose. Let me know what you want me to do about it.","Ana"],"degraded_html":"\u003cp>Hi, I am really sorry but something happened to the tripod I borrowed. I think the heat in the car affected the plastic somehow and now it is a bit wobbly. To be fair it was already quite old and the head was always a little loose. Let me know what you want me to do about it.\u003c/p>\u003cp>Ana\u003c/p>","degraded_band":3,"model_words":116,"fault_list":{"tag":"F3","faults":["Responsibility is evaded throughout. \"Something happened\", \"the heat affected the plastic somehow\" — the writer never appears as the agent, and the second bullet fails.","It blames the equipment. \"It was already quite old and the head was always a little loose\" shifts the fault to the department that lent it, which is both unfair and transparent.","No remedy. \"Let me know what you want me to do\" hands the problem back, and \"a bit wobbly\" understates damage that makes the item unusable. The third bullet fails."],"html":["\u003cp>1.  Responsibility is evaded throughout. \"Something happened\", \"the heat affected the plastic somehow\" — the writer never appears as the agent, and the second bullet fails.\u003c/p>","\u003cp>2.  It blames the equipment. \"It was already quite old and the head was always a little loose\" shifts the fault to the department that lent it, which is both unfair and transparent.\u003c/p>","\u003cp>3.  No remedy. \"Let me know what you want me to do\" hands the problem back, and \"a bit wobbly\" understates damage that makes the item unusable. The third bullet fails.\u003c/p>"]},"scenario":"\u003cp>You borrowed a departmental tripod and left it in a car boot in the sun. The plastic head has warped and it no longer holds a camera level. It cost about ninety pounds.\u003c/p>","bullets":["Say what has happened to it.","Take responsibility clearly.","Say what you propose to do about it."],"header":[["To:","technicians.media@northgate.ac.uk"],["Subject:","Tripod TR-4 — damaged in my care"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"The recommendation — build lanes and run campaigns — follows from no analysis, and the response never asks whether campaigns work. Language: “the topography”, “the bicycle”, “way of transport” (means of transport), “make campaigns” (run campaigns).","correct":false},{"text":"The rebuttal of Lucas is an anecdotal claim (“many people start when they are already in difficulty”) offered against a statistical objection it cannot touch.","correct":false},{"text":"It blames the equipment. “It was already quite old and the head was always a little loose” shifts the fault to the department that lent it, which is both unfair and transparent.","correct":true},{"text":"No remedy. “Let me know what you want me to do” hands the problem back, and “a bit wobbly” understates damage that makes the item unusable. The third bullet fails.","correct":true},{"text":"Responsibility is evaded throughout. “Something happened”, “the heat affected the plastic somehow” — the writer never appears as the agent, and the second bullet fails.","correct":true},{"text":"Accumulated error. “the academic honesty”, “very important thing” (a very important thing), “If … don’t say it, so the teacher” (a comma splice with a stray so), “it is working good” (working well), “make some punishment” (impose a penalty). Individually survivable; together they are what the descriptor calls some noticeable lexical and grammatical errors.","correct":false}],"key_html":"F3"}};</script>
