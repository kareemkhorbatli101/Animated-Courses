<script>window.ITEM={"kind":"exercise","id":"AD 064","slug":"ad-064","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Environmental science · value trade-off","payload":{"Strategy":"trade off by identifying which loss is irreversible","Grammar":"future perfect","Vocabulary":"offset, mitigation, baseline, habitat","Convention":"weighing a reversible cost against an irreversible one"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Felix and Ama both claim to be protecting the environment. What divides them?\u003c/p>\u003cp>b.  What does an offset have to be true for it to work?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is mitigation, and what is a baseline?\u003c/p>\u003cp>b.  Distinguish habitat from range.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Take a position in one sentence built on reversibility.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response grants Felix’s comparison of harms and still rejects his conclusion. On what basis?\u003c/p>\u003cp>b.  The last paragraph refuses a straight answer. Is that evasion?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the peat, once cut, will not have re-formed\" — why the future perfect three times in that paragraph?\u003c/p>\u003cp>b.  \"the grant buys something other than what is being destroyed\" — why this formulation?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Felix weighs aggregate climate risk; Ama weighs the specific, non-substitutable thing on the site. The dispute is about whether environmental goods can be traded against each other at all.\u003c/p>\u003cp>b.  That the thing restored is equivalent to the thing lost — fungible in kind, quantity and time. Carbon is roughly fungible; an ancient peat formation and a particular breeding population are not.\u003c/p>","P2":"\u003cp>a.  Mitigation is reducing a harm at source; a baseline is the reference state against which change is measured.\u003c/p>\u003cp>b.  Habitat is the conditions a species needs to live and breed; range is the geographical area it occupies. A species can keep its range while losing the habitat that sustains breeding.\u003c/p>","P3":"\u003cp>Model: \"The emissions saved here will be saved elsewhere eventually; the peat and the breeding population will not come back, so the irreversible loss should decide.\"\u003c/p>","F1":"\u003cp>a.  On the asymmetry between a reversible and an irreversible loss. The comparison of magnitudes is only valid if both quantities remain available to be traded, and one of them disappears permanently once taken.\u003c/p>\u003cp>b.  No, because the question as posed assumes the site is fixed, and it is not. Identifying that the conflict is avoidable is a stronger answer than accepting the trade-off and picking a side, and the response still says where the burden lies.\u003c/p>","F2":"\u003cp>a.  Because the argument is about what will be true looking back from a future point. The future perfect lets all three outcomes be compared at the same horizon, which is the only way the reversibility difference becomes visible.\u003c/p>\u003cp>b.  It states the objection without claiming the offset is worthless. The restoration grant may do real good elsewhere; it simply does not replace this. That is more precise, and harder to answer, than calling offsets a sham.\u003c/p>","F3":"\u003cp>1.  \"We have to accept some sacrifices for the greater good\" restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.\u003c/p>\u003cp>2.  \"The developers are offering money which shows they are being responsible\" treats the offer as evidence of good faith rather than examining whether it replaces what is lost.\u003c/p>\u003cp>3.  \"If every community blocks wind farms\" answers a general argument nobody made, and the possibility of a different site — the obvious move — is never considered.\u003c/p>"},"model":["Ama has the stronger case, and the reason is reversibility rather than the relative size of the two harms.","Felix is right that climate change threatens the bird more than turbines do, and the argument that local objections block decarbonisation is a real one. But his reasoning compares two quantities of harm as though both were recoverable. They are not. By 2100 the emissions this farm avoids will have been avoided by other means too, because the whole grid will have changed; the peat, once cut, will not have re-formed, and the breeding population, once lost, will not have returned.","That is what makes Ama’s point about offsets decisive rather than merely cautious. An offset works when the resource is fungible — a tonne of carbon is a tonne anywhere. Eight thousand years of peat and one breeding population are not fungible, so the grant buys something other than what is being destroyed.","My position is that the project should go ahead only if it can be sited off the peat, and that this is a planning question rather than a yes or no. Where an irreversible loss can be avoided by moving a reversible gain, the burden is on the developer to move."],"model_html":"\u003cp>Ama has the stronger case, and the reason is reversibility rather than the relative size of the two harms.\u003c/p>\u003cp>Felix is right that climate change threatens the bird more than turbines do, and the argument that local objections block decarbonisation is a real one. But his reasoning compares two quantities of harm as though both were recoverable. They are not. By 2100 the emissions this farm avoids will have been avoided by other means too, because the whole grid will have changed; the peat, once cut, will not have re-formed, and the breeding population, once lost, will not have returned.\u003c/p>\u003cp>That is what makes Ama’s point about offsets decisive rather than merely cautious. An offset works when the resource is fungible — a tonne of carbon is a tonne anywhere. Eight thousand years of peat and one breeding population are not fungible, so the grant buys something other than what is being destroyed.\u003c/p>\u003cp>My position is that the project should go ahead only if it can be sited off the peat, and that this is a planning question rather than a yes or no. Where an irreversible loss can be avoided by moving a reversible gain, the burden is on the developer to move.\u003c/p>","model_band":5,"degraded":["I think we should build the wind farm because climate change is the most urgent problem facing humanity and we cannot afford to delay the transition to renewable energy. Ama is worried about the peat bog and the birds, which I understand, but we have to accept some sacrifices for the greater good. The developers are offering money for restoration elsewhere which shows they are being responsible. If every community blocks wind farms then we will never reduce emissions and in the end the birds will suffer much more."],"degraded_html":"\u003cp>I think we should build the wind farm because climate change is the most urgent problem facing humanity and we cannot afford to delay the transition to renewable energy. Ama is worried about the peat bog and the birds, which I understand, but we have to accept some sacrifices for the greater good. The developers are offering money for restoration elsewhere which shows they are being responsible. If every community blocks wind farms then we will never reduce emissions and in the end the birds will suffer much more.\u003c/p>","degraded_band":3,"model_words":204,"fault_list":{"tag":"F3","faults":["\"We have to accept some sacrifices for the greater good\" restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.","\"The developers are offering money which shows they are being responsible\" treats the offer as evidence of good faith rather than examining whether it replaces what is lost.","\"If every community blocks wind farms\" answers a general argument nobody made, and the possibility of a different site — the obvious move — is never considered."],"html":["\u003cp>1.  \"We have to accept some sacrifices for the greater good\" restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.\u003c/p>","\u003cp>2.  \"The developers are offering money which shows they are being responsible\" treats the offer as evidence of good faith rather than examining whether it replaces what is lost.\u003c/p>","\u003cp>3.  \"If every community blocks wind farms\" answers a general argument nobody made, and the possibility of a different site — the obvious move — is never considered.\u003c/p>"]},"prof_name":"Professor Lindgren","professor":"\u003cp>A wind farm proposed on moorland would cut regional emissions substantially but would damage a peat bog and the habitat of a declining bird species. Developers offer to fund restoration elsewhere. Should the project go ahead?\u003c/p>","students":[["Felix","Yes. Climate change is the larger threat to that bird than any wind farm, and refusing low-carbon projects on local environmental grounds is how nothing gets built."],["Ama","Peat that took eight thousand years to form is not restorable by a grant. Offsets assume the two sites are interchangeable, and with a specific breeding population they are not."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"It decides the other person’s constraints for them. “The mornings should be fine for you anyway since you only need afternoons” tells Olle what he needs, which is both presumptuous and the quickest way to lose a negotiation.","correct":false},{"text":"“The developers are offering money which shows they are being responsible” treats the offer as evidence of good faith rather than examining whether it replaces what is lost.","correct":true},{"text":"It does exactly what the email was meant to undo: “students who are having difficulties”, “everybody who is struggling”. The second bullet is not merely unaddressed but actively worsened.","correct":false},{"text":"The role is never explained. “Participate as a discussant” assumes she knows what that involves here, and the preparation — three papers, twelve thousand words — is completely concealed. The second bullet fails.","correct":false},{"text":"“If every community blocks wind farms” answers a general argument nobody made, and the possibility of a different site — the obvious move — is never considered.","correct":true},{"text":"“We have to accept some sacrifices for the greater good” restates the dilemma instead of resolving it, and never engages Ama’s specific claim about fungibility.","correct":true}],"key_html":"F3"}};</script>
