<script>window.ITEM={"kind":"exercise","id":"AD 072","slug":"ad-072","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Economics · cause ranking","payload":{"Strategy":"rank causes by which one the policy can reach","Grammar":"inversion with not only","Vocabulary":"supply, demand, elasticity, planning","Convention":"ranking causes of a price rise"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Aiko’s question is a test of Hugo’s theory. What would it take to answer it?\u003c/p>\u003cp>b.  Why might the third cause be the deepest and still rank last?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is elasticity of supply, and why is it central here?\u003c/p>\u003cp>b.  Distinguish an asset price from a consumption price.\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Rank the three in one sentence using a mechanism.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response reinterprets Aiko’s counter-example rather than rejecting it. Why is that stronger?\u003c/p>\u003cp>b.  Why does the deepest cause rank last?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Not only does restricted supply raise prices directly, it converts...\" — identify the inversion and say what it contributes.\u003c/p>\u003cp>b.  \"supply was elastic in the wrong place\" — why is this phrasing precise?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Evidence about where those cities built relative to where demand was. If the building happened away from jobs, supply was not in fact responsive and the counter-example dissolves.\u003c/p>\u003cp>b.  Because ranking is about explanatory and practical priority, not depth. A cause that explains the pattern but cannot be altered does less work in an account aimed at policy.\u003c/p>","P2":"\u003cp>a.  Elasticity of supply is how much quantity responds to price. Where it is high, demand shocks produce building; where it is low, they produce price rises — which is the whole argument.\u003c/p>\u003cp>b.  A consumption price reflects the cost of using something; an asset price reflects expected future returns and is far more sensitive to credit conditions.\u003c/p>","P3":"\u003cp>Model: \"Planning first because it converts demand into price rather than houses, credit second as the demand it converts, job concentration third.\"\u003c/p>","F1":"\u003cp>a.  Because rejecting it would leave the evidence standing against Hugo. Showing that the building happened away from demand turns her apparent counter-example into a confirmation, which is a far more damaging reply.\u003c/p>\u003cp>b.  Because it is upstream of the demand but says nothing about why that demand becomes price instead of construction, and because policy cannot relocate agglomeration. Depth and explanatory priority come apart.\u003c/p>","F2":"\u003cp>a.  \"Not only does restricted supply raise prices\" inverts subject and auxiliary after the fronted negative. It marks the second effect as the more important one, which is exactly the claim — the conversion of demand into price is what makes planning primary.\u003c/p>\u003cp>b.  Because it concedes the fact Aiko cites — building did occur — while denying its relevance. Elasticity is location-specific, so aggregate construction figures can coexist with a binding constraint where it matters.\u003c/p>","F3":"\u003cp>1.  It does not rank. Three causes are mentioned and all are given policy recommendations, with no account of which explains most.\u003c/p>\u003cp>2.  Aiko’s argument is answered with a claim about what central banks can do, which is beside the point — her claim was about the effect of credit on prices, not about policy feasibility.\u003c/p>\u003cp>3.  \"A simple matter of supply and demand\" names no mechanism, and the counter-example about cities that did build is never addressed at all.\u003c/p>"},"model":["Hugo has the primary cause and Aiko has correctly identified what determines how much damage it does.","The two are not rivals. Cheap credit raises what buyers can bid, but where supply responds, extra bidding power produces extra houses rather than extra price. Not only does restricted supply raise prices directly, it converts every demand-side shock into a price rise instead of a quantity one. That is why planning ranks first: it is the condition that gives credit its effect.","Aiko’s counter-example needs a closer look. The cities that \"did build\" mostly built at the periphery while restricting development where jobs are, so supply was elastic in the wrong place. That is consistent with Hugo rather than against him.","Job concentration I would put third despite being the deepest cause, because it is the one policy can least reach. It explains why demand is where it is; it does not explain why that demand becomes price rather than construction. So: planning first as the binding constraint, credit second as the force it converts, and agglomeration third as the background that neither created nor could resolve the problem."],"model_html":"\u003cp>Hugo has the primary cause and Aiko has correctly identified what determines how much damage it does.\u003c/p>\u003cp>The two are not rivals. Cheap credit raises what buyers can bid, but where supply responds, extra bidding power produces extra houses rather than extra price. Not only does restricted supply raise prices directly, it converts every demand-side shock into a price rise instead of a quantity one. That is why planning ranks first: it is the condition that gives credit its effect.\u003c/p>\u003cp>Aiko’s counter-example needs a closer look. The cities that \"did build\" mostly built at the periphery while restricting development where jobs are, so supply was elastic in the wrong place. That is consistent with Hugo rather than against him.\u003c/p>\u003cp>Job concentration I would put third despite being the deepest cause, because it is the one policy can least reach. It explains why demand is where it is; it does not explain why that demand becomes price rather than construction. So: planning first as the binding constraint, credit second as the force it converts, and agglomeration third as the background that neither created nor could resolve the problem.\u003c/p>","model_band":5,"degraded":["In my opinion the main cause is that there are not enough houses being built, which is a simple matter of supply and demand. Governments should build more social housing and make it easier to get planning permission. Aiko mentions interest rates but central banks cannot keep rates high forever because this would damage the economy. The concentration of jobs in big cities is also a problem and governments should try to create more jobs in smaller towns so that people do not all move to the same places."],"degraded_html":"\u003cp>In my opinion the main cause is that there are not enough houses being built, which is a simple matter of supply and demand. Governments should build more social housing and make it easier to get planning permission. Aiko mentions interest rates but central banks cannot keep rates high forever because this would damage the economy. The concentration of jobs in big cities is also a problem and governments should try to create more jobs in smaller towns so that people do not all move to the same places.\u003c/p>","degraded_band":3,"model_words":189,"fault_list":{"tag":"F3","faults":["It does not rank. Three causes are mentioned and all are given policy recommendations, with no account of which explains most.","Aiko’s argument is answered with a claim about what central banks can do, which is beside the point — her claim was about the effect of credit on prices, not about policy feasibility.","\"A simple matter of supply and demand\" names no mechanism, and the counter-example about cities that did build is never addressed at all."],"html":["\u003cp>1.  It does not rank. Three causes are mentioned and all are given policy recommendations, with no account of which explains most.\u003c/p>","\u003cp>2.  Aiko’s argument is answered with a claim about what central banks can do, which is beside the point — her claim was about the effect of credit on prices, not about policy feasibility.\u003c/p>","\u003cp>3.  \"A simple matter of supply and demand\" names no mechanism, and the counter-example about cities that did build is never addressed at all.\u003c/p>"]},"prof_name":"Dr Whitfield","professor":"\u003cp>Housing costs have risen far faster than incomes in many cities. Suggested causes include restrictive planning rules, low interest rates inflating asset prices, and the concentration of jobs in a few metropolitan areas. Which matters most?\u003c/p>","students":[["Hugo","Planning. Where building is permitted, prices track construction costs; where it is not, they track whatever buyers can borrow. Everything else is downstream of supply."],["Aiko","Then why did prices rise in cities that did build? Cheap credit raised what everyone could bid, and supply cannot outrun a bidding war that is funded externally."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“I was doing my best to organise everything on my own which is not easy” is a bid for sympathy inside an apology, and it shifts the frame to the writer’s difficulties.","correct":false},{"text":"Language and register. “the room 4.12” (Room 4.12), “busy in the day” (during the day), “full of noisy people” (a judgement, not a reason), and a comma splice at “early, the library”.","correct":false},{"text":"“A simple matter of supply and demand” names no mechanism, and the counter-example about cities that did build is never addressed at all.","correct":true},{"text":"It does not rank. Three causes are mentioned and all are given policy recommendations, with no account of which explains most.","correct":true},{"text":"“Meet the academic staff” is precisely the framing that kept people away, so the second bullet is not merely unaddressed but reinforced.","correct":false},{"text":"Aiko’s argument is answered with a claim about what central banks can do, which is beside the point — her claim was about the effect of credit on prices, not about policy feasibility.","correct":true}],"key_html":"F3"}};</script>
