<script>window.ITEM={"kind":"exercise","id":"AD 038","slug":"ad-038","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Technology and AI · responsibility: who should act","payload":{"Strategy":"allocate a duty to whoever can see the whole picture","Grammar":"modals of obligation across agents","Vocabulary":"provenance, downstream, auditable, deployer","Convention":"allocating duty along a chain where nobody sees all of it"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Maya argues from capability and Tom from relationship. Which does discrimination law usually follow?\u003c/p>\u003cp>b.  What can the employer observe that the builder cannot?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is a deployer, and what does downstream mean here?\u003c/p>\u003cp>b.  What makes a system auditable?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Allocate the duty in one sentence that gives each party the part they can actually perform.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response assigns different duties by a single criterion. What is it?\u003c/p>\u003cp>b.  The final sentence makes a general claim. What is it, and is it earned?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"including the people who never applied\" — why does this clause matter so much?\u003c/p>\u003cp>b.  \"each can truthfully say the information needed to see it was held by the other\" — what makes \"truthfully\" the key word?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Relationship, usually. The duty not to discriminate attaches to the party making the decision about the applicant, which is Tom’s point — though that does not settle who can detect the problem.\u003c/p>\u003cp>b.  Their own outcomes: who applied, who was filtered, who was hired, and by group. The builder sees the model; only the employer sees what it did in their context.\u003c/p>","P2":"\u003cp>a.  The deployer is the party putting the system into use. Downstream means after the model is supplied — the uses and effects the builder does not control.\u003c/p>\u003cp>b.  That its inputs, decisions and outcomes can be inspected and reconstructed afterwards by someone who was not involved in building it.\u003c/p>","P3":"\u003cp>Model: \"The builder must document what the model optimises and on what it was trained; the employer must monitor outcomes in their own pool; the regulator must require the two to connect.\"\u003c/p>","F1":"\u003cp>a.  Who can see the relevant information. Each duty is assigned to the only party in a position to discharge it, which is why neither can be substituted for the other.\u003c/p>\u003cp>b.  That responsibility need not be allocated as a single whole. It is earned, because the preceding paragraphs have shown a concrete case in which splitting it produces a workable arrangement and insisting on unity produces deadlock.\u003c/p>","F2":"\u003cp>a.  Because the most serious effects of a filtering tool are on people who are deterred from applying at all, and those never appear in the model’s outputs. Only the employer, looking at their own pipeline against the labour market, has any chance of seeing it — which is the strongest argument for locating monitoring there.\u003c/p>\u003cp>b.  Because it establishes that the failure is structural rather than evasive. If both parties can be honest and the problem still goes undetected, no amount of good faith fixes it, and the remedy has to be a rule about information rather than about conduct.\u003c/p>","F3":"\u003cp>1.  It allocates to everyone, which is the answer the question was designed to improve on, and neither classmate’s argument is engaged.\u003c/p>\u003cp>2.  \"Make sure it is not biased\" and \"check that the tool is working correctly\" assume the detection problem away — the whole difficulty is that neither party can do this alone.\u003c/p>\u003cp>3.  \"If everybody does their job then these problems will not happen\" is an unearned absolute, and \"the recruitment process will be fair for everybody\" does not follow from anything. Language: \"all the actors\", \"the citizens\", \"the algorithm\" over-articled.\u003c/p>"},"model":["Maya and Tom are each right about a different duty, and the argument only looks binary because both are called responsibility. The builder is the only party who can know what the model optimises and on what it was trained, so the duty to document belongs there. The employer is the only party who can see the outcome in their own applicant pool, including the people who never applied, so the duty to monitor belongs there. Neither can discharge the other’s.","That split also explains why the current arrangement fails. A vendor supplies a model with no provenance statement; an employer runs it without outcome data because it is nobody’s job to collect it; and when a pattern emerges each can truthfully say the information needed to see it was held by the other. The regulator’s role is then neither to build nor to monitor but to require that the two be connected — a documentation standard on the builder and an outcome-reporting duty on the deployer. Responsibility does not have to be allocated whole, and insisting that it does is what keeps this argument circular."],"model_html":"\u003cp>Maya and Tom are each right about a different duty, and the argument only looks binary because both are called responsibility. The builder is the only party who can know what the model optimises and on what it was trained, so the duty to document belongs there. The employer is the only party who can see the outcome in their own applicant pool, including the people who never applied, so the duty to monitor belongs there. Neither can discharge the other’s.\u003c/p>\u003cp>That split also explains why the current arrangement fails. A vendor supplies a model with no provenance statement; an employer runs it without outcome data because it is nobody’s job to collect it; and when a pattern emerges each can truthfully say the information needed to see it was held by the other. The regulator’s role is then neither to build nor to monitor but to require that the two be connected — a documentation standard on the builder and an outcome-reporting duty on the deployer. Responsibility does not have to be allocated whole, and insisting that it does is what keeps this argument circular.\u003c/p>","model_band":5,"degraded":["In my opinion the responsibility should be shared between all the actors because each of them plays a role in this process. The company that creates the algorithm must make sure it is not biased and test it properly before selling it. The employer must also check that the tool is working correctly and not discriminating against candidates. And the regulator must create clear rules and controls to protect the citizens. If everybody does their job then these problems will not happen and the recruitment process will be fair for everybody."],"degraded_html":"\u003cp>In my opinion the responsibility should be shared between all the actors because each of them plays a role in this process. The company that creates the algorithm must make sure it is not biased and test it properly before selling it. The employer must also check that the tool is working correctly and not discriminating against candidates. And the regulator must create clear rules and controls to protect the citizens. If everybody does their job then these problems will not happen and the recruitment process will be fair for everybody.\u003c/p>","degraded_band":3,"model_words":186,"fault_list":{"tag":"F3","faults":["It allocates to everyone, which is the answer the question was designed to improve on, and neither classmate’s argument is engaged.","\"Make sure it is not biased\" and \"check that the tool is working correctly\" assume the detection problem away — the whole difficulty is that neither party can do this alone.","\"If everybody does their job then these problems will not happen\" is an unearned absolute, and \"the recruitment process will be fair for everybody\" does not follow from anything. Language: \"all the actors\", \"the citizens\", \"the algorithm\" over-articled."],"html":["\u003cp>1.  It allocates to everyone, which is the answer the question was designed to improve on, and neither classmate’s argument is engaged.\u003c/p>","\u003cp>2.  \"Make sure it is not biased\" and \"check that the tool is working correctly\" assume the detection problem away — the whole difficulty is that neither party can do this alone.\u003c/p>","\u003cp>3.  \"If everybody does their job then these problems will not happen\" is an unearned absolute, and \"the recruitment process will be fair for everybody\" does not follow from anything. Language: \"all the actors\", \"the citizens\", \"the algorithm\" over-articled.\u003c/p>"]},"prof_name":"Dr Sorensen","professor":"\u003cp>When an automated hiring tool is found to disadvantage a protected group, responsibility is contested between the company that built the model, the employer that deployed it, and the regulator. Where should it sit?\u003c/p>","students":[["Maya","The builder. They chose the training data and the objective function, and they are the only party with the expertise to know what the model is doing. An employer buying a tool cannot reasonably be expected to audit a neural network."],["Tom","The employer. They decide to use it, they benefit from it, and they are the ones in a legal relationship with the applicant. Outsourcing a decision does not outsource the duty that goes with making it."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Make sure it is not biased” and “check that the tool is working correctly” assume the detection problem away — the whole difficulty is that neither party can do this alone.","correct":true},{"text":"The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","correct":false},{"text":"The repayment is deferred indefinitely. “I will make it up to you soon when things calm down” names no date and no shift, so the third bullet fails.","correct":false},{"text":"It allocates to everyone, which is the answer the question was designed to improve on, and neither classmate’s argument is engaged.","correct":true},{"text":"“If everybody does their job then these problems will not happen” is an unearned absolute, and “the recruitment process will be fair for everybody” does not follow from anything. Language: “all the actors”, “the citizens”, “the algorithm” over-articled.","correct":true},{"text":"“A very difficult month” and “extremely busy with exams and revision” are vague where exact dates were available, so the decline sounds like reluctance.","correct":false}],"key_html":"F3"}};</script>
