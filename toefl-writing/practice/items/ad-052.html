<script>window.ITEM={"kind":"exercise","id":"AD 052","slug":"ad-052","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Psychology and society · agree or disagree with a claim","payload":{"Strategy":"ask whether the effect survives the obvious confound","Grammar":"hedged generalisation","Vocabulary":"correlation, confound, self-selection, dose-response","Convention":"assessing a claim people want to be true"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Nadia concedes Lucas’s objection. What does she then do with it?\u003c/p>\u003cp>b.  Why does allocation rather than choice change what the study measures?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is self-selection, and what is a dose-response relationship?\u003c/p>\u003cp>b.  Why does an effect getting smaller under randomisation support rather than undermine the causal claim?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>State what the trials show in one sentence that neither overstates nor dismisses.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response distinguishes the trials from the policy. On what basis?\u003c/p>\u003cp>b.  Why does it say the shrinkage is \"itself informative\"?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"tends not to survive becoming an instruction\" — what does the hedge protect?\u003c/p>\u003cp>b.  \"considerably less than the policy assumes\" — what does this final clause do?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  Accepts it as an explanation of most of the association and then produces the evidence that is immune to it, which is how an objection should be answered.\u003c/p>\u003cp>b.  Because allocation breaks the link between the participant’s prior health and their presence in the activity, so any remaining difference cannot be explained by who chose to join.\u003c/p>","P2":"\u003cp>a.  Self-selection is people choosing into a group for reasons related to the outcome. A dose-response relationship is more exposure producing more effect, which is some evidence of causation.\u003c/p>\u003cp>b.  Because it is what you would predict if the observational estimate was inflated by selection: removing the selection should shrink the effect without eliminating it. An unchanged effect would be more suspicious, not less.\u003c/p>","P3":"\u003cp>Model: \"Allocation studies show a real but considerably smaller effect than the observational ones, which is what you would expect if selection explained most of the gap.\"\u003c/p>","F1":"\u003cp>a.  On what is actually administered. The trial gives people an activity; prescription gives them an activity plus a clinical instruction, and the proposed mechanism — relationships — is one that instruction may undermine.\u003c/p>\u003cp>b.  Because the size of the change carries information about the structure of the original association. It is not merely a weaker result; it is the result you would have predicted on Lucas’s hypothesis, which makes it unusually strong evidence.\u003c/p>","F2":"\u003cp>a.  Against the obvious counter-example — plenty of prescribed things work. The claim is about a tendency in interventions whose mechanism is voluntary engagement, and the hedge keeps it there.\u003c/p>\u003cp>b.  It converts an academic qualification into a criticism of practice, and it does so without a separate sentence. The response ends on a judgement about the policy rather than on a summary of the evidence.\u003c/p>","F3":"\u003cp>1.  \"Obviously true because everybody knows\" is precisely the reasoning the discussion was questioning, and Nadia’s trial evidence — the only thing that answers Lucas — is never mentioned.\u003c/p>\u003cp>2.  The rebuttal of Lucas is an anecdotal claim (\"many people start when they are already in difficulty\") offered against a statistical objection it cannot touch.\u003c/p>\u003cp>3.  \"Instead of giving antidepressants to everybody\" is a policy conclusion about a different treatment that nothing in the response supports. Language: \"elderly people\", \"a sense of belonging to a group\", \"these activities\" — and \"very important for wellbeing\" is filler.\u003c/p>"},"model":["Nadia has the better of this because she has the evidence that addresses Lucas’s objection rather than merely acknowledging it. Randomised allocation removes the self-selection he identifies, and a surviving effect, however reduced, is evidence of causation in a way that no amount of observational data could be. The shrinkage is itself informative: it is roughly what you would expect if selection accounted for most but not all of the association.","Where I would be more cautious than either is about what is being prescribed. The trials allocate people to an activity; prescription allocates them to an activity they have been told is good for them by a clinician, which is a different intervention and may be a worse one. Something that works because it is chosen tends not to survive becoming an instruction — and the mechanism everyone proposes, that these activities supply relationships, is precisely the kind of thing that depends on wanting to be there. So I would accept the causal claim and treat the delivery question as unsettled, which is roughly where the evidence actually is and considerably less than the policy assumes."],"model_html":"\u003cp>Nadia has the better of this because she has the evidence that addresses Lucas’s objection rather than merely acknowledging it. Randomised allocation removes the self-selection he identifies, and a surviving effect, however reduced, is evidence of causation in a way that no amount of observational data could be. The shrinkage is itself informative: it is roughly what you would expect if selection accounted for most but not all of the association.\u003c/p>\u003cp>Where I would be more cautious than either is about what is being prescribed. The trials allocate people to an activity; prescription allocates them to an activity they have been told is good for them by a clinician, which is a different intervention and may be a worse one. Something that works because it is chosen tends not to survive becoming an instruction — and the mechanism everyone proposes, that these activities supply relationships, is precisely the kind of thing that depends on wanting to be there. So I would accept the causal claim and treat the delivery question as unsettled, which is roughly where the evidence actually is and considerably less than the policy assumes.\u003c/p>","model_band":5,"degraded":["I think this is obviously true because everybody knows that social contact is good for mental health, especially for elderly people who are often isolated and lonely. Singing in a choir or playing sport also gives physical exercise and a sense of belonging to a group, which are both very important for wellbeing. Lucas says that healthy people join these activities but I think this is only partly true because many people start when they are already in difficulty and they improve a lot. Doctors should definitely prescribe these activities instead of giving antidepressants to everybody."],"degraded_html":"\u003cp>I think this is obviously true because everybody knows that social contact is good for mental health, especially for elderly people who are often isolated and lonely. Singing in a choir or playing sport also gives physical exercise and a sense of belonging to a group, which are both very important for wellbeing. Lucas says that healthy people join these activities but I think this is only partly true because many people start when they are already in difficulty and they improve a lot. Doctors should definitely prescribe these activities instead of giving antidepressants to everybody.\u003c/p>","degraded_band":3,"model_words":187,"fault_list":{"tag":"F3","faults":["\"Obviously true because everybody knows\" is precisely the reasoning the discussion was questioning, and Nadia’s trial evidence — the only thing that answers Lucas — is never mentioned.","The rebuttal of Lucas is an anecdotal claim (\"many people start when they are already in difficulty\") offered against a statistical objection it cannot touch.","\"Instead of giving antidepressants to everybody\" is a policy conclusion about a different treatment that nothing in the response supports. Language: \"elderly people\", \"a sense of belonging to a group\", \"these activities\" — and \"very important for wellbeing\" is filler."],"html":["\u003cp>1.  \"Obviously true because everybody knows\" is precisely the reasoning the discussion was questioning, and Nadia’s trial evidence — the only thing that answers Lucas — is never mentioned.\u003c/p>","\u003cp>2.  The rebuttal of Lucas is an anecdotal claim (\"many people start when they are already in difficulty\") offered against a statistical objection it cannot touch.\u003c/p>","\u003cp>3.  \"Instead of giving antidepressants to everybody\" is a policy conclusion about a different treatment that nothing in the response supports. Language: \"elderly people\", \"a sense of belonging to a group\", \"these activities\" — and \"very important for wellbeing\" is filler.\u003c/p>"]},"prof_name":"Dr Almeida","professor":"\u003cp>Studies regularly report that people who take part in community activities — choirs, sports clubs, volunteering — are healthier and happier. It is often concluded that such activity should be prescribed. How convincing is the inference?\u003c/p>","students":[["Lucas","Not very. Healthier and more sociable people join choirs. The arrow almost certainly runs the other way, or both ways, and prescribing membership to someone who is unwell and isolated is not the same experiment."],["Nadia","The self-selection point is right but it is not the whole story. There are trials where people were allocated to activity rather than choosing it, and the effects are smaller but they are there. The question is whether smaller is still worth doing."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"“Instead of giving antidepressants to everybody” is a policy conclusion about a different treatment that nothing in the response supports. Language: “elderly people”, “a sense of belonging to a group”, “these activities” — and “very important for wellbeing” is filler.","correct":true},{"text":"It opens on the committee’s failure — “still not had any response, even though the committee has met twice” — which is read by a volunteer who was probably not present.","correct":false},{"text":"Nothing is offered in return and the swap is presented as neutral, so the second bullet fails — and “I am sure you understand” presumes the agreement.","correct":false},{"text":"The rebuttal of Lucas is an anecdotal claim (“many people start when they are already in difficulty”) offered against a statistical objection it cannot touch.","correct":true},{"text":"“Obviously true because everybody knows” is precisely the reasoning the discussion was questioning, and Nadia’s trial evidence — the only thing that answers Lucas — is never mentioned.","correct":true},{"text":"It opens by establishing the reader’s failure. “I sent you three weeks ago and I still have not received your confirmation” is an accusation in the first sentence.","correct":false}],"key_html":"F3"}};</script>
