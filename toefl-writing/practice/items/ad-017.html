<script>window.ITEM={"kind":"exercise","id":"AD 017","slug":"ad-017","task":"ad","task_label":"Academic Discussion","task_full":"Write For An Academic Discussion","time":"10 minutes","function":"Urban planning and transport · agree or disagree with a claim","payload":{"Strategy":"check whether a measured effect is the effect being claimed","Grammar":"hedged generalisation with tend to","Vocabulary":"modal share, induced demand, severance, density","Convention":"disagreeing with an intuitive claim using its own evidence"},"preview":[{"tag":"P1","title":"Find the axis of disagreement","html":"\u003cp>a.  Are Ruth and Sami talking about the same geographic scale?\u003c/p>\u003cp>b.  Can both of their empirical claims be true at once?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What is modal share, and what is severance?\u003c/p>\u003cp>b.  What does \"selection\" mean in Ruth’s last sentence?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Reconcile the two scales in one sentence and say what follows for policy.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The response says the dispute \"survives only because\" of something. What?\u003c/p>\u003cp>b.  The last sentence criticises a position close to Ruth’s. On what grounds?\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"the evidence tends to find exactly that pattern\" — what is \"tends to\" doing for a writer who cannot cite the studies?\u003c/p>\u003cp>b.  \"and deserves to\" — three words at the end of a sentence. What is their effect?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the response below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No. Ruth is describing a metropolitan market, Sami a few streets. Nearly all the heat in this argument comes from that slippage.\u003c/p>\u003cp>b.  Yes, and they usually are. There is no contradiction in new supply lowering the average while raising it locally, because they are different averages over different areas.\u003c/p>","P2":"\u003cp>a.  Modal share is the proportion of journeys by each mode. Severance is the division of a neighbourhood by infrastructure.\u003c/p>\u003cp>b.  Selection bias — the sample is not random. Developers choose sites where rents are already climbing, so a correlation between building and rising rents may show where they built rather than what building did.\u003c/p>","P3":"\u003cp>Model: \"New supply tends to lower rents across a city and raise them next door, which makes this a distributive question rather than a disagreement about whether to build.\"\u003c/p>","F1":"\u003cp>a.  That both quantities are reported under the same phrase, \"the effect on rents\". Once they are named separately there is no disagreement left about the facts.\u003c/p>\u003cp>b.  That it answers a distributive objection with an aggregate figure. The people bearing the local cost are not the people receiving the city-wide benefit, and telling them the total is positive is not a response to their objection.\u003c/p>","F2":"\u003cp>a.  It claims a tendency in the literature rather than a specific finding, which is honest about the writer’s position and cannot be refuted by one contrary study. Claiming more than you can source is the fastest way to lose a reader who knows the field.\u003c/p>\u003cp>b.  They convert a description into a judgement, briefly, after the analysis has earned it. The brevity is what makes it land — a longer version would read as editorialising, where three words read as a conclusion.\u003c/p>","F3":"\u003cp>1.  It dismisses Sami by relabelling his point (\"gentrification ... a different problem\") rather than engaging it, and never addresses who bears the local cost.\u003c/p>\u003cp>2.  \"Basic economics\" and \"the law of supply and demand\" are invoked as though they settle an empirical question about magnitudes and distribution, which they do not.\u003c/p>\u003cp>3.  Language: a comma splice in the first sentence, \"the governments\", \"the construction companies\", \"the housing crisis will be solved\" — an unhedged absolute of exactly the kind this topic punishes.\u003c/p>"},"model":["Both claims can be true, and I think they are. Ruth is describing a city-wide effect and Sami a local one, and the evidence tends to find exactly that pattern: new supply lowers rents across a metropolitan area while raising them within a few hundred metres of the new building. They are not competing accounts of one quantity; they are two quantities, and the dispute survives only because both are reported as \"the effect on rents\".","What follows is not that the local effect is a price worth paying, which is how this argument usually ends. The city-wide gain accrues to everyone, including future arrivals who do not yet live there, while the local loss falls on identifiable people who do. That is a distributive problem, and it has distributive answers — a share of the uplift captured for the neighbourhood, or rights of return for displaced tenants. Build and compensate is a coherent position; build and tell people the aggregate is positive is the one that keeps losing planning fights, and deserves to."],"model_html":"\u003cp>Both claims can be true, and I think they are. Ruth is describing a city-wide effect and Sami a local one, and the evidence tends to find exactly that pattern: new supply lowers rents across a metropolitan area while raising them within a few hundred metres of the new building. They are not competing accounts of one quantity; they are two quantities, and the dispute survives only because both are reported as \"the effect on rents\".\u003c/p>\u003cp>What follows is not that the local effect is a price worth paying, which is how this argument usually ends. The city-wide gain accrues to everyone, including future arrivals who do not yet live there, while the local loss falls on identifiable people who do. That is a distributive problem, and it has distributive answers — a share of the uplift captured for the neighbourhood, or rights of return for displaced tenants. Build and compensate is a coherent position; build and tell people the aggregate is positive is the one that keeps losing planning fights, and deserves to.\u003c/p>","model_band":5,"degraded":["I agree with Ruth because this is basic economics, if the supply increases then the price goes down, it is the law of supply and demand which works in every market. Sami is talking about gentrification which is a different problem, and anyway if we do not build new houses the situation will become even worse for everybody because the population is growing. The governments should remove the bureaucratic obstacles and allow the construction companies to build more and faster, then the housing crisis will be solved."],"degraded_html":"\u003cp>I agree with Ruth because this is basic economics, if the supply increases then the price goes down, it is the law of supply and demand which works in every market. Sami is talking about gentrification which is a different problem, and anyway if we do not build new houses the situation will become even worse for everybody because the population is growing. The governments should remove the bureaucratic obstacles and allow the construction companies to build more and faster, then the housing crisis will be solved.\u003c/p>","degraded_band":3,"model_words":175,"fault_list":{"tag":"F3","faults":["It dismisses Sami by relabelling his point (\"gentrification ... a different problem\") rather than engaging it, and never addresses who bears the local cost.","\"Basic economics\" and \"the law of supply and demand\" are invoked as though they settle an empirical question about magnitudes and distribution, which they do not.","Language: a comma splice in the first sentence, \"the governments\", \"the construction companies\", \"the housing crisis will be solved\" — an unhedged absolute of exactly the kind this topic punishes."],"html":["\u003cp>1.  It dismisses Sami by relabelling his point (\"gentrification ... a different problem\") rather than engaging it, and never addresses who bears the local cost.\u003c/p>","\u003cp>2.  \"Basic economics\" and \"the law of supply and demand\" are invoked as though they settle an empirical question about magnitudes and distribution, which they do not.\u003c/p>","\u003cp>3.  Language: a comma splice in the first sentence, \"the governments\", \"the construction companies\", \"the housing crisis will be solved\" — an unhedged absolute of exactly the kind this topic punishes.\u003c/p>"]},"prof_name":"Professor Lindqvist","professor":"\u003cp>It is often said that building more housing in a city lowers rents. Opponents point to new developments where rents rose in the surrounding streets. How convincing is the claim that building more housing makes a city more affordable?\u003c/p>","students":[["Ruth","It is close to arithmetic. If more people want to live somewhere than there are homes, prices rise; add homes and you relieve the pressure. The local examples are selection: developers build where rents are already rising."],["Sami","The local evidence is not so easily dismissed. New blocks change a neighbourhood’s character and reputation, and that raises what people will pay nearby. Whatever happens city-wide, the people displaced are real."]],"instructions":["Express and support your opinion.","Make a contribution to the discussion in your own words.","An effective response will contain at least 100 words."],"min_words":100,"max_words":220,"seconds":600,"faultset":{"options":[{"text":"Language: a comma splice in the first sentence, “the governments”, “the construction companies”, “the housing crisis will be solved” — an unhedged absolute of exactly the kind this topic punishes.","correct":true},{"text":"No diagnosis, so no proposal follows. The cause offered is “some people never clean anything” — a complaint about individuals, which supports no scheme. The first bullet asked for the cause, and this does not supply one that leads anywhere.","correct":false},{"text":"No alternatives are offered. “Could we perhaps find another time” hands the scheduling back to the busier person, so the third bullet fails.","correct":false},{"text":"It dismisses Sami by relabelling his point (“gentrification ... a different problem”) rather than engaging it, and never addresses who bears the local cost.","correct":true},{"text":"“Basic economics” and “the law of supply and demand” are invoked as though they settle an empirical question about magnitudes and distribution, which they do not.","correct":true},{"text":"It leaves no way to proceed gracefully. “Do not throw away 2400 pounds” makes going ahead an act of stupidity, which tends to produce defensiveness rather than reconsideration. The third bullet fails.","correct":false}],"key_html":"F3"}};</script>
