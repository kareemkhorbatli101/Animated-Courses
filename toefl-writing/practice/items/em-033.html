<script>window.ITEM={"kind":"exercise","id":"EM 033","slug":"em-033","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Decline and counter-offer","payload":{"Strategy":"decline an invitation by protecting the host’s planning","Grammar":"although-concession first","Vocabulary":"RSVP, numbers, caterers, on the night","Convention":"declining a social invitation that has costs attached"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  What makes this different from declining before you accepted?\u003c/p>\u003cp>b.  What is the organiser’s actual problem, and is it you?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  What do organisers mean by \"numbers\", and why is Monday significant?\u003c/p>\u003cp>b.  What does it mean to RSVP, and what does a late change cost?\u003c/p>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>Withdraw in one sentence that puts the organiser’s deadline before your reason.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  The writer declines a refund. What is that buying?\u003c/p>\u003cp>b.  Find the offer that removes work from the organiser rather than adding it.\u003c/p>"},{"tag":"F2","title":"Harvest the language","html":"\u003cp>a.  \"Although I had it in the diary from the start\" — why concede this, when it helps the writer’s case not at all?\u003c/p>\u003cp>b.  \"I am going to have to drop out\" — why this heavy construction rather than \"I cannot come\"?\u003c/p>"},{"tag":"F3","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  You have already caused a commitment to be made on your behalf — a seat, a meal, a cost. Declining before accepting costs nothing; withdrawing after costs the organiser money and work, and the email has to deal with both.\u003c/p>\u003cp>b.  Her problem is the catering number and the empty seat, not your absence. An email that only apologises for the absence has addressed the smaller half.\u003c/p>","P2":"\u003cp>a.  The confirmed headcount given to the caterer, after which the department pays per head whether or not people attend. Monday is the point at which your withdrawal starts costing real money.\u003c/p>\u003cp>b.  To reply to an invitation either way. A late change typically costs the full per-head price, which is why the timing of your email matters more than its wording.\u003c/p>","P3":"\u003cp>Model: \"I am going to have to drop out of the dinner on the 7th, and I wanted to tell you before the numbers go on Monday.\"\u003c/p>\u003cp>Mentioning her deadline in the same sentence shows you understand what your withdrawal actually costs.\u003c/p>","F1":"\u003cp>a.  It removes the organiser’s financial problem entirely, and it makes the apology credible: somebody willing to be out of pocket is plainly not treating the commitment lightly.\u003c/p>\u003cp>b.  \"I can message the year group to see if anyone wants it, so you do not have to.\" Filling the seat is the remaining task, and the writer takes it on rather than handing it back.\u003c/p>","F2":"\u003cp>a.  Because it is true and the reader may well know it. Conceding the unhelpful fact first removes the suspicion that you are managing her, and it buys credibility for the reason that follows. A concession that costs you something is the only kind worth making.\u003c/p>\u003cp>b.  Because \"I cannot come\" states a fact about the world, while \"I am going to have to drop out\" acknowledges that a commitment existed and that you are breaking it. The heavier construction carries the obligation you are failing.\u003c/p>","F3":"\u003cp>1.  \"Something has come up\" conceals the reason entirely, which after an acceptance reads as evasive — the second bullet is addressed only formally.\u003c/p>\u003cp>2.  It asks for a refund, which converts the writer’s problem into the organiser’s financial one at the worst possible moment. The third bullet is inverted: the cost is pushed onto the reader rather than absorbed.\u003c/p>\u003cp>3.  The deadline is never mentioned, so the organiser cannot tell whether the email is in time to matter, and \"sorry for any inconvenience caused\" is the formula of a utility company rather than a colleague.\u003c/p>"},"model":["Dear Lucia,","I am very sorry — I am going to have to drop out of the dinner on the 7th, and I wanted to tell you before the numbers go on Monday.","Although I had it in the diary from the start, my sister has moved her wedding reception to that evening and I cannot be in two places. I know that is not much of an excuse three weeks in.","I have paid for the ticket and I am not asking for it back — if the caterers are already costed, please just leave it with the department. If there is a waiting list I am happy for the place to go to whoever is next on it, and I can message the year group to see if anyone wants it, so you do not have to.","Sorry again, and I hope it goes well.","Best wishes,","Tariq Aziz"],"model_html":"\u003cp>Dear Lucia,\u003c/p>\u003cp>I am very sorry — I am going to have to drop out of the dinner on the 7th, and I wanted to tell you before the numbers go on Monday.\u003c/p>\u003cp>Although I had it in the diary from the start, my sister has moved her wedding reception to that evening and I cannot be in two places. I know that is not much of an excuse three weeks in.\u003c/p>\u003cp>I have paid for the ticket and I am not asking for it back — if the caterers are already costed, please just leave it with the department. If there is a waiting list I am happy for the place to go to whoever is next on it, and I can message the year group to see if anyone wants it, so you do not have to.\u003c/p>\u003cp>Sorry again, and I hope it goes well.\u003c/p>\u003cp>Best wishes,\u003c/p>\u003cp>Tariq Aziz\u003c/p>","model_band":5,"degraded":["Hi Lucia, I am really sorry but something has come up and I will not be able to attend the dinner on the 7th. It is a family matter which I cannot avoid. Could you please refund my ticket as I have already paid for it? Sorry for any inconvenience caused.","Tariq"],"degraded_html":"\u003cp>Hi Lucia, I am really sorry but something has come up and I will not be able to attend the dinner on the 7th. It is a family matter which I cannot avoid. Could you please refund my ticket as I have already paid for it? Sorry for any inconvenience caused.\u003c/p>\u003cp>Tariq\u003c/p>","degraded_band":3,"model_words":149,"fault_list":{"tag":"F3","faults":["\"Something has come up\" conceals the reason entirely, which after an acceptance reads as evasive — the second bullet is addressed only formally.","It asks for a refund, which converts the writer’s problem into the organiser’s financial one at the worst possible moment. The third bullet is inverted: the cost is pushed onto the reader rather than absorbed.","The deadline is never mentioned, so the organiser cannot tell whether the email is in time to matter, and \"sorry for any inconvenience caused\" is the formula of a utility company rather than a colleague."],"html":["\u003cp>1.  \"Something has come up\" conceals the reason entirely, which after an acceptance reads as evasive — the second bullet is addressed only formally.\u003c/p>","\u003cp>2.  It asks for a refund, which converts the writer’s problem into the organiser’s financial one at the worst possible moment. The third bullet is inverted: the cost is pushed onto the reader rather than absorbed.\u003c/p>","\u003cp>3.  The deadline is never mentioned, so the organiser cannot tell whether the email is in time to matter, and \"sorry for any inconvenience caused\" is the formula of a utility company rather than a colleague.\u003c/p>"]},"scenario":"\u003cp>You accepted an invitation to a departmental dinner three weeks ago. You now have a family event the same evening. The dinner is ticketed and the numbers go to the caterers on Monday.\u003c/p>","bullets":["Withdraw.","Apologise appropriately to the scale of the problem.","Protect the organiser from the cost."],"header":[["To:","socialsec.chem@northgate.ac.uk"],["Subject:","Departmental dinner, 7 June — I am afraid I can no longer come"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"“Governments waste money on many less important things” does not answer Grace’s argument, which is about the best use of a fixed sum within this policy.","correct":false},{"text":"The deadline is never mentioned, so the organiser cannot tell whether the email is in time to matter, and “sorry for any inconvenience caused” is the formula of a utility company rather than a colleague.","correct":true},{"text":"“Something has come up” conceals the reason entirely, which after an acceptance reads as evasive — the second bullet is addressed only formally.","correct":true},{"text":"It asks for a refund, which converts the writer’s problem into the organiser’s financial one at the worst possible moment. The third bullet is inverted: the cost is pushed onto the reader rather than absorbed.","correct":true},{"text":"“People who refuse science” characterises the opposition rather than engaging with the prediction about backlash, and “this is not something we should negotiate about” declines the comparison the prompt asks for.","correct":false},{"text":"Language: “the universities”, “the stigma”, “the admission decision” over-articled; “suffer in silence” and “feel safe to be honest” are stock phrases rather than analysis.","correct":false}],"key_html":"F3"}};</script>
