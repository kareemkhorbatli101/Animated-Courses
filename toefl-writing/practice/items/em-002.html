<script>window.ITEM={"kind":"exercise","id":"EM 002","slug":"em-002","task":"em","task_label":"Write an Email","task_full":"Write An Email","time":"7 minutes","function":"Request and ask for help","payload":{"Strategy":"ask for the exception, not for sympathy","Grammar":"I was wondering whether — the reported thought as a request","Vocabulary":"library and loans: recall, renew, waive, overdue, hold","Convention":"addressing an office rather than a person"},"preview":[{"tag":"P1","title":"Decode the task","html":"\u003cp>a.  You are writing to an office, not a named person. What changes?\u003c/p>\u003cp>b.  You want two different things. Which should come first, and why might asking for both at once weaken each?\u003c/p>\u003cp>c.  The third bullet asks you to solve somebody else’s problem. Why is that in your interest?\u003c/p>"},{"tag":"P2","title":"Prime the vocabulary","html":"\u003cp>a.  Match the verb to the noun: ______ a fine · ______ a loan · ______ a hold · ______ a book\u003c/p>\u003cpre class=\"mono\">waive · renew · place · recall\u003c/pre>\u003cp>b.  Which is the library’s word and which is yours: \u003c/p>\u003cpre class=\"mono\">overdue · late · outstanding · unreturned\u003c/pre>"},{"tag":"P3","title":"Write it before you read it","html":"\u003cp>One sentence, under 25 words, asking for both the delay and the waiver without sounding like a list of demands.\u003c/p>"},{"tag":"P4","title":"Commit to a plan","html":"\u003cp>Seven minutes. Decide first whether you will mention the fine at all before the recall is settled.\u003c/p>"}],"followup":[{"tag":"F1","title":"Take the answer apart","html":"\u003cp>a.  Which paragraph does the real work, and why is it third?\u003c/p>\u003cp>b.  The writer asks for two things. Find the word that keeps them from reading as a double demand.\u003c/p>"},{"tag":"F2","title":"Harvest the grammar","html":"\u003cp>a.  “If that is not possible, I would be glad to know whether …” Why is the second request wrapped inside a conditional?\u003c/p>\u003cp>b.  “the notice reached me after the first of them had been added” — why the past perfect, and what would be lost with a simple past?\u003c/p>\u003cp>c.  “it may solve the problem for both of us”. Replace \u003cem>may\u003c/em> with \u003cem>will\u003c/em>. What have you just claimed that you cannot support?\u003c/p>"},{"tag":"F3","title":"Harvest the vocabulary","html":"\u003cp>a.  Why \u003cem>reconsidered\u003c/em> rather than \u003cem>cancelled\u003c/em> or \u003cem>removed\u003c/em> for the fine?\u003c/p>\u003cp>b.  \u003cem>I should add that …\u003c/em> — what work does this phrase do that \u003cem>Also,\u003c/em> would not?\u003c/p>"},{"tag":"F4","title":"Why this is a 5 and that is a 3","html":"\u003cp>Name the three things that hold the version below at band 3.\u003c/p>"},{"tag":"F5","title":"Now you do it","html":"\u003cp>A piece of equipment you borrowed is due back tomorrow but you need it for one more day. In 45 words, ask for the extension and offer something that reduces the inconvenience to the next borrower.\u003c/p>"}],"keys":{"P1":"\u003cp>a.  No name to use, so the greeting goes to the function (\u003cem>Dear Library Loans Team\u003c/em>). It also means the reader has no personal stake in your problem and is probably applying a rule — so give them the grounds for an exception rather than an appeal to feeling.\u003c/p>\u003cp>b.  The recall first: it is the larger problem and the one with a deadline. Asked together, the fine looks like the real motive and the dissertation like a pretext.\u003c/p>\u003cp>c.  Because the office’s problem is not you, it is the reader waiting. Solve that and your request stops competing with their job and starts helping it.\u003c/p>","P2":"\u003cp>a.  \u003cstrong>waive\u003c/strong> a fine · \u003cstrong>renew\u003c/strong> a loan · \u003cstrong>place\u003c/strong> a hold · \u003cstrong>recall\u003c/strong> a book.\u003c/p>\u003cp>b.  \u003cstrong>Overdue\u003c/strong> and \u003cstrong>outstanding\u003c/strong> are the institution’s words and appear on the notice; \u003cem>late\u003c/em> and \u003cem>unreturned\u003c/em> are ordinary description. Using the institution’s own vocabulary back at it is a small, reliable way to sound like someone who knows how the system works.\u003c/p>","P3":"\u003cp>Model: \u003cem>I was wondering whether the return could be held until Friday, and if not, whether the charges might be looked at again.\u003c/em>\u003c/p>\u003cp>The second \u003cem>whether\u003c/em> is what keeps it from being a list: it subordinates the fine to the failure of the first request.\u003c/p>","P4":"\u003cp>Mention it, but second and conditionally. A fine raised first reads as the complaint it is; raised as a fallback it reads as housekeeping.\u003c/p>","F1":"\u003cp>a.  The third — the second copy at the Science site. It is the only paragraph that gives the office a way to say yes without cost. It comes third because it would look manipulative first, before the reader knows what you want.\u003c/p>\u003cp>b.  \u003cstrong>If that is not possible\u003c/strong>. It makes the second request conditional on the first failing, so at no point is the reader being asked for two things at once.\u003c/p>","F2":"\u003cp>a.  Because asking for a fine to be waived is asking the office to admit its system misfired. The conditional makes it a contingency rather than an accusation, and keeps the first request clean.\u003c/p>\u003cp>b.  The charge was added \u003cem>before\u003c/em> the notice arrived, and the past perfect is what encodes that order. A simple past (\u003cem>after the first of them was added\u003c/em>) still works but loses the emphasis on sequence — and sequence is the entire argument for waiving the fine.\u003c/p>\u003cp>c.  That it definitely will. You do not know the other reader’s situation, whether the Science copy is reference-only, or whether it is still on the shelf. \u003cem>May\u003c/em> claims exactly as much as you can support, which is why it is the stronger word here.\u003c/p>","F3":"\u003cp>a.  \u003cem>Reconsidered\u003c/em> asks for a decision to be made again; the other two name the outcome you want. Asking for the process rather than the result leaves the office its authority, and offices guard that closely.\u003c/p>\u003cp>b.  It marks what follows as additional and slightly tangential, which lowers the pressure on it. It is the written equivalent of mentioning something on the way out of the room — and it is exactly right for a suggestion you want considered but cannot insist on.\u003c/p>","F4":"\u003cp>1.  \u003cstrong>Tone.\u003c/strong> “this is not fair”, “Please cancel the fines and let me keep the book”, “Waiting for your reply”. The email accuses, instructs, and then chases, all in six lines. Band 5 asks for consistent social conventions; this is consistently the wrong ones.\u003c/p>\u003cp>2.  \u003cstrong>The third bullet is thrown away.\u003c/strong> The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.\u003c/p>\u003cp>3.  \u003cstrong>Language.\u003c/strong> “I got your email” (received), “I need this book very much”, “in Science library” (the Science library), “Waiting for your reply” (a sentence with no subject). The errors are not dense, but the register is wrong throughout, and register is scored.\u003c/p>","F5":"\u003cp>Model: \u003cem>I am due to return the spectrometer tomorrow, but a run failed overnight and I need one more day to repeat it. Would it be possible to keep it until Thursday morning? I can drop it at the technicians’ office before nine so the next booking is not affected.\u003c/em>\u003c/p>\u003cp>The offer is the part most people leave out, and it is the part that gets the answer you want.\u003c/p>"},"model":["Dear Library Loans Team,","I have received a recall notice for Patterson, Urban Form (HT166 PAT), which I currently have on loan. I am submitting a dissertation on Friday and the book is the main source for two of my chapters, so returning it this week would leave me without it at the point where I most need it.","I was wondering whether the return date could be held until Friday afternoon. If that is not possible, I would be glad to know whether the two days of recall charges might be reconsidered, given that the notice reached me after the first of them had been added.","I should add that the library holds a second copy at the Science site, which was on the shelf yesterday. If that one could be offered to the reader waiting, it may solve the problem for both of us.","Thank you for looking into this.","Yours sincerely,","Tomas Lindgren"],"model_html":"\u003cp>Dear Library Loans Team,\u003c/p>\u003cp>I have received a recall notice for Patterson, Urban Form (HT166 PAT), which I currently have on loan. I am submitting a dissertation on Friday and the book is the main source for two of my chapters, so returning it this week would leave me without it at the point where I most need it.\u003c/p>\u003cp>I was wondering whether the return date could be held until Friday afternoon. If that is not possible, I would be glad to know whether the two days of recall charges might be reconsidered, given that the notice reached me after the first of them had been added.\u003c/p>\u003cp>I should add that the library holds a second copy at the Science site, which was on the shelf yesterday. If that one could be offered to the reader waiting, it may solve the problem for both of us.\u003c/p>\u003cp>Thank you for looking into this.\u003c/p>\u003cp>Yours sincerely,\u003c/p>\u003cp>Tomas Lindgren\u003c/p>","model_band":5,"degraded":["Dear Sir or Madam,","I got your email about the recall of the book Urban Form. This is very bad timing for me because I am writing my dissertation and I need this book very much. Also you charged me two fines but I didn’t even see the notice before, so this is not fair. Please cancel the fines and let me keep the book until Friday. There is another copy in Science library anyway so the other person can take it.","Waiting for your reply. Thanks."],"degraded_html":"\u003cp>Dear Sir or Madam,\u003c/p>\u003cp>I got your email about the recall of the book Urban Form. This is very bad timing for me because I am writing my dissertation and I need this book very much. Also you charged me two fines but I didn’t even see the notice before, so this is not fair. Please cancel the fines and let me keep the book until Friday. There is another copy in Science library anyway so the other person can take it.\u003c/p>\u003cp>Waiting for your reply. Thanks.\u003c/p>","degraded_band":3,"model_words":156,"fault_list":{"tag":"F4","faults":["Tone. “this is not fair”, “Please cancel the fines and let me keep the book”, “Waiting for your reply”. The email accuses, instructs, and then chases, all in six lines. Band 5 asks for consistent social conventions; this is consistently the wrong ones.","The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","Language. “I got your email” (received), “I need this book very much”, “in Science library” (the Science library), “Waiting for your reply” (a sentence with no subject). The errors are not dense, but the register is wrong throughout, and register is scored."],"html":["\u003cp>1.  \u003cstrong>Tone.\u003c/strong> “this is not fair”, “Please cancel the fines and let me keep the book”, “Waiting for your reply”. The email accuses, instructs, and then chases, all in six lines. Band 5 asks for consistent social conventions; this is consistently the wrong ones.\u003c/p>","\u003cp>2.  \u003cstrong>The third bullet is thrown away.\u003c/strong> The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.\u003c/p>","\u003cp>3.  \u003cstrong>Language.\u003c/strong> “I got your email” (received), “I need this book very much”, “in Science library” (the Science library), “Waiting for your reply” (a sentence with no subject). The errors are not dense, but the register is wrong throughout, and register is scored.\u003c/p>"]},"scenario":"\u003cp>A book you have on loan has been recalled because another reader has placed a hold on it. You are three days from submitting a dissertation that depends on it, and you have already been charged two days of recall fines.\u003c/p>","bullets":["Explain your situation.","Ask whether the recall can be delayed or the fine waived.","Offer something that would resolve the other reader’s problem."],"header":[["To:","loans@northgate.ac.uk"],["Subject:","Recall on Patterson, Urban Form (shelfmark HT166)"]],"min_words":90,"max_words":230,"seconds":420,"faultset":{"options":[{"text":"Tone. “this is not fair”, “Please cancel the fines and let me keep the book”, “Waiting for your reply”. The email accuses, instructs, and then chases, all in six lines. Band 5 asks for consistent social conventions; this is consistently the wrong ones.","correct":true},{"text":"Language. “I got your email” (received), “I need this book very much”, “in Science library” (the Science library), “Waiting for your reply” (a sentence with no subject). The errors are not dense, but the register is wrong throughout, and register is scored.","correct":true},{"text":"“It does not even solve the problem” contradicts Elif’s evidence by assertion, and the claim that rich drivers simply pay is inconsistent with traffic falling within a year.","correct":false},{"text":"“Young people are very connected through social media” is offered as a replacement without any claim that it performs the same function, which is precisely what is in dispute.","correct":false},{"text":"The third bullet is thrown away. The second copy appears as “anyway” — an argument for why the other reader should not have bothered you, rather than an offer. The same fact, used generously, was the strongest card in the email.","correct":true},{"text":"“Too lazy or too busy” is a judgement about the people the policy affects, offered as though it were an argument for the policy.","correct":false}],"key_html":"F4"}};</script>
