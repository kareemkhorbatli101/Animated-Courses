ation and the arts require sufficient investment because they complement each other and contribute to a well-rounded society.", "In conclusion, while allocating more funds to education is necessary, it should not come at the expense of the arts. A balanced budget that supports both sectors is the best approach."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Addresses all parts of the question with clear opinion.", "Presents a balanced view with reasons and examples."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical organization and paragraphing.", "Uses cohesive devices effectively but could use more variety."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Appropriate vocabulary like foundation, innovation, cultural identity, vibrant sector.", "Some repetition; vocabulary is generally accurate."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5", "lines": ["Mix of complex and simple sentence structures.", "Minor errors or awkward expressions but does not affect clarity."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Limited government budget allocation.", "Thesis: partly disagree with cutting arts budget; both arts and education important."]}, {"label": "Importance of education", "topic": "", "subs": ["Education improves literacy, skills, economic growth.", "Example of countries with good education systems."]}, {"label": "Importance of arts funding", "topic": "", "subs": ["Arts contribute to culture and personal development.", "Enhances creativity and critical thinking.", "Supports tourism and jobs."]}, {"label": "Need for balance", "topic": "", "subs": ["Both sectors complement each other.", "Governments should fund both sufficiently."]}, {"label": "Conclusion", "topic": "", "subs": ["Education funding should increase but not by reducing arts budget drastically.", "Balanced budget is best."]}], "items": {"setA": [{"word": "literacy", "sentence": "Mo
