ne carries the cost while its neighbours keep the benefit. The lesson is that international action needs teeth, not merely goodwill, and the teeth have to be agreed nationally and written into law.", "In conclusion, while national actions are important, environmental issues require international cooperation to ensure a unified and effective response. Only through collaboration can the global community protect the planet for future generations."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the prompt with a clear opinion.", "Presents well-supported ideas on the necessity of international cooperation alongside national efforts."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Clear organization with logical progression.", "Uses linking words like firstly, similarly, on the other hand, in conclusion appropriately."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Good vocabulary: greenhouse gas emissions, biodiversity, coordinated action, enforcement.", "Some repetition but overall sufficient lexical variety."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex and simple sentences.", "Minor grammatical errors but meaning is clear."]}], "thesis": "International cooperation is essential to address environmental issues effectively, though national efforts remain important.", "thesis_kind": "position", "outline": [{"label": "Importance of International Cooperation", "topic": "", "subs": ["Environmental problems are global and cross borders", "International agreements provide coordinated solutions", "Shared responsibilities and targets"]}, {"label": "Role of National Governments", "topic": "", "subs": ["Implement and enforce policies domestically", "Tailor strategies to national contexts", "Ensure international agreements are effective"]}, {"label": "Conclusion", "topic": "", "subs": ["Both international collaboration and national actions are necessary to protect the environme
