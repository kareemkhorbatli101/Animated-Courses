, or compensation for livestock lost to predators turns the people nearest the forest into its guards, while a reserve policed against the villagers around it tends to fail as soon as the patrols stop.", "In conclusion, animal protection is vital for environmental and economic reasons. By strengthening laws, raising awareness, and establishing protected zones, we can reduce the risks posed by deforestation and hunting and help preserve endangered species for future generations."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both parts of the task with a clear opinion and practical solutions.", "Arguments are relevant and supported by examples."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Well-organized essay with logical progression.", "Uses cohesive devices like firstly, furthermore, additionally, in conclusion effectively."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Appropriate topic vocabulary: endangered species, poaching, biodiversity, ecological balance.", "Some repetition of common words but overall good lexical control."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex and simple sentences with good accuracy.", "Minor slips, but meaning remains clear throughout."]}], "thesis": "Animal protection is important for ecological balance and economic reasons; solutions include laws, education, and protected areas.", "thesis_kind": "roadmap", "outline": [{"label": "Importance of Protecting Animals", "topic": "", "subs": ["Maintain ecological balance", "Economic and cultural value (wildlife tourism, traditions)"]}, {"label": "Solutions to Threats", "topic": "", "subs": ["Stricter enforcement and penalties against deforestation and hunting", "Education and community involvement", "Establish protected zones like national parks"]}, {"label": "Conclusion", "topic": "", "subs": ["Stronger laws, awareness, and conservation efforts are needed to protect endangered
