reatens every country and requires international cooperation. If global warming is not controlled, it could lead to long-term damage to the planet’s climate and ecosystems.", "In conclusion, both global warming and deforestation are major environmental challenges. However, global warming has a wider and more dangerous impact, making it the most critical issue we face today."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both views and presents a clear opinion.", "Ideas are well supported with examples and explanation."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear structure: introduction, two sides, opinion, conclusion.", "Uses linking devices effectively (on the one hand, in addition, however, in conclusion)."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Good use of topic vocabulary: biodiversity, greenhouse effect, erosion, extreme weather, industrial pollution.", "Some simple word choices (serious, big issue) could be improved."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mostly accurate with a mix of sentence structures.", "Some minor errors (e.g., missing articles or subject-verb agreement), but not enough to affect meaning."]}], "thesis": "Both issues are harmful, but global warming has a broader and deeper impact.", "thesis_kind": "position", "outline": [{"label": "Deforestation Argument", "topic": "", "subs": ["Loss of wildlife and biodiversity", "More CO₂ due to fewer trees", "Soil erosion and flooding risk"]}, {"label": "Global Warming Argument", "topic": "", "subs": ["Affects the whole world", "Causes sea level rise, extreme weather", "Impacts food, health, and water", "Caused by more than just deforestation (e.g., fossil fuels)"]}, {"label": "Opinion", "topic": "", "subs": ["Global warming is more dangerous due to its wide and long-term effects"]}, {"label": "Conclusion", "topic": "", "subs": ["Deforestation is serious, but global warming is the most c
