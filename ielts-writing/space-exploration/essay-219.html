ial. Governments should continue funding and guiding research with long-term societal and scientific goals, while private companies can contribute innovation and efficiency. Partnerships between public and private sectors can maximize technological progress while ensuring ethical and responsible space exploration.", "In conclusion, private companies bring efficiency and innovation, but profit motives and regulatory challenges are significant concerns. A balanced collaboration between governments and private enterprises offers the most effective and responsible path for space exploration."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Both pros and cons discussed with relevant examples.", "Opinion is clearly stated with rationale for a balanced approach.", "Arguments are logical and well-developed."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → advantages → disadvantages → opinion → conclusion.", "Cohesive devices: “One significant advantage,” “However,” “In my view,” “In conclusion.”", "Ideas progress smoothly with clear paragraphing."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “efficiency,” “cost-effectiveness,” “commercial motivations,” “public accountability,” “technological innovation.”", "Academic and formal tone maintained throughout."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of simple, compound, and complex sentences.", "Correct use of modals, relative clauses, and participial phrases.", "Minor repetition, but meaning is clear."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Growing role of private companies in space exploration.", "Thesis: discuss pros and cons and provide opinion."]}, {"label": "Body Paragraph 1", "topic": "Advantages", "subs": ["Efficiency and cost-effectiveness (e.g., reusable rockets).", "Encourages technological innovation through competition."]}, {
