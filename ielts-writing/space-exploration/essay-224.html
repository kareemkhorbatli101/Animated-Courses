ing space as a peaceful domain through global cooperation can ensure that technological advancements benefit all of humanity rather than escalating conflict.", "In conclusion, the development of space weapons poses serious risks including conflict escalation and debris hazards. International treaties, transparency, and cooperative measures are essential to prevent these dangers and maintain space as a safe and peaceful domain."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Problems and solutions addressed clearly and thoroughly.", "Examples: orbital weapons, debris, arms race.", "Strong problem-solution structure with relevant recommendations."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → problems → consequences → solutions → conclusion.", "Cohesive devices: “One major problem,” “Another concern,” “To prevent these problems,” “Moreover,” “In conclusion.”", "Logical flow with clear paragraphing."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “militarization,” “arms race,” “space debris,” “confidence-building measures,” “peaceful domain.”", "Formal academic tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of simple, compound, and complex sentences.", "Accurate use of modals, relative clauses, and participial phrases.", "Minor repetition acceptable for emphasis."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Some countries are developing space weapons.", "Thesis: risks exist, but prevention is possible through regulation."]}, {"label": "Body Paragraph 1", "topic": "Problems", "subs": ["Escalation of international conflicts and arms race.", "Disruption to civilian and commercial space systems."]}, {"label": "Body Paragraph 2", "topic": "Problems", "subs": ["Space debris from weapons tests/endangers satellites and missions.", "Long-term hazards affecting all space operations."]},
