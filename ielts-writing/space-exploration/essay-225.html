able rockets, and regulating the frequency of launches.", "In conclusion, while rocket launches have environmental impacts, space programs should not be completely restricted. Instead, governments and private companies should implement greener technologies and practices to minimize harm while continuing to benefit from space exploration."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question with clear opinion.", "Examples: emissions, space debris, sustainable practices.", "Argument logically develops advantages and environmental concerns."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → environmental problems → consequences → benefits of space programs → conclusion.", "Cohesive devices: “One major concern,” “Another issue,” “However,” “For example,” “In conclusion.”", "Smooth transitions and clear paragraphing."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “greenhouse gases,” “black carbon,” “atmospheric pollution,” “reusable rockets,” “sustainable practices.”", "Formal and academic tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of simple, compound, and complex sentences.", "Correct use of modals, relative clauses, and participial phrases.", "Minor repetition acceptable for emphasis."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Space exploration causes environmental harm via rocket launches.", "Thesis: programs should continue, but practices must be greener."]}, {"label": "Body Paragraph 1", "topic": "Environmental Concerns", "subs": ["Emission of carbon dioxide, black carbon, and toxic compounds.", "Contributes to climate change and ozone depletion.", "Example: frequent launches worsen global warming."]}, {"label": "Body Paragraph 2", "topic": "Space Debris", "subs": ["Rocket stages and fragments pose long-term orbital hazards.", "Limits safe scienti
