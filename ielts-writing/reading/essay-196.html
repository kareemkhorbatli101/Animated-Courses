appens, and in doing so meets thousands of words no textbook would have persuaded them to read. The habit formed that way tends to last, and it carries over to the factual books they later need for study or work. A reluctant reader handed only facts often stops reading once the examination is over.", "In conclusion, while non-fiction provides valuable factual knowledge, fiction should not be considered a waste of time. Reading fiction nurtures imagination, empathy, and critical thinking, complementing the benefits of non-fiction. A balanced reading approach, incorporating both types of books, maximizes intellectual, emotional, and creative growth.\n(271 words)"], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question with evaluation of both non-fiction and fiction.", "Opinion clearly stated in the conclusion."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → non-fiction advantages → fiction advantages → conclusion.", "Cohesive devices: “While…,” “However,” “In this sense,” “In conclusion.”"]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “analytical skills,” “personal development,” “emotional intelligence,” “moral reasoning,” “comprehension,” “intellectual growth.”", "Academic and precise tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Grammar accurate; meaning clear throughout."]}], "thesis": "fiction is valuable and complements non-fiction.", "thesis_kind": "position", "outline": [{"label": "Introduction", "topic": "", "subs": ["Debate: fiction vs. non-fiction value."]}, {"label": "Body Paragraph 1", "topic": "Non-fiction advantages", "subs": ["Provides factual knowledge on history, science, business, personal growth.", "Develops analytical skills and practical understanding."]}, {"label": "Body Paragraph 2", "topic": "Fiction advantages", "subs": ["Fosters creativity,
