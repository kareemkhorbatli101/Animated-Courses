ic libraries should receive greater government funding. Libraries support literacy, education, cultural awareness, and equal access to knowledge, making them essential for both individual growth and the advancement of society as a whole. Prioritizing library funding ensures that communities are better equipped to meet educational and intellectual needs alongside recreational ones.\n(276 words)"], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question with clear reasoning and examples.", "Opinion clearly expressed in conclusion."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → literacy and education → societal benefits → conclusion.", "Cohesive devices: “One reason…,” “Another reason…,” “While…,” “In conclusion.”"]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “lifelong learning,” “critical skills,” “cultural awareness,” “community engagement,” “archives,” “equal access to knowledge.”", "Formal academic tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Grammar accurate; meaning clear throughout."]}], "thesis": "libraries should receive more government support.", "thesis_kind": "position", "outline": [{"label": "Introduction", "topic": "", "subs": ["Debate: library funding vs. sports facilities."]}, {"label": "Body Paragraph 1", "topic": "Literacy and educational benefits", "subs": ["Free access to books and digital resources.", "Support for students, job seekers, and lifelong learners.", "Promotes equality of opportunity across socioeconomic backgrounds."]}, {"label": "Body Paragraph 2", "topic": "Broader societal benefits", "subs": ["Enhances cultural awareness, critical thinking, and community engagement.", "Preserves local history and knowledge.", "Benefits wider population than sports facilities alone."]}, {"label": "Conclusion / Opinion", "topic": "", "subs": ["Libra
