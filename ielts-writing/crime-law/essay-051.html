es of crime, but it is not the only or most important one. Reducing crime requires a broader approach, including improving education, supporting families, and promoting ethical values across all social levels."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["The question is fully addressed with a clear opinion.", "Supporting arguments are logical and relevant."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["The essay is well-organized, but transitions are basic (“on one hand,” “however,” “in my opinion”).", "Clear paragraphing helps reader follow the points."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Good use of vocabulary: “financial hardship,” “peer pressure,” “social support.”", "Some repetition of common words like “crime,” “poverty.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Sentence structure is varied with few major errors.", "Some phrasing could be more natural or complex."]}], "thesis": "Poverty is one cause of crime but not the only or most important one.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Why poverty leads to crime", "subs": ["Desperation and survival needs", "Lack of jobs and support", "Negative influence in poor areas"]}, {"label": "Paragraph 2", "topic": "Other causes of crime", "subs": ["Not all poor people commit crimes", "Education, peer pressure, and values", "Wealthy people also commit crimes"]}, {"label": "Conclusion", "topic": "", "subs": ["Crime has many causes, so solutions must be wide-ranging and not focused only on poverty."]}], "items": {"setA": [{"word": "desperation", "sentence": "Hunger turns theft into ____ rather than choice."}, {"word": "normalized", "sentence": "Where everyone does it, the behaviour becomes ____."}, {"word": "hardship", "sentence": "Most families meet ____ without ever breaking the law."}, {"word": "evasion", "sentence": "Tax ____ costs more than every burglary combined."}, {"word": "inequality
