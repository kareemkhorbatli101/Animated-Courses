eir home, and a conversation recorded without consent do not. Editors who apply that test lose very little of value and spare a great deal of harm.", "In conclusion, while public interest is a natural consequence of fame, I believe that celebrities retain the right to privacy. Media coverage should respect personal boundaries, concentrating on career-related news rather than exposing intimate or private aspects of their lives. A balance between transparency and respect for human dignity is essential.\n(276 words)"], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Clear opinion stated and fully justified.", "Arguments for and against presented logically with examples."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → supporting view → counterpoint → conclusion.", "Smooth connectors: “While it is true…,” “However,” “For instance,” “In conclusion.”"]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “public scrutiny,” “intrusion,” “mental health,” “human dignity,” “responsible journalism.”", "Formal and precise word choice maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Complex and compound sentences used effectively.", "Grammar accurate throughout, meaning clear."]}], "thesis": "privacy should be protected.", "thesis_kind": "position", "outline": [{"label": "Introduction", "topic": "", "subs": ["Debate: celebrities’ privacy rights vs. public interest.", "Argument for no privacy", "Fame brings public interest and entertainment value.", "Tabloid reporting attracts audience and revenue.", "Argument for privacy", "Intrusion harms mental health and relationships.", "Celebrities have human rights like anyone else.", "Journalism should focus on professional achievements."]}, {"label": "Conclusion", "topic": "", "subs": ["Public interest is natural, but privacy must be respected.", "Balance between transparency and dignity is essential."]}], "items": {"setA":
