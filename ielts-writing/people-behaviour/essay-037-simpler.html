arry them to the limit of it."], "criteria": null, "thesis": "Intelligence results from a combination of innate ability and learning through education.", "thesis_kind": "roadmap", "outline": [{"label": "Paragraph 1", "topic": "Argument for innate intelligence", "subs": ["Intelligence as a natural talent inherited genetically.", "Examples of early exceptional skills.", "View that some people are naturally more intelligent."]}, {"label": "Paragraph 2", "topic": "Argument for learned intelligence", "subs": ["Intelligence can be developed through education and experience.", "Role of schooling and challenging activities.", "Improvement in cognitive abilities regardless of natural talent."]}, {"label": "Conclusion", "topic": "Balanced opinion", "subs": ["Both natural ability and learning contribute to intelligence."]}], "items": {"setA": [{"word": "inborn", "sentence": "A fear of falling seems to be ____ in every baby."}, {"word": "a quicker mind", "sentence": "Chess rewards ____ more than a strong arm."}, {"word": "unusual skill", "sentence": "He showed ____ with engines before he could drive."}, {"word": "hard tasks", "sentence": "Giving a class ____ builds more than easy ones ever will."}, {"word": "a starting point", "sentence": "A map gives you ____, not the whole journey."}], "setA_distractors": ["certificate", "timetable"], "setB": [{"word": "intelligence", "def": "the ability to learn, understand and think things out"}, {"word": "education", "def": "the teaching and learning a person receives"}, {"word": "surroundings", "def": "the place and the conditions a person lives in"}, {"word": "knowledge", "def": "the facts and understanding a person has gained"}, {"word": "research", "def": "careful study done to discover new facts"}], "cloze": [{"text": "something we are born with", "why": null}, {"text": "passed down from a person's parents", "why": null}, {"text": "learn faster than others", "why": null}, {"text": "proof of natural intelligence", "why": null}, {"text"
