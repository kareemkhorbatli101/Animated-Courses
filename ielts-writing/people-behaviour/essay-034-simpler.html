<script>window.IWR_ESSAY={"num": 34, "slug": "essay-034-simpler", "title": "Children’s Internet Safety", "category": "People & Behaviour", "category_slug": "people-behaviour", "question": "Many children use the internet unsupervised, leading to dangers. What problems arise, and how can they be solved?", "qtype": null, "years": "2018, 2021", "words": 268, "stated": null, "extended": 0, "body": ["The internet is now everywhere, and many children use it with no adult watching. This can put them in real danger. This essay will discuss the problems that come from unwatched internet use and suggest ways to keep children safe.", "One major problem is meeting content that is not fit for children, such as violence, sex or harmful trends online. Children may not see the risk. They can be frightened or badly influenced by what they find. Another problem is adults online who try to use children for their own ends, through chat rooms or social networks. Too much time online also brings health problems, such as sore eyes, a bent back and too little exercise.", "To deal with these problems, parents and schools should watch over children and teach them to use the internet safely. Software that blocks harmful websites can help. Children should also be taught about privacy, about bullying online, and about never sharing personal details. Encouraging activities away from the screen helps to balance their day.", "Age decides which measure fits. A seven-year-old needs filters and a parent nearby, because an explanation cannot protect a child who cannot yet read the warning signs. A teenager will meet the open internet before long. The aim therefore shifts from blocking to preparing: talking openly about what they have seen, agreeing hours away from the screen together, and keeping enough trust that a frightening message is reported at home instead of hidden.", "In conclusion, unwatched internet use puts children at real risk. With proper supervision, teaching and the right software, these dangers can be made much smaller."], "criteria": null, "thesis": "Unsupervised internet use creates serious risks for children; these can be reduced through supervision, education, and technology.", "thesis_kind": "roadmap", "outline": [{"label": "Paragraph 1", "topic": "Problems of unsupervised internet use", "subs": ["Exposure to inappropriate content.", "Online predators and exploitation.", "Health issues due to excessive use."]}, {"label": "Paragraph 2", "topic": "Solutions to protect children", "subs": ["Parental and school supervision and education.", "Use of parental control software.", "Teaching online safety and encouraging offline activities."]}, {"label": "Conclusion", "topic": "Summary", "subs": ["Risks are serious but manageable with proper measures."]}], "items": {"setA": [{"word": "real danger", "sentence": "Swimming alone at night puts a person in ____."}, {"word": "sore eyes", "sentence": "Three hours of reading in bad light left him with ____."}, {"word": "filters", "sentence": "The school added ____ to every computer in the library."}, {"word": "the warning signs", "sentence": "A good nurse notices ____ before the patient complains."}, {"word": "the open internet", "sentence": "At university students meet ____ with nobody checking what they read."}], "setA_distractors": ["password", "textbook"], "setB": [{"word": "chat rooms", "def": "places online where strangers talk to each other"}, {"word": "personal details", "def": "private facts such as an address or a telephone number"}, {"word": "bullying", "def": "repeatedly frightening or hurting somebody weaker"}, {"word": "a teenager", "def": "a young person in their teens"}, {"word": "trust", "def": "the belief that somebody can be relied on"}], "cloze": [{"text": "with no adult watching", "why": null}, {"text": "content that is not fit for children", "why": null}, {"text": "may not see the risk", "why": null}, {"text": "for their own ends", "why": null}, {"text": "a bent back", "why": null}, {"te
