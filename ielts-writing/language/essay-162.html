sible, I believe that speaking the native language provides deeper, more meaningful insight into a country’s culture. Language acts as a bridge, not just to communication, but to the heart of a society."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question with a clear and well-supported opinion.", "Relevant, culturally aware examples support the main idea."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Smooth progression of ideas with clear paragraphing and linking phrases."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Good use of topic-specific vocabulary: “honorifics,” “worldview,” “authentic experiences,” “nuance.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["A variety of sentence types used with accuracy.", "Minor slips may appear, but do not hinder understanding."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Presents the debate about language and cultural understanding.", "States a clear agreement with the idea.", "Language as cultural reflection", "Language shows values, social relationships, and emotions.", "Cultural ideas are often embedded in words or expressions.", "Deeper experiences through language", "Access to people, traditions, and daily life.", "Language unlocks humor, beliefs, and emotions.", "Counterpoint and rebuttal", "Some understanding is possible through other means.", "But it’s usually limited and surface-level."]}, {"label": "Conclusion", "topic": "", "subs": ["Language is essential for deep cultural understanding.", "It is the key to truly connecting with a culture."]}], "items": {"setA": [{"word": "nuance", "sentence": "A good interpreter keeps every ____ of the original."}, {"word": "superficial", "sentence": "The review was too ____ to be useful."}, {"word": "authentic", "sentence": "The market sells ____ crafts, not factory copies."}, {"word": "irreplaceable", "sentence": "H
