 identity are too significant to ignore. It is important to balance the benefits of easier communication with efforts to protect and preserve the world’s many languages. Therefore, I believe the rise of one global language would have more drawbacks than advantages."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question with clear argumentation.", "Balanced discussion of both positive and negative aspects with a personal opinion."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear organization with logical progression between paragraphs.", "Effective use of linking devices to guide the reader."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Good vocabulary: “linguistic diversity,” “minority languages,” “cultural identity,” “marginalization.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex and simple sentence structures.", "Few minor errors not affecting understanding."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Topic of global language prediction introduced.", "Opinion stated: more negative consequences than positive."]}, {"label": "Positive aspects", "topic": "", "subs": ["Easier international communication.", "Benefits for business, education, travel.", "Speeds up spread of knowledge and cooperation."]}, {"label": "Negative aspects", "topic": "", "subs": ["Risk of losing minority languages and cultural heritage.", "Language linked to identity and traditions.", "Marginalization of native language speakers.", "Loss of cultural diversity reduces creativity."]}, {"label": "Conclusion", "topic": "", "subs": ["Acknowledge convenience but emphasize cultural loss.", "Call for balance between communication ease and language preservation."]}], "items": {"setA": [{"word": "facilitate", "sentence": "Clear signage can ____ the flow of visitors."}, {"word": "marginalization", "sentence": "Cheap imports led
