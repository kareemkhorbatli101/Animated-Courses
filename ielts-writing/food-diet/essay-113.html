lt in bread, which lowered blood pressure across whole countries without a single shopper changing their mind.", "In conclusion, both individuals and governments share the responsibility for addressing obesity. While individuals must make conscious decisions about their health, governments should create supportive environments that encourage these choices."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Addresses both views clearly and provides a balanced discussion.", "Offers a clear conclusion reflecting shared responsibility."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical structure with well-organized paragraphs.", "Some linking words could be more varied."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Relevant vocabulary such as sedentary lifestyle, urban planning, taxing sugary drinks.", "Some repetition but overall appropriate range."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5", "lines": ["Mix of complex and simple sentences.", "Minor grammatical slips present but do not impede clarity."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Obesity is a global issue.", "Debate over government vs. individual responsibility.", "Opinion: shared responsibility."]}, {"label": "Individual responsibility", "topic": "", "subs": ["Personal choices affect health.", "Importance of awareness and self-discipline.", "Examples: fast food consumption, inactivity."]}, {"label": "Government responsibility", "topic": "", "subs": ["Environmental factors influence behavior.", "Role in regulation and creating healthy environments.", "Examples: advertising laws, taxes, urban planning."]}, {"label": "Conclusion", "topic": "", "subs": ["Both individuals and governments must work together.", "Individuals must make choices; governments must support."]}], "items": {"setA": [{"word": "sedentary", "sentence": "A ____ job undoes a careful breakfast."}, {"word": "accountabi
