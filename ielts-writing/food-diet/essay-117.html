 down, teaching the techniques in school kitchens, and keeping local producers in business would protect the tradition far more effectively than closing a burger shop, which would simply move the convenience somewhere else.", "In conclusion, although fast food is popular and unlikely to disappear, traditional cooking methods will not vanish if efforts are made to protect and celebrate them. Both can continue to exist in modern society."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Clearly addresses the question with a balanced opinion.", "Provides relevant reasons and examples."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical flow of ideas with clear paragraphing.", "Some connectors and transitions could be more varied."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Good use of vocabulary: culinary heritage, nutritious, coexist, cultural identity.", "Moderate repetition of words like “traditional” and “fast food.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5", "lines": ["Mix of sentence types, including complex sentences.", "Minor grammar errors present but do not obscure meaning."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Fast food’s popularity vs. traditional cooking.", "Opinion: traditional cooking will not disappear."]}, {"label": "Reasons fast food is popular", "topic": "", "subs": ["Convenience, speed, affordability.", "Attractive to busy people and youth."]}, {"label": "Importance of traditional cooking", "topic": "", "subs": ["Cultural identity and nutrition.", "Still enjoyed at family events and special occasions."]}, {"label": "Solutions and balance", "topic": "", "subs": ["Banning fast food is unrealistic.", "Promote awareness and preservation of traditional food.", "Healthier fast food options can help."]}, {"label": "Conclusion", "topic": "", "subs": ["Traditional cooking can survive alongside fast food if protected."]}], "i
