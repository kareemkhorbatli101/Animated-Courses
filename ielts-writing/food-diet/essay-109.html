orld population. However, they should be used carefully and combined with sustainable farming methods, education, and fair food distribution to ensure that everyone benefits safely and equally."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question.", "Presents a clear opinion and supports it with relevant arguments and examples."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical flow and paragraphing are clear.", "Could improve linking variety (some repetition of “however,” “for example”)."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Good range of vocabulary (e.g., biodiversity, yields, food security).", "Slightly repetitive word choice in places."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5", "lines": ["Mostly accurate use of grammar and complex structures.", "Some grammatical simplicity limits a higher score."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Global food crisis due to population growth.", "GM foods = one possible solution.", "Opinion: Supportive but with reservations."]}, {"label": "Benefits of GM Foods", "topic": "", "subs": ["Higher yields, pest resistance, climate resilience.", "Example: Drought-resistant rice/corn."]}, {"label": "Necessity Due to Global Changes", "topic": "", "subs": ["Limited farmland + climate change = need for innovation.", "GM crops offer reliability."]}, {"label": "Concerns and Risks", "topic": "", "subs": ["Health and environmental worries.", "Control by big companies.", "Risk of over-dependence."]}, {"label": "Conclusion", "topic": "", "subs": ["GM foods helpful but not perfect.", "Should be part of a larger, sustainable food strategy."]}], "items": {"setA": [{"word": "higher yields", "sentence": "New seed varieties promise ____ from the same fields."}, {"word": "arable", "sentence": "Only a fifth of the country is ____ land; the rest is rock and sand."}, {"word": "resist", "sen
