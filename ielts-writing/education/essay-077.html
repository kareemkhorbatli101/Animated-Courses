<script>window.IWR_ESSAY={"num": 77, "slug": "essay-077", "title": "Role of Teachers", "category": "Education", "category_slug": "education", "question": "It is thought by some that a school teacher’s role is to motivate and inspire students. However, other people believe that a teacher’s primary role is to pass on knowledge. What do you think is the role of a teacher?", "qtype": "Common question", "years": null, "words": 297, "stated": null, "extended": 0, "body": ["Some people believe that the main job of teachers is to inspire and motivate students, while others argue that their primary role is to deliver academic knowledge. In my opinion, both aspects are important, but inspiring students plays a more essential long-term role in education.", "On one hand, it is undeniable that teachers are responsible for helping students learn core subjects such as mathematics, science, or history. Without this basic knowledge, students may struggle in exams or fail to meet the academic standards required for higher education and future jobs. For example, a student cannot pass a national exam without understanding the academic content. In this sense, passing on knowledge is clearly a fundamental part of a teacher’s responsibilities.", "On the other hand, motivating and inspiring students can have a deeper and more lasting effect. When students feel supported and inspired by their teachers, they often become more confident and eager to learn. This kind of motivation is particularly important for students who are struggling or unsure of their abilities. A good teacher not only teaches facts but also helps students believe in themselves and stay interested in learning. For example, many successful people often mention a teacher who inspired them during their school years.", "In my view, while teaching knowledge is necessary, the true power of a great teacher lies in their ability to inspire. Knowledge can be found in textbooks or online sources, but human motivation and encouragement are harder to replace. Therefore, teachers should try to balance both roles but focus more on inspiring their students.", "In conclusion, although passing on knowledge is a major part of teaching, I believe that motivating students is the more important role. A teacher who can do both will have the most positive impact on their students’ lives."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Addresses both views and gives a clear opinion.", "Main ideas are explained with relevant examples."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Clear paragraph structure.", "Transitions like “on the other hand,” “in my view,” and “in conclusion” help the flow."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary is suitable: “academic standards,” “lasting effect,” “supported and inspired.”", "Slight repetition of “students” and “teachers.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5", "lines": ["Mix of complex and simple sentence structures.", "Minor grammar slips but meaning is always clear."]}], "thesis": "Teaching involves both roles, but inspiration is more powerful in the long term.", "thesis_kind": "position", "outline": [{"label": "Teachers as knowledge providers", "topic": "", "subs": ["Students need core academic knowledge", "Success in exams depends on this knowledge"]}, {"label": "Teachers as motivators", "topic": "", "subs": ["Encouragement builds student confidence", "Inspiration leads to lifelong learning", "Personal stories show the lasting impact of inspiring teachers"]}, {"label": "Opinion paragraph", "topic": "", "subs": ["Knowledge is widely available today", "Human motivation is harder to replace", "The best teachers balance both"]}, {"label": "Conclusion", "topic": "", "subs": ["Motivation is more valuable, though both roles matter."]}], "items": {"setA": [{"word": "eager", "sentence": "Small successes early on keep beginners ____ to continue."}, {"word": "encouragement", "sentence
