ere is the risk that some students might not adapt well, affecting their well-being or academic focus during the visit.", "In conclusion, while international exchange visits are not suitable for every student and may involve challenges such as cost or emotional stress, their advantages in terms of language improvement, cultural exposure, and personal growth are significant. Therefore, in most cases, the benefits clearly outweigh the drawbacks."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Balanced analysis of both sides.", "Clear opinion that advantages outweigh disadvantages.", "Relevant examples included."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Paragraphs are well structured and logically ordered.", "Some overused transitions (\"Firstly\", \"However\"), but meaning is always clear."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Vocabulary is appropriate: “open-minded,” “culture shock,” “global awareness”.", "Minor repetition of “advantage,” “benefit,” “student”."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["A mix of complex and simple sentence structures.", "Mostly accurate, with only a few minor issues."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Some support international exchange; agree advantages outweigh disadvantages."]}, {"label": "Body Paragraph 1", "topic": "Benefits", "subs": ["Language improvement", "Cultural understanding", "Example of cross-cultural learning"]}, {"label": "Body Paragraph 2", "topic": "Personal development", "subs": ["Independence and maturity", "Improved school performance", "Networking and lifelong benefits"]}, {"label": "Body Paragraph 3", "topic": "Disadvantages", "subs": ["Financial cost", "Homesickness and culture shock", "Risk of poor adaptation"]}, {"label": "Conclusion", "topic": "", "subs": ["Acknowledge drawbacks, but argue benefits are greater in most cases."]}], "items": {"setA":
