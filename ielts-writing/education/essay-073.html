achers can move it, which is why a school's effect shows up most clearly in the children who need it most.", "In my opinion, while teachers are vital for academic instruction, parents have the greatest influence because they shape children’s attitudes and work ethic from an early age, which supports lifelong learning.", "In conclusion, both parents and teachers influence academic development, but parents’ role is more foundational and enduring."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Discusses both views clearly with relevant examples.", "Gives a clear, supported opinion."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Well-structured essay with logical paragraphing.", "Uses common linking devices effectively."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Appropriate vocabulary: “academic development,” “motivation,” “study habits.”", "Some repetition of “influence” and “parents/teachers.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Good mix of sentence types with mostly correct grammar.", "Minor slips and some awkward phrasing."]}], "thesis": "Both parents and teachers influence academic development; parents have a more lasting impact.", "thesis_kind": "position", "outline": [{"label": "Influence of parents", "topic": "", "subs": ["Shape attitudes and motivation early on", "Provide support and encourage study habits", "Example: reading and homework help"]}, {"label": "Influence of teachers", "topic": "", "subs": ["Provide formal instruction and knowledge", "Inspire and guide students", "Can compensate for weak parental support"]}, {"label": "Conclusion", "topic": "", "subs": ["Parents’ role is foundational and more enduring, despite teachers’ importance."]}], "items": {"setA": [{"word": "attitudes", "sentence": "Habits and ____ are formed long before the first lesson."}, {"word": "potential", "sentence": "A teacher who expects more can lift a pupil to their ____."}, {"word": "base
