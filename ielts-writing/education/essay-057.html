r and communicate regularly, children receive consistent messages about acceptable behaviour. Schools can organize meetings or workshops to involve parents more actively, which benefits everyone.", "In conclusion, while teachers manage discipline in schools, parents also play a crucial role in teaching discipline at home. Cooperation between both parties is the most effective way to address the growing problem of discipline."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Discusses both views clearly and presents a balanced opinion.", "Points are relevant and supported with examples."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical paragraph structure and clear progression of ideas.", "Basic linking words used, e.g., “on one hand,” “on the other hand.”"]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Appropriate vocabulary: “discipline,” “reinforce,” “collaboration,” “behaviour.”", "Some repetition of words like “discipline” and “responsibility.”"]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mostly error-free sentences with some complex structures.", "Minor awkward phrasing but no major errors."]}], "thesis": "Both teachers and parents share responsibility for discipline in schools.", "thesis_kind": "roadmap", "outline": [{"label": "Teachers’ role", "topic": "", "subs": ["Daily interaction and rule enforcement", "Immediate response to misbehaviour", "Use of classroom management strategies"]}, {"label": "Parents’ role", "topic": "", "subs": ["Instilling discipline and values at home", "Reinforcing lessons from school", "Addressing behaviour outside school"]}, {"label": "Conclusion", "topic": "", "subs": ["Cooperation between teachers and parents is necessary for effective discipline."]}], "items": {"setA": [{"word": "disruptive", "sentence": "One ____ student can cost a whole class its lesson."}, {"word": "positive reinforcement", "sentence": "Praise works as ____: rewarded behaviour get
