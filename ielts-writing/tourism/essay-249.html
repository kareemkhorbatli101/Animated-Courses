ues highlight the importance of strict regulations, visitor limits, and continuous monitoring.", "In conclusion, eco-tourism provides significant environmental and social benefits, including conservation and community support. While challenges exist, responsible planning and management can mitigate these problems, making eco-tourism a highly positive trend for sustainable travel."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both parts: benefits and potential drawbacks.", "Opinion integrated clearly: benefits outweigh drawbacks if managed responsibly.", "Provides examples and reasoning for both environmental and social aspects."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → environmental benefits → community benefits → drawbacks → conclusion/opinion.", "Cohesive devices: “one of the main benefits,” “another advantage,” “however,” “in conclusion.”", "Paragraphing logical and ideas sequenced clearly."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Academic vocabulary: “sustainable travel,” “fragile ecosystems,” “reinvented into education,” “over-visitation,” “continuous monitoring.”", "Formal and precise tone maintained throughout."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Correct use of relative clauses, conditionals, and connectors.", "Minor repetition acceptable for emphasis."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Eco-tourism is increasingly popular, promoting sustainability.", "Thesis: benefits outweigh drawbacks when properly managed."]}, {"label": "Body Paragraph 1", "topic": "Environmental Benefits", "subs": ["Preservation of habitats and wildlife.", "Sustainable practices: renewable energy, minimal waste, conservation projects.", "Raises awareness and promotes responsible tourist behavior."]}, {"label": "Body Paragraph 2"
