ical achievement and may inspire future innovation, its negative consequences currently outweigh the benefits. Until the industry becomes more environmentally sustainable, affordable, and socially responsible, the focus should remain on addressing pressing Earth-bound challenges. Space tourism, therefore, is a development that should be approached with caution rather than celebration."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question with a clear opinion: currently negative overall.", "Explains both benefits and drawbacks, providing examples and reasoning.", "Opinion clearly integrated in the final paragraph."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → positive aspects → negative aspects → opinion/conclusion.", "Cohesive devices: “on the positive side,” “however,” “one major concern,” “in my opinion.”", "Paragraphing logical and effective; ideas flow naturally."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Academic vocabulary: “STEM,” “technological advancements,” “greenhouse gases,” “socially responsible,” “allocation of resources.”", "Formal tone maintained throughout; precise word choice."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Accurate use of conditionals, relative clauses, and conjunctions.", "Minor repetition for emphasis acceptable."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Space tourism is becoming feasible.", "Thesis: while technologically impressive, current implications are mostly negative."]}, {"label": "Body Paragraph 1", "topic": "Positive Aspects", "subs": ["Inspires interest in STEM and scientific careers.", "Drives technological innovation benefiting other industries.", "Creates economic opportunities and jobs."]}, {"label": "Body Paragraph 2", "topic": "Negative Aspects", "subs": ["Environmental i
