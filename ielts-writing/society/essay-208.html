st-paced lifestyle and lack of community support.", "In conclusion, people are moving to urban areas mainly for better job opportunities, education, and healthcare. While this migration improves living standards for some, it also results in overcrowding, pollution, and social challenges. To address these problems, governments should invest in sustainable urban planning and develop rural areas so that people are not forced to migrate solely for basic needs."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully answers both parts: reasons + problems.", "Provides clear examples (economic opportunities, education, healthcare, overcrowding, pollution, loss of social ties).", "Balanced and relevant conclusion with a recommendation."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear structure: introduction → causes → problems → conclusion.", "Cohesive devices: “One of the primary causes,” “For instance,” “However,” “Another problem,” “In conclusion.”", "Logical flow maintained."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Strong vocabulary: “economic opportunities,” “long-term prospects,” “overcrowding,” “environmental degradation,” “sustainable urban planning.”", "Formal academic tone consistent."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Good mix of simple, compound, and complex sentences.", "Accurate verb tenses and subject–verb agreement.", "Minor risk of repetition of “cities,” but overall clear."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Define urbanization.", "State trend: moving from rural to urban.", "Purpose: explore causes and problems."]}, {"label": "Body Paragraph 1", "topic": "Causes", "subs": ["Better economic opportunities and higher salaries.", "Example: youth moving for stable jobs.", "Access to education and healthcare in cities.", "Families seeking better schools and hospitals."]}, {"label": "Body Parag
