ultiple perspectives and make informed decisions in the present.", "In conclusion, history can be passed on through education, storytelling, and the preservation of artifacts. It is crucial because it teaches lessons from the past, strengthens cultural identity, and promotes critical thinking. Ensuring that future generations understand history enables societies to grow responsibly while valuing their cultural heritage."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both parts: methods of transmission + societal importance.", "Provides relevant examples (textbooks, storytelling, museums, World War II).", "Balanced discussion with clear conclusion."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear structure: introduction → methods → importance → conclusion.", "Cohesive devices: “One primary method,” “Additionally,” “Firstly,” “Finally,” “In conclusion.”", "Logical and smooth flow."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Strong vocabulary: “cultural identity,” “oral traditions,” “artifacts,” “social cohesion,” “critical thinking.”", "Academic tone consistently maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Correct use of conditionals, modals, and relative clauses.", "Minimal repetition; grammar accurate throughout."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["History shapes cultural identity.", "Methods vary, but passing it to future generations is essential."]}, {"label": "Body Paragraph 1", "topic": "Methods to Pass on History", "subs": ["Education: textbooks, lectures, interactive learning.", "Storytelling/oral tradition: legends, personal experiences.", "Museums and archives: preserving artifacts, documents, photographs."]}, {"label": "Body Paragraph 2", "topic": "Importance for Society", "subs": ["Learn from past mistakes (conflicts,
