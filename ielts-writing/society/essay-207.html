allenges must be carefully managed. Governments should ensure that the benefits of globalization are distributed fairly by supporting local industries and protecting workers’ rights. At the same time, cultural preservation and environmental regulations are necessary to prevent the negative consequences of global integration.", "In conclusion, globalization has transformed the world, offering economic opportunities and cultural enrichment, but it has also created inequality, cultural loss, and environmental damage. With proper policies, the advantages can outweigh the disadvantages, allowing societies to enjoy the benefits while minimizing the risks."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Addresses both sides clearly with examples.", "Opinion stated: advantages outweigh disadvantages if managed.", "Relevant examples: Vietnam’s growth, multinationals vs. small businesses, environmental impact."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Logical structure: intro → pros → cons → opinion → conclusion.", "Linking devices: “On the positive side,” “For example,” “Moreover,” “In my opinion,” “In conclusion.”", "Smooth transitions."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Strong vocabulary: “interconnectedness,” “cultural homogenization,” “inequalities,” “carbon emissions,” “enrichment.”", "Academic tone maintained.", "Slight repetition of “globalization,” but acceptable."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Complex sentences with relative clauses and conditionals.", "Mostly error-free.", "Accurate verb forms and prepositions."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Define globalization.", "State debate: benefits vs. drawbacks.", "Thesis: both sides considered, advantages stronger with safeguards."]}, {"label": "Body Paragraph 1", "topic": "Advantages", "subs": ["Economic growth, cheaper goods.", "Examp
