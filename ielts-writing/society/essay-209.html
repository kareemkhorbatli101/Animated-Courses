nce authentic cultural activities, local communities have an incentive to maintain them.", "In conclusion, protecting traditional ways of life is crucial because they represent cultural identity and valuable knowledge. This can be achieved through education, cultural promotion, the use of technology, and responsible tourism. By doing so, societies can enjoy the benefits of modernization without losing their roots."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both parts of the question.", "Gives clear reasons why preservation matters + practical solutions.", "Examples are relevant (tea ceremonies, dabke, herbal medicine)."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear logical structure: introduction → importance → solutions → conclusion.", "Cohesive devices: “One key reason,” “Furthermore,” “Additionally,” “Finally,” “In conclusion.”", "Ideas flow naturally."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Strong vocabulary: “cultural identity,” “oral traditions,” “digitizing manuscripts,” “responsible tourism.”", "Academic but accessible tone."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Good mix of simple and complex structures.", "Correct use of conditionals and modals.", "Minimal repetition and errors."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Modernization leads to loss of traditions.", "Importance of preservation.", "State essay focus: why important + how to achieve."]}, {"label": "Body Paragraph 1", "topic": "Why preserve?", "subs": ["Traditions = cultural identity and belonging.", "Examples: tea ceremonies, dabke dance.", "Traditional knowledge useful (medicine, farming)."]}, {"label": "Body Paragraph 2", "topic": "How to preserve?", "subs": ["Education in schools.", "Festivals, museums, cultural centers.", "Technology: recording and digitization.", "Tourism as incentive for preservation."]}
