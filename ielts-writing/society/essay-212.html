 areas can reduce migration pressure on major cities. Environmental measures, including waste management programs, green spaces, and stricter pollution controls, are also crucial. Educating citizens about sustainable urban living can further alleviate negative impacts.", "In conclusion, overpopulation in cities causes infrastructure strain, environmental damage, and social problems. However, with proper urban planning, decentralization, and environmental policies, these issues can be mitigated, allowing cities to remain functional and sustainable."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both parts: problems + solutions.", "Clear examples included (Mumbai, Lagos).", "Balanced discussion with practical recommendations."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structured: introduction → problems → solutions → conclusion.", "Cohesive devices: “One major problem,” “Another significant issue,” “To address these challenges,” “In conclusion.”", "Logical and smooth progression."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Strong vocabulary: “urbanization,” “infrastructure strain,” “environmental degradation,” “decentralization,” “sustainable urban living.”", "Academic, formal tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of simple, compound, and complex sentences.", "Correct use of modals, passive voice, and relative clauses.", "Minor repetition of “cities,” but overall clarity maintained."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Urban populations grow due to work opportunities.", "Overpopulation brings social, environmental, and infrastructural problems."]}, {"label": "Body Paragraph 1", "topic": "Problems", "subs": ["Infrastructure strain: housing, transport, healthcare.", "Example: overcrowded cities like Mumbai, Lagos.", "Environmental issues: pollution, waste, loss of gree
