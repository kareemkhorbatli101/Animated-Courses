earning, or lifestyle allow personal growth and enrich experiences. Life that combines stability with flexibility can lead to both comfort and fulfillment.", "In conclusion, stability offers security and reduces stress, whereas change fosters development and resilience. By maintaining a stable core while embracing new opportunities, individuals can enjoy a well-rounded and rewarding life."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Both views are discussed with clear examples.", "Opinion is clearly stated: balance between stability and change.", "Well-developed, relevant arguments."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → stability → change → opinion → conclusion.", "Cohesive devices: “Supporters of…,” “On the other hand,” “For instance,” “In my opinion,” “In conclusion.”", "Smooth logical progression of ideas."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “predictability,” “resilience,” “adaptability,” “monotonous,” “well-rounded life.”", "Academic and formal tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Complex and compound sentences used effectively.", "Accurate verb tenses, relative clauses, and modals.", "Minor repetition, but clarity is maintained."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Different views on lifestyle: stability vs. constant change.", "Thesis: discuss both and present opinion."]}, {"label": "Body Paragraph 1", "topic": "Advantages of Stability", "subs": ["Reduces stress, allows planning.", "Example: steady job, routine, strong family/community bonds.", "Supports mental well-being and skill development."]}, {"label": "Body Paragraph 2", "topic": "Advantages of Constant Change", "subs": ["Encourages adaptability, creativity, resilience.", "Example: varied roles, travel, studying abroad.", "Potential stress if change is excessive."]}, {"
