n extreme cases, individuals may prefer virtual interaction to real-life engagement, increasing feelings of isolation.", "In my opinion, online socialization should complement rather than replace traditional interactions. When used responsibly, it can strengthen relationships and expand social networks. However, prioritizing real-world connections, limiting screen time, and engaging in community activities are essential to prevent isolation and maintain meaningful human interaction."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both perspectives: bringing people closer vs. causing isolation.", "Explains benefits and risks with clear examples.", "Opinion clearly integrated with justification and practical advice."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → positive effects → negative effects → personal opinion/conclusion.", "Cohesive devices: “on the positive side,” “conversely,” “in my opinion,” “for society.”", "Paragraphing is logical and clear."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Precise vocabulary: “niche interests,” “cross-cultural understanding,” “superficial understanding,” “anonymity,” “social anxiety.”", "Academic and formal tone maintained."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Correct use of complex sentences, relative clauses, and conditionals.", "Mix of compound and simple sentences for clarity.", "Minor repetition acceptable for emphasis."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Internet has transformed how people meet and interact.", "Thesis: online socialization has both positive and negative effects."]}, {"label": "Body Paragraph 1", "topic": "Positive Effects", "subs": ["Maintain relationships across distances; stay in touch with family/friends.", "Join communities with shared interests; support networks for socially anxious individuals.", "Promotes inclusivity and cross-cultural understanding."]}, {"label": "Body Paragraph 2", "topic": "Negative Effects", "subs": ["Reduced face-to-face interaction; weaker social skills.", "Superficial relationships, focus on quantity over quality.", "Risks: cyberbullying, isolation, preference for virtual over real-world interactions."]}, {"label": "Body Paragraph 3", "topic": "Personal Opinion", "subs": ["Online socialization should complement real-life interactions.", "Maintain balance with community activities and limited screen time."]}, {"label": "Conclusion", "topic": "", "subs": ["Technology can enhance social connections but should not replace traditional human interaction."]}], "items": {"setA": [{"word": "niche", "sentence": "People with ____ interests find each other online."}, {"word": "superficial", "sentence": "A thousand contacts can be entirely ____."}, {"word": "anonymity", "sentence": "The ____ of the internet encourages cruelty."}, {"word": "withdrawal", "sentence": "Social ____ is the extreme case."}, {"word": "inclusivity", "sentence": "Online groups can genuinely foster ____."}], "setA_distractors": ["bandwidth", "username"], "setB": [{"word": "social media platforms", "def": "websites and apps built for people to post and to follow"}, {"word": "support networks", "def": "groups of people who help one another through difficulty"}, {"word": "cross-cultural understanding", "def": "a grasp of how people in other societies see things"}, {"word": "self-expression", "def": "putting what is inside you into a form others can see"}, {"word": "mental health issues", "def": "difficulties of the mind that need care"}], "cloze": [{"text": "On the positive side", "why": "opens the favourable case"}, {"text": "Conversely", "why": "turns to the opposite case"}, {"text": "Additionally", "why": "adds another idea on the same side"}, {"text": "In my opinion", "why": "marks the writer's own position"}, {"text": "However", "why": "turns against the idea before it"}, {"
