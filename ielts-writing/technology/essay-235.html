ies for manual activity, such as gardening, cooking from scratch, or handwashing small items. By doing so, people can enjoy the benefits of modern technology while preserving health, skills, and independence."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both advantages and disadvantages of household technology.", "Presents a nuanced position: benefits outweigh drawbacks if balanced use is maintained.", "Examples and reasoning support the opinion effectively."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear structure: introduction → advantages → disadvantages → personal stance.", "Cohesive devices: “one of the main advantages,” “however,” “in my opinion,” “provided that.”", "Paragraphing logical and reader-friendly."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Academic vocabulary: “automated environments,” “sedentary lifestyles,” “physical strain,” “self-reliance,” “judiciously.”", "Tone is formal, precise, and appropriate for IELTS Academic.", "Avoids colloquial expressions."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Accurate use of conditionals (“provided that”), relative clauses, and participle phrases.", "Minor repetition acceptable, does not impede clarity."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Many household tasks now done by machines.", "Thesis: technological convenience has clear benefits but also drawbacks."]}, {"label": "Body Paragraph 1", "topic": "Advantages", "subs": ["Saves time and energy (washing, cooking, cleaning).", "Reduces physical strain; benefits elderly and disabled.", "Frees time for work, education, and leisure."]}, {"label": "Body Paragraph 2", "topic": "Disadvantages", "subs": ["Encourages sedentary lifestyles → health issues.", "Diminishes practical skills and self-reliance.", "Creates dependency; increases costs (mai
