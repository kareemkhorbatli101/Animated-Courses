<script>window.IWR_ESSAY={"num": 24, "slug": "essay-024-simpler", "title": "Success Without Formal Education", "category": "Business & Money", "category_slug": "business-money", "question": "Some people fail in school but end up being successful in life. Why do you think this happens? What is the most important thing to succeed in life?", "qtype": null, "years": "2017, 2021", "words": 281, "stated": null, "extended": 0, "body": ["Many people believe you cannot succeed without a good education. There are plenty of examples, though, of people who did badly at school and still did very well in life. This essay will look at why this happens. It will then discuss what I think matters most for success.", "One reason is that school does not always measure practical skill or imagination. Some people find ordinary lessons hard but shine elsewhere. They may be good at running a business, at dealing with people, or at art. Many famous business owners and artists did poorly in class. They succeeded because of their own ideas and their refusal to give up.", "Another reason is drive and the will to keep going. Success often depends more on attitude and hard work than on marks. People who keep their goal in sight and learn from mistakes can get past an early failure. They can still reach what they set out to do.", "One warning belongs with these stories. The school leaver who built a company is famous because the result was unusual. The many who left school early and stayed poor are never interviewed. Leaving school is not a plan in itself.", "In my opinion, the most important thing is a real love of the work. People who love what they do will give it time and effort. They build skills, and they keep going when things get hard. That love drives them on, and it helps them find their own way forward.", "In conclusion, doing well at school helps, but it is not the only road to success. Imagination, staying power and a love of the work all have a crucial part to play."], "criteria": n
