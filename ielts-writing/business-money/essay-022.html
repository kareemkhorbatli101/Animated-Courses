le usage rather than imposing overly strict limits.", "In conclusion, while credit cards are valuable, banks have a responsibility to prevent irresponsible debt by evaluating customers’ ability to repay. This approach protects both consumers and the financial system."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["The essay addresses the question fully with a clear opinion.", "Arguments for and against are presented and balanced.", "Could be improved with more specific examples or statistics."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Well-organized paragraphs with logical progression.", "Linking phrases used effectively but somewhat repetitively."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Vocabulary is appropriate and relevant (“repayment capacity,” “financial stability,” “credit counseling”).", "Some repetition of terms limits variety."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of simple and complex sentence structures.", "Minor errors or awkward phrasing present but meaning is clear."]}], "thesis": "Banks should restrict credit card issuance based on repayment ability to prevent debt and promote stability.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Reasons for restrictions", "subs": ["Prevent customers from incurring unaffordable debts.", "Reduce risk of defaults and financial problems."]}, {"label": "Paragraph 2", "topic": "Arguments against strict restrictions", "subs": ["Credit cards promote spending and economic growth.", "Restrictions may limit access for genuine users.", "Banks’ role in financial education."]}, {"label": "Conclusion", "topic": "Balanced opinion", "subs": ["Reasonable checks and education needed to ensure responsible credit use."]}], "items": {"setA": [{"word": "defaults", "sentence": "A run of ____ tells the bank its checks were too loose."}, {"word": "bankruptcy", "sentence": "____ is the end of the road, not a reset
