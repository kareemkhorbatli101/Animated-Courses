ager are no longer the same question.", "In my opinion, family businesses can be ideal if they combine the benefits of commitment with good management practices. When family members work professionally and resolve conflicts effectively, these businesses can thrive. However, without clear roles and boundaries, the risks may outweigh the advantages."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Both advantages and disadvantages are discussed with a clear opinion.", "Ideas are relevant and generally well supported.", "More specific examples or data would improve the essay."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Clear paragraph structure and logical flow.", "Linking devices (“on the other hand,” “for example,” “in my opinion”) are correctly used but could be more varied."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Appropriate vocabulary for the topic (“commitment,” “nepotism,” “professionalism”).", "Some repetition and basic phrasing; more variety would enhance the essay."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of simple and complex sentences with good accuracy.", "Minor errors or awkward phrasing present but do not affect clarity."]}], "thesis": "Family businesses have both benefits and risks; success depends on professional management.", "thesis_kind": "roadmap", "outline": [{"label": "Paragraph 1", "topic": "Advantages of family businesses", "subs": ["High commitment and motivation.", "Strong customer relationships.", "Long-term planning and personal attention."]}, {"label": "Paragraph 2", "topic": "Problems caused by family businesses", "subs": ["Family conflicts can harm decision-making.", "Nepotism reduces professionalism.", "Limited resources hinder competition and growth."]}, {"label": "Conclusion", "topic": "Balanced opinion", "subs": ["Family businesses can succeed with clear roles and professionalism."]}], "items": {"setA": [{"word": "nepotism", "sentence": "Th
