<script>window.IWR_ESSAY={"num": 20, "slug": "essay-020-simpler", "title": "Maternity Leave Debate", "category": "Business & Money", "category_slug": "business-money", "question": "Should small businesses avoid hiring young women to dodge maternity pay? Agree/disagree?", "qtype": null, "years": "2021", "words": 315, "stated": null, "extended": 0, "body": ["Some people believe small businesses avoid hiring young women. The reason given is the cost of maternity leave. I strongly disagree with this practice. It is unfair, and it harms both individuals and society. Employers should find better ways to support their staff, without treating people differently because of their sex or age.", "Refusing to hire young women in order to escape maternity pay is discrimination. It breaks the rule that everyone should have an equal chance of a job. Women should not be punished because they may one day start a family. Treatment of this kind limits what work they can get, and it makes the workplace less fair. Young women may then struggle to find a job at all, which leaves them short of money and short of independence.", "Maternity leave is also good for employers as well as staff. It lets a mother recover after birth and care for her baby. That matters for her health and for the family. Companies that support maternity leave usually find their staff happier and more loyal. Over time, fewer people leave, and the company's name improves.", "The sums behind this practice are wrong as well. Replacing a trained worker costs most firms several months of that person's pay. Advertising, interviews and the slow early weeks all add up. That is usually more than covering a period of leave. In many countries the state pays most of the money, not the employer, and small firms can claim it back. A manager who quietly rules out young women is therefore not protecting the business. They are shrinking the list of applicants to dodge a cost they have never added up.", "In conclusion, small businesses should not avoid hiring young women to escape maternity pay. They should follow the law instead. They should also build a workplace that respects the rights of its staff and treats everybody fairly."], "criteria": null, "thesis": "Avoiding hiring young women to evade maternity pay is unfair and harmful; supportive workplaces are essential.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Discrimination against young women", "subs": ["It violates equal employment rights.", "Limits job opportunities and increases inequality.", "Causes financial and independence issues."]}, {"label": "Paragraph 2", "topic": "Benefits of maternity leave for both sides", "subs": ["Essential for women’s health and family bonding.", "Increases employee satisfaction and loyalty.", "Reduces turnover and improves reputation."]}, {"label": "Conclusion", "topic": "Firm opposition to the practice", "subs": ["Small businesses should comply with laws and support employees."]}], "items": {"setA": [{"word": "discrimination", "sentence": "Refusing a flat to someone because of their accent is plain ____."}, {"word": "punished", "sentence": "No child should be ____ for asking a question."}, {"word": "start a family", "sentence": "They waited until the house was paid for to ____."}, {"word": "independence", "sentence": "A first salary gives a young person real ____."}, {"word": "the law", "sentence": "Driving at that speed is against ____ in every town."}], "setA_distractors": ["complaint", "pension"], "setB": [{"word": "maternity pay", "def": "money given to a mother while she is away from work with a new baby"}, {"word": "interviews", "def": "formal meetings at which someone is questioned for a job"}, {"word": "a trained worker", "def": "an employee who has already learned the job"}, {"word": "society", "def": "all the people living together in a country"}, {"word": "loyal", "def": "staying faithful to a person or a company"}], "cloze": [{"text": "The reason given is", "wh
