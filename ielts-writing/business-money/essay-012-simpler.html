<script>window.IWR_ESSAY={"num": 12, "slug": "essay-012-simpler", "title": "Marketing Dominance", "category": "Business & Money", "category_slug": "business-money", "question": "Large companies’ marketing budgets attract consumers to their products. What problems does this cause? How can people be encouraged to buy locally?", "qtype": null, "years": "2016, 2020, 2022", "words": 301, "stated": null, "extended": 0, "body": ["Large companies often spend enormous sums on marketing. They do it to draw customers to their products. This helps those companies grow. It also causes problems for smaller local businesses. This essay will discuss the harm done by very large marketing budgets. It will then suggest ways to get people to support local shops.", "One major problem is that small businesses find it hard to compete. A big company can pay for costly advertising on television, on social media and on billboards. Its products are then easy to see and attractive. Local shops usually have little money. They cannot advertise so widely. Customers may therefore be swayed more by advertising than by how good a product is. They may also ignore what a shop does for the area. The local economy suffers.", "Another problem is that this marketing pushes people into buying far too much. Attractive advertisements create wants that nobody really had. People then buy more than they need. They often choose a known brand over a cheaper or greener one. The result is waste and damage to the environment.", "To get people to buy locally, governments and communities should explain the benefits more clearly. Campaigns can show that local shopping keeps unusual goods on sale. They can show that it creates jobs. They can also show that it does less harm to the environment, because goods travel a shorter way. Local shops could offer reward cards or special prices. Farmers' markets and small fairs are worth supporting too. They build community spirit and show off local goods.", "In conclusion, the marketing budgets of large companies make competition unfair. They also push people to buy more than they need. With public information and the right rewards, people can be encouraged to buy from local businesses. That helps build stronger communities."], "criteria": null, "thesis": "Large companies’ marketing creates problems for small businesses and encourages overconsumption; public education and incentives can encourage local buying.", "thesis_kind": "roadmap", "outline": [{"label": "Paragraph 1", "topic": "Problems caused by large companies’ marketing", "subs": ["Small businesses cannot compete with huge marketing budgets.", "Consumers influenced more by ads than quality or community value.", "Marketing encourages excessive buying and waste."]}, {"label": "Paragraph 2", "topic": "How to encourage buying locally", "subs": ["Raise awareness of local shopping benefits.", "Use loyalty programs and discounts.", "Promote farmers’ markets and local fairs."]}, {"label": "Conclusion", "topic": "Summary and final opinion", "subs": ["Marketing dominance creates issues; local support can be increased with education and incentives."]}], "items": {"setA": [{"word": "enormous sums", "sentence": "The stadium cost ____ that the city is still paying back."}, {"word": "swayed", "sentence": "He was ____ by the photographs rather than by the price."}, {"word": "a known brand", "sentence": "Many shoppers reach for ____ even when the shop's own label is identical."}, {"word": "reward cards", "sentence": "The café gives out ____ that take a pound off every tenth coffee."}, {"word": "special prices", "sentence": "The garden centre offers ____ on plants at the end of the season."}], "setA_distractors": ["receipts", "leaflets"], "setB": [{"word": "marketing", "def": "all the work a company does to make people want its products"}, {"word": "social media", "def": "websites and apps where people share messages and pictures"}, {"word": "advertisements", "def": "paid notices that try to make peo
