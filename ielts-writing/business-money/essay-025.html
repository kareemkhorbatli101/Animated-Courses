bition supplies the force, but not the direction.", "In conclusion, ambition is essential for success but should be combined with skills, perseverance, and social abilities. A balanced combination of these traits increases the likelihood of achieving one’s goals."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Addresses the question fully with a clear opinion.", "Provides relevant arguments and examples.", "Could be improved with more varied or detailed examples."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical structure with clear progression.", "Linking phrases are used correctly but sometimes formulaic."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Vocabulary is appropriate and varied (“ambition,” “perseverance,” “social skills”).", "Some repetition of key terms; more synonyms would enhance variety."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Good range of sentence types with mostly accurate grammar.", "Minor errors and occasional awkward phrasing present."]}], "thesis": "Ambition is very important for success but must be combined with skills, perseverance, and social abilities.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Importance of ambition", "subs": ["Drives goal-setting and hard work.", "Pushes people to overcome obstacles and take risks.", "Encourages self-improvement."]}, {"label": "Paragraph 2", "topic": "Other necessary qualities", "subs": ["Skills and knowledge for effective performance.", "Perseverance to keep going despite failures.", "Social skills for building relationships."]}, {"label": "Conclusion", "topic": "Balanced view", "subs": ["Ambition combined with other qualities leads to success."]}], "items": {"setA": [{"word": "obstacles", "sentence": "Ambition is what gets people over the first three ____."}, {"word": "steering", "sentence": "Judgement is the ____ wheel, not the engine."}, {"word": "judgement", "sentence": "Drive wi
