<script>window.IWR_ESSAY={"num": 14, "slug": "essay-014-simpler", "title": "Online Shopping", "category": "Business & Money", "category_slug": "business-money", "question": "More people shop online. Examine the pros and cons for individuals and companies.", "qtype": "Common topic", "years": null, "words": 322, "stated": null, "extended": 0, "body": ["Online shopping has become more and more popular around the world. It brings many benefits to shoppers and to businesses. It also brings some problems. This essay will look at the good and bad sides for both groups.", "One benefit for shoppers is how easy it is. People can buy things at any hour and from anywhere. They do not have to travel to a shop, so they save time and effort. Online shops also stock a wider range than most local shops. Customers can compare prices and find a better deal. For companies, selling online opens new markets. It also cuts costs, because they need fewer shops to rent and fewer staff.", "However, online shopping has drawbacks for shoppers. The biggest one is that nobody can touch or test the goods first. This can lead to disappointment, or even to being cheated. Late delivery and awkward return rules cause trouble as well. For companies, there is far more competition online. Keeping customers loyal is harder, and they must spend a lot on advertising and on their website. Small local shops may also find it hard to compete with huge online platforms.", "Returns are the hidden cost that shapes the whole trade. Customers cannot touch the goods, so part of every order comes back. The seller then pays for delivery twice, and the item loses value sitting on the shelf. Clothing shops have the worst rates of all. Many now publish exact measurements, videos of clothes being worn, and reviews from buyers of a similar size. The shops that last online are not simply the cheapest. They are the ones that describe a product well enough to stop it coming back.", "In conclusion, online shopping is very convenient and offers real room for growth. It also brings risks and problems for shoppers and for companies. Both groups need to understand these points so that they can choose wisely in the online market."], "criteria": null, "thesis": "Online shopping offers convenience and growth but also causes challenges for individuals and companies.", "thesis_kind": "roadmap", "outline": [{"label": "Paragraph 1", "topic": "Advantages", "subs": ["Convenience and time-saving for consumers.", "Wide variety and better price comparison.", "Companies reach wider markets and reduce costs."]}, {"label": "Paragraph 2", "topic": "Disadvantages", "subs": ["Consumers can’t inspect products physically.", "Possible shipping delays and return issues.", "Companies face intense competition and high costs; small businesses struggle."]}, {"label": "Conclusion", "topic": "Summary", "subs": ["Awareness of pros and cons helps consumers and companies make better choices."]}], "items": {"setA": [{"word": "at any hour", "sentence": "A city hospital must be ready to admit patients ____ of the day or night."}, {"word": "a wider range", "sentence": "The new library stocks ____ of children's books than the old one."}, {"word": "a better deal", "sentence": "Phoning three insurers got him ____ than the first quote."}, {"word": "disappointment", "sentence": "The cancelled trip caused real ____ among the children."}, {"word": "the hidden cost", "sentence": "Cheap printers are attractive until you meet ____ of the ink."}], "setA_distractors": ["refund", "warranty"], "setB": [{"word": "delivery", "def": "the act of bringing goods to the person who bought them"}, {"word": "return rules", "def": "the conditions under which a shop takes goods back"}, {"word": "online platforms", "def": "large websites through which many sellers reach buyers"}, {"word": "reviews", "def": "written opinions from people who have already bought something"}, {"word": "clothing", "def": "the things people wear"}], "cloze": [{"text": "how ea
