<script>window.IWR_ESSAY={"num": 25, "slug": "essay-025-simpler", "title": "Ambition and Success", "category": "Business & Money", "category_slug": "business-money", "question": "Some people think ambition is essential for success. To what extent do you agree?", "qtype": "Frequent topic; may relate to charisma or people skills", "years": null, "words": 301, "stated": null, "extended": 0, "body": ["Many people believe that drive is the key to success. I agree to a large extent that it matters. I also think other qualities are needed, though. Skills, staying power and the ability to get on with people all play a part.", "Drive pushes people to set goals and work hard for them. Without it, people may have no direction and no wish to improve their lives. Successful business owners, for example, usually have a strong drive. It pushes them past obstacles and makes them willing to take risks. Drive also keeps people learning and improving, which matters in any crowded field.", "However, drive on its own is not enough. Skills and knowledge count just as much, because they let a person do the work well. Staying power helps too, since it keeps people going after a failure. Social skills matter as well. Talking to people and working in a team are important, because success often rests on good relations with others. A very driven person without these qualities may still struggle.", "Drive can also point the wrong way, and the other qualities then act as a steering wheel rather than an engine. Someone set on rising who cannot read a room will push past the colleagues whose help they will need later. Someone chasing a goal chosen at twenty, without the judgement to see it no longer fits, may spend ten years succeeding at the wrong thing. Skills tell a person what is possible. Staying power keeps them going. Good relationships tell them when to change course. Drive gives the force but not the direction.", "In conclusion, drive is essential for success, but it should go together with skills, staying power and social ability. A balance of these makes it far more likely that a person will reach their goals."], "criteria": null, "thesis": "Ambition is very important for success but must be combined with skills, perseverance, and social abilities.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Importance of ambition", "subs": ["Drives goal-setting and hard work.", "Pushes people to overcome obstacles and take risks.", "Encourages self-improvement."]}, {"label": "Paragraph 2", "topic": "Other necessary qualities", "subs": ["Skills and knowledge for effective performance.", "Perseverance to keep going despite failures.", "Social skills for building relationships."]}, {"label": "Conclusion", "topic": "Balanced view", "subs": ["Ambition combined with other qualities leads to success."]}], "items": {"setA": [{"word": "take risks", "sentence": "No explorer ever found anything without being ready to ____."}, {"word": "crowded field", "sentence": "Photography is a ____, so a beginner needs something different to offer."}, {"word": "read a room", "sentence": "A good host can ____ and change the subject at once."}, {"word": "change course", "sentence": "The captain had to ____ when the storm turned north."}, {"word": "the force", "sentence": "A hammer supplies ____; the carpenter supplies the aim."}], "setA_distractors": ["promotion", "budget"], "setB": [{"word": "drive", "def": "the strong wish to achieve something"}, {"word": "staying power", "def": "the ability to keep going for a long time"}, {"word": "knowledge", "def": "the facts and understanding a person has gained"}, {"word": "relations", "def": "the way people get on with one another"}, {"word": "a failure", "def": "an attempt that did not work"}], "cloze": [{"text": "the key to success", "why": null}, {"text": "to a large extent", "why": null}, {"text": "set goals and work hard for them", "why": null}, {"text": "no wish to improve their lives", "why": null}, {"text":
