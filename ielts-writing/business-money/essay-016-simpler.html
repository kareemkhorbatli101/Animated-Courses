upports the comfort and unity of the staff. For these reasons many companies find it a useful rule."], "criteria": null, "thesis": "Uniforms benefit both companies and employees by improving image and comfort.", "thesis_kind": "roadmap", "outline": [{"label": "Paragraph 1", "topic": "Benefits for companies", "subs": ["Creates professional, consistent image.", "Improves customer confidence and service.", "Reduces employees’ clothing expenses."]}, {"label": "Paragraph 2", "topic": "Benefits for employees", "subs": ["Reduces stress about clothing choices.", "Promotes belonging and equality.", "Improves teamwork and morale."]}, {"label": "Paragraph 3", "topic": "Brief mention of drawbacks", "subs": ["Limits freedom of expression but outweighed by benefits."]}, {"label": "Conclusion", "topic": "Summary", "subs": ["Uniforms are a valuable policy for companies and staff."]}], "items": {"setA": [{"word": "dress alike", "sentence": "The twins refuse to ____ now that they are at different schools."}, {"word": "fashionable", "sentence": "That coat was ____ twenty years ago and is coming back again."}, {"word": "social pressure", "sentence": "Teenagers face real ____ to own the same phone as their friends."}, {"word": "a pay cut", "sentence": "Staff accepted ____ rather than see the factory close."}, {"word": "several sizes", "sentence": "The boots come in ____, so try two pairs before choosing."}], "setA_distractors": ["overalls", "discount"], "setB": [{"word": "image", "def": "the impression a company gives to the public"}, {"word": "customers", "def": "the people who buy from a business"}, {"word": "complaints", "def": "statements that something is wrong or unfair"}, {"word": "warehouse", "def": "a large building where goods are stored"}, {"word": "teamwork", "def": "people working together towards the same result"}], "cloze": [{"text": "ask their staff to wear a uniform", "why": null}, {"text": "organised and well run", "why": null}, {"text": "shows clearly who works there"
