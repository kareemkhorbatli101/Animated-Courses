 very little, because an hour of running is undone by one sweet drink. Exercise is worth having for its own sake; it is the food around the child that shifts the scales.", "In conclusion, while increasing exercise in schools is a key method to fight childhood obesity, it is not the only answer. Education, family involvement, and government policy must work together for long-term success."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses both parts of the task.", "Opinion is clear and balanced.", "✅ Coherence and Cohesion (Band 6.5)", "Logical organization with good paragraphing.", "Some linking could be more varied.", "✅ Lexical Resource (Band 6.5)", "Good range: \"balanced diet\", \"junk food\", \"calorie burn\", \"policy\".", "Some repetition of basic vocabulary.", "✅ Grammatical Range and Accuracy (Band 6.5)", "Variety of complex and simple sentences.", "Mostly accurate with minor slips."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Childhood obesity is rising.", "Exercise in schools helps, but not enough.", "Combined efforts are more effective."]}, {"label": "Exercise in schools", "topic": "", "subs": ["Schools are ideal settings for daily physical activity.", "Exercise burns calories and builds healthy routines.", "Positive impact on physical and mental health."]}, {"label": "Other solutions", "topic": "", "subs": ["Nutrition education from an early age.", "Parent involvement in healthy habits.", "Government regulation of unhealthy food ads.", "Healthy school lunches and food policies."]}, {"label": "Conclusion", "topic": "", "subs": ["School exercise is important but only part of the solution.", "Education, family, and government action are also needed."]}], "items": {"setA": [{"word": "curriculum", "sentence": "Nutrition belongs in the ____, not in a poster."}, {"word": "workshops", "sentence": "Schools can run ____ that bring parents in."}, {"word": "undone", "sentence":
