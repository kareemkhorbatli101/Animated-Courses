 be a positive step, especially for people with untreatable conditions, provided it is done carefully and in combination with scientific advice. The best outcomes often come from integrating the strengths of both systems."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Clear opinion throughout.", "Addresses all parts of the question with examples.", "✅ Coherence and Cohesion (Band 6.5)", "Organized with logical flow.", "Some linking devices are basic.", "✅ Lexical Resource (Band 6.5–7)", "Good variety: \"chronic pain\", \"holistic\", \"side effects\", \"scientific research\".", "Few word choices could be more precise.", "✅ Grammatical Range and Accuracy (Band 6.5)", "Good mix of sentence structures.", "Mostly accurate, minor mistakes."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["More people turn to traditional medicine.", "Especially when modern medicine fails.", "This trend is mostly positive if used wisely."]}, {"label": "Benefits of traditional medicine", "topic": "", "subs": ["Offers options when modern treatments don't work.", "Helps with chronic pain, stress, and side effects.", "Restores hope and control for patients."]}, {"label": "Holistic approach", "topic": "", "subs": ["Focuses on the whole person, not just symptoms.", "Encourages healthy lifestyle habits.", "Emotional and physical health are both valued."]}, {"label": "Risks and caution", "topic": "", "subs": ["Not all remedies are scientifically proven.", "May delay proper care.", "Should be combined with modern treatment."]}, {"label": "Conclusion", "topic": "", "subs": ["Traditional medicine is useful and positive.", "Must be used with guidance and balance."]}], "items": {"setA": [{"word": "holistic", "sentence": "A ____ review looks at the whole situation, not one symptom."}, {"word": "herbal remedies", "sentence": "Markets here have sold ____ for as long as anyone remembers."}, {"word": "side effects", "sentence": "Every la
