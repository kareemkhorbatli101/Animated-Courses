g green zones.", "In conclusion, although housing is an important need, it should not come at the cost of green spaces. Trees and parks are essential for maintaining a healthy, balanced urban environment. Prioritizing greenery in cities is not a luxury, but a necessary investment in public health, sustainability, and the overall livability of urban life."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Clear stance maintained throughout the essay.", "Ideas well-developed with strong support.", "✅ Coherence and Cohesion (Band 6.5–7)", "Logical flow; paragraphs are connected with effective transitions.", "✅ Lexical Resource (Band 6.5–7)", "Strong vocabulary: “green infrastructure,” “biodiversity,” “environmentally unsustainable.”", "✅ Grammatical Range and Accuracy (Band 6.5–7)", "Complex structures used accurately.", "Minor errors do not affect clarity."]}], "thesis": "Trees should be prioritized.", "thesis_kind": "position", "outline": [{"label": "Introduction", "topic": "", "subs": ["Debate between planting trees vs. building housing.", "Why urban green spaces are essential", "Improve air quality and reduce heat.", "Provide public spaces for recreation and stress relief.", "Support mental health and social interaction.", "Problems with prioritizing housing only", "Overcrowding and pollution.", "Cities become less livable and sustainable.", "Alternative solutions: build vertically, use underutilized spaces."]}, {"label": "Conclusion", "topic": "", "subs": ["Green spaces are vital for healthy, livable cities.", "Urban planning must balance development with environmental well-being."]}], "items": {"setA": [{"word": "biodiversity", "sentence": "Draining the marsh wiped out the valley's ____."}, {"word": "repurposing", "sentence": "The council saved money by ____ the old depot as a library."}, {"word": "unsustainable", "sentence": "Borrowing to pay interest is plainly ____."}, {"word": "foster", "sentence": "Shared courtyards ____ friendships between ne
