storation and adaptive reuse can also make old buildings functional again without losing their charm.", "In conclusion, while modern development is necessary, protecting old buildings that carry cultural or historical weight is equally important. A thoughtful, case-by-case approach ensures both progress and preservation."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Both views are well discussed with a clear, balanced opinion.", "Ideas are supported with relevant examples.", "✅ Coherence and Cohesion (Band 6.5–7)", "Paragraphing is logical and well structured.", "Effective linking words (“on the other hand,” “in conclusion”).", "✅ Lexical Resource (Band 6.5–7)", "Variety of vocabulary: “heritage,” “landmarks,” “adaptive reuse.”", "✅ Grammatical Range and Accuracy (Band 6.5–7)", "Good control of complex sentence structures with minimal errors."]}], "thesis": null, "thesis_kind": "roadmap", "outline": [{"label": "Introduction", "topic": "", "subs": ["Ongoing debate on preserving or replacing old buildings.", "Essay will explore both sides and state an opinion.", "Argument for replacing old buildings", "Modern structures are safer and more efficient.", "Can solve urban housing and development needs.", "Argument for preserving old buildings", "Important for cultural identity and tourism.", "Symbolic and historically significant.", "Opinion", "Balanced view: preserve valuable buildings, replace non-historic ones."]}, {"label": "Conclusion", "topic": "", "subs": ["Development and preservation must coexist with careful planning."]}], "items": {"setA": [{"word": "demolished", "sentence": "The flood-damaged bridge was finally ____ last spring."}, {"word": "heritage", "sentence": "The festival celebrates the island's seafaring ____."}, {"word": "restoration", "sentence": "The chapel's ____ took a decade of careful work."}, {"word": "landmarks", "sentence": "Tourists navigate by ____ rather than street names."}, {"word": "preserve", "sentence": "Salt was on
