<script>window.IWR_ESSAY={"num": 156, "slug": "essay-156", "title": "Urban Expansion vs. New Towns", "category": "Housing & Buildings", "category_slug": "housing-buildings", "question": "Should new homes be built in existing cities or new towns in the countryside?", "qtype": null, "years": "2017, 2018, 2021, 2023", "words": 303, "stated": 251, "extended": 54, "body": ["As populations grow and housing demand increases, many countries face a critical decision: whether to expand existing urban areas or develop new towns in rural regions. Each option has its own advantages and drawbacks, and the best choice often depends on economic, environmental, and social factors.", "On one hand, building new homes within existing cities can be more efficient. Urban areas already have infrastructure such as roads, public transportation, schools, and hospitals. Adding new housing in these areas can reduce the need to invest in entirely new systems. Moreover, city living offers greater access to jobs, services, and entertainment, which can be appealing to many. Urban development can also help limit urban sprawl and protect natural landscapes.", "However, expanding cities may lead to overcrowding, increased traffic, pollution, and pressure on existing services. In contrast, building entirely new towns in the countryside offers a chance to design modern, sustainable communities from scratch. These areas can include green spaces, renewable energy systems, and efficient layouts tailored to current needs. New towns may also reduce pressure on urban centers and create opportunities in rural regions.", "There is also a third option that both sides tend to skip. Most countries hold a great deal of unused land inside their cities, together with empty flats above shops and buildings left derelict, and filling these costs less in both money and countryside than either expanding outwards or starting again in a field.", "Nonetheless, developing the countryside raises concerns about the destruction of natural habitats and farmland. It may also be expensive to establish transportation and utilities from the ground up.", "In conclusion, both options have merits. While expanding cities may be cost-effective and practical, new towns offer opportunities for innovative planning and growth. A mixed approach—enhancing urban areas while carefully designing new rural communities—could provide the most balanced solution."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Both perspectives are clearly explored.", "Balanced conclusion with a clear position.", "✅ Coherence and Cohesion (Band 6.5–7)", "Logical flow with well-connected ideas.", "✅ Lexical Resource (Band 6.5–7)", "Appropriate variety: “urban sprawl,” “infrastructure,” “sustainable communities.”", "✅ Grammatical Range and Accuracy (Band 6.5–7)", "Accurate grammar and a good range of complex structures."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Introduces the debate between urban expansion and new towns.", "Argument for expanding cities", "Existing infrastructure.", "Proximity to jobs and services.", "Argument for new towns", "Opportunity to design sustainable, modern areas.", "Reduces pressure on cities.", "Challenges", "Overcrowding in cities vs. environmental harm in countryside."]}, {"label": "Conclusion", "topic": "", "subs": ["A balanced approach combining both strategies is best."]}], "items": {"setA": [{"word": "sprawl", "sentence": "Dense building limits urban ____."}, {"word": "derelict", "sentence": "Buildings left ____ are land already serviced."}, {"word": "utilities", "sentence": "New towns must lay transport and ____ from nothing."}, {"word": "scratch", "sentence": "Designing from ____ allows what retrofitting cannot."}, {"word": "layouts", "sentence": "Efficient ____ are easier to draw than to insert."}], "setA_distractors": ["mortgage", "surveyor"], "setB": [{"word": "infrastructure", "def": "the roads, pipes and servic
