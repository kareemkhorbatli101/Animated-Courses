 and accessible.", "In conclusion, children’s preference for indoor, screen-based activities creates risks for their physical, social, and mental well-being. By combining parental guidance, educational initiatives, and community support, society can ensure that young people enjoy a healthier balance between indoor and outdoor leisure.\n(287 words)"], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Identifies multiple problems and provides clear, realistic solutions.", "Fully addresses both parts of the question."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear logical flow: introduction → problems → solutions → conclusion.", "Cohesive devices: “One major problem,” “Another concern,” “Firstly,” “Finally.”"]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Strong vocabulary: “sedentary lifestyles,” “motor skills,” “addiction,” “extracurricular,” “accessible.”", "Repetition avoided; ideas expressed with variety."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Effective use of cause-and-effect and conditional structures.", "Mostly error-free, with complex sentences well-controlled."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Children spend more leisure indoors with screens.", "Acknowledge benefits but stress problems and need for solutions.", "Problems", "Physical health: obesity, poor posture, lack of fitness.", "Social skills: isolation, fewer interactions, teamwork issues.", "Mental health: sleep problems, addiction, poor focus."]}, {"label": "Solutions", "topic": "", "subs": ["Parents: limit screen time, encourage outdoor play.", "Schools: promote sports, outdoor learning, clubs.", "Governments/communities: provide safe parks, playgrounds, facilities."]}, {"label": "Conclusion", "topic": "", "subs": ["Screen-based leisure causes risks.", "Joint efforts can restore healthy balance between indoor and outdoor time."]}], "items": {"setA"
