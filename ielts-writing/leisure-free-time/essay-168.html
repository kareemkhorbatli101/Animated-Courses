ling life. Excessive focus on wealth may lead to health problems and weakened relationships, whereas having more leisure enables personal growth, stronger connections, and lasting happiness.", "In conclusion, both money and free time are valuable, but free time should be given greater priority. Choosing a lifestyle with more balance often results in a healthier, happier, and more meaningful existence.\n(287 words)"], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Both sides of the argument are addressed clearly and supported with relevant examples.", "The opinion is stated and explained in a balanced way."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear structure with logical progression: introduction, both views, opinion, and conclusion.", "Good use of linking phrases such as “On the one hand,” “On the other hand,” “In fact,” and “In conclusion.”"]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Varied and precise vocabulary: “financial security,” “burnout,” “balanced and fulfilling life,” “material possessions.”", "Minimal repetition, strong academic tone."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex and compound sentences.", "Few, if any, grammatical slips; sentences are clear and controlled."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["State the debate: money vs. free time.", "Give opinion: free time is ultimately more valuable.", "Viewpoint 1 – More money, less free time", "Provides financial stability and comfort.", "Allows better lifestyle: housing, healthcare, education, travel.", "Important for families and coping with rising living costs.", "Viewpoint 2 – More free time, less money", "Essential for health and avoiding stress.", "Time for hobbies, exercise, family, and friends.", "Research shows free time brings higher happiness and satisfaction.", "Opinion", "Money necessary for security, but not enough f
