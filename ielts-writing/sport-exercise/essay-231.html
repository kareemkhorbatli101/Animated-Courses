ternoon. Schemes that have failed are generally the ones that asked for a whole hour, required special clothing, or left staff feeling watched. A short session, taken at a time the team picks for itself, is the version that survives contact with a busy week.", "In conclusion, I strongly believe that companies should integrate exercise time into the workday. The potential advantages for health, productivity, and workplace morale far outweigh the minor concerns about lost time. By investing in employee well-being, businesses ultimately invest in their own long-term success."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Clear opinion given from the start and maintained throughout.", "Strong arguments supported with reasoning and real-world examples.", "Conclusion effectively summarizes the stance."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Clear structure: intro → health benefits → productivity benefits → counterargument → conclusion.", "Cohesive devices used: “one major reason,” “another benefit,” “of course,” “in conclusion.”", "Good logical flow and paragraphing."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Good range of academic vocabulary: “absenteeism,” “turnover,” “renewed focus,” “integrate,” “well-being.”", "Repetition of “benefits” noticeable, but acceptable.", "Tone remains formal and precise."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Effective mix of complex and simple sentences.", "Accurate use of conditionals and relative clauses.", "Very few errors; grammar mostly accurate and natural."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Growing concern for workplace health.", "Thesis: exercise time at work is beneficial for employees and companies."]}, {"label": "Body Paragraph 1", "topic": "Health Benefits", "subs": ["Sitting long hours leads to obesity, stress, and health issues.", "Exercise reduces risks and h
