ety and ethical standards must be prioritized. Governing bodies, broadcasters, and coaches should work together to ensure that these sports are conducted in controlled, safe environments. By doing so, societies can balance public safety with the freedom to enjoy culturally significant sports."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the question, weighing arguments for and against banning violent sports.", "Clear opinion provided with reasoning: ban unnecessary if proper safety measures exist.", "Well-developed examples and justifications."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Logical structure: introduction → harms → counterarguments → personal stance.", "Cohesive devices: “on the one hand,” “on the other hand,” “in my view,” “in my opinion.”", "Paragraphing and transitions aid readability."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Academic vocabulary: “desensitize,” “concussions,” “moral objections,” “regulated rounds,” “governing bodies.”", "Some repetition of “violent sports,” but acceptable in context.", "Tone remains formal and precise."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Complex sentences, conditionals, and passive structures correctly used.", "Mix of simple, compound, and complex sentences enhances readability.", "Minor errors are rare and do not affect clarity."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Violent sports provoke debate.", "Thesis: ban unnecessary if safety and regulations are enforced."]}, {"label": "Body Paragraph 1", "topic": "Harms of Violent Sports", "subs": ["Physical injuries: concussions, fractures, long-term brain damage.", "Desensitization to violence, especially among children.", "Ethical concerns: profiting from human suffering."]}, {"label": "Body Paragraph 2", "topic": "Reasons Against a Ban", "subs": ["Cultural and historical significance; large
