<script>window.IWR_ESSAY={"num": 3, "slug": "essay-003-simpler", "title": "Declining Interest in Art", "category": "Arts", "category_slug": "arts", "question": "Art is considered an essential part of all cultures throughout the world. However, these days fewer and fewer people appreciate art and turn their focus to science, technology, and business. Why do you think that is? What could be done to encourage more people to take interest in the arts?", "qtype": null, "years": "2020", "words": 316, "stated": null, "extended": 0, "body": ["Art has always had a large part in shaping human cultures. These days, though, people seem more drawn to other subjects. Science, technology and business attract them more than art does. There are several reasons for this change. I believe schools and government policy can both help bring art back into view.", "One main reason is that practical subjects now matter more, because they pay better. People compete hard for work. Many young people and their families think science or business leads to better jobs. They also think it leads to a better income. Art subjects therefore get less attention in schools and universities. Modern society also prizes new inventions and output. These are usually linked with technology, not with creating and expressing.", "Another reason is that art is sometimes seen as hard to follow. It can also seem to have little to do with daily life. Paintings, classical music and literature feel far from the way people live now. This is especially true for young people, who spend their time on screens and fast entertainment. Art is therefore pushed aside in favour of fields that look more useful or more fun.", "To build more interest, governments and schools should fit art into the timetable better. One way is to show how art is used in ordinary life. Design, advertising and digital media are good examples. Museums should also make art easier to join in with. They should make it easier for ordinary people to reach. Public events help too, such as street art festivals or competitions between schools. They make people feel part of art rather than outside it.", "In conclusion, practical subjects have grown more popular for money reasons. Ways of living have changed as well. Steps can still be taken to renew people's liking for art. Making art easier to see, easier to reach and closer to daily life can keep it important."], "criteria": null, "thesis": "Interest in art is declining due to economic focus and lifestyle changes, but education and public efforts can renew appreciation.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Economic and educational causes", "subs": ["Practical subjects like business offer better job prospects.", "Education focuses less on arts in favor of science/technology.", "Society links value to innovation and profit, not creativity."]}, {"label": "Paragraph 2", "topic": "Cultural and lifestyle reasons", "subs": ["Art seems hard to understand or not relevant to modern life.", "Youth prefer entertainment over traditional art forms."]}, {"label": "Paragraph 3", "topic": "Solutions", "subs": ["Integrate art more effectively into education.", "Show practical uses of art in daily life.", "Organize public events to make art more engaging."]}, {"label": "Conclusion", "topic": "Summary and call for action", "subs": ["Economic and lifestyle causes explained.", "Education and outreach are key to promoting interest in art."]}], "items": {"setA": [{"word": "practical subjects", "sentence": "Her parents pushed her towards ____ such as accounting and engineering."}, {"word": "compete", "sentence": "Hundreds of graduates ____ for the same twenty places every year."}, {"word": "timetable", "sentence": "The new ____ gives every class two hours of sport a week."}, {"word": "advertising", "sentence": "A career in ____ suits someone who can think of an idea quickly."}, {"word": "festivals", "sentence": "Summer ____ fill the old town square with mus
