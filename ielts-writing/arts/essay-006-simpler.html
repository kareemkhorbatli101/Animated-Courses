<script>window.IWR_ESSAY={"num": 6, "slug": "essay-006-simpler", "title": "Government Support for Artists", "category": "Arts", "category_slug": "arts", "question": "Most artists earn low salaries and should therefore receive funding from the government in order for them to continue with their work. To what extent do you agree?", "qtype": "Repeated most years", "years": null, "words": 306, "stated": null, "extended": 0, "body": ["Many people think most artists earn very little. They say the government should therefore pay them, so that they can go on making art. I agree that some public money helps keep a country's culture alive. It also supports creative work. I do not believe every artist should receive public money without question. A government has only so much to spend.", "On the one hand, public money can help protect what a country has inherited. It can also keep people creating. Many gifted people cannot make art their job, because it brings in no steady income. A country can then lose variety in its culture, and lose new ideas as well. Public money lets artists give their time to the work itself. They do not have to worry about paying the rent. Art feeds people's feelings and minds. It should not be treated as nothing more than a product to sell.", "However, paying every artist may be neither workable nor fair. Firstly, deciding who deserves help is a matter of opinion. Some artists may also spend the money badly. Secondly, many public budgets are already stretched thin. The first call on them should be basic services, such as health care, education and housing. Art matters, but it is not as urgent as needs of that kind. Artists who are already doing well can often live on what they sell. Those in popular fields, such as design or entertainment, can find private backing.", "In my view, public money should go to chosen artists. Those who add something real to the culture should come first. So should those whose work serves the public. Artists who work in schools, who make art for public places, or who work for social causes are good examples. A limited budget is then used more carefully, and art keeps its place in society."], "criteria": null, "thesis": "Government should fund some artists but not all; funding should be selective and purposeful.", "thesis_kind": "position", "outline": [{"label": "Paragraph 1", "topic": "Reasons to support artists", "subs": ["Many artists struggle financially and cannot continue their work.", "Art preserves culture and fosters creativity.", "Public support allows artists to focus on meaningful creation."]}, {"label": "Paragraph 2", "topic": "Reasons to limit funding", "subs": ["Funding decisions can be subjective or misused.", "Other public needs are more urgent.", "Some artists can rely on the market or private sources."]}, {"label": "Conclusion", "topic": "Balanced recommendation", "subs": ["Support artists who benefit the public or serve cultural/educational roles."]}], "items": {"setA": [{"word": "steady income", "sentence": "After years of casual work he finally found a job with a ____."}, {"word": "rent", "sentence": "Half of her salary goes on the ____ for a single room."}, {"word": "workable", "sentence": "The committee wanted a ____ plan, not a dream."}, {"word": "private backing", "sentence": "The museum reopened with ____ from two local companies."}, {"word": "social causes", "sentence": "She left banking to raise money for ____ in her own city."}], "setA_distractors": ["allowance", "profitable"], "setB": [{"word": "gifted", "def": "having a natural ability much greater than most people's"}, {"word": "budgets", "def": "the amounts of money a government or company plans to spend"}, {"word": "health care", "def": "the services that keep people well and treat them when they are ill"}, {"word": "housing", "def": "the houses and flats that people live in"}, {"word": "entertainment", "def": "shows, films and music that people enjoy in their free time"}], "cloze": [{"text": "earn ve
