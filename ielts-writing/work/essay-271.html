ential future ventures.", "In conclusion, while entrepreneurship offers exciting opportunities, it is not the only path to success. Young people should be supported in developing business skills but also recognize the advantages of working for established organizations. Encouragement should be flexible, allowing individuals to choose the route that best suits their abilities and circumstances."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Fully addresses the prompt with a clear opinion (balanced approach).", "Explains both benefits of entrepreneurship and advantages of traditional jobs.", "Conclusion provides nuanced perspective."]}, {"name": "Coherence And Cohesion", "band": "6.5–7", "lines": ["Structure: introduction → entrepreneurship benefits → risks of entrepreneurship → traditional employment advantages → conclusion.", "Cohesive devices: “one advantage,” “however,” “for these reasons,” “a balanced approach,” “in conclusion.”", "Logical development with clear paragraphing."]}, {"name": "Lexical Resource", "band": "6.5–7", "lines": ["Vocabulary: “independence,” “leadership skills,” “financially vulnerable,” “structured career progression,” “nuanced perspective.”", "Formal and precise; avoids informal expressions."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Mix of complex, compound, and simple sentences.", "Correct use of connectors, relative clauses, and modals.", "Grammar accurate with minor repetition for emphasis."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Entrepreneurship promoted for young people.", "Thesis: entrepreneurship valuable but not suitable for everyone; traditional jobs also important."]}, {"label": "Body Paragraph 1", "topic": "Entrepreneurship Advantages", "subs": ["Independence, decision-making, creativity, leadership.", "Potential financial rewards and job creation."]}, {"label": "Body Paragraph 2", "topic": "Risks of Entrepreneurshi
