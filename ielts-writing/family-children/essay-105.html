ppeals to duty, and an ageing workforce can also be offset by migration and by longer, healthier working lives.", "In conclusion, while remaining childfree offers flexibility and financial comfort for couples, it also raises concerns about long-term emotional well-being and demographic challenges. Individuals and societies must weigh these pros and cons when considering the broader effects of this growing trend."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Clearly addresses both advantages and disadvantages.", "Ideas are relevant and sufficiently developed."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Logical organization into clear paragraphs.", "Some transitions are smooth (however, in addition, while), but could be slightly more varied or natural."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Good range of vocabulary: emotional support, environmental impact, standard of living, aging population.", "Some minor word repetition or slightly general phrases."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5", "lines": ["Uses complex and compound sentence structures with reasonable accuracy.", "A few errors or awkward phrasings may appear but don't cause confusion."]}], "thesis": null, "thesis_kind": null, "outline": [{"label": "Introduction", "topic": "", "subs": ["Childfree trend growing in Western nations.", "Explore benefits and drawbacks."]}, {"label": "Advantages", "topic": "", "subs": ["More freedom and time.", "Financial benefits.", "Smaller environmental footprint."]}, {"label": "Disadvantages", "topic": "", "subs": ["Loneliness in old age.", "Fewer future caregivers.", "Social/economic impact of low birthrate."]}], "items": {"setA": [{"word": "childfree", "sentence": "A ____ couple keeps time that parents spend."}, {"word": "birthrate", "sentence": "A declining ____ reaches the pension system last."}, {"word": "insecure", "sentence": "____ work is named more often than preference."}, {"word": "of
