nd governments should find ways to support work-life balance so that children grow up feeling supported and connected."], "criteria": [{"name": "Task Response", "band": "7", "lines": ["Addresses both parts of the question clearly.", "Provides relevant explanations and a logical conclusion."]}, {"name": "Coherence And Cohesion", "band": "6.5", "lines": ["Paragraphs are organized logically.", "Linking devices like however, for example, in conclusion are used effectively."]}, {"name": "Lexical Resource", "band": "6.5", "lines": ["Some good vocabulary: financial pressures, emotional neglect, peer pressure.", "May lack more advanced phrasing but is clear and appropriate."]}, {"name": "Grammatical Range And Accuracy", "band": "6.5–7", "lines": ["Uses a mix of simple and complex sentence structures.", "A few minor grammar issues might appear but do not impact understanding."]}], "thesis": "Parents work more today due to modern life pressures; this affects children’s well-being.", "thesis_kind": "position", "outline": [{"label": "Causes", "topic": "", "subs": ["High cost of living", "Gender equality and dual careers", "Urban lifestyle expenses"]}, {"label": "Problems", "topic": "", "subs": ["Emotional neglect", "Weaker parent-child bond", "Behavioral and academic issues"]}], "items": {"setA": [{"word": "cost of living", "sentence": "Wages rose, but the ____ rose faster."}, {"word": "peer pressure", "sentence": "____ sells more vapes than any advert."}, {"word": "single income", "sentence": "Raising three children on a ____ means arithmetic every week."}, {"word": "isolated", "sentence": "New mothers often feel ____ in cities full of people."}, {"word": "pursue", "sentence": "She left the firm to ____ a career in teaching."}], "setA_distractors": ["expenses", "discipline"], "setB": [{"word": "gender equality", "def": "men and women getting the same chances"}, {"word": "societal norms", "def": "what a community treats as normal"}, {"word": "work-life balance", "def": "room fo
