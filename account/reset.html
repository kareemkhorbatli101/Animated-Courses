<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set a new password &middot; LearnActively</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E8B418'/%3E%3Cpath d='M11 7h4.3v13.3h6.4V25H11z' fill='%231A1200'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared.css">
<!-- The token arrives in the query string. It is used once and never stored by this page: a reset
     link is a credential for as long as it lives, and localStorage outlives the tab. -->
</head>
<body data-la-course="account">
<header class="top"><div class="wrap"><a class="brand" href="../"><b>Learn</b>Actively</a></div></header>
<main><div class="wrap">
  <h1>Set a new password</h1>
  <p class="lede">This link works once, and only for an hour after it was sent.</p>
  <p class="ar" lang="ar" dir="rtl">يعمل هذا الرابط مرّة واحدة، ولمدّة ساعة فقط.</p>

  <div id="msg" class="msg" role="status" aria-live="polite"></div>

  <form id="f" class="card">
    <label for="pw">New password <span class="muted small">at least 12 characters</span></label>
    <input id="pw" type="password" autocomplete="new-password" required>
    <label for="pw2">Type it again</label>
    <input id="pw2" type="password" autocomplete="new-password" required>
    <p class="small muted" style="margin-top:12px">Setting a new password signs you out everywhere,
      on every device. That is deliberate.</p>
    <p style="margin:18px 0 0"><button class="primary" type="submit">Set my password</button></p>
  </form>

  <p><a href="./">Back to sign in</a></p>
</div></main>
<script>
(function () {
  var token = new URLSearchParams(location.search).get('token') || '';
  var msg = document.getElementById('msg');
  function say(t, bad) { msg.textContent = t; msg.className = 'msg show ' + (bad ? 'bad' : 'good'); }
  if (!token) {
    say('This link is incomplete. Open the link from your email exactly as it was sent.', true);
    document.getElementById('f').hidden = true;
    return;
  }
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var a = document.getElementById('pw').value;
    var b = document.getElementById('pw2').value;
    if (a !== b) { say('Those two do not match.', true); return; }
    fetch('https://api.learnactively.com/auth/password/reset', {
      method: 'POST', credentials: 'include',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: token, new_password: a })
    }).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (res.ok) {
        document.getElementById('f').hidden = true;
        say('Done. Your password is changed and every other session has been signed out. '
            + 'You can sign in now.');
        // The token is spent; take it out of the address bar so it is not in the history.
        history.replaceState(null, '', location.pathname);
      } else {
        say(res.j.message || 'That link is no longer valid. Ask for a new one.', true);
      }
    })['catch'](function () {
      say('Could not reach the server. Check your connection and try again.', true);
    });
  };
}());
</script>
</body></html>
