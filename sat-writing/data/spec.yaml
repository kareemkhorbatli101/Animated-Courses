# ---------------------------------------------------------------------------
arabic:
  chapter_parts: [qaida, kayf, fakh, sila]
  chapter_headings:
    qaida: "القاعدة"
    kayf: "كيف يُختبر"
    fakh: "الفخّ"
    sila: "الصلة بالاختبار"
  chapter_words: [120, 260]
  chapter_sila_min: 20
  note_words: [25, 60]
  script_share_min: 0.92
  test_name: "سات"
  domain_names:
    HIS: "التاريخ والنظام المدني"
    BIO: "الأحياء وعلوم الأرض"
    PHY: "العلوم الفيزيائية"
    HUM: "الإنسانيات"
    SOC: "العلوم الاجتماعية"
  element_names:
    sv_agree: "مطابقة الفعل للفاعل"
    verb_tense: "زمن الفعل وجهته"
    pro_agree: "مطابقة الضمير لمرجعه"
    pro_case: "حالة الضمير ووضوحه"
    poss: "الجمع والملكية"
    modifier: "موضع العبارة الواصفة"
    parallel: "التوازي في التركيب"
    finite: "الفعل التام والجملة الناقصة"
    splice: "حدود الجملة"
    supplement: "العبارات المعترضة وترقيمها"
    colon: "النقطتان والفاصلة المنقوطة والقوائم"
    restrictive: "الوصف المحدِّد وغير المحدِّد"
    transition: "أدوات الربط"
    synthesis: "التأليف البلاغي"
    quant: "الجداول والرسوم"
  latin_allowlist: [SAT, Text, A, B, C, D]

checks:
  per_exercise: 8
  total: 6000
  book_level: 120
  exercises: 750
  parts: 75
  page_band: [260, 400]

# ---------------------------------------------------------------------------
# The rule index. [human label, the word the `why` must use].
# X8 requires the second element to appear in the exercise's `why`, so that an
# explanation names the rule it rests on instead of restating the answer. This
# table is also Appendix C.
# ---------------------------------------------------------------------------
rule_labels:
  agr_singular: ["A singular subject takes a singular verb", "singular"]
  agr_plural: ["A plural subject takes a plural verb", "plural"]
  agr_compound: ["Two subjects joined by *and* take a plural verb", "compound"]
  agr_intervening: ["A phrase between subject and verb does not change the number", "intervening"]
  agr_collective: ["A collective noun acting as one body takes a singular verb", "collective"]
  agr_indefinite: ["*Each*, *every* and *either* are singular", "indefinite"]
  agr_inverted: ["In inverted order the verb agrees with what follows it", "inverted"]
  past_simple: ["A finished action in past time takes the simple past", "simple past"]
  past_perfect_sequence: ["The earlier of two past actions takes the past perfect", "past perfect"]
  present_perfect_continuing: ["An action begun earlier and still going takes the present perfect", "present perfect"]
  present_general: ["A standing truth takes the simple present", "present"]
  past_progressive: ["An action in progress when another interrupted takes the past progressive", "progressive"]
  conditional_sequence: ["The consequence of an unreal condition takes *would*", "would"]
  pro_singular: ["A singular antecedent takes a singular pronoun", "singular"]
  pro_plural: ["A plural antecedent takes a plural pronoun", "plural"]
  pro_collective: ["A collective noun acting as one body takes a singular pronoun", "collective"]
  pro_indefinite_singular: ["*Each*, *every* and *either* take a singular pronoun", "indefinite"]
  pro_distributive: ["A distributive subject takes a singular pronoun", "distributive"]
  subject_case: ["A pronoun that is the subject of a verb takes the subject case", "subject"]
  object_case: ["A pronoun that is an object takes the object case", "object"]
  possessive_det: ["A pronoun modifying a noun takes the possessive form", "possessive"]
  who_subject: ["*Who* is the subject form", "who"]
  whom_object: ["*Whom* is the object form", "whom"]
  reflexive_proper: ["A reflexive is used only when subject and object are the same", "reflexive"]
  sing_possessive: ["A singular noun takes apostrophe-s", "singular possessive"]
  plural_possessive: ["A plural already ending in s takes the apostrophe after it", "plural possessive"]
  plural_plain: ["A plural that possesses nothing takes no apostrophe", "plural"]
  irregular_plural_poss: ["An irregular plural not ending in s takes apostrophe-s", "irregular"]
  joint_possession: ["Joint possession marks only the last name", "joint"]
  its_possessive: ["*Its* is the possessive and has no apostrophe", "its"]
  modifier_adjacent: ["A modifier stands next to what it modifies", "next to"]
  agent_named_first: ["An opening participial phrase modifies the subject that follows", "subject"]
  participle_matched: ["The participle's implied actor must be the sentence's subject", "participle"]
  squint_resolved: ["A modifier that could look both ways is moved so it looks one way", "ambiguous"]
  parallel_series: ["Items in a series take the same form", "series"]
  parallel_correlative: ["*Both-and*, *either-or*, *not only-but also* join matching forms", "correlative"]
  parallel_comparison: ["A comparison compares things of the same kind", "comparison"]
  parallel_infinitive: ["A series of infinitives keeps the infinitive form", "infinitive"]
  parallel_gerund: ["A series of gerunds keeps the -ing form", "gerund"]
  finite_main_verb: ["A sentence needs a finite main verb", "finite"]
  independent_clause: ["The words must make a clause that can stand alone", "independent"]
  subordinate_attached: ["A subordinate clause attaches to a main clause", "subordinate"]
  participle_attached: ["A participial phrase attaches to a clause; it does not replace one", "participial"]
  period_boundary: ["Two independent clauses may be separated by a period", "period"]
  semicolon_boundary: ["Two independent clauses may be joined by a semicolon", "semicolon"]
  comma_conjunction: ["A comma with a coordinating conjunction joins two independent clauses", "conjunction"]
  subordinate_boundary: ["Subordinating one clause removes the boundary problem", "subordinate"]
  paired_commas: ["A supplement set off by commas takes a comma at each end", "commas"]
  paired_dashes: ["A supplement set off by dashes takes a dash at each end", "dashes"]
  paired_parentheses: ["Parentheses come in twos", "parentheses"]
  appositive_commas: ["A nonessential appositive is enclosed in commas", "appositive"]
  no_marks_needed: ["An essential element takes no marks at all", "no marks"]
  colon_after_independent: ["A colon follows a complete clause", "colon"]
  semicolon_between_items: ["Semicolons separate list items that themselves contain commas", "semicolons"]
  comma_series: ["Plain list items are separated by commas", "commas"]
  no_mark_needed: ["No mark belongs between a verb and its object", "no mark"]
  restrictive_no_comma: ["An essential modifier takes no commas", "essential"]
  nonrestrictive_commas: ["A nonessential modifier is enclosed in commas", "nonessential"]
  restrictive_name: ["When the modifier says which one, it takes no commas", "which one"]
  nonrestrictive_name: ["When the thing is already identified, the modifier takes commas", "already identified"]
  contrast: ["The second statement runs against the first", "contrast"]
  cause: ["The second statement gives the reason for the first", "reason"]
  result: ["The second statement is the consequence of the first", "consequence"]
  addition: ["The second statement adds to the first", "adds"]
  example: ["The second statement is an instance of the first", "instance"]
  concession: ["The second statement grants a point and holds its ground", "concession"]
  sequence: ["The second statement comes next in order", "order"]
  emphasis: ["The second statement presses the first harder", "emphasis"]
  comparison: ["The second statement is like the first", "like"]
  restatement_rel: ["The second statement says the first again, more precisely", "again"]
  goal_contrast: ["The goal is to set two findings against each other", "contrast"]
  goal_cause: ["The goal is to explain why something happened", "explain"]
  goal_introduce: ["The goal is to introduce the subject to an unfamiliar reader", "introduce"]
  goal_compare: ["The goal is to compare two things on one dimension", "compare"]
  goal_finding: ["The goal is to state what the study found", "found"]
  goal_limitation: ["The goal is to state a limitation of the work", "limitation"]
  read_cell: ["The claim rests on one value in the table", "value"]
  compare_cells: ["The claim rests on the difference between two values", "difference"]
  trend_across_rows: ["The claim rests on the direction of change across rows", "direction"]
  support_claim: ["The data bear on the claim and support it", "support"]
  no_support: ["The table does not contain what the claim would need", "does not"]
