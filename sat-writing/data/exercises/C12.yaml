    مسمّى باسمه العلم كأن يقال مواد الكونفدرالية، فيكون الوصف بعده زيادة بيان محاطة بفاصلتين لا تحديداً.
  exercises:
  - n: 551
    id: C12-HIS-E01
    chapter: 12
    element: restrictive
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The clause ___ gave Congress its power over the territories.
    rule: restrictive_no_comma
    rule_span: that the convention argued over longest
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - that the convention argued over longest
    - ', which the convention argued over longest,'
    - ', which the convention argued over longest'
    - who the convention argued over longest
    key: A
    faults:
      B:
        move: restrictive_shift
        span: ', which the convention argued over longest,'
      C:
        move: unpaired
        span: ', which the convention argued over longest'
      D:
        move: wrong_relativizer
        span: who the convention argued over longest
    ctx:
      antecedent: thing
      enclosed: false
      marks_expected: 0
      pair: comma
    why: Which clause is meant has not been said, so the modifier is essential to the sentence and
      takes no commas at all.
    trap: B shuts the modifier in commas, which claims the clause has already been named and leaves
      the reader asking which one.
