chapter: 12
element: restrictive
title: Restrictive and nonrestrictive elements
home: BIO
summary_ar:
  qaida: 'الوصف المحدِّد وغير المحدِّد: إذا كان الوصف هو الذي يعيّن المقصود فلا فواصل حوله، وإذا كان
    المقصود معيّناً من قبل فالوصف زيادة بيان يُحاط بفاصلتين. والمعيار واحد: احذف الوصف واقرأ الجملة،
    فإن بقيت تدلّ على الشيء نفسه فالوصف غير محدِّد.'
  kayf: 'يعرض اختبار سات الوصف ويحذف فواصله، فتكون الخيارات أربعة: بلا فاصلة، وبفاصلة واحدة، وبفاصلتين،
    وبضمير وصل غير مطابق. والسؤال الذي يحسم الأمر: هل سُمّي الشيء قبل الوصف؟ فإن كان اسماً علماً أو
    وُصف بأنه الوحيد فالفاصلتان لازمتان.'
  fakh: الفخّ الأوّل الفاصلة الواحدة، فهي تفتح ولا تغلق، والعين لا تلحظها. والفخّ الثاني أن الفاصلتين
    تبدوان أدباً في الكتابة فتُوضعان حيث لا موضع لهما، فيصير المعنى أن كلّ الأشياء كذلك لا واحداً
    منها.
  sila: 'هذا الباب من أكثر أبواب الترقيم دوراناً في اختبار سات، وهو امتداد لفصل العبارات المعترضة،
    إلّا أن الحكم فيه معنويّ لا شكليّ: الفاصلتان تغيّران ما تدلّ عليه الجملة لا شكلها وحده.'
