chapter: 11
element: colon
title: Colons, semicolons and lists
home: PHY
summary_ar:
  qaida: 'النقطتان والفاصلة المنقوطة والقوائم: النقطتان لا تأتيان إلّا بعد جملة تامّة، وما بعدهما
    بيان لها أو قائمة. والفاصلة المنقوطة تفصل عناصر القائمة إذا كان في العناصر نفسها فواصل. والقائمة
    البسيطة تفصل بالفواصل. وما بين الفعل ومفعوله لا تدخله علامة أصلاً.'
  kayf: 'يعرض الاختبار قائمة ويحذف علامتها الأولى أو علاماتها الداخلية. والسؤال الأوّل: هل ما قبل
    العلامة جملة تامّة؟ فإن لم يكن فلا نقطتين. والسؤال الثاني: هل في العناصر فواصل؟ فإن كان فالفاصلة
    المنقوطة.'
  fakh: 'الفخّ أن النقطتين تبدوان علامة التقديم في كلّ حال، فتُوضعان بعد فعل ناقص مثل كانت أو تشمل.
    والعلاج أن تحذف القائمة وتقرأ ما قبلها وحده: فإن لم يستقم كلاماً تامّاً فلا نقطتين.'
  sila: 'هذا الباب يتكرّر في اختبار سات في صورة واحدة غالباً: نقطتان بعد كلام ناقص. وهو امتداد لفصل
    حدود الجملة، لأن السؤال في البابين واحد: هل هذا كلام تامّ؟'
