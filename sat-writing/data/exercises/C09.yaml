    - . Article Two
    key: D
    faults:
      A:
        move: comma_splice
        span: ', Article Two'
      B:
        move: run_on
        span: Article Two
      C:
        move: wrong_mark
        span: ; and Article Two
    ctx:
      left_independent: true
      mark_ok:
      - period
      marks_expected: 1
      right_independent: true
    why: Two independent clauses can simply be separated by a period, which is always available and
      never wrong.
    trap: C uses a semicolon and a conjunction together, which is one mark more than the join needs.
