# Chapter 9 - Sentence boundaries. Fifty exercises, five domains, ten each.
# Written by tools/xemit.py; checked by tools/xchecks.py.
chapter: 9
element: splice
title: Sentence boundaries
home: BIO
summary_ar:
  qaida: 'حدود الجملة تعني أن الجملتين التامّتين لا تُجمعان بفاصلة وحدها. فلهما أربع طرق: نقطة تفصلهما،
    أو فاصلة منقوطة تصلهما، أو فاصلة مع حرف عطف، أو أن تُجعل إحداهما تابعة للأخرى بأداة ربط فتزول
    المسألة من أصلها.'
  kayf: 'يعرض الاختبار جملتين تامّتين ويضع بينهما فراغاً، فتكون الخيارات: فاصلة وحدها، ولا شيء، وفاصلة
    منقوطة، وفاصلة مع حرف عطف. والسؤال واحد في كلّ مرّة: هل ما قبل الفراغ جملة تامّة وما بعده جملة
    تامّة؟'
  fakh: 'الفخّ أن الفاصلة وحدها تبدو كافية لأن المعنى متّصل. ولا تنظر إلى المعنى بل إلى التركيب: إن
    صحّ أن تضع نقطة مكان الفراغ فلا تكفي الفاصلة وحدها أبداً.'
  sila: حدود الجملة من أكثر ما يُختبر في قواعد الإنجليزية المعيارية في اختبار سات، وكان هذا الباب
    في الكتاب الثاني سهلاً في كلّ المستويات، فجاء هنا في المستويات الأربعة كلّها حتّى الصعب منها.
parts:
- domain: HIS
  partno: 41
  note_ar: جمل التاريخ والنظام المدني تضع حدثين متتابعين في جملة واحدة، فيكون كلّ منهما جملة تامّة،
    ويكون الوصل بينهما هو المسألة. والفاصلة وحدها هي الخطأ المتوقّع.
  exercises:
  - n: 401
    id: C09-HIS-E01
    chapter: 9
    element: splice
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The Declaration lists the grievances at length ___ names the king only once by title.
    rule: comma_conjunction
    rule_span: ', but it'
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - ', it'
    - ', but it'
    - it
    - ; but it
    key: B
    faults:
      A:
        move: comma_splice
        span: ', it'
      C:
        move: run_on
        span: it
      D:
        move: wrong_mark
        span: ; but it
    ctx:
      left_independent: true
      mark_ok:
      - comma
      marks_expected: 1
      right_independent: true
    why: Two independent clauses may be joined by a comma together with a coordinating conjunction.
    trap: A has the comma and not the conjunction, which is the commonest splice in English prose.
