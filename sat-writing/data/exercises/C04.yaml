summary_ar:
  qaida: 'حالة الضمير ووضوحه بابان: الحالة تعني أن الضمير يأخذ صورة الفاعل إذا كان فاعلاً، وصورة المفعول
    إذا كان مفعولاً لفعل أو لحرف جرّ، وصورة الملكية إذا أضيف إلى اسم. والوضوح يعني أن يكون للضمير
    مرجع واحد معيّن لا يحتمل غيره.'
  kayf: يضع الاختبار الضمير في تركيب معطوف مثل اسم وضمير، فيضيع الإحساس بالحالة لأن الأذن تسمع الاسم
    لا موضع الضمير. ويختبر كذلك الفرق بين صورتي الضمير الموصول في حالة الفاعل وحالة المفعول، وهو أصعب
    ما في الباب.
  fakh: الفخّ أن تحذف الاسم المعطوف فتظهر الحالة فوراً. فإذا قلت آدمز وهو كتبا، فاحذف آدمز يبقى هو
    كتب، وهي الصورة الصحيحة. والفخّ الثاني أن الضمير العائد قد يصلح لمرجعين فيبقى المعنى معلّقاً.
  sila: 'حالة الضمير تتكرّر في اختبار سات في صورة واحدة غالباً: تركيب معطوف يخفي موضع الضمير. والعلاج
    ميكانيكي لا يحتاج إلى ذوق: احذف ما عُطف عليه واقرأ الجملة. أمّا الوضوح فيعود في فصل مطابقة الضمير
    لمرجعه.'
