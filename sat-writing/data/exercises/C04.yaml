  exercises:
  - n: 151
    id: C04-HIS-E01
    chapter: 4
    element: pro_case
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: Adams and ___ had drafted separate paragraphs before the committee met to combine them.
    rule: subject_case
    rule_span: he
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - he
    - him
    - himself
    - his
    key: A
    faults:
      B:
        move: pro_case
        span: him
      C:
        move: reflexive_misuse
        span: himself
      D:
        move: pro_case
        span: his
    ctx: {}
    why: The pronoun is half of the compound subject of had drafted, so it takes the subject case.
    trap: B sounds right because Adams and him runs off the tongue like the object of a preposition.
  - n: 152
    id: C04-HIS-E02
    chapter: 4
    element: pro_case
    domain: HIS
    pos: 2
    level: 1
    difficulty: easy
    strand: HIS-S02
    carrier: The king's ministers dismissed the petition, and the colonists never forgave ___ for
      it.
    rule: object_case
    rule_span: them
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - they
    - their
    - them
    - themselves
    key: C
    faults:
      A:
        move: pro_case
        span: they
      B:
        move: pro_case
        span: their
      D:
        move: reflexive_misuse
        span: themselves
    ctx: {}
    why: The pronoun is the object of forgave, so it takes the object case.
    trap: A is the form a reader expects after a comma, where a new subject would normally begin.
