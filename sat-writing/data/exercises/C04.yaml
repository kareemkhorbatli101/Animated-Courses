    strand: HIS-S03
    carrier: The framers left the method of choosing a president to the states, and ___ choices produced
      the electoral college as it now works.
    rule: possessive_det
    rule_span: their
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - them
    - themselves
    - theirs
    - their
    key: D
    faults:
      A:
        move: pro_case
        span: them
      B:
        move: reflexive_misuse
        span: themselves
      C:
        move: pro_vague
        span: theirs
    ctx: {}
    why: The pronoun modifies the noun choices, so it takes the possessive form that can stand before
      a noun.
    trap: C is possessive but cannot stand in front of a noun, which is the one thing this position
      requires.
