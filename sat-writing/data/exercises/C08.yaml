    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The Declaration states its premise in the second sentence and its conclusion in the last;
      ___.
    rule: finite_main_verb
    rule_span: the grievances filled everything between
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - the grievances filled everything between them
    - filling everything between them
    - having filled everything between them
    - which filled everything between them
    key: A
    faults:
      B:
        move: fragment
        span: filling everything between them
      C:
        move: nonfinite_only
        span: having filled everything between them
      D:
        move: loose_subordinate
        span: which filled everything between them
    ctx: {}
    why: What follows a semicolon must be able to stand alone, which takes a subject and a finite
      verb.
    trap: B has a subject and a participle, which reads like a clause and carries no tense.
