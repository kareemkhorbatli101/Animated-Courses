chapter: 8
element: finite
title: Finite verbs and fragments
home: HIS
summary_ar:
  qaida: 'الفعل التام والجملة الناقصة بابان متلازمان: الجملة التامّة تحتاج إلى مسند ومسند إليه، وإلى
    فعل تامّ يحمل الزمن. واسم الفاعل واسم المفعول ليسا فعلاً تامّاً، فالعبارة التي ليس فيها غيرهما
    جملة ناقصة وإن طالت. والجملة الموصولة أو الشرطية لا تقوم وحدها، بل تتعلّق بجملة رئيسة.'
  kayf: يعرض الاختبار عبارة طويلة فيها اسم وصفة ومتعلّقات كثيرة ولا فعل تامّ فيها، فتبدو جملة لطولها.
    ويعرض كذلك جملتين تامّتين بينهما فاصلة، أو جملة شرطية بلا جواب، فيطلب منك أن تعيّن أيّ الصور يصحّ
    أن يقوم بنفسه.
  fakh: 'الفخّ أن الطول يوهم التمام. فعبارة من عشرين كلمة فيها اسم فاعل واحد تبدو جملة، وهي ليست جملة.
    والعلاج أن تسأل: أين الفعل الذي يحمل الزمن؟ فإن لم تجده فليست جملة.'
  sila: هذا الباب هو أساس الفصول الأربعة التي تليه في اختبار سات، لأن حدود الجملة لا تُعرف إلّا بعد
    معرفة ما يصحّ أن يكون جملة. فمن أتقنه هنا سهل عليه باب الفاصلة المنقوطة والنقطة بعده.
