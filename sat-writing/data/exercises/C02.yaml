chapter: 2
element: verb_tense
title: Verb tense and aspect
home: HIS
summary_ar:
  qaida: 'زمن الفعل وجهته بابان متلازمان: الزمن يحدّد موضع الحدث من الماضي والحاضر، والجهة تحدّد هل
    تمّ الحدث أم كان مستمرّاً أم كان سابقاً على حدث آخر. فالماضي البسيط لحدث منتهٍ مؤرَّخ، والماضي
    التامّ لأسبق حدثين ماضيين، والمضارع التامّ لحدث بدأ في الماضي ولم ينته بعد، والمضارع البسيط لحقيقة
    قائمة لا تتعلّق بوقت.'
  kayf: يضع الاختبار في الجملة حدثين ماضيين ويطلب منك أن تحدّد الأسبق، أو يضع ظرفاً يدلّ على الامتداد
    أو الأسبقية فيحصر الزمن حصراً لا يقبل غيره، أو يأتي بشرط غير واقعي في الماضي ويطلب جوابه.
  fakh: 'الفخّ أن الخيارات الأربعة كلّها سليمة نحوياً لو وُضعت في جملة أخرى. فلا تسأل أيّها صحيح في
    نفسه، بل أيّها يوافق القرينة الزمنية الموجودة في الجملة نفسها: التاريخ، أو الظرف، أو الفعل الآخر.'
  sila: زمن الفعل باب ثابت في قسم قواعد الإنجليزية المعيارية في اختبار سات، وهو من أسهل ما يُكتسب
    لأن القرينة مكتوبة في الجملة دائماً ولا تحتاج إلى معرفة خارجية. والقاعدة نفسها تعود في فصل التوازي
    حيث يجب أن تتطابق الأزمنة بين المتعاطفات.
