    options:
    - it's
    - its'
    - its
    - it
    key: C
    faults:
      A:
        move: poss_for_plural
        span: it's
      B:
        move: poss_for_plural
        span: its'
      D:
        move: wrong_plural
        span: it
    ctx: {}
    why: Its is the possessive form of it and carries no apostrophe at all, unlike every noun in this
      chapter.
    trap: A is the contraction of it is, which cannot stand in front of a noun it is meant to own.
