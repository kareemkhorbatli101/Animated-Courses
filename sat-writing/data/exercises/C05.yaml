# Chapter 5 - Plural and possessive nouns. Fifty exercises, five domains, ten each.
# Written by tools/xemit.py; checked by tools/xchecks.py.
chapter: 5
element: poss
title: Plural and possessive nouns
home: HUM
summary_ar:
  qaida: الجمع والملكية بابان يُختبران معاً لأن الفاصلة العليا هي ما يفرّق بينهما. فالاسم المفرد المالك
    يأخذ فاصلة عليا ثمّ سيناً، والجمع المنتهي بسين يأخذ الفاصلة بعد السين لا قبلها، والجمع الذي لا
    يملك شيئاً لا يأخذ فاصلة أصلاً. وجمع التكسير الذي لا ينتهي بسين يأخذ فاصلة ثمّ سيناً كالمفرد.
  kayf: 'يعرض الاختبار أربع صور للكلمة الواحدة: المفرد، والجمع، والمفرد المالك، والجمع المالك. فالسؤال
    ليس هل تعرف القاعدة بل أيّ المعاني أرادته الجملة: واحد يملك، أم كثير يملك، أم كثير لا يملك.'
  fakh: 'الفخّ أن الصور الأربع تُلفظ لفظاً واحداً تقريباً، فلا يفيد السمع شيئاً. والعلاج أن تسأل سؤالين:
    هل بعد الكلمة اسم مملوك؟ وهل المالك واحد أم أكثر؟ فجواب السؤالين يعيّن الصورة تعييناً لا يحتمل
    غيره.'
  sila: 'الجمع والملكية من أكثر أبواب قواعد الإنجليزية المعيارية تكراراً في اختبار سات، وأقلّها احتياجاً
    إلى حفظ: قاعدتان فقط تحكمان الصور الأربع. وتعود الفاصلة العليا في فصل العبارات المعترضة حيث تُستعمل
    لغرض آخر تماماً.'
parts:
- domain: HIS
  partno: 21
  note_ar: 'جمل التاريخ والنظام المدني مليئة بالمالكين الجماعيين: مطالب العمّال، وحجج الموقّعين، وقرارات
    المحكمة. وهذه كلّها جموع مالكة، وهي أصعب الصور الأربع لأن السين موجودة قبل الفاصلة.'
  exercises:
  - n: 201
    id: C05-HIS-E01
    chapter: 5
    element: poss
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The fifty-six ___ who signed the Declaration did not all sign on the same day.
    rule: plural_plain
    rule_span: signers
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - signer's
    - signers
    - signers'
    - signer
    key: B
    faults:
      A:
        move: poss_for_plural
        span: signer's
      C:
        move: poss_for_plural
        span: signers'
      D:
        move: wrong_plural
        span: signer
    ctx: {}
    why: The word is a plain plural that possesses nothing, so it takes no apostrophe.
    trap: C looks like the careful choice because the noun is plural, but a plural owning nothing
      needs no mark.
  - n: 202
    id: C05-HIS-E02
    chapter: 5
    element: poss
    domain: HIS
    pos: 2
    level: 1
    difficulty: easy
    strand: HIS-S02
    carrier: The ___ veto can be overridden only by a two-thirds vote in both chambers.
    rule: sing_possessive
    rule_span: President's
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - Presidents
    - Presidents'
    - President
    - President's
    key: D
    faults:
      A:
        move: plural_for_poss
        span: Presidents
      B:
        move: poss_misplaced
        span: Presidents'
      C:
        move: poss_missing
        span: President
    ctx: {}
    why: One officeholder owns the veto, so the noun takes the singular possessive form, apostrophe
      before the s.
    trap: B puts the apostrophe after the s, which would mean several presidents share one veto.
