  - n: 104
    id: C03-HIS-E04
    chapter: 3
    element: pro_agree
    domain: HIS
    pos: 4
    level: 2
    difficulty: medium
    strand: HIS-S04
    carrier: The convention that met at Philadelphia kept ___ proceedings secret, and the only full
      record is a delegate's private notebook.
    rule: pro_collective
    rule_span: its
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - its
    - their
    - these
    - whose
    key: A
    faults:
      B:
        move: pro_number
        span: their
      C:
        move: pro_number
        span: these
      D:
        move: pro_vague
        span: whose
    ctx:
      number: sing
    why: Convention is a collective noun acting as one body, so it takes a singular pronoun.
    trap: 'B is the commonest error here: a convention is plainly many people, but the noun that names
      it is singular.'
