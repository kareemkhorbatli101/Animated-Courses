    - their
    - its
    - one's
    - our
    key: B
    faults:
      A:
        move: pro_number
        span: their
      C:
        move: pro_vague
        span: one's
      D:
        move: person_shift
        span: our
    ctx:
      number: sing
    why: The antecedent is veto, a singular thing, so the pronoun is singular.
    trap: A is pulled plural by chambers at the end of the sentence, which is not the antecedent.
