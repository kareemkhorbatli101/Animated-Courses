# Chapter 3 - Pronoun-antecedent agreement. Fifty exercises, five domains, ten each.
# Written by tools/xemit.py; checked by tools/xchecks.py.
chapter: 3
element: pro_agree
title: Pronoun-antecedent agreement
home: SOC
summary_ar:
  qaida: مطابقة الضمير لمرجعه تعني أن الضمير يوافق الاسم الذي ينوب عنه في العدد، وأن يكون ذلك الاسم
    معروفاً لا محتملاً لأكثر من وجه. فالمرجع المفرد يأخذ ضميراً مفرداً، والجمع يأخذ جمعاً، وأسماء
    الجمع مثل اللجنة والعيّنة تُعامل معاملة المفرد حين تعمل عملاً واحداً.
  kayf: يضع الاختبار مرجعاً مفرداً ليس إنساناً، مثل العيّنة أو القانون أو النوع، ثمّ يضع بعده ضميراً
    جمعاً لأن الاسم يدلّ على كثرة في المعنى. ويضع كذلك ضمائر مبهمة مثل كلّ وأيّ، وهي مفردة دائماً
    وإن جاء بعدها جمع.
  fakh: الفخّ أن المعنى يدلّ على الكثرة والنحو يدلّ على الإفراد. فاللجنة فيها أعضاء كثيرون، والعيّنة
    فيها أسر كثيرة، لكنّ الاسم مفرد فالضمير مفرد. والعلاج أن تنظر إلى الاسم لا إلى ما يحتويه.
  sila: 'مطابقة الضمير لمرجعه تتكرّر في اختبار سات بالقدر نفسه الذي تتكرّر فيه مطابقة الفعل للفاعل،
    والقاعدة واحدة في البابين: ابحث عن الاسم الحاكم لا عن أقرب اسم. فإذا أتقنت الفصل الأوّل كان هذا
    الفصل امتداداً له لا باباً جديداً.'
parts:
- domain: HIS
  partno: 11
  note_ar: 'في جمل التاريخ والنظام المدني يكون المرجع في الغالب مؤسّسة أو نصّاً: الكونغرس، والمحكمة،
    والدستور، والقانون. وهذه كلّها مفردة في النحو وإن كانت جماعات في المعنى، وهذا موضع الخطأ.'
  exercises:
  - n: 101
    id: C03-HIS-E01
    chapter: 3
    element: pro_agree
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The signers pledged ___ lives, fortunes and sacred honor in the Declaration's final sentence.
    rule: pro_plural
    rule_span: their
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - its
    - his
    - whose
    - their
    key: D
    faults:
      A:
        move: pro_number
        span: its
      B:
        move: pro_number
        span: his
      C:
        move: pro_vague
        span: whose
    ctx:
      number: plur
    why: The antecedent is signers, a plural noun, so the pronoun that stands for it is plural.
    trap: A takes the Declaration as the antecedent, though what is pledged belongs to the signers.
