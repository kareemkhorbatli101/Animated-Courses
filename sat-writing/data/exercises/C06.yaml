  - n: 258
    id: C06-HIS-E08
    chapter: 6
    element: modifier
    domain: HIS
    pos: 8
    level: 3
    difficulty: hard
    strand: HIS-S08
    carrier: The dispatches that the colonial office in London answered, often after the situation
      they reported had already changed beyond recognition, ___ the state of the territory.
    rule: squint_resolved
    rule_span: slowly described
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - described slowly conditions in
    - described conditions slowly in
    - conditions described slowly in
    - slowly described conditions in
    key: D
    faults:
      A:
        move: misplaced
        span: described slowly conditions
      B:
        move: squinting
        span: described conditions slowly
      C:
        move: misplaced
        span: conditions described slowly
    ctx: {}
    why: Placed in front of the verb it modifies, slowly can only describe the describing and is no
      longer ambiguous between two verbs.
    trap: B leaves the adverb where it could belong either to answered or to described, which is the
      ambiguous reading the item is testing.
  - n: 259
    id: C06-HIS-E09
    chapter: 6
    element: modifier
    domain: HIS
    pos: 9
    level: 4
    difficulty: hard
    strand: HIS-S09
    carrier: Suspended by the president in the first year of the war, upheld by an act of Congress
      two years after that, and never squarely tested in the Supreme Court while the fighting continued,
      ___.
    rule: participle_matched
    rule_span: the writ of habeas corpus
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - Lincoln defended the suspension as a necessity of war
    - the writ of habeas corpus was restored only after the war ended
    - the question of who may suspend it has never been settled
    - it remained an open question for the whole of the century
    key: B
    faults:
      A:
        move: agent_mismatch
        span: Lincoln defended the suspension
      C:
        move: dangler
        span: the question of who
      D:
        move: dangler
        span: it remained an open question
    ctx: {}
    why: All three opening participles describe the same thing being acted upon, so the subject of
      the main clause must be that thing.
    trap: A names the man who suspended the writ, who is the agent of the first participle rather
      than what it describes.
  - n: 260
    id: C06-HIS-E10
    chapter: 6
    element: modifier
    domain: HIS
    pos: 10
    level: 4
    difficulty: hard
    strand: HIS-S10
    carrier: Historians of the penny press have argued that the editors who courted partisan readers
      in the 1830s ___ the circulation figures that made the papers worth buying, which is a claim
      about cause that the surviving ledgers can neither confirm nor refute.
    rule: squint_resolved
    rule_span: deliberately inflated
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - inflated deliberately
    - inflated the deliberately
    - inflated and deliberately
    - deliberately inflated
    key: D
    faults:
      A:
        move: squinting
        span: inflated deliberately
      B:
        move: misplaced
        span: inflated the deliberately
      C:
        move: misplaced
        span: inflated and deliberately
    ctx: {}
    why: Put in front of the verb, deliberately can only describe the inflating and is no longer ambiguous
      between courted and inflated.
    trap: A leaves the adverb between two verbs, where it could qualify either the courting or the
      inflating.
