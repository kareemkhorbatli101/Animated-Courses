# Chapter 6 - Modifier placement. Fifty exercises, five domains, ten each.
# Written by tools/xemit.py; checked by tools/xchecks.py.
chapter: 6
element: modifier
title: Modifier placement
home: PHY
summary_ar:
  qaida: 'موضع العبارة الواصفة هو القاعدة التي تقول إن العبارة تصف ما تجاوره، فلا بدّ أن تجاور ما
    تصفه. والصورة الأشهر هي العبارة التي تفتتح الجملة وتنتهي بفاصلة: فاعل الجملة بعدها هو الذي تصفه،
    فإن كان غيره صارت العبارة معلّقة لا صاحب لها.'
  kayf: 'يثبّت الاختبار العبارة الواصفة في أوّل الجملة ويجعل الفراغ في الجملة الرئيسة، فيصير السؤال:
    أيّ فاعل يصحّ أن توصف به هذه العبارة؟ ويستعمل كذلك الظرف الذي يصلح أن يتعلّق بفعلين قبله وبعده
    فيبقى المعنى مزدوجاً.'
  fakh: 'الفخّ أن الجملة المعلّقة تُقرأ قراءة سليمة ولا يشعر القارئ بشيء، لأن العقل يصحّح المعنى من
    تلقاء نفسه. والعلاج أن تسأل سؤالاً واحداً صريحاً: من فعل ما تصفه العبارة؟ ثمّ تنظر هل هو فاعل
    الجملة أم لا.'
  sila: موضع العبارة الواصفة من الأبواب التي تتكرّر في اختبار سات بصورة واحدة تكاد لا تتغيّر، فمعرفة
    الصورة تكفي. والمهارة نفسها تنفع في الفهم القرائي، لأن تحديد صاحب العبارة هو تحديد المعنى.
parts:
- domain: HIS
  partno: 26
  note_ar: 'جمل التاريخ والنظام المدني تفتتح بعبارات تصف أحداثاً جرت قبل الجملة الرئيسة: بعد مداولات
    طويلة، وبعد أن طُبع النصّ. وصاحب العبارة في هذه الجمل كثيراً ما يكون غائباً عن الجملة الرئيسة
    تماماً.'
  exercises:
  - n: 251
    id: C06-HIS-E01
    chapter: 6
    element: modifier
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: Printed overnight by a Philadelphia shop and sent north by riders the next morning, ___.
    rule: modifier_adjacent
    rule_span: the text
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - Washington read it to the army on July ninth
    - it took four days for the news to arrive in New York
    - the text reached New York within four days
    - reading it aloud took the better part of an hour
    key: C
    faults:
      A:
        move: agent_mismatch
        span: Washington read it
      B:
        move: dangler
        span: it took four days
      D:
        move: dangler
        span: reading it aloud
    ctx: {}
    why: The opening phrase describes what was printed and sent, so the noun standing next to it has
      to be the text.
    trap: A reads naturally because Washington did receive the document, but he is not what the printer
      printed.
  - n: 252
    id: C06-HIS-E02
    chapter: 6
    element: modifier
    domain: HIS
    pos: 2
    level: 1
    difficulty: easy
    strand: HIS-S02
    carrier: Having spent four months in debate over representation and the slave trade, ___.
    rule: agent_named_first
    rule_span: the delegates
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - the delegates signed a document none of them entirely approved
    - Madison's notes record the last day in unusual detail
    - the document was signed by thirty-nine of the fifty-five
    - approval was far from unanimous
    key: A
    faults:
      B:
        move: agent_mismatch
        span: Madison's notes record
      C:
        move: dangler
        span: the document was signed
      D:
        move: dangler
        span: approval was far
    ctx: {}
    why: The opening participle needs the subject of the main clause to be whoever spent the four
      months, and only the delegates did.
    trap: C is in the passive and so hides the agent, which is exactly how a dangling modifier survives
      a first reading.
  - n: 253
    id: C06-HIS-E03
    chapter: 6
    element: modifier
    domain: HIS
    pos: 3
    level: 2
    difficulty: easy
    strand: HIS-S03
    carrier: Written into the Naturalization Act of 1790 and then left standing in the statute books
      for eighty years without serious challenge, ___.
    rule: modifier_adjacent
    rule_span: the phrase
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - Congress did not remove the racial bar until after the Civil War
    - the phrase free white person decided who could be naturalized
    - naturalization was open only to a part of the population
    - it was a restriction nobody in 1790 thought remarkable
    key: B
    faults:
      A:
        move: agent_mismatch
        span: Congress did not remove
      C:
        move: dangler
        span: naturalization was open
      D:
        move: dangler
        span: it was a restriction
    ctx: {}
    why: The opening phrase describes what was written into the Act, so the noun next to it must be
      the phrase itself.
    trap: A names the body that wrote the words, which is the agent of the modifier rather than the
      thing modified.
  - n: 254
    id: C06-HIS-E04
    chapter: 6
    element: modifier
    domain: HIS
    pos: 4
    level: 2
    difficulty: medium
    strand: HIS-S04
    carrier: Arguing on a public platform that the claim of natural rights could not be limited by
      the color of a man's skin, ___.
    rule: participle_matched
    rule_span: Douglass
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - the speech at Rochester has been reprinted ever since
    - his audience at Rochester heard the whole of it in silence
    - it was a case the Constitution itself seemed to concede
    - Douglass turned the Fourth of July into an accusation
    key: D
    faults:
      A:
        move: dangler
        span: the speech at Rochester
      B:
        move: agent_mismatch
        span: his audience at Rochester
      C:
        move: dangler
        span: it was a case
    ctx: {}
    why: The participle arguing needs a person as its implied actor, and the subject of the main clause
      has to be that person.
    trap: A is tempting because the speech does contain the argument, but a speech cannot be the one
      doing the arguing.
  - n: 255
    id: C06-HIS-E05
    chapter: 6
    element: modifier
    domain: HIS
    pos: 5
    level: 2
    difficulty: medium
    strand: HIS-S05
    carrier: Occupied by federal troops for the better part of a decade and then left to the governments
      that replaced them, ___.
    rule: agent_named_first
    rule_span: the former Confederate states
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - Reconstruction ended with a bargain over a disputed election
    - it was a settlement that lasted until the 1960s
    - the former Confederate states rewrote their constitutions twice
    - disenfranchisement followed within twenty years
    key: C
    faults:
      A:
        move: agent_mismatch
        span: Reconstruction ended
      B:
        move: dangler
        span: it was a settlement
      D:
        move: dangler
        span: disenfranchisement followed
    ctx: {}
    why: The opening phrase describes what was occupied, so the subject of the main clause must be
      the places that were under occupation.
    trap: A names the period rather than the territory, and a period of time cannot be occupied by
      troops.
  - n: 256
    id: C06-HIS-E06
    chapter: 6
    element: modifier
    domain: HIS
    pos: 6
    level: 3
    difficulty: medium
    strand: HIS-S06
    carrier: Having watched a hundred and forty-six garment workers die in a fire whose exits had
      been locked from the outside to stop the women leaving early, ___.
    rule: participle_matched
    rule_span: the state commission
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - the factory was rebuilt to a new standard within two years
    - the state commission wrote thirty-eight bills in eighteen months
    - the owners of the building were acquitted of manslaughter
    - fire regulations were rewritten across the whole of New York
    key: B
    faults:
      A:
        move: dangler
        span: the factory was rebuilt
      C:
        move: agent_mismatch
        span: the owners of the building
      D:
        move: dangler
        span: fire regulations were rewritten
    ctx: {}
    why: The participle having watched requires an actor who can watch, so the subject of the main
      clause must be people rather than a building or a rule.
    trap: D is the historical consequence and reads as the natural continuation, but regulations cannot
      watch anything.
  - n: 257
    id: C06-HIS-E07
    chapter: 6
    element: modifier
    domain: HIS
    pos: 7
    level: 3
    difficulty: medium
    strand: HIS-S07
