# Written by tools/xemit.py; checked by tools/xchecks.py.
chapter: 15
element: quant
title: Tables and graphs
home: SOC
summary_ar:
  qaida: 'الجداول والرسوم: الدعوى لا يسندها إلّا الرقم الذي يتعلّق بها. فإن طُلب رقم واحد فخذه من
    خانته، وإن طُلبت مقارنة فخذ الرقمين على جهتهما الصحيحة، وإن طُلب اتّجاه فاقرأ الصفوف كلّها لا
    صفّين منها.'
  kayf: يعرض اختبار سات جدولاً صغيراً ودعوى، ثمّ يسأل عن الخيار الذي يسندها. والخيارات الأربعة كلّها
    أرقام من الجدول، لكن واحداً منها فقط يتعلّق بالدعوى. فاقرأ الدعوى أوّلاً وحدّد الخانة التي تحتاجها
    قبل أن تنظر في الخيارات.
  fakh: الفخّ الأوّل خيار يقرأ الصفّ الخطأ، والثاني خيار يقلب جهة المقارنة، والثالث خيار يزيد على
    الجدول سبباً ليس فيه. والجدول يقول ماذا حدث ولا يقول لماذا حدث أبداً.
  sila: هذا الباب هو مقياس الدليل الكمّي في اختبار سات، ويأتي في القسم الكتابيّ وفي القراءة معاً.
    وهو الباب الوحيد في هذا الكتاب الذي لا تكفي فيه اللغة وحدها، إذ يلزم فيه قراءة الرقم.
parts:
- domain: HIS
  partno: 71
  note_ar: جداول التاريخ والنظام المدني تعرض الإيرادات والأصوات والسكّان على السنين، والفخّ فيها أن
    يُقرأ سبب الحادثة من الجدول، والجدول لا يذكر إلّا مقدارها. ومن هنا جاء في هذا المجال أكثر أسئلة
    ما لا يسنده الجدول.
  exercises:
  - n: 701
    id: C15-HIS-E01
    chapter: 15
    element: quant
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    table:
      title: Federal revenue by source, 1800 and 1830 (per cent of total)
      cols:
      - Source
      - '1800'
      - '1830'
      rows:
      - - Customs duties
        - '84'
        - '88'
      - - Public land sales
        - '1'
        - '9'
      - - Internal taxes
        - '15'
        - '3'
    claim: A student claims that the federal government of 1830 depended on customs duties for most
      of its revenue.
    rule: read_cell
    rule_span: customs duties were 88 per cent of federal revenue
    stem: Which choice best describes data from the table that support the student's claim?
    options:
    - In 1830 public land sales were 88 per cent of federal revenue.
    - Internal taxes fell from 15 per cent of revenue in 1800 to 3 per cent in 1830.
    - Customs duties were the only source of federal revenue in 1830.
    - In 1830 customs duties were 88 per cent of federal revenue.
    key: D
    faults:
      A:
        move: misread_row
        span: public land sales were 88 per cent
      B:
        move: true_not_asked
        span: Internal taxes fell from 15 per cent
      C:
        move: overreach
        span: the only source of federal revenue
    ctx: {}
    why: The claim rests on one value in the table, and that value is the 88 per cent of revenue that
      customs duties supplied in 1830.
    trap: A takes the right number from the wrong row, which is the commonest way to lose this question.
