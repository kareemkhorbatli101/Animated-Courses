    stem: Which choice best states a conclusion the table supports?
    options:
    - The table shows that patenting rose decade by decade but does not say what lay behind the rise.
    - The rise in patenting after 1850 followed the spread of the railroad network across the country.
    - The rise in patenting shows that Americans had become more inventive than other peoples.
    - Patenting rose until 1870 and then fell away in the following decade.
    key: A
    faults:
      B:
        move: imported
        span: followed the spread of the railroad network
      C:
        move: overreach
        span: had become more inventive than other peoples
      D:
        move: misread_row
        span: rose until 1870 and then fell away
    ctx: {}
    why: The table gives how many patents were issued and does not give the reason any of them were,
      so a cause cannot be read out of it.
    trap: B offers a cause that is plausible and is nowhere in the table, which is what makes it the
      most attractive of the three wrong answers.
