    rule_span: the number of dailies fell at every reading while total circulation rose at every reading
    stem: Which choice best states a conclusion the table supports?
    options:
    - Between 1910 and 1970 both the number of dailies and total circulation fell.
    - By 1970 the newspaper business had entered a decline it would not recover from.
    - Between 1910 and 1970 the number of dailies fell at every reading while total circulation rose
      at every reading.
