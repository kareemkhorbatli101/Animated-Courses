      - - Philadelphia
        - '121'
        - 1,294
      - - Chicago
        - '30'
        - 1,699
      - - New Orleans
        - '116'
        - '287'
    claim: A student claims that Chicago gained more people between 1850 and 1900 than Philadelphia
      did.
    rule: compare_cells
    rule_span: Chicago gained about 1,669,000 people and Philadelphia about 1,173,000
    stem: Which choice best describes data from the table that support the student's claim?
    options:
    - Philadelphia gained about 1,669,000 people and Chicago about 1,173,000.
    - Chicago gained about 1,669,000 people and New Orleans about 171,000.
    - Chicago gained about 1,669,000 people and Philadelphia about 1,173,000.
    - Chicago gained more people after 1850 than any other city in the country.
    key: C
    faults:
      A:
        move: reversed_comparison
        span: Philadelphia gained about 1,669,000 people
      B:
        move: true_not_asked
        span: New Orleans about 171,000
      D:
        move: overreach
        span: than any other city in the country
    ctx: {}
    why: The claim rests on the difference between two pairs of values, so the supporting sentence
      has to give the gain of each of the two cities named.
    trap: A has both figures right and attaches each to the wrong city, which turns the claim on its
      head.
