    rule_span: 2.3 million, from 2.6 million in the 1850s
    stem: Which choice most effectively uses data from the table to complete the statement?
    options:
    - 2.6 million, the figure for the 1850s.
    - 2.3 million, from 2.6 million in the 1850s.
    - 2.8 million, the highest of the four decades.
    - 2.3 million, the lowest total of the century.
    key: B
    faults:
      A:
        move: misread_row
        span: 2.6 million, the figure for the 1850s
      C:
        move: true_not_asked
        span: 2.8 million, the highest of the four decades
      D:
        move: overreach
        span: 2.3 million, the lowest total of the century
    ctx: {}
    why: The statement needs the value for the 1860s, and the table gives it as 2.3 million against
      2.6 in the decade before.
    trap: D gives the right figure and then calls it the lowest of a century the table does not cover.
