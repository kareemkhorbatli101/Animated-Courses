    claim: A student is studying the movement of Americans out of farm work between 1870 and 1960.
    rule: trend_across_rows
    rule_span: fell at every reading between 1870 and 1960
    stem: Which choice best states a conclusion the table supports?
    options:
    - The share of the labor force in agriculture rose between 1870 and 1900 and fell after that.
    - Agriculture had almost disappeared from the American economy by 1960.
    - In 1930 just over a fifth of the labor force worked in agriculture.
    - The share of the labor force in agriculture fell at every reading between 1870 and 1960.
    key: D
    faults:
      A:
        move: misread_row
        span: rose between 1870 and 1900
      B:
        move: overreach
        span: had almost disappeared from the American economy
      C:
        move: true_not_asked
        span: just over a fifth of the labor force
    ctx: {}
    why: A conclusion about movement out of farm work is a claim about direction, and the four readings
      fall one after another without exception.
    trap: B reads eight per cent of the labor force as almost nothing, which is a judgment and not
      a reading.
