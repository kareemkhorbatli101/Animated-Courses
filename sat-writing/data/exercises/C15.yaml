        move: overreach
        span: had entered a decline it would not recover from
      D:
        move: true_not_asked
        span: there were 1,942 daily newspapers
    ctx: {}
    why: The table holds two columns moving in opposite directions, and a conclusion about the business
      has to give the direction of both.
    trap: A reads the two columns as though they moved together, which is the conclusion the table
