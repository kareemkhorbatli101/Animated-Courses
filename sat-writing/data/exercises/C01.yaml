# Chapter 1 - Subject-verb agreement. Fifty exercises, five domains, ten each.
# Written by tools/xemit.py; checked by tools/xchecks.py.
chapter: 1
element: sv_agree
title: Subject-verb agreement
home: BIO
summary_ar:
  qaida: مطابقة الفعل للفاعل تعني أن الفعل يوافق فاعله في العدد، لا يوافق أقرب اسم إليه. الفاعل المفرد
    يأخذ فعلاً مفرداً، والفاعل الجمع يأخذ فعلاً جمعاً، وما يقع بين الفاعل والفعل من عبارات جارّة أو
    جمل وصفية لا يغيّر العدد مهما طال.
  kayf: يضع الاختبار بين الفاعل والفعل عبارة طويلة تنتهي باسم مخالف للفاعل في العدد، فيختار الطالب
    الفعل الذي يوافق الاسم القريب. ويستعمل كذلك أسماء الجمع مثل اللجنة والفريق، والضمائر المبهمة مثل
    كلّ وأيّ، والترتيب المقلوب الذي يأتي فيه الفاعل بعد الفعل.
  fakh: الفخّ الأكبر هو الاسم القريب. حين تقرأ الجملة بسرعة تسمع آخر اسم قبل الفراغ فتوافقه، وهو في
    الغالب ليس الفاعل. العلاج أن تحذف ما بين الفاعل والفعل ثم تقرأ الجملة من جديد.
  sila: 'مطابقة الفعل للفاعل من أكثر ما يتكرر في قسم قواعد الإنجليزية المعيارية في اختبار سات، وهي
    أرخص الدرجات لأن القاعدة واحدة والعلاج ميكانيكي: احذف العبارة المعترضة، وجد الفاعل، ثم طابق. وتعود
    القاعدة نفسها في مطابقة الضمير لمرجعه في الفصل الثالث.'
parts:
- domain: HIS
  partno: 1
  note_ar: 'جمل التاريخ والنظام المدني مليئة بالعبارات المعترضة التي تسمّي الأشخاص والمناصب والتواريخ،
    وهذه العبارات هي بيت الفخّ في هذا الفصل: تفصل الفاعل عن فعله بأسطر، وتضع قبل الفراغ اسماً مخالفاً
    له في العدد.'
  exercises:
  - n: 1
    id: C01-HIS-E01
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The grievances ___ the longest single section of the Declaration of Independence, by
      far.
    rule: agr_plural
    rule_span: form
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - forms
    - form
    - has formed
    - is forming
    key: B
    faults:
      A:
        move: wrong_number
        span: forms
      C:
        move: wrong_number
        span: has formed
      D:
        move: wrong_aspect
        span: is forming
    ctx:
      number: plur
    why: The subject is the plural noun grievances standing immediately before the blank, so the verb
      takes the plural form.
    trap: A is tempting because section, the nearest singular noun, follows the blank and seems to
      govern the verb.
  - n: 2
    id: C01-HIS-E02
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 2
    level: 1
    difficulty: easy
    strand: HIS-S02
    carrier: The Constitution ___ three branches and sets out what each one may and may not do.
    rule: agr_singular
    rule_span: establishes
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - have established
    - establish
    - is establishing
    - establishes
    key: D
    faults:
      A:
        move: wrong_number
        span: have established
      B:
        move: wrong_number
        span: establish
      C:
        move: wrong_aspect
        span: is establishing
    ctx:
      number: sing
    why: The subject is Constitution, a singular noun, so the verb takes the singular form even though
      branches is plural.
    trap: B drops the third-person s, which sounds right to an ear used to plural subjects like laws
      or powers.
  - n: 3
    id: C01-HIS-E03
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 3
    level: 2
    difficulty: easy
    strand: HIS-S03
    carrier: The records that survive from the first federal census ___ a population of just under
      four million people in sixteen states.
    rule: agr_plural
    rule_span: have shown
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - have shown
    - shows
    - has shown
    - showed
    key: A
    faults:
      B:
        move: agree_with_nearest
        span: shows
      C:
        move: wrong_number
        span: has shown
      D:
        move: tense_shift
        span: showed
    ctx:
      number: plur
    why: The plural subject is records; census is the object of a preposition and cannot govern the
      verb, so the plural form is right.
    trap: B agrees with census, the singular noun nearest the blank, rather than with the plural subject
      records.
  - n: 4
    id: C01-HIS-E04
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 4
    level: 2
    difficulty: medium
    strand: HIS-S04
    carrier: The argument that slavery violated the natural rights of all men ___ at the center of
      abolitionist pamphlets for forty years.
    rule: agr_intervening
    rule_span: has remained
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - have remained
    - remain
    - has remained
    - is remaining
    key: C
    faults:
      A:
        move: agree_with_nearest
        span: have remained
      B:
        move: agree_with_nearest
        span: remain
      D:
        move: wrong_aspect
        span: is remaining
    ctx:
      number: sing
    why: The subject is argument, and the clause between it and the verb is intervening material that
      cannot change the number.
    trap: A takes its number from men, the plural noun that the intervening clause leaves nearest
      the blank.
  - n: 5
    id: C01-HIS-E05
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 5
    level: 2
    difficulty: medium
    strand: HIS-S05
    carrier: The Freedmen's Bureau and the Union army together ___ the only federal presence in much
      of the South after 1865.
    rule: agr_compound
    rule_span: were
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - was
    - were
    - has been
    - had been
    key: B
    faults:
      A:
        move: wrong_number
        span: was
      C:
        move: wrong_number
        span: has been
      D:
        move: tense_shift
        span: had been
    ctx:
      number: plur
    why: Two subjects joined by and make a compound subject, which is plural however singular each
      part may be.
    trap: A agrees with army alone, the noun closest to the blank, and misses that the subject is
      compound.
  - n: 6
    id: C01-HIS-E06
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 6
    level: 3
    difficulty: medium
    strand: HIS-S06
    carrier: The committee that Congress appointed to investigate the Chicago packinghouses ___ unanimous
      in its findings, and the Meat Inspection Act followed within a few months of the report.
    rule: agr_collective
    rule_span: was
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - was
    - is
    - were
    - have been
    key: A
    faults:
      B:
        move: tense_shift
        span: is
      C:
        move: wrong_number
        span: were
      D:
        move: agree_with_nearest
        span: have been
    ctx:
      number: sing
    why: Committee is a collective noun acting here as one body, so it takes a singular verb and the
      singular pronoun its.
    trap: D agrees with packinghouses, the plural noun the relative clause leaves beside the blank.
  - n: 7
    id: C01-HIS-E07
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 7
    level: 3
    difficulty: medium
    strand: HIS-S07
    carrier: The series of sit-ins that students began at lunch counters across the upper South in
      1960 ___ organized by people who had trained together in workshops on nonviolence.
    rule: agr_intervening
    rule_span: was
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - were
    - have been
    - are
    - was
    key: D
    faults:
      A:
        move: agree_with_nearest
        span: were
      B:
        move: wrong_number
        span: have been
      C:
        move: wrong_number
        span: are
    ctx:
      number: sing
    why: The subject is series, a singular noun; everything from of to 1960 is intervening material
      and leaves the number alone.
    trap: A agrees with sit-ins, which the intervening phrase makes the loudest plural in the sentence.
  - n: 8
    id: C01-HIS-E08
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 8
    level: 3
    difficulty: hard
    strand: HIS-S08
    carrier: Each of the mandates that the League of Nations created after the First World War ___
      administered by a European power required to report annually on its progress.
    rule: agr_indefinite
    rule_span: was
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - were
    - has been
    - was
    - is
    key: C
    faults:
      A:
        move: wrong_number
        span: were
      B:
        move: tense_shift
        span: has been
      D:
        move: tense_shift
        span: is
    ctx:
      number: sing
    why: Each is an indefinite pronoun and is singular, so the verb is singular however many mandates
      the phrase after it names.
    trap: A agrees with mandates and ignores Each, the pronoun that is the real subject of the sentence.
  - n: 9
    id: C01-HIS-E09
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 9
    level: 4
    difficulty: hard
    strand: HIS-S09
    carrier: Among the powers that Congress has claimed in wartime and the courts have been reluctant
      to review ___ the suspension of habeas corpus, the internment of civilians, and the censorship
      of the mails, each of which was later called a mistake.
    rule: agr_inverted
    rule_span: are
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - are
    - is
    - has been
    - was being
    key: A
    faults:
      B:
        move: wrong_number
        span: is
      C:
        move: agree_with_nearest
        span: has been
      D:
        move: wrong_aspect
        span: was being
    ctx:
      number: plur
    why: 'The order is inverted: the subject is the list of three powers that follows the verb, and
      a list of three is plural.'
    trap: B agrees with review, the singular word the inverted order leaves directly in front of the
      blank.
  - n: 10
    id: C01-HIS-E10
    chapter: 1
    element: sv_agree
    domain: HIS
    pos: 10
    level: 4
    difficulty: hard
    strand: HIS-S10
    carrier: The claim, repeated in editorials across the country and tested by pollsters only decades
      later, that a newspaper's endorsement moves a measurable number of votes ___ by evidence strong
      enough to settle the question either way.
    rule: agr_intervening
    rule_span: has never been supported
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - have never been supported
    - were never supported
    - has never been supported
    - is never being supported
    key: C
    faults:
      A:
        move: agree_with_nearest
        span: have never been supported
      B:
        move: wrong_number
        span: were never supported
      D:
        move: wrong_aspect
        span: is never being supported
    ctx:
      number: sing
    why: The subject is claim; two intervening elements, a participial phrase and a that-clause, stand
      between it and the verb without changing its number.
    trap: A agrees with votes, the plural noun the intervening that-clause leaves immediately before
      the blank.
