    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The canal cut freight costs to a tenth of what they had been. ___ it cut the journey
      from weeks to days.
    rule: addition
    rule_span: Moreover,
    stem: Which choice completes the text with the most logical transition?
    options:
    - Nevertheless,
    - Moreover,
    - For instance,
    - Meanwhile,
    key: B
    faults:
      A:
        move: wrong_direction
        span: Nevertheless,
      C:
        move: near_miss
        span: For instance,
      D:
        move: no_relation
        span: Meanwhile,
