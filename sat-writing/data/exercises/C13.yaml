chapter: 13
element: transition
title: Transitions
home: SOC
summary_ar:
  qaida: 'أدوات الربط: الأداة تُعلن ما بين الجملتين من صلة، فإمّا أن تضيف الثانية إلى الأولى، أو تخالفها،
    أو تكون نتيجة لها، أو سبباً لها، أو مثالاً عليها، أو إعادة لها بعبارة أدقّ. والصلة تُقرأ من الجملتين
    لا من الأداة.'
  kayf: يحذف اختبار سات الأداة ويعرض أربعاً، وكلّها صحيحة في نفسها. فالطريق أن تغطّي الخيارات وتقرأ
    الجملتين وتقول الصلة بينهما بلغتك، ثمّ تختار الأداة التي تقولها. ومن قرأ الخيارات أوّلاً وجد كلّ
    واحدة منها مقبولة.
  fakh: 'الفخّ الأكبر أداة الاتّجاه المعاكس: تقول الجملتان شيئاً واحداً فتأتي لكنْ، أو تتخالفان فتأتي
    لذلك. والفخّ الثاني أداة قريبة لا مطابقة، كأن توضع للمثال موضع الإيضاح.'
  sila: هذا الباب من أكثر أبواب القسم الكتابيّ في اختبار سات ورودًا، ويتكرّر في كلّ اختبار مرّات.
    وهو يقيس القراءة لا القواعد، لأن الأداة لا تُعرف إلّا بفهم الجملتين.
