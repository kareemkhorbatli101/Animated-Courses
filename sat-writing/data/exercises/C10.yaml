summary_ar:
  qaida: 'العبارات المعترضة وترقيمها: العبارة التي تعترض الجملة ولا تلزم لتحديد المعنى تُحاط بعلامتين
    من جنس واحد، فاصلتين أو شرطتين أو قوسين. والعلامة التي فتحت هي التي تغلق، ولا يُفتح بشرطة ويُغلق
    بفاصلة. وما كان لازماً لتحديد المقصود لا يُحاط بشيء أصلاً.'
  kayf: 'يعرض الاختبار عبارة معترضة ويحذف علامتيها، فتكون الخيارات: علامتان متفقتان، وعلامة واحدة،
    وعلامتان مختلفتان، ولا علامة. والسؤال سؤالان: هل العبارة لازمة؟ فإن لم تكن لازمة فهل أُغلقت بما
    فُتحت به؟'
  fakh: 'الفخّ أن العلامة الأولى تُقرأ ثمّ يطول الكلام فتُنسى، فيُغلق بغيرها أو لا يُغلق أصلاً. والعلاج
    أن تحذف العبارة المعترضة كلّها فتقرأ الجملة بدونها: فإن استقامت فالعبارة غير لازمة وتحتاج إلى
    علامتين.'
  sila: 'هذا الباب من أكثر ما يتكرّر في اختبار سات بعد حدود الجملة، وهو أسهل منه لأن العلاج ميكانيكي:
    احذف ما بين العلامتين. ويتّصل بالفصل الذي يليه في النقطتين، وبالفصل الثاني عشر في الوصف المحدِّد.'
