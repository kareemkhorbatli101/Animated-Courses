    rule: goal_contrast
    rule_span: Southern land was often claimed by metes and bounds that followed streams and trees
    stem: Which choice most effectively uses relevant information from the notes to emphasize a difference
      between the two ways of describing land?
    options:
    - Because the Northwest was surveyed into townships, its sections ran to 640 acres each.
    - Where the Northwest was surveyed into square six-mile townships, Southern land was often claimed
      by metes and bounds that followed streams and trees.
    - Each township of the 1785 survey held thirty-six sections of 640 acres.
    - Square townships proved easier to sell at auction in a distant city, which is the reason the
      federal land office preferred them to any system that rested on local landmarks.
    key: B
    faults:
      A:
        move: wrong_goal
        span: Because the Northwest was surveyed into townships
      C:
        move: true_not_asked
        span: held thirty-six sections of 640 acres
      D:
        move: imported
        span: proved easier to sell at auction in a distant city
    ctx: {}
    why: The goal is a contrast, so the sentence has to put the two systems side by side, which only
      one of the four does.
    trap: A explains one system instead of setting the two against each other, which is a different
      goal altogether.
