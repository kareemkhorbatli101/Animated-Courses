    notes:
    - In 1790 the first federal census counted 3.9 million people.
    - Nearly one in five of them was enslaved.
    - The census asked six questions of each household.
    - It took eighteen months to complete.
    goal: state what the first census found about the size of the population
    rule: goal_finding
    rule_span: counted 3.9 million people in the United States
    stem: Which choice most effectively uses relevant information from the notes to state what the
      first census found about the size of the population?
    options:
    - The first federal census asked only six questions of each household.
    - The first federal census counted a large number of people.
    - The first federal census of 1790 counted 3.9 million people in the United States.
    - The first census counted 3.9 million people, a figure most historians now think too low.
    key: C
    faults:
      A:
        move: true_not_asked
        span: asked only six questions of each household
      B:
        move: underreach
        span: counted a large number of people
      D:
        move: imported
        span: a figure most historians now think too low
    ctx: {}
    why: The goal asks what the census found about the size of the population, and only one sentence
      gives the figure the census returned.
    trap: B names no number at all, so it says less than the notes have already said.
