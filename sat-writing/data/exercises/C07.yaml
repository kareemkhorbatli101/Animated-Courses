    domain: HIS
    pos: 5
    level: 2
    difficulty: medium
    strand: HIS-S05
    carrier: The Fifteenth Amendment of 1870 was framed not only to forbid a racial test for the vote
      in any state but also ___.
    rule: parallel_correlative
    rule_span: to give Congress power to enforce the ban
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - giving Congress power to enforce the ban
    - Congress was given power to enforce the ban
    - that Congress should enforce the ban
    - to give Congress power to enforce the ban
    key: D
    faults:
      A:
        move: faulty_parallel
        span: giving Congress power
      B:
        move: unbalanced_correlative
        span: Congress was given power
      C:
        move: unbalanced_correlative
        span: that Congress should enforce
    ctx:
      form: infinitive
    why: The correlative pair not only and but also must join two items of matching form, and the
      first is an infinitive.
    trap: B puts a full clause after but also, which no longer matches the infinitive that follows
      not only.
