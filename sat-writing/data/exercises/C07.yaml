chapter: 7
element: parallel
title: Parallel structure
home: PHY
summary_ar:
  qaida: التوازي في التركيب يعني أن ما اشترك في موضع واحد من الجملة يشترك في صورة واحدة من الصرف.
    فإذا كان أوّل المعطوفات مصدراً بأداة كان الثاني كذلك، وإذا كان اسم فعل كان الثاني مثله. ويلزم
    التوازي كذلك في أدوات الاقتران مثل لا هذا بل ذاك، وفي المقارنة فلا يُقارن شيء إلّا بما هو من جنسه.
  kayf: يعطيك الاختبار متعاطفين ويجعل الفراغ في الثالث، فيكون السؤال عن صورة الثالث لا عن معناه. ويختبر
    كذلك المقارنة الناقصة، وهي أن يُقارن مقدار بشيء ليس مقداراً، فيصحّ الكلام في الظاهر ولا يصحّ في
    الحقيقة.
  fakh: 'الفخّ أن المعنى يصل إلى القارئ على أيّ صورة جاءت، فلا يشعر بالخلل. والعلاج أن تقرأ كلّ معطوف
    وحده مع ما قبل أوّلها، فإن لم يستقم وحده فليس موازياً. وفي المقارنة اسأل: ما الذي يُقارن بما؟'
  sila: 'التوازي من الأبواب التي يستعملها اختبار سات في موضعين: في قواعد الإنجليزية المعيارية، وفي
    أسئلة التأليف البلاغي حيث يكون الخيار الموازي هو الأوضح. فالفائدة فيه مزدوجة.'
parts:
- domain: HIS
  partno: 31
  note_ar: 'جمل التاريخ والنظام المدني تسرد الأفعال سرداً: ناقشوا، وعارضوا، وصاغوا. وهذه القوائم هي
    أكثر موضع يُختبر فيه التوازي، لأن الفراغ يقع في آخر القائمة دائماً.'
  exercises:
  - n: 301
    id: C07-HIS-E01
    chapter: 7
    element: parallel
    domain: HIS
    pos: 1
    level: 1
    difficulty: easy
    strand: HIS-S01
    carrier: The committee spent the spring debating representation, arguing over the slave trade,
      and ___.
    rule: parallel_series
    rule_span: drafting a compromise
    stem: Which choice completes the text so that it conforms to the conventions of Standard English?
    options:
    - to draft a compromise
    - drafted a compromise
    - had drafted a compromise
    - drafting a compromise
    key: D
    faults:
      A:
        move: faulty_parallel
        span: to draft a compromise
      B:
        move: mixed_form
        span: drafted a compromise
      C:
        move: mixed_form
        span: had drafted a compromise
    ctx:
      form: gerund
    why: The series already holds two -ing forms, so the third item takes the same form.
    trap: A is an infinitive, which would be right if the first two items had been infinitives and
      is wrong because they are not.
